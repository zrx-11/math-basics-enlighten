<style>

erId": "ch01", "type": "single", "question": "圆半径为 10，弦心距为 6，则弦长为：", "options": ["8", "12", "16", "20"], "answer": 2, "explain": "半弦 =√(100−36)=8，弦长 16。"}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：", "options": ["相交", "相切", "相离", "无法判断"], "answer": 2, "explain": "d=5>r=3，相离。"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "圆的切线具有的性质是：", "options": ["平行于半径", "垂直于过切点的半径", "过圆心", "与直径重合"], "answer": 1, "explain": "切线垂直于过切点的半径，这是切线的核心性质。"}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：", "options": ["6", "5", "7", "9"], "answer": 0, "explain": "3×8=4×x，得 x=6。"}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "圆内接四边形 ABCD 中，∠A=70°，则 ∠C 为：", "options": ["70°", "110°", "90°", "20°"], "answer": 1, "explain": "对角互补：∠C=180°−70°=110°。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "圆内两弦相交，交点分一弦为 2 和 9，分另一弦为 3 和 x，则 x 为：", "options": ["6", "4.5", "7", "5"], "answer": 0, "explain": "2×9=3×x，得 x=6。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "下列关于圆的切线的说法正确的是：", "options": ["切线一定过圆心", "切线垂直于过切点的半径", "切线与圆有两个公共点", "切线长都相等"], "answer": 1, "explain": "切线垂直于过切点的半径；切线只有一个公共点，切线长只在同一外点的两条切线间相等。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：圆的基本性质」的一句话核心是什么？", "back": "同弧所对的圆周角相等，且等于圆心角的一半；直径所对的圆周角是直角。", "tags": ["circle", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：直线与圆的位置关系」的一句话核心是什么？", "back": "位置关系只看一个数：圆心到直线的距离 d 与半径 r 比大小。", "tags": ["circle", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：比例线段与圆内接四边形」的一句话核心是什么？", "back": "圆里的比例关系全部来自相似三角形：把圆上的点连起来，就能找到成比例的边。", "tags": ["circle", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「弦」？", "back": "圆上两点间的线段。", "tags": ["circle", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「弧」？", "back": "圆上两点之间的部分。", "tags": ["circle", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「圆心角」？", "back": "顶点在圆心的角。", "tags": ["circle", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「圆周角」？", "back": "顶点在圆上、两边与圆相交的角。", "tags": ["circle", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「垂径定理」？", "back": "垂直于弦的直径平分弦及所对的弧。", "tags": ["circle", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「切线」？", "back": "与圆只有一个公共点的直线。", "tags": ["circle", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「切线长」？", "back": "圆外一点到切点的线段长度。", "tags": ["circle", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「相交弦定理」？", "back": "圆内两弦相交，交点分成的两段乘积相等。", "tags": ["circle", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「切割线定理」？", "back": "PT²=PA·PB。", "tags": ["circle", "术语"]}, {"id": "f13", "chapterId": "ch03", "front": "什么是「弦切角」？", "back": "切线与弦的夹角，等于所夹弧对的圆周角。", "tags": ["circle", "术语"]}], "companion": "circle学习伴侣.html", "deriv": "circle从零推导.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：圆的基本性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：垂径、圆周角\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用垂径定理求弦长\n<\/li><li>\n用圆心角与圆周角关系求角\n<\/li><li>\n识别直径所对的直角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同弧所对的圆周角相等，且等于圆心角的一半；直径所对的圆周角是直角。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 圆的基本元素<\/h3>\n<p>圆心 O、半径 r、弦（圆上两点连线）、弧（圆上两点间的部分）、圆心角（顶点在圆心的角）。<\/p>\n<h3>1.2 垂径定理<\/h3>\n<p>垂直于弦的直径平分这条弦，也平分弦所对的两条弧。<\/p>\n<p>推论：弦心距、半弦、半径构成直角三角形，满足 r²=d²+(半弦)²。这是求弦长最常用的关系。<\/p>\n<h3>1.3 圆心角与圆周角<\/h3>\n<p>顶点在圆心的角叫圆心角，顶点在圆上、两边与圆相交的角叫圆周角。<\/p>\n<p><strong>同弧所对的圆周角等于圆心角的一半<\/strong>；同弧所对的圆周角彼此相等。<\/p>\n<h3>1.4 直径所对的角<\/h3>\n<p>半圆（或直径）所对的圆周角是 90°；反过来，90° 的圆周角所对的弦是直径。这条结论在判定直角三角形时极常用。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：圆心角像站在圆心看风景的张角，圆周角像退到圆周上看同一段风景，视野只有一半。<\/p>\n<p><strong>失效边界<\/strong>：这些关系只对“同一段弧”成立；弧不同，角就不能直接比较。<\/p>\n<p><strong>实例<\/strong>：圆半径 5，弦心距 3，则半弦长 √(25−9)=4，弦长 8。 若某圆周角为 35°，则同弧所对的圆心角为 70°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 圆周角等于圆心角 —— 实际上 同弧时圆周角是圆心角的一半，不是相等。\n<\/li><li>\n别以为 任意弦都能用垂径定理 —— 实际上 垂径定理要求直径（或过圆心的直线）垂直于弦；普通弦没有这个性质。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n同弧所对的圆心角为 80°，则圆周角为：\n<\/li><li>\n圆半径为 10，弦心距为 6，则弦长为：\n<p>A. 80° ｜ B. 40° ｜ C. 160° ｜ D. 20° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：同弧圆周角是圆心角的一半。 A. 8 ｜ B. 12 ｜ C. 16 ｜ D. 20 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：半弦 =√(100−36)=8，弦长 16。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n同弧圆周角＝圆心角的一半\n<\/li><li>\n垂径定理：r²=d²+(半弦)²\n<\/li><li>\n直径所对圆周角 90°\n<\/ul>", "kind": "chapter", "title": "第 1 章：圆的基本性质"}, "ch02": {"html": "<h1>第 2 章：直线与圆的位置关系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用圆心距判断相交、相切、相离\n<\/li><li>\n作切线并证明切线垂直于半径\n<\/li><li>\n使用切线长相等\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>位置关系只看一个数：圆心到直线的距离 d 与半径 r 比大小。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 三种位置关系<\/h3>\n<p>设圆心到直线的距离为 d：<\/p>\n<ul><li>\nd&lt;r：相交，两个公共点（割线）；\n<\/li><li>\nd=r：相切，一个公共点（切线）；\n<\/li><li>\nd&gt;r：相离，没有公共点。\n<\/ul>\n<h3>2.2 切线的性质与判定<\/h3>\n<p><strong>性质<\/strong>：圆的切线垂直于过切点的半径。<\/p>\n<p><strong>判定<\/strong>：过半径外端且垂直于这条半径的直线是切线。<\/p>\n<p>证明切线常走的路：连半径、证垂直。<\/p>\n<h3>2.3 切线长定理<\/h3>\n<p>从圆外一点引两条切线，两条切线长相等，且该点与圆心的连线平分两切线的夹角。<\/p>\n<h3>2.4 三角形与圆<\/h3>\n<p>三角形内切圆的圆心是三条角平分线的交点（内心），到三边距离相等；外接圆圆心是三边垂直平分线的交点（外心），到三顶点距离相等。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：切线像贴着圆滚过去的一条直线，只碰一下就离开。<\/p>\n<p><strong>失效边界<\/strong>：切线只与圆有一个公共点，但“只有一个公共点”的直线未必是切线（在曲线情形下要小心）。<\/p>\n<p><strong>实例<\/strong>：圆半径 4，圆心到直线距离 4，则直线与圆相切。 从圆外一点 P 引两条切线，切点为 A、B，若 PA=6，则 PB=6，且 OP 平分 ∠APB。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 直线与圆有一个公共点就是切线 —— 实际上 对圆成立，对一般曲线不成立；判定切线仍要证垂直。\n<\/li><li>\n别以为 切线与半径只是相交 —— 实际上 切线垂直于半径，是特殊的垂直关系，不是随便相交。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：\n<\/li><li>\n圆的切线具有的性质是：\n<p>A. 相交 ｜ B. 相切 ｜ C. 相离 ｜ D. 无法判断 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：d=5&gt;r=3，相离。 A. 平行于半径 ｜ B. 垂直于过切点的半径 ｜ C. 过圆心 ｜ D. 与直径重合 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：切线垂直于过切点的半径，这是切线的核心性质。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nd&lt;r 相交，d=r 相切，d&gt;r 相离\n<\/li><li>\n切线⊥过切点的半径\n<\/li><li>\n圆外一点的两条切线长相等\n<\/ul>", "kind": "chapter", "title": "第 2 章：直线与圆的位置关系"}, "ch03": {"html": "<h1>第 3 章：比例线段与圆内接四边形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、相似三角形\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用相交弦定理求线段\n<\/li><li>\n用切割线定理求切线长\n<\/li><li>\n使用圆内接四边形对角互补\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>圆里的比例关系全部来自相似三角形：把圆上的点连起来，就能找到成比例的边。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 相交弦定理<\/h3>\n<p>两条弦 AB、CD 交于圆内一点 P，则<\/p>\n<p>PA·PB=PC·PD<\/p>\n<p>证明：连接 AC、BD，由同弧所对圆周角相等得两组角相等，△PAC∽△PDB，对应边成比例。<\/p>\n<h3>3.2 切割线定理<\/h3>\n<p>从圆外一点 P 引切线 PT 与割线 PAB，则<\/p>\n<p>PT²=PA·PB<\/p>\n<p>这是相交弦定理的“外点版本”，同样由相似三角形推出。<\/p>\n<h3>3.3 圆内接四边形<\/h3>\n<p>四个顶点都在圆上的四边形叫圆内接四边形，它的对角互补：∠A+∠C=180°，∠B+∠D=180°。<\/p>\n<p>反过来，对角互补的四边形四点共圆，这是判定共圆的常用方法。<\/p>\n<h3>3.4 弦切角<\/h3>\n<p>切线与弦的夹角叫弦切角，它等于所夹弧对的圆周角。这条结论把切线与圆周角连了起来，是许多证明题的桥梁。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：圆像一个“比例转换器”：不论弦怎么放，交点到两端的两段乘积总是定值。<\/p>\n<p><strong>失效边界<\/strong>：定理要求点在圆内（相交弦）或圆外（切割线），位置不同用不同公式，不能混。<\/p>\n<p><strong>实例<\/strong>：弦 AB 与 CD 交于 P，PA=2、PB=6、PC=3，则 PD=PA·PB/PC=12/3=4。 圆外点 P 到圆的切线 PT=6，割线交圆于 A、B 且 PA=4，则 PB=36/4=9。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 相交弦定理可以直接相加 —— 实际上 定理给的是乘积相等，不是长度相加；混淆会算出错误答案。\n<\/li><li>\n别以为 圆内接四边形对角相等 —— 实际上 是对角互补（和为 180°），不是相等。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：\n<\/li><li>\n圆内接四边形 ABCD 中，∠A=70°，则 ∠C 为：\n<p>A. 6 ｜ B. 5 ｜ C. 7 ｜ D. 9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：3×8=4×x，得 x=6。 A. 70° ｜ B. 110° ｜ C. 90° ｜ D. 20° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：对角互补：∠C=180°−70°=110°。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相交弦：PA·PB=PC·PD\n<\/li><li>\n切割线：PT²=PA·PB\n<\/li><li>\n圆内接四边形对角互补\n<\/ul>", "kind": "chapter", "title": "第 3 章：比例线段与圆内接四边形"}, "c01": {"html": "<h1>同弧所对的角<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>同一段弧上，圆心角是圆周角的两倍，所有圆周角彼此相等。<\/p>\n<h2>为什么重要<\/h2>\n<p>圆里几乎所有求角问题都归结到这一条，是圆的角度体系的总开关。<\/p>\n<h2>详解<\/h2>\n<p>圆心角以圆心为顶点，圆周角以圆上一点为顶点，只要对着同一段弧，就满足“圆周角＝圆心角的一半”。由此推出直径所对圆周角为直角、弦切角等于所夹弧的圆周角。<\/p>\n<h2>常见误解<\/h2>\n<p>把对着不同弧的两个圆周角也当成相等，直接套结论。<\/p>\n<h2>相关概念<\/h2>\n<p>圆周角（ch01）、弦切角（ch03）<\/p>", "kind": "concept", "title": "同弧所对的角"}, "c02": {"html": "<h1>圆幂<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>过一点作圆的割线或切线，交点到定点的两段长度之积是定值。<\/p>\n<h2>为什么重要<\/h2>\n<p>相交弦定理与切割线定理是同一个“圆幂”的两种情形，统一记忆更省力。<\/p>\n<h2>详解<\/h2>\n<p>点在圆内：PA·PB=PC·PD（两弦）；点在圆外：PT²=PA·PB（切线与割线）；点在圆上：乘积为 0。三种情形可以统一写成“点到圆的幂”。<\/p>\n<h2>常见误解<\/h2>\n<p>把圆内与圆外的公式混用，或把乘积写成和。<\/p>\n<h2>相关概念<\/h2>\n<p>相交弦定理（ch03）、切割线定理（ch03）<\/p>", "kind": "concept", "title": "圆幂"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：圆的基本性质<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：圆的基本性质<\/a><br>检查点：能由圆周角推出圆心角<\/li><li class='path-step' id='path-02'><strong>步骤 02：直线与圆的位置关系<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：直线与圆的位置关系<\/a><br>检查点：能用 d 与 r 判断位置关系并作切线<\/li><li class='path-step' id='path-03'><strong>步骤 03：比例线段与圆内接四边形<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：比例线段与圆内接四边形<\/a><br>检查点：能用相交弦定理求线段长<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 圆内两弦相交，交点分一弦为 2 和 9，分另一弦为 3 和 x，则 x 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 4.5<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 7<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 下列关于圆的切线的说法正确的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 切线一定过圆心<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 切线垂直于过切点的半径<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 切线与圆有两个公共点<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 切线长都相等<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：圆的基本性质<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 同弧所对的圆心角为 80°，则圆周角为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 80°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 40°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 160°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 20°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 圆半径为 10，弦心距为 6，则弦长为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 8<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 12<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 16<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：直线与圆的位置关系<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 相交<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 相切<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 相离<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 圆的切线具有的性质是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 平行于半径<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 垂直于过切点的半径<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 过圆心<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 与直径重合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：比例线段与圆内接四边形<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 5<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 7<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 圆内接四边形 ABCD 中，∠A=70°，则 ∠C 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 70°<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 110°<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 90°<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 20°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='弦'>弦 — 圆上两点间的线段。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='弧'>弧 — 圆上两点之间的部分。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='圆心角'>圆心角 — 顶点在圆心的角。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='圆周角'>圆周角 — 顶点在圆上、两边与圆相交的角。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='垂径定理'>垂径定理 — 垂直于弦的直径平分弦及所对的弧。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='切线'>切线 — 与圆只有一个公共点的直线。 <span class=glossary-ref>（第 2 章：直线与圆的位置关系）<\/span><\/li><li data-term='切线长'>切线长 — 圆外一点到切点的线段长度。 <span class=glossary-ref>（第 2 章：直线与圆的位置关系）<\/span><\/li><li data-term='相交弦定理'>相交弦定理 — 圆内两弦相交，交点分成的两段乘积相等。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><li data-term='切割线定理'>切割线定理 — PT²=PA·PB。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><li data-term='弦切角'>弦切角 — 切线与弦的夹角，等于所夹弧对的圆周角。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：圆中求角三步<\/h2>\n<p>① 找同弧；② 判断是圆心角还是圆周角；③ 用倍数或相等关系换算。<\/p>\n<h2>框架：圆中求线段三步<\/h2>\n<p>① 判断点在圆内还是圆外；② 选相交弦或切割线公式；③ 列乘积相等求解。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>圆周角<\/td><td>同弧圆周角＝圆心角的一半<\/td><\/tr><tr><td>直径<\/td><td>直径所对圆周角 90°<\/td><\/tr><tr><td>垂径<\/td><td>r²=d²+(半弦)²<\/td><\/tr><tr><td>位置关系<\/td><td>d&lt;r 相交，d=r 相切，d&gt;r 相离<\/td><\/tr><tr><td>相交弦<\/td><td>PA·PB=PC·PD<\/td><\/tr><tr><td>切割线<\/td><td>PT²=PA·PB<\/td><\/tr><tr><td>圆内接四边形<\/td><td>对角互补<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/12-圆", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：圆的基本性质", "href": "#/chapter/ch01"}, {"label": "第 2 章：直线与圆的位置关系", "href": "#/chapter/ch02"}, {"label": "第 3 章：比例线段与圆内接四边形", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "同弧所对的角", "href": "#/concept/c01"}, {"label": "圆幂", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：圆的基本性质", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：直线与圆的位置关系", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：比例线段与圆内接四边形", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：圆的基本性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：垂径、圆周角\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用垂径定理求弦长\n<\/li><li>\n用圆心角与圆周角关系求角\n<\/li><li>\n识别直径所对的直角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同弧所对的圆周角相等，且等于圆心角的一半；直径所对的圆周角是直角。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 圆的基本元素<\/h3>\n<p>圆心 O、半径 r、弦（圆上两点连线）、弧（圆上两点间的部分）、圆心角（顶点在圆心的角）。<\/p>\n<h3>1.2 垂径定理<\/h3>\n<p>垂直于弦的直径平分这条弦，也平分弦所对的两条弧。<\/p>\n<p>推论：弦心距、半弦、半径构成直角三角形，满足 r²=d²+(半弦)²。这是求弦长最常用的关系。<\/p>\n<h3>1.3 圆心角与圆周角<\/h3>\n<p>顶点在圆心的角叫圆心角，顶点在圆上、两边与圆相交的角叫圆周角。<\/p>\n<p><strong>同弧所对的圆周角等于圆心角的一半<\/strong>；同弧所对的圆周角彼此相等。<\/p>\n<h3>1.4 直径所对的角<\/h3>\n<p>半圆（或直径）所对的圆周角是 90°；反过来，90° 的圆周角所对的弦是直径。这条结论在判定直角三角形时极常用。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：圆心角像站在圆心看风景的张角，圆周角像退到圆周上看同一段风景，视野只有一半。<\/p>\n<p><strong>失效边界<\/strong>：这些关系只对“同一段弧”成立；弧不同，角就不能直接比较。<\/p>\n<p><strong>实例<\/strong>：圆半径 5，弦心距 3，则半弦长 √(25−9)=4，弦长 8。 若某圆周角为 35°，则同弧所对的圆心角为 70°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 圆周角等于圆心角 —— 实际上 同弧时圆周角是圆心角的一半，不是相等。\n<\/li><li>\n别以为 任意弦都能用垂径定理 —— 实际上 垂径定理要求直径（或过圆心的直线）垂直于弦；普通弦没有这个性质。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n同弧所对的圆心角为 80°，则圆周角为：\n<\/li><li>\n圆半径为 10，弦心距为 6，则弦长为：\n<p>A. 80° ｜ B. 40° ｜ C. 160° ｜ D. 20° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：同弧圆周角是圆心角的一半。 A. 8 ｜ B. 12 ｜ C. 16 ｜ D. 20 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：半弦 =√(100−36)=8，弦长 16。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n同弧圆周角＝圆心角的一半\n<\/li><li>\n垂径定理：r²=d²+(半弦)²\n<\/li><li>\n直径所对圆周角 90°\n<\/ul>", "ch02": "<h1>第 2 章：直线与圆的位置关系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用圆心距判断相交、相切、相离\n<\/li><li>\n作切线并证明切线垂直于半径\n<\/li><li>\n使用切线长相等\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>位置关系只看一个数：圆心到直线的距离 d 与半径 r 比大小。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 三种位置关系<\/h3>\n<p>设圆心到直线的距离为 d：<\/p>\n<ul><li>\nd&lt;r：相交，两个公共点（割线）；\n<\/li><li>\nd=r：相切，一个公共点（切线）；\n<\/li><li>\nd&gt;r：相离，没有公共点。\n<\/ul>\n<h3>2.2 切线的性质与判定<\/h3>\n<p><strong>性质<\/strong>：圆的切线垂直于过切点的半径。<\/p>\n<p><strong>判定<\/strong>：过半径外端且垂直于这条半径的直线是切线。<\/p>\n<p>证明切线常走的路：连半径、证垂直。<\/p>\n<h3>2.3 切线长定理<\/h3>\n<p>从圆外一点引两条切线，两条切线长相等，且该点与圆心的连线平分两切线的夹角。<\/p>\n<h3>2.4 三角形与圆<\/h3>\n<p>三角形内切圆的圆心是三条角平分线的交点（内心），到三边距离相等；外接圆圆心是三边垂直平分线的交点（外心），到三顶点距离相等。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：切线像贴着圆滚过去的一条直线，只碰一下就离开。<\/p>\n<p><strong>失效边界<\/strong>：切线只与圆有一个公共点，但“只有一个公共点”的直线未必是切线（在曲线情形下要小心）。<\/p>\n<p><strong>实例<\/strong>：圆半径 4，圆心到直线距离 4，则直线与圆相切。 从圆外一点 P 引两条切线，切点为 A、B，若 PA=6，则 PB=6，且 OP 平分 ∠APB。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 直线与圆有一个公共点就是切线 —— 实际上 对圆成立，对一般曲线不成立；判定切线仍要证垂直。\n<\/li><li>\n别以为 切线与半径只是相交 —— 实际上 切线垂直于半径，是特殊的垂直关系，不是随便相交。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：\n<\/li><li>\n圆的切线具有的性质是：\n<p>A. 相交 ｜ B. 相切 ｜ C. 相离 ｜ D. 无法判断 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：d=5&gt;r=3，相离。 A. 平行于半径 ｜ B. 垂直于过切点的半径 ｜ C. 过圆心 ｜ D. 与直径重合 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：切线垂直于过切点的半径，这是切线的核心性质。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nd&lt;r 相交，d=r 相切，d&gt;r 相离\n<\/li><li>\n切线⊥过切点的半径\n<\/li><li>\n圆外一点的两条切线长相等\n<\/ul>", "ch03": "<h1>第 3 章：比例线段与圆内接四边形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、相似三角形\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用相交弦定理求线段\n<\/li><li>\n用切割线定理求切线长\n<\/li><li>\n使用圆内接四边形对角互补\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>圆里的比例关系全部来自相似三角形：把圆上的点连起来，就能找到成比例的边。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 相交弦定理<\/h3>\n<p>两条弦 AB、CD 交于圆内一点 P，则<\/p>\n<p>PA·PB=PC·PD<\/p>\n<p>证明：连接 AC、BD，由同弧所对圆周角相等得两组角相等，△PAC∽△PDB，对应边成比例。<\/p>\n<h3>3.2 切割线定理<\/h3>\n<p>从圆外一点 P 引切线 PT 与割线 PAB，则<\/p>\n<p>PT²=PA·PB<\/p>\n<p>这是相交弦定理的“外点版本”，同样由相似三角形推出。<\/p>\n<h3>3.3 圆内接四边形<\/h3>\n<p>四个顶点都在圆上的四边形叫圆内接四边形，它的对角互补：∠A+∠C=180°，∠B+∠D=180°。<\/p>\n<p>反过来，对角互补的四边形四点共圆，这是判定共圆的常用方法。<\/p>\n<h3>3.4 弦切角<\/h3>\n<p>切线与弦的夹角叫弦切角，它等于所夹弧对的圆周角。这条结论把切线与圆周角连了起来，是许多证明题的桥梁。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：圆像一个“比例转换器”：不论弦怎么放，交点到两端的两段乘积总是定值。<\/p>\n<p><strong>失效边界<\/strong>：定理要求点在圆内（相交弦）或圆外（切割线），位置不同用不同公式，不能混。<\/p>\n<p><strong>实例<\/strong>：弦 AB 与 CD 交于 P，PA=2、PB=6、PC=3，则 PD=PA·PB/PC=12/3=4。 圆外点 P 到圆的切线 PT=6，割线交圆于 A、B 且 PA=4，则 PB=36/4=9。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 相交弦定理可以直接相加 —— 实际上 定理给的是乘积相等，不是长度相加；混淆会算出错误答案。\n<\/li><li>\n别以为 圆内接四边形对角相等 —— 实际上 是对角互补（和为 180°），不是相等。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：\n<\/li><li>\n圆内接四边形 ABCD 中，∠A=70°，则 ∠C 为：\n<p>A. 6 ｜ B. 5 ｜ C. 7 ｜ D. 9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：3×8=4×x，得 x=6。 A. 70° ｜ B. 110° ｜ C. 90° ｜ D. 20° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：对角互补：∠C=180°−70°=110°。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相交弦：PA·PB=PC·PD\n<\/li><li>\n切割线：PT²=PA·PB\n<\/li><li>\n圆内接四边形对角互补\n<\/ul>", "c01": "<h1>同弧所对的角<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>同一段弧上，圆心角是圆周角的两倍，所有圆周角彼此相等。<\/p>\n<h2>为什么重要<\/h2>\n<p>圆里几乎所有求角问题都归结到这一条，是圆的角度体系的总开关。<\/p>\n<h2>详解<\/h2>\n<p>圆心角以圆心为顶点，圆周角以圆上一点为顶点，只要对着同一段弧，就满足“圆周角＝圆心角的一半”。由此推出直径所对圆周角为直角、弦切角等于所夹弧的圆周角。<\/p>\n<h2>常见误解<\/h2>\n<p>把对着不同弧的两个圆周角也当成相等，直接套结论。<\/p>\n<h2>相关概念<\/h2>\n<p>圆周角（ch01）、弦切角（ch03）<\/p>", "c02": "<h1>圆幂<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>过一点作圆的割线或切线，交点到定点的两段长度之积是定值。<\/p>\n<h2>为什么重要<\/h2>\n<p>相交弦定理与切割线定理是同一个“圆幂”的两种情形，统一记忆更省力。<\/p>\n<h2>详解<\/h2>\n<p>点在圆内：PA·PB=PC·PD（两弦）；点在圆外：PT²=PA·PB（切线与割线）；点在圆上：乘积为 0。三种情形可以统一写成“点到圆的幂”。<\/p>\n<h2>常见误解<\/h2>\n<p>把圆内与圆外的公式混用，或把乘积写成和。<\/p>\n<h2>相关概念<\/h2>\n<p>相交弦定理（ch03）、切割线定理（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：圆的基本性质<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：圆的基本性质<\/a><br>检查点：能由圆周角推出圆心角<\/li><li class='path-step' id='path-02'><strong>步骤 02：直线与圆的位置关系<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：直线与圆的位置关系<\/a><br>检查点：能用 d 与 r 判断位置关系并作切线<\/li><li class='path-step' id='path-03'><strong>步骤 03：比例线段与圆内接四边形<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：比例线段与圆内接四边形<\/a><br>检查点：能用相交弦定理求线段长<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 圆内两弦相交，交点分一弦为 2 和 9，分另一弦为 3 和 x，则 x 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 4.5<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 7<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 下列关于圆的切线的说法正确的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 切线一定过圆心<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 切线垂直于过切点的半径<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 切线与圆有两个公共点<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 切线长都相等<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：圆的基本性质<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 同弧所对的圆心角为 80°，则圆周角为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 80°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 40°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 160°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 20°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 圆半径为 10，弦心距为 6，则弦长为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 8<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 12<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 16<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：直线与圆的位置关系<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 相交<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 相切<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 相离<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 圆的切线具有的性质是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 平行于半径<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 垂直于过切点的半径<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 过圆心<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 与直径重合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：比例线段与圆内接四边形<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 5<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 7<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 圆内接四边形 ABCD 中，∠A=70°，则 ∠C 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 70°<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 110°<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 90°<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 20°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='弦'>弦 — 圆上两点间的线段。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='弧'>弧 — 圆上两点之间的部分。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='圆心角'>圆心角 — 顶点在圆心的角。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='圆周角'>圆周角 — 顶点在圆上、两边与圆相交的角。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='垂径定理'>垂径定理 — 垂直于弦的直径平分弦及所对的弧。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='切线'>切线 — 与圆只有一个公共点的直线。 <span class=glossary-ref>（第 2 章：直线与圆的位置关系）<\/span><\/li><li data-term='切线长'>切线长 — 圆外一点到切点的线段长度。 <span class=glossary-ref>（第 2 章：直线与圆的位置关系）<\/span><\/li><li data-term='相交弦定理'>相交弦定理 — 圆内两弦相交，交点分成的两段乘积相等。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><li data-term='切割线定理'>切割线定理 — PT²=PA·PB。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><li data-term='弦切角'>弦切角 — 切线与弦的夹角，等于所夹弧对的圆周角。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：圆中求角三步<\/h2>\n<p>① 找同弧；② 判断是圆心角还是圆周角；③ 用倍数或相等关系换算。<\/p>\n<h2>框架：圆中求线段三步<\/h2>\n<p>① 判断点在圆内还是圆外；② 选相交弦或切割线公式；③ 列乘积相等求解。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>圆周角<\/td><td>同弧圆周角＝圆心角的一半<\/td><\/tr><tr><td>直径<\/td><td>直径所对圆周角 90°<\/td><\/tr><tr><td>垂径<\/td><td>r²=d²+(半弦)²<\/td><\/tr><tr><td>位置关系<\/td><td>d&lt;r 相交，d=r 相切，d&gt;r 相离<\/td><\/tr><tr><td>相交弦<\/td><td>PA·PB=PC·PD<\/td><\/tr><tr><td>切割线<\/td><td>PT²=PA·PB<\/td><\/tr><tr><td>圆内接四边形<\/td><td>对角互补<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
</html>
