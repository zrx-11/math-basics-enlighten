<head>

<title>圆</title>

<link rel="stylesheet" href="https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
sup{font-size:.78em;line-height:0;vertical-align:.42em;font-weight:500}
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
</head>

直于弦的直径平分弦及所对的弧。", "chapterId": "ch01"}, {"term": "切线", "def": "与圆只有一个公共点的直线。", "chapterId": "ch02"}, {"term": "切线长", "def": "圆外一点到切点的线段长度。", "chapterId": "ch02"}, {"term": "相交弦定理", "def": "圆内两弦相交，交点分成的两段乘积相等。", "chapterId": "ch03"}, {"term": "切割线定理", "def": "PT²=PA·PB。", "chapterId": "ch03"}, {"term": "弦切角", "def": "切线与弦的夹角，等于所夹弧对的圆周角。", "chapterId": "ch03"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "同弧所对的圆心角为 80°，则圆周角为：", "options": ["80°", "40°", "160°", "20°"], "answer": 1, "explain": "同弧圆周角是圆心角的一半。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "圆半径为 10，弦心距为 6，则弦长为：", "options": ["8", "12", "16", "20"], "answer": 2, "explain": "半弦 =√(100−36)=8，弦长 16。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：", "options": ["相交", "相切", "相离", "无法判断"], "answer": 2, "explain": "d=5>r=3，相离。", "relatedConceptId": "", "prerequisites": ["ch02"]}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "圆的切线具有的性质是：", "options": ["平行于半径", "垂直于过切点的半径", "过圆心", "与直径重合"], "answer": 1, "explain": "切线垂直于过切点的半径，这是切线的核心性质。", "relatedConceptId": "", "prerequisites": ["ch02"]}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：", "options": ["6", "5", "7", "9"], "answer": 0, "explain": "3×8=4×x，得 x=6。", "relatedConceptId": "c01", "prerequisites": ["ch03"]}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "圆内接四边形 ABCD 中，∠A=70°，则 ∠C 为：", "options": ["70°", "110°", "90°", "20°"], "answer": 1, "explain": "对角互补：∠C=180°−70°=110°。", "relatedConceptId": "c01", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "圆内两弦相交，交点分一弦为 2 和 9，分另一弦为 3 和 x，则 x 为：", "options": ["6", "4.5", "7", "5"], "answer": 0, "explain": "2×9=3×x，得 x=6。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "下列关于圆的切线的说法正确的是：", "options": ["切线一定过圆心", "切线垂直于过切点的半径", "切线与圆有两个公共点", "切线长都相等"], "answer": 1, "explain": "切线垂直于过切点的半径；切线只有一个公共点，切线长只在同一外点的两条切线间相等。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：圆的基本性质」的一句话核心是什么？", "back": "同弧所对的圆周角相等，且等于圆心角的一半；直径所对的圆周角是直角。", "tags": ["circle", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：直线与圆的位置关系」的一句话核心是什么？", "back": "位置关系只看一个数：圆心到直线的距离 d 与半径 r 比大小。", "tags": ["circle", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：比例线段与圆内接四边形」的一句话核心是什么？", "back": "圆里的比例关系全部来自相似三角形：把圆上的点连起来，就能找到成比例的边。", "tags": ["circle", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「弦」？", "back": "圆上两点间的线段。", "tags": ["circle", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「弧」？", "back": "圆上两点之间的部分。", "tags": ["circle", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「圆心角」？", "back": "顶点在圆心的角。", "tags": ["circle", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「圆周角」？", "back": "顶点在圆上、两边与圆相交的角。", "tags": ["circle", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「垂径定理」？", "back": "垂直于弦的直径平分弦及所对的弧。", "tags": ["circle", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「切线」？", "back": "与圆只有一个公共点的直线。", "tags": ["circle", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「切线长」？", "back": "圆外一点到切点的线段长度。", "tags": ["circle", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「相交弦定理」？", "back": "圆内两弦相交，交点分成的两段乘积相等。", "tags": ["circle", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「切割线定理」？", "back": "PT²=PA·PB。", "tags": ["circle", "术语"]}, {"id": "f13", "chapterId": "ch03", "front": "什么是「弦切角」？", "back": "切线与弦的夹角，等于所夹弧对的圆周角。", "tags": ["circle", "术语"]}], "companion": "circle学习伴侣.html", "deriv": "circle从零推导.html"}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">垂径、圆周角<\/span><\/div><h1>第 1 章：圆的基本性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：垂径、圆周角\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用垂径定理求弦长\n<\/li><li>\n用圆心角与圆周角关系求角\n<\/li><li>\n识别直径所对的直角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同弧所对的圆周角相等，且等于圆心角的一半；直径所对的圆周角是直角。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 圆的基本元素<\/h3>\n<p>圆心 O、半径 r、弦（圆上两点连线）、弧（圆上两点间的部分）、圆心角（顶点在圆心的角）。<\/p>\n<h3>1.2 垂径定理<\/h3>\n<p>垂直于弦的直径平分这条弦，也平分弦所对的两条弧。<\/p>\n<p>推论：弦心距、半弦、半径构成直角三角形，满足 r²=d²+(半弦)²。这是求弦长最常用的关系。<\/p>\n<h3>1.3 圆心角与圆周角<\/h3>\n<p>顶点在圆心的角叫圆心角，顶点在圆上、两边与圆相交的角叫圆周角。<\/p>\n<p><strong>同弧所对的圆周角等于圆心角的一半<\/strong>；同弧所对的圆周角彼此相等。<\/p>\n<h3>1.4 直径所对的角<\/h3>\n<p>半圆（或直径）所对的圆周角是 90°；反过来，90° 的圆周角所对的弦是直径。这条结论在判定直角三角形时极常用。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：圆心角像站在圆心看风景的张角，圆周角像退到圆周上看同一段风景，视野只有一半。<\/p>\n<p><strong>失效边界<\/strong>：这些关系只对“同一段弧”成立；弧不同，角就不能直接比较。<\/p>\n<p><strong>实例<\/strong>：圆半径 5，弦心距 3，则半弦长 √(25−9)=4，弦长 8。 若某圆周角为 35°，则同弧所对的圆心角为 70°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 圆周角等于圆心角 —— 实际上 同弧时圆周角是圆心角的一半，不是相等。\n<\/li><li>\n别以为 任意弦都能用垂径定理 —— 实际上 垂径定理要求直径（或过圆心的直线）垂直于弦；普通弦没有这个性质。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n同弧所对的圆心角为 80°，则圆周角为：\n<\/li><li>\n圆半径为 10，弦心距为 6，则弦长为：\n<p>A. 80° ｜ B. 40° ｜ C. 160° ｜ D. 20° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：同弧圆周角是圆心角的一半。 A. 8 ｜ B. 12 ｜ C. 16 ｜ D. 20 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：半弦 =√(100−36)=8，弦长 16。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n同弧圆周角＝圆心角的一半\n<\/li><li>\n垂径定理：r²=d²+(半弦)²\n<\/li><li>\n直径所对圆周角 90°\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：圆的基本性质）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：圆的基本性质<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>圆的所有角度结论都来自一个事实：圆心角是“张角”，圆周角是它在圆上的“半视角”。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>顶点在圆心、两边为半径的角叫圆心角；顶点在圆上、两边与圆相交的角叫圆周角。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像看电影：坐在正中（圆心）看到的画面宽度，是坐在边上看同一块屏幕的两倍。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 垂径<\/h3>\n<div class=\"katex-block\">r^{2}=d^{2}+\\left(\\frac{AB}{2}\\right)^{2}<\/div>\n<p>半径、弦心距、半弦构成直角三角形，勾股定理。<\/p>\n<h3>2. 圆周角<\/h3>\n<div class=\"katex-block\">\\angle APB=\\frac{1}{2}\\angle AOB<\/div>\n<p>同弧所对的圆周角是圆心角的一半。<\/p>\n<h3>3. 等圆周角<\/h3>\n<div class=\"katex-block\">\\angle APB=\\angle AQB<\/div>\n<p>同弧上任意两点看同一段弧，角都相等。<\/p>\n<h3>4. 直径<\/h3>\n<div class=\"katex-block\">AB\\ \\text{为直径}\\ \\Rightarrow\\ \\angle APB=90^{\\circ}<\/div>\n<p>半圆所对的圆周角是直角，反之亦然。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>圆周角定理要求两角对着同一段弧；对着互补的弧时结论要改。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《圆》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 1 章：圆的基本性质"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：圆的基本性质<\/a><\/span><\/div><h1>第 2 章：直线与圆的位置关系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用圆心距判断相交、相切、相离\n<\/li><li>\n作切线并证明切线垂直于半径\n<\/li><li>\n使用切线长相等\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>位置关系只看一个数：圆心到直线的距离 d 与半径 r 比大小。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 三种位置关系<\/h3>\n<p>设圆心到直线的距离为 d：<\/p>\n<ul><li>\nd&lt;r：相交，两个公共点（割线）；\n<\/li><li>\nd=r：相切，一个公共点（切线）；\n<\/li><li>\nd&gt;r：相离，没有公共点。\n<\/ul>\n<h3>2.2 切线的性质与判定<\/h3>\n<p><strong>性质<\/strong>：圆的切线垂直于过切点的半径。<\/p>\n<p><strong>判定<\/strong>：过半径外端且垂直于这条半径的直线是切线。<\/p>\n<p>证明切线常走的路：连半径、证垂直。<\/p>\n<h3>2.3 切线长定理<\/h3>\n<p>从圆外一点引两条切线，两条切线长相等，且该点与圆心的连线平分两切线的夹角。<\/p>\n<h3>2.4 三角形与圆<\/h3>\n<p>三角形内切圆的圆心是三条角平分线的交点（内心），到三边距离相等；外接圆圆心是三边垂直平分线的交点（外心），到三顶点距离相等。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：切线像贴着圆滚过去的一条直线，只碰一下就离开。<\/p>\n<p><strong>失效边界<\/strong>：切线只与圆有一个公共点，但“只有一个公共点”的直线未必是切线（在曲线情形下要小心）。<\/p>\n<p><strong>实例<\/strong>：圆半径 4，圆心到直线距离 4，则直线与圆相切。 从圆外一点 P 引两条切线，切点为 A、B，若 PA=6，则 PB=6，且 OP 平分 ∠APB。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 直线与圆有一个公共点就是切线 —— 实际上 对圆成立，对一般曲线不成立；判定切线仍要证垂直。\n<\/li><li>\n别以为 切线与半径只是相交 —— 实际上 切线垂直于半径，是特殊的垂直关系，不是随便相交。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：\n<\/li><li>\n圆的切线具有的性质是：\n<p>A. 相交 ｜ B. 相切 ｜ C. 相离 ｜ D. 无法判断 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：d=5&gt;r=3，相离。 A. 平行于半径 ｜ B. 垂直于过切点的半径 ｜ C. 过圆心 ｜ D. 与直径重合 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：切线垂直于过切点的半径，这是切线的核心性质。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nd&lt;r 相交，d=r 相切，d&gt;r 相离\n<\/li><li>\n切线⊥过切点的半径\n<\/li><li>\n圆外一点的两条切线长相等\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：直线与圆的位置关系）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：直线与圆的位置关系<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>圆与直线的位置关系不需要复杂计算，只要比较“圆心到直线的距离”与半径。切线的一切性质都从“垂直”出发。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>与圆只有一个公共点的直线叫圆的切线，公共点叫切点。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像车轮贴着地面：地面就是切线，轮轴到地面的距离正好是轮半径。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 位置判定<\/h3>\n<div class=\"katex-block\">d&lt;r\\ \\text{相交};\\quad d=r\\ \\text{相切};\\quad d>r\\ \\text{相离}<\/div>\n<p>一个不等式决定三种情形。<\/p>\n<h3>2. 切线性质<\/h3>\n<div class=\"katex-block\">OT\\perp l\\quad(T\\ \\text{为切点})<\/div>\n<p>切点到圆心的半径与切线垂直。<\/p>\n<h3>3. 切线长<\/h3>\n<div class=\"katex-block\">PA=PB<\/div>\n<p>圆外一点引两条切线，长度相等。<\/p>\n<h3>4. 勾股关系<\/h3>\n<div class=\"katex-block\">OP^{2}=OT^{2}+PT^{2}<\/div>\n<p>半径、切线、圆心到外点的连线构成直角三角形。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>判定切线必须证明垂直；仅凭“看起来只碰一下”不算证明。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《圆》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 2 章：直线与圆的位置关系"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：直线与圆的位置关系<\/a><\/span><\/div><h1>第 3 章：比例线段与圆内接四边形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、相似三角形\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用相交弦定理求线段\n<\/li><li>\n用切割线定理求切线长\n<\/li><li>\n使用圆内接四边形对角互补\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>圆里的比例关系全部来自相似三角形：把圆上的点连起来，就能找到成比例的边。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 相交弦定理<\/h3>\n<p>两条弦 AB、CD 交于圆内一点 P，则<\/p>\n<p>PA·PB=PC·PD<\/p>\n<p>证明：连接 AC、BD，由同弧所对圆周角相等得两组角相等，△PAC∽△PDB，对应边成比例。<\/p>\n<h3>3.2 切割线定理<\/h3>\n<p>从圆外一点 P 引切线 PT 与割线 PAB，则<\/p>\n<p>PT²=PA·PB<\/p>\n<p>这是相交弦定理的“外点版本”，同样由相似三角形推出。<\/p>\n<h3>3.3 圆内接四边形<\/h3>\n<p>四个顶点都在圆上的四边形叫圆内接四边形，它的对角互补：∠A+∠C=180°，∠B+∠D=180°。<\/p>\n<p>反过来，对角互补的四边形四点共圆，这是判定共圆的常用方法。<\/p>\n<h3>3.4 弦切角<\/h3>\n<p>切线与弦的夹角叫弦切角，它等于所夹弧对的圆周角。这条结论把切线与圆周角连了起来，是许多证明题的桥梁。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：圆像一个“比例转换器”：不论弦怎么放，交点到两端的两段乘积总是定值。<\/p>\n<p><strong>失效边界<\/strong>：定理要求点在圆内（相交弦）或圆外（切割线），位置不同用不同公式，不能混。<\/p>\n<p><strong>实例<\/strong>：弦 AB 与 CD 交于 P，PA=2、PB=6、PC=3，则 PD=PA·PB/PC=12/3=4。 圆外点 P 到圆的切线 PT=6，割线交圆于 A、B 且 PA=4，则 PB=36/4=9。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 相交弦定理可以直接相加 —— 实际上 定理给的是乘积相等，不是长度相加；混淆会算出错误答案。\n<\/li><li>\n别以为 圆内接四边形对角相等 —— 实际上 是对角互补（和为 180°），不是相等。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：\n<\/li><li>\n圆内接四边形 ABCD 中，∠A=70°，则 ∠C 为：\n<p>A. 6 ｜ B. 5 ｜ C. 7 ｜ D. 9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：3×8=4×x，得 x=6。 A. 70° ｜ B. 110° ｜ C. 90° ｜ D. 20° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：对角互补：∠C=180°−70°=110°。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相交弦：PA·PB=PC·PD\n<\/li><li>\n切割线：PT²=PA·PB\n<\/li><li>\n圆内接四边形对角互补\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：比例线段与圆内接四边形）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：比例线段与圆内接四边形<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>圆里的比例定理不是新公式，而是“连两条辅助线就出现相似三角形”的副产品。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>相交弦定理指圆内两弦相交时，交点分成的两段乘积相等。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像两个人从不同方向穿过同一扇门，门两侧的距离乘积总相等。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 相似来源<\/h3>\n<div class=\"katex-block\">\\angle CAB=\\angle CDB\\ \\Rightarrow\\ \\triangle PAC\\sim\\triangle PDB<\/div>\n<p>同弧所对圆周角相等，给出两组等角。<\/p>\n<h3>2. 相交弦<\/h3>\n<div class=\"katex-block\">PA\\cdot PB=PC\\cdot PD<\/div>\n<p>由相似比 PA/PD=PC/PB 交叉相乘得到。<\/p>\n<h3>3. 切割线<\/h3>\n<div class=\"katex-block\">PT^{2}=PA\\cdot PB<\/div>\n<p>外点版本的相似关系，切线长是比例中项。<\/p>\n<h3>4. 对角互补<\/h3>\n<div class=\"katex-block\">\\angle A+\\angle C=180^{\\circ}<\/div>\n<p>圆内接四边形两组对角分别互补。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>定理对圆内交点成立；交点在圆外时要用切割线定理。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《圆》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 3 章：比例线段与圆内接四边形"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：圆的基本性质<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：比例线段与圆内接四边形<\/a><\/span><\/div><h1>同弧所对的角<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>同一段弧上，圆心角是圆周角的两倍，所有圆周角彼此相等。<\/p>\n<h2>为什么重要<\/h2>\n<p>圆里几乎所有求角问题都归结到这一条，是圆的角度体系的总开关。<\/p>\n<h2>详解<\/h2>\n<p>圆心角以圆心为顶点，圆周角以圆上一点为顶点，只要对着同一段弧，就满足“圆周角＝圆心角的一半”。由此推出直径所对圆周角为直角、弦切角等于所夹弧的圆周角。<\/p>\n<h2>常见误解<\/h2>\n<p>把对着不同弧的两个圆周角也当成相等，直接套结论。<\/p>\n<h2>相关概念<\/h2>\n<p>圆周角（ch01）、弦切角（ch03）<\/p>", "kind": "concept", "title": "同弧所对的角"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：比例线段与圆内接四边形<\/a><\/span><\/div><h1>圆幂<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>过一点作圆的割线或切线，交点到定点的两段长度之积是定值。<\/p>\n<h2>为什么重要<\/h2>\n<p>相交弦定理与切割线定理是同一个“圆幂”的两种情形，统一记忆更省力。<\/p>\n<h2>详解<\/h2>\n<p>点在圆内：PA·PB=PC·PD（两弦）；点在圆外：PT²=PA·PB（切线与割线）；点在圆上：乘积为 0。三种情形可以统一写成“点到圆的幂”。<\/p>\n<h2>常见误解<\/h2>\n<p>把圆内与圆外的公式混用，或把乘积写成和。<\/p>\n<h2>相关概念<\/h2>\n<p>相交弦定理（ch03）、切割线定理（ch03）<\/p>", "kind": "concept", "title": "圆幂"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：圆的基本性质<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：圆的基本性质<\/a><br>检查点：能由圆周角推出圆心角<\/li><li class='path-step' id='path-02'><strong>步骤 02：直线与圆的位置关系<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：直线与圆的位置关系<\/a><br>检查点：能用 d 与 r 判断位置关系并作切线<\/li><li class='path-step' id='path-03'><strong>步骤 03：比例线段与圆内接四边形<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：比例线段与圆内接四边形<\/a><br>检查点：能用相交弦定理求线段长<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q07' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q7.<\/b> 圆内两弦相交，交点分一弦为 2 和 9，分另一弦为 3 和 x，则 x 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 4.5<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 7<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q8.<\/b> 下列关于圆的切线的说法正确的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 切线一定过圆心<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 切线垂直于过切点的半径<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 切线与圆有两个公共点<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 切线长都相等<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：圆的基本性质<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 同弧所对的圆心角为 80°，则圆周角为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 80°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 40°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 160°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 20°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 圆半径为 10，弦心距为 6，则弦长为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 8<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 12<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 16<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：直线与圆的位置关系<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 相交<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 相切<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 相离<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 圆的切线具有的性质是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 平行于半径<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 垂直于过切点的半径<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 过圆心<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 与直径重合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：比例线段与圆内接四边形<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c01' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 5<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 7<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c01' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 圆内接四边形 ABCD 中，∠A=70°，则 ∠C 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 70°<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 110°<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 90°<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 20°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='弦'>弦 — 圆上两点间的线段。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='弧'>弧 — 圆上两点之间的部分。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='圆心角'>圆心角 — 顶点在圆心的角。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='圆周角'>圆周角 — 顶点在圆上、两边与圆相交的角。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='垂径定理'>垂径定理 — 垂直于弦的直径平分弦及所对的弧。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='切线'>切线 — 与圆只有一个公共点的直线。 <span class=glossary-ref>（第 2 章：直线与圆的位置关系）<\/span><\/li><li data-term='切线长'>切线长 — 圆外一点到切点的线段长度。 <span class=glossary-ref>（第 2 章：直线与圆的位置关系）<\/span><\/li><li data-term='相交弦定理'>相交弦定理 — 圆内两弦相交，交点分成的两段乘积相等。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><li data-term='切割线定理'>切割线定理 — PT²=PA·PB。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><li data-term='弦切角'>弦切角 — 切线与弦的夹角，等于所夹弧对的圆周角。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：圆中求角三步<\/h2>\n<p>① 找同弧；② 判断是圆心角还是圆周角；③ 用倍数或相等关系换算。<\/p>\n<h2>框架：圆中求线段三步<\/h2>\n<p>① 判断点在圆内还是圆外；② 选相交弦或切割线公式；③ 列乘积相等求解。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>圆周角<\/td><td>同弧圆周角＝圆心角的一半<\/td><\/tr><tr><td>直径<\/td><td>直径所对圆周角 90°<\/td><\/tr><tr><td>垂径<\/td><td>r²=d²+(半弦)²<\/td><\/tr><tr><td>位置关系<\/td><td>d&lt;r 相交，d=r 相切，d&gt;r 相离<\/td><\/tr><tr><td>相交弦<\/td><td>PA·PB=PC·PD<\/td><\/tr><tr><td>切割线<\/td><td>PT²=PA·PB<\/td><\/tr><tr><td>圆内接四边形<\/td><td>对角互补<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/12-圆", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：圆的基本性质", "href": "#/chapter/ch01"}, {"label": "第 2 章：直线与圆的位置关系", "href": "#/chapter/ch02"}, {"label": "第 3 章：比例线段与圆内接四边形", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "同弧所对的角", "href": "#/concept/c01"}, {"label": "圆幂", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：圆的基本性质", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：直线与圆的位置关系", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：比例线段与圆内接四边形", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">垂径、圆周角<\/span><\/div><h1>第 1 章：圆的基本性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：垂径、圆周角\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用垂径定理求弦长\n<\/li><li>\n用圆心角与圆周角关系求角\n<\/li><li>\n识别直径所对的直角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同弧所对的圆周角相等，且等于圆心角的一半；直径所对的圆周角是直角。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 圆的基本元素<\/h3>\n<p>圆心 O、半径 r、弦（圆上两点连线）、弧（圆上两点间的部分）、圆心角（顶点在圆心的角）。<\/p>\n<h3>1.2 垂径定理<\/h3>\n<p>垂直于弦的直径平分这条弦，也平分弦所对的两条弧。<\/p>\n<p>推论：弦心距、半弦、半径构成直角三角形，满足 r²=d²+(半弦)²。这是求弦长最常用的关系。<\/p>\n<h3>1.3 圆心角与圆周角<\/h3>\n<p>顶点在圆心的角叫圆心角，顶点在圆上、两边与圆相交的角叫圆周角。<\/p>\n<p><strong>同弧所对的圆周角等于圆心角的一半<\/strong>；同弧所对的圆周角彼此相等。<\/p>\n<h3>1.4 直径所对的角<\/h3>\n<p>半圆（或直径）所对的圆周角是 90°；反过来，90° 的圆周角所对的弦是直径。这条结论在判定直角三角形时极常用。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：圆心角像站在圆心看风景的张角，圆周角像退到圆周上看同一段风景，视野只有一半。<\/p>\n<p><strong>失效边界<\/strong>：这些关系只对“同一段弧”成立；弧不同，角就不能直接比较。<\/p>\n<p><strong>实例<\/strong>：圆半径 5，弦心距 3，则半弦长 √(25−9)=4，弦长 8。 若某圆周角为 35°，则同弧所对的圆心角为 70°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 圆周角等于圆心角 —— 实际上 同弧时圆周角是圆心角的一半，不是相等。\n<\/li><li>\n别以为 任意弦都能用垂径定理 —— 实际上 垂径定理要求直径（或过圆心的直线）垂直于弦；普通弦没有这个性质。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n同弧所对的圆心角为 80°，则圆周角为：\n<\/li><li>\n圆半径为 10，弦心距为 6，则弦长为：\n<p>A. 80° ｜ B. 40° ｜ C. 160° ｜ D. 20° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：同弧圆周角是圆心角的一半。 A. 8 ｜ B. 12 ｜ C. 16 ｜ D. 20 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：半弦 =√(100−36)=8，弦长 16。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n同弧圆周角＝圆心角的一半\n<\/li><li>\n垂径定理：r²=d²+(半弦)²\n<\/li><li>\n直径所对圆周角 90°\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：圆的基本性质）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：圆的基本性质<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>圆的所有角度结论都来自一个事实：圆心角是“张角”，圆周角是它在圆上的“半视角”。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>顶点在圆心、两边为半径的角叫圆心角；顶点在圆上、两边与圆相交的角叫圆周角。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像看电影：坐在正中（圆心）看到的画面宽度，是坐在边上看同一块屏幕的两倍。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 垂径<\/h3>\n<div class=\"katex-block\">r^{2}=d^{2}+\\left(\\frac{AB}{2}\\right)^{2}<\/div>\n<p>半径、弦心距、半弦构成直角三角形，勾股定理。<\/p>\n<h3>2. 圆周角<\/h3>\n<div class=\"katex-block\">\\angle APB=\\frac{1}{2}\\angle AOB<\/div>\n<p>同弧所对的圆周角是圆心角的一半。<\/p>\n<h3>3. 等圆周角<\/h3>\n<div class=\"katex-block\">\\angle APB=\\angle AQB<\/div>\n<p>同弧上任意两点看同一段弧，角都相等。<\/p>\n<h3>4. 直径<\/h3>\n<div class=\"katex-block\">AB\\ \\text{为直径}\\ \\Rightarrow\\ \\angle APB=90^{\\circ}<\/div>\n<p>半圆所对的圆周角是直角，反之亦然。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>圆周角定理要求两角对着同一段弧；对着互补的弧时结论要改。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《圆》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：圆的基本性质<\/a><\/span><\/div><h1>第 2 章：直线与圆的位置关系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用圆心距判断相交、相切、相离\n<\/li><li>\n作切线并证明切线垂直于半径\n<\/li><li>\n使用切线长相等\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>位置关系只看一个数：圆心到直线的距离 d 与半径 r 比大小。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 三种位置关系<\/h3>\n<p>设圆心到直线的距离为 d：<\/p>\n<ul><li>\nd&lt;r：相交，两个公共点（割线）；\n<\/li><li>\nd=r：相切，一个公共点（切线）；\n<\/li><li>\nd&gt;r：相离，没有公共点。\n<\/ul>\n<h3>2.2 切线的性质与判定<\/h3>\n<p><strong>性质<\/strong>：圆的切线垂直于过切点的半径。<\/p>\n<p><strong>判定<\/strong>：过半径外端且垂直于这条半径的直线是切线。<\/p>\n<p>证明切线常走的路：连半径、证垂直。<\/p>\n<h3>2.3 切线长定理<\/h3>\n<p>从圆外一点引两条切线，两条切线长相等，且该点与圆心的连线平分两切线的夹角。<\/p>\n<h3>2.4 三角形与圆<\/h3>\n<p>三角形内切圆的圆心是三条角平分线的交点（内心），到三边距离相等；外接圆圆心是三边垂直平分线的交点（外心），到三顶点距离相等。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：切线像贴着圆滚过去的一条直线，只碰一下就离开。<\/p>\n<p><strong>失效边界<\/strong>：切线只与圆有一个公共点，但“只有一个公共点”的直线未必是切线（在曲线情形下要小心）。<\/p>\n<p><strong>实例<\/strong>：圆半径 4，圆心到直线距离 4，则直线与圆相切。 从圆外一点 P 引两条切线，切点为 A、B，若 PA=6，则 PB=6，且 OP 平分 ∠APB。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 直线与圆有一个公共点就是切线 —— 实际上 对圆成立，对一般曲线不成立；判定切线仍要证垂直。\n<\/li><li>\n别以为 切线与半径只是相交 —— 实际上 切线垂直于半径，是特殊的垂直关系，不是随便相交。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：\n<\/li><li>\n圆的切线具有的性质是：\n<p>A. 相交 ｜ B. 相切 ｜ C. 相离 ｜ D. 无法判断 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：d=5&gt;r=3，相离。 A. 平行于半径 ｜ B. 垂直于过切点的半径 ｜ C. 过圆心 ｜ D. 与直径重合 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：切线垂直于过切点的半径，这是切线的核心性质。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nd&lt;r 相交，d=r 相切，d&gt;r 相离\n<\/li><li>\n切线⊥过切点的半径\n<\/li><li>\n圆外一点的两条切线长相等\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：直线与圆的位置关系）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：直线与圆的位置关系<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>圆与直线的位置关系不需要复杂计算，只要比较“圆心到直线的距离”与半径。切线的一切性质都从“垂直”出发。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>与圆只有一个公共点的直线叫圆的切线，公共点叫切点。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像车轮贴着地面：地面就是切线，轮轴到地面的距离正好是轮半径。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 位置判定<\/h3>\n<div class=\"katex-block\">d&lt;r\\ \\text{相交};\\quad d=r\\ \\text{相切};\\quad d>r\\ \\text{相离}<\/div>\n<p>一个不等式决定三种情形。<\/p>\n<h3>2. 切线性质<\/h3>\n<div class=\"katex-block\">OT\\perp l\\quad(T\\ \\text{为切点})<\/div>\n<p>切点到圆心的半径与切线垂直。<\/p>\n<h3>3. 切线长<\/h3>\n<div class=\"katex-block\">PA=PB<\/div>\n<p>圆外一点引两条切线，长度相等。<\/p>\n<h3>4. 勾股关系<\/h3>\n<div class=\"katex-block\">OP^{2}=OT^{2}+PT^{2}<\/div>\n<p>半径、切线、圆心到外点的连线构成直角三角形。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>判定切线必须证明垂直；仅凭“看起来只碰一下”不算证明。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《圆》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：直线与圆的位置关系<\/a><\/span><\/div><h1>第 3 章：比例线段与圆内接四边形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、相似三角形\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用相交弦定理求线段\n<\/li><li>\n用切割线定理求切线长\n<\/li><li>\n使用圆内接四边形对角互补\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>圆里的比例关系全部来自相似三角形：把圆上的点连起来，就能找到成比例的边。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 相交弦定理<\/h3>\n<p>两条弦 AB、CD 交于圆内一点 P，则<\/p>\n<p>PA·PB=PC·PD<\/p>\n<p>证明：连接 AC、BD，由同弧所对圆周角相等得两组角相等，△PAC∽△PDB，对应边成比例。<\/p>\n<h3>3.2 切割线定理<\/h3>\n<p>从圆外一点 P 引切线 PT 与割线 PAB，则<\/p>\n<p>PT²=PA·PB<\/p>\n<p>这是相交弦定理的“外点版本”，同样由相似三角形推出。<\/p>\n<h3>3.3 圆内接四边形<\/h3>\n<p>四个顶点都在圆上的四边形叫圆内接四边形，它的对角互补：∠A+∠C=180°，∠B+∠D=180°。<\/p>\n<p>反过来，对角互补的四边形四点共圆，这是判定共圆的常用方法。<\/p>\n<h3>3.4 弦切角<\/h3>\n<p>切线与弦的夹角叫弦切角，它等于所夹弧对的圆周角。这条结论把切线与圆周角连了起来，是许多证明题的桥梁。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：圆像一个“比例转换器”：不论弦怎么放，交点到两端的两段乘积总是定值。<\/p>\n<p><strong>失效边界<\/strong>：定理要求点在圆内（相交弦）或圆外（切割线），位置不同用不同公式，不能混。<\/p>\n<p><strong>实例<\/strong>：弦 AB 与 CD 交于 P，PA=2、PB=6、PC=3，则 PD=PA·PB/PC=12/3=4。 圆外点 P 到圆的切线 PT=6，割线交圆于 A、B 且 PA=4，则 PB=36/4=9。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 相交弦定理可以直接相加 —— 实际上 定理给的是乘积相等，不是长度相加；混淆会算出错误答案。\n<\/li><li>\n别以为 圆内接四边形对角相等 —— 实际上 是对角互补（和为 180°），不是相等。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：\n<\/li><li>\n圆内接四边形 ABCD 中，∠A=70°，则 ∠C 为：\n<p>A. 6 ｜ B. 5 ｜ C. 7 ｜ D. 9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：3×8=4×x，得 x=6。 A. 70° ｜ B. 110° ｜ C. 90° ｜ D. 20° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：对角互补：∠C=180°−70°=110°。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相交弦：PA·PB=PC·PD\n<\/li><li>\n切割线：PT²=PA·PB\n<\/li><li>\n圆内接四边形对角互补\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：比例线段与圆内接四边形）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：比例线段与圆内接四边形<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>圆里的比例定理不是新公式，而是“连两条辅助线就出现相似三角形”的副产品。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>相交弦定理指圆内两弦相交时，交点分成的两段乘积相等。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像两个人从不同方向穿过同一扇门，门两侧的距离乘积总相等。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 相似来源<\/h3>\n<div class=\"katex-block\">\\angle CAB=\\angle CDB\\ \\Rightarrow\\ \\triangle PAC\\sim\\triangle PDB<\/div>\n<p>同弧所对圆周角相等，给出两组等角。<\/p>\n<h3>2. 相交弦<\/h3>\n<div class=\"katex-block\">PA\\cdot PB=PC\\cdot PD<\/div>\n<p>由相似比 PA/PD=PC/PB 交叉相乘得到。<\/p>\n<h3>3. 切割线<\/h3>\n<div class=\"katex-block\">PT^{2}=PA\\cdot PB<\/div>\n<p>外点版本的相似关系，切线长是比例中项。<\/p>\n<h3>4. 对角互补<\/h3>\n<div class=\"katex-block\">\\angle A+\\angle C=180^{\\circ}<\/div>\n<p>圆内接四边形两组对角分别互补。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>定理对圆内交点成立；交点在圆外时要用切割线定理。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《圆》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：圆的基本性质<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：比例线段与圆内接四边形<\/a><\/span><\/div><h1>同弧所对的角<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>同一段弧上，圆心角是圆周角的两倍，所有圆周角彼此相等。<\/p>\n<h2>为什么重要<\/h2>\n<p>圆里几乎所有求角问题都归结到这一条，是圆的角度体系的总开关。<\/p>\n<h2>详解<\/h2>\n<p>圆心角以圆心为顶点，圆周角以圆上一点为顶点，只要对着同一段弧，就满足“圆周角＝圆心角的一半”。由此推出直径所对圆周角为直角、弦切角等于所夹弧的圆周角。<\/p>\n<h2>常见误解<\/h2>\n<p>把对着不同弧的两个圆周角也当成相等，直接套结论。<\/p>\n<h2>相关概念<\/h2>\n<p>圆周角（ch01）、弦切角（ch03）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：比例线段与圆内接四边形<\/a><\/span><\/div><h1>圆幂<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>过一点作圆的割线或切线，交点到定点的两段长度之积是定值。<\/p>\n<h2>为什么重要<\/h2>\n<p>相交弦定理与切割线定理是同一个“圆幂”的两种情形，统一记忆更省力。<\/p>\n<h2>详解<\/h2>\n<p>点在圆内：PA·PB=PC·PD（两弦）；点在圆外：PT²=PA·PB（切线与割线）；点在圆上：乘积为 0。三种情形可以统一写成“点到圆的幂”。<\/p>\n<h2>常见误解<\/h2>\n<p>把圆内与圆外的公式混用，或把乘积写成和。<\/p>\n<h2>相关概念<\/h2>\n<p>相交弦定理（ch03）、切割线定理（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：圆的基本性质<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：圆的基本性质<\/a><br>检查点：能由圆周角推出圆心角<\/li><li class='path-step' id='path-02'><strong>步骤 02：直线与圆的位置关系<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：直线与圆的位置关系<\/a><br>检查点：能用 d 与 r 判断位置关系并作切线<\/li><li class='path-step' id='path-03'><strong>步骤 03：比例线段与圆内接四边形<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：比例线段与圆内接四边形<\/a><br>检查点：能用相交弦定理求线段长<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q07' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q7.<\/b> 圆内两弦相交，交点分一弦为 2 和 9，分另一弦为 3 和 x，则 x 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 4.5<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 7<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q8.<\/b> 下列关于圆的切线的说法正确的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 切线一定过圆心<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 切线垂直于过切点的半径<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 切线与圆有两个公共点<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 切线长都相等<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：圆的基本性质<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 同弧所对的圆心角为 80°，则圆周角为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 80°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 40°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 160°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 20°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 圆半径为 10，弦心距为 6，则弦长为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 8<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 12<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 16<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：直线与圆的位置关系<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 相交<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 相切<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 相离<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 圆的切线具有的性质是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 平行于半径<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 垂直于过切点的半径<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 过圆心<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 与直径重合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：比例线段与圆内接四边形<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c01' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 5<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 7<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c01' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 圆内接四边形 ABCD 中，∠A=70°，则 ∠C 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 70°<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 110°<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 90°<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 20°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='弦'>弦 — 圆上两点间的线段。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='弧'>弧 — 圆上两点之间的部分。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='圆心角'>圆心角 — 顶点在圆心的角。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='圆周角'>圆周角 — 顶点在圆上、两边与圆相交的角。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='垂径定理'>垂径定理 — 垂直于弦的直径平分弦及所对的弧。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='切线'>切线 — 与圆只有一个公共点的直线。 <span class=glossary-ref>（第 2 章：直线与圆的位置关系）<\/span><\/li><li data-term='切线长'>切线长 — 圆外一点到切点的线段长度。 <span class=glossary-ref>（第 2 章：直线与圆的位置关系）<\/span><\/li><li data-term='相交弦定理'>相交弦定理 — 圆内两弦相交，交点分成的两段乘积相等。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><li data-term='切割线定理'>切割线定理 — PT²=PA·PB。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><li data-term='弦切角'>弦切角 — 切线与弦的夹角，等于所夹弧对的圆周角。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：圆中求角三步<\/h2>\n<p>① 找同弧；② 判断是圆心角还是圆周角；③ 用倍数或相等关系换算。<\/p>\n<h2>框架：圆中求线段三步<\/h2>\n<p>① 判断点在圆内还是圆外；② 选相交弦或切割线公式；③ 列乘积相等求解。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>圆周角<\/td><td>同弧圆周角＝圆心角的一半<\/td><\/tr><tr><td>直径<\/td><td>直径所对圆周角 90°<\/td><\/tr><tr><td>垂径<\/td><td>r²=d²+(半弦)²<\/td><\/tr><tr><td>位置关系<\/td><td>d&lt;r 相交，d=r 相切，d&gt;r 相离<\/td><\/tr><tr><td>相交弦<\/td><td>PA·PB=PC·PD<\/td><\/tr><tr><td>切割线<\/td><td>PT²=PA·PB<\/td><\/tr><tr><td>圆内接四边形<\/td><td>对角互补<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  const urls = [
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.js',
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    s.onload = () => { networkLoaded = true; cb(); };
    s.onerror = () => { s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库加载失败，请联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 掌握度（简化 BKT） ---------- */
function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){
  const v = Math.round(getMastery(cid)*100);
  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}

/* ---------- 抽认卡 ---------- */
function sup(t){
  return String(t==null?'':t).replace(/[&<>]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]))
    .replace(/\^(?:\{([^{}]+)\}|\(([^()]*)\)|([-+]?[A-Za-z0-9.]+))/g,
      (m,a,b,c)=>'<sup>'+(a||b||c||'')+'</sup>');
}
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').innerHTML = sup(c.front);
  document.querySelector('.fc-back').innerHTML = sup(c.back);
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    $$('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  const urls=['https://registry.npmmirror.com/mermaid/10/files/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10/dist/mermaid.min.js'];
  let ui=0;
  const tryNext=()=>{
    if(ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    s.onload=boot;
    s.onerror=()=>{ s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';

renderNav();

showPage(routeIdFromHash());
