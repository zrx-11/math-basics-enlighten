+1/3+1/9+… 的和是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 3/2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 数列 aₙ=1/n 当 n→∞ 时的极限是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 不存在<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 无穷大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='数列'>数列 — 按顺序排列的一列数。 <span class=glossary-ref>（第 1 章：数列与通项）<\/span><\/li><li data-term='通项公式'>通项公式 — 用 n 表示第 n 项的公式。 <span class=glossary-ref>（第 1 章：数列与通项）<\/span><\/li><li data-term='递推公式'>递推公式 — 用前项表示后项的关系式加初值。 <span class=glossary-ref>（第 1 章：数列与通项）<\/span><\/li><li data-term='等差数列'>等差数列 — 相邻两项差为常数的数列。 <span class=glossary-ref>（第 2 章：等差数列与等比数列）<\/span><\/li><li data-term='等比数列'>等比数列 — 相邻两项比为常数的数列。 <span class=glossary-ref>（第 2 章：等差数列与等比数列）<\/span><\/li><li data-term='部分和'>部分和 — 前 n 项相加得到的 Sₙ。 <span class=glossary-ref>（第 3 章：级数与极限）<\/span><\/li><li data-term='极限'>极限 — n 无限增大时数列趋向的定值。 <span class=glossary-ref>（第 3 章：级数与极限）<\/span><\/li><li data-term='收敛'>收敛 — 极限存在，部分和趋向有限值。 <span class=glossary-ref>（第 3 章：级数与极限）<\/span><\/li><li data-term='连分数'>连分数 — 分母中含下一层分式的无限表达式。 <span class=glossary-ref>（第 3 章：级数与极限）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：识别数列三步<\/h2>\n<p>① 算相邻差，常数则为等差；② 算相邻比，常数则为等比；③ 都不是，再看差分的差分（二次型）。<\/p>\n<h2>框架：求和四法<\/h2>\n<p>倒序相加（等差）、错位相减（等差×等比）、裂项相消（分式）、公式直接代入（等比）。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>等差<\/td><td>aₙ=a₁+(n−1)d；Sₙ=n(a₁+aₙ)/2<\/td><\/tr><tr><td>等比<\/td><td>aₙ=a₁q^(n−1)；Sₙ=a₁(1−qⁿ)/(1−q)（q≠1）<\/td><\/tr><tr><td>无穷等比<\/td><td><\/td><td>q<\/td><td>&lt;1 时 S=a₁/(1−q)<\/td><\/tr><tr><td>等差中项<\/td><td>2b=a+c<\/td><\/tr><tr><td>等比中项<\/td><td>b²=ac<\/td><\/tr><tr><td>0.333…<\/td><td>=1/3（等比级数求和）<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：数列与通项", "href": "#/chapter/ch01"}, {"label": "第 2 章：等差数列与等比数列", "href": "#/chapter/ch02"}, {"label": "第 3 章：级数与极限", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "通项与递推", "href": "#/concept/c01"}, {"label": "极限与收敛", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：数列与通项", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：等差数列与等比数列", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：级数与极限", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"complex-numbers":{"manifest": {"slug": "complex-numbers", "title": "复数", "subtitle": "平方根不够用的时候：数系的扩张与复数的几何", "book": {"title": "复数", "author": "陈利国", "source": ["数学基础知识丛书-10-复数 陈利国.pdf"]}, "audience": "零基础", "goal": "理解数系扩张的动因，掌握复数的四则运算、共轭与模，理解复数的几何意义与三角形式，会用棣莫弗定理求乘方与开方。", "learningPath": [{"step": "01", "title": "数系扩张与复数概念", "chapterIds": ["ch01"], "checkpoint": "能说明为什么需要虚数单位"}, {"step": "02", "title": "复数的运算与几何意义", "chapterIds": ["ch02"], "checkpoint": "能用共轭做除法并解释模"}, {"step": "03", "title": "三角形式与乘方开方", "chapterIds": ["ch03"], "checkpoint": "能用棣莫弗定理开方并画图"}], "chapters": [{"id": "ch01", "title": "第 1 章：数系扩张与复数概念", "file": "chapters/ch01-concept.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：复数的运算与几何意义", "file": "chapters/ch02-operations-geometry.md", "difficulty": 3}, {"id": "ch03", "title": "第 3 章：三角形式与乘方开方", "file": "chapters/ch03-trig-polar.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "数系扩张", "file": "concepts/c01-number-system-extension.md", "chapterIds": ["ch01"]}, {"id": "c02", "title": "模与辐角", "file": "concepts/c02-modulus-argument.md", "chapterIds": ["ch02", "ch03"]}], "glossary": [{"term": "虚数单位", "def": "满足 i²=−1 的数 i。", "chapterId": "ch01"}, {"term": "复数", "def": "形如 a+bi 的数，a、b 为实数。", "chapterId": "ch01"}, {"term": "实部与虚部", "def": "复数 a+bi 中的 a 与 b。", "chapterId": "ch01"}, {"term": "共轭复数", "def": "实部相同、虚部相反的复数。", "chapterId": "ch02"}, {"term": "模", "def": "复数到原点的距离 √(a²+b²)。", "chapterId": "ch02"}, {"term": "复平面", "def": "横轴实轴、纵轴虚轴的坐标平面。", "chapterId": "ch02"}, {"term": "辐角", "def": "复数向量与实轴正方向的夹角。", "chapterId": "ch03"}, {"term": "三角形式", "def": "z=r(cosθ+i sinθ)。", "chapterId": "ch03"}, {"term": "棣莫弗定理", "def": "乘方公式 [r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)。", "chapterId": "ch03"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "复数 z=2−3i 的实部与虚部分别是：", "options": ["2 和 3", "2 和 −3", "−3 和 2", "3 和 2"], "answer": 1, "explain": "z=a+bi 中 a=2，b=−3（虚部是 b 本身，含符号）。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "i³ 的值是：", "options": ["i", "−i", "1", "−1"], "answer": 1, "explain": "i³=i²·i=−1·i=−i。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "(2+i)(1−i) 的结果是：", "options": ["3−i", "3+i", "1−i", "1+i"], "answer": 0, "explain": "2−2i+i−i²=2−i+1=3−i。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "复数 z=3+4i 的模是：", "options": ["7", "5", "25", "1"], "answer": 1, "explain": "|z|=√(9+16)=5。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "复数 z=1+i 的模与辐角（主值）分别是：", "options": ["√2 和 45°", "2 和 45°", "√2 和 135°", "1 和 90°"], "answer": 0, "explain": "r=√(1+1)=√2，cosθ=1/√2，故 θ=45°。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "用棣莫弗定理计算 (1+i)⁴，结果是：", "options": ["4", "−4", "4i", "−4i"], "answer": 1, "explain": "模 √2 的四次方为 4，角 45°×4=180°，故结果为 4(cos180°+i sin180°)=−4。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "复数 (1+i)/(1−i) 的值是：", "options": ["i", "−i", "1", "−1"], "answer": 0, "explain": "分子分母同乘 (1+i)：(1+i)²/(1+1)=(2i)/2=i。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "方程 x²+4=0 在复数范围内的解是：", "options": ["x=2", "x=±2i", "x=±2", "无解"], "answer": 1, "explain": "x²=−4，故 x=±2i。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：数系扩张与复数概念」的一句话核心是什么？", "back": "引入 i 的唯一理由：让 x²+1=0 有解；复数就是 a+bi 的形式。", "tags": ["complex-numbers", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：复数的运算与几何意义」的一句话核心是什么？", "back": "加减是向量平移，乘法是“模相乘、角相加”；除法靠共轭把分母变成实数。", "tags": ["complex-numbers", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：三角形式与乘方开方」的一句话核心是什么？", "back": "写成 z=r(cosθ+i sinθ) 之后，乘除变成模的乘除与角的加减，乘方开方就是角的倍数与等分。", "tags": ["complex-numbers", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「虚数单位」？", "back": "满足 i²=−1 的数 i。", "tags": ["complex-numbers", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「复数」？", "back": "形如 a+bi 的数，a、b 为实数。", "tags": ["complex-numbers", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「实部与虚部」？", "back": "复数 a+bi 中的 a 与 b。", "tags": ["complex-numbers", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「共轭复数」？", "back": "实部相同、虚部相反的复数。", "tags": ["complex-numbers", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「模」？", "back": "复数到原点的距离 √(a²+b²)。", "tags": ["complex-numbers", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「复平面」？", "back": "横轴实轴、纵轴虚轴的坐标平面。", "tags": ["complex-numbers", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「辐角」？", "back": "复数向量与实轴正方向的夹角。", "tags": ["complex-numbers", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「三角形式」？", "back": "z=r(cosθ+i sinθ)。", "tags": ["complex-numbers", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「棣莫弗定理」？", "back": "乘方公式 [r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)。", "tags": ["complex-numbers", "术语"]}], "companion": "complex-numbers学习伴侣.html", "deriv": "complex-numbers从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：数系扩张与复数概念<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：实数、一元二次方程\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说明数系扩张的动因\n<\/li><li>\n写出复数的实部、虚部并判断相等\n<\/li><li>\n计算 i 的整数次幂\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>引入 i 的唯一理由：让 x²+1=0 有解；复数就是 a+bi 的形式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 为什么还要扩数系<\/h3>\n<p>自然数 → 整数（减法不够用）→ 有理数（除法不够用）→ 实数（开方不够用）→ 复数（负数开平方不够用）。<\/p>\n<p>每一步扩张都是为了“让原来无解的问题有解”，同时尽量保留原有运算律。<\/p>\n<h3>1.2 虚数单位与复数<\/h3>\n<p>规定 i²=−1，i 叫<strong>虚数单位<\/strong>。形如 z=a+bi（a、b 为实数）的数叫<strong>复数<\/strong>，a 是实部，b 是虚部。<\/p>\n<ul><li>\nb=0：z 是实数；\n<\/li><li>\na=0 且 b≠0：z 是纯虚数。\n<\/ul>\n<p>两个复数相等 ⇔ 实部相等且虚部相等。注意：复数之间<strong>不能比大小<\/strong>，“3+2i 与 1+i 谁大”没有意义。<\/p>\n<h3>1.3 i 的幂有周期<\/h3>\n<p>i¹=i，i²=−1，i³=−i，i⁴=1，之后每 4 次循环。计算 iⁿ 时把 n 除以 4 看余数即可。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：数系扩张像给工具箱添工具：不是原来的工具坏了，而是遇到了新活儿。<\/p>\n<p><strong>失效边界<\/strong>：复数没有大小顺序，涉及不等式的问题不能直接搬过来。<\/p>\n<p><strong>实例<\/strong>：i²⁰²⁵：2025÷4 余 1，故 i²⁰²⁵=i。 若 (x−1)+(y+2)i=3+5i，则 x−1=3、y+2=5，得 x=4、y=3。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 i 是一个很小的实数 —— 实际上 i 不是实数，它的平方等于 −1，实数里没有这样的数。\n<\/li><li>\n别以为 复数可以像实数一样比大小 —— 实际上 复数没有序关系；只有模（长度）可以比较。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n复数 z=2−3i 的实部与虚部分别是：\n<\/li><li>\ni³ 的值是：\n<p>A. 2 和 3 ｜ B. 2 和 −3 ｜ C. −3 和 2 ｜ D. 3 和 2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：z=a+bi 中 a=2，b=−3（虚部是 b 本身，含符号）。 A. i ｜ B. −i ｜ C. 1 ｜ D. −1 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：i³=i²·i=−1·i=−i。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ni²=−1；复数 z=a+bi\n<\/li><li>\n相等 ⇔ 实部、虚部分别相等\n<\/li><li>\n复数不能比大小；i 的幂以 4 为周期\n<\/ul>", "ch02": "<h1>第 2 章：复数的运算与几何意义<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n完成复数四则运算\n<\/li><li>\n用共轭把分母实数化\n<\/li><li>\n把复数对应到复平面上的点与向量\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>加减是向量平移，乘法是“模相乘、角相加”；除法靠共轭把分母变成实数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 加减与乘<\/h3>\n<p>(a+bi)±(c+di)=(a±c)+(b±d)i。<\/p>\n<p>乘法按多项式展开，最后用 i²=−1 化简：<\/p>\n<p>(a+bi)(c+di)=ac+bdi²+adi+bci=(ac−bd)+(ad+bc)i。<\/p>\n<h3>2.2 共轭与除法<\/h3>\n<p>z=a+bi 的共轭是 z̄=a−bi。两者相乘：<\/p>\n<p>z·z̄=a²+b²（实数）<\/p>\n<p>所以除法时分子分母同乘分母的共轭，把分母变成实数：<\/p>\n<p>(a+bi)/(c+di)=(a+bi)(c−di)/(c²+d²)。<\/p>\n<h3>2.3 模<\/h3>\n<p>|z|=√(a²+b²)，几何上是复数对应点到原点的距离。有 |z₁z₂|=|z₁||z₂|，|z₁/z₂|=|z₁|/|z₂|。<\/p>\n<h3>2.4 复平面<\/h3>\n<p>把 z=a+bi 对应到点 (a,b)，就得到<strong>复平面<\/strong>：横轴为实轴，纵轴为虚轴。<\/p>\n<ul><li>\n加法对应向量相加（平行四边形法则）；\n<\/li><li>\n乘以 i 相当于逆时针旋转 90°；\n<\/li><li>\n|z| 是向量长度，辐角 θ 是它与实轴正方向的夹角。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：复数加法像两个人合力推箱子，乘法像“先伸长再转个角度”。<\/p>\n<p><strong>失效边界<\/strong>：几何解释只在复平面上成立；纯代数的运算律仍按多项式规则走。<\/p>\n<p><strong>实例<\/strong>：(1+2i)(3−i)=3−i+6i−2i²=3+5i+2=5+5i。 1/(1+i)=(1−i)/[(1+i)(1−i)]=(1−i)/2=1/2−1/2 i。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 分母有 i 就不能算 —— 实际上 同乘共轭即可把分母变成实数，方法同根式的分母有理化。\n<\/li><li>\n别以为 |z| 就是 z 本身去掉符号 —— 实际上 模是长度 √(a²+b²)，与实数的绝对值含义相通但算法不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n(2+i)(1−i) 的结果是：\n<\/li><li>\n复数 z=3+4i 的模是：\n<p>A. 3−i ｜ B. 3+i ｜ C. 1−i ｜ D. 1+i <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：2−2i+i−i²=2−i+1=3−i。 A. 7 ｜ B. 5 ｜ C. 25 ｜ D. 1 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：|z|=√(9+16)=5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n加减分实虚部；乘法展开后用 i²=−1\n<\/li><li>\n除法同乘共轭，分母变实数\n<\/li><li>\n模＝到原点的距离；乘 i 是转 90°\n<\/ul>", "ch03": "<h1>第 3 章：三角形式与乘方开方<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、三角函数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把复数化成三角形式\n<\/li><li>\n用“模乘角加”做乘法与除法\n<\/li><li>\n用棣莫弗定理求乘方与 n 次方根\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>写成 z=r(cosθ+i sinθ) 之后，乘除变成模的乘除与角的加减，乘方开方就是角的倍数与等分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 三角形式<\/h3>\n<p>设 z=a+bi，r=|z|=√(a²+b²)，θ 为辐角（与实轴正方向的夹角），则<\/p>\n<p>z=r(cosθ+i sinθ)<\/p>\n<p>其中 cosθ=a/r，sinθ=b/r。θ 不唯一，相差 2kπ 都表示同一个复数，通常取 [0,2π) 内的主值。<\/p>\n<h3>3.2 乘除的几何算法<\/h3>\n<p>z₁z₂=r₁r₂[cos(θ₁+θ₂)+i sin(θ₁+θ₂)] z₁/z₂=(r₁/r₂)[cos(θ₁−θ₂)+i sin(θ₁−θ₂)]<\/p>\n<p>即<strong>模相乘、角相加<\/strong>；除法是模相除、角相减。这也解释了“乘 i 就是转 90°”。<\/p>\n<h3>3.3 棣莫弗定理<\/h3>\n<p>[r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)<\/p>\n<p>乘方就是模取 n 次幂、角乘 n。<\/p>\n<h3>3.4 开方<\/h3>\n<p>z 的 n 次方根有 n 个，均匀分布在以原点为圆心、半径 ⁿ√r 的圆上：<\/p>\n<p>w_k=ⁿ√r[cos((θ+2kπ)/n)+i sin((θ+2kπ)/n)]，k=0,1,…,n−1<\/p>\n<p>这解释了“任何数在复数范围内都有 n 个 n 次方根”，也解释了为什么 x³=1 有三个解（1 和两个复数根）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：三角形式像给向量装了“长度＋方向”的刻度盘，乘法就是两个刻度盘叠起来转。<\/p>\n<p><strong>失效边界<\/strong>：辐角要统一单位（弧度或度），加减时混用会出错。<\/p>\n<p><strong>实例<\/strong>：1+i=√2(cos45°+i sin45°)。它的平方：(√2)²(cos90°+i sin90°)=2i。 x³=1 的根：1，−1/2+√3/2 i，−1/2−√3/2 i，三点在单位圆上均匀分布。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 开方只有一个根 —— 实际上 复数范围内 n 次方根有 n 个，均匀分布在圆上。\n<\/li><li>\n别以为 辐角只有一个值 —— 实际上 辐角相差 2kπ 都表示同一复数；写三角形式要说明取哪个范围。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n复数 z=1+i 的模与辐角（主值）分别是：\n<\/li><li>\n用棣莫弗定理计算 (1+i)⁴，结果是：\n<p>A. √2 和 45° ｜ B. 2 和 45° ｜ C. √2 和 135° ｜ D. 1 和 90° <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：r=√(1+1)=√2，cosθ=1/√2，故 θ=45°。 A. 4 ｜ B. −4 ｜ C. 4i ｜ D. −4i <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：模 √2 的四次方为 4，角 45°×4=180°，故结果为 4(cos180°+i sin180°)=−4。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三角形式 z=r(cosθ+i sinθ)\n<\/li><li>\n乘法：模乘角加；除法：模除角减\n<\/li><li>\n棣莫弗：乘方＝模取幂、角乘 n；开方＝n 个均匀根\n<\/ul>", "c01": "<h1>数系扩张<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每次“不够用”就扩一次数系，同时保留原有运算律。<\/p>\n<h2>为什么重要<\/h2>\n<p>理解扩张的动因，才不会把复数当成硬背的记号。<\/p>\n<h2>详解<\/h2>\n<p>自然数→整数（减法封闭）→有理数（除法封闭）→实数（极限与开方）→复数（负数开方）。每步都解决一类无解问题，代价是失去某些性质（如复数失去大小顺序）。<\/p>\n<h2>常见误解<\/h2>\n<p>以为复数只是数学家的游戏；它在电学、信号处理、几何里都是标准工具。<\/p>\n<h2>相关概念<\/h2>\n<p>虚数单位（ch01）、复平面（ch02）<\/p>", "c02": "<h1>模与辐角<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>模是长度，辐角是方向；乘除看模与角，乘方开方看倍数与等分。<\/p>\n<h2>为什么重要<\/h2>\n<p>三角形式把复数运算翻译成几何动作，是求乘方开方的最快路径。<\/p>\n<h2>详解<\/h2>\n<p>|z|=√(a²+b²)，θ 由 cosθ=a/|z|、sinθ=b/|z| 确定。乘法模相乘角相加，除法模相除角相减；棣莫弗定理把乘方变成“模取幂、角乘 n”，开方则是把角 n 等分。<\/p>\n<h2>常见误解<\/h2>\n<p>只记公式不看几何，遇到开方漏根、遇到辐角范围出错。<\/p>\n<h2>相关概念<\/h2>\n<p>三角形式（ch03）、棣莫弗定理（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数系扩张与复数概念<\/strong><br>阅读：<a href=\"#/book/complex-numbers/chapter/ch01\">第 1 章：数系扩张与复数概念<\/a><br>检查点：能说明为什么需要虚数单位<\/li><li class='path-step' id='path-02'><strong>步骤 02：复数的运算与几何意义<\/strong><br>阅读：<a href=\"#/book/complex-numbers/chapter/ch02\">第 2 章：复数的运算与几何意义<\/a><br>检查点：能用共轭做除法并解释模<\/li><li class='path-step' id='path-03'><strong>步骤 03：三角形式与乘方开方<\/strong><br>阅读：<a href=\"#/book/complex-numbers/chapter/ch03\">第 3 章：三角形式与乘方开方<\/a><br>检查点：能用棣莫弗定理开方并画图<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：数系扩张与复数概念<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 复数 z=2−3i 的实部与虚部分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 2 和 3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 2 和 −3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> −3 和 2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 3 和 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> i³ 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> i<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> −i<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> −1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：复数的运算与几何意义<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> (2+i)(1−i) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 3−i<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 3+i<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 1−i<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 1+i<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 复数 z=3+4i 的模是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 7<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 5<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 25<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：三角形式与乘方开方<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 复数 z=1+i 的模与辐角（主值）分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> √2 和 45°<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 2 和 45°<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> √2 和 135°<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 1 和 90°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 用棣莫弗定理计算 (1+i)⁴，结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> −4<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 4i<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> −4i<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 复数 (1+i)/(1−i) 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> i<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> −i<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> −1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 方程 x²+4=0 在复数范围内的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> x=2<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> x=±2i<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> x=±2<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 无解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：数系扩张与复数概念<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 复数 z=2−3i 的实部与虚部分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 2 和 3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 2 和 −3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> −3 和 2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 3 和 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> i³ 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> i<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> −i<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> −1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：复数的运算与几何意义<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> (2+i)(1−i) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 3−i<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 3+i<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 1−i<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 1+i<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 复数 z=3+4i 的模是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 7<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 5<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 25<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：三角形式与乘方开方<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 复数 z=1+i 的模与辐角（主值）分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> √2 和 45°<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 2 和 45°<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> √2 和 135°<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 1 和 90°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 用棣莫弗定理计算 (1+i)⁴，结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> −4<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 4i<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> −4i<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='虚数单位'>虚数单位 — 满足 i²=−1 的数 i。 <span class=glossary-ref>（第 1 章：数系扩张与复数概念）<\/span><\/li><li data-term='复数'>复数 — 形如 a+bi 的数，a、b 为实数。 <span class=glossary-ref>（第 1 章：数系扩张与复数概念）<\/span><\/li><li data-term='实部与虚部'>实部与虚部 — 复数 a+bi 中的 a 与 b。 <span class=glossary-ref>（第 1 章：数系扩张与复数概念）<\/span><\/li><li data-term='共轭复数'>共轭复数 — 实部相同、虚部相反的复数。 <span class=glossary-ref>（第 2 章：复数的运算与几何意义）<\/span><\/li><li data-term='模'>模 — 复数到原点的距离 √(a²+b²)。 <span class=glossary-ref>（第 2 章：复数的运算与几何意义）<\/span><\/li><li data-term='复平面'>复平面 — 横轴实轴、纵轴虚轴的坐标平面。 <span class=glossary-ref>（第 2 章：复数的运算与几何意义）<\/span><\/li><li data-term='辐角'>辐角 — 复数向量与实轴正方向的夹角。 <span class=glossary-ref>（第 3 章：三角形式与乘方开方）<\/span><\/li><li data-term='三角形式'>三角形式 — z=r(cosθ+i sinθ)。 <span class=glossary-ref>（第 3 章：三角形式与乘方开方）<\/span><\/li><li data-term='棣莫弗定理'>棣莫弗定理 — 乘方公式 [r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)。 <span class=glossary-ref>（第 3 章：三角形式与乘方开方）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：复数运算三选一<\/h2>\n<p>加减直接分实虚部；乘除优先用代数形式（除法乘共轭）；乘方开方换三角形式。<\/p>\n<h2>框架：几何翻译<\/h2>\n<p>看到“旋转 90°”想乘 i；看到“长度为 1”想 |z|=1；看到“正三角形”想三个根均匀分布。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>i 的幂<\/td><td>i¹=i，i²=−1，i³=−i，i⁴=1，周期 4<\/td><\/tr><tr><td>乘法<\/td><td>(a+bi)(c+di)=(ac−bd)+(ad+bc)i<\/td><\/tr><tr><td>除法<\/td><td>(a+bi)/(c+di)=(a+bi)(c−di)/(c²+d²)<\/td><\/tr><tr><td>模<\/td><td><\/td><td>z<\/td><td>=√(a²+b²)；z·z̄=<\/td><td>z<\/td><td>²<\/td><\/tr><tr><td>三角形式<\/td><td>z=r(cosθ+i sinθ)<\/td><\/tr><tr><td>棣莫弗<\/td><td>[r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：数系扩张与复数概念", "href": "#/chapter/ch01"}, {"label": "第 2 章：复数的运算与几何意义", "href": "#/chapter/ch02"}, {"label": "第 3 章：三角形式与乘方开方", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "数系扩张", "href": "#/concept/c01"}, {"label": "模与辐角", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：数系扩张与复数概念", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：复数的运算与几何意义", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：三角形式与乘方开方", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"plane-figures":{"manifest": {"slug": "plane-figures", "title": "直线形", "subtitle": "直线围成的世界：角、三角形、相似与变换", "book": {"title": "直线形", "author": "毛鸿翔", "source": ["数学基础知识丛书-11-直线形 毛鸿翔.pdf"]}, "audience": "零基础", "goal": "掌握角的度量与平行线性质，熟悉三角形边角关系与全等、相似判定，理解平移、旋转、轴对称与位似的作用。", "learningPath": [{"step": "01", "title": "角与平行线", "chapterIds": ["ch01"], "checkpoint": "能用平行线性质推出角相等"}, {"step": "02", "title": "三角形与全等", "chapterIds": ["ch02"], "checkpoint": "能选出正确的全等判定条件"}, {"step": "03", "title": "相似、比例与变换", "chapterIds": ["ch03"], "checkpoint": "能用相似比求线段长"}], "chapters": [{"id": "ch01", "title": "第 1 章：角与平行线", "file": "chapters/ch01-angles-parallel.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：三角形与全等", "file": "chapters/ch02-triangle-congruence.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：相似、比例与图形变换", "file": "chapters/ch03-similarity-transform.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "判定与性质", "file": "concepts/c01-criterion-property.md", "chapterIds": ["ch01", "ch02", "ch03"]}, {"id": "c02", "title": "不变量", "file": "concepts/c02-invariant.md", "chapterIds": ["ch03"]}], "glossary": [{"term": "余角", "def": "两角之和为 90°。", "chapterId": "ch01"}, {"term": "补角", "def": "两角之和为 180°。", "chapterId": "ch01"}, {"term": "对顶角", "def": "两直线相交形成的顶点相对的两个角。", "chapterId": "ch01"}, {"term": "同位角", "def": "两条直线被第三条直线所截，位置相同的一对角。", "chapterId": "ch01"}, {"term": "全等", "def": "能完全重合的两个图形。", "chapterId": "ch02"}, {"term": "SSA", "def": "两边及其中一边的对角，不能判定全等。", "chapterId": "ch02"}, {"term": "相似", "def": "对应角相等、对应边成比例的两个图形。", "chapterId": "ch03"}, {"term": "相似比", "def": "相似图形对应线段的比值。", "chapterId": "ch03"}, {"term": "位似", "def": "从一点出发按比例缩放的相似变换。", "chapterId": "ch03"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "两条平行线被第三条直线所截，同旁内角的关系是：", "options": ["相等", "互补", "互余", "无法确定"], "answer": 1, "explain": "两直线平行时同旁内角之和为 180°，即互补。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "一个三角形的两个内角分别为 50° 和 60°，第三个内角是：", "options": ["60°", "70°", "80°", "90°"], "answer": 1, "explain": "180°−50°−60°=70°。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "下列条件能判定两个三角形全等的是：", "options": ["两边及其中一边的对角对应相等", "三个角对应相等", "两边及其夹角对应相等", "周长相等"], "answer": 2, "explain": "SAS 是标准判定；SSA 与 AAA 都不足以判定全等。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "三角形两边长为 3 和 7，第三边 x 的取值范围是：", "options": ["3<x<7", "4<x<10", "0<x<10", "x>4"], "answer": 1, "explain": "两边之差 4 < x < 两边之和 10。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "两个相似三角形的相似比为 1:2，则面积比为：", "options": ["1:2", "1:4", "2:1", "1:√2"], "answer": 1, "explain": "面积比是相似比的平方，即 1:4。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "下列变换中，属于相似变换而非全等变换的是：", "options": ["平移", "旋转", "轴对称", "位似"], "answer": 3, "explain": "位似会按比例改变大小，只保持形状；其余三种保形状也保大小。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "两个相似三角形的面积比为 9:16，则相似比为：", "options": ["9:16", "3:4", "4:3", "81:256"], "answer": 1, "explain": "相似比是面积比的平方根，√(9/16)=3/4。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "下列条件中不能判定两个三角形全等的是：", "options": ["三边对应相等", "两角及夹边对应相等", "两边及其中一边的对角对应相等", "两边及其夹角对应相等"], "answer": 2, "explain": "SSA 存在两种可能图形，不能判定全等。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：角与平行线」的一句话核心是什么？", "back": "平行线把“角相等”变成可传递的结论，这是整个平面几何的第一台发动机。", "tags": ["plane-figures", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：三角形与全等」的一句话核心是什么？", "back": "全等就是“完全重合”；四组判定条件都是在说“三条边、三个角里够用的那几条”。", "tags": ["plane-figures", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：相似、比例与图形变换」的一句话核心是什么？", "back": "相似是“形状不变、大小按比例”；变换是“搬动图形但保留某些性质”。", "tags": ["plane-figures", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「余角」？", "back": "两角之和为 90°。", "tags": ["plane-figures", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「补角」？", "back": "两角之和为 180°。", "tags": ["plane-figures", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「对顶角」？", "back": "两直线相交形成的顶点相对的两个角。", "tags": ["plane-figures", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「同位角」？", "back": "两条直线被第三条直线所截，位置相同的一对角。", "tags": ["plane-figures", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「全等」？", "back": "能完全重合的两个图形。", "tags": ["plane-figures", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「SSA」？", "back": "两边及其中一边的对角，不能判定全等。", "tags": ["plane-figures", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「相似」？", "back": "对应角相等、对应边成比例的两个图形。", "tags": ["plane-figures", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「相似比」？", "back": "相似图形对应线段的比值。", "tags": ["plane-figures", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「位似」？", "back": "从一点出发按比例缩放的相似变换。", "tags": ["plane-figures", "术语"]}], "companion": "plane-figures学习伴侣.html", "deriv": "plane-figures从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：角与平行线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：基本作图\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用度与弧度表示角并互化\n<\/li><li>\n使用余角、补角、对顶角的性质\n<\/li><li>\n用平行线性质判断角的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>平行线把“角相等”变成可传递的结论，这是整个平面几何的第一台发动机。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 角的度量<\/h3>\n<p>把一个周角分成 360 份，每份为 1 度。弧度制以弧长与半径的比为角的大小，π 弧度＝180°。<\/p>\n<p>互化：1°=π/180 弧度；1 弧度≈57.3°。<\/p>\n<h3>1.2 角的关系<\/h3>\n<ul><li>\n余角：两角相加为 90°；\n<\/li><li>\n补角：两角相加为 180°；\n<\/li><li>\n对顶角相等（两条直线相交形成）。\n<\/ul>\n<h3>1.3 平行线的性质<\/h3>\n<p>两直线平行时：<\/p>\n<ul><li>\n同位角相等；\n<\/li><li>\n内错角相等；\n<\/li><li>\n同旁内角互补（和为 180°）。\n<\/ul>\n<p>反过来，这三条任一成立，也能判定两直线平行。性质与判定是同一组事实的两个方向，做题时要分清“已知平行”还是“要证平行”。<\/p>\n<h3>1.4 三角形的内角和<\/h3>\n<p>三角形内角和为 180°，由“过顶点作平行线”配合内错角推出。外角等于与它不相邻的两个内角之和。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：平行线像两条永不相交的铁轨，横穿它们的枕木把“角度关系”固定住了。<\/p>\n<p><strong>失效边界<\/strong>：这些性质只在同一平面内成立；空间中两条直线可能既不平行也不相交（异面）。<\/p>\n<p><strong>实例<\/strong>：已知 l₁∥l₂，一条截线与它们相交，∠1=65°，则同位角也是 65°，内错角 65°，同旁内角 115°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 同位角一定相等 —— 实际上 只有两直线平行时才相等；不平行时不相等。\n<\/li><li>\n别以为 三角形内角和总是 180° —— 实际上 在欧氏平面内成立；球面或双曲面上不成立。中学阶段默认欧氏几何。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n两条平行线被第三条直线所截，同旁内角的关系是：\n<\/li><li>\n一个三角形的两个内角分别为 50° 和 60°，第三个内角是：\n<p>A. 相等 ｜ B. 互补 ｜ C. 互余 ｜ D. 无法确定 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：两直线平行时同旁内角之和为 180°，即互补。 A. 60° ｜ B. 70° ｜ C. 80° ｜ D. 90° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：180°−50°−60°=70°。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n平行 ⇒ 同位角相等、内错角相等、同旁内角互补\n<\/li><li>\n三角形内角和 180°，外角等于两不相邻内角之和\n<\/li><li>\n性质与判定互为逆用，先看已知条件\n<\/ul>", "ch02": "<h1>第 2 章：三角形与全等<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n使用三角形不等式与大边对大角\n<\/li><li>\n按条件选择 SSS、SAS、ASA、AAS 判定全等\n<\/li><li>\n识别全等中的对应关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>全等就是“完全重合”；四组判定条件都是在说“三条边、三个角里够用的那几条”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 边角关系<\/h3>\n<ul><li>\n三角形任意两边之和大于第三边，两边之差小于第三边；\n<\/li><li>\n大边对大角，大角对大边；\n<\/li><li>\n直角三角形斜边最长。\n<\/ul>\n<h3>2.2 全等的判定<\/h3>\n<p>两个三角形全等指对应边、对应角全部相等。判定不必六条全查：<\/p>\n<ul><li>\n<strong>SSS<\/strong>：三边对应相等；\n<\/li><li>\n<strong>SAS<\/strong>：两边及其夹角对应相等；\n<\/li><li>\n<strong>ASA<\/strong>：两角及其夹边对应相等；\n<\/li><li>\n<strong>AAS<\/strong>：两角及其中一角的对边对应相等。\n<\/ul>\n<p><strong>SSA（两边及其中一边的对角）不能判定全等<\/strong>，这是最常见的陷阱。AAA 也只能判定相似，不能判定全等。<\/p>\n<h3>2.3 对应关系要按顺序写<\/h3>\n<p>写 △ABC≌△DEF 时，字母顺序就规定了对应关系：A↔D、B↔E、C↔F。顺序写错，后面用对应边、对应角就会出错。<\/p>\n<h3>2.4 特殊线段<\/h3>\n<p>中线连接顶点与对边中点；高垂直于对边；角平分线把角分成两半；中位线平行于第三边且等于它的一半。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：全等像两块完全相同的拼图，翻转、平移后能严丝合缝地重合。<\/p>\n<p><strong>失效边界<\/strong>：形状相同但大小不同只是相似，不是全等；判定条件不能混用。<\/p>\n<p><strong>实例<\/strong>：△ABC 与 △DEF 中，AB=DE，∠B=∠E，BC=EF，则按 SAS 全等。 若给出 AB=DE、∠B=∠E、AC=DF（边边角），则不能判定全等，可能有两种不同形状。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 边边角也能证全等 —— 实际上 SSA 不成立，满足条件的三角形可能有两个，无法保证重合。\n<\/li><li>\n别以为 三个角相等就是全等 —— 实际上 AAA 只能得到相似；全等还要求边长也相等。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列条件能判定两个三角形全等的是：\n<\/li><li>\n三角形两边长为 3 和 7，第三边 x 的取值范围是：\n<p>A. 两边及其中一边的对角对应相等 ｜ B. 三个角对应相等 ｜ C. 两边及其夹角对应相等 ｜ D. 周长相等 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：SAS 是标准判定；SSA 与 AAA 都不足以判定全等。 A. 3&lt;x&lt;7 ｜ B. 4&lt;x&lt;10 ｜ C. 0&lt;x&lt;10 ｜ D. x&gt;4 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：两边之差 4 &lt; x &lt; 两边之和 10。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n全等判定：SSS、SAS、ASA、AAS；SSA 不成立\n<\/li><li>\n字母顺序即对应关系\n<\/li><li>\n第三边在两边之差与两边之和之间\n<\/ul>", "ch03": "<h1>第 3 章：相似、比例与图形变换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用三组判定条件证明相似\n<\/li><li>\n用相似比求线段、周长、面积\n<\/li><li>\n说出四种变换的不变量\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>相似是“形状不变、大小按比例”；变换是“搬动图形但保留某些性质”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 相似的判定<\/h3>\n<ul><li>\n两角对应相等（AA）；\n<\/li><li>\n两边对应成比例且夹角相等（SAS）；\n<\/li><li>\n三边对应成比例（SSS）。\n<\/ul>\n<h3>3.2 相似比与面积比<\/h3>\n<p>若相似比为 k，则：<\/p>\n<ul><li>\n对应线段之比为 k；\n<\/li><li>\n周长之比为 k；\n<\/li><li>\n面积之比为 k²。\n<\/ul>\n<p>最后一条最容易错：面积是二维量，长度放大 k 倍，面积放大 k² 倍。<\/p>\n<h3>3.3 平行线分线段成比例<\/h3>\n<p>三条平行线截两条直线，截得的对应线段成比例。由此可得三角形中位线定理与“平行于一边的直线分另两边成比例”。<\/p>\n<h3>3.4 四种变换<\/h3>\n<ul><li>\n<strong>平移<\/strong>：形状、大小、方向都不变；\n<\/li><li>\n<strong>旋转<\/strong>：形状、大小不变，方向改变；\n<\/li><li>\n<strong>轴对称<\/strong>：形状、大小不变，左右翻转；\n<\/li><li>\n<strong>位似<\/strong>：形状不变，大小按比例放大缩小（相似变换）。\n<\/ul>\n<p>前三者是全等变换，位似是相似变换。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：相似像用复印机缩放，比例一致但尺寸不同；位似像从一点向外投影放大。<\/p>\n<p><strong>失效边界<\/strong>：面积比不是相似比，套错比例会差一个平方。<\/p>\n<p><strong>实例<\/strong>：两个相似三角形相似比 2:3，则周长比 2:3，面积比 4:9。 若小三角形面积为 8，则大三角形面积为 8×9/4=18。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 面积比等于相似比 —— 实际上 面积比是相似比的平方，因为面积涉及两个方向的长度。\n<\/li><li>\n别以为 所有变换都保持形状 —— 实际上 平移、旋转、轴对称、位似都保形状；投影、拉伸会改变形状。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n两个相似三角形的相似比为 1:2，则面积比为：\n<\/li><li>\n下列变换中，属于相似变换而非全等变换的是：\n<p>A. 1:2 ｜ B. 1:4 ｜ C. 2:1 ｜ D. 1:√2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：面积比是相似比的平方，即 1:4。 A. 平移 ｜ B. 旋转 ｜ C. 轴对称 ｜ D. 位似 <strong>答案<\/strong>：D ｜ <strong>解析<\/strong>：位似会按比例改变大小，只保持形状；其余三种保形状也保大小。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相似判定：AA、SAS、SSS\n<\/li><li>\n相似比 k ⇒ 周长比 k、面积比 k²\n<\/li><li>\n平移/旋转/轴对称是全等变换，位似是相似变换\n<\/ul>", "c01": "<h1>判定与性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>“因为平行所以角相等”是性质，“因为角相等所以平行”是判定，方向不能反。<\/p>\n<h2>为什么重要<\/h2>\n<p>平面几何的证明几乎都在性质与判定之间来回切换，方向搞反就证不下去。<\/p>\n<h2>详解<\/h2>\n<p>性质是由已知的图形关系推出角或边的结论；判定是由角或边的条件推出图形关系。平行线、全等、相似都各有一对。做题时先看题目给的是“关系”还是“条件”，再决定用哪一个方向。<\/p>\n<h2>常见误解<\/h2>\n<p>把判定当性质用，比如由“同位角相等”直接说“两直线一定平行”却不说明理由，逻辑上仍成立但表述混乱。<\/p>\n<h2>相关概念<\/h2>\n<p>平行线（ch01）、全等（ch02）、相似（ch03）<\/p>", "c02": "<h1>不变量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>变换改变位置，不改变某些量；找出不变量，问题就简化了。<\/p>\n<h2>为什么重要<\/h2>\n<p>几何变换题的核心就是找“变的是什么、不变的是什么”。<\/p>\n<h2>详解<\/h2>\n<p>平移保持方向与长度；旋转保持长度与角度；轴对称保持长度与角度但翻转方向；位似保持角度、按比例改变长度。面积在相似变换下按 k² 变化，是“半不变量”。<\/p>\n<h2>常见误解<\/h2>\n<p>以为变换后一切都不变，忽略位似会改变大小、轴对称会改变方向。<\/p>\n<h2>相关概念<\/h2>\n<p>图形变换（ch03）、相似比（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：角与平行线<\/strong><br>阅读：<a href=\"#/book/plane-figures/chapter/ch01\">第 1 章：角与平行线<\/a><br>检查点：能用平行线性质推出角相等<\/li><li class='path-step' id='path-02'><strong>步骤 02：三角形与全等<\/strong><br>阅读：<a href=\"#/book/plane-figures/chapter/ch02\">第 2 章：三角形与全等<\/a><br>检查点：能选出正确的全等判定条件<\/li><li class='path-step' id='path-03'><strong>步骤 03：相似、比例与变换<\/strong><br>阅读：<a href=\"#/book/plane-figures/chapter/ch03\">第 3 章：相似、比例与图形变换<\/a><br>检查点：能用相似比求线段长<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：角与平行线<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 两条平行线被第三条直线所截，同旁内角的关系是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 相等<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 互补<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 互余<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 无法确定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 一个三角形的两个内角分别为 50° 和 60°，第三个内角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 60°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 70°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 80°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 90°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：三角形与全等<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列条件能判定两个三角形全等的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 两边及其中一边的对角对应相等<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 三个角对应相等<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 两边及其夹角对应相等<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 周长相等<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三角形两边长为 3 和 7，第三边 x 的取值范围是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 3&lt;x&lt;7<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 4&lt;x&lt;10<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 0&lt;x&lt;10<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> x&gt;4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：相似、比例与图形变换<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 两个相似三角形的相似比为 1:2，则面积比为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 1:2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 1:4<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 2:1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 1:√2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 下列变换中，属于相似变换而非全等变换的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 平移<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 旋转<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 轴对称<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 位似<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 两个相似三角形的面积比为 9:16，则相似比为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 9:16<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 3:4<\/ >SSA — 两边及其中一边的对角，不能判定全等。 <span class=glossary-ref>（第 2 章：三角形与全等）<\/span><\/li><li data-term='相似'>相似 — 对应角相等、对应边成比例的两个图形。 <span class=glossary-ref>（第 3 章：相似、比例与图形变换）<\/span><\/li><li data-term='相似比'>相似比 — 相似图形对应线段的比值。 <span class=glossary-ref>（第 3 章：相似、比例与图形变换）<\/span><\/li><li data-term='位似'>位似 — 从一点出发按比例缩放的相似变换。 <span class=glossary-ref>（第 3 章：相似、比例与图形变换）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：证全等三步<\/h2>\n<p>① 找已知相等的边角；② 数够不够（SSS/SAS/ASA/AAS）；③ 按字母顺序写对应关系。<\/p>\n<h2>框架：相似题四问<\/h2>\n<p>① 有没有平行线（给出等角）；② 有没有公共角；③ 能否用比例；④ 求的是长度还是面积（决定用 k 还是 k²）。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>内角和<\/td><td>三角形 180°，n 边形 (n−2)×180°<\/td><\/tr><tr><td>外角<\/td><td>等于两个不相邻内角之和<\/td><\/tr><tr><td>全等判定<\/td><td>SSS、SAS、ASA、AAS<\/td><\/tr><tr><td>相似判定<\/td><td>AA、SAS、SSS<\/td><\/tr><tr><td>相似缩放<\/td><td>长度 k，周长 k，面积 k²<\/td><\/tr><tr><td>第三边范围<\/td><td>两边之差 &lt; x &lt; 两边之和<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：角与平行线", "href": "#/chapter/ch01"}, {"label": "第 2 章：三角形与全等", "href": "#/chapter/ch02"}, {"label": "第 3 章：相似、比例与图形变换", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "判定与性质", "href": "#/concept/c01"}, {"label": "不变量", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：角与平行线", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：三角形与全等", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：相似、比例与图形变换", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"circle":{"manifest": {"slug": "circle", "title": "圆", "subtitle": "到一点等距的轨迹：圆里的角、线与比例", "book": {"title": "圆", "author": "赵遂之", "source": ["数学基础知识丛书-12-圆 赵遂之.pdf"] id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：", "options": ["相交", "相切", "相离", "无法判断"], "answer": 2, "explain": "d=5>r=3，相离。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "圆的切线具有的性质是：", "options": ["平行于半径", "垂直于过切点的半径", "过圆心", "与直径重合"], "answer": 1, "explain": "切线垂直于过切点的半径，这是切线的核心性质。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：", "options": ["6", "5", "7", "9"], "answer": 0, "explain": "3×8=4×x，得 x=6。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "圆内接四边形 ABCD 中，∠A=70°，则 ∠C 为：", "options": ["70°", "110°", "90°", "20°"], "answer": 1, "explain": "对角互补：∠C=180°−70°=110°。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "圆内两弦相交，交点分一弦为 2 和 9，分另一弦为 3 和 x，则 x 为：", "options": ["6", "4.5", "7", "5"], "answer": 0, "explain": "2×9=3×x，得 x=6。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "下列关于圆的切线的说法正确的是：", "options": ["切线一定过圆心", "切线垂直于过切点的半径", "切线与圆有两个公共点", "切线长都相等"], "answer": 1, "explain": "切线垂直于过切点的半径；切线只有一个公共点，切线长只在同一外点的两条切线间相等。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：圆的基本性质」的一句话核心是什么？", "back": "同弧所对的圆周角相等，且等于圆心角的一半；直径所对的圆周角是直角。", "tags": ["circle", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：直线与圆的位置关系」的一句话核心是什么？", "back": "位置关系只看一个数：圆心到直线的距离 d 与半径 r 比大小。", "tags": ["circle", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：比例线段与圆内接四边形」的一句话核心是什么？", "back": "圆里的比例关系全部来自相似三角形：把圆上的点连起来，就能找到成比例的边。", "tags": ["circle", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「弦」？", "back": "圆上两点间的线段。", "tags": ["circle", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「弧」？", "back": "圆上两点之间的部分。", "tags": ["circle", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「圆心角」？", "back": "顶点在圆心的角。", "tags": ["circle", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「圆周角」？", "back": "顶点在圆上、两边与圆相交的角。", "tags": ["circle", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「垂径定理」？", "back": "垂直于弦的直径平分弦及所对的弧。", "tags": ["circle", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「切线」？", "back": "与圆只有一个公共点的直线。", "tags": ["circle", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「切线长」？", "back": "圆外一点到切点的线段长度。", "tags": ["circle", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「相交弦定理」？", "back": "圆内两弦相交，交点分成的两段乘积相等。", "tags": ["circle", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「切割线定理」？", "back": "PT²=PA·PB。", "tags": ["circle", "术语"]}, {"id": "f13", "chapterId": "ch03", "front": "什么是「弦切角」？", "back": "切线与弦的夹角，等于所夹弧对的圆周角。", "tags": ["circle", "术语"]}], "companion": "circle学习伴侣.html", "deriv": "circle从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：圆的基本性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：垂径、圆周角\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用垂径定理求弦长\n<\/li><li>\n用圆心角与圆周角关系求角\n<\/li><li>\n识别直径所对的直角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同弧所对的圆周角相等，且等于圆心角的一半；直径所对的圆周角是直角。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 圆的基本元素<\/h3>\n<p>圆心 O、半径 r、弦（圆上两点连线）、弧（圆上两点间的部分）、圆心角（顶点在圆心的角）。<\/p>\n<h3>1.2 垂径定理<\/h3>\n<p>垂直于弦的直径平分这条弦，也平分弦所对的两条弧。<\/p>\n<p>推论：弦心距、半弦、半径构成直角三角形，满足 r²=d²+(半弦)²。这是求弦长最常用的关系。<\/p>\n<h3>1.3 圆心角与圆周角<\/h3>\n<p>顶点在圆心的角叫圆心角，顶点在圆上、两边与圆相交的角叫圆周角。<\/p>\n<p><strong>同弧所对的圆周角等于圆心角的一半<\/strong>；同弧所对的圆周角彼此相等。<\/p>\n<h3>1.4 直径所对的角<\/h3>\n<p>半圆（或直径）所对的圆周角是 90°；反过来，90° 的圆周角所对的弦是直径。这条结论在判定直角三角形时极常用。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：圆心角像站在圆心看风景的张角，圆周角像退到圆周上看同一段风景，视野只有一半。<\/p>\n<p><strong>失效边界<\/strong>：这些关系只对“同一段弧”成立；弧不同，角就不能直接比较。<\/p>\n<p><strong>实例<\/strong>：圆半径 5，弦心距 3，则半弦长 √(25−9)=4，弦长 8。 若某圆周角为 35°，则同弧所对的圆心角为 70°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 圆周角等于圆心角 —— 实际上 同弧时圆周角是圆心角的一半，不是相等。\n<\/li><li>\n别以为 任意弦都能用垂径定理 —— 实际上 垂径定理要求直径（或过圆心的直线）垂直于弦；普通弦没有这个性质。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n同弧所对的圆心角为 80°，则圆周角为：\n<\/li><li>\n圆半径为 10，弦心距为 6，则弦长为：\n<p>A. 80° ｜ B. 40° ｜ C. 160° ｜ D. 20° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：同弧圆周角是圆心角的一半。 A. 8 ｜ B. 12 ｜ C. 16 ｜ D. 20 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：半弦 =√(100−36)=8，弦长 16。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n同弧圆周角＝圆心角的一半\n<\/li><li>\n垂径定理：r²=d²+(半弦)²\n<\/li><li>\n直径所对圆周角 90°\n<\/ul>", "ch02": "<h1>第 2 章：直线与圆的位置关系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用圆心距判断相交、相切、相离\n<\/li><li>\n作切线并证明切线垂直于半径\n<\/li><li>\n使用切线长相等\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>位置关系只看一个数：圆心到直线的距离 d 与半径 r 比大小。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 三种位置关系<\/h3>\n<p>设圆心到直线的距离为 d：<\/p>\n<ul><li>\nd&lt;r：相交，两个公共点（割线）；\n<\/li><li>\nd=r：相切，一个公共点（切线）；\n<\/li><li>\nd&gt;r：相离，没有公共点。\n<\/ul>\n<h3>2.2 切线的性质与判定<\/h3>\n<p><strong>性质<\/strong>：圆的切线垂直于过切点的半径。<\/p>\n<p><strong>判定<\/strong>：过半径外端且垂直于这条半径的直线是切线。<\/p>\n<p>证明切线常走的路：连半径、证垂直。<\/p>\n<h3>2.3 切线长定理<\/h3>\n<p>从圆外一点引两条切线，两条切线长相等，且该点与圆心的连线平分两切线的夹角。<\/p>\n<h3>2.4 三角形与圆<\/h3>\n<p>三角形内切圆的圆心是三条角平分线的交点（内心），到三边距离相等；外接圆圆心是三边垂直平分线的交点（外心），到三顶点距离相等。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：切线像贴着圆滚过去的一条直线，只碰一下就离开。<\/p>\n<p><strong>失效边界<\/strong>：切线只与圆有一个公共点，但“只有一个公共点”的直线未必是切线（在曲线情形下要小心）。<\/p>\n<p><strong>实例<\/strong>：圆半径 4，圆心到直线距离 4，则直线与圆相切。 从圆外一点 P 引两条切线，切点为 A、B，若 PA=6，则 PB=6，且 OP 平分 ∠APB。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 直线与圆有一个公共点就是切线 —— 实际上 对圆成立，对一般曲线不成立；判定切线仍要证垂直。\n<\/li><li>\n别以为 切线与半径只是相交 —— 实际上 切线垂直于半径，是特殊的垂直关系，不是随便相交。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：\n<\/li><li>\n圆的切线具有的性质是：\n<p>A. 相交 ｜ B. 相切 ｜ C. 相离 ｜ D. 无法判断 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：d=5&gt;r=3，相离。 A. 平行于半径 ｜ B. 垂直于过切点的半径 ｜ C. 过圆心 ｜ D. 与直径重合 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：切线垂直于过切点的半径，这是切线的核心性质。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nd&lt;r 相交，d=r 相切，d&gt;r 相离\n<\/li><li>\n切线⊥过切点的半径\n<\/li><li>\n圆外一点的两条切线长相等\n<\/ul>", "ch03": "<h1>第 3 章：比例线段与圆内接四边形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、相似三角形\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用相交弦定理求线段\n<\/li><li>\n用切割线定理求切线长\n<\/li><li>\n使用圆内接四边形对角互补\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>圆里的比例关系全部来自相似三角形：把圆上的点连起来，就能找到成比例的边。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 相交弦定理<\/h3>\n<p>两条弦 AB、CD 交于圆内一点 P，则<\/p>\n<p>PA·PB=PC·PD<\/p>\n<p>证明：连接 AC、BD，由同弧所对圆周角相等得两组角相等，△PAC∽△PDB，对应边成比例。<\/p>\n<h3>3.2 切割线定理<\/h3>\n<p>从圆外一点 P 引切线 PT 与割线 PAB，则<\/p>\n<p>PT²=PA·PB<\/p>\n<p>这是相交弦定理的“外点版本”，同样由相似三角形推出。<\/p>\n<h3>3.3 圆内接四边形<\/h3>\n<p>四个顶点都在圆上的四边形叫圆内接四边形，它的对角互补：∠A+∠C=180°，∠B+∠D=180°。<\/p>\n<p>反过来，对角互补的四边形四点共圆，这是判定共圆的常用方法。<\/p>\n<h3>3.4 弦切角<\/h3>\n<p>切线与弦的夹角叫弦切角，它等于所夹弧对的圆周角。这条结论把切线与圆周角连了起来，是许多证明题的桥梁。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：圆像一个“比例转换器”：不论弦怎么放，交点到两端的两段乘积总是定值。<\/p>\n<p><strong>失效边界<\/strong>：定理要求点在圆内（相交弦）或圆外（切割线），位置不同用不同公式，不能混。<\/p>\n<p><strong>实例<\/strong>：弦 AB 与 CD 交于 P，PA=2、PB=6、PC=3，则 PD=PA·PB/PC=12/3=4。 圆外点 P 到圆的切线 PT=6，割线交圆于 A、B 且 PA=4，则 PB=36/4=9。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 相交弦定理可以直接相加 —— 实际上 定理给的是乘积相等，不是长度相加；混淆会算出错误答案。\n<\/li><li>\n别以为 圆内接四边形对角相等 —— 实际上 是对角互补（和为 180°），不是相等。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：\n<\/li><li>\n圆内接四边形 ABCD 中，∠A=70°，则 ∠C 为：\n<p>A. 6 ｜ B. 5 ｜ C. 7 ｜ D. 9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：3×8=4×x，得 x=6。 A. 70° ｜ B. 110° ｜ C. 90° ｜ D. 20° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：对角互补：∠C=180°−70°=110°。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相交弦：PA·PB=PC·PD\n<\/li><li>\n切割线：PT²=PA·PB\n<\/li><li>\n圆内接四边形对角互补\n<\/ul>", "c01": "<h1>同弧所对的角<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>同一段弧上，圆心角是圆周角的两倍，所有圆周角彼此相等。<\/p>\n<h2>为什么重要<\/h2>\n<p>圆里几乎所有求角问题都归结到这一条，是圆的角度体系的总开关。<\/p>\n<h2>详解<\/h2>\n<p>圆心角以圆心为顶点，圆周角以圆上一点为顶点，只要对着同一段弧，就满足“圆周角＝圆心角的一半”。由此推出直径所对圆周角为直角、弦切角等于所夹弧的圆周角。<\/p>\n<h2>常见误解<\/h2>\n<p>把对着不同弧的两个圆周角也当成相等，直接套结论。<\/p>\n<h2>相关概念<\/h2>\n<p>圆周角（ch01）、弦切角（ch03）<\/p>", "c02": "<h1>圆幂<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>过一点作圆的割线或切线，交点到定点的两段长度之积是定值。<\/p>\n<h2>为什么重要<\/h2>\n<p>相交弦定理与切割线定理是同一个“圆幂”的两种情形，统一记忆更省力。<\/p>\n<h2>详解<\/h2>\n<p>点在圆内：PA·PB=PC·PD（两弦）；点在圆外：PT²=PA·PB（切线与割线）；点在圆上：乘积为 0。三种情形可以统一写成“点到圆的幂”。<\/p>\n<h2>常见误解<\/h2>\n<p>把圆内与圆外的公式混用，或把乘积写成和。<\/p>\n<h2>相关概念<\/h2>\n<p>相交弦定理（ch03）、切割线定理（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：圆的基本性质<\/strong><br>阅读：<a href=\"#/book/circle/chapter/ch01\">第 1 章：圆的基本性质<\/a><br>检查点：能由圆周角推出圆心角<\/li><li class='path-step' id='path-02'><strong>步骤 02：直线与圆的位置关系<\/strong><br>阅读：<a href=\"#/book/circle/chapter/ch02\">第 2 章：直线与圆的位置关系<\/a><br>检查点：能用 d 与 r 判断位置关系并作切线<\/li><li class='path-step' id='path-03'><strong>步骤 03：比例线段与圆内接四边形<\/strong><br>阅读：<a href=\"#/book/circle/chapter/ch03\">第 3 章：比例线段与圆内接四边形<\/a><br>检查点：能用相交弦定理求线段长<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：圆的基本性质<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 同弧所对的圆心角为 80°，则圆周角为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 80°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 40°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 160°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 20°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 圆半径为 10，弦心距为 6，则弦长为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 8<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 12<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 16<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：直线与圆的位置关系<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 相交<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 相切<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 相离<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 圆的切线具有的性质是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 平行于半径<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 垂直于过切点的半径<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 过圆心<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 与直径重合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：比例线段与圆内接四边形<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 5<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 7<\/label><label cl
