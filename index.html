}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "椭圆的离心率 e 的取值范围是：", "options": ["(0,1)", "(1,+∞)", "[0,1]", "(0,+∞)"], "answer": 0, "explain": "e=c/a，且 0<c<a，故 0<e<1。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "双曲线 x²/16−y²/9=1 的渐近线是：", "options": ["y=±(3/4)x", "y=±(4/3)x", "y=±(9/16)x", "y=±x"], "answer": 0, "explain": "a=4，b=3，渐近线 y=±(b/a)x=±(3/4)x。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "抛物线 y²=12x 的焦点坐标是：", "options": ["(3,0)", "(6,0)", "(0,3)", "(12,0)"], "answer": 0, "explain": "2p=12，p=6，焦点 (p/2,0)=(3,0)。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "离心率 e=1 对应的圆锥曲线是：", "options": ["椭圆", "双曲线", "抛物线", "圆"], "answer": 2, "explain": "e=1 即到焦点与到准线距离相等，是抛物线。", "relatedConceptId": "c01", "prerequisites": ["ch03"]}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "平行于抛物线对称轴的光线经反射后：", "options": ["原路返回", "过焦点", "平行射出", "发散"], "answer": 1, "explain": "抛物线的光学性质：平行于轴的光线反射后过焦点。", "relatedConceptId": "c01", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "椭圆 x²/36+y²/20=1 的离心率是：", "options": ["2/3", "√2/3", "4/9", "1/3"], "answer": 0, "explain": "a=6，b²=20，c²=36−20=16，c=4，e=c/a=2/3。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "抛物线 x²=−8y 的焦点坐标是：", "options": ["(0,−2)", "(0,2)", "(−2,0)", "(2,0)"], "answer": 0, "explain": "x²=−2py 开口向下，2p=8，p=4，焦点 (0,−p/2)=(0,−2)。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：椭圆」的一句话核心是什么？", "back": "椭圆是“到两定点距离之和为常数”的点集；a 是半长轴，c 是半焦距，b²=a²−c²。", "tags": ["conic-sections", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：双曲线与抛物线」的一句话核心是什么？", "back": "双曲线是“距离之差为常数”，抛物线是“到定点与定直线等距”；前者有渐近线，后者只有一条对称轴。", "tags": ["conic-sections", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：统一定义、光学性质与坐标变换」的一句话核心是什么？", "back": "三条曲线可以合成一句话：到焦点距离与到准线距离之比等于 e。", "tags": ["conic-sections", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「椭圆」？", "back": "到两定点距离之和为常数的点的轨迹。", "tags": ["conic-sections", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「焦点」？", "back": "定义中的定点。", "tags": ["conic-sections", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「半长轴」？", "back": "椭圆中的 a，长轴长为 2a。", "tags": ["conic-sections", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「离心率」？", "back": "e=c/a，描述曲线的形状参数。", "tags": ["conic-sections", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「双曲线」？", "back": "到两定点距离之差为常数的点的轨迹。", "tags": ["conic-sections", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「渐近线」？", "back": "双曲线无限接近但不相交的直线。", "tags": ["conic-sections", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「抛物线」？", "back": "到定点与定直线等距的点的轨迹。", "tags": ["conic-sections", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「准线」？", "back": "统一定义中的定直线。", "tags": ["conic-sections", "术语"]}, {"id": "f12", "chapterId": "ch01", "front": "什么是「通径」？", "back": "过焦点垂直于对称轴的弦。", "tags": ["conic-sections", "术语"]}], "companion": "conic-sections学习伴侣.html", "deriv": "conic-sections从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-19-圆锥曲线 许仲苌 左铨如.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">两点距离、配方<\/span><\/div><h1>第 1 章：椭圆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：两点距离、配方\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n由定义写出椭圆方程\n<\/li><li>\n读出长轴、短轴、焦距、离心率\n<\/li><li>\n判断椭圆的扁平程度\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>椭圆是“到两定点距离之和为常数”的点集；a 是半长轴，c 是半焦距，b²=a²−c²。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 定义<\/h3>\n<p>平面内到两定点 F₁、F₂ 的距离之和等于常数 2a（2a&gt;|F₁F₂|）的点的轨迹叫椭圆。两定点叫焦点，|F₁F₂|=2c。<\/p>\n<p>若 2a=2c，轨迹退化为线段 F₁F₂；若 2a&lt;2c，无轨迹。<\/p>\n<h3>1.2 标准方程<\/h3>\n<p>以焦点在 x 轴上、中心在原点为例：<\/p>\n<p>x²/a²+y²/b²=1，其中 b²=a²−c²<\/p>\n<p>焦点为 (±c,0)，顶点为 (±a,0)、(0,±b)。若焦点在 y 轴上，方程写成 y²/a²+x²/b²=1，焦点 (0,±c)。<\/p>\n<h3>1.3 离心率<\/h3>\n<p>e=c/a，范围 (0,1)。e 越大（越接近 1），c 越接近 a，b 越小，椭圆越扁；e 越小（越接近 0），越接近圆。<\/p>\n<p>e 是描述“扁不扁”的唯一参数，比看方程更直观。<\/p>\n<h3>1.4 常用关系<\/h3>\n<p>椭圆上任意一点到两焦点距离之和恒为 2a；焦点到顶点的距离分别为 a−c 与 a+c；通径（过焦点垂直于长轴的弦）长为 2b²/a。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：椭圆像用两根钉子与一根绳画出的图形：绳长固定，笔尖到两钉距离之和就不变。<\/p>\n<p><strong>失效边界<\/strong>：绳长必须大于两钉距离，否则画不出椭圆（退化为线段或无轨迹）。<\/p>\n<p><strong>实例<\/strong>：x²/25+y²/9=1：a=5，b=3，c=√(25−9)=4，e=4/5=0.8。 焦点 (±4,0)，长轴长 10，短轴长 6。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 a 是长轴长 —— 实际上 a 是半长轴，长轴长是 2a。\n<\/li><li>\n别以为 离心率越大椭圆越圆 —— 实际上 e 越大越扁；e 越小越接近圆。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n椭圆 x²/16+y²/7=1 的焦距是：\n<\/li><li>\n椭圆的离心率 e 的取值范围是：\n<p>A. 6 ｜ B. 3 ｜ C. 9 ｜ D. 18 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：c²=16−7=9，c=3，焦距 2c=6。 A. (0,1) ｜ B. (1,+∞) ｜ C. [0,1] ｜ D. (0,+∞) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：e=c/a，且 0&lt;c&lt;a，故 0&lt;e&lt;1。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n|PF₁|+|PF₂|=2a\n<\/li><li>\nb²=a²−c²；e=c/a∈(0,1)\n<\/li><li>\ne 越大越扁\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：椭圆）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：椭圆<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>椭圆方程不是硬凑的：把“到两点距离之和为常数”写成方程，两次平方消根号，就得到标准形。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>到两定点距离之和为常数（大于两点距离）的点的轨迹叫椭圆。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像用一根绳和两个钉子画图：绳子绷紧，笔尖走的路线就是椭圆。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 定义式<\/h3>\n<div class=\"katex-block\">\\sqrt{(x+c)^{2}+y^{2}}+\\sqrt{(x-c)^{2}+y^{2}}=2a<\/div>\n<p>两次平方消根号，整理即得标准方程。<\/p>\n<h3>2. 标准方程<\/h3>\n<div class=\"katex-block\">\\frac{x^{2}}{a^{2}}+\\frac{y^{2}}{b^{2}}=1<\/div>\n<p>中心在原点、焦点在 x 轴上的椭圆。<\/p>\n<h3>3. 三者关系<\/h3>\n<div class=\"katex-block\">b^{2}=a^{2}-c^{2}<\/div>\n<p>由定义式化简时自然出现，不是额外规定。<\/p>\n<h3>4. 离心率<\/h3>\n<div class=\"katex-block\">e=\\frac{c}{a}\\in(0,1)<\/div>\n<p>描述扁圆程度：e 越大越扁。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>常数必须大于两焦点距离；等于时为线段，小于时不存在。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《圆锥曲线》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-19-圆锥曲线 许仲苌 左铨如.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/conic-sections/chapter/ch01\">第 1 章：椭圆<\/a><\/span><\/div><h1>第 2 章：双曲线与抛物线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出双曲线标准方程与渐近线\n<\/li><li>\n写出抛物线标准方程与准线\n<\/li><li>\n由方程判断曲线类型\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>双曲线是“距离之差为常数”，抛物线是“到定点与定直线等距”；前者有渐近线，后者只有一条对称轴。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 双曲线<\/h3>\n<p>定义：到两定点距离之差的绝对值为常数 2a（2a&lt;2c）的点的轨迹。<\/p>\n<p>标准方程（焦点在 x 轴）：x²/a²−y²/b²=1，其中 b²=c²−a²。<\/p>\n<ul><li>\n焦点 (±c,0)，顶点 (±a,0)；\n<\/li><li>\n渐近线 y=±(b/a)x；\n<\/li><li>\n离心率 e=c/a&gt;1，e 越大开口越“张”。\n<\/ul>\n<h3>2.2 抛物线<\/h3>\n<p>定义：到定点 F 与定直线 l 距离相等的点的轨迹。F 叫焦点，l 叫准线。<\/p>\n<p>标准方程（开口向右）：y²=2px（p&gt;0），焦点 (p/2,0)，准线 x=−p/2。<\/p>\n<p>开口方向由一次项决定：y²=2px 向右，y²=−2px 向左，x²=2py 向上，x²=−2py 向下。<\/p>\n<h3>2.3 三者的区别<\/h3>\n<table><thead><tr><th><\/th><th>定义<\/th><th>方程<\/th><th>离心率<\/th><th>特征线<\/th><\/tr><\/thead><tbody><tr><td>椭圆<\/td><td>距离之和<\/td><td>x²/a²+y²/b²=1<\/td><td>e&lt;1<\/td><td>无渐近线<\/td><\/tr><tr><td>双曲线<\/td><td>距离之差<\/td><td>x²/a²−y²/b²=1<\/td><td>e&gt;1<\/td><td>两条渐近线<\/td><\/tr><tr><td>抛物线<\/td><td>到点＝到线<\/td><td>y²=2px<\/td><td>e=1<\/td><td>一条准线<\/td><\/tr><\/tbody><\/table>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：双曲线像两束手电光的光锥边缘，越远越分开；抛物线像抛出的球走过的路线。<\/p>\n<p><strong>失效边界<\/strong>：双曲线的“差”要取绝对值，否则只得到一支。<\/p>\n<p><strong>实例<\/strong>：x²/9−y²/16=1：a=3，b=4，c=5，e=5/3，渐近线 y=±(4/3)x。 y²=8x：2p=8，p=4，焦点 (2,0)，准线 x=−2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 双曲线只有一支 —— 实际上 取绝对值时为两支；只写“差为 2a”而不取绝对值，只得到靠近某焦点的一支。\n<\/li><li>\n别以为 抛物线的 p 是焦点到准线的距离 —— 实际上 焦点到准线的距离是 p，焦点坐标是 (p/2,0)，准线是 x=−p/2。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n双曲线 x²/16−y²/9=1 的渐近线是：\n<\/li><li>\n抛物线 y²=12x 的焦点坐标是：\n<p>A. y=±(3/4)x ｜ B. y=±(4/3)x ｜ C. y=±(9/16)x ｜ D. y=±x <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：a=4，b=3，渐近线 y=±(b/a)x=±(3/4)x。 A. (3,0) ｜ B. (6,0) ｜ C. (0,3) ｜ D. (12,0) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：2p=12，p=6，焦点 (p/2,0)=(3,0)。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n双曲线：||PF₁|−|PF₂||=2a，b²=c²−a²\n<\/li><li>\n渐近线 y=±(b/a)x\n<\/li><li>\n抛物线 y²=2px：焦点 (p/2,0)，准线 x=−p/2\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：双曲线与抛物线）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：双曲线与抛物线<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>双曲线与抛物线的方程都能由定义直接推出，方法与椭圆相同：写距离式、平方、整理。差别只在“和”变成“差”或“等于到直线的距离”。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>到两定点距离之差为常数（小于两点距离）的轨迹叫双曲线；到定点与定直线等距的轨迹叫抛物线。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>双曲线像两只喇叭背靠背；抛物线像喷泉的水柱轮廓。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 双曲线定义<\/h3>\n<div class=\"katex-block\">\\big||PF_{1}|-|PF_{2}|\\big|=2a<\/div>\n<p>取绝对值才得到两支，否则只有一支。<\/p>\n<h3>2. 标准方程<\/h3>\n<div class=\"katex-block\">\\frac{x^{2}}{a^{2}}-\\frac{y^{2}}{b^{2}}=1<\/div>\n<p>由定义平方化简得到，b²=c²−a²。<\/p>\n<h3>3. 渐近线<\/h3>\n<div class=\"katex-block\">y=\\pm\\frac{b}{a}x<\/div>\n<p>x 很大时曲线无限接近这两条直线。<\/p>\n<h3>4. 抛物线<\/h3>\n<div class=\"katex-block\">y^{2}=2px<\/div>\n<p>到焦点与准线等距，p 是焦点到准线的距离。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>双曲线的常数必须小于两焦点距离；等于时退化为两条射线。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《圆锥曲线》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-19-圆锥曲线 许仲苌 左铨如.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/conic-sections/chapter/ch02\">第 2 章：双曲线与抛物线<\/a><\/span><\/div><h1>第 3 章：统一定义、光学性质与坐标变换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用离心率统一三条曲线\n<\/li><li>\n说出三条曲线的光学性质\n<\/li><li>\n理解坐标变换不改变曲线类型\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>三条曲线可以合成一句话：到焦点距离与到准线距离之比等于 e。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 统一定义<\/h3>\n<p>到定点 F（焦点）的距离与到定直线 l（准线）的距离之比为常数 e 的点的轨迹：<\/p>\n<ul><li>\n0&lt;e&lt;1：椭圆；\n<\/li><li>\ne=1：抛物线；\n<\/li><li>\ne&gt;1：双曲线。\n<\/ul>\n<p>一条定义，三种曲线，e 是分类开关。这也是“圆锥曲线”这个名字的代数解释。<\/p>\n<h3>3.2 光学性质<\/h3>\n<ul><li>\n椭圆：从一个焦点发出的光线经椭圆反射后必过另一焦点；\n<\/li><li>\n抛物线：平行于对称轴的光线经抛物线反射后聚焦于焦点；\n<\/li><li>\n双曲线：射向一个焦点的光线经反射后，反射光线的反向延长线过另一焦点。\n<\/ul>\n<p>这些性质是卫星天线、车灯、光学仪器的设计依据。<\/p>\n<h3>3.3 坐标变换与不变量<\/h3>\n<p>平移坐标轴只改变方程中的常数项，不改变曲线类型；旋转坐标轴可以把含 xy 项的方程化为标准形。<\/p>\n<p>曲线在变换下保持不变的量（如离心率、曲线类型）叫不变量。判断“这是什么曲线”时，先算不变量，比硬配方更快。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：离心率像“调焦旋钮”：拧到小于 1 是椭圆，正好 1 是抛物线，大于 1 是双曲线。<\/p>\n<p><strong>失效边界<\/strong>：统一定义要求准线与焦点对应；不同曲线的准线位置不同，不能混用。<\/p>\n<p><strong>实例<\/strong>：某曲线到焦点 (2,0) 与准线 x=−2 的距离之比为 1，则它是抛物线 y²=8x。 若比值改为 0.5，则是椭圆（需重新计算 a、c）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 光学性质只对抛物线与圆有关 —— 实际上 三条曲线都有反射性质，椭圆与双曲线同样用于光学设计。\n<\/li><li>\n别以为 坐标变换会改变曲线类型 —— 实际上 平移与旋转只改变方程形式，曲线类型与离心率不变。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n离心率 e=1 对应的圆锥曲线是：\n<\/li><li>\n平行于抛物线对称轴的光线经反射后：\n<p>A. 椭圆 ｜ B. 双曲线 ｜ C. 抛物线 ｜ D. 圆 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：e=1 即到焦点与到准线距离相等，是抛物线。 A. 原路返回 ｜ B. 过焦点 ｜ C. 平行射出 ｜ D. 发散 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：抛物线的光学性质：平行于轴的光线反射后过焦点。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n统一：到焦点距离/到准线距离=e\n<\/li><li>\ne&lt;1 椭圆，e=1 抛物线，e&gt;1 双曲线\n<\/li><li>\n平移旋转不改变曲线类型\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：统一定义、光学性质与坐标变换）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：统一定义、光学性质与坐标变换<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>把“到焦点距离”与“到准线距离”作比，三条曲线就被同一个数分开了。这是全书最经济的一步统一。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>离心率 e 是动点到焦点距离与到对应准线距离的比值。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像同一台相机换不同镜头：参数一变，成像的弯曲程度就变。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 统一定义<\/h3>\n<div class=\"katex-block\">\\frac{|PF|}{d(P,l)}=e<\/div>\n<p>一个比值把三种曲线分成三类。<\/p>\n<h3>2. 分类<\/h3>\n<div class=\"katex-block\">0&lt;e<1\\ \\text{椭圆};\\quad e=1\\ \\text{抛物线};\\quad e>1\\ \\text{双曲线}<\/div>\n<p>e 是唯一分类参数。<\/p>\n<h3>3. 抛物线光学<\/h3>\n<div class=\"katex-block\">\\text{平行于轴入射}\\ \\Rightarrow\\ \\text{反射过焦点}<\/div>\n<p>卫星天线与车灯聚光的原理。<\/p>\n<h3>4. 平移不变<\/h3>\n<div class=\"katex-block\">(x-h)^{2}+(y-k)^{2}\\ \\text{型方程只是中心移动}<\/div>\n<p>平移只改位置，不改形状与类型。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>准线必须与焦点配对；写错准线会让比值算错，曲线类型判断随之出错。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《圆锥曲线》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-19-圆锥曲线 许仲苌 左铨如.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/conic-sections/chapter/ch01\">第 1 章：椭圆<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/conic-sections/chapter/ch02\">第 2 章：双曲线与抛物线<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/conic-sections/chapter/ch03\">第 3 章：统一定义、光学性质与坐标变换<\/a><\/span><\/div><h1>离心率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>e=c/a，一个数决定曲线是圆、椭圆、抛物线还是双曲线。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是三条曲线的统一开关，也是判断“扁不扁、张不张”的唯一指标。<\/p>\n<h2>详解<\/h2>\n<p>椭圆 0&lt;e&lt;1，e 越大越扁；抛物线 e=1；双曲线 e&gt;1，e 越大开口越张。用统一定义看，e 就是“到焦点距离与到准线距离之比”。<\/p>\n<h2>常见误解<\/h2>\n<p>把 e 当成斜率或焦距，混淆 c/a 与 c 的含义。<\/p>\n<h2>相关概念<\/h2>\n<p>椭圆（ch01）、统一定义（ch03）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-19-圆锥曲线 许仲苌 左铨如.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/conic-sections/chapter/ch01\">第 1 章：椭圆<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/conic-sections/chapter/ch02\">第 2 章：双曲线与抛物线<\/a><\/span><\/div><h1>a、b、c 的关系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>椭圆是 b²=a²−c²，双曲线是 b²=c²−a²，符号相反。<\/p>\n<h2>为什么重要<\/h2>\n<p>这三者的关系决定焦点位置、顶点坐标与渐近线，写错一处整题皆错。<\/p>\n<h2>详解<\/h2>\n<p>椭圆中 a 最大（a²=b²+c²）；双曲线中 c 最大（c²=a²+b²）。记住“谁最大”就不会写反：椭圆 a 最大，双曲线 c 最大。<\/p>\n<h2>常见误解<\/h2>\n<p>把两个关系式互换，导致焦点坐标或渐近线全错。<\/p>\n<h2>相关概念<\/h2>\n<p>椭圆（ch01）、双曲线（ch02）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：椭圆<\/strong><br>阅读：<a href=\"#/book/conic-sections/chapter/ch01\">第 1 章：椭圆<\/a><br>检查点：能由方程读出 a、b、c、e<\/li><li class='path-step' id='path-02'><strong>步骤 02：双曲线与抛物线<\/strong><br>阅读：<a href=\"#/book/conic-sections/chapter/ch02\">第 2 章：双曲线与抛物线<\/a><br>检查点：能写出渐近线与准线<\/li><li class='path-step' id='path-03'><strong>步骤 03：统一定义、光学性质与坐标变换<\/strong><br>阅读：<a href=\"#/book/conic-sections/chapter/ch03\">第 3 章：统一定义、光学性质与坐标变换<\/a><br>检查点：能用 e 判断曲线类型<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：椭圆<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 椭圆 x²/16+y²/7=1 的焦距是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 9<\/label><label class='quiz-opt'><input type='radio' name='ch01- -term='双曲线'>双曲线 — 到两定点距离之差为常数的点的轨迹。 <span class=glossary-ref>（第 2 章：双曲线与抛物线）<\/span><\/li><li data-term='渐近线'>渐近线 — 双曲线无限接近但不相交的直线。 <span class=glossary-ref>（第 2 章：双曲线与抛物线）<\/span><\/li><li data-term='抛物线'>抛物线 — 到定点与定直线等距的点的轨迹。 <span class=glossary-ref>（第 2 章：双曲线与抛物线）<\/span><\/li><li data-term='准线'>准线 — 统一定义中的定直线。 <span class=glossary-ref>（第 3 章：统一定义、光学性质与坐标变换）<\/span><\/li><li data-term='通径'>通径 — 过焦点垂直于对称轴的弦。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：识曲线三步<\/h2>\n<p>① 看方程次数与符号（两平方项同号为椭圆、异号为双曲线、一次项为抛物线）；② 看谁最大定焦点；③ 算 e 定形状。<\/p>\n<h2>框架：求方程四步<\/h2>\n<p>① 定型（焦点在哪轴）；② 设标准式；③ 用 a、b、c 关系与已知点列方程；④ 解出并写回标准形。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>椭圆<\/td><td>x²/a²+y²/b²=1，b²=a²−c²，e=c/a&lt;1<\/td><\/tr><tr><td>双曲线<\/td><td>x²/a²−y²/b²=1，b²=c²−a²，e=c/a&gt;1<\/td><\/tr><tr><td>渐近线<\/td><td>y=±(b/a)x<\/td><\/tr><tr><td>抛物线<\/td><td>y²=2px，焦点 (p/2,0)，准线 x=−p/2<\/td><\/tr><tr><td>统一定义<\/td><td><\/td><td>PF<\/td><td>/d(P,l)=e<\/td><\/tr><tr><td>通径<\/td><td>2b²/a<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：椭圆", "href": "#/chapter/ch01"}, {"label": "第 2 章：双曲线与抛物线", "href": "#/chapter/ch02"}, {"label": "第 3 章：统一定义、光学性质与坐标变换", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "离心率", "href": "#/concept/c01"}, {"label": "a、b、c 的关系", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：椭圆", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：双曲 "prerequisites": ["ch03"]}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "椭圆 x=3cosθ、y=2sinθ 上点到原点距离的最大值是：", "options": ["3", "2", "√13", "5"], "answer": 0, "explain": "距离平方 9cos²+4sin²=4+5cos²，最大 9，距离最大 3。", "relatedConceptId": "c01", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "极坐标 (4, π) 对应的直角坐标是：", "options": ["(4,0)", "(−4,0)", "(0,4)", "(0,−4)"], "answer": 1, "explain": "x=4cos180°=−4，y=4sin180°=0。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "参数方程 x=2t，y=t²（t∈R）化为普通方程是：", "options": ["y=x²/4", "y=4x²", "y=x²", "x=y²/4"], "answer": 0, "explain": "t=x/2，y=(x/2)²=x²/4。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：极坐标」的一句话核心是什么？", "back": "极坐标用一个距离和一个角定位；同一个点有无穷多组极坐标。", "tags": ["polar-parametric", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：参数方程」的一句话核心是什么？", "back": "参数方程用第三个变量 t（或 θ）同时表示 x 与 y，把曲线变成“随参数运动的一条轨迹”。", "tags": ["polar-parametric", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：互化、范围与最值」的一句话核心是什么？", "back": "换表示是为了好算，不是为了好看；每次换完都要核对范围。", "tags": ["polar-parametric", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「极坐标」？", "back": "用距离与极角表示点的坐标。", "tags": ["polar-parametric", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「极点」？", "back": "极坐标的定点。", "tags": ["polar-parametric", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「极轴」？", "back": "极坐标的基准射线。", "tags": ["polar-parametric", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「互化」？", "back": "极坐标与直角坐标之间的转换。", "tags": ["polar-parametric", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「参数方程」？", "back": "用参数 t 表示 x、y 的方程。", "tags": ["polar-parametric", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「消参」？", "back": "从参数方程消去参数得到普通方程。", "tags": ["polar-parametric", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「离心角」？", "back": "椭圆参数方程中的 θ。", "tags": ["polar-parametric", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「增点」？", "back": "互化或消参后多出来的、不属于原曲线的点。", "tags": ["polar-parametric", "术语"]}], "companion": "polar-parametric学习伴侣.html", "deriv": "polar-parametric从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-20-极坐标与参数方程 赵霖.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">坐标、三角比<\/span><\/div><h1>第 1 章：极坐标<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：坐标、三角比\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把点写成极坐标并互化\n<\/li><li>\n写出圆与直线的极坐标方程\n<\/li><li>\n理解 ρ 可为负的含义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>极坐标用一个距离和一个角定位；同一个点有无穷多组极坐标。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 极坐标的建立<\/h3>\n<p>在平面上取定点 O（极点）与一条射线（极轴），点 P 由距离 ρ=|OP| 与极角 θ（极轴到 OP 的角）确定，记 P(ρ,θ)。<\/p>\n<p>同一个点可以写成 (ρ,θ+2kπ)，也可以写成 (−ρ,θ+π)。所以极坐标不唯一——这是与直角坐标最大的不同。<\/p>\n<h3>1.2 与直角坐标互化<\/h3>\n<p>以极点为原点、极轴为 x 轴正方向：<\/p>\n<p>x=ρcosθ，y=ρsinθ ρ²=x²+y²，tanθ=y/x（x≠0）<\/p>\n<p>互化时要注意象限：仅由 tanθ 定不出 θ，还要看 x、y 的符号。<\/p>\n<h3>1.3 常见曲线的极坐标方程<\/h3>\n<ul><li>\n过极点、倾斜角为 α 的直线：θ=α；\n<\/li><li>\n圆心在极点、半径 r 的圆：ρ=r；\n<\/li><li>\n圆心在 (a,0)、半径 a 的圆：ρ=2a cosθ；\n<\/li><li>\n水平直线 x=a：ρcosθ=a。\n<\/ul>\n<h3>1.4 圆锥曲线的统一方程<\/h3>\n<p>以焦点为极点、对称轴为极轴：<\/p>\n<p>ρ=ep/(1−e cosθ)<\/p>\n<p>e&lt;1 为椭圆，e=1 为抛物线，e&gt;1 为双曲线。同一条公式，三种曲线，这在极坐标下最简洁。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：极坐标像雷达：报“距离多少、方位多少度”，比报“东西多少米、南北多少米”更直观。<\/p>\n<p><strong>失效边界<\/strong>：极点处 θ 任意，极坐标表示不唯一，写方程时要说明 θ 的范围。<\/p>\n<p><strong>实例<\/strong>：点 (2, π/3) 的直角坐标：x=2cos60°=1，y=2sin60°=√3，即 (1,√3)。 直角坐标 (0,3) 的极坐标：ρ=3，θ=π/2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 ρ 必须为正 —— 实际上 ρ 可以为负，此时点在实际方向的相反侧，角度加 π。\n<\/li><li>\n别以为 极坐标与直角坐标一一对应 —— 实际上 极坐标不唯一，一个点有无穷多组表示。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n极坐标 (2, π/2) 对应的直角坐标是：\n<\/li><li>\n圆心在极点、半径为 3 的圆的极坐标方程是：\n<p>A. (2,0) ｜ B. (0,2) ｜ C. (0,−2) ｜ D. (−2,0) <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：x=2cos90°=0，y=2sin90°=2。 A. ρ=3 ｜ B. ρ=6cosθ ｜ C. θ=3 ｜ D. ρ=3cosθ <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：到极点距离恒为 3，即 ρ=3。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nx=ρcosθ，y=ρsinθ；ρ²=x²+y²\n<\/li><li>\n极坐标不唯一，ρ 可为负\n<\/li><li>\n圆锥曲线：ρ=ep/(1−e cosθ)\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：极坐标）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：极坐标<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>极坐标只是换了一套“定位语言”：不用横纵两个距离，而用距离加角度。换算公式就是直角三角形里的三角比。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>极坐标用 (ρ,θ) 表示点，ρ 是到极点的距离，θ 是极轴到该点的角。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像用指南针报位置：往东北方向走 3 公里，比说“向东 2.1 公里、向北 2.1 公里”更自然。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 互化<\/h3>\n<div class=\"katex-block\">x=\\rho\\cos\\theta,\\quad y=\\rho\\sin\\theta<\/div>\n<p>由直角三角形直接得到。<\/p>\n<h3>2. 反解<\/h3>\n<div class=\"katex-block\">\\rho^{2}=x^{2}+y^{2},\\quad \\tan\\theta=\\frac{y}{x}<\/div>\n<p>距离用勾股，角度用正切，注意象限。<\/p>\n<h3>3. 圆的极坐标<\/h3>\n<div class=\"katex-block\">\\rho=2a\\cos\\theta<\/div>\n<p>圆心 (a,0)、半径 a 的圆，过极点。<\/p>\n<h3>4. 圆锥曲线<\/h3>\n<div class=\"katex-block\">\\rho=\\frac{ep}{1-e\\cos\\theta}<\/div>\n<p>以焦点为极点时，三条曲线共用一条公式。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>极点处角度无定义；ρ 为负时要理解成反向延长。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《极坐标与参数方程》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-20-极坐标与参数方程 赵霖.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/polar-parametric/chapter/ch01\">第 1 章：极坐标<\/a><\/span><\/div><h1>第 2 章：参数方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出直线、圆、椭圆的参数方程\n<\/li><li>\n用参数表示运动与位置\n<\/li><li>\n把参数方程化为普通方程\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>参数方程用第三个变量 t（或 θ）同时表示 x 与 y，把曲线变成“随参数运动的一条轨迹”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 直线的参数方程<\/h3>\n<p>过点 (x₀,y₀)、方向向量 (a,b) 的直线：<\/p>\n<p>x=x₀+at，y=y₀+bt<\/p>\n<p>t 是参数，表示沿方向走了多少“份”。若 (a,b) 取单位向量，|t| 就是距离。<\/p>\n<h3>2.2 圆与椭圆<\/h3>\n<p>圆心原点、半径 r 的圆：x=r cosθ，y=r sinθ。<\/p>\n<p>椭圆 x²/a²+y²/b²=1：x=a cosθ，y=b sinθ。<\/p>\n<p>这两个参数方程本质就是三角函数的定义，θ 有明确的几何意义（离心角）。<\/p>\n<h3>2.3 消参<\/h3>\n<p>由 x(t)、y(t) 消去 t 得到普通方程，常用办法：代入消元、用三角恒等式（cos²+sin²=1）、用 t 表示再平方。<\/p>\n<p>消参后必须检查范围：参数 t 的取值限制会变成 x、y 的范围限制，丢掉就会多出曲线的一部分。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：参数方程像给摄像机装了时间轴：每个时刻 t 对应画面上的一个位置。<\/p>\n<p><strong>失效边界<\/strong>：消参可能改变定义域；原来 t≥0 只画半条线，消参后容易画成整条。<\/p>\n<p><strong>实例<\/strong>：x=1+2t，y=3+t。由 t=(x−1)/2 代入得 y=3+(x−1)/2，即 x−2y+5=0。 若限定 t≥0，则只能取 x≥1 的那条射线。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 参数方程与普通方程完全等价 —— 实际上 消参后常扩大定义域，必须补上范围限制。\n<\/li><li>\n别以为 参数 t 就是 x —— 实际上 t 是独立参数，与 x、y 都没有必然相等关系。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆 x²+y²=9 的一个参数方程是：\n<\/li><li>\n参数方程 x=t²，y=t（t≥0）化为普通方程是：\n<p>A. x=3cosθ，y=3sinθ ｜ B. x=9cosθ，y=9sinθ ｜ C. x=3θ，y=3θ ｜ D. x=cosθ，y=sinθ <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：半径 3 的圆，参数方程 x=3cosθ、y=3sinθ。 A. y²=x（x≥0） ｜ B. y²=x（x∈R） ｜ C. y=x² ｜ D. x=y² <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：t=√x≥0，y=√x，平方得 y²=x，且 x≥0。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n直线 x=x₀+at，y=y₀+bt\n<\/li><li>\n圆 x=r cosθ，y=r sinθ；椭圆 x=a cosθ，y=b sinθ\n<\/li><li>\n消参后补范围\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：参数方程）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：参数方程<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>参数方程不是新曲线，只是换一种“描述运动”的方式：给每个时刻 t 一个位置。消参就是把时间轴抹掉。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>用参数 t 表示 x 与 y 的方程叫参数方程，t 的取值范围叫参数范围。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像电影逐帧播放：每一帧（每个 t）对应一个画面位置，连起来就是轨迹。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 直线<\/h3>\n<div class=\"katex-block\">\\begin{cases}x=x_{0}+at\\\\ y=y_{0}+bt\\end{cases}<\/div>\n<p>t 表示沿方向向量走了多少份。<\/p>\n<h3>2. 圆<\/h3>\n<div class=\"katex-block\">\\begin{cases}x=r\\cos\\theta\\\\ y=r\\sin\\theta\\end{cases}<\/div>\n<p>由 cos²+sin²=1 消参即得 x²+y²=r²。<\/p>\n<h3>3. 椭圆<\/h3>\n<div class=\"katex-block\">\\begin{cases}x=a\\cos\\theta\\\\ y=b\\sin\\theta\\end{cases}<\/div>\n<p>消参得 x²/a²+y²/b²=1。<\/p>\n<h3>4. 消参<\/h3>\n<div class=\"katex-block\">\\cos^{2}\\theta+\\sin^{2}\\theta=1<\/div>\n<p>三角参数最常用的消参依据。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>消参后若参数有范围，普通方程必须附带相应的 x、y 限制。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《极坐标与参数方程》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-20-极坐标与参数方程 赵霖.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/polar-parametric/chapter/ch02\">第 2 章：参数方程<\/a><\/span><\/div><h1>第 3 章：互化、范围与最值<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n在三种表示之间自由转换\n<\/li><li>\n用参数方程求最值\n<\/li><li>\n检查互化中的增点与漏点\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>换表示是为了好算，不是为了好看；每次换完都要核对范围。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 三种表示的取舍<\/h3>\n<ul><li>\n直角坐标方程：适合判断形状、求交点、算距离；\n<\/li><li>\n极坐标方程：适合旋转对称、过极点的图形、圆锥曲线统一式；\n<\/li><li>\n参数方程：适合求最值、描述运动、算弧长。\n<\/ul>\n<h3>3.2 用参数求最值<\/h3>\n<p>把曲线上的点写成参数形式，将目标量化为参数的一元函数，再用配方、三角有界性（|sinθ|≤1）求最值。<\/p>\n<p>例：椭圆 x=3cosθ、y=2sinθ 上点到原点距离的平方为 9cos²θ+4sin²θ=4+5cos²θ，最大 9、最小 4。<\/p>\n<h3>3.3 常见增点与漏点<\/h3>\n<ul><li>\n消参时平方：可能把 x&lt;0 的部分也画进来；\n<\/li><li>\n极坐标化直角坐标时两边乘 ρ：ρ=0 的点可能被重复计算；\n<\/li><li>\n直角坐标化极坐标时用 tanθ：可能丢掉第二、三象限的点。\n<\/ul>\n<h3>3.4 检查清单<\/h3>\n<p>换完表示后问三句：定义域变了吗？有没有多出点？有没有漏掉点？<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：三种表示像三种语言描述同一件事，翻译时最容易丢的是“限定条件”。<\/p>\n<p><strong>失效边界<\/strong>：参数方程求最值只在参数范围内有效，超出范围的最值点取不到。<\/p>\n<p><strong>实例<\/strong>：圆 x²+y²=4 上点到直线 x+y−6=0 的距离： 点写成 (2cosθ,2sinθ)，距离 |2cosθ+2sinθ−6|/√2=|2√2 sin(θ+45°)−6|/√2，最大 (6+2√2)/√2≈5.41。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 互化一定等价 —— 实际上 乘 ρ、平方、取正切都可能改变解集，必须检查。\n<\/li><li>\n别以为 参数方程不能求最值 —— 实际上 恰恰相反，参数化后最值问题变成一元函数问题，更好算。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n把 x=cosθ、y=sinθ 消参后得到：\n<\/li><li>\n椭圆 x=3cosθ、y=2sinθ 上点到原点距离的最大值是：\n<p>A. x²+y²=1 ｜ B. x+y=1 ｜ C. y=x ｜ D. x²−y²=1 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：由 cos²θ+sin²θ=1 得 x²+y²=1。 A. 3 ｜ B. 2 ｜ C. √13 ｜ D. 5 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：距离平方 9cos²+4sin²=4+5cos²，最大 9，距离最大 3。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三种表示各有适用场景\n<\/li><li>\n参数化后最值化为一元函数\n<\/li><li>\n互化后查定义域与增减点\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：互化、范围与最值）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：互化、范围与最值<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>换坐标与换参数都只是“换个角度看同一条曲线”。判断换得对不对，只看一件事：点的集合有没有变。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>互化指同一条曲线在不同坐标系或不同表示形式之间的转换。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像同一段路用公里或用英里描述，数值变了，路没变；换算错了就走到别处。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 参数求最值<\/h3>\n<div class=\"katex-block\">d^{2}(\\theta)=x^{2}(\\theta)+y^{2}(\\theta)<\/div>\n<p>把几何最值变成三角函数的最值。<\/p>\n<h3>2. 有界性<\/h3>\n<div class=\"katex-block\">|\\sin\\theta|\\le 1,\\quad |\\cos\\theta|\\le 1<\/div>\n<p>三角参数最值的上界来源。<\/p>\n<h3>3. 极坐标限制<\/h3>\n<div class=\"katex-block\">\\rho\\ge 0,\\ 0\\le\\theta<2\\pi<\/div>\n<p>约定范围后表示才唯一，便于判断增漏点。<\/p>\n<h3>4. 等价条件<\/h3>\n<div class=\"katex-block\">\\text{两表示等价}\\iff\\text{点集相同}<\/div>\n<p>互化是否成功的唯一标准。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>含 ρ、tanθ 的变换不是一一映射，需要按象限或符号分类补齐。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《极坐标与参数方程》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-20-极坐标与参数方程 赵霖.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/polar-parametric/chapter/ch01\">第 1 章：极坐标<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/polar-parametric/chapter/ch02\">第 2 章：参数方程<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/polar-parametric/chapter/ch03\">第 3 章：互化、范围与最值<\/a><\/span><\/div><h1>表示与不变量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>坐标可以换，曲线本身不变；变的是写法，不变的是形状。<\/p>\n<h2>为什么重要<\/h2>\n<p>理解这一点，就不会在互化时把“换了写法”误当成“换了曲线”。<\/p>\n<h2>详解<\/h2>\n<p>直角坐标、极坐标、参数方程描述的是同一批点。互化时保持点集不变才算正确；范围、符号、象限是保持点集不变的关键。<\/p>\n<h2>常见误解<\/h2>\n<p>只看方程形式像不像，不检查点集是否一致。<\/p>\n<h2>相关概念<\/h2>\n<p>极坐标（ch01）、参数方程（ch02）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-20-极坐标与参数方程 赵霖.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/polar-parametric/chapter/ch02\">第 2 章：参数方程<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/polar-parametric/chapter/ch03\">第 3 章：互化、范围与最值<\/a><\/span><\/div><h1>范围限制<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>参数有范围，消参后就必须把这个范围搬到 x、y 上。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是互化题最常见的失分点，也是解析几何“严谨性”的体现。<\/p>\n<h2>详解<\/h2>\n<p>t≥0 只画半条射线；θ∈[0,π] 只画上半圆；平方消参可能引入负半轴。检查办法：取参数范围的端点代入，看对应的 x、y 是否被保留。<\/p>\n<h2>常见误解<\/h2>\n<p>消参后写一个漂亮的整条曲线方程，把范围丢掉了。<\/p>\n<h2>相关概念<\/h2>\n<p>消参（ch02）、增点（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：极坐标<\/strong><br>阅读：<a href=\"#/book/polar-parametric/chapter/ch01\">第 1 章：极坐标<\/a><br>检查点：能把极坐标方程与直角坐标方程互化<\/li><li class='path-step' id='path-02'><strong>步骤 02：参数方程<\/strong><br>阅读：<a href=\"#/book/polar-parametric/chapter/ch02\">第 2 章：参数方程<\/a><br>检查点：能写出常见曲线的参数方程并消参<\/li><li class='path-step' id='path-03'><strong>步骤 03：互化与范围检查<\/strong><br>阅读：<a href=\"#/book/polar-parametric/chapter/ch03\">第 3 章：互化、范围与最值<\/a><br>检查点：能指出消参后丢失的点<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：极坐标<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 极坐标 (2, π/2) 对应的直角坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> (2,0)<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> (0,2)<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> (0,−2)<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> (−2,0)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 圆心在极点、半径为 3 的圆的极坐标方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> ρ=3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> ρ=6cosθ<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> θ=3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> ρ=3cosθ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：参数方程<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 圆 x²+y²=9 的一个参数方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> x=3cosθ，y=3sinθ<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> x=9cosθ，y=9sinθ<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> x=3θ，y=3θ<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> x=cosθ，y=sinθ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 参数方程 x=t²，y=t（t≥0）化为普通方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> y²=x（x≥0）<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> y²=x（x∈R）<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> y=x²<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> x=y²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：互化、范围与最值<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single' data-concept='c01' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 把 x=cosθ、y=sinθ 消参后得到：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> x²+y²=1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> x+y=1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> y=x<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> x²−y²=1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='c01' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 椭圆 x=3cosθ、y=2sinθ 上点到原点距离的最大值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> √13<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q07' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q7.<\/b> 极坐标 (4, π) 对应的直角坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> (4,0)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> (−4,0)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> (0,4)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> (0,−4)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q8.<\/b> 参数方程 x=2t，y=t²（t∈R）化为普通方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> y=x²/4<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> y=4x²<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> y=x²<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> x=y²/4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：极坐标<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 极坐标 (2, π/2) 对应的直角坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> (2,0)<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> (0,2)<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> (0,−2)<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> (−2,0)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 圆心在极点、半径为 3 的圆的极坐标方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> ρ=3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> ρ=6cosθ<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> θ=3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> ρ=3cosθ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：参数方程<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 圆 x²+y²=9 的一个参数方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> x=3cosθ，y=3sinθ<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> x=9cosθ，y=9sinθ<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> x=3θ，y=3θ<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> x=cosθ，y=sinθ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 参数方程 x=t²，y=t（t≥0）化为普通方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> y²=x（x≥0）<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> y²=x（x∈R）<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> y=x²<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> x=y²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：互化、范围与最值<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single' data-concept='c01' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 把 x=cosθ、y=sinθ 消参后得到：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> x²+y²=1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> x+y=1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> y=x<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> x²−y²=1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='c01' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 椭圆 x=3cosθ、y=2sinθ 上点到原点距离的最大值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> √13<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='极坐标'>极坐标 — 用距离与极角表示点的坐标。 <span class=glossary-ref>（第 1 章：极坐标）<\/span><\/li><li data-term='极点'>极点 — 极坐标的定点。 <span class=glossary-ref>（第 1 章：极坐标）<\/span><\/li><li data-term='极轴'>极轴 — 极坐标的基准射线。 <span class=glossary-ref>（第 1 章：极坐标）<\/span><\/li><li data-term='互化'>互化 — 极坐标与直角坐标之间的转换。 <span class=glossary-ref>（第 1 章：极坐标）<\/span><\/li><li data-term='参数方程'>参数方程 — 用参数 t 表示 x、y 的方程。 <span class=glossary-ref>（第 2 章：参数方程）<\/span><\/li><li data-term='消参'>消参 — 从参数方程消去参数得到普通方程。 <span class=glossary-ref>（第 2 章：参数方程）<\/span><\/li><li data-term='离心角'>离心角 — 椭圆参数方程中的 θ。 <span class=glossary-ref>（第 2 章：参数方程）<\/span><\/li><li data-term='增点'>增点 — 互化或消参后多出来的、不属于原曲线的点。 <span class=glossary-ref>（第 3 章：互化、范围与最值）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：选表示三问<\/h2>\n<p>① 图形是否绕极点旋转对称（用极坐标）；② 是否需要求最值或描述运动（用参数）；③ 是否需要判断形状与交点（用直角坐标）。<\/p>\n<h2>框架：互化两步<\/h2>\n<p>① 代公式转换；② 检查点集是否一致（范围、符号、象限）。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>互化<\/td><td>x=ρcosθ，y=ρsinθ；ρ²=x²+y²<\/td><\/tr><tr><td>圆<\/td><td>ρ=r（圆心极点）；ρ=2a cosθ（过极点）<\/td><\/tr><tr><td>圆锥曲线<\/td><td>ρ=ep/(1−e cosθ)<\/td><\/tr><tr><td pterId": "__all__", "type": "single", "question": "方程组 x+y=1，2x+2y=3 的解的情况是：", "options": ["唯一解", "无解", "无穷多解", "零解"], "answer": 1, "explain": "第二式减两倍第一式得 0=1，矛盾，无解。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "矩阵 A=[[1,2],[0,1]] 的行列式是：", "options": ["1", "2", "0", "−1"], "answer": 0, "explain": "1×1−2×0=1。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：消元法与解的判定」的一句话核心是什么？", "back": "消元的目的是化成阶梯形；阶梯形里有几条有效的“非零行”，就有几个独立方程。", "tags": ["linear-systems-matrices", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：行列式与克莱默法则」的一句话核心是什么？", "back": "行列式是一个由方阵算出的数，它不为零就说明方程组有唯一解。", "tags": ["linear-systems-matrices", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：矩阵运算与逆矩阵」的一句话核心是什么？", "back": "矩阵乘法是“行乘列”，不是对应元素相乘；只有方阵才谈逆矩阵。", "tags": ["linear-systems-matrices", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：线性变换与二次型」的一句话核心是什么？", "back": "线性变换就是“用矩阵乘向量”；二次型是“把二次多项式写成 xᵀAx”。", "tags": ["linear-systems-matrices", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「增广矩阵」？", "back": "系数矩阵右侧接上常数项列得到的矩阵。", "tags": ["linear-systems-matrices", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「初等行变换」？", "back": "交换两行、某行乘非零数、某行的倍数加到另一行。", "tags": ["linear-systems-matrices", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「秩」？", "back": "阶梯形中非零行的个数。", "tags": ["linear-systems-matrices", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「自由未知量」？", "back": "无穷多解中可以任意取值的未知量。", "tags": ["linear-systems-matrices", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「行列式」？", "back": "由方阵算出的一个数。", "tags": ["linear-systems-matrices", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「克莱默法则」？", "back": "用行列式表示唯一解的公式。", "tags": ["linear-systems-matrices", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「转置」？", "back": "行列互换得到的矩阵。", "tags": ["linear-systems-matrices", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「逆矩阵」？", "back": "满足 AA⁻¹=E 的矩阵。", "tags": ["linear-systems-matrices", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「线性变换」？", "back": "用矩阵乘法表示的、保持线性结构的映射。", "tags": ["linear-systems-matrices", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「二次型」？", "back": "二次齐次多项式，可写成 xᵀAx。", "tags": ["linear-systems-matrices", "术语"]}], "companion": "linear-systems-matrices学习伴侣.html", "deriv": "linear-systems-matrices从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-21-线性方程组与矩阵 王笃正.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">一次方程组的解法<\/span><\/div><h1>第 1 章：消元法与解的判定<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：一次方程组的解法\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用初等行变换把方程组化为阶梯形\n<\/li><li>\n判断无解、唯一解、无穷多解\n<\/li><li>\n用秩解释解的个数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>消元的目的是化成阶梯形；阶梯形里有几条有效的“非零行”，就有几个独立方程。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 初等行变换<\/h3>\n<p>对方程组做以下三种操作不改变解集：<\/p>\n<ol><li>\n交换两个方程的位置；\n<\/li><li>\n用一个非零数乘某个方程；\n<\/li><li>\n把一个方程的倍数加到另一个方程上。\n<\/ol>\n<p>把系数排成增广矩阵来做，书写更简洁。<\/p>\n<h3>1.2 阶梯形与解的判定<\/h3>\n<p>消元后得到阶梯形。设系数矩阵的秩为 r，增广矩阵的秩为 R，未知数个数为 n：<\/p>\n<ul><li>\nR&gt;r（出现 0=d，d≠0 的行）：无解；\n<\/li><li>\nR=r=n：唯一解；\n<\/li><li>\nR=r&lt;n：无穷多解，有 n−r 个自由未知量。\n<\/ul>\n<p>“秩”就是阶梯形中非零行的个数，即有效方程的个数。<\/p>\n<h3>1.3 齐次方程组<\/h3>\n<p>右端全为零的方程组一定有解（零解）。当 r=n 时只有零解；当 r&lt;n 时有无穷多非零解。<\/p>\n<h3>1.4 解题流程<\/h3>\n<p>写出增广矩阵 → 只用行变换化阶梯形 → 数非零行 → 判断解的情形 → 回代求通解（含自由未知量）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：消元像解谜时不断“消掉一个线索”：每消掉一个未知数，剩下的方程就简单一层。<\/p>\n<p><strong>失效边界<\/strong>：行变换不能乘 0，也不能只改一边（必须整行同时改）。<\/p>\n<p><strong>实例<\/strong>：x+y=3，2x+2y=6。第二行减两倍第一行得 0=0，秩 r=R=1&lt;2，无穷多解，通解 x=3−t，y=t。 若第二式为 2x+2y=7，则得 0=1，无解。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 消元后 0=0 说明解是 0 —— 实际上 0=0 说明那个方程是多余的，解有无穷多个。\n<\/li><li>\n别以为 方程个数少于未知数就一定有无穷多解 —— 实际上 要看秩，还要看是否出现 0=d 的矛盾行。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n增广矩阵化简后出现 0=2 的行，则该方程组：\n<\/li><li>\n三个未知数、系数矩阵秩为 2、增广矩阵秩为 2，则：\n<p>A. 唯一解 ｜ B. 无穷多解 ｜ C. 无解 ｜ D. 无法判断 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：0=2 是矛盾方程，说明方程组无解。 A. 唯一解 ｜ B. 无解 ｜ C. 无穷多解 ｜ D. 零解 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：r=R=2&lt;3，有无穷多解，自由未知量个数 3−2=1。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三种行变换不改变解集\n<\/li><li>\nR&gt;r 无解；R=r=n 唯一；R=r&lt;n 无穷多\n<\/li><li>\n秩＝非零行数\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：消元法与解的判定）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：消元法与解的判定<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>解方程组本质上是在“消去未知数”。矩阵只是把这个过程写成表格，让操作更整齐。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>初等行变换指交换两行、某行乘非零数、某行的倍数加到另一行。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像整理一摞账单：把重复的合并、把某项消掉，最后剩下的条目数就是真实的约束数。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 行变换<\/h3>\n<div class=\"katex-block\">R_{i}\\leftarrow R_{i}+kR_{j}<\/div>\n<p>把一行的倍数加到另一行，解集不变。<\/p>\n<h3>2. 阶梯形<\/h3>\n<div class=\"katex-block\">\\text{非零行数}=r=\\text{rank}(A)<\/div>\n<p>秩就是有效约束的个数。<\/p>\n<h3>3. 无解判据<\/h3>\n<div class=\"katex-block\">\\text{rank}(A)<\\text{rank}(A|b)<\/div>\n<p>增广矩阵秩更大，说明出现矛盾行。<\/p>\n<h3>4. 无穷多解<\/h3>\n<div class=\"katex-block\">\\text{rank}(A)=\\text{rank}(A|b)&lt;n<\/div>\n<p>有效方程少于未知数，存在自由未知量。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>只能用行变换，不能用列变换（列变换会改变未知数的对应关系）。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《线性方程组与矩阵》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-21-线性方程组与矩阵 王笃正.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/linear-systems-matrices/chapter/ch01\">第 1 章：消元法与解的判定<\/a><\/span><\/div><h1>第 2 章：行列式与克莱默法则<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n计算二、三阶行列式\n<\/li><li>\n用行列式性质化简\n<\/li><li>\n用克莱默法则解方程组\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>行列式是一个由方阵算出的数，它不为零就说明方程组有唯一解。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 二阶与三阶行列式<\/h3>\n<p>二阶：|a b; c d|=ad−bc。<\/p>\n<p>三阶用对角线法则（沙路法则）：主对角线三项相加，副对角线三项相减。<\/p>\n<h3>2.2 行列式的性质<\/h3>\n<ul><li>\n交换两行，行列式变号；\n<\/li><li>\n某行乘 k，行列式乘 k；\n<\/li><li>\n某行的倍数加到另一行，行列式不变；\n<\/li><li>\n两行相同或成比例，行列式为 0。\n<\/ul>\n<p>用这些性质把行列式化成上三角形，再对角相乘，比直接展开快得多。<\/p>\n<h3>2.3 克莱默法则<\/h3>\n<p>对 n 元线性方程组，若系数行列式 D≠0，则方程组有唯一解：<\/p>\n<p>x_i=D_i/D<\/p>\n<p>其中 D_i 是把 D 的第 i 列换成常数项后得到的行列式。<\/p>\n<p>D=0 时法则失效，要回到消元法判断是无解还是无穷多解。<\/p>\n<h3>2.4 几何意义<\/h3>\n<p>二阶行列式的绝对值等于两行向量张成的平行四边形面积；三阶行列式的绝对值等于平行六面体体积。这解释了“行列式为 0 表示退化”。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：行列式像一张“面积标尺”：它为 0 说明两条边共线，图形被压扁了。<\/p>\n<p><strong>失效边界<\/strong>：克莱默法则只在 D≠0 时可用；D=0 时不能说“无解”。<\/p>\n<p><strong>实例<\/strong>：解 x+y=3，x−y=1。D=|1 1; 1 −1|=−2，D₁=|3 1; 1 −1|=−4，D₂=|1 3; 1 1|=−2，故 x=2，y=1。 验证：2+1=3，2−1=1，正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 行列式为 0 就是无解 —— 实际上 可能无解，也可能无穷多解，要再看增广矩阵的秩。\n<\/li><li>\n别以为 三阶行列式可以用对角线法则推广到四阶 —— 实际上 对角线法则只适用于二阶、三阶，四阶以上必须按行展开或化三角形。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n行列式 |2 1; 3 4| 的值是：\n<\/li><li>\n克莱默法则适用的前提是：\n<p>A. 5 ｜ B. 11 ｜ C. 8 ｜ D. −5 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：2×4−1×3=8−3=5。 A. 系数行列式不为零 ｜ B. 常数项全为零 ｜ C. 方程个数多于未知数 ｜ D. 系数全为正 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：D≠0 时方程组有唯一解，才能用 x_i=D_i/D。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二阶 ad−bc；三阶对角线法则\n<\/li><li>\n换行变号、某行乘 k 值乘 k\n<\/li><li>\n克莱默法则要求 D≠0\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：行列式与克莱默法则）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：行列式与克莱默法则<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>行列式不是凭空定义的符号游戏：它就是“线性变换把面积放大多少倍”的那个倍数。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>行列式是由方阵元素按特定规则算出的一个数，记作 |A| 或 det A。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像一张纸被拉伸后的面积变化倍数：倍数为 0 说明纸被压成一条线。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 二阶<\/h3>\n<div class=\"katex-block\">\\begin{vmatrix}a&b\\\\ c&d\\end{vmatrix}=ad-bc<\/div>\n<p>主对角积减副对角积。<\/p>\n<h3>2. 三阶<\/h3>\n<div class=\"katex-block\">\\begin{vmatrix}a_{1}&b_{1}&c_{1}\\\\ a_{2}&b_{2}&c_{2}\\\\ a_{3}&b_{3}&c_{3}\\end{vmatrix}<\/div>\n<p>对角线法则：三条主对角线和减三条副对角线和。<\/p>\n<h3>3. 克莱默<\/h3>\n<div class=\"katex-block\">x_{i}=\\frac{D_{i}}{D}\\quad(D\\ne 0)<\/div>\n<p>把第 i 列换成常数项，再除以系数行列式。<\/p>\n<h3>4. 几何意义<\/h3>\n<div class=\"katex-block\">|\\det A|=S_{\\text{平行四边形}}<\/div>\n<p>二阶行列式的绝对值是两向量张成的面积。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>只有方阵才有行列式；非方阵没有。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《线性方程组与矩阵》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-21-线性方程组与矩阵 王笃正.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/linear-systems-matrices/chapter/ch02\">第 2 章：行列式与克莱默法则<\/a><\/span><\/div><h1>第 3 章：矩阵运算与逆矩阵<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n完成矩阵加法、数乘、乘法\n<\/li><li>\n判断乘法是否可行\n<\/li><li>\n求二阶矩阵的逆\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>矩阵乘法是“行乘列”，不是对应元素相乘；只有方阵才谈逆矩阵。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 加法与数乘<\/h3>\n<p>同型矩阵才能相加：对应元素相加。数乘是每个元素都乘这个数。<\/p>\n<h3>3.2 乘法<\/h3>\n<p>A(m×n) 乘 B(n×p) 才有意义，结果 C 是 m×p，其中<\/p>\n<p>c_ij=Σ a_ik b_kj<\/p>\n<p>即“A 的第 i 行与 B 的第 j 列对应相乘再相加”。乘法的顺序不能交换，AB≠BA 一般成立。<\/p>\n<h3>3.3 转置与逆矩阵<\/h3>\n<p>转置把行换成列，记 Aᵀ。(AB)ᵀ=BᵀAᵀ，顺序要反过来。<\/p>\n<p>逆矩阵 A⁻¹ 满足 AA⁻¹=A⁻¹A=E（单位矩阵）。对二阶矩阵：<\/p>\n<p>A=[[a,b],[c,d]]，A⁻¹=1/(ad−bc)·[[d,−b],[−c,a]]<\/p>\n<p>前提是 ad−bc≠0，即行列式不为零。<\/p>\n<h3>3.4 用逆矩阵解方程组<\/h3>\n<p>AX=B 且 A 可逆时，X=A⁻¹B。这与“除法”类似，但矩阵没有除法，只有逆。<\/p>\n<h3>3.5 初等变换求逆<\/h3>\n<p>把 [A|E] 用行变换化成 [E|A⁻¹]，是求逆的通法，比记公式更通用。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：矩阵乘法像流水线的接力：第一道工序的输出正好是第二道工序的输入，所以中间尺寸必须对上。<\/p>\n<p><strong>失效边界<\/strong>：A、B 都可乘不代表 BA 也可乘；尺寸不对就不能乘。<\/p>\n<p><strong>实例<\/strong>：A=[[1,2],[3,4]]，B=[[0,1],[1,0]]。AB=[[2,1],[4,3]]，BA=[[3,4],[1,2]]，两者不同，验证乘法不可交换。 A 的行列式 1×4−2×3=−2，A⁻¹=(1/−2)[[4,−2],[−3,1]]=[[−2,1],[1.5,−0.5]]。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 矩阵乘法就是对应元素相乘 —— 实际上 那是哈达玛积，不是矩阵乘法；矩阵乘法是行乘列求和。\n<\/li><li>\n别以为 所有矩阵都有逆 —— 实际上 只有行列式不为零的方阵才可逆。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nA 是 2×3 矩阵，B 是 3×4 矩阵，则 AB 是：\n<\/li><li>\n二阶矩阵 A 可逆的条件是：\n<p>A. 2×4 ｜ B. 3×3 ｜ C. 4×2 ｜ D. 不能相乘 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：内维相同（3=3），结果为 2×4。 A. 元素都非零 ｜ B. 行列式不为零 ｜ C. 是对称矩阵 ｜ D. 对角线元素相等 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：A⁻¹ 的分母是 ad−bc，必须非零。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nA(m×n)·B(n×p)=C(m×p)\n<\/li><li>\nAB≠BA\n<\/li><li>\nA⁻¹=adj(A)/|A|，要求 |A|≠0\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：矩阵运算与逆矩阵）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：矩阵运算与逆矩阵<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>矩阵乘法看起来奇怪，是因为它表示“连续做两次线性变换”。行乘列就是“第 i 个输出与第 j 个输入的耦合”。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>矩阵是按矩形排列的数表；矩阵乘法定义为行与列对应相乘再求和。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像多人协作的分工表：A 的第 i 行是任务分配，B 的第 j 列是资源清单，乘积就是总消耗。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 乘法<\/h3>\n<div class=\"katex-block\">c_{ij}=\\sum_{k}a_{ik}b_{kj}<\/div>\n<p>行乘列求和，是矩阵运算的核心。<\/p>\n<h3>2. 转置性质<\/h3>\n<div class=\"katex-block\">(AB)^{\\top}=B^{\\top}A^{\\top}<\/div>\n<p>转置后顺序反转，这一步最容易写错。<\/p>\n<h3>3. 二阶逆<\/h3>\n<div class=\"katex-block\">A^{-1}=\\frac{1}{ad-bc}\\begin{bmatrix}d&-b\\\\ -c&a\\end{bmatrix}<\/div>\n<p>主对角互换、副对角变号，再除以行列式。<\/p>\n<h3>4. 解方程组<\/h3>\n<div class=\"katex-block\">AX=B\\ \\Rightarrow\\ X=A^{-1}B<\/div>\n<p>系数矩阵可逆时，直接用逆矩阵求解。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>乘法只在“前一个的列数＝后一个的行数”时才有定义。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《线性方程组与矩阵》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch04": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-21-线性方程组与矩阵 王笃正.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/linear-systems-matrices/chapter/ch03\">第 3 章：矩阵运算与逆矩阵<\/a><\/span><\/div><h1>第 4 章：线性变换与二次型<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用矩阵表示线性变换\n<\/li><li>\n理解旋转、伸缩、反射的矩阵形式\n<\/li><li>\n知道二次型可用矩阵表示\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>线性变换就是“用矩阵乘向量”；二次型是“把二次多项式写成 xᵀAx”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 线性变换<\/h3>\n<p>把平面上的点 (x,y) 映到 (x&#x27;,y&#x27;)，若规则是线性的，就可以写成：<\/p>\n<p>[x&#x27;; y&#x27;]=A[x; y]<\/p>\n<p>常见变换的矩阵：<\/p>\n<ul><li>\n绕原点旋转 θ：[[cosθ,−sinθ],[sinθ,cosθ]]；\n<\/li><li>\n沿 x 方向伸缩 k 倍：[[k,0],[0,1]]；\n<\/li><li>\n关于 x 轴对称：[[1,0],[0,−1]]。\n<\/ul>\n<p>变换的复合对应矩阵相乘，顺序与作用顺序相反（先作用 B 再作用 A，写成 AB）。<\/p>\n<h3>4.2 二次型<\/h3>\n<p>形如 ax²+bxy+cy² 的二次齐次多项式叫二次型，可写成：<\/p>\n<p>[x y]·[[a,b/2],[b/2,c]]·[x;y]ᵀ<\/p>\n<p>中间的对称矩阵叫二次型的矩阵。注意交叉项系数要除以 2，这是最常见的错误。<\/p>\n<h3>4.3 用变换化简二次型<\/h3>\n<p>通过适当的坐标旋转，可以把含 xy 项的二次型化成只有平方项的标准形，标准形中的系数决定曲线类型（椭圆、双曲线、抛物线）。这正是《圆锥曲线》里“坐标变换不改变类型”的代数解释。<\/p>\n<h3>4.4 与前面章节的联结<\/h3>\n<p>消元法处理方程组，行列式判断可逆性，矩阵乘法表示变换，二次型表示曲线——四章合起来是一套语言，而不是四个孤立工具。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：线性变换像给一张透明的方格纸做拉伸、旋转、翻转，方格仍然是方格，只是形状变了。<\/p>\n<p><strong>失效边界<\/strong>：只有线性规则（过原点的直线仍映成直线）才能用矩阵表示；平移不是线性变换（要用仿射变换）。<\/p>\n<p><strong>实例<\/strong>：把点 (1,0) 绕原点旋转 90°：[[0,−1],[1,0]]·[1;0]=[0;1]，得到 (0,1)，正确。 二次型 x²+4xy+y² 的矩阵是 [[1,2],[2,1]]，交叉项 4xy 对应 2 与 2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 平移也能用 2×2 矩阵表示 —— 实际上 2×2 矩阵只能表示过原点的线性变换；平移需要加一维（仿射）。\n<\/li><li>\n别以为 二次型矩阵的交叉项系数直接填 b —— 实际上 应填 b/2，两处各一半，乘出来才是 bxy。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n绕原点旋转 90° 的变换矩阵是：\n<\/li><li>\n二次型 2x²+6xy+5y² 的矩阵中，第一行第二列的元素是：\n<p>A. [[1,0],[0,1]] ｜ B. [[0,−1],[1,0]] ｜ C. [[0,1],[1,0]] ｜ D. [[−1,0],[0,1]] <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：cos90°=0，sin90°=1，代入旋转矩阵得 [[0,−1],[1,0]]。 A. 6 ｜ B. 3 ｜ C. 1.5 ｜ D. 5 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：交叉项系数 6 要除以 2，故填 3。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线性变换＝矩阵乘向量\n<\/li><li>\n复合的顺序与矩阵乘积顺序相反\n<\/li><li>\n二次型交叉项系数要除以 2\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：线性变换与二次型）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：线性变换与二次型<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>矩阵乘法最初就是从“变换坐标”这件事里长出来的：把变换写成一个数表，作用一次就乘一次。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>线性变换指保持加法与数乘的映射；二次型指二次齐次多项式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像用模具压形状：同一个模具（矩阵）压不同的原料（向量），得到成比例的结果。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 变换<\/h3>\n<div class=\"katex-block\">\\mathbf{x}'=A\\mathbf{x}<\/div>\n<p>矩阵乘向量，得到变换后的坐标。<\/p>\n<h3>2. 旋转<\/h3>\n<div class=\"katex-block\">\\begin{bmatrix}\\cos\\theta&-\\sin\\theta\\\\ \\sin\\theta&\\cos\\theta\\end{bmatrix}<\/div>\n<p>绕原点逆时针旋转 θ 的标准矩阵。<\/p>\n<h3>3. 二次型<\/h3>\n<div class=\"katex-block\">Q=x^{\\top}Ax,\\quad A=A^{\\top}<\/div>\n<p>对称矩阵表示二次型，交叉项系数减半。<\/p>\n<h3>4. 复合<\/h3>\n<div class=\"katex-block\">A(B\\mathbf{x})=(AB)\\mathbf{x}<\/div>\n<p>连续变换对应矩阵相乘，顺序不能颠倒。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>矩阵表示只覆盖线性（过原点）的变换；平移必须另加常数项。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《线性方程组与矩阵》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-21-线性方程组与矩阵 王笃正.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/linear-systems-matrices/chapter/ch01\">第 1 章：消元法与解的判定<\/a><\/span><\/div><h1>秩与解的个数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>秩是有效方程的个数；它和未知数个数的比较决定解的情形。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“解几个”这个模糊问题变成数数，是线性代数的第一把尺子。<\/p>\n<h2>详解<\/h2>\n<p>消元化阶梯形后数非零行。R&gt;r 无解；R=r=n 唯一解；R=r&lt;n 无穷多解。齐次方程组必有零解，r&lt;n 时还有非零解。<\/p>\n<h2>常见误解<\/h2>\n<p>把“方程个数”直接当成秩，忽略有些方程是多余的。<\/p>\n<h2>相关概念<\/h2>\n<p>消元（ch01）、行列式（ch02）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-21-线性方程组与矩阵 王笃正.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/linear-systems-matrices/chapter/ch03\">第 3 章：矩阵运算与逆矩阵<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/linear-systems-matrices/chapter/ch04\">第 4 章：线性变换与二次型<\/a><\/span><\/div><h1>矩阵乘法与不可交换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>行乘列求和；AB 与 BA 一般不同，顺序有意义。<\/p>\n<h2>为什么重要<\/h2>\n<p>矩阵乘法代表“连续变换”，顺序换了解释就变了，这是线性代数的核心特性。<\/p>\n<h2>详解<\/h2>\n<p>c_ij=Σa_ik b_kj。乘法要求内维相同。转置满足 (AB)ᵀ=BᵀAᵀ。逆矩阵只在方阵且行列式非零时存在，A⁻¹=adj(A)/|A|。<\/p>\n<h2>常见误解<\/h2>\n<p>按对应元素相乘，或随意交换乘法顺序。<\/p>\n<h2>相关概念<\/h2>\n<p>矩阵运算（ch03）、线性变换（ch04）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：消元法与解的判定<\/strong><br>阅读：<a href=\"#/book/linear-systems-matrices/chapter/ch01\">第 1 章：消元法与解的判定<\/a><br>检查点：能说出方程组是无解、唯一解还是无穷多解<\/li><li class='path-step' id='path-02'><strong>步骤 02：行列式与克莱默法则<\/strong><br>阅读：<a href=\"#/book/linear-systems-matrices/chapter/ch02\">第 2 章：行列式与克莱默法则<\/a><br>检查点：能算三阶行列式并解二元、三元方程组<\/li><li class='path-step' id='path-03'><strong>步骤 03：矩阵运算与逆矩阵<\/strong><br>阅读：<a href=\"#/book/linear-systems-matrices/chapter/ch03\">第 3 章：矩阵运算与逆矩阵<\/a><br>检查点：能完成矩阵乘法与二阶逆矩阵的求法<\/li><li class='path-step' id='path-04'><strong>步骤 04：线性变换与二次型<\/strong><br>阅读：<a href=\"#/book/linear-systems-matrices/chapter/ch04\">第 4 章：线性变换与二次型<\/a><br>检查点：能用矩阵表示一个线性变换<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：消元法与解的判定<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 增广矩阵化简后出现 0=2 的行，则该方程组：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 唯一解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 无穷多解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 无解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 三个未知数、系数矩阵秩为 2、增广矩阵秩为 2，则：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 唯一解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 无解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 无穷多解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 零解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：行列式与克莱默法则<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 行列式 |2 1; 3 4| 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 5<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 11<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 8<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> −5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 克莱默法则适用的前提是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 系数行列式不为零<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 常数项全为零<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 方程个数多于未知数<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 系数全为正<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：矩阵运算与逆矩阵<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> A 是 2×3 矩阵，B 是 3×4 矩阵，则 AB 是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 2×4<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 3×3<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 4×2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 不能相乘<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 二阶矩阵 A 可逆的条件是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 元素都非零<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 行列式不为零<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 是对称矩阵<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 对角线元素相等<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 4 章：线性变换与二次型<\/h2><div class='quiz-item' data-qid='ch04-q07' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 绕原点旋转 90° 的变换矩阵是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> [[1,0],[0,1]]<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> [[0,−1],[1,0]]<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> [[0,1],[1,0]]<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> [[−1,0],[0,1]]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 二次型 2x²+6xy+5y² 的矩阵中，第一行第二列的元素是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> 1.5<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> 5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q09' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q9.<\/b> 方程组 x+y=1，2x+2y=3 的解的情况是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 唯一解<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 无解<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 无穷多解<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 零解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q10.<\/b> 矩阵 A=[[1,2],[0,1]] 的行列式是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 0<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> −1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：消元法与解的判定<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 增广矩阵化简后出现 0=2 的行，则该方程组：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 唯一解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 无穷多解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 无解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 三个未知数、系数矩阵秩为 2、增广矩阵秩为 2，则：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 唯一解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 无解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 无穷多解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 零解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：行列式与克莱默法则<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='' da pt='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 二阶矩阵 A 可逆的条件是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 元素都非零<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 行列式不为零<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 是对称矩阵<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 对角线元素相等<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：线性变换与二次型<\/h1><div class='quiz-item' data-qid='ch04-q07' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 绕原点旋转 90° 的变换矩阵是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> [[1,0],[0,1]]<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> [[0,−1],[1,0]]<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> [[0,1],[1,0]]<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> [[−1,0],[0,1]]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 二次型 2x²+6xy+5y² 的矩阵中，第一行第二列的元素是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> 1.5<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> 5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='增广矩阵'>增广矩阵 — 系数矩阵右侧接上常数项列得到的矩阵。 <span class=glossary-ref>（第 1 章：消元法与解的判定）<\/span><\/li><li data-term='初等行变换'>初等行变换 — 交换两行、某行乘非零数、某行的倍数加到另一行。 <span class=glossary-ref>（第 1 章：消元法与解的判定）<\/span><\/li><li data-term='秩'>秩 — 阶梯形中非零行的个数。 <span class=glossary-ref>（第 1 章：消元法与解的判定）<\/span><\/li><li data-term='自由未知量'>自由未知量 — 无穷多解中可以任意取值的未知量。 <span class=glossary-ref>（第 1 章：消元法与解的判定）<\/span><\/li><li data-term='行列式'>行列式 — 由方阵算出的一个数。 <span class=glossary-ref>（第 2 章：行列式与克莱默法则）<\/span><\/li><li data-term='克莱默法则'>克莱默法则 — 用行列式表示唯一解的公式。 <span class=glossary-ref>（第 2 章：行列式与克莱默法则）<\/span><\/li><li data-term='转置'>转置 — 行列互换得到的矩阵。 <span class=glossary-ref>（第 3 章：矩阵运算与逆矩阵）<\/span><\/li><li data-term='逆矩阵'>逆矩阵 — 满足 AA⁻¹=E 的矩阵。 <span class=glossary-ref>（第 3 章：矩阵运算与逆矩阵）<\/span><\/li><li data-term='线性变换'>线性变换 — 用矩阵乘法表示的、保持线性结构的映射。 <span class=glossary-ref>（第 4 章：线性变换与二次型）<\/span><\/li><li data-term='二次型'>二次型 — 二次齐次多项式，可写成 xᵀAx。 <span class=glossary-ref>（第 4 章：线性变换与二次型）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：解方程组四步<\/h2>\n<p>写增广矩阵 → 行变换化阶梯形 → 数秩判解 → 回代写通解。<\/p>\n<h2>框架：矩阵题先查尺寸<\/h2>\n<p>加法要同型，乘法要内维相等，求逆要方阵且行列式非零。三句查完再动笔。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>解的判定<\/td><td>R&gt;r 无解；R=r=n 唯一；R=r&lt;n 无穷多<\/td><\/tr><tr><td>二阶行列式<\/td><td>ad−bc<\/td><\/tr><tr><td>克莱默<\/td><td>x_i=D_i/D，D≠0<\/td><\/tr><tr><td>矩阵乘法<\/td><td>c_ij=Σa_ik b_kj<\/td><\/tr><tr><td>二阶逆<\/td><td>adj(A)/<\/td><td>A<\/td><td>，主对调副变号<\/td><\/tr><tr><td>二次型矩阵<\/td><td>交叉项系数除以 2<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：消元法与解的判定", "href": "#/chapter/ch01"}, {"label": "第 2 章：行列式与克莱默法则", "href": "#/chapter/ch02"}, {"label": "第 3 章：矩阵运算与逆矩阵", "href": "#/chapter/ch03"}, {"label": "第 4 章：线性变换与二次型", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "秩与解的个数", "href": "#/concept/c01"}, {"label": "矩阵乘法与不可交换", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：消元法与解的判定", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：行列式与克莱默法则", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：矩阵运算与逆矩阵", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：线性变换与二次型", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true, "ch04": true}},"calculus-intro":{"manifest": {"slug": "calculus-intro", "title": "微积分初步", "subtitle": "从实数到极限：瞬时变化的数学", "book": {"title": "微积分初步", "author": "高国士", "source": ["数学基础知识丛书-22-微积分初步 高国士.pdf"]}, "audience": "零基础", "goal": "理解实数与极限、连续与导数、微分与积分的基本概念与计算方法，能用导数研究单调与极值，会用定积分求面积。", "learningPath": [{"step": "01", "title": "实数与极限", "chapterIds": ["ch01"], "checkpoint": "能用 ε-N
