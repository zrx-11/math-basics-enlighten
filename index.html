ns": ["计算是否正确", "是否有增点或漏点", "图形是否美观", "坐标是否为整数"], "answer": 1, "explain": "检验是查完备性与纯粹性，即有没有多算或漏算的点。", "relatedConceptId": "c02", "prerequisites": ["ch02"]}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "到两定点距离相等的点的轨迹是：", "options": ["圆", "椭圆", "两定点的中垂线", "抛物线"], "answer": 2, "explain": "到两点等距的点集就是这两点连线的垂直平分线。", "relatedConceptId": "c02", "prerequisites": ["ch02"]}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "到定点距离等于定值的点的轨迹是：", "options": ["直线", "圆", "椭圆", "抛物线"], "answer": 1, "explain": "这正是圆的定义。", "relatedConceptId": "", "prerequisites": ["ch03"]}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "到两定点距离之差为常数（小于两点距离）的轨迹是：", "options": ["椭圆", "双曲线的一支或两支", "圆", "直线"], "answer": 1, "explain": "差为常数对应双曲线；取绝对值时为两支，不取绝对值时为靠近某定点的一支。", "relatedConceptId": "", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "“a>1”是“a>0”的：", "options": ["充分不必要条件", "必要不充分条件", "充要条件", "既不充分也不必要"], "answer": 0, "explain": "a>1 必有 a>0；a>0 推不出 a>1。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "求轨迹时忽略检验，最可能导致：", "options": ["计算变慢", "多算或漏算点", "图形画错", "方程次数变高"], "answer": 1, "explain": "检验就是查完备性与纯粹性，省掉会出现增点或漏点。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：命题与充分必要条件」的一句话核心是什么？", "back": "若 p 成立必有 q 成立，则 p 是 q 的充分条件，q 是 p 的必要条件。", "tags": ["locus", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：求轨迹的五步法」的一句话核心是什么？", "back": "求轨迹＝把几何条件翻译成方程，再用原条件回头验一遍。", "tags": ["locus", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：常见轨迹与空间轨迹」的一句话核心是什么？", "back": "记住五种定义型轨迹，看到条件就能报出图形。", "tags": ["locus", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「命题」？", "back": "可以判断真假的陈述句。", "tags": ["locus", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「充分条件」？", "back": "有它就能推出结论的条件。", "tags": ["locus", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「必要条件」？", "back": "没有它结论就不成立的条件。", "tags": ["locus", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「充要条件」？", "back": "互相都能推出的条件。", "tags": ["locus", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「轨迹」？", "back": "满足某条件的点的集合。", "tags": ["locus", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「完备性」？", "back": "符合条件的点都在图形上。", "tags": ["locus", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「纯粹性」？", "back": "图形上的点都符合条件。", "tags": ["locus", "术语"]}, {"id": "f11", "chapterId": "ch02", "front": "什么是「阿波罗尼斯圆」？", "back": "到两定点距离之比为定值的点的轨迹。", "tags": ["locus", "术语"]}], "companion": "locus学习伴侣.html", "deriv": "locus从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-15-轨迹 杨学渊.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">逻辑常识<\/span><\/div><h1>第 1 章：命题与充分必要条件<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：逻辑常识\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断四种条件的类型\n<\/li><li>\n用集合包含关系判断充分必要\n<\/li><li>\n写出命题的逆命题与否命题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>若 p 成立必有 q 成立，则 p 是 q 的充分条件，q 是 p 的必要条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 命题与推出<\/h3>\n<p>命题是可以判断真假的陈述句。若“p 成立则 q 成立”恒成立，记 p⇒q。<\/p>\n<ul><li>\np 是 q 的<strong>充分条件<\/strong>：有 p 就够推出 q；\n<\/li><li>\nq 是 p 的<strong>必要条件<\/strong>：没有 q 就没有 p。\n<\/ul>\n<h3>1.2 四种条件<\/h3>\n<ul><li>\n充分不必要：p⇒q 但 q 推不出 p；\n<\/li><li>\n必要不充分：q⇒p 但 p 推不出 q；\n<\/li><li>\n充要：p⇔q；\n<\/li><li>\n既不充分也不必要。\n<\/ul>\n<h3>1.3 集合视角<\/h3>\n<p>设 p 对应集合 A，q 对应集合 B。若 A⊆B（小范围推大范围），则 p 是 q 的充分条件；若 B⊆A，则 p 是 q 的必要条件；若 A=B，则充要。<\/p>\n<p>这条视角比背定义可靠：判断时先画范围，再看包含方向。<\/p>\n<h3>1.4 逆命题与否命题<\/h3>\n<p>原命题 p⇒q 的逆命题是 q⇒p，否命题是 ¬p⇒¬q，逆否命题是 ¬q⇒¬p。<\/p>\n<p>原命题与逆否命题同真假；逆命题与否命题同真假。但原命题与逆命题不一定同真假。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：充分条件是“买了门票就能进场”，必要条件“没票就进不去”——有票是能进的充分条件，也是“必须”的前提。<\/p>\n<p><strong>失效边界<\/strong>：充分条件不唯一，可能有很多条路都能推出结论。<\/p>\n<p><strong>实例<\/strong>：“x&gt;2”是“x&gt;0”的充分不必要条件（小范围推大范围）；“x&gt;0”是“x&gt;2”的必要不充分条件。 “x 是偶数”是“x 能被 2 整除”的充要条件。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 充分条件就是必要条件 —— 实际上 方向相反：充分是 p⇒q，必要是 q⇒p。\n<\/li><li>\n别以为 原命题真则逆命题也真 —— 实际上 不一定，例如“正方形是矩形”为真，“矩形是正方形”为假。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“x=1”是“x²=1”的：\n<\/li><li>\n若 A⊆B，则 A 是 B 的：\n<p>A. 充分不必要条件 ｜ B. 必要不充分条件 ｜ C. 充要条件 ｜ D. 既不充分也不必要 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：x=1 必有 x²=1；但 x²=1 还可能是 x=−1，推不出 x=1。 A. 充分条件 ｜ B. 必要条件 ｜ C. 充要条件 ｜ D. 无关条件 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：A 中每个元素都在 B 中，故 A 成立可推出 B 成立，A 是 B 的充分条件。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\np⇒q：p 充分、q 必要\n<\/li><li>\n小范围推大范围＝充分\n<\/li><li>\n原命题与逆否命题同真假\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：命题与充分必要条件）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：命题与充分必要条件<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>逻辑是几何的地基。求轨迹前先弄清“条件”与“结论”的推的方向，才不会把充分当必要。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>若 p⇒q 恒成立，称 p 为 q 的充分条件，q 为 p 的必要条件；若 p⇔q，称为充要条件。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像钥匙与锁：有这把钥匙（充分）就能开锁；但没有它（必要）就开不了，两者方向不同。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 充分<\/h3>\n<div class=\"katex-block\">p\\Rightarrow q<\/div>\n<p>p 成立足以保证 q 成立。<\/p>\n<h3>2. 必要<\/h3>\n<div class=\"katex-block\">\\neg q\\Rightarrow\\neg p\\ \\equiv\\ p\\Rightarrow q<\/div>\n<p>没有 q 就没有 p，等价于 p 推 q。<\/p>\n<h3>3. 充要<\/h3>\n<div class=\"katex-block\">p\\Leftrightarrow q<\/div>\n<p>两个方向都能推，条件与结论等价。<\/p>\n<h3>4. 集合判据<\/h3>\n<div class=\"katex-block\">A\\subseteq B\\ \\Rightarrow\\ A\\ \\text{是}\\ B\\ \\text{的充分条件}<\/div>\n<p>范围小的条件更强，能推出范围大的结论。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>充分条件可以有很多个，必要条件也可以有很多个；只有一个条件时才能说“充要”。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《轨迹》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-15-轨迹 杨学渊.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/locus/chapter/ch01\">第 1 章：命题与充分必要条件<\/a><\/span><\/div><h1>第 2 章：求轨迹的五步法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、坐标\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按五步写出轨迹方程\n<\/li><li>\n用完备性与纯粹性检验结果\n<\/li><li>\n处理含参数与限制条件的轨迹\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>求轨迹＝把几何条件翻译成方程，再用原条件回头验一遍。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 五步法<\/h3>\n<ol><li>\n<strong>建系<\/strong>：选合适的原点与坐标轴，让条件尽量简单（常把定点放原点或对称轴上）；\n<\/li><li>\n<strong>设点<\/strong>：设动点 P(x,y)，写出其它相关点的坐标；\n<\/li><li>\n<strong>列式<\/strong>：把几何条件写成含 x、y 的等式（距离、斜率、面积等）；\n<\/li><li>\n<strong>化简<\/strong>：整理成标准方程；\n<\/li><li>\n<strong>检验<\/strong>：检查是否有“多出来的点”（增点）或“漏掉的点”。\n<\/ol>\n<h3>2.2 完备性与纯粹性<\/h3>\n<ul><li>\n<strong>完备性<\/strong>：所有满足条件的点都在求出的图形上——不能漏；\n<\/li><li>\n<strong>纯粹性<\/strong>：图形上每个点都满足条件——不能多。\n<\/ul>\n<p>实际做题中，最常见的漏洞是化简时两边平方或约分，引入了原条件不满足的点，必须在最后一步剔除。<\/p>\n<h3>2.3 常用翻译表<\/h3>\n<table><thead><tr><th>几何条件<\/th><th>代数表达<\/th><\/tr><\/thead><tbody><tr><td>到定点距离为 r<\/td><td>(x−a)²+(y−b)²=r²<\/td><\/tr><tr><td>到两定点距离相等<\/td><td>中垂线方程<\/td><\/tr><tr><td>到两定点距离之比为 k<\/td><td>√((x−a)²+y²)=k√((x−b)²+y²)<\/td><\/tr><tr><td>与定直线距离等于定值<\/td><td><\/td><td>Ax+By+C<\/td><td>/√(A²+B²)=d<\/td><\/tr><\/tbody><\/table>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：求轨迹像给一个人画行动路线：先定地图（建系），再记下他满足什么规则，最后画出路线并核对。<\/p>\n<p><strong>失效边界<\/strong>：条件含“距离”时平方会产生增点；条件含“斜率”时要排除竖直线。<\/p>\n<p><strong>实例<\/strong>：求到点 A(0,0) 与 B(4,0) 距离相等的点的轨迹。 设 P(x,y)：√(x²+y²)=√((x−4)²+y²)，平方化简得 x=2。检验：x=2 上任意点确实到两点等距，无增点。轨迹是直线 x=2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 化简完的方程就是轨迹 —— 实际上 还要检验；平方、约分都可能改变解集。\n<\/li><li>\n别以为 建系随便选都行 —— 实际上 选得好计算量差很多；通常让定点落在坐标轴上或关于原点对称。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n求轨迹时“检验”这一步主要检查：\n<\/li><li>\n到两定点距离相等的点的轨迹是：\n<p>A. 计算是否正确 ｜ B. 是否有增点或漏点 ｜ C. 图形是否美观 ｜ D. 坐标是否为整数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：检验是查完备性与纯粹性，即有没有多算或漏算的点。 A. 圆 ｜ B. 椭圆 ｜ C. 两定点的中垂线 ｜ D. 抛物线 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：到两点等距的点集就是这两点连线的垂直平分线。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五步：建系、设点、列式、化简、检验\n<\/li><li>\n检验查完备性与纯粹性\n<\/li><li>\n平方与约分是增点的主要来源\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：求轨迹的五步法）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：求轨迹的五步法<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>轨迹题的全部难点不在计算，而在“翻译”和“回头验”。五步法把这两件事固定成流程。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>满足某条件的点的集合叫轨迹；其方程叫轨迹方程。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像用 GPS 记录一个人的活动范围：条件是规则，轨迹是他走过的全部位置。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 距离条件<\/h3>\n<div class=\"katex-block\">\\sqrt{(x-a)^{2}+(y-b)^{2}}=r<\/div>\n<p>到定点距离为定值，平方后得圆的方程。<\/p>\n<h3>2. 等距条件<\/h3>\n<div class=\"katex-block\">\\sqrt{x^{2}+y^{2}}=\\sqrt{(x-c)^{2}+y^{2}}<\/div>\n<p>两边平方消去根号，化简得垂直平分线。<\/p>\n<h3>3. 比值条件<\/h3>\n<div class=\"katex-block\">\\frac{\\sqrt{(x-a)^{2}+y^{2}}}{\\sqrt{(x-b)^{2}+y^{2}}}=k<\/div>\n<p>阿波罗尼斯圆，k=1 时退化为直线。<\/p>\n<h3>4. 检验<\/h3>\n<div class=\"katex-block\">P\\in\\text{轨迹}\\iff P\\ \\text{满足原条件}<\/div>\n<p>方程与条件必须互为充要，缺一不可。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>轨迹可能只是一段曲线的一部分（如只取第一象限），方程必须附带范围限制。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《轨迹》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-15-轨迹 杨学渊.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/locus/chapter/ch02\">第 2 章：求轨迹的五步法<\/a><\/span><\/div><h1>第 3 章：常见轨迹与空间轨迹<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n识别五种常见轨迹类型\n<\/li><li>\n用定义直接写出轨迹\n<\/li><li>\n了解空间轨迹的降维处理\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>记住五种定义型轨迹，看到条件就能报出图形。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 平面内的五种常见轨迹<\/h3>\n<ul><li>\n到定点距离等于定值：圆；\n<\/li><li>\n到两定点距离相等：中垂线；\n<\/li><li>\n到两定点距离之和为常数（大于两点距离）：椭圆；\n<\/li><li>\n到两定点距离之差的绝对值为常数（小于两点距离）：双曲线；\n<\/li><li>\n到定点与定直线的距离相等：抛物线。\n<\/ul>\n<p>后三种正是圆锥曲线的定义，与《圆锥曲线》一书直接衔接。<\/p>\n<h3>3.2 用定义写轨迹<\/h3>\n<p>能识别定义时，直接写出标准方程，比五步法快得多。例如“到点 F(1,0) 与直线 x=−1 距离相等”，由定义即得 y²=4x。<\/p>\n<h3>3.3 空间轨迹<\/h3>\n<p>空间中到定点距离为定值的点集是球面；到两定点等距的点集是垂直平分面。<\/p>\n<p>处理空间轨迹的常用办法是“降维”：先固定一个平面，求出平面内的轨迹，再让平面运动，合成空间图形。<\/p>\n<h3>3.4 轨迹的交与并<\/h3>\n<p>两个条件的交集对应两图形的交点，并集对应两图形的合并。含“或”的条件要取并，含“且”的要取交——这与解不等式组的逻辑一致。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：五种轨迹像五种“尺规规则”：给的距离关系不同，画出的曲线就不同。<\/p>\n<p><strong>失效边界<\/strong>：椭圆要求距离之和大于两定点距离；等于时为线段，小于时无轨迹。<\/p>\n<p><strong>实例<\/strong>：到 A(−3,0)、B(3,0) 距离之和为 8 的点：2a=8，a=4，c=3，b²=16−9=7，轨迹为 x²/16+y²/7=1。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 距离之和为常数就一定是椭圆 —— 实际上 当常数等于两定点距离时退化为线段，小于时不存在。\n<\/li><li>\n别以为 空间轨迹也能直接套平面公式 —— 实际上 空间要先降维或另建坐标系，平面公式只在某个平面内成立。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n到定点距离等于定值的点的轨迹是：\n<\/li><li>\n到两定点距离之差为常数（小于两点距离）的轨迹是：\n<p>A. 直线 ｜ B. 圆 ｜ C. 椭圆 ｜ D. 抛物线 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：这正是圆的定义。 A. 椭圆 ｜ B. 双曲线的一支或两支 ｜ C. 圆 ｜ D. 直线 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：差为常数对应双曲线；取绝对值时为两支，不取绝对值时为靠近某定点的一支。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五种定义型轨迹：圆、中垂线、椭圆、双曲线、抛物线\n<\/li><li>\n能识别定义就直接写方程\n<\/li><li>\n空间轨迹先降维\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：常见轨迹与空间轨迹）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：常见轨迹与空间轨迹<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>常见轨迹其实是“定义的几何版本”。把定义记住，看到条件就能直接报出图形，省掉五步法的大部分计算。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>由距离关系定义的曲线叫圆锥曲线：到两定点距离之和/之差为常数，或到定点与定直线等距。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像三种不同的“牵引规则”：两根绳拉着（和）、一根绳推着（差）、一根绳加一条直尺（等距）。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 圆<\/h3>\n<div class=\"katex-block\">|OP|=r<\/div>\n<p>到定点距离恒定，最简单的一类轨迹。<\/p>\n<h3>2. 椭圆<\/h3>\n<div class=\"katex-block\">|PF_{1}|+|PF_{2}|=2a\\ (2a>2c)<\/div>\n<p>到两定点距离之和为常数，常数必须大于两定点距离。<\/p>\n<h3>3. 双曲线<\/h3>\n<div class=\"katex-block\">\\big||PF_{1}|-|PF_{2}|\\big|=2a\\ (2a<2c)<\/div>\n<p>差为常数，小于两定点距离时得双曲线。<\/p>\n<h3>4. 抛物线<\/h3>\n<div class=\"katex-block\">|PF|=d(P,l)<\/div>\n<p>到定点与定直线的距离相等，这是抛物线的定义。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>每种定义都有取值范围限制，超出范围时轨迹退化或不存在。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《轨迹》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-15-轨迹 杨学渊.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/locus/chapter/ch01\">第 1 章：命题与充分必要条件<\/a><\/span><\/div><h1>充分必要<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>充分是“有它就够”，必要是“没它不行”。<\/p>\n<h2>为什么重要<\/h2>\n<p>轨迹的检验本质上就是判断“方程”与“条件”是否互为充要。<\/p>\n<h2>详解<\/h2>\n<p>p⇒q 时 p 充分、q 必要。用集合看：小范围推大范围。做题时把条件与结论各画一个范围，看谁包含谁，比背定义可靠。<\/p>\n<h2>常见误解<\/h2>\n<p>把“必要条件”理解成“重要的条件”，忽略它其实是方向问题。<\/p>\n<h2>相关概念<\/h2>\n<p>命题（ch01）、检验（ch02）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-15-轨迹 杨学渊.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/locus/chapter/ch02\">第 2 章：求轨迹的五步法<\/a><\/span><\/div><h1>完备性与纯粹性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>完备是不漏，纯粹是不多；两者都满足，方程才等于轨迹。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是轨迹题唯一的评分关键：方程对了但没检验，通常要扣分。<\/p>\n<h2>详解<\/h2>\n<p>完备性：符合条件的点都在方程表示的图形上；纯粹性：图形上的点都符合条件。平方、约分、去绝对值常破坏纯粹性；忽略参数范围常破坏完备性。检验的办法是回到原条件逐条核对。<\/p>\n<h2>常见误解<\/h2>\n<p>认为“化简过程等价就没问题”，忽略平方与约分并不等价。<\/p>\n<h2>相关概念<\/h2>\n<p>五步法（ch02）、增根（《分式与根式》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：命题与充分必要条件<\/strong><br>阅读：<a href=\"#/book/locus/chapter/ch01\">第 1 章：命题与充分必要条件<\/a><br>检查点：能判断“甲是乙的什么条件”<\/li><li class='path-step' id='path-02'><strong>步骤 02：求轨迹的五步法<\/strong><br>阅读：<a href=\"#/book/locus/chapter/ch02\">第 2 章：求轨迹的五步法<\/a><br>检查点：能独立完成一道轨迹题的检验<\/li><li class='path-step' id='path-03'><strong>步骤 03：常见轨迹与空间轨迹<\/strong><br>阅读：<a href=\"#/book/locus/chapter/ch03\">第 3 章：常见轨迹与空间轨迹<\/a><br>检查点：能由条件说出轨迹类型<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：命题与充分必要条件<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> “x=1”是“x²=1”的：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 充分不必要条件<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 必要不充分条件<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 充要条件<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 既不充分也不必要<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 若 A⊆B，则 A 是 B 的：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 充分条件<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 必要条件<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 充要条件<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 无关条件<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：求轨迹的五步法<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 求轨迹时“检验”这一步主要检查：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 计算是否正确<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 是否有增点或漏点<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 图形是否美观<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 坐标是否为整数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 到两定点距离相等的点的轨迹是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 圆<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 椭圆<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 两定点的中垂线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 抛物线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：常见轨迹与空间轨迹<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 到定点距离等于定值的点的轨迹是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 直线<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 圆<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 椭圆<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 抛物线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 到两定点距离之差为常数（小于两点距离）的轨迹是：<\/p><div class='quiz-opts'><label class='quiz-opt 全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='命题'>命题 — 可以判断真假的陈述句。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='充分条件'>充分条件 — 有它就能推出结论的条件。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='必要条件'>必要条件 — 没有它结论就不成立的条件。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='充要条件'>充要条件 — 互相都能推出的条件。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='轨迹'>轨迹 — 满足某条件的点的集合。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><li data-term='完备性'>完备性 — 符合条件的点都在图形上。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><li data-term='纯粹性'>纯粹性 — 图形上的点都符合条件。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><li data-term='阿波罗尼斯圆'>阿波罗尼斯圆 — 到两定点距离之比为定值的点的轨迹。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：轨迹题五步<\/h2>\n<p>建系、设点、列式、化简、检验；检验放在最后，不能省。<\/p>\n<h2>框架：先定义后计算<\/h2>\n<p>能识别为圆/椭圆/双曲线/抛物线时，直接用定义写方程，只在必要时才走五步法。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>充分<\/td><td>p⇒q，小范围推大范围<\/td><\/tr><tr><td>必要<\/td><td>q⇒p，没它不行<\/td><\/tr><tr><td>充要<\/td><td>p⇔q，集合相等<\/td><\/tr><tr><td>五步法<\/td plain": "cosA=0，a²=9+16=25，a=5。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "三角形三边为 2、3、4，最大角是：", "options": ["锐角", "直角", "钝角", "无法判断"], "answer": 2, "explain": "4²=16>2²+3²=13，故最大角为钝角。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "两边为 4 和 6、夹角 30°，面积是：", "options": ["12", "6", "24", "3"], "answer": 1, "explain": "S=(1/2)×4×6×0.5=6。", "relatedConceptId": "", "prerequisites": ["ch03"]}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "三边为 6、8、10 的三角形面积是：", "options": ["24", "48", "30", "20"], "answer": 0, "explain": "p=12，S=√(12×6×4×2)=√576=24。", "relatedConceptId": "", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "在 △ABC 中，a=8、b=6、A=60°，则 sinB 等于：", "options": ["3√3/8", "3/4", "√3/2", "1/2"], "answer": 0, "explain": "由 a/sinA=b/sinB 得 sinB=b sinA/a=6×(√3/2)/8=3√3/8。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "三边为 5、12、13 的三角形，其最大角是：", "options": ["锐角", "直角", "钝角", "60°"], "answer": 1, "explain": "13²=169=5²+12²，故为直角三角形，最大角 90°。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：正弦定理」的一句话核心是什么？", "back": "同一个三角形中，边与它所对角的正弦之比相等，且等于外接圆直径。", "tags": ["solving-triangles", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：余弦定理与形状判断」的一句话核心是什么？", "back": "余弦定理是勾股定理的推广：a²=b²+c²−2bc cosA，多出的那一项修正了“非直角”。", "tags": ["solving-triangles", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：面积公式与应用」的一句话核心是什么？", "back": "面积有两种算法：给角用 (1/2)ab sinC，给三边用海伦公式。", "tags": ["solving-triangles", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「正弦定理」？", "back": "a/sinA=b/sinB=c/sinC=2R。", "tags": ["solving-triangles", "术语"]}, {"id": "f05", "chapterId": "ch02", "front": "什么是「余弦定理」？", "back": "a²=b²+c²−2bc cosA。", "tags": ["solving-triangles", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「外接圆半径」？", "back": "三角形外接圆的半径 R。", "tags": ["solving-triangles", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「边边角」？", "back": "已知两边及其中一边的对角，可能多解。", "tags": ["solving-triangles", "术语"]}, {"id": "f08", "chapterId": "ch03", "front": "什么是「海伦公式」？", "back": "由三边求面积的公式。", "tags": ["solving-triangles", "术语"]}, {"id": "f09", "chapterId": "ch03", "front": "什么是「方位角」？", "back": "从正北方向顺时针量到目标方向的角度。", "tags": ["solving-triangles", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「仰角」？", "back": "视线在水平线之上的夹角。", "tags": ["solving-triangles", "术语"]}], "companion": "solving-triangles学习伴侣.html", "deriv": "solving-triangles从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-16-解三角形 吴新萃.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">三角比、圆<\/span><\/div><h1>第 1 章：正弦定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：三角比、圆\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n推导并默写正弦定理\n<\/li><li>\n用正弦定理解两类三角形\n<\/li><li>\n判断已知两边及一边对角时的解的个数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同一个三角形中，边与它所对角的正弦之比相等，且等于外接圆直径。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 定理与推导<\/h3>\n<p>在 △ABC 中：<\/p>\n<p>a/sinA = b/sinB = c/sinC = 2R<\/p>\n<p>（R 为外接圆半径）<\/p>\n<p>推导：作外接圆，把一边看成弦，由圆周角定理得 a=2R sinA；对另外两边同理。<\/p>\n<h3>1.2 两类基本用法<\/h3>\n<ul><li>\n已知两角与一边：先求第三角（180°减），再用定理求另两边；\n<\/li><li>\n已知两边与其中一边的对角：先求另一边的对角，再求第三角与第三边。\n<\/ul>\n<h3>1.3 多解讨论<\/h3>\n<p>已知 a、b 与 A（边边角）时，由 sinB=b sinA/a 求 B，可能出现：<\/p>\n<ul><li>\nsinB&gt;1：无解；\n<\/li><li>\nsinB=1：一解（B=90°）；\n<\/li><li>\nsinB&lt;1：B 有锐角与钝角两个候选，需检查 A+B&lt;180° 是否成立，可能一解也可能两解。\n<\/ul>\n<p>这是解三角形最容易丢分的地方，必须画图核对。<\/p>\n<h3>1.4 边角互化<\/h3>\n<p>定理把“边的比”换成“正弦的比”，遇到含边与角的混合等式，优先统一成角或统一成边。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：正弦定理像“大角对大边”的定量版本：边越长，对着的角越大，比例恒定。<\/p>\n<p><strong>失效边界<\/strong>：定理对任意三角形都成立，但求角时要防增解；正弦值相同对应两个角。<\/p>\n<p><strong>实例<\/strong>：A=30°，B=45°，a=2。C=105°，由 a/sinA=b/sinB 得 b=2 sin45°/sin30°=2×0.7071/0.5≈2.83。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 正弦定理只适用于直角三角形 —— 实际上 对任意三角形都成立，直角三角形只是特例。\n<\/li><li>\n别以为 由 sinB 求出 B 就唯一 —— 实际上 正弦值对应两个角（锐角与钝角），必须检验和角条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n正弦定理中，a/sinA 等于：\n<\/li><li>\n已知 a=2、b=3、A=30°，则 B：\n<p>A. 内切圆半径 ｜ B. 外接圆半径 ｜ C. 外接圆直径 ｜ D. 三角形周长 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：a/sinA=2R，即外接圆直径。 A. 只有一解 ｜ B. 可能有两解 ｜ C. 一定无解 ｜ D. 一定为直角 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：sinB=b sinA/a=3×0.5/2=0.75&lt;1，B 有锐角与钝角两个候选，需检验，可能两解。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na/sinA=b/sinB=c/sinC=2R\n<\/li><li>\n已知两角一边可直接解\n<\/li><li>\n边边角要讨论解的个数\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：正弦定理）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：正弦定理<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>正弦定理不是凭空规定，而是“弦长＝直径×正弦”的圆周角定理的直接结果。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>正弦定理指三角形中各边与其对角正弦之比相等，比值为外接圆直径。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像三口不同大小的窗，窗宽与视角的正弦成正比，比例由同一个圆决定。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 定理<\/h3>\n<div class=\"katex-block\">\\frac{a}{\\sin A}=\\frac{b}{\\sin B}=\\frac{c}{\\sin C}=2R<\/div>\n<p>三组比值相等，且都等于外接圆直径。<\/p>\n<h3>2. 弦长公式<\/h3>\n<div class=\"katex-block\">a=2R\\sin A<\/div>\n<p>把边看作外接圆的弦，由圆周角定理得到。<\/p>\n<h3>3. 多解判据<\/h3>\n<div class=\"katex-block\">\\sin B=\\frac{b\\sin A}{a}<\/div>\n<p>算出的正弦值若小于 1，要检查两个候选角是否都满足内角和。<\/p>\n<h3>4. 边角互化<\/h3>\n<div class=\"katex-block\">a:b:c=\\sin A:\\sin B:\\sin C<\/div>\n<p>边的比等于对应角正弦的比，是化简混合等式的关键。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>求角时正弦值不唯一确定角，必须结合内角和为 180° 判断取舍。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《解三角形》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-16-解三角形 吴新萃.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/solving-triangles/chapter/ch01\">第 1 章：正弦定理<\/a><\/span><\/div><h1>第 2 章：余弦定理与形状判断<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n推导并默写余弦定理\n<\/li><li>\n由三边求角、由两边夹角求第三边\n<\/li><li>\n用余弦值判断三角形是锐角、直角还是钝角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>余弦定理是勾股定理的推广：a²=b²+c²−2bc cosA，多出的那一项修正了“非直角”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 定理与推导<\/h3>\n<p>a²=b²+c²−2bc cosA b²=a²+c²−2ac cosB c²=a²+b²−2ab cosC<\/p>\n<p>推导：以 A 为原点、AB 为 x 轴建系，B(c,0)，C(b cosA, b sinA)，用两点距离公式展开即得。<\/p>\n<p>当 A=90° 时 cosA=0，公式退化为勾股定理 a²=b²+c²。<\/p>\n<h3>2.2 两类用法<\/h3>\n<ul><li>\n已知两边及夹角：直接求第三边；\n<\/li><li>\n已知三边：用变形公式求角，cosA=(b²+c²−a²)/(2bc)。\n<\/ul>\n<h3>2.3 形状判断<\/h3>\n<p>由 cosA 的符号判断 A 的类型：<\/p>\n<ul><li>\ncosA&gt;0（a²&lt;b²+c²）：A 为锐角；\n<\/li><li>\ncosA=0（a²=b²+c²）：A 为直角；\n<\/li><li>\ncosA&lt;0（a²&gt;b²+c²）：A 为钝角。\n<\/ul>\n<p>判断整个三角形的形状，要看最大边所对的角——只需检查最大角。<\/p>\n<h3>2.4 与正弦定理的分工<\/h3>\n<p>已知“边边角”用正弦定理（注意多解）；已知“边角边”或“边边边”用余弦定理（无多解问题）。这是选择定理的第一判据。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：余弦定理像给勾股定理加了一个“斜度修正项”：角越偏离直角，修正越大。<\/p>\n<p><strong>失效边界<\/strong>：修正项可正可负，钝角时第三边比勾股定理算出的更长。<\/p>\n<p><strong>实例<\/strong>：b=5、c=8、A=60°：a²=25+64−2×5×8×0.5=89−40=49，a=7。 三边 3、4、6：最大边 6，6²=36&gt;3²+4²=25，故为钝角三角形。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 余弦定理只能求边 —— 实际上 也能求角，变形后 cosA=(b²+c²−a²)/(2bc) 就是求角公式。\n<\/li><li>\n别以为 三边确定三角形一定唯一 —— 实际上 三边确定时三角形唯一（SSS），但角要用余弦定理算，不能靠正弦定理。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n已知 b=3、c=4、A=90°，则 a 等于：\n<\/li><li>\n三角形三边为 2、3、4，最大角是：\n<p>A. 5 ｜ B. 7 ｜ C. 25 ｜ D. √7 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：cosA=0，a²=9+16=25，a=5。 A. 锐角 ｜ B. 直角 ｜ C. 钝角 ｜ D. 无法判断 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：4²=16&gt;2²+3²=13，故最大角为钝角。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na²=b²+c²−2bc cosA\n<\/li><li>\n已知两边夹角或三边用余弦定理\n<\/li><li>\n最大边定形状：比较 a² 与 b²+c²\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：余弦定理与形状判断）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：余弦定理与形状判断<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>余弦定理可以用坐标法一步步推出来：把三角形放进坐标系，用两点距离公式展开，cosA 就自然出现了。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>余弦定理指三角形中任一边的平方等于另两边平方和减去这两边与其夹角余弦的乘积的两倍。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像量两点间的直线距离：如果路不是直角拐弯，就要按夹角打折。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 定理<\/h3>\n<div class=\"katex-block\">a^{2}=b^{2}+c^{2}-2bc\\cos A<\/div>\n<p>勾股定理加上夹角修正项。<\/p>\n<h3>2. 坐标推导<\/h3>\n<div class=\"katex-block\">a^{2}=(b\\cos A-c)^{2}+(b\\sin A)^{2}<\/div>\n<p>展开后利用 sin²+cos²=1 化简即得。<\/p>\n<h3>3. 求角<\/h3>\n<div class=\"katex-block\">\\cos A=\\frac{b^{2}+c^{2}-a^{2}}{2bc}<\/div>\n<p>三边已知时反解夹角，符号决定锐钝。<\/p>\n<h3>4. 形状判据<\/h3>\n<div class=\"katex-block\">a^{2}\\gtrless b^{2}+c^{2}\\ \\Leftrightarrow\\ A\\ \\text{为钝/直/锐角}<\/div>\n<p>看最大边对应的角即可判断整个三角形。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>夹角必须是两边的夹角；用错角会得到完全不同的结果。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《解三角形》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-16-解三角形 吴新萃.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/solving-triangles/chapter/ch02\">第 2 章：余弦定理与形状判断<\/a><\/span><\/div><h1>第 3 章：面积公式与应用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用两边夹角公式求面积\n<\/li><li>\n用海伦公式由三边求面积\n<\/li><li>\n解决测高、测距与方位角问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>面积有两种算法：给角用 (1/2)ab sinC，给三边用海伦公式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 夹角面积公式<\/h3>\n<p>S=(1/2)ab sinC=(1/2)bc sinA=(1/2)ca sinB<\/p>\n<p>理由：以 a 为底，高为 b sinC，代入三角形面积公式即得。<\/p>\n<h3>3.2 海伦公式<\/h3>\n<p>已知三边 a、b、c，令 p=(a+b+c)/2，则<\/p>\n<p>S=√(p(p−a)(p−b)(p−c))<\/p>\n<p>它不需要先求角，适合只给三边的场合。<\/p>\n<h3>3.3 测量应用<\/h3>\n<ul><li>\n测高：在同一水平线上取两点，测仰角，用正弦定理求距离，再用直角三角形求高；\n<\/li><li>\n测距：不可到达的两点，构造可测三角形，用正弦或余弦定理；\n<\/li><li>\n方位角：从正北方向顺时针量到目标方向的角度，画图时先定北向。\n<\/ul>\n<p>建模四步：画图 → 标已知 → 选定理 → 解并检验合理性（边长是否为正、角是否在范围内）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：面积公式像“用两条边和它们张开的角度算地毯大小”，海伦公式像“只量三条边就能算”。<\/p>\n<p><strong>失效边界<\/strong>：海伦公式要求三边能构成三角形（任意两边之和大于第三边），否则根号内为负。<\/p>\n<p><strong>实例<\/strong>：a=5、b=7、C=60°，S=(1/2)×5×7×√3/2≈15.16。 三边 3、4、5：p=6，S=√(6×3×2×1)=√36=6，与直角三角形面积 3×4/2=6 一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 海伦公式对任意三数都能用 —— 实际上 三数必须满足三角形不等式，否则根号内为负，不是三角形。\n<\/li><li>\n别以为 方位角从正东开始量 —— 实际上 方位角从正北方向开始，顺时针计，范围 0°到 360°。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n两边为 4 和 6、夹角 30°，面积是：\n<\/li><li>\n三边为 6、8、10 的三角形面积是：\n<p>A. 12 ｜ B. 6 ｜ C. 24 ｜ D. 3 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：S=(1/2)×4×6×0.5=6。 A. 24 ｜ B. 48 ｜ C. 30 ｜ D. 20 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：p=12，S=√(12×6×4×2)=√576=24。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nS=(1/2)ab sinC\n<\/li><li>\n海伦：S=√(p(p−a)(p−b)(p−c))\n<\/li><li>\n方位角从正北顺时针量\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：面积公式与应用）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：面积公式与应用<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>面积公式不是新知识，只是“底×高”加上三角比。把高用边与角表示，就得到全部公式。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>三角形面积指它所占平面的度量；海伦公式是由三边直接求面积的公式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像量一块三角地：有角度就量两条边，没角度就量三条边。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 夹角公式<\/h3>\n<div class=\"katex-block\">S=\\frac{1}{2}ab\\sin C<\/div>\n<p>以 a 为底，高为 b sinC，代入底乘高的一半。<\/p>\n<h3>2. 海伦公式<\/h3>\n<div class=\"katex-block\">S=\\sqrt{p(p-a)(p-b)(p-c)},\\quad p=\\frac{a+b+c}{2}<\/div>\n<p>只由三边求面积，不必先求角。<\/p>\n<h3>3. 正弦定理测距<\/h3>\n<div class=\"katex-block\">\\frac{AB}{\\sin C}=\\frac{BC}{\\sin A}<\/div>\n<p>不可直接测量的距离，转化为可测的角与边。<\/p>\n<h3>4. 方位角<\/h3>\n<div class=\"katex-block\">\\theta\\ \\text{从正北顺时针量}<\/div>\n<p>画图时先画北向，再按角度定方向。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>海伦公式根号内必须非负；夹角公式中的角必须是两边的夹角。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《解三角形》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-16-解三角形 吴新萃.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/solving-triangles/chapter/ch01\">第 1 章：正弦定理<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/solving-triangles/chapter/ch02\">第 2 章：余弦定理与形状判断<\/a><\/span><\/div><h1>边角对应<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>大边对大角，正弦定理量化了这条关系，余弦定理则处理“夹角”。<\/p>\n<h2>为什么重要<\/h2>\n<p>选对定理是解三角形的第一判断，选错会绕远且易错。<\/p>\n<h2>详解<\/h2>\n<p>已知两角一边、两边及一边对角（含多解）用正弦定理；已知两边夹角、三边用余弦定理。两种定理都能把“边”与“角”互相翻译。<\/p>\n<h2>常见误解<\/h2>\n<p>遇到边角混合条件直接套正弦定理，忽略余弦定理更直接。<\/p>\n<h2>相关概念<\/h2>\n<p>正弦定理（ch01）、余弦定理（ch02）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-16-解三角形 吴新萃.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/solving-triangles/chapter/ch01\">第 1 章：正弦定理<\/a><\/span><\/div><h1>多解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>已知两边及一边对角时，正弦值对应两个角，可能有两个三角形。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是解三角形唯一的“答案不唯一”情形，漏判会少写一个解。<\/p>\n<h2>详解<\/h2>\n<p>由 sinB=b sinA/a 求 B：若大于 1 无解；等于 1 一解；小于 1 时 B 有锐角、钝角两个候选，需检验 A+B&lt;180°。大边对大角也可辅助判断：b&gt;a 时 B 可能为钝角。<\/p>\n<h2>常见误解<\/h2>\n<p>求出 sinB 就直接取锐角，漏掉钝角解。<\/p>\n<h2>相关概念<\/h2>\n<p>正弦定理（ch01）、三角形内角和（《直线形》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：正弦定理<\/strong><br>阅读：<a href=\"#/book/solving-triangles/chapter/ch01\">第 1 章：正弦定理<\/a><br>检查点：能由两边一角求出其余元素并讨论多解<\/li><li class='path-step' id='path-02'><strong>步骤 02：余弦定理与形状判断<\/strong><br>阅读：<a href=\"#/book/solving-triangles/chapter/ch02\">第 2 章：余弦定理与形状判断<\/a><br>检查点：能由三边求角并判断三角形类型<\/li><li class='path-step' id='path-03'><strong>步骤 03：面积公式与应用<\/strong><br>阅读：<a href=\"#/book/solving-triangles/chapter/ch03\">第 3 章：面积公式与应用<\/a><br>检查点：能用两种面积公式解测量题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：正弦定理<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 正弦定理中，a/sinA 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 内切圆半径<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 外接圆半径<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 外接圆直径<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 三角形周长<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 已知 a=2、b=3、A=30°，则 B：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 只有一解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 可能有两解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 一定无解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 一定为直角<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：余弦定理与形状判断<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 已知 b=3、c=4、A=90°，则 a 等于：<\/p><div class='quiz-opts'><label class='qu Id": "", "prerequisites": ["__all__"]}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "y=sin(2x−π/3) 的周期是：", "options": ["π", "2π", "π/2", "4π"], "answer": 0, "explain": "T=2π/2=π。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：角、弧度与三角比」的一句话核心是什么？", "back": "角不再限于 0°~90°：它可以任意大、可以为负；三角比由单位圆上点的坐标定义。", "tags": ["trigonometry", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：同角关系与诱导公式」的一句话核心是什么？", "back": "同角关系管“同一个角的三种比”，诱导公式管“不同角的同名比”。", "tags": ["trigonometry", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：加法定理与倍角公式」的一句话核心是什么？", "back": "所有和角、倍角公式都由一条出发：cos(α−β)=cosαcosβ+sinαsinβ。", "tags": ["trigonometry", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：图象、性质与三角方程」的一句话核心是什么？", "back": "正弦、余弦的周期是 2π，正切是 π；图象的平移伸缩都写在 A、ω、φ 三个参数里。", "tags": ["trigonometry", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「弧度」？", "back": "弧长与半径之比定义的角的度量。", "tags": ["trigonometry", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「终边相同的角」？", "back": "相差 360° 整数倍的角。", "tags": ["trigonometry", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「正弦」？", "back": "单位圆上角的终边交点的纵坐标。", "tags": ["trigonometry", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「余弦」？", "back": "单位圆上角的终边交点的横坐标。", "tags": ["trigonometry", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「诱导公式」？", "back": "把任意角三角比化为锐角三角比的公式。", "tags": ["trigonometry", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「加法定理」？", "back": "展开 α±β 三角比的公式。", "tags": ["trigonometry", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「二倍角公式」？", "back": "sin2α、cos2α、tan2α 的公式。", "tags": ["trigonometry", "术语"]}, {"id": "f12", "chapterId": "ch04", "front": "什么是「周期」？", "back": "函数值重复出现的最小正间隔。", "tags": ["trigonometry", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「振幅」？", "back": "y=A sin(ωx+φ) 中的 |A|。", "tags": ["trigonometry", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「通解」？", "back": "含整数 k、表示全部解的表达式。", "tags": ["trigonometry", "术语"]}], "companion": "trigonometry学习伴侣.html", "deriv": "trigonometry从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">相似、坐标<\/span><\/div><h1>第 1 章：角、弧度与三角比<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：相似、坐标\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把任意角化到 0°~360°并判断象限\n<\/li><li>\n完成角度与弧度的互化\n<\/li><li>\n用单位圆写出三角比的定义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>角不再限于 0°~90°：它可以任意大、可以为负；三角比由单位圆上点的坐标定义。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 任意角<\/h3>\n<p>射线绕端点旋转形成角：逆时针为正，顺时针为负，转多圈就是大于 360° 的角。<\/p>\n<p>与角 α 终边相同的角可写成 α+k·360°（k 为整数）。判断象限时，先把角化到 0°~360°。<\/p>\n<h3>1.2 弧度制<\/h3>\n<p>弧长与半径之比定义为角的弧度数：θ=l/r。整圆周长 2πr，故 360°=2π 弧度，180°=π 弧度。<\/p>\n<p>互化：1°=π/180 弧度；1 弧度=(180/π)°≈57.3°。<\/p>\n<p>用弧度后，弧长 l=rθ、扇形面积 S=(1/2)r²θ 都不必再带度数符号。<\/p>\n<h3>1.3 单位圆定义<\/h3>\n<p>在单位圆上，角 θ 的终边与圆交于点 P(x,y)，则<\/p>\n<p>cosθ=x，sinθ=y，tanθ=y/x（x≠0）<\/p>\n<p>这个定义对任意角都成立，正负号由所在象限决定：一全正、二正弦正、三正切正、四余弦正。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：单位圆像一块钟面，角就是指针转过的角度，坐标就是指针末端的横纵位置。<\/p>\n<p><strong>失效边界<\/strong>：tan 在 x=0（即 90°、270° 等）处无定义，不能硬算。<\/p>\n<p><strong>实例<\/strong>：−30° 与 330° 终边相同，都在第四象限；sin(−30°)=−1/2，cos(−30°)=√3/2。 5π/6 弧度=150°，在第二象限，sin 为正、cos 为负。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 角只能在 0°到 360°之间 —— 实际上 角可以任意大，也可以为负；终边相同的角有无穷多个。\n<\/li><li>\n别以为 sin30° 与 sin(30 弧度) 一样 —— 实际上 一个是角度制，一个是弧度制，数值完全不同，必须标明单位。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n与 −30° 终边相同的角是：\n<\/li><li>\n150° 化为弧度是：\n<p>A. 30° ｜ B. 330° ｜ C. 300° ｜ D. 150° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：−30°+360°=330°。 A. 5π/6 ｜ B. 2π/3 ｜ C. 3π/4 ｜ D. 7π/6 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：150°=150×π/180=5π/6。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n逆时针为正，顺时针为负；终边相同角相差 360° 的整数倍\n<\/li><li>\n180°=π 弧度\n<\/li><li>\n单位圆：cos=x，sin=y，tan=y/x\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：角、弧度与三角比）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：角、弧度与三角比<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>三角函数之所以能处理任意角，是因为定义从“直角三角形”搬到了“单位圆”：坐标有正负，就能表示任意象限。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>弧度是弧长与半径之比；正弦、余弦是单位圆上点的纵、横坐标。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像钟表指针：转过一圈还可以继续转，位置由角度唯一确定。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 弧度<\/h3>\n<div class=\"katex-block\">\\theta=\\frac{l}{r}<\/div>\n<p>用弧长与半径的比定义角，与圆的大小无关。<\/p>\n<h3>2. 互化<\/h3>\n<div class=\"katex-block\">180^{\\circ}=\\pi\\ \\text{rad}<\/div>\n<p>角度制与弧度制的换算基准。<\/p>\n<h3>3. 单位圆定义<\/h3>\n<div class=\"katex-block\">\\cos\\theta=x,\\ \\sin\\theta=y<\/div>\n<p>角的终边与单位圆交点的坐标，就是余弦与正弦。<\/p>\n<h3>4. 平方关系<\/h3>\n<div class=\"katex-block\">\\sin^{2}\\theta+\\cos^{2}\\theta=1<\/div>\n<p>单位圆上 x²+y²=1，直接得到这条恒等式。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>tan 在横坐标为零处没有定义；写定义域时必须排除这些点。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《三角函数》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/trigonometry/chapter/ch01\">第 1 章：角、弧度与三角比<\/a><\/span><\/div><h1>第 2 章：同角关系与诱导公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用平方关系与商关系化简\n<\/li><li>\n用诱导公式把任意角化到锐角\n<\/li><li>\n根据象限确定符号\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同角关系管“同一个角的三种比”，诱导公式管“不同角的同名比”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 同角关系<\/h3>\n<p>sin²θ+cos²θ=1；tanθ=sinθ/cosθ（cosθ≠0）；1+tan²θ=1/cos²θ。<\/p>\n<p>用法：已知一个比求另外两个，先定符号（看象限），再用平方关系。<\/p>\n<h3>2.2 诱导公式<\/h3>\n<p>把 k·90°±θ 或 180°±θ、360°−θ 的三角比化为 θ 的三角比：<\/p>\n<ul><li>\nsin(180°−θ)=sinθ，cos(180°−θ)=−cosθ；\n<\/li><li>\nsin(180°+θ)=−sinθ，cos(180°+θ)=−cosθ；\n<\/li><li>\nsin(−θ)=−sinθ，cos(−θ)=cosθ；\n<\/li><li>\nsin(90°−θ)=cosθ，cos(90°−θ)=sinθ。\n<\/ul>\n<p>口诀“奇变偶不变，符号看象限”：k 为奇数时函数名互换，为偶数时不变；符号按原角所在象限判断。<\/p>\n<h3>2.3 化简策略<\/h3>\n<p>先把所有角化到锐角，再统一函数名，最后用平方关系或商关系合并。步骤写全，符号不要跳。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：诱导公式像“角的搬运工”：把远处的角搬到第一象限再算，符号留在原地。<\/p>\n<p><strong>失效边界<\/strong>：口诀只适用于 90° 的整数倍加减；任意角要先化成这种形式。<\/p>\n<p><strong>实例<\/strong>：sin150°=sin(180°−30°)=sin30°=1/2；cos240°=cos(180°+60°)=−cos60°=−1/2。 已知 sinθ=3/5 且 θ 在第二象限，则 cosθ=−4/5，tanθ=−3/4。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 sin(180°−θ)=−sinθ —— 实际上 应为 sinθ；正弦在第二象限为正，符号判断要看象限。\n<\/li><li>\n别以为 同角关系中可以随意开方 —— 实际上 开方要带 ±，符号必须由象限确定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nsin210° 的值是：\n<\/li><li>\n已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：\n<p>A. 1/2 ｜ B. −1/2 ｜ C. √3/2 ｜ D. −√3/2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：sin210°=sin(180°+30°)=−sin30°=−1/2。 A. 4/5 ｜ B. −4/5 ｜ C. 3/5 ｜ D. −3/5 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：第三象限正弦为负，sinθ=−√(1−9/25)=−4/5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsin²+cos²=1；tan=sin/cos\n<\/li><li>\n诱导公式：奇变偶不变，符号看象限\n<\/li><li>\n开方取符号要看象限\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：同角关系与诱导公式）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：同角关系与诱导公式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>同角关系来自单位圆的方程，诱导公式来自单位圆的对称性。两者都不是背出来的，看一眼圆就明白。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>同角关系指同一个角的正弦、余弦、正切之间的恒等关系；诱导公式指把任意角的三角比化为锐角三角比的公式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>单位圆像一面四格镜：每个象限都是第一象限的镜像，只是符号不同。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 平方关系<\/h3>\n<div class=\"katex-block\">\\sin^{2}\\theta+\\cos^{2}\\theta=1<\/div>\n<p>单位圆上点的坐标满足 x²+y²=1。<\/p>\n<h3>2. 商关系<\/h3>\n<div class=\"katex-block\">\\tan\\theta=\\frac{\\sin\\theta}{\\cos\\theta}<\/div>\n<p>正切是正弦与余弦的比，分母不能为零。<\/p>\n<h3>3. 诱导一<\/h3>\n<div class=\"katex-block\">\\sin(180^{\\circ}-\\theta)=\\sin\\theta<\/div>\n<p>第二象限正弦为正，函数名不变。<\/p>\n<h3>4. 诱导二<\/h3>\n<div class=\"katex-block\">\\sin(90^{\\circ}-\\theta)=\\cos\\theta<\/div>\n<p>互余角的正弦等于余弦，函数名互换。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>口诀中的“奇偶”指 90° 的倍数；不是 90° 的整数倍时不能直接用。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《三角函数》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/trigonometry/chapter/ch02\">第 2 章：同角关系与诱导公式<\/a><\/span><\/div><h1>第 3 章：加法定理与倍角公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n默写和角、差角公式\n<\/li><li>\n推导二倍角公式\n<\/li><li>\n用公式化简求值\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>所有和角、倍角公式都由一条出发：cos(α−β)=cosαcosβ+sinαsinβ。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 和角与差角<\/h3>\n<p>cos(α±β)=cosαcosβ∓sinαsinβ sin(α±β)=sinαcosβ±cosαsinβ tan(α±β)=(tanα±tanβ)/(1∓tanαtanβ)<\/p>\n<p>推导思路：在单位圆上取两点，用两点距离公式与余弦定理，令两点夹角为 α−β，展开即得 cos(α−β)。其余公式由它推出。<\/p>\n<h3>3.2 二倍角<\/h3>\n<p>令 β=α：<\/p>\n<p>sin2α=2sinαcosα cos2α=cos²α−sin²α=2cos²α−1=1−2sin²α tan2α=2tanα/(1−tan²α)<\/p>\n<p>cos2α 的三个形式各有用途：求值时选能约掉的，降幂时用 2cos²α−1 或 1−2sin²α。<\/p>\n<h3>3.3 半角与降幂<\/h3>\n<p>由 cos2α=1−2sin²α 得 sin²α=(1−cos2α)/2；由 cos2α=2cos²α−1 得 cos²α=(1+cos2α)/2。<\/p>\n<p>这两条是“降幂公式”，把平方降成一次，是化简与积分的基础。<\/p>\n<h3>3.4 辅助角公式<\/h3>\n<p>a sinx+b cosx=√(a²+b²) sin(x+φ)，其中 tanφ=b/a。它把两项合成一项，便于求最值与周期。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：加法定理像“两个旋转叠加”：先转 α 再转 β，等于一次转 α+β，但要用坐标的混合表示。<\/p>\n<p><strong>失效边界<\/strong>：tan 的公式要求分母不为零，α±β 不能等于 90° 的奇数倍。<\/p>\n<p><strong>实例<\/strong>：sin75°=sin(45°+30°)=sin45°cos30°+cos45°sin30°=(√6+√2)/4≈0.966。 cos60°=cos(2×30°)=1−2sin²30°=1−1/2=1/2，验证正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 sin(α+β)=sinα+sinβ —— 实际上 不成立。取 α=β=30°：左边 sin60°≈0.866，右边 1。\n<\/li><li>\n别以为 cos2α 只有一个形式 —— 实际上 有三个等价形式，按题目需要选用，选错会增加计算量。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ncos(α+β) 展开为：\n<\/li><li>\nsin2α 等于：\n<p>A. cosαcosβ+sinαsinβ ｜ B. cosαcosβ−sinαsinβ ｜ C. sinαcosβ+cosαsinβ ｜ D. sinαcosβ−cosαsinβ <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：余弦和角公式为 cosαcosβ−sinαsinβ。 A. 2sinα ｜ B. 2sinαcosα ｜ C. sin²α−cos²α ｜ D. 1−2sin²α <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：二倍角正弦公式为 2sinαcosα。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ncos(α±β)=cosαcosβ∓sinαsinβ\n<\/li><li>\nsin2α=2sinαcosα；cos2α 有三种形式\n<\/li><li>\n降幂：sin²=(1−cos2α)/2\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：加法定理与倍角公式）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：加法定理与倍角公式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>整套和角公式只需推一条：cos(α−β)。其余靠“换元、令 β=α、相除”得到。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>加法定理指把 α±β 的三角比展开为 α、β 的三角比的公式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像两把尺子接起来量长度：接缝处的重叠部分要被减掉（余弦公式里的减号）。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 余弦差角<\/h3>\n<div class=\"katex-block\">\\cos(\\alpha-\\beta)=\\cos\\alpha\\cos\\beta+\\sin\\alpha\\sin\\beta<\/div>\n<p>由单位圆两点距离公式展开得到，是全部公式的源头。<\/p>\n<h3>2. 正弦和角<\/h3>\n<div class=\"katex-block\">\\sin(\\alpha+\\beta)=\\sin\\alpha\\cos\\beta+\\cos\\alpha\\sin\\beta<\/div>\n<p>用诱导公式 sinθ=cos(90°−θ) 从余弦公式转出。<\/p>\n<h3>3. 二倍角<\/h3>\n<div class=\"katex-block\">\\sin 2\\alpha=2\\sin\\alpha\\cos\\alpha<\/div>\n<p>令 β=α 代入和角公式即得。<\/p>\n<h3>4. 降幂<\/h3>\n<div class=\"katex-block\">\\sin^{2}\\alpha=\\frac{1-\\cos 2\\alpha}{2}<\/div>\n<p>由 cos2α 的变形反解，把平方降为一次。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>公式对所有角成立，但 tan 的公式在分母为零时失效，要单独讨论。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《三角函数》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch04": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/trigonometry/chapter/ch03\">第 3 章：加法定理与倍角公式<\/a><\/span><\/div><h1>第 4 章：图象、性质与三角方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n画出三种三角函数的图象并说出周期、对称性\n<\/li><li>\n分析 y=A sin(ωx+φ) 的振幅、周期、相位\n<\/li><li>\n写出简单三角方程的通解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>正弦、余弦的周期是 2π，正切是 π；图象的平移伸缩都写在 A、ω、φ 三个参数里。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 三种基本图象<\/h3>\n<ul><li>\ny=sin x：定义域 R，值域 [−1,1]，周期 2π，奇函数，对称中心 (kπ,0)，对称轴 x=π/2+kπ；\n<\/li><li>\ny=cos x：值域 [−1,1]，周期 2π，偶函数，对称轴 x=kπ；\n<\/li><li>\ny=tan x：定义域 x≠π/2+kπ，值域 R，周期 π，奇函数，无对称轴。\n<\/ul>\n<h3>4.2 一般形式 y=A sin(ωx+φ)+k<\/h3>\n<ul><li>\nA 是振幅（图象高度），|A| 越大越“高”；\n<\/li><li>\nω 决定周期 T=2π/|ω|；\n<\/li><li>\nφ 是初相，决定左右平移：左移 φ/ω（φ&gt;0 时）；\n<\/li><li>\nk 是上下平移。\n<\/ul>\n<p>五点法画图：取 ωx+φ=0、π/2、π、3π/2、2π 五个点，描出后再连线。<\/p>\n<h3>4.3 三角方程<\/h3>\n<p>sinx=a（|a|≤1）的通解：x=kπ+(−1)<sup>k<\/sup> arcsin a；也可写成 x=arcsin a+2kπ 或 x=π−arcsin a+2kπ。<\/p>\n<p>cosx=a 的通解：x=±arccos a+2kπ。<\/p>\n<p>tanx=a 的通解：x=arctan a+kπ。<\/p>\n<p>求通解后，若题目限定区间，再把 k 取遍并筛出落在区间内的解。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：正弦曲线像水波，振幅是波高，周期是两波峰的距离，相位是波从哪里开始。<\/p>\n<p><strong>失效边界<\/strong>：ω 必须取正再谈周期；ω 为负时先提出负号，否则平移方向会反。<\/p>\n<p><strong>实例<\/strong>：y=3sin(2x+π/3)：振幅 3，周期 2π/2=π，初相 π/3，图象左移 π/6。 解 sinx=1/2：x=π/6+2kπ 或 x=5π/6+2kπ。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 周期只与 A 有关 —— 实际上 周期由 ω 决定，T=2π/|ω|；A 只改变高度。\n<\/li><li>\n别以为 三角方程只有一个解 —— 实际上 在实数范围内有无穷多解，必须写通解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny=2sin(3x) 的周期是：\n<\/li><li>\n方程 cosx=0 的通解是：\n<p>A. 2π ｜ B. 2π/3 ｜ C. 3π ｜ D. π/3 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：T=2π/|ω|=2π/3。 A. x=kπ ｜ B. x=π/2+kπ ｜ C. x=2kπ ｜ D. x=π/4+kπ <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：余弦为零的角是 π/2 的奇数倍，即 x=π/2+kπ。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsin、cos 周期 2π，tan 周期 π\n<\/li><li>\ny=A sin(ωx+φ)：A 振幅、ω 定周期、φ 定平移\n<\/li><li>\n三角方程写通解，再按区间筛选\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：图象、性质与三角方程）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：图象、性质与三角方程<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>三角函数的图象不是画出来的，是“单位圆上的点转一圈，纵坐标随时间变化”描出来的。理解了这一句，周期与波形都有了来源。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>周期函数指存在 T≠0 使 f(x+T)=f(x) 恒成立；最小正周期是最小的这样的 T。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像摩天轮上的一个座舱：转一圈回到原高度，高度随时间的变化就是正弦曲线。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 周期<\/h3>\n<div class=\"katex-block\">T=\\frac{2\\pi}{|\\omega|}<\/div>\n<p>ω 越大转得越快，周期越短。<\/p>\n<h3>2. 五点法<\/h3>\n<div class=\"katex-block\">\\omega x+\\varphi=0,\\ \\frac{\\pi}{2},\\ \\pi,\\ \\frac{3\\pi}{2},\\ 2\\pi<\/div>\n<p>取这五个相位值，对应图象的零点、最值点。<\/p>\n<h3>3. 正弦方程<\/h3>\n<div class=\"katex-block\">\\sin x=a\\ \\Rightarrow\\ x=k\\pi+(-1)^{k}\\arcsin a<\/div>\n<p>一个周期内有两解，用 (−1)<sup>k<\/sup> 统一表示。<\/p>\n<h3>4. 余弦方程<\/h3>\n<div class=\"katex-block\">\\cos x=a\\ \\Rightarrow\\ x=\\pm\\arccos a+2k\\pi<\/div>\n<p>余弦关于 y 轴对称，两解关于 0 对称。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>tan 的周期是 π 而不是 2π；讨论周期前要先看定义域是否被切断。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《三角函数》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/trigonometry/chapter/ch01\">第 1 章：角、弧度与三角比<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/trigonometry/chapter/ch02\">第 2 章：同角关系与诱导公式<\/a><\/span><\/div><h1>单位圆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>三角函数的一切定义、符号、公式，都能在单位圆上找到出处。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是把“几何的角”变成“可运算的数”的那座桥。<\/p>\n<h2>详解<\/h2>\n<p>角 θ 的终边与单位圆交于 P(x,y)，则 cosθ=x、sinθ=y、tanθ=y/x。平方关系来自 x²+y²=1；诱导公式来自四个象限的对称；和角公式来自圆上两点的距离。<\/p>\n<h2>常见误解<\/h2>\n<p>只背公式不看圆，符号一错就全错。<\/p>\n<h2>相关概念<\/h2>\n<p>三角比（ch01）、诱导公式（ch02）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/trigonometry/chapter/ch04\">第 4 章：图象、性质与三角方程<\/a><\/span><\/div><h1>周期与相位<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>ω 决定多久重复一次，φ 决定从哪里开始，A 决定多高。<\/p>\n<h2>为什么重要<\/h2>\n<p>一切往复现象（振动、交流电、声波）都用这三个参数描述。<\/p>\n<h2>详解<\/h2>\n<p>y=A sin(ωx+φ)+k：周期 T=2π/|ω|，振幅 |A|，初相 φ，平衡位置 k。平移量是 φ/ω，不是 φ，这是最容易错的一步。<\/p>\n<h2>常见误解<\/h2>\n<p>把 φ 直接当成平移量，忽略 ω 的缩放作用。<\/p>\n<h2>相关概念<\/h2>\n<p>图象（ch04）、加法定理（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：角、弧度与三角比<\/strong><br>阅读：<a href=\"#/book/trigonometry/chapter/ch01\">第 1 章：角、弧度与三角比<\/a><br>检查点：能把任意角化到 0°~360°并说出象限<\/li><li class='path-step' id='path-02'><strong>步骤 02：同角关系与诱导公式<\/strong><br>阅读：<a href=\"#/book/trigonometry/chapter/ch02\">第 2 章：同角关系与诱导公式<\/a><br>检查点：能把任意角的三角比化成锐角<\/li><li class='path-step' id='path-03'><strong>步骤 03：加法定理与倍角<\/strong><br>阅读：<a href=\"#/book/trigonometry/chapter/ch03\">第 3 章：加法定理与倍角公式<\/a><br>检查点：能默写和角、差角与二倍角公式<\/li><li class='path-step' id='path-04'><strong>步骤 04：图象、性质与三角方程<\/strong><br>阅读：<a href=\"#/book/trigonometry/chapter/ch04\">第 4 章：图象、性质与三角方程<\/a><br>检查点：能说出周期、对称轴并写通解<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：角、弧度与三角比<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 与 −30° 终边相同的角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 30°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 330°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 300°<\/label><label class='quiz-opt'><input ty bel><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> sin²α−cos²α<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 1−2sin²α<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：图象、性质与三角方程<\/h1><div class='quiz-item' data-qid='ch04-q07' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> y=2sin(3x) 的周期是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> 2π<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> 2π/3<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> 3π<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> π/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 方程 cosx=0 的通解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> x=kπ<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> x=π/2+kπ<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> x=2kπ<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> x=π/4+kπ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='弧度'>弧度 — 弧长与半径之比定义的角的度量。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='终边相同的角'>终边相同的角 — 相差 360° 整数倍的角。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='正弦'>正弦 — 单位圆上角的终边交点的纵坐标。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='余弦'>余弦 — 单位圆上角的终边交点的横坐标。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='诱导公式'>诱导公式 — 把任意角三角比化为锐角三角比的公式。 <span class=glossary-ref>（第 2 章：同角关系与诱导公式）<\/span><\/li><li data-term='加法定理'>加法定理 — 展开 α±β 三角比的公式。 <span class=glossary-ref>（第 3 章：加法定理与倍角公式）<\/span><\/li><li data-term='二倍角公式'>二倍角公式 — sin2α、cos2α、tan2α 的公式。 <span class=glossary-ref>（第 3 章：加法定理与倍角公式）<\/span><\/li><li data-term='周期'>周期 — 函数值重复出现的最小正间隔。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><li data-term='振幅'>振幅 — y=A sin(ωx+φ) 中的 |A|。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><li data-term='通解'>通解 — 含整数 k、表示全部解的表达式。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：化简三步<\/h2>\n<p>① 用诱导公式把角化到锐角；② 统一函数名；③ 用平方关系或和角公式合并。<\/p>\n<h2>框架：图象五问<\/h2>\n<p>① 定义域；② 值域与振幅；③ 周期；④ 对称轴与对称中心；⑤ 单调区间。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>互化<\/td><td>18 c01", "prerequisites": ["ch01"]}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "直线 x=4 的斜率：", "options": ["0", "1", "不存在", "4"], "answer": 2, "explain": "竖直线与 x 轴垂直，倾斜角 90°，正切无定义，故斜率不存在。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "过点 (1,2) 且斜率为 3 的直线方程是：", "options": ["y−2=3(x−1)", "y+2=3(x+1)", "y=3x", "3x−y+1=0"], "answer": 0, "explain": "点斜式直接写成 y−2=3(x−1)。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "直线 2x−3y+6=0 的斜率是：", "options": ["2/3", "−2/3", "3/2", "−3/2"], "answer": 0, "explain": "k=−A/B=−2/(−3)=2/3。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "直线 y=3x+1 与 y=3x−2 的位置关系是：", "options": ["相交", "平行", "重合", "垂直"], "answer": 1, "explain": "斜率相同、截距不同，故平行。", "relatedConceptId": "c01", "prerequisites": ["ch03"]}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "点 (2,1) 到直线 x−y+1=0 的距离是：", "options": ["2", "√2", "1", "2√2"], "answer": 1, "explain": "|2−1+1|/√2=2/√2=√2。", "relatedConceptId": "c01", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "过点 (0,2) 且与直线 y=2x+1 平行的直线方程是：", "options": ["y=2x+2", "y=−2x+2", "y=x+2", "y=2x−2"], "answer": 0, "explain": "平行则斜率相同为 2，过 (0,2) 得 y=2x+2。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "直线 3x+4y−10=0 与 3x+4y+5=0 之间的距离是：", "options": ["3", "15", "5", "1"], "answer": 0, "explain": "d=|−10−5|/√(9+16)=15/5=3。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：倾斜角与斜率」的一句话核心是什么？", "back": "斜率是直线倾斜程度的数：k=tanα，α 是倾斜角；竖直直线没有斜率。", "tags": ["line-equations", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：直线方程的五种形式」的一句话核心是什么？", "back": "五种形式是同一件事的五种写法；选哪种取决于题目给了什么条件。", "tags": ["line-equations", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：位置关系与距离」的一句话核心是什么？", "back": "平行看斜率相等，垂直看斜率乘积为 −1；距离靠“点到直线的公式”。", "tags": ["line-equations", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「倾斜角」？", "back": "直线向上方向与 x 轴正方向的夹角。", "tags": ["line-equations", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「斜率」？", "back": "倾斜角的正切，反映直线的倾斜程度。", "tags": ["line-equations", "术语"]}, {"id": "f06", "chapterId": "ch02", "front": "什么是「点斜式」？", "back": "y−y₀=k(x−x₀)。", "tags": ["line-equations", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「斜截式」？", "back": "y=kx+b。", "tags": ["line-equations", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「截距式」？", "back": "x/a+y/b=1。", "tags": ["line-equations", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「一般式」？", "back": "Ax+By+C=0（A、B 不全为零）。", "tags": ["line-equations", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「点到直线距离」？", "back": "点与直线上最近点的距离。", "tags": ["line-equations", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「夹角」？", "back": "两直线所成的锐角或直角。", "tags": ["line-equations", "术语"]}], "companion": "line-equations学习伴侣.html", "deriv": "line-equations从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-18-直线方程 章士藻.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">坐标、三角比<\/span><\/div><h1>第 1 章：倾斜角与斜率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：坐标、三角比\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n由两点求斜率\n<\/li><li>\n判断倾斜角与斜率的对应\n<\/li><li>\n处理斜率不存在的情形\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>斜率是直线倾斜程度的数：k=tanα，α 是倾斜角；竖直直线没有斜率。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 倾斜角<\/h3>\n<p>直线向上的方向与 x 轴正方向的夹角叫倾斜角 α，范围 [0°,180°)。水平线 α=0°，竖直线 α=90°。<\/p>\n<h3>1.2 斜率<\/h3>\n<p>k=tanα（α≠90°）。由两点 P₁(x₁,y₁)、P₂(x₂,y₂)：<\/p>\n<p>k=(y₂−y₁)/(x₂−x₁)，要求 x₂≠x₁。<\/p>\n<ul><li>\nk&gt;0：直线上升，α 为锐角；\n<\/li><li>\nk&lt;0：直线下降，α 为钝角；\n<\/li><li>\nk=0：水平线；\n<\/li><li>\n斜率不存在：竖直线 x=x₀。\n<\/ul>\n<h3>1.3 斜率的用途<\/h3>\n<p>斜率是解析几何的“万能钥匙”：平行、垂直、夹角、切线，几乎都先算斜率。看到“直线过两点”，第一反应就该是算 k。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：斜率像坡道的陡度：每向右走 1 米，升高几米。<\/p>\n<p><strong>失效边界<\/strong>：竖直坡道的陡度无法用“每米升高”描述，所以竖直直线没有斜率。<\/p>\n<p><strong>实例<\/strong>：过 A(1,2)、B(4,11) 的直线，k=(11−2)/(4−1)=3，倾斜角 arctan3≈71.6°。 过 C(2,5)、D(2,−1) 的直线，x 坐标相同，斜率不存在，方程是 x=2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 所有直线都有斜率 —— 实际上 竖直线没有斜率；解题时要单独讨论 x 坐标相同的情形。\n<\/li><li>\n别以为 斜率大就是直线长 —— 实际上 斜率只表示倾斜程度，与长度无关。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n过点 (1,1) 与 (3,5) 的直线斜率是：\n<\/li><li>\n直线 x=4 的斜率：\n<p>A. 1 ｜ B. 2 ｜ C. 4 ｜ D. 1/2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：k=(5−1)/(3−1)=2。 A. 0 ｜ B. 1 ｜ C. 不存在 ｜ D. 4 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：竖直线与 x 轴垂直，倾斜角 90°，正切无定义，故斜率不存在。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nk=tanα，α∈[0°,180°)\n<\/li><li>\nk=(y₂−y₁)/(x₂−x₁)，x₂≠x₁\n<\/li><li>\n竖直直线无斜率\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：倾斜角与斜率）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：倾斜角与斜率<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>斜率不是新概念，它就是倾斜角的正切。把角度换成比值，直线就能用代数处理了。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>倾斜角是直线向上方向与 x 轴正方向的夹角；斜率是该角的正切。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像楼梯的“每级高度与宽度之比”，比值固定，陡度就固定。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 斜率定义<\/h3>\n<div class=\"katex-block\">k=\\tan\\alpha,\\quad \\alpha\\ne 90^{\\circ}<\/div>\n<p>倾斜角的正切，反映直线升降的快慢。<\/p>\n<h3>2. 两点斜率<\/h3>\n<div class=\"katex-block\">k=\\frac{y_{2}-y_{1}}{x_{2}-x_{1}}<\/div>\n<p>由两点坐标直接算，分母不能为零。<\/p>\n<h3>3. 平行判据<\/h3>\n<div class=\"katex-block\">k_{1}=k_{2}\\ \\text{且截距不同}<\/div>\n<p>斜率相同且不重合，两直线平行。<\/p>\n<h3>4. 垂直判据<\/h3>\n<div class=\"katex-block\">k_{1}k_{2}=-1<\/div>\n<p>两条非竖直直线垂直时，斜率互为负倒数。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>倾斜角为 90° 时正切不存在，这是必须单独处理的唯一一种直线。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《直线方程》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-18-直线方程 章士藻.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/line-equations/chapter/ch01\">第 1 章：倾斜角与斜率<\/a><\/span><\/div><h1>第 2 章：直线方程的五种形式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按条件写出点斜式、斜截式、两点式、截距式\n<\/li><li>\n把各种形式化为一般式\n<\/li><li>\n识别每种形式的失效条件\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>五种形式是同一件事的五种写法；选哪种取决于题目给了什么条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 五种形式<\/h3>\n<ul><li>\n点斜式：y−y₀=k(x−x₀)，已知一点与斜率；不能表示竖直线；\n<\/li><li>\n斜截式：y=kx+b，已知斜率与 y 轴截距；\n<\/li><li>\n两点式：(y−y₁)/(y₂−y₁)=(x−x₁)/(x₂−x₁)，已知两点；不能表示水平线与竖直线；\n<\/li><li>\n截距式：x/a+y/b=1，已知两轴截距；不能表示过原点或平行于坐标轴的直线；\n<\/li><li>\n一般式：Ax+By+C=0（A、B 不全为零），可以表示所有直线。\n<\/ul>\n<h3>2.2 选择策略<\/h3>\n<p>给点与斜率 → 点斜式；给两点 → 两点式或先求斜率；给截距 → 截距式；题目要求“求直线方程”且无特殊条件 → 一般式收尾。<\/p>\n<h3>2.3 一般式的系数含义<\/h3>\n<p>Ax+By+C=0 中，斜率 k=−A/B（B≠0），y 轴截距 −C/B，x 轴截距 −C/A。<\/p>\n<p>用一般式判断平行垂直最省事：平行看 A₁B₂=A₂B₁，垂直看 A₁A₂+B₁B₂=0（不必讨论斜率是否存在）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：五种形式像同一件衣服的五种穿法，场合不同选不同，但都是同一件衣服。<\/p>\n<p><strong>失效边界<\/strong>：每种形式都有“表示不了”的直线，写答案时要注明或改用一般式。<\/p>\n<p><strong>实例<\/strong>：过点 (2,3) 且斜率 4：y−3=4(x−2)，即 4x−y−5=0。 过 (1,0) 与 (0,2)：x/1+y/2=1，即 2x+y−2=0。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 一般式与斜截式不能互化 —— 实际上 B≠0 时一般式可化为 y=−(A/B)x−C/B，就是斜截式。\n<\/li><li>\n别以为 截距式可以表示任何直线 —— 实际上 过原点的直线两截距都为零，分母为零，截距式失效。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n过点 (1,2) 且斜率为 3 的直线方程是：\n<\/li><li>\n直线 2x−3y+6=0 的斜率是：\n<p>A. y−2=3(x−1) ｜ B. y+2=3(x+1) ｜ C. y=3x ｜ D. 3x−y+1=0 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：点斜式直接写成 y−2=3(x−1)。 A. 2/3 ｜ B. −2/3 ｜ C. 3/2 ｜ D. −3/2 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：k=−A/B=−2/(−3)=2/3。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n点斜式、斜截式、两点式、截距式、一般式\n<\/li><li>\n每种形式都有表示不了的直线\n<\/li><li>\n一般式斜率 k=−A/B\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：直线方程的五种形式）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：直线方程的五种形式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>一条直线由“一点＋方向”唯一确定。点斜式就是这句话的代数写法，其余形式都是它的变形。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>直线方程指以直线上点的坐标为解的二元一次方程。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像给路线下指令：告诉我起点和朝向，路就定了。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 点斜式<\/h3>\n<div class=\"katex-block\">y-y_{0}=k(x-x_{0})<\/div>\n<p>一点加斜率，直线唯一确定。<\/p>\n<h3>2. 斜截式<\/h3>\n<div class=\"katex-block\">y=kx+b<\/div>\n<p>斜率与 y 轴截距，最常用的形式。<\/p>\n<h3>3. 两点式<\/h3>\n<div class=\"katex-block\">\\frac{y-y_{1}}{y_{2}-y_{1}}=\\frac{x-x_{1}}{x_{2}-x_{1}}<\/div>\n<p>两点定直线，注意分母不能为零。<\/p>\n<h3>4. 一般式<\/h3>\n<div class=\"katex-block\">Ax+By+C=0<\/div>\n<p>所有直线都能写成这个形式，A、B 不全为零。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>竖直线没有斜率，点斜式写不出来，必须用 x=x₀。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《直线方程》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-18-直线方程 章士藻.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/line-equations/chapter/ch02\">第 2 章：直线方程的五种形式<\/a><\/span><\/div><h1>第 3 章：位置关系与距离<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断两直线平行、垂直、相交\n<\/li><li>\n求点到直线的距离\n<\/li><li>\n求两平行线间的距离与夹角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>平行看斜率相等，垂直看斜率乘积为 −1；距离靠“点到直线的公式”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 两直线位置关系<\/h3>\n<p>设 l₁: y=k₁x+b₁，l₂: y=k₂x+b₂：<\/p>\n<ul><li>\n平行：k₁=k₂ 且 b₁≠b₂；\n<\/li><li>\n重合：k₁=k₂ 且 b₁=b₂；\n<\/li><li>\n垂直：k₁k₂=−1；\n<\/li><li>\n相交：其余情形。\n<\/ul>\n<p>用一般式时不必讨论斜率：平行 ⇔ A₁B₂=A₂B₁ 且不同时重合；垂直 ⇔ A₁A₂+B₁B₂=0。<\/p>\n<h3>3.2 点到直线的距离<\/h3>\n<p>点 P(x₀,y₀) 到直线 Ax+By+C=0 的距离：<\/p>\n<p>d=|Ax₀+By₀+C|/√(A²+B²)<\/p>\n<p>用之前必须把直线化成一般式，系数不能带分母。<\/p>\n<h3>3.3 两平行线间距离<\/h3>\n<p>两平行线 Ax+By+C₁=0 与 Ax+By+C₂=0（系数必须一致）的距离：<\/p>\n<p>d=|C₁−C₂|/√(A²+B²)<\/p>\n<p>若系数不一致，先化成一致再套公式。<\/p>\n<h3>3.4 夹角<\/h3>\n<p>两直线夹角 θ 满足 tanθ=|(k₂−k₁)/(1+k₁k₂)|。夹角取锐角或直角，范围 (0°,90°]。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：点到直线的距离像问“我离这条马路最近有多远”，最近的路就是垂线。<\/p>\n<p><strong>失效边界<\/strong>：公式要求直线是一般式且 A、B 不为零同时成立；竖直线 B=0 时公式仍成立（分母为 |A|）。<\/p>\n<p><strong>实例<\/strong>：点 (1,1) 到 3x+4y−2=0 的距离：|3+4−2|/5=1。 直线 y=2x+1 与 y=2x−3 平行，距离 |1−(−3)|/√(4+1)=4/√5≈1.79。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 两直线平行就是斜率相等 —— 实际上 还要求截距不同；截距相同则重合。\n<\/li><li>\n别以为 点到直线距离可以直接代点进斜截式 —— 实际上 要化成一般式再代，否则分母不对。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n直线 y=3x+1 与 y=3x−2 的位置关系是：\n<\/li><li>\n点 (2,1) 到直线 x−y+1=0 的距离是：\n<p>A. 相交 ｜ B. 平行 ｜ C. 重合 ｜ D. 垂直 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：斜率相同、截距不同，故平行。 A. 2 ｜ B. √2 ｜ C. 1 ｜ D. 2√2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：|2−1+1|/√2=2/√2=√2。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n平行：k 相等且 b 不同；垂直：k₁k₂=−1\n<\/li><li>\n点到直线距离 |Ax₀+By₀+C|/√(A²+B²)\n<\/li><li>\n平行线距离需先统一系数\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：位置关系与距离）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：位置关系与距离<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>距离公式不是背的：把点向直线作垂线，用勾股或向量投影，就能推出那个分式。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>点到直线的距离指点与直线上所有点连线中最短的那条长度。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像从一点向一条马路走最近的路，一定是垂直穿过去。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 平行<\/h3>\n<div class=\"katex-block\">k_{1}=k_{2},\\ b_{1}\\ne b_{2}<\/div>\n<p>方向相同且不重合。<\/p>\n<h3>2. 垂直<\/h3>\n<div class=\"katex-block\">k_{1}k_{2}=-1<\/div>\n<p>两条非竖直直线垂直，斜率互为负倒数。<\/p>\n<h3>3. 点线距离<\/h3>\n<div class=\"katex-block\">d=\\frac{|Ax_{0}+By_{0}+C|}{\\sqrt{A^{2}+B^{2}}}<\/div>\n<p>把点代入一般式取绝对值，再除以法向量的长度。<\/p>\n<h3>4. 平行线距离<\/h3>\n<div class=\"katex-block\">d=\\frac{|C_{1}-C_{2}|}{\\sqrt{A^{2}+B^{2}}}<\/div>\n<p>两条平行线系数一致时，只差常数项。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>公式只对一般式成立；斜截式必须先移项整理。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《直线方程》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-18-直线方程 章士藻.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/line-equations/chapter/ch01\">第 1 章：倾斜角与斜率<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/line-equations/chapter/ch02\">第 2 章：直线方程的五种形式<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/line-equations/chapter/ch03\">第 3 章：位置关系与距离<\/a><\/span><\/div><h1>斜率与方向<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>斜率是直线唯一的方向指标；平行、垂直、夹角都靠它判断。<\/p>\n<h2>为什么重要<\/h2>\n<p>解析几何里“方向”这件事，全靠斜率变成一个数。<\/p>\n<h2>详解<\/h2>\n<p>k=tanα。k 相等则平行（截距不同），k₁k₂=−1 则垂直，tanθ=|(k₂−k₁)/(1+k₁k₂)| 给夹角。竖直线无斜率，需单独讨论。<\/p>\n<h2>常见误解<\/h2>\n<p>忘记竖直线没有斜率，直接套点斜式或垂直公式。<\/p>\n<h2>相关概念<\/h2>\n<p>倾斜角（ch01）、位置关系（ch03）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-18-直线方程 章士藻.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/line-equations/chapter/ch02\">第 2 章：直线方程的五种形式<\/a><\/span><\/div><h1>形式与适用条件<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每种方程形式都漏掉一类直线，答案要写全就得知道它漏了什么。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是直线方程题最常见的扣分点：用点斜式却漏掉竖直线。<\/p>\n<h2>详解<\/h2>\n<p>点斜式漏竖直线；两点式漏水平线与竖直线；截距式漏过原点及平行于坐标轴的直线；一般式不漏。所以分类讨论时，先处理特殊直线，再写一般情形。<\/p>\n<h2>常见误解<\/h2>\n<p>只写一种形式就交卷，忽略特殊情形。<\/p>\n<h2>相关概念<\/h2>\n<p>五种形式（ch02）、分类讨论（通用）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：倾斜角与斜率<\/strong><br>阅读：<a href=\"#/book/line-equations/chapter/ch01\">第 1 章：倾斜角与斜率<\/a><br>检查点：能由两点求斜率并判断倾斜角范围<\/li><li class='path-step' id='path-02'><strong>步骤 02：直线方程的五种形式<\/strong><br>阅读：<a href=\"#/book/line-equations/chapter/ch02\">第 2 章：直线方程的五种形式<\/a><br>检查点：能按条件选对形式并注明适用条件<\/li><li class='path-step' id='path-03'><strong>步骤 03：位置关系与距离<\/strong><br>阅读：<a href=\"#/book/line-equations/chapter/ch03\">第 3 章：位置关系与距离<\/a><br>检查点：能用一般式系数判断平行垂直<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：倾斜角与斜率<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 过点 (1,1) 与 (3,5) 的直线斜率是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 1/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 直线 x=4 的斜率：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 不存在<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：直线方程的五种形式<\/h2><div class='quiz-item' data-qid='ch02-q03' data-ty
