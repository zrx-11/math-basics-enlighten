t": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "从 5 人中选 3 人排成一排，共有多少种排法：", "options": ["10", "60", "125", "15"], "answer": 1, "explain": "A(5,3)=5×4×3=60。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "从甲地到乙地有 3 条路，从乙地到丙地有 4 条路，从甲到丙必须经乙，共有多少种走法：", "options": ["7", "12", "34", "4"], "answer": 1, "explain": "分两步，用乘法原理：3×4=12。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "从 6 名同学中选 2 名当代表，共有多少种选法：", "options": ["30", "15", "12", "36"], "answer": 1, "explain": "不分顺序，C(6,2)=15。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "C(10,3) 的值是：", "options": ["120", "720", "240", "90"], "answer": 0, "explain": "C(10,3)=10×9×8/6=120。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "用 1、2、3 组成允许重复的三位数，共有多少个：", "options": ["6", "9", "27", "81"], "answer": 2, "explain": "每一位都有 3 种选择：3³=27。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "6 人平均分成 3 组，每组 2 人，共有多少种分法：", "options": ["90", "15", "60", "20"], "answer": 1, "explain": "C(6,2)C(4,2)C(2,2)/3!=15×6×1/6=15。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "从 7 人中选 3 人排成一排照相，共有多少种排法：", "options": ["35", "210", "343", "21"], "answer": 1, "explain": "有序，A(7,3)=7×6×5=210。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "把 4 本不同的书平均分成两堆，每堆 2 本，共有多少种分法：", "options": ["6", "3", "12", "4"], "answer": 1, "explain": "C(4,2)C(2,2)/2!=3，两堆无标号要除以 2!。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：两条原理与排列」的一句话核心是什么？", "back": "分类用加法、分步用乘法；有序用排列。", "tags": ["permutations-combinations", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：组合与组合数」的一句话核心是什么？", "back": "组合只问“选哪些”，不问“怎么排”；所以 C(n,m)=A(n,m)/m!。", "tags": ["permutations-combinations", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：可重复排列与分组分配」的一句话核心是什么？", "back": "允许重复时每一步都有 n 种；分组时若各组人数相同，要除以组数的阶乘。", "tags": ["permutations-combinations", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「加法原理」？", "back": "分类计数，各类互斥则相加。", "tags": ["permutations-combinations", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「乘法原理」？", "back": "分步计数，各步相依则相乘。", "tags": ["permutations-combinations", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「排列」？", "back": "取出的元素要计顺序的排法。", "tags": ["permutations-combinations", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「全排列」？", "back": "n 个元素全部参与排列，共 n! 种。", "tags": ["permutations-combinations", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「组合」？", "back": "只计取出哪些元素、不计顺序。", "tags": ["permutations-combinations", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「组合数」？", "back": "C(n,m)=n!/[m!(n−m)!]。", "tags": ["permutations-combinations", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「可重复排列」？", "back": "元素可重复取用，数目为 nᵐ。", "tags": ["permutations-combinations", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「均匀分组」？", "back": "各组元素个数相同，需除以组数阶乘。", "tags": ["permutations-combinations", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「分配」？", "back": "把分好的组派到有标号的位置。", "tags": ["permutations-combinations", "术语"]}], "companion": "permutations-combinations学习伴侣.html", "deriv": "permutations-combinations从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-08-排列与组合 吴世煦.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">乘法、阶乘<\/span><\/div><h1>第 1 章：两条原理与排列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：乘法、阶乘\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n区分分类与分步并选用加法或乘法原理\n<\/li><li>\n推导排列数公式\n<\/li><li>\n处理有限制条件的排列\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>分类用加法、分步用乘法；有序用排列。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 加法原理<\/h3>\n<p>完成一件事有 k 类互斥的办法，第 i 类有 nᵢ 种，则总数为 n₁+n₂+…+n_k。<\/p>\n<p>关键词是<strong>互斥<\/strong>：同一件事不能既算在第 1 类又算在第 2 类，否则会重复计数。<\/p>\n<h3>1.2 乘法原理<\/h3>\n<p>完成一件事要分 k 步，第 i 步有 nᵢ 种，则总数为 n₁n₂…n_k。<\/p>\n<p>关键词是<strong>相依<\/strong>：前一步选了什么，会限制后一步的选择数。<\/p>\n<h3>1.3 排列<\/h3>\n<p>从 n 个不同元素中取 m 个按顺序排成一列，数目为<\/p>\n<p>A(n,m)=n(n−1)…(n−m+1)=n!/(n−m)!<\/p>\n<p>推导就是乘法原理：第 1 个位置 n 种、第 2 个 n−1 种……第 m 个 n−m+1 种。<\/p>\n<p>m=n 时叫全排列，A(n,n)=n!。<\/p>\n<h3>1.4 有限制条件<\/h3>\n<p>“甲不站排头”这类条件，常用两种办法：<strong>特殊位置优先<\/strong>（先排受限制的位置），或<strong>排除法<\/strong>（总数减去不合要求的）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：分类像走不同的门进同一个房间，走哪扇门都行；分步像先开门再上楼，少一步就到不了。<\/p>\n<p><strong>失效边界<\/strong>：分类必须互斥，分步必须覆盖全部过程；有交叉或遗漏就会算错。<\/p>\n<p><strong>实例<\/strong>：5 人排成一排，甲不站两端。 先排甲：中间 3 个位置任选，3 种；其余 4 人全排列 4!=24 种。共 3×24=72 种。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 分类和分步可以混用 —— 实际上 两者对应不同的结构：互斥的选择相加，先后依赖的步骤相乘。混用会重复或遗漏。\n<\/li><li>\n别以为 A(n,m) 就是 n 的阶乘 —— 实际上 只有 m=n 时才是 n!；一般要除掉 (n−m)!。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n从 5 人中选 3 人排成一排，共有多少种排法：\n<\/li><li>\n从甲地到乙地有 3 条路，从乙地到丙地有 4 条路，从甲到丙必须经乙，共有多少种走法：\n<p>A. 10 ｜ B. 60 ｜ C. 125 ｜ D. 15 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：A(5,3)=5×4×3=60。 A. 7 ｜ B. 12 ｜ C. 34 ｜ D. 4 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：分两步，用乘法原理：3×4=12。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n分类相加（互斥），分步相乘（相依）\n<\/li><li>\nA(n,m)=n!/(n−m)!\n<\/li><li>\n有限制条件：特殊位置优先或排除法\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：两条原理与排列）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：两条原理与排列<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>两条原理分别对应“或者”和“然后”：或者就加，然后就乘。排列公式就是乘法原理的连续使用。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>从 n 个不同元素中取 m 个按一定顺序排列，叫排列，其个数记 A(n,m)。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像排队买票：第一个位置谁站都行，第二个位置只剩 n−1 个人可选。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 加法原理<\/h3>\n<div class=\"katex-block\">N=n_{1}+n_{2}+\\cdots+n_{k}<\/div>\n<p>k 类办法互斥，每类各自能独立完成任务。<\/p>\n<h3>2. 乘法原理<\/h3>\n<div class=\"katex-block\">N=n_{1}\\cdot n_{2}\\cdots n_{k}<\/div>\n<p>k 步依次完成，缺一步任务就没完成。<\/p>\n<h3>3. 排列数<\/h3>\n<div class=\"katex-block\">A(n,m)=n(n-1)\\cdots(n-m+1)=\\frac{n!}{(n-m)!}<\/div>\n<p>逐个位置按乘法原理相乘。<\/p>\n<h3>4. 全排列<\/h3>\n<div class=\"katex-block\">A(n,n)=n!<\/div>\n<p>m=n 时，从 n 个位置一路排到底。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>元素必须互不相同；有重复元素时不能直接用 A(n,m)。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《排列与组合》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-08-排列与组合 吴世煦.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/permutations-combinations/chapter/ch01\">第 1 章：两条原理与排列<\/a><\/span><\/div><h1>第 2 章：组合与组合数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断问题是否与顺序有关\n<\/li><li>\n用 C(n,m) 计算并化简\n<\/li><li>\n使用组合数性质 C(n,m)=C(n,n−m)\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>组合只问“选哪些”，不问“怎么排”；所以 C(n,m)=A(n,m)/m!。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 从排列到组合<\/h3>\n<p>从 n 个里取 m 个，若只关心“取到哪 m 个”，组成的不同集合数为<\/p>\n<p>C(n,m)=A(n,m)/m!=n!/[m!(n−m)!]<\/p>\n<p>除以 m! 的理由：同一组 m 个元素，内部可以排出 m! 种不同顺序，这些在组合里算同一种。<\/p>\n<h3>2.2 判断有序无序<\/h3>\n<ul><li>\n有序：排队、编号、分配不同岗位、组成不同数；\n<\/li><li>\n无序：选代表、选队员、取若干件物品、分组（组本身不分次序）。\n<\/ul>\n<p>拿不准时问一句：把选出的元素互换位置，算不算新的结果？算就是排列。<\/p>\n<h3>2.3 性质<\/h3>\n<ul><li>\nC(n,m)=C(n,n−m)（选出 m 个等价于留下 n−m 个）；\n<\/li><li>\nC(n,0)=C(n,n)=1；\n<\/li><li>\nC(n,m)+C(n,m+1)=C(n+1,m+1)（杨辉恒等式）。\n<\/ul>\n<h3>2.4 常见陷阱<\/h3>\n<p>“至少”“至多”类问题要按类分开加，不能直接乘；混合了排列与组合的题，先分组再排列。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：排列像给选出的球队排首发位置，组合像只报名单不排位置。<\/p>\n<p><strong>失效边界<\/strong>：元素有重复或部分相同（如字母 AAB）时，C(n,m) 不能直接套用。<\/p>\n<p><strong>实例<\/strong>：从 8 人中选 3 人参加比赛（不分角色）：C(8,3)=56。 若 3 人分别担任不同角色：A(8,3)=336=56×6。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 组合与排列只差一个符号 —— 实际上 差的是“顺序算不算不同结果”，这决定了是否除以 m!。\n<\/li><li>\n别以为 C(n,m) 一定小于 A(n,m) —— 实际上 m=0 或 1 时两者相等；m≥2 时组合数才更小。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n从 6 名同学中选 2 名当代表，共有多少种选法：\n<\/li><li>\nC(10,3) 的值是：\n<p>A. 30 ｜ B. 15 ｜ C. 12 ｜ D. 36 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：不分顺序，C(6,2)=15。 A. 120 ｜ B. 720 ｜ C. 240 ｜ D. 90 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：C(10,3)=10×9×8/6=120。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n组合＝排列除以 m!（同组内部顺序不计）\n<\/li><li>\n有序无序看“互换是否算新结果”\n<\/li><li>\nC(n,m)=C(n,n−m)\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：组合与组合数）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：组合与组合数<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>组合不是新公式，而是“把排列里重复算的部分除掉”。除以 m! 的理由只有一个：同一组内部有 m! 种排法。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>从 n 个不同元素中取 m 个组成一组（不计顺序），叫组合，个数记 C(n,m)。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像点菜：先选哪几样是组合，再决定先上哪道是排列。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 关系<\/h3>\n<div class=\"katex-block\">A(n,m)=C(n,m)\\cdot m!<\/div>\n<p>先分组（组合），再在组内排序（m!），两步相乘得到排列数。<\/p>\n<h3>2. 组合数公式<\/h3>\n<div class=\"katex-block\">C(n,m)=\\frac{n!}{m!(n-m)!}<\/div>\n<p>由上式反解，除掉组内顺序造成的重复。<\/p>\n<h3>3. 对称性<\/h3>\n<div class=\"katex-block\">C(n,m)=C(n,n-m)<\/div>\n<p>选出的与留下的互补，数目相同。<\/p>\n<h3>4. 杨辉恒等式<\/h3>\n<div class=\"katex-block\">C(n,m)+C(n,m+1)=C(n+1,m+1)<\/div>\n<p>按“是否包含某个特定元素”分类相加，正好得到下一行。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>元素必须互异；含相同元素时要先处理重复，不能直接套 C(n,m)。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《排列与组合》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-08-排列与组合 吴世煦.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/permutations-combinations/chapter/ch02\">第 2 章：组合与组合数<\/a><\/span><\/div><h1>第 3 章：可重复排列与分组分配<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n计算允许重复的排列与不尽相异元素的排列\n<\/li><li>\n区分均匀分组与非均匀分组\n<\/li><li>\n按“先分组后分配”处理分派问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>允许重复时每一步都有 n 种；分组时若各组人数相同，要除以组数的阶乘。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 允许重复的排列<\/h3>\n<p>从 n 类元素中取 m 个，每类可取任意多次，排成一列，数目为 nᵐ。理由：每一位都有 n 种选择，且互不影响。<\/p>\n<p>例：用 0、1、2 组成三位数（数字可重复），首位不能为 0：2×3×3=18 个。<\/p>\n<h3>3.2 不尽相异元素的全排列<\/h3>\n<p>n 个元素中有 n₁ 个相同、n₂ 个相同……则不同排列数为<\/p>\n<p>n!/(n₁!n₂!…)<\/p>\n<p>因为相同的元素互换位置不算新排列。<\/p>\n<h3>3.3 分组问题<\/h3>\n<p>把 n 个不同元素分成若干组：<\/p>\n<ul><li>\n<strong>非均匀分组<\/strong>（各组人数不同）：直接按组合数依次取，再相乘；\n<\/li><li>\n<strong>均匀分组<\/strong>（各组人数相同）：乘完之后要除以组数的阶乘，因为组与组之间没有标号，互换整组不算新分法。\n<\/ul>\n<p>例：6 人平均分成 3 组，每组 2 人：C(6,2)C(4,2)C(2,2)/3!=15。若不除以 3!，得到 90，是把组的标号也算进去了。<\/p>\n<h3>3.4 分配问题<\/h3>\n<p>若组有明确归属（如分到 3 个不同班级），则先分组、再对组做全排列（分配）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：均匀分组像把 6 个苹果装进 3 个一模一样的袋子，袋子互换不算新装法。<\/p>\n<p><strong>失效边界<\/strong>：一旦袋子贴上标签（甲乙丙），互换就算新分法，不能再除。<\/p>\n<p><strong>实例<\/strong>：4 人分成两组，每组 2 人：C(4,2)C(2,2)/2!=3。 若分成“甲组 2 人、乙组 2 人”：C(4,2)=6（另一组自动确定）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 均匀分组不用除组数阶乘 —— 实际上 不除就把“哪一组先取”当成了区别，重复计算了 组数! 倍。\n<\/li><li>\n别以为 分组与分配是一回事 —— 实际上 分组只看集合划分；分配还要决定每组去哪个位置，多一步全排列。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用 1、2、3 组成允许重复的三位数，共有多少个：\n<\/li><li>\n6 人平均分成 3 组，每组 2 人，共有多少种分法：\n<p>A. 6 ｜ B. 9 ｜ C. 27 ｜ D. 81 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：每一位都有 3 种选择：3³=27。 A. 90 ｜ B. 15 ｜ C. 60 ｜ D. 20 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：C(6,2)C(4,2)C(2,2)/3!=15×6×1/6=15。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n允许重复：nᵐ；相同元素：n!/(n₁!n₂!…)\n<\/li><li>\n均匀分组要除以组数阶乘\n<\/li><li>\n先分组后分配\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：可重复排列与分组分配）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：可重复排列与分组分配<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>可重复与分组是两条容易混的规则：前者“每步都满额”，后者“整组互换不算新”。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>允许重复的排列指同一元素可多次出现；分组指把元素划分成若干无标号的子集。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像发牌：每张牌发到谁手上是分配；把牌分成几堆不标号，是分组。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 可重复排列<\/h3>\n<div class=\"katex-block\">\\underbrace{n\\cdot n\\cdots n}_{m\\ \\text{位}}=n^{m}<\/div>\n<p>每一位都独立地有 n 种选择。<\/p>\n<h3>2. 不尽相异<\/h3>\n<div class=\"katex-block\">\\frac{n!}{n_{1}!n_{2}!\\cdots}<\/div>\n<p>相同元素互换不算新排列，所以要除掉。<\/p>\n<h3>3. 均匀分组<\/h3>\n<div class=\"katex-block\">\\frac{C(n,k)C(n-k,k)\\cdots}{m!}<\/div>\n<p>m 个同样大小的组互换不产生新分法。<\/p>\n<h3>4. 先分后配<\/h3>\n<div class=\"katex-block\">\\text{分组数}\\times m!<\/div>\n<p>组有标号时，再对 m 个组做全排列分配。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>分组结果是否要除以阶乘，取决于组有没有标号；有标号就不能除。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《排列与组合》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-08-排列与组合 吴世煦.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/permutations-combinations/chapter/ch01\">第 1 章：两条原理与排列<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/permutations-combinations/chapter/ch02\">第 2 章：组合与组合数<\/a><\/span><\/div><h1>有序与无序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>互换两个元素算不算新结果，决定用排列还是组合。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是计数题的第一个判断，选错公式后面全错。<\/p>\n<h2>详解<\/h2>\n<p>排队、编号、不同岗位、组数（如 123 与 321 不同）都是有序；选代表、选物品、分组（组内不分次序）都是无序。拿不准就用小数字试：2 个元素互换，结果变了就是排列。<\/p>\n<h2>常见误解<\/h2>\n<p>看到“选”就用组合，看到“排”就用排列，不看具体语境。<\/p>\n<h2>相关概念<\/h2>\n<p>排列（ch01）、组合（ch02）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-08-排列与组合 吴世煦.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/permutations-combinations/chapter/ch03\">第 3 章：可重复排列与分组分配<\/a><\/span><\/div><h1>先分组后分配<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>先把元素分成若干组（无标号），再把组派到具体位置（有标号）。<\/p>\n<h2>为什么重要<\/h2>\n<p>分组分配类问题几乎都靠这个结构，混着做必然重复或遗漏。<\/p>\n<h2>详解<\/h2>\n<p>分组阶段用组合数，均匀分组要除以组数阶乘；分配阶段对组做全排列。两步相乘。若题目直接给了组的名号（甲乙丙），说明已经带标号，只剩分配一步。<\/p>\n<h2>常见误解<\/h2>\n<p>把分组和分配合并成一次排列，导致同一种分法被反复计数。<\/p>\n<h2>相关概念<\/h2>\n<p>均匀分组（ch03）、组合数（ch02）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：两条原理与排列<\/strong><br>阅读：<a href=\"#/book/permutations-combinations/chapter/ch01\">第 1 章：两条原理与排列<\/a><br>检查点：能判断一道题该加还是该乘<\/li><li class='path-step' id='path-02'><strong>步骤 02：组合与组合数<\/strong><br>阅读：<a href=\"#/book/permutations-combinations/chapter/ch02\">第 2 章：组合与组合数<\/a><br>检查点：能判断有序无序并选出正确公式<\/li><li class='path-step' id='path-03'><strong>步骤 03：可重复排列与分组分配<\/strong><br>阅读：<a href=\"#/book/permutations-combinations/chapter/ch03\">第 3 章：可重复排列与分组分配<\/a><br>检查点：能把分组问题按“均匀/非均匀”分开处理<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：两条原理与排列<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 从 5 人中选 3 人排成一排，共有多少种排法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 10<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 60<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 125<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 15<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案  class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q8.<\/b> 把 4 本不同的书平均分成两堆，每堆 2 本，共有多少种分法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 3<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 12<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：两条原理与排列<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 从 5 人中选 3 人排成一排，共有多少种排法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 10<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 60<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 125<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 15<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 从甲地到乙地有 3 条路，从乙地到丙地有 4 条路，从甲到丙必须经乙，共有多少种走法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 7<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 12<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 34<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz ><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 6 人平均分成 3 组，每组 2 人，共有多少种分法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 90<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 15<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 60<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='加法原理'>加法原理 — 分类计数，各类互斥则相加。 <span class=glossary-ref>（第 1 章：两条原理与排列）<\/span><\/li><li data-term='乘法原理'>乘法原理 — 分步计数，各步相依则相乘。 <span class=glossary-ref>（第 1 章：两条原理与排列）<\/span><\/li><li data-term='排列'>排列 — 取出的元素要计顺序的排法。 <span class=glossary-ref>（第 1 章：两条原理与排列）<\/span><\/li><li data-term='全排列'>全排列 — n 个元素全部参与排列，共 n! 种。 <span class=glossary-ref>（第 1 章：两条原理与排列）<\/span><\/li><li data-term='组合'>组合 — 只计取出哪些元素、不计顺序。 <span class=glossary-ref>（第 2 章：组合与组合数）<\/span><\/li><li data-term='组合数'>组合数 — C(n,m)=n!/[m!(n−m)!]。 <span class=glossary-ref>（第 2 章：组合与组合数）<\/span><\/li><li data-term='可重复排列'>可重复排列 — 元素可重复取用，数目为 nᵐ。 <span class=glossary-ref>（第 3 章：可重复排列与分组分配）<\/span><\/li><li data-term='均匀分组'>均匀分组 — 各组元素个数相同，需除以组数阶乘。 <span class=glossary-ref>（第 3 章：可重复排列与分组分配）<\/span><\/li><li data-term='分配'>分配 — 把分好的组派到有标号的位置。 <span class=glossary-ref>（第 3 章：可重复排列与分组分配）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：计数四问<\/h2>\n<p>① 完成这件事是分类还是分步？② 元素能否重复？③ 顺序算不算不同？④ 组有没有标号？四问答完，公式自然定。<\/p>\n<h2>框架：复杂题拆解<\/h2>\n<p>先按“至少/至多/限制条件”分类，类内再分步，最后把各类相加。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>加法原理<\/td><td>分类互斥，N=n₁+…+n_k<\/td><\/tr><tr><td>乘法原理<\/td><td>分步相依，N=n₁…n_k<\/td><\/tr><tr><td>排列数<\/td><td>A(n,m)=n!/(n−m)!<\/td><\/tr><tr><td>组合数<\/td><td>C(n,m)=n!/[m!(n−m)!]<\/td><\/tr><tr><td>组合性质<\/td><td>C(n,m)=C(n,n−m)；C(n,0)=1<\/td><\/tr><tr><td>可重复<\/td><td>nᵐ<\/td><\/tr><tr><td>均匀分组<\/td><td>除以组数阶乘<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：两条原理与排列", "href": "#/chapter/ch01"}, {"label": "第 2 章：组合与组合数", "href": "#/chapter/ch02"}, {"label": "第 3 章：可重复排列与分组分配", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "有序与无序", "href": "#/concept/c01"}, {"label": "先分组后分配", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：两条原理与排列", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：组合与组合数", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：可重复排列与分组分配", "href": "#/quiz/ch03"}]}, {"label" ront": "什么是「连分数」？", "back": "分母中含下一层分式的无限表达式。", "tags": ["sequences-limits", "术语"]}], "companion": "sequences-limits学习伴侣.html", "deriv": "sequences-limits从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-09-数列与极限 周伯堳.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">函数、代数式<\/span><\/div><h1>第 1 章：数列与通项<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：函数、代数式\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n区分通项公式与递推公式\n<\/li><li>\n由通项写出前若干项并判断增减\n<\/li><li>\n用差分找简单数列的规律\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>数列是定义在正整数上的函数：aₙ=f(n)，顺序本身就是信息。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 数列是有序的<\/h3>\n<p>数列 a₁,a₂,…,aₙ,… 是按顺序排好的一串数。交换两项就变成另一个数列，这与集合不同。<\/p>\n<h3>1.2 两种表示<\/h3>\n<ul><li>\n<strong>通项公式<\/strong>：aₙ 用 n 直接表示，如 aₙ=2n−1，代入 n=1,2,3 得 1,3,5；\n<\/li><li>\n<strong>递推公式<\/strong>：给出首项与“后项如何由前项得到”，如 a₁=1、aₙ₊₁=aₙ+3。\n<\/ul>\n<p>通项便于直接算任意一项，递推便于描述生成过程，两者常互相转化。<\/p>\n<h3>1.3 单调性与有界性<\/h3>\n<p>aₙ₊₁&gt;aₙ 为递增，反之为递减。数列有界指存在 M 使 |aₙ|≤M 对所有 n 成立。这两条是后面判断极限存在的前提。<\/p>\n<h3>1.4 用差分找规律<\/h3>\n<p>相邻两项之差 dₙ=aₙ₊₁−aₙ 若为常数，就是等差数列；相邻两项之比若为常数，就是等比数列。差分是识别规律的第一把工具。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：数列像按日期排好的日记，顺序变了意思就变了。<\/p>\n<p><strong>失效边界<\/strong>：仅凭前几项猜通项并不可靠，1,2,4,8 后面也可能是 15（不是 2 的幂）。<\/p>\n<p><strong>实例<\/strong>：aₙ=n²−n。n=1 得 0，n=2 得 2，n=3 得 6，n=4 得 12。相邻差为 2,4,6,8，是等差数列，说明原数列是二次型。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 数列就是一堆数 —— 实际上 顺序是定义的一部分；同一组数按不同顺序排，就是不同数列。\n<\/li><li>\n别以为 前几项能唯一确定通项 —— 实际上 有限项永远对应无穷多种通项，必须靠结构（等差、等比、二次）判断。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n数列 aₙ=3n−2 的第 5 项是：\n<\/li><li>\n数列 a₁=2，aₙ₊₁=aₙ+3 的第 4 项是：\n<p>A. 13 ｜ B. 15 ｜ C. 17 ｜ D. 12 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：a₅=3×5−2=13。 A. 8 ｜ B. 11 ｜ C. 14 ｜ D. 5 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：依次得 2,5,8,11，第 4 项为 11。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n数列是正整数上的函数，顺序有意义\n<\/li><li>\n通项直接算、递推描述生成\n<\/li><li>\n差分定等差、比值定等比\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：数列与通项）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：数列与通项<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>数列不神秘，它就是“下标 n 到数值 aₙ 的函数”，只是定义域换成了正整数。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>按一定顺序排列的一列数叫数列，第 n 项记 aₙ，aₙ 与 n 的关系叫通项公式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像身高记录表：第 1 年、第 2 年……每年一个数，下标就是年份。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 通项<\/h3>\n<div class=\"katex-block\">a_{n}=f(n),\\ n\\in\\mathbb{N}^{*}<\/div>\n<p>把 n 代进去就得到第 n 项，本质是函数。<\/p>\n<h3>2. 差分<\/h3>\n<div class=\"katex-block\">d_{n}=a_{n+1}-a_{n}<\/div>\n<p>差分为常数说明每步加同样多，是等差数列。<\/p>\n<h3>3. 递增<\/h3>\n<div class=\"katex-block\">a_{n+1}>a_{n}\\ \\forall n<\/div>\n<p>后项总比前项大，数列单调递增。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>通项公式不一定有解析式；有的数列只能递推给出，如斐波那契数列。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《数列与极限》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-09-数列与极限 周伯堳.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/sequences-limits/chapter/ch01\">第 1 章：数列与通项<\/a><\/span><\/div><h1>第 2 章：等差数列与等比数列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n默写两组通项与求和公式\n<\/li><li>\n用倒序相加推导等差求和\n<\/li><li>\n分 q=1 与 q≠1 讨论等比求和\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>等差是“加”，等比是“乘”；求和公式都能由“配对”或“错位相减”推出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 等差数列<\/h3>\n<p>首项 a₁、公差 d：aₙ=a₁+(n−1)d。<\/p>\n<p>求和用<strong>倒序相加<\/strong>：<\/p>\n<p>Sₙ=a₁+a₂+…+aₙ Sₙ=aₙ+aₙ₋₁+…+a₁<\/p>\n<p>两式相加，每对和都是 a₁+aₙ，共 n 对，故 2Sₙ=n(a₁+aₙ)，即 Sₙ=n(a₁+aₙ)/2=n a₁+n(n−1)d/2。<\/p>\n<h3>2.2 等比数列<\/h3>\n<p>首项 a₁、公比 q：aₙ=a₁q<sup>n−1<\/sup>。<\/p>\n<p>求和用<strong>错位相减<\/strong>：<\/p>\n<p>Sₙ=a₁+a₁q+…+a₁q<sup>n−1<\/sup> qSₙ=a₁q+…+a₁qⁿ<\/p>\n<p>相减得 (1−q)Sₙ=a₁(1−qⁿ)。q≠1 时 Sₙ=a₁(1−qⁿ)/(1−q)；q=1 时每项都等于 a₁，Sₙ=na₁。<\/p>\n<h3>2.3 常用性质<\/h3>\n<ul><li>\n等差中项：b 是 a、c 的等差中项 ⇔ 2b=a+c；\n<\/li><li>\n等比中项：b²=ac（a、b、c 同号时）；\n<\/li><li>\n等差中，若 m+n=p+q 则 aₘ+aₙ=a_p+a_q；等比中对应为乘积相等。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：等差像每月固定加薪，等比像每月按固定比例涨薪。<\/p>\n<p><strong>失效边界<\/strong>：等比求和公式在 q=1 时分母为零，必须单独处理。<\/p>\n<p><strong>实例<\/strong>：1+2+…+100=100×101/2=5050。 1+2+4+…+2⁹（10 项，q=2）：S=1×(1−2¹⁰)/(1−2)=1023。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 等比求和直接套 a₁(1−qⁿ)/(1−q) —— 实际上 q=1 时公式无意义，要单独算 Sₙ=na₁。\n<\/li><li>\n别以为 等差中项与等比中项可以混用 —— 实际上 等差是算术平均，等比是几何平均；后者要求同号，且有两个平方根。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n等差数列首项 3、公差 4，第 10 项是：\n<\/li><li>\n等比数列 2,6,18,… 的前 4 项和是：\n<p>A. 39 ｜ B. 43 ｜ C. 36 ｜ D. 40 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：a₁₀=3+9×4=39。 A. 80 ｜ B. 54 ｜ C. 40 ｜ D. 26 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：q=3，S₄=2(1−3⁴)/(1−3)=2(−80)/(−2)=80。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n等差：aₙ=a₁+(n−1)d，Sₙ=n(a₁+aₙ)/2\n<\/li><li>\n等比：aₙ=a₁q<sup>n−1<\/sup>，q≠1 时 Sₙ=a₁(1−qⁿ)/(1−q)\n<\/li><li>\nq=1 时 Sₙ=na₁\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：等差数列与等比数列）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：等差数列与等比数列<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>两个求和公式都不是背的：等差靠配对，等比靠错位相减。推导过程本身就是解法。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>等差数列指相邻两项差为常数；等比数列指相邻两项比为常数。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>等差像爬等高的台阶，每步一样高；等比像滚雪球，每圈按同一比例变大。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 等差通项<\/h3>\n<div class=\"katex-block\">a_{n}=a_{1}+(n-1)d<\/div>\n<p>从首项出发，每走一步加 d。<\/p>\n<h3>2. 倒序相加<\/h3>\n<div class=\"katex-block\">2S_{n}=n(a_{1}+a_{n})\\ \\Rightarrow\\ S_{n}=\\frac{n(a_{1}+a_{n})}{2}<\/div>\n<p>正序与倒序相加，每对和相同，正好 n 对。<\/p>\n<h3>3. 等比通项<\/h3>\n<div class=\"katex-block\">a_{n}=a_{1}q^{n-1}<\/div>\n<p>从首项出发，每走一步乘 q。<\/p>\n<h3>4. 错位相减<\/h3>\n<div class=\"katex-block\">(1-q)S_{n}=a_{1}(1-q^{n})<\/div>\n<p>Sₙ 与 qSₙ 错开一位相减，中间项全部消掉。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>等比公式要求 q≠1；q=0 时从第二项起全为 0，也要单独看。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《数列与极限》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-09-数列与极限 周伯堳.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/sequences-limits/chapter/ch02\">第 2 章：等差数列与等比数列<\/a><\/span><\/div><h1>第 3 章：级数与极限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出极限的直观含义\n<\/li><li>\n判断无穷等比级数是否收敛并求和\n<\/li><li>\n用极限求连分数的值\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>极限就是“n 越大越靠近某个定值”；无穷多个数相加，和可能是一个有限的数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 部分和<\/h3>\n<p>把前 n 项加起来得到 Sₙ，叫<strong>部分和<\/strong>。S₁=a₁，S₂=a₁+a₂，依此类推。级数的“和”定义为 Sₙ 当 n→∞ 时的极限。<\/p>\n<h3>3.2 极限的直观含义<\/h3>\n<p>若 n 无限增大时，aₙ 与某个常数 A 的距离可以任意小，就说 aₙ 的极限是 A，记 lim aₙ=A。<\/p>\n<p>例：aₙ=1/n，n 越大越接近 0；aₙ=(n+1)/n=1+1/n，极限是 1。<\/p>\n<p>严格定义（ε-N）留到大学，这里先建立“越来越接近”的直观。<\/p>\n<h3>3.3 无穷等比级数<\/h3>\n<p>|q|&lt;1 时，qⁿ→0，于是<\/p>\n<p>S=a₁/(1−q)<\/p>\n<p>这是全书最常用的结论。例：1+1/2+1/4+…=1/(1−1/2)=2。<\/p>\n<p>|q|≥1 时级数发散，没有有限和。<\/p>\n<h3>3.4 连分数<\/h3>\n<p>形如 1/(1+1/(1+1/(1+…))) 的表达式叫<strong>连分数<\/strong>：分母里又套着同一个结构。<\/p>\n<p>求它的值时，设整体为 x，则被嵌套的部分仍是 x，于是<\/p>\n<p>x = 1/(1+x)<\/p>\n<p>两边乘 (1+x)：x+x²=1，即 x²+x−1=0。取正根 x=(√5−1)/2≈0.618，正是黄金分割比。<\/p>\n<p>连分数是“用极限求解”的典型例子：先假设极限存在，再把无限结构代回自身，解出方程。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：极限像跑步靠近终点：每一秒都比上一秒更近，虽然永远差一点点。<\/p>\n<p><strong>失效边界<\/strong>：|q|≥1 时不能套 a₁/(1−q)，会算出负数或无穷，都是错的。<\/p>\n<p><strong>实例<\/strong>：0.333…=0.3+0.03+0.003+…，首项 0.3、公比 0.1，和 =0.3/(1−0.1)=1/3。这解释了为什么 0.333…=1/3。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 无穷多个正数相加一定是无穷大 —— 实际上 只要每项衰减得够快（|q|&lt;1），和可以是有限的，如 1+1/2+1/4+…=2。\n<\/li><li>\n别以为 0.999…比 1 小 —— 实际上 它等于 1。按等比级数求和：0.9/(1−0.1)=1。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n无穷等比级数 1+1/3+1/9+… 的和是：\n<\/li><li>\n数列 aₙ=1/n 当 n→∞ 时的极限是：\n<p>A. 3/2 ｜ B. 2 ｜ C. 3 ｜ D. 1 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：a₁=1，q=1/3，S=1/(1−1/3)=3/2。 A. 1 ｜ B. 0 ｜ C. 不存在 ｜ D. 无穷大 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：n 越大 1/n 越接近 0。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n级数的和＝部分和的极限\n<\/li><li>\n|q|&lt;1 时无穷等比级数收敛于 a₁/(1−q)\n<\/li><li>\n0.999…=1，可用级数求和验证\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：级数与极限）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：级数与极限<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>“无穷相加”听着矛盾，其实是先算有限项和，再看这部分和趋向哪里。极限就是那个趋向值。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>若 n 无限增大时 aₙ 无限接近常数 A，则称 A 为 aₙ 的极限；级数的和是部分和的极限。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像用越来越细的尺子量一段路，读数越来越稳定在一个值上。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 部分和<\/h3>\n<div class=\"katex-block\">S_{n}=a_{1}+a_{2}+\\cdots+a_{n}<\/div>\n<p>先把无穷改成有限，才有办法计算。<\/p>\n<h3>2. 级数的和<\/h3>\n<div class=\"katex-block\">S=\\lim_{n\\to\\infty}S_{n}<\/div>\n<p>部分和趋向的那个值，就是无穷级数的和。<\/p>\n<h3>3. 等比级数<\/h3>\n<div class=\"katex-block\">S=\\frac{a_{1}}{1-q}\\quad(|q|<1)<\/div>\n<p>|q|&lt;1 时 qⁿ→0，求和公式取极限即得。<\/p>\n<h3>4. 连分数<\/h3>\n<div class=\"katex-block\">x=\\frac{1}{1+x}\\ \\Rightarrow\\ x^{2}+x-1=0<\/div>\n<p>整体自相似，把无限结构代回自身，解方程求值。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>极限存在要求“趋向同一个值”，来回摆动或无限增大都不算收敛。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《数列与极限》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-09-数列与极限 周伯堳.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/sequences-limits/chapter/ch01\">第 1 章：数列与通项<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/sequences-limits/chapter/ch02\">第 2 章：等差数列与等比数列<\/a><\/span><\/div><h1>通项与递推<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>通项给“第 n 项是多少”，递推给“下一项怎么由上一项得到”。<\/p>\n<h2>为什么重要<\/h2>\n<p>两种描述方式各有用途：算某项用通项，找规律与编程用递推。<\/p>\n<h2>详解<\/h2>\n<p>通项是显函数 aₙ=f(n)；递推是关系式 aₙ₊₁=g(aₙ) 加初值。等差、等比都能写成两种形式，互换时靠累加或累乘。<\/p>\n<h2>常见误解<\/h2>\n<p>以为递推式必须化成通项才能算，其实逐项代入也能得到任意项。<\/p>\n<h2>相关概念<\/h2>\n<p>数列（ch01）、等差等比（ch02）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-09-数列与极限 周伯堳.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/sequences-limits/chapter/ch03\">第 3 章：级数与极限<\/a><\/span><\/div><h1>极限与收敛<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>n 越大越靠近一个定值，就是收敛；否则发散。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是微积分的门槛：导数、积分都是极限。<\/p>\n<h2>详解<\/h2>\n<p>判断收敛先看通项是否趋于 0（趋于 0 是必要条件，不充分）。等比级数看 |q|：小于 1 收敛，否则发散。收敛时才能用 a₁/(1−q) 求和。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“项越来越小”就一定收敛，调和级数 1+1/2+1/3+… 就是反例。<\/p>\n<h2>相关概念<\/h2>\n<p>级数（ch03）、导数（《微积分初步》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数列与通项<\/strong><br>阅读：<a href=\"#/book/sequences-limits/chapter/ch01\">第 1 章：数列与通项<\/a><br>检查点：能由一个通项公式写出前几项<\/li><li class='path-step' id='path-02'><strong>步骤 02：等差数列与等比数列<\/strong><br>阅读：<a href=\"#/book/sequences-limits/chapter/ch02\">第 2 章：等差数列与等比数列<\/a><br>检查点：能默写两组通项与求和公式<\/li><li class='path-step' id='path-03'><strong>步骤 03：级数与极限<\/strong><br>阅读：<a href=\"#/book/sequences-limits/chapter/ch03\">第 3 章：级数与极限<\/a><br>检查点：能用 |q|&lt;1 求和并解释极限<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：数列与通项<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 数列 aₙ=3n−2 的第 5 项是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' va 的关系式加初值。 <span class=glossary-ref>（第 1 章：数列与通项）<\/span><\/li><li data-term='等差数列'>等差数列 — 相邻两项差为常数的数列。 <span class=glossary-ref>（第 2 章：等差数列与等比数列）<\/span><\/li><li data-term='等比数列'>等比数列 — 相邻两项比为常数的数列。 <span class=glossary-ref>（第 2 章：等差数列与等比数列）<\/span><\/li><li data-term='部分和'>部分和 — 前 n 项相加得到的 Sₙ。 <span class=glossary-ref>（第 3 章：级数与极限）<\/span><\/li><li data-term='极限'>极限 — n 无限增大时数列趋向的定值。 <span class=glossary-ref>（第 3 章：级数与极限）<\/span><\/li><li data-term='收敛'>收敛 — 极限存在，部分和趋向有限值。 <span class=glossary-ref>（第 3 章：级数与极限）<\/span><\/li><li data-term='连分数'>连分数 — 分母中含下一层分式的无限表达式。 <span class=glossary-ref>（第 3 章：级数与极限）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：识别数列三步<\/h2>\n<p>① 算相邻差，常数则为等差；② 算相邻比，常数则为等比；③ 都不是，再看差分的差分（二次型）。<\/p>\n<h2>框架：求和四法<\/h2>\n<p>倒序相加（等差）、错位相减（等差×等比）、裂项相消（分式）、公式直接代入（等比）。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>等差<\/td><td>aₙ=a₁+(n−1)d；Sₙ=n(a₁+aₙ)/2<\/td><\/tr><tr><td>等比<\/td><td>aₙ=a₁q<sup>n−1<\/sup>；Sₙ=a₁(1−qⁿ)/(1−q)（q≠1）<\/td><\/tr><tr><td>无穷等比<\/td><td><\/td><td>q<\/td><td>&lt;1 时 S=a₁/(1−q)<\/td><\/tr><tr><td>等差中项<\/td><td>2b=a+c<\/td><\/tr><tr><td>等比中项<\/td><td>b²=ac<\/td><\/tr><tr><td>0.333…<\/td><td>=1/3（等比级数求和）<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：数列与通项", "href": "#/chapter/ch01"}, {"label": "第 2 章：等差数列与等比数列", "href": "#/chapter/ch02"}, {"label": "第 3 章：级数与极限", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "通项与递推", "href": "#/concept/c01"}, {"label": "极限与收敛", "href": "#/concept/c02"}]}, {"lab  和 135°", "1 和 90°"], "answer": 0, "explain": "r=√(1+1)=√2，cosθ=1/√2，故 θ=45°。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "用棣莫弗定理计算 (1+i)⁴，结果是：", "options": ["4", "−4", "4i", "−4i"], "answer": 1, "explain": "模 √2 的四次方为 4，角 45°×4=180°，故结果为 4(cos180°+i sin180°)=−4。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "复数 (1+i)/(1−i) 的值是：", "options": ["i", "−i", "1", "−1"], "answer": 0, "explain": "分子分母同乘 (1+i)：(1+i)²/(1+1)=(2i)/2=i。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "方程 x²+4=0 在复数范围内的解是：", "options": ["x=2", "x=±2i", "x=±2", "无解"], "answer": 1, "explain": "x²=−4，故 x=±2i。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：数系扩张与复数概念」的一句话核心是什么？", "back": "引入 i 的唯一理由：让 x²+1=0 有解；复数就是 a+bi 的形式。", "tags": ["complex-numbers", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：复数的运算与几何意义」的一句话核心是什么？", "back": "加减是向量平移，乘法是“模相乘、角相加”；除法靠共轭把分母变成实数。", "tags": ["complex-numbers", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：三角形式与乘方开方」的一句话核心是什么？", "back": "写成 z=r(cosθ+i sinθ) 之后，乘除变成模的乘除与角的加减，乘方开方就是角的倍数与等分。", "tags": ["complex-numbers", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「虚数单位」？", "back": "满足 i²=−1 的数 i。", "tags": ["complex-numbers", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「复数」？", "back": "形如 a+bi 的数，a、b 为实数。", "tags": ["complex-numbers", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「实部与虚部」？", "back": "复数 a+bi 中的 a 与 b。", "tags": ["complex-numbers", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「共轭复数」？", "back": "实部相同、虚部相反的复数。", "tags": ["complex-numbers", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「模」？", "back": "复数到原点的距离 √(a²+b²)。", "tags": ["complex-numbers", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「复平面」？", "back": "横轴实轴、纵轴虚轴的坐标平面。", "tags": ["complex-numbers", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「辐角」？", "back": "复数向量与实轴正方向的夹角。", "tags": ["complex-numbers", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「三角形式」？", "back": "z=r(cosθ+i sinθ)。", "tags": ["complex-numbers", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「棣莫弗定理」？", "back": "乘方公式 [r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)。", "tags": ["complex-numbers", "术语"]}], "companion": "complex-numbers学习伴侣.html", "deriv": "complex-numbers从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">实数、一元二次方程<\/span><\/div><h1>第 1 章：数系扩张与复数概念<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：实数、一元二次方程\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说明数系扩张的动因\n<\/li><li>\n写出复数的实部、虚部并判断相等\n<\/li><li>\n计算 i 的整数次幂\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>引入 i 的唯一理由：让 x²+1=0 有解；复数就是 a+bi 的形式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 为什么还要扩数系<\/h3>\n<p>自然数 → 整数（减法不够用）→ 有理数（除法不够用）→ 实数（开方不够用）→ 复数（负数开平方不够用）。<\/p>\n<p>每一步扩张都是为了“让原来无解的问题有解”，同时尽量保留原有运算律。<\/p>\n<h3>1.2 虚数单位与复数<\/h3>\n<p>规定 i²=−1，i 叫<strong>虚数单位<\/strong>。形如 z=a+bi（a、b 为实数）的数叫<strong>复数<\/strong>，a 是实部，b 是虚部。<\/p>\n<ul><li>\nb=0：z 是实数；\n<\/li><li>\na=0 且 b≠0：z 是纯虚数。\n<\/ul>\n<p>两个复数相等 ⇔ 实部相等且虚部相等。注意：复数之间<strong>不能比大小<\/strong>，“3+2i 与 1+i 谁大”没有意义。<\/p>\n<h3>1.3 i 的幂有周期<\/h3>\n<p>i¹=i，i²=−1，i³=−i，i⁴=1，之后每 4 次循环。计算 iⁿ 时把 n 除以 4 看余数即可。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：数系扩张像给工具箱添工具：不是原来的工具坏了，而是遇到了新活儿。<\/p>\n<p><strong>失效边界<\/strong>：复数没有大小顺序，涉及不等式的问题不能直接搬过来。<\/p>\n<p><strong>实例<\/strong>：i²⁰²⁵：2025÷4 余 1，故 i²⁰²⁵=i。 若 (x−1)+(y+2)i=3+5i，则 x−1=3、y+2=5，得 x=4、y=3。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 i 是一个很小的实数 —— 实际上 i 不是实数，它的平方等于 −1，实数里没有这样的数。\n<\/li><li>\n别以为 复数可以像实数一样比大小 —— 实际上 复数没有序关系；只有模（长度）可以比较。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n复数 z=2−3i 的实部与虚部分别是：\n<\/li><li>\ni³ 的值是：\n<p>A. 2 和 3 ｜ B. 2 和 −3 ｜ C. −3 和 2 ｜ D. 3 和 2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：z=a+bi 中 a=2，b=−3（虚部是 b 本身，含符号）。 A. i ｜ B. −i ｜ C. 1 ｜ D. −1 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：i³=i²·i=−1·i=−i。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ni²=−1；复数 z=a+bi\n<\/li><li>\n相等 ⇔ 实部、虚部分别相等\n<\/li><li>\n复数不能比大小；i 的幂以 4 为周期\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：数系扩张与复数概念）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：数系扩张与复数概念<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>虚数不是凭空发明，而是“让 x²=−1 有解”的必然结果。承认 i²=−1，整套代数就能自洽。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>形如 a+bi（a、b∈R）的数叫复数，i 为虚数单位且 i²=−1。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像给平面加一条新轴：原来只能左右走，现在还能上下走。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 虚数单位<\/h3>\n<div class=\"katex-block\">i^{2}=-1<\/div>\n<p>这是定义，不是推导出来的；一切复数运算都建立在它上面。<\/p>\n<h3>2. 复数形式<\/h3>\n<div class=\"katex-block\">z=a+bi\\quad(a,b\\in\\mathbb{R})<\/div>\n<p>a 为实部，b 为虚部，两者都是实数。<\/p>\n<h3>3. 相等条件<\/h3>\n<div class=\"katex-block\">a+bi=c+di\\iff a=c\\ \\text{且}\\ b=d<\/div>\n<p>实部与虚部分别相等，缺一不可。<\/p>\n<h3>4. i 的周期<\/h3>\n<div class=\"katex-block\">i^{n}=i^{n\\bmod 4}<\/div>\n<p>四个一循环，算高次幂先取余数。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>复数不能定义大小顺序；比较只能比较模，不能比较“谁大”。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《复数》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/complex-numbers/chapter/ch01\">第 1 章：数系扩张与复数概念<\/a><\/span><\/div><h1>第 2 章：复数的运算与几何意义<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n完成复数四则运算\n<\/li><li>\n用共轭把分母实数化\n<\/li><li>\n把复数对应到复平面上的点与向量\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>加减是向量平移，乘法是“模相乘、角相加”；除法靠共轭把分母变成实数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 加减与乘<\/h3>\n<p>(a+bi)±(c+di)=(a±c)+(b±d)i。<\/p>\n<p>乘法按多项式展开，最后用 i²=−1 化简：<\/p>\n<p>(a+bi)(c+di)=ac+bdi²+adi+bci=(ac−bd)+(ad+bc)i。<\/p>\n<h3>2.2 共轭与除法<\/h3>\n<p>z=a+bi 的共轭是 z̄=a−bi。两者相乘：<\/p>\n<p>z·z̄=a²+b²（实数）<\/p>\n<p>所以除法时分子分母同乘分母的共轭，把分母变成实数：<\/p>\n<p>(a+bi)/(c+di)=(a+bi)(c−di)/(c²+d²)。<\/p>\n<h3>2.3 模<\/h3>\n<p>|z|=√(a²+b²)，几何上是复数对应点到原点的距离。有 |z₁z₂|=|z₁||z₂|，|z₁/z₂|=|z₁|/|z₂|。<\/p>\n<h3>2.4 复平面<\/h3>\n<p>把 z=a+bi 对应到点 (a,b)，就得到<strong>复平面<\/strong>：横轴为实轴，纵轴为虚轴。<\/p>\n<ul><li>\n加法对应向量相加（平行四边形法则）；\n<\/li><li>\n乘以 i 相当于逆时针旋转 90°；\n<\/li><li>\n|z| 是向量长度，辐角 θ 是它与实轴正方向的夹角。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：复数加法像两个人合力推箱子，乘法像“先伸长再转个角度”。<\/p>\n<p><strong>失效边界<\/strong>：几何解释只在复平面上成立；纯代数的运算律仍按多项式规则走。<\/p>\n<p><strong>实例<\/strong>：(1+2i)(3−i)=3−i+6i−2i²=3+5i+2=5+5i。 1/(1+i)=(1−i)/[(1+i)(1−i)]=(1−i)/2=1/2−1/2 i。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 分母有 i 就不能算 —— 实际上 同乘共轭即可把分母变成实数，方法同根式的分母有理化。\n<\/li><li>\n别以为 |z| 就是 z 本身去掉符号 —— 实际上 模是长度 √(a²+b²)，与实数的绝对值含义相通但算法不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n(2+i)(1−i) 的结果是：\n<\/li><li>\n复数 z=3+4i 的模是：\n<p>A. 3−i ｜ B. 3+i ｜ C. 1−i ｜ D. 1+i <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：2−2i+i−i²=2−i+1=3−i。 A. 7 ｜ B. 5 ｜ C. 25 ｜ D. 1 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：|z|=√(9+16)=5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n加减分实虚部；乘法展开后用 i²=−1\n<\/li><li>\n除法同乘共轭，分母变实数\n<\/li><li>\n模＝到原点的距离；乘 i 是转 90°\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：复数的运算与几何意义）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：复数的运算与几何意义<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>复数运算不用背新规则：把 i 当字母展开，最后把 i² 换成 −1 即可。除法多一步——乘共轭。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>共轭复数指实部相同、虚部相反的两个复数；模是复平面上到原点的距离。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>共轭像照镜子：虚部翻个号，两者相乘就把“方向”消掉，只剩长度。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 乘法<\/h3>\n<div class=\"katex-block\">(a+bi)(c+di)=(ac-bd)+(ad+bc)i<\/div>\n<p>按分配律展开，把 i² 换成 −1 合并同类项。<\/p>\n<h3>2. 共轭乘积<\/h3>\n<div class=\"katex-block\">z\\bar{z}=a^{2}+b^{2}=|z|^{2}<\/div>\n<p>虚部相互抵消，结果是非负实数，正好是模的平方。<\/p>\n<h3>3. 除法<\/h3>\n<div class=\"katex-block\">\\frac{a+bi}{c+di}=\\frac{(a+bi)(c-di)}{c^{2}+d^{2}}<\/div>\n<p>分子分母同乘共轭，分母变成实数。<\/p>\n<h3>4. 模<\/h3>\n<div class=\"katex-block\">|z|=\\sqrt{a^{2}+b^{2}}<\/div>\n<p>复平面上点到原点的距离，勾股定理直接给出。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>共轭只对虚部取反，实部不动；模必须是非负实数。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《复数》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/complex-numbers/chapter/ch02\">第 2 章：复数的运算与几何意义<\/a><\/span><\/div><h1>第 3 章：三角形式与乘方开方<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、三角函数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把复数化成三角形式\n<\/li><li>\n用“模乘角加”做乘法与除法\n<\/li><li>\n用棣莫弗定理求乘方与 n 次方根\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>写成 z=r(cosθ+i sinθ) 之后，乘除变成模的乘除与角的加减，乘方开方就是角的倍数与等分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 三角形式<\/h3>\n<p>设 z=a+bi，r=|z|=√(a²+b²)，θ 为辐角（与实轴正方向的夹角），则<\/p>\n<p>z=r(cosθ+i sinθ)<\/p>\n<p>其中 cosθ=a/r，sinθ=b/r。θ 不唯一，相差 2kπ 都表示同一个复数，通常取 [0,2π) 内的主值。<\/p>\n<h3>3.2 乘除的几何算法<\/h3>\n<p>z₁z₂=r₁r₂[cos(θ₁+θ₂)+i sin(θ₁+θ₂)] z₁/z₂=(r₁/r₂)[cos(θ₁−θ₂)+i sin(θ₁−θ₂)]<\/p>\n<p>即<strong>模相乘、角相加<\/strong>；除法是模相除、角相减。这也解释了“乘 i 就是转 90°”。<\/p>\n<h3>3.3 棣莫弗定理<\/h3>\n<p>[r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)<\/p>\n<p>乘方就是模取 n 次幂、角乘 n。<\/p>\n<h3>3.4 开方<\/h3>\n<p>z 的 n 次方根有 n 个，均匀分布在以原点为圆心、半径 ⁿ√r 的圆上：<\/p>\n<p>w_k=ⁿ√r[cos((θ+2kπ)/n)+i sin((θ+2kπ)/n)]，k=0,1,…,n−1<\/p>\n<p>这解释了“任何数在复数范围内都有 n 个 n 次方根”，也解释了为什么 x³=1 有三个解（1 和两个复数根）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：三角形式像给向量装了“长度＋方向”的刻度盘，乘法就是两个刻度盘叠起来转。<\/p>\n<p><strong>失效边界<\/strong>：辐角要统一单位（弧度或度），加减时混用会出错。<\/p>\n<p><strong>实例<\/strong>：1+i=√2(cos45°+i sin45°)。它的平方：(√2)²(cos90°+i sin90°)=2i。 x³=1 的根：1，−1/2+√3/2 i，−1/2−√3/2 i，三点在单位圆上均匀分布。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 开方只有一个根 —— 实际上 复数范围内 n 次方根有 n 个，均匀分布在圆上。\n<\/li><li>\n别以为 辐角只有一个值 —— 实际上 辐角相差 2kπ 都表示同一复数；写三角形式要说明取哪个范围。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n复数 z=1+i 的模与辐角（主值）分别是：\n<\/li><li>\n用棣莫弗定理计算 (1+i)⁴，结果是：\n<p>A. √2 和 45° ｜ B. 2 和 45° ｜ C. √2 和 135° ｜ D. 1 和 90° <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：r=√(1+1)=√2，cosθ=1/√2，故 θ=45°。 A. 4 ｜ B. −4 ｜ C. 4i ｜ D. −4i <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：模 √2 的四次方为 4，角 45°×4=180°，故结果为 4(cos180°+i sin180°)=−4。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三角形式 z=r(cosθ+i sinθ)\n<\/li><li>\n乘法：模乘角加；除法：模除角减\n<\/li><li>\n棣莫弗：乘方＝模取幂、角乘 n；开方＝n 个均匀根\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：三角形式与乘方开方）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：三角形式与乘方开方<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>把复数看成“长度+角度”，乘法就变成两件简单事的组合：长度相乘、角度相加。全部公式由此而来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>三角形式指 z=r(cosθ+i sinθ)，r 为模，θ 为辐角。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像钟表的指针：长度是针长，角度是指向；两根针相乘，就是把角度叠起来转。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 三角形式<\/h3>\n<div class=\"katex-block\">z=r(\\cos\\theta+i\\sin\\theta),\\quad r=|z|<\/div>\n<p>把点写成“长度＋角度”，几何意义一目了然。<\/p>\n<h3>2. 乘法<\/h3>\n<div class=\"katex-block\">z_{1}z_{2}=r_{1}r_{2}[\\cos(\\theta_{1}+\\theta_{2})+i\\sin(\\theta_{1}+\\theta_{2})]<\/div>\n<p>模相乘、角相加，这是旋转的代数表达。<\/p>\n<h3>3. 棣莫弗<\/h3>\n<div class=\"katex-block\">[r(\\cos\\theta+i\\sin\\theta)]^{n}=r^{n}(\\cos n\\theta+i\\sin n\\theta)<\/div>\n<p>乘方就是模取 n 次幂、角乘 n。<\/p>\n<h3>4. 开方<\/h3>\n<div class=\"katex-block\">w_{k}=\\sqrt[n]{r}\\left[\\cos\\frac{\\theta+2k\\pi}{n}+i\\sin\\frac{\\theta+2k\\pi}{n}\\right]<\/div>\n<p>k 取 0 到 n−1，得到均匀分布在圆上的 n 个根。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>θ 必须与三角函数的单位一致；开方时要写出全部 n 个根，不能只写主值。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《复数》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/complex-numbers/chapter/ch01\">第 1 章：数系扩张与复数概念<\/a><\/span><\/div><h1>数系扩张<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每次“不够用”就扩一次数系，同时保留原有运算律。<\/p>\n<h2>为什么重要<\/h2>\n<p>理解扩张的动因，才不会把复数当成硬背的记号。<\/p>\n<h2>详解<\/h2>\n<p>自然数→整数（减法封闭）→有理数（除法封闭）→实数（极限与开方）→复数（负数开方）。每步都解决一类无解问题，代价是失去某些性质（如复数失去大小顺序）。<\/p>\n<h2>常见误解<\/h2>\n<p>以为复数只是数学家的游戏；它在电学、信号处理、几何里都是标准工具。<\/p>\n<h2>相关概念<\/h2>\n<p>虚数单位（ch01）、复平面（ch02）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/complex-numbers/chapter/ch02\">第 2 章：复数的运算与几何意义<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/complex-numbers/chapter/ch03\">第 3 章：三角形式与乘方开方<\/a><\/span><\/div><h1>模与辐角<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>模是长度，辐角是方向；乘除看模与角，乘方开方看倍数与等分。<\/p>\n<h2>为什么重要<\/h2>\n<p>三角形式把复数运算翻译成几何动作，是求乘方开方的最快路径。<\/p>\n<h2>详解<\/h2>\n<p>|z|=√(a²+b²)，θ 由 cosθ=a/|z|、sinθ=b/|z| 确定。乘法模相乘角相加，除法模相除角相减；棣莫弗定理把乘方变成“模取幂、角乘 n”，开方则是把角 n 等分。<\/p>\n<h2>常见误解<\/h2>\n<p>只记公式不看几何，遇到开方漏根、遇到辐角范围出错。<\/p>\n<h2>相关概念<\/h2>\n<p>三角形式（ch03）、棣莫弗定理（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数系扩张与复数概念<\/strong><br>阅读：<a href=\"#/book/complex-numbers/chapter/ch01\">第 1 章：数系扩张与复数概念<\/a><br>检查点：能说明为什么需要虚数单位<\/li><li class='path-step' id='path-02'><strong>步骤 02：复数的运算与几何意义<\/strong><br>阅读：<a href=\"#/book/complex-numbers/chapter/ch02\">第 2 章：复数的运算与几何意义<\/a><br>检查点：能用共轭做除法并解释模<\/li><li class='path-step' id='path-03'><strong>步骤 03：三角形式与乘方开方<\/strong><br>阅读：<a href=\"#/book/complex-numbers/chapter/ch03\">第 3 章：三角形式与乘方开方<\/a><br>检查点：能用棣莫弗定理开方并画图<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：数系扩张与复数概念<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 复数 z=2−3i 的实部与虚部分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 2 和 3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 2 和 −3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> −3 和 2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 3 和 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> i³ 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> i<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> −i<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> −1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：复数的运算与几何意义<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> (2+i)(1−i) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt ><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 5<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 25<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：三角形式与乘方开方<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 复数 z=1+i 的模与辐角（主值）分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> √2 和 45°<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 2 和 45°<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> √2 和 135°<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 1 和 90°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 用棣莫弗定理计算 (1+i)⁴，结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> −4<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 4i<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> −4i<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='虚数单位'>虚数单位 — 满足 i²=−1 的数 i。 <span class=glossary-ref>（第 1 章：数系扩张与复数概念）<\/span><\/li><li data-term='复数'>复数 — 形如 a+bi 的数，a、b 为实数。 <span class=glossary-ref>（第 1 章：数系扩张与复数概念）<\/span><\/li><li data-term='实部与虚部'>实部与虚部 — 复数 a+bi 中的 a 与 b。 <span class=glossary-ref>（第 1 章：数系扩张与复数概念）<\/span><\/li><li data-term='共轭复数'>共轭复数 — 实部相同、虚部相反的复数。 <span class=glossary-ref>（第 2 章：复数的运算与几何意义）<\/span><\/li><li data-term='模'>模 — 复数到原点的距离 √(a²+b²)。 <span class=glossary-ref>（第 2 章：复数的运算与几何意义）<\/span><\/li><li data-term='复平面'>复平面 — 横轴实轴、纵轴虚轴的坐标平面。 <span class=glossary-ref>（第 2 章：复数的运算与几何意义）<\/span><\/li><li data-term='辐角'>辐角 — 复数向量与实轴正方向的夹角。 <span class=glossary-ref>（第 3 章：三角形式与乘方开方）<\/span><\/li><li data-term='三角形式'>三角形式 — z=r(cosθ+i sinθ)。 <span class=glossary-ref>（第 3 章：三角形式与乘方开方）<\/span><\/li><li data-term='棣莫弗定理'>棣莫弗定理 — 乘方公式 [r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)。 <span class=glossary-ref>（第 3 章：三角形式与乘方开方）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：复数运算三选一<\/h2>\n<p>加减直接分实虚部；乘除优先用代数形式（除法乘共轭）；乘方开方换三角形式。<\/p>\n<h2>框架：几何翻译<\/h2>\n<p>看到“旋转 90°”想乘 i；看到“长度为 1”想 |z|=1；看到“正三角形”想三个根均匀分布。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>i 的幂<\/td><td>i¹=i，i²=−1，i³=−i，i⁴=1，周期 4<\/td><\/tr><tr><td>乘法<\/td><td>(a+bi)(c+di)=(ac−bd)+(ad+bc)i<\/td><\/tr><tr><td>除法<\/td><td>(a+bi)/(c+di)=(a+bi)(c−di)/(c²+d²)<\/td><\/tr><tr><td>模<\/td><td><\/td><td>z<\/td><td>=√(a²+b²)；z·z̄=<\/td><td>z<\/td><td>²<\/td><\/tr><tr><td>三角形式<\/td><td>z=r(cosθ+i sinθ)<\/td><\/tr><tr><td>棣莫弗<\/td><td>[r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：数系扩张与复数概念", "href": "#/chapter/ch01"}, {"label": "第 2 章：复数的运算与几何意义", "href": "#/chapter/ch02"}, {"label": "第 3 章：三角形式与乘方开方", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "数系扩张", "href": "#/concept/c01"}, {"label": "模与辐角", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：数系扩张与复数概念", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：复数的运算与几何意义", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：三角形式与乘方开方", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"plane-figures":{"manifest": {"slug": "plane-figures", "title": "直线形", "subtitle": "直线围成的世界：角、三角形、相似与变换", "book": {"title": "直线形", "author": "毛鸿翔", "source": ["数学基础知识丛书-11-直线形 毛鸿翔.pdf"]}, "audience": "零基础", "goal": "掌握角的度量与平行线性质，熟悉三角形边角关系与全等、相似判定，理解平移、旋转、轴对称与位似的作用。", "learningPath": [{"step": "01", "title": "角与平行线", "chapterIds": ["ch01"], "checkpoint": "能用平行线性质推出角相等"}, {"step": "02", "title": "三角形与全等", "chapterIds": ["ch02"], "checkpoint": "能选出正确的全等判定条件"}, {"step": "03", "title": "相似、比例与变换", "chapterIds": ["ch03"], "checkpoint": "能用相似比求线段长"}], "chapters": [{"id": "ch01", "title": "第 1 章：角与平行线", "file": "chapters/ch01-angles-parallel.md", "difficulty": 2, "source": { 01"]}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "一个三角形的两个内角分别为 50° 和 60°，第三个内角是：", "options": ["60°", "70°", "80°", "90°"], "answer": 1, "explain": "180°−50°−60°=70°。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "下列条件能判定两个三角形全等的是：", "options": ["两边及其中一边的对角对应相等", "三个角对应相等", "两边及其夹角对应相等", "周长相等"], "answer": 2, "explain": "SAS 是标准判定；SSA 与 AAA 都不足以判定全等。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "三角形两边长为 3 和 7，第三边 x 的取值范围是：", "options": ["3<x<7", "4<x<10", "0<x<10", "x>4"], "answer": 1, "explain": "两边之差 4 < x < 两边之和 10。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "两个相似三角形的相似比为 1:2，则面积比为：", "options": ["1:2", "1:4", "2:1", "1:√2"], "answer": 1, "explain": "面积比是相似比的平方，即 1:4。", "relatedConceptId": "c01", "prerequisites": ["ch03"]}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "下列变换中，属于相似变换而非全等变换的是：", "options": ["平移", "旋转", "轴对称", "位似"], "answer": 3, "explain": "位似会按比例改变大小，只保持形状；其余三种保形状也保大小。", "relatedConceptId": "c01", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "两个相似三角形的面积比为 9:16，则相似比为：", "options": ["9:16", "3:4", "4:3", "81:256"], "answer": 1, "explain": "相似比是面积比的平方根，√(9/16)=3/4。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "下列条件中不能判定两个三角形全等的是：", "options": ["三边对应相等", "两角及夹边对应相等", "两边及其中一边的对角对应相等", "两边及其夹角对应相等"], "answer": 2, "explain": "SSA 存在两种可能图形，不能判定全等。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：角与平行线」的一句话核心是什么？", "back": "平行线把“角相等”变成可传递的结论，这是整个平面几何的第一台发动机。", "tags": ["plane-figures", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：三角形与全等」的一句话核心是什么？", "back": "全等就是“完全重合”；四组判定条件都是在说“三条边、三个角里够用的那几条”。", "tags": ["plane-figures", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：相似、比例与图形变换」的一句话核心是什么？", "back": "相似是“形状不变、大小按比例”；变换是“搬动图形但保留某些性质”。", "tags": ["plane-figures", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「余角」？", "back": "两角之和为 90°。", "tags": ["plane-figures", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「补角」？", "back": "两角之和为 180°。", "tags": ["plane-figures", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「对顶角」？", "back": "两直线相交形成的顶点相对的两个角。", "tags": ["plane-figures", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「同位角」？", "back": "两条直线被第三条直线所截，位置相同的一对角。", "tags": ["plane-figures", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「全等」？", "back": "能完全重合的两个图形。", "tags": ["plane-figures", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「SSA」？", "back": "两边及其中一边的对角，不能判定全等。", "tags": ["plane-figures", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「相似」？", "back": "对应角相等、对应边成比例的两个图形。", "tags": ["plane-figures", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「相似比」？", "back": "相似图形对应线段的比值。", "tags": ["plane-figures", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「位似」？", "back": "从一点出发按比例缩放的相似变换。", "tags": ["plane-figures", "术语"]}], "companion": "plane-figures学习伴侣.html", "deriv": "plane-figures从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-11-直线形 毛鸿翔.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">基本作图<\/span><\/div><h1>第 1 章：角与平行线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：基本作图\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用度与弧度表示角并互化\n<\/li><li>\n使用余角、补角、对顶角的性质\n<\/li><li>\n用平行线性质判断角的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>平行线把“角相等”变成可传递的结论，这是整个平面几何的第一台发动机。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 角的度量<\/h3>\n<p>把一个周角分成 360 份，每份为 1 度。弧度制以弧长与半径的比为角的大小，π 弧度＝180°。<\/p>\n<p>互化：1°=π/180 弧度；1 弧度≈57.3°。<\/p>\n<h3>1.2 角的关系<\/h3>\n<ul><li>\n余角：两角相加为 90°；\n<\/li><li>\n补角：两角相加为 180°；\n<\/li><li>\n对顶角相等（两条直线相交形成）。\n<\/ul>\n<h3>1.3 平行线的性质<\/h3>\n<p>两直线平行时：<\/p>\n<ul><li>\n同位角相等；\n<\/li><li>\n内错角相等；\n<\/li><li>\n同旁内角互补（和为 180°）。\n<\/ul>\n<p>反过来，这三条任一成立，也能判定两直线平行。性质与判定是同一组事实的两个方向，做题时要分清“已知平行”还是“要证平行”。<\/p>\n<h3>1.4 三角形的内角和<\/h3>\n<p>三角形内角和为 180°，由“过顶点作平行线”配合内错角推出。外角等于与它不相邻的两个内角之和。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：平行线像两条永不相交的铁轨，横穿它们的枕木把“角度关系”固定住了。<\/p>\n<p><strong>失效边界<\/strong>：这些性质只在同一平面内成立；空间中两条直线可能既不平行也不相交（异面）。<\/p>\n<p><strong>实例<\/strong>：已知 l₁∥l₂，一条截线与它们相交，∠1=65°，则同位角也是 65°，内错角 65°，同旁内角 115°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 同位角一定相等 —— 实际上 只有两直线平行时才相等；不平行时不相等。\n<\/li><li>\n别以为 三角形内角和总是 180° —— 实际上 在欧氏平面内成立；球面或双曲面上不成立。中学阶段默认欧氏几何。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n两条平行线被第三条直线所截，同旁内角的关系是：\n<\/li><li>\n一个三角形的两个内角分别为 50° 和 60°，第三个内角是：\n<p>A. 相等 ｜ B. 互补 ｜ C. 互余 ｜ D. 无法确定 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：两直线平行时同旁内角之和为 180°，即互补。 A. 60° ｜ B. 70° ｜ C. 80° ｜ D. 90° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：180°−50°−60°=70°。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n平行 ⇒ 同位角相等、内错角相等、同旁内角互补\n<\/li><li>\n三角形内角和 180°，外角等于两不相邻内角之和\n<\/li><li>\n性质与判定互为逆用，先看已知条件\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：角与平行线）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：角与平行线<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>几何的第一批结论不是背的，是从“平行线”这一条假设推出来的：有了它，角就能搬家。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>同一平面内不相交的两条直线叫平行线；两条直线被第三条直线所截形成的角叫三线八角。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像把一张纸对折两次，折痕平行，折出的角自然相等。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 补角<\/h3>\n<div class=\"katex-block\">\\angle A+\\angle B=180^{\\circ}<\/div>\n<p>两角拼成一条直线，和为平角。<\/p>\n<h3>2. 对顶角<\/h3>\n<div class=\"katex-block\">\\angle 1=\\angle 3<\/div>\n<p>两条直线相交，顶点两侧相对的两个角相等。<\/p>\n<h3>3. 平行线性质<\/h3>\n<div class=\"katex-block\">l_{1}\\parallel l_{2}\\ \\Rightarrow\\ \\angle_{\\text{同位}}=\\angle_{\\text{同位}}<\/div>\n<p>平行是把角“搬”到另一个位置的通行证。<\/p>\n<h3>4. 内角和<\/h3>\n<div class=\"katex-block\">\\angle A+\\angle B+\\angle C=180^{\\circ}<\/div>\n<p>过顶点作平行线，把三个角拼成一个平角。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>平行公设是欧氏几何的基石，非欧几何里它不成立，整套结论都会改变。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《直线形》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-11-直线形 毛鸿翔.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/plane-figures/chapter/ch01\">第 1 章：角与平行线<\/a><\/span><\/div><h1>第 2 章：三角形与全等<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n使用三角形不等式与大边对大角\n<\/li><li>\n按条件选择 SSS、SAS、ASA、AAS 判定全等\n<\/li><li>\n识别全等中的对应关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>全等就是“完全重合”；四组判定条件都是在说“三条边、三个角里够用的那几条”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 边角关系<\/h3>\n<ul><li>\n三角形任意两边之和大于第三边，两边之差小于第三边；\n<\/li><li>\n大边对大角，大角对大边；\n<\/li><li>\n直角三角形斜边最长。\n<\/ul>\n<h3>2.2 全等的判定<\/h3>\n<p>两个三角形全等指对应边、对应角全部相等。判定不必六条全查：<\/p>\n<ul><li>\n<strong>SSS<\/strong>：三边对应相等；\n<\/li><li>\n<strong>SAS<\/strong>：两边及其夹角对应相等；\n<\/li><li>\n<strong>ASA<\/strong>：两角及其夹边对应相等；\n<\/li><li>\n<strong>AAS<\/strong>：两角及其中一角的对边对应相等。\n<\/ul>\n<p><strong>SSA（两边及其中一边的对角）不能判定全等<\/strong>，这是最常见的陷阱。AAA 也只能判定相似，不能判定全等。<\/p>\n<h3>2.3 对应关系要按顺序写<\/h3>\n<p>写 △ABC≌△DEF 时，字母顺序就规定了对应关系：A↔D、B↔E、C↔F。顺序写错，后面用对应边、对应角就会出错。<\/p>\n<h3>2.4 特殊线段<\/h3>\n<p>中线连接顶点与对边中点；高垂直于对边；角平分线把角分成两半；中位线平行于第三边且等于它的一半。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：全等像两块完全相同的拼图，翻转、平移后能严丝合缝地重合。<\/p>\n<p><strong>失效边界<\/strong>：形状相同但大小不同只是相似，不是全等；判定条件不能混用。<\/p>\n<p><strong>实例<\/strong>：△ABC 与 △DEF 中，AB=DE，∠B=∠E，BC=EF，则按 SAS 全等。 若给出 AB=DE、∠B=∠E、AC=DF（边边角），则不能判定全等，可能有两种不同形状。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 边边角也能证全等 —— 实际上 SSA 不成立，满足条件的三角形可能有两个，无法保证重合。\n<\/li><li>\n别以为 三个角相等就是全等 —— 实际上 AAA 只能得到相似；全等还要求边长也相等。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列条件能判定两个三角形全等的是：\n<\/li><li>\n三角形两边长为 3 和 7，第三边 x 的取值范围是：\n<p>A. 两边及其中一边的对角对应相等 ｜ B. 三个角对应相等 ｜ C. 两边及其夹角对应相等 ｜ D. 周长相等 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：SAS 是标准判定；SSA 与 AAA 都不足以判定全等。 A. 3&lt;x&lt;7 ｜ B. 4&lt;x&lt;10 ｜ C. 0&lt;x&lt;10 ｜ D. x&gt;4 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：两边之差 4 &lt; x &lt; 两边之和 10。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n全等判定：SSS、SAS、ASA、AAS；SSA 不成立\n<\/li><li>\n字母顺序即对应关系\n<\/li><li>\n第三边在两边之差与两边之和之间\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：三角形与全等）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：三角形与全等<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>全等的判定条件不是规定，而是“确定一个三角形最少需要几个独立条件”的答案。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>两个三角形能完全重合叫全等；形状相同、大小成比例叫相似。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像配钥匙：齿形、长度都对上才能开同一把锁，缺一项就不行。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 三角形不等式<\/h3>\n<div class=\"katex-block\">|a-b|&lt;c&lt;a+b<\/div>\n<p>两边之差小于第三边，第三边小于两边之和。<\/p>\n<h3>2. SAS<\/h3>\n<div class=\"katex-block\">AB=DE,\\ \\angle B=\\angle E,\\ BC=EF\\ \\Rightarrow\\ \\triangle ABC\\cong\\triangle DEF<\/div>\n<p>夹角确定后，第三边的长度被唯一确定。<\/p>\n<h3>3. SSA 反例<\/h3>\n<div class=\"katex-block\">\\text{已知两边及一边对角，可能有两个解}<\/div>\n<p>所以 SSA 不能作为全等判定。<\/p>\n<h3>4. 相似（AAA）<\/h3>\n<div class=\"katex-block\">\\angle A=\\angle D,\\ \\angle B=\\angle E\\ \\Rightarrow\\ \\triangle ABC\\sim\\triangle DEF<\/div>\n<p>角相等只保证形状，不保证大小相等。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>判定条件依赖欧氏平面的刚性；在曲面上“全等”的含义要重新定义。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《直线形》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-11-直线形 毛鸿翔.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/plane-figures/chapter/ch02\">第 2 章：三角形与全等<\/a><\/span><\/div><h1>第 3 章：相似、比例与图形变换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用三组判定条件证明相似\n<\/li><li>\n用相似比求线段、周长、面积\n<\/li><li>\n说出四种变换的不变量\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>相似是“形状不变、大小按比例”；变换是“搬动图形但保留某些性质”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 相似的判定<\/h3>\n<ul><li>\n两角对应相等（AA）；\n<\/li><li>\n两边对应成比例且夹角相等（SAS）；\n<\/li><li>\n三边对应成比例（SSS）。\n<\/ul>\n<h3>3.2 相似比与面积比<\/h3>\n<p>若相似比为 k，则：<\/p>\n<ul><li>\n对应线段之比为 k；\n<\/li><li>\n周长之比为 k；\n<\/li><li>\n面积之比为 k²。\n<\/ul>\n<p>最后一条最容易错：面积是二维量，长度放大 k 倍，面积放大 k² 倍。<\/p>\n<h3>3.3 平行线分线段成比例<\/h3>\n<p>三条平行线截两条直线，截得的对应线段成比例。由此可得三角形中位线定理与“平行于一边的直线分另两边成比例”。<\/p>\n<h3>3.4 四种变换<\/h3>\n<ul><li>\n<strong>平移<\/strong>：形状、大小、方向都不变；\n<\/li><li>\n<strong>旋转<\/strong>：形状、大小不变，方向改变；\n<\/li><li>\n<strong>轴对称<\/strong>：形状、大小不变，左右翻转；\n<\/li><li>\n<strong>位似<\/strong>：形状不变，大小按比例放大缩小（相似变换）。\n<\/ul>\n<p>前三者是全等变换，位似是相似变换。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：相似像用复印机缩放，比例一致但尺寸不同；位似像从一点向外投影放大。<\/p>\n<p><strong>失效边界<\/strong>：面积比不是相似比，套错比例会差一个平方。<\/p>\n<p><strong>实例<\/strong>：两个相似三角形相似比 2:3，则周长比 2:3，面积比 4:9。 若小三角形面积为 8，则大三角形面积为 8×9/4=18。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 面积比等于相似比 —— 实际上 面积比是相似比的平方，因为面积涉及两个方向的长度。\n<\/li><li>\n别以为 所有变换都保持形状 —— 实际上 平移、旋转、轴对称、位似都保形状；投影、拉伸会改变形状。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n两个相似三角形的相似比为 1:2，则面积比为：\n<\/li><li>\n下列变换中，属于相似变换而非全等变换的是：\n<p>A. 1:2 ｜ B. 1:4 ｜ C. 2:1 ｜ D. 1:√2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：面积比是相似比的平方，即 1:4。 A. 平移 ｜ B. 旋转 ｜ C. 轴对称 ｜ D. 位似 <strong>答案<\/strong>：D ｜ <strong>解析<\/strong>：位似会按比例改变大小，只保持形状；其余三种保形状也保大小。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相似判定：AA、SAS、SSS\n<\/li><li>\n相似比 k ⇒ 周长比 k、面积比 k²\n<\/li><li>\n平移/旋转/轴对称是全等变换，位似是相似变换\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：相似、比例与图形变换）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：相似、比例与图形变换<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>相似的所有结论都来自一个事实：对应边成比例、对应角相等。比例一旦成立，长度、周长、面积就按不同幂次缩放。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>对应角相等、对应边成比例的两个图形叫相似图形，比值叫相似比。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像把地图放大：每条路都按同一倍数变长，但角度完全不变。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 相似判定<\/h3>\n<div class=\"katex-block\">\\angle A=\\angle D,\\ \\angle B=\\angle E\\ \\Rightarrow\\ \\triangle ABC\\sim\\triangle DEF<\/div>\n<p>两组角相等即可，第三组自动相等。<\/p>\n<h3>2. 线段比<\/h3>\n<div class=\"katex-block\">\\frac{AB}{DE}=\\frac{BC}{EF}=k<\/div>\n<p>所有对应线段按同一比例 k 缩放。<\/p>\n<h3>3. 面积比<\/h3>\n<div class=\"katex-block\">\\frac{S_{1}}{S_{2}}=k^{2}<\/div>\n<p>长度按 k 缩放，面积按 k² 缩放。<\/p>\n<h3>4. 位似<\/h3>\n<div class=\"katex-block\">\\vec{OP'}=k\\vec{OP}<\/div>\n<p>从同一点出发按比例缩放，是最典型的相似变换。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>只有对应边成比例还不够，必须配合对应角相等（或夹角相等）。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《直线形》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-11-直线形 毛鸿翔.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/plane-figures/chapter/ch01\">第 1 章：角与平行线<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/plane-figures/chapter/ch02\">第 2 章：三角形与全等<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/plane-figures/chapter/ch03\">第 3 章：相似、比例与图形变换<\/a><\/span><\/div><h1>判定与性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>“因为平行所以角相等”是性质，“因为角相等所以平行”是判定，方向不能反。<\/p>\n<h2>为什么重要<\/h2>\n<p>平面几何的证明几乎都在性质与判定之间来回切换，方向搞反就证不下去。<\/p>\n<h2>详解<\/h2>\n<p>性质是由已知的图形关系推出角或边的结论；判定是由角或边的条件推出图形关系。平行线、全等、相似都各有一对。做题时先看题目给的是“关系”还是“条件”，再决定用哪一个方向。<\/p>\n<h2>常见误解<\/h2>\n<p>把判定当性质用，比如由“同位角相等”直接说“两直线一定平行”却不说明理由，逻辑上仍成立但表述混乱。<\/p>\n<h2>相关概念<\/h2>\n<p>平行线（ch01）、全等（ch02）、相似（ch03）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-11-直线形 毛鸿翔.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/plane-figures/chapter/ch03\">第 3 章：相似、比例与图形变换<\/a><\/span><\/div><h1>不变量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>变换改变位置，不改变某些量；找出不变量，问题就简化了。<\/p>\n<h2>为什么重要<\/h2>\n<p>几何变换题的核心就是找“变的是什么、不变的是什么”。<\/p>\n<h2>详解<\/h2>\n<p>平移保持方向与长度；旋转保持长度与角度；轴对称保持长度与角度但翻转方向；位似保持角度、按比例改变长度。面积在相似变换下按 k² 变化，是“半不变量”。<\/p>\n<h2>常见误解<\/h2>\n<p>以为变换后一切都不变，忽略位似会改变大小、轴对称会改变方向。<\/p>\n<h2>相关概念<\/h2>\n<p>图形变换（ch03）、相似比（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：角与平行线<\/strong><br>阅读：<a href=\"#/book/plane-figures/chapter/ch01\">第 1 章：角与平行线<\/a><br>检查点：能用平行线性质推出角相等<\/li><li class='path-step' id='path-02'><strong>步骤 02：三角形与全等<\/strong><br>阅读：<a href=\"#/book/plane-figures/chapter/ch02\">第 2 章：三角形与全等<\/a><br>检查点：能选出正确的全等判定条件<\/li><li class='path-step' id='path-03'><strong>步骤 03：相似、比例与变换<\/strong><br>阅读：<a href=\"#/book/plane-figures/chapter/ch03\">第 3 章：相似、比例与图形变换<\/a><br>检查点：能用相似比求线段长<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：角与平行线<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 两条平行线被第三条直线所截，同旁内角的关系是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 相等<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 互补<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 互余<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 无法确定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedbac 05' value='2'> 2:1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 1:√2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='c01' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 下列变换中，属于相似变换而非全等变换的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 平移<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 旋转<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 轴对称<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 位似<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='余角'>余角 — 两角之和为 90°。 <span class=glossary-ref>（第 1 章：角与平行线）<\/span><\/li><li data-term='补角'>补角 — 两角之和为 180°。 <span class=glossary-ref>（第 1 章：角与平行线）<\/span><\/li><li data-term='对顶角'>对顶角 — 两直线相交形成的顶点相对的两个角。 <span class=glossary-ref>（第 1 章：角与平行线）<\/span><\/li><li data-term='同位角'>同位角 — 两条直线被第三条直线所截，位置相同的一对角。 <span class=glossary-ref>（第 1 章：角与平行线）<\/span><\/li><li data-term='全等'>全等 — 能完全重合的两个图形。 <span class=glossary-ref>（第 2 章：三角形与全等）<\/span><\/li><li data-term='ssa'>SSA — 两边及其中一边的对角，不能判定全等。 <span class=glossary-ref>（第 2 章：三角形与全等）<\/span><\/li><li data-term='相似'>相似 — 对应角相等、对应边成比例的两个图形。 <span class=glossary-ref>（第 3 章：相似、比例与图形变换）<\/span><\/li><li data-term='相似比'>相似比 — 相似图形对应线段的比值。 <span class=glossary-ref>（第 3 章：相似、比例与图形变换）<\/span><\/li><li data-term='位似'>位似 — 从一点出发按比例缩放的相似变换。 <span class=glossary-ref>（第 3 章：相似、比例与图形变换）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：证全等三步<\/h2>\n<p>① 找已知相等的边角；② 数够不够（SSS/SAS/ASA/AAS）；③ 按字母顺序写对应关系。<\/p>\n<h2>框架：相似题四问<\/h2>\n<p>① 有没有平行线（给出等角）；② 有没有公共角；③ 能否用比例；④ 求的是长度还是面积（决定用 k 还是 k²）。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>内角和<\/td><td>三角形 180°，n 边形 (n−2)×180°<\/td><\/tr><tr><td>外角<\/td><td>等于两个不相邻内角之和<\/td><\/tr><tr><td>全等判定<\/td><td>SSS、SAS、ASA、AAS<\/td><\/tr><tr><td>相似判定<\/td><td>AA、SAS、SSS<\/td><\/tr><tr><td>相似缩放<\/td><td>长度 k，周长 k，面积 k²<\/td><\/tr><tr><td>第三边范围<\/td><td>两边之差 &lt; x &lt; 两边之和<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：角与平行线", "href": "#/chapter/ch01"}, {"label": "第 2 章：三角形与全等", "href": "#/chapter/ch02"}, {"label": "第 3 章：相似、比例与图形变换", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "判定与性质", "href": "#/concept/c01"}, {"label": "不变量", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：角与平行线", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：三角形与全等", "href": "#/quiz/ch02"}, {"label
