<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习总手册</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 18px}
.brand{font-size:17px;font-weight:700;display:inline-block;margin-right:18px}
.brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.tabs{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.tab{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.hdr-right{float:right;display:flex;gap:8px;align-items:center;margin-top:2px}
#q{width:260px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:6px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
#progress-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.book-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}
.book-card{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--panel)}
.book-card h3{margin:0 0 6px;font-size:16px}
.book-card .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.book-card .enter{font-size:13px}
.empty{color:var(--muted);padding:20px 0}
@media print{header,.sidebar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:820px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}
  .hdr-right{float:none;margin-top:8px}#q{width:100%}}
</style>
</head>
<body>
<header>
  <span class="brand">学习总手册<span>点化学习系统 · 统一入口</span></span>
  <span class="tabs" id="tabs"></span>
  <span class="hdr-right">
    <input id="q" type="search" placeholder="全书搜索…">
    <button id="deriv-btn" title="打开本书的从零推导页">📐 从零推导</button>
    <button id="theme-btn">🌙 深色</button>
  </span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-label">进度 0%</div>
    <nav id="nav"></nav>
  </aside>
  <main><div id="view" class="page"></div></main>
</div>
<script>
const BOOKS = {"rational-irrational":{"manifest": {"slug": "rational-irrational", "title": "有理数与无理数", "subtitle": "从相反意义的量到实数：数集是怎么一步步被撑大的", "book": {"title": "有理数与无理数", "author": "（丛书第 1 册）", "source": ["数学基础知识丛书-01-有理数与无理数.pdf"]}, "audience": "零基础", "goal": "把自然数—分数—有理数—实数这条扩充链走通，能自己证明 √2 不是有理数，并理解“用有理数逼近无理数”为什么是极限的开端。", "learningPath": [{"step": "01", "title": "有理数的概念与数轴", "chapterIds": ["ch01"], "checkpoint": "能说出 -a 与 |a| 的区别，能在数轴上标出 -7/3"}, {"step": "02", "title": "有理数的四则运算", "chapterIds": ["ch02"], "checkpoint": "能用分配律解释“负负得正”，能算含分数的混合运算"}, {"step": "03", "title": "乘方与开方", "chapterIds": ["ch03"], "checkpoint": "能区分 (-2)^4 与 -2^4，能判断一个方根开得尽还是开不尽"}, {"step": "04", "title": "无理数与实数", "chapterIds": ["ch04"], "checkpoint": "能独立写出 √2 不是有理数的反证"}, {"step": "05", "title": "逼近、代数数与超越数", "chapterIds": ["ch05"], "checkpoint": "能说清截断序列的误差为什么小于 10^-n"}], "chapters": [{"id": "ch01", "title": "第 1 章：有理数的概念与数轴", "file": "chapters/ch01-rational-number-axis.md", "difficulty": 1}, {"id": "ch02", "title": "第 2 章：有理数的四则运算", "file": "chapters/ch02-arithmetic.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：乘方与开方", "file": "chapters/ch03-power-root.md", "difficulty": 2}, {"id": "ch04", "title": "第 4 章：无理数与实数", "file": "chapters/ch04-irrational-real.md", "difficulty": 3}, {"id": "ch05", "title": "第 5 章：逼近、代数数与超越数", "file": "chapters/ch05-approximation-transcendental.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "有理数与无理数的分界", "file": "concepts/c01-rational-vs-irrational.md", "chapterIds": ["ch01", "ch04"]}, {"id": "c02", "title": "实数与数轴的一一对应", "file": "concepts/c02-real-line-bijection.md", "chapterIds": ["ch01", "ch04"]}, {"id": "c03", "title": "用有理数逼近无理数", "file": "concepts/c03-approximation.md", "chapterIds": ["ch05"]}], "glossary": [{"term": "有理数", "def": "能写成两个整数之比 m/n（n≠0）的数，包含整数与分数。", "chapterId": "ch01"}, {"term": "无理数", "def": "不是有理数的实数，即不能写成两个整数之比的数。", "chapterId": "ch04"}, {"term": "相反数", "def": "对 a 而言是 −a；两者在数轴上关于原点对称。", "chapterId": "ch01"}, {"term": "绝对值", "def": "数轴上表示 a 的点到原点的距离，恒为非负数。", "chapterId": "ch01"}, {"term": "数轴", "def": "规定了原点、正方向和单位长度的直线。", "chapterId": "ch01"}, {"term": "乘方", "def": "n 个相同因数 a 相乘的简写，记作 a^n。", "chapterId": "ch03"}, {"term": "开方", "def": "求满足 x^n=a 的 x 的运算，是乘方的逆运算。", "chapterId": "ch03"}, {"term": "算术根", "def": "非负的那个 n 次方根，记作 ⁿ√a。", "chapterId": "ch03"}, {"term": "稠密性", "def": "任意两个有理数之间还存在有理数，这个性质叫有理数的稠密性。", "chapterId": "ch04"}, {"term": "代数数", "def": "某个整系数多项式方程的根。", "chapterId": "ch05"}, {"term": "超越数", "def": "不是代数数的实数，如 π、e。", "chapterId": "ch05"}, {"term": "截断序列", "def": "把无理数的小数在第 n 位后截断得到的有理数列。", "chapterId": "ch05"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "下列各数中，是负有理数的是：", "options": ["−3/4", "0", "|−2|", "−(−5)"], "answer": 0, "explain": "−3/4 是负分数，属有理数。0 不是负数；|−2|=2 是正数；−(−5)=5 是正数。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "比较 −7/8 与 −6/7 的大小，正确的是：", "options": ["−7/8 > −6/7", "−7/8 < −6/7", "−7/8 = −6/7", "无法比较"], "answer": 1, "explain": "通分得 −49/56 与 −48/56。两负数比较，绝对值大的反而小，49>48，所以 −7/8 < −6/7。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "计算 (−2)(−3)+(−4) 的结果是：", "options": ["−10", "2", "10", "−2"], "answer": 1, "explain": "(−2)(−3)=6（同号得正），再加 −4 得 2。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "下列运算中，能说明有理数集对除法不封闭的是：", "options": ["3÷4=3/4", "(−6)÷2=−3", "5÷0 没有意义", "0÷7=0"], "answer": 2, "explain": "封闭要求“任意两个元素运算后仍在集合内”。5÷0 因为除数没有倒数而不成立，说明除法必须把 0 排除在外。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "下列各式中值等于 −16 的是：", "options": ["(−2)^4", "−2^4", "(−4)^2", "2^4"], "answer": 1, "explain": "−2^4 表示 2 的四次幂取相反数，等于 −16；(−2)^4=16，(−4)^2=16，2^4=16。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "下列方根中，结果不是有理数的是：", "options": ["√49", "∛(−27)", "√2", "√0.25"], "answer": 2, "explain": "√49=7；∛(−27)=−3；√0.25=0.5；而 2 不是任何有理数的平方，√2 不是有理数。"}, {"id": "ch04-q07", "chapterId": "ch04", "type": "single", "question": "“√2 不是有理数”的反证中，关键矛盾是：", "options": ["m、n 都很大", "m、n 同為偶数，与互质矛盾", "√2 是无限小数", "2 不是平方数"], "answer": 1, "explain": "由 m²=2n² 推出 m 偶，再由 m=2k 推出 n 偶，于是 m、n 有公因数 2，与“最简分数”矛盾。"}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "下列数中是无理数的是：", "options": ["0.121212…（循环）", "√16", "π", "22/7"], "answer": 2, "explain": "循环小数是有理数；√16=4；22/7 是分数；π 不是任何整系数多项式方程的根，是无理数（超越数）。"}, {"id": "ch05-q09", "chapterId": "ch05", "type": "single", "question": "用 √2 的截断序列 x_n 近似，要保证误差小于 10^-5，至少取到第几位？", "options": ["3", "4", "5", "6"], "answer": 2, "explain": "误差上界是 10^-n，要求 10^-n<10^-5，需 n≥5，故取 x_5=1.41421。"}, {"id": "ch05-q10", "chapterId": "ch05", "type": "single", "question": "下列数中，属于超越数的是：", "options": ["√2", "黄金比 (1+√5)/2", "π", "22/7"], "answer": 2, "explain": "√2 是 x²−2=0 的根；黄金比是 x²−x−1=0 的根；22/7 是有理数；π 不是任何整系数多项式方程的根，是超越数。"}, {"id": "q11", "chapterId": "__all__", "type": "single", "question": "关于有理数与无理数，下列说法正确的是：", "options": ["无限小数都是无理数", "√9 是无理数", "有理数在数轴上稠密但不连续", "两个无理数的和一定是无理数"], "answer": 2, "explain": "无限循环小数是有理数；√9=3；√2+(−√2)=0 是有理数，故 D 错；有理数稠密但数轴上有缝，C 正确。"}, {"id": "q12", "chapterId": "__all__", "type": "single", "question": "用截断序列逼近 π，取 x_2=3.14，误差满足：", "options": ["误差小于 0.001", "误差小于 0.01", "误差大于 0.01", "无法判断"], "answer": 1, "explain": "截断到两位小数，砍掉的尾部小于 0.01，故 0≤π−3.14<0.01。"}, {"id": "q13", "chapterId": "__all__", "type": "single", "question": "“代数数可数、实数不可数”这个论证直接说明：", "options": ["所有实数都是代数数", "超越数存在且数量极多", "代数数都是有理数", "π 是有理数"], "answer": 1, "explain": "可数集合无法覆盖不可数集合，所以必有非代数数的实数，即超越数；而且余下的数量远多于代数数。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：有理数的概念与数轴」的一句话核心是什么？", "back": "有理数就是能写成两个整数之比的数；数轴把这套数按大小排成一条线，右边的永远比左边大。", "tags": ["rational-irrational", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：有理数的四则运算」的一句话核心是什么？", "back": "减法是加相反数，除法是乘倒数；所有符号规则都由分配律推出来，不是额外规定。", "tags": ["rational-irrational", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：乘方与开方」的一句话核心是什么？", "back": "乘方是相同因数连乘的简写；开方是它的逆运算——开得尽时结果是有理数，开不尽时结果就跳出有理数集。", "tags": ["rational-irrational", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：无理数与实数」的一句话核心是什么？", "back": "开不尽的方根不能写成两个整数之比，这类数叫无理数；有理数与无理数合起来是实数，实数把数轴填满了。", "tags": ["rational-irrational", "核心"]}, {"id": "f05", "chapterId": "ch05", "front": "「第 5 章：逼近、代数数与超越数」的一句话核心是什么？", "back": "无理数用有理数列逼近，误差随位数缩小到任意小——这就是极限的雏形；能当整系数多项式方程的根的叫代数数，当不了的叫超越数。", "tags": ["rational-irrational", "核心"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「有理数」？", "back": "能写成两个整数之比 m/n（n≠0）的数，包含整数与分数。", "tags": ["rational-irrational", "术语"]}, {"id": "f07", "chapterId": "ch04", "front": "什么是「无理数」？", "back": "不是有理数的实数，即不能写成两个整数之比的数。", "tags": ["rational-irrational", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「相反数」？", "back": "对 a 而言是 −a；两者在数轴上关于原点对称。", "tags": ["rational-irrational", "术语"]}, {"id": "f09", "chapterId": "ch01", "front": "什么是「绝对值」？", "back": "数轴上表示 a 的点到原点的距离，恒为非负数。", "tags": ["rational-irrational", "术语"]}, {"id": "f10", "chapterId": "ch01", "front": "什么是「数轴」？", "back": "规定了原点、正方向和单位长度的直线。", "tags": ["rational-irrational", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「乘方」？", "back": "n 个相同因数 a 相乘的简写，记作 a^n。", "tags": ["rational-irrational", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「开方」？", "back": "求满足 x^n=a 的 x 的运算，是乘方的逆运算。", "tags": ["rational-irrational", "术语"]}, {"id": "f13", "chapterId": "ch03", "front": "什么是「算术根」？", "back": "非负的那个 n 次方根，记作 ⁿ√a。", "tags": ["rational-irrational", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「稠密性」？", "back": "任意两个有理数之间还存在有理数，这个性质叫有理数的稠密性。", "tags": ["rational-irrational", "术语"]}, {"id": "f15", "chapterId": "ch05", "front": "什么是「代数数」？", "back": "某个整系数多项式方程的根。", "tags": ["rational-irrational", "术语"]}, {"id": "f16", "chapterId": "ch05", "front": "什么是「超越数」？", "back": "不是代数数的实数，如 π、e。", "tags": ["rational-irrational", "术语"]}, {"id": "f17", "chapterId": "ch05", "front": "什么是「截断序列」？", "back": "把无理数的小数在第 n 位后截断得到的有理数列。", "tags": ["rational-irrational", "术语"]}], "companion": "rational-irrational学习伴侣.html", "deriv": "rational-irrational从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：有理数的概念与数轴<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：四则运算、分数、数数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用“相反意义的量”解释负数是怎么被引进来的\n<\/li><li>\n分清整数、分数、有理数的范围，知道 0 的位置\n<\/li><li>\n能在数轴上定位一个有理数并比较两个负数的大小\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>有理数就是能写成两个整数之比的数；数轴把这套数按大小排成一条线，右边的永远比左边大。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 负数不是凭空规定的<\/h3>\n<p>先看两个场景。<\/p>\n<p>汽车从同一地点出发，一辆向东走 5 公里到 A 地，一辆向西走 5 公里到 B 地。两辆车走过的路程都是 5 公里，但方向相反。如果只写一个“5”，A 和 B 就分不出来了。<\/p>\n<p>温度从 5 ℃ 降到 2 ℃，写成 5−2=3 没问题；但如果从 2 ℃ 降到 5 ℃ 以下，比如降到零下 3 ℃，用原来的数算 2−5 就没有意义了。<\/p>\n<p>这两个场景的共同点是：<strong>量的两个方向（两种相反意义）需要两个不同的记号<\/strong>。做法是：规定其中一种意义为正，另一种为负。向东记作正，向西 5 公里就记作 −5 公里；零上记作正，零下 3 ℃ 就记作 −3 ℃。<\/p>\n<p>规定哪一边为正<strong>不是绝对的<\/strong>——规定向西为正也完全成立，只是不符合习惯。一旦定了，另一边就必须为负，不能两边都算正。<\/p>\n<h3>1.2 正数、负数、零<\/h3>\n<p>在原来的数（0 除外）前面放上“−”号得到的数叫<strong>负数<\/strong>，如 −5、−3/4、−10.05。原来的那些数（0 除外）叫<strong>正数<\/strong>，如 5、3/4、10.05。正数前的“+”可以省略，+5 和 5 是同一个数。<\/p>\n<p><strong>0 既不是正数也不是负数<\/strong>，它是正负之间的界线。0 也不能简单理解成“没有”：0 ℃ 不是没有温度，而是标准大气压下冰水混合的那个确定温度。<\/p>\n<h3>1.3 有理数包括哪些<\/h3>\n<ul><li>\n正整数、0、负整数，统称<strong>整数<\/strong>；\n<\/li><li>\n正分数、负分数，统称<strong>分数<\/strong>；\n<\/li><li>\n整数和分数合起来叫<strong>有理数<\/strong>。\n<\/ul>\n<p>所以有理数就是一切能写成 m/n 形式的数，其中 m、n 是整数且 n≠0。有限小数（如 0.25=1/4）和循环小数（如 0.333…=1/3）都是有理数。<\/p>\n<h3>1.4 数轴：给每个数找一个位置<\/h3>\n<p>画一条直线，指定：<\/p>\n<ol><li>\n<strong>原点<\/strong>（对应 0 的那个点）；\n<\/li><li>\n<strong>正方向<\/strong>（通常向右，画箭头）；\n<\/li><li>\n<strong>单位长度<\/strong>（一个固定的长度算作 1）。\n<\/ol>\n<p>这条线就是数轴。每个有理数都能在数轴上找到一个点：正数在原点右边，负数在左边，到原点的距离由绝对值决定。<\/p>\n<p>反过来要注意：数轴上的点<strong>不一定<\/strong>都是有理数。这条“填不满”的缝，第 4 章会用 √2 补上。<\/p>\n<h3>1.5 相反数与绝对值<\/h3>\n<p><strong>相反数<\/strong>：a 的相反数是 −a。注意 −a 不一定是负数——当 a=−3 时，−a=3 是正数；当 a=0 时，−a=0。<\/p>\n<p><strong>绝对值<\/strong>：|a| 表示数轴上表示 a 的点到原点的距离，所以 |a|≥0 恒成立。|−3|=3，|3|=3，|0|=0。<\/p>\n<p>两者关系：|a| 就是 a 与 −a 中那个非负的数。<\/p>\n<h3>1.6 比较大小<\/h3>\n<p>规则只有一条：<strong>数轴上右边的数比左边的大<\/strong>。由此得到三条常用结论：<\/p>\n<ul><li>\n任何正数 &gt; 0 &gt; 任何负数；\n<\/li><li>\n两个负数比大小，绝对值大的反而小（因为它离原点更远、位置更靠左）；\n<\/li><li>\n比较分数可以先通分，也可以化成小数（但循环小数要当心精度）。\n<\/ul>\n<p>例：比较 −7/8 与 −6/7。通分：−49/56 与 −48/56。因为 49&gt;48，所以 −49/56 &lt; −48/56，即 −7/8 &lt; −6/7。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[&quot;原点 0&quot;] --&gt; B[&quot;正方向 →&quot;]\n  A --&gt; C[&quot;负方向 ←&quot;]\n  B --&gt; D[&quot;+1 +2 +3 … 越右越大&quot;]\n  C --&gt; E[&quot;-1 -2 -3 … 越左越小&quot;]\n  D --&gt; F[&quot;绝对值 = 到原点的距离&quot;]\n  E --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这条轴：箭头定正方向，格子定单位长度；绝对值只量距离、不看方向，所以 |−3|=|3|。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：数轴像一把有刻度的尺子，0 是零点，往右是“正”的一侧，往左是“负”的一侧。尺子上的每个刻度都对应一个数。<\/p>\n<p><strong>失效边界<\/strong>：这把尺子只有有理数刻度时，某些长度（比如边长为 1 的正方形的对角线）量不出来——第 4 章会看到，这个长度 √2 不在尺子的刻度里。<\/p>\n<p><strong>实例<\/strong>：某地一天的气温从 −3 ℃ 升到 7 ℃，温差是多少？ 解：温差 = 7−(−3) = 7+3 = 10（℃）。用数轴看，就是从 −3 这个点向右移动 10 格到达 7。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 −a 一定是负数 —— 实际上 a 本身可能是负数或 0：a=−3 时 −a=3，a=0 时 −a=0。符号“−”在这里表示“取相反数”，不是“一定是负”。\n<\/li><li>\n别以为 |a| 一定等于 a —— 实际上 只有 a≥0 时 |a|=a；a&lt;0 时 |a|=−a。绝对值的结果永远非负，a 本身可正可负。\n<\/li><li>\n别以为 0 就是“没有” —— 实际上 0 是一个确定的数，表示正负的分界，也对应数轴上的原点、0 ℃ 这样的具体状态。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列各数中，是负有理数的是：\n<\/li><li>\n比较 −7/8 与 −6/7 的大小，正确的是：\n<p>A. −3/4 ｜ B. 0 ｜ C. |−2| ｜ D. −(−5) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：−3/4 是负分数，属有理数。0 不是负数；|−2|=2 是正数；−(−5)=5 是正数。 A. −7/8 &gt; −6/7 ｜ B. −7/8 &lt; −6/7 ｜ C. −7/8 = −6/7 ｜ D. 无法比较 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：通分得 −49/56 与 −48/56。两负数比较，绝对值大的反而小，49&gt;48，所以 −7/8 &lt; −6/7。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n有理数 ⇔ 能写成 m/n（n≠0）\n<\/li><li>\n数轴三要素：原点、正方向、单位长度\n<\/li><li>\n|a| 是距离，恒 ≥0；−a 只是“取相反”\n<\/ul>", "ch02": "<h1>第 2 章：有理数的四则运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、分数运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按符号规则正确做有理数加减乘除\n<\/li><li>\n用分配律自己推出“负负得正”，而不是背结论\n<\/li><li>\n解释为什么有理数集对四则运算封闭（除数不为 0）\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>减法是加相反数，除法是乘倒数；所有符号规则都由分配律推出来，不是额外规定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 加法：两条规则<\/h3>\n<ul><li>\n<strong>同号相加<\/strong>：取相同的符号，绝对值相加。如 (−7)+(−4)=−11。\n<\/li><li>\n<strong>异号相加<\/strong>：取绝对值较大的那个数的符号，用较大的绝对值减去较小的绝对值。如 (−7)+4=−3。\n<\/ul>\n<p>再加两条特殊情形：a+0=a；互为相反数的两个数相加得 0。<\/p>\n<h3>2.2 减法就是加相反数<\/h3>\n<blockquote>a − b = a + (−b)<\/blockquote>\n<p>所以 (−7)−4=(−7)+(−4)=−11；(−7)−(−4)=(−7)+4=−3。减法不需要另立一套符号规则。<\/p>\n<h3>2.3 乘法：符号怎么定<\/h3>\n<ul><li>\n同号得正，异号得负；\n<\/li><li>\n任何数与 0 相乘得 0；\n<\/li><li>\n绝对值相乘。\n<\/ul>\n<p>于是 (−2)(−3)=6，(−2)(3)=−6。<\/p>\n<p><strong>“负负得正”不是硬规定的<\/strong>，它可以从分配律推出来：<\/p>\n<p>展开：(−a)[(−b)+b] = (−a)(−b) + (−a)b = 0，所以 (−a)(−b) = ab。<\/p>\n<p>所以 (−a)(−b)=−(−a)b=ab。也就是说，只要承认分配律，负负得正就是唯一不矛盾的选择。<\/p>\n<h3>2.4 除法就是乘倒数<\/h3>\n<p>a ÷ b = a × (1/b)（b ≠ 0）<\/p>\n<p>符号规则与乘法相同：同号得正、异号得负。除以一个数等于乘它的倒数，所以<strong>除数不能为 0<\/strong>——0 没有倒数。<\/p>\n<h3>2.5 运算律与“数域”<\/h3>\n<p>加法满足交换律、结合律；乘法满足交换律、结合律；乘法对加法满足分配律。<\/p>\n<p>正因为有这些运算律，有理数集对加、减、乘、除（除数≠0）是<strong>封闭<\/strong>的：算来算去还是有理数。数学上把这样的数集叫<strong>数域<\/strong>。这一点很关键——第 3 章开方就会发现，封闭性在这里第一次被打破。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[&quot;有理数 a, b&quot;] --&gt; B[&quot;加法：同号／异号两条规则&quot;]\n  A --&gt; C[&quot;减法：a-b = a+（-b）&quot;]\n  A --&gt; D[&quot;乘法：同号得正、异号得负&quot;]\n  A --&gt; E[&quot;除法：a÷b = a×（1/b）, b≠0&quot;]\n  B --&gt; F[&quot;交换律、结合律、分配律&quot;]\n  C --&gt; F\n  D --&gt; F\n  E --&gt; F\n  F --&gt; G[&quot;结果仍是有理数：数域封闭&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这张图：四条运算最终都落在同一组运算律上，封闭性是由“结果仍属于有理数集”体现的。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：正负号像“方向牌”。同向走两步是加速（同号得正），反向走是被抵消（异号得负）；乘法的符号规则相当于“转向两次回到原方向”。<\/p>\n<p><strong>失效边界<\/strong>：这个类比只管符号方向，不管大小；绝对值部分仍要单独算。<\/p>\n<p><strong>实例<\/strong>：计算 −3/4 + 5/6 − 1/2。 通分（分母 12）：−9/12 + 10/12 − 6/12 = (−9+10−6)/12 = −5/12。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 “负负得正”是人为规定、没有道理 —— 实际上 它可以由分配律推出：由 (−a)[(−b)+b]=0 得 (−a)(−b)=ab。承认分配律，就没有别的选择。\n<\/li><li>\n别以为 减一个负数等于减一个正数 —— 实际上 减去负数等于加上它的相反数：a−(−b)=a+b。例如 5−(−3)=8。\n<\/li><li>\n别以为 除以 0 也能算，只是结果很大 —— 实际上 0 没有倒数，a÷0 在有理数里没有定义；这不是“算不出来”，而是运算本身不成立。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n计算 (−2)(−3)+(−4) 的结果是：\n<\/li><li>\n下列运算中，能说明有理数集对除法不封闭的是：\n<p>A. −10 ｜ B. 2 ｜ C. 10 ｜ D. −2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：(−2)(−3)=6（同号得正），再加 −4 得 2。 A. 3÷4=3/4 ｜ B. (−6)÷2=−3 ｜ C. 5÷0 没有意义 ｜ D. 0÷7=0 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：封闭要求“任意两个元素运算后仍在集合内”。5÷0 因为除数没有倒数而不成立，说明除法必须把 0 排除在外。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na−b=a+(−b)，a÷b=a×(1/b)\n<\/li><li>\n符号规则来自分配律，不是额外约定\n<\/li><li>\n有理数集是数域，除法要求除数≠0\n<\/ul>", "ch03": "<h1>第 3 章：乘方与开方<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清 a^n 的定义与符号规律，分清 (−2)^4 与 −2^4\n<\/li><li>\n由指数法则推出 a^0=1 与 a^-n=1/a^n\n<\/li><li>\n判断一个方根开得尽还是开不尽\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>乘方是相同因数连乘的简写；开方是它的逆运算——开得尽时结果是有理数，开不尽时结果就跳出有理数集。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 乘方的定义<\/h3>\n<p>a^n = a × a × … × a（n 个 a 相乘）<\/p>\n<p>a 叫底数，n 叫指数，结果叫幂。n 是正整数时这是“连乘”的缩写。<\/p>\n<p>符号规律：<\/p>\n<ul><li>\n正数的任何次幂都是正数；\n<\/li><li>\n负数的偶次幂是正数，奇次幂是负数；\n<\/li><li>\n0 的正整数次幂是 0。\n<\/ul>\n<p>所以 (−2)^4=16，而 (−2)^3=−8。<\/p>\n<p><strong>注意括号<\/strong>：(−2)^4 表示“−2 这个数”的四次幂，等于 16；−2^4 表示“2 的四次幂取相反数”，等于 −16。差一对括号，结果差一个符号。<\/p>\n<h3>3.2 指数法则<\/h3>\n<p>a^m × a^n = a^(m+n)；(a^m)^n = a^(mn)；(ab)^n = a^n × b^n<\/p>\n<p>这三条在正整数指数下可以直接由“连乘”验证。<\/p>\n<h3>3.3 零指数与负指数<\/h3>\n<p>要让 a^m/a^n=a^{m−n} 在 m=n 时也成立，必须有 a^0=1（a≠0）。<\/p>\n<p>要让它在 m&lt;n 时也成立，必须有<\/p>\n<p>a^(−n) = 1 / a^n（a ≠ 0）<\/p>\n<p>这两条不是新规定，而是“让指数法则不出现例外”的唯一选择。<\/p>\n<h3>3.4 开方与算术根<\/h3>\n<p>如果 x^n=a，就说 x 是 a 的一个 n 次方根。求方根的运算叫开方，它是乘方的逆运算。<\/p>\n<ul><li>\nn 为偶数时，a&gt;0 有两个 n 次方根，互为相反数；其中非负的那个叫<strong>算术根<\/strong>，记作 ⁿ√a；\n<\/li><li>\nn 为奇数时，a 的 n 次方根只有一个，符号与 a 相同。\n<\/ul>\n<p>例如 √81=9（算术根，另一个根是 −9）；∛(−8)=−2；√0=0。<\/p>\n<h3>3.5 开得尽与开不尽<\/h3>\n<p>如果 a 能写成某个有理数的 n 次幂，方根就是有理数，叫“开得尽”。例如 81=9^2，所以 √81=9。<\/p>\n<p>如果开不尽，结果就<strong>不是有理数<\/strong>。例如 2 不是任何有理数的平方，√2 就不在有理数集里。这正是下一章的入口。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[&quot;a^n：n 个 a 连乘&quot;] --&gt; B[&quot;指数法则&quot;]\n  B --&gt; C[&quot;a^0=1（a≠0）&quot;]\n  B --&gt; D[&quot;a^-n=1/a^n（a≠0）&quot;]\n  A --&gt; E[&quot;逆运算：开方&quot;]\n  E --&gt; F{&quot;a 是否等于某个有理数的 n 次幂？&quot;}\n  F --&gt;|是| G[&quot;开得尽：方根是有理数&quot;]\n  F --&gt;|否| H[&quot;开不尽：方根不是有理数&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这个判断分支：开方是否留在有理数集里，取决于被开方数是不是有理数的 n 次幂，而不取决于我们算得够不够快。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：乘方像“把一个数按倍数叠高”，开方像“问这个高度是几层叠出来的”。叠得整齐（开得尽）就有整数答案，叠得不整齐（开不尽）就没有有理答案。<\/p>\n<p><strong>失效边界<\/strong>：这个类比默认“层数”是整数；一旦允许分数指数，乘方与开方的界线就模糊了。<\/p>\n<p><strong>实例<\/strong>：判断 √36、√50、∛27 是否开得尽。 √36=6（36=6^2，开得尽）；∛27=3（27=3^3，开得尽）；√50 开不尽——因为 50 介于 7^2=49 与 8^2=64 之间，且 50 不是任何有理数的平方。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 (−2)^4 与 −2^4 是一回事 —— 实际上 前者是 (−2)^4=16，后者是 −(2^4)=−16。括号决定“负号属于底数还是属于整个幂”。\n<\/li><li>\n别以为 a^0=0 —— 实际上 a^0=1（a≠0）。由 a^n/a^n=1 与指数法则相减即可得到；0^0 无定义。\n<\/li><li>\n别以为 √a 一定是正数 —— 实际上 算术根非负，但方程 x^2=a 有两个根 ±√a；说“方根”时必须区分“算术根”和“全部根”。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列各式中值等于 −16 的是：\n<\/li><li>\n下列方根中，结果不是有理数的是：\n<p>A. (−2)^4 ｜ B. −2^4 ｜ C. (−4)^2 ｜ D. 2^4 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：−2^4 表示 2 的四次幂取相反数，等于 −16；(−2)^4=16，(−4)^2=16，2^4=16。 A. √49 ｜ B. ∛(−27) ｜ C. √2 ｜ D. √0.25 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：√49=7；∛(−27)=−3；√0.25=0.5；而 2 不是任何有理数的平方，√2 不是有理数。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na^n 是连乘的缩写，括号决定负号归属\n<\/li><li>\na^0=1、a^-n=1/a^n 由指数法则逼出来\n<\/li><li>\n开得尽 ⇔ 被开方数是有理数的 n 次幂\n<\/ul>", "ch04": "<h1>第 4 章：无理数与实数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出 √2 不是有理数的完整反证\n<\/li><li>\n说出无理数的两类常见来源\n<\/li><li>\n解释实数与数轴上的点为什么一一对应\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>开不尽的方根不能写成两个整数之比，这类数叫无理数；有理数与无理数合起来是实数，实数把数轴填满了。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 √2 不是有理数<\/h3>\n<p>假设 √2 是有理数，那么它可以写成最简分数<\/p>\n<p>√2 = m / n<\/p>\n<p>其中 m、n 是正整数且互质（没有公因数）。<\/p>\n<p>两边平方：2=m²/n²，即<\/p>\n<p>m² = 2n²<\/p>\n<p>右边是偶数，所以 m² 是偶数，于是 m 是偶数。设 m=2k，代入得 4k²=2n²，即 n²=2k²，同理 n 也是偶数。<\/p>\n<p>m、n 都是偶数，与“互质”矛盾。所以假设不成立，√2 不是有理数。<\/p>\n<p>这个证明只用了一条性质：<strong>平方为偶数的整数必为偶数<\/strong>。<\/p>\n<h3>4.2 无理数的两类来源<\/h3>\n<ol><li>\n<strong>开不尽的方根<\/strong>：√2、√3、∛5 等；\n<\/li><li>\n<strong>圆周率 π 这一类<\/strong>：它不是任何整系数多项式方程的根（第 5 章会给出这个说法的名字：超越数）。\n<\/ol>\n<p>无理数的共同点是：写成小数既不终止也不循环。√2=1.41421356…，π=3.14159265…，都看不到循环节。<\/p>\n<h3>4.3 实数与数轴<\/h3>\n<p>有理数和无理数合起来叫<strong>实数<\/strong>。实数的关键性质是：<\/p>\n<blockquote>数轴上的每一个点都对应一个实数，每一个实数都对应数轴上的一个点。<\/blockquote>\n<p>这叫“一一对应”。第 1 章说过有理数在数轴上填不满，现在这些缝隙被无理数补上了。<\/p>\n<h3>4.4 实数的大小与运算<\/h3>\n<p>实数比较大小仍然看数轴：右边的更大。具体操作时常用有理数近似：要比较 √2 与 1.414，只需比较它们的平方（都是正数，平方保序）：2 &gt; 1.414²=1.999396，所以 √2&gt;1.414。<\/p>\n<p>实数的加、减、乘、除（除数非零）仍然封闭，实数集也是数域；运算时常用“取到足够精度的有理近似”来算，结果再用误差控制说明可靠性。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[&quot;有理数 Q：m/n&quot;] --&gt; C[&quot;实数 R&quot;]\n  B[&quot;无理数：开不尽的方根、π、e&quot;] --&gt; C\n  C --&gt; D[&quot;与数轴上的点一一对应&quot;]\n  D --&gt; E[&quot;比较大小：右边的更大&quot;]\n  D --&gt; F[&quot;运算：借有理近似 + 误差控制&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这张图：实数不是“又一种数”，而是有理数与无理数的并集；一一对应是它最关键的结构性质。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：有理数像尺子上刻好的刻度，无理数像刻度之间的“缝”。缝看不见，但量对角线时就会暴露——边长为 1 的正方形，对角线长 √2，任何刻度都量不准。<\/p>\n<p><strong>失效边界<\/strong>：这个类比只在“一维数轴”上成立；到了二维平面，“点”和“数”的对应要换成“点”和“数对”。<\/p>\n<p><strong>实例<\/strong>：比较 √3 与 1.7 的大小。 两边都是正数，平方保序：3 与 2.89 比较，3&gt;2.89，所以 √3&gt;1.7。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 无理数就是“开不尽的数” —— 实际上 开不尽的方根只是无理数的一类；π、e 这类超越数同样是无理数，但不是方根形式。\n<\/li><li>\n别以为 无限小数都是无理数 —— 实际上 0.333…=1/3 是无限循环小数，属有理数。只有“不循环”的无限小数才是无理数。\n<\/li><li>\n别以为 实数比有理数“多一些”，结构差不多 —— 实际上 实数与数轴一一对应、且是完备的（没有缝隙）；有理数虽然稠密，但有缝隙，这是本质差别。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“√2 不是有理数”的反证中，关键矛盾是：\n<\/li><li>\n下列数中是无理数的是：\n<p>A. m、n 都很大 ｜ B. m、n 同為偶数，与互质矛盾 ｜ C. √2 是无限小数 ｜ D. 2 不是平方数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：由 m²=2n² 推出 m 偶，再由 m=2k 推出 n 偶，于是 m、n 有公因数 2，与“最简分数”矛盾。 A. 0.121212…（循环） ｜ B. √16 ｜ C. π ｜ D. 22/7 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：循环小数是有理数；√16=4；22/7 是分数；π 不是任何整系数多项式方程的根，是无理数（超越数）。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n√2 无理性的证明：平方 → 偶性 → 与互质矛盾\n<\/li><li>\n实数 = 有理数 ∪ 无理数，与数轴一一对应\n<\/li><li>\n无限不循环小数 ⇔ 无理数\n<\/ul>", "ch05": "<h1>第 5 章：逼近、代数数与超越数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出 √2 的十进制截断序列并估计误差\n<\/li><li>\n说明代数数与超越数的区别，各举两例\n<\/li><li>\n用“可数／不可数”解释超越数为什么大量存在\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>无理数用有理数列逼近，误差随位数缩小到任意小——这就是极限的雏形；能当整系数多项式方程的根的叫代数数，当不了的叫超越数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 十进制截断序列<\/h3>\n<p>把 √2 的小数一位位截下来：<\/p>\n<p>1.4，1.41，1.414，1.4142，……<\/p>\n<p>第 n 个截断值记作 x_n，它满足<\/p>\n<p>0 ≤ √2 − x_n &lt; 10^(−n)<\/p>\n<p>所以 n 越大，误差越小，想多小就多小。这个“要多大精度就给多大精度”的性质，就是后面极限概念的起点。<\/p>\n<h3>5.2 误差估计怎么用<\/h3>\n<p>比如要保证误差小于 0.001，取 n=3 就够：x_3=1.414，误差小于 10^-3。<\/p>\n<p>实际计算时还要注意：截断是“向下取”，所以 x_n 总是比 √2 小；如果四舍五入，误差可能正也可能负，估计时要加绝对值。<\/p>\n<h3>5.3 最佳渐近分数<\/h3>\n<p>除了十进制，还可以用分数逼近。把 √2 展开成连分数，得到<\/p>\n<p>1，3/2，7/5，17/12，41/29，……<\/p>\n<p>这些分数叫 √2 的渐近分数。它们的误差比同分母的其他分数都小，所以叫“最佳”。原书第 14 节给出了这套分数的构造与误差比较。<\/p>\n<h3>5.4 代数数<\/h3>\n<p>如果一个数能是某个整系数多项式方程的根，它就叫<strong>代数数<\/strong>。<\/p>\n<ul><li>\n√2 是 x²−2=0 的根，是代数数；\n<\/li><li>\n黄金比 (1+√5)/2 是 x²−x−1=0 的根，是代数数；\n<\/li><li>\n所有有理数都是代数数（q 是 nx−p=0 的根）。\n<\/ul>\n<h3>5.5 超越数<\/h3>\n<p>不是代数数的实数叫<strong>超越数<\/strong>。π 和 e 都是超越数（证明很难，原书只给出思路）。<\/p>\n<p>为什么超越数一定存在？因为：<\/p>\n<ul><li>\n整系数多项式只有可数多个，每个只有有限个根，所以代数数<strong>可数<\/strong>；\n<\/li><li>\n实数<strong>不可数<\/strong>（康托的对角线论证）。\n<\/ul>\n<p>可数的集合塞不满不可数的集合，所以一定有非代数数——超越数不仅存在，还比代数数“多得多”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[&quot;实数 R&quot;] --&gt; B[&quot;代数数：整系数多项式方程的根&quot;]\n  A --&gt; C[&quot;超越数：π、e …&quot;]\n  B --&gt; D[&quot;包含全部有理数&quot;]\n  B --&gt; E[&quot;包含 √2、∛5 等&quot;]\n  C --&gt; F[&quot;可数 vs 不可数：超越数占绝大多数&quot;]\n  A --&gt; G[&quot;十进制截断序列 → 极限&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这张图：代数数把有理数和常见的开方数都收进去了，超越数是剩下的“绝大多数”；右侧那支说明逼近是实数的通用工具。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：逼近像用越来越细的网格去圈一个点，网格越细，圈住的区域越小；但你永远只能用有限网格，点是“极限”。<\/p>\n<p><strong>失效边界<\/strong>：截断序列只能给出“越来越准”，不能直接给出 √2 的精确值；精确值只能作为那个极限存在。<\/p>\n<p><strong>实例<\/strong>：用截断序列估计 √2，要求误差小于 0.0001。 取 n=4：x_4=1.4142，误差小于 10^-4=0.0001，满足要求。 验证：1.4142²=1.99996164&lt;2，且 (1.4143)²=2.00024… &gt;2，说明 √2 确实夹在两者之间。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 只要算得够多，无理数就能算尽 —— 实际上 无理数的小数不终止也不循环，任何有限位都只是近似；精确值只能由极限或代数关系刻画。\n<\/li><li>\n别以为 π 是无理数，所以它不属于实数 —— 实际上 π 是实数，只是不是有理数；无理数本来就是实数的一部分。\n<\/li><li>\n别以为 代数数都是无理数 —— 实际上 有理数也是代数数（例如 2 是 x−2=0 的根），代数数包含全部有理数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用 √2 的截断序列 x_n 近似，要保证误差小于 10^-5，至少取到第几位？\n<\/li><li>\n下列数中，属于超越数的是：\n<p>A. 3 ｜ B. 4 ｜ C. 5 ｜ D. 6 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：误差上界是 10^-n，要求 10^-n&lt;10^-5，需 n≥5，故取 x_5=1.41421。 A. √2 ｜ B. 黄金比 (1+√5)/2 ｜ C. π ｜ D. 22/7 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：√2 是 x²−2=0 的根；黄金比是 x²−x−1=0 的根；22/7 是有理数；π 不是任何整系数多项式方程的根，是超越数。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n截断误差 &lt;10^-n，精度可以任意提高\n<\/li><li>\n代数数 = 整系数多项式方程的根；超越数 = 不是\n<\/li><li>\n代数数可数、实数不可数 ⇒ 超越数存在且极多\n<\/ul>", "c01": "<h1>有理数与无理数的分界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>能写成两个整数之比的叫有理数，写不成的叫无理数。<\/p>\n<h2>为什么重要<\/h2>\n<p>整本书的骨架就是这条分界线：先造出有理数，再发现它填不满数轴，于是引入无理数。判据只有一个——能不能写成 m/n。<\/p>\n<h2>详解<\/h2>\n<p>「有理数的三种外观」容易让人误判：整数、有限小数、循环小数都属有理数，因为它们都能化成 m/n。反过来，只要一个小数既不终止也不循环，它就一定不是有理数。<\/p>\n<p>判定时要避免「看起来像」：√9=3 是有理数，√2 不是；0.1010010001…（每段多一个 0）不循环，是无理数。判断依据永远是形式（能否写成比值／是否是整系数多项式方程的根），不是纸面上的样子。<\/p>\n<h2>常见误解<\/h2>\n<p>别把「开方」当成无理性的判据：√9 开了方仍然是有理数。要看开得尽不尽。<\/p>\n<h2>相关概念<\/h2>\n<p>有理数（ch01）、无理数（ch04）、实数（ch04）<\/p>", "c02": "<h1>实数与数轴的一一对应<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>数轴上的每个点恰好对应一个实数，每个实数恰好对应一个点。<\/p>\n<h2>为什么重要<\/h2>\n<p>这条性质把「数」和「位置」接了起来，后面解析几何、函数图象都靠它：方程的解可以画成点，点的位置可以用数算。<\/p>\n<h2>详解<\/h2>\n<p>有理数在数轴上是稠密的：任意两个有理数之间还有有理数。稠密不等于填满——√2 对应的点就没有有理数对应。把无理数补进去之后，数轴才没有缝，这才叫完备。<\/p>\n<p>一一对应有两个方向：数 → 点（定位），点 → 数（读数）。两个方向都成立，才能把几何问题翻译成代数问题。<\/p>\n<h2>常见误解<\/h2>\n<p>稠密 ≠ 连续。有理数稠密但有缝；实数才连续。<\/p>\n<h2>相关概念<\/h2>\n<p>数轴（ch01）、无理数（ch04）、区间<\/p>", "c03": "<h1>用有理数逼近无理数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch05\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>给出一串有理数，使它们与目标无理数的差可以小于任意给定的正数。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是极限概念的雏形。后面数列的极限、函数的极限、定积分，全都是「用一串已知的量去夹住一个未知的量」。<\/p>\n<h2>详解<\/h2>\n<p>逼近要回答两个问题：误差上界是多少（可靠性），能不能任意小（精度）。十进制截断给出的上界是 10^-n，随 n 增大趋于 0；连分数给出的渐近分数在同样分母下误差最小。<\/p>\n<p>注意逼近不是「越来越像所以就是」：有限步永远只是近似，精确值由「极限存在」来定义，而不是由某一项给出。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为逼近序列的极限等于其中某一项；极限是序列整体趋近的那个数。<\/p>\n<h2>相关概念<\/h2>\n<p>截断序列（ch05）、渐近分数（ch05）、极限（《数列与极限》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：有理数的概念与数轴<\/strong><br>阅读：<a href=\"#/book/rational-irrational/chapter/ch01\">第 1 章：有理数的概念与数轴<\/a><br>检查点：能说出 -a 与 |a| 的区别，能在数轴上标出 -7/3<\/li><li class='path-step' id='path-02'><strong>步骤 02：有理数的四则运算<\/strong><br>阅读：<a href=\"#/book/rational-irrational/chapter/ch02\">第 2 章：有理数的四则运算<\/a><br>检查点：能用分配律解释“负负得正”，能算含分数的混合运算<\/li><li class='path-step' id='path-03'><strong>步骤 03：乘方与开方<\/strong><br>阅读：<a href=\"#/book/rational-irrational/chapter/ch03\">第 3 章：乘方与开方<\/a><br>检查点：能区分 (-2)^4 与 -2^4，能判断一个方根开得尽还是开不尽<\/li><li class='pat 分数。 <span class=glossary-ref>（第 1 章：有理数的概念与数轴）<\/span><\/li><li data-term='无理数'>无理数 — 不是有理数的实数，即不能写成两个整数之比的数。 <span class=glossary-ref>（第 4 章：无理数与实数）<\/span><\/li><li data-term='相反数'>相反数 — 对 a 而言是 −a；两者在数轴上关于原点对称。 <span class=glossary-ref>（第 1 章：有理数的概念与数轴）<\/span><\/li><li data-term='绝对值'>绝对值 — 数轴上表示 a 的点到原点的距离，恒为非负数。 <span class=glossary-ref>（第 1 章：有理数的概念与数轴）<\/span><\/li><li data-term='数轴'>数轴 — 规定了原点、正方向和单位长度的直线。 <span class=glossary-ref>（第 1 章：有理数的概念与数轴）<\/span><\/li><li data-term='乘方'>乘方 — n 个相同因数 a 相乘的简写，记作 a^n。 <span class=glossary-ref>（第 3 章：乘方与开方）<\/span><\/li><li data-term='开方'>开方 — 求满足 x^n=a 的 x 的运算，是乘方的逆运算。 <span class=glossary-ref>（第 3 章：乘方与开方）<\/span><\/li><li data-term='算术根'>算术根 — 非负的那个 n 次方根，记作 ⁿ√a。 <span class=glossary-ref>（第 3 章：乘方与开方）<\/span><\/li><li data-term='稠密性'>稠密性 — 任意两个有理数之间还存在有理数，这个性质叫有理数的稠密性。 <span class=glossary-ref>（第 4 章：无理数与实数）<\/span><\/li><li data-term='代数数'>代数数 — 某个整系数多项式方程的根。 <span class=glossary-ref>（第 5 章：逼近、代数数与超越数）<\/span><\/li><li data-term='超越数'>超越数 — 不是代数数的实数，如 π、e。 <span class=glossary-ref>（第 5 章：逼近、代数数与超越数）<\/span><\/li><li data-term='截断序列'>截断序列 — 把无理数的小数在第 n 位后截断得到的有理数列。 <span class=glossary-ref>（第 5 章：逼近、代数数与超越数）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：扩充数集的三问<\/h2>\n<p>每次引入新数，都按同一套流程检查：① 新数能不能解决旧数解决不了的具体问题（动机）；② 大小比较规则是否仍然自洽（序）；③ 四则运算是否仍然封闭、运算律是否仍成立（代数结构）。三问都过，扩充才算完成。<\/p>\n<h2>框架：反证法的三步<\/h2>\n<p>① 反设结论不成立；② 从反设出发做合法推理，直到出现自相矛盾（与已知事实、互质性、正负性冲突）；③ 否定反设，结论成立。适用信号：命题含「不是」「不存在」「无限」等否定性词汇。<\/p>\n<h2>框架：逼近的两个指标<\/h2>\n<p>任何逼近方案都要报两个数：误差上界（可靠性）和收敛速度（效率）。只报「很接近」而不给上界，等于没给结论。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>有理数的判据<\/td><td>能写成 m/n（m∈Z，n∈N+）；有限小数与循环小数都满足<\/td><\/tr><tr><td>负数比较大小<\/td><td>绝对值大的反而小；通分后比较分子<\/td><\/tr><tr><td>减法与除法<\/td><td>a−b=a+(−b)；a÷b=a×(1/b)，b≠0<\/td><\/tr><tr><td>符号规则来源<\/td><td>由分配律推出 (−a)(−b)=ab，不是额外规定<\/td><\/tr><tr><td>零指数与负指数<\/td><td>a^0=1（a≠0）；a^−n=1/a^n<\/td><\/tr><tr><td>算术根<\/td><td>ⁿ√a≥0；方程 x^n=a（n 偶，a&gt;0）有两根 ±ⁿ√a<\/td><\/tr><tr><td>√2 无理性<\/td><td>假设 √2=m/n 最简 → m²=2n² → m、n 皆偶 → 矛盾<\/td><\/tr><tr><td>截断误差<\/td><td><\/td><td>√2−x_n<\/td><td>&lt;10^−n；要误差 &lt;ε 取 n&gt;−lg ε<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：有理数的概念与数轴", "href": "#/chapter/ch01"}, {"label": "第 2 章：有理数的四则运算", "href": "#/chapter/ch02"}, {"label": "第 3 章：乘方与开方", "href": "#/chapter/ch03"}, {"label": "第 4 章：无理数与实数", "href": "#/chapter/ch04"}, {"label": "第 5 章：逼近、代数数与超越数", "href": "#/chapter/ch05"}]}, {"label": "概念", "children": [{"label": "有理数与无理数的分界", "href": "#/concept/c01"}, {"label": "实数与数轴的一一对应", "href": "#/concept/c02"}, {"label": "用有理数逼近无理数", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：有理数的概念与数轴", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：有理数的四则运算", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：乘方与开方", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：无理数与实数", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：逼近、代数数与超越数", "href": "#/quiz/ch05"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true, "ch04": true, "ch05": true}},"zhengshi":{"manifest": {"slug": "zhengshi", "title": "整式", "subtitle": "字母也能算：整式的加减乘除与恒等变形", "book": {"title": "整式", "author": "吉星 杨佩祥", "source": ["数学基础知识丛书-02-整式 吉星 杨佩祥.pdf"]}, "audience": "零基础", "goal": "把单项式、多项式的四则运算做熟，能用乘法公式与待定系数法完成整式变形。", "learningPath": [{"step": "01", "title": "整式的概念与加减法", "chapterIds": ["ch01"], "checkpoint": "能判断同类项并化简含括号的多项式"}, {"step": "02", "title": "整式的乘法与乘法公式", "chapterIds": ["ch02"], "checkpoint": "能默写三个乘法公式并逆用"}, {"step": "03", "title": "整式的除法", "chapterIds": ["ch03"], "checkpoint": "能做多项式长除法并写出带余除式"}, {"step": "04", "title": "多项式恒等定理与待定系数法", "chapterIds": ["ch04"], "checkpoint": "能设系数解出使两式恒等的参数"}], "chapters": [{"id": "ch01", "title": "第 1 章：整式的概念与加减法", "file": "chapters/ch01-concept-add-subtract.md", "difficulty": 1}, {"id": "ch02", "title": "第 2 章：整式的乘法与乘法公式", "file": "chapters/ch02-multiplication.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：整式的除法", "file": "chapters/ch03-division.md", "difficulty": 2}, {"id": "ch04", "title": "第 4 章：多项式恒等定理与待定系数法", "file": "chapters/ch04-identity.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "同类项与合并", "file": "concepts/c01-like-terms.md", "chapterIds": ["ch01"]}, {"id": "c02", "title": "带余除式与恒等定理", "file": "concepts/c02-division-identity.md", "chapterIds": ["ch03", "ch04"]}], "glossary": [{"term": "单项式", "def": "数与字母的乘积，单独一个数或字母也算。", "chapterId": "ch01"}, {"term": "系数", "def": "单项式中的数字因数。", "chapterId": "ch01"}, {"term": "次数", "def": "单项式各字母指数之和；多项式取最高次项的次数。", "chapterId": "ch01"}, {"term": "同类项", "def": "字母相同且相同字母指数也相同的项。", "chapterId": "ch01"}, {"term": "分配律", "def": "a(b+c)=ab+ac，整式变形的基本依据。", "chapterId": "ch01"}, {"term": "乘法公式", "def": "平方差、完全平方、立方和差三组展开结果。", "chapterId": "ch02"}, {"term": "长除法", "def": "逐次消去最高次项的多项式除法。", "chapterId": "ch03"}, {"term": "带余除式", "def": "A=BQ+R，余式次数低于除式。", "chapterId": "ch03"}, {"term": "恒等", "def": "对字母的一切取值两边都相等。", "chapterId": "ch04"}, {"term": "待定系数法", "def": "设出含未知系数的形式，再比较系数求解。", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "−3x²y 的系数与次数分别是：", "options": ["−3，2", "−3，3", "3，3", "3，2"], "answer": 1, "explain": "系数是数字因数 −3；次数是各字母指数之和 2+1=3。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "化简 a−(2a−b)+b 的结果是：", "options": ["−a+2b", "−a", "3a", "−a−2b"], "answer": 0, "explain": "去括号：a−2a+b+b = −a+2b。括号前是负号，−b 变 +b。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "展开 (2x−3)(2x+3) 的结果是：", "options": ["4x²−9", "4x²+9", "4x²−12x+9", "4x²−6x−9"], "answer": 0, "explain": "平方差公式：(2x)²−3²=4x²−9。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "计算 102×98 最简便的算法是：", "options": ["102×100−102×2", "(100+2)(100−2)=100²−4", "100×98+2×98", "直接竖式相乘"], "answer": 1, "explain": "102×98=(100+2)(100−2)=100²−2²=9996，用平方差一步到位。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "12x⁴y²÷3x²y 的结果是：", "options": ["4x²y", "4x⁶y³", "4x²y²", "4x²"], "answer": 0, "explain": "系数 12÷3=4；x 的指数 4−2=2；y 的指数 2−1=1，得 4x²y。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "(x²−1)÷(x−1) 的商与余式分别是：", "options": ["x+1，0", "x−1，0", "x+1，2", "x，1"], "answer": 0, "explain": "x²−1=(x−1)(x+1)，整除，商 x+1，余式 0。"}, {"id": "ch04-q07", "chapterId": "ch04", "type": "single", "question": "若 x²+ax+b≡(x−1)(x+4)，则 a、b 为：", "options": ["a=3，b=−4", "a=5，b=4", "a=−3，b=−4", "a=3，b=4"], "answer": 0, "explain": "右边展开 x²+3x−4，比较系数得 a=3，b=−4。"}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "两个三次多项式在几个不同点上取值相同，就一定能判定它们恒等？", "options": ["2 个", "3 个", "4 个", "1 个"], "answer": 2, "explain": "次数为 3，需要 n+1=4 个不同的点；少于 4 个不足以排除差多项式有根的情况。"}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "下列各组中，是同类项的是：", "options": ["3x²y 与 3xy²", "−2ab 与 5ba", "x² 与 x³", "2a 与 2b"], "answer": 1, "explain": "−2ab 与 5ba 字母相同、指数都是 1，是同类项；其余三组字母或指数不同。"}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "(x³+1)÷(x+1) 的商是：", "options": ["x²−x+1", "x²+x+1", "x²−1", "x²+1"], "answer": 0, "explain": "x³+1=(x+1)(x²−x+1)，故商为 x²−x+1，余式 0。"}, {"id": "q11", "chapterId": "__all__", "type": "single", "question": "若 2x²+ax−3≡2(x−1)(x+2)+b，则 a、b 为：", "options": ["a=2，b=1", "a=2，b=−3", "a=−2，b=1", "a=1，b=1"], "answer": 0, "explain": "右边展开得 2x²+2x−4+b。比较 x 项系数得 a=2；比较常数项 −3=−4+b 得 b=1。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：整式的概念与加减法」的一句话核心是什么？", "back": "整式的加减只做一件事：把字母部分完全相同的项并起来，系数相加。", "tags": ["zhengshi", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：整式的乘法与乘法公式」的一句话核心是什么？", "back": "乘法就是反复用分配律展开；指数法则负责字母部分，乘法公式是展开结果的压缩记忆。", "tags": ["zhengshi", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：整式的除法」的一句话核心是什么？", "back": "除法是指数法则的逆用；除不尽时写成 A=BQ+R，余式的次数必须低于除式。", "tags": ["zhengshi", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：多项式恒等定理与待定系数法」的一句话核心是什么？", "back": "两个次数不超过 n 的多项式，只要在 n+1 个不同点取值相同，就恒等；于是可以设出系数再解方程。", "tags": ["zhengshi", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「单项式」？", "back": "数与字母的乘积，单独一个数或字母也算。", "tags": ["zhengshi", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「系数」？", "back": "单项式中的数字因数。", "tags": ["zhengshi", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「次数」？", "back": "单项式各字母指数之和；多项式取最高次项的次数。", "tags": ["zhengshi", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「同类项」？", "back": "字母相同且相同字母指数也相同的项。", "tags": ["zhengshi", "术语"]}, {"id": "f09", "chapterId": "ch01", "front": "什么是「分配律」？", "back": "a(b+c)=ab+ac，整式变形的基本依据。", "tags": ["zhengshi", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「乘法公式」？", "back": "平方差、完全平方、立方和差三组展开结果。", "tags": ["zhengshi", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「长除法」？", "back": "逐次消去最高次项的多项式除法。", "tags": ["zhengshi", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「带余除式」？", "back": "A=BQ+R，余式次数低于除式。", "tags": ["zhengshi", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「恒等」？", "back": "对字母的一切取值两边都相等。", "tags": ["zhengshi", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「待定系数法」？", "back": "设出含未知系数的形式，再比较系数求解。", "tags": ["zhengshi", "术语"]}], "companion": "zhengshi学习伴侣.html", "deriv": "zhengshi从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：整式的概念与加减法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：数与字母、乘法分配律\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n分清单项式的系数与次数、多项式的项与次数\n<\/li><li>\n识别同类项并按分配律合并\n<\/li><li>\n正确去括号、添括号\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>整式的加减只做一件事：把字母部分完全相同的项并起来，系数相加。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 单项式<\/h3>\n<p>数与字母的乘积叫<strong>单项式<\/strong>，单独一个数或一个字母也算单项式。例如 5x、−3x²y、7、a 都是单项式。<\/p>\n<ul><li>\n<strong>系数<\/strong>：单项式里的数字因数。−3x²y 的系数是 −3。\n<\/li><li>\n<strong>次数<\/strong>：所有字母的指数之和。−3x²y 的次数是 2+1=3。\n<\/ul>\n<h3>1.2 多项式<\/h3>\n<p>几个单项式的和叫<strong>多项式<\/strong>，其中每个单项式叫<strong>项<\/strong>，不含字母的项叫<strong>常数项<\/strong>。多项式里次数最高的项的次数，就是这个多项式的<strong>次数<\/strong>。<\/p>\n<p>例如 3x²−2x+5 是二次三项式：三项分别是 3x²、−2x、5，次数为 2。<\/p>\n<h3>1.3 同类项与合并<\/h3>\n<p><strong>字母相同、并且相同字母的指数也相同<\/strong>的项叫同类项。3x²y 与 −7x²y 是同类项；3x² 与 3x 不是（指数不同）。<\/p>\n<p>合并同类项的依据是分配律：<\/p>\n<p>3x²+5x²=(3+5)x²=8x²<\/p>\n<p>字母部分原样保留，只把系数相加。常数项之间也是同类项。<\/p>\n<h3>1.4 去括号与添括号<\/h3>\n<p>括号前是“+”，去括号后各项符号不变；括号前是“−”，去括号后各项都变号：<\/p>\n<p>a−(b+c)=a−b−c<\/p>\n<p>理由仍是分配律：a−(b+c)=a+(−1)(b+c)=a−b−c。添括号是反方向：需要把几项括起来时，括号前加“−”，括进去的每一项都要变号。<\/p>\n<h3>1.5 化简的顺序<\/h3>\n<p>先去括号（由内向外），再合并同类项；有多个括号时，每去一层就检查一次符号。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：同类项像同一种水果——3 个苹果加 5 个苹果是 8 个苹果，但 3 个苹果加 5 个梨不能合并。<\/p>\n<p><strong>失效边界<\/strong>：字母部分只要有一处不同（哪怕只是指数不同），就不是同类项，不能合并。<\/p>\n<p><strong>实例<\/strong>：化简 3x²y−2xy²+5x²y−xy²。 同类项分组：(3+5)x²y + (−2−1)xy² = 8x²y−3xy²。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 3x² 与 3x 是同类项 —— 实际上 指数不同就不是同类项。x² 与 x 表示不同的字母幂，不能合并。\n<\/li><li>\n别以为 2(x+y)=2x+y —— 实际上 分配律要求括号内每一项都乘：2(x+y)=2x+2y。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n−3x²y 的系数与次数分别是：\n<\/li><li>\n化简 a−(2a−b)+b 的结果是：\n<p>A. −3，2 ｜ B. −3，3 ｜ C. 3，3 ｜ D. 3，2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：系数是数字因数 −3；次数是各字母指数之和 2+1=3。 A. −a+2b ｜ B. −a ｜ C. 3a ｜ D. −a−2b <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：去括号：a−2a+b+b = −a+2b。括号前是负号，−b 变 +b。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单项式看系数与次数，多项式看项与最高次\n<\/li><li>\n同类项两条件：字母相同、指数相同\n<\/li><li>\n括号前是负号，去括号每一项都变号\n<\/ul>", "ch02": "<h1>第 2 章：整式的乘法与乘法公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、指数法则\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按“系数相乘、指数相加”做单项式乘法\n<\/li><li>\n用分配律展开多项式乘法并合并同类项\n<\/li><li>\n默写并逆用三个乘法公式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>乘法就是反复用分配律展开；指数法则负责字母部分，乘法公式是展开结果的压缩记忆。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 单项式乘单项式<\/h3>\n<p>系数相乘，同底数幂的指数相加：<\/p>\n<p>(−2x²y)(3xy³) = (−2×3)·x^(2+1)·y^(1+3) = −6x³y⁴<\/p>\n<p>不同字母各自保留，不要强行相加指数。<\/p>\n<h3>2.2 单项式乘多项式、多项式乘多项式<\/h3>\n<p>单项式乘多项式，把单项式乘到括号内每一项：<\/p>\n<p>a(b+c)=ab+ac<\/p>\n<p>多项式乘多项式，前一个多项式的每一项乘后一个多项式的每一项，再把同类项并起来：<\/p>\n<p>(a+b)(c+d)=ac+ad+bc+bd<\/p>\n<p>展开后项数是两个多项式项数的乘积，合并同类项前先数项，能及时发现漏乘。<\/p>\n<h3>2.3 三个乘法公式<\/h3>\n<ul><li>\n<strong>平方差<\/strong>：(a+b)(a−b)=a²−b²\n<\/li><li>\n<strong>完全平方<\/strong>：(a±b)²=a²±2ab+b²\n<\/li><li>\n<strong>立方和差<\/strong>：(a±b)(a²∓ab+b²)=a³±b³\n<\/ul>\n<p>三个公式都是展开后的特例，不是新规则。记不住时，直接展开一遍即可。<\/p>\n<h3>2.4 正用与逆用<\/h3>\n<p>正用：把乘积写成多项式，如 (2x−3y)(2x+3y)=4x²−9y²。<\/p>\n<p>逆用：把多项式写成乘积，如 x²−9=(x−3)(x+3)。逆用是后面因式分解的入口。<\/p>\n<p>数值计算里也能用：99×101=(100−1)(100+1)=100²−1=9999。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：多项式乘法像发牌——第一个括号里每一项都要和第二个括号里每一项碰一次，碰完再归类。<\/p>\n<p><strong>失效边界<\/strong>：碰的次数是项数相乘，项数多时容易漏；公式只在结构完全对上时才能套。<\/p>\n<p><strong>实例<\/strong>：展开 (x+2)(x−3)。 逐项相乘：x²−3x+2x−6 = x²−x−6。 若用公式检查：这不是平方差结构（两项符号不同但常数不等），不能硬套。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 (a+b)²=a²+b² —— 实际上 漏了中间项。正确结果是 a²+2ab+b²，可用 a=1,b=1 代入检验：左边 4，右边 2。\n<\/li><li>\n别以为 x²−9 不能再分解 —— 实际上 它是平方差，x²−9=(x−3)(x+3)，逆用公式即可。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n展开 (2x−3)(2x+3) 的结果是：\n<\/li><li>\n计算 102×98 最简便的算法是：\n<p>A. 4x²−9 ｜ B. 4x²+9 ｜ C. 4x²−12x+9 ｜ D. 4x²−6x−9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：平方差公式：(2x)²−3²=4x²−9。 A. 102×100−102×2 ｜ B. (100+2)(100−2)=100²−4 ｜ C. 100×98+2×98 ｜ D. 直接竖式相乘 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：102×98=(100+2)(100−2)=100²−2²=9996，用平方差一步到位。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单项式相乘：系数乘系数，指数相加\n<\/li><li>\n多项式相乘：逐项相乘后合并同类项\n<\/li><li>\n平方差与完全平方都是展开的特例\n<\/ul>", "ch03": "<h1>第 3 章：整式的除法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按“系数相除、指数相减”做单项式除法\n<\/li><li>\n用长除法做多项式除以多项式\n<\/li><li>\n写出带余除式 A=BQ+R 并判断余式次数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>除法是指数法则的逆用；除不尽时写成 A=BQ+R，余式的次数必须低于除式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 单项式除以单项式<\/h3>\n<p>系数相除，同底数幂的指数相减：<\/p>\n<p>6x⁵y³ ÷ 2x²y = 3x^(5−2)y^(3−1) = 3x³y²<\/p>\n<p>被除式里没有的字母，结果中也不出现；指数相减出现负数时，按负指数写成倒数。<\/p>\n<h3>3.2 多项式除以单项式<\/h3>\n<p>把多项式的每一项分别除以这个单项式，再把商相加：<\/p>\n<p>(6x³−4x²)÷2x = 3x²−2x<\/p>\n<h3>3.3 多项式除以多项式：长除法<\/h3>\n<p>步骤与整数长除法相同：<\/p>\n<ol><li>\n用被除式的最高次项除以除式的最高次项，得到商的第一项；\n<\/li><li>\n用这一项乘除式，从被除式里减掉；\n<\/li><li>\n对余下的式子重复上述两步，直到余式的次数低于除式。\n<\/ol>\n<p>例：(x³−1)÷(x−1)。第一次商 x²，减得 x²−1；再商 x，减得 x−1；再商 1，减得 0。所以商是 x²+x+1，余式为 0。<\/p>\n<h3>3.4 带余除式<\/h3>\n<p>一般地，对被除式 A、除式 B（B≠0），存在唯一的商 Q 与余式 R，使<\/p>\n<p>A = BQ + R，且 R 的次数低于 B 的次数（或 R=0）<\/p>\n<p>这条式子是后面“余数定理”“因式定理”的基础。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：长除法像分装——每次先用最大的盒子装，装完把剩下的再分，直到剩下的装不满一个盒子。<\/p>\n<p><strong>失效边界<\/strong>：除法要求除式不为零；除式是零多项式时整个式子没有意义。<\/p>\n<p><strong>实例<\/strong>：(2x³+3x²−5x+2)÷(x+2)。 第一次商 2x²，乘除式得 2x³+4x²，相减得 −x²−5x+2； 再商 −x，乘得 −x²−2x，相减得 −3x+2； 再商 −3，乘得 −3x−6，相减得 8。 所以商 2x²−x−3，余式 8，即 2x³+3x²−5x+2=(x+2)(2x²−x−3)+8。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 除法就是指数相减，任何式子都能除尽 —— 实际上 只有单项式相除才直接减指数；多项式相除可能有余式，余式不为零就除不尽。\n<\/li><li>\n别以为 余式可以任意次数 —— 实际上 带余除式要求余式次数严格低于除式次数，否则还能继续除。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n12x⁴y²÷3x²y 的结果是：\n<\/li><li>\n(x²−1)÷(x−1) 的商与余式分别是：\n<p>A. 4x²y ｜ B. 4x⁶y³ ｜ C. 4x²y² ｜ D. 4x² <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：系数 12÷3=4；x 的指数 4−2=2；y 的指数 2−1=1，得 4x²y。 A. x+1，0 ｜ B. x−1，0 ｜ C. x+1，2 ｜ D. x，1 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：x²−1=(x−1)(x+1)，整除，商 x+1，余式 0。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单项式相除：系数相除、指数相减\n<\/li><li>\n多项式相除用长除法，逐次消去最高次项\n<\/li><li>\n带余除式：A=BQ+R，R 的次数低于 B\n<\/ul>", "ch04": "<h1>第 4 章：多项式恒等定理与待定系数法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清两个多项式在什么条件下恒等\n<\/li><li>\n用比较系数或代特殊值求未知系数\n<\/li><li>\n判断一个恒等式是否可能成立\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>两个次数不超过 n 的多项式，只要在 n+1 个不同点取值相同，就恒等；于是可以设出系数再解方程。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 什么是恒等<\/h3>\n<p>两个多项式恒等，指对字母的任意取值，两边的值都相等，记作 P(x)≡Q(x)。<\/p>\n<p>注意区别：方程只要求“某些 x 使两边相等”，恒等式要求“所有 x 都相等”。<\/p>\n<h3>4.2 恒等定理<\/h3>\n<p>如果两个次数都不超过 n 的多项式 P、Q 在 n+1 个互不相同的点上取值相同，那么 P≡Q。<\/p>\n<p>直观理由：P−Q 的次数不超过 n；如果它不是零多项式，最多只有 n 个根。现在它有 n+1 个不同的根，只能恒等于零。<\/p>\n<h3>4.3 待定系数法<\/h3>\n<p>步骤：<\/p>\n<ol><li>\n按已知结构设出带未知系数的形式（如 ax²+bx+c）；\n<\/li><li>\n展开、合并同类项，或代入几个特殊值；\n<\/li><li>\n比较两边同类项的系数（或解方程组），求出未知系数；\n<\/li><li>\n回代检验。\n<\/ol>\n<p>常用特殊值：x=0 求常数项，x=1 求系数和，x=−1 求交错和。<\/p>\n<h3>4.4 典型用法<\/h3>\n<ul><li>\n求参数：已知 x²+ax+b≡(x−1)(x+3)，展开右边得 x²+2x−3，比较系数得 a=2，b=−3。\n<\/li><li>\n拆分分式：把有理分式拆成几个简单分式之和（第 4 册会用到）。\n<\/li><li>\n判断命题：若两边次数不同，恒等一定不成立，不必再算。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：恒等定理像“指纹比对”——不必逐点验证整条曲线，只要在足够多的点上对上了，两条曲线就只能是同一条。<\/p>\n<p><strong>失效边界<\/strong>：点数必须超过次数。“足够多”不是随便几个，n 次多项式要 n+1 个点。<\/p>\n<p><strong>实例<\/strong>：求 a、b 使 x²+ax+b≡(x−2)(x+5)。 右边展开：x²+3x−10。比较系数：a=3，b=−10。 检验：取 x=0，左边 b=−10，右边 (−2)(5)=−10，一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 只要有两个点取值相同就恒等 —— 实际上 两点只能确定一次多项式；二次及以上需要三个以上不同的点。\n<\/li><li>\n别以为 恒等式可以直接用“移项求解”的方式处理 —— 实际上 恒等式对所有 x 成立，比较的是系数，不是解出某个 x。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 x²+ax+b≡(x−1)(x+4)，则 a、b 为：\n<\/li><li>\n两个三次多项式在几个不同点上取值相同，就一定能判定它们恒等？\n<p>A. a=3，b=−4 ｜ B. a=5，b=4 ｜ C. a=−3，b=−4 ｜ D. a=3，b=4 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：右边展开 x²+3x−4，比较系数得 a=3，b=−4。 A. 2 个 ｜ B. 3 个 ｜ C. 4 个 ｜ D. 1 个 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：次数为 3，需要 n+1=4 个不同的点；少于 4 个不足以排除差多项式有根的情况。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n恒等：对所有取值都相等；方程：只对某些取值相等\n<\/li><li>\nn 次多项式需 n+1 个点才能定死\n<\/li><li>\n待定系数法：设形式 → 比较系数 → 解方程 → 回代\n<\/ul>", "c01": "<h1>同类项与合并<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>字母相同、对应指数也相同的项，才能把系数加起来。<\/p>\n<h2>为什么重要<\/h2>\n<p>整式加减的全部技术都在这里；判断错同类项，后面化简、因式分解都会连锁出错。<\/p>\n<h2>详解<\/h2>\n<p>判断同类项看两件事：字母种类是否完全一致、每个字母的指数是否一致。系数与字母的排列顺序不影响。合并时只加系数，字母部分照抄。<\/p>\n<h2>常见误解<\/h2>\n<p>别把“字母相同”当成同类项的全部条件：x² 与 x 字母相同但指数不同，不能合并。<\/p>\n<h2>相关概念<\/h2>\n<p>单项式（ch01）、分配律（ch01）<\/p>", "c02": "<h1>带余除式与恒等定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>除不尽就写成 A=BQ+R；两个多项式在足够多点重合就恒等。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两条是“整式”从计算走向理论的转折：一条给出除法的完整结果，一条给出判断两个式子是否同一的办法。<\/p>\n<h2>详解<\/h2>\n<p>带余除式保证余式次数低于除式，从而商与余式唯一；恒等定理把“逐点验证”压缩成“有限个点验证”，两者都靠“次数”这个有限指标起作用。<\/p>\n<h2>常见误解<\/h2>\n<p>把“在若干点相等”当成恒等：点数不足时不成立。<\/p>\n<h2>相关概念<\/h2>\n<p>长除法（ch03）、待定系数法（ch04）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：整式的概念与加减法<\/strong><br>阅读：<a href=\"#/book/zhengshi/chapter/ch01\">第 1 章：整式的概念与加减法<\/a><br>检查点：能判断同类项并化简含括号的多项式<\/li><li class='path-step' id='path-02'><strong>步骤 02：整式的乘法与乘法公式<\/strong><br>阅读：<a href=\"#/book/zhengshi/chapter/ch02\">第 2 章：整式的乘法与乘法公式<\/a><br>检查点：能默写三个乘法公式并逆用<\/li><li class='path-step' id='path-03'><strong>步骤 03：整式的除法<\/strong><br>阅读：<a href=\"#/book/zhengshi/chapter/ch03\">第 3 章：整式的除法<\/a><br>检查点：能做多项式长除法并写出带余除式<\/li><li class='path-step' id='path-04'><strong>步骤 04：多项式恒等定理与待定系数法<\/strong><br>阅读：<a href=\"#/book/zhengshi/chapter/ch04\">第 4 章：多项式恒等定理与待定系数法<\/a><br>检查点：能设系数解出使两式恒等的参数<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：整式的概念与加减法<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> −3x²y 的系数与次数分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> −3，2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> −3，3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 3，3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 3，2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 化简 a−(2a−b)+b 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> −a+2b<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> −a<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 3a<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> −a−2b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：整式的乘法与乘法公式<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 展开 (2x−3)(2x+3) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 4x²−9<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 4x²+9<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 4x²−12x+9<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 4x²−6x−9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 计算 102×98 最简便的算法是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 102×100−102×2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> (100+2)(100−2)=100²−4<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 100×98+2×98<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 直接竖式相乘<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：整式的除法<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 12x⁴y²÷3x²y 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 4x²y<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 4x⁶y³<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 4x²y²<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 4x²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> (x²−1)÷(x−1) 的商与余式分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> x+1，0<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> x−1，0<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> x+1，2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> x，1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 4 章：多项式恒等定理与待定系数法<\/h2><div class='quiz-item' data-qid='ch04-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 若 x²+ax+b≡(x−1)(x+4)，则 a、b 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> a=3，b=−4<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> a=5，b=4<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> a=−3，b=−4<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> a=3，b=4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 两个三次多项式在几个不同点上取值相同，就一定能判定它们恒等？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> 2 个<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> 3 个<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> 4 个<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> 1 个<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q9.<\/b> 下列各组中，是同类项的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 3x²y 与 3xy²<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> −2ab 与 5ba<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> x² 与 x³<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 2a 与 2b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q10.<\/b> (x³+1)÷(x+1) 的商是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> x²−x+1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> x²+x+1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> x²−1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> x²+1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q11.<\/b> 若 2x²+ax−3≡2(x−1)(x+2)+b，则 a、b 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> a=2，b=1<\/label><label class='quiz-opt'><in ='2'> x+1，2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> x，1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：多项式恒等定理与待定系数法<\/h1><div class='quiz-item' data-qid='ch04-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 若 x²+ax+b≡(x−1)(x+4)，则 a、b 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> a=3，b=−4<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> a=5，b=4<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> a=−3，b=−4<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> a=3，b=4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 两个三次多项式在几个不同点上取值相同，就一定能判定它们恒等？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> 2 个<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> 3 个<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> 4 个<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> 1 个<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='单项式'>单项式 — 数与字母的乘积，单独一个数或字母也算。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='系数'>系数 — 单项式中的数字因数。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='次数'>次数 — 单项式各字母指数之和；多项式取最高次项的次数。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='同类项'>同类项 — 字母相同且相同字母指数也相同的项。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='分配律'>分配律 — a(b+c)=ab+ac，整式变形的基本依据。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='乘法公式'>乘法公式 — 平方差、完全平方、立方和差三组展开结果。 <span class=glossary-ref>（第 2 章：整式的乘法与乘法公式）<\/span><\/li><li data-term='长除法'>长除法 — 逐次消去最高次项的多项式除法。 <span class=glossary-ref>（第 3 章：整式的除法）<\/span><\/li><li data-term='带余除式'>带余除式 — A=BQ+R，余式次数低于除式。 <span class=glossary-ref>（第 3 章：整式的除法）<\/span><\/li><li data-term='恒等'>恒等 — 对字母的一切取值两边都相等。 <span class=glossary-ref>（第 4 章：多项式恒等定理与待定系数法）<\/span><\/li><li data-term='待定系数法'>待定系数法 — 设出含未知系数的形式，再比较系数求解。 <span class=glossary-ref>（第 4 章：多项式恒等定理与待定系数法）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：整式变形的三步<\/h2>\n<p>① 看结构（单项式／多项式、次数、项数）；② 选工具（合并同类项、分配律、公式、长除法）；③ 回代检验（取特殊值核对）。<\/p>\n<h2>框架：公式的三种用法<\/h2>\n<p>正用（展开）、逆用（分解）、数值化（把数字凑成公式结构做速算）。逆用是最容易被忽略的一种。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>单项式乘单项式<\/td><td>系数相乘，同底数幂指数相加<\/td><\/tr><tr><td>单项式除以单项式<\/td><td>系数相除，同底数幂指数相减<\/td><\/tr><tr><td>平方差<\/td><td>(a+b)(a−b)=a²−b²<\/td><\/tr><tr><td>完全平方<\/td><td>(a±b)²=a²±2ab+b²<\/td><\/tr><tr><td>立方和差<\/td><td>(a±b)(a²∓ab+b²)=a³±b³<\/td><\/tr><tr><td>带余除式<\/td><td>A=BQ+R，deg R&lt;deg B<\/td><\/tr><tr><td>恒等判据<\/td><td>次数≤n 的两式在 n+1 个不
