, "type": "single", "question": "y=x²−6x+5 的顶点坐标是：", "options": ["(3,−4)", "(−3,−4)", "(3,4)", "(3,−5)"], "answer": 0, "explain": "配方 y=(x−3)²−4，顶点 (3,−4)。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "y=−x²+2x+3 的最大值是：", "options": ["3", "4", "−4", "2"], "answer": 1, "explain": "y=−(x−1)²+4，开口向下，x=1 时取最大值 4。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "y=2x²−8x+3 的对称轴是：", "options": ["x=2", "x=−2", "x=4", "x=1"], "answer": 0, "explain": "对称轴 x=−b/2a=8/4=2。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "一次函数 y=−3x+9 中，y 随 x 增大而：", "options": ["增大", "减小", "不变", "先增后减"], "answer": 1, "explain": "k=−3<0，函数单调递减。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：函数与图象」的一句话核心是什么？", "back": "函数不是公式，是一条规则：给定输入，唯一确定输出。", "tags": ["linear-quadratic-functions", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：一次函数」的一句话核心是什么？", "back": "一次函数 y=kx+b 的变化率恒为 k：k 正则升，k 负则降，b 是它与 y 轴的交点。", "tags": ["linear-quadratic-functions", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：二次函数与变化率」的一句话核心是什么？", "back": "二次函数的一切都藏在顶点式 y=a(x−h)²+k 里：a 定开口，顶点 (h,k) 定最值。", "tags": ["linear-quadratic-functions", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「函数」？", "back": "一个输入对应唯一输出的规则。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「定义域」？", "back": "允许输入的所有取值组成的集合。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「值域」？", "back": "所有实际输出组成的集合。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「增函数」？", "back": "x 增大时 y 也增大的函数。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「斜率」？", "back": "一次函数 y=kx+b 中的 k，反映倾斜与增减。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「截距」？", "back": "图象与 y 轴交点的纵坐标 b。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「顶点式」？", "back": "y=a(x−h)²+k 的形式，直接读出顶点。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「对称轴」？", "back": "抛物线关于它左右对称的竖直线 x=−b/2a。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「平均变化率」？", "back": "区间两端函数值之差与自变量之差的比。", "tags": ["linear-quadratic-functions", "术语"]}], "companion": "linear-quadratic-functions学习伴侣.html", "deriv": "linear-quadratic-functions从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：函数与图象<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：坐标平面、方程\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出函数三要素\n<\/li><li>\n用解析式、表格、图象表示同一个函数\n<\/li><li>\n从图象读出增减与最值\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>函数不是公式，是一条规则：给定输入，唯一确定输出。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 对应关系<\/h3>\n<p>设 x 在某个范围内每取一个值，按规则 f 都有唯一确定的 y 与之对应，就说 y 是 x 的函数，记 y=f(x)。x 的取值范围叫<strong>定义域<\/strong>，所有输出组成的集合叫<strong>值域<\/strong>。<\/p>\n<p>关键是“唯一”：一个输入不能对应两个输出。圆的方程 x²+y²=1 中，x=0 对应 y=±1，所以 y 不是 x 的函数。<\/p>\n<h3>1.2 三种表示<\/h3>\n<ul><li>\n解析式：y=2x+1；\n<\/li><li>\n表格：把若干组对应值列出来；\n<\/li><li>\n图象：把满足关系的点画在坐标平面上。\n<\/ul>\n<p>三种表示可以互相转换，考试里常要求“由式画图、由图读式”。<\/p>\n<h3>1.3 从图象读信息<\/h3>\n<p>图象上升表示随 x 增大 y 增大（增函数），下降表示减函数；最高点、最低点对应最大值、最小值；与 x 轴的交点是零点（f(x)=0 的解）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：函数像自动售货机：投一个编号，只出一个确定的商品。<\/p>\n<p><strong>失效边界<\/strong>：若一台机器投同一个编号会随机出不同商品，那就不是函数。<\/p>\n<p><strong>实例<\/strong>：f(x)=x²，定义域取 [−2,2]。输入 −2 得 4，输入 0 得 0，输入 2 得 4。值域是 [0,4]，不是 [−2,2]。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 函数必须有解析式 —— 实际上 表格、图象、甚至一句描述规则都可以定义函数，解析式只是最方便的一种。\n<\/li><li>\n别以为 值域就是把定义域代进去得到的那些数 —— 实际上 要把定义域内所有输入都考虑，取遍后得到的输出集合才是值域。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列关系中，y 是 x 的函数的是：\n<\/li><li>\nf(x)=x² 在 [−1,2] 上的值域是：\n<p>A. x²+y²=1 ｜ B. y²=x ｜ C. y=2x+1 ｜ D. |y|=x <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：其余三个都出现一个 x 对应两个 y 的情况，不满足唯一性。 A. [1,4] ｜ B. [0,4] ｜ C. [0,1] ｜ D. [−1,4] <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：x=0 时取到最小值 0，x=2 时取到最大值 4，故值域 [0,4]。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n函数＝唯一对应的规则；三要素是定义域、法则、值域\n<\/li><li>\n解析式、表格、图象可以互相转换\n<\/li><li>\n图象上升/下降对应增减，交点对应零点\n<\/ul>", "ch02": "<h1>第 2 章：一次函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n由 k、b 判断图象位置与增减\n<\/li><li>\n求一次函数的零点与解析式\n<\/li><li>\n用一次函数建模\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>一次函数 y=kx+b 的变化率恒为 k：k 正则升，k 负则降，b 是它与 y 轴的交点。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 k 与 b 的作用<\/h3>\n<p>k 叫斜率，决定直线的倾斜程度与方向：k&gt;0 时 y 随 x 增大而增大；k&lt;0 时减小；k=0 时退化为水平直线 y=b。<\/p>\n<p>b 是截距：图象过点 (0,b)。<\/p>\n<h3>2.2 由两点求解析式<\/h3>\n<p>设 y=kx+b，把两点坐标代入，解出 k、b。也可先用 k=(y₂−y₁)/(x₂−x₁) 求斜率，再代一点求 b。<\/p>\n<h3>2.3 零点与不等式<\/h3>\n<p>零点即 kx+b=0 的解 x=−b/k（k≠0）。由零点和 k 的符号可以直接读出 kx+b&gt;0 的解集，不必每次重算。<\/p>\n<h3>2.4 一次函数模型<\/h3>\n<p>凡“每增加一个单位，总量增加固定值”的关系都是一次的：匀速路程 s=vt、计价 y=kx+b、摄氏与华氏换算。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：一次函数像匀速行走，每小时走的距离一样，图象是笔直的路线。<\/p>\n<p><strong>失效边界<\/strong>：实际问题的定义域常受限制（人数、时间不能为负），直线要截成一段。<\/p>\n<p><strong>实例<\/strong>：y=−2x+6。k=−2&lt;0，随 x 增大而减小；过 (0,6)；零点 x=3；所以 y&gt;0 当 x&lt;3。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 b 是直线与 x 轴的交点 —— 实际上 b 是与 y 轴交点的纵坐标；与 x 轴的交点是 −b/k。\n<\/li><li>\n别以为 k 越大直线越陡 —— 实际上 陡峭程度看 |k|；k=−5 比 k=1 更陡，但方向相反。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n一次函数 y=3x−6 的零点是：\n<\/li><li>\n若一次函数 y=kx+b 的图象经过第一、二、四象限，则：\n<p>A. x=−2 ｜ B. x=2 ｜ C. x=6 ｜ D. x=3 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：3x−6=0 得 x=2。 A. k&gt;0，b&gt;0 ｜ B. k&lt;0，b&gt;0 ｜ C. k&lt;0，b&lt;0 ｜ D. k&gt;0，b&lt;0 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：直线下降说明 k&lt;0；与 y 轴交于正半轴说明 b&gt;0。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ny=kx+b：k 定方向与增减，b 定 y 轴截距\n<\/li><li>\n零点 x=−b/k\n<\/li><li>\n两点定一条直线\n<\/ul>", "ch03": "<h1>第 3 章：二次函数与变化率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、配方\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把二次函数化成顶点式并读出顶点、对称轴\n<\/li><li>\n求给定区间上的最值\n<\/li><li>\n区分平均变化率与瞬时变化率\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>二次函数的一切都藏在顶点式 y=a(x−h)²+k 里：a 定开口，顶点 (h,k) 定最值。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 配方成顶点式<\/h3>\n<p>y=ax²+bx+c=a(x+b/2a)²+(4ac−b²)/4a。顶点 (−b/2a, (4ac−b²)/4a)，对称轴 x=−b/2a。<\/p>\n<h3>3.2 开口与最值<\/h3>\n<p>a&gt;0 开口向上，顶点是最小值点；a&lt;0 开口向下，顶点是最大值点。顶点值就是全局最值。<\/p>\n<p>但若定义域被限制在某个区间，要看顶点是否落在区间内：不在，最值在端点取到。<\/p>\n<h3>3.3 零点<\/h3>\n<p>ax²+bx+c=0 的根就是图象与 x 轴的交点，判别式 Δ 决定交点个数。因式分解 a(x−x₁)(x−x₂) 与图象一一对应。<\/p>\n<h3>3.4 变化率<\/h3>\n<p><strong>平均变化率<\/strong>：区间 [x₁,x₂] 上 (f(x₂)−f(x₁))/(x₂−x₁)，几何上是割线斜率。一次函数的平均变化率恒等于 k；二次函数的平均变化率随区间变化。<\/p>\n<p><strong>瞬时变化率<\/strong>：区间缩到一点时的极限值，几何上是切线斜率——这是后面微积分的入口。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：抛物线像喷泉的水柱，顶点是最高点；开口方向就是水柱朝上还是朝下。<\/p>\n<p><strong>失效边界<\/strong>：顶点最值只在定义域包含顶点时成立；区间外的情形要比较端点。<\/p>\n<p><strong>实例<\/strong>：y=x²−4x+1=(x−2)²−3。顶点 (2,−3)，对称轴 x=2，最小值 −3。 若限制 x∈[3,5]，顶点不在区间内，函数在区间上递增，最小值 f(3)=−2，最大值 f(5)=6。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 最小值一定是顶点值 —— 实际上 只有顶点落在定义域内才是；闭区间上要在顶点与端点之间比较。\n<\/li><li>\n别以为 二次函数的变化率也是常数 —— 实际上 只有一次函数的变化率恒定；二次函数的平均变化率随区间改变。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny=x²−6x+5 的顶点坐标是：\n<\/li><li>\ny=−x²+2x+3 的最大值是：\n<p>A. (3,−4) ｜ B. (−3,−4) ｜ C. (3,4) ｜ D. (3,−5) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：配方 y=(x−3)²−4，顶点 (3,−4)。 A. 3 ｜ B. 4 ｜ C. −4 ｜ D. 2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：y=−(x−1)²+4，开口向下，x=1 时取最大值 4。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n顶点式 y=a(x−h)²+k：a 定开口，顶点定最值\n<\/li><li>\n闭区间最值要比较顶点与端点\n<\/li><li>\n平均变化率＝割线斜率，瞬时变化率＝切线斜率\n<\/ul>", "c01": "<h1>函数三要素<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>定义域、对应法则、值域，三者确定一个函数；前两个定了，第三个就定了。<\/p>\n<h2>为什么重要<\/h2>\n<p>判断两个函数是否相同、求值域、画图象，都要先回到三要素。<\/p>\n<h2>详解<\/h2>\n<p>定义域是允许输入的集合；对应法则是输入到输出的规则；值域是实际输出的集合。定义域与法则相同才算同一个函数，解析式长得不一样也可能相等（如 y=x 与 y=x²/x，x≠0）。<\/p>\n<h2>常见误解<\/h2>\n<p>以为解析式相同就是同一个函数，忽略定义域可能被约分改变。<\/p>\n<h2>相关概念<\/h2>\n<p>函数与图象（ch01）、定义域（《分式与根式》）<\/p>", "c02": "<h1>变化率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>平均变化率是两个点之间的“平均速度”，瞬时变化率是某一点的“瞬间速度”。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是微积分的入口：导数就是瞬时变化率。<\/p>\n<h2>详解<\/h2>\n<p>一次函数的平均变化率恒为 k，所以“匀速”；二次函数的平均变化率随区间改变，所以“变速”。把区间不断缩小，平均变化率趋于一个确定值，就是瞬时变化率。<\/p>\n<h2>常见误解<\/h2>\n<p>把平均变化率当成某一点的变化快慢；它描述的是一整段区间。<\/p>\n<h2>相关概念<\/h2>\n<p>一次函数（ch02）、导数（《微积分初步》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：函数与图象<\/strong><br>阅读：<a href=\"#/book/linear-quadratic-functions/chapter/ch01\">第 1 章：函数与图象<\/a><br>检查点：能由一个对应关系写出定义域并画出草图<\/li><li class='path-step' id='path-02'><strong>步骤 02：一次函数<\/strong><br>阅读：<a href=\"#/book/linear-quadratic-functions/chapter/ch02\">第 2 章：一次函数<\/a><br>检查点：能由 k、b 判断增减与截距<\/li><li class='path-step' id='path-03'><strong>步骤 03：二次函数与变化率<\/strong><br>阅读：<a href=\"#/book/linear-quadratic-functions/chapter/ch03\">第 3 章：二次函数与变化率<\/a><br>检查点：能求顶点、最值、零点并解释变化率<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：函数与图象<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列关系中，y 是 x 的函数的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> x²+y²=1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> y²=x<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> y=2x+1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> |y|=x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> f(x)=x² 在 [−1,2] 上的值域是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> [1,4]<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> [0,4]<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> [0,1]<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> [−1,4]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：一次函数<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 一次函数 y=3x−6 的零点是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> x=−2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> x=2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> x=6<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> x=3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 若一次函数 y=kx+b 的图象经过第一、二、四象限，则：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> k&gt;0，b&gt;0<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> k&lt;0，b&gt;0<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> k&lt;0，b&lt;0<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> k&gt;0，b&lt;0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：二次函数与变化率<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y=x²−6x+5 的顶点坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> (3,−4)<\/label><label class='quiz-opt'><i z-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='函数'>函数 — 一个输入对应唯一输出的规则。 <span class=glossary-ref>（第 1 章：函数与图象）<\/span><\/li><li data-term='定义域'>定义域 — 允许输入的所有取值组成的集合。 <span class=glossary-ref>（第 1 章：函数与图象）<\/span><\/li><li data-term='值域'>值域 — 所有实际输出组成的集合。 <span class=glossary-ref>（第 1 章：函数与图象）<\/span><\/li><li data-term='增函数'>增函数 — x 增大时 y 也增大的函数。 <span class=glossary-ref>（第 1 章：函数与图象）<\/span><\/li><li data-term='斜率'>斜率 — 一次函数 y=kx+b 中的 k，反映倾斜与增减。 <span class=glossary-ref>（第 2 章：一次函数）<\/span><\/li><li data-term='截距'>截距 — 图象与 y 轴交点的纵坐标 b。 <span class=glossary-ref>（第 2 章：一次函数）<\/span><\/li><li data-term='顶点式'>顶点式 — y=a(x−h)²+k 的形式，直接读出顶点。 <span class=glossary-ref>（第 3 章：二次函数与变化率）<\/span><\/li><li data-term='对称轴'>对称轴 — 抛物线关于它左右对称的竖直线 x=−b/2a。 <span class=glossary-ref>（第 3 章：二次函数与变化率）<\/span><\/li><li data-term='平均变化率'>平均变化率 — 区间两端函数值之差与自变量之差的比。 <span class=glossary-ref>（第 3 章：二次函数与变化率）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：二次函数四问<\/h2>\n<p>① 开口向哪（看 a）；② 顶点在哪（配方）；③ 零点几个（看 Δ）；④ 区间最值（比较顶点与端点）。<\/p>\n<h2>框架：建模三步<\/h2>\n<p>找变量 → 写关系式 → 标注定义域。第三步常被漏掉，但实际问题里它决定答案是否合理。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>一次函数<\/td><td>y=kx+b；k&gt;0 增，k&lt;0 减；零点 −b/k<\/td><\/tr><tr><td>斜率公式<\/td><td>k=(y₂−y₁)/(x₂−x₁)<\/td><\/tr><tr><td>顶点<\/td><td>(−b/2a，(4ac−b²)/4a)<\/td><\/tr><tr><td>最值<\/td><td>a&gt;0 顶点最小，a&lt;0 顶点最大<\/td><\/tr><tr><td>平均变化率<\/td><td>(f(x₂)−f(x₁))/(x₂−x₁)<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：函数与图象", "href": "#/chapter/ch01"}, {"label": "第 2 章：一次函数", "href": "#/chapter/ch02"}, {"label": "第 3 章：二次函数与变化率", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "函数三要素", "href": "#/concept/c01"}, {"label": "变化率", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：函数与图象", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：一次函数", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：二次函数与变化率", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"exponents-logarithms":{"manifest": {"slug": "exponents-logarithms", "title": "指数与对数", "subtitle": "同一件事的两种说法：指数增长与对数刻度", "book": {"title": "指数与对数", "author": "沈超", "source": ["数学基础知识丛书-07-指数与对数 沈超.pdf"]}, "audience": "零基础", "goal": "把指数从整数推广到实数，掌握指数函数、对数与对数函数的性质与图象，会解指数方程与对数方程。", "learningPath": [{"step": "01", "title": "指数的推广与指数函数", "chapterIds": ["ch01"], "checkpoint": "能说明 a⁰=1 为什么成立"}, {"step": "02", "title": "对数与对数运算", "chapterIds": ["ch02"], "checkpoint": "能把指数式与对数式互化并用法则化简"}, {"step": "03", "title": "对数函数、幂函数与指对方程", "chapterIds": ["ch03"], "checkpoint": "能解指数方程并验根"}], "chapters": [{"id": "ch01", "title": "第 1 章：指数的推广与指数函数", "file": "chapters/ch01-exponent.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：对数与对数运算", "file": "chapters/ch02-logarithm.md", "difficulty": 3}, {"id": "ch03", "title": "第 3 章：对数函数、幂函数与指对方程", "file": "chapters/ch03-log-function-equations.md", "difficulty": 3}], "concepts" er": 0, "explain": "x−3=2²=4，得 x=7；真数 4>0，成立。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "计算 lg2+lg5 的值：", "options": ["1", "lg7", "10", "0"], "answer": 0, "explain": "lg2+lg5=lg10=1。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "若 3ˣ=7，则 x 等于：", "options": ["log₇3", "log₃7", "7/3", "3/7"], "answer": 1, "explain": "由定义 3ˣ=7 即 x=log₃7。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：指数的推广与指数函数」的一句话核心是什么？", "back": "指数每推广一步，都要求原来的运算法则继续成立；指数函数的值域恒为正。", "tags": ["exponents-logarithms", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：对数与对数运算」的一句话核心是什么？", "back": "对数就是“问指数”：log_a N 是“a 的几次方等于 N”。", "tags": ["exponents-logarithms", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：对数函数、幂函数与指对方程」的一句话核心是什么？", "back": "对数函数与指数函数关于 y=x 对称；解指对方程靠“化同底”或“取对数”。", "tags": ["exponents-logarithms", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「指数函数」？", "back": "y=aˣ（a>0，a≠1），值域 (0,+∞)。", "tags": ["exponents-logarithms", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「零指数」？", "back": "a⁰=1（a≠0）。", "tags": ["exponents-logarithms", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「分数指数」？", "back": "a^(m/n)=ⁿ√(aᵐ)，把根式写成指数。", "tags": ["exponents-logarithms", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「对数」？", "back": "log_a N=b 表示 aᵇ=N。", "tags": ["exponents-logarithms", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「真数」？", "back": "对数记号中的 N，必须大于 0。", "tags": ["exponents-logarithms", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「换底公式」？", "back": "log_a N=log_b N/log_b a。", "tags": ["exponents-logarithms", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「对数函数」？", "back": "y=log_a x，与指数函数互为反函数。", "tags": ["exponents-logarithms", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「幂函数」？", "back": "y=x^α，底是变量、指数是常数。", "tags": ["exponents-logarithms", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「增根」？", "back": "解对数方程时使真数非正的解。", "tags": ["exponents-logarithms", "术语"]}], "companion": "exponents-logarithms学习伴侣.html", "deriv": "exponents-logarithms从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：指数的推广与指数函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：乘方、根式\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说明零指数、负指数的来源\n<\/li><li>\n把分数指数与根式互化\n<\/li><li>\n画出指数函数图象并说出单调性\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>指数每推广一步，都要求原来的运算法则继续成立；指数函数的值域恒为正。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 从正整数到整数<\/h3>\n<p>aⁿ 原本表示 n 个 a 相乘。要让 aᵐ·aⁿ=a^(m+n) 在 m&lt;n 时也成立，就必须定义 a⁰ 与负指数：<\/p>\n<ul><li>\na⁰=1（a≠0），因为 aⁿ/aⁿ=1=a^(n−n)；\n<\/li><li>\na⁻ⁿ=1/aⁿ，因为 a⁻ⁿ·aⁿ=a⁰=1。\n<\/ul>\n<h3>1.2 分数指数<\/h3>\n<p>要让 (aᵐ)^(1/n)=a^(m/n) 成立，就得把 a^(m/n) 定义为 ⁿ√(aᵐ)。例如 8^(2/3)=³√64=4。<\/p>\n<p>底数为负时分数指数会出问题（如 (−8)^(1/2) 不是实数），所以指数函数的底数规定 a&gt;0 且 a≠1。<\/p>\n<h3>1.3 实数指数与指数函数<\/h3>\n<p>无理指数用有理指数逼近定义。函数 y=aˣ（a&gt;0，a≠1）叫<strong>指数函数<\/strong>：<\/p>\n<ul><li>\n定义域是全体实数，值域是 (0,+∞)，图象恒在 x 轴上方；\n<\/li><li>\na&gt;1 时单调递增，0&lt;a&lt;1 时单调递减；\n<\/li><li>\n图象都过点 (0,1)。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：指数增长像细胞分裂，每一代翻一倍；底数就是“每代翻几倍”。<\/p>\n<p><strong>失效边界<\/strong>：翻倍模型不考虑资源限制，真实种群会在后期放缓，不是纯指数。<\/p>\n<p><strong>实例<\/strong>：2^(−3)=1/8；16^(3/4)=(⁴√16)³=2³=8；比较 2^0.3 与 2^0.4，底数 2&gt;1 单调增，故前者小。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 a⁰=0 —— 实际上 任何非零数的零次幂都是 1，来自 aⁿ/aⁿ=1。\n<\/li><li>\n别以为 指数函数的值域是全体实数 —— 实际上 aˣ 恒为正，值域是 (0,+∞)，永远取不到 0 和负数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n计算 27^(2/3) 的值：\n<\/li><li>\n函数 y=(1/2)ˣ 的单调性是：\n<p>A. 9 ｜ B. 18 ｜ C. 3 ｜ D. 6 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：27^(2/3)=(³√27)²=3²=9。 A. 在 R 上递增 ｜ B. 在 R 上递减 ｜ C. 先增后减 ｜ D. 不单调 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：底数 0&lt;1/2&lt;1，指数函数单调递减。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na⁰=1（a≠0）；a⁻ⁿ=1/aⁿ；a^(m/n)=ⁿ√(aᵐ)\n<\/li><li>\n指数函数值域 (0,+∞)，过 (0,1)\n<\/li><li>\na&gt;1 增，0&lt;a&lt;1 减\n<\/ul>", "ch02": "<h1>第 2 章：对数与对数运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把指数式与对数式互化\n<\/li><li>\n用三条法则化简对数式\n<\/li><li>\n用换底公式计算不同底的对数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>对数就是“问指数”：log_a N 是“a 的几次方等于 N”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 定义<\/h3>\n<p>若 aᵇ=N（a&gt;0，a≠1，N&gt;0），则 b=log_a N。这是指数式的等价改写，不是新运算。<\/p>\n<p>由此立得：a^(log_a N)=N，log_a aᵇ=b，log_a 1=0，log_a a=1。<\/p>\n<h3>2.2 三条法则<\/h3>\n<ul><li>\nlog_a(MN)=log_a M+log_a N（乘变加）；\n<\/li><li>\nlog_a(M/N)=log_a M−log_a N（除变减）；\n<\/li><li>\nlog_a Mⁿ=n log_a M（幂变乘）。\n<\/ul>\n<p>法则只对乘、除、幂成立。log_a(M+N) 没有化简公式——这是最常见的错误。<\/p>\n<h3>2.3 换底公式<\/h3>\n<p>log_a N=log_b N / log_b a。常用底是 10（常用对数 lg）与 e（自然对数 ln）。换底把不同底的对数统一，便于计算与比较。<\/p>\n<h3>2.4 定义域<\/h3>\n<p>对数的真数必须为正：log_a N 要求 N&gt;0。解对数方程时，所有解都要满足这一条。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：对数像问“要叠多少层才够高”，指数是“叠 n 层有多高”。<\/p>\n<p><strong>失效边界<\/strong>：真数为负或为零时对数没有定义，不能靠公式硬算。<\/p>\n<p><strong>实例<\/strong>：log₂8=3，因为 2³=8；log₁₀1000=3；log₃(1/9)=−2，因为 3⁻²=1/9。 化简 lg2+lg5=lg10=1。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 log(M+N)=logM+logN —— 实际上 法则只管乘法。取 M=N=1：左边 lg2≈0.301，右边 0+0=0，明显不等。\n<\/li><li>\n别以为 真数可以为负 —— 实际上 负数的对数在实数范围内没有定义，方程解出负真数必须舍去。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nlog₄16 的值是：\n<\/li><li>\n化简 log₂6−log₂3：\n<p>A. 2 ｜ B. 4 ｜ C. 8 ｜ D. 1/2 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：4²=16，故 log₄16=2。 A. log₂3 ｜ B. 1 ｜ C. 2 ｜ D. log₂9 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：log₂6−log₂3=log₂(6/3)=log₂2=1。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nlog_a N=b ⇔ aᵇ=N\n<\/li><li>\n乘变加、除变减、幂变乘；加法不能合并\n<\/li><li>\n换底：log_a N=log_b N/log_b a\n<\/ul>", "ch03": "<h1>第 3 章：对数函数、幂函数与指对方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出对数函数与指数函数的对称关系\n<\/li><li>\n区分幂函数与指数函数\n<\/li><li>\n解指数方程与对数方程并验根\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>对数函数与指数函数关于 y=x 对称；解指对方程靠“化同底”或“取对数”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 对数函数<\/h3>\n<p>y=log_a x（a&gt;0，a≠1）的定义域是 (0,+∞)，值域是全体实数，图象过 (1,0)。<\/p>\n<p>a&gt;1 时递增，0&lt;a&lt;1 时递减。它与 y=aˣ 互为反函数，图象关于直线 y=x 对称。<\/p>\n<h3>3.2 幂函数<\/h3>\n<p>y=x^α（α 为常数）叫幂函数。它与指数函数的区别在于：幂函数的底是变量、指数是常数；指数函数反过来。<\/p>\n<p>常见幂函数 x、x²、x³、x^(1/2)、x⁻¹ 的图象形状随 α 变化，但都过 (1,1)。<\/p>\n<h3>3.3 指数方程<\/h3>\n<ul><li>\n同底法：a^(f(x))=a^(g(x)) ⇒ f(x)=g(x)（a≠1）；\n<\/li><li>\n换元法：把 aˣ 设为 t，化成二次方程，注意 t&gt;0；\n<\/li><li>\n取对数：a^(f(x))=b^(g(x)) 两边取对数。\n<\/ul>\n<h3>3.4 对数方程<\/h3>\n<p>先用法则合并成 log_a F(x)=log_a G(x)，再化为 F(x)=G(x)，最后必须检验 F(x)&gt;0 且 G(x)&gt;0。<\/p>\n<p>增根几乎都来自“真数为负”这一步，验根不能省。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：指数与对数像两张对照表：一张给“层数→高度”，一张给“高度→层数”。<\/p>\n<p><strong>失效边界<\/strong>：两函数只在 a&gt;0、a≠1 时互为反函数；a=1 时退化为常数，没有反函数。<\/p>\n<p><strong>实例<\/strong>：解 2^(x+1)=8。8=2³，故 x+1=3，x=2。 解 log₂(x−1)=3。化为 x−1=2³=8，得 x=9；检验真数 8&gt;0，成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 幂函数与指数函数是同一类 —— 实际上 幂函数底是变量，指数函数指数是变量；两者增长方式完全不同。\n<\/li><li>\n别以为 对数方程解出即可 —— 实际上 必须检验真数为正，否则会把增根写进答案。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n函数 y=log₂x 与 y=2ˣ 的图象关于哪条直线对称：\n<\/li><li>\n方程 log₂(x−3)=2 的解是：\n<p>A. y 轴 ｜ B. x 轴 ｜ C. y=x ｜ D. y=−x <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：互为反函数的图象关于直线 y=x 对称。 A. x=7 ｜ B. x=1 ｜ C. x=4 ｜ D. x=5 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：x−3=2²=4，得 x=7；真数 4&gt;0，成立。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ny=log_a x 与 y=aˣ 关于 y=x 对称\n<\/li><li>\n幂函数底变、指数函数指数变\n<\/li><li>\n对数方程必须检验真数为正\n<\/ul>", "c01": "<h1>互为逆运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>指数问“乘几次”，对数问“几次才够”，两句话说的是同一件事。<\/p>\n<h2>为什么重要<\/h2>\n<p>抓住互逆关系，指对互化、图象对称、方程解法都能自然推出，不必死记。<\/p>\n<h2>详解<\/h2>\n<p>aᵇ=N 与 b=log_a N 是同一关系的两种写法。由此得 a^(log_a N)=N 与 log_a aᵇ=b。图象上，把点 (x,y) 换成 (y,x)，指数曲线就变成对数曲线。<\/p>\n<h2>常见误解<\/h2>\n<p>把对数当成一种全新的运算去背法则，割裂了两者的联系。<\/p>\n<h2>相关概念<\/h2>\n<p>指数函数（ch01）、对数函数（ch03）<\/p>", "c02": "<h1>底数与单调性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>底数大于 1 就增，介于 0 与 1 之间就减；同一类函数，两条相反的走势。<\/p>\n<h2>为什么重要<\/h2>\n<p>比较大小时不必算值，看底数就能定方向。<\/p>\n<h2>详解<\/h2>\n<p>aˣ 与 log_a x 的单调性都由 a 决定：a&gt;1 递增，0&lt;a&lt;1 递减。因此比较大小时，先统一底数，再看指数（或真数）大小；底不同则用换底或取中间值 1 比较。<\/p>\n<h2>常见误解<\/h2>\n<p>不同底直接比指数大小，忽略底数方向可能相反。<\/p>\n<h2>相关概念<\/h2>\n<p>指数函数（ch01）、换底公式（ch02）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：指数的推广与指数函数<\/strong><br>阅读：<a href=\"#/book/exponents-logarithms/chapter/ch01\">第 1 章：指数的推广与指数函数<\/a><br>检查点：能说明 a⁰=1 为什么成立<\/li><li class='path-step' id='path-02'><strong>步骤 02：对数与对数运算<\/strong><br>阅读：<a href=\"#/book/exponents-logarithms/chapter/ch02\">第 2 章：对数与对数运算<\/a><br>检查点：能把指数式与对数式互化并用法则化简<\/li><li class='path-step' id='path-03'><strong>步骤 03：对数函数、幂函数与指对方程<\/strong><br>阅读：<a href=\"#/book/exponents-logarithms/chapter/ch03\">第 3 章：对数函数、幂函数与指对方程<\/a><br>检查点：能解指数方程并验根<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：指数的推广与指数函数<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 计算 27^(2/3) 的值：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 9<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 18<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 函数 y=(1/2)ˣ 的单调性是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 在 R 上递增<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 在 R 上递减<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 先增后减<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 不单调<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：对数与对数运算<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> log₄16 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 8<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 1/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 化简 log₂6−log₂3：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> log₂3<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> log₂9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：对数函数、幂函数与指对方程<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 函数 y=log₂x 与 y=2ˣ 的图象关于哪条直线对称：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> y 轴<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> x 轴<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> y=x<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> y=−x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 方程 log₂(x−3)=2 的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> x=7<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> x=1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> x=4<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> x=5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 计算 lg2+lg5 的值：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> lg7<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 10<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 若 3ˣ=7，则 x 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> log₇3<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> log₃7<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 7/3<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 3/7<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：指数的推广与指数函数<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 计算 27^(2/3) 的值：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 9<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 18<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 函数 y=(1/2)ˣ 的单调性是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 在 R 上递增<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 在 R 上递减<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 先增后减<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 不单调<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：对数与对数运算<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> log₄16 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 8<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 1/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 化简 log₂6−log₂3：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> log₂3<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> log₂9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：对数函数、幂函数与指对方程<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 函数 y=log₂x 与 y=2ˣ 的图象关于哪条直线对称：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> y 轴<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> x 轴<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> y=x<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> y=−x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 方程 log₂(x−3)=2 的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> x=7<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> x=1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> x=4<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> x=5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='指数函数'>指数函数 — y=aˣ（a&gt;0，a≠1），值域 (0,+∞)。 <span class=glossary-ref>（第 1 章：指数的推广与指数函数）<\/span><\/li><li data-term='零指数'>零指数 — a⁰=1（a≠0）。 <span class=glossary-ref>（第 1 章：指数的推广与指数函数）<\/span><\/li><li data-term='分数指数'>分数指数 — a^(m/n)=ⁿ√(aᵐ)，把根式写成指数。 <span class=glossary-ref>（第 1 章：指数的推广与指数函数）<\/span><\/li><li data-term='对数'>对数 — log_a N=b 表示 aᵇ=N。 <span class=glossary-ref>（第 2 章：对数与对数运算）<\/span><\/li><li data-term='真数'>真数 — 对数记号中的 N，必须大于 0。 <span class=glossary-ref>（第 2 章：对数与对数运算）<\/span><\/li><li data-term='换底公式'>换底公式 — log_a N=log_b N/log_b a。 <span class=glossary-ref>（第 2 章：对数与对数运算）<\/span><\/li><li data-term='对数函数'>对数函数 — y=log_a x，与指数函数互为反函数。 <span class=glossary-ref>（第 3 章：对数函数、幂函数与指对方程）<\/span><\/li><li data-term='幂函数'>幂函数 — y=x^α，底是变量、指数是常数。 <span class=glossary-ref>（第 3 章：对数函数、幂函数与指对方程）<\/span><\/li><li data-term='增根'>增根 — 解对数方程时使真数非正的解。 <span class=glossary-ref>（第 3 章：对数函数、幂函数与指对方程）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：指对互化三步<\/h2>\n<p>① 看结构：是指数式还是对数式；② 换成另一种写法；③ 用对应法则（指数律或对数律）化简。<\/p>\n<h2>框架：比较大小三招<\/h2>\n<p>同底看单调；同指数看底；都不同则取中间值 0 或 1 或换底。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>指数律<\/td><td>aᵐaⁿ=a^(m+n)；(aᵐ)ⁿ=a^(mn)；(ab)ⁿ=aⁿbⁿ<\/td><\/tr><tr><td>对数定义<\/td><td>aᵇ=N ⇔ log_a N=b（N&gt;0）<\/td><\/tr><tr><td>对数法则<\/td><td>log(MN)=logM+logN；log(M/N)=logM−logN；log Mⁿ=n logM<\/td><\/tr><tr><td>换底<\/td><td>log_a N=log_b N/log_b a<\/td><\/tr><tr><td>单调性<\/td><td>a&gt;1 增；0&lt;a&lt;1 减<\/td><\/tr><tr><td>对数方程<\/td><td>化同底 → 比较真数 → 检验真数&gt;0<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：指数的推广与指数函数", "href": "#/chapter/ch01"}, {"label": "第 2 章：对数与对数运算", "href": "#/chapter/ch02"}, {"label": "第 3 章：对数函数、幂函数与指对方程", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "互为逆运算", "href": "#/concept/c01"}, {"label": "底数与单调性", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：指数的推广与指数函数", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：对数与对数运算", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：对数函数、幂函数与指对方程", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"permutations-combinations":{"manifest": {"slug": "permutations-combinations", "title": "排列与组合", "subtitle": "数得清，才说得准：两条原理与三类模型", "book": {"title": "排列与组合", "author": "吴世煦", "source": ["数学基础知识丛书-08-排列与组合 吴世煦.pdf"]}, "audience": "零基础", "goal": "掌握加法原理与乘法原理，会用排列数、组合数公式计数，能处理可重复与分组分配问题。", "learningPath": [{"step": "01", "title": "两条原理与排列", "chapterIds": ["ch01"], "checkpoint": "能判断一道题该加还是该乘"}, {"step": "02", "title": "组合与组合数", "chapterIds": ["ch02"], "checkpoint": "能判断有序无序并选出正确公式"}, {"step": "03", "title": "可重复排列与分组分配", "chapterIds": ["ch03"], "checkpoint": "能把分组问题按“均匀/非均匀”分开处理"}], "chapters": [{"id": "ch01", "title": "第 1 章：两条原理与排列", "file": "chapters/ch01-principles-permutation.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：组合与组合数", "file": "chapters/ch02-combination.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：可重复排列与分组分配", "file": "chapters/ch03-repeat-grouping.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "有序与无序", "file": "concepts/c01-ordered-unordered.md", "chapterIds": ["ch01", "ch02"]}, {"id": "c02", "title": "先分组后分配", "file": "concepts/c02-group-then-assign.md", "chapterIds": ["ch03"]}], "glossary": [{"term": "加法原理", "def": "分类计数，各类互斥则相加。", "chapterId": "ch01"}, {"term": "乘法原理", "def": "分步计数，各步相依则相乘。", "chapterId": "ch01"}, {"term": "排列", "def": "取出的元素要计顺序的排法。", "chapterId": "ch01"}, {"term": "全排列", "def": "n 个元素全部参与排列，共 n! 种。", "chapterId": "ch01"}, {"term": "组合", "def": "只计取出哪些元素、不计顺序。", "chapterId": "ch02"}, {"term": "组合数", "def": "C(n,m)=n!/[m!(n−m)!]。", "chapterId": "ch02"}, {"term": "可重复排列", "def": "元素可重复取用，数目为 nᵐ。", "chapterId": "ch03"}, {"term": "均匀分组", "def": "各组元素个数相同，需除以组数阶乘。", "chapterId": "ch03"}, {"term": "分配", "def": "把分好的组派到有标号的位置。", "chapterId": "ch03"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "从 5 人中选 3 人排成一排，共有多少种排法：", "options": ["10", "60", "125", "15"], "answer": 1, "explain": "A(5,3)=5×4×3=60。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "从甲地到乙地有 3 条路，从乙地到丙地有 4 条路，从甲到丙必须经乙，共有多少种走法：", "options": ["7", "12", "34", "4"], "answer": 1, "explain": "分两步，用乘法原理：3×4=12。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "从 6 名同学中选 2 名当代表，共有多少种选法：", "options": ["30", "15", "12", "36"], "answer": 1, "explain": "不分顺序，C(6,2)=15。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "C(10,3) 的值是：", "options": ["120", "720", "240", "90"], "answer": 0, "explain": "C(10,3)=10×9×8/6=120。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "用 1、2、3 组成允许重复的三位数，共有多少个：", "options": ["6", "9", "27", "81"], "answer": 2, "explain": "每一位都有 3 种选择：3³=27。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "6 人平均分成 3 组，每组 2 人，共有多少种分法：", "options": ["90", "15", "60", "20"], "answer": 1, "explain": "C(6,2)C(4,2)C(2,2)/3!=15×6×1/6=15。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "从 7 人中选 3 人排成一排照相，共有多少种排法：", "options": ["35", "210", "343", "21"], "answer": 1, "explain": "有序，A(7,3)=7×6×5=210。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "把 4 本不同的书平均分成两堆，每堆 2 本，共有多少种分法：", "options": ["6", "3", "12", "4"], "answer": 1, "explain": "C(4,2)C(2,2)/2!=3，两堆无标号要除以 2!。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：两条原理与排列」的一句话核心是什么？", "back": "分类用加法、分步用乘法；有序用排列。", "tags": ["permutations-combinations", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：组合与组合数」的一句话核心是什么？", "back": "组合只问“选哪些”，不问“怎么排”；所以 C(n,m)=A(n,m)/m!。", "tags": ["permutations-combinations", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：可重复排列与分组分配」的一句话核心是什么？", "back": "允许重复时每一步都有 n 种；分组时若各组人数相同，要除以组数的阶乘。", "tags": ["permutations-combinations", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「加法原理」？", "back": "分类计数，各类互斥则相加。", "tags": ["permutations-combinations", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「乘法原理」？", "back": "分步计数，各步相依则相乘。", "tags": ["permutations-combinations", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「排列」？", "back": "取出的元素要计顺序的排法。", "tags": ["permutations-combinations", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「全排列」？", "back": "n 个元素全部参与排列，共 n! 种。", "tags": ["permutations-combinations", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「组合」？", "back": "只计取出哪些元素、不计顺序。", "tags": ["permutations-combinations", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「组合数」？", "back": "C(n,m)=n!/[m!(n−m)!]。", "tags": ["permutations-combinations", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「可重复排列」？", "back": "元素可重复取用，数目为 nᵐ。", "tags": ["permutations-combinations", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「均匀分组」？", "back": "各组元素个数相同，需除以组数阶乘。", "tags": ["permutations-combinations", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「分配」？", "back": "把分好的组派到有标号的位置。", "tags": ["permutations-combinations", "术语"]}], "companion": "permutations-combinations学习伴侣.html", "deriv": "permutations-combinations从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：两条原理与排列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：乘法、阶乘\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n区分分类与分步并选用加法或乘法原理\n<\/li><li>\n推导排列数公式\n<\/li><li>\n处理有限制条件的排列\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>分类用加法、分步用乘法；有序用排列。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 加法原理<\/h3>\n<p>完成一件事有 k 类互斥的办法，第 i 类有 nᵢ 种，则总数为 n₁+n₂+…+n_k。<\/p>\n<p>关键词是<strong>互斥<\/strong>：同一件事不能既算在第 1 类又算在第 2 类，否则会重复计数。<\/p>\n<h3>1.2 乘法原理<\/h3>\n<p>完成一件事要分 k 步，第 i 步有 nᵢ 种，则总数为 n₁n₂…n_k。<\/p>\n<p>关键词是<strong>相依<\/strong>：前一步选了什么，会限制后一步的选择数。<\/p>\n<h3>1.3 排列<\/h3>\n<p>从 n 个不同元素中取 m 个按顺序排成一列，数目为<\/p>\n<p>A(n,m)=n(n−1)…(n−m+1)=n!/(n−m)!<\/p>\n<p>推导就是乘法原理：第 1 个位置 n 种、第 2 个 n−1 种……第 m 个 n−m+1 种。<\/p>\n<p>m=n 时叫全排列，A(n,n)=n!。<\/p>\n<h3>1.4 有限制条件<\/h3>\n<p>“甲不站排头”这类条件，常用两种办法：<strong>特殊位置优先<\/strong>（先排受限制的位置），或<strong>排除法<\/strong>（总数减去不合要求的）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：分类像走不同的门进同一个房间，走哪扇门都行；分步像先开门再上楼，少一步就到不了。<\/p>\n<p><strong>失效边界<\/strong>：分类必须互斥，分步必须覆盖全部过程；有交叉或遗漏就会算错。<\/p>\n<p><strong>实例<\/strong>：5 人排成一排，甲不站两端。 先排甲：中间 3 个位置任选，3 种；其余 4 人全排列 4!=24 种。共 3×24=72 种。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 分类和分步可以混用 —— 实际上 两者对应不同的结构：互斥的选择相加，先后依赖的步骤相乘。混用会重复或遗漏。\n<\/li><li>\n别以为 A(n,m) 就是 n 的阶乘 —— 实际上 只有 m=n 时才是 n!；一般要除掉 (n−m)!。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n从 5 人中选 3 人排成一排，共有多少种排法：\n<\/li><li>\n从甲地到乙地有 3 条路，从乙地到丙地有 4 条路，从甲到丙必须经乙，共有多少种走法：\n<p>A. 10 ｜ B. 60 ｜ C. 125 ｜ D. 15 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：A(5,3)=5×4×3=60。 A. 7 ｜ B. 12 ｜ C. 34 ｜ D. 4 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：分两步，用乘法原理：3×4=12。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n分类相加（互斥），分步相乘（相依）\n<\/li><li>\nA(n,m)=n!/(n−m)!\n<\/li><li>\n有限制条件：特殊位置优先或排除法\n<\/ul>", "ch02": "<h1>第 2 章：组合与组合数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断问题是否与顺序有关\n<\/li><li>\n用 C(n,m) 计算并化简\n<\/li><li>\n使用组合数性质 C(n,m)=C(n,n−m)\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>组合只问“选哪些”，不问“怎么排”；所以 C(n,m)=A(n,m)/m!。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 从排列到组合<\/h3>\n<p>从 n 个里取 m 个，若只关心“取到哪 m 个”，组成的不同集合数为<\/p>\n<p>C(n,m)=A(n,m)/m!=n!/[m!(n−m)!]<\/p>\n<p>除以 m! 的理由：同一组 m 个元素，内部可以排出 m! 种不同顺序，这些在组合里算同一种。<\/p>\n<h3>2.2 判断有序无序<\/h3>\n<ul><li>\n有序：排队、编号、分配不同岗位、组成不同数；\n<\/li><li>\n无序：选代表、选队员、取若干件物品、分组（组本身不分次序）。\n<\/ul>\n<p>拿不准时问一句：把选出的元素互换位置，算不算新的结果？算就是排列。<\/p>\n<h3>2.3 性质<\/h3>\n<ul><li>\nC(n,m)=C(n,n−m)（选出 m 个等价于留下 n−m 个）；\n<\/li><li>\nC(n,0)=C(n,n)=1；\n<\/li><li>\nC(n,m)+C(n,m+1)=C(n+1,m+1)（杨辉恒等式）。\n<\/ul>\n<h3>2.4 常见陷阱<\/h3>\n<p>“至少”“至多”类问题要按类分开加，不能直接乘；混合了排列与组合的题，先分组再排列。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：排列像给选出的球队排首发位置，组合像只报名单不排位置。<\/p>\n<p><strong>失效边界<\/strong>：元素有重复或部分相同（如字母 AAB）时，C(n,m) 不能直接套用。<\/p>\n<p><strong>实例<\/strong>：从 8 人中选 3 人参加比赛（不分角色）：C(8,3)=56。 若 3 人分别担任不同角色：A(8,3)=336=56×6。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 组合与排列只差一个符号 —— 实际上 差的是“顺序算不算不同结果”，这决定了是否除以 m!。\n<\/li><li>\n别以为 C(n,m) 一定小于 A(n,m) —— 实际上 m=0 或 1 时两者相等；m≥2 时组合数才更小。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n从 6 名同学中选 2 名当代表，共有多少种选法：\n<\/li><li>\nC(10,3) 的值是：\n<p>A. 30 ｜ B. 15 ｜ C. 12 ｜ D. 36 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：不分顺序，C(6,2)=15。 A. 120 ｜ B. 720 ｜ C. 240 ｜ D. 90 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：C(10,3)=10×9×8/6=120。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n组合＝排列除以 m!（同组内部顺序不计）\n<\/li><li>\n有序无序看“互换是否算新结果”\n<\/li><li>\nC(n,m)=C(n,n−m)\n<\/ul>", "ch03": "<h1>第 3 章：可重复排列与分组分配<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n计算允许重复的排列与不尽相异元素的排列\n<\/li><li>\n区分均匀分组与非均匀分组\n<\/li><li>\n按“先分组后分配”处理分派问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>允许重复时每一步都有 n 种；分组时若各组人数相同，要除以组数的阶乘。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 允许重复的排列<\/h3>\n<p>从 n 类元素中取 m 个，每类可取任意多次，排成一列，数目为 nᵐ。理由：每一位都有 n 种选择，且互不影响。<\/p>\n<p>例：用 0、1、2 组成三位数（数字可重复），首位不能为 0：2×3×3=18 个。<\/p>\n<h3>3.2 不尽相异元素的全排列<\/h3>\n<p>n 个元素中有 n₁ 个相同、n₂ 个相同……则不同排列数为<\/p>\n<p>n!/(n₁!n₂!…)<\/p>\n<p>因为相同的元素互换位置不算新排列。<\/p>\n<h3>3.3 分组问题<\/h3>\n<p>把 n 个不同元素分成若干组：<\/p>\n<ul><li>\n<strong>非均匀分组<\/strong>（各组人数不同）：直接按组合数依次取，再相乘；\n<\/li><li>\n<strong>均匀分组<\/strong>（各组人数相同）：乘完之后要除以组数的阶乘，因为组与组之间没有标号，互换整组不算新分法。\n<\/ul>\n<p>例：6 人平均分成 3 组，每组 2 人：C(6,2)C(4,2)C(2,2)/3!=15。若不除以 3!，得到 90，是把组的标号也算进去了。<\/p>\n<h3>3.4 分配问题<\/h3>\n<p>若组有明确归属（如分到 3 个不同班级），则先分组、再对组做全排列（分配）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：均匀分组像把 6 个苹果装进 3 个一模一样的袋子，袋子互换不算新装法。<\/p>\n<p><strong>失效边界<\/strong>：一旦袋子贴上标签（甲乙丙），互换就算新分法，不能再除。<\/p>\n<p><strong>实例<\/strong>：4 人分成两组，每组 2 人：C(4,2)C(2,2)/2!=3。 若分成“甲组 2 人、乙组 2 人”：C(4,2)=6（另一组自动确定）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 均匀分组不用除组数阶乘 —— 实际上 不除就把“哪一组先取”当成了区别，重复计算了 组数! 倍。\n<\/li><li>\n别以为 分组与分配是一回事 —— 实际上 分组只看集合划分；分配还要决定每组去哪个位置，多一步全排列。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用 1、2、3 组成允许重复的三位数，共有多少个：\n<\/li><li>\n6 人平均分成 3 组，每组 2 人，共有多少种分法：\n<p>A. 6 ｜ B. 9 ｜ C. 27 ｜ D. 81 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：每一位都有 3 种选择：3³=27。 A. 90 ｜ B. 15 ｜ C. 60 ｜ D. 20 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：C(6,2)C(4,2)C(2,2)/3!=15×6×1/6=15。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n允许重复：nᵐ；相同元素：n!/(n₁!n₂!…)\n<\/li><li>\n均匀分组要除以组数阶乘\n<\/li><li>\n先分组后分配\n<\/ul>", "c01": "<h1>有序与无序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>互换两个元素算不算新结果，决定用排列还是组合。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是计数题的第一个判断，选错公式后面全错。<\/p>\n<h2>详解<\/h2>\n<p>排队、编号、不同岗位、组数（如 123 与 321 不同）都是有序；选代表、选物品、分组（组内不分次序）都是无序。拿不准就用小数字试：2 个元素互换，结果变了就是排列。<\/p>\n<h2>常见误解<\/h2>\n<p>看到“选”就用组合，看到“排”就用排列，不看具体语境。<\/p>\n<h2>相关概念<\/h2>\n<p>排列（ch01）、组合（ch02）<\/p>", "c02": "<h1>先分组后分配<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>先把元素分成若干组（无标号），再把组派到具体位置（有标号）。<\/p>\n<h2>为什么重要<\/h2>\n<p>分组分配类问题几乎都靠这个结构，混着做必然重复或遗漏。<\/p>\n<h2>详解<\/h2>\n<p>分组阶段用组合数，均匀分组要除以组数阶乘；分配阶段对组做全排列。两步相乘。若题目直接给了组的名号（甲乙丙），说明已经带标号，只剩分配一步。<\/p>\n<h2>常见误解<\/h2>\n<p>把分组和分配合并成一次排列，导致同一种分法被反复计数。<\/p>\n<h2>相关概念<\/h2>\n<p>均匀分组（ch03）、组合数（ch02）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：两条原理与排列<\/strong><br>阅读：<a href=\"#/book/permutations-combinations/chapter/ch01\">第 1 章：两条原理与排列<\/a><br>检查点：能判断一道题该加还是该乘<\/li><li class='path-step' id='path-02'><strong>步骤 02：组合与组合数<\/strong><br>阅读：<a href=\"#/book/permutations-combinations/chapter/ch02\">第 2 章：组合与组合数<\/a><br>检查点：能判断有序无序并选出正确公式<\/li><li class='path-step' id='path-03'><strong>步骤 03：可重复排列与分组分配<\/strong><br>阅读：<a href=\"#/book/permutations-combinations/chapter/ch03\">第 3 章：可重复排列与分组分配<\/a><br>检查点：能把分组问题按“均匀/非均匀”分开处理<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：两条原理与排列<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 从 5 人中选 3 人排成一排，共有多少种排法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 10<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 60<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 125<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 15<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 从甲地到乙地有 3 条路，从乙地到丙地有 4 条路，从甲到丙必须经乙，共有多少种走法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 7<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 12<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 34<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：组合与组合数<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 从 6 名同学中选 2 名当代表，共有多少种选法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 30<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 15<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 12<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 36<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> C(10,3) 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 120<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 720<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 240<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 90<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：可重复排列与分组分配<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 用 1、2、3 组成允许重复的三位数，共有多少个：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 9<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 27<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 81<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 6 人平均分成 3 组，每组 2 人，共有多少种分法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 90<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 15<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 60<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 从 7 人中选 3 人排成一排照相，共有多少种排法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 35<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 210<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 343<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 21<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 把 4 本不同的书平均分成两堆，每堆 2 本，共有多少种分法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 3<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 12<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：两条原理与排列<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 从 5 人中选 3 人排成一排，共有多少种排法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 10<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 60<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 125<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 15<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 从甲地到乙地有 3 条路，从乙地到丙地有 4 条路，从甲到丙必须经乙，共有多少种走法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 7<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 12<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 34<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：组合与组合数<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 从 6 名同学中选 2 名当代表，共有多少种选法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 30<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 15<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 12<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 36<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> C(10,3) 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 120<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 720<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 240<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 90<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：可重复排列与分组分配<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 用 1、2、3 组成允许重复的三位数，共有多少个：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 9<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 27<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 81<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 6 人平均分成 3 组，每组 2 人，共有多少种分法：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 90<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 15<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 60<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='加法原理'>加法原理 — 分类计数，各类互斥则相加。 <span class=glossary-ref>（第 1 章：两条原理与排列）<\/span><\/li><li data-term='乘法原理'>乘法原理 — 分步计数，各步相依则相乘。 <span class=glossary-ref>（第 1 章：两条原理与排列）<\/span><\/li><li data-term='排列'>排列 — 取出的元素要计顺序的排法。 <span class=glossary-ref>（第 1 章：两条原理与排列）<\/span><\/li><li data-term='全排列'>全排列 — n 个元素全部参与排列，共 n! 种。 <span class=glossary-ref>（第 1 章：两条原理与排列）<\/span><\/li><li data-term='组合'>组合 — 只计取出哪些元素、不计顺序。 <span class=glossary-ref>（第 2 章：组合与组合数）<\/span><\/li><li data-term='组合数'>组合数 — C(n,m)=n!/[m!(n−m)!]。 <span class=glossary-ref>（第 2 章：组合与组合数）<\/span><\/li><li data-term='可重复排列'>可重复排列 — 元素可重复取用，数目为 nᵐ。 <span class=glossary-ref>（第 3 章：可重复排列与分组分配）<\/span><\/li><li data-term='均匀分组'>均匀分组 — 各组元素个数相同，需除以组数阶乘。 <span class=glossary-ref>（第 3 章：可重复排列与分组分配）<\/span><\/li><li data-term='分配'>分配 — 把分好的组派到有标号的位置。 <span class=glossary-ref>（第 3 章：可重复排列与分组分配）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：计数四问<\/h2>\n<p>① 完成这件事是分类还是分步？② 元素能否重复？③ 顺序算不算不同？④ 组有没有标号？四问答完，公式自然定。<\/p>\n<h2>框架：复杂题拆解<\/h2>\n<p>先按“至少/至多/限制条件”分类，类内再分步，最后把各类相加。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>加法原理<\/td><td>分类互斥，N=n₁+…+n_k<\/td><\/tr><tr><td>乘法原理<\/td><td>分步相依，N=n₁…n_k<\/td><\/tr><tr><td>排列数<\/td><td>A(n,m)=n!/(n−m)!<\/td><\/tr><tr><td>组合数<\/td><td>C(n,m)=n!/[m!(n−m)!]<\/td><\/tr><tr><td>组合性质<\/td><td>C(n,m)=C(n,n−m)；C(n,0)=1<\/td><\/tr><tr><td>可重复<\/td><td>nᵐ<\/td><\/tr><tr><td>均匀分组<\/td><td>除以组数阶乘<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：两条原理与排列", "href": "#/chapter/ch01"}, {"label": "第 2 章：组合与组合数", "href": "#/chapter/ch02"}, {"label": "第 3 章：可重复排列与分组分配", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "有序与无序", "href": "#/concept/c01"}, {"label": "先分组后分配", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：两条原理与排列", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：组合与组合数", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：可重复排列与分组分配", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"sequences-limits":{"manifest": {"slug": "sequences-limits", "title": "数列与极限", "subtitle": "从一串数看到趋势：数列、级数与极限", "book": {"title": "数列与极限", "author": "周伯堳", "source": ["数学基础知识丛书-09-数列与极限 周伯堳.pdf"]}, "audience": "零基础", "goal": "掌握数列的通项与递推，推导等差、等比数列的通项与求和公式，理解极限的直观含义并会求简单极限。", "learningPath": [{"step": "01", "title": "数列与通项", "chapterIds": ["ch01"], "checkpoint": "能由一个通项公式写出前几项"}, {"step": "02", "title": "等差数列与等比数列", "chapterIds": ["ch02"], "checkpoint": "能默写两组通项与求和公式"}, {"step": "03", "title": "级数与极限", "chapterIds": ["ch03"], "checkpoint": "能用 |q|<1 求和并解释极限"}], "chapters": [{"id": "ch01", "title": "第 1 章：数列与通项", "file": "chapters/ch01-sequence.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：等差数列与等比数列", "file": "chapters/ch02-ap-gp.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：级数与极限", "file": "chapters/ch03-series-limit.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "通项与递推", "file": "concepts/c01-general-recurrence.md", "chapterIds": ["ch01", "ch02"]}, {"id": "c02", "title": "极限与收敛", "file": "concepts/c02-limit-convergence.md", "chapterIds": ["ch03"]}], "glossary": [{"term": "数列", "def": "按顺序排列的一列数。", "chapterId": "ch01"}, {"term": "通项公式", "def": "用 n 表示第 n 项的公式。", "chapterId": "ch01"}, {"term": "递推公式", "def": "用前项表示后项的关系式加初值。", "chapterId": "ch01"}, {"term": "等差数列", "def": "相邻两项差为常数的数列。", "chapterId": "ch02"}, {"term": "等比数列", "def": "相邻两项比为常数的数列。", "chapterId": "ch02"}, {"term": "部分和", "def": "前 n 项相加得到的 Sₙ。", "chapterId": "ch03"}, {"term": "极限", "def": "n 无限增大时数列趋向的定值。", "chapterId": "ch03"}, {"term": "收敛", "def": "极限存在，部分和趋向有限值。", "chapterId": "ch03"}, {"term": "连分数", "def": "分母中含下一层分式的无限表达式。", "chapterId": "ch03"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "数列 aₙ=3n−2 的第 5 项是：", "options": ["13", "15", "17", "12"], "answer": 0, "explain": "a₅=3×5−2=13。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "数列 a₁=2，aₙ₊₁=aₙ+3 的第 4 项是：", "options": ["8", "11", "14", "5"], "answer": 1, "explain": "依次得 2,5,8,11，第 4 项为 11。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "等差数列首项 3、公差 4，第 10 项是：", "options": ["39", "43", "36", "40"], "answer": 0, "explain": "a₁₀=3+9×4=39。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "等比数列 2,6,18,… 的前 4 项和是：", "options": ["80", "54", "40", "26"], "answer": 0, "explain": "q=3，S₄=2(1−3⁴)/(1−3)=2(−80)/(−2)=80。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "无穷等比级数 1+1/3+1/9+… 的和是：", "options": ["3/2", "2", "3", "1"], "answer": 0, "explain": "a₁=1，q=1/3，S=1/(1−1/3)=3/2。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "数列 aₙ=1/n 当 n→∞ 时的极限是：", "options": ["1", "0", "不存在", "无穷大"], "answer": 1, "explain": "n 越大 1/n 越接近 0。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "等差数列 5,9,13,… 的第 8 项是：", "options": ["33", "37", "29", "41"], "answer": 0, "explain": "a₈=5+7×4=33。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "无穷等比级数 1+1/4+1/16+… 的和是：", "options": ["4/3", "2", "5/4", "3/2"], "answer": 0, "explain": "q=1/4，S=1/(1−1/4)=4/3。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：数列与通项」的一句话核心是什么？", "back": "数列是定义在正整数上的函数：aₙ=f(n)，顺序本身就是信息。", "tags": ["sequences-limits", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：等差数列与等比数列」的一句话核心是什么？", "back": "等差是“加”，等比是“乘”；求和公式都能由“配对”或“错位相减”推出来。", "tags": ["sequences-limits", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：级数与极限」的一句话核心是什么？", "back": "极限就是“n 越大越靠近某个定值”；无穷多个数相加，和可能是一个有限的数。", "tags": ["sequences-limits", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「数列」？", "back": "按顺序排列的一列数。", "tags": ["sequences-limits", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「通项公式」？", "back": "用 n 表示第 n 项的公式。", "tags": ["sequences-limits", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「递推公式」？", "back": "用前项表示后项的关系式加初值。", "tags": ["sequences-limits", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「等差数列」？", "back": "相邻两项差为常数的数列。", "tags": ["sequences-limits", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「等比数列」？", "back": "相邻两项比为常数的数列。", "tags": ["sequences-limits", "术语"]}, {"id": "f09", "chapterId": "ch03", "front": "什么是「部分和」？", "back": "前 n 项相加得到的 Sₙ。", "tags": ["sequences-limits", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「极限」？", "back": "n 无限增大时数列趋向的定值。", "tags": ["sequences-limits", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「收敛」？", "back": "极限存在，部分和趋向有限值。", "tags": ["sequences-limits", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「连分数」？", "back": "分母中含下一层分式的无限表达式。", "tags": ["sequences-limits", "术语"]}], "companion": "sequences-limits学习伴侣.html", "deriv": "sequences-limits从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：数列与通项<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：函数、代数式\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n区分通项公式与递推公式\n<\/li><li>\n由通项写出前若干项并判断增减\n<\/li><li>\n用差分找简单数列的规律\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>数列是定义在正整数上的函数：aₙ=f(n)，顺序本身就是信息。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 数列是有序的<\/h3>\n<p>数列 a₁,a₂,…,aₙ,… 是按顺序排好的一串数。交换两项就变成另一个数列，这与集合不同。<\/p>\n<h3>1.2 两种表示<\/h3>\n<ul><li>\n<strong>通项公式<\/strong>：aₙ 用 n 直接表示，如 aₙ=2n−1，代入 n=1,2,3 得 1,3,5；\n<\/li><li>\n<strong>递推公式<\/strong>：给出首项与“后项如何由前项得到”，如 a₁=1、aₙ₊₁=aₙ+3。\n<\/ul>\n<p>通项便于直接算任意一项，递推便于描述生成过程，两者常互相转化。<\/p>\n<h3>1.3 单调性与有界性<\/h3>\n<p>aₙ₊₁&gt;aₙ 为递增，反之为递减。数列有界指存在 M 使 |aₙ|≤M 对所有 n 成立。这两条是后面判断极限存在的前提。<\/p>\n<h3>1.4 用差分找规律<\/h3>\n<p>相邻两项之差 dₙ=aₙ₊₁−aₙ 若为常数，就是等差数列；相邻两项之比若为常数，就是等比数列。差分是识别规律的第一把工具。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：数列像按日期排好的日记，顺序变了意思就变了。<\/p>\n<p><strong>失效边界<\/strong>：仅凭前几项猜通项并不可靠，1,2,4,8 后面也可能是 15（不是 2 的幂）。<\/p>\n<p><strong>实例<\/strong>：aₙ=n²−n。n=1 得 0，n=2 得 2，n=3 得 6，n=4 得 12。相邻差为 2,4,6,8，是等差数列，说明原数列是二次型。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 数列就是一堆数 —— 实际上 顺序是定义的一部分；同一组数按不同顺序排，就是不同数列。\n<\/li><li>\n别以为 前几项能唯一确定通项 —— 实际上 有限项永远对应无穷多种通项，必须靠结构（等差、等比、二次）判断。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n数列 aₙ=3n−2 的第 5 项是：\n<\/li><li>\n数列 a₁=2，aₙ₊₁=aₙ+3 的第 4 项是：\n<p>A. 13 ｜ B. 15 ｜ C. 17 ｜ D. 12 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：a₅=3×5−2=13。 A. 8 ｜ B. 11 ｜ C. 14 ｜ D. 5 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：依次得 2,5,8,11，第 4 项为 11。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n数列是正整数上的函数，顺序有意义\n<\/li><li>\n通项直接算、递推描述生成\n<\/li><li>\n差分定等差、比值定等比\n<\/ul>", "ch02": "<h1>第 2 章：等差数列与等比数列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n默写两组通项与求和公式\n<\/li><li>\n用倒序相加推导等差求和\n<\/li><li>\n分 q=1 与 q≠1 讨论等比求和\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>等差是“加”，等比是“乘”；求和公式都能由“配对”或“错位相减”推出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 等差数列<\/h3>\n<p>首项 a₁、公差 d：aₙ=a₁+(n−1)d。<\/p>\n<p>求和用<strong>倒序相加<\/strong>：<\/p>\n<p>Sₙ=a₁+a₂+…+aₙ Sₙ=aₙ+aₙ₋₁+…+a₁<\/p>\n<p>两式相加，每对和都是 a₁+aₙ，共 n 对，故 2Sₙ=n(a₁+aₙ)，即 Sₙ=n(a₁+aₙ)/2=n a₁+n(n−1)d/2。<\/p>\n<h3>2.2 等比数列<\/h3>\n<p>首项 a₁、公比 q：aₙ=a₁q^(n−1)。<\/p>\n<p>求和用<strong>错位相减<\/strong>：<\/p>\n<p>Sₙ=a₁+a₁q+…+a₁q^(n−1) qSₙ=a₁q+…+a₁qⁿ<\/p>\n<p>相减得 (1−q)Sₙ=a₁(1−qⁿ)。q≠1 时 Sₙ=a₁(1−qⁿ)/(1−q)；q=1 时每项都等于 a₁，Sₙ=na₁。<\/p>\n<h3>2.3 常用性质<\/h3>\n<ul><li>\n等差中项：b 是 a、c 的等差中项 ⇔ 2b=a+c；\n<\/li><li>\n等比中项：b²=ac（a、b、c 同号时）；\n<\/li><li>\n等差中，若 m+n=p+q 则 aₘ+aₙ=a_p+a_q；等比中对应为乘积相等。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：等差像每月固定加薪，等比像每月按固定比例涨薪。<\/p>\n<p><strong>失效边界<\/strong>：等比求和公式在 q=1 时分母为零，必须单独处理。<\/p>\n<p><strong>实例<\/strong>：1+2+…+100=100×101/2=5050。 1+2+4+…+2⁹（10 项，q=2）：S=1×(1−2¹⁰)/(1−2)=1023。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 等比求和直接套 a₁(1−qⁿ)/(1−q) —— 实际上 q=1 时公式无意义，要单独算 Sₙ=na₁。\n<\/li><li>\n别以为 等差中项与等比中项可以混用 —— 实际上 等差是算术平均，等比是几何平均；后者要求同号，且有两个平方根。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n等差数列首项 3、公差 4，第 10 项是：\n<\/li><li>\n等比数列 2,6,18,… 的前 4 项和是：\n<p>A. 39 ｜ B. 43 ｜ C. 36 ｜ D. 40 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：a₁₀=3+9×4=39。 A. 80 ｜ B. 54 ｜ C. 40 ｜ D. 26 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：q=3，S₄=2(1−3⁴)/(1−3)=2(−80)/(−2)=80。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n等差：aₙ=a₁+(n−1)d，Sₙ=n(a₁+aₙ)/2\n<\/li><li>\n等比：aₙ=a₁q^(n−1)，q≠1 时 Sₙ=a₁(1−qⁿ)/(1−q)\n<\/li><li>\nq=1 时 Sₙ=na₁\n<\/ul>", "ch03": "<h1>第 3 章：级数与极限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出极限的直观含义\n<\/li><li>\n判断无穷等比级数是否收敛并求和\n<\/li><li>\n用极限求连分数的值\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>极限就是“n 越大越靠近某个定值”；无穷多个数相加，和可能是一个有限的数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 部分和<\/h3>\n<p>把前 n 项加起来得到 Sₙ，叫<strong>部分和<\/strong>。S₁=a₁，S₂=a₁+a₂，依此类推。级数的“和”定义为 Sₙ 当 n→∞ 时的极限。<\/p>\n<h3>3.2 极限的直观含义<\/h3>\n<p>若 n 无限增大时，aₙ 与某个常数 A 的距离可以任意小，就说 aₙ 的极限是 A，记 lim aₙ=A。<\/p>\n<p>例：aₙ=1/n，n 越大越接近 0；aₙ=(n+1)/n=1+1/n，极限是 1。<\/p>\n<p>严格定义（ε-N）留到大学，这里先建立“越来越接近”的直观。<\/p>\n<h3>3.3 无穷等比级数<\/h3>\n<p>|q|&lt;1 时，qⁿ→0，于是<\/p>\n<p>S=a₁/(1−q)<\/p>\n<p>这是全书最常用的结论。例：1+1/2+1/4+…=1/(1−1/2)=2。<\/p>\n<p>|q|≥1 时级数发散，没有有限和。<\/p>\n<h3>3.4 连分数<\/h3>\n<p>形如 1/(1+1/(1+1/(1+…))) 的表达式叫<strong>连分数<\/strong>：分母里又套着同一个结构。<\/p>\n<p>求它的值时，设整体为 x，则被嵌套的部分仍是 x，于是<\/p>\n<p>x = 1/(1+x)<\/p>\n<p>两边乘 (1+x)：x+x²=1，即 x²+x−1=0。取正根 x=(√5−1)/2≈0.618，正是黄金分割比。<\/p>\n<p>连分数是“用极限求解”的典型例子：先假设极限存在，再把无限结构代回自身，解出方程。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：极限像跑步靠近终点：每一秒都比上一秒更近，虽然永远差一点点。<\/p>\n<p><strong>失效边界<\/strong>：|q|≥1 时不能套 a₁/(1−q)，会算出负数或无穷，都是错的。<\/p>\n<p><strong>实例<\/strong>：0.333…=0.3+0.03+0.003+…，首项 0.3、公比 0.1，和 =0.3/(1−0.1)=1/3。这解释了为什么 0.333…=1/3。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 无穷多个正数相加一定是无穷大 —— 实际上 只要每项衰减得够快（|q|&lt;1），和可以是有限的，如 1+1/2+1/4+…=2。\n<\/li><li>\n别以为 0.999…比 1 小 —— 实际上 它等于 1。按等比级数求和：0.9/(1−0.1)=1。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n无穷等比级数 1+1/3+1/9+… 的和是：\n<\/li><li>\n数列 aₙ=1/n 当 n→∞ 时的极限是：\n<p>A. 3/2 ｜ B. 2 ｜ C. 3 ｜ D. 1 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：a₁=1，q=1/3，S=1/(1−1/3)=3/2。 A. 1 ｜ B. 0 ｜ C. 不存在 ｜ D. 无穷大 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：n 越大 1/n 越接近 0。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n级数的和＝部分和的极限\n<\/li><li>\n|q|&lt;1 时无穷等比级数收敛于 a₁/(1−q)\n<\/li><li>\n0.999…=1，可用级数求和验证\n<\/ul>", "c01": "<h1>通项与递推<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>通项给“第 n 项是多少”，递推给“下一项怎么由上一项得到”。<\/p>\n<h2>为什么重要<\/h2>\n<p>两种描述方式各有用途：算某项用通项，找规律与编程用递推。<\/p>\n<h2>详解<\/h2>\n<p>通项是显函数 aₙ=f(n)；递推是关系式 aₙ₊₁=g(aₙ) 加初值。等差、等比都能写成两种形式，互换时靠累加或累乘。<\/p>\n<h2>常见误解<\/h2>\n<p>以为递推式必须化成通项才能算，其实逐项代入也能得到任意项。<\/p>\n<h2>相关概念<\/h2>\n<p>数列（ch01）、等差等比（ch02）<\/p>", "c02": "<h1>极限与收敛<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>n 越大越靠近一个定值，就是收敛；否则发散。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是微积分的门槛：导数、积分都是极限。<\/p>\n<h2>详解<\/h2>\n<p>判断收敛先看通项是否趋于 0（趋于 0 是必要条件，不充分）。等比级数看 |q|：小于 1 收敛，否则发散。收敛时才能用 a₁/(1−q) 求和。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“项越来越小”就一定收敛，调和级数 1+1/2+1/3+… 就是反例。<\/p>\n<h2>相关概念<\/h2>\n<p>级数（ch03）、导数（《微积分初步》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数列与通项<\/strong><br>阅读：<a href=\"#/book/sequences-limits/chapter/ch01\">第 1 章：数列与通项<\/a><br>检查点：能由一个通项公式写出前几项<\/li><li class='path-step' id='path-02'><strong>步骤 02：等差数列与等比数列<\/strong><br>阅读：<a href=\"#/book/sequences-limits/chapter/ch02\">第 2 章：等差数列与等比数列<\/a><br>检查点：能默写两组通项与求和公式<\/li><li class='path-step' id='path-03'><strong>步骤 03：级数与极限<\/strong><br>阅读：<a href=\"#/book/sequences-limits/chapter/ch03\">第 3 章：级数与极限<\/a><br>检查点：能用 |q|&lt;1 求和并解释极限<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：数列与通项<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 数列 aₙ=3n−2 的第 5 项是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 13<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 15<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 17<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 12<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 数列 a₁=2，aₙ₊₁=aₙ+3 的第 4 项是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 8<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 11<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 14<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：等差数列与等比数列<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 等差数列首项 3、公差 4，第 10 项是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 39<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 43<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 36<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 40<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 等比数列 2,6,18,… 的前 4 项和是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 80<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 54<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 40<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 26<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：级数与极限<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 无穷等比级数 1+1/3+1/9+… 的和是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 3/2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 数列 aₙ=1/n 当 n→∞ 时的极限是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 不存在<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 无穷大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 等差数列 5,9,13,… 的第 8 项是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 33<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 37<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 29<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 41<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 无穷等比级数 1+1/4+1/16+… 的和是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 4/3<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 5/4<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 3/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：数列与通项<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 数列 aₙ=3n−2 的第 5 项是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 13<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 15<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 17<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 12<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 数列 a₁=2，aₙ₊₁=aₙ+3 的第 4 项是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 8<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 11<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 14<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：等差数列与等比数列<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 等差数列首项 3、公差 4，第 10 项是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 39<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 43<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 36<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 40<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 等比数列 2,6,18,… 的前 4 项和是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 80<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 54<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 40<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 26<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：级数与极限<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 无穷等比级数 1
