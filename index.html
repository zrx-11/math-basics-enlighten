d": "ch04", "title": "第 4 章：二次方程组与可化归方程", "file": "chapters/ch04-reducible.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "同解变形", "file": "concepts/c01-equivalent-transform.md", "chapterIds": ["ch01", "ch04"]}, {"id": "c02", "title": "判别式与韦达定理", "file": "concepts/c02-discriminant-vieta.md", "chapterIds": ["ch03"]}], "glossary": [{"term": "方程", "def": "含未知数的等式，使等式成立的未知数值叫解。", "chapterId": "ch01"}, {"term": "移项", "def": "把项从等式一边移到另一边并变号，本质是两边同加相反数。", "chapterId": "ch01"}, {"term": "消元", "def": "通过代入或加减，减少方程组中未知数的个数。", "chapterId": "ch02"}, {"term": "配方", "def": "把二次式改写成完全平方加常数的形式。", "chapterId": "ch03"}, {"term": "判别式", "def": "Δ=b²−4ac，判断二次方程实根个数。", "chapterId": "ch03"}, {"term": "韦达定理", "def": "两根之和为 −b/a，两根之积为 c/a。", "chapterId": "ch03"}, {"term": "换元", "def": "用一个新变量替换原式中的某部分，达到降次或简化。", "chapterId": "ch04"}, {"term": "增根", "def": "变形后产生、但不满足原方程的解。", "chapterId": "ch04"}, {"term": "验根", "def": "把候选解代回原方程，排除增根。", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "方程 2(x−1)=x+3 的解是：", "options": ["x=1", "x=5", "x=3", "x=−5"], "answer": 1, "explain": "展开 2x−2=x+3，移项得 x=5。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "关于 x 的方程 ax=b，下列说法正确的是：", "options": ["一定有唯一解 x=b/a", "a=0 时一定无解", "a=0 且 b=0 时任意 x 都是解", "a=0 且 b≠0 时有无穷多解"], "answer": 2, "explain": "a≠0 时唯一解；a=0、b≠0 无解；a=0、b=0 时恒成立，任意解。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "方程组 x+y=7，x−y=1 的解是：", "options": ["x=4，y=3", "x=3，y=4", "x=5，y=2", "x=6，y=1"], "answer": 0, "explain": "两式相加 2x=8 得 x=4，代回得 y=3。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "消元后出现 0=5 这样的式子，说明方程组：", "options": ["有唯一解", "有无穷多解", "无解", "解为正数"], "answer": 2, "explain": "0=5 是矛盾式，说明不存在同时满足所有方程的解，即无解。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "方程 x²−5x+6=0 的两根是：", "options": ["2 和 3", "−2 和 −3", "1 和 6", "−1 和 −6"], "answer": 0, "explain": "因式分解 (x−2)(x−3)=0，或用公式：Δ=1，x=(5±1)/2。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "方程 x²+2x+5=0 的根的情况是：", "options": ["两个不等实根", "两个相等实根", "没有实根", "无法判断"], "answer": 2, "explain": "Δ=4−20=−16<0，无实根。"}, {"id": "ch04-q07", "chapterId": "ch04", "type": "single", "question": "方程 x⁴−5x²+4=0 的实根个数是：", "options": ["2", "3", "4", "0"], "answer": 2, "explain": "设 t=x²：t²−5t+4=0 得 t=1 或 4，均非负，故 x=±1、±2，共 4 个实根。"}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "解分式方程时，验根的目的是：", "options": ["检查计算是否正确", "排除使分母为零的增根", "确认解是正数", "检查是否为整数"], "answer": 1, "explain": "去分母时乘了含未知数的式子，可能引入使分母为零的根，必须代回原方程排除。"}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "方程 x²−2x−8=0 的两根之和与两根之积分别是：", "options": ["2 和 −8", "−2 和 −8", "2 和 8", "−2 和 8"], "answer": 0, "explain": "a=1，b=−2，c=−8：和为 −b/a=2，积为 c/a=−8。"}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "若关于 x 的方程 kx²+2x+1=0 有两个不相等的实根，则 k 的取值范围是：", "options": ["k<1", "k<1 且 k≠0", "k>1", "k≤1"], "answer": 1, "explain": "二次方程要求 k≠0；两个不等实根要求 Δ=4−4k>0，即 k<1。合起来 k<1 且 k≠0。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：一元一次方程」的一句话核心是什么？", "back": "解方程就是在等式两边同时做同一件事，把未知数一步步孤立出来。", "tags": ["equations-1-2", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：一次方程组」的一句话核心是什么？", "back": "解方程组只有一个策略：消元——把多个未知数一个个消掉，直到只剩一个。", "tags": ["equations-1-2", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：一元二次方程」的一句话核心是什么？", "back": "二次方程靠配方变成“完全平方＝常数”，开方就得到两个根；判别式就是那个常数是否非负。", "tags": ["equations-1-2", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：二次方程组与可化归方程」的一句话核心是什么？", "back": "遇到高次或复杂方程，先想办法降次或消元；化归之后必须回代验根，因为变形可能扩大定义域。", "tags": ["equations-1-2", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「方程」？", "back": "含未知数的等式，使等式成立的未知数值叫解。", "tags": ["equations-1-2", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「移项」？", "back": "把项从等式一边移到另一边并变号，本质是两边同加相反数。", "tags": ["equations-1-2", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「消元」？", "back": "通过代入或加减，减少方程组中未知数的个数。", "tags": ["equations-1-2", "术语"]}, {"id": "f08", "chapterId": "ch03", "front": "什么是「配方」？", "back": "把二次式改写成完全平方加常数的形式。", "tags": ["equations-1-2", "术语"]}, {"id": "f09", "chapterId": "ch03", "front": "什么是「判别式」？", "back": "Δ=b²−4ac，判断二次方程实根个数。", "tags": ["equations-1-2", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「韦达定理」？", "back": "两根之和为 −b/a，两根之积为 c/a。", "tags": ["equations-1-2", "术语"]}, {"id": "f11", "chapterId": "ch04", "front": "什么是「换元」？", "back": "用一个新变量替换原式中的某部分，达到降次或简化。", "tags": ["equations-1-2", "术语"]}, {"id": "f12", "chapterId": "ch04", "front": "什么是「增根」？", "back": "变形后产生、但不满足原方程的解。", "tags": ["equations-1-2", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「验根」？", "back": "把候选解代回原方程，排除增根。", "tags": ["equations-1-2", "术语"]}], "companion": "equations-1-2学习伴侣.html", "deriv": "equations-1-2从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：一元一次方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：等式性质、四则运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用移项、去分母把方程化成 ax=b\n<\/li><li>\n讨论 ax+b=0 的三种解情形\n<\/li><li>\n把应用题翻译成方程\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>解方程就是在等式两边同时做同一件事，把未知数一步步孤立出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 等式只有两条性质<\/h3>\n<ol><li>\n两边同加（或同减）同一个数，等式仍成立；\n<\/li><li>\n两边同乘（或同除以）同一个<strong>不为零<\/strong>的数，等式仍成立。\n<\/ol>\n<p>所有变形都由这两条推出，没有第三条。<\/p>\n<h3>1.2 移项就是两边同加相反数<\/h3>\n<p>由 x+3=7，两边同加 −3，得 x=4。习惯上把这一步叫“移项变号”——它其实不是“把项搬过去”，而是两边同时加了一个数。<\/p>\n<h3>1.3 去分母就是两边同乘公倍数<\/h3>\n<p>方程 (x/2)+(x/3)=5，两边同乘 6，得 3x+2x=30。乘以的是分母的最小公倍数，每一项都要乘，不能漏掉不含分母的项。<\/p>\n<h3>1.4 ax+b=0 的三种结局<\/h3>\n<p>化成 ax=−b 后：<\/p>\n<ul><li>\na≠0：唯一解 x=−b/a；\n<\/li><li>\na=0 且 b≠0：0=−b 不成立，无解；\n<\/li><li>\na=0 且 b=0：0=0 恒成立，任意 x 都是解。\n<\/ul>\n<p>讨论参数时必须把这三种都说到，只写 x=−b/a 是不完整的。<\/p>\n<h3>1.5 应用题的四步<\/h3>\n<p>设未知数 → 找等量关系 → 列方程 → 解并回到原题检验（单位、范围是否合理）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：方程像一架天平，两边同时加同样的砝码、同时减半，平衡都不会破。<\/p>\n<p><strong>失效边界<\/strong>：两边不能同乘 0，否则任何等式都变成 0=0，信息全丢。<\/p>\n<p><strong>实例<\/strong>：某数的 3 倍减去 5 等于它的 2 倍加 7，求这个数。 设该数为 x：3x−5=2x+7，移项得 x=12。检验：3×12−5=31，2×12+7=31。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 移项就是把项从一边搬到另一边 —— 实际上 本质是两边同加相反数；只记“搬过去变号”容易在乘除时用错规则。\n<\/li><li>\n别以为 方程两边可以同时除以任何式子 —— 实际上 除数必须不为零；含未知数的除式要先确认它不等于零。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n方程 2(x−1)=x+3 的解是：\n<\/li><li>\n关于 x 的方程 ax=b，下列说法正确的是：\n<p>A. x=1 ｜ B. x=5 ｜ C. x=3 ｜ D. x=−5 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：展开 2x−2=x+3，移项得 x=5。 A. 一定有唯一解 x=b/a ｜ B. a=0 时一定无解 ｜ C. a=0 且 b=0 时任意 x 都是解 ｜ D. a=0 且 b≠0 时有无穷多解 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：a≠0 时唯一解；a=0、b≠0 无解；a=0、b=0 时恒成立，任意解。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n等式两条性质是所有变形的来源\n<\/li><li>\n移项＝两边同加相反数；去分母＝两边同乘公倍数\n<\/li><li>\nax=b 要按 a 是否为 0 分情形讨论\n<\/ul>", "ch02": "<h1>第 2 章：一次方程组<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用代入消元与加减消元把方程组化成一元方程\n<\/li><li>\n处理三元一次方程组\n<\/li><li>\n判断方程组无解或有无穷多解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>解方程组只有一个策略：消元——把多个未知数一个个消掉，直到只剩一个。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 代入消元<\/h3>\n<p>从一个方程里解出一个未知数，代入另一个方程。例：<\/p>\n<p>x+y=5，2x−y=1。由第一式 y=5−x，代入第二式得 2x−(5−x)=1，即 3x=6，x=2，y=3。<\/p>\n<h3>2.2 加减消元<\/h3>\n<p>把两个方程适当相乘，使某个未知数的系数相等或互为相反数，再相减或相加。<\/p>\n<p>2x+3y=12，4x−3y=6。两式相加得 6x=18，x=3，回代得 y=2。<\/p>\n<h3>2.3 三元方程组<\/h3>\n<p>先用两个方程消去同一个未知数，得到一个新的二元方程组，再解二元，最后回代求第三个未知数。消元时要固定消同一个字母，否则会绕回原处。<\/p>\n<h3>2.4 解的三种情形<\/h3>\n<p>把方程组化成阶梯形后看最后一行：<\/p>\n<ul><li>\n出现 0=非零数：无解（两直线平行或平面平行）；\n<\/li><li>\n出现 0=0：有无穷多解，需用参数表示；\n<\/li><li>\n其余：唯一解。\n<\/ul>\n<p>几何上，二元一次方程组的两条直线相交、平行、重合，正好对应这三种情形。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：消元像“逐个清点”：先确定一个人数，再据此算其他人，不必同时猜所有人。<\/p>\n<p><strong>失效边界<\/strong>：消元时若把两个方程乘的倍数搞错，会得到与原方程组不同解的方程，必须每步都保持等价。<\/p>\n<p><strong>实例<\/strong>：解 3x+2y=12，x−y=1。 由第二式 x=1+y，代入第一式 3(1+y)+2y=12 ⇒ 5y=9 ⇒ y=9/5，x=14/5。检验：3×14/5+2×9/5=42/5+18/5=60/5=12。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 两个方程相加后可以随便取一个原方程组合成新方程组 —— 实际上 相加减必须保持等价，最好固定保留一个原方程，另一式用加减结果替换。\n<\/li><li>\n别以为 三元方程组一定有三个解 —— 实际上 未知数个数不等于解的个数；可能是唯一解、无解或无穷多解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n方程组 x+y=7，x−y=1 的解是：\n<\/li><li>\n消元后出现 0=5 这样的式子，说明方程组：\n<p>A. x=4，y=3 ｜ B. x=3，y=4 ｜ C. x=5，y=2 ｜ D. x=6，y=1 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：两式相加 2x=8 得 x=4，代回得 y=3。 A. 有唯一解 ｜ B. 有无穷多解 ｜ C. 无解 ｜ D. 解为正数 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：0=5 是矛盾式，说明不存在同时满足所有方程的解，即无解。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n代入消元与加减消元本质都是消去未知数\n<\/li><li>\n三元要先化成二元，固定消同一字母\n<\/li><li>\n0=非零数 ⇒ 无解；0=0 ⇒ 无穷多解\n<\/ul>", "ch03": "<h1>第 3 章：一元二次方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、配方、开方\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用配方法推出求根公式\n<\/li><li>\n用判别式判断根的个数与类型\n<\/li><li>\n用韦达定理求两根之和、之积\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>二次方程靠配方变成“完全平方＝常数”，开方就得到两个根；判别式就是那个常数是否非负。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 配方的思路<\/h3>\n<p>ax²+bx+c=0（a≠0）。两边除以 a：<\/p>\n<p>x²+(b/a)x+(c/a)=0<\/p>\n<p>把前两项配成完全平方：<\/p>\n<p>(x+b/2a)² = (b²−4ac)/(4a²)<\/p>\n<p>右边是一个确定的数，开方即可。<\/p>\n<h3>3.2 求根公式<\/h3>\n<p>由上式得<\/p>\n<p>x = (−b ± √(b²−4ac)) / (2a)<\/p>\n<p>这就是求根公式。推导只有两步：配方、开方；记不住公式时，现场推一遍比背更可靠。<\/p>\n<h3>3.3 判别式<\/h3>\n<p>记 Δ=b²−4ac：<\/p>\n<ul><li>\nΔ&gt;0：两个不相等的实根；\n<\/li><li>\nΔ=0：两个相等的实根（重根）；\n<\/li><li>\nΔ&lt;0：没有实根（在实数范围内无解）。\n<\/ul>\n<p>判别式只判断“有没有、几个”，不给出具体值。<\/p>\n<h3>3.4 韦达定理<\/h3>\n<p>若 x₁、x₂ 是两根，则<\/p>\n<p>x₁+x₂=−b/a，x₁x₂=c/a<\/p>\n<p>由此可以把二次式写成 a(x−x₁)(x−x₂)，这是后面因式分解与降次的依据。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：配方像把一块不规则的地补成一个正方形——补上的那部分正好是 (b/2a)²。<\/p>\n<p><strong>失效边界<\/strong>：配方只在 a≠0 时可行；a=0 时方程退化为一次，没有两个根。<\/p>\n<p><strong>实例<\/strong>：解 2x²−4x−6=0。 两边除以 2：x²−2x−3=0，配方 (x−1)²=4，开方 x−1=±2，得 x=3 或 x=−1。 用韦达检验：和 3+(−1)=2=−b/a=2；积 3×(−1)=−3=c/a=−3。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Δ&lt;0 时方程没有解 —— 实际上 在实数范围内无解；在复数范围内仍有两个根。说“无解”要说明数域。\n<\/li><li>\n别以为 韦达定理只适用于两根都是正数的情况 —— 实际上 对任意实根（包括负数、重根）都成立，只要求 a≠0。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n方程 x²−5x+6=0 的两根是：\n<\/li><li>\n方程 x²+2x+5=0 的根的情况是：\n<p>A. 2 和 3 ｜ B. −2 和 −3 ｜ C. 1 和 6 ｜ D. −1 和 −6 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：因式分解 (x−2)(x−3)=0，或用公式：Δ=1，x=(5±1)/2。 A. 两个不等实根 ｜ B. 两个相等实根 ｜ C. 没有实根 ｜ D. 无法判断 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：Δ=4−20=−16&lt;0，无实根。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n配方 → 开方 → 求根公式\n<\/li><li>\nΔ&gt;0 两不等实根，Δ=0 重根，Δ&lt;0 无实根\n<\/li><li>\n韦达：和 −b/a，积 c/a\n<\/ul>", "ch04": "<h1>第 4 章：二次方程组与可化归方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用代入消元解二元二次方程组\n<\/li><li>\n识别双二次方程并用换元降次\n<\/li><li>\n解分式方程、无理方程并验根\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>遇到高次或复杂方程，先想办法降次或消元；化归之后必须回代验根，因为变形可能扩大定义域。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 二元二次方程组<\/h3>\n<p>常见两类：<\/p>\n<ul><li>\n一个二次、一个一次：由一次式解出一个未知数，代入二次式，得到一元二次方程；\n<\/li><li>\n两个都是二次：若有一式可因式分解成两个一次式，就拆成两组一次方程组分别解。\n<\/ul>\n<h3>4.2 双二次方程<\/h3>\n<p>形如 ax⁴+bx²+c=0。设 t=x²，得 at²+bt+c=0；解出 t 后要求 t≥0，再开方得到 x。<\/p>\n<p>注意：解出的 t 若为负，对应的 x 没有实解，必须舍去。<\/p>\n<h3>4.3 分式方程<\/h3>\n<p>两边同乘最简公分母，化成整式方程。<strong>乘的式子可能为零<\/strong>，所以必须验根：把解代回原方程，分母为零的就是增根，要舍去。<\/p>\n<h3>4.4 无理方程<\/h3>\n<p>把含根号的项单独留在一边，两边平方。平方可能引入不满足原式的解，同样必须验根。<\/p>\n<h3>4.5 化归的通用流程<\/h3>\n<p>识别结构（二次／双二次／分式／无理）→ 选择变形（消元、换元、去分母、平方）→ 解出候选根 → 回代验根 → 写出解集。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：化归像换一条更好走的路到同一个目的地，但换路后要核对地址有没有变。<\/p>\n<p><strong>失效边界<\/strong>：平方与去分母都会扩大定义域，不做验根就可能把“假解”写进答案。<\/p>\n<p><strong>实例<\/strong>：解 √(x+1)=x−1。 两边平方：x+1=x²−2x+1 ⇒ x²−3x=0 ⇒ x=0 或 x=3。 验根：x=0 时左边 1、右边 −1，不成立；x=3 时左边 2、右边 2，成立。所以只有 x=3。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 平方后解出的根都是原方程的解 —— 实际上 平方会把负数变成正数，可能产生不满足原式的根，必须验根。\n<\/li><li>\n别以为 双二次方程解出 t 就可以直接写四个根 —— 实际上 t&lt;0 时 x²=t 无实解，要舍去；只有 t≥0 才能开方。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n方程 x⁴−5x²+4=0 的实根个数是：\n<\/li><li>\n解分式方程时，验根的目的是：\n<p>A. 2 ｜ B. 3 ｜ C. 4 ｜ D. 0 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：设 t=x²：t²−5t+4=0 得 t=1 或 4，均非负，故 x=±1、±2，共 4 个实根。 A. 检查计算是否正确 ｜ B. 排除使分母为零的增根 ｜ C. 确认解是正数 ｜ D. 检查是否为整数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：去分母时乘了含未知数的式子，可能引入使分母为零的根，必须代回原方程排除。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二次方程组：一次式代入，或因式分解拆成一次组\n<\/li><li>\n换元降次后要检查新变量的取值范围\n<\/li><li>\n去分母、平方都要验根\n<\/ul>", "c01": "<h1>同解变形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>两边同时做同一件可逆的事，解集不变；做了不可逆的事（平方、去分母），就要验根。<\/p>\n<h2>为什么重要<\/h2>\n<p>整本书所有解法都建立在“变形不改变解集”上；分不清可逆与不可逆，就会写出增根或丢根。<\/p>\n<h2>详解<\/h2>\n<p>可逆变形包括：两边同加同一个数、同乘同一个非零数、移项、合并同类项。不可逆变形包括：两边平方、两边乘含未知数的式子——它们会把解集扩大，需要回代筛选。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“只要按步骤算，答案一定对”。步骤正确不等于解集正确，关键看每步是否可逆。<\/p>\n<h2>相关概念<\/h2>\n<p>等式性质（ch01）、增根（ch04）<\/p>", "c02": "<h1>判别式与韦达定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Δ=b²−4ac 决定根的个数，韦达给出两根的和与积。<\/p>\n<h2>为什么重要<\/h2>\n<p>不解方程就能判断根的情况、求对称式的值，是二次方程最实用的两条结论。<\/p>\n<h2>详解<\/h2>\n<p>判别式来自配方后右边的符号：右边非负才有实根。韦达定理由求根公式相加、相乘得到，对重根也成立。两者结合可以反求系数、判断根的正负。<\/p>\n<h2>常见误解<\/h2>\n<p>把 Δ 当成“解的大小”；它只说明根的存在与个数，不给出数值。<\/p>\n<h2>相关概念<\/h2>\n<p>求根公式（ch03）、因式分解（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：一元一次方程<\/strong><br>阅读：<a href=\"#/book/equations-1-2/chapter/ch01\">第 1 章：一元一次方程<\/a><br>检查点：能讨论 ax+b=0 的三种解情形<\/li><li class='path-step' id='path-02'><strong>步骤 02：一次方程组<\/strong><br>阅读：<a href=\"#/book/equations-1-2/chapter/ch02\">第 2 章：一次方程组<\/a><br>检查点：能用加减消元解三元方程组<\/li><li class='path-step' id='path-03'><strong>步骤 03：一元二次方程<\/strong><br>阅读：<a href=\"#/book/equations-1-2/chapter/ch03\">第 3 章：一元二次方程<\/a><br>检查点：能默写求根公式并用判别式判断根<\/li><li class='path-step' id='path-04'><strong>步骤 04：二次方程组与可化归方程<\/strong><br>阅读：<a href=\"#/book/equations-1-2/chapter/ch04\">第 4 章：二次方程组与可化归方程<\/a><br>检查点：能消元解二次方程组并验根<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：一元一次方程<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 方程 2(x−1)=x+3 的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> x=1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> x=5<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> x=3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> x=−5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 关于 x 的方程 ax=b，下列说法正确的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 一定有唯一解 x=b/a<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> a=0 时一定无解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> a=0 且 b=0 时任意 x 都是解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> a=0 且 b≠0 时有无穷多解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：一次方程组<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 方程组 x+y=7，x−y=1 的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> x=4，y=3<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> x=3，y=4<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> x=5，y=2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> x=6，y=1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 消元后出现 0=5 这样的式子，说明方程组：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 有唯一解<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 有无穷多解<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 无解<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 解为正数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：一元二次方程<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 方程 x²−5x+6=0 的两根是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 2 和 3<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> −2 和 −3<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 1 和 6<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> −1 和 −6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 方程 x²+2x+5=0 的根的情况是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 两个不等实根<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 两个相等实根<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 没有实根<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 4 章：二次方程组与可化归方程<\/h2><div class='quiz-item' data-qid='ch04-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 方程 x⁴−5x²+4=0 的实根个数是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 解分式方程时，验根的目的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> 检查计算是否正确<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> 排除使分母为零的增根<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> 确认解是正数<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> 检查是否为整数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q9.<\/b> 方程 x²−2x−8=0 的两根之和与两根之积分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 2 和 −8<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> −2 和 −8<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 2 和 8<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> −2 和 8<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q10.<\/b> 若关于 x 的方程 kx²+2x+1=0 有两个不相等的实根，则 k 的取值范围是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> k&lt;1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> k&lt;1 且 k≠0<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> k&gt;1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> k≤1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：一元一次方程<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 方程 2(x−1)=x+3 的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> x=1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> x=5<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> x=3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> x=−5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 关于 x 的方程 ax=b，下列说法正确的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 一定有唯一解 x=b/a<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> a=0 时一定无解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> a=0 且 b=0 时任意 x 都是解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> a=0 且 b≠0 时有无穷多解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：一次方程组<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 方程组 x+y=7，x−y=1 的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> x=4，y=3<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> x=3，y=4<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> x=5，y=2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> x=6，y=1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 消元后出现 0=5 这样的式子，说明方程组：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 有唯一解<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 有无穷多解<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 无解<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 解为正数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：一元二次方程<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 方程 x²−5x+6=0 的两根是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 2 和 3<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> −2 和 −3<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 1 和 6<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> −1 和 −6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 方程 x²+2x+5=0 的根的情况是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 两个不等实根<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 两个相等实根<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 没有实根<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：二次方程组与可化归方程<\/h1><div class='quiz-item' data-qid='ch04-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 方程 x⁴−5x²+4=0 的实根个数是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 解分式方程时，验根的目的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> 检查计算是否正确<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> 排除使分母为零的增根<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> 确认解是正数<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> 检查是否为整数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='方程'>方程 — 含未知数的等式，使等式成立的未知数值叫解。 <span class=glossary-ref>（第 1 章：一元一次方程）<\/span><\/li><li data-term='移项'>移项 — 把项从等式一边移到另一边并变号，本质是两边同加相反数。 <span class=glossary-ref>（第 1 章：一元一次方程）<\/span><\/li><li data-term='消元'>消元 — 通过代入或加减，减少方程组中未知数的个数。 <span class=glossary-ref>（第 2 章：一次方程组）<\/span><\/li><li data-term='配方'>配方 — 把二次式改写成完全平方加常数的形式。 <span class=glossary-ref>（第 3 章：一元二次方程）<\/span><\/li><li data-term='判别式'>判别式 — Δ=b²−4ac，判断二次方程实根个数。 <span class=glossary-ref>（第 3 章：一元二次方程）<\/span><\/li><li data-term='韦达定理'>韦达定理 — 两根之和为 −b/a，两根之积为 c/a。 <span class=glossary-ref>（第 3 章：一元二次方程）<\/span><\/li><li data-term='换元'>换元 — 用一个新变量替换原式中的某部分，达到降次或简化。 <span class=glossary-ref>（第 4 章：二次方程组与可化归方程）<\/span><\/li><li data-term='增根'>增根 — 变形后产生、但不满足原方程的解。 <span class=glossary-ref>（第 4 章：二次方程组与可化归方程）<\/span><\/li><li data-term='验根'>验根 — 把候选解代回原方程，排除增根。 <span class=glossary-ref>（第 4 章：二次方程组与可化归方程）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：解方程的四步<\/h2>\n<p>① 识别类型；② 选变形（移项／消元／配方／换元／去分母／平方）；③ 解出候选根；④ 回代验证（所有不可逆变形都要验）。<\/p>\n<h2>框架：参数讨论<\/h2>\n<p>含参数的方程先化成标准形，再按“最高次项系数是否为零”“判别式符号”分支讨论，不能默认唯一解。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>一元一次<\/td><td>ax+b=0：a≠0 时 x=−b/a；a=0、b≠0 无解；a=0、b=0 任意解<\/td><\/tr><tr><td>求根公式<\/td><td>x=(−b±√(b²−4ac))/(2a)<\/td><\/tr><tr><td>判别式<\/td><td>Δ&gt;0 两不等实根；Δ=0 重根；Δ&lt;0 无实根<\/td><\/tr><tr><td>韦达定理<\/td><td>x₁+x₂=−b/a；x₁x₂=c/a<\/td><\/tr><tr><td>双二次<\/td><td>设 t=x²，解出 t 后要求 t≥0<\/td><\/tr><tr><td>分式方程<\/td><td>去分母 → 解整式方程 → 验根（排除分母为零）<\/td><\/tr><tr><td>无理方程<\/td><td>孤立根号 → 两边平方 → 验根<\/td><\/tr><\/tbody><\/table>"}, 先做除法。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "分解 1/[(x−1)(x−2)] 时，应设为：", "options": ["A/(x−1)+B/(x−2)", "A/(x−1)+B/(x−2)+C", "(Ax+B)/(x−1)(x−2)", "A/[(x−1)(x−2)]"], "answer": 0, "explain": "分母是两个不同的一次因式，各对应一个常数分子的一次分式。"}, {"id": "ch04-q07", "chapterId": "ch04", "type": "single", "question": "化简 √(x²−4x+4) 的结果是：", "options": ["x−2", "|x−2|", "2−x", "x+2"], "answer": 1, "explain": "被开方数是 (x−2)²，开方得绝对值 |x−2|，符号随 x 变化。"}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "把 1/(√5−2) 分母有理化的结果是：", "options": ["√5+2", "(√5+2)/9", "√5−2", "(√5−2)/9"], "answer": 0, "explain": "分子分母同乘 (√5+2)：分母 (√5)²−2²=5−4=1，所以结果为 √5+2。"}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "方程 (x²−1)/(x−1)=2 的解是：", "options": ["x=1", "x=−1", "无解", "x=±1"], "answer": 2, "explain": "约分后 x+1=2 得 x=1，但 x=1 使原分母为零，是增根；原方程无解。"}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "化简 √12+√27−√3 的结果是：", "options": ["4√3", "6√3", "2√3", "√3"], "answer": 0, "explain": "√12=2√3，√27=3√3，合并得 2√3+3√3−√3=4√3。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：有理分式的概念与运算」的一句话核心是什么？", "back": "分式就是两个整式的商；所有运算都受一条约束——分母不能为零。", "tags": ["fractions-radicals", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：分式方程与同解原理」的一句话核心是什么？", "back": "去分母是两边乘含未知数的式子，可能把分母为零的点混进来，所以必须验根。", "tags": ["fractions-radicals", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：部分分式」的一句话核心是什么？", "back": "把一个复杂真分式拆成几个简单分式之和，拆法由分母的因式类型决定。", "tags": ["fractions-radicals", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：根式与算术根」的一句话核心是什么？", "back": "根号表示非负的算术根；化简是把被开方数里的完全平方因子提出来，有理化是消掉分母里的根号。", "tags": ["fractions-radicals", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「有理分式」？", "back": "两个整式的商 A/B，B 含字母且不为零。", "tags": ["fractions-radicals", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「约分」？", "back": "约去分子分母的公因式。", "tags": ["fractions-radicals", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「最简公分母」？", "back": "各分母所有因式最高次幂的乘积。", "tags": ["fractions-radicals", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「增根」？", "back": "变形后产生但不满足原方程的解。", "tags": ["fractions-radicals", "术语"]}, {"id": "f09", "chapterId": "ch03", "front": "什么是「真分式」？", "back": "分子次数低于分母次数的分式。", "tags": ["fractions-radicals", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「部分分式」？", "back": "把真分式拆成的若干简单分式。", "tags": ["fractions-radicals", "术语"]}, {"id": "f11", "chapterId": "ch04", "front": "什么是「算术根」？", "back": "非负的 n 次方根。", "tags": ["fractions-radicals", "术语"]}, {"id": "f12", "chapterId": "ch04", "front": "什么是「分母有理化」？", "back": "通过乘共轭式消去分母中的根号。", "tags": ["fractions-radicals", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「共轭式」？", "back": "√a+√b 与 √a−√b 互为共轭，乘积为 a−b。", "tags": ["fractions-radicals", "术语"]}], "companion": "fractions-radicals学习伴侣.html", "deriv": "fractions-radicals从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：有理分式的概念与运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：整式、因式分解\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出分式有意义的条件\n<\/li><li>\n用基本性质约分、通分\n<\/li><li>\n完成分式的加减乘除并化为最简\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>分式就是两个整式的商；所有运算都受一条约束——分母不能为零。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 分式与定义域<\/h3>\n<p>形如 A/B（A、B 是整式，B 含字母）的式子叫<strong>有理分式<\/strong>。分式有意义的条件是 B≠0。<\/p>\n<p>求定义域就是解 B≠0：例如 1/(x−2) 要求 x≠2；1/(x²−1) 要求 x≠±1。<\/p>\n<h3>1.2 基本性质<\/h3>\n<p>分子分母同乘（或同除）同一个不为零的式子，分式的值不变：<\/p>\n<p>A/B = AC/BC（C≠0）<\/p>\n<p>约分与通分都靠这一条。<\/p>\n<h3>1.3 约分只能约因式<\/h3>\n<p>约分前先因式分解，约掉的是<strong>整个因式<\/strong>，不是某一项。例如<\/p>\n<p>(x²−1)/(x²+x) = (x−1)(x+1)/[x(x+1)] = (x−1)/x<\/p>\n<p>不能把分子分母里的 x 各划掉一个了事。<\/p>\n<h3>1.4 四则运算<\/h3>\n<ul><li>\n乘：分子乘分子、分母乘分母，先约分再乘更省力；\n<\/li><li>\n除：乘以除式的倒数；\n<\/li><li>\n加减：先通分（找最简公分母），再分子相加减。\n<\/ul>\n<p>最简公分母取各分母所有因式的最高次幂之积。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：分式像“按比例配比”，分子分母同时放大缩小，比例不变；但加减项不能随便缩放。<\/p>\n<p><strong>失效边界<\/strong>：基本性质要求乘的式子不为零；乘的式子在某个点为零时，那个点的值要单独讨论。<\/p>\n<p><strong>实例<\/strong>：化简 (x²−4)/(x²−3x+2)。 分子 (x−2)(x+2)；分母 (x−2)(x−1)。约去 (x−2) 得 (x+2)/(x−1)（x≠1 且 x≠2）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 (x+1)/(x+2) 可以约成 1/2 —— 实际上 分子分母是加减关系，不是乘积关系，不能约去 x。只有公因式才能约。\n<\/li><li>\n别以为 分式运算不用管定义域 —— 实际上 约分、通分都可能改变定义域；答案要注明使原式有意义的条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n分式 1/(x²−9) 有意义的条件是：\n<\/li><li>\n化简 (x²−1)/(x²+x) 的结果是：\n<p>A. x≠3 ｜ B. x≠−3 ｜ C. x≠±3 ｜ D. x≠0 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：分母 x²−9=(x−3)(x+3)，要求 x≠3 且 x≠−3。 A. (x−1)/x ｜ B. x−1 ｜ C. 1/x ｜ D. (x+1)/x <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：分子 (x−1)(x+1)，分母 x(x+1)，约去 (x+1) 得 (x−1)/x（x≠0，x≠−1）。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n分式有意义 ⇔ 分母不为零\n<\/li><li>\n约分约因式，不约项\n<\/li><li>\n通分找最简公分母：各因式最高次幂之积\n<\/ul>", "ch02": "<h1>第 2 章：分式方程与同解原理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用去分母把分式方程化为整式方程\n<\/li><li>\n解释增根是怎么产生的\n<\/li><li>\n通过验根写出正确解集\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>去分母是两边乘含未知数的式子，可能把分母为零的点混进来，所以必须验根。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 解法步骤<\/h3>\n<ol><li>\n找最简公分母；\n<\/li><li>\n两边同乘公分母，化成整式方程；\n<\/li><li>\n解整式方程；\n<\/li><li>\n把每个解代回原方程（或检查分母是否为零），排除增根。\n<\/ol>\n<h3>2.2 增根从哪里来<\/h3>\n<p>原方程要求 x≠a（分母零点）。去分母时两边乘了含 (x−a) 的式子，在 x=a 这一点上，原方程两边都没有意义，但乘完之后等式可能成立。于是 x=a 成了“解”，却不满足原方程。<\/p>\n<h3>2.3 一个典型例子<\/h3>\n<p>解 1/(x−1)=2/(x²−1)。 两边乘 (x−1)(x+1)：x+1=2，得 x=1。 但 x=1 使分母为零，是增根，原方程无解。<\/p>\n<h3>2.4 验根不等于重算<\/h3>\n<p>验根只需检查两件事：分母是否为零、代回后两边是否相等。不必把整道题重做一遍。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：去分母像给方程“整体放大”，放大过程中可能把本来不在定义域里的点也放大成解。<\/p>\n<p><strong>失效边界<\/strong>：如果公分母恒不为零（例如只含常数因子），就不会产生增根，但仍建议验根。<\/p>\n<p><strong>实例<\/strong>：解 2/(x−3)=1。 两边乘 (x−3)：2=x−3，得 x=5。验根：分母 5−3=2≠0，成立。解为 x=5。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 解出整式方程的解就是原方程的解 —— 实际上 必须验根；使分母为零的解一律舍去。\n<\/li><li>\n别以为 增根是算错了 —— 实际上 增根不是计算错误，而是变形扩大了定义域，属于方法本身的副作用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n解分式方程产生增根的根本原因是：\n<\/li><li>\n方程 1/(x−2)=0 的解的情况是：\n<p>A. 计算失误 ｜ B. 去分母时乘了含未知数的式子 ｜ C. 方程次数变高 ｜ D. 没有通分 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：乘以含未知数的式子会把原定义域外的点带入等式，使不满足原方程的值成为候选解。 A. x=2 ｜ B. 无解 ｜ C. x=0 ｜ D. 任意实数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：分式的值为零要求分子为零且分母不为零；这里分子恒为 1，故无解。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n去分母 → 解整式方程 → 验根\n<\/li><li>\n增根来自乘了含未知数的式子\n<\/li><li>\n分式为零：分子为零且分母不为零\n<\/ul>", "ch03": "<h1>第 3 章：部分分式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02、待定系数法\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断一个分式是否为真分式\n<\/li><li>\n把分母分解后按类型设部分分式\n<\/li><li>\n用待定系数法求出各项系数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>把一个复杂真分式拆成几个简单分式之和，拆法由分母的因式类型决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 真分式与假分式<\/h3>\n<p>分子次数低于分母次数的叫<strong>真分式<\/strong>；否则叫假分式。假分式先做多项式除法，化成“多项式 + 真分式”，再拆真分式。<\/p>\n<h3>3.2 分母的三种因式<\/h3>\n<ul><li>\n一次因式 (x−a)，对应一项 A/(x−a)；\n<\/li><li>\n重复一次因式 (x−a)^k，对应 A₁/(x−a)+…+A_k/(x−a)^k；\n<\/li><li>\n不可约二次因式 x²+px+q，对应 (Bx+C)/(x²+px+q)。\n<\/ul>\n<h3>3.3 求系数的两条路<\/h3>\n<ol><li>\n<strong>比较系数<\/strong>：通分后比较各次项系数，解线性方程组；\n<\/li><li>\n<strong>代特殊值<\/strong>：把 x 取成各因式的零点，能直接定出一部分系数，剩下的再比较。\n<\/ol>\n<h3>3.4 用途<\/h3>\n<p>拆开之后，每一项都容易积分、容易求和。原书用它处理级数求和，后面的微积分里用它做积分。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：部分分式像把一锅混合汤分成几小碗，每碗只含一种味道，便于单独处理。<\/p>\n<p><strong>失效边界<\/strong>：分母必须先分解到实数范围内的不可约因式；分解不彻底，拆出来的项也对不上。<\/p>\n<p><strong>实例<\/strong>：拆 1/[x(x+1)]。 设 1/[x(x+1)]=A/x+B/(x+1)，通分得 A(x+1)+Bx=1。 取 x=0 得 A=1；取 x=−1 得 B=−1。所以 1/[x(x+1)]=1/x−1/(x+1)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 任何分式都能直接拆成一次项之和 —— 实际上 分母含不可约二次因式时，对应项的分子是一次式 Bx+C，不是常数。\n<\/li><li>\n别以为 部分分式只用于化简 —— 实际上 它的主要用途是积分与级数求和：拆开后每一项都有现成公式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n分式 (x²+1)/(x−1) 属于：\n<\/li><li>\n分解 1/[(x−1)(x−2)] 时，应设为：\n<p>A. 真分式 ｜ B. 假分式 ｜ C. 整式 ｜ D. 无法判断 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：分子次数 2 不低于分母次数 1，是假分式，需先做除法。 A. A/(x−1)+B/(x−2) ｜ B. A/(x−1)+B/(x−2)+C ｜ C. (Ax+B)/(x−1)(x−2) ｜ D. A/[(x−1)(x−2)] <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：分母是两个不同的一次因式，各对应一个常数分子的一次分式。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n真分式：分子次数低于分母\n<\/li><li>\n不同一次因式 → 常数分子；重因式 → 逐次幂；二次因式 → 一次分子\n<\/li><li>\n求系数：比较系数或代零点\n<\/ul>", "ch04": "<h1>第 4 章：根式与算术根<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：开方、绝对值\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n区分方根与算术根，正确使用 √(a²)=|a|\n<\/li><li>\n化简根式、做分母有理化\n<\/li><li>\n解根式方程并验根\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>根号表示非负的算术根；化简是把被开方数里的完全平方因子提出来，有理化是消掉分母里的根号。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 方根与算术根<\/h3>\n<p>x²=a（a&gt;0）有两个根 ±√a；其中非负的那个 √a 叫<strong>算术根<\/strong>。所以 √a 本身永远 ≥0。<\/p>\n<p>由此得到一条常用恒等式：<\/p>\n<p>√(a²)=|a|<\/p>\n<p>a≥0 时等于 a，a&lt;0 时等于 −a。写成 √(a²)=a 是错的。<\/p>\n<h3>4.2 根式的化简<\/h3>\n<p>把被开方数分解出完全平方因子：<\/p>\n<p>√72=√(36×2)=6√2<\/p>\n<p>分母里带根号时，分子分母同乘适当的式子把它消掉，叫<strong>分母有理化<\/strong>：<\/p>\n<p>1/√2=√2/2；1/(√3+√2)=√3−√2<\/p>\n<p>第二条用的是平方差 (√3+√2)(√3−√2)=1。<\/p>\n<h3>4.3 根式的运算<\/h3>\n<p>同次根式可以直接相乘除；不同次要先化成同次。加减只有在根号内部分完全相同时才能合并，如 2√3+5√3=7√3。<\/p>\n<h3>4.4 根式方程<\/h3>\n<p>把根号项单独放一边，两边平方，解出后<strong>必须验根<\/strong>：平方会把负值变成正值，可能引入不满足原式的解。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：根号像“长度的量尺”，量出来永远是非负的；平方再开方，得到的是距离，不是原数的符号。<\/p>\n<p><strong>失效边界<\/strong>：√(a²)=|a| 只对实数成立；在复数范围内开方是多值的，规则不同。<\/p>\n<p><strong>实例<\/strong>：化简 √(x²−6x+9)。 被开方数是 (x−3)²，所以原式 = |x−3|。当 x≥3 时为 x−3，当 x&lt;3 时为 3−x。 若直接写成 x−3，就在 x&lt;3 时算错了。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 √(a²)=a —— 实际上 等于 |a|。a 为负时结果是 −a，因为算术根必须非负。\n<\/li><li>\n别以为 √a+√b=√(a+b) —— 实际上 不成立。取 a=b=1：左边 2，右边 √2。根式不能这样合并。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n化简 √(x²−4x+4) 的结果是：\n<\/li><li>\n把 1/(√5−2) 分母有理化的结果是：\n<p>A. x−2 ｜ B. |x−2| ｜ C. 2−x ｜ D. x+2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：被开方数是 (x−2)²，开方得绝对值 |x−2|，符号随 x 变化。 A. √5+2 ｜ B. (√5+2)/9 ｜ C. √5−2 ｜ D. (√5−2)/9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：分子分母同乘 (√5+2)：分母 (√5)²−2²=5−4=1，所以结果为 √5+2。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n√a≥0；√(a²)=|a|\n<\/li><li>\n化简：提出完全平方因子；有理化：用平方差消分母根号\n<\/li><li>\n根式方程平方后必须验根\n<\/ul>", "c01": "<h1>定义域与增根<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每一步变形都要问：原来不允许的取值，有没有被这一步偷偷放进来。<\/p>\n<h2>为什么重要<\/h2>\n<p>分式与根式的错误大多不是算错，而是忘了定义域；抓住这条，出错率会明显下降。<\/p>\n<h2>详解<\/h2>\n<p>分式要求分母非零，偶次根式要求被开方数非负。去分母、平方这些变形会扩大定义域，因此解完必须回到原式筛一遍。筛的标准只有两条：原式是否有意义、代回是否相等。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“验根”是可省略的步骤。对含未知数的去分母或平方，验根是解法的一部分。<\/p>\n<h2>相关概念<\/h2>\n<p>分式方程（ch02）、根式方程（ch04）<\/p>", "c02": "<h1>部分分式分解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>按分母的因式类型配分子，把真分式拆成简单项之和。<\/p>\n<h2>为什么重要<\/h2>\n<p>拆开之后每一项都能单独处理，是积分与级数求和的标准前置动作。<\/p>\n<h2>详解<\/h2>\n<p>三种类型对应三种设法：不同一次因式配常数；重因式按幂次逐项配；不可约二次因式配一次式。系数用比较系数或代零点求。<\/p>\n<h2>常见误解<\/h2>\n<p>把不可约二次因式也配常数分子，会解不出系数或得到错误分解。<\/p>\n<h2>相关概念<\/h2>\n<p>待定系数法（《整式》ch04）、积分（《微积分初步》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：有理分式的概念与运算<\/strong><br>阅读：<a href=\"#/book/fractions-radicals/chapter/ch01\">第 1 章：有理分式的概念与运算<\/a><br>检查点：能把复杂分式化为最简分式<\/li><li class='path-step' id='path-02'><strong>步骤 02：分式方程与同解原理<\/strong><br>阅读：<a href=\"#/book/fractions-radicals/chapter/ch02\">第 2 章：分式方程与同解原理<\/a><br>检查点：能解分式方程并说明增根来自哪里<\/li><li class='path-step' id='path-03'><strong>步骤 03：部分分式<\/strong><br>阅读：<a href=\"#/book/fractions-radicals/chapter/ch03\">第 3 章：部分分式<\/a><br>检查点：能把真分式拆成简单分式之和<\/li><li class='path-step' id='path-04'><strong>步骤 04：根式与算术根<\/strong><br>阅读：<a href=\"#/book/fractions-radicals/chapter/ch04\">第 4 章：根式与算术根<\/a><br>检查点：能化简根式并做分母有理化<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：有理分式的概念与运算<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 分式 1/(x²−9) 有意义的条件是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> x≠3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> x≠−3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> x≠±3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> x≠0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 化简 (x²−1)/(x²+x) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> (x−1)/x<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> x−1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 1/x<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> (x+1)/x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：分式方程与同解原理<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 解分式方程产生增根的根本原因是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 计算失误<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 去分母时乘了含未知数的式子<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 方程次数变高<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 没有通分<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 方程 1/(x−2)=0 的解的情况是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> x=2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 无解<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> x=0<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 任意实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：部分分式<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 分式 (x²+1)/(x−1) 属于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 真分式<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 假分式<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 整式<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 分解 1/[(x−1)(x−2)] 时，应设为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> A/(x−1)+B/(x−2)<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> A/(x−1)+B/(x−2)+C<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> (Ax+B)/(x−1)(x−2)<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> A/[(x−1)(x−2)]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 4 章：根式与算术根<\/h2><div class='quiz-item' data-qid='ch04-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 化简 √(x²−4x+4) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> x−2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> |x−2|<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> 2−x<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> x+2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 把 1/(√5−2) 分母有理化的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> √5+2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> (√5+2)/9<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> √5−2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> (√5−2)/9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q9.<\/b> 方程 (x²−1)/(x−1)=2 的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> x=1<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> x=−1<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 无解<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> x=±1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q10.<\/b> 化简 √12+√27−√3 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 4√3<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 6√3<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 2√3<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> √3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-fee 测验：第 4 章：根式与算术根<\/h1><div class='quiz-item' data-qid='ch04-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 化简 √(x²−4x+4) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> x−2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> |x−2|<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> 2−x<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> x+2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 把 1/(√5−2) 分母有理化的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> √5+2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> (√5+2)/9<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> √5−2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> (√5−2)/9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='有理分式'>有理分式 — 两个整式的商 A/B，B 含字母且不为零。 <span class=glossary-ref>（第 1 章：有理分式的概念与运算）<\/span><\/li><li data-term='约分'>约分 — 约去分子分母的公因式。 <span class=glossary-ref>（第 1 章：有理分式的概念与运算）<\/span><\/li><li data-term='最简公分母'>最简公分母 — 各分母所有因式最高次幂的乘积。 <span class=glossary-ref>（第 1 章：有理分式的概念与运算）<\/span><\/li><li data-term='增根'>增根 — 变形后产生但不满足原方程的解。 <span class=glossary-ref>（第 2 章：分式方程与同解原理）<\/span><\/li><li data-term='真分式'>真分式 — 分子次数低于分母次数的分式。 <span class=glossary-ref>（第 3 章：部分分式）<\/span><\/li><li data-term='部分分式'>部分分式 — 把真分式拆成的若干简单分式。 <span class=glossary-ref>（第 3 章：部分分式）<\/span><\/li><li data-term='算术根'>算术根 — 非负的 n 次方根。 <span class=glossary-ref>（第 4 章：根式与算术根）<\/span><\/li><li data-term='分母有理化'>分母有理化 — 通过乘共轭式消去分母中的根号。 <span class=glossary-ref>（第 4 章：根式与算术根）<\/span><\/li><li data-term='共轭式'>共轭式 — √a+√b 与 √a−√b 互为共轭，乘积为 a−b。 <span class=glossary-ref>（第 4 章：根式与算术根）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：含分母/根号的四步<\/h2>\n<p>① 写下定义域限制；② 选变形（通分、去分母、有理化、平方）；③ 解出候选解；④ 用定义域与原式筛掉增根。<\/p>\n<h2>框架：拆分的三种模板<\/h2>\n<p>一次因式配常数、重因式按幂配、二次因式配一次式。模板先定，系数后求。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>分式有意义<\/td><td>分母 ≠ 0<\/td><\/tr><tr><td>基本性质<\/td><td>A/B = AC/BC（C≠0）<\/td><\/tr><tr><td>分式方程<\/td><td>去分母 → 解 → 验根<\/td><\/tr><tr><td>部分分式<\/td><td>一次配常数、重因式按幂、二次配一次式<\/td><\/tr><tr><td>算术根<\/td><td>√a ≥ 0；√(a²)=<\/td><td>a<\/td><td><\/td><\/tr><tr><td>有理化<\/td><td>1/(√a+√b)=(√a−√b)/(a−b)<\/td><\/tr><tr><td>根式方程<\/td><td>孤立根号 → 平方 → 验根<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：有理分式的概念与运算", "href": "#/chapter/ch01"}, {"label": "第 2 章：分式方程与同解原理", "href": "#/chapter/ch02"}, {"label": "第 3 章：部分分式", "href": "#/chapter/ch03"}, {"label": "第 4 章：根式与算术根", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "定义域与增根", "href": "#/concept/c01"}, {"label": "部分分式分解", "href": "#/concept/c02"}]}, {"label": "测验", "children": rm": "穿针引线法", "def": "按零点次数在数轴上交替取符号解高次不等式的方法。", "chapterId": "ch02"}, {"term": "重根", "def": "方程中重复出现的根，对应因式的幂次大于 1。", "chapterId": "ch02"}, {"term": "绝对值不等式", "def": "含 |x| 或 |ax+b| 的不等式，按距离意义转化。", "chapterId": "ch03"}, {"term": "无理不等式", "def": "根号内含有未知数的不等式。", "chapterId": "ch03"}, {"term": "比较法", "def": "作差或作商判断大小的证明方法。", "chapterId": "ch04"}, {"term": "分析法", "def": "从结论出发寻找充分条件的证明方法。", "chapterId": "ch04"}, {"term": "基本不等式", "def": "a²+b²≥2ab；(a+b)/2≥√(ab)（a,b>0）。", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "若 a>b，则下列一定成立的是：", "options": ["a²>b²", "−2a>−2b", "a−3>b−3", "1/a>1/b"], "answer": 2, "explain": "两边同减 3 不变号，C 恒成立。A 在 a=1、b=−2 时不成立；B 应变为 −2a<−2b；D 要求同号。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "解不等式 −3x≥6，解集是：", "options": ["x≥−2", "x≤−2", "x≥2", "x≤2"], "answer": 1, "explain": "两边除以 −3（负数），不等号反向：x≤−2。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "不等式 x²−4x+3<0 的解集是：", "options": ["(1,3)", "(−∞,1)∪(3,+∞)", "[1,3]", "(−3,−1)"], "answer": 0, "explain": "(x−1)(x−3)<0，开口向上，两根之间为负，解集 (1,3)。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "不等式 (x−2)²(x+1)>0 的解集是：", "options": ["x>−1", "x>−1 且 x≠2", "x<−1", "全体实数"], "answer": 1, "explain": "x=−1 处穿根、x=2 处偶次不穿；x>−1 且 x≠2 时为正，x=−1 时为零。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "不等式 |x−2|<3 的解集是：", "options": ["(−1,5)", "(−5,−1)", "(2,5)", "(−∞,5)"], "answer": 0, "explain": "到 2 的距离小于 3，即 −3<x−2<3，得 −1<x<5。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "解 √(x−1)<2 时，正确的第一步是：", "options": ["两边平方", "移项", "确定定义域 x≥1", "讨论 x 的正负"], "answer": 2, "explain": "根号要求被开方数非负，先得 x≥1；再平方得 x−1<4，即 x<5，合起来 1≤x<5。"}, {"id": "ch04-q07", "chapterId": "ch04", "type": "single", "question": "用比较法证明 a²+b²≥2ab 时，关键一步是：", "options": ["移项得 a²+b²−2ab≥0", "两边同除 2", "取 a=b=1 验证", "两边开方"], "answer": 0, "explain": "作差后配方得 (a−b)²≥0，这是证明的核心；只代特殊值不算证明。"}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "对正数 a、b，等号成立的条件是：", "options": ["a=b", "a+b=0", "ab=1", "a=2b"], "answer": 0, "explain": "(a+b)/2≥√(ab) 的等号当且仅当 a=b 时成立。"}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "不等式 (x−1)(x+2)>0 的解集是：", "options": ["(−2,1)", "(−∞,−2)∪(1,+∞)", "[−2,1]", "(−∞,1)"], "answer": 1, "explain": "开口向上，两根 −2、1 之外为正。"}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "若 a>b，则下列一定成立的是：", "options": ["a²>b²", "a−c>b−c", "ac>bc", "1/a<1/b"], "answer": 1, "explain": "同减一个数不变号；其余选项在 c 符号不定或 a 为负时不成立。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：不等式的性质与同解变形」的一句话核心是什么？", "back": "不等式只有一条铁律：两边同乘（除）一个负数，不等号方向必须反过来。", "tags": ["inequalities", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：二次不等式与高次不等式」的一句话核心是什么？", "back": "二次不等式的解集由“开口方向 + 零点位置”决定；高次不等式用数轴上的符号变化判断。", "tags": ["inequalities", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：绝对值不等式与无理不等式」的一句话核心是什么？", "back": "绝对值是距离，无理不等式要先保证根号有意义，再平方——两步顺序不能颠倒。", "tags": ["inequalities", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：不等式的证明」的一句话核心是什么？", "back": "证明不等式就是证明“差非负”或“由已知不等式推过来”；分析法从结论倒着找条件。", "tags": ["inequalities", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「同解不等式」？", "back": "解集完全相同的不等式。", "tags": ["inequalities", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「可乘性」？", "back": "两边同乘正数不变号、乘负数变号的性质。", "tags": ["inequalities", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「解集」？", "back": "使不等式成立的所有取值组成的集合。", "tags": ["inequalities", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「穿针引线法」？", "back": "按零点次数在数轴上交替取符号解高次不等式的方法。", "tags": ["inequalities", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「重根」？", "back": "方程中重复出现的根，对应因式的幂次大于 1。", "tags": ["inequalities", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「绝对值不等式」？", "back": "含 |x| 或 |ax+b| 的不等式，按距离意义转化。", "tags": ["inequalities", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「无理不等式」？", "back": "根号内含有未知数的不等式。", "tags": ["inequalities", "术语"]}, {"id": "f12", "chapterId": "ch04", "front": "什么是「比较法」？", "back": "作差或作商判断大小的证明方法。", "tags": ["inequalities", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「分析法」？", "back": "从结论出发寻找充分条件的证明方法。", "tags": ["inequalities", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「基本不等式」？", "back": "a²+b²≥2ab；(a+b)/2≥√(ab)（a,b>0）。", "tags": ["inequalities", "术语"]}], "companion": "inequalities学习伴侣.html", "deriv": "inequalities从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：不等式的性质与同解变形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：实数比较大小、四则运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 a−b 的符号判断大小\n<\/li><li>\n正确使用四条基本性质\n<\/li><li>\n判断两个不等式是否同解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>不等式只有一条铁律：两边同乘（除）一个负数，不等号方向必须反过来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 比较大小的本质<\/h3>\n<p>a&gt;b 等价于 a−b&gt;0。所以比较两个数，就是判断它们的差是正、负还是零。这一条把“比大小”变成了“做减法”，是所有不等式证明的起点。<\/p>\n<h3>1.2 四条基本性质<\/h3>\n<ol><li>\n<strong>传递性<\/strong>：a&gt;b、b&gt;c ⇒ a&gt;c；\n<\/li><li>\n<strong>可加性<\/strong>：a&gt;b ⇒ a+c&gt;b+c；\n<\/li><li>\n<strong>可乘性<\/strong>：a&gt;b、c&gt;0 ⇒ ac&gt;bc；a&gt;b、c&lt;0 ⇒ ac&lt;bc（<strong>变号<\/strong>）；\n<\/li><li>\n<strong>倒数<\/strong>：a&gt;b&gt;0 ⇒ 1/a&lt;1/b（正数取倒数要变号）。\n<\/ol>\n<p>可乘性是最容易出错的一条。c 的符号不确定时，不能直接乘，必须分 c&gt;0、c=0、c&lt;0 讨论。<\/p>\n<h3>1.3 同解变形<\/h3>\n<p>同解指两个不等式解集完全相同。允许的操作：<\/p>\n<ul><li>\n移项（两边同加同一个数）；\n<\/li><li>\n两边同乘（除）同一个正数；\n<\/li><li>\n两边同乘（除）同一个负数，同时把不等号反向。\n<\/ul>\n<p>不允许：两边平方（除非确定两边都非负）、两边乘含未知数的式子（符号不定）。<\/p>\n<h3>1.4 一元一次不等式组<\/h3>\n<p>分别解每个不等式，再取交集。画数轴时用实心点表示含端点（≤、≥），空心点表示不含（&lt;、&gt;）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：不等式像一条“分界线”，变形只是把线挪位置；乘负数相当于照镜子，左右顺序整个翻转。<\/p>\n<p><strong>失效边界<\/strong>：镜子比喻只说明方向翻转，不说明大小变化；乘负数后数值大小也变了。<\/p>\n<p><strong>实例<\/strong>：解 −2x+3&gt;7。 两边减 3：−2x&gt;4；两边除以 −2（负数，变号）：x&lt;−2。解集为 (−∞,−2)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 不等式两边可以随便乘同一个式子 —— 实际上 式子的符号未知时不能直接乘；必须讨论正负，或改用移项、通分。\n<\/li><li>\n别以为 乘以负数只是数值变了，方向不变 —— 实际上 负系数会把大小顺序整个翻转，所以必须变号；漏掉就得到相反的解集。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 a&gt;b，则下列一定成立的是：\n<\/li><li>\n解不等式 −3x≥6，解集是：\n<p>A. a²&gt;b² ｜ B. −2a&gt;−2b ｜ C. a−3&gt;b−3 ｜ D. 1/a&gt;1/b <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：两边同减 3 不变号，C 恒成立。A 在 a=1、b=−2 时不成立；B 应变为 −2a&lt;−2b；D 要求同号。 A. x≥−2 ｜ B. x≤−2 ｜ C. x≥2 ｜ D. x≤2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：两边除以 −3（负数），不等号反向：x≤−2。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na&gt;b ⇔ a−b&gt;0\n<\/li><li>\n乘除负数必须变号\n<\/li><li>\n不等式组取交集，实心点含端点\n<\/ul>", "ch02": "<h1>第 2 章：二次不等式与高次不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、因式分解\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用因式分解与符号表解一元二次不等式\n<\/li><li>\n用穿针引线法解高次不等式\n<\/li><li>\n正确处理含参数与重根情形\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>二次不等式的解集由“开口方向 + 零点位置”决定；高次不等式用数轴上的符号变化判断。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 二次不等式的标准解法<\/h3>\n<p>以 ax²+bx+c&gt;0（a&gt;0）为例：<\/p>\n<ol><li>\n求方程 ax²+bx+c=0 的根 x₁&lt;x₂（判别式 Δ）；\n<\/li><li>\n抛物线开口向上，两根之间为负、两根之外为正；\n<\/li><li>\n所以 &gt;0 的解集是 (−∞,x₁)∪(x₂,+∞)，&lt;0 的解集是 (x₁,x₂)。\n<\/ol>\n<p>口诀只是记忆辅助，真正的依据是抛物线图象。<\/p>\n<p>三种特殊情形：<\/p>\n<ul><li>\nΔ=0：抛物线与 x 轴相切，&gt;0 的解集是除顶点外的所有实数，&lt;0 无解；\n<\/li><li>\nΔ&lt;0 且 a&gt;0：整条抛物线在 x 轴上方，&gt;0 恒成立，&lt;0 无解；\n<\/li><li>\na&lt;0：先两边乘 −1 化成正系数，同时变号。\n<\/ul>\n<h3>2.2 高次不等式：穿针引线<\/h3>\n<p>把多项式分解成一次因式的乘积，把所有零点标在数轴上，从最右端开始画曲线，<strong>奇次根穿过、偶次根不穿<\/strong>，按区间符号写出解集。<\/p>\n<p>例：(x−1)(x−2)²(x+1)&gt;0。零点 −1（1 次）、1（1 次）、2（2 次）。曲线在 2 处不穿，在 1、−1 处穿过。<\/p>\n<h3>2.3 含参数要分类<\/h3>\n<p>含参数的二次不等式要按“首项系数是否为 0”“判别式符号”“两根大小”分层讨论，不能只写一种情形。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：符号表像一条“正负交替的带子”，每过一个奇次零点就翻一次面。<\/p>\n<p><strong>失效边界<\/strong>：穿针法要求因式都已分解到一次（或不可约二次）；未分解时零点不全，结论会错。<\/p>\n<p><strong>实例<\/strong>：解 x²−x−6&lt;0。 因式分解 (x−3)(x+2)&lt;0，零点 −2、3，开口向上，两根之间为负，解集 (−2,3)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 二次不等式一定有解 —— 实际上 Δ&lt;0 且开口向上时，&gt;0 恒成立、&lt;0 无解；并非所有形式都有非空解集。\n<\/li><li>\n别以为 重根也要穿过去 —— 实际上 偶次重根两侧符号相同，曲线不穿过，只是相切折返。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n不等式 x²−4x+3&lt;0 的解集是：\n<\/li><li>\n不等式 (x−2)²(x+1)&gt;0 的解集是：\n<p>A. (1,3) ｜ B. (−∞,1)∪(3,+∞) ｜ C. [1,3] ｜ D. (−3,−1) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：(x−1)(x−3)&lt;0，开口向上，两根之间为负，解集 (1,3)。 A. x&gt;−1 ｜ B. x&gt;−1 且 x≠2 ｜ C. x&lt;−1 ｜ D. 全体实数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：x=−1 处穿根、x=2 处偶次不穿；x&gt;−1 且 x≠2 时为正，x=−1 时为零。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二次不等式看开口与零点：开口向上，两根之外为正\n<\/li><li>\n高次不等式：奇穿偶不穿\n<\/li><li>\n含参数按首项系数、判别式、根大小分层\n<\/ul>", "ch03": "<h1>第 3 章：绝对值不等式与无理不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用几何意义解 |x| 型不等式\n<\/li><li>\n解 |ax+b|&lt;c、&gt;c 两类\n<\/li><li>\n先定定义域再解无理不等式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>绝对值是距离，无理不等式要先保证根号有意义，再平方——两步顺序不能颠倒。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 绝对值的几何意义<\/h3>\n<p>|x| 表示数轴上 x 到原点的距离。于是：<\/p>\n<ul><li>\n|x|&lt;a（a&gt;0）⇔ −a&lt;x&lt;a；\n<\/li><li>\n|x|&gt;a（a&gt;0）⇔ x&lt;−a 或 x&gt;a。\n<\/ul>\n<p>把 x 换成 x−c，就是“到 c 的距离”。<\/p>\n<h3>3.2 一般形式<\/h3>\n<p>|ax+b|&lt;c（c&gt;0）⇔ −c&lt;ax+b&lt;c；<\/p>\n<p>|ax+b|&gt;c（c&gt;0）⇔ ax+b&lt;−c 或 ax+b&gt;c。<\/p>\n<p>c≤0 时要单独看：|…|&lt;c 无解，|…|&gt;c 对使式子有意义的 x 恒成立（c&lt;0）或需排除零点（c=0）。<\/p>\n<h3>3.3 无理不等式的两步<\/h3>\n<p>第一步：定定义域（偶次根号下非负）。 第二步：两边平方，但只有在两边都非负时才等价。<\/p>\n<p>例：√(x+2)&lt;x。 定义域 x≥−2；右边要求 x&gt;0 才能平方（否则负数小于正根号一定成立，直接给出解）。 平方得 x+2&lt;x²，即 x²−x−2&gt;0，x&gt;2 或 x&lt;−1。结合 x&gt;0 与 x≥−2，得 x&gt;2。 还要单独检查 x∈[−2,0]：此时右边 ≤0，左边 ≥0，不等式不成立，故无解。合起来解集 (2,+∞)。<\/p>\n<h3>3.4 常见结构<\/h3>\n<ul><li>\n√A &lt; B：需要 B&gt;0 且 A&lt;B²，同时 A≥0；\n<\/li><li>\n√A &gt; B：分 B&lt;0（只需 A≥0）与 B≥0（A&gt;B²）两种。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：绝对值像“到某地的距离”，无理不等式像“先确认尺子能量，再比长度”。<\/p>\n<p><strong>失效边界<\/strong>：平方只保“非负”的大小关系；两边符号不明时平方会引入错误解。<\/p>\n<p><strong>实例<\/strong>：解 |2x−1|≤5。 −5≤2x−1≤5 ⇒ −4≤2x≤6 ⇒ −2≤x≤3。解集 [−2,3]。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 |x|&gt;a 就是 x&gt;a —— 实际上 漏了 x&lt;−a 这一支。绝对值大，可能是“很正的”也可能是“很负的”。\n<\/li><li>\n别以为 无理不等式直接平方就行 —— 实际上 必须先定定义域，并确认两边非负；否则平方会引入不满足原式的解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n不等式 |x−2|&lt;3 的解集是：\n<\/li><li>\n解 √(x−1)&lt;2 时，正确的第一步是：\n<p>A. (−1,5) ｜ B. (−5,−1) ｜ C. (2,5) ｜ D. (−∞,5) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：到 2 的距离小于 3，即 −3&lt;x−2&lt;3，得 −1&lt;x&lt;5。 A. 两边平方 ｜ B. 移项 ｜ C. 确定定义域 x≥1 ｜ D. 讨论 x 的正负 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：根号要求被开方数非负，先得 x≥1；再平方得 x−1&lt;4，即 x&lt;5，合起来 1≤x&lt;5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n|x−c|&lt;a ⇔ c−a&lt;x&lt;c+a\n<\/li><li>\n无理不等式：先定义域，再判断两边非负，最后平方\n<\/li><li>\n√A&lt;B 需 B&gt;0 且 A&lt;B²\n<\/ul>", "ch04": "<h1>第 4 章：不等式的证明<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用比较法（作差、作商）证明不等式\n<\/li><li>\n用综合法与分析法各写一段完整推理\n<\/li><li>\n正确使用基本不等式并说明等号条件\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>证明不等式就是证明“差非负”或“由已知不等式推过来”；分析法从结论倒着找条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 比较法<\/h3>\n<p>要证 A≥B，作差 A−B，证明它非负（配方、因式分解、判别式）。要证 A≥B&gt;0，也可作商 A/B 与 1 比较。<\/p>\n<p>例：证 a²+b²≥2ab。作差：a²−2ab+b²=(a−b)²≥0，等号当且仅当 a=b。<\/p>\n<h3>4.2 综合法<\/h3>\n<p>从已知成立的不等式出发，按“由因导果”的顺序推到结论。常用已知：基本不等式、|a|+|b|≥|a+b|、均值不等式。<\/p>\n<h3>4.3 分析法<\/h3>\n<p>从结论出发，寻找使它成立的充分条件，一直追到已知事实。书写时常用“要证……只需证……”，每一步都必须可逆或充分。<\/p>\n<p>例：证 √2+√7&lt;√3+√6。两边平方后比较 9+2√14 与 9+2√18，只需证 √14&lt;√18，显然成立。<\/p>\n<h3>4.4 基本不等式与等号条件<\/h3>\n<p>a²+b²≥2ab 对一切实数成立，等号当 a=b。<\/p>\n<p>对正数 a、b，有 (a+b)/2≥√(ab)，等号当 a=b。使用时必须确认 a、b 为正，并检查等号能否取到——取不到时只能得到严格不等式。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：比较法是“称重量”，综合法是“顺着链条推”，分析法是“从终点倒着找路”。<\/p>\n<p><strong>失效边界<\/strong>：分析法每步必须充分；把“只需”写成“等价”而不检查可逆，会证出假命题。<\/p>\n<p><strong>实例<\/strong>：证 对任意实数 x，x²+2x+3&gt;0。 配方：x²+2x+3=(x+1)²+2≥2&gt;0。等号取不到，故严格成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 用基本不等式不用检查等号条件 —— 实际上 等号条件决定不等式能否取到等值；取不到时结论仍是严格不等，但最值结论会变。\n<\/li><li>\n别以为 分析法可以随便写“只需证” —— 实际上 每一步必须真的充分；写成不充分的条件等于没有证明。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用比较法证明 a²+b²≥2ab 时，关键一步是：\n<\/li><li>\n对正数 a、b，等号成立的条件是：\n<p>A. 移项得 a²+b²−2ab≥0 ｜ B. 两边同除 2 ｜ C. 取 a=b=1 验证 ｜ D. 两边开方 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：作差后配方得 (a−b)²≥0，这是证明的核心；只代特殊值不算证明。 A. a=b ｜ B. a+b=0 ｜ C. ab=1 ｜ D. a=2b <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：(a+b)/2≥√(ab) 的等号当且仅当 a=b 时成立。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n比较法：作差判符号（可配方、因式分解）\n<\/li><li>\n分析法：从结论找充分条件，每步须充分\n<\/li><li>\n基本不等式使用前先确认正数与等号条件\n<\/ul>", "c01": "<h1>同解变形与变号<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>两边同乘负数，不等号反向；这一步错，整道题的解集就反了。<\/p>\n<h2>为什么重要<\/h2>\n<p>不等式解法全部由同解变形组成，变号是最容易出错也最容易检查的一步。<\/p>\n<h2>详解<\/h2>\n<p>允许的同解操作：移项、同乘除正数、同乘除负数并变号。禁止的操作：两边平方（除确定非负）、乘含未知数且符号不定的式子。检查办法：把解集端点代回原不等式，看是否恰好取到边界。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“乘以 −1 只是把式子反过来写”，忘了同时要变号。<\/p>\n<h2>相关概念<\/h2>\n<p>基本性质（ch01）、绝对值不等式（ch03）<\/p>", "c02": "<h1>符号表与穿针引线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把零点排在数轴上，按因式的次数决定穿或不穿，每一段的符号就定了。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是解二次、高次不等式的通用方法，比背口诀可靠。<\/p>\n<h2>详解<\/h2>\n<p>步骤：分解到一次因式 → 标零点 → 从最右段取一个测试点定符号 → 按奇穿偶不穿依次翻面 → 按不等号方向取区间。含参数时额外讨论首项系数与重根。<\/p>\n<h2>常见误解<\/h2>\n<p>把偶次重根也当穿过点，导致区间符号整体错位。<\/p>\n<h2>相关概念<\/h2>\n<p>二次不等式（ch02）、因式分解（《整式》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：性质与同解变形<\/strong><br>阅读：<a href=\"#/book/inequalities/chapter/ch01\">第 1 章：不等式的性质与同解变形<\/a><br>检查点：能说明两边乘负数为什么要变号<\/li><li class='path-step' id='path-02'><strong>步骤 02：二次与高次不等式<\/strong><br>阅读：<a href=\"#/book/inequalities/chapter/ch02\">第 2 章：二次不等式与高次不等式<\/a><br>检查点：能用符号表写出解集<\/li><li class='path-step' id='path-03'><strong>步骤 03：绝对值与无理不等式<\/strong><br>阅读：<a href=\"#/book/inequalities/chapter/ch03\">第 3 章：绝对值不等式与无理不等式<\/a><br>检查点：能先定定义域再解无理不等式<\/li><li class='path-step' id='path-04'><strong>步骤 04：不等式的证明<\/strong><br>阅读：<a href=\"#/book/inequalities/chapter/ch04\">第 4 章：不等式的证明<\/a><br>检查点：能用比较法与综合法各证一题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：不等式的性质与同解变形<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 若 a&gt;b，则下列一定成立的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> a²&gt;b²<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> −2a&gt;−2b<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> a−3&gt;b−3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 1/a&gt;1/b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 解不等式 −3x≥6，解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> x≥−2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> x≤−2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> x≥2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> x≤2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：二次不等式与高次不等式<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 不等式 x²−4x+3&lt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> (1,3)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> (−∞,1)∪(3,+∞)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> [1,3]<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> (−3,−1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 不等式 (x−2)²(x+1)&gt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> x&gt;−1<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> x&gt;−1 且 x≠2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> x&lt;−1<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 全体实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：绝对值不等式与无理不等式<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 不等式 |x−2|&lt;3 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> (−1,5)<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> (−5,−1)<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> (2,5)<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> (−∞,5)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 解 √(x−1)&lt;2 时，正确的第一步是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 两边平方<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 移项<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 确定定义域 x≥1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 讨论 x 的正负<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 4 章：不等式的证明<\/h2><div class='quiz-item' data-qid='ch04-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 用比较法证明 a²+b²≥2ab 时，关键一步是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> 移项得 a²+b²−2ab≥0<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> 两边同除 2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> 取 a=b=1 验证<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> 两边开方<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 对正数 a、b，等号成立的条件是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> a=b<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> a+b=0<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> ab=1<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> a=2b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q9.<\/b> 不等式 (x−1)(x+2)&gt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> (−2,1)<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> (−∞,−2)∪(1,+∞)<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> [−2,1]<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> (−∞,1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q10.<\/b> 若 a&gt;b，则下列一定成立的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> a²&gt;b²<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> a−c&gt;b−c<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> ac&gt;bc<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 1/a&lt;1/b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：不等式的性质与同解变形<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 若 a&gt;b，则下列一定成立的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> a²&gt;b²<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> −2a&gt;−2b<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> a−3&gt;b−3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 1/a&gt;1/b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 解不等式 −3x≥6，解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> x≥−2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> x≤−2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> x≥2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> x≤2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：二次不等式与高次不等式<\/h1><div class='quiz-item' data-qid='ch02-q03' x−1)&lt;2 时，正确的第一步是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 两边平方<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 移项<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 确定定义域 x≥1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 讨论 x 的正负<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：不等式的证明<\/h1><div class='quiz-item' data-qid='ch04-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 用比较法证明 a²+b²≥2ab 时，关键一步是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> 移项得 a²+b²−2ab≥0<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> 两边同除 2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> 取 a=b=1 验证<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> 两边开方<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 对正数 a、b，等号成立的条件是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> a=b<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> a+b=0<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> ab=1<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> a=2b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='同解不等式'>同解不等式 — 解集完全相同的不等式。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='可乘性'>可乘性 — 两边同乘正数不变号、乘负数变号的性质。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='解集'>解集 — 使不等式成立的所有取值组成的集合。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='穿针引线法'>穿针引线法 — 按零点次数在数轴上交替取符号解高次不等式的方法。 <span class=glossary-ref>（第 2 章：二次不等式与高次不等式）<\/span><\/li><li data-term='重根'>重根 — 方程中重复出现的根，对应因式的幂次大于 1。 <span class=glossary-ref>（第 2 章：二次不等式与高次不等式）<\/span><\/li><li data-term='绝对值不等式'>绝对值不等式 — 含 |x| 或 |ax+b| 的不等式，按距离意义转化。 <span class=glossary-ref>（第 3 章：绝对值不等式与无理不等式）<\/span><\/li><li data-term='无理不等式'>无理不等式 — 根号内含有未知数的不等式。 <span class=glossary-ref>（第 3 章：绝对值不等式与无理不等式）<\/span><\/li><li data-term='比较法'>比较法 — 作差或作商判断大小的证明方法。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><li data-term='分析法'>分析法 — 从结论出发寻找充分条件的证明方法。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><li data-term='基本不等式'>基本不等式 — a²+b²≥2ab；(a+b)/2≥√(ab)（a,b&gt;0）。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：解不等式的四步<\/h2>\n<p>① 定定义域；② 移项整理成标准形；③ 求零点、画符号表；④ 按不等号方向取区间并检查端点。<\/p>\n<h2>框架：证明的三选一<\/h2>\n<p>结构简单作差；已知不等式多则综合；结论复杂则分析。选错方法会绕远路。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>乘负数<\/td><td>不等号反向<\/td><\/tr><tr><td>二次不等式 a&gt;0<\/td><td>&gt;0 取两根之外，&lt;0 取两根之间<\/td><\/tr><tr><td>高次不等式<\/td><td>奇穿偶不穿，从最右段定符号<\/td><\/tr><tr><td>绝对值<\/td><td><\/td><td>x<\/td><td>&lt;a ⇔ −a&lt;x&lt;a；<\/td><td>x<\/td><td>&gt;a ⇔ x&lt;−a 或 x&gt;a<\/td><\/tr><tr><td>无理不等式<\/td><td>先定义域，再判两边非负，最后平方<\/td><\/tr><tr><td>基本不等式<\/td><td>a²+b²≥2ab；等号 a=b<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：不等式的性质与同解变形", "href": "#/chapter/ch01"}, {"label": "第 2 章：二次不等式与高次不等式", "href": "#/chapter/ch02"}, {"label": "第 3 章：绝对值不等式与无理不等式", "href": "#/chapter/ch03"}, {"label": "第 4 章：不等式的证明", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "同解变形与变号", "href": "#/concept/c01"}, {"label": "符号表与穿针引线", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：不等式的性质与同解变形", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：二次不等式与高次不等式", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：绝对值不等式与无理不等式", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：不等式的证明", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true, "ch04": true}},"linear-quadratic-functions":{"manifest": {"slug": "linear-quadratic-functions", "title": "一次函数与二次函数", "subtitle": "从对应关系出发：一次是直的，二次是弯的", "book": {"title": "一次函数与二次函数", "author": "华昌年", "source": ["数学基础知识丛书-06-一次函数与二次函数 华昌年.pdf"]}, "audience": "零基础", "goal": "理解函数的对应本质，会用解析式、表格、图象三种方式表示函数，掌握一次函数与二次函数的图象、性质与最值。", "learningPath": [{"step": "01", "title": "函数与图象", "chapterIds": ["ch01"], "checkpoint": "能由一个对应关系写出定义域并画出草图"}, {"step": "02", "title": "一次函数", "chapterIds": ["ch02"], "checkpoint": "能由 k、b 判断增减与截距"}, {"step": "03", "title": "二次函数与变化率", "chapterIds": ["ch03"], "checkpoint": "能求顶点、最值、零点并解释变化率"}], "chapters": [{"id": "ch01", "title": "第 1 章：函数与图象", "file": "chapters/ch01-function-ima
