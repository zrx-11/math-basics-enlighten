er": 1, "explain": "−30°+360°=330°。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "150° 化为弧度是：", "options": ["5π/6", "2π/3", "3π/4", "7π/6"], "answer": 0, "explain": "150°=150×π/180=5π/6。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "sin210° 的值是：", "options": ["1/2", "−1/2", "√3/2", "−√3/2"], "answer": 1, "explain": "sin210°=sin(180°+30°)=−sin30°=−1/2。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：", "options": ["4/5", "−4/5", "3/5", "−3/5"], "answer": 1, "explain": "第三象限正弦为负，sinθ=−√(1−9/25)=−4/5。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "cos(α+β) 展开为：", "options": ["cosαcosβ+sinαsinβ", "cosαcosβ−sinαsinβ", "sinαcosβ+cosαsinβ", "sinαcosβ−cosαsinβ"], "answer": 1, "explain": "余弦和角公式为 cosαcosβ−sinαsinβ。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "sin2α 等于：", "options": ["2sinα", "2sinαcosα", "sin²α−cos²α", "1−2sin²α"], "answer": 1, "explain": "二倍角正弦公式为 2sinαcosα。"}, {"id": "ch04-q07", "chapterId": "ch04", "type": "single", "question": "y=2sin(3x) 的周期是：", "options": ["2π", "2π/3", "3π", "π/3"], "answer": 1, "explain": "T=2π/|ω|=2π/3。"}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "方程 cosx=0 的通解是：", "options": ["x=kπ", "x=π/2+kπ", "x=2kπ", "x=π/4+kπ"], "answer": 1, "explain": "余弦为零的角是 π/2 的奇数倍，即 x=π/2+kπ。"}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "sin(π/6) 的值是：", "options": ["1/2", "√3/2", "√2/2", "1"], "answer": 0, "explain": "π/6=30°，sin30°=1/2。"}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "y=sin(2x−π/3) 的周期是：", "options": ["π", "2π", "π/2", "4π"], "answer": 0, "explain": "T=2π/2=π。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：角、弧度与三角比」的一句话核心是什么？", "back": "角不再限于 0°~90°：它可以任意大、可以为负；三角比由单位圆上点的坐标定义。", "tags": ["trigonometry", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：同角关系与诱导公式」的一句话核心是什么？", "back": "同角关系管“同一个角的三种比”，诱导公式管“不同角的同名比”。", "tags": ["trigonometry", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：加法定理与倍角公式」的一句话核心是什么？", "back": "所有和角、倍角公式都由一条出发：cos(α−β)=cosαcosβ+sinαsinβ。", "tags": ["trigonometry", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：图象、性质与三角方程」的一句话核心是什么？", "back": "正弦、余弦的周期是 2π，正切是 π；图象的平移伸缩都写在 A、ω、φ 三个参数里。", "tags": ["trigonometry", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「弧度」？", "back": "弧长与半径之比定义的角的度量。", "tags": ["trigonometry", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「终边相同的角」？", "back": "相差 360° 整数倍的角。", "tags": ["trigonometry", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「正弦」？", "back": "单位圆上角的终边交点的纵坐标。", "tags": ["trigonometry", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「余弦」？", "back": "单位圆上角的终边交点的横坐标。", "tags": ["trigonometry", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「诱导公式」？", "back": "把任意角三角比化为锐角三角比的公式。", "tags": ["trigonometry", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「加法定理」？", "back": "展开 α±β 三角比的公式。", "tags": ["trigonometry", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「二倍角公式」？", "back": "sin2α、cos2α、tan2α 的公式。", "tags": ["trigonometry", "术语"]}, {"id": "f12", "chapterId": "ch04", "front": "什么是「周期」？", "back": "函数值重复出现的最小正间隔。", "tags": ["trigonometry", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「振幅」？", "back": "y=A sin(ωx+φ) 中的 |A|。", "tags": ["trigonometry", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「通解」？", "back": "含整数 k、表示全部解的表达式。", "tags": ["trigonometry", "术语"]}], "companion": "trigonometry学习伴侣.html", "deriv": "trigonometry从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：角、弧度与三角比<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：相似、坐标\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把任意角化到 0°~360°并判断象限\n<\/li><li>\n完成角度与弧度的互化\n<\/li><li>\n用单位圆写出三角比的定义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>角不再限于 0°~90°：它可以任意大、可以为负；三角比由单位圆上点的坐标定义。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 任意角<\/h3>\n<p>射线绕端点旋转形成角：逆时针为正，顺时针为负，转多圈就是大于 360° 的角。<\/p>\n<p>与角 α 终边相同的角可写成 α+k·360°（k 为整数）。判断象限时，先把角化到 0°~360°。<\/p>\n<h3>1.2 弧度制<\/h3>\n<p>弧长与半径之比定义为角的弧度数：θ=l/r。整圆周长 2πr，故 360°=2π 弧度，180°=π 弧度。<\/p>\n<p>互化：1°=π/180 弧度；1 弧度=(180/π)°≈57.3°。<\/p>\n<p>用弧度后，弧长 l=rθ、扇形面积 S=(1/2)r²θ 都不必再带度数符号。<\/p>\n<h3>1.3 单位圆定义<\/h3>\n<p>在单位圆上，角 θ 的终边与圆交于点 P(x,y)，则<\/p>\n<p>cosθ=x，sinθ=y，tanθ=y/x（x≠0）<\/p>\n<p>这个定义对任意角都成立，正负号由所在象限决定：一全正、二正弦正、三正切正、四余弦正。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：单位圆像一块钟面，角就是指针转过的角度，坐标就是指针末端的横纵位置。<\/p>\n<p><strong>失效边界<\/strong>：tan 在 x=0（即 90°、270° 等）处无定义，不能硬算。<\/p>\n<p><strong>实例<\/strong>：−30° 与 330° 终边相同，都在第四象限；sin(−30°)=−1/2，cos(−30°)=√3/2。 5π/6 弧度=150°，在第二象限，sin 为正、cos 为负。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 角只能在 0°到 360°之间 —— 实际上 角可以任意大，也可以为负；终边相同的角有无穷多个。\n<\/li><li>\n别以为 sin30° 与 sin(30 弧度) 一样 —— 实际上 一个是角度制，一个是弧度制，数值完全不同，必须标明单位。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n与 −30° 终边相同的角是：\n<\/li><li>\n150° 化为弧度是：\n<p>A. 30° ｜ B. 330° ｜ C. 300° ｜ D. 150° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：−30°+360°=330°。 A. 5π/6 ｜ B. 2π/3 ｜ C. 3π/4 ｜ D. 7π/6 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：150°=150×π/180=5π/6。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n逆时针为正，顺时针为负；终边相同角相差 360° 的整数倍\n<\/li><li>\n180°=π 弧度\n<\/li><li>\n单位圆：cos=x，sin=y，tan=y/x\n<\/ul>", "ch02": "<h1>第 2 章：同角关系与诱导公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用平方关系与商关系化简\n<\/li><li>\n用诱导公式把任意角化到锐角\n<\/li><li>\n根据象限确定符号\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同角关系管“同一个角的三种比”，诱导公式管“不同角的同名比”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 同角关系<\/h3>\n<p>sin²θ+cos²θ=1；tanθ=sinθ/cosθ（cosθ≠0）；1+tan²θ=1/cos²θ。<\/p>\n<p>用法：已知一个比求另外两个，先定符号（看象限），再用平方关系。<\/p>\n<h3>2.2 诱导公式<\/h3>\n<p>把 k·90°±θ 或 180°±θ、360°−θ 的三角比化为 θ 的三角比：<\/p>\n<ul><li>\nsin(180°−θ)=sinθ，cos(180°−θ)=−cosθ；\n<\/li><li>\nsin(180°+θ)=−sinθ，cos(180°+θ)=−cosθ；\n<\/li><li>\nsin(−θ)=−sinθ，cos(−θ)=cosθ；\n<\/li><li>\nsin(90°−θ)=cosθ，cos(90°−θ)=sinθ。\n<\/ul>\n<p>口诀“奇变偶不变，符号看象限”：k 为奇数时函数名互换，为偶数时不变；符号按原角所在象限判断。<\/p>\n<h3>2.3 化简策略<\/h3>\n<p>先把所有角化到锐角，再统一函数名，最后用平方关系或商关系合并。步骤写全，符号不要跳。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：诱导公式像“角的搬运工”：把远处的角搬到第一象限再算，符号留在原地。<\/p>\n<p><strong>失效边界<\/strong>：口诀只适用于 90° 的整数倍加减；任意角要先化成这种形式。<\/p>\n<p><strong>实例<\/strong>：sin150°=sin(180°−30°)=sin30°=1/2；cos240°=cos(180°+60°)=−cos60°=−1/2。 已知 sinθ=3/5 且 θ 在第二象限，则 cosθ=−4/5，tanθ=−3/4。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 sin(180°−θ)=−sinθ —— 实际上 应为 sinθ；正弦在第二象限为正，符号判断要看象限。\n<\/li><li>\n别以为 同角关系中可以随意开方 —— 实际上 开方要带 ±，符号必须由象限确定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nsin210° 的值是：\n<\/li><li>\n已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：\n<p>A. 1/2 ｜ B. −1/2 ｜ C. √3/2 ｜ D. −√3/2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：sin210°=sin(180°+30°)=−sin30°=−1/2。 A. 4/5 ｜ B. −4/5 ｜ C. 3/5 ｜ D. −3/5 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：第三象限正弦为负，sinθ=−√(1−9/25)=−4/5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsin²+cos²=1；tan=sin/cos\n<\/li><li>\n诱导公式：奇变偶不变，符号看象限\n<\/li><li>\n开方取符号要看象限\n<\/ul>", "ch03": "<h1>第 3 章：加法定理与倍角公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n默写和角、差角公式\n<\/li><li>\n推导二倍角公式\n<\/li><li>\n用公式化简求值\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>所有和角、倍角公式都由一条出发：cos(α−β)=cosαcosβ+sinαsinβ。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 和角与差角<\/h3>\n<p>cos(α±β)=cosαcosβ∓sinαsinβ sin(α±β)=sinαcosβ±cosαsinβ tan(α±β)=(tanα±tanβ)/(1∓tanαtanβ)<\/p>\n<p>推导思路：在单位圆上取两点，用两点距离公式与余弦定理，令两点夹角为 α−β，展开即得 cos(α−β)。其余公式由它推出。<\/p>\n<h3>3.2 二倍角<\/h3>\n<p>令 β=α：<\/p>\n<p>sin2α=2sinαcosα cos2α=cos²α−sin²α=2cos²α−1=1−2sin²α tan2α=2tanα/(1−tan²α)<\/p>\n<p>cos2α 的三个形式各有用途：求值时选能约掉的，降幂时用 2cos²α−1 或 1−2sin²α。<\/p>\n<h3>3.3 半角与降幂<\/h3>\n<p>由 cos2α=1−2sin²α 得 sin²α=(1−cos2α)/2；由 cos2α=2cos²α−1 得 cos²α=(1+cos2α)/2。<\/p>\n<p>这两条是“降幂公式”，把平方降成一次，是化简与积分的基础。<\/p>\n<h3>3.4 辅助角公式<\/h3>\n<p>a sinx+b cosx=√(a²+b²) sin(x+φ)，其中 tanφ=b/a。它把两项合成一项，便于求最值与周期。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：加法定理像“两个旋转叠加”：先转 α 再转 β，等于一次转 α+β，但要用坐标的混合表示。<\/p>\n<p><strong>失效边界<\/strong>：tan 的公式要求分母不为零，α±β 不能等于 90° 的奇数倍。<\/p>\n<p><strong>实例<\/strong>：sin75°=sin(45°+30°)=sin45°cos30°+cos45°sin30°=(√6+√2)/4≈0.966。 cos60°=cos(2×30°)=1−2sin²30°=1−1/2=1/2，验证正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 sin(α+β)=sinα+sinβ —— 实际上 不成立。取 α=β=30°：左边 sin60°≈0.866，右边 1。\n<\/li><li>\n别以为 cos2α 只有一个形式 —— 实际上 有三个等价形式，按题目需要选用，选错会增加计算量。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ncos(α+β) 展开为：\n<\/li><li>\nsin2α 等于：\n<p>A. cosαcosβ+sinαsinβ ｜ B. cosαcosβ−sinαsinβ ｜ C. sinαcosβ+cosαsinβ ｜ D. sinαcosβ−cosαsinβ <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：余弦和角公式为 cosαcosβ−sinαsinβ。 A. 2sinα ｜ B. 2sinαcosα ｜ C. sin²α−cos²α ｜ D. 1−2sin²α <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：二倍角正弦公式为 2sinαcosα。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ncos(α±β)=cosαcosβ∓sinαsinβ\n<\/li><li>\nsin2α=2sinαcosα；cos2α 有三种形式\n<\/li><li>\n降幂：sin²=(1−cos2α)/2\n<\/ul>", "ch04": "<h1>第 4 章：图象、性质与三角方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n画出三种三角函数的图象并说出周期、对称性\n<\/li><li>\n分析 y=A sin(ωx+φ) 的振幅、周期、相位\n<\/li><li>\n写出简单三角方程的通解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>正弦、余弦的周期是 2π，正切是 π；图象的平移伸缩都写在 A、ω、φ 三个参数里。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 三种基本图象<\/h3>\n<ul><li>\ny=sin x：定义域 R，值域 [−1,1]，周期 2π，奇函数，对称中心 (kπ,0)，对称轴 x=π/2+kπ；\n<\/li><li>\ny=cos x：值域 [−1,1]，周期 2π，偶函数，对称轴 x=kπ；\n<\/li><li>\ny=tan x：定义域 x≠π/2+kπ，值域 R，周期 π，奇函数，无对称轴。\n<\/ul>\n<h3>4.2 一般形式 y=A sin(ωx+φ)+k<\/h3>\n<ul><li>\nA 是振幅（图象高度），|A| 越大越“高”；\n<\/li><li>\nω 决定周期 T=2π/|ω|；\n<\/li><li>\nφ 是初相，决定左右平移：左移 φ/ω（φ&gt;0 时）；\n<\/li><li>\nk 是上下平移。\n<\/ul>\n<p>五点法画图：取 ωx+φ=0、π/2、π、3π/2、2π 五个点，描出后再连线。<\/p>\n<h3>4.3 三角方程<\/h3>\n<p>sinx=a（|a|≤1）的通解：x=kπ+(−1)^k arcsin a；也可写成 x=arcsin a+2kπ 或 x=π−arcsin a+2kπ。<\/p>\n<p>cosx=a 的通解：x=±arccos a+2kπ。<\/p>\n<p>tanx=a 的通解：x=arctan a+kπ。<\/p>\n<p>求通解后，若题目限定区间，再把 k 取遍并筛出落在区间内的解。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：正弦曲线像水波，振幅是波高，周期是两波峰的距离，相位是波从哪里开始。<\/p>\n<p><strong>失效边界<\/strong>：ω 必须取正再谈周期；ω 为负时先提出负号，否则平移方向会反。<\/p>\n<p><strong>实例<\/strong>：y=3sin(2x+π/3)：振幅 3，周期 2π/2=π，初相 π/3，图象左移 π/6。 解 sinx=1/2：x=π/6+2kπ 或 x=5π/6+2kπ。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 周期只与 A 有关 —— 实际上 周期由 ω 决定，T=2π/|ω|；A 只改变高度。\n<\/li><li>\n别以为 三角方程只有一个解 —— 实际上 在实数范围内有无穷多解，必须写通解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny=2sin(3x) 的周期是：\n<\/li><li>\n方程 cosx=0 的通解是：\n<p>A. 2π ｜ B. 2π/3 ｜ C. 3π ｜ D. π/3 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：T=2π/|ω|=2π/3。 A. x=kπ ｜ B. x=π/2+kπ ｜ C. x=2kπ ｜ D. x=π/4+kπ <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：余弦为零的角是 π/2 的奇数倍，即 x=π/2+kπ。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsin、cos 周期 2π，tan 周期 π\n<\/li><li>\ny=A sin(ωx+φ)：A 振幅、ω 定周期、φ 定平移\n<\/li><li>\n三角方程写通解，再按区间筛选\n<\/ul>", "c01": "<h1>单位圆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>三角函数的一切定义、符号、公式，都能在单位圆上找到出处。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是把“几何的角”变成“可运算的数”的那座桥。<\/p>\n<h2>详解<\/h2>\n<p>角 θ 的终边与单位圆交于 P(x,y)，则 cosθ=x、sinθ=y、tanθ=y/x。平方关系来自 x²+y²=1；诱导公式来自四个象限的对称；和角公式来自圆上两点的距离。<\/p>\n<h2>常见误解<\/h2>\n<p>只背公式不看圆，符号一错就全错。<\/p>\n<h2>相关概念<\/h2>\n<p>三角比（ch01）、诱导公式（ch02）<\/p>", "c02": "<h1>周期与相位<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>ω 决定多久重复一次，φ 决定从哪里开始，A 决定多高。<\/p>\n<h2>为什么重要<\/h2>\n<p>一切往复现象（振动、交流电、声波）都用这三个参数描述。<\/p>\n<h2>详解<\/h2>\n<p>y=A sin(ωx+φ)+k：周期 T=2π/|ω|，振幅 |A|，初相 φ，平衡位置 k。平移量是 φ/ω，不是 φ，这是最容易错的一步。<\/p>\n<h2>常见误解<\/h2>\n<p>把 φ 直接当成平移量，忽略 ω 的缩放作用。<\/p>\n<h2>相关概念<\/h2>\n<p>图象（ch04）、加法定理（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：角、弧度与三角比<\/strong><br>阅读：<a href=\"#/book/trigonometry/chapter/ch01\">第 1 章：角、弧度与三角比<\/a><br>检查点：能把任意角化到 0°~360°并说出象限<\/li><li class='path-step' id='path-02'><strong>步骤 02：同角关系与诱导公式<\/strong><br>阅读：<a href=\"#/book/trigonometry/chapter/ch02\">第 2 章：同角关系与诱导公式<\/a><br>检查点：能把任意角的三角比化成锐角<\/li><li class='path-step' id='path-03'><strong>步骤 03：加法定理与倍角<\/strong><br>阅读：<a href=\"#/book/trigonometry/chapter/ch03\">第 3 章：加法定理与倍角公式<\/a><br>检查点：能默写和角、差角与二倍角公式<\/li><li class='path-step' id='path-04'><strong>步骤 04：图象、性质与三角方程<\/strong><br>阅读：<a href=\"#/book/trigonometry/chapter/ch04\">第 4 章：图象、性质与三角方程<\/a><br>检查点：能说出周期、对称轴并写通解<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：角、弧度与三角比<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 与 −30° 终边相同的角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 30°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 330°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 300°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 150°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 150° 化为弧度是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 5π/6<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 2π/3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 3π/4<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 7π/6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：同角关系与诱导公式<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> sin210° 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> −1/2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> −√3/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 4/5<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> −4/5<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 3/5<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> −3/5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：加法定理与倍角公式<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> cos(α+β) 展开为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> cosαcosβ+sinαsinβ<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> cosαcosβ−sinαsinβ<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> sinαcosβ+cosαsinβ<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> sinαcosβ−cosαsinβ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> sin2α 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 2sinα<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 2sinαcosα<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> sin²α−cos²α<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 1−2sin²α<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 4 章：图象、性质与三角方程<\/h2><div class='quiz-item' data-qid='ch04-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y=2sin(3x) 的周期是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> 2π<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> 2π/3<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> 3π<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> π/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 方程 cosx=0 的通解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> x=kπ<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> x=π/2+kπ<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> x=2kπ<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> x=π/4+kπ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q9.<\/b> sin(π/6) 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> √2/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q10.<\/b> y=sin(2x−π/3) 的周期是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> π<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 2π<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> π/2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 4π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：角、弧度与三角比<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 与 −30° 终边相同的角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 30°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 330°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 300°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 150°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 150° 化为弧度是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 5π/6<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 2π/3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 3π/4<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 7π/6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：同角关系与诱导公式<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> sin210° 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> −1/2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> −√3/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 4/5<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> −4/5<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 3/5<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> −3/5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：加法定理与倍角公式<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> cos(α+β) 展开为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> cosαcosβ+sinαsinβ<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> cosαcosβ−sinαsinβ<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> sinαcosβ+cosαsinβ<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> sinαcosβ−cosαsinβ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> sin2α 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 2sinα<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 2sinαcosα<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> sin²α−cos²α<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 1−2sin²α<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：图象、性质与三角方程<\/h1><div class='quiz-item' data-qid='ch04-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y=2sin(3x) 的周期是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> 2π<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> 2π/3<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> 3π<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> π/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 方程 cosx=0 的通解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> x=kπ<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> x=π/2+kπ<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> x=2kπ<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> x=π/4+kπ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='弧度'>弧度 — 弧长与半径之比定义的角的度量。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='终边相同的角'>终边相同的角 — 相差 360° 整数倍的角。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='正弦'>正弦 — 单位圆上角的终边交点的纵坐标。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='余弦'>余弦 — 单位圆上角的终边交点的横坐标。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='诱导公式'>诱导公式 — 把任意角三角比化为锐角三角比的公式。 <span class=glossary-ref>（第 2 章：同角关系与诱导公式）<\/span><\/li><li data-term='加法定理'>加法定理 — 展开 α±β 三角比的公式。 <span class=glossary-ref>（第 3 章：加法定理与倍角公式）<\/span><\/li><li data-term='二倍角公式'>二倍角公式 — sin2α、cos2α、tan2α 的公式。 <span class=glossary-ref>（第 3 章：加法定理与倍角公式）<\/span><\/li><li data-term='周期'>周期 — 函数值重复出现的最小正间隔。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><li data-term='振幅'>振幅 — y=A sin(ωx+φ) 中的 |A|。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><li data-term='通解'>通解 — 含整数 k、表示全部解的表达式。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：化简三步<\/h2>\n<p>① 用诱导公式把角化到锐角；② 统一函数名；③ 用平方关系或和角公式合并。<\/p>\n<h2>框架：图象五问<\/h2>\n<p>① 定义域；② 值域与振幅；③ 周期；④ 对称轴与对称中心；⑤ 单调区间。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\ : "chapters/ch01-slope.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：直线方程的五种形式", "file": "chapters/ch02-forms.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：位置关系与距离", "file": "chapters/ch03-position-distance.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "斜率与方向", "file": "concepts/c01-slope-direction.md", "chapterIds": ["ch01", "ch02", "ch03"]}, {"id": "c02", "title": "形式与适用条件", "file": "concepts/c02-form-conditions.md", "chapterIds": ["ch02"]}], "glossary": [{"term": "倾斜角", "def": "直线向上方向与 x 轴正方向的夹角。", "chapterId": "ch01"}, {"term": "斜率", "def": "倾斜角的正切，反映直线的倾斜程度。", "chapterId": "ch01"}, {"term": "点斜式", "def": "y−y₀=k(x−x₀)。", "chapterId": "ch02"}, {"term": "斜截式", "def": "y=kx+b。", "chapterId": "ch02"}, {"term": "截距式", "def": "x/a+y/b=1。", "chapterId": "ch02"}, {"term": "一般式", "def": "Ax+By+C=0（A、B 不全为零）。", "chapterId": "ch02"}, {"term": "点到直线距离", "def": "点与直线上最近点的距离。", "chapterId": "ch03"}, {"term": "夹角", "def": "两直线所成的锐角或直角。", "chapterId": "ch03"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "过点 (1,1) 与 (3,5) 的直线斜率是：", "options": ["1", "2", "4", "1/2"], "answer": 1, "explain": "k=(5−1)/(3−1)=2。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "直线 x=4 的斜率：", "options": ["0", "1", "不存在", "4"], "answer": 2, "explain": "竖直线与 x 轴垂直，倾斜角 90°，正切无定义，故斜率不存在。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "过点 (1,2) 且斜率为 3 的直线方程是：", "options": ["y−2=3(x−1)", "y+2=3(x+1)", "y=3x", "3x−y+1=0"], "answer": 0, "explain": "点斜式直接写成 y−2=3(x−1)。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "直线 2x−3y+6=0 的斜率是：", "options": ["2/3", "−2/3", "3/2", "−3/2"], "answer": 0, "explain": "k=−A/B=−2/(−3)=2/3。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "直线 y=3x+1 与 y=3x−2 的位置关系是：", "options": ["相交", "平行", "重合", "垂直"], "answer": 1, "explain": "斜率相同、截距不同，故平行。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "点 (2,1) 到直线 x−y+1=0 的距离是：", "options": ["2", "√2", "1", "2√2"], "answer": 1, "explain": "|2−1+1|/√2=2/√2=√2。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "过点 (0,2) 且与直线 y=2x+1 平行的直线方程是：", "options": ["y=2x+2", "y=−2x+2", "y=x+2", "y=2x−2"], "answer": 0, "explain": "平行则斜率相同为 2，过 (0,2) 得 y=2x+2。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "直线 3x+4y−10=0 与 3x+4y+5=0 之间的距离是：", "options": ["3", "15", "5", "1"], "answer": 0, "explain": "d=|−10−5|/√(9+16)=15/5=3。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：倾斜角与斜率」的一句话核心是什么？", "back": "斜率是直线倾斜程度的数：k=tanα，α 是倾斜角；竖直直线没有斜率。", "tags": ["line-equations", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：直线方程的五种形式」的一句话核心是什么？", "back": "五种形式是同一件事的五种写法；选哪种取决于题目给了什么条件。", "tags": ["line-equations", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：位置关系与距离」的一句话核心是什么？", "back": "平行看斜率相等，垂直看斜率乘积为 −1；距离靠“点到直线的公式”。", "tags": ["line-equations", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「倾斜角」？", "back": "直线向上方向与 x 轴正方向的夹角。", "tags": ["line-equations", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「斜率」？", "back": "倾斜角的正切，反映直线的倾斜程度。", "tags": ["line-equations", "术语"]}, {"id": "f06", "chapterId": "ch02", "front": "什么是「点斜式」？", "back": "y−y₀=k(x−x₀)。", "tags": ["line-equations", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「斜截式」？", "back": "y=kx+b。", "tags": ["line-equations", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「截距式」？", "back": "x/a+y/b=1。", "tags": ["line-equations", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「一般式」？", "back": "Ax+By+C=0（A、B 不全为零）。", "tags": ["line-equations", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「点到直线距离」？", "back": "点与直线上最近点的距离。", "tags": ["line-equations", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「夹角」？", "back": "两直线所成的锐角或直角。", "tags": ["line-equations", "术语"]}], "companion": "line-equations学习伴侣.html", "deriv": "line-equations从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：倾斜角与斜率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：坐标、三角比\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n由两点求斜率\n<\/li><li>\n判断倾斜角与斜率的对应\n<\/li><li>\n处理斜率不存在的情形\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>斜率是直线倾斜程度的数：k=tanα，α 是倾斜角；竖直直线没有斜率。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 倾斜角<\/h3>\n<p>直线向上的方向与 x 轴正方向的夹角叫倾斜角 α，范围 [0°,180°)。水平线 α=0°，竖直线 α=90°。<\/p>\n<h3>1.2 斜率<\/h3>\n<p>k=tanα（α≠90°）。由两点 P₁(x₁,y₁)、P₂(x₂,y₂)：<\/p>\n<p>k=(y₂−y₁)/(x₂−x₁)，要求 x₂≠x₁。<\/p>\n<ul><li>\nk&gt;0：直线上升，α 为锐角；\n<\/li><li>\nk&lt;0：直线下降，α 为钝角；\n<\/li><li>\nk=0：水平线；\n<\/li><li>\n斜率不存在：竖直线 x=x₀。\n<\/ul>\n<h3>1.3 斜率的用途<\/h3>\n<p>斜率是解析几何的“万能钥匙”：平行、垂直、夹角、切线，几乎都先算斜率。看到“直线过两点”，第一反应就该是算 k。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：斜率像坡道的陡度：每向右走 1 米，升高几米。<\/p>\n<p><strong>失效边界<\/strong>：竖直坡道的陡度无法用“每米升高”描述，所以竖直直线没有斜率。<\/p>\n<p><strong>实例<\/strong>：过 A(1,2)、B(4,11) 的直线，k=(11−2)/(4−1)=3，倾斜角 arctan3≈71.6°。 过 C(2,5)、D(2,−1) 的直线，x 坐标相同，斜率不存在，方程是 x=2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 所有直线都有斜率 —— 实际上 竖直线没有斜率；解题时要单独讨论 x 坐标相同的情形。\n<\/li><li>\n别以为 斜率大就是直线长 —— 实际上 斜率只表示倾斜程度，与长度无关。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n过点 (1,1) 与 (3,5) 的直线斜率是：\n<\/li><li>\n直线 x=4 的斜率：\n<p>A. 1 ｜ B. 2 ｜ C. 4 ｜ D. 1/2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：k=(5−1)/(3−1)=2。 A. 0 ｜ B. 1 ｜ C. 不存在 ｜ D. 4 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：竖直线与 x 轴垂直，倾斜角 90°，正切无定义，故斜率不存在。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nk=tanα，α∈[0°,180°)\n<\/li><li>\nk=(y₂−y₁)/(x₂−x₁)，x₂≠x₁\n<\/li><li>\n竖直直线无斜率\n<\/ul>", "ch02": "<h1>第 2 章：直线方程的五种形式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按条件写出点斜式、斜截式、两点式、截距式\n<\/li><li>\n把各种形式化为一般式\n<\/li><li>\n识别每种形式的失效条件\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>五种形式是同一件事的五种写法；选哪种取决于题目给了什么条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 五种形式<\/h3>\n<ul><li>\n点斜式：y−y₀=k(x−x₀)，已知一点与斜率；不能表示竖直线；\n<\/li><li>\n斜截式：y=kx+b，已知斜率与 y 轴截距；\n<\/li><li>\n两点式：(y−y₁)/(y₂−y₁)=(x−x₁)/(x₂−x₁)，已知两点；不能表示水平线与竖直线；\n<\/li><li>\n截距式：x/a+y/b=1，已知两轴截距；不能表示过原点或平行于坐标轴的直线；\n<\/li><li>\n一般式：Ax+By+C=0（A、B 不全为零），可以表示所有直线。\n<\/ul>\n<h3>2.2 选择策略<\/h3>\n<p>给点与斜率 → 点斜式；给两点 → 两点式或先求斜率；给截距 → 截距式；题目要求“求直线方程”且无特殊条件 → 一般式收尾。<\/p>\n<h3>2.3 一般式的系数含义<\/h3>\n<p>Ax+By+C=0 中，斜率 k=−A/B（B≠0），y 轴截距 −C/B，x 轴截距 −C/A。<\/p>\n<p>用一般式判断平行垂直最省事：平行看 A₁B₂=A₂B₁，垂直看 A₁A₂+B₁B₂=0（不必讨论斜率是否存在）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：五种形式像同一件衣服的五种穿法，场合不同选不同，但都是同一件衣服。<\/p>\n<p><strong>失效边界<\/strong>：每种形式都有“表示不了”的直线，写答案时要注明或改用一般式。<\/p>\n<p><strong>实例<\/strong>：过点 (2,3) 且斜率 4：y−3=4(x−2)，即 4x−y−5=0。 过 (1,0) 与 (0,2)：x/1+y/2=1，即 2x+y−2=0。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 一般式与斜截式不能互化 —— 实际上 B≠0 时一般式可化为 y=−(A/B)x−C/B，就是斜截式。\n<\/li><li>\n别以为 截距式可以表示任何直线 —— 实际上 过原点的直线两截距都为零，分母为零，截距式失效。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n过点 (1,2) 且斜率为 3 的直线方程是：\n<\/li><li>\n直线 2x−3y+6=0 的斜率是：\n<p>A. y−2=3(x−1) ｜ B. y+2=3(x+1) ｜ C. y=3x ｜ D. 3x−y+1=0 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：点斜式直接写成 y−2=3(x−1)。 A. 2/3 ｜ B. −2/3 ｜ C. 3/2 ｜ D. −3/2 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：k=−A/B=−2/(−3)=2/3。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n点斜式、斜截式、两点式、截距式、一般式\n<\/li><li>\n每种形式都有表示不了的直线\n<\/li><li>\n一般式斜率 k=−A/B\n<\/ul>", "ch03": "<h1>第 3 章：位置关系与距离<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断两直线平行、垂直、相交\n<\/li><li>\n求点到直线的距离\n<\/li><li>\n求两平行线间的距离与夹角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>平行看斜率相等，垂直看斜率乘积为 −1；距离靠“点到直线的公式”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 两直线位置关系<\/h3>\n<p>设 l₁: y=k₁x+b₁，l₂: y=k₂x+b₂：<\/p>\n<ul><li>\n平行：k₁=k₂ 且 b₁≠b₂；\n<\/li><li>\n重合：k₁=k₂ 且 b₁=b₂；\n<\/li><li>\n垂直：k₁k₂=−1；\n<\/li><li>\n相交：其余情形。\n<\/ul>\n<p>用一般式时不必讨论斜率：平行 ⇔ A₁B₂=A₂B₁ 且不同时重合；垂直 ⇔ A₁A₂+B₁B₂=0。<\/p>\n<h3>3.2 点到直线的距离<\/h3>\n<p>点 P(x₀,y₀) 到直线 Ax+By+C=0 的距离：<\/p>\n<p>d=|Ax₀+By₀+C|/√(A²+B²)<\/p>\n<p>用之前必须把直线化成一般式，系数不能带分母。<\/p>\n<h3>3.3 两平行线间距离<\/h3>\n<p>两平行线 Ax+By+C₁=0 与 Ax+By+C₂=0（系数必须一致）的距离：<\/p>\n<p>d=|C₁−C₂|/√(A²+B²)<\/p>\n<p>若系数不一致，先化成一致再套公式。<\/p>\n<h3>3.4 夹角<\/h3>\n<p>两直线夹角 θ 满足 tanθ=|(k₂−k₁)/(1+k₁k₂)|。夹角取锐角或直角，范围 (0°,90°]。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：点到直线的距离像问“我离这条马路最近有多远”，最近的路就是垂线。<\/p>\n<p><strong>失效边界<\/strong>：公式要求直线是一般式且 A、B 不为零同时成立；竖直线 B=0 时公式仍成立（分母为 |A|）。<\/p>\n<p><strong>实例<\/strong>：点 (1,1) 到 3x+4y−2=0 的距离：|3+4−2|/5=1。 直线 y=2x+1 与 y=2x−3 平行，距离 |1−(−3)|/√(4+1)=4/√5≈1.79。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 两直线平行就是斜率相等 —— 实际上 还要求截距不同；截距相同则重合。\n<\/li><li>\n别以为 点到直线距离可以直接代点进斜截式 —— 实际上 要化成一般式再代，否则分母不对。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n直线 y=3x+1 与 y=3x−2 的位置关系是：\n<\/li><li>\n点 (2,1) 到直线 x−y+1=0 的距离是：\n<p>A. 相交 ｜ B. 平行 ｜ C. 重合 ｜ D. 垂直 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：斜率相同、截距不同，故平行。 A. 2 ｜ B. √2 ｜ C. 1 ｜ D. 2√2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：|2−1+1|/√2=2/√2=√2。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n平行：k 相等且 b 不同；垂直：k₁k₂=−1\n<\/li><li>\n点到直线距离 |Ax₀+By₀+C|/√(A²+B²)\n<\/li><li>\n平行线距离需先统一系数\n<\/ul>", "c01": "<h1>斜率与方向<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>斜率是直线唯一的方向指标；平行、垂直、夹角都靠它判断。<\/p>\n<h2>为什么重要<\/h2>\n<p>解析几何里“方向”这件事，全靠斜率变成一个数。<\/p>\n<h2>详解<\/h2>\n<p>k=tanα。k 相等则平行（截距不同），k₁k₂=−1 则垂直，tanθ=|(k₂−k₁)/(1+k₁k₂)| 给夹角。竖直线无斜率，需单独讨论。<\/p>\n<h2>常见误解<\/h2>\n<p>忘记竖直线没有斜率，直接套点斜式或垂直公式。<\/p>\n<h2>相关概念<\/h2>\n<p>倾斜角（ch01）、位置关系（ch03）<\/p>", "c02": "<h1>形式与适用条件<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每种方程形式都漏掉一类直线，答案要写全就得知道它漏了什么。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是直线方程题最常见的扣分点：用点斜式却漏掉竖直线。<\/p>\n<h2>详解<\/h2>\n<p>点斜式漏竖直线；两点式漏水平线与竖直线；截距式漏过原点及平行于坐标轴的直线；一般式不漏。所以分类讨论时，先处理特殊直线，再写一般情形。<\/p>\n<h2>常见误解<\/h2>\n<p>只写一种形式就交卷，忽略特殊情形。<\/p>\n<h2>相关概念<\/h2>\n<p>五种形式（ch02）、分类讨论（通用）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：倾斜角与斜率<\/strong><br>阅读：<a href=\"#/book/line-equations/chapter/ch01\">第 1 章：倾斜角与斜率<\/a><br>检查点：能由两点求斜率并判断倾斜角范围<\/li><li class='path-step' id='path-02'><strong>步骤 02：直线方程的五种形式<\/strong><br>阅读：<a href=\"#/book/line-equations/chapter/ch02\">第 2 章：直线方程的五种形式<\/a><br>检查点：能按条件选对形式并注明适用条件<\/li><li class='path-step' id='path-03'><strong>步骤 03：位置关系与距离<\/strong><br>阅读：<a href=\"#/book/line-equations/chapter/ch03\">第 3 章：位置关系与距离<\/a><br>检查点：能用一般式系数判断平行垂直<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：倾斜角与斜率<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 过点 (1,1) 与 (3,5) 的直线斜率是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 1/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 直线 x=4 的斜率：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 不存在<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：直线方程的五种形式<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 过点 (1,2) 且斜率为 3 的直线方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> y−2=3(x−1)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> y+2=3(x+1)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> y=3x<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 3x−y+1=0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 直线 2x−3y+6=0 的斜率是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 2/3<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> −2/3<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 3/2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> −3/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：位置关系与距离<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 直线 y=3x+1 与 y=3x−2 的位置关系是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 相交<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 平行<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 重合<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 垂直<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 点 (2,1) 到直线 x−y+1=0 的距离是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> √2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 2√2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 过点 (0,2) 且与直线 y=2x+1 平行的直线方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> y=2x+2<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> y=−2x+2<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> y=x+2<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> y=2x−2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 直线 3x+4y−10=0 与 3x+4y+5=0 之间的距离是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 15<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 5<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：倾斜角与斜率<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 过点 (1,1) 与 (3,5) 的直线斜率是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 1/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 直线 x=4 的斜率：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 不存在<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：直线方程的五种形式<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 过点 (1,2) 且斜率为 3 的直线方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> y−2=3(x−1)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> y+2=3(x+1)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> y=3x<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 3x−y+1=0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 直线 2x−3y+6=0 的斜率是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 2/3<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> −2/3<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 3/2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> −3/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：位置关系与距离<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 直线 y=3x+1 与 y=3x−2 的位置关系是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 相交<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 平行<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 重合<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 垂直<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 点 (2,1) 到直线 x−y+1=0 的距离是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> √2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 2√2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='倾斜角'>倾斜角 — 直线向上方向与 x 轴正方向的夹角。 <span class=glossary-ref>（第 1 章：倾斜角与斜率）<\/span><\/li><li data-term='斜率'>斜率 — 倾斜角的正切，反映直线的倾斜程度。 <span class=glossary-ref>（第 1 章：倾斜角与斜率）<\/span><\/li><li data-term='点斜式'>点斜式 — y−y₀=k(x−x₀)。 <span class=glossary-ref>（第 2 章：直线方程的五种形式）<\/span><\/li><li data-term='斜截式'>斜截式 — y=kx+b。 <span class=glossary-ref>（第 2 章：直线方程的五种形式）<\/span><\/li><li data-term='截距式'>截距式 — x/a+y/b=1。 <span class=glossary-ref>（第 2 章：直线方程的五种形式）<\/span><\/li><li data-term='一般式'>一般式 — Ax+By+C=0（A、B 不全为零）。 <span class=glossary-ref>（第 2 章：直线方程的五种形式）<\/span><\/li><li data-term='点到直线距离'>点到直线距离 — 点与直线上最近点的距离。 <span class=glossary-ref>（第 3 章：位置关系与距离）<\/span><\/li><li data-term='夹角'>夹角 — 两直线所成的锐角或直角。 <span class=glossary-ref>（第 3 章：位置关系与距离）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：求直线方程四步<\/h2>\n<p>① 判断是否竖直（无斜率）；② 找已知条件（点、斜率、截距）；③ 选形式；④ 化为一般式并检查特殊情形。<\/p>\n<h2>框架：位置关系判断<\/h2>\n<p>优先用一般式系数：平行看 A₁B₂=A₂B₁，垂直看 A₁A₂+B₁B₂=0，避免讨论斜率是否存在。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>斜率<\/td><td>k=tanα=(y₂−y₁)/(x₂−x₁)<\/td><\/tr><tr><td>点斜式<\/td><td>y−y₀=k(x−x₀)<\/td><\/tr><tr><td>斜截式<\/td><td>y=kx+b<\/td><\/tr><tr><td>一般式斜率<\/td><td>k=−A/B（B≠0）<\/td><\/tr><tr><td>垂直<\/td><td>k₁k₂=−1<\/td><\/tr><tr><td>点线距离<\/td><td><\/td><td>Ax₀+By₀+C<\/td><td>/√(A²+B²)<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：倾斜角与斜率", "href": "#/chapter/ch01"}, {"label": "第 2 章：直线方程的五种形式", "href": "#/chapter/ch02"}, {"label": "第 3 章：位置关系与距离", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "斜率与方向", "href": "#/concept/c01"}, {"label": "形式与适用条件", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label rId": "ch03"}, {"term": "通径", "def": "过焦点垂直于对称轴的弦。", "chapterId": "ch01"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "椭圆 x²/16+y²/7=1 的焦距是：", "options": ["6", "3", "9", "18"], "answer": 0, "explain": "c²=16−7=9，c=3，焦距 2c=6。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "椭圆的离心率 e 的取值范围是：", "options": ["(0,1)", "(1,+∞)", "[0,1]", "(0,+∞)"], "answer": 0, "explain": "e=c/a，且 0<c<a，故 0<e<1。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "双曲线 x²/16−y²/9=1 的渐近线是：", "options": ["y=±(3/4)x", "y=±(4/3)x", "y=±(9/16)x", "y=±x"], "answer": 0, "explain": "a=4，b=3，渐近线 y=±(b/a)x=±(3/4)x。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "抛物线 y²=12x 的焦点坐标是：", "options": ["(3,0)", "(6,0)", "(0,3)", "(12,0)"], "answer": 0, "explain": "2p=12，p=6，焦点 (p/2,0)=(3,0)。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "离心率 e=1 对应的圆锥曲线是：", "options": ["椭圆", "双曲线", "抛物线", "圆"], "answer": 2, "explain": "e=1 即到焦点与到准线距离相等，是抛物线。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "平行于抛物线对称轴的光线经反射后：", "options": ["原路返回", "过焦点", "平行射出", "发散"], "answer": 1, "explain": "抛物线的光学性质：平行于轴的光线反射后过焦点。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "椭圆 x²/36+y²/20=1 的离心率是：", "options": ["2/3", "√2/3", "4/9", "1/3"], "answer": 0, "explain": "a=6，b²=20，c²=36−20=16，c=4，e=c/a=2/3。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "抛物线 x²=−8y 的焦点坐标是：", "options": ["(0,−2)", "(0,2)", "(−2,0)", "(2,0)"], "answer": 0, "explain": "x²=−2py 开口向下，2p=8，p=4，焦点 (0,−p/2)=(0,−2)。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：椭圆」的一句话核心是什么？", "back": "椭圆是“到两定点距离之和为常数”的点集；a 是半长轴，c 是半焦距，b²=a²−c²。", "tags": ["conic-sections", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：双曲线与抛物线」的一句话核心是什么？", "back": "双曲线是“距离之差为常数”，抛物线是“到定点与定直线等距”；前者有渐近线，后者只有一条对称轴。", "tags": ["conic-sections", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：统一定义、光学性质与坐标变换」的一句话核心是什么？", "back": "三条曲线可以合成一句话：到焦点距离与到准线距离之比等于 e。", "tags": ["conic-sections", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「椭圆」？", "back": "到两定点距离之和为常数的点的轨迹。", "tags": ["conic-sections", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「焦点」？", "back": "定义中的定点。", "tags": ["conic-sections", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「半长轴」？", "back": "椭圆中的 a，长轴长为 2a。", "tags": ["conic-sections", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「离心率」？", "back": "e=c/a，描述曲线的形状参数。", "tags": ["conic-sections", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「双曲线」？", "back": "到两定点距离之差为常数的点的轨迹。", "tags": ["conic-sections", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「渐近线」？", "back": "双曲线无限接近但不相交的直线。", "tags": ["conic-sections", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「抛物线」？", "back": "到定点与定直线等距的点的轨迹。", "tags": ["conic-sections", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「准线」？", "back": "统一定义中的定直线。", "tags": ["conic-sections", "术语"]}, {"id": "f12", "chapterId": "ch01", "front": "什么是「通径」？", "back": "过焦点垂直于对称轴的弦。", "tags": ["conic-sections", "术语"]}], "companion": "conic-sections学习伴侣.html", "deriv": "conic-sections从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：椭圆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：两点距离、配方\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n由定义写出椭圆方程\n<\/li><li>\n读出长轴、短轴、焦距、离心率\n<\/li><li>\n判断椭圆的扁平程度\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>椭圆是“到两定点距离之和为常数”的点集；a 是半长轴，c 是半焦距，b²=a²−c²。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 定义<\/h3>\n<p>平面内到两定点 F₁、F₂ 的距离之和等于常数 2a（2a&gt;|F₁F₂|）的点的轨迹叫椭圆。两定点叫焦点，|F₁F₂|=2c。<\/p>\n<p>若 2a=2c，轨迹退化为线段 F₁F₂；若 2a&lt;2c，无轨迹。<\/p>\n<h3>1.2 标准方程<\/h3>\n<p>以焦点在 x 轴上、中心在原点为例：<\/p>\n<p>x²/a²+y²/b²=1，其中 b²=a²−c²<\/p>\n<p>焦点为 (±c,0)，顶点为 (±a,0)、(0,±b)。若焦点在 y 轴上，方程写成 y²/a²+x²/b²=1，焦点 (0,±c)。<\/p>\n<h3>1.3 离心率<\/h3>\n<p>e=c/a，范围 (0,1)。e 越大（越接近 1），c 越接近 a，b 越小，椭圆越扁；e 越小（越接近 0），越接近圆。<\/p>\n<p>e 是描述“扁不扁”的唯一参数，比看方程更直观。<\/p>\n<h3>1.4 常用关系<\/h3>\n<p>椭圆上任意一点到两焦点距离之和恒为 2a；焦点到顶点的距离分别为 a−c 与 a+c；通径（过焦点垂直于长轴的弦）长为 2b²/a。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：椭圆像用两根钉子与一根绳画出的图形：绳长固定，笔尖到两钉距离之和就不变。<\/p>\n<p><strong>失效边界<\/strong>：绳长必须大于两钉距离，否则画不出椭圆（退化为线段或无轨迹）。<\/p>\n<p><strong>实例<\/strong>：x²/25+y²/9=1：a=5，b=3，c=√(25−9)=4，e=4/5=0.8。 焦点 (±4,0)，长轴长 10，短轴长 6。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 a 是长轴长 —— 实际上 a 是半长轴，长轴长是 2a。\n<\/li><li>\n别以为 离心率越大椭圆越圆 —— 实际上 e 越大越扁；e 越小越接近圆。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n椭圆 x²/16+y²/7=1 的焦距是：\n<\/li><li>\n椭圆的离心率 e 的取值范围是：\n<p>A. 6 ｜ B. 3 ｜ C. 9 ｜ D. 18 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：c²=16−7=9，c=3，焦距 2c=6。 A. (0,1) ｜ B. (1,+∞) ｜ C. [0,1] ｜ D. (0,+∞) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：e=c/a，且 0&lt;c&lt;a，故 0&lt;e&lt;1。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n|PF₁|+|PF₂|=2a\n<\/li><li>\nb²=a²−c²；e=c/a∈(0,1)\n<\/li><li>\ne 越大越扁\n<\/ul>", "ch02": "<h1>第 2 章：双曲线与抛物线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出双曲线标准方程与渐近线\n<\/li><li>\n写出抛物线标准方程与准线\n<\/li><li>\n由方程判断曲线类型\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>双曲线是“距离之差为常数”，抛物线是“到定点与定直线等距”；前者有渐近线，后者只有一条对称轴。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 双曲线<\/h3>\n<p>定义：到两定点距离之差的绝对值为常数 2a（2a&lt;2c）的点的轨迹。<\/p>\n<p>标准方程（焦点在 x 轴）：x²/a²−y²/b²=1，其中 b²=c²−a²。<\/p>\n<ul><li>\n焦点 (±c,0)，顶点 (±a,0)；\n<\/li><li>\n渐近线 y=±(b/a)x；\n<\/li><li>\n离心率 e=c/a&gt;1，e 越大开口越“张”。\n<\/ul>\n<h3>2.2 抛物线<\/h3>\n<p>定义：到定点 F 与定直线 l 距离相等的点的轨迹。F 叫焦点，l 叫准线。<\/p>\n<p>标准方程（开口向右）：y²=2px（p&gt;0），焦点 (p/2,0)，准线 x=−p/2。<\/p>\n<p>开口方向由一次项决定：y²=2px 向右，y²=−2px 向左，x²=2py 向上，x²=−2py 向下。<\/p>\n<h3>2.3 三者的区别<\/h3>\n<table><thead><tr><th><\/th><th>定义<\/th><th>方程<\/th><th>离心率<\/th><th>特征线<\/th><\/tr><\/thead><tbody><tr><td>椭圆<\/td><td>距离之和<\/td><td>x²/a²+y²/b²=1<\/td><td>e&lt;1<\/td><td>无渐近线<\/td><\/tr><tr><td>双曲线<\/td><td>距离之差<\/td><td>x²/a²−y²/b²=1<\/td><td>e&gt;1<\/td><td>两条渐近线<\/td><\/tr><tr><td>抛物线<\/td><td>到点＝到线<\/td><td>y²=2px<\/td><td>e=1<\/td><td>一条准线<\/td><\/tr><\/tbody><\/table>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：双曲线像两束手电光的光锥边缘，越远越分开；抛物线像抛出的球走过的路线。<\/p>\n<p><strong>失效边界<\/strong>：双曲线的“差”要取绝对值，否则只得到一支。<\/p>\n<p><strong>实例<\/strong>：x²/9−y²/16=1：a=3，b=4，c=5，e=5/3，渐近线 y=±(4/3)x。 y²=8x：2p=8，p=4，焦点 (2,0)，准线 x=−2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 双曲线只有一支 —— 实际上 取绝对值时为两支；只写“差为 2a”而不取绝对值，只得到靠近某焦点的一支。\n<\/li><li>\n别以为 抛物线的 p 是焦点到准线的距离 —— 实际上 焦点到准线的距离是 p，焦点坐标是 (p/2,0)，准线是 x=−p/2。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n双曲线 x²/16−y²/9=1 的渐近线是：\n<\/li><li>\n抛物线 y²=12x 的焦点坐标是：\n<p>A. y=±(3/4)x ｜ B. y=±(4/3)x ｜ C. y=±(9/16)x ｜ D. y=±x <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：a=4，b=3，渐近线 y=±(b/a)x=±(3/4)x。 A. (3,0) ｜ B. (6,0) ｜ C. (0,3) ｜ D. (12,0) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：2p=12，p=6，焦点 (p/2,0)=(3,0)。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n双曲线：||PF₁|−|PF₂||=2a，b²=c²−a²\n<\/li><li>\n渐近线 y=±(b/a)x\n<\/li><li>\n抛物线 y²=2px：焦点 (p/2,0)，准线 x=−p/2\n<\/ul>", "ch03": "<h1>第 3 章：统一定义、光学性质与坐标变换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用离心率统一三条曲线\n<\/li><li>\n说出三条曲线的光学性质\n<\/li><li>\n理解坐标变换不改变曲线类型\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>三条曲线可以合成一句话：到焦点距离与到准线距离之比等于 e。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 统一定义<\/h3>\n<p>到定点 F（焦点）的距离与到定直线 l（准线）的距离之比为常数 e 的点的轨迹：<\/p>\n<ul><li>\n0&lt;e&lt;1：椭圆；\n<\/li><li>\ne=1：抛物线；\n<\/li><li>\ne&gt;1：双曲线。\n<\/ul>\n<p>一条定义，三种曲线，e 是分类开关。这也是“圆锥曲线”这个名字的代数解释。<\/p>\n<h3>3.2 光学性质<\/h3>\n<ul><li>\n椭圆：从一个焦点发出的光线经椭圆反射后必过另一焦点；\n<\/li><li>\n抛物线：平行于对称轴的光线经抛物线反射后聚焦于焦点；\n<\/li><li>\n双曲线：射向一个焦点的光线经反射后，反射光线的反向延长线过另一焦点。\n<\/ul>\n<p>这些性质是卫星天线、车灯、光学仪器的设计依据。<\/p>\n<h3>3.3 坐标变换与不变量<\/h3>\n<p>平移坐标轴只改变方程中的常数项，不改变曲线类型；旋转坐标轴可以把含 xy 项的方程化为标准形。<\/p>\n<p>曲线在变换下保持不变的量（如离心率、曲线类型）叫不变量。判断“这是什么曲线”时，先算不变量，比硬配方更快。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：离心率像“调焦旋钮”：拧到小于 1 是椭圆，正好 1 是抛物线，大于 1 是双曲线。<\/p>\n<p><strong>失效边界<\/strong>：统一定义要求准线与焦点对应；不同曲线的准线位置不同，不能混用。<\/p>\n<p><strong>实例<\/strong>：某曲线到焦点 (2,0) 与准线 x=−2 的距离之比为 1，则它是抛物线 y²=8x。 若比值改为 0.5，则是椭圆（需重新计算 a、c）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 光学性质只对抛物线与圆有关 —— 实际上 三条曲线都有反射性质，椭圆与双曲线同样用于光学设计。\n<\/li><li>\n别以为 坐标变换会改变曲线类型 —— 实际上 平移与旋转只改变方程形式，曲线类型与离心率不变。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n离心率 e=1 对应的圆锥曲线是：\n<\/li><li>\n平行于抛物线对称轴的光线经反射后：\n<p>A. 椭圆 ｜ B. 双曲线 ｜ C. 抛物线 ｜ D. 圆 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：e=1 即到焦点与到准线距离相等，是抛物线。 A. 原路返回 ｜ B. 过焦点 ｜ C. 平行射出 ｜ D. 发散 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：抛物线的光学性质：平行于轴的光线反射后过焦点。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n统一：到焦点距离/到准线距离=e\n<\/li><li>\ne&lt;1 椭圆，e=1 抛物线，e&gt;1 双曲线\n<\/li><li>\n平移旋转不改变曲线类型\n<\/ul>", "c01": "<h1>离心率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>e=c/a，一个数决定曲线是圆、椭圆、抛物线还是双曲线。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是三条曲线的统一开关，也是判断“扁不扁、张不张”的唯一指标。<\/p>\n<h2>详解<\/h2>\n<p>椭圆 0&lt;e&lt;1，e 越大越扁；抛物线 e=1；双曲线 e&gt;1，e 越大开口越张。用统一定义看，e 就是“到焦点距离与到准线距离之比”。<\/p>\n<h2>常见误解<\/h2>\n<p>把 e 当成斜率或焦距，混淆 c/a 与 c 的含义。<\/p>\n<h2>相关概念<\/h2>\n<p>椭圆（ch01）、统一定义（ch03）<\/p>", "c02": "<h1>a、b、c 的关系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>椭圆是 b²=a²−c²，双曲线是 b²=c²−a²，符号相反。<\/p>\n<h2>为什么重要<\/h2>\n<p>这三者的关系决定焦点位置、顶点坐标与渐近线，写错一处整题皆错。<\/p>\n<h2>详解<\/h2>\n<p>椭圆中 a 最大（a²=b²+c²）；双曲线中 c 最大（c²=a²+b²）。记住“谁最大”就不会写反：椭圆 a 最大，双曲线 c 最大。<\/p>\n<h2>常见误解<\/h2>\n<p>把两个关系式互换，导致焦点坐标或渐近线全错。<\/p>\n<h2>相关概念<\/h2>\n<p>椭圆（ch01）、双曲线（ch02）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：椭圆<\/strong><br>阅读：<a href=\"#/book/conic-sections/chapter/ch01\">第 1 章：椭圆<\/a><br>检查点：能由方程读出 a、b、c、e<\/li><li class='path-step' id='path-02'><strong>步骤 02：双曲线与抛物线<\/strong><br>阅读：<a href=\"#/book/conic-sections/chapter/ch02\">第 2 章：双曲线与抛物线<\/a><br>检查点：能写出渐近线与准线<\/li><li class='path-step' id='path-03'><strong>步骤 03：统一定义、光学性质与坐标变换<\/strong><br>阅读：<a href=\"#/book/conic-sections/chapter/ch03\">第 3 章：统一定义、光学性质与坐标变换<\/a><br>检查点：能用 e 判断曲线类型<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：椭圆<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 椭圆 x²/16+y²/7=1 的焦距是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 9<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 18<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 椭圆的离心率 e 的取值范围是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> (0,1)<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> (1,+∞)<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> [0,1]<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> (0,+∞)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：双曲线与抛物线<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 双曲线 x²/16−y²/9=1 的渐近线是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> y=±(3/4)x<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> y=±(4/3)x<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> y=±(9/16)x<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> y=±x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 抛物线 y²=12x 的焦点坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> (3,0)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> (6,0)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> (0,3)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> (12,0)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：统一定义、光学性质与坐标变换<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 离心率 e=1 对应的圆锥曲线是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 椭圆<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 双曲线<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 抛物线<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 圆<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 平行于抛物线对称轴的光线经反射后：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 原路返回<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 过焦点<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 平行射出<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 发散<\/label><\/div><div class='quiz-actions'><button ='焦点'>焦点 — 定义中的定点。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><li data-term='半长轴'>半长轴 — 椭圆中的 a，长轴长为 2a。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><li data-term='离心率'>离心率 — e=c/a，描述曲线的形状参数。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><li data-term='双曲线'>双曲线 — 到两定点距离之差为常数的点的轨迹。 <span class=glossary-ref>（第 2 章：双曲线与抛物线）<\/span><\/li><li data-term='渐近线'>渐近线 — 双曲线无限接近但不相交的直线。 <span class=glossary-ref>（第 2 章：双曲线与抛物线）<\/span><\/li><li data-term='抛物线'>抛物线 — 到定点与定直线等距的点的轨迹。 <span class=glossary-ref>（第 2 章：双曲线与抛物线）<\/span><\/li><li data-term='准线'>准线 — 统一定义中的定直线。 <span class=glossary-ref>（第 3 章：统一定义、光学性质与坐标变换）<\/span><\/li><li data-term='通径'>通径 — 过焦点垂直于对称轴的弦。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：识曲线三步<\/h2>\n<p>① 看方程次数与符号（两平方项同号为椭圆、异号为双曲线、一次项为抛物线）；② 看谁最大定焦点；③ 算 e 定形状。<\/p>\n<h2>框架：求方程四步<\/h2>\n<p>① 定型（焦点在哪轴）；② 设标准式；③ 用 a、b、c 关系与已知点列方程；④ 解出并写回标准形。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>椭圆<\/td><td>x²/a²+y²/b²=1，b²=a²−c²，e=c/a&lt;1<\/td><\/tr><tr><td>双曲线<\/td><td>x²/a²−y²/b²=1，b²=c²−a²，e=c/a&gt;1<\/td><\/tr><tr><td>渐近线<\/td><td>y=±(b/a)x<\/td><\/tr><tr><td>抛物线<\/td><td>y²=2px，焦点 (p/2,0)，准线 x=−p/2<\/td><\/tr><tr><td>统一定义<\/td><td><\/td><td>PF<\/td><td>/d(P,l)=e<\/td><\/tr><tr><td>通径<\/td><td>2b²/a<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：椭圆", "href": "#/chapter/ch01"}, {"label": "第 2 章：双曲线与抛物线", "href": "#/chapter/ch02"}, {"label": "第 3 章：统一定义、光学性质与坐标变换", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "离心率", "href": "#/concept/c01"}, {"label": "a、b、c 的关系", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：椭圆", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：双曲线与抛物线", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：统一定义、光学性质与坐标变换", "href": "#/qu
