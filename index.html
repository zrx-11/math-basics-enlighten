: "single", "question": "两个三次多项式在几个不同点上取值相同，就一定能判定它们恒等？", "options": ["2 个", "3 个", "4 个", "1 个"], "answer": 2, "explain": "次数为 3，需要 n+1=4 个不同的点；少于 4 个不足以排除差多项式有根的情况。", "relatedConceptId": "c02", "prerequisites": ["ch04"]}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "下列各组中，是同类项的是：", "options": ["3x²y 与 3xy²", "−2ab 与 5ba", "x² 与 x³", "2a 与 2b"], "answer": 1, "explain": "−2ab 与 5ba 字母相同、指数都是 1，是同类项；其余三组字母或指数不同。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "(x³+1)÷(x+1) 的商是：", "options": ["x²−x+1", "x²+x+1", "x²−1", "x²+1"], "answer": 0, "explain": "x³+1=(x+1)(x²−x+1)，故商为 x²−x+1，余式 0。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q11", "chapterId": "__all__", "type": "single", "question": "若 2x²+ax−3≡2(x−1)(x+2)+b，则 a、b 为：", "options": ["a=2，b=1", "a=2，b=−3", "a=−2，b=1", "a=1，b=1"], "answer": 0, "explain": "右边展开得 2x²+2x−4+b。比较 x 项系数得 a=2；比较常数项 −3=−4+b 得 b=1。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：整式的概念与加减法」的一句话核心是什么？", "back": "整式的加减只做一件事：把字母部分完全相同的项并起来，系数相加。", "tags": ["zhengshi", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：整式的乘法与乘法公式」的一句话核心是什么？", "back": "乘法就是反复用分配律展开；指数法则负责字母部分，乘法公式是展开结果的压缩记忆。", "tags": ["zhengshi", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：整式的除法」的一句话核心是什么？", "back": "除法是指数法则的逆用；除不尽时写成 A=BQ+R，余式的次数必须低于除式。", "tags": ["zhengshi", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：多项式恒等定理与待定系数法」的一句话核心是什么？", "back": "两个次数不超过 n 的多项式，只要在 n+1 个不同点取值相同，就恒等；于是可以设出系数再解方程。", "tags": ["zhengshi", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「单项式」？", "back": "数与字母的乘积，单独一个数或字母也算。", "tags": ["zhengshi", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「系数」？", "back": "单项式中的数字因数。", "tags": ["zhengshi", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「次数」？", "back": "单项式各字母指数之和；多项式取最高次项的次数。", "tags": ["zhengshi", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「同类项」？", "back": "字母相同且相同字母指数也相同的项。", "tags": ["zhengshi", "术语"]}, {"id": "f09", "chapterId": "ch01", "front": "什么是「分配律」？", "back": "a(b+c)=ab+ac，整式变形的基本依据。", "tags": ["zhengshi", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「乘法公式」？", "back": "平方差、完全平方、立方和差三组展开结果。", "tags": ["zhengshi", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「长除法」？", "back": "逐次消去最高次项的多项式除法。", "tags": ["zhengshi", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「带余除式」？", "back": "A=BQ+R，余式次数低于除式。", "tags": ["zhengshi", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「恒等」？", "back": "对字母的一切取值两边都相等。", "tags": ["zhengshi", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「待定系数法」？", "back": "设出含未知系数的形式，再比较系数求解。", "tags": ["zhengshi", "术语"]}], "companion": "zhengshi学习伴侣.html", "deriv": "zhengshi从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">数与字母、乘法分配律<\/span><\/div><h1>第 1 章：整式的概念与加减法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：数与字母、乘法分配律\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n分清单项式的系数与次数、多项式的项与次数\n<\/li><li>\n识别同类项并按分配律合并\n<\/li><li>\n正确去括号、添括号\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>整式的加减只做一件事：把字母部分完全相同的项并起来，系数相加。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 单项式<\/h3>\n<p>数与字母的乘积叫<strong>单项式<\/strong>，单独一个数或一个字母也算单项式。例如 5x、−3x²y、7、a 都是单项式。<\/p>\n<ul><li>\n<strong>系数<\/strong>：单项式里的数字因数。−3x²y 的系数是 −3。\n<\/li><li>\n<strong>次数<\/strong>：所有字母的指数之和。−3x²y 的次数是 2+1=3。\n<\/ul>\n<h3>1.2 多项式<\/h3>\n<p>几个单项式的和叫<strong>多项式<\/strong>，其中每个单项式叫<strong>项<\/strong>，不含字母的项叫<strong>常数项<\/strong>。多项式里次数最高的项的次数，就是这个多项式的<strong>次数<\/strong>。<\/p>\n<p>例如 3x²−2x+5 是二次三项式：三项分别是 3x²、−2x、5，次数为 2。<\/p>\n<h3>1.3 同类项与合并<\/h3>\n<p><strong>字母相同、并且相同字母的指数也相同<\/strong>的项叫同类项。3x²y 与 −7x²y 是同类项；3x² 与 3x 不是（指数不同）。<\/p>\n<p>合并同类项的依据是分配律：<\/p>\n<p>3x²+5x²=(3+5)x²=8x²<\/p>\n<p>字母部分原样保留，只把系数相加。常数项之间也是同类项。<\/p>\n<h3>1.4 去括号与添括号<\/h3>\n<p>括号前是“+”，去括号后各项符号不变；括号前是“−”，去括号后各项都变号：<\/p>\n<p>a−(b+c)=a−b−c<\/p>\n<p>理由仍是分配律：a−(b+c)=a+(−1)(b+c)=a−b−c。添括号是反方向：需要把几项括起来时，括号前加“−”，括进去的每一项都要变号。<\/p>\n<h3>1.5 化简的顺序<\/h3>\n<p>先去括号（由内向外），再合并同类项；有多个括号时，每去一层就检查一次符号。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：同类项像同一种水果——3 个苹果加 5 个苹果是 8 个苹果，但 3 个苹果加 5 个梨不能合并。<\/p>\n<p><strong>失效边界<\/strong>：字母部分只要有一处不同（哪怕只是指数不同），就不是同类项，不能合并。<\/p>\n<p><strong>实例<\/strong>：化简 3x²y−2xy²+5x²y−xy²。 同类项分组：(3+5)x²y + (−2−1)xy² = 8x²y−3xy²。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 3x² 与 3x 是同类项 —— 实际上 指数不同就不是同类项。x² 与 x 表示不同的字母幂，不能合并。\n<\/li><li>\n别以为 2(x+y)=2x+y —— 实际上 分配律要求括号内每一项都乘：2(x+y)=2x+2y。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n−3x²y 的系数与次数分别是：\n<\/li><li>\n化简 a−(2a−b)+b 的结果是：\n<p>A. −3，2 ｜ B. −3，3 ｜ C. 3，3 ｜ D. 3，2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：系数是数字因数 −3；次数是各字母指数之和 2+1=3。 A. −a+2b ｜ B. −a ｜ C. 3a ｜ D. −a−2b <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：去括号：a−2a+b+b = −a+2b。括号前是负号，−b 变 +b。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单项式看系数与次数，多项式看项与最高次\n<\/li><li>\n同类项两条件：字母相同、指数相同\n<\/li><li>\n括号前是负号，去括号每一项都变号\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：整式的概念与加减法）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：整式的概念与加减法<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>整式加减没有新规则，全部来自分配律。下面把三条常用变形逐条还原成分配律。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>单项式是数与字母的乘积；多项式是若干个单项式的和。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>合并同类项像清点库存：同一种货才能加在一起，不同货只能并列记着。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 合并同类项的依据<\/h3>\n<div class=\"katex-block\">3x^{2}+5x^{2}=(3+5)x^{2}=8x^{2}<\/div>\n<p>把 x² 看成公因式，用分配律反过来提出来。<\/p>\n<h3>2. 去括号的依据<\/h3>\n<div class=\"katex-block\">a-(b+c)=a+(-1)(b+c)=a-b-c<\/div>\n<p>括号前是负号，等于括号内每一项都乘 −1。<\/p>\n<h3>3. 多项式次数<\/h3>\n<div class=\"katex-block\">\\deg P=\\max\\{\\deg(\\text{各项})\\}<\/div>\n<p>次数取最高的那一项，不看系数大小。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>系数相加只对“字母部分完全相同”的项成立；字母部分不同时相加没有意义。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《整式》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zhengshi/chapter/ch01\">第 1 章：整式的概念与加减法<\/a><\/span><\/div><h1>第 2 章：整式的乘法与乘法公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、指数法则\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按“系数相乘、指数相加”做单项式乘法\n<\/li><li>\n用分配律展开多项式乘法并合并同类项\n<\/li><li>\n默写并逆用三个乘法公式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>乘法就是反复用分配律展开；指数法则负责字母部分，乘法公式是展开结果的压缩记忆。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 单项式乘单项式<\/h3>\n<p>系数相乘，同底数幂的指数相加：<\/p>\n<p>(−2x²y)(3xy³) = (−2×3)·x<sup>2+1<\/sup>·y<sup>1+3<\/sup> = −6x³y⁴<\/p>\n<p>不同字母各自保留，不要强行相加指数。<\/p>\n<h3>2.2 单项式乘多项式、多项式乘多项式<\/h3>\n<p>单项式乘多项式，把单项式乘到括号内每一项：<\/p>\n<p>a(b+c)=ab+ac<\/p>\n<p>多项式乘多项式，前一个多项式的每一项乘后一个多项式的每一项，再把同类项并起来：<\/p>\n<p>(a+b)(c+d)=ac+ad+bc+bd<\/p>\n<p>展开后项数是两个多项式项数的乘积，合并同类项前先数项，能及时发现漏乘。<\/p>\n<h3>2.3 三个乘法公式<\/h3>\n<ul><li>\n<strong>平方差<\/strong>：(a+b)(a−b)=a²−b²\n<\/li><li>\n<strong>完全平方<\/strong>：(a±b)²=a²±2ab+b²\n<\/li><li>\n<strong>立方和差<\/strong>：(a±b)(a²∓ab+b²)=a³±b³\n<\/ul>\n<p>三个公式都是展开后的特例，不是新规则。记不住时，直接展开一遍即可。<\/p>\n<h3>2.4 正用与逆用<\/h3>\n<p>正用：把乘积写成多项式，如 (2x−3y)(2x+3y)=4x²−9y²。<\/p>\n<p>逆用：把多项式写成乘积，如 x²−9=(x−3)(x+3)。逆用是后面因式分解的入口。<\/p>\n<p>数值计算里也能用：99×101=(100−1)(100+1)=100²−1=9999。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：多项式乘法像发牌——第一个括号里每一项都要和第二个括号里每一项碰一次，碰完再归类。<\/p>\n<p><strong>失效边界<\/strong>：碰的次数是项数相乘，项数多时容易漏；公式只在结构完全对上时才能套。<\/p>\n<p><strong>实例<\/strong>：展开 (x+2)(x−3)。 逐项相乘：x²−3x+2x−6 = x²−x−6。 若用公式检查：这不是平方差结构（两项符号不同但常数不等），不能硬套。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 (a+b)²=a²+b² —— 实际上 漏了中间项。正确结果是 a²+2ab+b²，可用 a=1,b=1 代入检验：左边 4，右边 2。\n<\/li><li>\n别以为 x²−9 不能再分解 —— 实际上 它是平方差，x²−9=(x−3)(x+3)，逆用公式即可。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n展开 (2x−3)(2x+3) 的结果是：\n<\/li><li>\n计算 102×98 最简便的算法是：\n<p>A. 4x²−9 ｜ B. 4x²+9 ｜ C. 4x²−12x+9 ｜ D. 4x²−6x−9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：平方差公式：(2x)²−3²=4x²−9。 A. 102×100−102×2 ｜ B. (100+2)(100−2)=100²−4 ｜ C. 100×98+2×98 ｜ D. 直接竖式相乘 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：102×98=(100+2)(100−2)=100²−2²=9996，用平方差一步到位。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单项式相乘：系数乘系数，指数相加\n<\/li><li>\n多项式相乘：逐项相乘后合并同类项\n<\/li><li>\n平方差与完全平方都是展开的特例\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：整式的乘法与乘法公式）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：整式的乘法与乘法公式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>乘法公式没有一条是“新规定”，全部能从分配律展开得到。下面展开三次，看清中间项从哪里来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>两个多项式相乘，等于把第一个的每一项分别乘第二个的每一项，再把结果相加。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>展开像把两张清单交叉配对：左边每一项都要和右边每一项配一次，配完再按同类归堆。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 平方差<\/h3>\n<div class=\"katex-block\">(a+b)(a-b)=a^{2}-ab+ab-b^{2}=a^{2}-b^{2}<\/div>\n<p>中间两项 −ab 与 +ab 相消，只剩两个平方。<\/p>\n<h3>2. 完全平方<\/h3>\n<div class=\"katex-block\">(a+b)^{2}=(a+b)(a+b)=a^{2}+ab+ba+b^{2}=a^{2}+2ab+b^{2}<\/div>\n<p>中间两项 ab 与 ba 相同，合并成 2ab。<\/p>\n<h3>3. 指数法则<\/h3>\n<div class=\"katex-block\">a^{m}\\cdot a^{n}=a^{m+n}<\/div>\n<p>m 个 a 再乘 n 个 a，一共 m+n 个 a，所以指数相加。<\/p>\n<h3>4. 逆用示例<\/h3>\n<div class=\"katex-block\">x^{2}-9=(x-3)(x+3)<\/div>\n<p>把 x²−3² 认成平方差，反着写回乘积形式。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>公式套用要求结构完全一致；项的顺序、符号、系数都要对上，否则回到逐项展开。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《整式》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zhengshi/chapter/ch02\">第 2 章：整式的乘法与乘法公式<\/a><\/span><\/div><h1>第 3 章：整式的除法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按“系数相除、指数相减”做单项式除法\n<\/li><li>\n用长除法做多项式除以多项式\n<\/li><li>\n写出带余除式 A=BQ+R 并判断余式次数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>除法是指数法则的逆用；除不尽时写成 A=BQ+R，余式的次数必须低于除式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 单项式除以单项式<\/h3>\n<p>系数相除，同底数幂的指数相减：<\/p>\n<p>6x⁵y³ ÷ 2x²y = 3x<sup>5−2<\/sup>y<sup>3−1<\/sup> = 3x³y²<\/p>\n<p>被除式里没有的字母，结果中也不出现；指数相减出现负数时，按负指数写成倒数。<\/p>\n<h3>3.2 多项式除以单项式<\/h3>\n<p>把多项式的每一项分别除以这个单项式，再把商相加：<\/p>\n<p>(6x³−4x²)÷2x = 3x²−2x<\/p>\n<h3>3.3 多项式除以多项式：长除法<\/h3>\n<p>步骤与整数长除法相同：<\/p>\n<ol><li>\n用被除式的最高次项除以除式的最高次项，得到商的第一项；\n<\/li><li>\n用这一项乘除式，从被除式里减掉；\n<\/li><li>\n对余下的式子重复上述两步，直到余式的次数低于除式。\n<\/ol>\n<p>例：(x³−1)÷(x−1)。第一次商 x²，减得 x²−1；再商 x，减得 x−1；再商 1，减得 0。所以商是 x²+x+1，余式为 0。<\/p>\n<h3>3.4 带余除式<\/h3>\n<p>一般地，对被除式 A、除式 B（B≠0），存在唯一的商 Q 与余式 R，使<\/p>\n<p>A = BQ + R，且 R 的次数低于 B 的次数（或 R=0）<\/p>\n<p>这条式子是后面“余数定理”“因式定理”的基础。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：长除法像分装——每次先用最大的盒子装，装完把剩下的再分，直到剩下的装不满一个盒子。<\/p>\n<p><strong>失效边界<\/strong>：除法要求除式不为零；除式是零多项式时整个式子没有意义。<\/p>\n<p><strong>实例<\/strong>：(2x³+3x²−5x+2)÷(x+2)。 第一次商 2x²，乘除式得 2x³+4x²，相减得 −x²−5x+2； 再商 −x，乘得 −x²−2x，相减得 −3x+2； 再商 −3，乘得 −3x−6，相减得 8。 所以商 2x²−x−3，余式 8，即 2x³+3x²−5x+2=(x+2)(2x²−x−3)+8。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 除法就是指数相减，任何式子都能除尽 —— 实际上 只有单项式相除才直接减指数；多项式相除可能有余式，余式不为零就除不尽。\n<\/li><li>\n别以为 余式可以任意次数 —— 实际上 带余除式要求余式次数严格低于除式次数，否则还能继续除。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n12x⁴y²÷3x²y 的结果是：\n<\/li><li>\n(x²−1)÷(x−1) 的商与余式分别是：\n<p>A. 4x²y ｜ B. 4x⁶y³ ｜ C. 4x²y² ｜ D. 4x² <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：系数 12÷3=4；x 的指数 4−2=2；y 的指数 2−1=1，得 4x²y。 A. x+1，0 ｜ B. x−1，0 ｜ C. x+1，2 ｜ D. x，1 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：x²−1=(x−1)(x+1)，整除，商 x+1，余式 0。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单项式相除：系数相除、指数相减\n<\/li><li>\n多项式相除用长除法，逐次消去最高次项\n<\/li><li>\n带余除式：A=BQ+R，R 的次数低于 B\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：整式的除法）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：整式的除法<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>除法只是乘法的逆运算。理解了“指数相减来自指数相加”，长除法就不需要背步骤。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>若存在多项式 Q、R 使 A=BQ+R 且 R 的次数低于 B（或 R=0），则 Q 为商、R 为余式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>长除法像削苹果：每次削掉能被除式整除的那一层，直到剩下的小于一个除式。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 单项式相除<\/h3>\n<div class=\"katex-block\">\\frac{a^{m}}{a^{n}}=a^{m-n}\\quad(a\\ne 0)<\/div>\n<p>由 a<sup>m-n<\/sup>\\cdot a<sup>n<\/sup>=a<sup>m<\/sup> 反推，指数相减是指数相加的逆。<\/p>\n<h3>2. 系数相除<\/h3>\n<div class=\"katex-block\">\\frac{6x^{5}y^{3}}{2x^{2}y}=3x^{3}y^{2}<\/div>\n<p>系数照常相除，字母部分按同一字母的指数相减。<\/p>\n<h3>3. 带余除式<\/h3>\n<div class=\"katex-block\">A=BQ+R,\\quad \\deg R<\\deg B<\/div>\n<p>余式次数必须低于除式，否则还能再商一次。<\/p>\n<h3>4. 整除的判据<\/h3>\n<div class=\"katex-block\">B\\mid A\\iff R=0<\/div>\n<p>余式为零就是整除；这也是因式定理的来源。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>带余除式的唯一性依赖“次数严格下降”，否则商可以无限加项。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《整式》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch04": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zhengshi/chapter/ch03\">第 3 章：整式的除法<\/a><\/span><\/div><h1>第 4 章：多项式恒等定理与待定系数法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清两个多项式在什么条件下恒等\n<\/li><li>\n用比较系数或代特殊值求未知系数\n<\/li><li>\n判断一个恒等式是否可能成立\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>两个次数不超过 n 的多项式，只要在 n+1 个不同点取值相同，就恒等；于是可以设出系数再解方程。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 什么是恒等<\/h3>\n<p>两个多项式恒等，指对字母的任意取值，两边的值都相等，记作 P(x)≡Q(x)。<\/p>\n<p>注意区别：方程只要求“某些 x 使两边相等”，恒等式要求“所有 x 都相等”。<\/p>\n<h3>4.2 恒等定理<\/h3>\n<p>如果两个次数都不超过 n 的多项式 P、Q 在 n+1 个互不相同的点上取值相同，那么 P≡Q。<\/p>\n<p>直观理由：P−Q 的次数不超过 n；如果它不是零多项式，最多只有 n 个根。现在它有 n+1 个不同的根，只能恒等于零。<\/p>\n<h3>4.3 待定系数法<\/h3>\n<p>步骤：<\/p>\n<ol><li>\n按已知结构设出带未知系数的形式（如 ax²+bx+c）；\n<\/li><li>\n展开、合并同类项，或代入几个特殊值；\n<\/li><li>\n比较两边同类项的系数（或解方程组），求出未知系数；\n<\/li><li>\n回代检验。\n<\/ol>\n<p>常用特殊值：x=0 求常数项，x=1 求系数和，x=−1 求交错和。<\/p>\n<h3>4.4 典型用法<\/h3>\n<ul><li>\n求参数：已知 x²+ax+b≡(x−1)(x+3)，展开右边得 x²+2x−3，比较系数得 a=2，b=−3。\n<\/li><li>\n拆分分式：把有理分式拆成几个简单分式之和（第 4 册会用到）。\n<\/li><li>\n判断命题：若两边次数不同，恒等一定不成立，不必再算。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：恒等定理像“指纹比对”——不必逐点验证整条曲线，只要在足够多的点上对上了，两条曲线就只能是同一条。<\/p>\n<p><strong>失效边界<\/strong>：点数必须超过次数。“足够多”不是随便几个，n 次多项式要 n+1 个点。<\/p>\n<p><strong>实例<\/strong>：求 a、b 使 x²+ax+b≡(x−2)(x+5)。 右边展开：x²+3x−10。比较系数：a=3，b=−10。 检验：取 x=0，左边 b=−10，右边 (−2)(5)=−10，一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 只要有两个点取值相同就恒等 —— 实际上 两点只能确定一次多项式；二次及以上需要三个以上不同的点。\n<\/li><li>\n别以为 恒等式可以直接用“移项求解”的方式处理 —— 实际上 恒等式对所有 x 成立，比较的是系数，不是解出某个 x。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 x²+ax+b≡(x−1)(x+4)，则 a、b 为：\n<\/li><li>\n两个三次多项式在几个不同点上取值相同，就一定能判定它们恒等？\n<p>A. a=3，b=−4 ｜ B. a=5，b=4 ｜ C. a=−3，b=−4 ｜ D. a=3，b=4 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：右边展开 x²+3x−4，比较系数得 a=3，b=−4。 A. 2 个 ｜ B. 3 个 ｜ C. 4 个 ｜ D. 1 个 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：次数为 3，需要 n+1=4 个不同的点；少于 4 个不足以排除差多项式有根的情况。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n恒等：对所有取值都相等；方程：只对某些取值相等\n<\/li><li>\nn 次多项式需 n+1 个点才能定死\n<\/li><li>\n待定系数法：设形式 → 比较系数 → 解方程 → 回代\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：多项式恒等定理与待定系数法）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：多项式恒等定理与待定系数法<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>恒等定理的证明只用一句话：差多项式的根太多，只能是零多项式。下面把它写清楚。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>P≡Q 指对一切 x，P(x)=Q(x)。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像两条路线图：如果在足够多的路口都重合，且两条路都是“直路”（次数有限），那它们只能是同一条路。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 差多项式<\/h3>\n<div class=\"katex-block\">D(x)=P(x)-Q(x),\\quad \\deg D\\le n<\/div>\n<p>两个 n 次多项式相减，次数不会超过 n。<\/p>\n<h3>2. 根的上限<\/h3>\n<div class=\"katex-block\">D\\not\\equiv 0\\ \\Rightarrow\\ D\\ \\text{至多有}\\ n\\ \\text{个根}<\/div>\n<p>非零多项式的根数不超过其次数，这是代数基本事实。<\/p>\n<h3>3. 矛盾<\/h3>\n<div class=\"katex-block\">D(x_i)=0\\ (i=1,\\ldots,n+1)\\ \\Rightarrow\\ D\\equiv 0<\/div>\n<p>n+1 个不同的根超过了上限，所以差多项式只能恒为零。<\/p>\n<h3>4. 待定系数<\/h3>\n<div class=\"katex-block\">x^{2}+ax+b\\equiv (x-1)(x+3)=x^{2}+2x-3<\/div>\n<p>展开右边，比较同次项系数：a=2，b=−3。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>点数不足时结论不成立；此外定理只对“多项式”成立，对一般函数不成立。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《整式》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zhengshi/chapter/ch01\">第 1 章：整式的概念与加减法<\/a><\/span><\/div><h1>同类项与合并<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>字母相同、对应指数也相同的项，才能把系数加起来。<\/p>\n<h2>为什么重要<\/h2>\n<p>整式加减的全部技术都在这里；判断错同类项，后面化简、因式分解都会连锁出错。<\/p>\n<h2>详解<\/h2>\n<p>判断同类项看两件事：字母种类是否完全一致、每个字母的指数是否一致。系数与字母的排列顺序不影响。合并时只加系数，字母部分照抄。<\/p>\n<h2>常见误解<\/h2>\n<p>别把“字母相同”当成同类项的全部条件：x² 与 x 字母相同但指数不同，不能合并。<\/p>\n<h2>相关概念<\/h2>\n<p>单项式（ch01）、分配律（ch01）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zhengshi/chapter/ch03\">第 3 章：整式的除法<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zhengshi/chapter/ch04\">第 4 章：多项式恒等定理与待定系数法<\/a><\/span><\/div><h1>带余除式与恒等定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>除不尽就写成 A=BQ+R；两个多项式在足够多点重合就恒等。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两条是“整式”从计算走向理论的转折：一条给出除法的完整结果，一条给出判断两个式子是否同一的办法。<\/p>\n<h2>详解<\/h2>\n<p>带余除式保证余式次数低于除式，从而商与余式唯一；恒等定理把“逐点验证”压缩成“有限个点验证”，两者都靠“次数”这个有限指标起作用。<\/p>\n<h2>常见误解<\/h2>\n<p>把“在若干点相等”当成恒等：点数不足时不成立。<\/p>\n<h2>相关概念<\/h2>\n<p>长除法（ch03）、待定系数法（ch04）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：整式的概念与加减法<\/strong><br>阅读：<a href=\"#/book/zhengshi/chapter/ch01\">第 1 章：整式的概念与加减法<\/a><br>检查点：能判断同类项并化简含括号的多项式<\/li><li class='path-step' id='path-02'><strong>步骤 02：整式的乘法与乘法公式<\/strong><br>阅读：<a href=\"#/book/zhengshi/chapter/ch02\">第 2 章：整式的乘法与乘法公式<\/a><br>检查点：能默写三个乘法公式并逆用<\/li><li class='path-step' id='path-03'><strong>步骤 03：整式的除法<\/strong><br>阅读：<a href=\"#/book/zhengshi/chapter/ch03\">第 3 章：整式的除法<\/a><br>检查点：能做多项式长除法并写出带余除式<\/li><li class='path-step' id='path-04'><strong>步骤 04：多项式恒等定理与待定系数法<\/strong><br>阅读：<a href=\"#/book/zhengshi/chapter/ch04\">第 4 章：多项式恒等定理与待定系数法<\/a><br>检查点：能设系数解出使两式恒等的参数<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：整式的概念与加减法<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> −3x²y 的系数与次数分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> −3，2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> −3，3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 3，3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 3，2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 化简 a−(2a−b)+b 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> −a+2b<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1' 1)÷(x−1) 的商与余式分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> x+1，0<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> x−1，0<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> x+1，2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> x，1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：多项式恒等定理与待定系数法<\/h1><div class='quiz-item' data-qid='ch04-q07' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 若 x²+ax+b≡(x−1)(x+4)，则 a、b 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> a=3，b=−4<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> a=5，b=4<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> a=−3，b=−4<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> a=3，b=4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 两个三次多项式在几个不同点上取值相同，就一定能判定它们恒等？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> 2 个<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> 3 个<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> 4 个<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> 1 个<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='单项式'>单项式 — 数与字母的乘积，单独一个数或字母也算。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='系数'>系数 — 单项式中的数字因数。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='次数'>次数 — 单项式各字母指数之和；多项式取最高次项的次数。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='同类项'>同类项 — 字母相同且相同字母指数也相同的项。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='分配律'>分配律 — a(b+c)=ab+ac，整式变形的基本依据。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='乘法公式'>乘法公式 — 平方差、完全平方、立方和差三组展开结果。 <span class=glossary-ref>（第 2 章：整式的乘法与乘法公式）<\/span><\/li><li data-term='长除法'>长除法 — 逐次消去最高次项的多项式除法。 <span class=glossary-ref>（第 3 章：整式的除法）<\/span><\/li><li data-term='带余除式'>带余除式 — A=BQ+R，余式次数低于除式。 <span class=glossary-ref>（第 3 章：整式的除法）<\/span><\/li><li data-term='恒等'>恒等 — 对字母的一切取值两边都相等。 <span class=glossary-ref>（第 4 章：多项式恒等定理与待定系数法）<\/span><\/li><li data-term='待定系数法'>待定系数法 — 设出含未知系数的形式，再比较系数求解。 <span class=glossary-ref>（第 4 章：多项式恒等定理与待定系数法）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：整式变形的三步<\/h2>\n<p>① 看结构（单项式／多项式、次数、项数）；② 选工具（合并同类项、分配律、公式、长除法）；③ 回代检验（取特殊值核对）。<\/p>\n<h2>框架：公式的三种用法<\/h2>\n<p>正用（展开）、逆用（分解）、数值化（把数字凑成公式结构做速算）。逆用是最容易被忽略的一种。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>单项式乘单项式<\/td><td>系数相乘，同底数幂指数相加<\/td><\/tr><tr><td>单项式除以单项式<\/td><td>系数相除，同底数幂指数相减<\/td><\/tr><tr><td>平方差<\/td><td>(a+b)(a−b)=a²−b²<\/td><\/tr><tr><td>完全平方<\/td><td>(a±b)²=a²±2ab+b²<\/td><\/tr><tr><td>立方和差<\/td><td>(a±b)(a²∓ab+b²)=a³±b³<\/td><\/tr><tr><td>带余除式<\/td><td>A=BQ+R，deg R&lt;deg B<\/td><\/tr><tr><td>恒等判据<\/td><td>次数≤n 的两式在 n+1 个不同点相等 ⇒ 恒等<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：整式的概念与加减法", "href": "#/chapter/ch01"}, {"label": "第 2 章：整式的乘法与乘法公式", "href": "#/chapter/ch02"}, {"label": "第 3 章：整式的除法", "href": "#/chapter/ch03"}, {"label": "第 4 章：多项式恒等定理与待定系数法", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "同类项与合并", "href": "#/concept/c01"}, {"label": "带余除式与恒等定理", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：整式的概念与加减法", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：整式的乘法与乘法公式", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：整式的除法", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：多项式恒等定理与待定系数法", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true, "ch04": true}},"equations-1-2":{"manifest": {"slug": "equations-1-2", "title": "一次方程与二次方程", "subtitle": "把未知当已知用：从移项到求根公式", "book": {"title": "一次方程与二次方程", "author": "王厚纯 张凤韬", "source": ["数学基础知识丛书-03-一次方程与二次方程 王厚纯 张凤韬.pdf"]}, "audience": "零基础", "goal": "会用同解变形解一次方程与一次方程组，能自己推出二次方程求根公式并用判别式、韦达定理判断根的情况。", "learning ": "方程 x²+2x+5=0 的根的情况是：", "options": ["两个不等实根", "两个相等实根", "没有实根", "无法判断"], "answer": 2, "explain": "Δ=4−20=−16<0，无实根。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "ch04-q07", "chapterId": "ch04", "type": "single", "question": "方程 x⁴−5x²+4=0 的实根个数是：", "options": ["2", "3", "4", "0"], "answer": 2, "explain": "设 t=x²：t²−5t+4=0 得 t=1 或 4，均非负，故 x=±1、±2，共 4 个实根。", "relatedConceptId": "c01", "prerequisites": ["ch04"]}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "解分式方程时，验根的目的是：", "options": ["检查计算是否正确", "排除使分母为零的增根", "确认解是正数", "检查是否为整数"], "answer": 1, "explain": "去分母时乘了含未知数的式子，可能引入使分母为零的根，必须代回原方程排除。", "relatedConceptId": "c01", "prerequisites": ["ch04"]}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "方程 x²−2x−8=0 的两根之和与两根之积分别是：", "options": ["2 和 −8", "−2 和 −8", "2 和 8", "−2 和 8"], "answer": 0, "explain": "a=1，b=−2，c=−8：和为 −b/a=2，积为 c/a=−8。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "若关于 x 的方程 kx²+2x+1=0 有两个不相等的实根，则 k 的取值范围是：", "options": ["k<1", "k<1 且 k≠0", "k>1", "k≤1"], "answer": 1, "explain": "二次方程要求 k≠0；两个不等实根要求 Δ=4−4k>0，即 k<1。合起来 k<1 且 k≠0。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：一元一次方程」的一句话核心是什么？", "back": "解方程就是在等式两边同时做同一件事，把未知数一步步孤立出来。", "tags": ["equations-1-2", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：一次方程组」的一句话核心是什么？", "back": "解方程组只有一个策略：消元——把多个未知数一个个消掉，直到只剩一个。", "tags": ["equations-1-2", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：一元二次方程」的一句话核心是什么？", "back": "二次方程靠配方变成“完全平方＝常数”，开方就得到两个根；判别式就是那个常数是否非负。", "tags": ["equations-1-2", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：二次方程组与可化归方程」的一句话核心是什么？", "back": "遇到高次或复杂方程，先想办法降次或消元；化归之后必须回代验根，因为变形可能扩大定义域。", "tags": ["equations-1-2", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「方程」？", "back": "含未知数的等式，使等式成立的未知数值叫解。", "tags": ["equations-1-2", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「移项」？", "back": "把项从等式一边移到另一边并变号，本质是两边同加相反数。", "tags": ["equations-1-2", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「消元」？", "back": "通过代入或加减，减少方程组中未知数的个数。", "tags": ["equations-1-2", "术语"]}, {"id": "f08", "chapterId": "ch03", "front": "什么是「配方」？", "back": "把二次式改写成完全平方加常数的形式。", "tags": ["equations-1-2", "术语"]}, {"id": "f09", "chapterId": "ch03", "front": "什么是「判别式」？", "back": "Δ=b²−4ac，判断二次方程实根个数。", "tags": ["equations-1-2", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「韦达定理」？", "back": "两根之和为 −b/a，两根之积为 c/a。", "tags": ["equations-1-2", "术语"]}, {"id": "f11", "chapterId": "ch04", "front": "什么是「换元」？", "back": "用一个新变量替换原式中的某部分，达到降次或简化。", "tags": ["equations-1-2", "术语"]}, {"id": "f12", "chapterId": "ch04", "front": "什么是「增根」？", "back": "变形后产生、但不满足原方程的解。", "tags": ["equations-1-2", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「验根」？", "back": "把候选解代回原方程，排除增根。", "tags": ["equations-1-2", "术语"]}], "companion": "equations-1-2学习伴侣.html", "deriv": "equations-1-2从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-03-一次方程与二次方程 王厚纯 张凤韬.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">等式性质、四则运算<\/span><\/div><h1>第 1 章：一元一次方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：等式性质、四则运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用移项、去分母把方程化成 ax=b\n<\/li><li>\n讨论 ax+b=0 的三种解情形\n<\/li><li>\n把应用题翻译成方程\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>解方程就是在等式两边同时做同一件事，把未知数一步步孤立出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 等式只有两条性质<\/h3>\n<ol><li>\n两边同加（或同减）同一个数，等式仍成立；\n<\/li><li>\n两边同乘（或同除以）同一个<strong>不为零<\/strong>的数，等式仍成立。\n<\/ol>\n<p>所有变形都由这两条推出，没有第三条。<\/p>\n<h3>1.2 移项就是两边同加相反数<\/h3>\n<p>由 x+3=7，两边同加 −3，得 x=4。习惯上把这一步叫“移项变号”——它其实不是“把项搬过去”，而是两边同时加了一个数。<\/p>\n<h3>1.3 去分母就是两边同乘公倍数<\/h3>\n<p>方程 (x/2)+(x/3)=5，两边同乘 6，得 3x+2x=30。乘以的是分母的最小公倍数，每一项都要乘，不能漏掉不含分母的项。<\/p>\n<h3>1.4 ax+b=0 的三种结局<\/h3>\n<p>化成 ax=−b 后：<\/p>\n<ul><li>\na≠0：唯一解 x=−b/a；\n<\/li><li>\na=0 且 b≠0：0=−b 不成立，无解；\n<\/li><li>\na=0 且 b=0：0=0 恒成立，任意 x 都是解。\n<\/ul>\n<p>讨论参数时必须把这三种都说到，只写 x=−b/a 是不完整的。<\/p>\n<h3>1.5 应用题的四步<\/h3>\n<p>设未知数 → 找等量关系 → 列方程 → 解并回到原题检验（单位、范围是否合理）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：方程像一架天平，两边同时加同样的砝码、同时减半，平衡都不会破。<\/p>\n<p><strong>失效边界<\/strong>：两边不能同乘 0，否则任何等式都变成 0=0，信息全丢。<\/p>\n<p><strong>实例<\/strong>：某数的 3 倍减去 5 等于它的 2 倍加 7，求这个数。 设该数为 x：3x−5=2x+7，移项得 x=12。检验：3×12−5=31，2×12+7=31。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 移项就是把项从一边搬到另一边 —— 实际上 本质是两边同加相反数；只记“搬过去变号”容易在乘除时用错规则。\n<\/li><li>\n别以为 方程两边可以同时除以任何式子 —— 实际上 除数必须不为零；含未知数的除式要先确认它不等于零。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n方程 2(x−1)=x+3 的解是：\n<\/li><li>\n关于 x 的方程 ax=b，下列说法正确的是：\n<p>A. x=1 ｜ B. x=5 ｜ C. x=3 ｜ D. x=−5 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：展开 2x−2=x+3，移项得 x=5。 A. 一定有唯一解 x=b/a ｜ B. a=0 时一定无解 ｜ C. a=0 且 b=0 时任意 x 都是解 ｜ D. a=0 且 b≠0 时有无穷多解 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：a≠0 时唯一解；a=0、b≠0 无解；a=0、b=0 时恒成立，任意解。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n等式两条性质是所有变形的来源\n<\/li><li>\n移项＝两边同加相反数；去分母＝两边同乘公倍数\n<\/li><li>\nax=b 要按 a 是否为 0 分情形讨论\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：一元一次方程）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：一元一次方程<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>一元一次方程没有技巧，只有一条：两边同时做同一件事。下面把“移项”还原成这条性质。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>只含一个未知数、未知数最高次数为 1 的整式方程叫一元一次方程，标准形 ax+b=0（a≠0）。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>天平：只要两边加同样重、减同样重、同时等比例缩放，平衡关系不变。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 等式性质<\/h3>\n<div class=\"katex-block\">a=b\\ \\Rightarrow\\ a+c=b+c,\\quad ac=bc\\ (c\\ne 0)<\/div>\n<p>两条性质，其他变形都是它们的组合。<\/p>\n<h3>2. 移项<\/h3>\n<div class=\"katex-block\">x+3=7\\ \\Rightarrow\\ x+3+(-3)=7+(-3)\\ \\Rightarrow\\ x=4<\/div>\n<p>“移项变号”只是省略了“两边同加相反数”这一步。<\/p>\n<h3>3. 一般解<\/h3>\n<div class=\"katex-block\">ax+b=0\\ (a\\ne 0)\\ \\Rightarrow\\ x=-\\frac{b}{a}<\/div>\n<p>先化成 ax=−b，再两边同除 a。<\/p>\n<h3>4. 退化情形<\/h3>\n<div class=\"katex-block\">a=0:\\ 0=-b\\ \\Rightarrow\\ \\begin{cases}\\text{无解}, & b\\ne 0\\\\ \\text{任意解}, & b=0\\end{cases}<\/div>\n<p>除数为零时不能除，只能回到原式讨论。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>两边同乘的式子不能为零；含参数的除法要先讨论参数取值。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《一次方程与二次方程》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-03-一次方程与二次方程 王厚纯 张凤韬.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/equations-1-2/chapter/ch01\">第 1 章：一元一次方程<\/a><\/span><\/div><h1>第 2 章：一次方程组<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用代入消元与加减消元把方程组化成一元方程\n<\/li><li>\n处理三元一次方程组\n<\/li><li>\n判断方程组无解或有无穷多解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>解方程组只有一个策略：消元——把多个未知数一个个消掉，直到只剩一个。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 代入消元<\/h3>\n<p>从一个方程里解出一个未知数，代入另一个方程。例：<\/p>\n<p>x+y=5，2x−y=1。由第一式 y=5−x，代入第二式得 2x−(5−x)=1，即 3x=6，x=2，y=3。<\/p>\n<h3>2.2 加减消元<\/h3>\n<p>把两个方程适当相乘，使某个未知数的系数相等或互为相反数，再相减或相加。<\/p>\n<p>2x+3y=12，4x−3y=6。两式相加得 6x=18，x=3，回代得 y=2。<\/p>\n<h3>2.3 三元方程组<\/h3>\n<p>先用两个方程消去同一个未知数，得到一个新的二元方程组，再解二元，最后回代求第三个未知数。消元时要固定消同一个字母，否则会绕回原处。<\/p>\n<h3>2.4 解的三种情形<\/h3>\n<p>把方程组化成阶梯形后看最后一行：<\/p>\n<ul><li>\n出现 0=非零数：无解（两直线平行或平面平行）；\n<\/li><li>\n出现 0=0：有无穷多解，需用参数表示；\n<\/li><li>\n其余：唯一解。\n<\/ul>\n<p>几何上，二元一次方程组的两条直线相交、平行、重合，正好对应这三种情形。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：消元像“逐个清点”：先确定一个人数，再据此算其他人，不必同时猜所有人。<\/p>\n<p><strong>失效边界<\/strong>：消元时若把两个方程乘的倍数搞错，会得到与原方程组不同解的方程，必须每步都保持等价。<\/p>\n<p><strong>实例<\/strong>：解 3x+2y=12，x−y=1。 由第二式 x=1+y，代入第一式 3(1+y)+2y=12 ⇒ 5y=9 ⇒ y=9/5，x=14/5。检验：3×14/5+2×9/5=42/5+18/5=60/5=12。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 两个方程相加后可以随便取一个原方程组合成新方程组 —— 实际上 相加减必须保持等价，最好固定保留一个原方程，另一式用加减结果替换。\n<\/li><li>\n别以为 三元方程组一定有三个解 —— 实际上 未知数个数不等于解的个数；可能是唯一解、无解或无穷多解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n方程组 x+y=7，x−y=1 的解是：\n<\/li><li>\n消元后出现 0=5 这样的式子，说明方程组：\n<p>A. x=4，y=3 ｜ B. x=3，y=4 ｜ C. x=5，y=2 ｜ D. x=6，y=1 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：两式相加 2x=8 得 x=4，代回得 y=3。 A. 有唯一解 ｜ B. 有无穷多解 ｜ C. 无解 ｜ D. 解为正数 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：0=5 是矛盾式，说明不存在同时满足所有方程的解，即无解。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n代入消元与加减消元本质都是消去未知数\n<\/li><li>\n三元要先化成二元，固定消同一字母\n<\/li><li>\n0=非零数 ⇒ 无解；0=0 ⇒ 无穷多解\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：一次方程组）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：一次方程组<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>方程组不是新对象：它只是把两个一元方程“捆”在一起。消元就是拆开这层捆绑。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>由若干个含相同未知数的方程组成的一组条件，叫方程组；同时满足所有方程的一组值叫它的解。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像两条线索交叉指认同一个嫌疑人：各自信息不全，合起来就能锁定。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 代入消元<\/h3>\n<div class=\"katex-block\">\\begin{cases}x+y=5\\\\ 2x-y=1\\end{cases}\\ \\Rightarrow\\ y=5-x\\ \\Rightarrow\\ 2x-(5-x)=1<\/div>\n<p>把一个方程解出的表达式代入另一个，未知数少一个。<\/p>\n<h3>2. 加减消元<\/h3>\n<div class=\"katex-block\">\\begin{cases}2x+3y=12\\\\ 4x-3y=6\\end{cases}\\ \\Rightarrow\\ 6x=18<\/div>\n<p>y 的系数互为相反数，直接相加就消掉了 y。<\/p>\n<h3>3. 解的判定<\/h3>\n<div class=\"katex-block\">0\\cdot x=\\begin{cases}\\ne 0 & \\text{无解}\\\\ =0 & \\text{无穷多解}\\end{cases}<\/div>\n<p>化成阶梯形后，最后一行决定解的类型。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>消元必须保持等价；两边相乘时若乘的式子含未知数，可能引入增解。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《一次方程与二次方程》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-03-一次方程与二次方程 王厚纯 张凤韬.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/equations-1-2/chapter/ch02\">第 2 章：一次方程组<\/a><\/span><\/div><h1>第 3 章：一元二次方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、配方、开方\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用配方法推出求根公式\n<\/li><li>\n用判别式判断根的个数与类型\n<\/li><li>\n用韦达定理求两根之和、之积\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>二次方程靠配方变成“完全平方＝常数”，开方就得到两个根；判别式就是那个常数是否非负。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 配方的思路<\/h3>\n<p>ax²+bx+c=0（a≠0）。两边除以 a：<\/p>\n<p>x²+(b/a)x+(c/a)=0<\/p>\n<p>把前两项配成完全平方：<\/p>\n<p>(x+b/2a)² = (b²−4ac)/(4a²)<\/p>\n<p>右边是一个确定的数，开方即可。<\/p>\n<h3>3.2 求根公式<\/h3>\n<p>由上式得<\/p>\n<p>x = (−b ± √(b²−4ac)) / (2a)<\/p>\n<p>这就是求根公式。推导只有两步：配方、开方；记不住公式时，现场推一遍比背更可靠。<\/p>\n<h3>3.3 判别式<\/h3>\n<p>记 Δ=b²−4ac：<\/p>\n<ul><li>\nΔ&gt;0：两个不相等的实根；\n<\/li><li>\nΔ=0：两个相等的实根（重根）；\n<\/li><li>\nΔ&lt;0：没有实根（在实数范围内无解）。\n<\/ul>\n<p>判别式只判断“有没有、几个”，不给出具体值。<\/p>\n<h3>3.4 韦达定理<\/h3>\n<p>若 x₁、x₂ 是两根，则<\/p>\n<p>x₁+x₂=−b/a，x₁x₂=c/a<\/p>\n<p>由此可以把二次式写成 a(x−x₁)(x−x₂)，这是后面因式分解与降次的依据。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：配方像把一块不规则的地补成一个正方形——补上的那部分正好是 (b/2a)²。<\/p>\n<p><strong>失效边界<\/strong>：配方只在 a≠0 时可行；a=0 时方程退化为一次，没有两个根。<\/p>\n<p><strong>实例<\/strong>：解 2x²−4x−6=0。 两边除以 2：x²−2x−3=0，配方 (x−1)²=4，开方 x−1=±2，得 x=3 或 x=−1。 用韦达检验：和 3+(−1)=2=−b/a=2；积 3×(−1)=−3=c/a=−3。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Δ&lt;0 时方程没有解 —— 实际上 在实数范围内无解；在复数范围内仍有两个根。说“无解”要说明数域。\n<\/li><li>\n别以为 韦达定理只适用于两根都是正数的情况 —— 实际上 对任意实根（包括负数、重根）都成立，只要求 a≠0。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n方程 x²−5x+6=0 的两根是：\n<\/li><li>\n方程 x²+2x+5=0 的根的情况是：\n<p>A. 2 和 3 ｜ B. −2 和 −3 ｜ C. 1 和 6 ｜ D. −1 和 −6 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：因式分解 (x−2)(x−3)=0，或用公式：Δ=1，x=(5±1)/2。 A. 两个不等实根 ｜ B. 两个相等实根 ｜ C. 没有实根 ｜ D. 无法判断 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：Δ=4−20=−16&lt;0，无实根。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n配方 → 开方 → 求根公式\n<\/li><li>\nΔ&gt;0 两不等实根，Δ=0 重根，Δ&lt;0 无实根\n<\/li><li>\n韦达：和 −b/a，积 c/a\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：一元二次方程）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：一元二次方程<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>求根公式不是天上掉下来的：把二次式补成完全平方，再开方，就得到它。下面四步推完。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>形如 ax²+bx+c=0（a≠0）的方程叫一元二次方程。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>配方像给一张缺角的正方形补角：补上的面积由一次项系数决定，补完就能开方量边长。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 除以首项系数<\/h3>\n<div class=\"katex-block\">x^{2}+\\frac{b}{a}x+\\frac{c}{a}=0<\/div>\n<p>把二次项系数化为 1，方便配方。<\/p>\n<h3>2. 配方<\/h3>\n<div class=\"katex-block\">\\left(x+\\frac{b}{2a}\\right)^{2}=\\frac{b^{2}-4ac}{4a^{2}}<\/div>\n<p>两边加上 (b/2a)²，左边成为完全平方。<\/p>\n<h3>3. 开方<\/h3>\n<div class=\"katex-block\">x+\\frac{b}{2a}=\\pm\\frac{\\sqrt{b^{2}-4ac}}{2a}<\/div>\n<p>右边必须非负才有实根，这就是判别式的来源。<\/p>\n<h3>4. 求根公式<\/h3>\n<div class=\"katex-block\">x=\\frac{-b\\pm\\sqrt{b^{2}-4ac}}{2a}<\/div>\n<p>把左边常数移过去，得到公式。<\/p>\n<h3>5. 韦达定理<\/h3>\n<div class=\"katex-block\">x_{1}+x_{2}=-\\frac{b}{a},\\quad x_{1}x_{2}=\\frac{c}{a}<\/div>\n<p>由求根公式两式相加、相乘即可验证。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>开方要求右边非负；这正是判别式出现的原因。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《一次方程与二次方程》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch04": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-03-一次方程与二次方程 王厚纯 张凤韬.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/equations-1-2/chapter/ch03\">第 3 章：一元二次方程<\/a><\/span><\/div><h1>第 4 章：二次方程组与可化归方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用代入消元解二元二次方程组\n<\/li><li>\n识别双二次方程并用换元降次\n<\/li><li>\n解分式方程、无理方程并验根\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>遇到高次或复杂方程，先想办法降次或消元；化归之后必须回代验根，因为变形可能扩大定义域。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 二元二次方程组<\/h3>\n<p>常见两类：<\/p>\n<ul><li>\n一个二次、一个一次：由一次式解出一个未知数，代入二次式，得到一元二次方程；\n<\/li><li>\n两个都是二次：若有一式可因式分解成两个一次式，就拆成两组一次方程组分别解。\n<\/ul>\n<h3>4.2 双二次方程<\/h3>\n<p>形如 ax⁴+bx²+c=0。设 t=x²，得 at²+bt+c=0；解出 t 后要求 t≥0，再开方得到 x。<\/p>\n<p>注意：解出的 t 若为负，对应的 x 没有实解，必须舍去。<\/p>\n<h3>4.3 分式方程<\/h3>\n<p>两边同乘最简公分母，化成整式方程。<strong>乘的式子可能为零<\/strong>，所以必须验根：把解代回原方程，分母为零的就是增根，要舍去。<\/p>\n<h3>4.4 无理方程<\/h3>\n<p>把含根号的项单独留在一边，两边平方。平方可能引入不满足原式的解，同样必须验根。<\/p>\n<h3>4.5 化归的通用流程<\/h3>\n<p>识别结构（二次／双二次／分式／无理）→ 选择变形（消元、换元、去分母、平方）→ 解出候选根 → 回代验根 → 写出解集。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：化归像换一条更好走的路到同一个目的地，但换路后要核对地址有没有变。<\/p>\n<p><strong>失效边界<\/strong>：平方与去分母都会扩大定义域，不做验根就可能把“假解”写进答案。<\/p>\n<p><strong>实例<\/strong>：解 √(x+1)=x−1。 两边平方：x+1=x²−2x+1 ⇒ x²−3x=0 ⇒ x=0 或 x=3。 验根：x=0 时左边 1、右边 −1，不成立；x=3 时左边 2、右边 2，成立。所以只有 x=3。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 平方后解出的根都是原方程的解 —— 实际上 平方会把负数变成正数，可能产生不满足原式的根，必须验根。\n<\/li><li>\n别以为 双二次方程解出 t 就可以直接写四个根 —— 实际上 t&lt;0 时 x²=t 无实解，要舍去；只有 t≥0 才能开方。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n方程 x⁴−5x²+4=0 的实根个数是：\n<\/li><li>\n解分式方程时，验根的目的是：\n<p>A. 2 ｜ B. 3 ｜ C. 4 ｜ D. 0 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：设 t=x²：t²−5t+4=0 得 t=1 或 4，均非负，故 x=±1、±2，共 4 个实根。 A. 检查计算是否正确 ｜ B. 排除使分母为零的增根 ｜ C. 确认解是正数 ｜ D. 检查是否为整数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：去分母时乘了含未知数的式子，可能引入使分母为零的根，必须代回原方程排除。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二次方程组：一次式代入，或因式分解拆成一次组\n<\/li><li>\n换元降次后要检查新变量的取值范围\n<\/li><li>\n去分母、平方都要验根\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：二次方程组与可化归方程）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：二次方程组与可化归方程<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>所谓“可化归”，就是换一个变量或换一种形式，把陌生的方程变成已会的方程。代价是定义域可能变化。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>通过换元或变形，把方程转化为已会解的方程，叫化归。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像把外语翻译成母语再读：意思要对得上，翻译过程中不能添油加醋。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 双二次换元<\/h3>\n<div class=\"katex-block\">ax^{4}+bx^{2}+c=0\\ \\xrightarrow{t=x^{2}}\\ at^{2}+bt+c=0<\/div>\n<p>四次降成二次；解出 t 后还要回到 x²=t。<\/p>\n<h3>2. 取舍条件<\/h3>\n<div class=\"katex-block\">x^{2}=t\\ \\Rightarrow\\ t\\ge 0<\/div>\n<p>t 为负时没有实根，必须舍去，否则会写出不存在的解。<\/p>\n<h3>3. 分式方程<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}=0\\ \\Rightarrow\\ A=0\\ \\text{且}\\ B\\ne 0<\/div>\n<p>去分母得到 A=0，但分母为零的根要剔除。<\/p>\n<h3>4. 无理方程<\/h3>\n<div class=\"katex-block\">\\sqrt{x+1}=x-1\\ \\Rightarrow\\ x+1=(x-1)^{2}<\/div>\n<p>平方后必须验根，因为右边为负时平方也成立。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>凡是有“平方”“去分母”的变形，都可能引入不属于原方程的解，必须回代检验。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《一次方程与二次方程》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-03-一次方程与二次方程 王厚纯 张凤韬.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/equations-1-2/chapter/ch01\">第 1 章：一元一次方程<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/equations-1-2/chapter/ch04\">第 4 章：二次方程组与可化归方程<\/a><\/span><\/div><h1>同解变形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>两边同时做同一件可逆的事，解集不变；做了不可逆的事（平方、去分母），就要验根。<\/p>\n<h2>为什么重要<\/h2>\n<p>整本书所有解法都建立在“变形不改变解集”上；分不清可逆与不可逆，就会写出增根或丢根。<\/p>\n<h2>详解<\/h2>\n<p>可逆变形包括：两边同加同一个数、同乘同一个非零数、移项、合并同类项。不可逆变形包括：两边平方、两边乘含未知数的式子——它们会把解集扩大，需要回代筛选。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“只要按步骤算，答案一定对”。步骤正确不等于解集正确，关键看每步是否可逆。<\/p>\n<h2>相关概念<\/h2>\n<p>等式性质（ch01）、增根（ch04）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-03-一次方程与二次方程 王厚纯 张凤韬.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/equations-1-2/chapter/ch03\">第 3 章：一元二次方程<\/a><\/span><\/div><h1>判别式与韦达定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Δ=b²−4ac 决定根的个数，韦达给出两根的和与积。<\/p>\n<h2>为什么重要<\/h2>\n<p>不解方程就能判断根的情况、求对称式的值，是二次方程最实用的两条结论。<\/p>\n<h2>详解<\/h2>\n<p>判别式来自配方后右边的符号：右边非负才有实根。韦达定理由求根公式相加、相乘得到，对重根也成立。两者结合可以反求系数、判断根的正负。<\/p>\n<h2>常见误解<\/h2>\n<p>把 Δ 当成“解的大小”；它只说明根的存在与个数，不给出数值。<\/p>\n<h2>相关概念<\/h2>\n<p>求根公式（ch03）、因式分解（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：一元一次方程<\/strong><br>阅读：<a href=\"#/book/equations-1-2/chapter/ch01\">第 1 章：一元一次方程<\/a><br>检查点：能讨论 ax+b=0 的三种解情形<\/li><li class='path-step' id='path-02'><strong>步骤 02：一次方程组<\/strong><br>阅读：<a href=\"#/book/equations-1-2/chapter/ch02\">第 2 章：一次方程组<\/a><br>检查点：能用加减消元解三元方程组<\/li><li class='path-step' id='path-03'><strong>步骤 03：一元二次方程<\/strong><br>阅读：<a href=\"#/book/equations-1-2/chapter/ch03\">第 3 章：一元二次方程<\/a><br>检查点：能默写求根公式并用判别式判断根<\/li><li class='path-step' id='path-04'><strong>步骤 04：二次方程组与可化归方程<\/strong><br>阅读：<a href=\"#/book/equations-1-2/chapter/ch04\">第 4 章：二次方程组与可化归方程<\/a><br>检查点：能消元解二次方程组并验根<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：一元一次方程<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 方程 2(x−1)=x+3 的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> x=1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> x=5<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> x=3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> x=−5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 关于 x 的方程 ax=b，下列说法正确的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 一定有唯一解 x=b/a<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> a=0 时一定无解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> a=0 且 b=0 时任意 x 都是解<\/label><label class='quiz-opt'><inpu <div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single' data-concept='c01' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 解分式方程时，验根的目的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> 检查计算是否正确<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> 排除使分母为零的增根<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> 确认解是正数<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> 检查是否为整数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='方程'>方程 — 含未知数的等式，使等式成立的未知数值叫解。 <span class=glossary-ref>（第 1 章：一元一次方程）<\/span><\/li><li data-term='移项'>移项 — 把项从等式一边移到另一边并变号，本质是两边同加相反数。 <span class=glossary-ref>（第 1 章：一元一次方程）<\/span><\/li><li data-term='消元'>消元 — 通过代入或加减，减少方程组中未知数的个数。 <span class=glossary-ref>（第 2 章：一次方程组）<\/span><\/li><li data-term='配方'>配方 — 把二次式改写成完全平方加常数的形式。 <span class=glossary-ref>（第 3 章：一元二次方程）<\/span><\/li><li data-term='判别式'>判别式 — Δ=b²−4ac，判断二次方程实根个数。 <span class=glossary-ref>（第 3 章：一元二次方程）<\/span><\/li><li data-term='韦达定理'>韦达定理 — 两根之和为 −b/a，两根之积为 c/a。 <span class=glossary-ref>（第 3 章：一元二次方程）<\/span><\/li><li data-term='换元'>换元 — 用一个新变量替换原式中的某部分，达到降次或简化。 <span class=glossary-ref>（第 4 章：二次方程组与可化归方程）<\/span><\/li><li data-term='增根'>增根 — 变形后产生、但不满足原方程的解。 <span class=glossary-ref>（第 4 章：二次方程组与可化归方程）<\/span><\/li><li data-term='验根'>验根 — 把候选解代回原方程，排除增根。 <span class=glossary-ref>（第 4 章：二次方程组与可化归方程）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：解方程的四步<\/h2>\n<p>① 识别类型；② 选变形（移项／消元／配方／换元／去分母／平方）；③ 解出候选根；④ 回代验证（所有不可逆变形都要验）。<\/p>\n<h2>框架：参数讨论<\/h2>\n<p>含参数的方程先化成标准形，再按“最高次项系数是否为零”“判别式符号”分支讨论，不能默认唯一解。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>一元一次<\/td><td>ax+b=0：a≠0 时 x=−b/a；a=0、b≠0 无解；a=0、b=0 任意解<\/td><\/tr><tr><td>求根公式<\/td><td>x=(−b±√(b²−4ac))/(2a)<\/td><\/tr><tr><td>判别式<\/td><td>Δ&gt;0 两不等实根；Δ=0 重根；Δ&lt;0 无实根<\/td><\/tr><tr><td>韦达定理<\/td><td>x₁+x₂=−b/a；x₁x₂=c/a<\/td><\/tr><tr><td>双二次<\/td><td>设 t=x²，解出 t 后要求 t≥0<\/td><\/tr><tr><td>分式方程<\/td><td>去分母 → 解整式方程 → 验根（排除分母为零）<\/td><\/tr><tr><td>无理方程<\/td><td>孤立根号 → 两边平方 → 验根<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：一元一次方程", "href": "#/chapter/ch01"} -q02", "chapterId": "ch01", "type": "single", "question": "化简 (x²−1)/(x²+x) 的结果是：", "options": ["(x−1)/x", "x−1", "1/x", "(x+1)/x"], "answer": 0, "explain": "分子 (x−1)(x+1)，分母 x(x+1)，约去 (x+1) 得 (x−1)/x（x≠0，x≠−1）。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "解分式方程产生增根的根本原因是：", "options": ["计算失误", "去分母时乘了含未知数的式子", "方程次数变高", "没有通分"], "answer": 1, "explain": "乘以含未知数的式子会把原定义域外的点带入等式，使不满足原方程的值成为候选解。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "方程 1/(x−2)=0 的解的情况是：", "options": ["x=2", "无解", "x=0", "任意实数"], "answer": 1, "explain": "分式的值为零要求分子为零且分母不为零；这里分子恒为 1，故无解。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "分式 (x²+1)/(x−1) 属于：", "options": ["真分式", "假分式", "整式", "无法判断"], "answer": 1, "explain": "分子次数 2 不低于分母次数 1，是假分式，需先做除法。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "分解 1/[(x−1)(x−2)] 时，应设为：", "options": ["A/(x−1)+B/(x−2)", "A/(x−1)+B/(x−2)+C", "(Ax+B)/(x−1)(x−2)", "A/[(x−1)(x−2)]"], "answer": 0, "explain": "分母是两个不同的一次因式，各对应一个常数分子的一次分式。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "ch04-q07", "chapterId": "ch04", "type": "single", "question": "化简 √(x²−4x+4) 的结果是：", "options": ["x−2", "|x−2|", "2−x", "x+2"], "answer": 1, "explain": "被开方数是 (x−2)²，开方得绝对值 |x−2|，符号随 x 变化。", "relatedConceptId": "c01", "prerequisites": ["ch04"]}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "把 1/(√5−2) 分母有理化的结果是：", "options": ["√5+2", "(√5+2)/9", "√5−2", "(√5−2)/9"], "answer": 0, "explain": "分子分母同乘 (√5+2)：分母 (√5)²−2²=5−4=1，所以结果为 √5+2。", "relatedConceptId": "c01", "prerequisites": ["ch04"]}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "方程 (x²−1)/(x−1)=2 的解是：", "options": ["x=1", "x=−1", "无解", "x=±1"], "answer": 2, "explain": "约分后 x+1=2 得 x=1，但 x=1 使原分母为零，是增根；原方程无解。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "化简 √12+√27−√3 的结果是：", "options": ["4√3", "6√3", "2√3", "√3"], "answer": 0, "explain": "√12=2√3，√27=3√3，合并得 2√3+3√3−√3=4√3。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：有理分式的概念与运算」的一句话核心是什么？", "back": "分式就是两个整式的商；所有运算都受一条约束——分母不能为零。", "tags": ["fractions-radicals", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：分式方程与同解原理」的一句话核心是什么？", "back": "去分母是两边乘含未知数的式子，可能把分母为零的点混进来，所以必须验根。", "tags": ["fractions-radicals", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：部分分式」的一句话核心是什么？", "back": "把一个复杂真分式拆成几个简单分式之和，拆法由分母的因式类型决定。", "tags": ["fractions-radicals", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：根式与算术根」的一句话核心是什么？", "back": "根号表示非负的算术根；化简是把被开方数里的完全平方因子提出来，有理化是消掉分母里的根号。", "tags": ["fractions-radicals", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「有理分式」？", "back": "两个整式的商 A/B，B 含字母且不为零。", "tags": ["fractions-radicals", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「约分」？", "back": "约去分子分母的公因式。", "tags": ["fractions-radicals", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「最简公分母」？", "back": "各分母所有因式最高次幂的乘积。", "tags": ["fractions-radicals", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「增根」？", "back": "变形后产生但不满足原方程的解。", "tags": ["fractions-radicals", "术语"]}, {"id": "f09", "chapterId": "ch03", "front": "什么是「真分式」？", "back": "分子次数低于分母次数的分式。", "tags": ["fractions-radicals", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「部分分式」？", "back": "把真分式拆成的若干简单分式。", "tags": ["fractions-radicals", "术语"]}, {"id": "f11", "chapterId": "ch04", "front": "什么是「算术根」？", "back": "非负的 n 次方根。", "tags": ["fractions-radicals", "术语"]}, {"id": "f12", "chapterId": "ch04", "front": "什么是「分母有理化」？", "back": "通过乘共轭式消去分母中的根号。", "tags": ["fractions-radicals", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「共轭式」？", "back": "√a+√b 与 √a−√b 互为共轭，乘积为 a−b。", "tags": ["fractions-radicals", "术语"]}], "companion": "fractions-radicals学习伴侣.html", "deriv": "fractions-radicals从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">整式、因式分解<\/span><\/div><h1>第 1 章：有理分式的概念与运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：整式、因式分解\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出分式有意义的条件\n<\/li><li>\n用基本性质约分、通分\n<\/li><li>\n完成分式的加减乘除并化为最简\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>分式就是两个整式的商；所有运算都受一条约束——分母不能为零。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 分式与定义域<\/h3>\n<p>形如 A/B（A、B 是整式，B 含字母）的式子叫<strong>有理分式<\/strong>。分式有意义的条件是 B≠0。<\/p>\n<p>求定义域就是解 B≠0：例如 1/(x−2) 要求 x≠2；1/(x²−1) 要求 x≠±1。<\/p>\n<h3>1.2 基本性质<\/h3>\n<p>分子分母同乘（或同除）同一个不为零的式子，分式的值不变：<\/p>\n<p>A/B = AC/BC（C≠0）<\/p>\n<p>约分与通分都靠这一条。<\/p>\n<h3>1.3 约分只能约因式<\/h3>\n<p>约分前先因式分解，约掉的是<strong>整个因式<\/strong>，不是某一项。例如<\/p>\n<p>(x²−1)/(x²+x) = (x−1)(x+1)/[x(x+1)] = (x−1)/x<\/p>\n<p>不能把分子分母里的 x 各划掉一个了事。<\/p>\n<h3>1.4 四则运算<\/h3>\n<ul><li>\n乘：分子乘分子、分母乘分母，先约分再乘更省力；\n<\/li><li>\n除：乘以除式的倒数；\n<\/li><li>\n加减：先通分（找最简公分母），再分子相加减。\n<\/ul>\n<p>最简公分母取各分母所有因式的最高次幂之积。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：分式像“按比例配比”，分子分母同时放大缩小，比例不变；但加减项不能随便缩放。<\/p>\n<p><strong>失效边界<\/strong>：基本性质要求乘的式子不为零；乘的式子在某个点为零时，那个点的值要单独讨论。<\/p>\n<p><strong>实例<\/strong>：化简 (x²−4)/(x²−3x+2)。 分子 (x−2)(x+2)；分母 (x−2)(x−1)。约去 (x−2) 得 (x+2)/(x−1)（x≠1 且 x≠2）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 (x+1)/(x+2) 可以约成 1/2 —— 实际上 分子分母是加减关系，不是乘积关系，不能约去 x。只有公因式才能约。\n<\/li><li>\n别以为 分式运算不用管定义域 —— 实际上 约分、通分都可能改变定义域；答案要注明使原式有意义的条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n分式 1/(x²−9) 有意义的条件是：\n<\/li><li>\n化简 (x²−1)/(x²+x) 的结果是：\n<p>A. x≠3 ｜ B. x≠−3 ｜ C. x≠±3 ｜ D. x≠0 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：分母 x²−9=(x−3)(x+3)，要求 x≠3 且 x≠−3。 A. (x−1)/x ｜ B. x−1 ｜ C. 1/x ｜ D. (x+1)/x <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：分子 (x−1)(x+1)，分母 x(x+1)，约去 (x+1) 得 (x−1)/x（x≠0，x≠−1）。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n分式有意义 ⇔ 分母不为零\n<\/li><li>\n约分约因式，不约项\n<\/li><li>\n通分找最简公分母：各因式最高次幂之积\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：有理分式的概念与运算）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：有理分式的概念与运算<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>分式的全部规则只有一条：分子分母同乘非零式，值不变。约分、通分、加减都从它来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>有理分式是两个整式的商 A/B，其中 B 含字母且 B≠0。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>分式像配方比例：糖和水的比例不变，整锅放大一倍仍是同样的甜度。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 基本性质<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}=\\frac{AC}{BC}\\quad(C\\ne 0)<\/div>\n<p>分子分母同乘同一个非零式，比值不变。<\/p>\n<h3>2. 约分<\/h3>\n<div class=\"katex-block\">\\frac{(x-1)(x+1)}{x(x+1)}=\\frac{x-1}{x}<\/div>\n<p>把公因式 (x+1) 整体约去，剩下的仍是因式结构。<\/p>\n<h3>3. 加减通分<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}\\pm\\frac{C}{D}=\\frac{AD\\pm BC}{BD}<\/div>\n<p>通分后分子相加减，分母取公分母。<\/p>\n<h3>4. 除法<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}\\div\\frac{C}{D}=\\frac{A}{B}\\cdot\\frac{D}{C}<\/div>\n<p>除以一个分式等于乘它的倒数，注意 C≠0。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>“同乘一个式子”要求该式不为零；在它为零的点上，等式两边都失去意义。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《分式与根式》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/fractions-radicals/chapter/ch01\">第 1 章：有理分式的概念与运算<\/a><\/span><\/div><h1>第 2 章：分式方程与同解原理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用去分母把分式方程化为整式方程\n<\/li><li>\n解释增根是怎么产生的\n<\/li><li>\n通过验根写出正确解集\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>去分母是两边乘含未知数的式子，可能把分母为零的点混进来，所以必须验根。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 解法步骤<\/h3>\n<ol><li>\n找最简公分母；\n<\/li><li>\n两边同乘公分母，化成整式方程；\n<\/li><li>\n解整式方程；\n<\/li><li>\n把每个解代回原方程（或检查分母是否为零），排除增根。\n<\/ol>\n<h3>2.2 增根从哪里来<\/h3>\n<p>原方程要求 x≠a（分母零点）。去分母时两边乘了含 (x−a) 的式子，在 x=a 这一点上，原方程两边都没有意义，但乘完之后等式可能成立。于是 x=a 成了“解”，却不满足原方程。<\/p>\n<h3>2.3 一个典型例子<\/h3>\n<p>解 1/(x−1)=2/(x²−1)。 两边乘 (x−1)(x+1)：x+1=2，得 x=1。 但 x=1 使分母为零，是增根，原方程无解。<\/p>\n<h3>2.4 验根不等于重算<\/h3>\n<p>验根只需检查两件事：分母是否为零、代回后两边是否相等。不必把整道题重做一遍。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：去分母像给方程“整体放大”，放大过程中可能把本来不在定义域里的点也放大成解。<\/p>\n<p><strong>失效边界<\/strong>：如果公分母恒不为零（例如只含常数因子），就不会产生增根，但仍建议验根。<\/p>\n<p><strong>实例<\/strong>：解 2/(x−3)=1。 两边乘 (x−3)：2=x−3，得 x=5。验根：分母 5−3=2≠0，成立。解为 x=5。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 解出整式方程的解就是原方程的解 —— 实际上 必须验根；使分母为零的解一律舍去。\n<\/li><li>\n别以为 增根是算错了 —— 实际上 增根不是计算错误，而是变形扩大了定义域，属于方法本身的副作用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n解分式方程产生增根的根本原因是：\n<\/li><li>\n方程 1/(x−2)=0 的解的情况是：\n<p>A. 计算失误 ｜ B. 去分母时乘了含未知数的式子 ｜ C. 方程次数变高 ｜ D. 没有通分 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：乘以含未知数的式子会把原定义域外的点带入等式，使不满足原方程的值成为候选解。 A. x=2 ｜ B. 无解 ｜ C. x=0 ｜ D. 任意实数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：分式的值为零要求分子为零且分母不为零；这里分子恒为 1，故无解。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n去分母 → 解整式方程 → 验根\n<\/li><li>\n增根来自乘了含未知数的式子\n<\/li><li>\n分式为零：分子为零且分母不为零\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：分式方程与同解原理）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：分式方程与同解原理<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>分式方程的解法只有一句话：把分母清掉。但清分母的动作会改变定义域，这就是全部麻烦的来源。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>分母中含未知数的方程叫分式方程。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像把分数方程“乘以公分母”翻译成整数方程；翻译时把原文里不允许的取值也带进来了。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 原方程的定义域<\/h3>\n<div class=\"katex-block\">\\frac{A(x)}{B(x)}=0\\ \\Rightarrow\\ B(x)\\ne 0<\/div>\n<p>先记下所有使分母为零的点，这些点永远不能是解。<\/p>\n<h3>2. 去分母<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}=\\frac{C}{D}\\ \\Rightarrow\\ AD=BC<\/div>\n<p>两边乘 BD，把分式方程变成整式方程。<\/p>\n<h3>3. 增根判定<\/h3>\n<div class=\"katex-block\">x=x_{0}\\ \\text{且}\\ B(x_{0})=0\\ \\Rightarrow\\ x_{0}\\ \\text{为增根}<\/div>\n<p>解出的值若踩在分母零点上，就是变形带进来的假解。<\/p>\n<h3>4. 分式为零<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}=0\\iff A=0\\ \\text{且}\\ B\\ne 0<\/div>\n<p>分子为零只是必要条件，还要分母不为零。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>公分母若含未知数，就必须验根；若为常数，则不会产生增根。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《分式与根式》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/fractions-radicals/chapter/ch02\">第 2 章：分式方程与同解原理<\/a><\/span><\/div><h1>第 3 章：部分分式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02、待定系数法\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断一个分式是否为真分式\n<\/li><li>\n把分母分解后按类型设部分分式\n<\/li><li>\n用待定系数法求出各项系数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>把一个复杂真分式拆成几个简单分式之和，拆法由分母的因式类型决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 真分式与假分式<\/h3>\n<p>分子次数低于分母次数的叫<strong>真分式<\/strong>；否则叫假分式。假分式先做多项式除法，化成“多项式 + 真分式”，再拆真分式。<\/p>\n<h3>3.2 分母的三种因式<\/h3>\n<ul><li>\n一次因式 (x−a)，对应一项 A/(x−a)；\n<\/li><li>\n重复一次因式 (x−a)<sup>k<\/sup>，对应 A₁/(x−a)+…+A_k/(x−a)<sup>k<\/sup>；\n<\/li><li>\n不可约二次因式 x²+px+q，对应 (Bx+C)/(x²+px+q)。\n<\/ul>\n<h3>3.3 求系数的两条路<\/h3>\n<ol><li>\n<strong>比较系数<\/strong>：通分后比较各次项系数，解线性方程组；\n<\/li><li>\n<strong>代特殊值<\/strong>：把 x 取成各因式的零点，能直接定出一部分系数，剩下的再比较。\n<\/ol>\n<h3>3.4 用途<\/h3>\n<p>拆开之后，每一项都容易积分、容易求和。原书用它处理级数求和，后面的微积分里用它做积分。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：部分分式像把一锅混合汤分成几小碗，每碗只含一种味道，便于单独处理。<\/p>\n<p><strong>失效边界<\/strong>：分母必须先分解到实数范围内的不可约因式；分解不彻底，拆出来的项也对不上。<\/p>\n<p><strong>实例<\/strong>：拆 1/[x(x+1)]。 设 1/[x(x+1)]=A/x+B/(x+1)，通分得 A(x+1)+Bx=1。 取 x=0 得 A=1；取 x=−1 得 B=−1。所以 1/[x(x+1)]=1/x−1/(x+1)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 任何分式都能直接拆成一次项之和 —— 实际上 分母含不可约二次因式时，对应项的分子是一次式 Bx+C，不是常数。\n<\/li><li>\n别以为 部分分式只用于化简 —— 实际上 它的主要用途是积分与级数求和：拆开后每一项都有现成公式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n分式 (x²+1)/(x−1) 属于：\n<\/li><li>\n分解 1/[(x−1)(x−2)] 时，应设为：\n<p>A. 真分式 ｜ B. 假分式 ｜ C. 整式 ｜ D. 无法判断 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：分子次数 2 不低于分母次数 1，是假分式，需先做除法。 A. A/(x−1)+B/(x−2) ｜ B. A/(x−1)+B/(x−2)+C ｜ C. (Ax+B)/(x−1)(x−2) ｜ D. A/[(x−1)(x−2)] <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：分母是两个不同的一次因式，各对应一个常数分子的一次分式。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n真分式：分子次数低于分母\n<\/li><li>\n不同一次因式 → 常数分子；重因式 → 逐次幂；二次因式 → 一次分子\n<\/li><li>\n求系数：比较系数或代零点\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：部分分式）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：部分分式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>部分分式不是技巧，而是“把分母的每个因式各配一个分子”的必然形式。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>把真分式写成若干个简单分式之和，叫部分分式分解。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像把一个大分数拆成几个小分数的和：分母的每个因式各占一碗。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 真分式前提<\/h3>\n<div class=\"katex-block\">\\deg P<\\deg Q<\/div>\n<p>分子次数低于分母才能直接拆；否则先做多项式除法。<\/p>\n<h3>2. 一次因式<\/h3>\n<div class=\"katex-block\">\\frac{P(x)}{(x-a)(x-b)}=\\frac{A}{x-a}+\\frac{B}{x-b}<\/div>\n<p>每个不同的一次因式配一个常数分子。<\/p>\n<h3>3. 重因式<\/h3>\n<div class=\"katex-block\">\\frac{P(x)}{(x-a)^{2}}=\\frac{A}{x-a}+\\frac{B}{(x-a)^{2}}<\/div>\n<p>重因式要按 1 次到 k 次各写一项。<\/p>\n<h3>4. 二次因式<\/h3>\n<div class=\"katex-block\">\\frac{P(x)}{x^{2}+px+q}=\\frac{Bx+C}{x^{2}+px+q}<\/div>\n<p>不可约二次因式的分子要设为一次式。<\/p>\n<h3>5. 求系数<\/h3>\n<div class=\"katex-block\">\\frac{1}{x(x+1)}=\\frac{A}{x}+\\frac{B}{x+1}\\ \\Rightarrow\\ A(x+1)+Bx=1<\/div>\n<p>代 x=0 得 A=1，代 x=−1 得 B=−1。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>分母必须分解到不可约；否则设项时会漏掉中间形式，解出的系数不唯一。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《分式与根式》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch04": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">开方、绝对值<\/span><\/div><h1>第 4 章：根式与算术根<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：开方、绝对值\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n区分方根与算术根，正确使用 √(a²)=|a|\n<\/li><li>\n化简根式、做分母有理化\n<\/li><li>\n解根式方程并验根\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>根号表示非负的算术根；化简是把被开方数里的完全平方因子提出来，有理化是消掉分母里的根号。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 方根与算术根<\/h3>\n<p>x²=a（a&gt;0）有两个根 ±√a；其中非负的那个 √a 叫<strong>算术根<\/strong>。所以 √a 本身永远 ≥0。<\/p>\n<p>由此得到一条常用恒等式：<\/p>\n<p>√(a²)=|a|<\/p>\n<p>a≥0 时等于 a，a&lt;0 时等于 −a。写成 √(a²)=a 是错的。<\/p>\n<h3>4.2 根式的化简<\/h3>\n<p>把被开方数分解出完全平方因子：<\/p>\n<p>√72=√(36×2)=6√2<\/p>\n<p>分母里带根号时，分子分母同乘适当的式子把它消掉，叫<strong>分母有理化<\/strong>：<\/p>\n<p>1/√2=√2/2；1/(√3+√2)=√3−√2<\/p>\n<p>第二条用的是平方差 (√3+√2)(√3−√2)=1。<\/p>\n<h3>4.3 根式的运算<\/h3>\n<p>同次根式可以直接相乘除；不同次要先化成同次。加减只有在根号内部分完全相同时才能合并，如 2√3+5√3=7√3。<\/p>\n<h3>4.4 根式方程<\/h3>\n<p>把根号项单独放一边，两边平方，解出后<strong>必须验根<\/strong>：平方会把负值变成正值，可能引入不满足原式的解。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：根号像“长度的量尺”，量出来永远是非负的；平方再开方，得到的是距离，不是原数的符号。<\/p>\n<p><strong>失效边界<\/strong>：√(a²)=|a| 只对实数成立；在复数范围内开方是多值的，规则不同。<\/p>\n<p><strong>实例<\/strong>：化简 √(x²−6x+9)。 被开方数是 (x−3)²，所以原式 = |x−3|。当 x≥3 时为 x−3，当 x&lt;3 时为 3−x。 若直接写成 x−3，就在 x&lt;3 时算错了。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 √(a²)=a —— 实际上 等于 |a|。a 为负时结果是 −a，因为算术根必须非负。\n<\/li><li>\n别以为 √a+√b=√(a+b) —— 实际上 不成立。取 a=b=1：左边 2，右边 √2。根式不能这样合并。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n化简 √(x²−4x+4) 的结果是：\n<\/li><li>\n把 1/(√5−2) 分母有理化的结果是：\n<p>A. x−2 ｜ B. |x−2| ｜ C. 2−x ｜ D. x+2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：被开方数是 (x−2)²，开方得绝对值 |x−2|，符号随 x 变化。 A. √5+2 ｜ B. (√5+2)/9 ｜ C. √5−2 ｜ D. (√5−2)/9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：分子分母同乘 (√5+2)：分母 (√5)²−2²=5−4=1，所以结果为 √5+2。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n√a≥0；√(a²)=|a|\n<\/li><li>\n化简：提出完全平方因子；有理化：用平方差消分母根号\n<\/li><li>\n根式方程平方后必须验根\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：根式与算术根）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：根式与算术根<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>根号的麻烦全在一个字上：符号。算术根规定非负，于是开方之后要补绝对值。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>若 x<sup>n<\/sup>=a，则 x 为 a 的 n 次方根；其中非负的那个叫算术根 √[n]a。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>根号像量长度：不管从哪边量，读数都是正的；要找回原来的方向，得另外看符号。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 算术根非负<\/h3>\n<div class=\"katex-block\">\\sqrt{a}\\ge 0\\quad(a\\ge 0)<\/div>\n<p>算术根按定义取非负值，这是后面所有化简的前提。<\/p>\n<h3>2. 平方再开方<\/h3>\n<div class=\"katex-block\">\\sqrt{a^{2}}=|a|=\\begin{cases}a, & a\\ge 0\\\\ -a, & a<0\\end{cases}<\/div>\n<p>开方只取非负值，所以负号要由绝对值补回来。<\/p>\n<h3>3. 化简<\/h3>\n<div class=\"katex-block\">\\sqrt{72}=\\sqrt{36\\cdot 2}=6\\sqrt{2}<\/div>\n<p>把完全平方因子提到根号外。<\/p>\n<h3>4. 有理化<\/h3>\n<div class=\"katex-block\">\\frac{1}{\\sqrt{3}+\\sqrt{2}}=\\sqrt{3}-\\sqrt{2}<\/div>\n<p>分子分母同乘 (√3−√2)，用平方差把分母变成整数。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>偶次根号下必须非负；奇次根号对被开方数没有符号限制。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《分式与根式》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/fractions-radicals/chapter/ch01\">第 1 章：有理分式的概念与运算<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/fractions-radicals/chapter/ch02\">第 2 章：分式方程与同解原理<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/fractions-radicals/chapter/ch04\">第 4 章：根式与算术根<\/a><\/span><\/div><h1>定义域与增根<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每一步变形都要问：原来不允许的取值，有没有被这一步偷偷放进来。<\/p>\n<h2>为什么重要<\/h2>\n<p>分式与根式的错误大多不是算错，而是忘了定义域；抓住这条，出错率会明显下降。<\/p>\n<h2>详解<\/h2>\n<p>分式要求分母非零，偶次根式要求被开方数非负。去分母、平方这些变形会扩大定义域，因此解完必须回到原式筛一遍。筛的标准只有两条：原式是否有意义、代回是否相等。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“验根”是可省略的步骤。对含未知数的去分母或平方，验根是解法的一部分。<\/p>\n<h2>相关概念<\/h2>\n<p>分式方程（ch02）、根式方程（ch04）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/fractions-radicals/chapter/ch03\">第 3 章：部分分式<\/a><\/span><\/div><h1>部分分式分解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>按分母的因式类型配分子，把真分式拆成简单项之和。<\/p>\n<h2>为什么重要<\/h2>\n<p>拆开之后每一项都能单独处理，是积分与级数求和的标准前置动作。<\/p>\n<h2>详解<\/h2>\n<p>三种类型对应三种设法：不同一次因式配常数；重因式按幂次逐项配；不可约二次因式配一次式。系数用比较系数或代零点求。<\/p>\n<h2>常见误解<\/h2>\n<p>把不可约二次因式也配常数分子，会解不出系数或得到错误分解。<\/p>\n<h2>相关概念<\/h2>\n<p>待定系数法（《整式》ch04）、积分（《微积分初步》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：有理分式的概念与运算<\/strong><br>阅读：<a href=\"#/book/fractions-radicals/chapter/ch01\">第 1 章：有理分式的概念与运算<\/a><br>检查点：能把复杂分式化为最简分式<\/li><li class='path-step' id='path-02'><strong>步骤 02：分式方程与同解原理<\/strong><br>阅读：<a href=\"#/book/fractions-radicals/chapter/ch02\">第 2 章：分式方程与同解原理<\/a><br>检查点：能解分式方程并说明增根来自哪里<\/li><li class='path-step' id='path-03'><strong>步骤 03：部分分式<\/strong><br>阅读：<a href=\"#/book/fractions-radicals/chapter/ch03\">第 3 章：部分分式<\/a><br>检查点：能把真分式拆成简单分式之和<\/li><li class='path-step' id='path-04'><strong>步骤 04：根式与算术根<\/strong><br>阅读：<a href=\"#/book/fractions-radicals/chapter/ch04\">第 4 章：根式与算术根<\/a><br>检查点：能化简根式并做分母有理化<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：有理分式的概念与运算<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 分式 1/(x²−9) 有意义的条件是：<\/p><div class='q edback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='有理分式'>有理分式 — 两个整式的商 A/B，B 含字母且不为零。 <span class=glossary-ref>（第 1 章：有理分式的概念与运算）<\/span><\/li><li data-term='约分'>约分 — 约去分子分母的公因式。 <span class=glossary-ref>（第 1 章：有理分式的概念与运算）<\/span><\/li><li data-term='最简公分母'>最简公分母 — 各分母所有因式最高次幂的乘积。 <span class=glossary-ref>（第 1 章：有理分式的概念与运算）<\/span><\/li><li data-term='增根'>增根 — 变形后产生但不满足原方程的解。 <span class=glossary-ref>（第 2 章：分式方程与同解原理）<\/span><\/li><li data-term='真分式'>真分式 — 分子次数低于分母次数的分式。 <span class=glossary-ref>（第 3 章：部分分式）<\/span><\/li><li data-term='部分分式'>部分分式 — 把真分式拆成的若干简单分式。 <span class=glossary-ref>（第 3 章：部分分式）<\/span><\/li><li data-term='算术根'>算术根 — 非负的 n 次方根。 <span class=glossary-ref>（第 4 章：根式与算术根）<\/span><\/li><li data-term='分母有理化'>分母有理化 — 通过乘共轭式消去分母中的根号。 <span class=glossary-ref>（第 4 章：根式与算术根）<\/span><\/li><li data-term='共轭式'>共轭式 — √a+√b 与 √a−√b 互为共轭，乘积为 a−b。 <span class=glossary-ref>（第 4 章：根式与算术根）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：含分母/根号的四步<\/h2>\n<p>① 写下定义域限制；② 选变形（通分、去分母、有理化、平方）；③ 解出候选解；④ 用定义域与原式筛掉增根。<\/p>\n<h2>框架：拆分的三种模板<\/h2>\n<p>一次因式配常数、重因式按幂配、二次因式配一次式。模板先定，系数后求。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>分式有意义<\/td><td>分母 ≠ 0<\/td><\/tr><tr><td>基本性质<\/td><td>A/B = AC/BC（C≠0）<\/td><\/tr><tr><td>分式方程<\/td><td>去分母 → 解 → 验根<\/td><\/tr><tr><td>部分分式<\/td><td>一次配常数、重因式按幂、二次配一次式<\/td><\/tr><tr><td>算术根<\/td><td>√a ≥ 0；√(a²)=<\/td><td>a<\/td><td><\/td><\/tr><tr><td>有理化<\/td><td>1/(√a+√b)=(√a−√b)/(a−b)<\/td><\/tr><tr><td>根式方程<\/td><td>孤立根号 → 平方 → 验根<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：有理分式的概念与运算", "href": "#/chapter/ch01"}, {"label": "第 2 章：分式方程与同解原理", "href": "#/chapter/ch02"}, {"label": "第 3 章：部分分式", "href": "#/chapter/ch03"}, {"label": "第 4 章：根式与算术根", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "定义域与增根", "href": "#/concept/c01"}, {"label": "部分分式分解", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：有理分式的概念与运算", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：分式方程与同解原理", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：部分分式", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：根式与算术根", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true, "ch04": true}},"inequalities":{"manifest": {"slug": "inequalities", "title": "不等式", "subtitle": "比较之外：不等式的性质、解法与证明", "book": {"title": "不等式", "author": "华昌年", "source": ["数学基础知识丛书-05-不等式 华昌年.pdf"]}, "audience": "零基础", "goal": "掌握不等式的基本性质与同解变形，会解一元二次、高次、绝对值与无理不等式，能用比较法、综合法证明简单不等式。", "learningPath": [{"step": "01", "title": "性质与同解变形", "chapterIds": ["ch01"], "checkpoint": "能
