ters": [{"id": "ch01", "title": "第 1 章：数据的整理与描述", "file": "chapters/ch01-descriptive.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：概率与计数", "file": "chapters/ch02-probability.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：抽样与推断入门", "file": "chapters/ch03-inference.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "集中与离散", "file": "concepts/c01-center-spread.md", "chapterIds": ["ch01"]}, {"id": "c02", "title": "互斥与独立", "file": "concepts/c02-mutually-exclusive-independent.md", "chapterIds": ["ch02"]}], "glossary": [{"term": "频数", "def": "某组数据的个数。", "chapterId": "ch01"}, {"term": "平均数", "def": "数据总和除以个数。", "chapterId": "ch01"}, {"term": "中位数", "def": "排序后位于中间位置的数。", "chapterId": "ch01"}, {"term": "方差", "def": "离差平方的平均数，衡量离散程度。", "chapterId": "ch01"}, {"term": "标准差", "def": "方差的算术平方根。", "chapterId": "ch01"}, {"term": "古典概率", "def": "有利结果数与等可能结果总数之比。", "chapterId": "ch02"}, {"term": "互斥", "def": "两个事件不能同时发生。", "chapterId": "ch02"}, {"term": "独立", "def": "一个事件发生不影响另一个的概率。", "chapterId": "ch02"}, {"term": "随机抽样", "def": "每个个体被抽到机会相同的抽样方式。", "chapterId": "ch03"}, {"term": "标准误", "def": "样本均值的标准差，约 s/√n。", "chapterId": "ch03"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "数据 3、5、5、7、10 的平均数是：", "options": ["5", "6", "7", "5.5"], "answer": 1, "explain": "(3+5+5+7+10)/5=30/5=6。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "样本方差除以 n−1 而不是 n 的原因是：", "options": ["计算更方便", "修正用样本均值代替总体均值造成的偏差", "使方差变大", "避免除以零"], "answer": 1, "explain": "除以 n−1 是自由度修正，使样本方差成为总体方差的无偏估计。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "掷一枚均匀骰子，出现偶数的概率是：", "options": ["1/6", "1/3", "1/2", "2/3"], "answer": 2, "explain": "偶数有 2、4、6 共 3 个，P=3/6=1/2。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "若 A、B 相互独立，则 P(A∩B) 等于：", "options": ["P(A)+P(B)", "P(A)P(B)", "0", "P(A)−P(B)"], "answer": 1, "explain": "独立的定义就是乘法公式成立：P(A∩B)=P(A)P(B)。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "样本容量增大时，样本均值的标准误：", "options": ["增大", "减小", "不变", "先增后减"], "answer": 1, "explain": "标准误约 s/√n，n 增大则减小。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "假设检验中拒绝原假设，意味着：", "options": ["原假设一定为假", "观测数据在原假设下很罕见", "样本有误", "总体不存在"], "answer": 1, "explain": "拒绝的依据是数据在原假设下的罕见程度，并非直接证明原假设为假。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "数据 4、6、8、10 的平均数是：", "options": ["6", "7", "8", "9"], "answer": 1, "explain": "(4+6+8+10)/4=28/4=7。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "从 5 人中选 2 人，不同的选法有：", "options": ["10", "20", "25", "5"], "answer": 0, "explain": "C(5,2)=10，组合不计顺序。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：数据的整理与描述」的一句话核心是什么？", "back": "一组数据用两个数就能大致说清：中心在哪里（均值），散得多开（方差）。", "tags": ["statistics-intro", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：概率与计数」的一句话核心是什么？", "back": "古典概率＝有利结果数除以全部等可能结果数；互斥管相加，独立管相乘。", "tags": ["statistics-intro", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：抽样与推断入门」的一句话核心是什么？", "back": "用样本推断总体，靠的是随机抽样保证代表性，用概率描述不确定性。", "tags": ["statistics-intro", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「频数」？", "back": "某组数据的个数。", "tags": ["statistics-intro", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「平均数」？", "back": "数据总和除以个数。", "tags": ["statistics-intro", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「中位数」？", "back": "排序后位于中间位置的数。", "tags": ["statistics-intro", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「方差」？", "back": "离差平方的平均数，衡量离散程度。", "tags": ["statistics-intro", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「标准差」？", "back": "方差的算术平方根。", "tags": ["statistics-intro", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「古典概率」？", "back": "有利结果数与等可能结果总数之比。", "tags": ["statistics-intro", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「互斥」？", "back": "两个事件不能同时发生。", "tags": ["statistics-intro", "术语"]}, {"id": "f11", "chapterId": "ch02", "front": "什么是「独立」？", "back": "一个事件发生不影响另一个的概率。", "tags": ["statistics-intro", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「随机抽样」？", "back": "每个个体被抽到机会相同的抽样方式。", "tags": ["statistics-intro", "术语"]}, {"id": "f13", "chapterId": "ch03", "front": "什么是「标准误」？", "back": "样本均值的标准差，约 s/√n。", "tags": ["statistics-intro", "术语"]}], "companion": "statistics-intro学习伴侣.html", "deriv": "statistics-intro从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：数据的整理与描述<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：平均数、平方\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n整理频数分布\n<\/li><li>\n计算平均数、中位数、众数\n<\/li><li>\n计算方差与标准差并解释含义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>一组数据用两个数就能大致说清：中心在哪里（均值），散得多开（方差）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 频数分布<\/h3>\n<p>把数据分组，统计每组的个数（频数），算出频率＝频数/总数，列成表或画直方图。直方图看的是整体形状：单峰、双峰、偏斜。<\/p>\n<h3>1.2 集中趋势<\/h3>\n<ul><li>\n平均数：所有数据之和除以个数，最常用，但受极端值影响大；\n<\/li><li>\n中位数：排序后位于中间的数（偶数个取中间两个的平均），抗极端值；\n<\/li><li>\n众数：出现次数最多的数，可能不止一个。\n<\/ul>\n<p>收入分布这类“少数极高值”的数据，中位数比平均数更能代表“普通人”。<\/p>\n<h3>1.3 离散程度<\/h3>\n<p>极差＝最大值−最小值，简单但只看两端。<\/p>\n<p>方差：各数据与平均数之差的平方的平均数。总体方差除以 n，样本方差除以 n−1。<\/p>\n<p>标准差＝方差的算术平方根，与原始数据同单位，更好解释。<\/p>\n<h3>1.4 为什么样本方差除以 n−1<\/h3>\n<p>用样本均值代替总体均值会“贴合得更紧”，使平方和偏小。除以 n−1（自由度）可以修正这个偏差，使样本方差的期望等于总体方差。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：平均数告诉你“班级整体水平”，方差告诉你“大家差得多不多”。两个班平均分都是 80，一个全在 75–85，一个从 40 到 100，方差完全不同。<\/p>\n<p><strong>失效边界<\/strong>：均值受极端值严重影响；数据分布严重偏斜时，中位数更可靠。<\/p>\n<p><strong>实例<\/strong>：数据 2、4、4、6、9。平均数=(2+4+4+6+9)/5=5；中位数=4；众数=4。 离差平方和=(−3)²+(−1)²+(−1)²+1²+4²=28。总体方差=28/5=5.6；样本方差=28/4=7；样本标准差=√7≈2.65。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 方差越大数据越好 —— 实际上 方差只表示离散程度，好坏取决于场景：射击比赛方差小是好事，抽样调查方差大说明样本不稳。\n<\/li><li>\n别以为 中位数与平均数总是一样 —— 实际上 只有分布对称时才可能相等，偏斜分布下差别很大。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n数据 3、5、5、7、10 的平均数是：\n<\/li><li>\n样本方差除以 n−1 而不是 n 的原因是：\n<p>A. 5 ｜ B. 6 ｜ C. 7 ｜ D. 5.5 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：(3+5+5+7+10)/5=30/5=6。 A. 计算更方便 ｜ B. 修正用样本均值代替总体均值造成的偏差 ｜ C. 使方差变大 ｜ D. 避免除以零 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：除以 n−1 是自由度修正，使样本方差成为总体方差的无偏估计。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n均值看中心，方差看离散\n<\/li><li>\n中位数抗极端值\n<\/li><li>\n样本方差除以 n−1\n<\/ul>", "ch02": "<h1>第 2 章：概率与计数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：排列组合\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用古典定义求概率\n<\/li><li>\n判断互斥与独立\n<\/li><li>\n用加法与乘法公式计算复合事件\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>古典概率＝有利结果数除以全部等可能结果数；互斥管相加，独立管相乘。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 古典概率<\/h3>\n<p>若试验有 n 个等可能结果，事件 A 包含 m 个，则 P(A)=m/n。<\/p>\n<p>前提是“等可能”，骰子、硬币、抽签都满足；现实中很多情形不满足，需要频率近似。<\/p>\n<h3>2.2 基本性质<\/h3>\n<p>0≤P(A)≤1；P(必然事件)=1；P(不可能事件)=0；P(A′)=1−P(A)。<\/p>\n<p>最后一条是“正难则反”的依据：直接算复杂，就算它的对立事件。<\/p>\n<h3>2.3 加法公式<\/h3>\n<p>P(A∪B)=P(A)+P(B)−P(A∩B)<\/p>\n<p>若 A、B 互斥（不能同时发生），则 P(A∪B)=P(A)+P(B)。<\/p>\n<h3>2.4 乘法公式与独立<\/h3>\n<p>P(A∩B)=P(A)P(B|A)。若 A、B 独立（一个发生不影响另一个），则 P(A∩B)=P(A)P(B)。<\/p>\n<p>互斥与独立是两回事：互斥是“不能同时发生”，独立是“互不影响”。两个非零概率的事件若互斥，就一定不独立。<\/p>\n<h3>2.5 计数工具<\/h3>\n<p>排列 A(n,m)=n!/(n−m)!，组合 C(n,m)=n!/(m!(n−m)!)。组合不考虑顺序，是概率题里用得最多的一种。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：互斥像“一枚硬币不能同时正反”，独立像“两次掷骰子互不干扰”。<\/p>\n<p><strong>失效边界<\/strong>：等可能假设不成立时，古典概率公式失效，必须用频率或分布模型。<\/p>\n<p><strong>实例<\/strong>：掷两枚硬币，样本空间 {正正,正反,反正,反反}，至少一个正的有 3 个，P=3/4。 从 10 人中选 2 人，共 C(10,2)=45 种选法。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 互斥就是独立 —— 实际上 互斥的事件互相排斥，恰恰不独立；独立的事件可以同时发生。\n<\/li><li>\n别以为 概率为 0 就是不可能事件 —— 实际上 连续型情形下概率为 0 的事件仍可能发生。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n掷一枚均匀骰子，出现偶数的概率是：\n<\/li><li>\n若 A、B 相互独立，则 P(A∩B) 等于：\n<p>A. 1/6 ｜ B. 1/3 ｜ C. 1/2 ｜ D. 2/3 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：偶数有 2、4、6 共 3 个，P=3/6=1/2。 A. P(A)+P(B) ｜ B. P(A)P(B) ｜ C. 0 ｜ D. P(A)−P(B) <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：独立的定义就是乘法公式成立：P(A∩B)=P(A)P(B)。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n古典概率 m/n，要求等可能\n<\/li><li>\nP(A′)=1−P(A)\n<\/li><li>\n互斥相加，独立相乘\n<\/ul>", "ch03": "<h1>第 3 章：抽样与推断入门<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01、ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说明随机抽样的意义\n<\/li><li>\n理解样本均值与总体均值的关系\n<\/li><li>\n说清假设检验的基本逻辑\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>用样本推断总体，靠的是随机抽样保证代表性，用概率描述不确定性。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 总体与样本<\/h3>\n<p>总体是研究对象的全体，样本是抽出来的一部分。样本容量记 n。<\/p>\n<p>随机抽样要求每个个体被抽到的机会相同，这样样本才有代表性。常见方式：简单随机抽样、系统抽样、分层抽样。<\/p>\n<h3>3.2 统计量<\/h3>\n<p>样本均值 x̄、样本方差 s² 都是统计量——只由样本算出的量，不含未知参数。<\/p>\n<p>用 x̄ 估计总体均值 μ，叫点估计。x̄ 是无偏的：反复抽样，平均值会落在 μ 附近。<\/p>\n<h3>3.3 抽样分布与标准误<\/h3>\n<p>反复抽样得到的 x̄ 会围绕 μ 波动，其标准差叫标准误，约等于 s/√n。<\/p>\n<p>n 越大，标准误越小，估计越稳。这是“样本越大越准”的数学解释——但精度只按 √n 提升，样本翻四倍才把误差减半。<\/p>\n<h3>3.4 假设检验的直觉<\/h3>\n<p>先假设“没有差别”（原假设），再看观测到的数据在这个假设下有多罕见。若罕见程度超过预设门槛（显著性水平，常取 0.05），就拒绝原假设。<\/p>\n<p>注意：不拒绝不等于证明“没有差别”，只是证据不足。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：抽样像尝一锅汤：舀一勺尝尝咸淡，前提是搅匀了（随机抽样）。<\/p>\n<p><strong>失效边界<\/strong>：样本没代表性（比如只尝锅边的汤），再大也不准。<\/p>\n<p><strong>实例<\/strong>：某班 50 人抽 10 人测身高，样本均值 170cm、样本标准差 6cm，则标准误约 6/√10≈1.9cm。 若换 40 人，标准误约 6/√40≈0.95cm，精度提高约一倍，但样本量翻了四倍。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 样本越大一定越接近真值 —— 实际上 前提是随机且有代表性；有偏样本再大也偏。\n<\/li><li>\n别以为 假设检验通过就证明原假设成立 —— 实际上 只是“证据不足以拒绝”，不是证明其为真。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n样本容量增大时，样本均值的标准误：\n<\/li><li>\n假设检验中拒绝原假设，意味着：\n<p>A. 增大 ｜ B. 减小 ｜ C. 不变 ｜ D. 先增后减 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：标准误约 s/√n，n 增大则减小。 A. 原假设一定为假 ｜ B. 观测数据在原假设下很罕见 ｜ C. 样本有误 ｜ D. 总体不存在 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：拒绝的依据是数据在原假设下的罕见程度，并非直接证明原假设为假。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n随机抽样保证代表性\n<\/li><li>\n标准误≈s/√n，样本翻四倍误差减半\n<\/li><li>\n不拒绝≠证明原假设\n<\/ul>", "c01": "<h1>集中与离散<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>描述一组数据只需两个维度：中心在哪，散得多开。<\/p>\n<h2>为什么重要<\/h2>\n<p>所有统计描述都在这两个维度上展开，也是后续比较两组数据的基础。<\/p>\n<h2>详解<\/h2>\n<p>中心用均值、中位数、众数；离散用极差、方差、标准差。均值怕极端值，中位数不怕；方差单位是平方，标准差与原数据同单位。<\/p>\n<h2>常见误解<\/h2>\n<p>只报平均数，不说离散程度，导致“平均”掩盖了个体差异。<\/p>\n<h2>相关概念<\/h2>\n<p>方差（ch01）、抽样（ch03）<\/p>", "c02": "<h1>互斥与独立<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>互斥是“不能同时发生”，独立是“互不影响”，两回事。<\/p>\n<h2>为什么重要<\/h2>\n<p>概率题里用加法还是乘法，全靠这一个判断。<\/p>\n<h2>详解<\/h2>\n<p>互斥：P(A∩B)=0，加法直接相加。独立：P(A∩B)=P(A)P(B)，乘法直接用。两个非零概率事件互斥时一定不独立，因为一个发生就排除了另一个。<\/p>\n<h2>常见误解<\/h2>\n<p>看到“不相关”“不冲突”就当成独立，或把互斥当独立套乘法。<\/p>\n<h2>相关概念<\/h2>\n<p>加法公式（ch02）、乘法公式（ch02）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数据的整理与描述<\/strong><br>阅读：<a href=\"#/book/statistics-intro/chapter/ch01\">第 1 章：数据的整理与描述<\/a><br>检查点：能算出均值、中位数与方差<\/li><li class='path-step' id='path-02'><strong>步骤 02：概率与计数<\/strong><br>阅读：<a href=\"#/book/statistics-intro/chapter/ch02\">第 2 章：概率与计数<\/a><br>检查点：能求古典概率并判断互斥与独立<\/li><li class='path-step' id='path-03'><strong>步骤 03：抽样与推断入门<\/strong><br>阅读：<a href=\"#/book/statistics-intro/chapter/ch03\">第 3 章：抽样与推断入门<\/a><br>检查点：能说明样本均值为什么接近总体均值<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：数据的整理与描述<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 数据 3、5、5、7、10 的平均数是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 5<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 7<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 5.5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 样本方差除以 n−1 而不是 n 的原因是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 计算更方便<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 修正用样本均值代替总体均值造成的偏差<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 使方差变大<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 避免除以零<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：概率与计数<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 掷一枚均匀骰子，出现偶数的概率是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 1/6<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 1/3<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 2/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 若 A、B 相互独立，则 P(A∩B) 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> P(A)+P(B)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> P(A)P(B)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> P(A)−P(B)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：抽样与推断入门<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 样本容量增大时，样本均值的标准误：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 增大<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 减小<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 不变<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 先增后减<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 假设检验中拒绝原假设，意味着：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 原假设一定为假<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 观测数据在原假设下很罕见<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 样本有误<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 总体不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 数据 4、6、8、10 的平均数是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 7<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 8<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 从 5 人中选 2 人，不同的选法有：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 10<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 20<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 25<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：数据的整理与描述<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 数据 3、5、5、7、10 的平均数是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 5<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 7<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 5.5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 样本方差除以 n−1 而不是 n 的原因是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 计算更方便<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 修正用样本均值代替总体均值造成的偏差<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 使方差变大<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 避免除以零<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：概率与计数<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 掷一枚均匀骰子，出现偶数的概率是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 1/6<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 1/3<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 2/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 若 A、B 相互独立，则 P(A∩B) 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> P(A)+P(B)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> P(A)P(B)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> P(A)−P(B)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：抽样与推断入门<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 样本容量增大时，样本均值的标准误：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 增大<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 减小<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 不变<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 先增后减<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 假设检验中拒绝原假设，意味着：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 原假设一定为假<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 观测数据在原假设下很罕见<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 样本有误<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 总体不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='频数'>频数 — 某组数据的个数。 <span class=glossary-ref>（第 1 章：数据的整理与描述）<\/span><\/li><li data-term='平均数'>平均数 — 数据总和除以个数。 <span class=glossary-ref>（第 1 章：数据的整理与描述）<\/span><\/li><li data-term='中位数'>中位数 — 排序后位于中间位置的数。 <span class=glossary-ref>（第 1 章：数据的整理与描述）<\/span><\/li><li data-term='方差'>方差 — 离差平方的平均数，衡量离散程度。 <span class=glossary-ref>（第 1 章：数据的整理与描述）<\/span><\/li><li data-term='标准差'>标准差 — 方差的算术平方根。 <span class=glossary-ref>（第 1 章：数据的整理与描述）<\/span><\/li><li data-term='古典概率'>古典概率 — 有利结果数与等可能结果总数之比。 <span class=glossary-ref>（第 2 章：概率与计数）<\/span><\/li><li data-term='互斥'>互斥 — 两个事件不能同时发生。 <span class=glossary-ref>（第 2 章：概率与计数）<\/span><\/li><li data-term='独立'>独立 — 一个事件发生不影响另一个的概率。 <span class=glossary-ref>（第 2 章：概率与计数）<\/span><\/li><li data-term='随机抽样'>随机抽样 — 每个个体被抽到机会相同的抽样方式。 <span class=glossary-ref>（第 3 章：抽样与推断入门）<\/span><\/li><li data-term='标准误'>标准误 — 样本均值的标准差，约 s/√n。 <span class=glossary-ref>（第 3 章：抽样与推断入门）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：描述数据三问<\/h2>\n<p>① 中心在哪（均值/中位数）；② 散得多开（方差/标准差）；③ 形状如何（直方图偏斜与否）。<\/p>\n<h2>框架：概率题两判<\/h2>\n<p>① 能否同时发生（互斥→加法）；② 是否互相影响（独立→乘法）。判完再动笔。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>平均数<\/td><td>x̄=Σx/n<\/td><\/tr><tr><td>样本方差<\/td><td>s²=Σ(x−x̄)²/(n−1)<\/td><\/tr><tr><td>古典概率<\/td><td>P=m/n<\/td><\/tr><tr><td>对立<\/td><td>P(A′)=1−P(A)<\/td><\/tr><tr><td>加法<\/td><td>P(A∪B)=P(A)+P(B)−P(A∩B)<\/td><\/tr><tr><td>标准误<\/td><td>SE≈s/√n<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：数据的整理与描述", "href": "#/chapter/ch01"}, {"label": "第 2 章：概率与计数", "href": "#/chapter/ch02"}, {"label": "第 3 章：抽样与推断入门", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "集中与离散", "href": "#/concept/c01"}, {"label": "互斥与独立", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：数据的整理与描述", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：概率与计数", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：抽样与推断入门", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}}};

const CROSS = {"doc1": "<h1>跨书总览：《数学基础知识丛书》24 本学习路线<\/h1>\n<p>这套书是上世纪八十年代的一套中学数学基础读物，24 本各自独立成册，但合起来恰好覆盖中学数学的主干，并且延伸到微积分、线性代数、逻辑代数、数理统计的门口。它不是按年级编排的，而是按“知识块”编排的——所以学习顺序要自己排，不能照册号硬啃。<\/p>\n<h2>推荐学习顺序<\/h2>\n<table><thead><tr><th>顺序<\/th><th>书<\/th><th>为什么在这个位置<\/th><th>能力里程碑<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>01 有理数与无理数<\/td><td>全书的地基：数是什么、为什么需要无理数、怎么逼近<\/td><td>能说明 √2 不是有理数，会用小数逼近任意精度<\/td><\/tr><tr><td>2<\/td><td>02 整式<\/td><td>代数运算的第一层：字母代替数之后的加减乘<\/td><td>能完成多项式乘法、因式分解、待定系数<\/td><\/tr><tr><td>3<\/td><td>03 一次方程与二次方程<\/td><td>有了整式才能解方程；这是整个中学代数的枢纽<\/td><td>会解一元二次方程并判断根的情况<\/td><\/tr><tr><td>4<\/td><td>04 分式与根式<\/td><td>除法与开方的逆向运算，为后续函数定义域铺路<\/td><td>会化简分式、分母有理化<\/td><\/tr><tr><td>5<\/td><td>05 不等式<\/td><td>与方程平行的一条线，也是函数单调性的语言<\/td><td>会解一元二次不等式并用区间表示<\/td><\/tr><tr><td>6<\/td><td>06 一次函数与二次函数<\/td><td>第一次把“式”变成“形”，图象与代数开始互通<\/td><td>能由方程说出图象，由图象读出性质<\/td><\/tr><tr><td>7<\/td><td>11 直线形<\/td><td>平面几何的基础：角、平行、全等、相似<\/td><td>能完成基本的几何证明<\/td><\/tr><tr><td>8<\/td><td>12 圆<\/td><td>圆的性质是三角与圆锥曲线的公共前置<\/td><td>会用圆周角、切线、相似比<\/td><\/tr><tr><td>9<\/td><td>16 解三角形<\/td><td>正弦定理、余弦定理把几何量变成可算的数<\/td><td>会解任意三角形并讨论多解<\/td><\/tr><tr><td>10<\/td><td>17 三角函数<\/td><td>从“解三角形”升级到“函数”，角变成自变量<\/td><td>会化简三角式、画图象、写通解<\/td><\/tr><tr><td>11<\/td><td>07 指数与对数<\/td><td>与三角函数并列的另一类基本函数<\/td><td>会做指对数运算并解相关方程<\/td><\/tr><tr><td>12<\/td><td>08 排列与组合<\/td><td>计数工具，概率与二项式的前置<\/td><td>会区分排列与组合并正确计数<\/td><\/tr><tr><td>13<\/td><td>09 数列与极限<\/td><td>离散的“函数”，极限概念在此首次正式出现<\/td><td>会求通项、求和，理解极限的含义<\/td><\/tr><tr><td>14<\/td><td>10 复数<\/td><td>数系的最后一次扩张，也是旋转的代数表示<\/td><td>会做复数四则运算与三角形式乘除<\/td><\/tr><tr><td>15<\/td><td>13 直线与平面<\/td><td>从平面走进空间，立体几何的入门<\/td><td>会判断线面位置关系、求空间角<\/td><\/tr><tr><td>16<\/td><td>14 面积与体积<\/td><td>空间度量，为积分做几何准备<\/td><td>会算柱、锥、球与组合体<\/td><\/tr><tr><td>17<\/td><td>15 轨迹<\/td><td>几何条件翻译成方程，解析几何的思维训练<\/td><td>会求轨迹并检验增漏点<\/td><\/tr><tr><td>18<\/td><td>18 直线方程<\/td><td>解析几何正式开场<\/td><td>会写五种直线方程、算点到直线距离<\/td><\/tr><tr><td>19<\/td><td>19 圆锥曲线<\/td><td>解析几何的高峰，也是 e 的统一<\/td><td>会由方程读出 a、b、c、e 与渐近线<\/td><\/tr><tr><td>20<\/td><td>20 极坐标与参数方程<\/td><td>换坐标看曲线，为后续 simplify 计算<\/td><td>会在三种表示间互化并检查范围<\/td><\/tr><tr><td>21<\/td><td>21 线性方程组与矩阵<\/td><td>代数从“解一个方程”升级到“解一组方程”<\/td><td>会用消元判解、算行列式、做矩阵乘法<\/td><\/tr><tr><td>22<\/td><td>22 微积分初步<\/td><td>极限、导数、积分，中学数学的终点<\/td><td>会用导数研究函数、用积分求面积<\/td><\/tr><tr><td>23<\/td><td>23 逻辑代数初步<\/td><td>与前面平行的另一套代数，计算机的语言<\/td><td>会化简逻辑式并画成电路<\/td><\/tr><tr><td>24<\/td><td>24 数理统计初步<\/td><td>与概率衔接，把数据变成结论<\/td><td>会描述数据、算古典概率、理解抽样<\/td><\/tr><\/tbody><\/table>\n<h2>各书定位（一句话）<\/h2>\n<ul><li>\n《01 有理数与无理数》：讲数系的第一次“破口”，适合作为绝对起点；不适合想直接学函数的人。\n<\/li><li>\n《02 整式》：代数运算的基本功，枯燥但必要。\n<\/li><li>\n《03 一次方程与二次方程》：中学代数的核心，解题方法最密集的一本。\n<\/li><li>\n《04 分式与根式》：运算技巧书，为函数定义域与极限打底。\n<\/li><li>\n《05 不等式》：与方程并列的另一半，偏重解法与证明。\n<\/li><li>\n《06 一次函数与二次函数》：图象思维的起点，最贴近“数形结合”。\n<\/li><li>\n《07 指数与对数》：两类基本函数，运算规则多，需反复练。\n<\/li><li>\n《08 排列与组合》：纯计数，是概率的唯一前置。\n<\/li><li>\n《09 数列与极限》：离散版的函数，极限概念的第一个正式入口。\n<\/li><li>\n《10 复数》：数系扩张的终点，几何意义强于代数运算。\n<\/li><li>\n《11 直线形》：平面几何主干，证明训练为主。\n<\/li><li>\n《12 圆》：平面几何的收束，也是三角与圆锥曲线的前置。\n<\/li><li>\n《13 直线与平面》：立体几何入门，空间想象力要求最高。\n<\/li><li>\n《14 面积与体积》：度量公式的集合，实用性强。\n<\/li><li>\n《15 轨迹》：解析几何的思维预备，重点在“翻译”与“检验”。\n<\/li><li>\n《16 解三角形》：把几何量变成可算的数，是三角函数的引子。\n<\/li><li>\n《17 三角函数》：公式最多的一本，也是周期性思维的来源。\n<\/li><li>\n《18 直线方程》：解析几何的入门，五种形式是核心。\n<\/li><li>\n《19 圆锥曲线》：解析几何的主体，运算量最大。\n<\/li><li>\n《20 极坐标与参数方程》：换个坐标看同一条曲线，工具性强。\n<\/li><li>\n《21 线性方程组与矩阵》：线性代数的入门，超出中学范围但很有价值。\n<\/li><li>\n《22 微积分初步》：中学与大学之间的桥，概念重于计算。\n<\/li><li>\n《23 逻辑代数初步》：与主线平行的分支，计算机方向的必读。\n<\/li><li>\n《24 数理统计初步》：应用性最强，适合作为全书的收尾。\n<\/ul>\n<h2>学习节奏建议<\/h2>\n<p>每周投入 6–8 小时，大约 3 周可以走完主线（01→05→06→16→17→18→19→22），其余几何与工具类分册穿插在对应节点前后。<\/p>\n<p>具体的穿插建议：<\/p>\n<ul><li>\n学完 02 立刻接 03、04，趁代数手感还在；\n<\/li><li>\n学完 06 后接 11、12，用图象理解几何，再回 16；\n<\/li><li>\n学完 17 后接 07、08、09，三条“函数与计数”的线并进；\n<\/li><li>\n学完 19 后接 20、21，把坐标与代数的工具补齐；\n<\/li><li>\n22 之前务必先过 09（极限）与 14（面积体积），否则概念会悬空；\n<\/li><li>\n23、24 可以放在最后，也可以作为“换换脑子”的平行阅读。\n<\/ul>\n<p>每本书学完做两件事：把该书的 <code>quiz.md<\/code> 过一遍（正确率 80% 以上再往下走），再打开对应的“从零推导”页面，把公式自己推一遍。推不出来说明只是记住了结论，没有真正掌握。<\/p>\n<h2>总入口<\/h2>\n<p>打开 <code>index.html<\/code> 总学习手册，按上面的顺序推进；每本书的进度独立保存在本地，刷新不丢。<\/p>", "doc2": "<h1>跨书概念映射表<\/h1>\n<p>对照各书真实 <code>manifest.json<\/code> 生成，表内章节名取自各书的实际章标题，不是凭记忆填的。<\/p>\n<table><thead><tr><th>概念<\/th><th>相关书与章节<\/th><th>口径差异与衔接<\/th><\/tr><\/thead><tbody><tr><td>方程与解的判定<\/td><td>03｜一元一次方程、一元二次方程&lt;br&gt;21｜消元法与解的判定&lt;br&gt;15｜求轨迹的五步法<\/td><td>03 从“解方程”讲起，用因式分解与配方；21 把多个方程排成矩阵，用秩判断解的个数。同一个问题，两种视角：前者重技巧，后者重结构。<\/td><\/tr><tr><td>不等式与区间<\/td><td>05｜不等式的性质与同解变形、二次不等式与高次不等式、绝对值不等式与无理不等式&lt;br&gt;22｜单调、极值与面积<\/td><td>05 把不等式当独立对象研究（同解变形、证明）；22 只用不等式的“符号”判断单调性。先学 05 再学 22。<\/td><\/tr><tr><td>函数与图象<\/td><td>06｜函数与图象、一次函数、二次函数与变化率&lt;br&gt;07｜指数的推广与指数函数、对数函数、幂函数与指对方程&lt;br&gt;17｜图象、性质与三角方程<\/td><td>06 建立“式—形”对应；07 换成指数、对数两类新函数；17 再换成周期函数。三者共用一套读图方法（定义域、单调、最值、对称），只是图形不同。<\/td><\/tr><tr><td>极限<\/td><td>09｜级数与极限&lt;br&gt;22｜实数与极限<\/td><td>09 从数列的“越来越接近”引入，偏直观；22 给出 ε-N 严格定义并用于导数。口径差异：09 的极限是描述性的，22 的极限是可推理的。<\/td><\/tr><tr><td>距离<\/td><td>15｜求轨迹的五步法、常见轨迹与空间轨迹&lt;br&gt;18｜位置关系与距离&lt;br&gt;13｜空间角与距离&lt;br&gt;16｜正弦定理、余弦定理与形状判断<\/td><td>15 用距离条件定义轨迹；18 给出点到直线的解析公式；13 处理空间中点线面的距离；16 用三角比在三角形内算距离。四种距离，四套工具。<\/td><\/tr><tr><td>面积与体积<\/td><td>14｜平面图形的面积、圆、扇形与曲线形面积、立体图形的体积&lt;br&gt;16｜面积公式与应用&lt;br&gt;22｜微分与积分、单调、极值与面积<\/td><td>14 给公式（含辛普森公式），要求会用；16 用两边夹角求三角形面积；22 用定积分求曲边面积与体积。前两者是“套公式”，后者是“造公式”。<\/td><\/tr><tr><td>坐标与变换<\/td><td>18｜倾斜角与斜率、直线方程的五种形式&lt;br&gt;19｜统一定义、光学性质与坐标变换&lt;br&gt;20｜极坐标、参数方程&lt;br&gt;21｜线性变换与二次型&lt;br&gt;10｜复数的运算与几何意义<\/td><td>18 直角坐标下的直线；19 圆锥曲线的坐标变换（平移、旋转）；20 极坐标与参数方程；21 把变换写成矩阵；10 用复数表示旋转。同一件事的五种语言。<\/td><\/tr><tr><td>计数与概率<\/td><td>08｜两条原理与排列、组合与组合数、可重复排列与分组分配&lt;br&gt;24｜概率与计数<\/td><td>08 只讲怎么数（排列、组合、分组）；24 把数出来的结果变成概率（古典定义）。24 的计数部分直接复用 08 的公式。<\/td><\/tr><tr><td>角与三角<\/td><td>11｜角与平行线&lt;br&gt;16｜正弦定理、余弦定理与形状判断&lt;br&gt;17｜角、弧度与三角比、同角关系与诱导公式、加法定理与倍角公式<\/td><td>11 的角是几何对象（平行、内错角）；16 用三角比算三角形的边角；17 把角升级为自变量，三角比成为函数。<\/td><\/tr><tr><td>数系与开方<\/td><td>01｜有理数的概念与数轴、无理数与实数、逼近、代数数与超越数&lt;br&gt;04｜根式与算术根&lt;br&gt;10｜数系扩张与复数概念&lt;br&gt;14｜圆、扇形与曲线形面积<\/td><td>01 讲有理数到实数的扩张（含 √2 的无理性）；04 讲根式的运算；10 再扩张到复数；14 的 π 属于超越数。口径差异：01 用“逼近”理解无理数，04 用“运算”使用根式。<\/td><\/tr><tr><td>逻辑与推理<\/td><td>15｜命题与充分必要条件&lt;br&gt;23｜命题与真值表、逻辑恒等式与化简<\/td><td>15 的充分必要是“证明的语言”；23 把它符号化，变成可计算的代数。同一套规则，一个用于写证明，一个用于设计电路。<\/td><\/tr><tr><td>空间几何<\/td><td>13｜空间的位置关系与平行、垂直关系与三垂线定理、空间角与距离&lt;br&gt;14｜立体图形的体积&lt;br&gt;11｜三角形与全等&lt;br&gt;12｜圆的基本性质<\/td><td>11、12 平面内的三角形与圆是空间几何的素材；13 讲线面位置与空间角；14 给出体积公式。先平面后空间，顺序不能反。<\/td><\/tr><\/tbody><\/table>\n<h2>使用方式<\/h2>\n<ul><li>\n先在主线上学到某个概念（例如在 18 学“点到直线的距离”），再到这张表里看其他书怎么讲同一个概念，做交叉复习。\n<\/li><li>\n遇到口径不同（例如“极限”在 09 是描述性的、在 22 是 ε-N 定义），不要强行统一，先分别记住两种说法各自的适用场景。\n<\/li><li>\n复习时优先看“口径差异与衔接”列：它写的是两本书之间的接缝在哪里，接缝处最容易断。\n<\/ul>\n<h2>三条最容易断的接缝<\/h2>\n<ol><li>\n<strong>09 的极限 → 22 的极限<\/strong>：09 只说“越来越接近”，22 要求“任意 ε 都能达到”。不补这一步，22 的导数定义会看不懂。\n<\/li><li>\n<strong>15 的轨迹 → 18、19 的解析几何<\/strong>：15 教的是“条件翻译成方程并检验”，18、19 直接用这套动作，但不复习就会退化成套公式。\n<\/li><li>\n<strong>08 的计数 → 24 的概率<\/strong>：24 的古典概率全靠 08 的组合数，08 不熟，24 的分母就写不对。\n<\/ol>", "doc3": "<h1>综合检验建议<\/h1>\n<p>单本书的测验只能检验该书的掌握程度。真正的能力体现在“跨书调用”：遇到一个问题，知道该拿哪几本书的工具，并且把它们接起来。下面六道题都要求同时用到两本以上的书，每题 20–40 分钟，适合在主线上走完一遍后做阶段性检验。<\/p>\n<h2>跨书整合题<\/h2>\n<h3>题 1：从 √2 到二次方程（用 01、03、04）<\/h3>\n<ul><li>\n涉及：01 第 4 章（无理数与实数）、03 第 3 章（一元二次方程）、04 第 4 章（根式）\n<\/li><li>\n要求：\n<ol>\n<li>\n用反证法证明 √2 不是有理数（01 的写法）；\n<\/li><li>\n解方程 x²−2=0，说明它的根正是 ±√2（03 的求根公式）；\n<\/li><li>\n化简 1/(√2−1) 并验证结果（04 的分母有理化）。\n<\/li><li>\n评分要点：反证法的假设与矛盾点写清楚；求根公式中判别式的计算正确；有理化后能代回验证。\n<\/ol>\n<\/ul>\n<h3>题 2：抛物线从几何到解析（用 06、15、19）<\/h3>\n<ul><li>\n涉及：06 第 3 章（二次函数）、15 第 3 章（常见轨迹）、19 第 2 章（抛物线）\n<\/li><li>\n要求：分别用三本书的语言描述同一条曲线 y=x²/4：\n<ol>\n<li>\n作为二次函数，说出顶点、对称轴、开口方向；\n<\/li><li>\n作为轨迹，说出它到哪一点与哪一条直线的距离相等；\n<\/li><li>\n作为圆锥曲线，写出焦点与准线，并用统一定义（e=1）核对。\n<\/li><li>\n评分要点：三种描述指向同一条曲线；焦点与准线的数值必须自洽（p=2，焦点 (0,1)，准线 y=−1）。\n<\/ol>\n<\/ul>\n<h3>题 3：三角形面积的三条路（用 14、16、22）<\/h3>\n<ul><li>\n涉及：14 第 1 章（平面图形面积）、16 第 3 章（面积公式）、22 第 4 章（定积分求面积）\n<\/li><li>\n要求：取三角形三顶点 A(0,0)、B(4,0)、C(1,3)，分别\n<ol>\n<li>\n用底乘高求面积；\n<\/li><li>\n用两边夹角公式（先算夹角）求面积；\n<\/li><li>\n用定积分（求两条边的直线方程后积分）求面积。\n<\/li><li>\n评分要点：三个结果必须相同（面积 6）；每种方法都要写出中间步骤；能说明为什么结果一定一致。\n<\/ol>\n<\/ul>\n<h3>题 4：方程组、矩阵与几何交点（用 03、18、21）<\/h3>\n<ul><li>\n涉及：03 第 2 章（一次方程组）、18 第 3 章（位置关系）、21 第 1 章（消元与秩）\n<\/li><li>\n要求：给定三条直线 x+y=3、2x−y=0、x+2y=5，\n<ol>\n<li>\n用代入法判断三线是否共点；\n<\/li><li>\n用消元（增广矩阵）判断方程组的解的情形；\n<\/li><li>\n从几何角度解释“秩不足”对应的是哪两条直线重合或平行。\n<\/li><li>\n评分要点：代数结论与几何结论一致；能说清“无穷多解”在几何上意味着什么。\n<\/ol>\n<\/ul>\n<h3>题 5：抽样调查的完整流程（用 08、24）<\/h3>\n<ul><li>\n涉及：08 第 2 章（组合）、24 第 3 章（抽样与推断）\n<\/li><li>\n要求：某校 600 人，要抽 60 人调查睡眠时长。\n<ol>\n<li>\n用组合数说明“任意 60 人”的抽法有多少种（只需写出表达式）；\n<\/li><li>\n说明为什么简单随机抽样能保证代表性；\n<\/li><li>\n若样本标准差 1.2 小时，估算标准误，并解释样本扩到 240 人后误差如何变化。\n<\/li><li>\n评分要点：组合表达式正确；标准误计算为 1.2/√60≈0.155；能说明翻四倍样本误差减半。\n<\/ol>\n<\/ul>\n<h3>题 6：逻辑、集合与证明（用 15、23）<\/h3>\n<ul><li>\n涉及：15 第 1 章（充分必要）、23 第 2 章（逻辑恒等式）\n<\/li><li>\n要求：设 p 为“x&gt;2”，q 为“x²&gt;4”。\n<ol>\n<li>\n判断 p 是 q 的什么条件，并给出证明；\n<\/li><li>\n把“p 蕴含 q”写成逻辑表达式 A′+B 的形式，列真值表验证；\n<\/li><li>\n说明“q 推不出 p”对应哪一个反例。\n<\/li><li>\n评分要点：条件判断正确（充分不必要）；真值表四行齐全；反例取 x=−3。\n<\/ol>\n<\/ul>\n<h2>进阶路线<\/h2>\n<ol><li>\n<strong>偏理论<\/strong>：01 → 02 → 03 → 05 → 09 → 21 → 22。这条线走的是“数—式—方程—不等式—极限—线性—微积分”，是最接近大学数学分析/高等代数的路径。走完后可以补 23（逻辑）作为形式化训练。\n<\/li><li>\n<strong>偏几何<\/strong>：11 → 12 → 13 → 14 → 15 → 16 → 18 → 19 → 20。这条线从平面到空间再到解析，最后用极坐标与参数方程收尾，适合想强化空间与图形能力的人。\n<\/li><li>\n<strong>偏应用与数据<\/strong>：01 → 02 → 06 → 07 → 08 → 24 → 22。这条线以函数与数据为主线，24 的概率与统计是落点，22 的积分用于处理连续累积量。\n<\/li><li>\n<strong>偏竞赛<\/strong>：02 → 05 → 08 → 09 → 15 → 19 → 21。组合、不等式、数列、轨迹与圆锥曲线是竞赛的五个高频块，21 的矩阵在部分竞赛题里能显著简化计算。\n<\/ol>\n<h2>阶段检验建议<\/h2>\n<ul><li>\n每完成 4 本书，做一道跨书整合题，不要只做单书测验。\n<\/li><li>\n每完成 8 本书，把已学书的“从零推导”页面各抽一节，合上答案自己推一遍。\n<\/li><li>\n全部走完后，选一道整合题，限时 40 分钟，不看笔记完成；做不出来说明某本书只记住了结论。\n<\/ul>"};

let cur = {book:'cross', doc:FIRST_DOC, page:'cross'};
const store = {

};
function stKey(book,k){ return 'hb:'+book+':'+k; }
function getState(book){

/* ---------- 路由 ---------- */
function parseHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return {book:'cross', doc:FIRST_DOC, page:'cross'};
  const p = h.split('/');
  if(p[0]==='cross') return {book:'cross', doc:p[1]||FIRST_DOC, page:'cross'};
  if(p[0]==='book'){
    const key=p[1], page=p.slice(2).join('/')||'path';
    return {book:key, page:page, doc:null};
  }
  return {book:'cross', doc:FIRST_DOC, page:'cross'};
}
function pageIdOf(page){
  if(page==='path') return '__path__';
  if(page==='cards') return '__cards__';
  if(page==='glossary') return '__glossary__';
  if(page==='patterns') return '__patterns__';
  if(page==='cheatsheet') return '__cheatsheet__';
  if(page.startsWith('quiz/')) return '__quiz_'+(page.split('/')[1]||'all')+'__';
  if(page.startsWith('chapter/')) return page.slice(8);
  if(page.startsWith('concept/')) return page.slice(8);
  return page;
}

/* ---------- 侧栏 ---------- */
function renderNav(){
  const nav=$('#nav'); nav.innerHTML='';

  };
  const sec=t=>{ const d=document.createElement('div'); d.className='nav-sec'; d.textContent=t; nav.appendChild(d); };

  if(cur.book==='cross'){
    sec(CROSS_META.length>1 ? '跨书总览' : '总览');
    CROSS_META.forEach(c=> add(c.label, '#/cross/'+c.key, cur.doc===c.key?'active':''));
    sec('书籍入口');
    META.forEach(m=> add(m.title, '#/book/'+m.key+'/path'));
    updateProgress(0, CROSS_META.length>1 ? '跨书总览' : '总览');
    return;
  }
  const B=BOOKS[cur.book];
  const S=getState(cur.book);
  const man=B.manifest;
  add('学习路径','#/book/'+cur.book+'/path', cur.page==='path'?'active':'');
  sec('章节');
  (man.chapters||[]).forEach(c=>{
    const id=c.id;
    const a=add(c.title, '#/book/'+cur.book+'/chapter/'+id, cur.page==='chapter/'+id?'active':'');
    if(S.visited.includes(cur.book+'/chapter/'+id)){
      const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
    }
  });
  if((man.concepts||[]).length){
    sec('概念');
    man.concepts.forEach(c=>{
      const a=add(c.title, '#/book/'+cur.book+'/concept/'+c.id, cur.page==='concept/'+c.id?'active':'');
      if(S.visited.includes(cur.book+'/concept/'+c.id)){
        const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
      }
    });
  }
  sec('测验');
  add('全部测验','#/book/'+cur.book+'/quiz/all', cur.page==='quiz/all'?'active':'');
  (man.chapters||[]).forEach(c=>{
    if(!((B.quizCoverage||{})[c.id])) return;
    add('测验：'+c.title, '#/book/'+cur.book+'/quiz/'+c.id, cur.page==='quiz/'+c.id?'active':'');
  });
  sec('复习工具');
  add('抽认卡','#/book/'+cur.book+'/cards', cur.page==='cards'?'active':'');
  add('术语表','#/book/'+cur.book+'/glossary', cur.page==='glossary'?'active':'');
  if(B.rendered['__patterns__']) add('模式库','#/book/'+cur.book+'/patterns', cur.page==='patterns'?'active':'');
  if(B.rendered['__cheatsheet__']) add('速查表','#/book/'+cur.book+'/cheatsheet', cur.page==='cheatsheet'?'active':'');
  sec('其他');
  const m=META.find(x=>x.key===cur.book);
  if(m) add('单独打开学习伴侣 ↗', encodeURI(m.companion));

  updateProgressBook(cur.book);
}

/* ---------- 进度 ---------- */
function updateProgress(pct,label){
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=label;
}
function updateProgressBook(book){
  const B=BOOKS[book], S=getState(book);
  const chs=(B.manifest.chapters||[]).length;
  const done=(B.manifest.chapters||[]).filter(c=>S.visited.includes(book+'/chapter/'+c.id)).length;
  const pct=chs?Math.round(done/chs*100):0;
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=`《${(META.find(x=>x.key===book)||{}).title||book}》 进度 ${pct}% · 已学 ${done}/${chs} 章`;
}

  const docId=cur.doc||FIRST_DOC;

function renderBook(){
  const B=BOOKS[cur.book];
  if(!B){ $('#view').innerHTML='<div class="empty">书目不存在</div>'; return; }
  const pid=pageIdOf(cur.page);
  let html=B.rendered[pid];
  if(!html){ html='<div class="empty">页面不存在</div>'; }
  const S=getState(cur.book);
  if((cur.page.startsWith('chapter/')||cur.page.startsWith('concept/')) && !S.visited.includes(cur.book+'/'+cur.page)){
    S.visited.push(cur.book+'/'+cur.page);
    store.set(stKey(cur.book,'visited'), S.visited);
  }
  $('#view').innerHTML=html;
  if(cur.page==='cards') initCards();
  if(cur.page==='glossary') initGlossary();
  if(cur.page.startsWith('quiz/')) initQuizzes();
  if(pid==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 测验 ---------- */
function initQuizzes(){
  const B=BOOKS[cur.book];
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn=item.querySelector('.quiz-check');
    if(!btn||item.dataset.inited) return;
    item.dataset.inited='1';
    btn.addEventListener('click',()=>{
      const qid=item.dataset.qid, type=item.dataset.type;
      const q=(B.manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user=null, correct=false, fb='';
      if(type==='single'){
        const sel=item.querySelector('input:checked');
        user=sel?parseInt(sel.value):null;
        correct=(user===q.answer);
        fb=correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      }else if(type==='multi'){
        user=Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans=Array.isArray(q.answer)?q.answer.slice().sort():[q.answer];
        correct=user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb=correct?'✓ 正确':'✗ 错误';
      }else if(type==='blank'){
        const v=(item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        correct=(v===String(q.answer).trim().toLowerCase());
        fb=correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)?q.answer.includes(val):val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed=item.querySelector('.quiz-feedback');
      feed.className='quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent=fb;
      let ex=item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML='解析：'+esc(q.explain||'');
      const S=getState(cur.book);
      const ch=q.chapterId||'__all__';
      if(!S.quiz[ch]) S.quiz[ch]={n:0};
      S.quiz[ch].n+=1;
      store.set(stKey(cur.book,'quiz'), S.quiz);
    });
  });
}
function updatePath(){
  const B=BOOKS[cur.book], S=getState(cur.book);
  document.querySelectorAll('.path-step').forEach(el=>{
    const step=el.id.replace('path-','');
    const s=(B.manifest.learningPath||[]).find(x=>String(x.step)===step);
    if(s && (s.chapterIds||[]).every(c=>S.visited.includes(cur.book+'/chapter/'+c))){
      el.classList.add('passed');
      if(!el.querySelector('.ck')){ const sp=document.createElement('span'); sp.className='ck done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx=0, cardList=[];
function initCards(){
  const B=BOOKS[cur.book];
  const cards=B.manifest.flashcards||[];
  cardList=cards.slice(); cardIdx=0;
  if(!$('#card-done')){
    const d=document.createElement('div'); d.id='card-done'; d.className='empty';
    d.style.display='none'; d.textContent='本组卡片已全部复习完 🎉';
    const st=$('#card-stage'); if(st) st.appendChild(d);
  }
  const sel=$('#card-filter'); if(!sel) return;
  sel.innerHTML='<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c;
    const ch=(B.manifest.chapters||[]).find(x=>x.id===c);
    o.textContent=ch?ch.title:c; sel.appendChild(o);
  });
  sel.onchange=()=>{ const v=sel.value; cardList=v?cards.filter(c=>c.chapterId===v):cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick=()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick=()=>markCard(true);
  $('#card-again-btn').onclick=()=>markCard(false);
  showCard();
}
function showCard(){
  const S=getState(cur.book);
  updateCardCounts();
  const done=$('#card-done'), fc=$('#flashcard');
  if(cardIdx>=cardList.length){
    if(done) done.style.display=''; if(fc) fc.style.display='none'; return;
  }
  if(done) done.style.display='none'; if(fc) fc.style.display='';
  const c=cardList[cardIdx];
  document.querySelector('.fc-front').textContent=c.front;
  document.querySelector('.fc-back').textContent=c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const S=getState(cur.book);
  const c=cardList[cardIdx]; if(!c) return;
  S.cards[c.id]=known?'known':'again';
  store.set(stKey(cur.book,'cards'), S.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const S=getState(cur.book);
  const known=Object.values(S.cards).filter(v=>v==='known').length;
  const again=Object.values(S.cards).filter(v=>v==='again').length;
  const k=$('#card-known'), a=$('#card-again'), l=$('#card-left');
  if(k) k.textContent=known; if(a) a.textContent=again; if(l) l.textContent=Math.max(0,cardList.length-cardIdx);
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input=$('#glossary-filter');
  if(!input||input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput=()=>{
    const v=input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display=(!v||li.dataset.term.includes(v))?'':'none';
    });
  };
}

/* ---------- 全局搜索 ---------- */
let searchIdx=null;
function buildSearch(){
  if(searchIdx) return searchIdx;
  searchIdx=[];
  META.forEach(m=>{
    const B=BOOKS[m.key];
    Object.entries(B.rendered).forEach(([pid,html])=>{
      if(pid.startsWith('__')) return;
      const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
      searchIdx.push({book:m.key, page:pdfToPage(pid, B), text, label:m.title});
    });
  });
  Object.entries(CROSS).forEach(([k,html])=>{
    const meta=CROSS_META.find(x=>x.key===k)||{};
    searchIdx.push({book:'cross', page:'cross/'+k, text:html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '), label:(meta.label||'总览')});
  });
  return searchIdx;
}
function pdfToPage(pid, B){
  if(pid.startsWith('__quiz_')) return 'quiz/'+pid.replace('__quiz_','').replace('__','');
  if(pid==='__path__') return 'path';
  if(pid==='__cards__') return 'cards';
  if(pid==='__glossary__') return 'glossary';
  if(pid==='__patterns__') return 'patterns';
  if(pid==='__cheatsheet__') return 'cheatsheet';
  const ch=(B.manifest.chapters||[]).find(c=>c.id===pid);
  if(ch) return 'chapter/'+pid;
  return 'concept/'+pid;
}
$('#q').addEventListener('input', e=>{
  const v=e.target.value.trim().toLowerCase();
  if(!v){ route(); return; }
  const hits=buildSearch().filter(p=>p.text.toLowerCase().includes(v)).slice(0,40);
  $('#view').innerHTML='<h1>搜索结果：'+esc(v)+'</h1>'+
    (hits.length? hits.map(h=>{
      const href=h.book==='cross'?('#/cross/'+(h.page.split('/')[1]||FIRST_DOC)):('#/book/'+h.book+'/'+h.page);
      return `<div class="search-hit"><a href="${href}">${esc(h.label)}</a><br><span style="color:var(--muted);font-size:13px">${esc(h.text.slice(0,200))}</span></div>`;
    }).join('') : '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语。</div>');
});

/* ---------- Mermaid ---------- */
let mermaidState='idle';
function renderMermaid(){
  const els=Array.from(document.querySelectorAll('.mermaid')).filter(el=>!el.dataset.rendered);
  if(!els.length) return;
  const run=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme:document.body.dataset.theme==='dark'?'dark':'default'});
    els.forEach((el,idx)=>{ try{
      const out=mermaid.render('mm'+Date.now()+idx, el.textContent);
      if(out && typeof out.then==='function'){
        out.then(r=>{ el.innerHTML=r.svg; el.dataset.rendered='1'; }).catch(()=>{ el.dataset.rendered='0'; });
      } else { el.innerHTML=out; el.dataset.rendered='1'; }
    } catch(e){ el.dataset.rendered='0'; } });
  }catch(e){} };
  if(window.mermaid){ run(); return; }
  if(mermaidState==='loading') return;
  mermaidState='loading';
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ mermaidState='loaded'; run(); };
  s.onerror=()=>{ mermaidState='failed'; };
  document.head.appendChild(s);
}

/* ---------- 主题 ---------- */

themeBtn.onclick=()=>{

  document.body.dataset.theme=d?'':'dark';

};
