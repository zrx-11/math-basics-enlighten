C 为：", "options": ["70°", "110°", "90°", "20°"], "answer": 1, "explain": "对角互补：∠C=180°−70°=110°。", "relatedConceptId": "c01", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "圆内两弦相交，交点分一弦为 2 和 9，分另一弦为 3 和 x，则 x 为：", "options": ["6", "4.5", "7", "5"], "answer": 0, "explain": "2×9=3×x，得 x=6。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "下列关于圆的切线的说法正确的是：", "options": ["切线一定过圆心", "切线垂直于过切点的半径", "切线与圆有两个公共点", "切线长都相等"], "answer": 1, "explain": "切线垂直于过切点的半径；切线只有一个公共点，切线长只在同一外点的两条切线间相等。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：圆的基本性质」的一句话核心是什么？", "back": "同弧所对的圆周角相等，且等于圆心角的一半；直径所对的圆周角是直角。", "tags": ["circle", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：直线与圆的位置关系」的一句话核心是什么？", "back": "位置关系只看一个数：圆心到直线的距离 d 与半径 r 比大小。", "tags": ["circle", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：比例线段与圆内接四边形」的一句话核心是什么？", "back": "圆里的比例关系全部来自相似三角形：把圆上的点连起来，就能找到成比例的边。", "tags": ["circle", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「弦」？", "back": "圆上两点间的线段。", "tags": ["circle", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「弧」？", "back": "圆上两点之间的部分。", "tags": ["circle", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「圆心角」？", "back": "顶点在圆心的角。", "tags": ["circle", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「圆周角」？", "back": "顶点在圆上、两边与圆相交的角。", "tags": ["circle", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「垂径定理」？", "back": "垂直于弦的直径平分弦及所对的弧。", "tags": ["circle", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「切线」？", "back": "与圆只有一个公共点的直线。", "tags": ["circle", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「切线长」？", "back": "圆外一点到切点的线段长度。", "tags": ["circle", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「相交弦定理」？", "back": "圆内两弦相交，交点分成的两段乘积相等。", "tags": ["circle", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「切割线定理」？", "back": "PT²=PA·PB。", "tags": ["circle", "术语"]}, {"id": "f13", "chapterId": "ch03", "front": "什么是「弦切角」？", "back": "切线与弦的夹角，等于所夹弧对的圆周角。", "tags": ["circle", "术语"]}], "companion": "circle学习伴侣.html", "deriv": "circle从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">垂径、圆周角<\/span><\/div><h1>第 1 章：圆的基本性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：垂径、圆周角\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用垂径定理求弦长\n<\/li><li>\n用圆心角与圆周角关系求角\n<\/li><li>\n识别直径所对的直角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同弧所对的圆周角相等，且等于圆心角的一半；直径所对的圆周角是直角。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 圆的基本元素<\/h3>\n<p>圆心 O、半径 r、弦（圆上两点连线）、弧（圆上两点间的部分）、圆心角（顶点在圆心的角）。<\/p>\n<h3>1.2 垂径定理<\/h3>\n<p>垂直于弦的直径平分这条弦，也平分弦所对的两条弧。<\/p>\n<p>推论：弦心距、半弦、半径构成直角三角形，满足 r²=d²+(半弦)²。这是求弦长最常用的关系。<\/p>\n<h3>1.3 圆心角与圆周角<\/h3>\n<p>顶点在圆心的角叫圆心角，顶点在圆上、两边与圆相交的角叫圆周角。<\/p>\n<p><strong>同弧所对的圆周角等于圆心角的一半<\/strong>；同弧所对的圆周角彼此相等。<\/p>\n<h3>1.4 直径所对的角<\/h3>\n<p>半圆（或直径）所对的圆周角是 90°；反过来，90° 的圆周角所对的弦是直径。这条结论在判定直角三角形时极常用。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：圆心角像站在圆心看风景的张角，圆周角像退到圆周上看同一段风景，视野只有一半。<\/p>\n<p><strong>失效边界<\/strong>：这些关系只对“同一段弧”成立；弧不同，角就不能直接比较。<\/p>\n<p><strong>实例<\/strong>：圆半径 5，弦心距 3，则半弦长 √(25−9)=4，弦长 8。 若某圆周角为 35°，则同弧所对的圆心角为 70°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 圆周角等于圆心角 —— 实际上 同弧时圆周角是圆心角的一半，不是相等。\n<\/li><li>\n别以为 任意弦都能用垂径定理 —— 实际上 垂径定理要求直径（或过圆心的直线）垂直于弦；普通弦没有这个性质。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n同弧所对的圆心角为 80°，则圆周角为：\n<\/li><li>\n圆半径为 10，弦心距为 6，则弦长为：\n<p>A. 80° ｜ B. 40° ｜ C. 160° ｜ D. 20° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：同弧圆周角是圆心角的一半。 A. 8 ｜ B. 12 ｜ C. 16 ｜ D. 20 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：半弦 =√(100−36)=8，弦长 16。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n同弧圆周角＝圆心角的一半\n<\/li><li>\n垂径定理：r²=d²+(半弦)²\n<\/li><li>\n直径所对圆周角 90°\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：圆的基本性质）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：圆的基本性质<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>圆的所有角度结论都来自一个事实：圆心角是“张角”，圆周角是它在圆上的“半视角”。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>顶点在圆心、两边为半径的角叫圆心角；顶点在圆上、两边与圆相交的角叫圆周角。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像看电影：坐在正中（圆心）看到的画面宽度，是坐在边上看同一块屏幕的两倍。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 垂径<\/h3>\n<div class=\"katex-block\">r^{2}=d^{2}+\\left(\\frac{AB}{2}\\right)^{2}<\/div>\n<p>半径、弦心距、半弦构成直角三角形，勾股定理。<\/p>\n<h3>2. 圆周角<\/h3>\n<div class=\"katex-block\">\\angle APB=\\frac{1}{2}\\angle AOB<\/div>\n<p>同弧所对的圆周角是圆心角的一半。<\/p>\n<h3>3. 等圆周角<\/h3>\n<div class=\"katex-block\">\\angle APB=\\angle AQB<\/div>\n<p>同弧上任意两点看同一段弧，角都相等。<\/p>\n<h3>4. 直径<\/h3>\n<div class=\"katex-block\">AB\\ \\text{为直径}\\ \\Rightarrow\\ \\angle APB=90^{\\circ}<\/div>\n<p>半圆所对的圆周角是直角，反之亦然。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>圆周角定理要求两角对着同一段弧；对着互补的弧时结论要改。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《圆》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/circle/chapter/ch01\">第 1 章：圆的基本性质<\/a><\/span><\/div><h1>第 2 章：直线与圆的位置关系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用圆心距判断相交、相切、相离\n<\/li><li>\n作切线并证明切线垂直于半径\n<\/li><li>\n使用切线长相等\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>位置关系只看一个数：圆心到直线的距离 d 与半径 r 比大小。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 三种位置关系<\/h3>\n<p>设圆心到直线的距离为 d：<\/p>\n<ul><li>\nd&lt;r：相交，两个公共点（割线）；\n<\/li><li>\nd=r：相切，一个公共点（切线）；\n<\/li><li>\nd&gt;r：相离，没有公共点。\n<\/ul>\n<h3>2.2 切线的性质与判定<\/h3>\n<p><strong>性质<\/strong>：圆的切线垂直于过切点的半径。<\/p>\n<p><strong>判定<\/strong>：过半径外端且垂直于这条半径的直线是切线。<\/p>\n<p>证明切线常走的路：连半径、证垂直。<\/p>\n<h3>2.3 切线长定理<\/h3>\n<p>从圆外一点引两条切线，两条切线长相等，且该点与圆心的连线平分两切线的夹角。<\/p>\n<h3>2.4 三角形与圆<\/h3>\n<p>三角形内切圆的圆心是三条角平分线的交点（内心），到三边距离相等；外接圆圆心是三边垂直平分线的交点（外心），到三顶点距离相等。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：切线像贴着圆滚过去的一条直线，只碰一下就离开。<\/p>\n<p><strong>失效边界<\/strong>：切线只与圆有一个公共点，但“只有一个公共点”的直线未必是切线（在曲线情形下要小心）。<\/p>\n<p><strong>实例<\/strong>：圆半径 4，圆心到直线距离 4，则直线与圆相切。 从圆外一点 P 引两条切线，切点为 A、B，若 PA=6，则 PB=6，且 OP 平分 ∠APB。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 直线与圆有一个公共点就是切线 —— 实际上 对圆成立，对一般曲线不成立；判定切线仍要证垂直。\n<\/li><li>\n别以为 切线与半径只是相交 —— 实际上 切线垂直于半径，是特殊的垂直关系，不是随便相交。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：\n<\/li><li>\n圆的切线具有的性质是：\n<p>A. 相交 ｜ B. 相切 ｜ C. 相离 ｜ D. 无法判断 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：d=5&gt;r=3，相离。 A. 平行于半径 ｜ B. 垂直于过切点的半径 ｜ C. 过圆心 ｜ D. 与直径重合 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：切线垂直于过切点的半径，这是切线的核心性质。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nd&lt;r 相交，d=r 相切，d&gt;r 相离\n<\/li><li>\n切线⊥过切点的半径\n<\/li><li>\n圆外一点的两条切线长相等\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：直线与圆的位置关系）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：直线与圆的位置关系<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>圆与直线的位置关系不需要复杂计算，只要比较“圆心到直线的距离”与半径。切线的一切性质都从“垂直”出发。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>与圆只有一个公共点的直线叫圆的切线，公共点叫切点。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像车轮贴着地面：地面就是切线，轮轴到地面的距离正好是轮半径。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 位置判定<\/h3>\n<div class=\"katex-block\">d&lt;r\\ \\text{相交};\\quad d=r\\ \\text{相切};\\quad d>r\\ \\text{相离}<\/div>\n<p>一个不等式决定三种情形。<\/p>\n<h3>2. 切线性质<\/h3>\n<div class=\"katex-block\">OT\\perp l\\quad(T\\ \\text{为切点})<\/div>\n<p>切点到圆心的半径与切线垂直。<\/p>\n<h3>3. 切线长<\/h3>\n<div class=\"katex-block\">PA=PB<\/div>\n<p>圆外一点引两条切线，长度相等。<\/p>\n<h3>4. 勾股关系<\/h3>\n<div class=\"katex-block\">OP^{2}=OT^{2}+PT^{2}<\/div>\n<p>半径、切线、圆心到外点的连线构成直角三角形。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>判定切线必须证明垂直；仅凭“看起来只碰一下”不算证明。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《圆》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/circle/chapter/ch02\">第 2 章：直线与圆的位置关系<\/a><\/span><\/div><h1>第 3 章：比例线段与圆内接四边形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、相似三角形\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用相交弦定理求线段\n<\/li><li>\n用切割线定理求切线长\n<\/li><li>\n使用圆内接四边形对角互补\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>圆里的比例关系全部来自相似三角形：把圆上的点连起来，就能找到成比例的边。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 相交弦定理<\/h3>\n<p>两条弦 AB、CD 交于圆内一点 P，则<\/p>\n<p>PA·PB=PC·PD<\/p>\n<p>证明：连接 AC、BD，由同弧所对圆周角相等得两组角相等，△PAC∽△PDB，对应边成比例。<\/p>\n<h3>3.2 切割线定理<\/h3>\n<p>从圆外一点 P 引切线 PT 与割线 PAB，则<\/p>\n<p>PT²=PA·PB<\/p>\n<p>这是相交弦定理的“外点版本”，同样由相似三角形推出。<\/p>\n<h3>3.3 圆内接四边形<\/h3>\n<p>四个顶点都在圆上的四边形叫圆内接四边形，它的对角互补：∠A+∠C=180°，∠B+∠D=180°。<\/p>\n<p>反过来，对角互补的四边形四点共圆，这是判定共圆的常用方法。<\/p>\n<h3>3.4 弦切角<\/h3>\n<p>切线与弦的夹角叫弦切角，它等于所夹弧对的圆周角。这条结论把切线与圆周角连了起来，是许多证明题的桥梁。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：圆像一个“比例转换器”：不论弦怎么放，交点到两端的两段乘积总是定值。<\/p>\n<p><strong>失效边界<\/strong>：定理要求点在圆内（相交弦）或圆外（切割线），位置不同用不同公式，不能混。<\/p>\n<p><strong>实例<\/strong>：弦 AB 与 CD 交于 P，PA=2、PB=6、PC=3，则 PD=PA·PB/PC=12/3=4。 圆外点 P 到圆的切线 PT=6，割线交圆于 A、B 且 PA=4，则 PB=36/4=9。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 相交弦定理可以直接相加 —— 实际上 定理给的是乘积相等，不是长度相加；混淆会算出错误答案。\n<\/li><li>\n别以为 圆内接四边形对角相等 —— 实际上 是对角互补（和为 180°），不是相等。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆内两弦相交，一弦被分成 3 和 8 两段，另一弦被分成 4 和 x，则 x 为：\n<\/li><li>\n圆内接四边形 ABCD 中，∠A=70°，则 ∠C 为：\n<p>A. 6 ｜ B. 5 ｜ C. 7 ｜ D. 9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：3×8=4×x，得 x=6。 A. 70° ｜ B. 110° ｜ C. 90° ｜ D. 20° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：对角互补：∠C=180°−70°=110°。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n相交弦：PA·PB=PC·PD\n<\/li><li>\n切割线：PT²=PA·PB\n<\/li><li>\n圆内接四边形对角互补\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：比例线段与圆内接四边形）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：比例线段与圆内接四边形<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>圆里的比例定理不是新公式，而是“连两条辅助线就出现相似三角形”的副产品。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>相交弦定理指圆内两弦相交时，交点分成的两段乘积相等。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像两个人从不同方向穿过同一扇门，门两侧的距离乘积总相等。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 相似来源<\/h3>\n<div class=\"katex-block\">\\angle CAB=\\angle CDB\\ \\Rightarrow\\ \\triangle PAC\\sim\\triangle PDB<\/div>\n<p>同弧所对圆周角相等，给出两组等角。<\/p>\n<h3>2. 相交弦<\/h3>\n<div class=\"katex-block\">PA\\cdot PB=PC\\cdot PD<\/div>\n<p>由相似比 PA/PD=PC/PB 交叉相乘得到。<\/p>\n<h3>3. 切割线<\/h3>\n<div class=\"katex-block\">PT^{2}=PA\\cdot PB<\/div>\n<p>外点版本的相似关系，切线长是比例中项。<\/p>\n<h3>4. 对角互补<\/h3>\n<div class=\"katex-block\">\\angle A+\\angle C=180^{\\circ}<\/div>\n<p>圆内接四边形两组对角分别互补。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>定理对圆内交点成立；交点在圆外时要用切割线定理。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《圆》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/circle/chapter/ch01\">第 1 章：圆的基本性质<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/circle/chapter/ch03\">第 3 章：比例线段与圆内接四边形<\/a><\/span><\/div><h1>同弧所对的角<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>同一段弧上，圆心角是圆周角的两倍，所有圆周角彼此相等。<\/p>\n<h2>为什么重要<\/h2>\n<p>圆里几乎所有求角问题都归结到这一条，是圆的角度体系的总开关。<\/p>\n<h2>详解<\/h2>\n<p>圆心角以圆心为顶点，圆周角以圆上一点为顶点，只要对着同一段弧，就满足“圆周角＝圆心角的一半”。由此推出直径所对圆周角为直角、弦切角等于所夹弧的圆周角。<\/p>\n<h2>常见误解<\/h2>\n<p>把对着不同弧的两个圆周角也当成相等，直接套结论。<\/p>\n<h2>相关概念<\/h2>\n<p>圆周角（ch01）、弦切角（ch03）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-12-圆 赵遂之.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/circle/chapter/ch03\">第 3 章：比例线段与圆内接四边形<\/a><\/span><\/div><h1>圆幂<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>过一点作圆的割线或切线，交点到定点的两段长度之积是定值。<\/p>\n<h2>为什么重要<\/h2>\n<p>相交弦定理与切割线定理是同一个“圆幂”的两种情形，统一记忆更省力。<\/p>\n<h2>详解<\/h2>\n<p>点在圆内：PA·PB=PC·PD（两弦）；点在圆外：PT²=PA·PB（切线与割线）；点在圆上：乘积为 0。三种情形可以统一写成“点到圆的幂”。<\/p>\n<h2>常见误解<\/h2>\n<p>把圆内与圆外的公式混用，或把乘积写成和。<\/p>\n<h2>相关概念<\/h2>\n<p>相交弦定理（ch03）、切割线定理（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：圆的基本性质<\/strong><br>阅读：<a href=\"#/book/circle/chapter/ch01\">第 1 章：圆的基本性质<\/a><br>检查点：能由圆周角推出圆心角<\/li><li class='path-step' id='path-02'><strong>步骤 02：直线与圆的位置关系<\/strong><br>阅读：<a href=\"#/book/circle/chapter/ch02\">第 2 章：直线与圆的位置关系<\/a><br>检查点：能用 d 与 r 判断位置关系并作切线<\/li><li class='path-step' id='path-03'><strong>步骤 03：比例线段与圆内接四边形<\/strong><br>阅读：<a href=\"#/book/circle/chapter/ch03\">第 3 章：比例线段与圆内接四边形<\/a><br>检查点：能用相交弦定理求线段长<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：圆的基本性质<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 同弧所对的圆心角为 80°，则圆周角为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 80°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 40°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 160°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 20°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 圆半径为 10，弦心距为 6，则弦长为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 8<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 12<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 16<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：直线与圆的位置关系<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 圆半径为 3，圆心到直线距离为 5，则直线与圆的位置关系是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 相交<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 相切<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 相离<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 圆的切线具有的性质是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 平行于半径<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 垂直于过切点的半径<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 过圆心<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 与直径重合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-s pan class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q8.<\/b> 下列关于圆的切线的说法正确的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 切线一定过圆心<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 切线垂直于过切点的半径<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 切线与圆有两个公共点<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 切线长都相等<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：圆的基本性质<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 同弧所对的圆心角为 80°，则圆周角为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 80°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 40°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 160°<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 20°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 圆半径为 10，弦心距为 6，则弦长为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 8<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 12<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 16<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='qu s=glossary-ref>（第 2 章：直线与圆的位置关系）<\/span><\/li><li data-term='切线长'>切线长 — 圆外一点到切点的线段长度。 <span class=glossary-ref>（第 2 章：直线与圆的位置关系）<\/span><\/li><li data-term='相交弦定理'>相交弦定理 — 圆内两弦相交，交点分成的两段乘积相等。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><li data-term='切割线定理'>切割线定理 — PT²=PA·PB。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><li data-term='弦切角'>弦切角 — 切线与弦的夹角，等于所夹弧对的圆周角。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：圆中求角三步<\/h2>\n<p>① 找同弧；② 判断是圆心角还是圆周角；③ 用倍数或相等关系换算。<\/p>\n<h2>框架：圆中求线段三步<\/h2>\n<p>① 判断点在圆内还是圆外；② 选相交弦或切割线公式；③ 列乘积相等求解。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>圆周角<\/td><td>同弧圆周角＝圆心角的一半<\/td><\/tr><tr><td>直径<\/td><td>直径所对圆周角 90°<\/td><\/tr><tr><td>垂径<\/td><td>r²=d²+(半弦)²<\/td><\/tr><tr><td>位置关系<\/td><td>d&lt;r 相交，d=r 相切，d&gt;r 相离<\/td><\/tr><tr><td>相交弦<\/td><td>PA·PB=PC·PD<\/td><\/tr><tr><td>切割线<\/td><td>PT²=PA·PB<\/td><\/tr><tr><td>圆内接四边形<\/td><td>对角互补<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：圆的基本性质", "href": "#/chapter/ch01"}, {"label": "第 2 章：直线与圆的位置关系", "href": "#/chapter/ch02"}, {"label": "第 3 章：比例线段与圆内接四边形", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "同弧所对的角", "href": "#/concept/c01"}, {"label": "圆幂", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：圆的基本性质", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：直线与圆的位置关系", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：比例线段与圆内 )", "[0°,90°]", "[0°,180°]", "(0°,180°)"], "answer": 1, "explain": "平行时为 0°，垂直时为 90°，故范围是 [0°,90°]。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "空间中两条直线都平行于第三条直线，则这两条直线：", "options": ["一定相交", "一定平行", "一定异面", "可能异面"], "answer": 1, "explain": "平行的传递性在空间中仍成立，故两直线平行。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "直线 l 垂直于平面 α 内两条相交直线，则：", "options": ["l 平行于 α", "l 垂直于 α", "l 在 α 内", "无法判断"], "answer": 1, "explain": "这正是线面垂直的判定定理。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：空间的位置关系与平行」的一句话核心是什么？", "back": "空间里“不相交”不等于“平行”；判定与性质定理必须成对使用。", "tags": ["lines-planes", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：垂直关系与三垂线定理」的一句话核心是什么？", "back": "线面垂直是空间垂直的总枢纽：一条直线垂直于平面内两条相交直线，就垂直于整个平面。", "tags": ["lines-planes", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：空间角与距离」的一句话核心是什么？", "back": "空间里的角都要先“作出平面角”再计算；距离都要先“作出垂线段”。", "tags": ["lines-planes", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「异面直线」？", "back": "不同在任何一个平面内的两条直线。", "tags": ["lines-planes", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「线面平行」？", "back": "直线与平面没有公共点。", "tags": ["lines-planes", "术语"]}, {"id": "f06", "chapterId": "ch02", "front": "什么是「线面垂直」？", "back": "直线垂直于平面内所有直线。", "tags": ["lines-planes", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「射影」？", "back": "斜线在平面内的正投影。", "tags": ["lines-planes", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「三垂线定理」？", "back": "平面内直线垂直于射影则垂直于斜线。", "tags": ["lines-planes", "术语"]}, {"id": "f09", "chapterId": "ch03", "front": "什么是「二面角」？", "back": "两个半平面所成的图形。", "tags": ["lines-planes", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「平面角」？", "back": "二面角中在棱上取点、两面内垂直棱的两射线夹角。", "tags": ["lines-planes", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「线面角」？", "back": "斜线与射影所成的角。", "tags": ["lines-planes", "术语"]}], "companion": "lines-planes学习伴侣.html", "deriv": "lines-planes从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-13-直线与平面 顾观煦.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">平面几何<\/span><\/div><h1>第 1 章：空间的位置关系与平行<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：平面几何\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n区分空间两直线的三种关系\n<\/li><li>\n用线面、面面平行定理完成证明\n<\/li><li>\n识别异面直线所成的角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>空间里“不相交”不等于“平行”；判定与性质定理必须成对使用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 空间两直线的三种关系<\/h3>\n<ul><li>\n相交：有且只有一个公共点；\n<\/li><li>\n平行：在同一平面内且无公共点；\n<\/li><li>\n异面：不同在任何一个平面内，既不平行也不相交。\n<\/ul>\n<p>异面直线所成的角：过空间中任一点分别作它们的平行线，两条平行线的夹角（取锐角或直角）就是异面直线所成的角，范围 (0°,90°]。<\/p>\n<h3>1.2 直线与平面<\/h3>\n<p>直线在平面内、直线与平面平行、直线与平面相交（只有一个公共点）。<\/p>\n<h3>1.3 平行的三条定理<\/h3>\n<ul><li>\n<strong>线面平行判定<\/strong>：平面外一条直线与平面内一条直线平行，则该直线平行于这个平面；\n<\/li><li>\n<strong>线面平行性质<\/strong>：直线平行于平面，过该直线的平面与原平面相交，则交线与该直线平行；\n<\/li><li>\n<strong>面面平行判定<\/strong>：一个平面内的两条相交直线都平行于另一个平面，则两平面平行。\n<\/ul>\n<p>判定是由“线线平行”推“线面平行”，性质是反过来。证明时要写清用的是哪一条。<\/p>\n<h3>1.4 常见误区<\/h3>\n<p>用平面图形的直觉去推空间结论，最容易出错的是“两条直线都平行于第三条，就一定互相平行”——空间中这仍然成立；但“两条直线都垂直于同一条直线就一定平行”则不成立。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：异面直线像两根互相交错但不相碰的筷子，你怎么转动桌面都无法让它们落在同一平面里。<\/p>\n<p><strong>失效边界<\/strong>：平面几何的“平行传递性”可以推广到空间，但垂直关系不能随便传递。<\/p>\n<p><strong>实例<\/strong>：正方体 ABCD-A′B′C′D′ 中，AB 与 CC′ 是异面直线；AB 与 C′D′ 平行；AB 与 B′C′ 异面，所成角为 90°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 空间中不相交的两条直线一定平行 —— 实际上 还可能是异面；平行要求共面。\n<\/li><li>\n别以为 垂直于同一条直线的两条直线平行 —— 实际上 空间中不成立，两条直线可能异面且都垂直于第三条。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n空间中两条直线的位置关系共有几种：\n<\/li><li>\n线面平行的判定定理中，平面外直线需要与平面内的哪条直线平行：\n<p>A. 2 种 ｜ B. 3 种 ｜ C. 4 种 ｜ D. 1 种 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：相交、平行、异面三种。 A. 任意一条 ｜ B. 一条 ｜ C. 两条相交直线 ｜ D. 两条平行直线 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：只需与平面内的一条直线平行即可判定线面平行。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n空间两直线：相交、平行、异面\n<\/li><li>\n线面平行判定：面外线∥面内线\n<\/li><li>\n判定与性质成对，证明要写依据\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：空间的位置关系与平行）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：空间的位置关系与平行<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>空间几何不能靠画图猜。先把“位置关系”数清楚，再用成对的定理把平行关系一步步推上去。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>不同在任何一个平面内的两条直线叫异面直线；直线与平面无公共点叫线面平行。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像走廊两侧的栏杆：看起来平行，其实可能一高一低、方向略偏，属于异面。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 异面角<\/h3>\n<div class=\"katex-block\">\\theta\\in(0^{\\circ},90^{\\circ}]<\/div>\n<p>平移到相交后取锐角或直角，是异面直线所成的角。<\/p>\n<h3>2. 线面平行判定<\/h3>\n<div class=\"katex-block\">a\\not\\subset\\alpha,\\ b\\subset\\alpha,\\ a\\parallel b\\ \\Rightarrow\\ a\\parallel\\alpha<\/div>\n<p>面外一条线与面内一条线平行，就平行于整个平面。<\/p>\n<h3>3. 面面平行判定<\/h3>\n<div class=\"katex-block\">a,b\\subset\\alpha,\\ a\\cap b=P,\\ a\\parallel\\beta,\\ b\\parallel\\beta\\ \\Rightarrow\\ \\alpha\\parallel\\beta<\/div>\n<p>两条相交直线都平行于另一平面，两平面才平行。<\/p>\n<h3>4. 线面平行性质<\/h3>\n<div class=\"katex-block\">a\\parallel\\alpha,\\ a\\subset\\beta,\\ \\alpha\\cap\\beta=b\\ \\Rightarrow\\ a\\parallel b<\/div>\n<p>用平面去截，交线与原直线平行。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>空间中没有“平移整条直线”的自由度时，平行不能靠肉眼判断，必须用定理。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《直线与平面》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-13-直线与平面 顾观煦.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/lines-planes/chapter/ch01\">第 1 章：空间的位置关系与平行<\/a><\/span><\/div><h1>第 2 章：垂直关系与三垂线定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用线面垂直的判定与性质完成证明\n<\/li><li>\n说出三垂线定理及其逆定理\n<\/li><li>\n在具体图形中找出垂足与射影\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>线面垂直是空间垂直的总枢纽：一条直线垂直于平面内两条相交直线，就垂直于整个平面。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 线面垂直的判定<\/h3>\n<p>若一条直线垂直于平面内两条<strong>相交<\/strong>直线，则它垂直于这个平面。<\/p>\n<p>注意“相交”二字：垂直于两条平行直线不足以判定线面垂直。<\/p>\n<h3>2.2 线面垂直的性质<\/h3>\n<ul><li>\n垂直于同一平面的两条直线平行；\n<\/li><li>\n直线垂直于平面，则它垂直于平面内任意一条直线。\n<\/ul>\n<p>第二条是证明线线垂直最常用的通道：想证两线垂直，先证其中一条垂直于另一条所在的平面。<\/p>\n<h3>2.3 三垂线定理<\/h3>\n<p>平面内一条直线若垂直于斜线在该平面内的射影，则它也垂直于这条斜线；反之，若垂直于斜线，则垂直于射影。<\/p>\n<p>这条定理把“空间垂直”转化为“平面内的垂直”，是立体几何里最实用的工具之一。<\/p>\n<h3>2.4 面面垂直<\/h3>\n<p>判定：一个平面过另一个平面的一条垂线，则两平面垂直。 性质：两平面垂直，则一个平面内垂直于交线的直线垂直于另一个平面。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：三垂线定理像用一根杆的影子判断杆是否与地面上的线垂直：影子垂直，杆就垂直。<\/p>\n<p><strong>失效边界<\/strong>：三垂线定理要求斜线在平面内有射影，即斜线不能平行于平面。<\/p>\n<p><strong>实例<\/strong>：正方体中 AC⊥BD（对角线互相垂直），AA′⊥底面，故 AA′⊥BD；又 AC 是 A′C 在底面的射影，所以 A′C⊥BD。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 垂直于平面内两条直线就垂直于平面 —— 实际上 必须是两条相交直线；两条平行线不能确定一个平面方向。\n<\/li><li>\n别以为 三垂线定理可以直接用于任意直线 —— 实际上 定理针对斜线及其射影；直线平行于平面时没有射影，不能套用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判定一条直线垂直于一个平面，需要它垂直于平面内：\n<\/li><li>\n三垂线定理的作用是：\n<p>A. 一条直线 ｜ B. 两条平行直线 ｜ C. 两条相交直线 ｜ D. 三条直线 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：两条相交直线确定平面的方向，缺“相交”条件不成立。 A. 把面面垂直化为线面垂直 ｜ B. 把空间垂直化为平面内的垂直 ｜ C. 求体积 ｜ D. 判断平行 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：它通过射影把空间中的垂直关系转化为平面内的垂直关系。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线面垂直：垂直于面内两条相交直线\n<\/li><li>\n想证线线垂直，先找线面垂直\n<\/li><li>\n三垂线定理：射影垂直 ⇔ 斜线垂直\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：垂直关系与三垂线定理）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：垂直关系与三垂线定理<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>空间垂直不是靠眼睛看出来的，而是靠一条链：线线垂直 → 线面垂直 → 线线垂直。三垂线定理是这条链最灵活的用法。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>直线与平面内任意直线都垂直，叫直线垂直于平面；斜线在平面内的正投影叫射影。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像立一根旗杆：只要它同时垂直于地面上两条不平行的方向，它就垂直于整块地面。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 线面垂直判定<\/h3>\n<div class=\"katex-block\">l\\perp a,\\ l\\perp b,\\ a\\cap b=P\\ \\Rightarrow\\ l\\perp\\alpha<\/div>\n<p>两条相交直线定住平面的方向。<\/p>\n<h3>2. 线面垂直性质<\/h3>\n<div class=\"katex-block\">l\\perp\\alpha,\\ m\\subset\\alpha\\ \\Rightarrow\\ l\\perp m<\/div>\n<p>垂直于平面就垂直于面内所有直线。<\/p>\n<h3>3. 三垂线定理<\/h3>\n<div class=\"katex-block\">PO\\perp\\alpha,\\ OA\\perp l\\ \\Rightarrow\\ PA\\perp l<\/div>\n<p>射影垂直则斜线垂直，把空间问题降为平面问题。<\/p>\n<h3>4. 面面垂直<\/h3>\n<div class=\"katex-block\">l\\perp\\beta,\\ l\\subset\\alpha\\ \\Rightarrow\\ \\alpha\\perp\\beta<\/div>\n<p>一个平面含另一平面的垂线，则两平面垂直。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>判定线面垂直必须两条相交直线；性质可用于面内任意直线，两者条件不同。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《直线与平面》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-13-直线与平面 顾观煦.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/lines-planes/chapter/ch02\">第 2 章：垂直关系与三垂线定理<\/a><\/span><\/div><h1>第 3 章：空间角与距离<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n求异面直线所成的角、线面角\n<\/li><li>\n作出并计算二面角的平面角\n<\/li><li>\n把点面距离转化为垂线段长度\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>空间里的角都要先“作出平面角”再计算；距离都要先“作出垂线段”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 线面角<\/h3>\n<p>斜线与它在平面内的射影所成的角，叫这条直线与平面所成的角，范围 [0°,90°]。<\/p>\n<p>求法：找到斜足与垂足，连接得到射影，在直角三角形中用三角函数求角。<\/p>\n<h3>3.2 二面角<\/h3>\n<p>两个半平面所成的图形叫二面角。在棱上任取一点，分别在两个面内作垂直于棱的射线，两条射线所成的角叫<strong>二面角的平面角<\/strong>。<\/p>\n<p>平面角的大小与点的选取无关，这是可以“任取”的依据。<\/p>\n<h3>3.3 常见求法<\/h3>\n<ul><li>\n定义法：直接在棱上取点作垂线；\n<\/li><li>\n三垂线法：利用射影构造垂直；\n<\/li><li>\n向量法（后续学习）：用法向量夹角，注意二面角可能是钝角。\n<\/ul>\n<h3>3.4 距离<\/h3>\n<p>点到平面的距离＝过该点作平面的垂线，垂线段的长度。线面距离、面面距离都可以转化为点面距离。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：二面角像一本打开的书，书脊是棱，两页纸的夹角就是二面角。<\/p>\n<p><strong>失效边界<\/strong>：平面角必须在棱上取点、两面内分别作垂线；随便连两条线得到的角不是平面角。<\/p>\n<p><strong>实例<\/strong>：正方体中，求平面 A′BD 与底面 ABCD 所成二面角。 取 BD 中点 O，连 AO、A′O。BD⊥AO，BD⊥A′O，故 ∠AOA′ 是平面角。设棱长 1，AO=√2/2，AA′=1，tan∠AOA′=1/(√2/2)=√2，角约为 54.7°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 二面角就是两个面内任意两条直线的夹角 —— 实际上 必须是在棱上同一点、分别在两面内垂直于棱的两条射线。\n<\/li><li>\n别以为 线面角可以是钝角 —— 实际上 线面角范围是 [0°,90°]，取斜线与射影的锐角。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n二面角的平面角的两条边必须：\n<\/li><li>\n直线与平面所成角的范围是：\n<p>A. 都垂直于棱 ｜ B. 互相平行 ｜ C. 都在同一平面内 ｜ D. 都过棱的中点 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：在棱上取一点，分别在两个面内作垂直于棱的射线，这两条射线所成的角才是平面角。 A. (0°,90°) ｜ B. [0°,90°] ｜ C. [0°,180°] ｜ D. (0°,180°) <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：平行时为 0°，垂直时为 90°，故范围是 [0°,90°]。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线面角＝斜线与射影的夹角，范围 [0°,90°]\n<\/li><li>\n二面角要先作出平面角\n<\/li><li>\n距离＝垂线段长度\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：空间角与距离）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：空间角与距离<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>空间角没法直接量，必须先把它“压平”到一个平面里变成平面角。所有求角题的第一步都是作图。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>二面角的平面角指在棱上取点、两面内分别垂直于棱的两条射线所成的角。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像量一本书打开的角度：必须沿书脊垂直地插两把尺子，量尺子的夹角。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 线面角<\/h3>\n<div class=\"katex-block\">\\sin\\theta=\\frac{h}{l}<\/div>\n<p>h 是斜线上一点到平面的距离，l 是斜线段长。<\/p>\n<h3>2. 平面角作法<\/h3>\n<div class=\"katex-block\">OA\\perp l,\\ OB\\perp l\\ (O\\in l)<\/div>\n<p>两面内各作一条垂直于棱的射线，夹角即平面角。<\/p>\n<h3>3. 点面距离<\/h3>\n<div class=\"katex-block\">d=\\frac{|Ax_{0}+By_{0}+Cz_{0}+D|}{\\sqrt{A^{2}+B^{2}+C^{2}}}<\/div>\n<p>用法向量或平面方程求点面距离。<\/p>\n<h3>4. 二面角余弦<\/h3>\n<div class=\"katex-block\">\\cos\\theta=\\frac{\\vec{n}_{1}\\cdot\\vec{n}_{2}}{|\\vec{n}_{1}||\\vec{n}_{2}|}<\/div>\n<p>向量法求法向量夹角，注意符号与实际锐钝。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>平面角与取点无关，但取点要便于计算；取错点会把简单题算复杂。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《直线与平面》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-13-直线与平面 顾观煦.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/lines-planes/chapter/ch01\">第 1 章：空间的位置关系与平行<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/lines-planes/chapter/ch02\">第 2 章：垂直关系与三垂线定理<\/a><\/span><\/div><h1>判定与性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>判定是“由条件推关系”，性质是“由关系推结论”，两者方向相反、成对出现。<\/p>\n<h2>为什么重要<\/h2>\n<p>立体几何的证明几乎全靠这两类定理，混用就会循环论证。<\/p>\n<h2>详解<\/h2>\n<p>平行体系：线线平行推线面平行（判定），线面平行推线线平行（性质）；垂直体系同理。写证明时先声明用哪条定理，再摆条件，最后得结论。<\/p>\n<h2>常见误解<\/h2>\n<p>把要证的结论当作条件用，或用“显然”代替定理。<\/p>\n<h2>相关概念<\/h2>\n<p>平行（ch01）、垂直（ch02）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-13-直线与平面 顾观煦.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/lines-planes/chapter/ch02\">第 2 章：垂直关系与三垂线定理<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/lines-planes/chapter/ch03\">第 3 章：空间角与距离<\/a><\/span><\/div><h1>射影与三垂线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把空间中的一条斜线“压”到平面上，得到射影；射影的垂直关系可以搬到斜线上。<\/p>\n<h2>为什么重要<\/h2>\n<p>三垂线定理是求二面角、证垂直最常用的转化工具。<\/p>\n<h2>详解<\/h2>\n<p>斜线 PA 在平面 α 内的射影是 OA（O 为垂足）。若平面内一条直线 l 垂直于 OA，则 l 垂直于 PA。反过来也成立。求线面角时，射影与斜线的夹角就是要找的角。<\/p>\n<h2>常见误解<\/h2>\n<p>斜线平行于平面时没有射影，此时不能套三垂线定理。<\/p>\n<h2>相关概念<\/h2>\n<p>三垂线定理（ch02）、线面角（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：空间的位置关系与平行<\/strong><br>阅读：<a href=\"#/book/lines-planes/chapter/ch01\">第 1 章：空间的位置关系与平行<\/a><br>检查点：能举出异面直线的例子<\/li><li class='path-step' id='path-02'><strong>步骤 02：垂直关系与三垂线定理<\/strong><br>阅读：<a href=\"#/book/lines-planes/chapter/ch02\">第 2 章：垂直关系与三垂线定理<\/a><br>检查点：能用判定定理证线面垂直<\/li><li class='path-step' id='path-03'><strong>步骤 03：空间角与距离<\/strong><br>阅读：<a href=\"#/book/lines-planes/chapter/ch03\">第 3 章：空间角与距离<\/a><br>检查点：能作出二面角的平面角<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：空间的位置关系与平行<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 空间中两条直线的位置关系共有几种：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 2 种<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 3 种<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 4 种<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 1 种<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 线面平行的判定定理中，平面外直线需要与平面内的哪条直线平行：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 任意一条<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 一条<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 两条相交直线<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 两条平行直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：垂直关系与三垂线定理<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 判定一条直线垂直于一个平面，需要它垂直于平面内：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 一条直线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 两条平行直线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 两条相交直线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 三条直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 三垂线定理的作用是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 把面面垂直化为线面垂直<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 把空间垂直化为平面内的垂直<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 求体积<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 判断平行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：空间角与距离<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 二面角的平面角的两条边必须：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 都垂直于棱<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 互相平行<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 都在同一平面内<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 都过棱的中点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 直线与平面所成角的范围是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> (0°,90°)<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> [0°,90°]<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> [0°,180°]<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> (0°,180°)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q07' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q7.<\/b> 空间中两条直线都平行于第三条直线，则这两条直线：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 一定相交<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 一定平行<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 一定异面<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 可能异面<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q8.<\/b> 直线 l 垂直于平面 α 内两条相交直线，则：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> l 平行于 α<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> l 垂直于 α<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> l 在 α 内<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：空间的位置关系与平行<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 空间中两条直线的位置关系共有几种：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 2 种<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 3 种<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 4 种<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 1 种<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 线面平行的判定定理中，平面外直线需要与平面内的哪条直线平行：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 任意一条<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 一条<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 两条相交直线<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 两条平行直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：垂直关系与三垂线定理<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 判定一条直线垂直于一个平面，需要它垂直于平面内：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 一条直线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 两条平行直线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 两条相交直线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 三条直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 三垂线定理的作用是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 把面面垂直化为线面垂直<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 把空间垂直化为平面内的垂直<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 求体积<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 判断平行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：空间角与距离<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 二面角的平面角的两条边必须：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 都垂直于棱<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 互相平行<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 都在同一平面内<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 都过棱的中点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 直线与平面所成角的范围是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> (0°,90°)<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> [0°,90°]<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> [0°,180°]<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> (0°,180°)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='异面直线'>异面直线 — 不同在任何一个平面内的两条直线。 <span class=glossary-ref>（第 1 章：空间的位置关系与平行）<\/span><\/li><li data-term='线面平行'>线面平行 — 直线与平面没有公共点。 <span class=glossary-ref>（第 1 章：空间的位置关系与平行）<\/span><\/li><li data-term='线面垂直'>线面垂直 — 直线垂直于平面内所有直线。 <span class=glossary-ref>（第 2 章：垂直关系与三垂线定理）<\/span><\/li><li data-term='射影'>射影 — 斜线在平面内的正投影。 <span class=glossary-ref>（第 2 章：垂直关系与三垂线定理）<\/span><\/li><li data-term='三垂线定理'>三垂线定理 — 平面内直线垂直于射影则垂直于斜线。 <span class=glossary-ref>（第 2 章：垂直关系与三垂线定理）<\/span><\/li><li data-term='二面角'>二面角 — 两个半平面所成的图形。 <span class=glossary-ref>（第 3 章：空间角与距离）<\/span><\/li><li data-term='平面角'>平面角 — 二面角中在棱上取点、两面内垂直棱的两射线夹角。 <span class=glossary-ref>（第 3 章：空间角与距离）<\/span><\/li><li data-term='线面角'>线面角 — 斜线与射影所成的角。 <span class=glossary-ref>（第 3 章：空间角与距离）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：证平行的三步<\/h2>\n<p>① 找面内一条与已知直线平行的线；② 用判定定理得线面平行；③ 需要时再用性质定理转回线线平行。<\/p>\n<h2>框架：求空间角三步<\/h2>\n<p>① 作出平面角（找垂足、射影）；② 在直角三角形中算边长；③ 用三角函数求角并说明范围。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>两直线<\/td><td>相交、平行、异面<\/td><\/tr><tr><td>线面平行判定<\/td><td>面外线∥面内线<\/td><\/tr><tr><td>线面垂直判定<\/td><td>垂直于面内两条相交直线<\/td><\/tr><tr><td>三垂线<\/td><td>射影⊥l ⇒ 斜线⊥l<\/td><\/tr><tr><td>线面角<\/td><td>sinθ=h/l<\/td><\/tr><tr><td>二面角<\/td><td>棱上取点，两面内作垂线<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：空间的位置关系与平行", "href": "#/chapter/ch01"}, {"label": "第 2 章：垂直关系与三垂线定理", "href": "#/chapter/ch02"}, {"label": "第 3 章：空间角与距离", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "判定与性质", "href": "#/concept/c01"}, {"label": "射影与三垂线", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：空间的位置关系与平行", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：垂直关系与三垂线定理", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：空间角与距离", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"area-volume":{"manifest": {"slug": "area-volume", "title": "面积与体积", "subtitle": "量的几何：从割补到辛普森公式", "book": {"title": "面积与体积", "author": "吕林根", "source": ["数学基础知识丛书-14-面积与体积 吕林根.pdf"]}, "audience": "零基础", "goal": "掌握常见平面图形面积公式的来源，会算圆与扇形，理解柱、锥、台、球的体积公式并用辛普森公式统一处理。", "learningPath": [{"step": "01", "title": "平面图形的面积", "chapterIds": ["ch01"], "checkpoint": "能用割补法求不规则图形面积"}, {"step": "02", "title": "圆、扇形与曲线形面积", "chapterIds": ["ch02"], "checkpoint": "能用极限思想说明圆面积公式"}, {"step": "03", "title": "立体图形的体积", "chapterIds": ["ch03"], "checkpoint": "能用辛普森公式统一求柱锥台球"}], "chapters": [{"id": "ch01", "title": "第 1 章：平面图形的面积", "file": "chapters/ch01-plane-area.md", "difficulty": 2, "source": {"file": "数学基础知识丛书-14-面积与体积 吕林根.pdf", "kind": "原书 PDF"}, "prereqNote": "长度、相似", "depthFragment": "chapters/ch01-depth.md", "prerequisites": []}, {"id": "ch02", "title": "第 2 章：圆、扇形与曲线形面积", "file": "chapters/ch02-circle-area q03", "chapterId": "ch02", "type": "single", "question": "半径为 3 的圆，面积是：", "options": ["6π", "9π", "3π", "12π"], "answer": 1, "explain": "S=πr²=9π。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "半径为 4、圆心角为 90° 的扇形面积是：", "options": ["4π", "8π", "2π", "16π"], "answer": 0, "explain": "90°=π/2，S=(1/2)×16×π/2=4π。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "圆锥底面半径 3、高 4，体积是：", "options": ["12π", "36π", "16π", "4π"], "answer": 0, "explain": "V=(1/3)π×9×4=12π。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "半径为 3 的球的体积是：", "options": ["12π", "36π", "27π", "9π"], "answer": 1, "explain": "V=(4/3)π×27=36π。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "圆柱底面半径 2、高 6，体积是：", "options": ["24π", "12π", "8π", "36π"], "answer": 0, "explain": "V=π×4×6=24π。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "用辛普森公式求半径为 r 的球体积，代入 S顶=S底=0、S中=πr²，得到：", "options": ["(2/3)πr³", "(4/3)πr³", "πr³", "(1/3)πr³"], "answer": 1, "explain": "V=(2r/6)(0+4πr²+0)=(4/3)πr³，与球体积公式一致。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：平面图形的面积」的一句话核心是什么？", "back": "所有直线图形的面积公式都从“矩形面积＝长×宽”出发，靠割补推出来。", "tags": ["area-volume", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：圆、扇形与曲线形面积」的一句话核心是什么？", "back": "圆面积是把圆切成无数个小扇形拼成矩形得到的：S=πr²，周长 C=2πr。", "tags": ["area-volume", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：立体图形的体积」的一句话核心是什么？", "back": "柱是“底面积乘高”，锥是柱的三分之一，台是两锥相减，球是 4πr³/3；辛普森公式把它们合成一条。", "tags": ["area-volume", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「面积」？", "back": "图形包含的单位正方形个数。", "tags": ["area-volume", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「割补法」？", "back": "剪切重拼求面积的方法。", "tags": ["area-volume", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「等积变形」？", "back": "形状改变而面积不变的变形。", "tags": ["area-volume", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「圆周率」？", "back": "圆周长与直径之比 π。", "tags": ["area-volume", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「扇形」？", "back": "两条半径与一段弧围成的图形。", "tags": ["area-volume", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「弓形」？", "back": "弦与弧围成的图形。", "tags": ["area-volume", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「祖暅原理」？", "back": "等高处截面积相等的两个立体体积相等。", "tags": ["area-volume", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「辛普森公式」？", "back": "V=(h/6)(S顶+4S中+S底)。", "tags": ["area-volume", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「台体」？", "back": "锥体被平行于底面的平面截去上部后的部分。", "tags": ["area-volume", "术语"]}], "companion": "area-volume学习伴侣.html", "deriv": "area-volume从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-14-面积与体积 吕林根.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">长度、相似<\/span><\/div><h1>第 1 章：平面图形的面积<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：长度、相似\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n由矩形面积推出三角形、平行四边形、梯形公式\n<\/li><li>\n用割补法求组合图形面积\n<\/li><li>\n理解等积变形的原理\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>所有直线图形的面积公式都从“矩形面积＝长×宽”出发，靠割补推出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 面积的起点<\/h3>\n<p>规定单位正方形的面积为 1，任何图形的面积就是它包含多少个单位面积。这是度量的定义，不是公式。<\/p>\n<h3>1.2 由矩形推出其他公式<\/h3>\n<ul><li>\n平行四边形：沿高剪下三角形平移到另一侧，拼成矩形，故 S=底×高；\n<\/li><li>\n三角形：两个全等三角形拼成平行四边形，故 S=底×高/2；\n<\/li><li>\n梯形：两个全等梯形拼成平行四边形，底为 (a+b)，故 S=(a+b)h/2。\n<\/ul>\n<p>每个公式都能用“拼”或“剪”验证，不必死记。<\/p>\n<h3>1.3 割补与等积变形<\/h3>\n<p>把不规则图形切成若干块，重新拼成规则图形，面积不变。常见技巧：补形成矩形再减去多余部分；把弓形补成扇形减三角形。<\/p>\n<h3>1.4 相似与面积比<\/h3>\n<p>相似比为 k 的两个图形，面积比为 k²。这条结论在处理“放大缩小”问题时最常用。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：割补像拼七巧板，块数不变、形状变了，总面积不变。<\/p>\n<p><strong>失效边界<\/strong>：割补只适用于能有限次剪拼的图形；曲线围成的图形需要极限思想。<\/p>\n<p><strong>实例<\/strong>：梯形上底 3、下底 7、高 4，面积 (3+7)×4/2=20。 三角形底 6、高 5，面积 15；若把它按 1:2 放大，面积变为 15×4=60。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 面积公式需要背很多条 —— 实际上 除矩形外都能由割补推出，理解一条就够用。\n<\/li><li>\n别以为 周长大的图形面积一定大 —— 实际上 两者没有必然联系，细长的长方形可能周长很大而面积很小。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n三角形底为 8、高为 5，面积是：\n<\/li><li>\n把一个图形按 1:3 放大，面积变为原来的：\n<p>A. 40 ｜ B. 20 ｜ C. 13 ｜ D. 10 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：S=8×5/2=20。 A. 3 倍 ｜ B. 6 倍 ｜ C. 9 倍 ｜ D. 1/3 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：面积比是相似比的平方，3²=9。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n面积从单位正方形定义出发\n<\/li><li>\n三角形、平行四边形、梯形都由矩形割补而来\n<\/li><li>\n相似比 k ⇒ 面积比 k²\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：平面图形的面积）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：平面图形的面积<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>面积公式不是规定，是“剪一剪、拼一拼”的结果。理解了拼法，公式就不会记错。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>图形的面积指它包含的单位正方形个数；等积变形指形状改变而面积不变的变形。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像拼地砖：同样的砖重新排列，铺满的地面大小不变。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 矩形<\/h3>\n<div class=\"katex-block\">S=ab<\/div>\n<p>单位正方形铺满，长宽相乘即块数。<\/p>\n<h3>2. 三角形<\/h3>\n<div class=\"katex-block\">S=\\frac{1}{2}ah<\/div>\n<p>两个全等三角形拼成平行四边形，面积减半。<\/p>\n<h3>3. 梯形<\/h3>\n<div class=\"katex-block\">S=\\frac{(a+b)h}{2}<\/div>\n<p>两个全等梯形拼成底为 a+b 的平行四边形。<\/p>\n<h3>4. 相似缩放<\/h3>\n<div class=\"katex-block\">\\frac{S_{1}}{S_{2}}=k^{2}<\/div>\n<p>长度按 k 缩放，面积按 k² 缩放。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>割补要求剪拼后不重叠、不遗漏；曲线边界需要取极限才能严格成立。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《面积与体积》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-14-面积与体积 吕林根.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/area-volume/chapter/ch01\">第 1 章：平面图形的面积<\/a><\/span><\/div><h1>第 2 章：圆、扇形与曲线形面积<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01、圆周率\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说明圆面积公式的极限来源\n<\/li><li>\n计算扇形、弓形面积\n<\/li><li>\n区分弧长与面积两类公式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>圆面积是把圆切成无数个小扇形拼成矩形得到的：S=πr²，周长 C=2πr。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 圆周率与周长<\/h3>\n<p>圆的周长与直径之比是常数 π≈3.1416，故 C=2πr。<\/p>\n<h3>2.2 圆面积的极限推导<\/h3>\n<p>把圆分成 n 个全等的小扇形，交错拼成一个近似平行四边形：底近似为半个圆周（πr），高近似为半径 r。n 越大越接近矩形，故 S=πr·r=πr²。<\/p>\n<p>这就是“化圆为方”的极限思想，也是后面微积分里“以直代曲”的雏形。<\/p>\n<h3>2.3 扇形<\/h3>\n<p>圆心角为 θ（弧度）的扇形：弧长 l=rθ，面积 S=(1/2)lr=(1/2)r²θ。<\/p>\n<p>用角度制时 θ 要换成弧度；360°＝2π 弧度，故整圆面积 (1/2)r²·2π=πr²，与上式一致。<\/p>\n<h3>2.4 弓形<\/h3>\n<p>弓形＝扇形 − 三角形。先算扇形面积，再减去由两条半径与弦围成的三角形面积。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把圆切成很多细长的扇形，像切西瓜，交错摆放就接近一个长方形。<\/p>\n<p><strong>失效边界<\/strong>：有限次切割只能得到近似值；“等于”要靠 n 趋于无穷的极限。<\/p>\n<p><strong>实例<\/strong>：半径 6、圆心角 60°（π/3 弧度）的扇形：弧长 6×π/3=2π，面积 (1/2)×36×π/3=6π。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 圆面积公式可以直接背，不必理解 —— 实际上 它是极限的结果；不理解来源，遇到扇形、弓形就容易套错系数。\n<\/li><li>\n别以为 扇形面积等于弧长乘半径 —— 实际上 差一个 1/2：S=(1/2)lr，漏掉系数会算成两倍。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n半径为 3 的圆，面积是：\n<\/li><li>\n半径为 4、圆心角为 90° 的扇形面积是：\n<p>A. 6π ｜ B. 9π ｜ C. 3π ｜ D. 12π <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：S=πr²=9π。 A. 4π ｜ B. 8π ｜ C. 2π ｜ D. 16π <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：90°=π/2，S=(1/2)×16×π/2=4π。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nC=2πr，S=πr²\n<\/li><li>\n扇形：l=rθ，S=(1/2)lr\n<\/li><li>\n弓形＝扇形−三角形\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：圆、扇形与曲线形面积）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：圆、扇形与曲线形面积<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>圆面积看起来是“曲线问题”，其实是用无数个小直线图形去逼近——这正是极限思想的第一次登场。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>扇形是由两条半径和一段弧围成的图形；弓形是由一条弦和一段弧围成的图形。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像把披萨切成很多细条再拼成长方形，切得越细越接近矩形。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 周长<\/h3>\n<div class=\"katex-block\">C=2\\pi r<\/div>\n<p>周长与直径之比恒为 π。<\/p>\n<h3>2. 圆面积<\/h3>\n<div class=\"katex-block\">S=\\pi r^{2}<\/div>\n<p>拼成的矩形底为 πr、高为 r。<\/p>\n<h3>3. 扇形<\/h3>\n<div class=\"katex-block\">l=r\\theta,\\quad S=\\frac{1}{2}lr=\\frac{1}{2}r^{2}\\theta<\/div>\n<p>θ 为弧度；整圆 θ=2π 时回到 πr²。<\/p>\n<h3>4. 弓形<\/h3>\n<div class=\"katex-block\">S_{\\text{弓}}=S_{\\text{扇}}-S_{\\triangle}<\/div>\n<p>扇形减去两条半径与弦围成的三角形。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>θ 必须用弧度；用角度直接代入公式会得到错误结果。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《面积与体积》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-14-面积与体积 吕林根.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/area-volume/chapter/ch02\">第 2 章：圆、扇形与曲线形面积<\/a><\/span><\/div><h1>第 3 章：立体图形的体积<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用底面积×高求柱体体积\n<\/li><li>\n说明锥体体积为何有 1/3\n<\/li><li>\n用辛普森公式统一求柱锥台球\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>柱是“底面积乘高”，锥是柱的三分之一，台是两锥相减，球是 4πr³/3；辛普森公式把它们合成一条。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 柱体<\/h3>\n<p>棱柱、圆柱的体积 V=S·h（底面积乘高）。直观来源：把柱体切成无数薄片，每片近似为底面积的薄板，叠加即得。<\/p>\n<h3>3.2 锥体<\/h3>\n<p>棱锥、圆锥的体积 V=(1/3)S·h。<\/p>\n<p>为什么是 1/3：三个全等的锥可以拼成一个等底等高的柱（对三棱锥可以严格拼出；一般锥体用极限或祖暅原理证明）。<\/p>\n<h3>3.3 台体<\/h3>\n<p>台体是“大锥减去小锥”：<\/p>\n<p>V=(h/3)(S₁+S₂+√(S₁S₂))<\/p>\n<p>其中 S₁、S₂ 是上下底面积。这个公式对棱台、圆台都成立。<\/p>\n<h3>3.4 球<\/h3>\n<p>球的体积 V=(4/3)πr³，表面积 S=4πr²。<\/p>\n<p>记忆钩子：表面积是 4πr²，体积是表面积乘以 r/3——与“锥体是柱体的 1/3”同源。<\/p>\n<h3>3.5 辛普森公式<\/h3>\n<p>若一个立体在高度 x 处的截面积为 S(x)，且 S(x) 是 x 的二次函数，则<\/p>\n<p>V=(h/6)[S(顶)+4S(中)+S(底)]<\/p>\n<p>柱、锥、台、球都满足这个条件，所以一条公式通吃。这是全书最漂亮的结果。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：柱像一摞同样大小的纸，锥像同样的纸越往上越小，到顶缩成一点。<\/p>\n<p><strong>失效边界<\/strong>：辛普森公式要求截面积是高度的二次函数；截面形状变化不满足这个条件时不能直接用。<\/p>\n<p><strong>实例<\/strong>：圆柱 r=2、h=5：V=π×4×5=20π。 同底等高的圆锥：V=20π/3。 球 r=3：V=(4/3)π×27=36π。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 锥的体积是柱的一半 —— 实际上 是三分之一；把三个同样的锥拼起来才等于一个柱。\n<\/li><li>\n别以为 球体积公式与表面积无关 —— 实际上 V=(r/3)×S，两者通过半径联系，可以互相校验。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆锥底面半径 3、高 4，体积是：\n<\/li><li>\n半径为 3 的球的体积是：\n<p>A. 12π ｜ B. 36π ｜ C. 16π ｜ D. 4π <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：V=(1/3)π×9×4=12π。 A. 12π ｜ B. 36π ｜ C. 27π ｜ D. 9π <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：V=(4/3)π×27=36π。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n柱 S·h，锥 S·h/3，台 (h/3)(S₁+S₂+√(S₁S₂))\n<\/li><li>\n球 V=4πr³/3，S=4πr²\n<\/li><li>\n辛普森公式统一柱锥台球\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：立体图形的体积）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：立体图形的体积<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>体积公式看似很多，其实只有一条主线：把立体切成薄片，累加截面积。柱、锥、台、球都是这条主线的特例。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>体积指立体包含的单位正方体个数；截面积指用平行于底面的平面截立体所得图形的面积。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像叠一摞纸：每张纸面积不同，总厚度就是高度，总体积就是“面积×厚度”的累加。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 柱<\/h3>\n<div class=\"katex-block\">V=S\\cdot h<\/div>\n<p>每层截面积相同，累加即底面积乘高。<\/p>\n<h3>2. 锥<\/h3>\n<div class=\"katex-block\">V=\\frac{1}{3}S\\cdot h<\/div>\n<p>三个全等的锥拼成一个等底等高的柱。<\/p>\n<h3>3. 台<\/h3>\n<div class=\"katex-block\">V=\\frac{h}{3}\\left(S_{1}+S_{2}+\\sqrt{S_{1}S_{2}}\\right)<\/div>\n<p>大锥减小锥，化简得到这个对称形式。<\/p>\n<h3>4. 辛普森<\/h3>\n<div class=\"katex-block\">V=\\frac{h}{6}\\left[S_{\\text{顶}}+4S_{\\text{中}}+S_{\\text{底}}\\right]<\/div>\n<p>截面积为二次函数时的精确公式，柱锥台球都适用。<\/p>\n<h3>5. 球<\/h3>\n<div class=\"katex-block\">V=\\frac{4}{3}\\pi r^{3,\\quad} S=4\\pi r^{2}<\/div>\n<p>体积等于表面积乘以 r/3，可与锥体公式互相印证。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>辛普森公式只在截面积为二次函数时精确；否则只是近似。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《面积与体积》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-14-面积与体积 吕林根.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/area-volume/chapter/ch01\">第 1 章：平面图形的面积<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/area-volume/chapter/ch02\">第 2 章：圆、扇形与曲线形面积<\/a><\/span><\/div><h1>割补与极限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>能剪拼的用割补，剪不动的用极限。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两条方法覆盖了从三角形到圆的所有面积推导。<\/p>\n<h2>详解<\/h2>\n<p>割补法：有限次剪拼，面积不变，适用于多边形。极限法：把曲边图形切成无穷多小块，用直边近似，取极限得到精确值，适用于圆、扇形等。两者本质都是“化未知为已知”。<\/p>\n<h2>常见误解<\/h2>\n<p>把极限结果当成有限次切割的结果，或认为曲线图形也能精确剪拼。<\/p>\n<h2>相关概念<\/h2>\n<p>平面面积（ch01）、圆面积（ch02）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-14-面积与体积 吕林根.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/area-volume/chapter/ch03\">第 3 章：立体图形的体积<\/a><\/span><\/div><h1>统一公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>柱、锥、台、球看似不同，截面积的变化规律却能让同一条公式成立。<\/p>\n<h2>为什么重要<\/h2>\n<p>理解统一性比记四个公式更省力，也是数学里“找结构”的典型例子。<\/p>\n<h2>详解<\/h2>\n<p>辛普森公式 V=(h/6)(S顶+4S中+S底) 对截面积为二次函数的立体精确成立。柱的截面积恒定，锥的截面积按平方递减，球也满足，因此都能代入。<\/p>\n<h2>常见误解<\/h2>\n<p>对任意立体都套辛普森公式；截面形状变化不规则时会得到近似值而非精确值。<\/p>\n<h2>相关概念<\/h2>\n<p>锥体（ch03）、球（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：平面图形的面积<\/strong><br>阅读：<a href=\"#/book/area-volume/chapter/ch01\">第 1 章：平面图形的面积<\/a><br>检查点：能用割补法求不规则图形面积<\/li><li class='path-step' id='path-02'><strong>步骤 02：圆、扇形与曲线形面积<\/strong><br>阅读：<a href=\"#/book/area-volume/chapter/ch02\">第 2 章：圆、扇形与曲线形面积<\/a><br>检查点：能用极限思想说明圆面积公式<\/li><li class='path-step' id='path-03'><strong>步骤 03：立体图形的体积<\/strong><br>阅读：<a href=\"#/book/area-volume/chapter/ch03\">第 3 章：立体图形的体积<\/a><br>检查点：能用辛普森公式统一求柱锥台球<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：平面图形的面积<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 三角形底为 8、高为 5，面积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 40<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 20<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 13<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 10<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 把一个图形按 1:3 放大，面积变为原来的：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 3 倍<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 6 倍<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 9 倍<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 1/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：圆、扇形与曲线形面积<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 半径为 3 的圆，面积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 6π<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 9π<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 3π<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 12π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 半径为 4、圆心角为 90° 的扇形面积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 4π<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 8π<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 2π<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 16π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：立体图形的体积<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 圆锥底面半径 3、高 4，体积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 12π<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 36π<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 16π<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 4π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 半径为 3 的球的体积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 12π<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 36π<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 27π<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 9π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q07' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q7.<\/b> 圆柱底面半径 2、高 6，体积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 24π<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 12π<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 8π<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 36π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q8.<\/b> 用辛普森公式求半径为 r 的球体积，代入 S顶=S底=0、S中=πr²，得到：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> (2/3)πr³<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> (4/3)πr³<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> πr³<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> (1/3)πr³<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：平面图形的面积<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 三角形底为 8、高为 5，面积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 40<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 20<\/label><label class='quiz-opt'><input type='radio' 'ch02-q04' value='2'> 2π<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 16π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：立体图形的体积<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 圆锥底面半径 3、高 4，体积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 12π<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 36π<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 16π<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 4π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 半径为 3 的球的体积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 12π<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 36π<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 27π<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 9π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='面积'>面积 — 图形包含的单位正方形个数。 <span class=glossary-ref>（第 1 章：平面图形的面积）<\/span><\/li><li data-term='割补法'>割补法 — 剪切重拼求面积的方法。 <span class=glossary-ref>（第 1 章：平面图形的面积）<\/span><\/li><li data-term='等积变形'>等积变形 — 形状改变而面积不变的变形。 <span class=glossary-ref>（第 1 章：平面图形的面积）<\/span><\/li><li data-term='圆周率'>圆周率 — 圆周长与直径之比 π。 <span class=glossary-ref>（第 2 章：圆、扇形与曲线形面积）<\/span><\/li><li data-term='扇形'>扇形 — 两条半径与一段弧围成的图形。 <span class=glossary-ref>（第 2 章：圆、扇形与曲线形面积）<\/span><\/li><li data-term='弓形'>弓形 — 弦与弧围成的图形。 <span class=glossary-ref>（第 2 章：圆、扇形与曲线形面积）<\/span><\/li><li data-term='祖暅原理'>祖暅原理 — 等高处截面积相等的两个立体体积相等。 <span class=glossary-ref>（第 3 章：立体图形的体积）<\/span><\/li><li data-term='辛普森公式'>辛普森公式 — V=(h/6)(S顶+4S中+S底)。 <span class=glossary-ref>（第 3 章：立体图形的体积）<\/span><\/li><li data-term='台体'>台体 — 锥体被平行于底面的平面截去上部后的部分。 <span class=glossary-ref>（第 3 章：立体图形的体积）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：求面积三选一<\/h2>\n<p>规则图形套公式；不规则图形割补；曲边图形用极限或积分。<\/p>\n<h2>框架：求体积四步<\/h2>\n<p>① 认形体（柱/锥/台/球）；② 找底面积与高；③ 选公式；④ 检查单位与量纲（体积是三次方）。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>三角形<\/td><td>S=ah/2<\/td><\/tr><tr><td>梯形<\/td><td>S=(a+b)h/2<\/td><\/tr><tr><td>圆<\/td><td>C=2πr，S=πr²<\/td><\/tr><tr><td>扇形<\/td><td>S=(1/2)lr=(1/2)r²θ<\/td><\/tr><tr><td>柱/锥<\/td><td>V=S·h；V=S·h/3<\/td><\/tr><tr><td>台<\/td><td>V=(h/3)(S₁+S₂+√(S₁S₂))<\/td><\/tr><tr><td>球<\/td><td>V=4πr³/3，S=4πr²<\/td><\/tr><tr><td>辛普森<\/td><td>V=(h/6)(S顶+4S中+S底)<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：平面图形的面积", "href": "#/chapter/ch01"}, {"label": "第 2 章：圆、扇形与曲线形面积", "href": "#/chapter/ch02"}, {"label": "第 3 章：立体图形的体积", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "割补与极限", "href": "#/concept/c01"}, {"label": "统一公式", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：平面图形的面积", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：圆、扇形与曲线形面积", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：立体图形的体积", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"locus":{"manifest": {"slug": "locus", "title": "轨迹", "subtitle": "动点的足迹：从条件到方程", "book": {"title": "轨迹", "author": "杨学渊", "source": ["数学基础知识丛书-15-轨迹 杨学渊.pdf"]}, "audience": "零基础", "goal": "理解命题与充分必要条件，掌握求轨迹的五步法，能识别常见轨迹（直线、圆、圆锥曲线型），并会检验轨迹的纯粹性与完备性。", "learningPath": [{"step": "01", "title": "命题与充分必要条件", "chapterIds": ["ch01"], "checkpoint": "能判断“甲是乙的什么条件”"}, {"step": "02", "title": "求轨迹的五步法", "chapterIds": ["ch02"], "checkpoint": "能独立完成一道轨迹题的检验"}, {"step": "03", "title": "常见轨迹与空间轨迹", "chapterIds": ["ch03"], "checkpoint": "能由条件说出轨迹类型"}], "chapters": [{"id": "ch01", "title": "第 1 章：命题与充分必要条件", "file": "chapters/ch01-logic-conditions.md", "difficulty": 2, "source": {"file": "数学基础知识丛书-15-轨迹 杨学渊.pdf", "kind": "原书 PDF"}, "prereqNote": "逻辑常识", "depthFragment": "chapters/ch01-depth.md", "prerequisites": []}, {"id": "ch02", "title": "第 2 章：求轨迹的五步法", "file": "chapters/ch02-five-steps.md", "difficulty": 3, "source": {"file": "数学基础知识丛书-15
