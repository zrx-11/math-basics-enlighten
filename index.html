。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='弦'>弦 — 圆上两点间的线段。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='弧'>弧 — 圆上两点之间的部分。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='圆心角'>圆心角 — 顶点在圆心的角。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='圆周角'>圆周角 — 顶点在圆上、两边与圆相交的角。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='垂径定理'>垂径定理 — 垂直于弦的直径平分弦及所对的弧。 <span class=glossary-ref>（第 1 章：圆的基本性质）<\/span><\/li><li data-term='切线'>切线 — 与圆只有一个公共点的直线。 <span class=glossary-ref>（第 2 章：直线与圆的位置关系）<\/span><\/li><li data-term='切线长'>切线长 — 圆外一点到切点的线段长度。 <span class=glossary-ref>（第 2 章：直线与圆的位置关系）<\/span><\/li><li data-term='相交弦定理'>相交弦定理 — 圆内两弦相交，交点分成的两段乘积相等。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><li data-term='切割线定理'>切割线定理 — PT²=PA·PB。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><li data-term='弦切角'>弦切角 — 切线与弦的夹角，等于所夹弧对的圆周角。 <span class=glossary-ref>（第 3 章：比例线段与圆内接四边形）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：圆中求角三步<\/h2>\n<p>① 找同弧；② 判断是圆心角还是圆周角；③ 用倍数或相等关系换算。<\/p>\n<h2>框架：圆中求线段三步<\/h2>\n<p>① 判断点在圆内还是圆外；② 选相交弦或切割线公式；③ 列乘积相等求解。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>圆周角<\/td><td>同弧圆周角＝圆心角的一半<\/td><\/tr><tr><td>直径<\/td><td>直径所对圆周角 90°<\/td><\/tr><tr><td>垂径<\/td><td>r²=d²+(半弦)²<\/td><\/tr><tr><td>位置关系<\/td><td>d&lt;r 相交，d=r 相切，d&gt;r 相离<\/td><\/tr><tr><td>相交弦<\/td><td>PA·PB=PC·PD<\/td><\/tr><tr><td>切割线<\/td><td>PT²=PA·PB<\/td><\/tr><tr><td>圆内接四边形<\/td><td>对角互补<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：圆的基本性质", "href": "#/chapter/ch01"}, {"label": "第 2 章：直线与圆的位置关系", "href": "#/chapter/ch02"}, {"label": "第 3 章：比例线段与圆内接四边形", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "同弧所对的角", "href": "#/concept/c01"}, {"label": "圆幂", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：圆的基本性质", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：直线与圆的位置关系", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：比例线段与圆内接四边形", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"lines-planes":{"manifest": {"slug": "lines-planes", "title": "直线与平面", "subtitle": "从平面几何走进空间：平行、垂直与二面角", "book": {"title": "直线与平面", "author": "顾观煦", "source": ["数学基础知识丛书-13-直线与平面 顾观煦.pdf"]}, "audience": "零基础", "goal": "掌握空间中直线与平面、平面与平面的位置关系，会用判定与性质定理证明平行与垂直，会求线面角与二面角。", "learningPath": [{"step": "01", "title": "空间的位置关系与平行", "chapterIds": ["ch01"], "checkpoint": "能举出异面直线的例子"}, {"step": "02", "title": "垂直关系与三垂线定理", "chapterIds": ["ch02"], "checkpoint": "能用判定定理证线面垂直"}, {"step": "03", "title": "空间角与距离", "chapterIds": ["ch03"], "checkpoint": "能作出二面角的平面角"}], "chapters": [{"id": "ch01", "title": "第 1 章：空间的位置关系与平行", "file": "chapters/ch01-parallel.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：垂直关系与三垂线定理", "file": "chapters/ch02-perpendicular.md", "difficulty": 3}, {"id": "ch03", "title": "第 3 章：空间角与距离", "file": "chapters/ch03-angles-distance.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "判定与性质", "file": "concepts/c01-criterion-property-3d.md", "chapterIds": ["ch01", "ch02"]}, {"id": "c02", "title": "射影与三垂线", "file": "concepts/c02-projection.md", "chapterIds": ["ch02", "ch03"]}], "glossary": [{"term": "异面直线", "def": "不同在任何一个平面内的两条直线。", "chapterId": "ch01"}, {"term": "线面平行", "def": "直线与平面没有公共点。", "chapterId": "ch01"}, {"term": "线面垂直", "def": "直线垂直于平面内所有直线。", "chapterId": "ch02"}, {"term": "射影", "def": "斜线在平面内的正投影。", "chapterId": "ch02"}, {"term": "三垂线定理", "def": "平面内直线垂直于射影则垂直于斜线。", "chapterId": "ch02"}, {"term": "二面角", "def": "两个半平面所成的图形。", "chapterId": "ch03"}, {"term": "平面角", "def": "二面角中在棱上取点、两面内垂直棱的两射线夹角。", "chapterId": "ch03"}, {"term": "线面角", "def": "斜线与射影所成的角。", "chapterId": "ch03"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "空间中两条直线的位置关系共有几种：", "options": ["2 种", "3 种", "4 种", "1 种"], "answer": 1, "explain": "相交、平行、异面三种。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "线面平行的判定定理中，平面外直线需要与平面内的哪条直线平行：", "options": ["任意一条", "一条", "两条相交直线", "两条平行直线"], "answer": 1, "explain": "只需与平面内的一条直线平行即可判定线面平行。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "判定一条直线垂直于一个平面，需要它垂直于平面内：", "options": ["一条直线", "两条平行直线", "两条相交直线", "三条直线"], "answer": 2, "explain": "两条相交直线确定平面的方向，缺“相交”条件不成立。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "三垂线定理的作用是：", "options": ["把面面垂直化为线面垂直", "把空间垂直化为平面内的垂直", "求体积", "判断平行"], "answer": 1, "explain": "它通过射影把空间中的垂直关系转化为平面内的垂直关系。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "二面角的平面角的两条边必须：", "options": ["都垂直于棱", "互相平行", "都在同一平面内", "都过棱的中点"], "answer": 0, "explain": "在棱上取一点，分别在两个面内作垂直于棱的射线，这两条射线所成的角才是平面角。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "直线与平面所成角的范围是：", "options": ["(0°,90°)", "[0°,90°]", "[0°,180°]", "(0°,180°)"], "answer": 1, "explain": "平行时为 0°，垂直时为 90°，故范围是 [0°,90°]。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "空间中两条直线都平行于第三条直线，则这两条直线：", "options": ["一定相交", "一定平行", "一定异面", "可能异面"], "answer": 1, "explain": "平行的传递性在空间中仍成立，故两直线平行。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "直线 l 垂直于平面 α 内两条相交直线，则：", "options": ["l 平行于 α", "l 垂直于 α", "l 在 α 内", "无法判断"], "answer": 1, "explain": "这正是线面垂直的判定定理。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：空间的位置关系与平行」的一句话核心是什么？", "back": "空间里“不相交”不等于“平行”；判定与性质定理必须成对使用。", "tags": ["lines-planes", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：垂直关系与三垂线定理」的一句话核心是什么？", "back": "线面垂直是空间垂直的总枢纽：一条直线垂直于平面内两条相交直线，就垂直于整个平面。", "tags": ["lines-planes", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：空间角与距离」的一句话核心是什么？", "back": "空间里的角都要先“作出平面角”再计算；距离都要先“作出垂线段”。", "tags": ["lines-planes", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「异面直线」？", "back": "不同在任何一个平面内的两条直线。", "tags": ["lines-planes", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「线面平行」？", "back": "直线与平面没有公共点。", "tags": ["lines-planes", "术语"]}, {"id": "f06", "chapterId": "ch02", "front": "什么是「线面垂直」？", "back": "直线垂直于平面内所有直线。", "tags": ["lines-planes", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「射影」？", "back": "斜线在平面内的正投影。", "tags": ["lines-planes", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「三垂线定理」？", "back": "平面内直线垂直于射影则垂直于斜线。", "tags": ["lines-planes", "术语"]}, {"id": "f09", "chapterId": "ch03", "front": "什么是「二面角」？", "back": "两个半平面所成的图形。", "tags": ["lines-planes", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「平面角」？", "back": "二面角中在棱上取点、两面内垂直棱的两射线夹角。", "tags": ["lines-planes", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「线面角」？", "back": "斜线与射影所成的角。", "tags": ["lines-planes", "术语"]}], "companion": "lines-planes学习伴侣.html", "deriv": "lines-planes从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：空间的位置关系与平行<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：平面几何\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n区分空间两直线的三种关系\n<\/li><li>\n用线面、面面平行定理完成证明\n<\/li><li>\n识别异面直线所成的角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>空间里“不相交”不等于“平行”；判定与性质定理必须成对使用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 空间两直线的三种关系<\/h3>\n<ul><li>\n相交：有且只有一个公共点；\n<\/li><li>\n平行：在同一平面内且无公共点；\n<\/li><li>\n异面：不同在任何一个平面内，既不平行也不相交。\n<\/ul>\n<p>异面直线所成的角：过空间中任一点分别作它们的平行线，两条平行线的夹角（取锐角或直角）就是异面直线所成的角，范围 (0°,90°]。<\/p>\n<h3>1.2 直线与平面<\/h3>\n<p>直线在平面内、直线与平面平行、直线与平面相交（只有一个公共点）。<\/p>\n<h3>1.3 平行的三条定理<\/h3>\n<ul><li>\n<strong>线面平行判定<\/strong>：平面外一条直线与平面内一条直线平行，则该直线平行于这个平面；\n<\/li><li>\n<strong>线面平行性质<\/strong>：直线平行于平面，过该直线的平面与原平面相交，则交线与该直线平行；\n<\/li><li>\n<strong>面面平行判定<\/strong>：一个平面内的两条相交直线都平行于另一个平面，则两平面平行。\n<\/ul>\n<p>判定是由“线线平行”推“线面平行”，性质是反过来。证明时要写清用的是哪一条。<\/p>\n<h3>1.4 常见误区<\/h3>\n<p>用平面图形的直觉去推空间结论，最容易出错的是“两条直线都平行于第三条，就一定互相平行”——空间中这仍然成立；但“两条直线都垂直于同一条直线就一定平行”则不成立。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：异面直线像两根互相交错但不相碰的筷子，你怎么转动桌面都无法让它们落在同一平面里。<\/p>\n<p><strong>失效边界<\/strong>：平面几何的“平行传递性”可以推广到空间，但垂直关系不能随便传递。<\/p>\n<p><strong>实例<\/strong>：正方体 ABCD-A′B′C′D′ 中，AB 与 CC′ 是异面直线；AB 与 C′D′ 平行；AB 与 B′C′ 异面，所成角为 90°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 空间中不相交的两条直线一定平行 —— 实际上 还可能是异面；平行要求共面。\n<\/li><li>\n别以为 垂直于同一条直线的两条直线平行 —— 实际上 空间中不成立，两条直线可能异面且都垂直于第三条。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n空间中两条直线的位置关系共有几种：\n<\/li><li>\n线面平行的判定定理中，平面外直线需要与平面内的哪条直线平行：\n<p>A. 2 种 ｜ B. 3 种 ｜ C. 4 种 ｜ D. 1 种 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：相交、平行、异面三种。 A. 任意一条 ｜ B. 一条 ｜ C. 两条相交直线 ｜ D. 两条平行直线 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：只需与平面内的一条直线平行即可判定线面平行。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n空间两直线：相交、平行、异面\n<\/li><li>\n线面平行判定：面外线∥面内线\n<\/li><li>\n判定与性质成对，证明要写依据\n<\/ul>", "ch02": "<h1>第 2 章：垂直关系与三垂线定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用线面垂直的判定与性质完成证明\n<\/li><li>\n说出三垂线定理及其逆定理\n<\/li><li>\n在具体图形中找出垂足与射影\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>线面垂直是空间垂直的总枢纽：一条直线垂直于平面内两条相交直线，就垂直于整个平面。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 线面垂直的判定<\/h3>\n<p>若一条直线垂直于平面内两条<strong>相交<\/strong>直线，则它垂直于这个平面。<\/p>\n<p>注意“相交”二字：垂直于两条平行直线不足以判定线面垂直。<\/p>\n<h3>2.2 线面垂直的性质<\/h3>\n<ul><li>\n垂直于同一平面的两条直线平行；\n<\/li><li>\n直线垂直于平面，则它垂直于平面内任意一条直线。\n<\/ul>\n<p>第二条是证明线线垂直最常用的通道：想证两线垂直，先证其中一条垂直于另一条所在的平面。<\/p>\n<h3>2.3 三垂线定理<\/h3>\n<p>平面内一条直线若垂直于斜线在该平面内的射影，则它也垂直于这条斜线；反之，若垂直于斜线，则垂直于射影。<\/p>\n<p>这条定理把“空间垂直”转化为“平面内的垂直”，是立体几何里最实用的工具之一。<\/p>\n<h3>2.4 面面垂直<\/h3>\n<p>判定：一个平面过另一个平面的一条垂线，则两平面垂直。 性质：两平面垂直，则一个平面内垂直于交线的直线垂直于另一个平面。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：三垂线定理像用一根杆的影子判断杆是否与地面上的线垂直：影子垂直，杆就垂直。<\/p>\n<p><strong>失效边界<\/strong>：三垂线定理要求斜线在平面内有射影，即斜线不能平行于平面。<\/p>\n<p><strong>实例<\/strong>：正方体中 AC⊥BD（对角线互相垂直），AA′⊥底面，故 AA′⊥BD；又 AC 是 A′C 在底面的射影，所以 A′C⊥BD。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 垂直于平面内两条直线就垂直于平面 —— 实际上 必须是两条相交直线；两条平行线不能确定一个平面方向。\n<\/li><li>\n别以为 三垂线定理可以直接用于任意直线 —— 实际上 定理针对斜线及其射影；直线平行于平面时没有射影，不能套用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判定一条直线垂直于一个平面，需要它垂直于平面内：\n<\/li><li>\n三垂线定理的作用是：\n<p>A. 一条直线 ｜ B. 两条平行直线 ｜ C. 两条相交直线 ｜ D. 三条直线 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：两条相交直线确定平面的方向，缺“相交”条件不成立。 A. 把面面垂直化为线面垂直 ｜ B. 把空间垂直化为平面内的垂直 ｜ C. 求体积 ｜ D. 判断平行 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：它通过射影把空间中的垂直关系转化为平面内的垂直关系。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线面垂直：垂直于面内两条相交直线\n<\/li><li>\n想证线线垂直，先找线面垂直\n<\/li><li>\n三垂线定理：射影垂直 ⇔ 斜线垂直\n<\/ul>", "ch03": "<h1>第 3 章：空间角与距离<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n求异面直线所成的角、线面角\n<\/li><li>\n作出并计算二面角的平面角\n<\/li><li>\n把点面距离转化为垂线段长度\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>空间里的角都要先“作出平面角”再计算；距离都要先“作出垂线段”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 线面角<\/h3>\n<p>斜线与它在平面内的射影所成的角，叫这条直线与平面所成的角，范围 [0°,90°]。<\/p>\n<p>求法：找到斜足与垂足，连接得到射影，在直角三角形中用三角函数求角。<\/p>\n<h3>3.2 二面角<\/h3>\n<p>两个半平面所成的图形叫二面角。在棱上任取一点，分别在两个面内作垂直于棱的射线，两条射线所成的角叫<strong>二面角的平面角<\/strong>。<\/p>\n<p>平面角的大小与点的选取无关，这是可以“任取”的依据。<\/p>\n<h3>3.3 常见求法<\/h3>\n<ul><li>\n定义法：直接在棱上取点作垂线；\n<\/li><li>\n三垂线法：利用射影构造垂直；\n<\/li><li>\n向量法（后续学习）：用法向量夹角，注意二面角可能是钝角。\n<\/ul>\n<h3>3.4 距离<\/h3>\n<p>点到平面的距离＝过该点作平面的垂线，垂线段的长度。线面距离、面面距离都可以转化为点面距离。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：二面角像一本打开的书，书脊是棱，两页纸的夹角就是二面角。<\/p>\n<p><strong>失效边界<\/strong>：平面角必须在棱上取点、两面内分别作垂线；随便连两条线得到的角不是平面角。<\/p>\n<p><strong>实例<\/strong>：正方体中，求平面 A′BD 与底面 ABCD 所成二面角。 取 BD 中点 O，连 AO、A′O。BD⊥AO，BD⊥A′O，故 ∠AOA′ 是平面角。设棱长 1，AO=√2/2，AA′=1，tan∠AOA′=1/(√2/2)=√2，角约为 54.7°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 二面角就是两个面内任意两条直线的夹角 —— 实际上 必须是在棱上同一点、分别在两面内垂直于棱的两条射线。\n<\/li><li>\n别以为 线面角可以是钝角 —— 实际上 线面角范围是 [0°,90°]，取斜线与射影的锐角。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n二面角的平面角的两条边必须：\n<\/li><li>\n直线与平面所成角的范围是：\n<p>A. 都垂直于棱 ｜ B. 互相平行 ｜ C. 都在同一平面内 ｜ D. 都过棱的中点 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：在棱上取一点，分别在两个面内作垂直于棱的射线，这两条射线所成的角才是平面角。 A. (0°,90°) ｜ B. [0°,90°] ｜ C. [0°,180°] ｜ D. (0°,180°) <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：平行时为 0°，垂直时为 90°，故范围是 [0°,90°]。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线面角＝斜线与射影的夹角，范围 [0°,90°]\n<\/li><li>\n二面角要先作出平面角\n<\/li><li>\n距离＝垂线段长度\n<\/ul>", "c01": "<h1>判定与性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>判定是“由条件推关系”，性质是“由关系推结论”，两者方向相反、成对出现。<\/p>\n<h2>为什么重要<\/h2>\n<p>立体几何的证明几乎全靠这两类定理，混用就会循环论证。<\/p>\n<h2>详解<\/h2>\n<p>平行体系：线线平行推线面平行（判定），线面平行推线线平行（性质）；垂直体系同理。写证明时先声明用哪条定理，再摆条件，最后得结论。<\/p>\n<h2>常见误解<\/h2>\n<p>把要证的结论当作条件用，或用“显然”代替定理。<\/p>\n<h2>相关概念<\/h2>\n<p>平行（ch01）、垂直（ch02）<\/p>", "c02": "<h1>射影与三垂线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把空间中的一条斜线“压”到平面上，得到射影；射影的垂直关系可以搬到斜线上。<\/p>\n<h2>为什么重要<\/h2>\n<p>三垂线定理是求二面角、证垂直最常用的转化工具。<\/p>\n<h2>详解<\/h2>\n<p>斜线 PA 在平面 α 内的射影是 OA（O 为垂足）。若平面内一条直线 l 垂直于 OA，则 l 垂直于 PA。反过来也成立。求线面角时，射影与斜线的夹角就是要找的角。<\/p>\n<h2>常见误解<\/h2>\n<p>斜线平行于平面时没有射影，此时不能套三垂线定理。<\/p>\n<h2>相关概念<\/h2>\n<p>三垂线定理（ch02）、线面角（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：空间的位置关系与平行<\/strong><br>阅读：<a href=\"#/book/lines-planes/chapter/ch01\">第 1 章：空间的位置关系与平行<\/a><br>检查点：能举出异面直线的例子<\/li><li class='path-step' id='path-02'><strong>步骤 02：垂直关系与三垂线定理<\/strong><br>阅读：<a href=\"#/book/lines-planes/chapter/ch02\">第 2 章：垂直关系与三垂线定理<\/a><br>检查点：能用判定定理证线面垂直<\/li><li class='path-step' id='path-03'><strong>步骤 03：空间角与距离<\/strong><br>阅读：<a href=\"#/book/lines-planes/chapter/ch03\">第 3 章：空间角与距离<\/a><br>检查点：能作出二面角的平面角<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：空间的位置关系与平行<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 空间中两条直线的位置关系共有几种：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 2 种<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 3 种<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 4 种<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 1 种<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 线面平行的判定定理中，平面外直线需要与平面内的哪条直线平行：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 任意一条<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 一条<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 两条相交直线<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 两条平行直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：垂直关系与三垂线定理<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 判定一条直线垂直于一个平面，需要它垂直于平面内：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 一条直线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 两条平行直线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 两条相交直线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 三条直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三垂线定理的作用是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 把面面垂直化为线面垂直<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 把空间垂直化为平面内的垂直<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 求体积<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 判断平行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：空间角与距离<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 二面角的平面角的两条边必须：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 都垂直于棱<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 互相平行<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 都在同一平面内<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 都过棱的中点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 直线与平面所成角的范围是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> (0°,90°)<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> [0°,90°]<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> [0°,180°]<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> (0°,180°)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 空间中两条直线都平行于第三条直线，则这两条直线：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 一定相交<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 一定平行<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 一定异面<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 可能异面<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 直线 l 垂直于平面 α 内两条相交直线，则：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> l 平行于 α<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> l 垂直于 α<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> l 在 α 内<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：空间的位置关系与平行<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 空间中两条直线的位置关系共有几种：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 2 种<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 3 种<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 4 种<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 1 种<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 线面平行的判定定理中，平面外直线需要与平面内的哪条直线平行：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 任意一条<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 一条<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 两条相交直线<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 两条平行直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：垂直关系与三垂线定理<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 判定一条直线垂直于一个平面，需要它垂直于平面内：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 一条直线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 两条平行直线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 两条相交直线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 三条直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三垂线定理的作用是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 把面面垂直化为线面垂直<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 把空间垂直化为平面内的垂直<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 求体积<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 判断平行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：空间角与距离<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 二面角的平面角的两条边必须：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 都垂直于棱<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 互相平行<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 都在同一平面内<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 都过棱的中点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 直线与平面所成角的范围是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> (0°,90°)<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> [0°,90°]<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> [0°,180°]<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> (0°,180°)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='异面直线'>异面直线 — 不同在任何一个平面内的两条直线。 <span class=glossary-ref>（第 1 章：空间的位置关系与平行）<\/span><\/li><li data-term='线面平行'>线面平行 — 直线与平面没有公共点。 <span class=glossary-ref>（第 1 章：空间的位置关系与平行）<\/span><\/li><li data-term='线面垂直'>线面垂直 — 直线垂直于平面内所有直线。 <span class=glossary-ref>（第 2 章：垂直关系与三垂线定理）<\/span><\/li><li data-term='射影'>射影 — 斜线在平面内的正投影。 <span class=glossary-ref>（第 2 章：垂直关系与三垂线定理）<\/span><\/li><li data-term='三垂线定理'>三垂线定理 — 平面内直线垂直于射影则垂直于斜线。 <span class=glossary-ref>（第 2 章：垂直关系与三垂线定理）<\/span><\/li><li data-term='二面角'>二面角 — 两个半平面所成的图形。 <span class=glossary-ref>（第 3 章：空间角与距离）<\/span><\/li><li data-term='平面角'>平面角 — 二面角中在棱上取点、两面内垂直棱的两射线夹角。 <span class=glossary-ref>（第 3 章：空间角与距离）<\/span><\/li><li data-term='线面角'>线面角 — 斜线与射影所成的角。 <span class=glossary-ref>（第 3 章：空间角与距离）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：证平行的三步<\/h2>\n<p>① 找面内一条与已知直线平行的线；② 用判定定理得线面平行；③ 需要时再用性质定理转回线线平行。<\/p>\n<h2>框架：求空间角三步<\/h2>\n<p>① 作出平面角（找垂足、射影）；② 在直角三角形中算边长；③ 用三角函数求角并说明范围。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>两直线<\/td><td>相交、平行、异面<\/td><\/tr><tr><td>线面平行判定<\/td><td>面外线∥面内线<\/td><\/tr><tr><td>线面垂直判定<\/td><td>垂直于面内两条相交直线<\/td><\/tr><tr><td>三垂线<\/td><td>射影⊥l ⇒ 斜线⊥l<\/td><\/tr><tr><td>线面角<\/td><td>sinθ=h/l<\/td><\/tr><tr><td>二面角<\/td><td>棱上取点，两面内作垂线<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：空间的位置关系与平行", "href": "#/chapter/ch01"}, {"label": "第 2 章：垂直关系与三垂线定理", "href": "#/chapter/ch02"}, {"label": "第 3 章：空间角与距离", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "判定与性质", "href": "#/concept/c01"}, {"label": "射影与三垂线", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测 。", "chapterId": "ch03"}, {"term": "台体", "def": "锥体被平行于底面的平面截去上部后的部分。", "chapterId": "ch03"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "三角形底为 8、高为 5，面积是：", "options": ["40", "20", "13", "10"], "answer": 1, "explain": "S=8×5/2=20。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "把一个图形按 1:3 放大，面积变为原来的：", "options": ["3 倍", "6 倍", "9 倍", "1/3"], "answer": 2, "explain": "面积比是相似比的平方，3²=9。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "半径为 3 的圆，面积是：", "options": ["6π", "9π", "3π", "12π"], "answer": 1, "explain": "S=πr²=9π。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "半径为 4、圆心角为 90° 的扇形面积是：", "options": ["4π", "8π", "2π", "16π"], "answer": 0, "explain": "90°=π/2，S=(1/2)×16×π/2=4π。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "圆锥底面半径 3、高 4，体积是：", "options": ["12π", "36π", "16π", "4π"], "answer": 0, "explain": "V=(1/3)π×9×4=12π。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "半径为 3 的球的体积是：", "options": ["12π", "36π", "27π", "9π"], "answer": 1, "explain": "V=(4/3)π×27=36π。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "圆柱底面半径 2、高 6，体积是：", "options": ["24π", "12π", "8π", "36π"], "answer": 0, "explain": "V=π×4×6=24π。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "用辛普森公式求半径为 r 的球体积，代入 S顶=S底=0、S中=πr²，得到：", "options": ["(2/3)πr³", "(4/3)πr³", "πr³", "(1/3)πr³"], "answer": 1, "explain": "V=(2r/6)(0+4πr²+0)=(4/3)πr³，与球体积公式一致。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：平面图形的面积」的一句话核心是什么？", "back": "所有直线图形的面积公式都从“矩形面积＝长×宽”出发，靠割补推出来。", "tags": ["area-volume", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：圆、扇形与曲线形面积」的一句话核心是什么？", "back": "圆面积是把圆切成无数个小扇形拼成矩形得到的：S=πr²，周长 C=2πr。", "tags": ["area-volume", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：立体图形的体积」的一句话核心是什么？", "back": "柱是“底面积乘高”，锥是柱的三分之一，台是两锥相减，球是 4πr³/3；辛普森公式把它们合成一条。", "tags": ["area-volume", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「面积」？", "back": "图形包含的单位正方形个数。", "tags": ["area-volume", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「割补法」？", "back": "剪切重拼求面积的方法。", "tags": ["area-volume", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「等积变形」？", "back": "形状改变而面积不变的变形。", "tags": ["area-volume", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「圆周率」？", "back": "圆周长与直径之比 π。", "tags": ["area-volume", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「扇形」？", "back": "两条半径与一段弧围成的图形。", "tags": ["area-volume", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「弓形」？", "back": "弦与弧围成的图形。", "tags": ["area-volume", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「祖暅原理」？", "back": "等高处截面积相等的两个立体体积相等。", "tags": ["area-volume", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「辛普森公式」？", "back": "V=(h/6)(S顶+4S中+S底)。", "tags": ["area-volume", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「台体」？", "back": "锥体被平行于底面的平面截去上部后的部分。", "tags": ["area-volume", "术语"]}], "companion": "area-volume学习伴侣.html", "deriv": "area-volume从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：平面图形的面积<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：长度、相似\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n由矩形面积推出三角形、平行四边形、梯形公式\n<\/li><li>\n用割补法求组合图形面积\n<\/li><li>\n理解等积变形的原理\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>所有直线图形的面积公式都从“矩形面积＝长×宽”出发，靠割补推出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 面积的起点<\/h3>\n<p>规定单位正方形的面积为 1，任何图形的面积就是它包含多少个单位面积。这是度量的定义，不是公式。<\/p>\n<h3>1.2 由矩形推出其他公式<\/h3>\n<ul><li>\n平行四边形：沿高剪下三角形平移到另一侧，拼成矩形，故 S=底×高；\n<\/li><li>\n三角形：两个全等三角形拼成平行四边形，故 S=底×高/2；\n<\/li><li>\n梯形：两个全等梯形拼成平行四边形，底为 (a+b)，故 S=(a+b)h/2。\n<\/ul>\n<p>每个公式都能用“拼”或“剪”验证，不必死记。<\/p>\n<h3>1.3 割补与等积变形<\/h3>\n<p>把不规则图形切成若干块，重新拼成规则图形，面积不变。常见技巧：补形成矩形再减去多余部分；把弓形补成扇形减三角形。<\/p>\n<h3>1.4 相似与面积比<\/h3>\n<p>相似比为 k 的两个图形，面积比为 k²。这条结论在处理“放大缩小”问题时最常用。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：割补像拼七巧板，块数不变、形状变了，总面积不变。<\/p>\n<p><strong>失效边界<\/strong>：割补只适用于能有限次剪拼的图形；曲线围成的图形需要极限思想。<\/p>\n<p><strong>实例<\/strong>：梯形上底 3、下底 7、高 4，面积 (3+7)×4/2=20。 三角形底 6、高 5，面积 15；若把它按 1:2 放大，面积变为 15×4=60。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 面积公式需要背很多条 —— 实际上 除矩形外都能由割补推出，理解一条就够用。\n<\/li><li>\n别以为 周长大的图形面积一定大 —— 实际上 两者没有必然联系，细长的长方形可能周长很大而面积很小。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n三角形底为 8、高为 5，面积是：\n<\/li><li>\n把一个图形按 1:3 放大，面积变为原来的：\n<p>A. 40 ｜ B. 20 ｜ C. 13 ｜ D. 10 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：S=8×5/2=20。 A. 3 倍 ｜ B. 6 倍 ｜ C. 9 倍 ｜ D. 1/3 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：面积比是相似比的平方，3²=9。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n面积从单位正方形定义出发\n<\/li><li>\n三角形、平行四边形、梯形都由矩形割补而来\n<\/li><li>\n相似比 k ⇒ 面积比 k²\n<\/ul>", "ch02": "<h1>第 2 章：圆、扇形与曲线形面积<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01、圆周率\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说明圆面积公式的极限来源\n<\/li><li>\n计算扇形、弓形面积\n<\/li><li>\n区分弧长与面积两类公式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>圆面积是把圆切成无数个小扇形拼成矩形得到的：S=πr²，周长 C=2πr。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 圆周率与周长<\/h3>\n<p>圆的周长与直径之比是常数 π≈3.1416，故 C=2πr。<\/p>\n<h3>2.2 圆面积的极限推导<\/h3>\n<p>把圆分成 n 个全等的小扇形，交错拼成一个近似平行四边形：底近似为半个圆周（πr），高近似为半径 r。n 越大越接近矩形，故 S=πr·r=πr²。<\/p>\n<p>这就是“化圆为方”的极限思想，也是后面微积分里“以直代曲”的雏形。<\/p>\n<h3>2.3 扇形<\/h3>\n<p>圆心角为 θ（弧度）的扇形：弧长 l=rθ，面积 S=(1/2)lr=(1/2)r²θ。<\/p>\n<p>用角度制时 θ 要换成弧度；360°＝2π 弧度，故整圆面积 (1/2)r²·2π=πr²，与上式一致。<\/p>\n<h3>2.4 弓形<\/h3>\n<p>弓形＝扇形 − 三角形。先算扇形面积，再减去由两条半径与弦围成的三角形面积。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：把圆切成很多细长的扇形，像切西瓜，交错摆放就接近一个长方形。<\/p>\n<p><strong>失效边界<\/strong>：有限次切割只能得到近似值；“等于”要靠 n 趋于无穷的极限。<\/p>\n<p><strong>实例<\/strong>：半径 6、圆心角 60°（π/3 弧度）的扇形：弧长 6×π/3=2π，面积 (1/2)×36×π/3=6π。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 圆面积公式可以直接背，不必理解 —— 实际上 它是极限的结果；不理解来源，遇到扇形、弓形就容易套错系数。\n<\/li><li>\n别以为 扇形面积等于弧长乘半径 —— 实际上 差一个 1/2：S=(1/2)lr，漏掉系数会算成两倍。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n半径为 3 的圆，面积是：\n<\/li><li>\n半径为 4、圆心角为 90° 的扇形面积是：\n<p>A. 6π ｜ B. 9π ｜ C. 3π ｜ D. 12π <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：S=πr²=9π。 A. 4π ｜ B. 8π ｜ C. 2π ｜ D. 16π <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：90°=π/2，S=(1/2)×16×π/2=4π。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nC=2πr，S=πr²\n<\/li><li>\n扇形：l=rθ，S=(1/2)lr\n<\/li><li>\n弓形＝扇形−三角形\n<\/ul>", "ch03": "<h1>第 3 章：立体图形的体积<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用底面积×高求柱体体积\n<\/li><li>\n说明锥体体积为何有 1/3\n<\/li><li>\n用辛普森公式统一求柱锥台球\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>柱是“底面积乘高”，锥是柱的三分之一，台是两锥相减，球是 4πr³/3；辛普森公式把它们合成一条。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 柱体<\/h3>\n<p>棱柱、圆柱的体积 V=S·h（底面积乘高）。直观来源：把柱体切成无数薄片，每片近似为底面积的薄板，叠加即得。<\/p>\n<h3>3.2 锥体<\/h3>\n<p>棱锥、圆锥的体积 V=(1/3)S·h。<\/p>\n<p>为什么是 1/3：三个全等的锥可以拼成一个等底等高的柱（对三棱锥可以严格拼出；一般锥体用极限或祖暅原理证明）。<\/p>\n<h3>3.3 台体<\/h3>\n<p>台体是“大锥减去小锥”：<\/p>\n<p>V=(h/3)(S₁+S₂+√(S₁S₂))<\/p>\n<p>其中 S₁、S₂ 是上下底面积。这个公式对棱台、圆台都成立。<\/p>\n<h3>3.4 球<\/h3>\n<p>球的体积 V=(4/3)πr³，表面积 S=4πr²。<\/p>\n<p>记忆钩子：表面积是 4πr²，体积是表面积乘以 r/3——与“锥体是柱体的 1/3”同源。<\/p>\n<h3>3.5 辛普森公式<\/h3>\n<p>若一个立体在高度 x 处的截面积为 S(x)，且 S(x) 是 x 的二次函数，则<\/p>\n<p>V=(h/6)[S(顶)+4S(中)+S(底)]<\/p>\n<p>柱、锥、台、球都满足这个条件，所以一条公式通吃。这是全书最漂亮的结果。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：柱像一摞同样大小的纸，锥像同样的纸越往上越小，到顶缩成一点。<\/p>\n<p><strong>失效边界<\/strong>：辛普森公式要求截面积是高度的二次函数；截面形状变化不满足这个条件时不能直接用。<\/p>\n<p><strong>实例<\/strong>：圆柱 r=2、h=5：V=π×4×5=20π。 同底等高的圆锥：V=20π/3。 球 r=3：V=(4/3)π×27=36π。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 锥的体积是柱的一半 —— 实际上 是三分之一；把三个同样的锥拼起来才等于一个柱。\n<\/li><li>\n别以为 球体积公式与表面积无关 —— 实际上 V=(r/3)×S，两者通过半径联系，可以互相校验。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆锥底面半径 3、高 4，体积是：\n<\/li><li>\n半径为 3 的球的体积是：\n<p>A. 12π ｜ B. 36π ｜ C. 16π ｜ D. 4π <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：V=(1/3)π×9×4=12π。 A. 12π ｜ B. 36π ｜ C. 27π ｜ D. 9π <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：V=(4/3)π×27=36π。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n柱 S·h，锥 S·h/3，台 (h/3)(S₁+S₂+√(S₁S₂))\n<\/li><li>\n球 V=4πr³/3，S=4πr²\n<\/li><li>\n辛普森公式统一柱锥台球\n<\/ul>", "c01": "<h1>割补与极限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>能剪拼的用割补，剪不动的用极限。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两条方法覆盖了从三角形到圆的所有面积推导。<\/p>\n<h2>详解<\/h2>\n<p>割补法：有限次剪拼，面积不变，适用于多边形。极限法：把曲边图形切成无穷多小块，用直边近似，取极限得到精确值，适用于圆、扇形等。两者本质都是“化未知为已知”。<\/p>\n<h2>常见误解<\/h2>\n<p>把极限结果当成有限次切割的结果，或认为曲线图形也能精确剪拼。<\/p>\n<h2>相关概念<\/h2>\n<p>平面面积（ch01）、圆面积（ch02）<\/p>", "c02": "<h1>统一公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>柱、锥、台、球看似不同，截面积的变化规律却能让同一条公式成立。<\/p>\n<h2>为什么重要<\/h2>\n<p>理解统一性比记四个公式更省力，也是数学里“找结构”的典型例子。<\/p>\n<h2>详解<\/h2>\n<p>辛普森公式 V=(h/6)(S顶+4S中+S底) 对截面积为二次函数的立体精确成立。柱的截面积恒定，锥的截面积按平方递减，球也满足，因此都能代入。<\/p>\n<h2>常见误解<\/h2>\n<p>对任意立体都套辛普森公式；截面形状变化不规则时会得到近似值而非精确值。<\/p>\n<h2>相关概念<\/h2>\n<p>锥体（ch03）、球（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：平面图形的面积<\/strong><br>阅读：<a href=\"#/book/area-volume/chapter/ch01\">第 1 章：平面图形的面积<\/a><br>检查点：能用割补法求不规则图形面积<\/li><li class='path-step' id='path-02'><strong>步骤 02：圆、扇形与曲线形面积<\/strong><br>阅读：<a href=\"#/book/area-volume/chapter/ch02\">第 2 章：圆、扇形与曲线形面积<\/a><br>检查点：能用极限思想说明圆面积公式<\/li><li class='path-step' id='path-03'><strong>步骤 03：立体图形的体积<\/strong><br>阅读：<a href=\"#/book/area-volume/chapter/ch03\">第 3 章：立体图形的体积<\/a><br>检查点：能用辛普森公式统一求柱锥台球<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：平面图形的面积<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 三角形底为 8、高为 5，面积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 40<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 20<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 13<\/label><label class='quiz-o 积三选一<\/h2>\n<p>规则图形套公式；不规则图形割补；曲边图形用极限或积分。<\/p>\n<h2>框架：求体积四步<\/h2>\n<p>① 认形体（柱/锥/台/球）；② 找底面积与高；③ 选公式；④ 检查单位与量纲（体积是三次方）。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>三角形<\/td><td>S=ah/2<\/td><\/tr><tr><td>梯形<\/td><td>S=(a+b)h/2<\/td><\/tr><tr><td>圆<\/td><td>C=2πr，S=πr²<\/td><\/tr><tr><td>扇形<\/td><td>S=(1/2)lr=(1/2)r²θ<\/td><\/tr><tr><td>柱/锥<\/td><td>V=S·h；V=S·h/3<\/td><\/tr><tr><td>台<\/td><td>V=(h/3)(S₁+S₂+√(S₁S₂))<\/td><\/tr><tr><td>球<\/td><td>V=4πr³/3，S=4πr²<\/td><\/tr><tr><td>辛普森<\/td><td>V=(h/6)(S顶+4S中+S底)<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：平面图形的面积", "href": "#/chapter/ch01"}, {"label": "第 2 章：圆、扇形与曲线形面积", "href": "#/chapter/ch02"}, {"label": "第 3 章：立体图形的体积", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "割补与极限", "href": "#/concept/c01"}, {"label": "统一公式", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：平面图形的面积", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：圆、扇形与曲线形面积", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：立体图形的体积", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"locus":{"manifest": {"slug": "locus", "title": "轨迹", "subtitle": "动点的足迹：从条件到方程", "book": {"title": "轨迹", "author": "杨学渊", "source": ["数学基础知识丛书-15-轨迹 杨学渊.pdf"]}, "audience": "零基础", "goal": "理解命题与充分必要条件，掌握求轨迹的五步法，能识别常见轨迹（直线、圆、圆锥曲线型），并会检验轨迹的纯粹性与完备性。", "learningPath": [{"step": "01", "title": "命题与充分必要条件", "chapterIds": ["ch01"], "checkpoint": "能判断“甲是乙的什么条件”"}, {"step": "02", "title": "求轨迹的五步法", "chapterIds": ["ch02"], "checkpoint": "能独立完成一道轨迹题的检验"}, {"step": "03", "title": "常见轨迹与空间轨迹", "chapterIds": ["ch03"], "checkpoint": "能由条件说出轨迹类型"}], tion": "到定点距离等于定值的点的轨迹是：", "options": ["直线", "圆", "椭圆", "抛物线"], "answer": 1, "explain": "这正是圆的定义。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "到两定点距离之差为常数（小于两点距离）的轨迹是：", "options": ["椭圆", "双曲线的一支或两支", "圆", "直线"], "answer": 1, "explain": "差为常数对应双曲线；取绝对值时为两支，不取绝对值时为靠近某定点的一支。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "“a>1”是“a>0”的：", "options": ["充分不必要条件", "必要不充分条件", "充要条件", "既不充分也不必要"], "answer": 0, "explain": "a>1 必有 a>0；a>0 推不出 a>1。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "求轨迹时忽略检验，最可能导致：", "options": ["计算变慢", "多算或漏算点", "图形画错", "方程次数变高"], "answer": 1, "explain": "检验就是查完备性与纯粹性，省掉会出现增点或漏点。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：命题与充分必要条件」的一句话核心是什么？", "back": "若 p 成立必有 q 成立，则 p 是 q 的充分条件，q 是 p 的必要条件。", "tags": ["locus", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：求轨迹的五步法」的一句话核心是什么？", "back": "求轨迹＝把几何条件翻译成方程，再用原条件回头验一遍。", "tags": ["locus", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：常见轨迹与空间轨迹」的一句话核心是什么？", "back": "记住五种定义型轨迹，看到条件就能报出图形。", "tags": ["locus", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「命题」？", "back": "可以判断真假的陈述句。", "tags": ["locus", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「充分条件」？", "back": "有它就能推出结论的条件。", "tags": ["locus", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「必要条件」？", "back": "没有它结论就不成立的条件。", "tags": ["locus", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「充要条件」？", "back": "互相都能推出的条件。", "tags": ["locus", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「轨迹」？", "back": "满足某条件的点的集合。", "tags": ["locus", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「完备性」？", "back": "符合条件的点都在图形上。", "tags": ["locus", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「纯粹性」？", "back": "图形上的点都符合条件。", "tags": ["locus", "术语"]}, {"id": "f11", "chapterId": "ch02", "front": "什么是「阿波罗尼斯圆」？", "back": "到两定点距离之比为定值的点的轨迹。", "tags": ["locus", "术语"]}], "companion": "locus学习伴侣.html", "deriv": "locus从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：命题与充分必要条件<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：逻辑常识\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断四种条件的类型\n<\/li><li>\n用集合包含关系判断充分必要\n<\/li><li>\n写出命题的逆命题与否命题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>若 p 成立必有 q 成立，则 p 是 q 的充分条件，q 是 p 的必要条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 命题与推出<\/h3>\n<p>命题是可以判断真假的陈述句。若“p 成立则 q 成立”恒成立，记 p⇒q。<\/p>\n<ul><li>\np 是 q 的<strong>充分条件<\/strong>：有 p 就够推出 q；\n<\/li><li>\nq 是 p 的<strong>必要条件<\/strong>：没有 q 就没有 p。\n<\/ul>\n<h3>1.2 四种条件<\/h3>\n<ul><li>\n充分不必要：p⇒q 但 q 推不出 p；\n<\/li><li>\n必要不充分：q⇒p 但 p 推不出 q；\n<\/li><li>\n充要：p⇔q；\n<\/li><li>\n既不充分也不必要。\n<\/ul>\n<h3>1.3 集合视角<\/h3>\n<p>设 p 对应集合 A，q 对应集合 B。若 A⊆B（小范围推大范围），则 p 是 q 的充分条件；若 B⊆A，则 p 是 q 的必要条件；若 A=B，则充要。<\/p>\n<p>这条视角比背定义可靠：判断时先画范围，再看包含方向。<\/p>\n<h3>1.4 逆命题与否命题<\/h3>\n<p>原命题 p⇒q 的逆命题是 q⇒p，否命题是 ¬p⇒¬q，逆否命题是 ¬q⇒¬p。<\/p>\n<p>原命题与逆否命题同真假；逆命题与否命题同真假。但原命题与逆命题不一定同真假。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：充分条件是“买了门票就能进场”，必要条件“没票就进不去”——有票是能进的充分条件，也是“必须”的前提。<\/p>\n<p><strong>失效边界<\/strong>：充分条件不唯一，可能有很多条路都能推出结论。<\/p>\n<p><strong>实例<\/strong>：“x&gt;2”是“x&gt;0”的充分不必要条件（小范围推大范围）；“x&gt;0”是“x&gt;2”的必要不充分条件。 “x 是偶数”是“x 能被 2 整除”的充要条件。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 充分条件就是必要条件 —— 实际上 方向相反：充分是 p⇒q，必要是 q⇒p。\n<\/li><li>\n别以为 原命题真则逆命题也真 —— 实际上 不一定，例如“正方形是矩形”为真，“矩形是正方形”为假。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“x=1”是“x²=1”的：\n<\/li><li>\n若 A⊆B，则 A 是 B 的：\n<p>A. 充分不必要条件 ｜ B. 必要不充分条件 ｜ C. 充要条件 ｜ D. 既不充分也不必要 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：x=1 必有 x²=1；但 x²=1 还可能是 x=−1，推不出 x=1。 A. 充分条件 ｜ B. 必要条件 ｜ C. 充要条件 ｜ D. 无关条件 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：A 中每个元素都在 B 中，故 A 成立可推出 B 成立，A 是 B 的充分条件。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\np⇒q：p 充分、q 必要\n<\/li><li>\n小范围推大范围＝充分\n<\/li><li>\n原命题与逆否命题同真假\n<\/ul>", "ch02": "<h1>第 2 章：求轨迹的五步法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、坐标\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按五步写出轨迹方程\n<\/li><li>\n用完备性与纯粹性检验结果\n<\/li><li>\n处理含参数与限制条件的轨迹\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>求轨迹＝把几何条件翻译成方程，再用原条件回头验一遍。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 五步法<\/h3>\n<ol><li>\n<strong>建系<\/strong>：选合适的原点与坐标轴，让条件尽量简单（常把定点放原点或对称轴上）；\n<\/li><li>\n<strong>设点<\/strong>：设动点 P(x,y)，写出其它相关点的坐标；\n<\/li><li>\n<strong>列式<\/strong>：把几何条件写成含 x、y 的等式（距离、斜率、面积等）；\n<\/li><li>\n<strong>化简<\/strong>：整理成标准方程；\n<\/li><li>\n<strong>检验<\/strong>：检查是否有“多出来的点”（增点）或“漏掉的点”。\n<\/ol>\n<h3>2.2 完备性与纯粹性<\/h3>\n<ul><li>\n<strong>完备性<\/strong>：所有满足条件的点都在求出的图形上——不能漏；\n<\/li><li>\n<strong>纯粹性<\/strong>：图形上每个点都满足条件——不能多。\n<\/ul>\n<p>实际做题中，最常见的漏洞是化简时两边平方或约分，引入了原条件不满足的点，必须在最后一步剔除。<\/p>\n<h3>2.3 常用翻译表<\/h3>\n<table><thead><tr><th>几何条件<\/th><th>代数表达<\/th><\/tr><\/thead><tbody><tr><td>到定点距离为 r<\/td><td>(x−a)²+(y−b)²=r²<\/td><\/tr><tr><td>到两定点距离相等<\/td><td>中垂线方程<\/td><\/tr><tr><td>到两定点距离之比为 k<\/td><td>√((x−a)²+y²)=k√((x−b)²+y²)<\/td><\/tr><tr><td>与定直线距离等于定值<\/td><td><\/td><td>Ax+By+C<\/td><td>/√(A²+B²)=d<\/td><\/tr><\/tbody><\/table>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：求轨迹像给一个人画行动路线：先定地图（建系），再记下他满足什么规则，最后画出路线并核对。<\/p>\n<p><strong>失效边界<\/strong>：条件含“距离”时平方会产生增点；条件含“斜率”时要排除竖直线。<\/p>\n<p><strong>实例<\/strong>：求到点 A(0,0) 与 B(4,0) 距离相等的点的轨迹。 设 P(x,y)：√(x²+y²)=√((x−4)²+y²)，平方化简得 x=2。检验：x=2 上任意点确实到两点等距，无增点。轨迹是直线 x=2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 化简完的方程就是轨迹 —— 实际上 还要检验；平方、约分都可能改变解集。\n<\/li><li>\n别以为 建系随便选都行 —— 实际上 选得好计算量差很多；通常让定点落在坐标轴上或关于原点对称。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n求轨迹时“检验”这一步主要检查：\n<\/li><li>\n到两定点距离相等的点的轨迹是：\n<p>A. 计算是否正确 ｜ B. 是否有增点或漏点 ｜ C. 图形是否美观 ｜ D. 坐标是否为整数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：检验是查完备性与纯粹性，即有没有多算或漏算的点。 A. 圆 ｜ B. 椭圆 ｜ C. 两定点的中垂线 ｜ D. 抛物线 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：到两点等距的点集就是这两点连线的垂直平分线。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五步：建系、设点、列式、化简、检验\n<\/li><li>\n检验查完备性与纯粹性\n<\/li><li>\n平方与约分是增点的主要来源\n<\/ul>", "ch03": "<h1>第 3 章：常见轨迹与空间轨迹<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n识别五种常见轨迹类型\n<\/li><li>\n用定义直接写出轨迹\n<\/li><li>\n了解空间轨迹的降维处理\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>记住五种定义型轨迹，看到条件就能报出图形。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 平面内的五种常见轨迹<\/h3>\n<ul><li>\n到定点距离等于定值：圆；\n<\/li><li>\n到两定点距离相等：中垂线；\n<\/li><li>\n到两定点距离之和为常数（大于两点距离）：椭圆；\n<\/li><li>\n到两定点距离之差的绝对值为常数（小于两点距离）：双曲线；\n<\/li><li>\n到定点与定直线的距离相等：抛物线。\n<\/ul>\n<p>后三种正是圆锥曲线的定义，与《圆锥曲线》一书直接衔接。<\/p>\n<h3>3.2 用定义写轨迹<\/h3>\n<p>能识别定义时，直接写出标准方程，比五步法快得多。例如“到点 F(1,0) 与直线 x=−1 距离相等”，由定义即得 y²=4x。<\/p>\n<h3>3.3 空间轨迹<\/h3>\n<p>空间中到定点距离为定值的点集是球面；到两定点等距的点集是垂直平分面。<\/p>\n<p>处理空间轨迹的常用办法是“降维”：先固定一个平面，求出平面内的轨迹，再让平面运动，合成空间图形。<\/p>\n<h3>3.4 轨迹的交与并<\/h3>\n<p>两个条件的交集对应两图形的交点，并集对应两图形的合并。含“或”的条件要取并，含“且”的要取交——这与解不等式组的逻辑一致。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：五种轨迹像五种“尺规规则”：给的距离关系不同，画出的曲线就不同。<\/p>\n<p><strong>失效边界<\/strong>：椭圆要求距离之和大于两定点距离；等于时为线段，小于时无轨迹。<\/p>\n<p><strong>实例<\/strong>：到 A(−3,0)、B(3,0) 距离之和为 8 的点：2a=8，a=4，c=3，b²=16−9=7，轨迹为 x²/16+y²/7=1。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 距离之和为常数就一定是椭圆 —— 实际上 当常数等于两定点距离时退化为线段，小于时不存在。\n<\/li><li>\n别以为 空间轨迹也能直接套平面公式 —— 实际上 空间要先降维或另建坐标系，平面公式只在某个平面内成立。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n到定点距离等于定值的点的轨迹是：\n<\/li><li>\n到两定点距离之差为常数（小于两点距离）的轨迹是：\n<p>A. 直线 ｜ B. 圆 ｜ C. 椭圆 ｜ D. 抛物线 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：这正是圆的定义。 A. 椭圆 ｜ B. 双曲线的一支或两支 ｜ C. 圆 ｜ D. 直线 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：差为常数对应双曲线；取绝对值时为两支，不取绝对值时为靠近某定点的一支。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五种定义型轨迹：圆、中垂线、椭圆、双曲线、抛物线\n<\/li><li>\n能识别定义就直接写方程\n<\/li><li>\n空间轨迹先降维\n<\/ul>", "c01": "<h1>充分必要<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>充分是“有它就够”，必要是“没它不行”。<\/p>\n<h2>为什么重要<\/h2>\n<p>轨迹的检验本质上就是判断“方程”与“条件”是否互为充要。<\/p>\n<h2>详解<\/h2>\n<p>p⇒q 时 p 充分、q 必要。用集合看：小范围推大范围。做题时把条件与结论各画一个范围，看谁包含谁，比背定义可靠。<\/p>\n<h2>常见误解<\/h2>\n<p>把“必要条件”理解成“重要的条件”，忽略它其实是方向问题。<\/p>\n<h2>相关概念<\/h2>\n<p>命题（ch01）、检验（ch02）<\/p>", "c02": "<h1>完备性与纯粹性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>完备是不漏，纯粹是不多；两者都满足，方程才等于轨迹。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是轨迹题唯一的评分关键：方程对了但没检验，通常要扣分。<\/p>\n<h2>详解<\/h2>\n<p>完备性：符合条件的点都在方程表示的图形上；纯粹性：图形上的点都符合条件。平方、约分、去绝对值常破坏纯粹性；忽略参数范围常破坏完备性。检验的办法是回到原条件逐条核对。<\/p>\n<h2>常见误解<\/h2>\n<p>认为“化简过程等价就没问题”，忽略平方与约分并不等价。<\/p>\n<h2>相关概念<\/h2>\n<p>五步法（ch02）、增根（《分式与根式》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：命题与充分必要条件<\/strong><br>阅读：<a href=\"#/book/locus/chapter/ch01\">第 1 章：命题与充分必要条件<\/a><br>检查点：能判断“甲是乙的什么条件”<\/li><li class='path-step' id='path-02'><strong>步骤 02：求轨迹的五步法<\/strong><br>阅读：<a href=\"#/book/locus/chapter/ch02\">第 2 章：求轨迹的五步法<\/a><br>检查点：能独立完成一道轨迹题的检验<\/li><li class='path-step' id='path-03'><strong>步骤 03：常见轨迹与空间轨迹<\/strong><br>阅读：<a href=\"#/book/locus/chapter/ch03\">第 3 章：常见轨迹与空间轨迹<\/a><br>检查点：能由条件说出轨迹类型<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：命题与充分必要条件<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “x=1”是“x²=1”的：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 充分不必要条件<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 必要不充分条件<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 充要条件<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 既不充分也不必要<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 若 A⊆B，则 A 是 B 的：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 充分条件<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 必要条件<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 充要条件<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 无关条件<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：求轨迹的五步法<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 求轨迹时“检验”这一步主要检查：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 计算是否正确<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 是否有增点或漏点<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 图形是否美观<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 坐标是否为整数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 到两定点距离相等的点的轨迹是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 圆<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 椭圆<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 两定点的中垂线<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 抛物线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：常见轨迹与空间轨迹<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 到定点距离等于定值的点的轨迹是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 直线<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 圆<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 椭圆<\/label><label rols'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='命题'>命题 — 可以判断真假的陈述句。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='充分条件'>充分条件 — 有它就能推出结论的条件。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='必要条件'>必要条件 — 没有它结论就不成立的条件。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='充要条件'>充要条件 — 互相都能推出的条件。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='轨迹'>轨迹 — 满足某条件的点的集合。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><li data-term='完备性'>完备性 — 符合条件的点都在图形上。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><li data-term='纯粹性'>纯粹性 — 图形上的点都符合条件。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><li data-term='阿波罗尼斯圆'>阿波罗尼斯圆 — 到两定点距离之比为定值的点的轨迹。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：轨迹题五步<\/h2>\n<p>建系、设点、列式、化简、检验；检验放在最后，不能省。<\/p>\n<h2>框架：先定义后计算<\/h2>\n<p>能识别为圆/椭圆/双曲线/抛物线时，直接用定义写方程，只在必要时才走五步法。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>充分<\/td><td>p⇒q，小范围推大范围<\/td><\/tr><tr><td>必要<\/td><td>q⇒p，没它不行<\/td><\/tr><tr><td>充要<\/td><td>p⇔q，集合相等<\/td><\/tr><tr><td>五步法<\/td><td>建系—设点—列式—化简—检验<\/td><\/tr><tr><td>轨迹类型<\/td><td>等距圆、等距中垂线、和椭圆、差双曲线、等距抛物线<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": " : "外接圆半径", "def": "三角形外接圆的半径 R。", "chapterId": "ch01"}, {"term": "边边角", "def": "已知两边及其中一边的对角，可能多解。", "chapterId": "ch01"}, {"term": "海伦公式", "def": "由三边求面积的公式。", "chapterId": "ch03"}, {"term": "方位角", "def": "从正北方向顺时针量到目标方向的角度。", "chapterId": "ch03"}, {"term": "仰角", "def": "视线在水平线之上的夹角。", "chapterId": "ch03"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "正弦定理中，a/sinA 等于：", "options": ["内切圆半径", "外接圆半径", "外接圆直径", "三角形周长"], "answer": 2, "explain": "a/sinA=2R，即外接圆直径。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "已知 a=2、b=3、A=30°，则 B：", "options": ["只有一解", "可能有两解", "一定无解", "一定为直角"], "answer": 1, "explain": "sinB=b sinA/a=3×0.5/2=0.75<1，B 有锐角与钝角两个候选，需检验，可能两解。"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "已知 b=3、c=4、A=90°，则 a 等于：", "options": ["5", "7", "25", "√7"], "answer": 0, "explain": "cosA=0，a²=9+16=25，a=5。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "三角形三边为 2、3、4，最大角是：", "options": ["锐角", "直角", "钝角", "无法判断"], "answer": 2, "explain": "4²=16>2²+3²=13，故最大角为钝角。"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "两边为 4 和 6、夹角 30°，面积是：", "options": ["12", "6", "24", "3"], "answer": 1, "explain": "S=(1/2)×4×6×0.5=6。"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "三边为 6、8、10 的三角形面积是：", "options": ["24", "48", "30", "20"], "answer": 0, "explain": "p=12，S=√(12×6×4×2)=√576=24。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "在 △ABC 中，a=8、b=6、A=60°，则 sinB 等于：", "options": ["3√3/8", "3/4", "√3/2", "1/2"], "answer": 0, "explain": "由 a/sinA=b/sinB 得 sinB=b sinA/a=6×(√3/2)/8=3√3/8。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "三边为 5、12、13 的三角形，其最大角是：", "options": ["锐角", "直角", "钝角", "60°"], "answer": 1, "explain": "13²=169=5²+12²，故为直角三角形，最大角 90°。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：正弦定理」的一句话核心是什么？", "back": "同一个三角形中，边与它所对角的正弦之比相等，且等于外接圆直径。", "tags": ["solving-triangles", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：余弦定理与形状判断」的一句话核心是什么？", "back": "余弦定理是勾股定理的推广：a²=b²+c²−2bc cosA，多出的那一项修正了“非直角”。", "tags": ["solving-triangles", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：面积公式与应用」的一句话核心是什么？", "back": "面积有两种算法：给角用 (1/2)ab sinC，给三边用海伦公式。", "tags": ["solving-triangles", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「正弦定理」？", "back": "a/sinA=b/sinB=c/sinC=2R。", "tags": ["solving-triangles", "术语"]}, {"id": "f05", "chapterId": "ch02", "front": "什么是「余弦定理」？", "back": "a²=b²+c²−2bc cosA。", "tags": ["solving-triangles", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「外接圆半径」？", "back": "三角形外接圆的半径 R。", "tags": ["solving-triangles", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「边边角」？", "back": "已知两边及其中一边的对角，可能多解。", "tags": ["solving-triangles", "术语"]}, {"id": "f08", "chapterId": "ch03", "front": "什么是「海伦公式」？", "back": "由三边求面积的公式。", "tags": ["solving-triangles", "术语"]}, {"id": "f09", "chapterId": "ch03", "front": "什么是「方位角」？", "back": "从正北方向顺时针量到目标方向的角度。", "tags": ["solving-triangles", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「仰角」？", "back": "视线在水平线之上的夹角。", "tags": ["solving-triangles", "术语"]}], "companion": "solving-triangles学习伴侣.html", "deriv": "solving-triangles从零推导.html"}, "rendered": {"ch01": "<h1>第 1 章：正弦定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：三角比、圆\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n推导并默写正弦定理\n<\/li><li>\n用正弦定理解两类三角形\n<\/li><li>\n判断已知两边及一边对角时的解的个数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同一个三角形中，边与它所对角的正弦之比相等，且等于外接圆直径。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 定理与推导<\/h3>\n<p>在 △ABC 中：<\/p>\n<p>a/sinA = b/sinB = c/sinC = 2R<\/p>\n<p>（R 为外接圆半径）<\/p>\n<p>推导：作外接圆，把一边看成弦，由圆周角定理得 a=2R sinA；对另外两边同理。<\/p>\n<h3>1.2 两类基本用法<\/h3>\n<ul><li>\n已知两角与一边：先求第三角（180°减），再用定理求另两边；\n<\/li><li>\n已知两边与其中一边的对角：先求另一边的对角，再求第三角与第三边。\n<\/ul>\n<h3>1.3 多解讨论<\/h3>\n<p>已知 a、b 与 A（边边角）时，由 sinB=b sinA/a 求 B，可能出现：<\/p>\n<ul><li>\nsinB&gt;1：无解；\n<\/li><li>\nsinB=1：一解（B=90°）；\n<\/li><li>\nsinB&lt;1：B 有锐角与钝角两个候选，需检查 A+B&lt;180° 是否成立，可能一解也可能两解。\n<\/ul>\n<p>这是解三角形最容易丢分的地方，必须画图核对。<\/p>\n<h3>1.4 边角互化<\/h3>\n<p>定理把“边的比”换成“正弦的比”，遇到含边与角的混合等式，优先统一成角或统一成边。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：正弦定理像“大角对大边”的定量版本：边越长，对着的角越大，比例恒定。<\/p>\n<p><strong>失效边界<\/strong>：定理对任意三角形都成立，但求角时要防增解；正弦值相同对应两个角。<\/p>\n<p><strong>实例<\/strong>：A=30°，B=45°，a=2。C=105°，由 a/sinA=b/sinB 得 b=2 sin45°/sin30°=2×0.7071/0.5≈2.83。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 正弦定理只适用于直角三角形 —— 实际上 对任意三角形都成立，直角三角形只是特例。\n<\/li><li>\n别以为 由 sinB 求出 B 就唯一 —— 实际上 正弦值对应两个角（锐角与钝角），必须检验和角条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n正弦定理中，a/sinA 等于：\n<\/li><li>\n已知 a=2、b=3、A=30°，则 B：\n<p>A. 内切圆半径 ｜ B. 外接圆半径 ｜ C. 外接圆直径 ｜ D. 三角形周长 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：a/sinA=2R，即外接圆直径。 A. 只有一解 ｜ B. 可能有两解 ｜ C. 一定无解 ｜ D. 一定为直角 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：sinB=b sinA/a=3×0.5/2=0.75&lt;1，B 有锐角与钝角两个候选，需检验，可能两解。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na/sinA=b/sinB=c/sinC=2R\n<\/li><li>\n已知两角一边可直接解\n<\/li><li>\n边边角要讨论解的个数\n<\/ul>", "ch02": "<h1>第 2 章：余弦定理与形状判断<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n推导并默写余弦定理\n<\/li><li>\n由三边求角、由两边夹角求第三边\n<\/li><li>\n用余弦值判断三角形是锐角、直角还是钝角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>余弦定理是勾股定理的推广：a²=b²+c²−2bc cosA，多出的那一项修正了“非直角”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 定理与推导<\/h3>\n<p>a²=b²+c²−2bc cosA b²=a²+c²−2ac cosB c²=a²+b²−2ab cosC<\/p>\n<p>推导：以 A 为原点、AB 为 x 轴建系，B(c,0)，C(b cosA, b sinA)，用两点距离公式展开即得。<\/p>\n<p>当 A=90° 时 cosA=0，公式退化为勾股定理 a²=b²+c²。<\/p>\n<h3>2.2 两类用法<\/h3>\n<ul><li>\n已知两边及夹角：直接求第三边；\n<\/li><li>\n已知三边：用变形公式求角，cosA=(b²+c²−a²)/(2bc)。\n<\/ul>\n<h3>2.3 形状判断<\/h3>\n<p>由 cosA 的符号判断 A 的类型：<\/p>\n<ul><li>\ncosA&gt;0（a²&lt;b²+c²）：A 为锐角；\n<\/li><li>\ncosA=0（a²=b²+c²）：A 为直角；\n<\/li><li>\ncosA&lt;0（a²&gt;b²+c²）：A 为钝角。\n<\/ul>\n<p>判断整个三角形的形状，要看最大边所对的角——只需检查最大角。<\/p>\n<h3>2.4 与正弦定理的分工<\/h3>\n<p>已知“边边角”用正弦定理（注意多解）；已知“边角边”或“边边边”用余弦定理（无多解问题）。这是选择定理的第一判据。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：余弦定理像给勾股定理加了一个“斜度修正项”：角越偏离直角，修正越大。<\/p>\n<p><strong>失效边界<\/strong>：修正项可正可负，钝角时第三边比勾股定理算出的更长。<\/p>\n<p><strong>实例<\/strong>：b=5、c=8、A=60°：a²=25+64−2×5×8×0.5=89−40=49，a=7。 三边 3、4、6：最大边 6，6²=36&gt;3²+4²=25，故为钝角三角形。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 余弦定理只能求边 —— 实际上 也能求角，变形后 cosA=(b²+c²−a²)/(2bc) 就是求角公式。\n<\/li><li>\n别以为 三边确定三角形一定唯一 —— 实际上 三边确定时三角形唯一（SSS），但角要用余弦定理算，不能靠正弦定理。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n已知 b=3、c=4、A=90°，则 a 等于：\n<\/li><li>\n三角形三边为 2、3、4，最大角是：\n<p>A. 5 ｜ B. 7 ｜ C. 25 ｜ D. √7 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：cosA=0，a²=9+16=25，a=5。 A. 锐角 ｜ B. 直角 ｜ C. 钝角 ｜ D. 无法判断 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：4²=16&gt;2²+3²=13，故最大角为钝角。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na²=b²+c²−2bc cosA\n<\/li><li>\n已知两边夹角或三边用余弦定理\n<\/li><li>\n最大边定形状：比较 a² 与 b²+c²\n<\/ul>", "ch03": "<h1>第 3 章：面积公式与应用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用两边夹角公式求面积\n<\/li><li>\n用海伦公式由三边求面积\n<\/li><li>\n解决测高、测距与方位角问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>面积有两种算法：给角用 (1/2)ab sinC，给三边用海伦公式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 夹角面积公式<\/h3>\n<p>S=(1/2)ab sinC=(1/2)bc sinA=(1/2)ca sinB<\/p>\n<p>理由：以 a 为底，高为 b sinC，代入三角形面积公式即得。<\/p>\n<h3>3.2 海伦公式<\/h3>\n<p>已知三边 a、b、c，令 p=(a+b+c)/2，则<\/p>\n<p>S=√(p(p−a)(p−b)(p−c))<\/p>\n<p>它不需要先求角，适合只给三边的场合。<\/p>\n<h3>3.3 测量应用<\/h3>\n<ul><li>\n测高：在同一水平线上取两点，测仰角，用正弦定理求距离，再用直角三角形求高；\n<\/li><li>\n测距：不可到达的两点，构造可测三角形，用正弦或余弦定理；\n<\/li><li>\n方位角：从正北方向顺时针量到目标方向的角度，画图时先定北向。\n<\/ul>\n<p>建模四步：画图 → 标已知 → 选定理 → 解并检验合理性（边长是否为正、角是否在范围内）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：面积公式像“用两条边和它们张开的角度算地毯大小”，海伦公式像“只量三条边就能算”。<\/p>\n<p><strong>失效边界<\/strong>：海伦公式要求三边能构成三角形（任意两边之和大于第三边），否则根号内为负。<\/p>\n<p><strong>实例<\/strong>：a=5、b=7、C=60°，S=(1/2)×5×7×√3/2≈15.16。 三边 3、4、5：p=6，S=√(6×3×2×1)=√36=6，与直角三角形面积 3×4/2=6 一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 海伦公式对任意三数都能用 —— 实际上 三数必须满足三角形不等式，否则根号内为负，不是三角形。\n<\/li><li>\n别以为 方位角从正东开始量 —— 实际上 方位角从正北方向开始，顺时针计，范围 0°到 360°。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n两边为 4 和 6、夹角 30°，面积是：\n<\/li><li>\n三边为 6、8、10 的三角形面积是：\n<p>A. 12 ｜ B. 6 ｜ C. 24 ｜ D. 3 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：S=(1/2)×4×6×0.5=6。 A. 24 ｜ B. 48 ｜ C. 30 ｜ D. 20 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：p=12，S=√(12×6×4×2)=√576=24。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nS=(1/2)ab sinC\n<\/li><li>\n海伦：S=√(p(p−a)(p−b)(p−c))\n<\/li><li>\n方位角从正北顺时针量\n<\/ul>", "c01": "<h1>边角对应<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>大边对大角，正弦定理量化了这条关系，余弦定理则处理“夹角”。<\/p>\n<h2>为什么重要<\/h2>\n<p>选对定理是解三角形的第一判断，选错会绕远且易错。<\/p>\n<h2>详解<\/h2>\n<p>已知两角一边、两边及一边对角（含多解）用正弦定理；已知两边夹角、三边用余弦定理。两种定理都能把“边”与“角”互相翻译。<\/p>\n<h2>常见误解<\/h2>\n<p>遇到边角混合条件直接套正弦定理，忽略余弦定理更直接。<\/p>\n<h2>相关概念<\/h2>\n<p>正弦定理（ch01）、余弦定理（ch02）<\/p>", "c02": "<h1>多解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>已知两边及一边对角时，正弦值对应两个角，可能有两个三角形。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是解三角形唯一的“答案不唯一”情形，漏判会少写一个解。<\/p>\n<h2>详解<\/h2>\n<p>由 sinB=b sinA/a 求 B：若大于 1 无解；等于 1 一解；小于 1 时 B 有锐角、钝角两个候选，需检验 A+B&lt;180°。大边对大角也可辅助判断：b&gt;a 时 B 可能为钝角。<\/p>\n<h2>常见误解<\/h2>\n<p>求出 sinB 就直接取锐角，漏掉钝角解。<\/p>\n<h2>相关概念<\/h2>\n<p>正弦定理（ch01）、三角形内角和（《直线形》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：正弦定理<\/strong><br>阅读：<a href=\"#/book/solving-triangles/chapter/ch01\">第 1 章：正弦定理<\/a><br>检查点：能由两边一角求出其余元素并讨论多解<\/li><li class='path-step' id='path-02'><strong>步骤 02：余弦定理与形状判断<\/strong><br>阅读：<a href=\"#/book/solving-triangles/chapter/ch02\">第 2 章：余弦定理与形状判断<\/a><br>检查点：能由三边求角并判断三角形类型<\/li><li class='path-step' id='path-03'><strong>步骤 03：面积公式与应用<\/strong><br>阅读：<a href=\"#/book/solving-triangles/chapter/ch03\">第 3 章：面积公式与应用<\/a><br>检查点：能用两种面积公式解测量题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：正弦定理<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 正弦定理中，a/sinA 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 内切圆半径<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 外接圆半径<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 外接圆直径<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 三角形周长<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 已知 a=2、b=3、A=30°，则 B：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 只有一解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 可能有两解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 一定无解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 一定为直角<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：余弦定理与形状判断<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 已知 b=3、c=4、A=90°，则 a 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 5<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 7<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 25<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> √7<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三角形三边为 2、3、4，最大角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 锐角<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 直角<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 钝角<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：面积公式与应用<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 两边为 4 和 6、夹角 30°，面积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 12<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 24<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三边为 6、8、10 的三角形面积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 24<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 48<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 30<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 在 △ABC 中，a=8、b=6、A=60°，则 sinB 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 3√3/8<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 3/4<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 1/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 三边为 5、12、13 的三角形，其最大角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 锐角<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 直角<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 钝角<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 60°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：正弦定理<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 正弦定理中，a/sinA 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 内切圆半径<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 外接圆半径<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 外接圆直径<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 三角形周长<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 已知 a=2、b=3、A=30°，则 B：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 只有一解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 可能有两解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 一定无解<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 一定为直角<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：余弦定理与形状判断<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 已知 b=3、c=4、A=90°，则 a 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 5<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 7<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 25<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> √7<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三角形三边为 2、3、4，最大角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 锐角<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 直角<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 钝角<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：面积公式与应用<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 两边为 4 和 6、夹角 30°，面积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> 12<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> 24<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> 3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三边为 6、8、10 的三角形面积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 24<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 48<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> 30<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='正弦定理'>正弦定理 — a/sinA=b/sinB=c/sinC=2R。 <span class=glossary-ref>（第 1 章：正弦定理）<\/span><\/li><li data-term='余弦定理'>余弦定理 — a²=b²+c²−2bc cosA。 <span class=glossary-ref>（第 2 章：余弦定理与形状判断）<\/span><\/li><li data-term='外接圆半径'>外接圆半径 — 三角形外接圆的半径 R。 <span class=glossary-ref>（第 1 章：正弦定理）<\/span><\/li><li data-term='边边角'>边边角 — 已知两边及其中一边的对角，可能多解。 <span class=glossary-ref>（第 1 章：正弦定理）<\/span><\/li><li data-term='海伦公式'>海伦公式 — 由三边求面积的公式。 <span class=glossary-ref>（第 3 章：面积公式与应用）<\/span><\/li><li data-term='方位角'>方位角 — 从正北方向顺时针量到目标方向的角度。 <span class=glossary-ref>（第 3 章：面积公式与应用）<\/span><\/li><li data-term='仰角'>仰角 — 视线在水平线之上的夹角。 <span class=glossary-ref>（第 3 章：面积公式与应用）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：选定理三问<\/h2>\n<p>① 已知的是两角一边还是两边一角？② 角是夹角还是对角？③ 是否可能出现多解？三问定方法。<\/p>\n<h2>框架：测量题四步<\/h2>\n<p>画图定北向 → 标出可测的量 → 选正弦或余弦定理 → 检验结果是否合理。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>正弦定理<\/td><td>a/sinA=b/sinB=c/sinC=2R<\/td><\/tr><tr><td>余弦定理<\/td><td>a²=b²+c²−2bc cosA<\/td><\/tr><tr><td>求角<\/td><td>cosA=(b²+c²−a²)/(2bc)<\/td><\/tr><tr><td>面积<\/td><td>S=(1/2)ab sinC<\/td><\/tr><tr><td>海伦<\/td><td>S=√(p(p−a)(p−b)(p−c))<\/td><\/tr><tr><td>形状<\/td><td>最大边：a²&gt;b²+c² 钝角，=直角，&lt;锐角<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：正弦定理", "href": "#/chapter/ch01"}, {"label": "第 2 章：余弦定理与形状判断", "href": "#/chapter/ch02"}, {"label": "第 3 章：面积公式与应用", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "边角对应", "href": "#/concept/c01"}, {"label": "多解", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：正弦定理", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：余弦定理与形状判断", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：面积公式与应用", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"trigonometry":{"manifest": {"slug": "trigonometry", "title": "三角函数", "subtitle": "把角当成数：从单位圆到波形", "book": {"title": "三角函数", "author": "毛毓球", "source": ["数学基础知识丛书-17-三角函数 毛毓球.pdf"]}, "
