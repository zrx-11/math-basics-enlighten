hapterId": "ch02"}, {"term": "重根", "def": "方程中重复出现的根，对应因式的幂次大于 1。", "chapterId": "ch02"}, {"term": "绝对值不等式", "def": "含 |x| 或 |ax+b| 的不等式，按距离意义转化。", "chapterId": "ch03"}, {"term": "无理不等式", "def": "根号内含有未知数的不等式。", "chapterId": "ch03"}, {"term": "比较法", "def": "作差或作商判断大小的证明方法。", "chapterId": "ch04"}, {"term": "分析法", "def": "从结论出发寻找充分条件的证明方法。", "chapterId": "ch04"}, {"term": "基本不等式", "def": "a²+b²≥2ab；(a+b)/2≥√(ab)（a,b>0）。", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "若 a>b，则下列一定成立的是：", "options": ["a²>b²", "−2a>−2b", "a−3>b−3", "1/a>1/b"], "answer": 2, "explain": "两边同减 3 不变号，C 恒成立。A 在 a=1、b=−2 时不成立；B 应变为 −2a<−2b；D 要求同号。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "解不等式 −3x≥6，解集是：", "options": ["x≥−2", "x≤−2", "x≥2", "x≤2"], "answer": 1, "explain": "两边除以 −3（负数），不等号反向：x≤−2。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "不等式 x²−4x+3<0 的解集是：", "options": ["(1,3)", "(−∞,1)∪(3,+∞)", "[1,3]", "(−3,−1)"], "answer": 0, "explain": "(x−1)(x−3)<0，开口向上，两根之间为负，解集 (1,3)。", "relatedConceptId": "c02", "prerequisites": ["ch02"]}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "不等式 (x−2)²(x+1)>0 的解集是：", "options": ["x>−1", "x>−1 且 x≠2", "x<−1", "全体实数"], "answer": 1, "explain": "x=−1 处穿根、x=2 处偶次不穿；x>−1 且 x≠2 时为正，x=−1 时为零。", "relatedConceptId": "c02", "prerequisites": ["ch02"]}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "不等式 |x−2|<3 的解集是：", "options": ["(−1,5)", "(−5,−1)", "(2,5)", "(−∞,5)"], "answer": 0, "explain": "到 2 的距离小于 3，即 −3<x−2<3，得 −1<x<5。", "relatedConceptId": "", "prerequisites": ["ch03"]}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "解 √(x−1)<2 时，正确的第一步是：", "options": ["两边平方", "移项", "确定定义域 x≥1", "讨论 x 的正负"], "answer": 2, "explain": "根号要求被开方数非负，先得 x≥1；再平方得 x−1<4，即 x<5，合起来 1≤x<5。", "relatedConceptId": "", "prerequisites": ["ch03"]}, {"id": "ch04-q07", "chapterId": "ch04", "type": "single", "question": "用比较法证明 a²+b²≥2ab 时，关键一步是：", "options": ["移项得 a²+b²−2ab≥0", "两边同除 2", "取 a=b=1 验证", "两边开方"], "answer": 0, "explain": "作差后配方得 (a−b)²≥0，这是证明的核心；只代特殊值不算证明。", "relatedConceptId": "", "prerequisites": ["ch04"]}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "对正数 a、b，等号成立的条件是：", "options": ["a=b", "a+b=0", "ab=1", "a=2b"], "answer": 0, "explain": "(a+b)/2≥√(ab) 的等号当且仅当 a=b 时成立。", "relatedConceptId": "", "prerequisites": ["ch04"]}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "不等式 (x−1)(x+2)>0 的解集是：", "options": ["(−2,1)", "(−∞,−2)∪(1,+∞)", "[−2,1]", "(−∞,1)"], "answer": 1, "explain": "开口向上，两根 −2、1 之外为正。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "若 a>b，则下列一定成立的是：", "options": ["a²>b²", "a−c>b−c", "ac>bc", "1/a<1/b"], "answer": 1, "explain": "同减一个数不变号；其余选项在 c 符号不定或 a 为负时不成立。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：不等式的性质与同解变形」的一句话核心是什么？", "back": "不等式只有一条铁律：两边同乘（除）一个负数，不等号方向必须反过来。", "tags": ["inequalities", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：二次不等式与高次不等式」的一句话核心是什么？", "back": "二次不等式的解集由“开口方向 + 零点位置”决定；高次不等式用数轴上的符号变化判断。", "tags": ["inequalities", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：绝对值不等式与无理不等式」的一句话核心是什么？", "back": "绝对值是距离，无理不等式要先保证根号有意义，再平方——两步顺序不能颠倒。", "tags": ["inequalities", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：不等式的证明」的一句话核心是什么？", "back": "证明不等式就是证明“差非负”或“由已知不等式推过来”；分析法从结论倒着找条件。", "tags": ["inequalities", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「同解不等式」？", "back": "解集完全相同的不等式。", "tags": ["inequalities", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「可乘性」？", "back": "两边同乘正数不变号、乘负数变号的性质。", "tags": ["inequalities", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「解集」？", "back": "使不等式成立的所有取值组成的集合。", "tags": ["inequalities", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「穿针引线法」？", "back": "按零点次数在数轴上交替取符号解高次不等式的方法。", "tags": ["inequalities", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「重根」？", "back": "方程中重复出现的根，对应因式的幂次大于 1。", "tags": ["inequalities", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「绝对值不等式」？", "back": "含 |x| 或 |ax+b| 的不等式，按距离意义转化。", "tags": ["inequalities", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「无理不等式」？", "back": "根号内含有未知数的不等式。", "tags": ["inequalities", "术语"]}, {"id": "f12", "chapterId": "ch04", "front": "什么是「比较法」？", "back": "作差或作商判断大小的证明方法。", "tags": ["inequalities", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「分析法」？", "back": "从结论出发寻找充分条件的证明方法。", "tags": ["inequalities", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「基本不等式」？", "back": "a²+b²≥2ab；(a+b)/2≥√(ab)（a,b>0）。", "tags": ["inequalities", "术语"]}], "companion": "inequalities学习伴侣.html", "deriv": "inequalities从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">实数比较大小、四则运算<\/span><\/div><h1>第 1 章：不等式的性质与同解变形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：实数比较大小、四则运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 a−b 的符号判断大小\n<\/li><li>\n正确使用四条基本性质\n<\/li><li>\n判断两个不等式是否同解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>不等式只有一条铁律：两边同乘（除）一个负数，不等号方向必须反过来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 比较大小的本质<\/h3>\n<p>a&gt;b 等价于 a−b&gt;0。所以比较两个数，就是判断它们的差是正、负还是零。这一条把“比大小”变成了“做减法”，是所有不等式证明的起点。<\/p>\n<h3>1.2 四条基本性质<\/h3>\n<ol><li>\n<strong>传递性<\/strong>：a&gt;b、b&gt;c ⇒ a&gt;c；\n<\/li><li>\n<strong>可加性<\/strong>：a&gt;b ⇒ a+c&gt;b+c；\n<\/li><li>\n<strong>可乘性<\/strong>：a&gt;b、c&gt;0 ⇒ ac&gt;bc；a&gt;b、c&lt;0 ⇒ ac&lt;bc（<strong>变号<\/strong>）；\n<\/li><li>\n<strong>倒数<\/strong>：a&gt;b&gt;0 ⇒ 1/a&lt;1/b（正数取倒数要变号）。\n<\/ol>\n<p>可乘性是最容易出错的一条。c 的符号不确定时，不能直接乘，必须分 c&gt;0、c=0、c&lt;0 讨论。<\/p>\n<h3>1.3 同解变形<\/h3>\n<p>同解指两个不等式解集完全相同。允许的操作：<\/p>\n<ul><li>\n移项（两边同加同一个数）；\n<\/li><li>\n两边同乘（除）同一个正数；\n<\/li><li>\n两边同乘（除）同一个负数，同时把不等号反向。\n<\/ul>\n<p>不允许：两边平方（除非确定两边都非负）、两边乘含未知数的式子（符号不定）。<\/p>\n<h3>1.4 一元一次不等式组<\/h3>\n<p>分别解每个不等式，再取交集。画数轴时用实心点表示含端点（≤、≥），空心点表示不含（&lt;、&gt;）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：不等式像一条“分界线”，变形只是把线挪位置；乘负数相当于照镜子，左右顺序整个翻转。<\/p>\n<p><strong>失效边界<\/strong>：镜子比喻只说明方向翻转，不说明大小变化；乘负数后数值大小也变了。<\/p>\n<p><strong>实例<\/strong>：解 −2x+3&gt;7。 两边减 3：−2x&gt;4；两边除以 −2（负数，变号）：x&lt;−2。解集为 (−∞,−2)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 不等式两边可以随便乘同一个式子 —— 实际上 式子的符号未知时不能直接乘；必须讨论正负，或改用移项、通分。\n<\/li><li>\n别以为 乘以负数只是数值变了，方向不变 —— 实际上 负系数会把大小顺序整个翻转，所以必须变号；漏掉就得到相反的解集。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 a&gt;b，则下列一定成立的是：\n<\/li><li>\n解不等式 −3x≥6，解集是：\n<p>A. a²&gt;b² ｜ B. −2a&gt;−2b ｜ C. a−3&gt;b−3 ｜ D. 1/a&gt;1/b <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：两边同减 3 不变号，C 恒成立。A 在 a=1、b=−2 时不成立；B 应变为 −2a&lt;−2b；D 要求同号。 A. x≥−2 ｜ B. x≤−2 ｜ C. x≥2 ｜ D. x≤2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：两边除以 −3（负数），不等号反向：x≤−2。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na&gt;b ⇔ a−b&gt;0\n<\/li><li>\n乘除负数必须变号\n<\/li><li>\n不等式组取交集，实心点含端点\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：不等式的性质与同解变形）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：不等式的性质与同解变形<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>不等式的性质不是新公理，全部可以由“差的正负”推出来。下面把可乘性为什么变号写清楚。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>a&gt;b 指 a−b&gt;0；不等式两边同乘负数后方向反转，是“差”的符号被翻转的结果。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>不等式像天平的倾斜方向；两边同时“取反”（乘 −1），倾斜方向就调个头。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 定义<\/h3>\n<div class=\"katex-block\">a>b\\iff a-b>0<\/div>\n<p>把比较化为差的正负，后面所有性质都从这里出发。<\/p>\n<h3>2. 可加性<\/h3>\n<div class=\"katex-block\">a>b\\ \\Rightarrow\\ (a+c)-(b+c)=a-b>0<\/div>\n<p>两边加同一个数，差不变，所以不等号不变。<\/p>\n<h3>3. 乘正数<\/h3>\n<div class=\"katex-block\">a>b,\\ c>0\\ \\Rightarrow\\ ac-bc=c(a-b)>0<\/div>\n<p>正数乘正差仍为正，方向不变。<\/p>\n<h3>4. 乘负数<\/h3>\n<div class=\"katex-block\">a>b,\\ c<0\\ \\Rightarrow\\ ac-bc=c(a-b)<0\\ \\Rightarrow\\ ac&lt;bc<\/div>\n<p>负数乘正差变成负差，方向反转。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>乘的式子必须是确定的常数；含未知数时符号不定，不能直接乘。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《不等式》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/inequalities/chapter/ch01\">第 1 章：不等式的性质与同解变形<\/a><\/span><\/div><h1>第 2 章：二次不等式与高次不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、因式分解\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用因式分解与符号表解一元二次不等式\n<\/li><li>\n用穿针引线法解高次不等式\n<\/li><li>\n正确处理含参数与重根情形\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>二次不等式的解集由“开口方向 + 零点位置”决定；高次不等式用数轴上的符号变化判断。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 二次不等式的标准解法<\/h3>\n<p>以 ax²+bx+c&gt;0（a&gt;0）为例：<\/p>\n<ol><li>\n求方程 ax²+bx+c=0 的根 x₁&lt;x₂（判别式 Δ）；\n<\/li><li>\n抛物线开口向上，两根之间为负、两根之外为正；\n<\/li><li>\n所以 &gt;0 的解集是 (−∞,x₁)∪(x₂,+∞)，&lt;0 的解集是 (x₁,x₂)。\n<\/ol>\n<p>口诀只是记忆辅助，真正的依据是抛物线图象。<\/p>\n<p>三种特殊情形：<\/p>\n<ul><li>\nΔ=0：抛物线与 x 轴相切，&gt;0 的解集是除顶点外的所有实数，&lt;0 无解；\n<\/li><li>\nΔ&lt;0 且 a&gt;0：整条抛物线在 x 轴上方，&gt;0 恒成立，&lt;0 无解；\n<\/li><li>\na&lt;0：先两边乘 −1 化成正系数，同时变号。\n<\/ul>\n<h3>2.2 高次不等式：穿针引线<\/h3>\n<p>把多项式分解成一次因式的乘积，把所有零点标在数轴上，从最右端开始画曲线，<strong>奇次根穿过、偶次根不穿<\/strong>，按区间符号写出解集。<\/p>\n<p>例：(x−1)(x−2)²(x+1)&gt;0。零点 −1（1 次）、1（1 次）、2（2 次）。曲线在 2 处不穿，在 1、−1 处穿过。<\/p>\n<h3>2.3 含参数要分类<\/h3>\n<p>含参数的二次不等式要按“首项系数是否为 0”“判别式符号”“两根大小”分层讨论，不能只写一种情形。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：符号表像一条“正负交替的带子”，每过一个奇次零点就翻一次面。<\/p>\n<p><strong>失效边界<\/strong>：穿针法要求因式都已分解到一次（或不可约二次）；未分解时零点不全，结论会错。<\/p>\n<p><strong>实例<\/strong>：解 x²−x−6&lt;0。 因式分解 (x−3)(x+2)&lt;0，零点 −2、3，开口向上，两根之间为负，解集 (−2,3)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 二次不等式一定有解 —— 实际上 Δ&lt;0 且开口向上时，&gt;0 恒成立、&lt;0 无解；并非所有形式都有非空解集。\n<\/li><li>\n别以为 重根也要穿过去 —— 实际上 偶次重根两侧符号相同，曲线不穿过，只是相切折返。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n不等式 x²−4x+3&lt;0 的解集是：\n<\/li><li>\n不等式 (x−2)²(x+1)&gt;0 的解集是：\n<p>A. (1,3) ｜ B. (−∞,1)∪(3,+∞) ｜ C. [1,3] ｜ D. (−3,−1) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：(x−1)(x−3)&lt;0，开口向上，两根之间为负，解集 (1,3)。 A. x&gt;−1 ｜ B. x&gt;−1 且 x≠2 ｜ C. x&lt;−1 ｜ D. 全体实数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：x=−1 处穿根、x=2 处偶次不穿；x&gt;−1 且 x≠2 时为正，x=−1 时为零。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二次不等式看开口与零点：开口向上，两根之外为正\n<\/li><li>\n高次不等式：奇穿偶不穿\n<\/li><li>\n含参数按首项系数、判别式、根大小分层\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：二次不等式与高次不等式）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：二次不等式与高次不等式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>二次不等式的解集不是背出来的，是从抛物线图象读出来的。下面把“开口 + 零点”写成符号表。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>二次不等式指形如 ax²+bx+c&gt;0（或 &lt;0、≥0、≤0）的不等式，a≠0。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>抛物线像一座拱桥：桥面在 x 轴上方的部分，就是 &gt;0 的解集。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 求零点<\/h3>\n<div class=\"katex-block\">ax^{2}+bx+c=0\\ \\Rightarrow\\ x_{1,2}=\\frac{-b\\pm\\sqrt{\\Delta}}{2a}<\/div>\n<p>零点把数轴分成若干段，每段符号恒定。<\/p>\n<h3>2. 符号表<\/h3>\n<div class=\"katex-block\">a>0,\\ x&lt;x_{1}\\ \\text{或}\\ x>x_{2}\\ \\Rightarrow\\ ax^{2}+bx+c>0<\/div>\n<p>开口向上时，两根之外为正、两根之间为负。<\/p>\n<h3>3. 重根<\/h3>\n<div class=\"katex-block\">\\Delta=0\\ \\Rightarrow\\ ax^{2}+bx+c=a(x-x_{0})^{2}\\ge 0<\/div>\n<p>重根处只是相切，符号不翻转。<\/p>\n<h3>4. 高次穿针<\/h3>\n<div class=\"katex-block\">(x-x_{1})^{m_1}\\cdots(x-x_{k})^{m_k}<\/div>\n<p>奇次幂的零点穿过，偶次幂的零点不穿，从最右段开始定符号。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>若 a&lt;0，桥是倒扣的，先乘 −1 转正再判断；重根时桥与轴相切，不跨越。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《不等式》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/inequalities/chapter/ch02\">第 2 章：二次不等式与高次不等式<\/a><\/span><\/div><h1>第 3 章：绝对值不等式与无理不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用几何意义解 |x| 型不等式\n<\/li><li>\n解 |ax+b|&lt;c、&gt;c 两类\n<\/li><li>\n先定定义域再解无理不等式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>绝对值是距离，无理不等式要先保证根号有意义，再平方——两步顺序不能颠倒。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 绝对值的几何意义<\/h3>\n<p>|x| 表示数轴上 x 到原点的距离。于是：<\/p>\n<ul><li>\n|x|&lt;a（a&gt;0）⇔ −a&lt;x&lt;a；\n<\/li><li>\n|x|&gt;a（a&gt;0）⇔ x&lt;−a 或 x&gt;a。\n<\/ul>\n<p>把 x 换成 x−c，就是“到 c 的距离”。<\/p>\n<h3>3.2 一般形式<\/h3>\n<p>|ax+b|&lt;c（c&gt;0）⇔ −c&lt;ax+b&lt;c；<\/p>\n<p>|ax+b|&gt;c（c&gt;0）⇔ ax+b&lt;−c 或 ax+b&gt;c。<\/p>\n<p>c≤0 时要单独看：|…|&lt;c 无解，|…|&gt;c 对使式子有意义的 x 恒成立（c&lt;0）或需排除零点（c=0）。<\/p>\n<h3>3.3 无理不等式的两步<\/h3>\n<p>第一步：定定义域（偶次根号下非负）。 第二步：两边平方，但只有在两边都非负时才等价。<\/p>\n<p>例：√(x+2)&lt;x。 定义域 x≥−2；右边要求 x&gt;0 才能平方（否则负数小于正根号一定成立，直接给出解）。 平方得 x+2&lt;x²，即 x²−x−2&gt;0，x&gt;2 或 x&lt;−1。结合 x&gt;0 与 x≥−2，得 x&gt;2。 还要单独检查 x∈[−2,0]：此时右边 ≤0，左边 ≥0，不等式不成立，故无解。合起来解集 (2,+∞)。<\/p>\n<h3>3.4 常见结构<\/h3>\n<ul><li>\n√A &lt; B：需要 B&gt;0 且 A&lt;B²，同时 A≥0；\n<\/li><li>\n√A &gt; B：分 B&lt;0（只需 A≥0）与 B≥0（A&gt;B²）两种。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：绝对值像“到某地的距离”，无理不等式像“先确认尺子能量，再比长度”。<\/p>\n<p><strong>失效边界<\/strong>：平方只保“非负”的大小关系；两边符号不明时平方会引入错误解。<\/p>\n<p><strong>实例<\/strong>：解 |2x−1|≤5。 −5≤2x−1≤5 ⇒ −4≤2x≤6 ⇒ −2≤x≤3。解集 [−2,3]。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 |x|&gt;a 就是 x&gt;a —— 实际上 漏了 x&lt;−a 这一支。绝对值大，可能是“很正的”也可能是“很负的”。\n<\/li><li>\n别以为 无理不等式直接平方就行 —— 实际上 必须先定定义域，并确认两边非负；否则平方会引入不满足原式的解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n不等式 |x−2|&lt;3 的解集是：\n<\/li><li>\n解 √(x−1)&lt;2 时，正确的第一步是：\n<p>A. (−1,5) ｜ B. (−5,−1) ｜ C. (2,5) ｜ D. (−∞,5) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：到 2 的距离小于 3，即 −3&lt;x−2&lt;3，得 −1&lt;x&lt;5。 A. 两边平方 ｜ B. 移项 ｜ C. 确定定义域 x≥1 ｜ D. 讨论 x 的正负 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：根号要求被开方数非负，先得 x≥1；再平方得 x−1&lt;4，即 x&lt;5，合起来 1≤x&lt;5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n|x−c|&lt;a ⇔ c−a&lt;x&lt;c+a\n<\/li><li>\n无理不等式：先定义域，再判断两边非负，最后平方\n<\/li><li>\n√A&lt;B 需 B&gt;0 且 A&lt;B²\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：绝对值不等式与无理不等式）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：绝对值不等式与无理不等式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>绝对值是距离，无理式是长度；两类不等式的共同点是“先弄清什么范围内式子有意义”。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>|x| 表示 x 到原点的距离；无理不等式指含根号且根号内有未知数的不等式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>绝对值像问“离车站多远”，不问方向；无理不等式像先确认尺子能测量，再比较长短。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 绝对值基本型<\/h3>\n<div class=\"katex-block\">|x|&lt;a\\iff -a&lt;x&lt;a\\quad(a>0)<\/div>\n<p>距离小于 a，就是落在 −a 与 a 之间。<\/p>\n<h3>2. 补集型<\/h3>\n<div class=\"katex-block\">|x|>a\\iff x<-a\\ \\text{或}\\ x>a<\/div>\n<p>距离大于 a，向两边各跑出去一支。<\/p>\n<h3>3. 无理式定义域<\/h3>\n<div class=\"katex-block\">\\sqrt{A(x)}\\ \\text{有意义}\\iff A(x)\\ge 0<\/div>\n<p>这是所有无理不等式的第一步，先于任何变形。<\/p>\n<h3>4. 平方的条件<\/h3>\n<div class=\"katex-block\">\\sqrt{A}&lt;B\\iff B>0\\ \\text{且}\\ A&lt;B^{2}\\ (A\\ge 0)<\/div>\n<p>右边为负时不等式不可能成立，不需平方。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>平方等价只在两边非负时成立；否则要把负的一支单独讨论。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《不等式》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch04": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/inequalities/chapter/ch03\">第 3 章：绝对值不等式与无理不等式<\/a><\/span><\/div><h1>第 4 章：不等式的证明<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用比较法（作差、作商）证明不等式\n<\/li><li>\n用综合法与分析法各写一段完整推理\n<\/li><li>\n正确使用基本不等式并说明等号条件\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>证明不等式就是证明“差非负”或“由已知不等式推过来”；分析法从结论倒着找条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 比较法<\/h3>\n<p>要证 A≥B，作差 A−B，证明它非负（配方、因式分解、判别式）。要证 A≥B&gt;0，也可作商 A/B 与 1 比较。<\/p>\n<p>例：证 a²+b²≥2ab。作差：a²−2ab+b²=(a−b)²≥0，等号当且仅当 a=b。<\/p>\n<h3>4.2 综合法<\/h3>\n<p>从已知成立的不等式出发，按“由因导果”的顺序推到结论。常用已知：基本不等式、|a|+|b|≥|a+b|、均值不等式。<\/p>\n<h3>4.3 分析法<\/h3>\n<p>从结论出发，寻找使它成立的充分条件，一直追到已知事实。书写时常用“要证……只需证……”，每一步都必须可逆或充分。<\/p>\n<p>例：证 √2+√7&lt;√3+√6。两边平方后比较 9+2√14 与 9+2√18，只需证 √14&lt;√18，显然成立。<\/p>\n<h3>4.4 基本不等式与等号条件<\/h3>\n<p>a²+b²≥2ab 对一切实数成立，等号当 a=b。<\/p>\n<p>对正数 a、b，有 (a+b)/2≥√(ab)，等号当 a=b。使用时必须确认 a、b 为正，并检查等号能否取到——取不到时只能得到严格不等式。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：比较法是“称重量”，综合法是“顺着链条推”，分析法是“从终点倒着找路”。<\/p>\n<p><strong>失效边界<\/strong>：分析法每步必须充分；把“只需”写成“等价”而不检查可逆，会证出假命题。<\/p>\n<p><strong>实例<\/strong>：证 对任意实数 x，x²+2x+3&gt;0。 配方：x²+2x+3=(x+1)²+2≥2&gt;0。等号取不到，故严格成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 用基本不等式不用检查等号条件 —— 实际上 等号条件决定不等式能否取到等值；取不到时结论仍是严格不等，但最值结论会变。\n<\/li><li>\n别以为 分析法可以随便写“只需证” —— 实际上 每一步必须真的充分；写成不充分的条件等于没有证明。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用比较法证明 a²+b²≥2ab 时，关键一步是：\n<\/li><li>\n对正数 a、b，等号成立的条件是：\n<p>A. 移项得 a²+b²−2ab≥0 ｜ B. 两边同除 2 ｜ C. 取 a=b=1 验证 ｜ D. 两边开方 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：作差后配方得 (a−b)²≥0，这是证明的核心；只代特殊值不算证明。 A. a=b ｜ B. a+b=0 ｜ C. ab=1 ｜ D. a=2b <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：(a+b)/2≥√(ab) 的等号当且仅当 a=b 时成立。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n比较法：作差判符号（可配方、因式分解）\n<\/li><li>\n分析法：从结论找充分条件，每步须充分\n<\/li><li>\n基本不等式使用前先确认正数与等号条件\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：不等式的证明）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：不等式的证明<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>证明不等式的全部工具只有两类：把差变成显然非负的东西，或把已知不等式当积木搭上去。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>证明 A≥B 成立，即证明 A−B≥0 对范围内一切取值成立。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>比较法像把两堆货物放上天平，看指针偏向哪边；配方法就是把货物摆成一看就知道哪边重。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 比较法<\/h3>\n<div class=\"katex-block\">A\\ge B\\iff A-B\\ge 0<\/div>\n<p>证明不等式就是证明差非负，形式与解不等式一致。<\/p>\n<h3>2. 配方<\/h3>\n<div class=\"katex-block\">a^{2}+b^{2}-2ab=(a-b)^{2}\\ge 0<\/div>\n<p>把差写成完全平方，非负性一目了然，等号当 a=b。<\/p>\n<h3>3. 基本不等式<\/h3>\n<div class=\"katex-block\">\\frac{a+b}{2}\\ge\\sqrt{ab}\\quad(a,b>0)<\/div>\n<p>由 (√a−√b)²≥0 推出，等号当 a=b。<\/p>\n<h3>4. 分析法<\/h3>\n<div class=\"katex-block\">\\text{要证 }P\\ \\Leftarrow\\ \\text{只需 }Q,\\ Q\\ \\text{已知成立}<\/div>\n<p>从结论倒推充分条件，书写时每步都要真的充分。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>配方、因式分解只在实系数范围内可靠；涉及复数时“非负”失去意义。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《不等式》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/inequalities/chapter/ch01\">第 1 章：不等式的性质与同解变形<\/a><\/span><\/div><h1>同解变形与变号<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>两边同乘负数，不等号反向；这一步错，整道题的解集就反了。<\/p>\n<h2>为什么重要<\/h2>\n<p>不等式解法全部由同解变形组成，变号是最容易出错也最容易检查的一步。<\/p>\n<h2>详解<\/h2>\n<p>允许的同解操作：移项、同乘除正数、同乘除负数并变号。禁止的操作：两边平方（除确定非负）、乘含未知数且符号不定的式子。检查办法：把解集端点代回原不等式，看是否恰好取到边界。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“乘以 −1 只是把式子反过来写”，忘了同时要变号。<\/p>\n<h2>相关概念<\/h2>\n<p>基本性质（ch01）、绝对值不等式（ch03）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/inequalities/chapter/ch02\">第 2 章：二次不等式与高次不等式<\/a><\/span><\/div><h1>符号表与穿针引线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把零点排在数轴上，按因式的次数决定穿或不穿，每一段的符号就定了。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是解二次、高次不等式的通用方法，比背口诀可靠。<\/p>\n<h2>详解<\/h2>\n<p>步骤：分解到一次因式 → 标零点 → 从最右段取一个测试点定符号 → 按奇穿偶不穿依次翻面 → 按不等号方向取区间。含参数时额外讨论首项系数与重根。<\/p>\n<h2>常见误解<\/h2>\n<p>把偶次重根也当穿过点，导致区间符号整体错位。<\/p>\n<h2>相关概念<\/h2>\n<p>二次不等式（ch02）、因式分解（《整式》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：性质与同解变形<\/strong><br>阅读：<a href=\"#/book/inequalities/chapter/ch01\">第 1 章：不等式的性质与同解变形<\/a><br>检查点：能说明两边乘负数为什么要变号<\/li><li class='path-step' id='path-02'><strong>步骤 02：二次与高次不等式<\/strong><br>阅读：<a href=\"#/book/inequalities/chapter/ch02\">第 2 章：二次不等式与高次不等式<\/a><br>检查点：能用符号表写出解集<\/li><li class='path-step' id='path-03'><strong>步骤 03：绝对值与无理不等式<\/strong><br>阅读：<a href=\"#/book/inequalities/chapter/ch03\">第 3 章：绝对值不等式与无理不等式<\/a><br>检查点：能先定定义域再解无理不等式<\/li><li class='path-step' id='path-04'><strong>步骤 04：不等式的证明<\/strong><br>阅读：<a href=\"#/book/inequalities/chapter/ch04\">第 4 章：不等式的证明<\/a><br>检查点：能用比较法与综合法各证一题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：不等式的性质与同解变形<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 若 a&gt;b，则下列一定成立的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> a²&gt;b²<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> −2a&gt;−2b<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> a−3&gt;b−3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 1/a&gt;1/b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 解不等式 −3x≥6，解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> x≥−2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> x≤−2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> x≥2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> x≤2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：二次不等式与高次不等式<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 不等式 x²−4x+3&lt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> (1,3)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> (−∞,1)∪(3,+∞)<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> [1,3]<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> (−3,−1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 不等式 (x−2)²(x+1)&gt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> x&gt;−1<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> x&gt;−1 且 x≠2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> x&lt;−1<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 全体实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：绝对值不等式与无理不等式<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 不等式 |x−2|&lt;3 的解集是：< 认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='同解不等式'>同解不等式 — 解集完全相同的不等式。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='可乘性'>可乘性 — 两边同乘正数不变号、乘负数变号的性质。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='解集'>解集 — 使不等式成立的所有取值组成的集合。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='穿针引线法'>穿针引线法 — 按零点次数在数轴上交替取符号解高次不等式的方法。 <span class=glossary-ref>（第 2 章：二次不等式与高次不等式）<\/span><\/li><li data-term='重根'>重根 — 方程中重复出现的根，对应因式的幂次大于 1。 <span class=glossary-ref>（第 2 章：二次不等式与高次不等式）<\/span><\/li><li data-term='绝对值不等式'>绝对值不等式 — 含 |x| 或 |ax+b| 的不等式，按距离意义转化。 <span class=glossary-ref>（第 3 章：绝对值不等式与无理不等式）<\/span><\/li><li data-term='无理不等式'>无理不等式 — 根号内含有未知数的不等式。 <span class=glossary-ref>（第 3 章：绝对值不等式与无理不等式）<\/span><\/li><li data-term='比较法'>比较法 — 作差或作商判断大小的证明方法。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><li data-term='分析法'>分析法 — 从结论出发寻找充分条件的证明方法。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><li data-term='基本不等式'>基本不等式 — a²+b²≥2ab；(a+b)/2≥√(ab)（a,b&gt;0）。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：解不等式的四步<\/h2>\n<p>① 定定义域；② 移项整理成标准形；③ 求零点、画符号表；④ 按不等号方向取区间并检查端点。<\/p>\n<h2>框架：证明的三选一<\/h2>\n<p>结构简单作差；已知不等式多则综合；结论复杂则分析。选错方法会绕远路。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>乘负数<\/td><td>不等号反向<\/td><\/tr><tr><td>二次不等式 a&gt;0<\/td><td>&gt;0 取两根之外，&lt;0 取两根之间<\/td><\/tr><tr><td>高次不等式<\/td><td>奇穿偶不穿，从最右段定符号<\/td><\/tr><tr><td>绝对值<\/td><td><\/td><td>x<\/td><td>&lt;a ⇔ −a&lt;x&lt;a；<\/td><td>x<\/td><td>&gt;a 它与 y 轴的交点。", "tags": ["linear-quadratic-functions", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：二次函数与变化率」的一句话核心是什么？", "back": "二次函数的一切都藏在顶点式 y=a(x−h)²+k 里：a 定开口，顶点 (h,k) 定最值。", "tags": ["linear-quadratic-functions", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「函数」？", "back": "一个输入对应唯一输出的规则。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「定义域」？", "back": "允许输入的所有取值组成的集合。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「值域」？", "back": "所有实际输出组成的集合。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「增函数」？", "back": "x 增大时 y 也增大的函数。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「斜率」？", "back": "一次函数 y=kx+b 中的 k，反映倾斜与增减。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「截距」？", "back": "图象与 y 轴交点的纵坐标 b。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「顶点式」？", "back": "y=a(x−h)²+k 的形式，直接读出顶点。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「对称轴」？", "back": "抛物线关于它左右对称的竖直线 x=−b/2a。", "tags": ["linear-quadratic-functions", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「平均变化率」？", "back": "区间两端函数值之差与自变量之差的比。", "tags": ["linear-quadratic-functions", "术语"]}], "companion": "linear-quadratic-functions学习伴侣.html", "deriv": "linear-quadratic-functions从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-06-一次函数与二次函数 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">坐标平面、方程<\/span><\/div><h1>第 1 章：函数与图象<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：坐标平面、方程\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出函数三要素\n<\/li><li>\n用解析式、表格、图象表示同一个函数\n<\/li><li>\n从图象读出增减与最值\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>函数不是公式，是一条规则：给定输入，唯一确定输出。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 对应关系<\/h3>\n<p>设 x 在某个范围内每取一个值，按规则 f 都有唯一确定的 y 与之对应，就说 y 是 x 的函数，记 y=f(x)。x 的取值范围叫<strong>定义域<\/strong>，所有输出组成的集合叫<strong>值域<\/strong>。<\/p>\n<p>关键是“唯一”：一个输入不能对应两个输出。圆的方程 x²+y²=1 中，x=0 对应 y=±1，所以 y 不是 x 的函数。<\/p>\n<h3>1.2 三种表示<\/h3>\n<ul><li>\n解析式：y=2x+1；\n<\/li><li>\n表格：把若干组对应值列出来；\n<\/li><li>\n图象：把满足关系的点画在坐标平面上。\n<\/ul>\n<p>三种表示可以互相转换，考试里常要求“由式画图、由图读式”。<\/p>\n<h3>1.3 从图象读信息<\/h3>\n<p>图象上升表示随 x 增大 y 增大（增函数），下降表示减函数；最高点、最低点对应最大值、最小值；与 x 轴的交点是零点（f(x)=0 的解）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：函数像自动售货机：投一个编号，只出一个确定的商品。<\/p>\n<p><strong>失效边界<\/strong>：若一台机器投同一个编号会随机出不同商品，那就不是函数。<\/p>\n<p><strong>实例<\/strong>：f(x)=x²，定义域取 [−2,2]。输入 −2 得 4，输入 0 得 0，输入 2 得 4。值域是 [0,4]，不是 [−2,2]。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 函数必须有解析式 —— 实际上 表格、图象、甚至一句描述规则都可以定义函数，解析式只是最方便的一种。\n<\/li><li>\n别以为 值域就是把定义域代进去得到的那些数 —— 实际上 要把定义域内所有输入都考虑，取遍后得到的输出集合才是值域。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列关系中，y 是 x 的函数的是：\n<\/li><li>\nf(x)=x² 在 [−1,2] 上的值域是：\n<p>A. x²+y²=1 ｜ B. y²=x ｜ C. y=2x+1 ｜ D. |y|=x <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：其余三个都出现一个 x 对应两个 y 的情况，不满足唯一性。 A. [1,4] ｜ B. [0,4] ｜ C. [0,1] ｜ D. [−1,4] <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：x=0 时取到最小值 0，x=2 时取到最大值 4，故值域 [0,4]。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n函数＝唯一对应的规则；三要素是定义域、法则、值域\n<\/li><li>\n解析式、表格、图象可以互相转换\n<\/li><li>\n图象上升/下降对应增减，交点对应零点\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：函数与图象）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：函数与图象<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>函数的概念只有一句话：一个输入，唯一输出。剩下的一切——定义域、图象、增减——都从这句话长出来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>设 x 在集合 D 中每取一值，按规则 f 有唯一 y 对应，则称 y=f(x) 为函数，D 为定义域。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像查字典：给一个词条（输入），只得到一个解释（输出），不会同时给两个。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 函数记号<\/h3>\n<div class=\"katex-block\">y=f(x),\\ x\\in D<\/div>\n<p>f 是规则，D 是允许的输入范围。<\/p>\n<h3>2. 唯一性<\/h3>\n<div class=\"katex-block\">x_{1}=x_{2}\\ \\Rightarrow\\ f(x_{1})=f(x_{2})<\/div>\n<p>同一个输入不能给出两个不同输出，这是函数的底线。<\/p>\n<h3>3. 增函数<\/h3>\n<div class=\"katex-block\">x_{1}&lt;x_{2}\\ \\Rightarrow\\ f(x_{1})&lt;f(x_{2})<\/div>\n<p>图象从左到右上升，就是增函数。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>“唯一”是对输入而言；不同输入可以对应同一个输出，这不违反函数定义。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《一次函数与二次函数》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-06-一次函数与二次函数 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/linear-quadratic-functions/chapter/ch01\">第 1 章：函数与图象<\/a><\/span><\/div><h1>第 2 章：一次函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n由 k、b 判断图象位置与增减\n<\/li><li>\n求一次函数的零点与解析式\n<\/li><li>\n用一次函数建模\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>一次函数 y=kx+b 的变化率恒为 k：k 正则升，k 负则降，b 是它与 y 轴的交点。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 k 与 b 的作用<\/h3>\n<p>k 叫斜率，决定直线的倾斜程度与方向：k&gt;0 时 y 随 x 增大而增大；k&lt;0 时减小；k=0 时退化为水平直线 y=b。<\/p>\n<p>b 是截距：图象过点 (0,b)。<\/p>\n<h3>2.2 由两点求解析式<\/h3>\n<p>设 y=kx+b，把两点坐标代入，解出 k、b。也可先用 k=(y₂−y₁)/(x₂−x₁) 求斜率，再代一点求 b。<\/p>\n<h3>2.3 零点与不等式<\/h3>\n<p>零点即 kx+b=0 的解 x=−b/k（k≠0）。由零点和 k 的符号可以直接读出 kx+b&gt;0 的解集，不必每次重算。<\/p>\n<h3>2.4 一次函数模型<\/h3>\n<p>凡“每增加一个单位，总量增加固定值”的关系都是一次的：匀速路程 s=vt、计价 y=kx+b、摄氏与华氏换算。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：一次函数像匀速行走，每小时走的距离一样，图象是笔直的路线。<\/p>\n<p><strong>失效边界<\/strong>：实际问题的定义域常受限制（人数、时间不能为负），直线要截成一段。<\/p>\n<p><strong>实例<\/strong>：y=−2x+6。k=−2&lt;0，随 x 增大而减小；过 (0,6)；零点 x=3；所以 y&gt;0 当 x&lt;3。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 b 是直线与 x 轴的交点 —— 实际上 b 是与 y 轴交点的纵坐标；与 x 轴的交点是 −b/k。\n<\/li><li>\n别以为 k 越大直线越陡 —— 实际上 陡峭程度看 |k|；k=−5 比 k=1 更陡，但方向相反。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n一次函数 y=3x−6 的零点是：\n<\/li><li>\n若一次函数 y=kx+b 的图象经过第一、二、四象限，则：\n<p>A. x=−2 ｜ B. x=2 ｜ C. x=6 ｜ D. x=3 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：3x−6=0 得 x=2。 A. k&gt;0，b&gt;0 ｜ B. k&lt;0，b&gt;0 ｜ C. k&lt;0，b&lt;0 ｜ D. k&gt;0，b&lt;0 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：直线下降说明 k&lt;0；与 y 轴交于正半轴说明 b&gt;0。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ny=kx+b：k 定方向与增减，b 定 y 轴截距\n<\/li><li>\n零点 x=−b/k\n<\/li><li>\n两点定一条直线\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：一次函数）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：一次函数<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>一次函数是最简单的“匀速变化”，它的全部性质都能从 k、b 两个数读出来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>形如 y=kx+b（k≠0）的函数叫一次函数，k 为斜率，b 为截距。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像按小时计费：每小时固定收 k 元，另有一笔起步价 b。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 斜率<\/h3>\n<div class=\"katex-block\">k=\\frac{y_{2}-y_{1}}{x_{2}-x_{1}}<\/div>\n<p>两点纵坐标差除以横坐标差，反映“每走一格升多少”。<\/p>\n<h3>2. 增减<\/h3>\n<div class=\"katex-block\">k>0\\Rightarrow\\text{增};\\quad k<0\\Rightarrow\\text{减}<\/div>\n<p>斜率为正，图象上升；为负，图象下降。<\/p>\n<h3>3. 零点<\/h3>\n<div class=\"katex-block\">kx+b=0\\ \\Rightarrow\\ x=-\\frac{b}{k}<\/div>\n<p>与 x 轴交点的横坐标，也是 kx+b 变号的临界点。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>k=0 时不是一次函数，而是常数函数，图象是水平线。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《一次函数与二次函数》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-06-一次函数与二次函数 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/linear-quadratic-functions/chapter/ch02\">第 2 章：一次函数<\/a><\/span><\/div><h1>第 3 章：二次函数与变化率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、配方\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把二次函数化成顶点式并读出顶点、对称轴\n<\/li><li>\n求给定区间上的最值\n<\/li><li>\n区分平均变化率与瞬时变化率\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>二次函数的一切都藏在顶点式 y=a(x−h)²+k 里：a 定开口，顶点 (h,k) 定最值。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 配方成顶点式<\/h3>\n<p>y=ax²+bx+c=a(x+b/2a)²+(4ac−b²)/4a。顶点 (−b/2a, (4ac−b²)/4a)，对称轴 x=−b/2a。<\/p>\n<h3>3.2 开口与最值<\/h3>\n<p>a&gt;0 开口向上，顶点是最小值点；a&lt;0 开口向下，顶点是最大值点。顶点值就是全局最值。<\/p>\n<p>但若定义域被限制在某个区间，要看顶点是否落在区间内：不在，最值在端点取到。<\/p>\n<h3>3.3 零点<\/h3>\n<p>ax²+bx+c=0 的根就是图象与 x 轴的交点，判别式 Δ 决定交点个数。因式分解 a(x−x₁)(x−x₂) 与图象一一对应。<\/p>\n<h3>3.4 变化率<\/h3>\n<p><strong>平均变化率<\/strong>：区间 [x₁,x₂] 上 (f(x₂)−f(x₁))/(x₂−x₁)，几何上是割线斜率。一次函数的平均变化率恒等于 k；二次函数的平均变化率随区间变化。<\/p>\n<p><strong>瞬时变化率<\/strong>：区间缩到一点时的极限值，几何上是切线斜率——这是后面微积分的入口。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：抛物线像喷泉的水柱，顶点是最高点；开口方向就是水柱朝上还是朝下。<\/p>\n<p><strong>失效边界<\/strong>：顶点最值只在定义域包含顶点时成立；区间外的情形要比较端点。<\/p>\n<p><strong>实例<\/strong>：y=x²−4x+1=(x−2)²−3。顶点 (2,−3)，对称轴 x=2，最小值 −3。 若限制 x∈[3,5]，顶点不在区间内，函数在区间上递增，最小值 f(3)=−2，最大值 f(5)=6。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 最小值一定是顶点值 —— 实际上 只有顶点落在定义域内才是；闭区间上要在顶点与端点之间比较。\n<\/li><li>\n别以为 二次函数的变化率也是常数 —— 实际上 只有一次函数的变化率恒定；二次函数的平均变化率随区间改变。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny=x²−6x+5 的顶点坐标是：\n<\/li><li>\ny=−x²+2x+3 的最大值是：\n<p>A. (3,−4) ｜ B. (−3,−4) ｜ C. (3,4) ｜ D. (3,−5) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：配方 y=(x−3)²−4，顶点 (3,−4)。 A. 3 ｜ B. 4 ｜ C. −4 ｜ D. 2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：y=−(x−1)²+4，开口向下，x=1 时取最大值 4。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n顶点式 y=a(x−h)²+k：a 定开口，顶点定最值\n<\/li><li>\n闭区间最值要比较顶点与端点\n<\/li><li>\n平均变化率＝割线斜率，瞬时变化率＝切线斜率\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：二次函数与变化率）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：二次函数与变化率<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>二次函数的所有性质可以从一个配方动作推完：把一般式变成顶点式，顶点、对称轴、最值就都露出来了。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>形如 y=ax²+bx+c（a≠0）的函数叫二次函数，图象是抛物线。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>抛物线像抛出的球：上升时越走越慢，到顶点停一下再下落，变化快慢一直在变。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 配方<\/h3>\n<div class=\"katex-block\">ax^{2}+bx+c=a\\left(x+\\frac{b}{2a}\\right)^{2}+\\frac{4ac-b^{2}}{4a}<\/div>\n<p>把一般式变成顶点式，括号里的常数就是对称轴。<\/p>\n<h3>2. 顶点与最值<\/h3>\n<div class=\"katex-block\">\\left(-\\frac{b}{2a},\\ \\frac{4ac-b^{2}}{4a}\\right)<\/div>\n<p>a&gt;0 时这是最小值点，a&lt;0 时是最大值点。<\/p>\n<h3>3. 平均变化率<\/h3>\n<div class=\"katex-block\">\\frac{f(x_{2})-f(x_{1})}{x_{2}-x_{1}}=a(x_{1}+x_{2})+b<\/div>\n<p>二次函数的平均变化率依赖区间位置，不是常数。<\/p>\n<h3>4. 瞬时变化率<\/h3>\n<div class=\"katex-block\">\\lim_{x_{2}\\to x_{1}}\\frac{f(x_{2})-f(x_{1})}{x_{2}-x_{1}}=2ax_{1}+b<\/div>\n<p>区间缩到一点得到切线斜率，这是导数的雏形。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>定义域受限时顶点可能取不到；此时最值在端点，不能套公式。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《一次函数与二次函数》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-06-一次函数与二次函数 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/linear-quadratic-functions/chapter/ch01\">第 1 章：函数与图象<\/a><\/span><\/div><h1>函数三要素<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>定义域、对应法则、值域，三者确定一个函数；前两个定了，第三个就定了。<\/p>\n<h2>为什么重要<\/h2>\n<p>判断两个函数是否相同、求值域、画图象，都要先回到三要素。<\/p>\n<h2>详解<\/h2>\n<p>定义域是允许输入的集合；对应法则是输入到输出的规则；值域是实际输出的集合。定义域与法则相同才算同一个函数，解析式长得不一样也可能相等（如 y=x 与 y=x²/x，x≠0）。<\/p>\n<h2>常见误解<\/h2>\n<p>以为解析式相同就是同一个函数，忽略定义域可能被约分改变。<\/p>\n<h2>相关概念<\/h2>\n<p>函数与图象（ch01）、定义域（《分式与根式》）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-06-一次函数与二次函数 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/linear-quadratic-functions/chapter/ch02\">第 2 章：一次函数<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/linear-quadratic-functions/chapter/ch03\">第 3 章：二次函数与变化率<\/a><\/span><\/div><h1>变化率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>平均变化率是两个点之间的“平均速度”，瞬时变化率是某一点的“瞬间速度”。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是微积分的入口：导数就是瞬时变化率。<\/p>\n<h2>详解<\/h2>\n<p>一次函数的平均变化率恒为 k，所以“匀速”；二次函数的平均变化率随区间改变，所以“变速”。把区间不断缩小，平均变化率趋于一个确定值，就是瞬时变化率。<\/p>\n<h2>常见误解<\/h2>\n<p>把平均变化率当成某一点的变化快慢；它描述的是一整段区间。<\/p>\n<h2>相关概念<\/h2>\n<p>一次函数（ch02）、导数（《微积分初步》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：函数与图象<\/strong><br>阅读：<a href=\"#/book/linear-quadratic-functions/chapter/ch01\">第 1 章：函数与图象<\/a><br>检查点：能由一个对应关系写出定义域并画出草图<\/li><li class='path-step' id='path-02'><strong>步骤 02：一次函数<\/strong><br>阅读：<a href=\"#/book/linear-quadratic-functions/chapter/ch02\">第 2 章：一次函数<\/a><br>检查点：能由 k、b 判断增减与截距<\/li><li class='path-step' id='path-03'><strong>步骤 03：二次函数与变化率<\/strong><br>阅读：<a href=\"#/book/linear-quadratic-functions/chapter/ch03\">第 3 章：二次函数与变化率<\/a><br>检查点：能求顶点、最值、零点并解释变化率<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：函数与图象<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 下列关系中，y 是 x 的函数的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> x²+y²=1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> y²=x<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> y=2x+1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> |y|=x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> f(x)=x² 在 [−1,2] 上的值域是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value=' ass='quiz-opt'><input type='radio' name='q08' value='0'> 增大<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 减小<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 不变<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 先增后减<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：函数与图象<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 下列关系中，y 是 x 的函数的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> x²+y²=1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> y²=x<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> y=2x+1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> |y|=x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> f(x)=x² 在 [−1,2] 上的值域是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> [1,4]<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> [0,4]<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> [0,1]<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> [−1,4]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：一次函数<\/h1><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 一次函数 y=3x−6 的零点是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> x=−2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> x=2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> x=6<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> x=3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 若一次函数 y=kx+b 的图象经过第一、二、四象限，则：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> k&gt;0，b&gt;0<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> k&lt;0，b&gt;0<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> k&lt;0，b&lt;0<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> k&gt;0，b&lt;0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：二次函数与变化率<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> y=x²−6x+5 的顶点坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> (3,−4)<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> (−3,−4)<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> (3,4)<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> (3,−5)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> y=−x²+2x+3 的最大值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> −4<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='函数'>函数 — 一个输入对应唯一输出的规则。 <span class=glossary-ref>（第 1 章：函数与图象）<\/span><\/li><li data-term='定义域'>定义域 — 允许输入的所有取值组成的集合。 <span class=glossary-ref>（第 1 章：函数与图象）<\/span><\/li><li data-term='值域'>值域 — 所有实际输出组成的集合。 <span class=glossary-ref>（第 1 章：函数与图象）<\/span><\/li><li data-term='增函数'>增函数 — x 增大时 y 也增大的函数。 <span class=glossary-ref>（第 1 章：函数与图象）<\/span><\/li><li data-term='斜率'>斜率 — 一次函数 y=kx+b 中的 k，反映倾斜与增减。 <span class=glossary-ref>（第 2 章：一次函数）<\/span><\/li><li data-term='截距'>截距 — 图象与 y 轴交点的纵坐标 b。 <span class=glossary-ref>（第 2 章：一次函数）<\/span><\/li><li data-term='顶点式'>顶点式 — y=a(x−h)²+k 的形式，直接读出顶点。 <span class=glossary-ref>（第 3 章：二次函数与变化率）<\/span><\/li><li data-term='对称轴'>对称轴 — 抛物线关于它左右对称的竖直线 x=−b/2a。 <span class=glossary-ref>（第 3 章：二次函数与变化率）<\/span><\/li><li data-term='平均变化率'>平均变化率 — 区间两端函数值之差与自变量之差的比。 <span class=glossary-ref>（第 3 章：二次函数与变化率）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：二次函数四问<\/h2>\n<p>① 开口向哪（看 a）；② 顶点在哪（配方）；③ 零点几个（看 Δ）；④ 区间最值（比较顶点与端点）。<\/p>\n<h2>框架：建模三步<\/h2>\n<p>找变量 → 写关系式 → 标注定义域。第三步常被漏掉，但实际问题里它决定答案是否合理。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>一次函数<\/td><td>y=kx+b；k&gt;0 增，k&lt;0 减；零点 −b/k<\/td><\/tr><tr><td>斜率公式<\/td><td>k=(y₂−y₁)/(x₂−x₁)<\/td><\/tr><tr><td>顶点<\/td><td>(−b/2a，(4ac−b²)/4a)<\/td><\/tr><tr><td>最值<\/td><td>a&gt;0 顶点最小，a&lt;0 顶点最大<\/td><\/tr><tr><td>平均变化率<\/td><td>(f(x₂)−f(x₁))/(x₂−x₁)<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：函数与图象", "href": "#/chapter/ch01"}, {"label": "第 2 章：一次函数", "href": "#/chapter/ch02"}, {"label": "第 3 章：二次函数与变化率", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "函数三要素", "href": "#/concept/c01"}, {"label": "变化率", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：函数与图象", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：一次函数", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：二次函数与变化率", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"exponents-logarithms":{"manifest": {"slug": "exponents-logarithms", "titl 语"]}], "companion": "exponents-logarithms学习伴侣.html", "deriv": "exponents-logarithms从零推导.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-07-指数与对数 沈超.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">乘方、根式<\/span><\/div><h1>第 1 章：指数的推广与指数函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：乘方、根式\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说明零指数、负指数的来源\n<\/li><li>\n把分数指数与根式互化\n<\/li><li>\n画出指数函数图象并说出单调性\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>指数每推广一步，都要求原来的运算法则继续成立；指数函数的值域恒为正。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 从正整数到整数<\/h3>\n<p>aⁿ 原本表示 n 个 a 相乘。要让 aᵐ·aⁿ=a<sup>m+n<\/sup> 在 m&lt;n 时也成立，就必须定义 a⁰ 与负指数：<\/p>\n<ul><li>\na⁰=1（a≠0），因为 aⁿ/aⁿ=1=a<sup>n−n<\/sup>；\n<\/li><li>\na⁻ⁿ=1/aⁿ，因为 a⁻ⁿ·aⁿ=a⁰=1。\n<\/ul>\n<h3>1.2 分数指数<\/h3>\n<p>要让 (aᵐ)<sup>1/n<\/sup>=a<sup>m/n<\/sup> 成立，就得把 a<sup>m/n<\/sup> 定义为 ⁿ√(aᵐ)。例如 8<sup>2/3<\/sup>=³√64=4。<\/p>\n<p>底数为负时分数指数会出问题（如 (−8)<sup>1/2<\/sup> 不是实数），所以指数函数的底数规定 a&gt;0 且 a≠1。<\/p>\n<h3>1.3 实数指数与指数函数<\/h3>\n<p>无理指数用有理指数逼近定义。函数 y=aˣ（a&gt;0，a≠1）叫<strong>指数函数<\/strong>：<\/p>\n<ul><li>\n定义域是全体实数，值域是 (0,+∞)，图象恒在 x 轴上方；\n<\/li><li>\na&gt;1 时单调递增，0&lt;a&lt;1 时单调递减；\n<\/li><li>\n图象都过点 (0,1)。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：指数增长像细胞分裂，每一代翻一倍；底数就是“每代翻几倍”。<\/p>\n<p><strong>失效边界<\/strong>：翻倍模型不考虑资源限制，真实种群会在后期放缓，不是纯指数。<\/p>\n<p><strong>实例<\/strong>：2<sup>−3<\/sup>=1/8；16<sup>3/4<\/sup>=(⁴√16)³=2³=8；比较 2<sup>0.3<\/sup> 与 2<sup>0.4<\/sup>，底数 2&gt;1 单调增，故前者小。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 a⁰=0 —— 实际上 任何非零数的零次幂都是 1，来自 aⁿ/aⁿ=1。\n<\/li><li>\n别以为 指数函数的值域是全体实数 —— 实际上 aˣ 恒为正，值域是 (0,+∞)，永远取不到 0 和负数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n计算 27<sup>2/3<\/sup> 的值：\n<\/li><li>\n函数 y=(1/2)ˣ 的单调性是：\n<p>A. 9 ｜ B. 18 ｜ C. 3 ｜ D. 6 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：27<sup>2/3<\/sup>=(³√27)²=3²=9。 A. 在 R 上递增 ｜ B. 在 R 上递减 ｜ C. 先增后减 ｜ D. 不单调 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：底数 0&lt;1/2&lt;1，指数函数单调递减。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na⁰=1（a≠0）；a⁻ⁿ=1/aⁿ；a<sup>m/n<\/sup>=ⁿ√(aᵐ)\n<\/li><li>\n指数函数值域 (0,+∞)，过 (0,1)\n<\/li><li>\na&gt;1 增，0&lt;a&lt;1 减\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：指数的推广与指数函数）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：指数的推广与指数函数<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>指数推广不是随意规定的：每扩一步，都要让原来的运算法则继续说真话。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>aˣ（a&gt;0，a≠1）叫指数函数；指数律指 aᵐ·aⁿ=a<sup>m+n<\/sup>、(aᵐ)ⁿ=a<sup>mn<\/sup>、(ab)ⁿ=aⁿbⁿ。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>指数像“复制次数”：复制 0 次还是原来那一个，所以 a⁰=1。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 零指数<\/h3>\n<div class=\"katex-block\">\\frac{a^{n}}{a^{n}}=1=a^{n-n}\\ \\Rightarrow\\ a^{0}=1<\/div>\n<p>由同底数幂相除的法则推出，不是硬性规定。<\/p>\n<h3>2. 负指数<\/h3>\n<div class=\"katex-block\">a^{-n}\\cdot a^{n}=a^{0}=1\\ \\Rightarrow\\ a^{-n}=\\frac{1}{a^{n}}<\/div>\n<p>负指数表示倒数，保证指数律继续成立。<\/p>\n<h3>3. 分数指数<\/h3>\n<div class=\"katex-block\">a^{\\frac{m}{n}}=\\sqrt[n]{a^{m}}<\/div>\n<p>把根式写成指数，乘除运算就变成指数的加减。<\/p>\n<h3>4. 指数律<\/h3>\n<div class=\"katex-block\">a^{m}a^{n}=a^{m+n},\\quad (a^{m})^{n}=a^{mn}<\/div>\n<p>所有指数变形都靠这两条，验证时优先用它们。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>底数为负时分数指数可能不是实数，因此指数函数限定底数大于 0。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《指数与对数》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-07-指数与对数 沈超.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/exponents-logarithms/chapter/ch01\">第 1 章：指数的推广与指数函数<\/a><\/span><\/div><h1>第 2 章：对数与对数运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把指数式与对数式互化\n<\/li><li>\n用三条法则化简对数式\n<\/li><li>\n用换底公式计算不同底的对数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>对数就是“问指数”：log_a N 是“a 的几次方等于 N”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 定义<\/h3>\n<p>若 aᵇ=N（a&gt;0，a≠1，N&gt;0），则 b=log_a N。这是指数式的等价改写，不是新运算。<\/p>\n<p>由此立得：a<sup>log_a N<\/sup>=N，log_a aᵇ=b，log_a 1=0，log_a a=1。<\/p>\n<h3>2.2 三条法则<\/h3>\n<ul><li>\nlog_a(MN)=log_a M+log_a N（乘变加）；\n<\/li><li>\nlog_a(M/N)=log_a M−log_a N（除变减）；\n<\/li><li>\nlog_a Mⁿ=n log_a M（幂变乘）。\n<\/ul>\n<p>法则只对乘、除、幂成立。log_a(M+N) 没有化简公式——这是最常见的错误。<\/p>\n<h3>2.3 换底公式<\/h3>\n<p>log_a N=log_b N / log_b a。常用底是 10（常用对数 lg）与 e（自然对数 ln）。换底把不同底的对数统一，便于计算与比较。<\/p>\n<h3>2.4 定义域<\/h3>\n<p>对数的真数必须为正：log_a N 要求 N&gt;0。解对数方程时，所有解都要满足这一条。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：对数像问“要叠多少层才够高”，指数是“叠 n 层有多高”。<\/p>\n<p><strong>失效边界<\/strong>：真数为负或为零时对数没有定义，不能靠公式硬算。<\/p>\n<p><strong>实例<\/strong>：log₂8=3，因为 2³=8；log₁₀1000=3；log₃(1/9)=−2，因为 3⁻²=1/9。 化简 lg2+lg5=lg10=1。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 log(M+N)=logM+logN —— 实际上 法则只管乘法。取 M=N=1：左边 lg2≈0.301，右边 0+0=0，明显不等。\n<\/li><li>\n别以为 真数可以为负 —— 实际上 负数的对数在实数范围内没有定义，方程解出负真数必须舍去。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nlog₄16 的值是：\n<\/li><li>\n化简 log₂6−log₂3：\n<p>A. 2 ｜ B. 4 ｜ C. 8 ｜ D. 1/2 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：4²=16，故 log₄16=2。 A. log₂3 ｜ B. 1 ｜ C. 2 ｜ D. log₂9 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：log₂6−log₂3=log₂(6/3)=log₂2=1。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nlog_a N=b ⇔ aᵇ=N\n<\/li><li>\n乘变加、除变减、幂变乘；加法不能合并\n<\/li><li>\n换底：log_a N=log_b N/log_b a\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：对数与对数运算）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：对数与对数运算<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>对数不是新东西，只是把指数式换个方向写。定义一变，三条法则就自动成立。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>若 aᵇ=N（a&gt;0，a≠1，N&gt;0），则记 b=log_a N。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>指数问“叠 n 层多高”，对数问“要多高需要叠几层”，同一件事的两个方向。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 定义<\/h3>\n<div class=\"katex-block\">a^{b}=N\\iff b=\\log_{a}N<\/div>\n<p>把指数式改写为对数式，两者说的是同一件事。<\/p>\n<h3>2. 乘法法则<\/h3>\n<div class=\"katex-block\">\\log_{a}(MN)=\\log_{a}M+\\log_{a}N<\/div>\n<p>由 a<sup>m+n<\/sup>=a<sup>m<\/sup>a<sup>n<\/sup> 两边取对数得到。<\/p>\n<h3>3. 幂法则<\/h3>\n<div class=\"katex-block\">\\log_{a}M^{n}=n\\log_{a}M<\/div>\n<p>幂在指数上变成系数，这是化简对数的主要工具。<\/p>\n<h3>4. 换底<\/h3>\n<div class=\"katex-block\">\\log_{a}N=\\frac{\\log_{b}N}{\\log_{b}a}<\/div>\n<p>把不同底的对数统一到同一个底，便于计算与比较。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>真数必须为正；底数必须大于 0 且不等于 1，否则不再是函数关系。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《指数与对数》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-07-指数与对数 沈超.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/exponents-logarithms/chapter/ch02\">第 2 章：对数与对数运算<\/a><\/span><\/div><h1>第 3 章：对数函数、幂函数与指对方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出对数函数与指数函数的对称关系\n<\/li><li>\n区分幂函数与指数函数\n<\/li><li>\n解指数方程与对数方程并验根\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>对数函数与指数函数关于 y=x 对称；解指对方程靠“化同底”或“取对数”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 对数函数<\/h3>\n<p>y=log_a x（a&gt;0，a≠1）的定义域是 (0,+∞)，值域是全体实数，图象过 (1,0)。<\/p>\n<p>a&gt;1 时递增，0&lt;a&lt;1 时递减。它与 y=aˣ 互为反函数，图象关于直线 y=x 对称。<\/p>\n<h3>3.2 幂函数<\/h3>\n<p>y=x^α（α 为常数）叫幂函数。它与指数函数的区别在于：幂函数的底是变量、指数是常数；指数函数反过来。<\/p>\n<p>常见幂函数 x、x²、x³、x<sup>1/2<\/sup>、x⁻¹ 的图象形状随 α 变化，但都过 (1,1)。<\/p>\n<h3>3.3 指数方程<\/h3>\n<ul><li>\n同底法：a^(f(x))=a^(g(x)) ⇒ f(x)=g(x)（a≠1）；\n<\/li><li>\n换元法：把 aˣ 设为 t，化成二次方程，注意 t&gt;0；\n<\/li><li>\n取对数：a^(f(x))=b^(g(x)) 两边取对数。\n<\/ul>\n<h3>3.4 对数方程<\/h3>\n<p>先用法则合并成 log_a F(x)=log_a G(x)，再化为 F(x)=G(x)，最后必须检验 F(x)&gt;0 且 G(x)&gt;0。<\/p>\n<p>增根几乎都来自“真数为负”这一步，验根不能省。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：指数与对数像两张对照表：一张给“层数→高度”，一张给“高度→层数”。<\/p>\n<p><strong>失效边界<\/strong>：两函数只在 a&gt;0、a≠1 时互为反函数；a=1 时退化为常数，没有反函数。<\/p>\n<p><strong>实例<\/strong>：解 2<sup>x+1<\/sup>=8。8=2³，故 x+1=3，x=2。 解 log₂(x−1)=3。化为 x−1=2³=8，得 x=9；检验真数 8&gt;0，成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 幂函数与指数函数是同一类 —— 实际上 幂函数底是变量，指数函数指数是变量；两者增长方式完全不同。\n<\/li><li>\n别以为 对数方程解出即可 —— 实际上 必须检验真数为正，否则会把增根写进答案。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n函数 y=log₂x 与 y=2ˣ 的图象关于哪条直线对称：\n<\/li><li>\n方程 log₂(x−3)=2 的解是：\n<p>A. y 轴 ｜ B. x 轴 ｜ C. y=x ｜ D. y=−x <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：互为反函数的图象关于直线 y=x 对称。 A. x=7 ｜ B. x=1 ｜ C. x=4 ｜ D. x=5 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：x−3=2²=4，得 x=7；真数 4&gt;0，成立。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ny=log_a x 与 y=aˣ 关于 y=x 对称\n<\/li><li>\n幂函数底变、指数函数指数变\n<\/li><li>\n对数方程必须检验真数为正\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：对数函数、幂函数与指对方程）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：对数函数、幂函数与指对方程<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>把指数函数的 x 与 y 互换，就得到对数函数；这也解释了两者图象为什么关于 y=x 对称。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>y=log_a x（a&gt;0，a≠1，x&gt;0）叫对数函数；y=x^α 叫幂函数。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像一张双向对照表：上行是层数、下行是高度，正读是乘方，倒读是对数。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 反函数关系<\/h3>\n<div class=\"katex-block\">y=a^{x}\\ \\xrightarrow{x\\leftrightarrow y}\\ x=a^{y}\\iff y=\\log_{a}x<\/div>\n<p>把指数函数的自变量与函数值互换，就得到对数函数。<\/p>\n<h3>2. 对称性<\/h3>\n<div class=\"katex-block\">(x,\\,y)\\ \\text{在}\\ y=a^{x}\\ \\text{上}\\iff (y,\\,x)\\ \\text{在}\\ y=\\log_{a}x\\ \\text{上}<\/div>\n<p>两组点关于 y=x 对称，所以两条曲线也对称。<\/p>\n<h3>3. 同底指数方程<\/h3>\n<div class=\"katex-block\">a^{f(x)}=a^{g(x)}\\iff f(x)=g(x)\\quad(a\\ne 1)<\/div>\n<p>底相同且不为 1 时，指数必须相等。<\/p>\n<h3>4. 对数方程<\/h3>\n<div class=\"katex-block\">\\log_{a}F(x)=\\log_{a}G(x)\\ \\Rightarrow\\ F(x)=G(x)\\ \\text{且}\\ F,G>0<\/div>\n<p>化成同底后比较真数，但真数为正是硬条件。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>互换 x、y 只在对数函数与原指数函数之间成立；其他函数互换后不一定仍是函数。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《指数与对数》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-07-指数与对数 沈超.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/exponents-logarithms/chapter/ch01\">第 1 章：指数的推广与指数函数<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/exponents-logarithms/chapter/ch02\">第 2 章：对数与对数运算<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/exponents-logarithms/chapter/ch03\">第 3 章：对数函数、幂函数与指对方程<\/a><\/span><\/div><h1>互为逆运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>指数问“乘几次”，对数问“几次才够”，两句话说的是同一件事。<\/p>\n<h2>为什么重要<\/h2>\n<p>抓住互逆关系，指对互化、图象对称、方程解法都能自然推出，不必死记。<\/p>\n<h2>详解<\/h2>\n<p>aᵇ=N 与 b=log_a N 是同一关系的两种写法。由此得 a<sup>log_a N<\/sup>=N 与 log_a aᵇ=b。图象上，把点 (x,y) 换成 (y,x)，指数曲线就变成对数曲线。<\/p>\n<h2>常见误解<\/h2>\n<p>把对数当成一种全新的运算去背法则，割裂了两者的联系。<\/p>\n<h2>相关概念<\/h2>\n<p>指数函数（ch01）、对数函数（ch03）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-07-指数与对数 沈超.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/exponents-logarithms/chapter/ch01\">第 1 章：指数的推广与指数函数<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/exponents-logarithms/chapter/ch03\">第 3 章：对数函数、幂函数与指对方程<\/a><\/span><\/div><h1>底数与单调性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>底数大于 1 就增，介于 0 与 1 之间就减；同一类函数，两条相反的走势。<\/p>\n<h2>为什么重要<\/h2>\n<p>比较大小时不必算值，看底数就能定方向。<\/p>\n<h2>详解<\/h2>\n<p>aˣ 与 log_a x 的单调性都由 a 决定：a&gt;1 递增，0&lt;a&lt;1 递减。因此比较大小时，先统一底数，再看指数（或真数）大小；底不同则用换底或取中间值 1 比较。<\/p>\n<h2>常见误解<\/h2>\n<p>不同底直接比指数大小，忽略底数方向可能相反。<\/p>\n<h2>相关概念<\/h2>\n<p>指数函数（ch01）、换底公式（ch02）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：指数的推广与指数函数<\/strong><br>阅读：<a href=\"#/book/exponents-logarithms/chapter/ch01\">第 1 章：指数的推广与指数函数<\/a><br>检查点：能说明 a⁰=1 为什么成立<\/li><li class='path-step' id='path-02'><strong>步骤 02：对数与对数运算<\/strong><br>阅读：<a href=\"#/book/exponents-logarithms/chapter/ch02\">第 2 章：对数与对数运算<\/a><br>检查点：能把指数式与对数式互化并用法则化简<\/li><li class='path-step' id='path-03'><strong>步骤 03：对数函数、幂函数与指对方程<\/strong><br>阅读：<a href=\"#/book/exponents-logarithms/chapter/ch03\">第 3 章：对数函数、幂函数与指对方程<\/a><br>检查点：能解指数方程并验根<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：指数的推广与指数函数<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 计算 27<sup>2/3<\/sup> 的值：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 9<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 18<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 函数 y=(1/2)ˣ 的单调性是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 在 R 上递增<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 在 R 上递减<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 先增后减<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 不单调<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解 -q04' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 化简 log₂6−log₂3：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> log₂3<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> log₂9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：对数函数、幂函数与指对方程<\/h1><div class='quiz-item' data-qid='ch03-q05' data-type='single' data-concept='c01' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 函数 y=log₂x 与 y=2ˣ 的图象关于哪条直线对称：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q05' value='0'> y 轴<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='1'> x 轴<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='2'> y=x<\/label><label class='quiz-opt'><input type='radio' name='ch03-q05' value='3'> y=−x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='c01' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 方程 log₂(x−3)=2 的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> x=7<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> x=1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> x=4<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> x=5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'> ；② 换成另一种写法；③ 用对应法则（指数律或对数律）化简。<\/p>\n<h2>框架：比较大小三招<\/h2>\n<p>同底看单调；同指数看底；都不同则取中间值 0 或 1 或换底。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>指数律<\/td><td>aᵐaⁿ=a<sup>m+n<\/sup>；(aᵐ)ⁿ=a<sup>mn<\/sup>；(ab)ⁿ=aⁿbⁿ<\/td><\/tr><tr><td>对数定义<\/td><td>aᵇ=N ⇔ log_a N=b（N&gt;0）<\/td><\/tr><tr><td>对数法则<\/td><td>log(MN)=logM+logN；log(M/N)=logM−logN；log Mⁿ=n logM<\/td><\/tr><tr><td>换底<\/td><td>log_a N=log_b N/log_b a<\/td><\/tr><tr><td>单调性<\/td><td>a&gt;1 增；0&lt;a&lt;1 减<\/td><\/tr><tr><td>对数方程<\/td><td>化同底 → 比较真数 → 检验真数&gt;0<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：指数的推广与指数函数", "href": "#/chapter/ch01"}, {"label": "第 2 章：对数与对数运算", "href": "#/chapter/ch02"}, {"label": "第 3 章：对数函数、幂函数与指对方程", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "互为逆运算", "href": "#/concept/c01"}, {"label": "底数与单调性", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：指数的推广与指数函数", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：对数与对数运算", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：对数函数、幂函数与指对方程", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}},"permutations-combinations":{"manifest": {"slug": "permutations-combinations", "title": "排列与组合", "subtitle": "数得清，才说得准：两条原理与三类模型", "book": {"title": "排列与组合", "author": "吴世煦", "source": ["数学基础知识丛书-08-排列与组合 吴世煦.pdf"]}, "audience": "零基础", "goal": "掌握加法原理与乘法原理，会用排列数、组合数公式计数，能处理可重复与分组分配问题。", "learningPath": [{"step": "01", "title": "两条原理与排列", "chapterIds": ["ch01"], "checkpoint": "能判断一道题该加还是该乘"}, {"step": "02", "title": "组合与组合数", "chapterIds": ["
