<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;

  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}

html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}

#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}

  #nav{display:none}.sidebar.open #nav{display:block}

: "single", "question": "椭圆的离心率 e 的取值范围是：", "options": ["(0,1)", "(1,+∞)", "[0,1]", "(0,+∞)"], "answer": 0, "explain": "e=c/a，且 0<c<a，故 0<e<1。"}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "双曲线 x²/16−y²/9=1 的渐近线是：", "options": ["y=±(3/4)x", "y=±(4/3)x", "y=±(9/16)x", "y=±x"], "answer": 0, "explain": "a=4，b=3，渐近线 y=±(b/a)x=±(3/4)x。"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "抛物线 y²=12x 的焦点坐标是：", "options": ["(3,0)", "(6,0)", "(0,3)", "(12,0)"], "answer": 0, "explain": "2p=12，p=6，焦点 (p/2,0)=(3,0)。"}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "离心率 e=1 对应的圆锥曲线是：", "options": ["椭圆", "双曲线", "抛物线", "圆"], "answer": 2, "explain": "e=1 即到焦点与到准线距离相等，是抛物线。"}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "平行于抛物线对称轴的光线经反射后：", "options": ["原路返回", "过焦点", "平行射出", "发散"], "answer": 1, "explain": "抛物线的光学性质：平行于轴的光线反射后过焦点。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "椭圆 x²/36+y²/20=1 的离心率是：", "options": ["2/3", "√2/3", "4/9", "1/3"], "answer": 0, "explain": "a=6，b²=20，c²=36−20=16，c=4，e=c/a=2/3。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "抛物线 x²=−8y 的焦点坐标是：", "options": ["(0,−2)", "(0,2)", "(−2,0)", "(2,0)"], "answer": 0, "explain": "x²=−2py 开口向下，2p=8，p=4，焦点 (0,−p/2)=(0,−2)。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：椭圆」的一句话核心是什么？", "back": "椭圆是“到两定点距离之和为常数”的点集；a 是半长轴，c 是半焦距，b²=a²−c²。", "tags": ["conic-sections", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：双曲线与抛物线」的一句话核心是什么？", "back": "双曲线是“距离之差为常数”，抛物线是“到定点与定直线等距”；前者有渐近线，后者只有一条对称轴。", "tags": ["conic-sections", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：统一定义、光学性质与坐标变换」的一句话核心是什么？", "back": "三条曲线可以合成一句话：到焦点距离与到准线距离之比等于 e。", "tags": ["conic-sections", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「椭圆」？", "back": "到两定点距离之和为常数的点的轨迹。", "tags": ["conic-sections", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「焦点」？", "back": "定义中的定点。", "tags": ["conic-sections", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「半长轴」？", "back": "椭圆中的 a，长轴长为 2a。", "tags": ["conic-sections", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「离心率」？", "back": "e=c/a，描述曲线的形状参数。", "tags": ["conic-sections", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「双曲线」？", "back": "到两定点距离之差为常数的点的轨迹。", "tags": ["conic-sections", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「渐近线」？", "back": "双曲线无限接近但不相交的直线。", "tags": ["conic-sections", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「抛物线」？", "back": "到定点与定直线等距的点的轨迹。", "tags": ["conic-sections", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「准线」？", "back": "统一定义中的定直线。", "tags": ["conic-sections", "术语"]}, {"id": "f12", "chapterId": "ch01", "front": "什么是「通径」？", "back": "过焦点垂直于对称轴的弦。", "tags": ["conic-sections", "术语"]}], "companion": "conic-sections学习伴侣.html", "deriv": "conic-sections从零推导.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：椭圆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：两点距离、配方\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n由定义写出椭圆方程\n<\/li><li>\n读出长轴、短轴、焦距、离心率\n<\/li><li>\n判断椭圆的扁平程度\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>椭圆是“到两定点距离之和为常数”的点集；a 是半长轴，c 是半焦距，b²=a²−c²。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 定义<\/h3>\n<p>平面内到两定点 F₁、F₂ 的距离之和等于常数 2a（2a&gt;|F₁F₂|）的点的轨迹叫椭圆。两定点叫焦点，|F₁F₂|=2c。<\/p>\n<p>若 2a=2c，轨迹退化为线段 F₁F₂；若 2a&lt;2c，无轨迹。<\/p>\n<h3>1.2 标准方程<\/h3>\n<p>以焦点在 x 轴上、中心在原点为例：<\/p>\n<p>x²/a²+y²/b²=1，其中 b²=a²−c²<\/p>\n<p>焦点为 (±c,0)，顶点为 (±a,0)、(0,±b)。若焦点在 y 轴上，方程写成 y²/a²+x²/b²=1，焦点 (0,±c)。<\/p>\n<h3>1.3 离心率<\/h3>\n<p>e=c/a，范围 (0,1)。e 越大（越接近 1），c 越接近 a，b 越小，椭圆越扁；e 越小（越接近 0），越接近圆。<\/p>\n<p>e 是描述“扁不扁”的唯一参数，比看方程更直观。<\/p>\n<h3>1.4 常用关系<\/h3>\n<p>椭圆上任意一点到两焦点距离之和恒为 2a；焦点到顶点的距离分别为 a−c 与 a+c；通径（过焦点垂直于长轴的弦）长为 2b²/a。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：椭圆像用两根钉子与一根绳画出的图形：绳长固定，笔尖到两钉距离之和就不变。<\/p>\n<p><strong>失效边界<\/strong>：绳长必须大于两钉距离，否则画不出椭圆（退化为线段或无轨迹）。<\/p>\n<p><strong>实例<\/strong>：x²/25+y²/9=1：a=5，b=3，c=√(25−9)=4，e=4/5=0.8。 焦点 (±4,0)，长轴长 10，短轴长 6。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 a 是长轴长 —— 实际上 a 是半长轴，长轴长是 2a。\n<\/li><li>\n别以为 离心率越大椭圆越圆 —— 实际上 e 越大越扁；e 越小越接近圆。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n椭圆 x²/16+y²/7=1 的焦距是：\n<\/li><li>\n椭圆的离心率 e 的取值范围是：\n<p>A. 6 ｜ B. 3 ｜ C. 9 ｜ D. 18 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：c²=16−7=9，c=3，焦距 2c=6。 A. (0,1) ｜ B. (1,+∞) ｜ C. [0,1] ｜ D. (0,+∞) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：e=c/a，且 0&lt;c&lt;a，故 0&lt;e&lt;1。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n|PF₁|+|PF₂|=2a\n<\/li><li>\nb²=a²−c²；e=c/a∈(0,1)\n<\/li><li>\ne 越大越扁\n<\/ul>", "kind": "chapter", "title": "第 1 章：椭圆"}, "ch02": {"html": "<h1>第 2 章：双曲线与抛物线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出双曲线标准方程与渐近线\n<\/li><li>\n写出抛物线标准方程与准线\n<\/li><li>\n由方程判断曲线类型\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>双曲线是“距离之差为常数”，抛物线是“到定点与定直线等距”；前者有渐近线，后者只有一条对称轴。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 双曲线<\/h3>\n<p>定义：到两定点距离之差的绝对值为常数 2a（2a&lt;2c）的点的轨迹。<\/p>\n<p>标准方程（焦点在 x 轴）：x²/a²−y²/b²=1，其中 b²=c²−a²。<\/p>\n<ul><li>\n焦点 (±c,0)，顶点 (±a,0)；\n<\/li><li>\n渐近线 y=±(b/a)x；\n<\/li><li>\n离心率 e=c/a&gt;1，e 越大开口越“张”。\n<\/ul>\n<h3>2.2 抛物线<\/h3>\n<p>定义：到定点 F 与定直线 l 距离相等的点的轨迹。F 叫焦点，l 叫准线。<\/p>\n<p>标准方程（开口向右）：y²=2px（p&gt;0），焦点 (p/2,0)，准线 x=−p/2。<\/p>\n<p>开口方向由一次项决定：y²=2px 向右，y²=−2px 向左，x²=2py 向上，x²=−2py 向下。<\/p>\n<h3>2.3 三者的区别<\/h3>\n<table><thead><tr><th><\/th><th>定义<\/th><th>方程<\/th><th>离心率<\/th><th>特征线<\/th><\/tr><\/thead><tbody><tr><td>椭圆<\/td><td>距离之和<\/td><td>x²/a²+y²/b²=1<\/td><td>e&lt;1<\/td><td>无渐近线<\/td><\/tr><tr><td>双曲线<\/td><td>距离之差<\/td><td>x²/a²−y²/b²=1<\/td><td>e&gt;1<\/td><td>两条渐近线<\/td><\/tr><tr><td>抛物线<\/td><td>到点＝到线<\/td><td>y²=2px<\/td><td>e=1<\/td><td>一条准线<\/td><\/tr><\/tbody><\/table>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：双曲线像两束手电光的光锥边缘，越远越分开；抛物线像抛出的球走过的路线。<\/p>\n<p><strong>失效边界<\/strong>：双曲线的“差”要取绝对值，否则只得到一支。<\/p>\n<p><strong>实例<\/strong>：x²/9−y²/16=1：a=3，b=4，c=5，e=5/3，渐近线 y=±(4/3)x。 y²=8x：2p=8，p=4，焦点 (2,0)，准线 x=−2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 双曲线只有一支 —— 实际上 取绝对值时为两支；只写“差为 2a”而不取绝对值，只得到靠近某焦点的一支。\n<\/li><li>\n别以为 抛物线的 p 是焦点到准线的距离 —— 实际上 焦点到准线的距离是 p，焦点坐标是 (p/2,0)，准线是 x=−p/2。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n双曲线 x²/16−y²/9=1 的渐近线是：\n<\/li><li>\n抛物线 y²=12x 的焦点坐标是：\n<p>A. y=±(3/4)x ｜ B. y=±(4/3)x ｜ C. y=±(9/16)x ｜ D. y=±x <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：a=4，b=3，渐近线 y=±(b/a)x=±(3/4)x。 A. (3,0) ｜ B. (6,0) ｜ C. (0,3) ｜ D. (12,0) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：2p=12，p=6，焦点 (p/2,0)=(3,0)。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n双曲线：||PF₁|−|PF₂||=2a，b²=c²−a²\n<\/li><li>\n渐近线 y=±(b/a)x\n<\/li><li>\n抛物线 y²=2px：焦点 (p/2,0)，准线 x=−p/2\n<\/ul>", "kind": "chapter", "title": "第 2 章：双曲线与抛物线"}, "ch03": {"html": "<h1>第 3 章：统一定义、光学性质与坐标变换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用离心率统一三条曲线\n<\/li><li>\n说出三条曲线的光学性质\n<\/li><li>\n理解坐标变换不改变曲线类型\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>三条曲线可以合成一句话：到焦点距离与到准线距离之比等于 e。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 统一定义<\/h3>\n<p>到定点 F（焦点）的距离与到定直线 l（准线）的距离之比为常数 e 的点的轨迹：<\/p>\n<ul><li>\n0&lt;e&lt;1：椭圆；\n<\/li><li>\ne=1：抛物线；\n<\/li><li>\ne&gt;1：双曲线。\n<\/ul>\n<p>一条定义，三种曲线，e 是分类开关。这也是“圆锥曲线”这个名字的代数解释。<\/p>\n<h3>3.2 光学性质<\/h3>\n<ul><li>\n椭圆：从一个焦点发出的光线经椭圆反射后必过另一焦点；\n<\/li><li>\n抛物线：平行于对称轴的光线经抛物线反射后聚焦于焦点；\n<\/li><li>\n双曲线：射向一个焦点的光线经反射后，反射光线的反向延长线过另一焦点。\n<\/ul>\n<p>这些性质是卫星天线、车灯、光学仪器的设计依据。<\/p>\n<h3>3.3 坐标变换与不变量<\/h3>\n<p>平移坐标轴只改变方程中的常数项，不改变曲线类型；旋转坐标轴可以把含 xy 项的方程化为标准形。<\/p>\n<p>曲线在变换下保持不变的量（如离心率、曲线类型）叫不变量。判断“这是什么曲线”时，先算不变量，比硬配方更快。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：离心率像“调焦旋钮”：拧到小于 1 是椭圆，正好 1 是抛物线，大于 1 是双曲线。<\/p>\n<p><strong>失效边界<\/strong>：统一定义要求准线与焦点对应；不同曲线的准线位置不同，不能混用。<\/p>\n<p><strong>实例<\/strong>：某曲线到焦点 (2,0) 与准线 x=−2 的距离之比为 1，则它是抛物线 y²=8x。 若比值改为 0.5，则是椭圆（需重新计算 a、c）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 光学性质只对抛物线与圆有关 —— 实际上 三条曲线都有反射性质，椭圆与双曲线同样用于光学设计。\n<\/li><li>\n别以为 坐标变换会改变曲线类型 —— 实际上 平移与旋转只改变方程形式，曲线类型与离心率不变。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n离心率 e=1 对应的圆锥曲线是：\n<\/li><li>\n平行于抛物线对称轴的光线经反射后：\n<p>A. 椭圆 ｜ B. 双曲线 ｜ C. 抛物线 ｜ D. 圆 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：e=1 即到焦点与到准线距离相等，是抛物线。 A. 原路返回 ｜ B. 过焦点 ｜ C. 平行射出 ｜ D. 发散 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：抛物线的光学性质：平行于轴的光线反射后过焦点。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n统一：到焦点距离/到准线距离=e\n<\/li><li>\ne&lt;1 椭圆，e=1 抛物线，e&gt;1 双曲线\n<\/li><li>\n平移旋转不改变曲线类型\n<\/ul>", "kind": "chapter", "title": "第 3 章：统一定义、光学性质与坐标变换"}, "c01": {"html": "<h1>离心率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>e=c/a，一个数决定曲线是圆、椭圆、抛物线还是双曲线。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是三条曲线的统一开关，也是判断“扁不扁、张不张”的唯一指标。<\/p>\n<h2>详解<\/h2>\n<p>椭圆 0&lt;e&lt;1，e 越大越扁；抛物线 e=1；双曲线 e&gt;1，e 越大开口越张。用统一定义看，e 就是“到焦点距离与到准线距离之比”。<\/p>\n<h2>常见误解<\/h2>\n<p>把 e 当成斜率或焦距，混淆 c/a 与 c 的含义。<\/p>\n<h2>相关概念<\/h2>\n<p>椭圆（ch01）、统一定义（ch03）<\/p>", "kind": "concept", "title": "离心率"}, "c02": {"html": "<h1>a、b、c 的关系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>椭圆是 b²=a²−c²，双曲线是 b²=c²−a²，符号相反。<\/p>\n<h2>为什么重要<\/h2>\n<p>这三者的关系决定焦点位置、顶点坐标与渐近线，写错一处整题皆错。<\/p>\n<h2>详解<\/h2>\n<p>椭圆中 a 最大（a²=b²+c²）；双曲线中 c 最大（c²=a²+b²）。记住“谁最大”就不会写反：椭圆 a 最大，双曲线 c 最大。<\/p>\n<h2>常见误解<\/h2>\n<p>把两个关系式互换，导致焦点坐标或渐近线全错。<\/p>\n<h2>相关概念<\/h2>\n<p>椭圆（ch01）、双曲线（ch02）<\/p>", "kind": "concept", "title": "a、b、c 的关系"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：椭圆<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：椭圆<\/a><br>检查点：能由方程读出 a、b、c、e<\/li><li class='path-step' id='path-02'><strong>步骤 02：双曲线与抛物线<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：双曲线与抛物线<\/a><br>检查点：能写出渐近线与准线<\/li><li class='path-step' id='path-03'><strong>步骤 03：统一定义、光学性质与坐标变换<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：统一定义、光学性质与坐标变换<\/a><br>检查点：能用 e 判断曲线类型<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 椭圆 x²/36+y²/20=1 的离心率是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 2/3<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> √2/3<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 4/9<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 1/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 抛物线 x²=−8y 的焦点坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> (0,−2)<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> (0,2)<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> (−2,0)<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> (2,0)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：椭圆<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 椭圆 x²/16+y²/7=1 的焦距是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 9<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 18<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 椭圆的离心率 e 的取值范围是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> (0,1)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> (1,+∞)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> [0,1]<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> (0,+∞)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：双曲线与抛物线<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 双曲线 x²/16−y²/9=1 的渐近线是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> y=±(3/4)x<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> y=±(4/3)x<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> y=±(9/16)x<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> y=±x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 抛物线 y²=12x 的焦点坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> (3,0)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> (6,0)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> (0,3)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> (12,0)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：统一定义、光学性质与坐标变换<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 离心率 e=1 对应的圆锥曲线是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 椭圆<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 双曲线<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 抛物线<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 圆<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 平行于抛物线对称轴的光线经反射后：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 原路返回<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 过焦点<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 平行射出<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 发散<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='椭圆'>椭圆 — 到两定点距离之和为常数的点的轨迹。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><li data-term='焦点'>焦点 — 定义中的定点。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><li data-term='半长轴'>半长轴 — 椭圆中的 a，长轴长为 2a。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><li data-term='离心率'>离心率 — e=c/a，描述曲线的形状参数。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><li data-term='双曲线'>双曲线 — 到两定点距离之差为常数的点的轨迹。 <span class=glossary-ref>（第 2 章：双曲线与抛物线）<\/span><\/li><li data-term='渐近线'>渐近线 — 双曲线无限接近但不相交的直线。 <span class=glossary-ref>（第 2 章：双曲线与抛物线）<\/span><\/li><li data-term='抛物线'>抛物线 — 到定点与定直线等距的点的轨迹。 <span class=glossary-ref>（第 2 章：双曲线与抛物线）<\/span><\/li><li data-term='准线'>准线 — 统一定义中的定直线。 <span class=glossary-ref>（第 3 章：统一定义、光学性质与坐标变换）<\/span><\/li><li data-term='通径'>通径 — 过焦点垂直于对称轴的弦。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：识曲线三步<\/h2>\n<p>① 看方程次数与符号（两平方项同号为椭圆、异号为双曲线、一次项为抛物线）；② 看谁最大定焦点；③ 算 e 定形状。<\/p>\n<h2>框架：求方程四步<\/h2>\n<p>① 定型（焦点在哪轴）；② 设标准式；③ 用 a、b、c 关系与已知点列方程；④ 解出并写回标准形。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>椭圆<\/td><td>x²/a²+y²/b²=1，b²=a²−c²，e=c/a&lt;1<\/td><\/tr><tr><td>双曲线<\/td><td>x²/a²−y²/b²=1，b²=c²−a²，e=c/a&gt;1<\/td><\/tr><tr><td>渐近线<\/td><td>y=±(b/a)x<\/td><\/tr><tr><td>抛物线<\/td><td>y²=2px，焦点 (p/2,0)，准线 x=−p/2<\/td><\/tr><tr><td>统一定义<\/td><td><\/td><td>PF<\/td><td>/d(P,l)=e<\/td><\/tr><tr><td>通径<\/td><td>2b²/a<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/19-圆锥曲线", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：椭圆", "href": "#/chapter/ch01"}, {"label": "第 2 章：双曲线与抛物线", "href": "#/chapter/ch02"}, {"label": "第 3 章：统一定义、光学性质与坐标变换", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "离心率", "href": "#/concept/c01"}, {"label": "a、b、c 的关系", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：椭圆", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：双曲线与抛物线", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：统一定义、光学性质与坐标变换", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：椭圆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：两点距离、配方\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n由定义写出椭圆方程\n<\/li><li>\n读出长轴、短轴、焦距、离心率\n<\/li><li>\n判断椭圆的扁平程度\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>椭圆是“到两定点距离之和为常数”的点集；a 是半长轴，c 是半焦距，b²=a²−c²。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 定义<\/h3>\n<p>平面内到两定点 F₁、F₂ 的距离之和等于常数 2a（2a&gt;|F₁F₂|）的点的轨迹叫椭圆。两定点叫焦点，|F₁F₂|=2c。<\/p>\n<p>若 2a=2c，轨迹退化为线段 F₁F₂；若 2a&lt;2c，无轨迹。<\/p>\n<h3>1.2 标准方程<\/h3>\n<p>以焦点在 x 轴上、中心在原点为例：<\/p>\n<p>x²/a²+y²/b²=1，其中 b²=a²−c²<\/p>\n<p>焦点为 (±c,0)，顶点为 (±a,0)、(0,±b)。若焦点在 y 轴上，方程写成 y²/a²+x²/b²=1，焦点 (0,±c)。<\/p>\n<h3>1.3 离心率<\/h3>\n<p>e=c/a，范围 (0,1)。e 越大（越接近 1），c 越接近 a，b 越小，椭圆越扁；e 越小（越接近 0），越接近圆。<\/p>\n<p>e 是描述“扁不扁”的唯一参数，比看方程更直观。<\/p>\n<h3>1.4 常用关系<\/h3>\n<p>椭圆上任意一点到两焦点距离之和恒为 2a；焦点到顶点的距离分别为 a−c 与 a+c；通径（过焦点垂直于长轴的弦）长为 2b²/a。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：椭圆像用两根钉子与一根绳画出的图形：绳长固定，笔尖到两钉距离之和就不变。<\/p>\n<p><strong>失效边界<\/strong>：绳长必须大于两钉距离，否则画不出椭圆（退化为线段或无轨迹）。<\/p>\n<p><strong>实例<\/strong>：x²/25+y²/9=1：a=5，b=3，c=√(25−9)=4，e=4/5=0.8。 焦点 (±4,0)，长轴长 10，短轴长 6。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 a 是长轴长 —— 实际上 a 是半长轴，长轴长是 2a。\n<\/li><li>\n别以为 离心率越大椭圆越圆 —— 实际上 e 越大越扁；e 越小越接近圆。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n椭圆 x²/16+y²/7=1 的焦距是：\n<\/li><li>\n椭圆的离心率 e 的取值范围是：\n<p>A. 6 ｜ B. 3 ｜ C. 9 ｜ D. 18 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：c²=16−7=9，c=3，焦距 2c=6。 A. (0,1) ｜ B. (1,+∞) ｜ C. [0,1] ｜ D. (0,+∞) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：e=c/a，且 0&lt;c&lt;a，故 0&lt;e&lt;1。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n|PF₁|+|PF₂|=2a\n<\/li><li>\nb²=a²−c²；e=c/a∈(0,1)\n<\/li><li>\ne 越大越扁\n<\/ul>", "ch02": "<h1>第 2 章：双曲线与抛物线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出双曲线标准方程与渐近线\n<\/li><li>\n写出抛物线标准方程与准线\n<\/li><li>\n由方程判断曲线类型\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>双曲线是“距离之差为常数”，抛物线是“到定点与定直线等距”；前者有渐近线，后者只有一条对称轴。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 双曲线<\/h3>\n<p>定义：到两定点距离之差的绝对值为常数 2a（2a&lt;2c）的点的轨迹。<\/p>\n<p>标准方程（焦点在 x 轴）：x²/a²−y²/b²=1，其中 b²=c²−a²。<\/p>\n<ul><li>\n焦点 (±c,0)，顶点 (±a,0)；\n<\/li><li>\n渐近线 y=±(b/a)x；\n<\/li><li>\n离心率 e=c/a&gt;1，e 越大开口越“张”。\n<\/ul>\n<h3>2.2 抛物线<\/h3>\n<p>定义：到定点 F 与定直线 l 距离相等的点的轨迹。F 叫焦点，l 叫准线。<\/p>\n<p>标准方程（开口向右）：y²=2px（p&gt;0），焦点 (p/2,0)，准线 x=−p/2。<\/p>\n<p>开口方向由一次项决定：y²=2px 向右，y²=−2px 向左，x²=2py 向上，x²=−2py 向下。<\/p>\n<h3>2.3 三者的区别<\/h3>\n<table><thead><tr><th><\/th><th>定义<\/th><th>方程<\/th><th>离心率<\/th><th>特征线<\/th><\/tr><\/thead><tbody><tr><td>椭圆<\/td><td>距离之和<\/td><td>x²/a²+y²/b²=1<\/td><td>e&lt;1<\/td><td>无渐近线<\/td><\/tr><tr><td>双曲线<\/td><td>距离之差<\/td><td>x²/a²−y²/b²=1<\/td><td>e&gt;1<\/td><td>两条渐近线<\/td><\/tr><tr><td>抛物线<\/td><td>到点＝到线<\/td><td>y²=2px<\/td><td>e=1<\/td><td>一条准线<\/td><\/tr><\/tbody><\/table>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：双曲线像两束手电光的光锥边缘，越远越分开；抛物线像抛出的球走过的路线。<\/p>\n<p><strong>失效边界<\/strong>：双曲线的“差”要取绝对值，否则只得到一支。<\/p>\n<p><strong>实例<\/strong>：x²/9−y²/16=1：a=3，b=4，c=5，e=5/3，渐近线 y=±(4/3)x。 y²=8x：2p=8，p=4，焦点 (2,0)，准线 x=−2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 双曲线只有一支 —— 实际上 取绝对值时为两支；只写“差为 2a”而不取绝对值，只得到靠近某焦点的一支。\n<\/li><li>\n别以为 抛物线的 p 是焦点到准线的距离 —— 实际上 焦点到准线的距离是 p，焦点坐标是 (p/2,0)，准线是 x=−p/2。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n双曲线 x²/16−y²/9=1 的渐近线是：\n<\/li><li>\n抛物线 y²=12x 的焦点坐标是：\n<p>A. y=±(3/4)x ｜ B. y=±(4/3)x ｜ C. y=±(9/16)x ｜ D. y=±x <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：a=4，b=3，渐近线 y=±(b/a)x=±(3/4)x。 A. (3,0) ｜ B. (6,0) ｜ C. (0,3) ｜ D. (12,0) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：2p=12，p=6，焦点 (p/2,0)=(3,0)。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n双曲线：||PF₁|−|PF₂||=2a，b²=c²−a²\n<\/li><li>\n渐近线 y=±(b/a)x\n<\/li><li>\n抛物线 y²=2px：焦点 (p/2,0)，准线 x=−p/2\n<\/ul>", "ch03": "<h1>第 3 章：统一定义、光学性质与坐标变换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用离心率统一三条曲线\n<\/li><li>\n说出三条曲线的光学性质\n<\/li><li>\n理解坐标变换不改变曲线类型\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>三条曲线可以合成一句话：到焦点距离与到准线距离之比等于 e。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 统一定义<\/h3>\n<p>到定点 F（焦点）的距离与到定直线 l（准线）的距离之比为常数 e 的点的轨迹：<\/p>\n<ul><li>\n0&lt;e&lt;1：椭圆；\n<\/li><li>\ne=1：抛物线；\n<\/li><li>\ne&gt;1：双曲线。\n<\/ul>\n<p>一条定义，三种曲线，e 是分类开关。这也是“圆锥曲线”这个名字的代数解释。<\/p>\n<h3>3.2 光学性质<\/h3>\n<ul><li>\n椭圆：从一个焦点发出的光线经椭圆反射后必过另一焦点；\n<\/li><li>\n抛物线：平行于对称轴的光线经抛物线反射后聚焦于焦点；\n<\/li><li>\n双曲线：射向一个焦点的光线经反射后，反射光线的反向延长线过另一焦点。\n<\/ul>\n<p>这些性质是卫星天线、车灯、光学仪器的设计依据。<\/p>\n<h3>3.3 坐标变换与不变量<\/h3>\n<p>平移坐标轴只改变方程中的常数项，不改变曲线类型；旋转坐标轴可以把含 xy 项的方程化为标准形。<\/p>\n<p>曲线在变换下保持不变的量（如离心率、曲线类型）叫不变量。判断“这是什么曲线”时，先算不变量，比硬配方更快。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：离心率像“调焦旋钮”：拧到小于 1 是椭圆，正好 1 是抛物线，大于 1 是双曲线。<\/p>\n<p><strong>失效边界<\/strong>：统一定义要求准线与焦点对应；不同曲线的准线位置不同，不能混用。<\/p>\n<p><strong>实例<\/strong>：某曲线到焦点 (2,0) 与准线 x=−2 的距离之比为 1，则它是抛物线 y²=8x。 若比值改为 0.5，则是椭圆（需重新计算 a、c）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 光学性质只对抛物线与圆有关 —— 实际上 三条曲线都有反射性质，椭圆与双曲线同样用于光学设计。\n<\/li><li>\n别以为 坐标变换会改变曲线类型 —— 实际上 平移与旋转只改变方程形式，曲线类型与离心率不变。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n离心率 e=1 对应的圆锥曲线是：\n<\/li><li>\n平行于抛物线对称轴的光线经反射后：\n<p>A. 椭圆 ｜ B. 双曲线 ｜ C. 抛物线 ｜ D. 圆 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：e=1 即到焦点与到准线距离相等，是抛物线。 A. 原路返回 ｜ B. 过焦点 ｜ C. 平行射出 ｜ D. 发散 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：抛物线的光学性质：平行于轴的光线反射后过焦点。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n统一：到焦点距离/到准线距离=e\n<\/li><li>\ne&lt;1 椭圆，e=1 抛物线，e&gt;1 双曲线\n<\/li><li>\n平移旋转不改变曲线类型\n<\/ul>", "c01": "<h1>离心率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>e=c/a，一个数决定曲线是圆、椭圆、抛物线还是双曲线。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是三条曲线的统一开关，也是判断“扁不扁、张不张”的唯一指标。<\/p>\n<h2>详解<\/h2>\n<p>椭圆 0&lt;e&lt;1，e 越大越扁；抛物线 e=1；双曲线 e&gt;1，e 越大开口越张。用统一定义看，e 就是“到焦点距离与到准线距离之比”。<\/p>\n<h2>常见误解<\/h2>\n<p>把 e 当成斜率或焦距，混淆 c/a 与 c 的含义。<\/p>\n<h2>相关概念<\/h2>\n<p>椭圆（ch01）、统一定义（ch03）<\/p>", "c02": "<h1>a、b、c 的关系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>椭圆是 b²=a²−c²，双曲线是 b²=c²−a²，符号相反。<\/p>\n<h2>为什么重要<\/h2>\n<p>这三者的关系决定焦点位置、顶点坐标与渐近线，写错一处整题皆错。<\/p>\n<h2>详解<\/h2>\n<p>椭圆中 a 最大（a²=b²+c²）；双曲线中 c 最大（c²=a²+b²）。记住“谁最大”就不会写反：椭圆 a 最大，双曲线 c 最大。<\/p>\n<h2>常见误解<\/h2>\n<p>把两个关系式互换，导致焦点坐标或渐近线全错。<\/p>\n<h2>相关概念<\/h2>\n<p>椭圆（ch01）、双曲线（ch02）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：椭圆<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：椭圆<\/a><br>检查点：能由方程读出 a、b、c、e<\/li><li class='path-step' id='path-02'><strong>步骤 02：双曲线与抛物线<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：双曲线与抛物线<\/a><br>检查点：能写出渐近线与准线<\/li><li class='path-step' id='path-03'><strong>步骤 03：统一定义、光学性质与坐标变换<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：统一定义、光学性质与坐标变换<\/a><br>检查点：能用 e 判断曲线类型<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 椭圆 x²/36+y²/20=1 的离心率是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 2/3<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> √2/3<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 4/9<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 1/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 抛物线 x²=−8y 的焦点坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> (0,−2)<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> (0,2)<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> (−2,0)<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> (2,0)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：椭圆<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 椭圆 x²/16+y²/7=1 的焦距是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 9<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 18<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 椭圆的离心率 e 的取值范围是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> (0,1)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> (1,+∞)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> [0,1]<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> (0,+∞)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：双曲线与抛物线<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 双曲线 x²/16−y²/9=1 的渐近线是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> y=±(3/4)x<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> y=±(4/3)x<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> y=±(9/16)x<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> y=±x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 抛物线 y²=12x 的焦点坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> (3,0)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> (6,0)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> (0,3)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> (12,0)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：统一定义、光学性质与坐标变换<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 离心率 e=1 对应的圆锥曲线是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 椭圆<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 双曲线<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 抛物线<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 圆<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 平行于抛物线对称轴的光线经反射后：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 原路返回<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 过焦点<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 平行射出<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 发散<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='椭圆'>椭圆 — 到两定点距离之和为常数的点的轨迹。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><li data-term='焦点'>焦点 — 定义中的定点。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><li data-term='半长轴'>半长轴 — 椭圆中的 a，长轴长为 2a。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><li data-term='离心率'>离心率 — e=c/a，描述曲线的形状参数。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><li data-term='双曲线'>双曲线 — 到两定点距离之差为常数的点的轨迹。 <span class=glossary-ref>（第 2 章：双曲线与抛物线）<\/span><\/li><li data-term='渐近线'>渐近线 — 双曲线无限接近但不相交的直线。 <span class=glossary-ref>（第 2 章：双曲线与抛物线）<\/span><\/li><li data-term='抛物线'>抛物线 — 到定点与定直线等距的点的轨迹。 <span class=glossary-ref>（第 2 章：双曲线与抛物线）<\/span><\/li><li data-term='准线'>准线 — 统一定义中的定直线。 <span class=glossary-ref>（第 3 章：统一定义、光学性质与坐标变换）<\/span><\/li><li data-term='通径'>通径 — 过焦点垂直于对称轴的弦。 <span class=glossary-ref>（第 1 章：椭圆）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：识曲线三步<\/h2>\n<p>① 看方程次数与符号（两平方项同号为椭圆、异号为双曲线、一次项为抛物线）；② 看谁最大定焦点；③ 算 e 定形状。<\/p>\n<h2>框架：求方程四步<\/h2>\n<p>① 定型（焦点在哪轴）；② 设标准式；③ 用 a、b、c 关系与已知点列方程；④ 解出并写回标准形。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>椭圆<\/td><td>x²/a²+y²/b²=1，b²=a²−c²，e=c/a&lt;1<\/td><\/tr><tr><td>双曲线<\/td><td>x²/a²−y²/b²=1，b²=c²−a²，e=c/a&gt;1<\/td><\/tr><tr><td>渐近线<\/td><td>y=±(b/a)x<\/td><\/tr><tr><td>抛物线<\/td><td>y²=2px，焦点 (p/2,0)，准线 x=−p/2<\/td><\/tr><tr><td>统一定义<\/td><td><\/td><td>PF<\/td><td>/d(P,l)=e<\/td><\/tr><tr><td>通径<\/td><td>2b²/a<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
