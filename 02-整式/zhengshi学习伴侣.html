<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>整式</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/picocss/2.0.6/dist/css/pico.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
sup{font-size:.72em;line-height:0;vertical-align:super}
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>整式</h1>
    <div class="sub">字母也能算：整式的加减乘除与恒等变形</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>
<script>
const DATA = {"manifest": {"slug": "zhengshi", "title": "整式", "subtitle": "字母也能算：整式的加减乘除与恒等变形", "book": {"title": "整式", "author": "吉星 杨佩祥", "source": ["数学基础知识丛书-02-整式 吉星 杨佩祥.pdf"]}, "audience": "零基础", "goal": "把单项式、多项式的四则运算做熟，能用乘法公式与待定系数法完成整式变形。", "learningPath": [{"step": "01", "title": "整式的概念与加减法", "chapterIds": ["ch01"], "checkpoint": "能判断同类项并化简含括号的多项式"}, {"step": "02", "title": "整式的乘法与乘法公式", "chapterIds": ["ch02"], "checkpoint": "能默写三个乘法公式并逆用"}, {"step": "03", "title": "整式的除法", "chapterIds": ["ch03"], "checkpoint": "能做多项式长除法并写出带余除式"}, {"step": "04", "title": "多项式恒等定理与待定系数法", "chapterIds": ["ch04"], "checkpoint": "能设系数解出使两式恒等的参数"}], "chapters": [{"id": "ch01", "title": "第 1 章：整式的概念与加减法", "file": "chapters/ch01-concept-add-subtract.md", "difficulty": 1, "source": {"file": "数学基础知识丛书-02-整式 吉星 杨佩祥.pdf", "kind": "原书 PDF"}, "prereqNote": "数与字母、乘法分配律", "depthFragment": "chapters/ch01-depth.md", "prerequisites": []}, {"id": "ch02", "title": "第 2 章：整式的乘法与乘法公式", "file": "chapters/ch02-multiplication.md", "difficulty": 2, "source": {"file": "数学基础知识丛书-02-整式 吉星 杨佩祥.pdf", "kind": "原书 PDF"}, "prereqNote": "指数法则", "depthFragment": "chapters/ch02-depth.md", "prerequisites": ["ch01"]}, {"id": "ch03", "title": "第 3 章：整式的除法", "file": "chapters/ch03-division.md", "difficulty": 2, "source": {"file": "数学基础知识丛书-02-整式 吉星 杨佩祥.pdf", "kind": "原书 PDF"}, "prereqNote": "", "depthFragment": "chapters/ch03-depth.md", "prerequisites": ["ch02"]}, {"id": "ch04", "title": "第 4 章：多项式恒等定理与待定系数法", "file": "chapters/ch04-identity.md", "difficulty": 3, "source": {"file": "数学基础知识丛书-02-整式 吉星 杨佩祥.pdf", "kind": "原书 PDF"}, "prereqNote": "", "depthFragment": "chapters/ch04-depth.md", "prerequisites": ["ch03"]}], "concepts": [{"id": "c01", "title": "同类项与合并", "file": "concepts/c01-like-terms.md", "chapterIds": ["ch01"], "source": {"file": "数学基础知识丛书-02-整式 吉星 杨佩祥.pdf", "kind": "原书 PDF"}, "prerequisites": ["ch01"]}, {"id": "c02", "title": "带余除式与恒等定理", "file": "concepts/c02-division-identity.md", "chapterIds": ["ch03", "ch04"], "source": {"file": "数学基础知识丛书-02-整式 吉星 杨佩祥.pdf", "kind": "原书 PDF"}, "prerequisites": ["ch03", "ch04"]}], "glossary": [{"term": "单项式", "def": "数与字母的乘积，单独一个数或字母也算。", "chapterId": "ch01"}, {"term": "系数", "def": "单项式中的数字因数。", "chapterId": "ch01"}, {"term": "次数", "def": "单项式各字母指数之和；多项式取最高次项的次数。", "chapterId": "ch01"}, {"term": "同类项", "def": "字母相同且相同字母指数也相同的项。", "chapterId": "ch01"}, {"term": "分配律", "def": "a(b+c)=ab+ac，整式变形的基本依据。", "chapterId": "ch01"}, {"term": "乘法公式", "def": "平方差、完全平方、立方和差三组展开结果。", "chapterId": "ch02"}, {"term": "长除法", "def": "逐次消去最高次项的多项式除法。", "chapterId": "ch03"}, {"term": "带余除式", "def": "A=BQ+R，余式次数低于除式。", "chapterId": "ch03"}, {"term": "恒等", "def": "对字母的一切取值两边都相等。", "chapterId": "ch04"}, {"term": "待定系数法", "def": "设出含未知系数的形式，再比较系数求解。", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "−3x²y 的系数与次数分别是：", "options": ["−3，2", "−3，3", "3，3", "3，2"], "answer": 1, "explain": "系数是数字因数 −3；次数是各字母指数之和 2+1=3。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "化简 a−(2a−b)+b 的结果是：", "options": ["−a+2b", "−a", "3a", "−a−2b"], "answer": 0, "explain": "去括号：a−2a+b+b = −a+2b。括号前是负号，−b 变 +b。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "展开 (2x−3)(2x+3) 的结果是：", "options": ["4x²−9", "4x²+9", "4x²−12x+9", "4x²−6x−9"], "answer": 0, "explain": "平方差公式：(2x)²−3²=4x²−9。", "relatedConceptId": "", "prerequisites": ["ch02"]}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "计算 102×98 最简便的算法是：", "options": ["102×100−102×2", "(100+2)(100−2)=100²−4", "100×98+2×98", "直接竖式相乘"], "answer": 1, "explain": "102×98=(100+2)(100−2)=100²−2²=9996，用平方差一步到位。", "relatedConceptId": "", "prerequisites": ["ch02"]}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "12x⁴y²÷3x²y 的结果是：", "options": ["4x²y", "4x⁶y³", "4x²y²", "4x²"], "answer": 0, "explain": "系数 12÷3=4；x 的指数 4−2=2；y 的指数 2−1=1，得 4x²y。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "(x²−1)÷(x−1) 的商与余式分别是：", "options": ["x+1，0", "x−1，0", "x+1，2", "x，1"], "answer": 0, "explain": "x²−1=(x−1)(x+1)，整除，商 x+1，余式 0。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "ch04", "type": "single", "question": "若 x²+ax+b≡(x−1)(x+4)，则 a、b 为：", "options": ["a=3，b=−4", "a=5，b=4", "a=−3，b=−4", "a=3，b=4"], "answer": 0, "explain": "右边展开 x²+3x−4，比较系数得 a=3，b=−4。", "relatedConceptId": "c02", "prerequisites": ["ch04"]}, {"id": "q08", "chapterId": "ch04", "type": "single", "question": "两个三次多项式在几个不同点上取值相同，就一定能判定它们恒等？", "options": ["2 个", "3 个", "4 个", "1 个"], "answer": 2, "explain": "次数为 3，需要 n+1=4 个不同的点；少于 4 个不足以排除差多项式有根的情况。", "relatedConceptId": "c02", "prerequisites": ["ch04"]}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "下列各组中，是同类项的是：", "options": ["3x²y 与 3xy²", "−2ab 与 5ba", "x² 与 x³", "2a 与 2b"], "answer": 1, "explain": "−2ab 与 5ba 字母相同、指数都是 1，是同类项；其余三组字母或指数不同。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "(x³+1)÷(x+1) 的商是：", "options": ["x²−x+1", "x²+x+1", "x²−1", "x²+1"], "answer": 0, "explain": "x³+1=(x+1)(x²−x+1)，故商为 x²−x+1，余式 0。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q11", "chapterId": "__all__", "type": "single", "question": "若 2x²+ax−3≡2(x−1)(x+2)+b，则 a、b 为：", "options": ["a=2，b=1", "a=2，b=−3", "a=−2，b=1", "a=1，b=1"], "answer": 0, "explain": "右边展开得 2x²+2x−4+b。比较 x 项系数得 a=2；比较常数项 −3=−4+b 得 b=1。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：整式的概念与加减法」的一句话核心是什么？", "back": "整式的加减只做一件事：把字母部分完全相同的项并起来，系数相加。", "tags": ["zhengshi", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：整式的乘法与乘法公式」的一句话核心是什么？", "back": "乘法就是反复用分配律展开；指数法则负责字母部分，乘法公式是展开结果的压缩记忆。", "tags": ["zhengshi", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：整式的除法」的一句话核心是什么？", "back": "除法是指数法则的逆用；除不尽时写成 A=BQ+R，余式的次数必须低于除式。", "tags": ["zhengshi", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：多项式恒等定理与待定系数法」的一句话核心是什么？", "back": "两个次数不超过 n 的多项式，只要在 n+1 个不同点取值相同，就恒等；于是可以设出系数再解方程。", "tags": ["zhengshi", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「单项式」？", "back": "数与字母的乘积，单独一个数或字母也算。", "tags": ["zhengshi", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「系数」？", "back": "单项式中的数字因数。", "tags": ["zhengshi", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「次数」？", "back": "单项式各字母指数之和；多项式取最高次项的次数。", "tags": ["zhengshi", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「同类项」？", "back": "字母相同且相同字母指数也相同的项。", "tags": ["zhengshi", "术语"]}, {"id": "f09", "chapterId": "ch01", "front": "什么是「分配律」？", "back": "a(b+c)=ab+ac，整式变形的基本依据。", "tags": ["zhengshi", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「乘法公式」？", "back": "平方差、完全平方、立方和差三组展开结果。", "tags": ["zhengshi", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「长除法」？", "back": "逐次消去最高次项的多项式除法。", "tags": ["zhengshi", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「带余除式」？", "back": "A=BQ+R，余式次数低于除式。", "tags": ["zhengshi", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「恒等」？", "back": "对字母的一切取值两边都相等。", "tags": ["zhengshi", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「待定系数法」？", "back": "设出含未知系数的形式，再比较系数求解。", "tags": ["zhengshi", "术语"]}], "companion": "zhengshi学习伴侣.html", "deriv": "zhengshi从零推导.html"}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">数与字母、乘法分配律<\/span><\/div><h1>第 1 章：整式的概念与加减法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：数与字母、乘法分配律\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n分清单项式的系数与次数、多项式的项与次数\n<\/li><li>\n识别同类项并按分配律合并\n<\/li><li>\n正确去括号、添括号\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>整式的加减只做一件事：把字母部分完全相同的项并起来，系数相加。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 单项式<\/h3>\n<p>数与字母的乘积叫<strong>单项式<\/strong>，单独一个数或一个字母也算单项式。例如 5x、−3x²y、7、a 都是单项式。<\/p>\n<ul><li>\n<strong>系数<\/strong>：单项式里的数字因数。−3x²y 的系数是 −3。\n<\/li><li>\n<strong>次数<\/strong>：所有字母的指数之和。−3x²y 的次数是 2+1=3。\n<\/ul>\n<h3>1.2 多项式<\/h3>\n<p>几个单项式的和叫<strong>多项式<\/strong>，其中每个单项式叫<strong>项<\/strong>，不含字母的项叫<strong>常数项<\/strong>。多项式里次数最高的项的次数，就是这个多项式的<strong>次数<\/strong>。<\/p>\n<p>例如 3x²−2x+5 是二次三项式：三项分别是 3x²、−2x、5，次数为 2。<\/p>\n<h3>1.3 同类项与合并<\/h3>\n<p><strong>字母相同、并且相同字母的指数也相同<\/strong>的项叫同类项。3x²y 与 −7x²y 是同类项；3x² 与 3x 不是（指数不同）。<\/p>\n<p>合并同类项的依据是分配律：<\/p>\n<p>3x²+5x²=(3+5)x²=8x²<\/p>\n<p>字母部分原样保留，只把系数相加。常数项之间也是同类项。<\/p>\n<h3>1.4 去括号与添括号<\/h3>\n<p>括号前是“+”，去括号后各项符号不变；括号前是“−”，去括号后各项都变号：<\/p>\n<p>a−(b+c)=a−b−c<\/p>\n<p>理由仍是分配律：a−(b+c)=a+(−1)(b+c)=a−b−c。添括号是反方向：需要把几项括起来时，括号前加“−”，括进去的每一项都要变号。<\/p>\n<h3>1.5 化简的顺序<\/h3>\n<p>先去括号（由内向外），再合并同类项；有多个括号时，每去一层就检查一次符号。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：同类项像同一种水果——3 个苹果加 5 个苹果是 8 个苹果，但 3 个苹果加 5 个梨不能合并。<\/p>\n<p><strong>失效边界<\/strong>：字母部分只要有一处不同（哪怕只是指数不同），就不是同类项，不能合并。<\/p>\n<p><strong>实例<\/strong>：化简 3x²y−2xy²+5x²y−xy²。 同类项分组：(3+5)x²y + (−2−1)xy² = 8x²y−3xy²。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 3x² 与 3x 是同类项 —— 实际上 指数不同就不是同类项。x² 与 x 表示不同的字母幂，不能合并。\n<\/li><li>\n别以为 2(x+y)=2x+y —— 实际上 分配律要求括号内每一项都乘：2(x+y)=2x+2y。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n−3x²y 的系数与次数分别是：\n<\/li><li>\n化简 a−(2a−b)+b 的结果是：\n<p>A. −3，2 ｜ B. −3，3 ｜ C. 3，3 ｜ D. 3，2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：系数是数字因数 −3；次数是各字母指数之和 2+1=3。 A. −a+2b ｜ B. −a ｜ C. 3a ｜ D. −a−2b <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：去括号：a−2a+b+b = −a+2b。括号前是负号，−b 变 +b。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单项式看系数与次数，多项式看项与最高次\n<\/li><li>\n同类项两条件：字母相同、指数相同\n<\/li><li>\n括号前是负号，去括号每一项都变号\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：整式的概念与加减法）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：整式的概念与加减法<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>整式加减没有新规则，全部来自分配律。下面把三条常用变形逐条还原成分配律。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>单项式是数与字母的乘积；多项式是若干个单项式的和。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>合并同类项像清点库存：同一种货才能加在一起，不同货只能并列记着。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 合并同类项的依据<\/h3>\n<div class=\"katex-block\">3x^{2}+5x^{2}=(3+5)x^{2}=8x^{2}<\/div>\n<p>把 x² 看成公因式，用分配律反过来提出来。<\/p>\n<h3>2. 去括号的依据<\/h3>\n<div class=\"katex-block\">a-(b+c)=a+(-1)(b+c)=a-b-c<\/div>\n<p>括号前是负号，等于括号内每一项都乘 −1。<\/p>\n<h3>3. 多项式次数<\/h3>\n<div class=\"katex-block\">\\deg P=\\max\\{\\deg(\\text{各项})\\}<\/div>\n<p>次数取最高的那一项，不看系数大小。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>系数相加只对“字母部分完全相同”的项成立；字母部分不同时相加没有意义。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《整式》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 1 章：整式的概念与加减法"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：整式的概念与加减法<\/a><\/span><\/div><h1>第 2 章：整式的乘法与乘法公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、指数法则\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按“系数相乘、指数相加”做单项式乘法\n<\/li><li>\n用分配律展开多项式乘法并合并同类项\n<\/li><li>\n默写并逆用三个乘法公式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>乘法就是反复用分配律展开；指数法则负责字母部分，乘法公式是展开结果的压缩记忆。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 单项式乘单项式<\/h3>\n<p>系数相乘，同底数幂的指数相加：<\/p>\n<p>(−2x²y)(3xy³) = (−2×3)·x<sup>2+1<\/sup>·y<sup>1+3<\/sup> = −6x³y⁴<\/p>\n<p>不同字母各自保留，不要强行相加指数。<\/p>\n<h3>2.2 单项式乘多项式、多项式乘多项式<\/h3>\n<p>单项式乘多项式，把单项式乘到括号内每一项：<\/p>\n<p>a(b+c)=ab+ac<\/p>\n<p>多项式乘多项式，前一个多项式的每一项乘后一个多项式的每一项，再把同类项并起来：<\/p>\n<p>(a+b)(c+d)=ac+ad+bc+bd<\/p>\n<p>展开后项数是两个多项式项数的乘积，合并同类项前先数项，能及时发现漏乘。<\/p>\n<h3>2.3 三个乘法公式<\/h3>\n<ul><li>\n<strong>平方差<\/strong>：(a+b)(a−b)=a²−b²\n<\/li><li>\n<strong>完全平方<\/strong>：(a±b)²=a²±2ab+b²\n<\/li><li>\n<strong>立方和差<\/strong>：(a±b)(a²∓ab+b²)=a³±b³\n<\/ul>\n<p>三个公式都是展开后的特例，不是新规则。记不住时，直接展开一遍即可。<\/p>\n<h3>2.4 正用与逆用<\/h3>\n<p>正用：把乘积写成多项式，如 (2x−3y)(2x+3y)=4x²−9y²。<\/p>\n<p>逆用：把多项式写成乘积，如 x²−9=(x−3)(x+3)。逆用是后面因式分解的入口。<\/p>\n<p>数值计算里也能用：99×101=(100−1)(100+1)=100²−1=9999。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：多项式乘法像发牌——第一个括号里每一项都要和第二个括号里每一项碰一次，碰完再归类。<\/p>\n<p><strong>失效边界<\/strong>：碰的次数是项数相乘，项数多时容易漏；公式只在结构完全对上时才能套。<\/p>\n<p><strong>实例<\/strong>：展开 (x+2)(x−3)。 逐项相乘：x²−3x+2x−6 = x²−x−6。 若用公式检查：这不是平方差结构（两项符号不同但常数不等），不能硬套。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 (a+b)²=a²+b² —— 实际上 漏了中间项。正确结果是 a²+2ab+b²，可用 a=1,b=1 代入检验：左边 4，右边 2。\n<\/li><li>\n别以为 x²−9 不能再分解 —— 实际上 它是平方差，x²−9=(x−3)(x+3)，逆用公式即可。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n展开 (2x−3)(2x+3) 的结果是：\n<\/li><li>\n计算 102×98 最简便的算法是：\n<p>A. 4x²−9 ｜ B. 4x²+9 ｜ C. 4x²−12x+9 ｜ D. 4x²−6x−9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：平方差公式：(2x)²−3²=4x²−9。 A. 102×100−102×2 ｜ B. (100+2)(100−2)=100²−4 ｜ C. 100×98+2×98 ｜ D. 直接竖式相乘 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：102×98=(100+2)(100−2)=100²−2²=9996，用平方差一步到位。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单项式相乘：系数乘系数，指数相加\n<\/li><li>\n多项式相乘：逐项相乘后合并同类项\n<\/li><li>\n平方差与完全平方都是展开的特例\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：整式的乘法与乘法公式）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：整式的乘法与乘法公式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>乘法公式没有一条是“新规定”，全部能从分配律展开得到。下面展开三次，看清中间项从哪里来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>两个多项式相乘，等于把第一个的每一项分别乘第二个的每一项，再把结果相加。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>展开像把两张清单交叉配对：左边每一项都要和右边每一项配一次，配完再按同类归堆。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 平方差<\/h3>\n<div class=\"katex-block\">(a+b)(a-b)=a^{2}-ab+ab-b^{2}=a^{2}-b^{2}<\/div>\n<p>中间两项 −ab 与 +ab 相消，只剩两个平方。<\/p>\n<h3>2. 完全平方<\/h3>\n<div class=\"katex-block\">(a+b)^{2}=(a+b)(a+b)=a^{2}+ab+ba+b^{2}=a^{2}+2ab+b^{2}<\/div>\n<p>中间两项 ab 与 ba 相同，合并成 2ab。<\/p>\n<h3>3. 指数法则<\/h3>\n<div class=\"katex-block\">a^{m}\\cdot a^{n}=a^{m+n}<\/div>\n<p>m 个 a 再乘 n 个 a，一共 m+n 个 a，所以指数相加。<\/p>\n<h3>4. 逆用示例<\/h3>\n<div class=\"katex-block\">x^{2}-9=(x-3)(x+3)<\/div>\n<p>把 x²−3² 认成平方差，反着写回乘积形式。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>公式套用要求结构完全一致；项的顺序、符号、系数都要对上，否则回到逐项展开。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《整式》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 2 章：整式的乘法与乘法公式"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：整式的乘法与乘法公式<\/a><\/span><\/div><h1>第 3 章：整式的除法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按“系数相除、指数相减”做单项式除法\n<\/li><li>\n用长除法做多项式除以多项式\n<\/li><li>\n写出带余除式 A=BQ+R 并判断余式次数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>除法是指数法则的逆用；除不尽时写成 A=BQ+R，余式的次数必须低于除式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 单项式除以单项式<\/h3>\n<p>系数相除，同底数幂的指数相减：<\/p>\n<p>6x⁵y³ ÷ 2x²y = 3x<sup>5−2<\/sup>y<sup>3−1<\/sup> = 3x³y²<\/p>\n<p>被除式里没有的字母，结果中也不出现；指数相减出现负数时，按负指数写成倒数。<\/p>\n<h3>3.2 多项式除以单项式<\/h3>\n<p>把多项式的每一项分别除以这个单项式，再把商相加：<\/p>\n<p>(6x³−4x²)÷2x = 3x²−2x<\/p>\n<h3>3.3 多项式除以多项式：长除法<\/h3>\n<p>步骤与整数长除法相同：<\/p>\n<ol><li>\n用被除式的最高次项除以除式的最高次项，得到商的第一项；\n<\/li><li>\n用这一项乘除式，从被除式里减掉；\n<\/li><li>\n对余下的式子重复上述两步，直到余式的次数低于除式。\n<\/ol>\n<p>例：(x³−1)÷(x−1)。第一次商 x²，减得 x²−1；再商 x，减得 x−1；再商 1，减得 0。所以商是 x²+x+1，余式为 0。<\/p>\n<h3>3.4 带余除式<\/h3>\n<p>一般地，对被除式 A、除式 B（B≠0），存在唯一的商 Q 与余式 R，使<\/p>\n<p>A = BQ + R，且 R 的次数低于 B 的次数（或 R=0）<\/p>\n<p>这条式子是后面“余数定理”“因式定理”的基础。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：长除法像分装——每次先用最大的盒子装，装完把剩下的再分，直到剩下的装不满一个盒子。<\/p>\n<p><strong>失效边界<\/strong>：除法要求除式不为零；除式是零多项式时整个式子没有意义。<\/p>\n<p><strong>实例<\/strong>：(2x³+3x²−5x+2)÷(x+2)。 第一次商 2x²，乘除式得 2x³+4x²，相减得 −x²−5x+2； 再商 −x，乘得 −x²−2x，相减得 −3x+2； 再商 −3，乘得 −3x−6，相减得 8。 所以商 2x²−x−3，余式 8，即 2x³+3x²−5x+2=(x+2)(2x²−x−3)+8。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 除法就是指数相减，任何式子都能除尽 —— 实际上 只有单项式相除才直接减指数；多项式相除可能有余式，余式不为零就除不尽。\n<\/li><li>\n别以为 余式可以任意次数 —— 实际上 带余除式要求余式次数严格低于除式次数，否则还能继续除。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n12x⁴y²÷3x²y 的结果是：\n<\/li><li>\n(x²−1)÷(x−1) 的商与余式分别是：\n<p>A. 4x²y ｜ B. 4x⁶y³ ｜ C. 4x²y² ｜ D. 4x² <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：系数 12÷3=4；x 的指数 4−2=2；y 的指数 2−1=1，得 4x²y。 A. x+1，0 ｜ B. x−1，0 ｜ C. x+1，2 ｜ D. x，1 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：x²−1=(x−1)(x+1)，整除，商 x+1，余式 0。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单项式相除：系数相除、指数相减\n<\/li><li>\n多项式相除用长除法，逐次消去最高次项\n<\/li><li>\n带余除式：A=BQ+R，R 的次数低于 B\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：整式的除法）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：整式的除法<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>除法只是乘法的逆运算。理解了“指数相减来自指数相加”，长除法就不需要背步骤。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>若存在多项式 Q、R 使 A=BQ+R 且 R 的次数低于 B（或 R=0），则 Q 为商、R 为余式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>长除法像削苹果：每次削掉能被除式整除的那一层，直到剩下的小于一个除式。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 单项式相除<\/h3>\n<div class=\"katex-block\">\\frac{a^{m}}{a^{n}}=a^{m-n}\\quad(a\\ne 0)<\/div>\n<p>由 a<sup>m-n<\/sup>\\cdot a<sup>n<\/sup>=a<sup>m<\/sup> 反推，指数相减是指数相加的逆。<\/p>\n<h3>2. 系数相除<\/h3>\n<div class=\"katex-block\">\\frac{6x^{5}y^{3}}{2x^{2}y}=3x^{3}y^{2}<\/div>\n<p>系数照常相除，字母部分按同一字母的指数相减。<\/p>\n<h3>3. 带余除式<\/h3>\n<div class=\"katex-block\">A=BQ+R,\\quad \\deg R<\\deg B<\/div>\n<p>余式次数必须低于除式，否则还能再商一次。<\/p>\n<h3>4. 整除的判据<\/h3>\n<div class=\"katex-block\">B\\mid A\\iff R=0<\/div>\n<p>余式为零就是整除；这也是因式定理的来源。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>带余除式的唯一性依赖“次数严格下降”，否则商可以无限加项。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《整式》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 3 章：整式的除法"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：整式的除法<\/a><\/span><\/div><h1>第 4 章：多项式恒等定理与待定系数法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清两个多项式在什么条件下恒等\n<\/li><li>\n用比较系数或代特殊值求未知系数\n<\/li><li>\n判断一个恒等式是否可能成立\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>两个次数不超过 n 的多项式，只要在 n+1 个不同点取值相同，就恒等；于是可以设出系数再解方程。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 什么是恒等<\/h3>\n<p>两个多项式恒等，指对字母的任意取值，两边的值都相等，记作 P(x)≡Q(x)。<\/p>\n<p>注意区别：方程只要求“某些 x 使两边相等”，恒等式要求“所有 x 都相等”。<\/p>\n<h3>4.2 恒等定理<\/h3>\n<p>如果两个次数都不超过 n 的多项式 P、Q 在 n+1 个互不相同的点上取值相同，那么 P≡Q。<\/p>\n<p>直观理由：P−Q 的次数不超过 n；如果它不是零多项式，最多只有 n 个根。现在它有 n+1 个不同的根，只能恒等于零。<\/p>\n<h3>4.3 待定系数法<\/h3>\n<p>步骤：<\/p>\n<ol><li>\n按已知结构设出带未知系数的形式（如 ax²+bx+c）；\n<\/li><li>\n展开、合并同类项，或代入几个特殊值；\n<\/li><li>\n比较两边同类项的系数（或解方程组），求出未知系数；\n<\/li><li>\n回代检验。\n<\/ol>\n<p>常用特殊值：x=0 求常数项，x=1 求系数和，x=−1 求交错和。<\/p>\n<h3>4.4 典型用法<\/h3>\n<ul><li>\n求参数：已知 x²+ax+b≡(x−1)(x+3)，展开右边得 x²+2x−3，比较系数得 a=2，b=−3。\n<\/li><li>\n拆分分式：把有理分式拆成几个简单分式之和（第 4 册会用到）。\n<\/li><li>\n判断命题：若两边次数不同，恒等一定不成立，不必再算。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：恒等定理像“指纹比对”——不必逐点验证整条曲线，只要在足够多的点上对上了，两条曲线就只能是同一条。<\/p>\n<p><strong>失效边界<\/strong>：点数必须超过次数。“足够多”不是随便几个，n 次多项式要 n+1 个点。<\/p>\n<p><strong>实例<\/strong>：求 a、b 使 x²+ax+b≡(x−2)(x+5)。 右边展开：x²+3x−10。比较系数：a=3，b=−10。 检验：取 x=0，左边 b=−10，右边 (−2)(5)=−10，一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 只要有两个点取值相同就恒等 —— 实际上 两点只能确定一次多项式；二次及以上需要三个以上不同的点。\n<\/li><li>\n别以为 恒等式可以直接用“移项求解”的方式处理 —— 实际上 恒等式对所有 x 成立，比较的是系数，不是解出某个 x。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 x²+ax+b≡(x−1)(x+4)，则 a、b 为：\n<\/li><li>\n两个三次多项式在几个不同点上取值相同，就一定能判定它们恒等？\n<p>A. a=3，b=−4 ｜ B. a=5，b=4 ｜ C. a=−3，b=−4 ｜ D. a=3，b=4 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：右边展开 x²+3x−4，比较系数得 a=3，b=−4。 A. 2 个 ｜ B. 3 个 ｜ C. 4 个 ｜ D. 1 个 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：次数为 3，需要 n+1=4 个不同的点；少于 4 个不足以排除差多项式有根的情况。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n恒等：对所有取值都相等；方程：只对某些取值相等\n<\/li><li>\nn 次多项式需 n+1 个点才能定死\n<\/li><li>\n待定系数法：设形式 → 比较系数 → 解方程 → 回代\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：多项式恒等定理与待定系数法）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：多项式恒等定理与待定系数法<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>恒等定理的证明只用一句话：差多项式的根太多，只能是零多项式。下面把它写清楚。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>P≡Q 指对一切 x，P(x)=Q(x)。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像两条路线图：如果在足够多的路口都重合，且两条路都是“直路”（次数有限），那它们只能是同一条路。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 差多项式<\/h3>\n<div class=\"katex-block\">D(x)=P(x)-Q(x),\\quad \\deg D\\le n<\/div>\n<p>两个 n 次多项式相减，次数不会超过 n。<\/p>\n<h3>2. 根的上限<\/h3>\n<div class=\"katex-block\">D\\not\\equiv 0\\ \\Rightarrow\\ D\\ \\text{至多有}\\ n\\ \\text{个根}<\/div>\n<p>非零多项式的根数不超过其次数，这是代数基本事实。<\/p>\n<h3>3. 矛盾<\/h3>\n<div class=\"katex-block\">D(x_i)=0\\ (i=1,\\ldots,n+1)\\ \\Rightarrow\\ D\\equiv 0<\/div>\n<p>n+1 个不同的根超过了上限，所以差多项式只能恒为零。<\/p>\n<h3>4. 待定系数<\/h3>\n<div class=\"katex-block\">x^{2}+ax+b\\equiv (x-1)(x+3)=x^{2}+2x-3<\/div>\n<p>展开右边，比较同次项系数：a=2，b=−3。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>点数不足时结论不成立；此外定理只对“多项式”成立，对一般函数不成立。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《整式》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 4 章：多项式恒等定理与待定系数法"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：整式的概念与加减法<\/a><\/span><\/div><h1>同类项与合并<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>字母相同、对应指数也相同的项，才能把系数加起来。<\/p>\n<h2>为什么重要<\/h2>\n<p>整式加减的全部技术都在这里；判断错同类项，后面化简、因式分解都会连锁出错。<\/p>\n<h2>详解<\/h2>\n<p>判断同类项看两件事：字母种类是否完全一致、每个字母的指数是否一致。系数与字母的排列顺序不影响。合并时只加系数，字母部分照抄。<\/p>\n<h2>常见误解<\/h2>\n<p>别把“字母相同”当成同类项的全部条件：x² 与 x 字母相同但指数不同，不能合并。<\/p>\n<h2>相关概念<\/h2>\n<p>单项式（ch01）、分配律（ch01）<\/p>", "kind": "concept", "title": "同类项与合并"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：整式的除法<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：多项式恒等定理与待定系数法<\/a><\/span><\/div><h1>带余除式与恒等定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>除不尽就写成 A=BQ+R；两个多项式在足够多点重合就恒等。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两条是“整式”从计算走向理论的转折：一条给出除法的完整结果，一条给出判断两个式子是否同一的办法。<\/p>\n<h2>详解<\/h2>\n<p>带余除式保证余式次数低于除式，从而商与余式唯一；恒等定理把“逐点验证”压缩成“有限个点验证”，两者都靠“次数”这个有限指标起作用。<\/p>\n<h2>常见误解<\/h2>\n<p>把“在若干点相等”当成恒等：点数不足时不成立。<\/p>\n<h2>相关概念<\/h2>\n<p>长除法（ch03）、待定系数法（ch04）<\/p>", "kind": "concept", "title": "带余除式与恒等定理"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：整式的概念与加减法<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：整式的概念与加减法<\/a><br>检查点：能判断同类项并化简含括号的多项式<\/li><li class='path-step' id='path-02'><strong>步骤 02：整式的乘法与乘法公式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：整式的乘法与乘法公式<\/a><br>检查点：能默写三个乘法公式并逆用<\/li><li class='path-step' id='path-03'><strong>步骤 03：整式的除法<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：整式的除法<\/a><br>检查点：能做多项式长除法并写出带余除式<\/li><li class='path-step' id='path-04'><strong>步骤 04：多项式恒等定理与待定系数法<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：多项式恒等定理与待定系数法<\/a><br>检查点：能设系数解出使两式恒等的参数<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q09' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q9.<\/b> 下列各组中，是同类项的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 3x²y 与 3xy²<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> −2ab 与 5ba<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> x² 与 x³<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 2a 与 2b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q10.<\/b> (x³+1)÷(x+1) 的商是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> x²−x+1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> x²+x+1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> x²−1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> x²+1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q11.<\/b> 若 2x²+ax−3≡2(x−1)(x+2)+b，则 a、b 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> a=2，b=1<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> a=2，b=−3<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> a=−2，b=1<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> a=1，b=1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：整式的概念与加减法<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> −3x²y 的系数与次数分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> −3，2<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> −3，3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 3，3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 3，2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 化简 a−(2a−b)+b 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> −a+2b<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> −a<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 3a<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> −a−2b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：整式的乘法与乘法公式<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 展开 (2x−3)(2x+3) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 4x²−9<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 4x²+9<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 4x²−12x+9<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 4x²−6x−9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 计算 102×98 最简便的算法是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 102×100−102×2<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> (100+2)(100−2)=100²−4<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 100×98+2×98<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 直接竖式相乘<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：整式的除法<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 12x⁴y²÷3x²y 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 4x²y<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 4x⁶y³<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 4x²y²<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 4x²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> (x²−1)÷(x−1) 的商与余式分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> x+1，0<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> x−1，0<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> x+1，2<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> x，1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：多项式恒等定理与待定系数法<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 若 x²+ax+b≡(x−1)(x+4)，则 a、b 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> a=3，b=−4<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> a=5，b=4<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> a=−3，b=−4<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> a=3，b=4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 两个三次多项式在几个不同点上取值相同，就一定能判定它们恒等？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 2 个<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 3 个<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 4 个<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 1 个<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='单项式'>单项式 — 数与字母的乘积，单独一个数或字母也算。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='系数'>系数 — 单项式中的数字因数。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='次数'>次数 — 单项式各字母指数之和；多项式取最高次项的次数。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='同类项'>同类项 — 字母相同且相同字母指数也相同的项。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='分配律'>分配律 — a(b+c)=ab+ac，整式变形的基本依据。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='乘法公式'>乘法公式 — 平方差、完全平方、立方和差三组展开结果。 <span class=glossary-ref>（第 2 章：整式的乘法与乘法公式）<\/span><\/li><li data-term='长除法'>长除法 — 逐次消去最高次项的多项式除法。 <span class=glossary-ref>（第 3 章：整式的除法）<\/span><\/li><li data-term='带余除式'>带余除式 — A=BQ+R，余式次数低于除式。 <span class=glossary-ref>（第 3 章：整式的除法）<\/span><\/li><li data-term='恒等'>恒等 — 对字母的一切取值两边都相等。 <span class=glossary-ref>（第 4 章：多项式恒等定理与待定系数法）<\/span><\/li><li data-term='待定系数法'>待定系数法 — 设出含未知系数的形式，再比较系数求解。 <span class=glossary-ref>（第 4 章：多项式恒等定理与待定系数法）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：整式变形的三步<\/h2>\n<p>① 看结构（单项式／多项式、次数、项数）；② 选工具（合并同类项、分配律、公式、长除法）；③ 回代检验（取特殊值核对）。<\/p>\n<h2>框架：公式的三种用法<\/h2>\n<p>正用（展开）、逆用（分解）、数值化（把数字凑成公式结构做速算）。逆用是最容易被忽略的一种。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>单项式乘单项式<\/td><td>系数相乘，同底数幂指数相加<\/td><\/tr><tr><td>单项式除以单项式<\/td><td>系数相除，同底数幂指数相减<\/td><\/tr><tr><td>平方差<\/td><td>(a+b)(a−b)=a²−b²<\/td><\/tr><tr><td>完全平方<\/td><td>(a±b)²=a²±2ab+b²<\/td><\/tr><tr><td>立方和差<\/td><td>(a±b)(a²∓ab+b²)=a³±b³<\/td><\/tr><tr><td>带余除式<\/td><td>A=BQ+R，deg R&lt;deg B<\/td><\/tr><tr><td>恒等判据<\/td><td>次数≤n 的两式在 n+1 个不同点相等 ⇒ 恒等<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/02-整式", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：整式的概念与加减法", "href": "#/chapter/ch01"}, {"label": "第 2 章：整式的乘法与乘法公式", "href": "#/chapter/ch02"}, {"label": "第 3 章：整式的除法", "href": "#/chapter/ch03"}, {"label": "第 4 章：多项式恒等定理与待定系数法", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "同类项与合并", "href": "#/concept/c01"}, {"label": "带余除式与恒等定理", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：整式的概念与加减法", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：整式的乘法与乘法公式", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：整式的除法", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：多项式恒等定理与待定系数法", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">数与字母、乘法分配律<\/span><\/div><h1>第 1 章：整式的概念与加减法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：数与字母、乘法分配律\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n分清单项式的系数与次数、多项式的项与次数\n<\/li><li>\n识别同类项并按分配律合并\n<\/li><li>\n正确去括号、添括号\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>整式的加减只做一件事：把字母部分完全相同的项并起来，系数相加。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 单项式<\/h3>\n<p>数与字母的乘积叫<strong>单项式<\/strong>，单独一个数或一个字母也算单项式。例如 5x、−3x²y、7、a 都是单项式。<\/p>\n<ul><li>\n<strong>系数<\/strong>：单项式里的数字因数。−3x²y 的系数是 −3。\n<\/li><li>\n<strong>次数<\/strong>：所有字母的指数之和。−3x²y 的次数是 2+1=3。\n<\/ul>\n<h3>1.2 多项式<\/h3>\n<p>几个单项式的和叫<strong>多项式<\/strong>，其中每个单项式叫<strong>项<\/strong>，不含字母的项叫<strong>常数项<\/strong>。多项式里次数最高的项的次数，就是这个多项式的<strong>次数<\/strong>。<\/p>\n<p>例如 3x²−2x+5 是二次三项式：三项分别是 3x²、−2x、5，次数为 2。<\/p>\n<h3>1.3 同类项与合并<\/h3>\n<p><strong>字母相同、并且相同字母的指数也相同<\/strong>的项叫同类项。3x²y 与 −7x²y 是同类项；3x² 与 3x 不是（指数不同）。<\/p>\n<p>合并同类项的依据是分配律：<\/p>\n<p>3x²+5x²=(3+5)x²=8x²<\/p>\n<p>字母部分原样保留，只把系数相加。常数项之间也是同类项。<\/p>\n<h3>1.4 去括号与添括号<\/h3>\n<p>括号前是“+”，去括号后各项符号不变；括号前是“−”，去括号后各项都变号：<\/p>\n<p>a−(b+c)=a−b−c<\/p>\n<p>理由仍是分配律：a−(b+c)=a+(−1)(b+c)=a−b−c。添括号是反方向：需要把几项括起来时，括号前加“−”，括进去的每一项都要变号。<\/p>\n<h3>1.5 化简的顺序<\/h3>\n<p>先去括号（由内向外），再合并同类项；有多个括号时，每去一层就检查一次符号。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：同类项像同一种水果——3 个苹果加 5 个苹果是 8 个苹果，但 3 个苹果加 5 个梨不能合并。<\/p>\n<p><strong>失效边界<\/strong>：字母部分只要有一处不同（哪怕只是指数不同），就不是同类项，不能合并。<\/p>\n<p><strong>实例<\/strong>：化简 3x²y−2xy²+5x²y−xy²。 同类项分组：(3+5)x²y + (−2−1)xy² = 8x²y−3xy²。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 3x² 与 3x 是同类项 —— 实际上 指数不同就不是同类项。x² 与 x 表示不同的字母幂，不能合并。\n<\/li><li>\n别以为 2(x+y)=2x+y —— 实际上 分配律要求括号内每一项都乘：2(x+y)=2x+2y。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n−3x²y 的系数与次数分别是：\n<\/li><li>\n化简 a−(2a−b)+b 的结果是：\n<p>A. −3，2 ｜ B. −3，3 ｜ C. 3，3 ｜ D. 3，2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：系数是数字因数 −3；次数是各字母指数之和 2+1=3。 A. −a+2b ｜ B. −a ｜ C. 3a ｜ D. −a−2b <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：去括号：a−2a+b+b = −a+2b。括号前是负号，−b 变 +b。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单项式看系数与次数，多项式看项与最高次\n<\/li><li>\n同类项两条件：字母相同、指数相同\n<\/li><li>\n括号前是负号，去括号每一项都变号\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：整式的概念与加减法）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：整式的概念与加减法<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>整式加减没有新规则，全部来自分配律。下面把三条常用变形逐条还原成分配律。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>单项式是数与字母的乘积；多项式是若干个单项式的和。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>合并同类项像清点库存：同一种货才能加在一起，不同货只能并列记着。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 合并同类项的依据<\/h3>\n<div class=\"katex-block\">3x^{2}+5x^{2}=(3+5)x^{2}=8x^{2}<\/div>\n<p>把 x² 看成公因式，用分配律反过来提出来。<\/p>\n<h3>2. 去括号的依据<\/h3>\n<div class=\"katex-block\">a-(b+c)=a+(-1)(b+c)=a-b-c<\/div>\n<p>括号前是负号，等于括号内每一项都乘 −1。<\/p>\n<h3>3. 多项式次数<\/h3>\n<div class=\"katex-block\">\\deg P=\\max\\{\\deg(\\text{各项})\\}<\/div>\n<p>次数取最高的那一项，不看系数大小。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>系数相加只对“字母部分完全相同”的项成立；字母部分不同时相加没有意义。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《整式》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：整式的概念与加减法<\/a><\/span><\/div><h1>第 2 章：整式的乘法与乘法公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、指数法则\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按“系数相乘、指数相加”做单项式乘法\n<\/li><li>\n用分配律展开多项式乘法并合并同类项\n<\/li><li>\n默写并逆用三个乘法公式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>乘法就是反复用分配律展开；指数法则负责字母部分，乘法公式是展开结果的压缩记忆。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 单项式乘单项式<\/h3>\n<p>系数相乘，同底数幂的指数相加：<\/p>\n<p>(−2x²y)(3xy³) = (−2×3)·x<sup>2+1<\/sup>·y<sup>1+3<\/sup> = −6x³y⁴<\/p>\n<p>不同字母各自保留，不要强行相加指数。<\/p>\n<h3>2.2 单项式乘多项式、多项式乘多项式<\/h3>\n<p>单项式乘多项式，把单项式乘到括号内每一项：<\/p>\n<p>a(b+c)=ab+ac<\/p>\n<p>多项式乘多项式，前一个多项式的每一项乘后一个多项式的每一项，再把同类项并起来：<\/p>\n<p>(a+b)(c+d)=ac+ad+bc+bd<\/p>\n<p>展开后项数是两个多项式项数的乘积，合并同类项前先数项，能及时发现漏乘。<\/p>\n<h3>2.3 三个乘法公式<\/h3>\n<ul><li>\n<strong>平方差<\/strong>：(a+b)(a−b)=a²−b²\n<\/li><li>\n<strong>完全平方<\/strong>：(a±b)²=a²±2ab+b²\n<\/li><li>\n<strong>立方和差<\/strong>：(a±b)(a²∓ab+b²)=a³±b³\n<\/ul>\n<p>三个公式都是展开后的特例，不是新规则。记不住时，直接展开一遍即可。<\/p>\n<h3>2.4 正用与逆用<\/h3>\n<p>正用：把乘积写成多项式，如 (2x−3y)(2x+3y)=4x²−9y²。<\/p>\n<p>逆用：把多项式写成乘积，如 x²−9=(x−3)(x+3)。逆用是后面因式分解的入口。<\/p>\n<p>数值计算里也能用：99×101=(100−1)(100+1)=100²−1=9999。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：多项式乘法像发牌——第一个括号里每一项都要和第二个括号里每一项碰一次，碰完再归类。<\/p>\n<p><strong>失效边界<\/strong>：碰的次数是项数相乘，项数多时容易漏；公式只在结构完全对上时才能套。<\/p>\n<p><strong>实例<\/strong>：展开 (x+2)(x−3)。 逐项相乘：x²−3x+2x−6 = x²−x−6。 若用公式检查：这不是平方差结构（两项符号不同但常数不等），不能硬套。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 (a+b)²=a²+b² —— 实际上 漏了中间项。正确结果是 a²+2ab+b²，可用 a=1,b=1 代入检验：左边 4，右边 2。\n<\/li><li>\n别以为 x²−9 不能再分解 —— 实际上 它是平方差，x²−9=(x−3)(x+3)，逆用公式即可。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n展开 (2x−3)(2x+3) 的结果是：\n<\/li><li>\n计算 102×98 最简便的算法是：\n<p>A. 4x²−9 ｜ B. 4x²+9 ｜ C. 4x²−12x+9 ｜ D. 4x²−6x−9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：平方差公式：(2x)²−3²=4x²−9。 A. 102×100−102×2 ｜ B. (100+2)(100−2)=100²−4 ｜ C. 100×98+2×98 ｜ D. 直接竖式相乘 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：102×98=(100+2)(100−2)=100²−2²=9996，用平方差一步到位。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单项式相乘：系数乘系数，指数相加\n<\/li><li>\n多项式相乘：逐项相乘后合并同类项\n<\/li><li>\n平方差与完全平方都是展开的特例\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：整式的乘法与乘法公式）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：整式的乘法与乘法公式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>乘法公式没有一条是“新规定”，全部能从分配律展开得到。下面展开三次，看清中间项从哪里来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>两个多项式相乘，等于把第一个的每一项分别乘第二个的每一项，再把结果相加。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>展开像把两张清单交叉配对：左边每一项都要和右边每一项配一次，配完再按同类归堆。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 平方差<\/h3>\n<div class=\"katex-block\">(a+b)(a-b)=a^{2}-ab+ab-b^{2}=a^{2}-b^{2}<\/div>\n<p>中间两项 −ab 与 +ab 相消，只剩两个平方。<\/p>\n<h3>2. 完全平方<\/h3>\n<div class=\"katex-block\">(a+b)^{2}=(a+b)(a+b)=a^{2}+ab+ba+b^{2}=a^{2}+2ab+b^{2}<\/div>\n<p>中间两项 ab 与 ba 相同，合并成 2ab。<\/p>\n<h3>3. 指数法则<\/h3>\n<div class=\"katex-block\">a^{m}\\cdot a^{n}=a^{m+n}<\/div>\n<p>m 个 a 再乘 n 个 a，一共 m+n 个 a，所以指数相加。<\/p>\n<h3>4. 逆用示例<\/h3>\n<div class=\"katex-block\">x^{2}-9=(x-3)(x+3)<\/div>\n<p>把 x²−3² 认成平方差，反着写回乘积形式。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>公式套用要求结构完全一致；项的顺序、符号、系数都要对上，否则回到逐项展开。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《整式》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：整式的乘法与乘法公式<\/a><\/span><\/div><h1>第 3 章：整式的除法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按“系数相除、指数相减”做单项式除法\n<\/li><li>\n用长除法做多项式除以多项式\n<\/li><li>\n写出带余除式 A=BQ+R 并判断余式次数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>除法是指数法则的逆用；除不尽时写成 A=BQ+R，余式的次数必须低于除式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 单项式除以单项式<\/h3>\n<p>系数相除，同底数幂的指数相减：<\/p>\n<p>6x⁵y³ ÷ 2x²y = 3x<sup>5−2<\/sup>y<sup>3−1<\/sup> = 3x³y²<\/p>\n<p>被除式里没有的字母，结果中也不出现；指数相减出现负数时，按负指数写成倒数。<\/p>\n<h3>3.2 多项式除以单项式<\/h3>\n<p>把多项式的每一项分别除以这个单项式，再把商相加：<\/p>\n<p>(6x³−4x²)÷2x = 3x²−2x<\/p>\n<h3>3.3 多项式除以多项式：长除法<\/h3>\n<p>步骤与整数长除法相同：<\/p>\n<ol><li>\n用被除式的最高次项除以除式的最高次项，得到商的第一项；\n<\/li><li>\n用这一项乘除式，从被除式里减掉；\n<\/li><li>\n对余下的式子重复上述两步，直到余式的次数低于除式。\n<\/ol>\n<p>例：(x³−1)÷(x−1)。第一次商 x²，减得 x²−1；再商 x，减得 x−1；再商 1，减得 0。所以商是 x²+x+1，余式为 0。<\/p>\n<h3>3.4 带余除式<\/h3>\n<p>一般地，对被除式 A、除式 B（B≠0），存在唯一的商 Q 与余式 R，使<\/p>\n<p>A = BQ + R，且 R 的次数低于 B 的次数（或 R=0）<\/p>\n<p>这条式子是后面“余数定理”“因式定理”的基础。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：长除法像分装——每次先用最大的盒子装，装完把剩下的再分，直到剩下的装不满一个盒子。<\/p>\n<p><strong>失效边界<\/strong>：除法要求除式不为零；除式是零多项式时整个式子没有意义。<\/p>\n<p><strong>实例<\/strong>：(2x³+3x²−5x+2)÷(x+2)。 第一次商 2x²，乘除式得 2x³+4x²，相减得 −x²−5x+2； 再商 −x，乘得 −x²−2x，相减得 −3x+2； 再商 −3，乘得 −3x−6，相减得 8。 所以商 2x²−x−3，余式 8，即 2x³+3x²−5x+2=(x+2)(2x²−x−3)+8。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 除法就是指数相减，任何式子都能除尽 —— 实际上 只有单项式相除才直接减指数；多项式相除可能有余式，余式不为零就除不尽。\n<\/li><li>\n别以为 余式可以任意次数 —— 实际上 带余除式要求余式次数严格低于除式次数，否则还能继续除。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n12x⁴y²÷3x²y 的结果是：\n<\/li><li>\n(x²−1)÷(x−1) 的商与余式分别是：\n<p>A. 4x²y ｜ B. 4x⁶y³ ｜ C. 4x²y² ｜ D. 4x² <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：系数 12÷3=4；x 的指数 4−2=2；y 的指数 2−1=1，得 4x²y。 A. x+1，0 ｜ B. x−1，0 ｜ C. x+1，2 ｜ D. x，1 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：x²−1=(x−1)(x+1)，整除，商 x+1，余式 0。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n单项式相除：系数相除、指数相减\n<\/li><li>\n多项式相除用长除法，逐次消去最高次项\n<\/li><li>\n带余除式：A=BQ+R，R 的次数低于 B\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：整式的除法）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：整式的除法<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>除法只是乘法的逆运算。理解了“指数相减来自指数相加”，长除法就不需要背步骤。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>若存在多项式 Q、R 使 A=BQ+R 且 R 的次数低于 B（或 R=0），则 Q 为商、R 为余式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>长除法像削苹果：每次削掉能被除式整除的那一层，直到剩下的小于一个除式。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 单项式相除<\/h3>\n<div class=\"katex-block\">\\frac{a^{m}}{a^{n}}=a^{m-n}\\quad(a\\ne 0)<\/div>\n<p>由 a<sup>m-n<\/sup>\\cdot a<sup>n<\/sup>=a<sup>m<\/sup> 反推，指数相减是指数相加的逆。<\/p>\n<h3>2. 系数相除<\/h3>\n<div class=\"katex-block\">\\frac{6x^{5}y^{3}}{2x^{2}y}=3x^{3}y^{2}<\/div>\n<p>系数照常相除，字母部分按同一字母的指数相减。<\/p>\n<h3>3. 带余除式<\/h3>\n<div class=\"katex-block\">A=BQ+R,\\quad \\deg R<\\deg B<\/div>\n<p>余式次数必须低于除式，否则还能再商一次。<\/p>\n<h3>4. 整除的判据<\/h3>\n<div class=\"katex-block\">B\\mid A\\iff R=0<\/div>\n<p>余式为零就是整除；这也是因式定理的来源。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>带余除式的唯一性依赖“次数严格下降”，否则商可以无限加项。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《整式》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch04": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：整式的除法<\/a><\/span><\/div><h1>第 4 章：多项式恒等定理与待定系数法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清两个多项式在什么条件下恒等\n<\/li><li>\n用比较系数或代特殊值求未知系数\n<\/li><li>\n判断一个恒等式是否可能成立\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>两个次数不超过 n 的多项式，只要在 n+1 个不同点取值相同，就恒等；于是可以设出系数再解方程。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 什么是恒等<\/h3>\n<p>两个多项式恒等，指对字母的任意取值，两边的值都相等，记作 P(x)≡Q(x)。<\/p>\n<p>注意区别：方程只要求“某些 x 使两边相等”，恒等式要求“所有 x 都相等”。<\/p>\n<h3>4.2 恒等定理<\/h3>\n<p>如果两个次数都不超过 n 的多项式 P、Q 在 n+1 个互不相同的点上取值相同，那么 P≡Q。<\/p>\n<p>直观理由：P−Q 的次数不超过 n；如果它不是零多项式，最多只有 n 个根。现在它有 n+1 个不同的根，只能恒等于零。<\/p>\n<h3>4.3 待定系数法<\/h3>\n<p>步骤：<\/p>\n<ol><li>\n按已知结构设出带未知系数的形式（如 ax²+bx+c）；\n<\/li><li>\n展开、合并同类项，或代入几个特殊值；\n<\/li><li>\n比较两边同类项的系数（或解方程组），求出未知系数；\n<\/li><li>\n回代检验。\n<\/ol>\n<p>常用特殊值：x=0 求常数项，x=1 求系数和，x=−1 求交错和。<\/p>\n<h3>4.4 典型用法<\/h3>\n<ul><li>\n求参数：已知 x²+ax+b≡(x−1)(x+3)，展开右边得 x²+2x−3，比较系数得 a=2，b=−3。\n<\/li><li>\n拆分分式：把有理分式拆成几个简单分式之和（第 4 册会用到）。\n<\/li><li>\n判断命题：若两边次数不同，恒等一定不成立，不必再算。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：恒等定理像“指纹比对”——不必逐点验证整条曲线，只要在足够多的点上对上了，两条曲线就只能是同一条。<\/p>\n<p><strong>失效边界<\/strong>：点数必须超过次数。“足够多”不是随便几个，n 次多项式要 n+1 个点。<\/p>\n<p><strong>实例<\/strong>：求 a、b 使 x²+ax+b≡(x−2)(x+5)。 右边展开：x²+3x−10。比较系数：a=3，b=−10。 检验：取 x=0，左边 b=−10，右边 (−2)(5)=−10，一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 只要有两个点取值相同就恒等 —— 实际上 两点只能确定一次多项式；二次及以上需要三个以上不同的点。\n<\/li><li>\n别以为 恒等式可以直接用“移项求解”的方式处理 —— 实际上 恒等式对所有 x 成立，比较的是系数，不是解出某个 x。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 x²+ax+b≡(x−1)(x+4)，则 a、b 为：\n<\/li><li>\n两个三次多项式在几个不同点上取值相同，就一定能判定它们恒等？\n<p>A. a=3，b=−4 ｜ B. a=5，b=4 ｜ C. a=−3，b=−4 ｜ D. a=3，b=4 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：右边展开 x²+3x−4，比较系数得 a=3，b=−4。 A. 2 个 ｜ B. 3 个 ｜ C. 4 个 ｜ D. 1 个 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：次数为 3，需要 n+1=4 个不同的点；少于 4 个不足以排除差多项式有根的情况。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n恒等：对所有取值都相等；方程：只对某些取值相等\n<\/li><li>\nn 次多项式需 n+1 个点才能定死\n<\/li><li>\n待定系数法：设形式 → 比较系数 → 解方程 → 回代\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：多项式恒等定理与待定系数法）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：多项式恒等定理与待定系数法<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>恒等定理的证明只用一句话：差多项式的根太多，只能是零多项式。下面把它写清楚。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>P≡Q 指对一切 x，P(x)=Q(x)。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像两条路线图：如果在足够多的路口都重合，且两条路都是“直路”（次数有限），那它们只能是同一条路。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 差多项式<\/h3>\n<div class=\"katex-block\">D(x)=P(x)-Q(x),\\quad \\deg D\\le n<\/div>\n<p>两个 n 次多项式相减，次数不会超过 n。<\/p>\n<h3>2. 根的上限<\/h3>\n<div class=\"katex-block\">D\\not\\equiv 0\\ \\Rightarrow\\ D\\ \\text{至多有}\\ n\\ \\text{个根}<\/div>\n<p>非零多项式的根数不超过其次数，这是代数基本事实。<\/p>\n<h3>3. 矛盾<\/h3>\n<div class=\"katex-block\">D(x_i)=0\\ (i=1,\\ldots,n+1)\\ \\Rightarrow\\ D\\equiv 0<\/div>\n<p>n+1 个不同的根超过了上限，所以差多项式只能恒为零。<\/p>\n<h3>4. 待定系数<\/h3>\n<div class=\"katex-block\">x^{2}+ax+b\\equiv (x-1)(x+3)=x^{2}+2x-3<\/div>\n<p>展开右边，比较同次项系数：a=2，b=−3。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>点数不足时结论不成立；此外定理只对“多项式”成立，对一般函数不成立。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《整式》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：整式的概念与加减法<\/a><\/span><\/div><h1>同类项与合并<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>字母相同、对应指数也相同的项，才能把系数加起来。<\/p>\n<h2>为什么重要<\/h2>\n<p>整式加减的全部技术都在这里；判断错同类项，后面化简、因式分解都会连锁出错。<\/p>\n<h2>详解<\/h2>\n<p>判断同类项看两件事：字母种类是否完全一致、每个字母的指数是否一致。系数与字母的排列顺序不影响。合并时只加系数，字母部分照抄。<\/p>\n<h2>常见误解<\/h2>\n<p>别把“字母相同”当成同类项的全部条件：x² 与 x 字母相同但指数不同，不能合并。<\/p>\n<h2>相关概念<\/h2>\n<p>单项式（ch01）、分配律（ch01）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-02-整式 吉星 杨佩祥.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：整式的除法<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：多项式恒等定理与待定系数法<\/a><\/span><\/div><h1>带余除式与恒等定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>除不尽就写成 A=BQ+R；两个多项式在足够多点重合就恒等。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两条是“整式”从计算走向理论的转折：一条给出除法的完整结果，一条给出判断两个式子是否同一的办法。<\/p>\n<h2>详解<\/h2>\n<p>带余除式保证余式次数低于除式，从而商与余式唯一；恒等定理把“逐点验证”压缩成“有限个点验证”，两者都靠“次数”这个有限指标起作用。<\/p>\n<h2>常见误解<\/h2>\n<p>把“在若干点相等”当成恒等：点数不足时不成立。<\/p>\n<h2>相关概念<\/h2>\n<p>长除法（ch03）、待定系数法（ch04）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：整式的概念与加减法<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：整式的概念与加减法<\/a><br>检查点：能判断同类项并化简含括号的多项式<\/li><li class='path-step' id='path-02'><strong>步骤 02：整式的乘法与乘法公式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：整式的乘法与乘法公式<\/a><br>检查点：能默写三个乘法公式并逆用<\/li><li class='path-step' id='path-03'><strong>步骤 03：整式的除法<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：整式的除法<\/a><br>检查点：能做多项式长除法并写出带余除式<\/li><li class='path-step' id='path-04'><strong>步骤 04：多项式恒等定理与待定系数法<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：多项式恒等定理与待定系数法<\/a><br>检查点：能设系数解出使两式恒等的参数<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q09' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q9.<\/b> 下列各组中，是同类项的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 3x²y 与 3xy²<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> −2ab 与 5ba<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> x² 与 x³<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 2a 与 2b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q10.<\/b> (x³+1)÷(x+1) 的商是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> x²−x+1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> x²+x+1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> x²−1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> x²+1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q11.<\/b> 若 2x²+ax−3≡2(x−1)(x+2)+b，则 a、b 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> a=2，b=1<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> a=2，b=−3<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> a=−2，b=1<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> a=1，b=1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：整式的概念与加减法<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> −3x²y 的系数与次数分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> −3，2<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> −3，3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 3，3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 3，2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 化简 a−(2a−b)+b 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> −a+2b<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> −a<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 3a<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> −a−2b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：整式的乘法与乘法公式<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 展开 (2x−3)(2x+3) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 4x²−9<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 4x²+9<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 4x²−12x+9<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 4x²−6x−9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 计算 102×98 最简便的算法是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 102×100−102×2<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> (100+2)(100−2)=100²−4<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 100×98+2×98<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 直接竖式相乘<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：整式的除法<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 12x⁴y²÷3x²y 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 4x²y<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 4x⁶y³<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 4x²y²<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 4x²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> (x²−1)÷(x−1) 的商与余式分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> x+1，0<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> x−1，0<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> x+1，2<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> x，1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：多项式恒等定理与待定系数法<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 若 x²+ax+b≡(x−1)(x+4)，则 a、b 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> a=3，b=−4<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> a=5，b=4<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> a=−3，b=−4<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> a=3，b=4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 两个三次多项式在几个不同点上取值相同，就一定能判定它们恒等？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 2 个<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 3 个<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 4 个<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 1 个<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='单项式'>单项式 — 数与字母的乘积，单独一个数或字母也算。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='系数'>系数 — 单项式中的数字因数。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='次数'>次数 — 单项式各字母指数之和；多项式取最高次项的次数。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='同类项'>同类项 — 字母相同且相同字母指数也相同的项。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='分配律'>分配律 — a(b+c)=ab+ac，整式变形的基本依据。 <span class=glossary-ref>（第 1 章：整式的概念与加减法）<\/span><\/li><li data-term='乘法公式'>乘法公式 — 平方差、完全平方、立方和差三组展开结果。 <span class=glossary-ref>（第 2 章：整式的乘法与乘法公式）<\/span><\/li><li data-term='长除法'>长除法 — 逐次消去最高次项的多项式除法。 <span class=glossary-ref>（第 3 章：整式的除法）<\/span><\/li><li data-term='带余除式'>带余除式 — A=BQ+R，余式次数低于除式。 <span class=glossary-ref>（第 3 章：整式的除法）<\/span><\/li><li data-term='恒等'>恒等 — 对字母的一切取值两边都相等。 <span class=glossary-ref>（第 4 章：多项式恒等定理与待定系数法）<\/span><\/li><li data-term='待定系数法'>待定系数法 — 设出含未知系数的形式，再比较系数求解。 <span class=glossary-ref>（第 4 章：多项式恒等定理与待定系数法）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：整式变形的三步<\/h2>\n<p>① 看结构（单项式／多项式、次数、项数）；② 选工具（合并同类项、分配律、公式、长除法）；③ 回代检验（取特殊值核对）。<\/p>\n<h2>框架：公式的三种用法<\/h2>\n<p>正用（展开）、逆用（分解）、数值化（把数字凑成公式结构做速算）。逆用是最容易被忽略的一种。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>单项式乘单项式<\/td><td>系数相乘，同底数幂指数相加<\/td><\/tr><tr><td>单项式除以单项式<\/td><td>系数相除，同底数幂指数相减<\/td><\/tr><tr><td>平方差<\/td><td>(a+b)(a−b)=a²−b²<\/td><\/tr><tr><td>完全平方<\/td><td>(a±b)²=a²±2ab+b²<\/td><\/tr><tr><td>立方和差<\/td><td>(a±b)(a²∓ab+b²)=a³±b³<\/td><\/tr><tr><td>带余除式<\/td><td>A=BQ+R，deg R&lt;deg B<\/td><\/tr><tr><td>恒等判据<\/td><td>次数≤n 的两式在 n+1 个不同点相等 ⇒ 恒等<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{

    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

let networkLoaded = false;
function loadVisNetwork(cb){

    'https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.js',
