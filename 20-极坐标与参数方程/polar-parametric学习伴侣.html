<title>极坐标与参数方程</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>

 "options": ["ρ=3", "ρ=6cosθ", "θ=3", "ρ=3cosθ"], "answer": 0, "explain": "到极点距离恒为 3，即 ρ=3。"}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "圆 x²+y²=9 的一个参数方程是：", "options": ["x=3cosθ，y=3sinθ", "x=9cosθ，y=9sinθ", "x=3θ，y=3θ", "x=cosθ，y=sinθ"], "answer": 0, "explain": "半径 3 的圆，参数方程 x=3cosθ、y=3sinθ。"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "参数方程 x=t²，y=t（t≥0）化为普通方程是：", "options": ["y²=x（x≥0）", "y²=x（x∈R）", "y=x²", "x=y²"], "answer": 0, "explain": "t=√x≥0，y=√x，平方得 y²=x，且 x≥0。"}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "把 x=cosθ、y=sinθ 消参后得到：", "options": ["x²+y²=1", "x+y=1", "y=x", "x²−y²=1"], "answer": 0, "explain": "由 cos²θ+sin²θ=1 得 x²+y²=1。"}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "椭圆 x=3cosθ、y=2sinθ 上点到原点距离的最大值是：", "options": ["3", "2", "√13", "5"], "answer": 0, "explain": "距离平方 9cos²+4sin²=4+5cos²，最大 9，距离最大 3。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "极坐标 (4, π) 对应的直角坐标是：", "options": ["(4,0)", "(−4,0)", "(0,4)", "(0,−4)"], "answer": 1, "explain": "x=4cos180°=−4，y=4sin180°=0。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "参数方程 x=2t，y=t²（t∈R）化为普通方程是：", "options": ["y=x²/4", "y=4x²", "y=x²", "x=y²/4"], "answer": 0, "explain": "t=x/2，y=(x/2)²=x²/4。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：极坐标」的一句话核心是什么？", "back": "极坐标用一个距离和一个角定位；同一个点有无穷多组极坐标。", "tags": ["polar-parametric", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：参数方程」的一句话核心是什么？", "back": "参数方程用第三个变量 t（或 θ）同时表示 x 与 y，把曲线变成“随参数运动的一条轨迹”。", "tags": ["polar-parametric", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：互化、范围与最值」的一句话核心是什么？", "back": "换表示是为了好算，不是为了好看；每次换完都要核对范围。", "tags": ["polar-parametric", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「极坐标」？", "back": "用距离与极角表示点的坐标。", "tags": ["polar-parametric", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「极点」？", "back": "极坐标的定点。", "tags": ["polar-parametric", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「极轴」？", "back": "极坐标的基准射线。", "tags": ["polar-parametric", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「互化」？", "back": "极坐标与直角坐标之间的转换。", "tags": ["polar-parametric", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「参数方程」？", "back": "用参数 t 表示 x、y 的方程。", "tags": ["polar-parametric", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「消参」？", "back": "从参数方程消去参数得到普通方程。", "tags": ["polar-parametric", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「离心角」？", "back": "椭圆参数方程中的 θ。", "tags": ["polar-parametric", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「增点」？", "back": "互化或消参后多出来的、不属于原曲线的点。", "tags": ["polar-parametric", "术语"]}], "companion": "polar-parametric学习伴侣.html", "deriv": "polar-parametric从零推导.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：极坐标<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：坐标、三角比\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把点写成极坐标并互化\n<\/li><li>\n写出圆与直线的极坐标方程\n<\/li><li>\n理解 ρ 可为负的含义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>极坐标用一个距离和一个角定位；同一个点有无穷多组极坐标。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 极坐标的建立<\/h3>\n<p>在平面上取定点 O（极点）与一条射线（极轴），点 P 由距离 ρ=|OP| 与极角 θ（极轴到 OP 的角）确定，记 P(ρ,θ)。<\/p>\n<p>同一个点可以写成 (ρ,θ+2kπ)，也可以写成 (−ρ,θ+π)。所以极坐标不唯一——这是与直角坐标最大的不同。<\/p>\n<h3>1.2 与直角坐标互化<\/h3>\n<p>以极点为原点、极轴为 x 轴正方向：<\/p>\n<p>x=ρcosθ，y=ρsinθ ρ²=x²+y²，tanθ=y/x（x≠0）<\/p>\n<p>互化时要注意象限：仅由 tanθ 定不出 θ，还要看 x、y 的符号。<\/p>\n<h3>1.3 常见曲线的极坐标方程<\/h3>\n<ul><li>\n过极点、倾斜角为 α 的直线：θ=α；\n<\/li><li>\n圆心在极点、半径 r 的圆：ρ=r；\n<\/li><li>\n圆心在 (a,0)、半径 a 的圆：ρ=2a cosθ；\n<\/li><li>\n水平直线 x=a：ρcosθ=a。\n<\/ul>\n<h3>1.4 圆锥曲线的统一方程<\/h3>\n<p>以焦点为极点、对称轴为极轴：<\/p>\n<p>ρ=ep/(1−e cosθ)<\/p>\n<p>e&lt;1 为椭圆，e=1 为抛物线，e&gt;1 为双曲线。同一条公式，三种曲线，这在极坐标下最简洁。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：极坐标像雷达：报“距离多少、方位多少度”，比报“东西多少米、南北多少米”更直观。<\/p>\n<p><strong>失效边界<\/strong>：极点处 θ 任意，极坐标表示不唯一，写方程时要说明 θ 的范围。<\/p>\n<p><strong>实例<\/strong>：点 (2, π/3) 的直角坐标：x=2cos60°=1，y=2sin60°=√3，即 (1,√3)。 直角坐标 (0,3) 的极坐标：ρ=3，θ=π/2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 ρ 必须为正 —— 实际上 ρ 可以为负，此时点在实际方向的相反侧，角度加 π。\n<\/li><li>\n别以为 极坐标与直角坐标一一对应 —— 实际上 极坐标不唯一，一个点有无穷多组表示。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n极坐标 (2, π/2) 对应的直角坐标是：\n<\/li><li>\n圆心在极点、半径为 3 的圆的极坐标方程是：\n<p>A. (2,0) ｜ B. (0,2) ｜ C. (0,−2) ｜ D. (−2,0) <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：x=2cos90°=0，y=2sin90°=2。 A. ρ=3 ｜ B. ρ=6cosθ ｜ C. θ=3 ｜ D. ρ=3cosθ <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：到极点距离恒为 3，即 ρ=3。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nx=ρcosθ，y=ρsinθ；ρ²=x²+y²\n<\/li><li>\n极坐标不唯一，ρ 可为负\n<\/li><li>\n圆锥曲线：ρ=ep/(1−e cosθ)\n<\/ul>", "kind": "chapter", "title": "第 1 章：极坐标"}, "ch02": {"html": "<h1>第 2 章：参数方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出直线、圆、椭圆的参数方程\n<\/li><li>\n用参数表示运动与位置\n<\/li><li>\n把参数方程化为普通方程\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>参数方程用第三个变量 t（或 θ）同时表示 x 与 y，把曲线变成“随参数运动的一条轨迹”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 直线的参数方程<\/h3>\n<p>过点 (x₀,y₀)、方向向量 (a,b) 的直线：<\/p>\n<p>x=x₀+at，y=y₀+bt<\/p>\n<p>t 是参数，表示沿方向走了多少“份”。若 (a,b) 取单位向量，|t| 就是距离。<\/p>\n<h3>2.2 圆与椭圆<\/h3>\n<p>圆心原点、半径 r 的圆：x=r cosθ，y=r sinθ。<\/p>\n<p>椭圆 x²/a²+y²/b²=1：x=a cosθ，y=b sinθ。<\/p>\n<p>这两个参数方程本质就是三角函数的定义，θ 有明确的几何意义（离心角）。<\/p>\n<h3>2.3 消参<\/h3>\n<p>由 x(t)、y(t) 消去 t 得到普通方程，常用办法：代入消元、用三角恒等式（cos²+sin²=1）、用 t 表示再平方。<\/p>\n<p>消参后必须检查范围：参数 t 的取值限制会变成 x、y 的范围限制，丢掉就会多出曲线的一部分。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：参数方程像给摄像机装了时间轴：每个时刻 t 对应画面上的一个位置。<\/p>\n<p><strong>失效边界<\/strong>：消参可能改变定义域；原来 t≥0 只画半条线，消参后容易画成整条。<\/p>\n<p><strong>实例<\/strong>：x=1+2t，y=3+t。由 t=(x−1)/2 代入得 y=3+(x−1)/2，即 x−2y+5=0。 若限定 t≥0，则只能取 x≥1 的那条射线。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 参数方程与普通方程完全等价 —— 实际上 消参后常扩大定义域，必须补上范围限制。\n<\/li><li>\n别以为 参数 t 就是 x —— 实际上 t 是独立参数，与 x、y 都没有必然相等关系。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆 x²+y²=9 的一个参数方程是：\n<\/li><li>\n参数方程 x=t²，y=t（t≥0）化为普通方程是：\n<p>A. x=3cosθ，y=3sinθ ｜ B. x=9cosθ，y=9sinθ ｜ C. x=3θ，y=3θ ｜ D. x=cosθ，y=sinθ <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：半径 3 的圆，参数方程 x=3cosθ、y=3sinθ。 A. y²=x（x≥0） ｜ B. y²=x（x∈R） ｜ C. y=x² ｜ D. x=y² <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：t=√x≥0，y=√x，平方得 y²=x，且 x≥0。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n直线 x=x₀+at，y=y₀+bt\n<\/li><li>\n圆 x=r cosθ，y=r sinθ；椭圆 x=a cosθ，y=b sinθ\n<\/li><li>\n消参后补范围\n<\/ul>", "kind": "chapter", "title": "第 2 章：参数方程"}, "ch03": {"html": "<h1>第 3 章：互化、范围与最值<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n在三种表示之间自由转换\n<\/li><li>\n用参数方程求最值\n<\/li><li>\n检查互化中的增点与漏点\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>换表示是为了好算，不是为了好看；每次换完都要核对范围。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 三种表示的取舍<\/h3>\n<ul><li>\n直角坐标方程：适合判断形状、求交点、算距离；\n<\/li><li>\n极坐标方程：适合旋转对称、过极点的图形、圆锥曲线统一式；\n<\/li><li>\n参数方程：适合求最值、描述运动、算弧长。\n<\/ul>\n<h3>3.2 用参数求最值<\/h3>\n<p>把曲线上的点写成参数形式，将目标量化为参数的一元函数，再用配方、三角有界性（|sinθ|≤1）求最值。<\/p>\n<p>例：椭圆 x=3cosθ、y=2sinθ 上点到原点距离的平方为 9cos²θ+4sin²θ=4+5cos²θ，最大 9、最小 4。<\/p>\n<h3>3.3 常见增点与漏点<\/h3>\n<ul><li>\n消参时平方：可能把 x&lt;0 的部分也画进来；\n<\/li><li>\n极坐标化直角坐标时两边乘 ρ：ρ=0 的点可能被重复计算；\n<\/li><li>\n直角坐标化极坐标时用 tanθ：可能丢掉第二、三象限的点。\n<\/ul>\n<h3>3.4 检查清单<\/h3>\n<p>换完表示后问三句：定义域变了吗？有没有多出点？有没有漏掉点？<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：三种表示像三种语言描述同一件事，翻译时最容易丢的是“限定条件”。<\/p>\n<p><strong>失效边界<\/strong>：参数方程求最值只在参数范围内有效，超出范围的最值点取不到。<\/p>\n<p><strong>实例<\/strong>：圆 x²+y²=4 上点到直线 x+y−6=0 的距离： 点写成 (2cosθ,2sinθ)，距离 |2cosθ+2sinθ−6|/√2=|2√2 sin(θ+45°)−6|/√2，最大 (6+2√2)/√2≈5.41。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 互化一定等价 —— 实际上 乘 ρ、平方、取正切都可能改变解集，必须检查。\n<\/li><li>\n别以为 参数方程不能求最值 —— 实际上 恰恰相反，参数化后最值问题变成一元函数问题，更好算。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n把 x=cosθ、y=sinθ 消参后得到：\n<\/li><li>\n椭圆 x=3cosθ、y=2sinθ 上点到原点距离的最大值是：\n<p>A. x²+y²=1 ｜ B. x+y=1 ｜ C. y=x ｜ D. x²−y²=1 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：由 cos²θ+sin²θ=1 得 x²+y²=1。 A. 3 ｜ B. 2 ｜ C. √13 ｜ D. 5 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：距离平方 9cos²+4sin²=4+5cos²，最大 9，距离最大 3。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三种表示各有适用场景\n<\/li><li>\n参数化后最值化为一元函数\n<\/li><li>\n互化后查定义域与增减点\n<\/ul>", "kind": "chapter", "title": "第 3 章：互化、范围与最值"}, "c01": {"html": "<h1>表示与不变量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>坐标可以换，曲线本身不变；变的是写法，不变的是形状。<\/p>\n<h2>为什么重要<\/h2>\n<p>理解这一点，就不会在互化时把“换了写法”误当成“换了曲线”。<\/p>\n<h2>详解<\/h2>\n<p>直角坐标、极坐标、参数方程描述的是同一批点。互化时保持点集不变才算正确；范围、符号、象限是保持点集不变的关键。<\/p>\n<h2>常见误解<\/h2>\n<p>只看方程形式像不像，不检查点集是否一致。<\/p>\n<h2>相关概念<\/h2>\n<p>极坐标（ch01）、参数方程（ch02）<\/p>", "kind": "concept", "title": "表示与不变量"}, "c02": {"html": "<h1>范围限制<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>参数有范围，消参后就必须把这个范围搬到 x、y 上。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是互化题最常见的失分点，也是解析几何“严谨性”的体现。<\/p>\n<h2>详解<\/h2>\n<p>t≥0 只画半条射线；θ∈[0,π] 只画上半圆；平方消参可能引入负半轴。检查办法：取参数范围的端点代入，看对应的 x、y 是否被保留。<\/p>\n<h2>常见误解<\/h2>\n<p>消参后写一个漂亮的整条曲线方程，把范围丢掉了。<\/p>\n<h2>相关概念<\/h2>\n<p>消参（ch02）、增点（ch03）<\/p>", "kind": "concept", "title": "范围限制"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：极坐标<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：极坐标<\/a><br>检查点：能把极坐标方程与直角坐标方程互化<\/li><li class='path-step' id='path-02'><strong>步骤 02：参数方程<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：参数方程<\/a><br>检查点：能写出常见曲线的参数方程并消参<\/li><li class='path-step' id='path-03'><strong>步骤 03：互化与范围检查<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：互化、范围与最值<\/a><br>检查点：能指出消参后丢失的点<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 极坐标 (4, π) 对应的直角坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> (4,0)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> (−4,0)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> (0,4)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> (0,−4)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 参数方程 x=2t，y=t²（t∈R）化为普通方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> y=x²/4<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> y=4x²<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> y=x²<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> x=y²/4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：极坐标<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 极坐标 (2, π/2) 对应的直角坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> (2,0)<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> (0,2)<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> (0,−2)<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> (−2,0)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 圆心在极点、半径为 3 的圆的极坐标方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> ρ=3<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> ρ=6cosθ<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> θ=3<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> ρ=3cosθ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：参数方程<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 圆 x²+y²=9 的一个参数方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> x=3cosθ，y=3sinθ<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> x=9cosθ，y=9sinθ<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> x=3θ，y=3θ<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> x=cosθ，y=sinθ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 参数方程 x=t²，y=t（t≥0）化为普通方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> y²=x（x≥0）<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> y²=x（x∈R）<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> y=x²<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> x=y²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：互化、范围与最值<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 把 x=cosθ、y=sinθ 消参后得到：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> x²+y²=1<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> x+y=1<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> y=x<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> x²−y²=1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 椭圆 x=3cosθ、y=2sinθ 上点到原点距离的最大值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> √13<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='极坐标'>极坐标 — 用距离与极角表示点的坐标。 <span class=glossary-ref>（第 1 章：极坐标）<\/span><\/li><li data-term='极点'>极点 — 极坐标的定点。 <span class=glossary-ref>（第 1 章：极坐标）<\/span><\/li><li data-term='极轴'>极轴 — 极坐标的基准射线。 <span class=glossary-ref>（第 1 章：极坐标）<\/span><\/li><li data-term='互化'>互化 — 极坐标与直角坐标之间的转换。 <span class=glossary-ref>（第 1 章：极坐标）<\/span><\/li><li data-term='参数方程'>参数方程 — 用参数 t 表示 x、y 的方程。 <span class=glossary-ref>（第 2 章：参数方程）<\/span><\/li><li data-term='消参'>消参 — 从参数方程消去参数得到普通方程。 <span class=glossary-ref>（第 2 章：参数方程）<\/span><\/li><li data-term='离心角'>离心角 — 椭圆参数方程中的 θ。 <span class=glossary-ref>（第 2 章：参数方程）<\/span><\/li><li data-term='增点'>增点 — 互化或消参后多出来的、不属于原曲线的点。 <span class=glossary-ref>（第 3 章：互化、范围与最值）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：选表示三问<\/h2>\n<p>① 图形是否绕极点旋转对称（用极坐标）；② 是否需要求最值或描述运动（用参数）；③ 是否需要判断形状与交点（用直角坐标）。<\/p>\n<h2>框架：互化两步<\/h2>\n<p>① 代公式转换；② 检查点集是否一致（范围、符号、象限）。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>互化<\/td><td>x=ρcosθ，y=ρsinθ；ρ²=x²+y²<\/td><\/tr><tr><td>圆<\/td><td>ρ=r（圆心极点）；ρ=2a cosθ（过极点）<\/td><\/tr><tr><td>圆锥曲线<\/td><td>ρ=ep/(1−e cosθ)<\/td><\/tr><tr><td>直线参数<\/td><td>x=x₀+at，y=y₀+bt<\/td><\/tr><tr><td>圆参数<\/td><td>x=r cosθ，y=r sinθ<\/td><\/tr><tr><td>椭圆参数<\/td><td>x=a cosθ，y=b sinθ<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/20-极坐标与参数方程", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：极坐标", "href": "#/chapter/ch01"}, {"label": "第 2 章：参数方程", "href": "#/chapter/ch02"}, {"label": "第 3 章：互化、范围与最值", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "表示与不变量", "href": "#/concept/c01"}, {"label": "范围限制", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：极坐标", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：参数方程", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：互化、范围与最值", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：极坐标<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：坐标、三角比\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把点写成极坐标并互化\n<\/li><li>\n写出圆与直线的极坐标方程\n<\/li><li>\n理解 ρ 可为负的含义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>极坐标用一个距离和一个角定位；同一个点有无穷多组极坐标。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 极坐标的建立<\/h3>\n<p>在平面上取定点 O（极点）与一条射线（极轴），点 P 由距离 ρ=|OP| 与极角 θ（极轴到 OP 的角）确定，记 P(ρ,θ)。<\/p>\n<p>同一个点可以写成 (ρ,θ+2kπ)，也可以写成 (−ρ,θ+π)。所以极坐标不唯一——这是与直角坐标最大的不同。<\/p>\n<h3>1.2 与直角坐标互化<\/h3>\n<p>以极点为原点、极轴为 x 轴正方向：<\/p>\n<p>x=ρcosθ，y=ρsinθ ρ²=x²+y²，tanθ=y/x（x≠0）<\/p>\n<p>互化时要注意象限：仅由 tanθ 定不出 θ，还要看 x、y 的符号。<\/p>\n<h3>1.3 常见曲线的极坐标方程<\/h3>\n<ul><li>\n过极点、倾斜角为 α 的直线：θ=α；\n<\/li><li>\n圆心在极点、半径 r 的圆：ρ=r；\n<\/li><li>\n圆心在 (a,0)、半径 a 的圆：ρ=2a cosθ；\n<\/li><li>\n水平直线 x=a：ρcosθ=a。\n<\/ul>\n<h3>1.4 圆锥曲线的统一方程<\/h3>\n<p>以焦点为极点、对称轴为极轴：<\/p>\n<p>ρ=ep/(1−e cosθ)<\/p>\n<p>e&lt;1 为椭圆，e=1 为抛物线，e&gt;1 为双曲线。同一条公式，三种曲线，这在极坐标下最简洁。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：极坐标像雷达：报“距离多少、方位多少度”，比报“东西多少米、南北多少米”更直观。<\/p>\n<p><strong>失效边界<\/strong>：极点处 θ 任意，极坐标表示不唯一，写方程时要说明 θ 的范围。<\/p>\n<p><strong>实例<\/strong>：点 (2, π/3) 的直角坐标：x=2cos60°=1，y=2sin60°=√3，即 (1,√3)。 直角坐标 (0,3) 的极坐标：ρ=3，θ=π/2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 ρ 必须为正 —— 实际上 ρ 可以为负，此时点在实际方向的相反侧，角度加 π。\n<\/li><li>\n别以为 极坐标与直角坐标一一对应 —— 实际上 极坐标不唯一，一个点有无穷多组表示。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n极坐标 (2, π/2) 对应的直角坐标是：\n<\/li><li>\n圆心在极点、半径为 3 的圆的极坐标方程是：\n<p>A. (2,0) ｜ B. (0,2) ｜ C. (0,−2) ｜ D. (−2,0) <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：x=2cos90°=0，y=2sin90°=2。 A. ρ=3 ｜ B. ρ=6cosθ ｜ C. θ=3 ｜ D. ρ=3cosθ <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：到极点距离恒为 3，即 ρ=3。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nx=ρcosθ，y=ρsinθ；ρ²=x²+y²\n<\/li><li>\n极坐标不唯一，ρ 可为负\n<\/li><li>\n圆锥曲线：ρ=ep/(1−e cosθ)\n<\/ul>", "ch02": "<h1>第 2 章：参数方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出直线、圆、椭圆的参数方程\n<\/li><li>\n用参数表示运动与位置\n<\/li><li>\n把参数方程化为普通方程\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>参数方程用第三个变量 t（或 θ）同时表示 x 与 y，把曲线变成“随参数运动的一条轨迹”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 直线的参数方程<\/h3>\n<p>过点 (x₀,y₀)、方向向量 (a,b) 的直线：<\/p>\n<p>x=x₀+at，y=y₀+bt<\/p>\n<p>t 是参数，表示沿方向走了多少“份”。若 (a,b) 取单位向量，|t| 就是距离。<\/p>\n<h3>2.2 圆与椭圆<\/h3>\n<p>圆心原点、半径 r 的圆：x=r cosθ，y=r sinθ。<\/p>\n<p>椭圆 x²/a²+y²/b²=1：x=a cosθ，y=b sinθ。<\/p>\n<p>这两个参数方程本质就是三角函数的定义，θ 有明确的几何意义（离心角）。<\/p>\n<h3>2.3 消参<\/h3>\n<p>由 x(t)、y(t) 消去 t 得到普通方程，常用办法：代入消元、用三角恒等式（cos²+sin²=1）、用 t 表示再平方。<\/p>\n<p>消参后必须检查范围：参数 t 的取值限制会变成 x、y 的范围限制，丢掉就会多出曲线的一部分。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：参数方程像给摄像机装了时间轴：每个时刻 t 对应画面上的一个位置。<\/p>\n<p><strong>失效边界<\/strong>：消参可能改变定义域；原来 t≥0 只画半条线，消参后容易画成整条。<\/p>\n<p><strong>实例<\/strong>：x=1+2t，y=3+t。由 t=(x−1)/2 代入得 y=3+(x−1)/2，即 x−2y+5=0。 若限定 t≥0，则只能取 x≥1 的那条射线。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 参数方程与普通方程完全等价 —— 实际上 消参后常扩大定义域，必须补上范围限制。\n<\/li><li>\n别以为 参数 t 就是 x —— 实际上 t 是独立参数，与 x、y 都没有必然相等关系。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n圆 x²+y²=9 的一个参数方程是：\n<\/li><li>\n参数方程 x=t²，y=t（t≥0）化为普通方程是：\n<p>A. x=3cosθ，y=3sinθ ｜ B. x=9cosθ，y=9sinθ ｜ C. x=3θ，y=3θ ｜ D. x=cosθ，y=sinθ <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：半径 3 的圆，参数方程 x=3cosθ、y=3sinθ。 A. y²=x（x≥0） ｜ B. y²=x（x∈R） ｜ C. y=x² ｜ D. x=y² <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：t=√x≥0，y=√x，平方得 y²=x，且 x≥0。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n直线 x=x₀+at，y=y₀+bt\n<\/li><li>\n圆 x=r cosθ，y=r sinθ；椭圆 x=a cosθ，y=b sinθ\n<\/li><li>\n消参后补范围\n<\/ul>", "ch03": "<h1>第 3 章：互化、范围与最值<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n在三种表示之间自由转换\n<\/li><li>\n用参数方程求最值\n<\/li><li>\n检查互化中的增点与漏点\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>换表示是为了好算，不是为了好看；每次换完都要核对范围。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 三种表示的取舍<\/h3>\n<ul><li>\n直角坐标方程：适合判断形状、求交点、算距离；\n<\/li><li>\n极坐标方程：适合旋转对称、过极点的图形、圆锥曲线统一式；\n<\/li><li>\n参数方程：适合求最值、描述运动、算弧长。\n<\/ul>\n<h3>3.2 用参数求最值<\/h3>\n<p>把曲线上的点写成参数形式，将目标量化为参数的一元函数，再用配方、三角有界性（|sinθ|≤1）求最值。<\/p>\n<p>例：椭圆 x=3cosθ、y=2sinθ 上点到原点距离的平方为 9cos²θ+4sin²θ=4+5cos²θ，最大 9、最小 4。<\/p>\n<h3>3.3 常见增点与漏点<\/h3>\n<ul><li>\n消参时平方：可能把 x&lt;0 的部分也画进来；\n<\/li><li>\n极坐标化直角坐标时两边乘 ρ：ρ=0 的点可能被重复计算；\n<\/li><li>\n直角坐标化极坐标时用 tanθ：可能丢掉第二、三象限的点。\n<\/ul>\n<h3>3.4 检查清单<\/h3>\n<p>换完表示后问三句：定义域变了吗？有没有多出点？有没有漏掉点？<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：三种表示像三种语言描述同一件事，翻译时最容易丢的是“限定条件”。<\/p>\n<p><strong>失效边界<\/strong>：参数方程求最值只在参数范围内有效，超出范围的最值点取不到。<\/p>\n<p><strong>实例<\/strong>：圆 x²+y²=4 上点到直线 x+y−6=0 的距离： 点写成 (2cosθ,2sinθ)，距离 |2cosθ+2sinθ−6|/√2=|2√2 sin(θ+45°)−6|/√2，最大 (6+2√2)/√2≈5.41。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 互化一定等价 —— 实际上 乘 ρ、平方、取正切都可能改变解集，必须检查。\n<\/li><li>\n别以为 参数方程不能求最值 —— 实际上 恰恰相反，参数化后最值问题变成一元函数问题，更好算。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n把 x=cosθ、y=sinθ 消参后得到：\n<\/li><li>\n椭圆 x=3cosθ、y=2sinθ 上点到原点距离的最大值是：\n<p>A. x²+y²=1 ｜ B. x+y=1 ｜ C. y=x ｜ D. x²−y²=1 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：由 cos²θ+sin²θ=1 得 x²+y²=1。 A. 3 ｜ B. 2 ｜ C. √13 ｜ D. 5 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：距离平方 9cos²+4sin²=4+5cos²，最大 9，距离最大 3。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三种表示各有适用场景\n<\/li><li>\n参数化后最值化为一元函数\n<\/li><li>\n互化后查定义域与增减点\n<\/ul>", "c01": "<h1>表示与不变量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>坐标可以换，曲线本身不变；变的是写法，不变的是形状。<\/p>\n<h2>为什么重要<\/h2>\n<p>理解这一点，就不会在互化时把“换了写法”误当成“换了曲线”。<\/p>\n<h2>详解<\/h2>\n<p>直角坐标、极坐标、参数方程描述的是同一批点。互化时保持点集不变才算正确；范围、符号、象限是保持点集不变的关键。<\/p>\n<h2>常见误解<\/h2>\n<p>只看方程形式像不像，不检查点集是否一致。<\/p>\n<h2>相关概念<\/h2>\n<p>极坐标（ch01）、参数方程（ch02）<\/p>", "c02": "<h1>范围限制<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>参数有范围，消参后就必须把这个范围搬到 x、y 上。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是互化题最常见的失分点，也是解析几何“严谨性”的体现。<\/p>\n<h2>详解<\/h2>\n<p>t≥0 只画半条射线；θ∈[0,π] 只画上半圆；平方消参可能引入负半轴。检查办法：取参数范围的端点代入，看对应的 x、y 是否被保留。<\/p>\n<h2>常见误解<\/h2>\n<p>消参后写一个漂亮的整条曲线方程，把范围丢掉了。<\/p>\n<h2>相关概念<\/h2>\n<p>消参（ch02）、增点（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：极坐标<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：极坐标<\/a><br>检查点：能把极坐标方程与直角坐标方程互化<\/li><li class='path-step' id='path-02'><strong>步骤 02：参数方程<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：参数方程<\/a><br>检查点：能写出常见曲线的参数方程并消参<\/li><li class='path-step' id='path-03'><strong>步骤 03：互化与范围检查<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：互化、范围与最值<\/a><br>检查点：能指出消参后丢失的点<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 极坐标 (4, π) 对应的直角坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> (4,0)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> (−4,0)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> (0,4)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> (0,−4)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 参数方程 x=2t，y=t²（t∈R）化为普通方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> y=x²/4<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> y=4x²<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> y=x²<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> x=y²/4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：极坐标<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 极坐标 (2, π/2) 对应的直角坐标是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> (2,0)<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> (0,2)<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> (0,−2)<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> (−2,0)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 圆心在极点、半径为 3 的圆的极坐标方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> ρ=3<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> ρ=6cosθ<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> θ=3<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> ρ=3cosθ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：参数方程<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 圆 x²+y²=9 的一个参数方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> x=3cosθ，y=3sinθ<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> x=9cosθ，y=9sinθ<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> x=3θ，y=3θ<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> x=cosθ，y=sinθ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 参数方程 x=t²，y=t（t≥0）化为普通方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> y²=x（x≥0）<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> y²=x（x∈R）<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> y=x²<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> x=y²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：互化、范围与最值<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 把 x=cosθ、y=sinθ 消参后得到：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> x²+y²=1<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> x+y=1<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> y=x<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> x²−y²=1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 椭圆 x=3cosθ、y=2sinθ 上点到原点距离的最大值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> √13<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='极坐标'>极坐标 — 用距离与极角表示点的坐标。 <span class=glossary-ref>（第 1 章：极坐标）<\/span><\/li><li data-term='极点'>极点 — 极坐标的定点。 <span class=glossary-ref>（第 1 章：极坐标）<\/span><\/li><li data-term='极轴'>极轴 — 极坐标的基准射线。 <span class=glossary-ref>（第 1 章：极坐标）<\/span><\/li><li data-term='互化'>互化 — 极坐标与直角坐标之间的转换。 <span class=glossary-ref>（第 1 章：极坐标）<\/span><\/li><li data-term='参数方程'>参数方程 — 用参数 t 表示 x、y 的方程。 <span class=glossary-ref>（第 2 章：参数方程）<\/span><\/li><li data-term='消参'>消参 — 从参数方程消去参数得到普通方程。 <span class=glossary-ref>（第 2 章：参数方程）<\/span><\/li><li data-term='离心角'>离心角 — 椭圆参数方程中的 θ。 <span class=glossary-ref>（第 2 章：参数方程）<\/span><\/li><li data-term='增点'>增点 — 互化或消参后多出来的、不属于原曲线的点。 <span class=glossary-ref>（第 3 章：互化、范围与最值）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：选表示三问<\/h2>\n<p>① 图形是否绕极点旋转对称（用极坐标）；② 是否需要求最值或描述运动（用参数）；③ 是否需要判断形状与交点（用直角坐标）。<\/p>\n<h2>框架：互化两步<\/h2>\n<p>① 代公式转换；② 检查点集是否一致（范围、符号、象限）。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>互化<\/td><td>x=ρcosθ，y=ρsinθ；ρ²=x²+y²<\/td><\/tr><tr><td>圆<\/td><td>ρ=r（圆心极点）；ρ=2a cosθ（过极点）<\/td><\/tr><tr><td>圆锥曲线<\/td><td>ρ=ep/(1−e cosθ)<\/td><\/tr><tr><td>直线参数<\/td><td>x=x₀+at，y=y₀+bt<\/td><\/tr><tr><td>圆参数<\/td><td>x=r cosθ，y=r sinθ<\/td><\/tr><tr><td>椭圆参数<\/td><td>x=a cosθ，y=b sinθ<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
