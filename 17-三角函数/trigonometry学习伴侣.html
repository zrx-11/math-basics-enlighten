<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>三角函数</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/picocss/2.0.6/dist/css/pico.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
sup{font-size:.78em;line-height:0;vertical-align:.42em;font-weight:500}
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>三角函数</h1>
    <div class="sub">把角当成数：从单位圆到波形</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>
<script>
const DATA = {"manifest": {"slug": "trigonometry", "title": "三角函数", "subtitle": "把角当成数：从单位圆到波形", "book": {"title": "三角函数", "author": "毛毓球", "source": ["数学基础知识丛书-17-三角函数 毛毓球.pdf"]}, "audience": "零基础", "goal": "理解任意角与弧度制，掌握同角关系、诱导公式、加法定理，能画三角函数图象并解简单三角方程。", "learningPath": [{"step": "01", "title": "角、弧度与三角比", "chapterIds": ["ch01"], "checkpoint": "能把任意角化到 0°~360°并说出象限"}, {"step": "02", "title": "同角关系与诱导公式", "chapterIds": ["ch02"], "checkpoint": "能把任意角的三角比化成锐角"}, {"step": "03", "title": "加法定理与倍角", "chapterIds": ["ch03"], "checkpoint": "能默写和角、差角与二倍角公式"}, {"step": "04", "title": "图象、性质与三角方程", "chapterIds": ["ch04"], "checkpoint": "能说出周期、对称轴并写通解"}], "chapters": [{"id": "ch01", "title": "第 1 章：角、弧度与三角比", "file": "chapters/ch01-angle-radian.md", "difficulty": 2, "source": {"file": "数学基础知识丛书-17-三角函数 毛毓球.pdf", "kind": "原书 PDF"}, "prereqNote": "相似、坐标", "depthFragment": "chapters/ch01-depth.md", "prerequisites": []}, {"id": "ch02", "title": "第 2 章：同角关系与诱导公式", "file": "chapters/ch02-identities.md", "difficulty": 2, "source": {"file": "数学基础知识丛书-17-三角函数 毛毓球.pdf", "kind": "原书 PDF"}, "prereqNote": "", "depthFragment": "chapters/ch02-depth.md", "prerequisites": ["ch01"]}, {"id": "ch03", "title": "第 3 章：加法定理与倍角公式", "file": "chapters/ch03-addition.md", "difficulty": 3, "source": {"file": "数学基础知识丛书-17-三角函数 毛毓球.pdf", "kind": "原书 PDF"}, "prereqNote": "", "depthFragment": "chapters/ch03-depth.md", "prerequisites": ["ch02"]}, {"id": "ch04", "title": "第 4 章：图象、性质与三角方程", "file": "chapters/ch04-graphs-equations.md", "difficulty": 3, "source": {"file": "数学基础知识丛书-17-三角函数 毛毓球.pdf", "kind": "原书 PDF"}, "prereqNote": "", "depthFragment": "chapters/ch04-depth.md", "prerequisites": ["ch03"]}], "concepts": [{"id": "c01", "title": "单位圆", "file": "concepts/c01-unit-circle.md", "chapterIds": ["ch01", "ch02"], "source": {"file": "数学基础知识丛书-17-三角函数 毛毓球.pdf", "kind": "原书 PDF"}, "prerequisites": ["ch01", "ch02"]}, {"id": "c02", "title": "周期与相位", "file": "concepts/c02-period-phase.md", "chapterIds": ["ch04"], "source": {"file": "数学基础知识丛书-17-三角函数 毛毓球.pdf", "kind": "原书 PDF"}, "prerequisites": ["ch04"]}], "glossary": [{"term": "弧度", "def": "弧长与半径之比定义的角的度量。", "chapterId": "ch01"}, {"term": "终边相同的角", "def": "相差 360° 整数倍的角。", "chapterId": "ch01"}, {"term": "正弦", "def": "单位圆上角的终边交点的纵坐标。", "chapterId": "ch01"}, {"term": "余弦", "def": "单位圆上角的终边交点的横坐标。", "chapterId": "ch01"}, {"term": "诱导公式", "def": "把任意角三角比化为锐角三角比的公式。", "chapterId": "ch02"}, {"term": "加法定理", "def": "展开 α±β 三角比的公式。", "chapterId": "ch03"}, {"term": "二倍角公式", "def": "sin2α、cos2α、tan2α 的公式。", "chapterId": "ch03"}, {"term": "周期", "def": "函数值重复出现的最小正间隔。", "chapterId": "ch04"}, {"term": "振幅", "def": "y=A sin(ωx+φ) 中的 |A|。", "chapterId": "ch04"}, {"term": "通解", "def": "含整数 k、表示全部解的表达式。", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "与 −30° 终边相同的角是：", "options": ["30°", "330°", "300°", "150°"], "answer": 1, "explain": "−30°+360°=330°。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "150° 化为弧度是：", "options": ["5π/6", "2π/3", "3π/4", "7π/6"], "answer": 0, "explain": "150°=150×π/180=5π/6。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "sin210° 的值是：", "options": ["1/2", "−1/2", "√3/2", "−√3/2"], "answer": 1, "explain": "sin210°=sin(180°+30°)=−sin30°=−1/2。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：", "options": ["4/5", "−4/5", "3/5", "−3/5"], "answer": 1, "explain": "第三象限正弦为负，sinθ=−√(1−9/25)=−4/5。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "cos(α+β) 展开为：", "options": ["cosαcosβ+sinαsinβ", "cosαcosβ−sinαsinβ", "sinαcosβ+cosαsinβ", "sinαcosβ−cosαsinβ"], "answer": 1, "explain": "余弦和角公式为 cosαcosβ−sinαsinβ。", "relatedConceptId": "", "prerequisites": ["ch03"]}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "sin2α 等于：", "options": ["2sinα", "2sinαcosα", "sin²α−cos²α", "1−2sin²α"], "answer": 1, "explain": "二倍角正弦公式为 2sinαcosα。", "relatedConceptId": "", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "ch04", "type": "single", "question": "y=2sin(3x) 的周期是：", "options": ["2π", "2π/3", "3π", "π/3"], "answer": 1, "explain": "T=2π/|ω|=2π/3。", "relatedConceptId": "c02", "prerequisites": ["ch04"]}, {"id": "q08", "chapterId": "ch04", "type": "single", "question": "方程 cosx=0 的通解是：", "options": ["x=kπ", "x=π/2+kπ", "x=2kπ", "x=π/4+kπ"], "answer": 1, "explain": "余弦为零的角是 π/2 的奇数倍，即 x=π/2+kπ。", "relatedConceptId": "c02", "prerequisites": ["ch04"]}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "sin(π/6) 的值是：", "options": ["1/2", "√3/2", "√2/2", "1"], "answer": 0, "explain": "π/6=30°，sin30°=1/2。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "y=sin(2x−π/3) 的周期是：", "options": ["π", "2π", "π/2", "4π"], "answer": 0, "explain": "T=2π/2=π。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：角、弧度与三角比」的一句话核心是什么？", "back": "角不再限于 0°~90°：它可以任意大、可以为负；三角比由单位圆上点的坐标定义。", "tags": ["trigonometry", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：同角关系与诱导公式」的一句话核心是什么？", "back": "同角关系管“同一个角的三种比”，诱导公式管“不同角的同名比”。", "tags": ["trigonometry", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：加法定理与倍角公式」的一句话核心是什么？", "back": "所有和角、倍角公式都由一条出发：cos(α−β)=cosαcosβ+sinαsinβ。", "tags": ["trigonometry", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：图象、性质与三角方程」的一句话核心是什么？", "back": "正弦、余弦的周期是 2π，正切是 π；图象的平移伸缩都写在 A、ω、φ 三个参数里。", "tags": ["trigonometry", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「弧度」？", "back": "弧长与半径之比定义的角的度量。", "tags": ["trigonometry", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「终边相同的角」？", "back": "相差 360° 整数倍的角。", "tags": ["trigonometry", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「正弦」？", "back": "单位圆上角的终边交点的纵坐标。", "tags": ["trigonometry", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「余弦」？", "back": "单位圆上角的终边交点的横坐标。", "tags": ["trigonometry", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「诱导公式」？", "back": "把任意角三角比化为锐角三角比的公式。", "tags": ["trigonometry", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「加法定理」？", "back": "展开 α±β 三角比的公式。", "tags": ["trigonometry", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「二倍角公式」？", "back": "sin2α、cos2α、tan2α 的公式。", "tags": ["trigonometry", "术语"]}, {"id": "f12", "chapterId": "ch04", "front": "什么是「周期」？", "back": "函数值重复出现的最小正间隔。", "tags": ["trigonometry", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「振幅」？", "back": "y=A sin(ωx+φ) 中的 |A|。", "tags": ["trigonometry", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「通解」？", "back": "含整数 k、表示全部解的表达式。", "tags": ["trigonometry", "术语"]}], "companion": "trigonometry学习伴侣.html", "deriv": "trigonometry从零推导.html"}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">相似、坐标<\/span><\/div><h1>第 1 章：角、弧度与三角比<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：相似、坐标\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把任意角化到 0°~360°并判断象限\n<\/li><li>\n完成角度与弧度的互化\n<\/li><li>\n用单位圆写出三角比的定义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>角不再限于 0°~90°：它可以任意大、可以为负；三角比由单位圆上点的坐标定义。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 任意角<\/h3>\n<p>射线绕端点旋转形成角：逆时针为正，顺时针为负，转多圈就是大于 360° 的角。<\/p>\n<p>与角 α 终边相同的角可写成 α+k·360°（k 为整数）。判断象限时，先把角化到 0°~360°。<\/p>\n<h3>1.2 弧度制<\/h3>\n<p>弧长与半径之比定义为角的弧度数：θ=l/r。整圆周长 2πr，故 360°=2π 弧度，180°=π 弧度。<\/p>\n<p>互化：1°=π/180 弧度；1 弧度=(180/π)°≈57.3°。<\/p>\n<p>用弧度后，弧长 l=rθ、扇形面积 S=(1/2)r²θ 都不必再带度数符号。<\/p>\n<h3>1.3 单位圆定义<\/h3>\n<p>在单位圆上，角 θ 的终边与圆交于点 P(x,y)，则<\/p>\n<p>cosθ=x，sinθ=y，tanθ=y/x（x≠0）<\/p>\n<p>这个定义对任意角都成立，正负号由所在象限决定：一全正、二正弦正、三正切正、四余弦正。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：单位圆像一块钟面，角就是指针转过的角度，坐标就是指针末端的横纵位置。<\/p>\n<p><strong>失效边界<\/strong>：tan 在 x=0（即 90°、270° 等）处无定义，不能硬算。<\/p>\n<p><strong>实例<\/strong>：−30° 与 330° 终边相同，都在第四象限；sin(−30°)=−1/2，cos(−30°)=√3/2。 5π/6 弧度=150°，在第二象限，sin 为正、cos 为负。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 角只能在 0°到 360°之间 —— 实际上 角可以任意大，也可以为负；终边相同的角有无穷多个。\n<\/li><li>\n别以为 sin30° 与 sin(30 弧度) 一样 —— 实际上 一个是角度制，一个是弧度制，数值完全不同，必须标明单位。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n与 −30° 终边相同的角是：\n<\/li><li>\n150° 化为弧度是：\n<p>A. 30° ｜ B. 330° ｜ C. 300° ｜ D. 150° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：−30°+360°=330°。 A. 5π/6 ｜ B. 2π/3 ｜ C. 3π/4 ｜ D. 7π/6 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：150°=150×π/180=5π/6。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n逆时针为正，顺时针为负；终边相同角相差 360° 的整数倍\n<\/li><li>\n180°=π 弧度\n<\/li><li>\n单位圆：cos=x，sin=y，tan=y/x\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：角、弧度与三角比）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：角、弧度与三角比<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>三角函数之所以能处理任意角，是因为定义从“直角三角形”搬到了“单位圆”：坐标有正负，就能表示任意象限。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>弧度是弧长与半径之比；正弦、余弦是单位圆上点的纵、横坐标。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像钟表指针：转过一圈还可以继续转，位置由角度唯一确定。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 弧度<\/h3>\n<div class=\"katex-block\">\\theta=\\frac{l}{r}<\/div>\n<p>用弧长与半径的比定义角，与圆的大小无关。<\/p>\n<h3>2. 互化<\/h3>\n<div class=\"katex-block\">180^{\\circ}=\\pi\\ \\text{rad}<\/div>\n<p>角度制与弧度制的换算基准。<\/p>\n<h3>3. 单位圆定义<\/h3>\n<div class=\"katex-block\">\\cos\\theta=x,\\ \\sin\\theta=y<\/div>\n<p>角的终边与单位圆交点的坐标，就是余弦与正弦。<\/p>\n<h3>4. 平方关系<\/h3>\n<div class=\"katex-block\">\\sin^{2}\\theta+\\cos^{2}\\theta=1<\/div>\n<p>单位圆上 x²+y²=1，直接得到这条恒等式。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>tan 在横坐标为零处没有定义；写定义域时必须排除这些点。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《三角函数》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 1 章：角、弧度与三角比"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：角、弧度与三角比<\/a><\/span><\/div><h1>第 2 章：同角关系与诱导公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用平方关系与商关系化简\n<\/li><li>\n用诱导公式把任意角化到锐角\n<\/li><li>\n根据象限确定符号\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同角关系管“同一个角的三种比”，诱导公式管“不同角的同名比”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 同角关系<\/h3>\n<p>sin²θ+cos²θ=1；tanθ=sinθ/cosθ（cosθ≠0）；1+tan²θ=1/cos²θ。<\/p>\n<p>用法：已知一个比求另外两个，先定符号（看象限），再用平方关系。<\/p>\n<h3>2.2 诱导公式<\/h3>\n<p>把 k·90°±θ 或 180°±θ、360°−θ 的三角比化为 θ 的三角比：<\/p>\n<ul><li>\nsin(180°−θ)=sinθ，cos(180°−θ)=−cosθ；\n<\/li><li>\nsin(180°+θ)=−sinθ，cos(180°+θ)=−cosθ；\n<\/li><li>\nsin(−θ)=−sinθ，cos(−θ)=cosθ；\n<\/li><li>\nsin(90°−θ)=cosθ，cos(90°−θ)=sinθ。\n<\/ul>\n<p>口诀“奇变偶不变，符号看象限”：k 为奇数时函数名互换，为偶数时不变；符号按原角所在象限判断。<\/p>\n<h3>2.3 化简策略<\/h3>\n<p>先把所有角化到锐角，再统一函数名，最后用平方关系或商关系合并。步骤写全，符号不要跳。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：诱导公式像“角的搬运工”：把远处的角搬到第一象限再算，符号留在原地。<\/p>\n<p><strong>失效边界<\/strong>：口诀只适用于 90° 的整数倍加减；任意角要先化成这种形式。<\/p>\n<p><strong>实例<\/strong>：sin150°=sin(180°−30°)=sin30°=1/2；cos240°=cos(180°+60°)=−cos60°=−1/2。 已知 sinθ=3/5 且 θ 在第二象限，则 cosθ=−4/5，tanθ=−3/4。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 sin(180°−θ)=−sinθ —— 实际上 应为 sinθ；正弦在第二象限为正，符号判断要看象限。\n<\/li><li>\n别以为 同角关系中可以随意开方 —— 实际上 开方要带 ±，符号必须由象限确定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nsin210° 的值是：\n<\/li><li>\n已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：\n<p>A. 1/2 ｜ B. −1/2 ｜ C. √3/2 ｜ D. −√3/2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：sin210°=sin(180°+30°)=−sin30°=−1/2。 A. 4/5 ｜ B. −4/5 ｜ C. 3/5 ｜ D. −3/5 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：第三象限正弦为负，sinθ=−√(1−9/25)=−4/5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsin²+cos²=1；tan=sin/cos\n<\/li><li>\n诱导公式：奇变偶不变，符号看象限\n<\/li><li>\n开方取符号要看象限\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：同角关系与诱导公式）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：同角关系与诱导公式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>同角关系来自单位圆的方程，诱导公式来自单位圆的对称性。两者都不是背出来的，看一眼圆就明白。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>同角关系指同一个角的正弦、余弦、正切之间的恒等关系；诱导公式指把任意角的三角比化为锐角三角比的公式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>单位圆像一面四格镜：每个象限都是第一象限的镜像，只是符号不同。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 平方关系<\/h3>\n<div class=\"katex-block\">\\sin^{2}\\theta+\\cos^{2}\\theta=1<\/div>\n<p>单位圆上点的坐标满足 x²+y²=1。<\/p>\n<h3>2. 商关系<\/h3>\n<div class=\"katex-block\">\\tan\\theta=\\frac{\\sin\\theta}{\\cos\\theta}<\/div>\n<p>正切是正弦与余弦的比，分母不能为零。<\/p>\n<h3>3. 诱导一<\/h3>\n<div class=\"katex-block\">\\sin(180^{\\circ}-\\theta)=\\sin\\theta<\/div>\n<p>第二象限正弦为正，函数名不变。<\/p>\n<h3>4. 诱导二<\/h3>\n<div class=\"katex-block\">\\sin(90^{\\circ}-\\theta)=\\cos\\theta<\/div>\n<p>互余角的正弦等于余弦，函数名互换。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>口诀中的“奇偶”指 90° 的倍数；不是 90° 的整数倍时不能直接用。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《三角函数》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 2 章：同角关系与诱导公式"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：同角关系与诱导公式<\/a><\/span><\/div><h1>第 3 章：加法定理与倍角公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n默写和角、差角公式\n<\/li><li>\n推导二倍角公式\n<\/li><li>\n用公式化简求值\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>所有和角、倍角公式都由一条出发：cos(α−β)=cosαcosβ+sinαsinβ。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 和角与差角<\/h3>\n<p>cos(α±β)=cosαcosβ∓sinαsinβ sin(α±β)=sinαcosβ±cosαsinβ tan(α±β)=(tanα±tanβ)/(1∓tanαtanβ)<\/p>\n<p>推导思路：在单位圆上取两点，用两点距离公式与余弦定理，令两点夹角为 α−β，展开即得 cos(α−β)。其余公式由它推出。<\/p>\n<h3>3.2 二倍角<\/h3>\n<p>令 β=α：<\/p>\n<p>sin2α=2sinαcosα cos2α=cos²α−sin²α=2cos²α−1=1−2sin²α tan2α=2tanα/(1−tan²α)<\/p>\n<p>cos2α 的三个形式各有用途：求值时选能约掉的，降幂时用 2cos²α−1 或 1−2sin²α。<\/p>\n<h3>3.3 半角与降幂<\/h3>\n<p>由 cos2α=1−2sin²α 得 sin²α=(1−cos2α)/2；由 cos2α=2cos²α−1 得 cos²α=(1+cos2α)/2。<\/p>\n<p>这两条是“降幂公式”，把平方降成一次，是化简与积分的基础。<\/p>\n<h3>3.4 辅助角公式<\/h3>\n<p>a sinx+b cosx=√(a²+b²) sin(x+φ)，其中 tanφ=b/a。它把两项合成一项，便于求最值与周期。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：加法定理像“两个旋转叠加”：先转 α 再转 β，等于一次转 α+β，但要用坐标的混合表示。<\/p>\n<p><strong>失效边界<\/strong>：tan 的公式要求分母不为零，α±β 不能等于 90° 的奇数倍。<\/p>\n<p><strong>实例<\/strong>：sin75°=sin(45°+30°)=sin45°cos30°+cos45°sin30°=(√6+√2)/4≈0.966。 cos60°=cos(2×30°)=1−2sin²30°=1−1/2=1/2，验证正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 sin(α+β)=sinα+sinβ —— 实际上 不成立。取 α=β=30°：左边 sin60°≈0.866，右边 1。\n<\/li><li>\n别以为 cos2α 只有一个形式 —— 实际上 有三个等价形式，按题目需要选用，选错会增加计算量。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ncos(α+β) 展开为：\n<\/li><li>\nsin2α 等于：\n<p>A. cosαcosβ+sinαsinβ ｜ B. cosαcosβ−sinαsinβ ｜ C. sinαcosβ+cosαsinβ ｜ D. sinαcosβ−cosαsinβ <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：余弦和角公式为 cosαcosβ−sinαsinβ。 A. 2sinα ｜ B. 2sinαcosα ｜ C. sin²α−cos²α ｜ D. 1−2sin²α <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：二倍角正弦公式为 2sinαcosα。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ncos(α±β)=cosαcosβ∓sinαsinβ\n<\/li><li>\nsin2α=2sinαcosα；cos2α 有三种形式\n<\/li><li>\n降幂：sin²=(1−cos2α)/2\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：加法定理与倍角公式）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：加法定理与倍角公式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>整套和角公式只需推一条：cos(α−β)。其余靠“换元、令 β=α、相除”得到。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>加法定理指把 α±β 的三角比展开为 α、β 的三角比的公式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像两把尺子接起来量长度：接缝处的重叠部分要被减掉（余弦公式里的减号）。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 余弦差角<\/h3>\n<div class=\"katex-block\">\\cos(\\alpha-\\beta)=\\cos\\alpha\\cos\\beta+\\sin\\alpha\\sin\\beta<\/div>\n<p>由单位圆两点距离公式展开得到，是全部公式的源头。<\/p>\n<h3>2. 正弦和角<\/h3>\n<div class=\"katex-block\">\\sin(\\alpha+\\beta)=\\sin\\alpha\\cos\\beta+\\cos\\alpha\\sin\\beta<\/div>\n<p>用诱导公式 sinθ=cos(90°−θ) 从余弦公式转出。<\/p>\n<h3>3. 二倍角<\/h3>\n<div class=\"katex-block\">\\sin 2\\alpha=2\\sin\\alpha\\cos\\alpha<\/div>\n<p>令 β=α 代入和角公式即得。<\/p>\n<h3>4. 降幂<\/h3>\n<div class=\"katex-block\">\\sin^{2}\\alpha=\\frac{1-\\cos 2\\alpha}{2}<\/div>\n<p>由 cos2α 的变形反解，把平方降为一次。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>公式对所有角成立，但 tan 的公式在分母为零时失效，要单独讨论。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《三角函数》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 3 章：加法定理与倍角公式"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：加法定理与倍角公式<\/a><\/span><\/div><h1>第 4 章：图象、性质与三角方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n画出三种三角函数的图象并说出周期、对称性\n<\/li><li>\n分析 y=A sin(ωx+φ) 的振幅、周期、相位\n<\/li><li>\n写出简单三角方程的通解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>正弦、余弦的周期是 2π，正切是 π；图象的平移伸缩都写在 A、ω、φ 三个参数里。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 三种基本图象<\/h3>\n<ul><li>\ny=sin x：定义域 R，值域 [−1,1]，周期 2π，奇函数，对称中心 (kπ,0)，对称轴 x=π/2+kπ；\n<\/li><li>\ny=cos x：值域 [−1,1]，周期 2π，偶函数，对称轴 x=kπ；\n<\/li><li>\ny=tan x：定义域 x≠π/2+kπ，值域 R，周期 π，奇函数，无对称轴。\n<\/ul>\n<h3>4.2 一般形式 y=A sin(ωx+φ)+k<\/h3>\n<ul><li>\nA 是振幅（图象高度），|A| 越大越“高”；\n<\/li><li>\nω 决定周期 T=2π/|ω|；\n<\/li><li>\nφ 是初相，决定左右平移：左移 φ/ω（φ&gt;0 时）；\n<\/li><li>\nk 是上下平移。\n<\/ul>\n<p>五点法画图：取 ωx+φ=0、π/2、π、3π/2、2π 五个点，描出后再连线。<\/p>\n<h3>4.3 三角方程<\/h3>\n<p>sinx=a（|a|≤1）的通解：x=kπ+(−1)<sup>k<\/sup> arcsin a；也可写成 x=arcsin a+2kπ 或 x=π−arcsin a+2kπ。<\/p>\n<p>cosx=a 的通解：x=±arccos a+2kπ。<\/p>\n<p>tanx=a 的通解：x=arctan a+kπ。<\/p>\n<p>求通解后，若题目限定区间，再把 k 取遍并筛出落在区间内的解。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：正弦曲线像水波，振幅是波高，周期是两波峰的距离，相位是波从哪里开始。<\/p>\n<p><strong>失效边界<\/strong>：ω 必须取正再谈周期；ω 为负时先提出负号，否则平移方向会反。<\/p>\n<p><strong>实例<\/strong>：y=3sin(2x+π/3)：振幅 3，周期 2π/2=π，初相 π/3，图象左移 π/6。 解 sinx=1/2：x=π/6+2kπ 或 x=5π/6+2kπ。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 周期只与 A 有关 —— 实际上 周期由 ω 决定，T=2π/|ω|；A 只改变高度。\n<\/li><li>\n别以为 三角方程只有一个解 —— 实际上 在实数范围内有无穷多解，必须写通解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny=2sin(3x) 的周期是：\n<\/li><li>\n方程 cosx=0 的通解是：\n<p>A. 2π ｜ B. 2π/3 ｜ C. 3π ｜ D. π/3 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：T=2π/|ω|=2π/3。 A. x=kπ ｜ B. x=π/2+kπ ｜ C. x=2kπ ｜ D. x=π/4+kπ <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：余弦为零的角是 π/2 的奇数倍，即 x=π/2+kπ。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsin、cos 周期 2π，tan 周期 π\n<\/li><li>\ny=A sin(ωx+φ)：A 振幅、ω 定周期、φ 定平移\n<\/li><li>\n三角方程写通解，再按区间筛选\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：图象、性质与三角方程）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：图象、性质与三角方程<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>三角函数的图象不是画出来的，是“单位圆上的点转一圈，纵坐标随时间变化”描出来的。理解了这一句，周期与波形都有了来源。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>周期函数指存在 T≠0 使 f(x+T)=f(x) 恒成立；最小正周期是最小的这样的 T。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像摩天轮上的一个座舱：转一圈回到原高度，高度随时间的变化就是正弦曲线。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 周期<\/h3>\n<div class=\"katex-block\">T=\\frac{2\\pi}{|\\omega|}<\/div>\n<p>ω 越大转得越快，周期越短。<\/p>\n<h3>2. 五点法<\/h3>\n<div class=\"katex-block\">\\omega x+\\varphi=0,\\ \\frac{\\pi}{2},\\ \\pi,\\ \\frac{3\\pi}{2},\\ 2\\pi<\/div>\n<p>取这五个相位值，对应图象的零点、最值点。<\/p>\n<h3>3. 正弦方程<\/h3>\n<div class=\"katex-block\">\\sin x=a\\ \\Rightarrow\\ x=k\\pi+(-1)^{k}\\arcsin a<\/div>\n<p>一个周期内有两解，用 (−1)<sup>k<\/sup> 统一表示。<\/p>\n<h3>4. 余弦方程<\/h3>\n<div class=\"katex-block\">\\cos x=a\\ \\Rightarrow\\ x=\\pm\\arccos a+2k\\pi<\/div>\n<p>余弦关于 y 轴对称，两解关于 0 对称。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>tan 的周期是 π 而不是 2π；讨论周期前要先看定义域是否被切断。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《三角函数》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 4 章：图象、性质与三角方程"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：角、弧度与三角比<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：同角关系与诱导公式<\/a><\/span><\/div><h1>单位圆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>三角函数的一切定义、符号、公式，都能在单位圆上找到出处。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是把“几何的角”变成“可运算的数”的那座桥。<\/p>\n<h2>详解<\/h2>\n<p>角 θ 的终边与单位圆交于 P(x,y)，则 cosθ=x、sinθ=y、tanθ=y/x。平方关系来自 x²+y²=1；诱导公式来自四个象限的对称；和角公式来自圆上两点的距离。<\/p>\n<h2>常见误解<\/h2>\n<p>只背公式不看圆，符号一错就全错。<\/p>\n<h2>相关概念<\/h2>\n<p>三角比（ch01）、诱导公式（ch02）<\/p>", "kind": "concept", "title": "单位圆"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：图象、性质与三角方程<\/a><\/span><\/div><h1>周期与相位<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>ω 决定多久重复一次，φ 决定从哪里开始，A 决定多高。<\/p>\n<h2>为什么重要<\/h2>\n<p>一切往复现象（振动、交流电、声波）都用这三个参数描述。<\/p>\n<h2>详解<\/h2>\n<p>y=A sin(ωx+φ)+k：周期 T=2π/|ω|，振幅 |A|，初相 φ，平衡位置 k。平移量是 φ/ω，不是 φ，这是最容易错的一步。<\/p>\n<h2>常见误解<\/h2>\n<p>把 φ 直接当成平移量，忽略 ω 的缩放作用。<\/p>\n<h2>相关概念<\/h2>\n<p>图象（ch04）、加法定理（ch03）<\/p>", "kind": "concept", "title": "周期与相位"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：角、弧度与三角比<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：角、弧度与三角比<\/a><br>检查点：能把任意角化到 0°~360°并说出象限<\/li><li class='path-step' id='path-02'><strong>步骤 02：同角关系与诱导公式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：同角关系与诱导公式<\/a><br>检查点：能把任意角的三角比化成锐角<\/li><li class='path-step' id='path-03'><strong>步骤 03：加法定理与倍角<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：加法定理与倍角公式<\/a><br>检查点：能默写和角、差角与二倍角公式<\/li><li class='path-step' id='path-04'><strong>步骤 04：图象、性质与三角方程<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：图象、性质与三角方程<\/a><br>检查点：能说出周期、对称轴并写通解<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q09' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q9.<\/b> sin(π/6) 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> √2/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q10.<\/b> y=sin(2x−π/3) 的周期是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> π<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 2π<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> π/2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 4π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：角、弧度与三角比<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 与 −30° 终边相同的角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 30°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 330°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 300°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 150°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 150° 化为弧度是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 5π/6<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 2π/3<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 3π/4<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 7π/6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：同角关系与诱导公式<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> sin210° 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> −1/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> −√3/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 4/5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> −4/5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 3/5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> −3/5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：加法定理与倍角公式<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> cos(α+β) 展开为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> cosαcosβ+sinαsinβ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> cosαcosβ−sinαsinβ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> sinαcosβ+cosαsinβ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> sinαcosβ−cosαsinβ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> sin2α 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 2sinα<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 2sinαcosα<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> sin²α−cos²α<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 1−2sin²α<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：图象、性质与三角方程<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> y=2sin(3x) 的周期是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 2π<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 2π/3<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 3π<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> π/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 方程 cosx=0 的通解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> x=kπ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> x=π/2+kπ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> x=2kπ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> x=π/4+kπ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='弧度'>弧度 — 弧长与半径之比定义的角的度量。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='终边相同的角'>终边相同的角 — 相差 360° 整数倍的角。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='正弦'>正弦 — 单位圆上角的终边交点的纵坐标。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='余弦'>余弦 — 单位圆上角的终边交点的横坐标。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='诱导公式'>诱导公式 — 把任意角三角比化为锐角三角比的公式。 <span class=glossary-ref>（第 2 章：同角关系与诱导公式）<\/span><\/li><li data-term='加法定理'>加法定理 — 展开 α±β 三角比的公式。 <span class=glossary-ref>（第 3 章：加法定理与倍角公式）<\/span><\/li><li data-term='二倍角公式'>二倍角公式 — sin2α、cos2α、tan2α 的公式。 <span class=glossary-ref>（第 3 章：加法定理与倍角公式）<\/span><\/li><li data-term='周期'>周期 — 函数值重复出现的最小正间隔。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><li data-term='振幅'>振幅 — y=A sin(ωx+φ) 中的 |A|。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><li data-term='通解'>通解 — 含整数 k、表示全部解的表达式。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：化简三步<\/h2>\n<p>① 用诱导公式把角化到锐角；② 统一函数名；③ 用平方关系或和角公式合并。<\/p>\n<h2>框架：图象五问<\/h2>\n<p>① 定义域；② 值域与振幅；③ 周期；④ 对称轴与对称中心；⑤ 单调区间。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>互化<\/td><td>180°=π 弧度<\/td><\/tr><tr><td>平方关系<\/td><td>sin²+cos²=1<\/td><\/tr><tr><td>和角<\/td><td>sin(α±β)=sinαcosβ±cosαsinβ；cos(α±β)=cosαcosβ∓sinαsinβ<\/td><\/tr><tr><td>二倍角<\/td><td>sin2α=2sinαcosα；cos2α=2cos²α−1<\/td><\/tr><tr><td>周期<\/td><td>T=2π/<\/td><td>ω<\/td><td>（tan 为 π/<\/td><td>ω<\/td><td>）<\/td><\/tr><tr><td>通解<\/td><td>sinx=a：x=kπ+(−1)<sup>k<\/sup> arcsin a<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/17-三角函数", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：角、弧度与三角比", "href": "#/chapter/ch01"}, {"label": "第 2 章：同角关系与诱导公式", "href": "#/chapter/ch02"}, {"label": "第 3 章：加法定理与倍角公式", "href": "#/chapter/ch03"}, {"label": "第 4 章：图象、性质与三角方程", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "单位圆", "href": "#/concept/c01"}, {"label": "周期与相位", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：角、弧度与三角比", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：同角关系与诱导公式", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：加法定理与倍角公式", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：图象、性质与三角方程", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">相似、坐标<\/span><\/div><h1>第 1 章：角、弧度与三角比<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：相似、坐标\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把任意角化到 0°~360°并判断象限\n<\/li><li>\n完成角度与弧度的互化\n<\/li><li>\n用单位圆写出三角比的定义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>角不再限于 0°~90°：它可以任意大、可以为负；三角比由单位圆上点的坐标定义。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 任意角<\/h3>\n<p>射线绕端点旋转形成角：逆时针为正，顺时针为负，转多圈就是大于 360° 的角。<\/p>\n<p>与角 α 终边相同的角可写成 α+k·360°（k 为整数）。判断象限时，先把角化到 0°~360°。<\/p>\n<h3>1.2 弧度制<\/h3>\n<p>弧长与半径之比定义为角的弧度数：θ=l/r。整圆周长 2πr，故 360°=2π 弧度，180°=π 弧度。<\/p>\n<p>互化：1°=π/180 弧度；1 弧度=(180/π)°≈57.3°。<\/p>\n<p>用弧度后，弧长 l=rθ、扇形面积 S=(1/2)r²θ 都不必再带度数符号。<\/p>\n<h3>1.3 单位圆定义<\/h3>\n<p>在单位圆上，角 θ 的终边与圆交于点 P(x,y)，则<\/p>\n<p>cosθ=x，sinθ=y，tanθ=y/x（x≠0）<\/p>\n<p>这个定义对任意角都成立，正负号由所在象限决定：一全正、二正弦正、三正切正、四余弦正。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：单位圆像一块钟面，角就是指针转过的角度，坐标就是指针末端的横纵位置。<\/p>\n<p><strong>失效边界<\/strong>：tan 在 x=0（即 90°、270° 等）处无定义，不能硬算。<\/p>\n<p><strong>实例<\/strong>：−30° 与 330° 终边相同，都在第四象限；sin(−30°)=−1/2，cos(−30°)=√3/2。 5π/6 弧度=150°，在第二象限，sin 为正、cos 为负。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 角只能在 0°到 360°之间 —— 实际上 角可以任意大，也可以为负；终边相同的角有无穷多个。\n<\/li><li>\n别以为 sin30° 与 sin(30 弧度) 一样 —— 实际上 一个是角度制，一个是弧度制，数值完全不同，必须标明单位。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n与 −30° 终边相同的角是：\n<\/li><li>\n150° 化为弧度是：\n<p>A. 30° ｜ B. 330° ｜ C. 300° ｜ D. 150° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：−30°+360°=330°。 A. 5π/6 ｜ B. 2π/3 ｜ C. 3π/4 ｜ D. 7π/6 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：150°=150×π/180=5π/6。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n逆时针为正，顺时针为负；终边相同角相差 360° 的整数倍\n<\/li><li>\n180°=π 弧度\n<\/li><li>\n单位圆：cos=x，sin=y，tan=y/x\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：角、弧度与三角比）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：角、弧度与三角比<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>三角函数之所以能处理任意角，是因为定义从“直角三角形”搬到了“单位圆”：坐标有正负，就能表示任意象限。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>弧度是弧长与半径之比；正弦、余弦是单位圆上点的纵、横坐标。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像钟表指针：转过一圈还可以继续转，位置由角度唯一确定。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 弧度<\/h3>\n<div class=\"katex-block\">\\theta=\\frac{l}{r}<\/div>\n<p>用弧长与半径的比定义角，与圆的大小无关。<\/p>\n<h3>2. 互化<\/h3>\n<div class=\"katex-block\">180^{\\circ}=\\pi\\ \\text{rad}<\/div>\n<p>角度制与弧度制的换算基准。<\/p>\n<h3>3. 单位圆定义<\/h3>\n<div class=\"katex-block\">\\cos\\theta=x,\\ \\sin\\theta=y<\/div>\n<p>角的终边与单位圆交点的坐标，就是余弦与正弦。<\/p>\n<h3>4. 平方关系<\/h3>\n<div class=\"katex-block\">\\sin^{2}\\theta+\\cos^{2}\\theta=1<\/div>\n<p>单位圆上 x²+y²=1，直接得到这条恒等式。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>tan 在横坐标为零处没有定义；写定义域时必须排除这些点。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《三角函数》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：角、弧度与三角比<\/a><\/span><\/div><h1>第 2 章：同角关系与诱导公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用平方关系与商关系化简\n<\/li><li>\n用诱导公式把任意角化到锐角\n<\/li><li>\n根据象限确定符号\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同角关系管“同一个角的三种比”，诱导公式管“不同角的同名比”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 同角关系<\/h3>\n<p>sin²θ+cos²θ=1；tanθ=sinθ/cosθ（cosθ≠0）；1+tan²θ=1/cos²θ。<\/p>\n<p>用法：已知一个比求另外两个，先定符号（看象限），再用平方关系。<\/p>\n<h3>2.2 诱导公式<\/h3>\n<p>把 k·90°±θ 或 180°±θ、360°−θ 的三角比化为 θ 的三角比：<\/p>\n<ul><li>\nsin(180°−θ)=sinθ，cos(180°−θ)=−cosθ；\n<\/li><li>\nsin(180°+θ)=−sinθ，cos(180°+θ)=−cosθ；\n<\/li><li>\nsin(−θ)=−sinθ，cos(−θ)=cosθ；\n<\/li><li>\nsin(90°−θ)=cosθ，cos(90°−θ)=sinθ。\n<\/ul>\n<p>口诀“奇变偶不变，符号看象限”：k 为奇数时函数名互换，为偶数时不变；符号按原角所在象限判断。<\/p>\n<h3>2.3 化简策略<\/h3>\n<p>先把所有角化到锐角，再统一函数名，最后用平方关系或商关系合并。步骤写全，符号不要跳。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：诱导公式像“角的搬运工”：把远处的角搬到第一象限再算，符号留在原地。<\/p>\n<p><strong>失效边界<\/strong>：口诀只适用于 90° 的整数倍加减；任意角要先化成这种形式。<\/p>\n<p><strong>实例<\/strong>：sin150°=sin(180°−30°)=sin30°=1/2；cos240°=cos(180°+60°)=−cos60°=−1/2。 已知 sinθ=3/5 且 θ 在第二象限，则 cosθ=−4/5，tanθ=−3/4。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 sin(180°−θ)=−sinθ —— 实际上 应为 sinθ；正弦在第二象限为正，符号判断要看象限。\n<\/li><li>\n别以为 同角关系中可以随意开方 —— 实际上 开方要带 ±，符号必须由象限确定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nsin210° 的值是：\n<\/li><li>\n已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：\n<p>A. 1/2 ｜ B. −1/2 ｜ C. √3/2 ｜ D. −√3/2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：sin210°=sin(180°+30°)=−sin30°=−1/2。 A. 4/5 ｜ B. −4/5 ｜ C. 3/5 ｜ D. −3/5 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：第三象限正弦为负，sinθ=−√(1−9/25)=−4/5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsin²+cos²=1；tan=sin/cos\n<\/li><li>\n诱导公式：奇变偶不变，符号看象限\n<\/li><li>\n开方取符号要看象限\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：同角关系与诱导公式）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：同角关系与诱导公式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>同角关系来自单位圆的方程，诱导公式来自单位圆的对称性。两者都不是背出来的，看一眼圆就明白。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>同角关系指同一个角的正弦、余弦、正切之间的恒等关系；诱导公式指把任意角的三角比化为锐角三角比的公式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>单位圆像一面四格镜：每个象限都是第一象限的镜像，只是符号不同。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 平方关系<\/h3>\n<div class=\"katex-block\">\\sin^{2}\\theta+\\cos^{2}\\theta=1<\/div>\n<p>单位圆上点的坐标满足 x²+y²=1。<\/p>\n<h3>2. 商关系<\/h3>\n<div class=\"katex-block\">\\tan\\theta=\\frac{\\sin\\theta}{\\cos\\theta}<\/div>\n<p>正切是正弦与余弦的比，分母不能为零。<\/p>\n<h3>3. 诱导一<\/h3>\n<div class=\"katex-block\">\\sin(180^{\\circ}-\\theta)=\\sin\\theta<\/div>\n<p>第二象限正弦为正，函数名不变。<\/p>\n<h3>4. 诱导二<\/h3>\n<div class=\"katex-block\">\\sin(90^{\\circ}-\\theta)=\\cos\\theta<\/div>\n<p>互余角的正弦等于余弦，函数名互换。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>口诀中的“奇偶”指 90° 的倍数；不是 90° 的整数倍时不能直接用。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《三角函数》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：同角关系与诱导公式<\/a><\/span><\/div><h1>第 3 章：加法定理与倍角公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n默写和角、差角公式\n<\/li><li>\n推导二倍角公式\n<\/li><li>\n用公式化简求值\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>所有和角、倍角公式都由一条出发：cos(α−β)=cosαcosβ+sinαsinβ。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 和角与差角<\/h3>\n<p>cos(α±β)=cosαcosβ∓sinαsinβ sin(α±β)=sinαcosβ±cosαsinβ tan(α±β)=(tanα±tanβ)/(1∓tanαtanβ)<\/p>\n<p>推导思路：在单位圆上取两点，用两点距离公式与余弦定理，令两点夹角为 α−β，展开即得 cos(α−β)。其余公式由它推出。<\/p>\n<h3>3.2 二倍角<\/h3>\n<p>令 β=α：<\/p>\n<p>sin2α=2sinαcosα cos2α=cos²α−sin²α=2cos²α−1=1−2sin²α tan2α=2tanα/(1−tan²α)<\/p>\n<p>cos2α 的三个形式各有用途：求值时选能约掉的，降幂时用 2cos²α−1 或 1−2sin²α。<\/p>\n<h3>3.3 半角与降幂<\/h3>\n<p>由 cos2α=1−2sin²α 得 sin²α=(1−cos2α)/2；由 cos2α=2cos²α−1 得 cos²α=(1+cos2α)/2。<\/p>\n<p>这两条是“降幂公式”，把平方降成一次，是化简与积分的基础。<\/p>\n<h3>3.4 辅助角公式<\/h3>\n<p>a sinx+b cosx=√(a²+b²) sin(x+φ)，其中 tanφ=b/a。它把两项合成一项，便于求最值与周期。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：加法定理像“两个旋转叠加”：先转 α 再转 β，等于一次转 α+β，但要用坐标的混合表示。<\/p>\n<p><strong>失效边界<\/strong>：tan 的公式要求分母不为零，α±β 不能等于 90° 的奇数倍。<\/p>\n<p><strong>实例<\/strong>：sin75°=sin(45°+30°)=sin45°cos30°+cos45°sin30°=(√6+√2)/4≈0.966。 cos60°=cos(2×30°)=1−2sin²30°=1−1/2=1/2，验证正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 sin(α+β)=sinα+sinβ —— 实际上 不成立。取 α=β=30°：左边 sin60°≈0.866，右边 1。\n<\/li><li>\n别以为 cos2α 只有一个形式 —— 实际上 有三个等价形式，按题目需要选用，选错会增加计算量。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ncos(α+β) 展开为：\n<\/li><li>\nsin2α 等于：\n<p>A. cosαcosβ+sinαsinβ ｜ B. cosαcosβ−sinαsinβ ｜ C. sinαcosβ+cosαsinβ ｜ D. sinαcosβ−cosαsinβ <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：余弦和角公式为 cosαcosβ−sinαsinβ。 A. 2sinα ｜ B. 2sinαcosα ｜ C. sin²α−cos²α ｜ D. 1−2sin²α <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：二倍角正弦公式为 2sinαcosα。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ncos(α±β)=cosαcosβ∓sinαsinβ\n<\/li><li>\nsin2α=2sinαcosα；cos2α 有三种形式\n<\/li><li>\n降幂：sin²=(1−cos2α)/2\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：加法定理与倍角公式）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：加法定理与倍角公式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>整套和角公式只需推一条：cos(α−β)。其余靠“换元、令 β=α、相除”得到。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>加法定理指把 α±β 的三角比展开为 α、β 的三角比的公式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像两把尺子接起来量长度：接缝处的重叠部分要被减掉（余弦公式里的减号）。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 余弦差角<\/h3>\n<div class=\"katex-block\">\\cos(\\alpha-\\beta)=\\cos\\alpha\\cos\\beta+\\sin\\alpha\\sin\\beta<\/div>\n<p>由单位圆两点距离公式展开得到，是全部公式的源头。<\/p>\n<h3>2. 正弦和角<\/h3>\n<div class=\"katex-block\">\\sin(\\alpha+\\beta)=\\sin\\alpha\\cos\\beta+\\cos\\alpha\\sin\\beta<\/div>\n<p>用诱导公式 sinθ=cos(90°−θ) 从余弦公式转出。<\/p>\n<h3>3. 二倍角<\/h3>\n<div class=\"katex-block\">\\sin 2\\alpha=2\\sin\\alpha\\cos\\alpha<\/div>\n<p>令 β=α 代入和角公式即得。<\/p>\n<h3>4. 降幂<\/h3>\n<div class=\"katex-block\">\\sin^{2}\\alpha=\\frac{1-\\cos 2\\alpha}{2}<\/div>\n<p>由 cos2α 的变形反解，把平方降为一次。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>公式对所有角成立，但 tan 的公式在分母为零时失效，要单独讨论。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《三角函数》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch04": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：加法定理与倍角公式<\/a><\/span><\/div><h1>第 4 章：图象、性质与三角方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n画出三种三角函数的图象并说出周期、对称性\n<\/li><li>\n分析 y=A sin(ωx+φ) 的振幅、周期、相位\n<\/li><li>\n写出简单三角方程的通解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>正弦、余弦的周期是 2π，正切是 π；图象的平移伸缩都写在 A、ω、φ 三个参数里。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 三种基本图象<\/h3>\n<ul><li>\ny=sin x：定义域 R，值域 [−1,1]，周期 2π，奇函数，对称中心 (kπ,0)，对称轴 x=π/2+kπ；\n<\/li><li>\ny=cos x：值域 [−1,1]，周期 2π，偶函数，对称轴 x=kπ；\n<\/li><li>\ny=tan x：定义域 x≠π/2+kπ，值域 R，周期 π，奇函数，无对称轴。\n<\/ul>\n<h3>4.2 一般形式 y=A sin(ωx+φ)+k<\/h3>\n<ul><li>\nA 是振幅（图象高度），|A| 越大越“高”；\n<\/li><li>\nω 决定周期 T=2π/|ω|；\n<\/li><li>\nφ 是初相，决定左右平移：左移 φ/ω（φ&gt;0 时）；\n<\/li><li>\nk 是上下平移。\n<\/ul>\n<p>五点法画图：取 ωx+φ=0、π/2、π、3π/2、2π 五个点，描出后再连线。<\/p>\n<h3>4.3 三角方程<\/h3>\n<p>sinx=a（|a|≤1）的通解：x=kπ+(−1)<sup>k<\/sup> arcsin a；也可写成 x=arcsin a+2kπ 或 x=π−arcsin a+2kπ。<\/p>\n<p>cosx=a 的通解：x=±arccos a+2kπ。<\/p>\n<p>tanx=a 的通解：x=arctan a+kπ。<\/p>\n<p>求通解后，若题目限定区间，再把 k 取遍并筛出落在区间内的解。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：正弦曲线像水波，振幅是波高，周期是两波峰的距离，相位是波从哪里开始。<\/p>\n<p><strong>失效边界<\/strong>：ω 必须取正再谈周期；ω 为负时先提出负号，否则平移方向会反。<\/p>\n<p><strong>实例<\/strong>：y=3sin(2x+π/3)：振幅 3，周期 2π/2=π，初相 π/3，图象左移 π/6。 解 sinx=1/2：x=π/6+2kπ 或 x=5π/6+2kπ。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 周期只与 A 有关 —— 实际上 周期由 ω 决定，T=2π/|ω|；A 只改变高度。\n<\/li><li>\n别以为 三角方程只有一个解 —— 实际上 在实数范围内有无穷多解，必须写通解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny=2sin(3x) 的周期是：\n<\/li><li>\n方程 cosx=0 的通解是：\n<p>A. 2π ｜ B. 2π/3 ｜ C. 3π ｜ D. π/3 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：T=2π/|ω|=2π/3。 A. x=kπ ｜ B. x=π/2+kπ ｜ C. x=2kπ ｜ D. x=π/4+kπ <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：余弦为零的角是 π/2 的奇数倍，即 x=π/2+kπ。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsin、cos 周期 2π，tan 周期 π\n<\/li><li>\ny=A sin(ωx+φ)：A 振幅、ω 定周期、φ 定平移\n<\/li><li>\n三角方程写通解，再按区间筛选\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：图象、性质与三角方程）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：图象、性质与三角方程<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>三角函数的图象不是画出来的，是“单位圆上的点转一圈，纵坐标随时间变化”描出来的。理解了这一句，周期与波形都有了来源。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>周期函数指存在 T≠0 使 f(x+T)=f(x) 恒成立；最小正周期是最小的这样的 T。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像摩天轮上的一个座舱：转一圈回到原高度，高度随时间的变化就是正弦曲线。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 周期<\/h3>\n<div class=\"katex-block\">T=\\frac{2\\pi}{|\\omega|}<\/div>\n<p>ω 越大转得越快，周期越短。<\/p>\n<h3>2. 五点法<\/h3>\n<div class=\"katex-block\">\\omega x+\\varphi=0,\\ \\frac{\\pi}{2},\\ \\pi,\\ \\frac{3\\pi}{2},\\ 2\\pi<\/div>\n<p>取这五个相位值，对应图象的零点、最值点。<\/p>\n<h3>3. 正弦方程<\/h3>\n<div class=\"katex-block\">\\sin x=a\\ \\Rightarrow\\ x=k\\pi+(-1)^{k}\\arcsin a<\/div>\n<p>一个周期内有两解，用 (−1)<sup>k<\/sup> 统一表示。<\/p>\n<h3>4. 余弦方程<\/h3>\n<div class=\"katex-block\">\\cos x=a\\ \\Rightarrow\\ x=\\pm\\arccos a+2k\\pi<\/div>\n<p>余弦关于 y 轴对称，两解关于 0 对称。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>tan 的周期是 π 而不是 2π；讨论周期前要先看定义域是否被切断。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《三角函数》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：角、弧度与三角比<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：同角关系与诱导公式<\/a><\/span><\/div><h1>单位圆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>三角函数的一切定义、符号、公式，都能在单位圆上找到出处。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是把“几何的角”变成“可运算的数”的那座桥。<\/p>\n<h2>详解<\/h2>\n<p>角 θ 的终边与单位圆交于 P(x,y)，则 cosθ=x、sinθ=y、tanθ=y/x。平方关系来自 x²+y²=1；诱导公式来自四个象限的对称；和角公式来自圆上两点的距离。<\/p>\n<h2>常见误解<\/h2>\n<p>只背公式不看圆，符号一错就全错。<\/p>\n<h2>相关概念<\/h2>\n<p>三角比（ch01）、诱导公式（ch02）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-17-三角函数 毛毓球.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：图象、性质与三角方程<\/a><\/span><\/div><h1>周期与相位<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>ω 决定多久重复一次，φ 决定从哪里开始，A 决定多高。<\/p>\n<h2>为什么重要<\/h2>\n<p>一切往复现象（振动、交流电、声波）都用这三个参数描述。<\/p>\n<h2>详解<\/h2>\n<p>y=A sin(ωx+φ)+k：周期 T=2π/|ω|，振幅 |A|，初相 φ，平衡位置 k。平移量是 φ/ω，不是 φ，这是最容易错的一步。<\/p>\n<h2>常见误解<\/h2>\n<p>把 φ 直接当成平移量，忽略 ω 的缩放作用。<\/p>\n<h2>相关概念<\/h2>\n<p>图象（ch04）、加法定理（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：角、弧度与三角比<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：角、弧度与三角比<\/a><br>检查点：能把任意角化到 0°~360°并说出象限<\/li><li class='path-step' id='path-02'><strong>步骤 02：同角关系与诱导公式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：同角关系与诱导公式<\/a><br>检查点：能把任意角的三角比化成锐角<\/li><li class='path-step' id='path-03'><strong>步骤 03：加法定理与倍角<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：加法定理与倍角公式<\/a><br>检查点：能默写和角、差角与二倍角公式<\/li><li class='path-step' id='path-04'><strong>步骤 04：图象、性质与三角方程<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：图象、性质与三角方程<\/a><br>检查点：能说出周期、对称轴并写通解<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q09' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q9.<\/b> sin(π/6) 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> √2/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q10.<\/b> y=sin(2x−π/3) 的周期是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> π<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 2π<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> π/2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 4π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：角、弧度与三角比<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 与 −30° 终边相同的角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 30°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 330°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 300°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 150°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 150° 化为弧度是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 5π/6<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 2π/3<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 3π/4<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 7π/6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：同角关系与诱导公式<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> sin210° 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> −1/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> −√3/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 4/5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> −4/5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 3/5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> −3/5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：加法定理与倍角公式<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> cos(α+β) 展开为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> cosαcosβ+sinαsinβ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> cosαcosβ−sinαsinβ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> sinαcosβ+cosαsinβ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> sinαcosβ−cosαsinβ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> sin2α 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 2sinα<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 2sinαcosα<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> sin²α−cos²α<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 1−2sin²α<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：图象、性质与三角方程<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> y=2sin(3x) 的周期是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 2π<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 2π/3<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 3π<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> π/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c02' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 方程 cosx=0 的通解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> x=kπ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> x=π/2+kπ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> x=2kπ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> x=π/4+kπ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='弧度'>弧度 — 弧长与半径之比定义的角的度量。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='终边相同的角'>终边相同的角 — 相差 360° 整数倍的角。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='正弦'>正弦 — 单位圆上角的终边交点的纵坐标。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='余弦'>余弦 — 单位圆上角的终边交点的横坐标。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='诱导公式'>诱导公式 — 把任意角三角比化为锐角三角比的公式。 <span class=glossary-ref>（第 2 章：同角关系与诱导公式）<\/span><\/li><li data-term='加法定理'>加法定理 — 展开 α±β 三角比的公式。 <span class=glossary-ref>（第 3 章：加法定理与倍角公式）<\/span><\/li><li data-term='二倍角公式'>二倍角公式 — sin2α、cos2α、tan2α 的公式。 <span class=glossary-ref>（第 3 章：加法定理与倍角公式）<\/span><\/li><li data-term='周期'>周期 — 函数值重复出现的最小正间隔。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><li data-term='振幅'>振幅 — y=A sin(ωx+φ) 中的 |A|。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><li data-term='通解'>通解 — 含整数 k、表示全部解的表达式。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：化简三步<\/h2>\n<p>① 用诱导公式把角化到锐角；② 统一函数名；③ 用平方关系或和角公式合并。<\/p>\n<h2>框架：图象五问<\/h2>\n<p>① 定义域；② 值域与振幅；③ 周期；④ 对称轴与对称中心；⑤ 单调区间。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>互化<\/td><td>180°=π 弧度<\/td><\/tr><tr><td>平方关系<\/td><td>sin²+cos²=1<\/td><\/tr><tr><td>和角<\/td><td>sin(α±β)=sinαcosβ±cosαsinβ；cos(α±β)=cosαcosβ∓sinαsinβ<\/td><\/tr><tr><td>二倍角<\/td><td>sin2α=2sinαcosα；cos2α=2cos²α−1<\/td><\/tr><tr><td>周期<\/td><td>T=2π/<\/td><td>ω<\/td><td>（tan 为 π/<\/td><td>ω<\/td><td>）<\/td><\/tr><tr><td>通解<\/td><td>sinx=a：x=kπ+(−1)<sup>k<\/sup> arcsin a<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  const urls = [
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.js',
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    s.onload = () => { networkLoaded = true; cb(); };
    s.onerror = () => { s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库加载失败，请联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
