<style>
:root{

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}

.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}

<script>
const DATA = {"manifest": {"slug": "trigonometry", "title": "三角函数", "subtitle": "把角当成数：从单位圆到波形", "book": {"title": "三角函数", "author": "毛毓球", "source": ["数学基础知识丛书-17-三角函数 毛毓球.pdf"]}, "audience": "零基础", "goal": "理解任意角与弧度制，掌握同角关系、诱导公式、加法定理，能画三角函数图象并解简单三角方程。", "learningPath": [{"step": "01", "title": "角、弧度与三角比", "chapterIds": ["ch01"], "checkpoint": "能把任意角化到 0°~360°并说出象限"}, {"step": "02", "title": "同角关系与诱导公式", "chapterIds": ["ch02"], "checkpoint": "能把任意角的三角比化成锐角"}, {"step": "03", "title": "加法定理与倍角", "chapterIds": ["ch03"], "checkpoint": "能默写和角、差角与二倍角公式"}, {"step": "04", "title": "图象、性质与三角方程", "chapterIds": ["ch04"], "checkpoint": "能说出周期、对称轴并写通解"}], "chapters": [{"id": "ch01", "title": "第 1 章：角、弧度与三角比", "file": "chapters/ch01-angle-radian.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：同角关系与诱导公式", "file": "chapters/ch02-identities.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：加法定理与倍角公式", "file": "chapters/ch03-addition.md", "difficulty": 3}, {"id": "ch04", "title": "第 4 章：图象、性质与三角方程", "file": "chapters/ch04-graphs-equations.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "单位圆", "file": "concepts/c01-unit-circle.md", "chapterIds": ["ch01", "ch02"]}, {"id": "c02", "title": "周期与相位", "file": "concepts/c02-period-phase.md", "chapterIds": ["ch04"]}], "glossary": [{"term": "弧度", "def": "弧长与半径之比定义的角的度量。", "chapterId": "ch01"}, {"term": "终边相同的角", "def": "相差 360° 整数倍的角。", "chapterId": "ch01"}, {"term": "正弦", "def": "单位圆上角的终边交点的纵坐标。", "chapterId": "ch01"}, {"term": "余弦", "def": "单位圆上角的终边交点的横坐标。", "chapterId": "ch01"}, {"term": "诱导公式", "def": "把任意角三角比化为锐角三角比的公式。", "chapterId": "ch02"}, {"term": "加法定理", "def": "展开 α±β 三角比的公式。", "chapterId": "ch03"}, {"term": "二倍角公式", "def": "sin2α、cos2α、tan2α 的公式。", "chapterId": "ch03"}, {"term": "周期", "def": "函数值重复出现的最小正间隔。", "chapterId": "ch04"}, {"term": "振幅", "def": "y=A sin(ωx+φ) 中的 |A|。", "chapterId": "ch04"}, {"term": "通解", "def": "含整数 k、表示全部解的表达式。", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "与 −30° 终边相同的角是：", "options": ["30°", "330°", "300°", "150°"], "answer": 1, "explain": "−30°+360°=330°。"}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "150° 化为弧度是：", "options": ["5π/6", "2π/3", "3π/4", "7π/6"], "answer": 0, "explain": "150°=150×π/180=5π/6。"}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "sin210° 的值是：", "options": ["1/2", "−1/2", "√3/2", "−√3/2"], "answer": 1, "explain": "sin210°=sin(180°+30°)=−sin30°=−1/2。"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：", "options": ["4/5", "−4/5", "3/5", "−3/5"], "answer": 1, "explain": "第三象限正弦为负，sinθ=−√(1−9/25)=−4/5。"}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "cos(α+β) 展开为：", "options": ["cosαcosβ+sinαsinβ", "cosαcosβ−sinαsinβ", "sinαcosβ+cosαsinβ", "sinαcosβ−cosαsinβ"], "answer": 1, "explain": "余弦和角公式为 cosαcosβ−sinαsinβ。"}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "sin2α 等于：", "options": ["2sinα", "2sinαcosα", "sin²α−cos²α", "1−2sin²α"], "answer": 1, "explain": "二倍角正弦公式为 2sinαcosα。"}, {"id": "q07", "chapterId": "ch04", "type": "single", "question": "y=2sin(3x) 的周期是：", "options": ["2π", "2π/3", "3π", "π/3"], "answer": 1, "explain": "T=2π/|ω|=2π/3。"}, {"id": "q08", "chapterId": "ch04", "type": "single", "question": "方程 cosx=0 的通解是：", "options": ["x=kπ", "x=π/2+kπ", "x=2kπ", "x=π/4+kπ"], "answer": 1, "explain": "余弦为零的角是 π/2 的奇数倍，即 x=π/2+kπ。"}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "sin(π/6) 的值是：", "options": ["1/2", "√3/2", "√2/2", "1"], "answer": 0, "explain": "π/6=30°，sin30°=1/2。"}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "y=sin(2x−π/3) 的周期是：", "options": ["π", "2π", "π/2", "4π"], "answer": 0, "explain": "T=2π/2=π。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：角、弧度与三角比」的一句话核心是什么？", "back": "角不再限于 0°~90°：它可以任意大、可以为负；三角比由单位圆上点的坐标定义。", "tags": ["trigonometry", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：同角关系与诱导公式」的一句话核心是什么？", "back": "同角关系管“同一个角的三种比”，诱导公式管“不同角的同名比”。", "tags": ["trigonometry", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：加法定理与倍角公式」的一句话核心是什么？", "back": "所有和角、倍角公式都由一条出发：cos(α−β)=cosαcosβ+sinαsinβ。", "tags": ["trigonometry", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：图象、性质与三角方程」的一句话核心是什么？", "back": "正弦、余弦的周期是 2π，正切是 π；图象的平移伸缩都写在 A、ω、φ 三个参数里。", "tags": ["trigonometry", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「弧度」？", "back": "弧长与半径之比定义的角的度量。", "tags": ["trigonometry", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「终边相同的角」？", "back": "相差 360° 整数倍的角。", "tags": ["trigonometry", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「正弦」？", "back": "单位圆上角的终边交点的纵坐标。", "tags": ["trigonometry", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「余弦」？", "back": "单位圆上角的终边交点的横坐标。", "tags": ["trigonometry", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「诱导公式」？", "back": "把任意角三角比化为锐角三角比的公式。", "tags": ["trigonometry", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「加法定理」？", "back": "展开 α±β 三角比的公式。", "tags": ["trigonometry", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「二倍角公式」？", "back": "sin2α、cos2α、tan2α 的公式。", "tags": ["trigonometry", "术语"]}, {"id": "f12", "chapterId": "ch04", "front": "什么是「周期」？", "back": "函数值重复出现的最小正间隔。", "tags": ["trigonometry", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「振幅」？", "back": "y=A sin(ωx+φ) 中的 |A|。", "tags": ["trigonometry", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「通解」？", "back": "含整数 k、表示全部解的表达式。", "tags": ["trigonometry", "术语"]}], "companion": "trigonometry学习伴侣.html", "deriv": "trigonometry从零推导.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：角、弧度与三角比<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：相似、坐标\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把任意角化到 0°~360°并判断象限\n<\/li><li>\n完成角度与弧度的互化\n<\/li><li>\n用单位圆写出三角比的定义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>角不再限于 0°~90°：它可以任意大、可以为负；三角比由单位圆上点的坐标定义。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 任意角<\/h3>\n<p>射线绕端点旋转形成角：逆时针为正，顺时针为负，转多圈就是大于 360° 的角。<\/p>\n<p>与角 α 终边相同的角可写成 α+k·360°（k 为整数）。判断象限时，先把角化到 0°~360°。<\/p>\n<h3>1.2 弧度制<\/h3>\n<p>弧长与半径之比定义为角的弧度数：θ=l/r。整圆周长 2πr，故 360°=2π 弧度，180°=π 弧度。<\/p>\n<p>互化：1°=π/180 弧度；1 弧度=(180/π)°≈57.3°。<\/p>\n<p>用弧度后，弧长 l=rθ、扇形面积 S=(1/2)r²θ 都不必再带度数符号。<\/p>\n<h3>1.3 单位圆定义<\/h3>\n<p>在单位圆上，角 θ 的终边与圆交于点 P(x,y)，则<\/p>\n<p>cosθ=x，sinθ=y，tanθ=y/x（x≠0）<\/p>\n<p>这个定义对任意角都成立，正负号由所在象限决定：一全正、二正弦正、三正切正、四余弦正。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：单位圆像一块钟面，角就是指针转过的角度，坐标就是指针末端的横纵位置。<\/p>\n<p><strong>失效边界<\/strong>：tan 在 x=0（即 90°、270° 等）处无定义，不能硬算。<\/p>\n<p><strong>实例<\/strong>：−30° 与 330° 终边相同，都在第四象限；sin(−30°)=−1/2，cos(−30°)=√3/2。 5π/6 弧度=150°，在第二象限，sin 为正、cos 为负。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 角只能在 0°到 360°之间 —— 实际上 角可以任意大，也可以为负；终边相同的角有无穷多个。\n<\/li><li>\n别以为 sin30° 与 sin(30 弧度) 一样 —— 实际上 一个是角度制，一个是弧度制，数值完全不同，必须标明单位。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n与 −30° 终边相同的角是：\n<\/li><li>\n150° 化为弧度是：\n<p>A. 30° ｜ B. 330° ｜ C. 300° ｜ D. 150° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：−30°+360°=330°。 A. 5π/6 ｜ B. 2π/3 ｜ C. 3π/4 ｜ D. 7π/6 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：150°=150×π/180=5π/6。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n逆时针为正，顺时针为负；终边相同角相差 360° 的整数倍\n<\/li><li>\n180°=π 弧度\n<\/li><li>\n单位圆：cos=x，sin=y，tan=y/x\n<\/ul>", "kind": "chapter", "title": "第 1 章：角、弧度与三角比"}, "ch02": {"html": "<h1>第 2 章：同角关系与诱导公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用平方关系与商关系化简\n<\/li><li>\n用诱导公式把任意角化到锐角\n<\/li><li>\n根据象限确定符号\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同角关系管“同一个角的三种比”，诱导公式管“不同角的同名比”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 同角关系<\/h3>\n<p>sin²θ+cos²θ=1；tanθ=sinθ/cosθ（cosθ≠0）；1+tan²θ=1/cos²θ。<\/p>\n<p>用法：已知一个比求另外两个，先定符号（看象限），再用平方关系。<\/p>\n<h3>2.2 诱导公式<\/h3>\n<p>把 k·90°±θ 或 180°±θ、360°−θ 的三角比化为 θ 的三角比：<\/p>\n<ul><li>\nsin(180°−θ)=sinθ，cos(180°−θ)=−cosθ；\n<\/li><li>\nsin(180°+θ)=−sinθ，cos(180°+θ)=−cosθ；\n<\/li><li>\nsin(−θ)=−sinθ，cos(−θ)=cosθ；\n<\/li><li>\nsin(90°−θ)=cosθ，cos(90°−θ)=sinθ。\n<\/ul>\n<p>口诀“奇变偶不变，符号看象限”：k 为奇数时函数名互换，为偶数时不变；符号按原角所在象限判断。<\/p>\n<h3>2.3 化简策略<\/h3>\n<p>先把所有角化到锐角，再统一函数名，最后用平方关系或商关系合并。步骤写全，符号不要跳。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：诱导公式像“角的搬运工”：把远处的角搬到第一象限再算，符号留在原地。<\/p>\n<p><strong>失效边界<\/strong>：口诀只适用于 90° 的整数倍加减；任意角要先化成这种形式。<\/p>\n<p><strong>实例<\/strong>：sin150°=sin(180°−30°)=sin30°=1/2；cos240°=cos(180°+60°)=−cos60°=−1/2。 已知 sinθ=3/5 且 θ 在第二象限，则 cosθ=−4/5，tanθ=−3/4。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 sin(180°−θ)=−sinθ —— 实际上 应为 sinθ；正弦在第二象限为正，符号判断要看象限。\n<\/li><li>\n别以为 同角关系中可以随意开方 —— 实际上 开方要带 ±，符号必须由象限确定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nsin210° 的值是：\n<\/li><li>\n已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：\n<p>A. 1/2 ｜ B. −1/2 ｜ C. √3/2 ｜ D. −√3/2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：sin210°=sin(180°+30°)=−sin30°=−1/2。 A. 4/5 ｜ B. −4/5 ｜ C. 3/5 ｜ D. −3/5 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：第三象限正弦为负，sinθ=−√(1−9/25)=−4/5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsin²+cos²=1；tan=sin/cos\n<\/li><li>\n诱导公式：奇变偶不变，符号看象限\n<\/li><li>\n开方取符号要看象限\n<\/ul>", "kind": "chapter", "title": "第 2 章：同角关系与诱导公式"}, "ch03": {"html": "<h1>第 3 章：加法定理与倍角公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n默写和角、差角公式\n<\/li><li>\n推导二倍角公式\n<\/li><li>\n用公式化简求值\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>所有和角、倍角公式都由一条出发：cos(α−β)=cosαcosβ+sinαsinβ。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 和角与差角<\/h3>\n<p>cos(α±β)=cosαcosβ∓sinαsinβ sin(α±β)=sinαcosβ±cosαsinβ tan(α±β)=(tanα±tanβ)/(1∓tanαtanβ)<\/p>\n<p>推导思路：在单位圆上取两点，用两点距离公式与余弦定理，令两点夹角为 α−β，展开即得 cos(α−β)。其余公式由它推出。<\/p>\n<h3>3.2 二倍角<\/h3>\n<p>令 β=α：<\/p>\n<p>sin2α=2sinαcosα cos2α=cos²α−sin²α=2cos²α−1=1−2sin²α tan2α=2tanα/(1−tan²α)<\/p>\n<p>cos2α 的三个形式各有用途：求值时选能约掉的，降幂时用 2cos²α−1 或 1−2sin²α。<\/p>\n<h3>3.3 半角与降幂<\/h3>\n<p>由 cos2α=1−2sin²α 得 sin²α=(1−cos2α)/2；由 cos2α=2cos²α−1 得 cos²α=(1+cos2α)/2。<\/p>\n<p>这两条是“降幂公式”，把平方降成一次，是化简与积分的基础。<\/p>\n<h3>3.4 辅助角公式<\/h3>\n<p>a sinx+b cosx=√(a²+b²) sin(x+φ)，其中 tanφ=b/a。它把两项合成一项，便于求最值与周期。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：加法定理像“两个旋转叠加”：先转 α 再转 β，等于一次转 α+β，但要用坐标的混合表示。<\/p>\n<p><strong>失效边界<\/strong>：tan 的公式要求分母不为零，α±β 不能等于 90° 的奇数倍。<\/p>\n<p><strong>实例<\/strong>：sin75°=sin(45°+30°)=sin45°cos30°+cos45°sin30°=(√6+√2)/4≈0.966。 cos60°=cos(2×30°)=1−2sin²30°=1−1/2=1/2，验证正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 sin(α+β)=sinα+sinβ —— 实际上 不成立。取 α=β=30°：左边 sin60°≈0.866，右边 1。\n<\/li><li>\n别以为 cos2α 只有一个形式 —— 实际上 有三个等价形式，按题目需要选用，选错会增加计算量。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ncos(α+β) 展开为：\n<\/li><li>\nsin2α 等于：\n<p>A. cosαcosβ+sinαsinβ ｜ B. cosαcosβ−sinαsinβ ｜ C. sinαcosβ+cosαsinβ ｜ D. sinαcosβ−cosαsinβ <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：余弦和角公式为 cosαcosβ−sinαsinβ。 A. 2sinα ｜ B. 2sinαcosα ｜ C. sin²α−cos²α ｜ D. 1−2sin²α <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：二倍角正弦公式为 2sinαcosα。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ncos(α±β)=cosαcosβ∓sinαsinβ\n<\/li><li>\nsin2α=2sinαcosα；cos2α 有三种形式\n<\/li><li>\n降幂：sin²=(1−cos2α)/2\n<\/ul>", "kind": "chapter", "title": "第 3 章：加法定理与倍角公式"}, "ch04": {"html": "<h1>第 4 章：图象、性质与三角方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n画出三种三角函数的图象并说出周期、对称性\n<\/li><li>\n分析 y=A sin(ωx+φ) 的振幅、周期、相位\n<\/li><li>\n写出简单三角方程的通解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>正弦、余弦的周期是 2π，正切是 π；图象的平移伸缩都写在 A、ω、φ 三个参数里。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 三种基本图象<\/h3>\n<ul><li>\ny=sin x：定义域 R，值域 [−1,1]，周期 2π，奇函数，对称中心 (kπ,0)，对称轴 x=π/2+kπ；\n<\/li><li>\ny=cos x：值域 [−1,1]，周期 2π，偶函数，对称轴 x=kπ；\n<\/li><li>\ny=tan x：定义域 x≠π/2+kπ，值域 R，周期 π，奇函数，无对称轴。\n<\/ul>\n<h3>4.2 一般形式 y=A sin(ωx+φ)+k<\/h3>\n<ul><li>\nA 是振幅（图象高度），|A| 越大越“高”；\n<\/li><li>\nω 决定周期 T=2π/|ω|；\n<\/li><li>\nφ 是初相，决定左右平移：左移 φ/ω（φ&gt;0 时）；\n<\/li><li>\nk 是上下平移。\n<\/ul>\n<p>五点法画图：取 ωx+φ=0、π/2、π、3π/2、2π 五个点，描出后再连线。<\/p>\n<h3>4.3 三角方程<\/h3>\n<p>sinx=a（|a|≤1）的通解：x=kπ+(−1)^k arcsin a；也可写成 x=arcsin a+2kπ 或 x=π−arcsin a+2kπ。<\/p>\n<p>cosx=a 的通解：x=±arccos a+2kπ。<\/p>\n<p>tanx=a 的通解：x=arctan a+kπ。<\/p>\n<p>求通解后，若题目限定区间，再把 k 取遍并筛出落在区间内的解。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：正弦曲线像水波，振幅是波高，周期是两波峰的距离，相位是波从哪里开始。<\/p>\n<p><strong>失效边界<\/strong>：ω 必须取正再谈周期；ω 为负时先提出负号，否则平移方向会反。<\/p>\n<p><strong>实例<\/strong>：y=3sin(2x+π/3)：振幅 3，周期 2π/2=π，初相 π/3，图象左移 π/6。 解 sinx=1/2：x=π/6+2kπ 或 x=5π/6+2kπ。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 周期只与 A 有关 —— 实际上 周期由 ω 决定，T=2π/|ω|；A 只改变高度。\n<\/li><li>\n别以为 三角方程只有一个解 —— 实际上 在实数范围内有无穷多解，必须写通解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny=2sin(3x) 的周期是：\n<\/li><li>\n方程 cosx=0 的通解是：\n<p>A. 2π ｜ B. 2π/3 ｜ C. 3π ｜ D. π/3 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：T=2π/|ω|=2π/3。 A. x=kπ ｜ B. x=π/2+kπ ｜ C. x=2kπ ｜ D. x=π/4+kπ <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：余弦为零的角是 π/2 的奇数倍，即 x=π/2+kπ。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsin、cos 周期 2π，tan 周期 π\n<\/li><li>\ny=A sin(ωx+φ)：A 振幅、ω 定周期、φ 定平移\n<\/li><li>\n三角方程写通解，再按区间筛选\n<\/ul>", "kind": "chapter", "title": "第 4 章：图象、性质与三角方程"}, "c01": {"html": "<h1>单位圆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>三角函数的一切定义、符号、公式，都能在单位圆上找到出处。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是把“几何的角”变成“可运算的数”的那座桥。<\/p>\n<h2>详解<\/h2>\n<p>角 θ 的终边与单位圆交于 P(x,y)，则 cosθ=x、sinθ=y、tanθ=y/x。平方关系来自 x²+y²=1；诱导公式来自四个象限的对称；和角公式来自圆上两点的距离。<\/p>\n<h2>常见误解<\/h2>\n<p>只背公式不看圆，符号一错就全错。<\/p>\n<h2>相关概念<\/h2>\n<p>三角比（ch01）、诱导公式（ch02）<\/p>", "kind": "concept", "title": "单位圆"}, "c02": {"html": "<h1>周期与相位<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>ω 决定多久重复一次，φ 决定从哪里开始，A 决定多高。<\/p>\n<h2>为什么重要<\/h2>\n<p>一切往复现象（振动、交流电、声波）都用这三个参数描述。<\/p>\n<h2>详解<\/h2>\n<p>y=A sin(ωx+φ)+k：周期 T=2π/|ω|，振幅 |A|，初相 φ，平衡位置 k。平移量是 φ/ω，不是 φ，这是最容易错的一步。<\/p>\n<h2>常见误解<\/h2>\n<p>把 φ 直接当成平移量，忽略 ω 的缩放作用。<\/p>\n<h2>相关概念<\/h2>\n<p>图象（ch04）、加法定理（ch03）<\/p>", "kind": "concept", "title": "周期与相位"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：角、弧度与三角比<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：角、弧度与三角比<\/a><br>检查点：能把任意角化到 0°~360°并说出象限<\/li><li class='path-step' id='path-02'><strong>步骤 02：同角关系与诱导公式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：同角关系与诱导公式<\/a><br>检查点：能把任意角的三角比化成锐角<\/li><li class='path-step' id='path-03'><strong>步骤 03：加法定理与倍角<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：加法定理与倍角公式<\/a><br>检查点：能默写和角、差角与二倍角公式<\/li><li class='path-step' id='path-04'><strong>步骤 04：图象、性质与三角方程<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：图象、性质与三角方程<\/a><br>检查点：能说出周期、对称轴并写通解<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q9.<\/b> sin(π/6) 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> √2/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q10.<\/b> y=sin(2x−π/3) 的周期是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> π<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 2π<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> π/2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 4π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：角、弧度与三角比<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 与 −30° 终边相同的角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 30°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 330°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 300°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 150°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 150° 化为弧度是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 5π/6<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 2π/3<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 3π/4<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 7π/6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：同角关系与诱导公式<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> sin210° 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> −1/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> −√3/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 4/5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> −4/5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 3/5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> −3/5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：加法定理与倍角公式<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> cos(α+β) 展开为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> cosαcosβ+sinαsinβ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> cosαcosβ−sinαsinβ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> sinαcosβ+cosαsinβ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> sinαcosβ−cosαsinβ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> sin2α 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 2sinα<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 2sinαcosα<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> sin²α−cos²α<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 1−2sin²α<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：图象、性质与三角方程<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y=2sin(3x) 的周期是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 2π<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 2π/3<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 3π<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> π/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 方程 cosx=0 的通解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> x=kπ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> x=π/2+kπ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> x=2kπ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> x=π/4+kπ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='弧度'>弧度 — 弧长与半径之比定义的角的度量。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='终边相同的角'>终边相同的角 — 相差 360° 整数倍的角。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='正弦'>正弦 — 单位圆上角的终边交点的纵坐标。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='余弦'>余弦 — 单位圆上角的终边交点的横坐标。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='诱导公式'>诱导公式 — 把任意角三角比化为锐角三角比的公式。 <span class=glossary-ref>（第 2 章：同角关系与诱导公式）<\/span><\/li><li data-term='加法定理'>加法定理 — 展开 α±β 三角比的公式。 <span class=glossary-ref>（第 3 章：加法定理与倍角公式）<\/span><\/li><li data-term='二倍角公式'>二倍角公式 — sin2α、cos2α、tan2α 的公式。 <span class=glossary-ref>（第 3 章：加法定理与倍角公式）<\/span><\/li><li data-term='周期'>周期 — 函数值重复出现的最小正间隔。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><li data-term='振幅'>振幅 — y=A sin(ωx+φ) 中的 |A|。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><li data-term='通解'>通解 — 含整数 k、表示全部解的表达式。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：化简三步<\/h2>\n<p>① 用诱导公式把角化到锐角；② 统一函数名；③ 用平方关系或和角公式合并。<\/p>\n<h2>框架：图象五问<\/h2>\n<p>① 定义域；② 值域与振幅；③ 周期；④ 对称轴与对称中心；⑤ 单调区间。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>互化<\/td><td>180°=π 弧度<\/td><\/tr><tr><td>平方关系<\/td><td>sin²+cos²=1<\/td><\/tr><tr><td>和角<\/td><td>sin(α±β)=sinαcosβ±cosαsinβ；cos(α±β)=cosαcosβ∓sinαsinβ<\/td><\/tr><tr><td>二倍角<\/td><td>sin2α=2sinαcosα；cos2α=2cos²α−1<\/td><\/tr><tr><td>周期<\/td><td>T=2π/<\/td><td>ω<\/td><td>（tan 为 π/<\/td><td>ω<\/td><td>）<\/td><\/tr><tr><td>通解<\/td><td>sinx=a：x=kπ+(−1)^k arcsin a<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/17-三角函数", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：角、弧度与三角比", "href": "#/chapter/ch01"}, {"label": "第 2 章：同角关系与诱导公式", "href": "#/chapter/ch02"}, {"label": "第 3 章：加法定理与倍角公式", "href": "#/chapter/ch03"}, {"label": "第 4 章：图象、性质与三角方程", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "单位圆", "href": "#/concept/c01"}, {"label": "周期与相位", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：角、弧度与三角比", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：同角关系与诱导公式", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：加法定理与倍角公式", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：图象、性质与三角方程", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：角、弧度与三角比<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：相似、坐标\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把任意角化到 0°~360°并判断象限\n<\/li><li>\n完成角度与弧度的互化\n<\/li><li>\n用单位圆写出三角比的定义\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>角不再限于 0°~90°：它可以任意大、可以为负；三角比由单位圆上点的坐标定义。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 任意角<\/h3>\n<p>射线绕端点旋转形成角：逆时针为正，顺时针为负，转多圈就是大于 360° 的角。<\/p>\n<p>与角 α 终边相同的角可写成 α+k·360°（k 为整数）。判断象限时，先把角化到 0°~360°。<\/p>\n<h3>1.2 弧度制<\/h3>\n<p>弧长与半径之比定义为角的弧度数：θ=l/r。整圆周长 2πr，故 360°=2π 弧度，180°=π 弧度。<\/p>\n<p>互化：1°=π/180 弧度；1 弧度=(180/π)°≈57.3°。<\/p>\n<p>用弧度后，弧长 l=rθ、扇形面积 S=(1/2)r²θ 都不必再带度数符号。<\/p>\n<h3>1.3 单位圆定义<\/h3>\n<p>在单位圆上，角 θ 的终边与圆交于点 P(x,y)，则<\/p>\n<p>cosθ=x，sinθ=y，tanθ=y/x（x≠0）<\/p>\n<p>这个定义对任意角都成立，正负号由所在象限决定：一全正、二正弦正、三正切正、四余弦正。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：单位圆像一块钟面，角就是指针转过的角度，坐标就是指针末端的横纵位置。<\/p>\n<p><strong>失效边界<\/strong>：tan 在 x=0（即 90°、270° 等）处无定义，不能硬算。<\/p>\n<p><strong>实例<\/strong>：−30° 与 330° 终边相同，都在第四象限；sin(−30°)=−1/2，cos(−30°)=√3/2。 5π/6 弧度=150°，在第二象限，sin 为正、cos 为负。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 角只能在 0°到 360°之间 —— 实际上 角可以任意大，也可以为负；终边相同的角有无穷多个。\n<\/li><li>\n别以为 sin30° 与 sin(30 弧度) 一样 —— 实际上 一个是角度制，一个是弧度制，数值完全不同，必须标明单位。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n与 −30° 终边相同的角是：\n<\/li><li>\n150° 化为弧度是：\n<p>A. 30° ｜ B. 330° ｜ C. 300° ｜ D. 150° <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：−30°+360°=330°。 A. 5π/6 ｜ B. 2π/3 ｜ C. 3π/4 ｜ D. 7π/6 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：150°=150×π/180=5π/6。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n逆时针为正，顺时针为负；终边相同角相差 360° 的整数倍\n<\/li><li>\n180°=π 弧度\n<\/li><li>\n单位圆：cos=x，sin=y，tan=y/x\n<\/ul>", "ch02": "<h1>第 2 章：同角关系与诱导公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用平方关系与商关系化简\n<\/li><li>\n用诱导公式把任意角化到锐角\n<\/li><li>\n根据象限确定符号\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同角关系管“同一个角的三种比”，诱导公式管“不同角的同名比”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 同角关系<\/h3>\n<p>sin²θ+cos²θ=1；tanθ=sinθ/cosθ（cosθ≠0）；1+tan²θ=1/cos²θ。<\/p>\n<p>用法：已知一个比求另外两个，先定符号（看象限），再用平方关系。<\/p>\n<h3>2.2 诱导公式<\/h3>\n<p>把 k·90°±θ 或 180°±θ、360°−θ 的三角比化为 θ 的三角比：<\/p>\n<ul><li>\nsin(180°−θ)=sinθ，cos(180°−θ)=−cosθ；\n<\/li><li>\nsin(180°+θ)=−sinθ，cos(180°+θ)=−cosθ；\n<\/li><li>\nsin(−θ)=−sinθ，cos(−θ)=cosθ；\n<\/li><li>\nsin(90°−θ)=cosθ，cos(90°−θ)=sinθ。\n<\/ul>\n<p>口诀“奇变偶不变，符号看象限”：k 为奇数时函数名互换，为偶数时不变；符号按原角所在象限判断。<\/p>\n<h3>2.3 化简策略<\/h3>\n<p>先把所有角化到锐角，再统一函数名，最后用平方关系或商关系合并。步骤写全，符号不要跳。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：诱导公式像“角的搬运工”：把远处的角搬到第一象限再算，符号留在原地。<\/p>\n<p><strong>失效边界<\/strong>：口诀只适用于 90° 的整数倍加减；任意角要先化成这种形式。<\/p>\n<p><strong>实例<\/strong>：sin150°=sin(180°−30°)=sin30°=1/2；cos240°=cos(180°+60°)=−cos60°=−1/2。 已知 sinθ=3/5 且 θ 在第二象限，则 cosθ=−4/5，tanθ=−3/4。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 sin(180°−θ)=−sinθ —— 实际上 应为 sinθ；正弦在第二象限为正，符号判断要看象限。\n<\/li><li>\n别以为 同角关系中可以随意开方 —— 实际上 开方要带 ±，符号必须由象限确定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nsin210° 的值是：\n<\/li><li>\n已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：\n<p>A. 1/2 ｜ B. −1/2 ｜ C. √3/2 ｜ D. −√3/2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：sin210°=sin(180°+30°)=−sin30°=−1/2。 A. 4/5 ｜ B. −4/5 ｜ C. 3/5 ｜ D. −3/5 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：第三象限正弦为负，sinθ=−√(1−9/25)=−4/5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsin²+cos²=1；tan=sin/cos\n<\/li><li>\n诱导公式：奇变偶不变，符号看象限\n<\/li><li>\n开方取符号要看象限\n<\/ul>", "ch03": "<h1>第 3 章：加法定理与倍角公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n默写和角、差角公式\n<\/li><li>\n推导二倍角公式\n<\/li><li>\n用公式化简求值\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>所有和角、倍角公式都由一条出发：cos(α−β)=cosαcosβ+sinαsinβ。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 和角与差角<\/h3>\n<p>cos(α±β)=cosαcosβ∓sinαsinβ sin(α±β)=sinαcosβ±cosαsinβ tan(α±β)=(tanα±tanβ)/(1∓tanαtanβ)<\/p>\n<p>推导思路：在单位圆上取两点，用两点距离公式与余弦定理，令两点夹角为 α−β，展开即得 cos(α−β)。其余公式由它推出。<\/p>\n<h3>3.2 二倍角<\/h3>\n<p>令 β=α：<\/p>\n<p>sin2α=2sinαcosα cos2α=cos²α−sin²α=2cos²α−1=1−2sin²α tan2α=2tanα/(1−tan²α)<\/p>\n<p>cos2α 的三个形式各有用途：求值时选能约掉的，降幂时用 2cos²α−1 或 1−2sin²α。<\/p>\n<h3>3.3 半角与降幂<\/h3>\n<p>由 cos2α=1−2sin²α 得 sin²α=(1−cos2α)/2；由 cos2α=2cos²α−1 得 cos²α=(1+cos2α)/2。<\/p>\n<p>这两条是“降幂公式”，把平方降成一次，是化简与积分的基础。<\/p>\n<h3>3.4 辅助角公式<\/h3>\n<p>a sinx+b cosx=√(a²+b²) sin(x+φ)，其中 tanφ=b/a。它把两项合成一项，便于求最值与周期。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：加法定理像“两个旋转叠加”：先转 α 再转 β，等于一次转 α+β，但要用坐标的混合表示。<\/p>\n<p><strong>失效边界<\/strong>：tan 的公式要求分母不为零，α±β 不能等于 90° 的奇数倍。<\/p>\n<p><strong>实例<\/strong>：sin75°=sin(45°+30°)=sin45°cos30°+cos45°sin30°=(√6+√2)/4≈0.966。 cos60°=cos(2×30°)=1−2sin²30°=1−1/2=1/2，验证正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 sin(α+β)=sinα+sinβ —— 实际上 不成立。取 α=β=30°：左边 sin60°≈0.866，右边 1。\n<\/li><li>\n别以为 cos2α 只有一个形式 —— 实际上 有三个等价形式，按题目需要选用，选错会增加计算量。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ncos(α+β) 展开为：\n<\/li><li>\nsin2α 等于：\n<p>A. cosαcosβ+sinαsinβ ｜ B. cosαcosβ−sinαsinβ ｜ C. sinαcosβ+cosαsinβ ｜ D. sinαcosβ−cosαsinβ <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：余弦和角公式为 cosαcosβ−sinαsinβ。 A. 2sinα ｜ B. 2sinαcosα ｜ C. sin²α−cos²α ｜ D. 1−2sin²α <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：二倍角正弦公式为 2sinαcosα。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ncos(α±β)=cosαcosβ∓sinαsinβ\n<\/li><li>\nsin2α=2sinαcosα；cos2α 有三种形式\n<\/li><li>\n降幂：sin²=(1−cos2α)/2\n<\/ul>", "ch04": "<h1>第 4 章：图象、性质与三角方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n画出三种三角函数的图象并说出周期、对称性\n<\/li><li>\n分析 y=A sin(ωx+φ) 的振幅、周期、相位\n<\/li><li>\n写出简单三角方程的通解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>正弦、余弦的周期是 2π，正切是 π；图象的平移伸缩都写在 A、ω、φ 三个参数里。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 三种基本图象<\/h3>\n<ul><li>\ny=sin x：定义域 R，值域 [−1,1]，周期 2π，奇函数，对称中心 (kπ,0)，对称轴 x=π/2+kπ；\n<\/li><li>\ny=cos x：值域 [−1,1]，周期 2π，偶函数，对称轴 x=kπ；\n<\/li><li>\ny=tan x：定义域 x≠π/2+kπ，值域 R，周期 π，奇函数，无对称轴。\n<\/ul>\n<h3>4.2 一般形式 y=A sin(ωx+φ)+k<\/h3>\n<ul><li>\nA 是振幅（图象高度），|A| 越大越“高”；\n<\/li><li>\nω 决定周期 T=2π/|ω|；\n<\/li><li>\nφ 是初相，决定左右平移：左移 φ/ω（φ&gt;0 时）；\n<\/li><li>\nk 是上下平移。\n<\/ul>\n<p>五点法画图：取 ωx+φ=0、π/2、π、3π/2、2π 五个点，描出后再连线。<\/p>\n<h3>4.3 三角方程<\/h3>\n<p>sinx=a（|a|≤1）的通解：x=kπ+(−1)^k arcsin a；也可写成 x=arcsin a+2kπ 或 x=π−arcsin a+2kπ。<\/p>\n<p>cosx=a 的通解：x=±arccos a+2kπ。<\/p>\n<p>tanx=a 的通解：x=arctan a+kπ。<\/p>\n<p>求通解后，若题目限定区间，再把 k 取遍并筛出落在区间内的解。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：正弦曲线像水波，振幅是波高，周期是两波峰的距离，相位是波从哪里开始。<\/p>\n<p><strong>失效边界<\/strong>：ω 必须取正再谈周期；ω 为负时先提出负号，否则平移方向会反。<\/p>\n<p><strong>实例<\/strong>：y=3sin(2x+π/3)：振幅 3，周期 2π/2=π，初相 π/3，图象左移 π/6。 解 sinx=1/2：x=π/6+2kπ 或 x=5π/6+2kπ。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 周期只与 A 有关 —— 实际上 周期由 ω 决定，T=2π/|ω|；A 只改变高度。\n<\/li><li>\n别以为 三角方程只有一个解 —— 实际上 在实数范围内有无穷多解，必须写通解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\ny=2sin(3x) 的周期是：\n<\/li><li>\n方程 cosx=0 的通解是：\n<p>A. 2π ｜ B. 2π/3 ｜ C. 3π ｜ D. π/3 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：T=2π/|ω|=2π/3。 A. x=kπ ｜ B. x=π/2+kπ ｜ C. x=2kπ ｜ D. x=π/4+kπ <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：余弦为零的角是 π/2 的奇数倍，即 x=π/2+kπ。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsin、cos 周期 2π，tan 周期 π\n<\/li><li>\ny=A sin(ωx+φ)：A 振幅、ω 定周期、φ 定平移\n<\/li><li>\n三角方程写通解，再按区间筛选\n<\/ul>", "c01": "<h1>单位圆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>三角函数的一切定义、符号、公式，都能在单位圆上找到出处。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是把“几何的角”变成“可运算的数”的那座桥。<\/p>\n<h2>详解<\/h2>\n<p>角 θ 的终边与单位圆交于 P(x,y)，则 cosθ=x、sinθ=y、tanθ=y/x。平方关系来自 x²+y²=1；诱导公式来自四个象限的对称；和角公式来自圆上两点的距离。<\/p>\n<h2>常见误解<\/h2>\n<p>只背公式不看圆，符号一错就全错。<\/p>\n<h2>相关概念<\/h2>\n<p>三角比（ch01）、诱导公式（ch02）<\/p>", "c02": "<h1>周期与相位<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>ω 决定多久重复一次，φ 决定从哪里开始，A 决定多高。<\/p>\n<h2>为什么重要<\/h2>\n<p>一切往复现象（振动、交流电、声波）都用这三个参数描述。<\/p>\n<h2>详解<\/h2>\n<p>y=A sin(ωx+φ)+k：周期 T=2π/|ω|，振幅 |A|，初相 φ，平衡位置 k。平移量是 φ/ω，不是 φ，这是最容易错的一步。<\/p>\n<h2>常见误解<\/h2>\n<p>把 φ 直接当成平移量，忽略 ω 的缩放作用。<\/p>\n<h2>相关概念<\/h2>\n<p>图象（ch04）、加法定理（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：角、弧度与三角比<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：角、弧度与三角比<\/a><br>检查点：能把任意角化到 0°~360°并说出象限<\/li><li class='path-step' id='path-02'><strong>步骤 02：同角关系与诱导公式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：同角关系与诱导公式<\/a><br>检查点：能把任意角的三角比化成锐角<\/li><li class='path-step' id='path-03'><strong>步骤 03：加法定理与倍角<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：加法定理与倍角公式<\/a><br>检查点：能默写和角、差角与二倍角公式<\/li><li class='path-step' id='path-04'><strong>步骤 04：图象、性质与三角方程<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：图象、性质与三角方程<\/a><br>检查点：能说出周期、对称轴并写通解<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q9.<\/b> sin(π/6) 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> √2/2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q10.<\/b> y=sin(2x−π/3) 的周期是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> π<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 2π<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> π/2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 4π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：角、弧度与三角比<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 与 −30° 终边相同的角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 30°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 330°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 300°<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 150°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 150° 化为弧度是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 5π/6<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 2π/3<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 3π/4<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 7π/6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：同角关系与诱导公式<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> sin210° 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> −1/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> −√3/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 已知 cosθ=−3/5 且 θ 在第三象限，则 sinθ 为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 4/5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> −4/5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 3/5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> −3/5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：加法定理与倍角公式<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> cos(α+β) 展开为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> cosαcosβ+sinαsinβ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> cosαcosβ−sinαsinβ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> sinαcosβ+cosαsinβ<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> sinαcosβ−cosαsinβ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> sin2α 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 2sinα<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 2sinαcosα<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> sin²α−cos²α<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 1−2sin²α<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：图象、性质与三角方程<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y=2sin(3x) 的周期是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 2π<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 2π/3<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 3π<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> π/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 方程 cosx=0 的通解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> x=kπ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> x=π/2+kπ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> x=2kπ<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> x=π/4+kπ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='弧度'>弧度 — 弧长与半径之比定义的角的度量。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='终边相同的角'>终边相同的角 — 相差 360° 整数倍的角。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='正弦'>正弦 — 单位圆上角的终边交点的纵坐标。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='余弦'>余弦 — 单位圆上角的终边交点的横坐标。 <span class=glossary-ref>（第 1 章：角、弧度与三角比）<\/span><\/li><li data-term='诱导公式'>诱导公式 — 把任意角三角比化为锐角三角比的公式。 <span class=glossary-ref>（第 2 章：同角关系与诱导公式）<\/span><\/li><li data-term='加法定理'>加法定理 — 展开 α±β 三角比的公式。 <span class=glossary-ref>（第 3 章：加法定理与倍角公式）<\/span><\/li><li data-term='二倍角公式'>二倍角公式 — sin2α、cos2α、tan2α 的公式。 <span class=glossary-ref>（第 3 章：加法定理与倍角公式）<\/span><\/li><li data-term='周期'>周期 — 函数值重复出现的最小正间隔。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><li data-term='振幅'>振幅 — y=A sin(ωx+φ) 中的 |A|。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><li data-term='通解'>通解 — 含整数 k、表示全部解的表达式。 <span class=glossary-ref>（第 4 章：图象、性质与三角方程）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：化简三步<\/h2>\n<p>① 用诱导公式把角化到锐角；② 统一函数名；③ 用平方关系或和角公式合并。<\/p>\n<h2>框架：图象五问<\/h2>\n<p>① 定义域；② 值域与振幅；③ 周期；④ 对称轴与对称中心；⑤ 单调区间。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>互化<\/td><td>180°=π 弧度<\/td><\/tr><tr><td>平方关系<\/td><td>sin²+cos²=1<\/td><\/tr><tr><td>和角<\/td><td>sin(α±β)=sinαcosβ±cosαsinβ；cos(α±β)=cosαcosβ∓sinαsinβ<\/td><\/tr><tr><td>二倍角<\/td><td>sin2α=2sinαcosα；cos2α=2cos²α−1<\/td><\/tr><tr><td>周期<\/td><td>T=2π/<\/td><td>ω<\/td><td>（tan 为 π/<\/td><td>ω<\/td><td>）<\/td><\/tr><tr><td>通解<\/td><td>sinx=a：x=kπ+(−1)^k arcsin a<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
