<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>解三角形</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>

inB=b sinA/a=3×0.5/2=0.75<1，B 有锐角与钝角两个候选，需检验，可能两解。"}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "已知 b=3、c=4、A=90°，则 a 等于：", "options": ["5", "7", "25", "√7"], "answer": 0, "explain": "cosA=0，a²=9+16=25，a=5。"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "三角形三边为 2、3、4，最大角是：", "options": ["锐角", "直角", "钝角", "无法判断"], "answer": 2, "explain": "4²=16>2²+3²=13，故最大角为钝角。"}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "两边为 4 和 6、夹角 30°，面积是：", "options": ["12", "6", "24", "3"], "answer": 1, "explain": "S=(1/2)×4×6×0.5=6。"}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "三边为 6、8、10 的三角形面积是：", "options": ["24", "48", "30", "20"], "answer": 0, "explain": "p=12，S=√(12×6×4×2)=√576=24。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "在 △ABC 中，a=8、b=6、A=60°，则 sinB 等于：", "options": ["3√3/8", "3/4", "√3/2", "1/2"], "answer": 0, "explain": "由 a/sinA=b/sinB 得 sinB=b sinA/a=6×(√3/2)/8=3√3/8。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "三边为 5、12、13 的三角形，其最大角是：", "options": ["锐角", "直角", "钝角", "60°"], "answer": 1, "explain": "13²=169=5²+12²，故为直角三角形，最大角 90°。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：正弦定理」的一句话核心是什么？", "back": "同一个三角形中，边与它所对角的正弦之比相等，且等于外接圆直径。", "tags": ["solving-triangles", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：余弦定理与形状判断」的一句话核心是什么？", "back": "余弦定理是勾股定理的推广：a²=b²+c²−2bc cosA，多出的那一项修正了“非直角”。", "tags": ["solving-triangles", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：面积公式与应用」的一句话核心是什么？", "back": "面积有两种算法：给角用 (1/2)ab sinC，给三边用海伦公式。", "tags": ["solving-triangles", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「正弦定理」？", "back": "a/sinA=b/sinB=c/sinC=2R。", "tags": ["solving-triangles", "术语"]}, {"id": "f05", "chapterId": "ch02", "front": "什么是「余弦定理」？", "back": "a²=b²+c²−2bc cosA。", "tags": ["solving-triangles", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「外接圆半径」？", "back": "三角形外接圆的半径 R。", "tags": ["solving-triangles", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「边边角」？", "back": "已知两边及其中一边的对角，可能多解。", "tags": ["solving-triangles", "术语"]}, {"id": "f08", "chapterId": "ch03", "front": "什么是「海伦公式」？", "back": "由三边求面积的公式。", "tags": ["solving-triangles", "术语"]}, {"id": "f09", "chapterId": "ch03", "front": "什么是「方位角」？", "back": "从正北方向顺时针量到目标方向的角度。", "tags": ["solving-triangles", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「仰角」？", "back": "视线在水平线之上的夹角。", "tags": ["solving-triangles", "术语"]}], "companion": "solving-triangles学习伴侣.html", "deriv": "solving-triangles从零推导.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：正弦定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：三角比、圆\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n推导并默写正弦定理\n<\/li><li>\n用正弦定理解两类三角形\n<\/li><li>\n判断已知两边及一边对角时的解的个数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同一个三角形中，边与它所对角的正弦之比相等，且等于外接圆直径。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 定理与推导<\/h3>\n<p>在 △ABC 中：<\/p>\n<p>a/sinA = b/sinB = c/sinC = 2R<\/p>\n<p>（R 为外接圆半径）<\/p>\n<p>推导：作外接圆，把一边看成弦，由圆周角定理得 a=2R sinA；对另外两边同理。<\/p>\n<h3>1.2 两类基本用法<\/h3>\n<ul><li>\n已知两角与一边：先求第三角（180°减），再用定理求另两边；\n<\/li><li>\n已知两边与其中一边的对角：先求另一边的对角，再求第三角与第三边。\n<\/ul>\n<h3>1.3 多解讨论<\/h3>\n<p>已知 a、b 与 A（边边角）时，由 sinB=b sinA/a 求 B，可能出现：<\/p>\n<ul><li>\nsinB&gt;1：无解；\n<\/li><li>\nsinB=1：一解（B=90°）；\n<\/li><li>\nsinB&lt;1：B 有锐角与钝角两个候选，需检查 A+B&lt;180° 是否成立，可能一解也可能两解。\n<\/ul>\n<p>这是解三角形最容易丢分的地方，必须画图核对。<\/p>\n<h3>1.4 边角互化<\/h3>\n<p>定理把“边的比”换成“正弦的比”，遇到含边与角的混合等式，优先统一成角或统一成边。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：正弦定理像“大角对大边”的定量版本：边越长，对着的角越大，比例恒定。<\/p>\n<p><strong>失效边界<\/strong>：定理对任意三角形都成立，但求角时要防增解；正弦值相同对应两个角。<\/p>\n<p><strong>实例<\/strong>：A=30°，B=45°，a=2。C=105°，由 a/sinA=b/sinB 得 b=2 sin45°/sin30°=2×0.7071/0.5≈2.83。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 正弦定理只适用于直角三角形 —— 实际上 对任意三角形都成立，直角三角形只是特例。\n<\/li><li>\n别以为 由 sinB 求出 B 就唯一 —— 实际上 正弦值对应两个角（锐角与钝角），必须检验和角条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n正弦定理中，a/sinA 等于：\n<\/li><li>\n已知 a=2、b=3、A=30°，则 B：\n<p>A. 内切圆半径 ｜ B. 外接圆半径 ｜ C. 外接圆直径 ｜ D. 三角形周长 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：a/sinA=2R，即外接圆直径。 A. 只有一解 ｜ B. 可能有两解 ｜ C. 一定无解 ｜ D. 一定为直角 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：sinB=b sinA/a=3×0.5/2=0.75&lt;1，B 有锐角与钝角两个候选，需检验，可能两解。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na/sinA=b/sinB=c/sinC=2R\n<\/li><li>\n已知两角一边可直接解\n<\/li><li>\n边边角要讨论解的个数\n<\/ul>", "kind": "chapter", "title": "第 1 章：正弦定理"}, "ch02": {"html": "<h1>第 2 章：余弦定理与形状判断<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n推导并默写余弦定理\n<\/li><li>\n由三边求角、由两边夹角求第三边\n<\/li><li>\n用余弦值判断三角形是锐角、直角还是钝角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>余弦定理是勾股定理的推广：a²=b²+c²−2bc cosA，多出的那一项修正了“非直角”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 定理与推导<\/h3>\n<p>a²=b²+c²−2bc cosA b²=a²+c²−2ac cosB c²=a²+b²−2ab cosC<\/p>\n<p>推导：以 A 为原点、AB 为 x 轴建系，B(c,0)，C(b cosA, b sinA)，用两点距离公式展开即得。<\/p>\n<p>当 A=90° 时 cosA=0，公式退化为勾股定理 a²=b²+c²。<\/p>\n<h3>2.2 两类用法<\/h3>\n<ul><li>\n已知两边及夹角：直接求第三边；\n<\/li><li>\n已知三边：用变形公式求角，cosA=(b²+c²−a²)/(2bc)。\n<\/ul>\n<h3>2.3 形状判断<\/h3>\n<p>由 cosA 的符号判断 A 的类型：<\/p>\n<ul><li>\ncosA&gt;0（a²&lt;b²+c²）：A 为锐角；\n<\/li><li>\ncosA=0（a²=b²+c²）：A 为直角；\n<\/li><li>\ncosA&lt;0（a²&gt;b²+c²）：A 为钝角。\n<\/ul>\n<p>判断整个三角形的形状，要看最大边所对的角——只需检查最大角。<\/p>\n<h3>2.4 与正弦定理的分工<\/h3>\n<p>已知“边边角”用正弦定理（注意多解）；已知“边角边”或“边边边”用余弦定理（无多解问题）。这是选择定理的第一判据。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：余弦定理像给勾股定理加了一个“斜度修正项”：角越偏离直角，修正越大。<\/p>\n<p><strong>失效边界<\/strong>：修正项可正可负，钝角时第三边比勾股定理算出的更长。<\/p>\n<p><strong>实例<\/strong>：b=5、c=8、A=60°：a²=25+64−2×5×8×0.5=89−40=49，a=7。 三边 3、4、6：最大边 6，6²=36&gt;3²+4²=25，故为钝角三角形。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 余弦定理只能求边 —— 实际上 也能求角，变形后 cosA=(b²+c²−a²)/(2bc) 就是求角公式。\n<\/li><li>\n别以为 三边确定三角形一定唯一 —— 实际上 三边确定时三角形唯一（SSS），但角要用余弦定理算，不能靠正弦定理。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n已知 b=3、c=4、A=90°，则 a 等于：\n<\/li><li>\n三角形三边为 2、3、4，最大角是：\n<p>A. 5 ｜ B. 7 ｜ C. 25 ｜ D. √7 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：cosA=0，a²=9+16=25，a=5。 A. 锐角 ｜ B. 直角 ｜ C. 钝角 ｜ D. 无法判断 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：4²=16&gt;2²+3²=13，故最大角为钝角。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na²=b²+c²−2bc cosA\n<\/li><li>\n已知两边夹角或三边用余弦定理\n<\/li><li>\n最大边定形状：比较 a² 与 b²+c²\n<\/ul>", "kind": "chapter", "title": "第 2 章：余弦定理与形状判断"}, "ch03": {"html": "<h1>第 3 章：面积公式与应用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用两边夹角公式求面积\n<\/li><li>\n用海伦公式由三边求面积\n<\/li><li>\n解决测高、测距与方位角问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>面积有两种算法：给角用 (1/2)ab sinC，给三边用海伦公式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 夹角面积公式<\/h3>\n<p>S=(1/2)ab sinC=(1/2)bc sinA=(1/2)ca sinB<\/p>\n<p>理由：以 a 为底，高为 b sinC，代入三角形面积公式即得。<\/p>\n<h3>3.2 海伦公式<\/h3>\n<p>已知三边 a、b、c，令 p=(a+b+c)/2，则<\/p>\n<p>S=√(p(p−a)(p−b)(p−c))<\/p>\n<p>它不需要先求角，适合只给三边的场合。<\/p>\n<h3>3.3 测量应用<\/h3>\n<ul><li>\n测高：在同一水平线上取两点，测仰角，用正弦定理求距离，再用直角三角形求高；\n<\/li><li>\n测距：不可到达的两点，构造可测三角形，用正弦或余弦定理；\n<\/li><li>\n方位角：从正北方向顺时针量到目标方向的角度，画图时先定北向。\n<\/ul>\n<p>建模四步：画图 → 标已知 → 选定理 → 解并检验合理性（边长是否为正、角是否在范围内）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：面积公式像“用两条边和它们张开的角度算地毯大小”，海伦公式像“只量三条边就能算”。<\/p>\n<p><strong>失效边界<\/strong>：海伦公式要求三边能构成三角形（任意两边之和大于第三边），否则根号内为负。<\/p>\n<p><strong>实例<\/strong>：a=5、b=7、C=60°，S=(1/2)×5×7×√3/2≈15.16。 三边 3、4、5：p=6，S=√(6×3×2×1)=√36=6，与直角三角形面积 3×4/2=6 一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 海伦公式对任意三数都能用 —— 实际上 三数必须满足三角形不等式，否则根号内为负，不是三角形。\n<\/li><li>\n别以为 方位角从正东开始量 —— 实际上 方位角从正北方向开始，顺时针计，范围 0°到 360°。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n两边为 4 和 6、夹角 30°，面积是：\n<\/li><li>\n三边为 6、8、10 的三角形面积是：\n<p>A. 12 ｜ B. 6 ｜ C. 24 ｜ D. 3 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：S=(1/2)×4×6×0.5=6。 A. 24 ｜ B. 48 ｜ C. 30 ｜ D. 20 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：p=12，S=√(12×6×4×2)=√576=24。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nS=(1/2)ab sinC\n<\/li><li>\n海伦：S=√(p(p−a)(p−b)(p−c))\n<\/li><li>\n方位角从正北顺时针量\n<\/ul>", "kind": "chapter", "title": "第 3 章：面积公式与应用"}, "c01": {"html": "<h1>边角对应<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>大边对大角，正弦定理量化了这条关系，余弦定理则处理“夹角”。<\/p>\n<h2>为什么重要<\/h2>\n<p>选对定理是解三角形的第一判断，选错会绕远且易错。<\/p>\n<h2>详解<\/h2>\n<p>已知两角一边、两边及一边对角（含多解）用正弦定理；已知两边夹角、三边用余弦定理。两种定理都能把“边”与“角”互相翻译。<\/p>\n<h2>常见误解<\/h2>\n<p>遇到边角混合条件直接套正弦定理，忽略余弦定理更直接。<\/p>\n<h2>相关概念<\/h2>\n<p>正弦定理（ch01）、余弦定理（ch02）<\/p>", "kind": "concept", "title": "边角对应"}, "c02": {"html": "<h1>多解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>已知两边及一边对角时，正弦值对应两个角，可能有两个三角形。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是解三角形唯一的“答案不唯一”情形，漏判会少写一个解。<\/p>\n<h2>详解<\/h2>\n<p>由 sinB=b sinA/a 求 B：若大于 1 无解；等于 1 一解；小于 1 时 B 有锐角、钝角两个候选，需检验 A+B&lt;180°。大边对大角也可辅助判断：b&gt;a 时 B 可能为钝角。<\/p>\n<h2>常见误解<\/h2>\n<p>求出 sinB 就直接取锐角，漏掉钝角解。<\/p>\n<h2>相关概念<\/h2>\n<p>正弦定理（ch01）、三角形内角和（《直线形》）<\/p>", "kind": "concept", "title": "多解"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：正弦定理<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：正弦定理<\/a><br>检查点：能由两边一角求出其余元素并讨论多解<\/li><li class='path-step' id='path-02'><strong>步骤 02：余弦定理与形状判断<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：余弦定理与形状判断<\/a><br>检查点：能由三边求角并判断三角形类型<\/li><li class='path-step' id='path-03'><strong>步骤 03：面积公式与应用<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：面积公式与应用<\/a><br>检查点：能用两种面积公式解测量题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 在 △ABC 中，a=8、b=6、A=60°，则 sinB 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 3√3/8<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 3/4<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 1/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 三边为 5、12、13 的三角形，其最大角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 锐角<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 直角<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 钝角<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 60°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：正弦定理<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 正弦定理中，a/sinA 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 内切圆半径<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 外接圆半径<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 外接圆直径<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 三角形周长<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 已知 a=2、b=3、A=30°，则 B：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 只有一解<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 可能有两解<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 一定无解<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 一定为直角<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：余弦定理与形状判断<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 已知 b=3、c=4、A=90°，则 a 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 5<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 7<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 25<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> √7<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三角形三边为 2、3、4，最大角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 锐角<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 直角<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 钝角<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：面积公式与应用<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 两边为 4 和 6、夹角 30°，面积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 12<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 24<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三边为 6、8、10 的三角形面积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 24<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 48<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 30<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='正弦定理'>正弦定理 — a/sinA=b/sinB=c/sinC=2R。 <span class=glossary-ref>（第 1 章：正弦定理）<\/span><\/li><li data-term='余弦定理'>余弦定理 — a²=b²+c²−2bc cosA。 <span class=glossary-ref>（第 2 章：余弦定理与形状判断）<\/span><\/li><li data-term='外接圆半径'>外接圆半径 — 三角形外接圆的半径 R。 <span class=glossary-ref>（第 1 章：正弦定理）<\/span><\/li><li data-term='边边角'>边边角 — 已知两边及其中一边的对角，可能多解。 <span class=glossary-ref>（第 1 章：正弦定理）<\/span><\/li><li data-term='海伦公式'>海伦公式 — 由三边求面积的公式。 <span class=glossary-ref>（第 3 章：面积公式与应用）<\/span><\/li><li data-term='方位角'>方位角 — 从正北方向顺时针量到目标方向的角度。 <span class=glossary-ref>（第 3 章：面积公式与应用）<\/span><\/li><li data-term='仰角'>仰角 — 视线在水平线之上的夹角。 <span class=glossary-ref>（第 3 章：面积公式与应用）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：选定理三问<\/h2>\n<p>① 已知的是两角一边还是两边一角？② 角是夹角还是对角？③ 是否可能出现多解？三问定方法。<\/p>\n<h2>框架：测量题四步<\/h2>\n<p>画图定北向 → 标出可测的量 → 选正弦或余弦定理 → 检验结果是否合理。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>正弦定理<\/td><td>a/sinA=b/sinB=c/sinC=2R<\/td><\/tr><tr><td>余弦定理<\/td><td>a²=b²+c²−2bc cosA<\/td><\/tr><tr><td>求角<\/td><td>cosA=(b²+c²−a²)/(2bc)<\/td><\/tr><tr><td>面积<\/td><td>S=(1/2)ab sinC<\/td><\/tr><tr><td>海伦<\/td><td>S=√(p(p−a)(p−b)(p−c))<\/td><\/tr><tr><td>形状<\/td><td>最大边：a²&gt;b²+c² 钝角，=直角，&lt;锐角<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/16-解三角形", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：正弦定理", "href": "#/chapter/ch01"}, {"label": "第 2 章：余弦定理与形状判断", "href": "#/chapter/ch02"}, {"label": "第 3 章：面积公式与应用", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "边角对应", "href": "#/concept/c01"}, {"label": "多解", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：正弦定理", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：余弦定理与形状判断", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：面积公式与应用", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：正弦定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：三角比、圆\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n推导并默写正弦定理\n<\/li><li>\n用正弦定理解两类三角形\n<\/li><li>\n判断已知两边及一边对角时的解的个数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>同一个三角形中，边与它所对角的正弦之比相等，且等于外接圆直径。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 定理与推导<\/h3>\n<p>在 △ABC 中：<\/p>\n<p>a/sinA = b/sinB = c/sinC = 2R<\/p>\n<p>（R 为外接圆半径）<\/p>\n<p>推导：作外接圆，把一边看成弦，由圆周角定理得 a=2R sinA；对另外两边同理。<\/p>\n<h3>1.2 两类基本用法<\/h3>\n<ul><li>\n已知两角与一边：先求第三角（180°减），再用定理求另两边；\n<\/li><li>\n已知两边与其中一边的对角：先求另一边的对角，再求第三角与第三边。\n<\/ul>\n<h3>1.3 多解讨论<\/h3>\n<p>已知 a、b 与 A（边边角）时，由 sinB=b sinA/a 求 B，可能出现：<\/p>\n<ul><li>\nsinB&gt;1：无解；\n<\/li><li>\nsinB=1：一解（B=90°）；\n<\/li><li>\nsinB&lt;1：B 有锐角与钝角两个候选，需检查 A+B&lt;180° 是否成立，可能一解也可能两解。\n<\/ul>\n<p>这是解三角形最容易丢分的地方，必须画图核对。<\/p>\n<h3>1.4 边角互化<\/h3>\n<p>定理把“边的比”换成“正弦的比”，遇到含边与角的混合等式，优先统一成角或统一成边。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：正弦定理像“大角对大边”的定量版本：边越长，对着的角越大，比例恒定。<\/p>\n<p><strong>失效边界<\/strong>：定理对任意三角形都成立，但求角时要防增解；正弦值相同对应两个角。<\/p>\n<p><strong>实例<\/strong>：A=30°，B=45°，a=2。C=105°，由 a/sinA=b/sinB 得 b=2 sin45°/sin30°=2×0.7071/0.5≈2.83。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 正弦定理只适用于直角三角形 —— 实际上 对任意三角形都成立，直角三角形只是特例。\n<\/li><li>\n别以为 由 sinB 求出 B 就唯一 —— 实际上 正弦值对应两个角（锐角与钝角），必须检验和角条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n正弦定理中，a/sinA 等于：\n<\/li><li>\n已知 a=2、b=3、A=30°，则 B：\n<p>A. 内切圆半径 ｜ B. 外接圆半径 ｜ C. 外接圆直径 ｜ D. 三角形周长 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：a/sinA=2R，即外接圆直径。 A. 只有一解 ｜ B. 可能有两解 ｜ C. 一定无解 ｜ D. 一定为直角 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：sinB=b sinA/a=3×0.5/2=0.75&lt;1，B 有锐角与钝角两个候选，需检验，可能两解。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na/sinA=b/sinB=c/sinC=2R\n<\/li><li>\n已知两角一边可直接解\n<\/li><li>\n边边角要讨论解的个数\n<\/ul>", "ch02": "<h1>第 2 章：余弦定理与形状判断<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n推导并默写余弦定理\n<\/li><li>\n由三边求角、由两边夹角求第三边\n<\/li><li>\n用余弦值判断三角形是锐角、直角还是钝角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>余弦定理是勾股定理的推广：a²=b²+c²−2bc cosA，多出的那一项修正了“非直角”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 定理与推导<\/h3>\n<p>a²=b²+c²−2bc cosA b²=a²+c²−2ac cosB c²=a²+b²−2ab cosC<\/p>\n<p>推导：以 A 为原点、AB 为 x 轴建系，B(c,0)，C(b cosA, b sinA)，用两点距离公式展开即得。<\/p>\n<p>当 A=90° 时 cosA=0，公式退化为勾股定理 a²=b²+c²。<\/p>\n<h3>2.2 两类用法<\/h3>\n<ul><li>\n已知两边及夹角：直接求第三边；\n<\/li><li>\n已知三边：用变形公式求角，cosA=(b²+c²−a²)/(2bc)。\n<\/ul>\n<h3>2.3 形状判断<\/h3>\n<p>由 cosA 的符号判断 A 的类型：<\/p>\n<ul><li>\ncosA&gt;0（a²&lt;b²+c²）：A 为锐角；\n<\/li><li>\ncosA=0（a²=b²+c²）：A 为直角；\n<\/li><li>\ncosA&lt;0（a²&gt;b²+c²）：A 为钝角。\n<\/ul>\n<p>判断整个三角形的形状，要看最大边所对的角——只需检查最大角。<\/p>\n<h3>2.4 与正弦定理的分工<\/h3>\n<p>已知“边边角”用正弦定理（注意多解）；已知“边角边”或“边边边”用余弦定理（无多解问题）。这是选择定理的第一判据。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：余弦定理像给勾股定理加了一个“斜度修正项”：角越偏离直角，修正越大。<\/p>\n<p><strong>失效边界<\/strong>：修正项可正可负，钝角时第三边比勾股定理算出的更长。<\/p>\n<p><strong>实例<\/strong>：b=5、c=8、A=60°：a²=25+64−2×5×8×0.5=89−40=49，a=7。 三边 3、4、6：最大边 6，6²=36&gt;3²+4²=25，故为钝角三角形。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 余弦定理只能求边 —— 实际上 也能求角，变形后 cosA=(b²+c²−a²)/(2bc) 就是求角公式。\n<\/li><li>\n别以为 三边确定三角形一定唯一 —— 实际上 三边确定时三角形唯一（SSS），但角要用余弦定理算，不能靠正弦定理。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n已知 b=3、c=4、A=90°，则 a 等于：\n<\/li><li>\n三角形三边为 2、3、4，最大角是：\n<p>A. 5 ｜ B. 7 ｜ C. 25 ｜ D. √7 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：cosA=0，a²=9+16=25，a=5。 A. 锐角 ｜ B. 直角 ｜ C. 钝角 ｜ D. 无法判断 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：4²=16&gt;2²+3²=13，故最大角为钝角。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na²=b²+c²−2bc cosA\n<\/li><li>\n已知两边夹角或三边用余弦定理\n<\/li><li>\n最大边定形状：比较 a² 与 b²+c²\n<\/ul>", "ch03": "<h1>第 3 章：面积公式与应用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用两边夹角公式求面积\n<\/li><li>\n用海伦公式由三边求面积\n<\/li><li>\n解决测高、测距与方位角问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>面积有两种算法：给角用 (1/2)ab sinC，给三边用海伦公式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 夹角面积公式<\/h3>\n<p>S=(1/2)ab sinC=(1/2)bc sinA=(1/2)ca sinB<\/p>\n<p>理由：以 a 为底，高为 b sinC，代入三角形面积公式即得。<\/p>\n<h3>3.2 海伦公式<\/h3>\n<p>已知三边 a、b、c，令 p=(a+b+c)/2，则<\/p>\n<p>S=√(p(p−a)(p−b)(p−c))<\/p>\n<p>它不需要先求角，适合只给三边的场合。<\/p>\n<h3>3.3 测量应用<\/h3>\n<ul><li>\n测高：在同一水平线上取两点，测仰角，用正弦定理求距离，再用直角三角形求高；\n<\/li><li>\n测距：不可到达的两点，构造可测三角形，用正弦或余弦定理；\n<\/li><li>\n方位角：从正北方向顺时针量到目标方向的角度，画图时先定北向。\n<\/ul>\n<p>建模四步：画图 → 标已知 → 选定理 → 解并检验合理性（边长是否为正、角是否在范围内）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：面积公式像“用两条边和它们张开的角度算地毯大小”，海伦公式像“只量三条边就能算”。<\/p>\n<p><strong>失效边界<\/strong>：海伦公式要求三边能构成三角形（任意两边之和大于第三边），否则根号内为负。<\/p>\n<p><strong>实例<\/strong>：a=5、b=7、C=60°，S=(1/2)×5×7×√3/2≈15.16。 三边 3、4、5：p=6，S=√(6×3×2×1)=√36=6，与直角三角形面积 3×4/2=6 一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 海伦公式对任意三数都能用 —— 实际上 三数必须满足三角形不等式，否则根号内为负，不是三角形。\n<\/li><li>\n别以为 方位角从正东开始量 —— 实际上 方位角从正北方向开始，顺时针计，范围 0°到 360°。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n两边为 4 和 6、夹角 30°，面积是：\n<\/li><li>\n三边为 6、8、10 的三角形面积是：\n<p>A. 12 ｜ B. 6 ｜ C. 24 ｜ D. 3 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：S=(1/2)×4×6×0.5=6。 A. 24 ｜ B. 48 ｜ C. 30 ｜ D. 20 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：p=12，S=√(12×6×4×2)=√576=24。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nS=(1/2)ab sinC\n<\/li><li>\n海伦：S=√(p(p−a)(p−b)(p−c))\n<\/li><li>\n方位角从正北顺时针量\n<\/ul>", "c01": "<h1>边角对应<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>大边对大角，正弦定理量化了这条关系，余弦定理则处理“夹角”。<\/p>\n<h2>为什么重要<\/h2>\n<p>选对定理是解三角形的第一判断，选错会绕远且易错。<\/p>\n<h2>详解<\/h2>\n<p>已知两角一边、两边及一边对角（含多解）用正弦定理；已知两边夹角、三边用余弦定理。两种定理都能把“边”与“角”互相翻译。<\/p>\n<h2>常见误解<\/h2>\n<p>遇到边角混合条件直接套正弦定理，忽略余弦定理更直接。<\/p>\n<h2>相关概念<\/h2>\n<p>正弦定理（ch01）、余弦定理（ch02）<\/p>", "c02": "<h1>多解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>已知两边及一边对角时，正弦值对应两个角，可能有两个三角形。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是解三角形唯一的“答案不唯一”情形，漏判会少写一个解。<\/p>\n<h2>详解<\/h2>\n<p>由 sinB=b sinA/a 求 B：若大于 1 无解；等于 1 一解；小于 1 时 B 有锐角、钝角两个候选，需检验 A+B&lt;180°。大边对大角也可辅助判断：b&gt;a 时 B 可能为钝角。<\/p>\n<h2>常见误解<\/h2>\n<p>求出 sinB 就直接取锐角，漏掉钝角解。<\/p>\n<h2>相关概念<\/h2>\n<p>正弦定理（ch01）、三角形内角和（《直线形》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：正弦定理<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：正弦定理<\/a><br>检查点：能由两边一角求出其余元素并讨论多解<\/li><li class='path-step' id='path-02'><strong>步骤 02：余弦定理与形状判断<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：余弦定理与形状判断<\/a><br>检查点：能由三边求角并判断三角形类型<\/li><li class='path-step' id='path-03'><strong>步骤 03：面积公式与应用<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：面积公式与应用<\/a><br>检查点：能用两种面积公式解测量题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 在 △ABC 中，a=8、b=6、A=60°，则 sinB 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 3√3/8<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 3/4<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> √3/2<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 1/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 三边为 5、12、13 的三角形，其最大角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 锐角<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 直角<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 钝角<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 60°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：正弦定理<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 正弦定理中，a/sinA 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 内切圆半径<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 外接圆半径<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 外接圆直径<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 三角形周长<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 已知 a=2、b=3、A=30°，则 B：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 只有一解<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 可能有两解<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 一定无解<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 一定为直角<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：余弦定理与形状判断<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 已知 b=3、c=4、A=90°，则 a 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 5<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 7<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 25<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> √7<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三角形三边为 2、3、4，最大角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 锐角<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 直角<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 钝角<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：面积公式与应用<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 两边为 4 和 6、夹角 30°，面积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 12<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 24<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三边为 6、8、10 的三角形面积是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 24<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 48<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 30<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='正弦定理'>正弦定理 — a/sinA=b/sinB=c/sinC=2R。 <span class=glossary-ref>（第 1 章：正弦定理）<\/span><\/li><li data-term='余弦定理'>余弦定理 — a²=b²+c²−2bc cosA。 <span class=glossary-ref>（第 2 章：余弦定理与形状判断）<\/span><\/li><li data-term='外接圆半径'>外接圆半径 — 三角形外接圆的半径 R。 <span class=glossary-ref>（第 1 章：正弦定理）<\/span><\/li><li data-term='边边角'>边边角 — 已知两边及其中一边的对角，可能多解。 <span class=glossary-ref>（第 1 章：正弦定理）<\/span><\/li><li data-term='海伦公式'>海伦公式 — 由三边求面积的公式。 <span class=glossary-ref>（第 3 章：面积公式与应用）<\/span><\/li><li data-term='方位角'>方位角 — 从正北方向顺时针量到目标方向的角度。 <span class=glossary-ref>（第 3 章：面积公式与应用）<\/span><\/li><li data-term='仰角'>仰角 — 视线在水平线之上的夹角。 <span class=glossary-ref>（第 3 章：面积公式与应用）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：选定理三问<\/h2>\n<p>① 已知的是两角一边还是两边一角？② 角是夹角还是对角？③ 是否可能出现多解？三问定方法。<\/p>\n<h2>框架：测量题四步<\/h2>\n<p>画图定北向 → 标出可测的量 → 选正弦或余弦定理 → 检验结果是否合理。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>正弦定理<\/td><td>a/sinA=b/sinB=c/sinC=2R<\/td><\/tr><tr><td>余弦定理<\/td><td>a²=b²+c²−2bc cosA<\/td><\/tr><tr><td>求角<\/td><td>cosA=(b²+c²−a²)/(2bc)<\/td><\/tr><tr><td>面积<\/td><td>S=(1/2)ab sinC<\/td><\/tr><tr><td>海伦<\/td><td>S=√(p(p−a)(p−b)(p−c))<\/td><\/tr><tr><td>形状<\/td><td>最大边：a²&gt;b²+c² 钝角，=直角，&lt;锐角<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
