<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>不等式</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>不等式</h1>
    <div class="sub">比较之外：不等式的性质、解法与证明</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>

"patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "若 a>b，则下列一定成立的是：", "options": ["a²>b²", "−2a>−2b", "a−3>b−3", "1/a>1/b"], "answer": 2, "explain": "两边同减 3 不变号，C 恒成立。A 在 a=1、b=−2 时不成立；B 应变为 −2a<−2b；D 要求同号。"}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "解不等式 −3x≥6，解集是：", "options": ["x≥−2", "x≤−2", "x≥2", "x≤2"], "answer": 1, "explain": "两边除以 −3（负数），不等号反向：x≤−2。"}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "不等式 x²−4x+3<0 的解集是：", "options": ["(1,3)", "(−∞,1)∪(3,+∞)", "[1,3]", "(−3,−1)"], "answer": 0, "explain": "(x−1)(x−3)<0，开口向上，两根之间为负，解集 (1,3)。"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "不等式 (x−2)²(x+1)>0 的解集是：", "options": ["x>−1", "x>−1 且 x≠2", "x<−1", "全体实数"], "answer": 1, "explain": "x=−1 处穿根、x=2 处偶次不穿；x>−1 且 x≠2 时为正，x=−1 时为零。"}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "不等式 |x−2|<3 的解集是：", "options": ["(−1,5)", "(−5,−1)", "(2,5)", "(−∞,5)"], "answer": 0, "explain": "到 2 的距离小于 3，即 −3<x−2<3，得 −1<x<5。"}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "解 √(x−1)<2 时，正确的第一步是：", "options": ["两边平方", "移项", "确定定义域 x≥1", "讨论 x 的正负"], "answer": 2, "explain": "根号要求被开方数非负，先得 x≥1；再平方得 x−1<4，即 x<5，合起来 1≤x<5。"}, {"id": "q07", "chapterId": "ch04", "type": "single", "question": "用比较法证明 a²+b²≥2ab 时，关键一步是：", "options": ["移项得 a²+b²−2ab≥0", "两边同除 2", "取 a=b=1 验证", "两边开方"], "answer": 0, "explain": "作差后配方得 (a−b)²≥0，这是证明的核心；只代特殊值不算证明。"}, {"id": "q08", "chapterId": "ch04", "type": "single", "question": "对正数 a、b，等号成立的条件是：", "options": ["a=b", "a+b=0", "ab=1", "a=2b"], "answer": 0, "explain": "(a+b)/2≥√(ab) 的等号当且仅当 a=b 时成立。"}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "不等式 (x−1)(x+2)>0 的解集是：", "options": ["(−2,1)", "(−∞,−2)∪(1,+∞)", "[−2,1]", "(−∞,1)"], "answer": 1, "explain": "开口向上，两根 −2、1 之外为正。"}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "若 a>b，则下列一定成立的是：", "options": ["a²>b²", "a−c>b−c", "ac>bc", "1/a<1/b"], "answer": 1, "explain": "同减一个数不变号；其余选项在 c 符号不定或 a 为负时不成立。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：不等式的性质与同解变形」的一句话核心是什么？", "back": "不等式只有一条铁律：两边同乘（除）一个负数，不等号方向必须反过来。", "tags": ["inequalities", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：二次不等式与高次不等式」的一句话核心是什么？", "back": "二次不等式的解集由“开口方向 + 零点位置”决定；高次不等式用数轴上的符号变化判断。", "tags": ["inequalities", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：绝对值不等式与无理不等式」的一句话核心是什么？", "back": "绝对值是距离，无理不等式要先保证根号有意义，再平方——两步顺序不能颠倒。", "tags": ["inequalities", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：不等式的证明」的一句话核心是什么？", "back": "证明不等式就是证明“差非负”或“由已知不等式推过来”；分析法从结论倒着找条件。", "tags": ["inequalities", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「同解不等式」？", "back": "解集完全相同的不等式。", "tags": ["inequalities", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「可乘性」？", "back": "两边同乘正数不变号、乘负数变号的性质。", "tags": ["inequalities", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「解集」？", "back": "使不等式成立的所有取值组成的集合。", "tags": ["inequalities", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「穿针引线法」？", "back": "按零点次数在数轴上交替取符号解高次不等式的方法。", "tags": ["inequalities", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「重根」？", "back": "方程中重复出现的根，对应因式的幂次大于 1。", "tags": ["inequalities", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「绝对值不等式」？", "back": "含 |x| 或 |ax+b| 的不等式，按距离意义转化。", "tags": ["inequalities", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「无理不等式」？", "back": "根号内含有未知数的不等式。", "tags": ["inequalities", "术语"]}, {"id": "f12", "chapterId": "ch04", "front": "什么是「比较法」？", "back": "作差或作商判断大小的证明方法。", "tags": ["inequalities", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「分析法」？", "back": "从结论出发寻找充分条件的证明方法。", "tags": ["inequalities", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「基本不等式」？", "back": "a²+b²≥2ab；(a+b)/2≥√(ab)（a,b>0）。", "tags": ["inequalities", "术语"]}], "companion": "inequalities学习伴侣.html", "deriv": "inequalities从零推导.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：不等式的性质与同解变形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：实数比较大小、四则运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 a−b 的符号判断大小\n<\/li><li>\n正确使用四条基本性质\n<\/li><li>\n判断两个不等式是否同解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>不等式只有一条铁律：两边同乘（除）一个负数，不等号方向必须反过来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 比较大小的本质<\/h3>\n<p>a&gt;b 等价于 a−b&gt;0。所以比较两个数，就是判断它们的差是正、负还是零。这一条把“比大小”变成了“做减法”，是所有不等式证明的起点。<\/p>\n<h3>1.2 四条基本性质<\/h3>\n<ol><li>\n<strong>传递性<\/strong>：a&gt;b、b&gt;c ⇒ a&gt;c；\n<\/li><li>\n<strong>可加性<\/strong>：a&gt;b ⇒ a+c&gt;b+c；\n<\/li><li>\n<strong>可乘性<\/strong>：a&gt;b、c&gt;0 ⇒ ac&gt;bc；a&gt;b、c&lt;0 ⇒ ac&lt;bc（<strong>变号<\/strong>）；\n<\/li><li>\n<strong>倒数<\/strong>：a&gt;b&gt;0 ⇒ 1/a&lt;1/b（正数取倒数要变号）。\n<\/ol>\n<p>可乘性是最容易出错的一条。c 的符号不确定时，不能直接乘，必须分 c&gt;0、c=0、c&lt;0 讨论。<\/p>\n<h3>1.3 同解变形<\/h3>\n<p>同解指两个不等式解集完全相同。允许的操作：<\/p>\n<ul><li>\n移项（两边同加同一个数）；\n<\/li><li>\n两边同乘（除）同一个正数；\n<\/li><li>\n两边同乘（除）同一个负数，同时把不等号反向。\n<\/ul>\n<p>不允许：两边平方（除非确定两边都非负）、两边乘含未知数的式子（符号不定）。<\/p>\n<h3>1.4 一元一次不等式组<\/h3>\n<p>分别解每个不等式，再取交集。画数轴时用实心点表示含端点（≤、≥），空心点表示不含（&lt;、&gt;）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：不等式像一条“分界线”，变形只是把线挪位置；乘负数相当于照镜子，左右顺序整个翻转。<\/p>\n<p><strong>失效边界<\/strong>：镜子比喻只说明方向翻转，不说明大小变化；乘负数后数值大小也变了。<\/p>\n<p><strong>实例<\/strong>：解 −2x+3&gt;7。 两边减 3：−2x&gt;4；两边除以 −2（负数，变号）：x&lt;−2。解集为 (−∞,−2)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 不等式两边可以随便乘同一个式子 —— 实际上 式子的符号未知时不能直接乘；必须讨论正负，或改用移项、通分。\n<\/li><li>\n别以为 乘以负数只是数值变了，方向不变 —— 实际上 负系数会把大小顺序整个翻转，所以必须变号；漏掉就得到相反的解集。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 a&gt;b，则下列一定成立的是：\n<\/li><li>\n解不等式 −3x≥6，解集是：\n<p>A. a²&gt;b² ｜ B. −2a&gt;−2b ｜ C. a−3&gt;b−3 ｜ D. 1/a&gt;1/b <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：两边同减 3 不变号，C 恒成立。A 在 a=1、b=−2 时不成立；B 应变为 −2a&lt;−2b；D 要求同号。 A. x≥−2 ｜ B. x≤−2 ｜ C. x≥2 ｜ D. x≤2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：两边除以 −3（负数），不等号反向：x≤−2。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na&gt;b ⇔ a−b&gt;0\n<\/li><li>\n乘除负数必须变号\n<\/li><li>\n不等式组取交集，实心点含端点\n<\/ul>", "kind": "chapter", "title": "第 1 章：不等式的性质与同解变形"}, "ch02": {"html": "<h1>第 2 章：二次不等式与高次不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、因式分解\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用因式分解与符号表解一元二次不等式\n<\/li><li>\n用穿针引线法解高次不等式\n<\/li><li>\n正确处理含参数与重根情形\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>二次不等式的解集由“开口方向 + 零点位置”决定；高次不等式用数轴上的符号变化判断。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 二次不等式的标准解法<\/h3>\n<p>以 ax²+bx+c&gt;0（a&gt;0）为例：<\/p>\n<ol><li>\n求方程 ax²+bx+c=0 的根 x₁&lt;x₂（判别式 Δ）；\n<\/li><li>\n抛物线开口向上，两根之间为负、两根之外为正；\n<\/li><li>\n所以 &gt;0 的解集是 (−∞,x₁)∪(x₂,+∞)，&lt;0 的解集是 (x₁,x₂)。\n<\/ol>\n<p>口诀只是记忆辅助，真正的依据是抛物线图象。<\/p>\n<p>三种特殊情形：<\/p>\n<ul><li>\nΔ=0：抛物线与 x 轴相切，&gt;0 的解集是除顶点外的所有实数，&lt;0 无解；\n<\/li><li>\nΔ&lt;0 且 a&gt;0：整条抛物线在 x 轴上方，&gt;0 恒成立，&lt;0 无解；\n<\/li><li>\na&lt;0：先两边乘 −1 化成正系数，同时变号。\n<\/ul>\n<h3>2.2 高次不等式：穿针引线<\/h3>\n<p>把多项式分解成一次因式的乘积，把所有零点标在数轴上，从最右端开始画曲线，<strong>奇次根穿过、偶次根不穿<\/strong>，按区间符号写出解集。<\/p>\n<p>例：(x−1)(x−2)²(x+1)&gt;0。零点 −1（1 次）、1（1 次）、2（2 次）。曲线在 2 处不穿，在 1、−1 处穿过。<\/p>\n<h3>2.3 含参数要分类<\/h3>\n<p>含参数的二次不等式要按“首项系数是否为 0”“判别式符号”“两根大小”分层讨论，不能只写一种情形。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：符号表像一条“正负交替的带子”，每过一个奇次零点就翻一次面。<\/p>\n<p><strong>失效边界<\/strong>：穿针法要求因式都已分解到一次（或不可约二次）；未分解时零点不全，结论会错。<\/p>\n<p><strong>实例<\/strong>：解 x²−x−6&lt;0。 因式分解 (x−3)(x+2)&lt;0，零点 −2、3，开口向上，两根之间为负，解集 (−2,3)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 二次不等式一定有解 —— 实际上 Δ&lt;0 且开口向上时，&gt;0 恒成立、&lt;0 无解；并非所有形式都有非空解集。\n<\/li><li>\n别以为 重根也要穿过去 —— 实际上 偶次重根两侧符号相同，曲线不穿过，只是相切折返。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n不等式 x²−4x+3&lt;0 的解集是：\n<\/li><li>\n不等式 (x−2)²(x+1)&gt;0 的解集是：\n<p>A. (1,3) ｜ B. (−∞,1)∪(3,+∞) ｜ C. [1,3] ｜ D. (−3,−1) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：(x−1)(x−3)&lt;0，开口向上，两根之间为负，解集 (1,3)。 A. x&gt;−1 ｜ B. x&gt;−1 且 x≠2 ｜ C. x&lt;−1 ｜ D. 全体实数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：x=−1 处穿根、x=2 处偶次不穿；x&gt;−1 且 x≠2 时为正，x=−1 时为零。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二次不等式看开口与零点：开口向上，两根之外为正\n<\/li><li>\n高次不等式：奇穿偶不穿\n<\/li><li>\n含参数按首项系数、判别式、根大小分层\n<\/ul>", "kind": "chapter", "title": "第 2 章：二次不等式与高次不等式"}, "ch03": {"html": "<h1>第 3 章：绝对值不等式与无理不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用几何意义解 |x| 型不等式\n<\/li><li>\n解 |ax+b|&lt;c、&gt;c 两类\n<\/li><li>\n先定定义域再解无理不等式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>绝对值是距离，无理不等式要先保证根号有意义，再平方——两步顺序不能颠倒。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 绝对值的几何意义<\/h3>\n<p>|x| 表示数轴上 x 到原点的距离。于是：<\/p>\n<ul><li>\n|x|&lt;a（a&gt;0）⇔ −a&lt;x&lt;a；\n<\/li><li>\n|x|&gt;a（a&gt;0）⇔ x&lt;−a 或 x&gt;a。\n<\/ul>\n<p>把 x 换成 x−c，就是“到 c 的距离”。<\/p>\n<h3>3.2 一般形式<\/h3>\n<p>|ax+b|&lt;c（c&gt;0）⇔ −c&lt;ax+b&lt;c；<\/p>\n<p>|ax+b|&gt;c（c&gt;0）⇔ ax+b&lt;−c 或 ax+b&gt;c。<\/p>\n<p>c≤0 时要单独看：|…|&lt;c 无解，|…|&gt;c 对使式子有意义的 x 恒成立（c&lt;0）或需排除零点（c=0）。<\/p>\n<h3>3.3 无理不等式的两步<\/h3>\n<p>第一步：定定义域（偶次根号下非负）。 第二步：两边平方，但只有在两边都非负时才等价。<\/p>\n<p>例：√(x+2)&lt;x。 定义域 x≥−2；右边要求 x&gt;0 才能平方（否则负数小于正根号一定成立，直接给出解）。 平方得 x+2&lt;x²，即 x²−x−2&gt;0，x&gt;2 或 x&lt;−1。结合 x&gt;0 与 x≥−2，得 x&gt;2。 还要单独检查 x∈[−2,0]：此时右边 ≤0，左边 ≥0，不等式不成立，故无解。合起来解集 (2,+∞)。<\/p>\n<h3>3.4 常见结构<\/h3>\n<ul><li>\n√A &lt; B：需要 B&gt;0 且 A&lt;B²，同时 A≥0；\n<\/li><li>\n√A &gt; B：分 B&lt;0（只需 A≥0）与 B≥0（A&gt;B²）两种。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：绝对值像“到某地的距离”，无理不等式像“先确认尺子能量，再比长度”。<\/p>\n<p><strong>失效边界<\/strong>：平方只保“非负”的大小关系；两边符号不明时平方会引入错误解。<\/p>\n<p><strong>实例<\/strong>：解 |2x−1|≤5。 −5≤2x−1≤5 ⇒ −4≤2x≤6 ⇒ −2≤x≤3。解集 [−2,3]。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 |x|&gt;a 就是 x&gt;a —— 实际上 漏了 x&lt;−a 这一支。绝对值大，可能是“很正的”也可能是“很负的”。\n<\/li><li>\n别以为 无理不等式直接平方就行 —— 实际上 必须先定定义域，并确认两边非负；否则平方会引入不满足原式的解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n不等式 |x−2|&lt;3 的解集是：\n<\/li><li>\n解 √(x−1)&lt;2 时，正确的第一步是：\n<p>A. (−1,5) ｜ B. (−5,−1) ｜ C. (2,5) ｜ D. (−∞,5) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：到 2 的距离小于 3，即 −3&lt;x−2&lt;3，得 −1&lt;x&lt;5。 A. 两边平方 ｜ B. 移项 ｜ C. 确定定义域 x≥1 ｜ D. 讨论 x 的正负 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：根号要求被开方数非负，先得 x≥1；再平方得 x−1&lt;4，即 x&lt;5，合起来 1≤x&lt;5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n|x−c|&lt;a ⇔ c−a&lt;x&lt;c+a\n<\/li><li>\n无理不等式：先定义域，再判断两边非负，最后平方\n<\/li><li>\n√A&lt;B 需 B&gt;0 且 A&lt;B²\n<\/ul>", "kind": "chapter", "title": "第 3 章：绝对值不等式与无理不等式"}, "ch04": {"html": "<h1>第 4 章：不等式的证明<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用比较法（作差、作商）证明不等式\n<\/li><li>\n用综合法与分析法各写一段完整推理\n<\/li><li>\n正确使用基本不等式并说明等号条件\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>证明不等式就是证明“差非负”或“由已知不等式推过来”；分析法从结论倒着找条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 比较法<\/h3>\n<p>要证 A≥B，作差 A−B，证明它非负（配方、因式分解、判别式）。要证 A≥B&gt;0，也可作商 A/B 与 1 比较。<\/p>\n<p>例：证 a²+b²≥2ab。作差：a²−2ab+b²=(a−b)²≥0，等号当且仅当 a=b。<\/p>\n<h3>4.2 综合法<\/h3>\n<p>从已知成立的不等式出发，按“由因导果”的顺序推到结论。常用已知：基本不等式、|a|+|b|≥|a+b|、均值不等式。<\/p>\n<h3>4.3 分析法<\/h3>\n<p>从结论出发，寻找使它成立的充分条件，一直追到已知事实。书写时常用“要证……只需证……”，每一步都必须可逆或充分。<\/p>\n<p>例：证 √2+√7&lt;√3+√6。两边平方后比较 9+2√14 与 9+2√18，只需证 √14&lt;√18，显然成立。<\/p>\n<h3>4.4 基本不等式与等号条件<\/h3>\n<p>a²+b²≥2ab 对一切实数成立，等号当 a=b。<\/p>\n<p>对正数 a、b，有 (a+b)/2≥√(ab)，等号当 a=b。使用时必须确认 a、b 为正，并检查等号能否取到——取不到时只能得到严格不等式。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：比较法是“称重量”，综合法是“顺着链条推”，分析法是“从终点倒着找路”。<\/p>\n<p><strong>失效边界<\/strong>：分析法每步必须充分；把“只需”写成“等价”而不检查可逆，会证出假命题。<\/p>\n<p><strong>实例<\/strong>：证 对任意实数 x，x²+2x+3&gt;0。 配方：x²+2x+3=(x+1)²+2≥2&gt;0。等号取不到，故严格成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 用基本不等式不用检查等号条件 —— 实际上 等号条件决定不等式能否取到等值；取不到时结论仍是严格不等，但最值结论会变。\n<\/li><li>\n别以为 分析法可以随便写“只需证” —— 实际上 每一步必须真的充分；写成不充分的条件等于没有证明。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用比较法证明 a²+b²≥2ab 时，关键一步是：\n<\/li><li>\n对正数 a、b，等号成立的条件是：\n<p>A. 移项得 a²+b²−2ab≥0 ｜ B. 两边同除 2 ｜ C. 取 a=b=1 验证 ｜ D. 两边开方 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：作差后配方得 (a−b)²≥0，这是证明的核心；只代特殊值不算证明。 A. a=b ｜ B. a+b=0 ｜ C. ab=1 ｜ D. a=2b <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：(a+b)/2≥√(ab) 的等号当且仅当 a=b 时成立。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n比较法：作差判符号（可配方、因式分解）\n<\/li><li>\n分析法：从结论找充分条件，每步须充分\n<\/li><li>\n基本不等式使用前先确认正数与等号条件\n<\/ul>", "kind": "chapter", "title": "第 4 章：不等式的证明"}, "c01": {"html": "<h1>同解变形与变号<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>两边同乘负数，不等号反向；这一步错，整道题的解集就反了。<\/p>\n<h2>为什么重要<\/h2>\n<p>不等式解法全部由同解变形组成，变号是最容易出错也最容易检查的一步。<\/p>\n<h2>详解<\/h2>\n<p>允许的同解操作：移项、同乘除正数、同乘除负数并变号。禁止的操作：两边平方（除确定非负）、乘含未知数且符号不定的式子。检查办法：把解集端点代回原不等式，看是否恰好取到边界。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“乘以 −1 只是把式子反过来写”，忘了同时要变号。<\/p>\n<h2>相关概念<\/h2>\n<p>基本性质（ch01）、绝对值不等式（ch03）<\/p>", "kind": "concept", "title": "同解变形与变号"}, "c02": {"html": "<h1>符号表与穿针引线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把零点排在数轴上，按因式的次数决定穿或不穿，每一段的符号就定了。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是解二次、高次不等式的通用方法，比背口诀可靠。<\/p>\n<h2>详解<\/h2>\n<p>步骤：分解到一次因式 → 标零点 → 从最右段取一个测试点定符号 → 按奇穿偶不穿依次翻面 → 按不等号方向取区间。含参数时额外讨论首项系数与重根。<\/p>\n<h2>常见误解<\/h2>\n<p>把偶次重根也当穿过点，导致区间符号整体错位。<\/p>\n<h2>相关概念<\/h2>\n<p>二次不等式（ch02）、因式分解（《整式》）<\/p>", "kind": "concept", "title": "符号表与穿针引线"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：性质与同解变形<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：不等式的性质与同解变形<\/a><br>检查点：能说明两边乘负数为什么要变号<\/li><li class='path-step' id='path-02'><strong>步骤 02：二次与高次不等式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：二次不等式与高次不等式<\/a><br>检查点：能用符号表写出解集<\/li><li class='path-step' id='path-03'><strong>步骤 03：绝对值与无理不等式<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：绝对值不等式与无理不等式<\/a><br>检查点：能先定定义域再解无理不等式<\/li><li class='path-step' id='path-04'><strong>步骤 04：不等式的证明<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：不等式的证明<\/a><br>检查点：能用比较法与综合法各证一题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q9.<\/b> 不等式 (x−1)(x+2)&gt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> (−2,1)<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> (−∞,−2)∪(1,+∞)<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> [−2,1]<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> (−∞,1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q10.<\/b> 若 a&gt;b，则下列一定成立的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> a²&gt;b²<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> a−c&gt;b−c<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> ac&gt;bc<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 1/a&lt;1/b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：不等式的性质与同解变形<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 若 a&gt;b，则下列一定成立的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> a²&gt;b²<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> −2a&gt;−2b<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> a−3&gt;b−3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 1/a&gt;1/b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 解不等式 −3x≥6，解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> x≥−2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> x≤−2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> x≥2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> x≤2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：二次不等式与高次不等式<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 不等式 x²−4x+3&lt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> (1,3)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> (−∞,1)∪(3,+∞)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> [1,3]<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> (−3,−1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 不等式 (x−2)²(x+1)&gt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> x&gt;−1<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> x&gt;−1 且 x≠2<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> x&lt;−1<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 全体实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：绝对值不等式与无理不等式<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 不等式 |x−2|&lt;3 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> (−1,5)<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> (−5,−1)<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> (2,5)<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> (−∞,5)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 解 √(x−1)&lt;2 时，正确的第一步是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 两边平方<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 移项<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 确定定义域 x≥1<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 讨论 x 的正负<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：不等式的证明<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 用比较法证明 a²+b²≥2ab 时，关键一步是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 移项得 a²+b²−2ab≥0<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 两边同除 2<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 取 a=b=1 验证<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 两边开方<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 对正数 a、b，等号成立的条件是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> a=b<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> a+b=0<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> ab=1<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> a=2b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='同解不等式'>同解不等式 — 解集完全相同的不等式。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='可乘性'>可乘性 — 两边同乘正数不变号、乘负数变号的性质。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='解集'>解集 — 使不等式成立的所有取值组成的集合。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='穿针引线法'>穿针引线法 — 按零点次数在数轴上交替取符号解高次不等式的方法。 <span class=glossary-ref>（第 2 章：二次不等式与高次不等式）<\/span><\/li><li data-term='重根'>重根 — 方程中重复出现的根，对应因式的幂次大于 1。 <span class=glossary-ref>（第 2 章：二次不等式与高次不等式）<\/span><\/li><li data-term='绝对值不等式'>绝对值不等式 — 含 |x| 或 |ax+b| 的不等式，按距离意义转化。 <span class=glossary-ref>（第 3 章：绝对值不等式与无理不等式）<\/span><\/li><li data-term='无理不等式'>无理不等式 — 根号内含有未知数的不等式。 <span class=glossary-ref>（第 3 章：绝对值不等式与无理不等式）<\/span><\/li><li data-term='比较法'>比较法 — 作差或作商判断大小的证明方法。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><li data-term='分析法'>分析法 — 从结论出发寻找充分条件的证明方法。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><li data-term='基本不等式'>基本不等式 — a²+b²≥2ab；(a+b)/2≥√(ab)（a,b&gt;0）。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：解不等式的四步<\/h2>\n<p>① 定定义域；② 移项整理成标准形；③ 求零点、画符号表；④ 按不等号方向取区间并检查端点。<\/p>\n<h2>框架：证明的三选一<\/h2>\n<p>结构简单作差；已知不等式多则综合；结论复杂则分析。选错方法会绕远路。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>乘负数<\/td><td>不等号反向<\/td><\/tr><tr><td>二次不等式 a&gt;0<\/td><td>&gt;0 取两根之外，&lt;0 取两根之间<\/td><\/tr><tr><td>高次不等式<\/td><td>奇穿偶不穿，从最右段定符号<\/td><\/tr><tr><td>绝对值<\/td><td><\/td><td>x<\/td><td>&lt;a ⇔ −a&lt;x&lt;a；<\/td><td>x<\/td><td>&gt;a ⇔ x&lt;−a 或 x&gt;a<\/td><\/tr><tr><td>无理不等式<\/td><td>先定义域，再判两边非负，最后平方<\/td><\/tr><tr><td>基本不等式<\/td><td>a²+b²≥2ab；等号 a=b<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/05-不等式", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：不等式的性质与同解变形", "href": "#/chapter/ch01"}, {"label": "第 2 章：二次不等式与高次不等式", "href": "#/chapter/ch02"}, {"label": "第 3 章：绝对值不等式与无理不等式", "href": "#/chapter/ch03"}, {"label": "第 4 章：不等式的证明", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "同解变形与变号", "href": "#/concept/c01"}, {"label": "符号表与穿针引线", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：不等式的性质与同解变形", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：二次不等式与高次不等式", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：绝对值不等式与无理不等式", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：不等式的证明", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：不等式的性质与同解变形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：实数比较大小、四则运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 a−b 的符号判断大小\n<\/li><li>\n正确使用四条基本性质\n<\/li><li>\n判断两个不等式是否同解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>不等式只有一条铁律：两边同乘（除）一个负数，不等号方向必须反过来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 比较大小的本质<\/h3>\n<p>a&gt;b 等价于 a−b&gt;0。所以比较两个数，就是判断它们的差是正、负还是零。这一条把“比大小”变成了“做减法”，是所有不等式证明的起点。<\/p>\n<h3>1.2 四条基本性质<\/h3>\n<ol><li>\n<strong>传递性<\/strong>：a&gt;b、b&gt;c ⇒ a&gt;c；\n<\/li><li>\n<strong>可加性<\/strong>：a&gt;b ⇒ a+c&gt;b+c；\n<\/li><li>\n<strong>可乘性<\/strong>：a&gt;b、c&gt;0 ⇒ ac&gt;bc；a&gt;b、c&lt;0 ⇒ ac&lt;bc（<strong>变号<\/strong>）；\n<\/li><li>\n<strong>倒数<\/strong>：a&gt;b&gt;0 ⇒ 1/a&lt;1/b（正数取倒数要变号）。\n<\/ol>\n<p>可乘性是最容易出错的一条。c 的符号不确定时，不能直接乘，必须分 c&gt;0、c=0、c&lt;0 讨论。<\/p>\n<h3>1.3 同解变形<\/h3>\n<p>同解指两个不等式解集完全相同。允许的操作：<\/p>\n<ul><li>\n移项（两边同加同一个数）；\n<\/li><li>\n两边同乘（除）同一个正数；\n<\/li><li>\n两边同乘（除）同一个负数，同时把不等号反向。\n<\/ul>\n<p>不允许：两边平方（除非确定两边都非负）、两边乘含未知数的式子（符号不定）。<\/p>\n<h3>1.4 一元一次不等式组<\/h3>\n<p>分别解每个不等式，再取交集。画数轴时用实心点表示含端点（≤、≥），空心点表示不含（&lt;、&gt;）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：不等式像一条“分界线”，变形只是把线挪位置；乘负数相当于照镜子，左右顺序整个翻转。<\/p>\n<p><strong>失效边界<\/strong>：镜子比喻只说明方向翻转，不说明大小变化；乘负数后数值大小也变了。<\/p>\n<p><strong>实例<\/strong>：解 −2x+3&gt;7。 两边减 3：−2x&gt;4；两边除以 −2（负数，变号）：x&lt;−2。解集为 (−∞,−2)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 不等式两边可以随便乘同一个式子 —— 实际上 式子的符号未知时不能直接乘；必须讨论正负，或改用移项、通分。\n<\/li><li>\n别以为 乘以负数只是数值变了，方向不变 —— 实际上 负系数会把大小顺序整个翻转，所以必须变号；漏掉就得到相反的解集。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 a&gt;b，则下列一定成立的是：\n<\/li><li>\n解不等式 −3x≥6，解集是：\n<p>A. a²&gt;b² ｜ B. −2a&gt;−2b ｜ C. a−3&gt;b−3 ｜ D. 1/a&gt;1/b <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：两边同减 3 不变号，C 恒成立。A 在 a=1、b=−2 时不成立；B 应变为 −2a&lt;−2b；D 要求同号。 A. x≥−2 ｜ B. x≤−2 ｜ C. x≥2 ｜ D. x≤2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：两边除以 −3（负数），不等号反向：x≤−2。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na&gt;b ⇔ a−b&gt;0\n<\/li><li>\n乘除负数必须变号\n<\/li><li>\n不等式组取交集，实心点含端点\n<\/ul>", "ch02": "<h1>第 2 章：二次不等式与高次不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、因式分解\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用因式分解与符号表解一元二次不等式\n<\/li><li>\n用穿针引线法解高次不等式\n<\/li><li>\n正确处理含参数与重根情形\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>二次不等式的解集由“开口方向 + 零点位置”决定；高次不等式用数轴上的符号变化判断。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 二次不等式的标准解法<\/h3>\n<p>以 ax²+bx+c&gt;0（a&gt;0）为例：<\/p>\n<ol><li>\n求方程 ax²+bx+c=0 的根 x₁&lt;x₂（判别式 Δ）；\n<\/li><li>\n抛物线开口向上，两根之间为负、两根之外为正；\n<\/li><li>\n所以 &gt;0 的解集是 (−∞,x₁)∪(x₂,+∞)，&lt;0 的解集是 (x₁,x₂)。\n<\/ol>\n<p>口诀只是记忆辅助，真正的依据是抛物线图象。<\/p>\n<p>三种特殊情形：<\/p>\n<ul><li>\nΔ=0：抛物线与 x 轴相切，&gt;0 的解集是除顶点外的所有实数，&lt;0 无解；\n<\/li><li>\nΔ&lt;0 且 a&gt;0：整条抛物线在 x 轴上方，&gt;0 恒成立，&lt;0 无解；\n<\/li><li>\na&lt;0：先两边乘 −1 化成正系数，同时变号。\n<\/ul>\n<h3>2.2 高次不等式：穿针引线<\/h3>\n<p>把多项式分解成一次因式的乘积，把所有零点标在数轴上，从最右端开始画曲线，<strong>奇次根穿过、偶次根不穿<\/strong>，按区间符号写出解集。<\/p>\n<p>例：(x−1)(x−2)²(x+1)&gt;0。零点 −1（1 次）、1（1 次）、2（2 次）。曲线在 2 处不穿，在 1、−1 处穿过。<\/p>\n<h3>2.3 含参数要分类<\/h3>\n<p>含参数的二次不等式要按“首项系数是否为 0”“判别式符号”“两根大小”分层讨论，不能只写一种情形。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：符号表像一条“正负交替的带子”，每过一个奇次零点就翻一次面。<\/p>\n<p><strong>失效边界<\/strong>：穿针法要求因式都已分解到一次（或不可约二次）；未分解时零点不全，结论会错。<\/p>\n<p><strong>实例<\/strong>：解 x²−x−6&lt;0。 因式分解 (x−3)(x+2)&lt;0，零点 −2、3，开口向上，两根之间为负，解集 (−2,3)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 二次不等式一定有解 —— 实际上 Δ&lt;0 且开口向上时，&gt;0 恒成立、&lt;0 无解；并非所有形式都有非空解集。\n<\/li><li>\n别以为 重根也要穿过去 —— 实际上 偶次重根两侧符号相同，曲线不穿过，只是相切折返。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n不等式 x²−4x+3&lt;0 的解集是：\n<\/li><li>\n不等式 (x−2)²(x+1)&gt;0 的解集是：\n<p>A. (1,3) ｜ B. (−∞,1)∪(3,+∞) ｜ C. [1,3] ｜ D. (−3,−1) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：(x−1)(x−3)&lt;0，开口向上，两根之间为负，解集 (1,3)。 A. x&gt;−1 ｜ B. x&gt;−1 且 x≠2 ｜ C. x&lt;−1 ｜ D. 全体实数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：x=−1 处穿根、x=2 处偶次不穿；x&gt;−1 且 x≠2 时为正，x=−1 时为零。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二次不等式看开口与零点：开口向上，两根之外为正\n<\/li><li>\n高次不等式：奇穿偶不穿\n<\/li><li>\n含参数按首项系数、判别式、根大小分层\n<\/ul>", "ch03": "<h1>第 3 章：绝对值不等式与无理不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用几何意义解 |x| 型不等式\n<\/li><li>\n解 |ax+b|&lt;c、&gt;c 两类\n<\/li><li>\n先定定义域再解无理不等式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>绝对值是距离，无理不等式要先保证根号有意义，再平方——两步顺序不能颠倒。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 绝对值的几何意义<\/h3>\n<p>|x| 表示数轴上 x 到原点的距离。于是：<\/p>\n<ul><li>\n|x|&lt;a（a&gt;0）⇔ −a&lt;x&lt;a；\n<\/li><li>\n|x|&gt;a（a&gt;0）⇔ x&lt;−a 或 x&gt;a。\n<\/ul>\n<p>把 x 换成 x−c，就是“到 c 的距离”。<\/p>\n<h3>3.2 一般形式<\/h3>\n<p>|ax+b|&lt;c（c&gt;0）⇔ −c&lt;ax+b&lt;c；<\/p>\n<p>|ax+b|&gt;c（c&gt;0）⇔ ax+b&lt;−c 或 ax+b&gt;c。<\/p>\n<p>c≤0 时要单独看：|…|&lt;c 无解，|…|&gt;c 对使式子有意义的 x 恒成立（c&lt;0）或需排除零点（c=0）。<\/p>\n<h3>3.3 无理不等式的两步<\/h3>\n<p>第一步：定定义域（偶次根号下非负）。 第二步：两边平方，但只有在两边都非负时才等价。<\/p>\n<p>例：√(x+2)&lt;x。 定义域 x≥−2；右边要求 x&gt;0 才能平方（否则负数小于正根号一定成立，直接给出解）。 平方得 x+2&lt;x²，即 x²−x−2&gt;0，x&gt;2 或 x&lt;−1。结合 x&gt;0 与 x≥−2，得 x&gt;2。 还要单独检查 x∈[−2,0]：此时右边 ≤0，左边 ≥0，不等式不成立，故无解。合起来解集 (2,+∞)。<\/p>\n<h3>3.4 常见结构<\/h3>\n<ul><li>\n√A &lt; B：需要 B&gt;0 且 A&lt;B²，同时 A≥0；\n<\/li><li>\n√A &gt; B：分 B&lt;0（只需 A≥0）与 B≥0（A&gt;B²）两种。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：绝对值像“到某地的距离”，无理不等式像“先确认尺子能量，再比长度”。<\/p>\n<p><strong>失效边界<\/strong>：平方只保“非负”的大小关系；两边符号不明时平方会引入错误解。<\/p>\n<p><strong>实例<\/strong>：解 |2x−1|≤5。 −5≤2x−1≤5 ⇒ −4≤2x≤6 ⇒ −2≤x≤3。解集 [−2,3]。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 |x|&gt;a 就是 x&gt;a —— 实际上 漏了 x&lt;−a 这一支。绝对值大，可能是“很正的”也可能是“很负的”。\n<\/li><li>\n别以为 无理不等式直接平方就行 —— 实际上 必须先定定义域，并确认两边非负；否则平方会引入不满足原式的解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n不等式 |x−2|&lt;3 的解集是：\n<\/li><li>\n解 √(x−1)&lt;2 时，正确的第一步是：\n<p>A. (−1,5) ｜ B. (−5,−1) ｜ C. (2,5) ｜ D. (−∞,5) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：到 2 的距离小于 3，即 −3&lt;x−2&lt;3，得 −1&lt;x&lt;5。 A. 两边平方 ｜ B. 移项 ｜ C. 确定定义域 x≥1 ｜ D. 讨论 x 的正负 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：根号要求被开方数非负，先得 x≥1；再平方得 x−1&lt;4，即 x&lt;5，合起来 1≤x&lt;5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n|x−c|&lt;a ⇔ c−a&lt;x&lt;c+a\n<\/li><li>\n无理不等式：先定义域，再判断两边非负，最后平方\n<\/li><li>\n√A&lt;B 需 B&gt;0 且 A&lt;B²\n<\/ul>", "ch04": "<h1>第 4 章：不等式的证明<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用比较法（作差、作商）证明不等式\n<\/li><li>\n用综合法与分析法各写一段完整推理\n<\/li><li>\n正确使用基本不等式并说明等号条件\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>证明不等式就是证明“差非负”或“由已知不等式推过来”；分析法从结论倒着找条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 比较法<\/h3>\n<p>要证 A≥B，作差 A−B，证明它非负（配方、因式分解、判别式）。要证 A≥B&gt;0，也可作商 A/B 与 1 比较。<\/p>\n<p>例：证 a²+b²≥2ab。作差：a²−2ab+b²=(a−b)²≥0，等号当且仅当 a=b。<\/p>\n<h3>4.2 综合法<\/h3>\n<p>从已知成立的不等式出发，按“由因导果”的顺序推到结论。常用已知：基本不等式、|a|+|b|≥|a+b|、均值不等式。<\/p>\n<h3>4.3 分析法<\/h3>\n<p>从结论出发，寻找使它成立的充分条件，一直追到已知事实。书写时常用“要证……只需证……”，每一步都必须可逆或充分。<\/p>\n<p>例：证 √2+√7&lt;√3+√6。两边平方后比较 9+2√14 与 9+2√18，只需证 √14&lt;√18，显然成立。<\/p>\n<h3>4.4 基本不等式与等号条件<\/h3>\n<p>a²+b²≥2ab 对一切实数成立，等号当 a=b。<\/p>\n<p>对正数 a、b，有 (a+b)/2≥√(ab)，等号当 a=b。使用时必须确认 a、b 为正，并检查等号能否取到——取不到时只能得到严格不等式。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：比较法是“称重量”，综合法是“顺着链条推”，分析法是“从终点倒着找路”。<\/p>\n<p><strong>失效边界<\/strong>：分析法每步必须充分；把“只需”写成“等价”而不检查可逆，会证出假命题。<\/p>\n<p><strong>实例<\/strong>：证 对任意实数 x，x²+2x+3&gt;0。 配方：x²+2x+3=(x+1)²+2≥2&gt;0。等号取不到，故严格成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 用基本不等式不用检查等号条件 —— 实际上 等号条件决定不等式能否取到等值；取不到时结论仍是严格不等，但最值结论会变。\n<\/li><li>\n别以为 分析法可以随便写“只需证” —— 实际上 每一步必须真的充分；写成不充分的条件等于没有证明。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用比较法证明 a²+b²≥2ab 时，关键一步是：\n<\/li><li>\n对正数 a、b，等号成立的条件是：\n<p>A. 移项得 a²+b²−2ab≥0 ｜ B. 两边同除 2 ｜ C. 取 a=b=1 验证 ｜ D. 两边开方 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：作差后配方得 (a−b)²≥0，这是证明的核心；只代特殊值不算证明。 A. a=b ｜ B. a+b=0 ｜ C. ab=1 ｜ D. a=2b <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：(a+b)/2≥√(ab) 的等号当且仅当 a=b 时成立。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n比较法：作差判符号（可配方、因式分解）\n<\/li><li>\n分析法：从结论找充分条件，每步须充分\n<\/li><li>\n基本不等式使用前先确认正数与等号条件\n<\/ul>", "c01": "<h1>同解变形与变号<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>两边同乘负数，不等号反向；这一步错，整道题的解集就反了。<\/p>\n<h2>为什么重要<\/h2>\n<p>不等式解法全部由同解变形组成，变号是最容易出错也最容易检查的一步。<\/p>\n<h2>详解<\/h2>\n<p>允许的同解操作：移项、同乘除正数、同乘除负数并变号。禁止的操作：两边平方（除确定非负）、乘含未知数且符号不定的式子。检查办法：把解集端点代回原不等式，看是否恰好取到边界。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“乘以 −1 只是把式子反过来写”，忘了同时要变号。<\/p>\n<h2>相关概念<\/h2>\n<p>基本性质（ch01）、绝对值不等式（ch03）<\/p>", "c02": "<h1>符号表与穿针引线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把零点排在数轴上，按因式的次数决定穿或不穿，每一段的符号就定了。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是解二次、高次不等式的通用方法，比背口诀可靠。<\/p>\n<h2>详解<\/h2>\n<p>步骤：分解到一次因式 → 标零点 → 从最右段取一个测试点定符号 → 按奇穿偶不穿依次翻面 → 按不等号方向取区间。含参数时额外讨论首项系数与重根。<\/p>\n<h2>常见误解<\/h2>\n<p>把偶次重根也当穿过点，导致区间符号整体错位。<\/p>\n<h2>相关概念<\/h2>\n<p>二次不等式（ch02）、因式分解（《整式》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：性质与同解变形<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：不等式的性质与同解变形<\/a><br>检查点：能说明两边乘负数为什么要变号<\/li><li class='path-step' id='path-02'><strong>步骤 02：二次与高次不等式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：二次不等式与高次不等式<\/a><br>检查点：能用符号表写出解集<\/li><li class='path-step' id='path-03'><strong>步骤 03：绝对值与无理不等式<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：绝对值不等式与无理不等式<\/a><br>检查点：能先定定义域再解无理不等式<\/li><li class='path-step' id='path-04'><strong>步骤 04：不等式的证明<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：不等式的证明<\/a><br>检查点：能用比较法与综合法各证一题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q9.<\/b> 不等式 (x−1)(x+2)&gt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> (−2,1)<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> (−∞,−2)∪(1,+∞)<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> [−2,1]<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> (−∞,1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q10.<\/b> 若 a&gt;b，则下列一定成立的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> a²&gt;b²<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> a−c&gt;b−c<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> ac&gt;bc<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 1/a&lt;1/b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：不等式的性质与同解变形<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 若 a&gt;b，则下列一定成立的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> a²&gt;b²<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> −2a&gt;−2b<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> a−3&gt;b−3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 1/a&gt;1/b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 解不等式 −3x≥6，解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> x≥−2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> x≤−2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> x≥2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> x≤2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：二次不等式与高次不等式<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 不等式 x²−4x+3&lt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> (1,3)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> (−∞,1)∪(3,+∞)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> [1,3]<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> (−3,−1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 不等式 (x−2)²(x+1)&gt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> x&gt;−1<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> x&gt;−1 且 x≠2<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> x&lt;−1<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 全体实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：绝对值不等式与无理不等式<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 不等式 |x−2|&lt;3 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> (−1,5)<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> (−5,−1)<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> (2,5)<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> (−∞,5)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 解 √(x−1)&lt;2 时，正确的第一步是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 两边平方<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 移项<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 确定定义域 x≥1<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 讨论 x 的正负<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：不等式的证明<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 用比较法证明 a²+b²≥2ab 时，关键一步是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 移项得 a²+b²−2ab≥0<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 两边同除 2<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 取 a=b=1 验证<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 两边开方<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 对正数 a、b，等号成立的条件是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> a=b<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> a+b=0<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> ab=1<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> a=2b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='同解不等式'>同解不等式 — 解集完全相同的不等式。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='可乘性'>可乘性 — 两边同乘正数不变号、乘负数变号的性质。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='解集'>解集 — 使不等式成立的所有取值组成的集合。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='穿针引线法'>穿针引线法 — 按零点次数在数轴上交替取符号解高次不等式的方法。 <span class=glossary-ref>（第 2 章：二次不等式与高次不等式）<\/span><\/li><li data-term='重根'>重根 — 方程中重复出现的根，对应因式的幂次大于 1。 <span class=glossary-ref>（第 2 章：二次不等式与高次不等式）<\/span><\/li><li data-term='绝对值不等式'>绝对值不等式 — 含 |x| 或 |ax+b| 的不等式，按距离意义转化。 <span class=glossary-ref>（第 3 章：绝对值不等式与无理不等式）<\/span><\/li><li data-term='无理不等式'>无理不等式 — 根号内含有未知数的不等式。 <span class=glossary-ref>（第 3 章：绝对值不等式与无理不等式）<\/span><\/li><li data-term='比较法'>比较法 — 作差或作商判断大小的证明方法。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><li data-term='分析法'>分析法 — 从结论出发寻找充分条件的证明方法。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><li data-term='基本不等式'>基本不等式 — a²+b²≥2ab；(a+b)/2≥√(ab)（a,b&gt;0）。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：解不等式的四步<\/h2>\n<p>① 定定义域；② 移项整理成标准形；③ 求零点、画符号表；④ 按不等号方向取区间并检查端点。<\/p>\n<h2>框架：证明的三选一<\/h2>\n<p>结构简单作差；已知不等式多则综合；结论复杂则分析。选错方法会绕远路。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>乘负数<\/td><td>不等号反向<\/td><\/tr><tr><td>二次不等式 a&gt;0<\/td><td>&gt;0 取两根之外，&lt;0 取两根之间<\/td><\/tr><tr><td>高次不等式<\/td><td>奇穿偶不穿，从最右段定符号<\/td><\/tr><tr><td>绝对值<\/td><td><\/td><td>x<\/td><td>&lt;a ⇔ −a&lt;x&lt;a；<\/td><td>x<\/td><td>&gt;a ⇔ x&lt;−a 或 x&gt;a<\/td><\/tr><tr><td>无理不等式<\/td><td>先定义域，再判两边非负，最后平方<\/td><\/tr><tr><td>基本不等式<\/td><td>a²+b²≥2ab；等号 a=b<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
