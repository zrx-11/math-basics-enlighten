d": "ch04", "front": "「第 4 章：不等式的证明」的一句话核心是什么？", "back": "证明不等式就是证明“差非负”或“由已知不等式推过来”；分析法从结论倒着找条件。", "tags": ["inequalities", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「同解不等式」？", "back": "解集完全相同的不等式。", "tags": ["inequalities", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「可乘性」？", "back": "两边同乘正数不变号、乘负数变号的性质。", "tags": ["inequalities", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「解集」？", "back": "使不等式成立的所有取值组成的集合。", "tags": ["inequalities", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「穿针引线法」？", "back": "按零点次数在数轴上交替取符号解高次不等式的方法。", "tags": ["inequalities", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「重根」？", "back": "方程中重复出现的根，对应因式的幂次大于 1。", "tags": ["inequalities", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「绝对值不等式」？", "back": "含 |x| 或 |ax+b| 的不等式，按距离意义转化。", "tags": ["inequalities", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「无理不等式」？", "back": "根号内含有未知数的不等式。", "tags": ["inequalities", "术语"]}, {"id": "f12", "chapterId": "ch04", "front": "什么是「比较法」？", "back": "作差或作商判断大小的证明方法。", "tags": ["inequalities", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「分析法」？", "back": "从结论出发寻找充分条件的证明方法。", "tags": ["inequalities", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「基本不等式」？", "back": "a²+b²≥2ab；(a+b)/2≥√(ab)（a,b>0）。", "tags": ["inequalities", "术语"]}], "companion": "inequalities学习伴侣.html", "deriv": "inequalities从零推导.html"}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">实数比较大小、四则运算<\/span><\/div><h1>第 1 章：不等式的性质与同解变形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：实数比较大小、四则运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 a−b 的符号判断大小\n<\/li><li>\n正确使用四条基本性质\n<\/li><li>\n判断两个不等式是否同解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>不等式只有一条铁律：两边同乘（除）一个负数，不等号方向必须反过来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 比较大小的本质<\/h3>\n<p>a&gt;b 等价于 a−b&gt;0。所以比较两个数，就是判断它们的差是正、负还是零。这一条把“比大小”变成了“做减法”，是所有不等式证明的起点。<\/p>\n<h3>1.2 四条基本性质<\/h3>\n<ol><li>\n<strong>传递性<\/strong>：a&gt;b、b&gt;c ⇒ a&gt;c；\n<\/li><li>\n<strong>可加性<\/strong>：a&gt;b ⇒ a+c&gt;b+c；\n<\/li><li>\n<strong>可乘性<\/strong>：a&gt;b、c&gt;0 ⇒ ac&gt;bc；a&gt;b、c&lt;0 ⇒ ac&lt;bc（<strong>变号<\/strong>）；\n<\/li><li>\n<strong>倒数<\/strong>：a&gt;b&gt;0 ⇒ 1/a&lt;1/b（正数取倒数要变号）。\n<\/ol>\n<p>可乘性是最容易出错的一条。c 的符号不确定时，不能直接乘，必须分 c&gt;0、c=0、c&lt;0 讨论。<\/p>\n<h3>1.3 同解变形<\/h3>\n<p>同解指两个不等式解集完全相同。允许的操作：<\/p>\n<ul><li>\n移项（两边同加同一个数）；\n<\/li><li>\n两边同乘（除）同一个正数；\n<\/li><li>\n两边同乘（除）同一个负数，同时把不等号反向。\n<\/ul>\n<p>不允许：两边平方（除非确定两边都非负）、两边乘含未知数的式子（符号不定）。<\/p>\n<h3>1.4 一元一次不等式组<\/h3>\n<p>分别解每个不等式，再取交集。画数轴时用实心点表示含端点（≤、≥），空心点表示不含（&lt;、&gt;）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：不等式像一条“分界线”，变形只是把线挪位置；乘负数相当于照镜子，左右顺序整个翻转。<\/p>\n<p><strong>失效边界<\/strong>：镜子比喻只说明方向翻转，不说明大小变化；乘负数后数值大小也变了。<\/p>\n<p><strong>实例<\/strong>：解 −2x+3&gt;7。 两边减 3：−2x&gt;4；两边除以 −2（负数，变号）：x&lt;−2。解集为 (−∞,−2)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 不等式两边可以随便乘同一个式子 —— 实际上 式子的符号未知时不能直接乘；必须讨论正负，或改用移项、通分。\n<\/li><li>\n别以为 乘以负数只是数值变了，方向不变 —— 实际上 负系数会把大小顺序整个翻转，所以必须变号；漏掉就得到相反的解集。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 a&gt;b，则下列一定成立的是：\n<\/li><li>\n解不等式 −3x≥6，解集是：\n<p>A. a²&gt;b² ｜ B. −2a&gt;−2b ｜ C. a−3&gt;b−3 ｜ D. 1/a&gt;1/b <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：两边同减 3 不变号，C 恒成立。A 在 a=1、b=−2 时不成立；B 应变为 −2a&lt;−2b；D 要求同号。 A. x≥−2 ｜ B. x≤−2 ｜ C. x≥2 ｜ D. x≤2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：两边除以 −3（负数），不等号反向：x≤−2。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na&gt;b ⇔ a−b&gt;0\n<\/li><li>\n乘除负数必须变号\n<\/li><li>\n不等式组取交集，实心点含端点\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：不等式的性质与同解变形）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：不等式的性质与同解变形<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>不等式的性质不是新公理，全部可以由“差的正负”推出来。下面把可乘性为什么变号写清楚。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>a&gt;b 指 a−b&gt;0；不等式两边同乘负数后方向反转，是“差”的符号被翻转的结果。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>不等式像天平的倾斜方向；两边同时“取反”（乘 −1），倾斜方向就调个头。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 定义<\/h3>\n<div class=\"katex-block\">a>b\\iff a-b>0<\/div>\n<p>把比较化为差的正负，后面所有性质都从这里出发。<\/p>\n<h3>2. 可加性<\/h3>\n<div class=\"katex-block\">a>b\\ \\Rightarrow\\ (a+c)-(b+c)=a-b>0<\/div>\n<p>两边加同一个数，差不变，所以不等号不变。<\/p>\n<h3>3. 乘正数<\/h3>\n<div class=\"katex-block\">a>b,\\ c>0\\ \\Rightarrow\\ ac-bc=c(a-b)>0<\/div>\n<p>正数乘正差仍为正，方向不变。<\/p>\n<h3>4. 乘负数<\/h3>\n<div class=\"katex-block\">a>b,\\ c<0\\ \\Rightarrow\\ ac-bc=c(a-b)<0\\ \\Rightarrow\\ ac&lt;bc<\/div>\n<p>负数乘正差变成负差，方向反转。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>乘的式子必须是确定的常数；含未知数时符号不定，不能直接乘。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《不等式》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 1 章：不等式的性质与同解变形"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：不等式的性质与同解变形<\/a><\/span><\/div><h1>第 2 章：二次不等式与高次不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、因式分解\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用因式分解与符号表解一元二次不等式\n<\/li><li>\n用穿针引线法解高次不等式\n<\/li><li>\n正确处理含参数与重根情形\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>二次不等式的解集由“开口方向 + 零点位置”决定；高次不等式用数轴上的符号变化判断。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 二次不等式的标准解法<\/h3>\n<p>以 ax²+bx+c&gt;0（a&gt;0）为例：<\/p>\n<ol><li>\n求方程 ax²+bx+c=0 的根 x₁&lt;x₂（判别式 Δ）；\n<\/li><li>\n抛物线开口向上，两根之间为负、两根之外为正；\n<\/li><li>\n所以 &gt;0 的解集是 (−∞,x₁)∪(x₂,+∞)，&lt;0 的解集是 (x₁,x₂)。\n<\/ol>\n<p>口诀只是记忆辅助，真正的依据是抛物线图象。<\/p>\n<p>三种特殊情形：<\/p>\n<ul><li>\nΔ=0：抛物线与 x 轴相切，&gt;0 的解集是除顶点外的所有实数，&lt;0 无解；\n<\/li><li>\nΔ&lt;0 且 a&gt;0：整条抛物线在 x 轴上方，&gt;0 恒成立，&lt;0 无解；\n<\/li><li>\na&lt;0：先两边乘 −1 化成正系数，同时变号。\n<\/ul>\n<h3>2.2 高次不等式：穿针引线<\/h3>\n<p>把多项式分解成一次因式的乘积，把所有零点标在数轴上，从最右端开始画曲线，<strong>奇次根穿过、偶次根不穿<\/strong>，按区间符号写出解集。<\/p>\n<p>例：(x−1)(x−2)²(x+1)&gt;0。零点 −1（1 次）、1（1 次）、2（2 次）。曲线在 2 处不穿，在 1、−1 处穿过。<\/p>\n<h3>2.3 含参数要分类<\/h3>\n<p>含参数的二次不等式要按“首项系数是否为 0”“判别式符号”“两根大小”分层讨论，不能只写一种情形。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：符号表像一条“正负交替的带子”，每过一个奇次零点就翻一次面。<\/p>\n<p><strong>失效边界<\/strong>：穿针法要求因式都已分解到一次（或不可约二次）；未分解时零点不全，结论会错。<\/p>\n<p><strong>实例<\/strong>：解 x²−x−6&lt;0。 因式分解 (x−3)(x+2)&lt;0，零点 −2、3，开口向上，两根之间为负，解集 (−2,3)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 二次不等式一定有解 —— 实际上 Δ&lt;0 且开口向上时，&gt;0 恒成立、&lt;0 无解；并非所有形式都有非空解集。\n<\/li><li>\n别以为 重根也要穿过去 —— 实际上 偶次重根两侧符号相同，曲线不穿过，只是相切折返。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n不等式 x²−4x+3&lt;0 的解集是：\n<\/li><li>\n不等式 (x−2)²(x+1)&gt;0 的解集是：\n<p>A. (1,3) ｜ B. (−∞,1)∪(3,+∞) ｜ C. [1,3] ｜ D. (−3,−1) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：(x−1)(x−3)&lt;0，开口向上，两根之间为负，解集 (1,3)。 A. x&gt;−1 ｜ B. x&gt;−1 且 x≠2 ｜ C. x&lt;−1 ｜ D. 全体实数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：x=−1 处穿根、x=2 处偶次不穿；x&gt;−1 且 x≠2 时为正，x=−1 时为零。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二次不等式看开口与零点：开口向上，两根之外为正\n<\/li><li>\n高次不等式：奇穿偶不穿\n<\/li><li>\n含参数按首项系数、判别式、根大小分层\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：二次不等式与高次不等式）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：二次不等式与高次不等式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>二次不等式的解集不是背出来的，是从抛物线图象读出来的。下面把“开口 + 零点”写成符号表。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>二次不等式指形如 ax²+bx+c&gt;0（或 &lt;0、≥0、≤0）的不等式，a≠0。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>抛物线像一座拱桥：桥面在 x 轴上方的部分，就是 &gt;0 的解集。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 求零点<\/h3>\n<div class=\"katex-block\">ax^{2}+bx+c=0\\ \\Rightarrow\\ x_{1,2}=\\frac{-b\\pm\\sqrt{\\Delta}}{2a}<\/div>\n<p>零点把数轴分成若干段，每段符号恒定。<\/p>\n<h3>2. 符号表<\/h3>\n<div class=\"katex-block\">a>0,\\ x&lt;x_{1}\\ \\text{或}\\ x>x_{2}\\ \\Rightarrow\\ ax^{2}+bx+c>0<\/div>\n<p>开口向上时，两根之外为正、两根之间为负。<\/p>\n<h3>3. 重根<\/h3>\n<div class=\"katex-block\">\\Delta=0\\ \\Rightarrow\\ ax^{2}+bx+c=a(x-x_{0})^{2}\\ge 0<\/div>\n<p>重根处只是相切，符号不翻转。<\/p>\n<h3>4. 高次穿针<\/h3>\n<div class=\"katex-block\">(x-x_{1})^{m_1}\\cdots(x-x_{k})^{m_k}<\/div>\n<p>奇次幂的零点穿过，偶次幂的零点不穿，从最右段开始定符号。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>若 a&lt;0，桥是倒扣的，先乘 −1 转正再判断；重根时桥与轴相切，不跨越。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《不等式》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 2 章：二次不等式与高次不等式"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：二次不等式与高次不等式<\/a><\/span><\/div><h1>第 3 章：绝对值不等式与无理不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用几何意义解 |x| 型不等式\n<\/li><li>\n解 |ax+b|&lt;c、&gt;c 两类\n<\/li><li>\n先定定义域再解无理不等式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>绝对值是距离，无理不等式要先保证根号有意义，再平方——两步顺序不能颠倒。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 绝对值的几何意义<\/h3>\n<p>|x| 表示数轴上 x 到原点的距离。于是：<\/p>\n<ul><li>\n|x|&lt;a（a&gt;0）⇔ −a&lt;x&lt;a；\n<\/li><li>\n|x|&gt;a（a&gt;0）⇔ x&lt;−a 或 x&gt;a。\n<\/ul>\n<p>把 x 换成 x−c，就是“到 c 的距离”。<\/p>\n<h3>3.2 一般形式<\/h3>\n<p>|ax+b|&lt;c（c&gt;0）⇔ −c&lt;ax+b&lt;c；<\/p>\n<p>|ax+b|&gt;c（c&gt;0）⇔ ax+b&lt;−c 或 ax+b&gt;c。<\/p>\n<p>c≤0 时要单独看：|…|&lt;c 无解，|…|&gt;c 对使式子有意义的 x 恒成立（c&lt;0）或需排除零点（c=0）。<\/p>\n<h3>3.3 无理不等式的两步<\/h3>\n<p>第一步：定定义域（偶次根号下非负）。 第二步：两边平方，但只有在两边都非负时才等价。<\/p>\n<p>例：√(x+2)&lt;x。 定义域 x≥−2；右边要求 x&gt;0 才能平方（否则负数小于正根号一定成立，直接给出解）。 平方得 x+2&lt;x²，即 x²−x−2&gt;0，x&gt;2 或 x&lt;−1。结合 x&gt;0 与 x≥−2，得 x&gt;2。 还要单独检查 x∈[−2,0]：此时右边 ≤0，左边 ≥0，不等式不成立，故无解。合起来解集 (2,+∞)。<\/p>\n<h3>3.4 常见结构<\/h3>\n<ul><li>\n√A &lt; B：需要 B&gt;0 且 A&lt;B²，同时 A≥0；\n<\/li><li>\n√A &gt; B：分 B&lt;0（只需 A≥0）与 B≥0（A&gt;B²）两种。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：绝对值像“到某地的距离”，无理不等式像“先确认尺子能量，再比长度”。<\/p>\n<p><strong>失效边界<\/strong>：平方只保“非负”的大小关系；两边符号不明时平方会引入错误解。<\/p>\n<p><strong>实例<\/strong>：解 |2x−1|≤5。 −5≤2x−1≤5 ⇒ −4≤2x≤6 ⇒ −2≤x≤3。解集 [−2,3]。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 |x|&gt;a 就是 x&gt;a —— 实际上 漏了 x&lt;−a 这一支。绝对值大，可能是“很正的”也可能是“很负的”。\n<\/li><li>\n别以为 无理不等式直接平方就行 —— 实际上 必须先定定义域，并确认两边非负；否则平方会引入不满足原式的解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n不等式 |x−2|&lt;3 的解集是：\n<\/li><li>\n解 √(x−1)&lt;2 时，正确的第一步是：\n<p>A. (−1,5) ｜ B. (−5,−1) ｜ C. (2,5) ｜ D. (−∞,5) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：到 2 的距离小于 3，即 −3&lt;x−2&lt;3，得 −1&lt;x&lt;5。 A. 两边平方 ｜ B. 移项 ｜ C. 确定定义域 x≥1 ｜ D. 讨论 x 的正负 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：根号要求被开方数非负，先得 x≥1；再平方得 x−1&lt;4，即 x&lt;5，合起来 1≤x&lt;5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n|x−c|&lt;a ⇔ c−a&lt;x&lt;c+a\n<\/li><li>\n无理不等式：先定义域，再判断两边非负，最后平方\n<\/li><li>\n√A&lt;B 需 B&gt;0 且 A&lt;B²\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：绝对值不等式与无理不等式）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：绝对值不等式与无理不等式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>绝对值是距离，无理式是长度；两类不等式的共同点是“先弄清什么范围内式子有意义”。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>|x| 表示 x 到原点的距离；无理不等式指含根号且根号内有未知数的不等式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>绝对值像问“离车站多远”，不问方向；无理不等式像先确认尺子能测量，再比较长短。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 绝对值基本型<\/h3>\n<div class=\"katex-block\">|x|&lt;a\\iff -a&lt;x&lt;a\\quad(a>0)<\/div>\n<p>距离小于 a，就是落在 −a 与 a 之间。<\/p>\n<h3>2. 补集型<\/h3>\n<div class=\"katex-block\">|x|>a\\iff x<-a\\ \\text{或}\\ x>a<\/div>\n<p>距离大于 a，向两边各跑出去一支。<\/p>\n<h3>3. 无理式定义域<\/h3>\n<div class=\"katex-block\">\\sqrt{A(x)}\\ \\text{有意义}\\iff A(x)\\ge 0<\/div>\n<p>这是所有无理不等式的第一步，先于任何变形。<\/p>\n<h3>4. 平方的条件<\/h3>\n<div class=\"katex-block\">\\sqrt{A}&lt;B\\iff B>0\\ \\text{且}\\ A&lt;B^{2}\\ (A\\ge 0)<\/div>\n<p>右边为负时不等式不可能成立，不需平方。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>平方等价只在两边非负时成立；否则要把负的一支单独讨论。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《不等式》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 3 章：绝对值不等式与无理不等式"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：绝对值不等式与无理不等式<\/a><\/span><\/div><h1>第 4 章：不等式的证明<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用比较法（作差、作商）证明不等式\n<\/li><li>\n用综合法与分析法各写一段完整推理\n<\/li><li>\n正确使用基本不等式并说明等号条件\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>证明不等式就是证明“差非负”或“由已知不等式推过来”；分析法从结论倒着找条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 比较法<\/h3>\n<p>要证 A≥B，作差 A−B，证明它非负（配方、因式分解、判别式）。要证 A≥B&gt;0，也可作商 A/B 与 1 比较。<\/p>\n<p>例：证 a²+b²≥2ab。作差：a²−2ab+b²=(a−b)²≥0，等号当且仅当 a=b。<\/p>\n<h3>4.2 综合法<\/h3>\n<p>从已知成立的不等式出发，按“由因导果”的顺序推到结论。常用已知：基本不等式、|a|+|b|≥|a+b|、均值不等式。<\/p>\n<h3>4.3 分析法<\/h3>\n<p>从结论出发，寻找使它成立的充分条件，一直追到已知事实。书写时常用“要证……只需证……”，每一步都必须可逆或充分。<\/p>\n<p>例：证 √2+√7&lt;√3+√6。两边平方后比较 9+2√14 与 9+2√18，只需证 √14&lt;√18，显然成立。<\/p>\n<h3>4.4 基本不等式与等号条件<\/h3>\n<p>a²+b²≥2ab 对一切实数成立，等号当 a=b。<\/p>\n<p>对正数 a、b，有 (a+b)/2≥√(ab)，等号当 a=b。使用时必须确认 a、b 为正，并检查等号能否取到——取不到时只能得到严格不等式。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：比较法是“称重量”，综合法是“顺着链条推”，分析法是“从终点倒着找路”。<\/p>\n<p><strong>失效边界<\/strong>：分析法每步必须充分；把“只需”写成“等价”而不检查可逆，会证出假命题。<\/p>\n<p><strong>实例<\/strong>：证 对任意实数 x，x²+2x+3&gt;0。 配方：x²+2x+3=(x+1)²+2≥2&gt;0。等号取不到，故严格成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 用基本不等式不用检查等号条件 —— 实际上 等号条件决定不等式能否取到等值；取不到时结论仍是严格不等，但最值结论会变。\n<\/li><li>\n别以为 分析法可以随便写“只需证” —— 实际上 每一步必须真的充分；写成不充分的条件等于没有证明。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用比较法证明 a²+b²≥2ab 时，关键一步是：\n<\/li><li>\n对正数 a、b，等号成立的条件是：\n<p>A. 移项得 a²+b²−2ab≥0 ｜ B. 两边同除 2 ｜ C. 取 a=b=1 验证 ｜ D. 两边开方 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：作差后配方得 (a−b)²≥0，这是证明的核心；只代特殊值不算证明。 A. a=b ｜ B. a+b=0 ｜ C. ab=1 ｜ D. a=2b <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：(a+b)/2≥√(ab) 的等号当且仅当 a=b 时成立。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n比较法：作差判符号（可配方、因式分解）\n<\/li><li>\n分析法：从结论找充分条件，每步须充分\n<\/li><li>\n基本不等式使用前先确认正数与等号条件\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：不等式的证明）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：不等式的证明<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>证明不等式的全部工具只有两类：把差变成显然非负的东西，或把已知不等式当积木搭上去。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>证明 A≥B 成立，即证明 A−B≥0 对范围内一切取值成立。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>比较法像把两堆货物放上天平，看指针偏向哪边；配方法就是把货物摆成一看就知道哪边重。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 比较法<\/h3>\n<div class=\"katex-block\">A\\ge B\\iff A-B\\ge 0<\/div>\n<p>证明不等式就是证明差非负，形式与解不等式一致。<\/p>\n<h3>2. 配方<\/h3>\n<div class=\"katex-block\">a^{2}+b^{2}-2ab=(a-b)^{2}\\ge 0<\/div>\n<p>把差写成完全平方，非负性一目了然，等号当 a=b。<\/p>\n<h3>3. 基本不等式<\/h3>\n<div class=\"katex-block\">\\frac{a+b}{2}\\ge\\sqrt{ab}\\quad(a,b>0)<\/div>\n<p>由 (√a−√b)²≥0 推出，等号当 a=b。<\/p>\n<h3>4. 分析法<\/h3>\n<div class=\"katex-block\">\\text{要证 }P\\ \\Leftarrow\\ \\text{只需 }Q,\\ Q\\ \\text{已知成立}<\/div>\n<p>从结论倒推充分条件，书写时每步都要真的充分。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>配方、因式分解只在实系数范围内可靠；涉及复数时“非负”失去意义。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《不等式》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 4 章：不等式的证明"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：不等式的性质与同解变形<\/a><\/span><\/div><h1>同解变形与变号<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>两边同乘负数，不等号反向；这一步错，整道题的解集就反了。<\/p>\n<h2>为什么重要<\/h2>\n<p>不等式解法全部由同解变形组成，变号是最容易出错也最容易检查的一步。<\/p>\n<h2>详解<\/h2>\n<p>允许的同解操作：移项、同乘除正数、同乘除负数并变号。禁止的操作：两边平方（除确定非负）、乘含未知数且符号不定的式子。检查办法：把解集端点代回原不等式，看是否恰好取到边界。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“乘以 −1 只是把式子反过来写”，忘了同时要变号。<\/p>\n<h2>相关概念<\/h2>\n<p>基本性质（ch01）、绝对值不等式（ch03）<\/p>", "kind": "concept", "title": "同解变形与变号"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：二次不等式与高次不等式<\/a><\/span><\/div><h1>符号表与穿针引线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把零点排在数轴上，按因式的次数决定穿或不穿，每一段的符号就定了。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是解二次、高次不等式的通用方法，比背口诀可靠。<\/p>\n<h2>详解<\/h2>\n<p>步骤：分解到一次因式 → 标零点 → 从最右段取一个测试点定符号 → 按奇穿偶不穿依次翻面 → 按不等号方向取区间。含参数时额外讨论首项系数与重根。<\/p>\n<h2>常见误解<\/h2>\n<p>把偶次重根也当穿过点，导致区间符号整体错位。<\/p>\n<h2>相关概念<\/h2>\n<p>二次不等式（ch02）、因式分解（《整式》）<\/p>", "kind": "concept", "title": "符号表与穿针引线"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：性质与同解变形<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：不等式的性质与同解变形<\/a><br>检查点：能说明两边乘负数为什么要变号<\/li><li class='path-step' id='path-02'><strong>步骤 02：二次与高次不等式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：二次不等式与高次不等式<\/a><br>检查点：能用符号表写出解集<\/li><li class='path-step' id='path-03'><strong>步骤 03：绝对值与无理不等式<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：绝对值不等式与无理不等式<\/a><br>检查点：能先定定义域再解无理不等式<\/li><li class='path-step' id='path-04'><strong>步骤 04：不等式的证明<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：不等式的证明<\/a><br>检查点：能用比较法与综合法各证一题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q09' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q9.<\/b> 不等式 (x−1)(x+2)&gt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> (−2,1)<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> (−∞,−2)∪(1,+∞)<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> [−2,1]<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> (−∞,1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q10.<\/b> 若 a&gt;b，则下列一定成立的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> a²&gt;b²<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> a−c&gt;b−c<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> ac&gt;bc<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 1/a&lt;1/b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：不等式的性质与同解变形<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 若 a&gt;b，则下列一定成立的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> a²&gt;b²<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> −2a&gt;−2b<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> a−3&gt;b−3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 1/a&gt;1/b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 解不等式 −3x≥6，解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> x≥−2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> x≤−2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> x≥2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> x≤2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：二次不等式与高次不等式<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 不等式 x²−4x+3&lt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> (1,3)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> (−∞,1)∪(3,+∞)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> [1,3]<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> (−3,−1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 不等式 (x−2)²(x+1)&gt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> x&gt;−1<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> x&gt;−1 且 x≠2<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> x&lt;−1<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 全体实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：绝对值不等式与无理不等式<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 不等式 |x−2|&lt;3 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> (−1,5)<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> (−5,−1)<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> (2,5)<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> (−∞,5)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 解 √(x−1)&lt;2 时，正确的第一步是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 两边平方<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 移项<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 确定定义域 x≥1<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 讨论 x 的正负<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：不等式的证明<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 用比较法证明 a²+b²≥2ab 时，关键一步是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 移项得 a²+b²−2ab≥0<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 两边同除 2<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 取 a=b=1 验证<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 两边开方<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 对正数 a、b，等号成立的条件是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> a=b<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> a+b=0<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> ab=1<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> a=2b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='同解不等式'>同解不等式 — 解集完全相同的不等式。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='可乘性'>可乘性 — 两边同乘正数不变号、乘负数变号的性质。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='解集'>解集 — 使不等式成立的所有取值组成的集合。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='穿针引线法'>穿针引线法 — 按零点次数在数轴上交替取符号解高次不等式的方法。 <span class=glossary-ref>（第 2 章：二次不等式与高次不等式）<\/span><\/li><li data-term='重根'>重根 — 方程中重复出现的根，对应因式的幂次大于 1。 <span class=glossary-ref>（第 2 章：二次不等式与高次不等式）<\/span><\/li><li data-term='绝对值不等式'>绝对值不等式 — 含 |x| 或 |ax+b| 的不等式，按距离意义转化。 <span class=glossary-ref>（第 3 章：绝对值不等式与无理不等式）<\/span><\/li><li data-term='无理不等式'>无理不等式 — 根号内含有未知数的不等式。 <span class=glossary-ref>（第 3 章：绝对值不等式与无理不等式）<\/span><\/li><li data-term='比较法'>比较法 — 作差或作商判断大小的证明方法。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><li data-term='分析法'>分析法 — 从结论出发寻找充分条件的证明方法。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><li data-term='基本不等式'>基本不等式 — a²+b²≥2ab；(a+b)/2≥√(ab)（a,b&gt;0）。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：解不等式的四步<\/h2>\n<p>① 定定义域；② 移项整理成标准形；③ 求零点、画符号表；④ 按不等号方向取区间并检查端点。<\/p>\n<h2>框架：证明的三选一<\/h2>\n<p>结构简单作差；已知不等式多则综合；结论复杂则分析。选错方法会绕远路。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>乘负数<\/td><td>不等号反向<\/td><\/tr><tr><td>二次不等式 a&gt;0<\/td><td>&gt;0 取两根之外，&lt;0 取两根之间<\/td><\/tr><tr><td>高次不等式<\/td><td>奇穿偶不穿，从最右段定符号<\/td><\/tr><tr><td>绝对值<\/td><td><\/td><td>x<\/td><td>&lt;a ⇔ −a&lt;x&lt;a；<\/td><td>x<\/td><td>&gt;a ⇔ x&lt;−a 或 x&gt;a<\/td><\/tr><tr><td>无理不等式<\/td><td>先定义域，再判两边非负，最后平方<\/td><\/tr><tr><td>基本不等式<\/td><td>a²+b²≥2ab；等号 a=b<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/05-不等式", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：不等式的性质与同解变形", "href": "#/chapter/ch01"}, {"label": "第 2 章：二次不等式与高次不等式", "href": "#/chapter/ch02"}, {"label": "第 3 章：绝对值不等式与无理不等式", "href": "#/chapter/ch03"}, {"label": "第 4 章：不等式的证明", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "同解变形与变号", "href": "#/concept/c01"}, {"label": "符号表与穿针引线", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：不等式的性质与同解变形", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：二次不等式与高次不等式", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：绝对值不等式与无理不等式", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：不等式的证明", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">实数比较大小、四则运算<\/span><\/div><h1>第 1 章：不等式的性质与同解变形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：实数比较大小、四则运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 a−b 的符号判断大小\n<\/li><li>\n正确使用四条基本性质\n<\/li><li>\n判断两个不等式是否同解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>不等式只有一条铁律：两边同乘（除）一个负数，不等号方向必须反过来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 比较大小的本质<\/h3>\n<p>a&gt;b 等价于 a−b&gt;0。所以比较两个数，就是判断它们的差是正、负还是零。这一条把“比大小”变成了“做减法”，是所有不等式证明的起点。<\/p>\n<h3>1.2 四条基本性质<\/h3>\n<ol><li>\n<strong>传递性<\/strong>：a&gt;b、b&gt;c ⇒ a&gt;c；\n<\/li><li>\n<strong>可加性<\/strong>：a&gt;b ⇒ a+c&gt;b+c；\n<\/li><li>\n<strong>可乘性<\/strong>：a&gt;b、c&gt;0 ⇒ ac&gt;bc；a&gt;b、c&lt;0 ⇒ ac&lt;bc（<strong>变号<\/strong>）；\n<\/li><li>\n<strong>倒数<\/strong>：a&gt;b&gt;0 ⇒ 1/a&lt;1/b（正数取倒数要变号）。\n<\/ol>\n<p>可乘性是最容易出错的一条。c 的符号不确定时，不能直接乘，必须分 c&gt;0、c=0、c&lt;0 讨论。<\/p>\n<h3>1.3 同解变形<\/h3>\n<p>同解指两个不等式解集完全相同。允许的操作：<\/p>\n<ul><li>\n移项（两边同加同一个数）；\n<\/li><li>\n两边同乘（除）同一个正数；\n<\/li><li>\n两边同乘（除）同一个负数，同时把不等号反向。\n<\/ul>\n<p>不允许：两边平方（除非确定两边都非负）、两边乘含未知数的式子（符号不定）。<\/p>\n<h3>1.4 一元一次不等式组<\/h3>\n<p>分别解每个不等式，再取交集。画数轴时用实心点表示含端点（≤、≥），空心点表示不含（&lt;、&gt;）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：不等式像一条“分界线”，变形只是把线挪位置；乘负数相当于照镜子，左右顺序整个翻转。<\/p>\n<p><strong>失效边界<\/strong>：镜子比喻只说明方向翻转，不说明大小变化；乘负数后数值大小也变了。<\/p>\n<p><strong>实例<\/strong>：解 −2x+3&gt;7。 两边减 3：−2x&gt;4；两边除以 −2（负数，变号）：x&lt;−2。解集为 (−∞,−2)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 不等式两边可以随便乘同一个式子 —— 实际上 式子的符号未知时不能直接乘；必须讨论正负，或改用移项、通分。\n<\/li><li>\n别以为 乘以负数只是数值变了，方向不变 —— 实际上 负系数会把大小顺序整个翻转，所以必须变号；漏掉就得到相反的解集。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 a&gt;b，则下列一定成立的是：\n<\/li><li>\n解不等式 −3x≥6，解集是：\n<p>A. a²&gt;b² ｜ B. −2a&gt;−2b ｜ C. a−3&gt;b−3 ｜ D. 1/a&gt;1/b <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：两边同减 3 不变号，C 恒成立。A 在 a=1、b=−2 时不成立；B 应变为 −2a&lt;−2b；D 要求同号。 A. x≥−2 ｜ B. x≤−2 ｜ C. x≥2 ｜ D. x≤2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：两边除以 −3（负数），不等号反向：x≤−2。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na&gt;b ⇔ a−b&gt;0\n<\/li><li>\n乘除负数必须变号\n<\/li><li>\n不等式组取交集，实心点含端点\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：不等式的性质与同解变形）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：不等式的性质与同解变形<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>不等式的性质不是新公理，全部可以由“差的正负”推出来。下面把可乘性为什么变号写清楚。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>a&gt;b 指 a−b&gt;0；不等式两边同乘负数后方向反转，是“差”的符号被翻转的结果。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>不等式像天平的倾斜方向；两边同时“取反”（乘 −1），倾斜方向就调个头。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 定义<\/h3>\n<div class=\"katex-block\">a>b\\iff a-b>0<\/div>\n<p>把比较化为差的正负，后面所有性质都从这里出发。<\/p>\n<h3>2. 可加性<\/h3>\n<div class=\"katex-block\">a>b\\ \\Rightarrow\\ (a+c)-(b+c)=a-b>0<\/div>\n<p>两边加同一个数，差不变，所以不等号不变。<\/p>\n<h3>3. 乘正数<\/h3>\n<div class=\"katex-block\">a>b,\\ c>0\\ \\Rightarrow\\ ac-bc=c(a-b)>0<\/div>\n<p>正数乘正差仍为正，方向不变。<\/p>\n<h3>4. 乘负数<\/h3>\n<div class=\"katex-block\">a>b,\\ c<0\\ \\Rightarrow\\ ac-bc=c(a-b)<0\\ \\Rightarrow\\ ac&lt;bc<\/div>\n<p>负数乘正差变成负差，方向反转。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>乘的式子必须是确定的常数；含未知数时符号不定，不能直接乘。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《不等式》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：不等式的性质与同解变形<\/a><\/span><\/div><h1>第 2 章：二次不等式与高次不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、因式分解\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用因式分解与符号表解一元二次不等式\n<\/li><li>\n用穿针引线法解高次不等式\n<\/li><li>\n正确处理含参数与重根情形\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>二次不等式的解集由“开口方向 + 零点位置”决定；高次不等式用数轴上的符号变化判断。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 二次不等式的标准解法<\/h3>\n<p>以 ax²+bx+c&gt;0（a&gt;0）为例：<\/p>\n<ol><li>\n求方程 ax²+bx+c=0 的根 x₁&lt;x₂（判别式 Δ）；\n<\/li><li>\n抛物线开口向上，两根之间为负、两根之外为正；\n<\/li><li>\n所以 &gt;0 的解集是 (−∞,x₁)∪(x₂,+∞)，&lt;0 的解集是 (x₁,x₂)。\n<\/ol>\n<p>口诀只是记忆辅助，真正的依据是抛物线图象。<\/p>\n<p>三种特殊情形：<\/p>\n<ul><li>\nΔ=0：抛物线与 x 轴相切，&gt;0 的解集是除顶点外的所有实数，&lt;0 无解；\n<\/li><li>\nΔ&lt;0 且 a&gt;0：整条抛物线在 x 轴上方，&gt;0 恒成立，&lt;0 无解；\n<\/li><li>\na&lt;0：先两边乘 −1 化成正系数，同时变号。\n<\/ul>\n<h3>2.2 高次不等式：穿针引线<\/h3>\n<p>把多项式分解成一次因式的乘积，把所有零点标在数轴上，从最右端开始画曲线，<strong>奇次根穿过、偶次根不穿<\/strong>，按区间符号写出解集。<\/p>\n<p>例：(x−1)(x−2)²(x+1)&gt;0。零点 −1（1 次）、1（1 次）、2（2 次）。曲线在 2 处不穿，在 1、−1 处穿过。<\/p>\n<h3>2.3 含参数要分类<\/h3>\n<p>含参数的二次不等式要按“首项系数是否为 0”“判别式符号”“两根大小”分层讨论，不能只写一种情形。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：符号表像一条“正负交替的带子”，每过一个奇次零点就翻一次面。<\/p>\n<p><strong>失效边界<\/strong>：穿针法要求因式都已分解到一次（或不可约二次）；未分解时零点不全，结论会错。<\/p>\n<p><strong>实例<\/strong>：解 x²−x−6&lt;0。 因式分解 (x−3)(x+2)&lt;0，零点 −2、3，开口向上，两根之间为负，解集 (−2,3)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 二次不等式一定有解 —— 实际上 Δ&lt;0 且开口向上时，&gt;0 恒成立、&lt;0 无解；并非所有形式都有非空解集。\n<\/li><li>\n别以为 重根也要穿过去 —— 实际上 偶次重根两侧符号相同，曲线不穿过，只是相切折返。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n不等式 x²−4x+3&lt;0 的解集是：\n<\/li><li>\n不等式 (x−2)²(x+1)&gt;0 的解集是：\n<p>A. (1,3) ｜ B. (−∞,1)∪(3,+∞) ｜ C. [1,3] ｜ D. (−3,−1) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：(x−1)(x−3)&lt;0，开口向上，两根之间为负，解集 (1,3)。 A. x&gt;−1 ｜ B. x&gt;−1 且 x≠2 ｜ C. x&lt;−1 ｜ D. 全体实数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：x=−1 处穿根、x=2 处偶次不穿；x&gt;−1 且 x≠2 时为正，x=−1 时为零。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n二次不等式看开口与零点：开口向上，两根之外为正\n<\/li><li>\n高次不等式：奇穿偶不穿\n<\/li><li>\n含参数按首项系数、判别式、根大小分层\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：二次不等式与高次不等式）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：二次不等式与高次不等式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>二次不等式的解集不是背出来的，是从抛物线图象读出来的。下面把“开口 + 零点”写成符号表。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>二次不等式指形如 ax²+bx+c&gt;0（或 &lt;0、≥0、≤0）的不等式，a≠0。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>抛物线像一座拱桥：桥面在 x 轴上方的部分，就是 &gt;0 的解集。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 求零点<\/h3>\n<div class=\"katex-block\">ax^{2}+bx+c=0\\ \\Rightarrow\\ x_{1,2}=\\frac{-b\\pm\\sqrt{\\Delta}}{2a}<\/div>\n<p>零点把数轴分成若干段，每段符号恒定。<\/p>\n<h3>2. 符号表<\/h3>\n<div class=\"katex-block\">a>0,\\ x&lt;x_{1}\\ \\text{或}\\ x>x_{2}\\ \\Rightarrow\\ ax^{2}+bx+c>0<\/div>\n<p>开口向上时，两根之外为正、两根之间为负。<\/p>\n<h3>3. 重根<\/h3>\n<div class=\"katex-block\">\\Delta=0\\ \\Rightarrow\\ ax^{2}+bx+c=a(x-x_{0})^{2}\\ge 0<\/div>\n<p>重根处只是相切，符号不翻转。<\/p>\n<h3>4. 高次穿针<\/h3>\n<div class=\"katex-block\">(x-x_{1})^{m_1}\\cdots(x-x_{k})^{m_k}<\/div>\n<p>奇次幂的零点穿过，偶次幂的零点不穿，从最右段开始定符号。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>若 a&lt;0，桥是倒扣的，先乘 −1 转正再判断；重根时桥与轴相切，不跨越。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《不等式》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：二次不等式与高次不等式<\/a><\/span><\/div><h1>第 3 章：绝对值不等式与无理不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用几何意义解 |x| 型不等式\n<\/li><li>\n解 |ax+b|&lt;c、&gt;c 两类\n<\/li><li>\n先定定义域再解无理不等式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>绝对值是距离，无理不等式要先保证根号有意义，再平方——两步顺序不能颠倒。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 绝对值的几何意义<\/h3>\n<p>|x| 表示数轴上 x 到原点的距离。于是：<\/p>\n<ul><li>\n|x|&lt;a（a&gt;0）⇔ −a&lt;x&lt;a；\n<\/li><li>\n|x|&gt;a（a&gt;0）⇔ x&lt;−a 或 x&gt;a。\n<\/ul>\n<p>把 x 换成 x−c，就是“到 c 的距离”。<\/p>\n<h3>3.2 一般形式<\/h3>\n<p>|ax+b|&lt;c（c&gt;0）⇔ −c&lt;ax+b&lt;c；<\/p>\n<p>|ax+b|&gt;c（c&gt;0）⇔ ax+b&lt;−c 或 ax+b&gt;c。<\/p>\n<p>c≤0 时要单独看：|…|&lt;c 无解，|…|&gt;c 对使式子有意义的 x 恒成立（c&lt;0）或需排除零点（c=0）。<\/p>\n<h3>3.3 无理不等式的两步<\/h3>\n<p>第一步：定定义域（偶次根号下非负）。 第二步：两边平方，但只有在两边都非负时才等价。<\/p>\n<p>例：√(x+2)&lt;x。 定义域 x≥−2；右边要求 x&gt;0 才能平方（否则负数小于正根号一定成立，直接给出解）。 平方得 x+2&lt;x²，即 x²−x−2&gt;0，x&gt;2 或 x&lt;−1。结合 x&gt;0 与 x≥−2，得 x&gt;2。 还要单独检查 x∈[−2,0]：此时右边 ≤0，左边 ≥0，不等式不成立，故无解。合起来解集 (2,+∞)。<\/p>\n<h3>3.4 常见结构<\/h3>\n<ul><li>\n√A &lt; B：需要 B&gt;0 且 A&lt;B²，同时 A≥0；\n<\/li><li>\n√A &gt; B：分 B&lt;0（只需 A≥0）与 B≥0（A&gt;B²）两种。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：绝对值像“到某地的距离”，无理不等式像“先确认尺子能量，再比长度”。<\/p>\n<p><strong>失效边界<\/strong>：平方只保“非负”的大小关系；两边符号不明时平方会引入错误解。<\/p>\n<p><strong>实例<\/strong>：解 |2x−1|≤5。 −5≤2x−1≤5 ⇒ −4≤2x≤6 ⇒ −2≤x≤3。解集 [−2,3]。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 |x|&gt;a 就是 x&gt;a —— 实际上 漏了 x&lt;−a 这一支。绝对值大，可能是“很正的”也可能是“很负的”。\n<\/li><li>\n别以为 无理不等式直接平方就行 —— 实际上 必须先定定义域，并确认两边非负；否则平方会引入不满足原式的解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n不等式 |x−2|&lt;3 的解集是：\n<\/li><li>\n解 √(x−1)&lt;2 时，正确的第一步是：\n<p>A. (−1,5) ｜ B. (−5,−1) ｜ C. (2,5) ｜ D. (−∞,5) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：到 2 的距离小于 3，即 −3&lt;x−2&lt;3，得 −1&lt;x&lt;5。 A. 两边平方 ｜ B. 移项 ｜ C. 确定定义域 x≥1 ｜ D. 讨论 x 的正负 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：根号要求被开方数非负，先得 x≥1；再平方得 x−1&lt;4，即 x&lt;5，合起来 1≤x&lt;5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n|x−c|&lt;a ⇔ c−a&lt;x&lt;c+a\n<\/li><li>\n无理不等式：先定义域，再判断两边非负，最后平方\n<\/li><li>\n√A&lt;B 需 B&gt;0 且 A&lt;B²\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：绝对值不等式与无理不等式）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：绝对值不等式与无理不等式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>绝对值是距离，无理式是长度；两类不等式的共同点是“先弄清什么范围内式子有意义”。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>|x| 表示 x 到原点的距离；无理不等式指含根号且根号内有未知数的不等式。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>绝对值像问“离车站多远”，不问方向；无理不等式像先确认尺子能测量，再比较长短。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 绝对值基本型<\/h3>\n<div class=\"katex-block\">|x|&lt;a\\iff -a&lt;x&lt;a\\quad(a>0)<\/div>\n<p>距离小于 a，就是落在 −a 与 a 之间。<\/p>\n<h3>2. 补集型<\/h3>\n<div class=\"katex-block\">|x|>a\\iff x<-a\\ \\text{或}\\ x>a<\/div>\n<p>距离大于 a，向两边各跑出去一支。<\/p>\n<h3>3. 无理式定义域<\/h3>\n<div class=\"katex-block\">\\sqrt{A(x)}\\ \\text{有意义}\\iff A(x)\\ge 0<\/div>\n<p>这是所有无理不等式的第一步，先于任何变形。<\/p>\n<h3>4. 平方的条件<\/h3>\n<div class=\"katex-block\">\\sqrt{A}&lt;B\\iff B>0\\ \\text{且}\\ A&lt;B^{2}\\ (A\\ge 0)<\/div>\n<p>右边为负时不等式不可能成立，不需平方。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>平方等价只在两边非负时成立；否则要把负的一支单独讨论。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《不等式》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch04": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：绝对值不等式与无理不等式<\/a><\/span><\/div><h1>第 4 章：不等式的证明<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用比较法（作差、作商）证明不等式\n<\/li><li>\n用综合法与分析法各写一段完整推理\n<\/li><li>\n正确使用基本不等式并说明等号条件\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>证明不等式就是证明“差非负”或“由已知不等式推过来”；分析法从结论倒着找条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 比较法<\/h3>\n<p>要证 A≥B，作差 A−B，证明它非负（配方、因式分解、判别式）。要证 A≥B&gt;0，也可作商 A/B 与 1 比较。<\/p>\n<p>例：证 a²+b²≥2ab。作差：a²−2ab+b²=(a−b)²≥0，等号当且仅当 a=b。<\/p>\n<h3>4.2 综合法<\/h3>\n<p>从已知成立的不等式出发，按“由因导果”的顺序推到结论。常用已知：基本不等式、|a|+|b|≥|a+b|、均值不等式。<\/p>\n<h3>4.3 分析法<\/h3>\n<p>从结论出发，寻找使它成立的充分条件，一直追到已知事实。书写时常用“要证……只需证……”，每一步都必须可逆或充分。<\/p>\n<p>例：证 √2+√7&lt;√3+√6。两边平方后比较 9+2√14 与 9+2√18，只需证 √14&lt;√18，显然成立。<\/p>\n<h3>4.4 基本不等式与等号条件<\/h3>\n<p>a²+b²≥2ab 对一切实数成立，等号当 a=b。<\/p>\n<p>对正数 a、b，有 (a+b)/2≥√(ab)，等号当 a=b。使用时必须确认 a、b 为正，并检查等号能否取到——取不到时只能得到严格不等式。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：比较法是“称重量”，综合法是“顺着链条推”，分析法是“从终点倒着找路”。<\/p>\n<p><strong>失效边界<\/strong>：分析法每步必须充分；把“只需”写成“等价”而不检查可逆，会证出假命题。<\/p>\n<p><strong>实例<\/strong>：证 对任意实数 x，x²+2x+3&gt;0。 配方：x²+2x+3=(x+1)²+2≥2&gt;0。等号取不到，故严格成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 用基本不等式不用检查等号条件 —— 实际上 等号条件决定不等式能否取到等值；取不到时结论仍是严格不等，但最值结论会变。\n<\/li><li>\n别以为 分析法可以随便写“只需证” —— 实际上 每一步必须真的充分；写成不充分的条件等于没有证明。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用比较法证明 a²+b²≥2ab 时，关键一步是：\n<\/li><li>\n对正数 a、b，等号成立的条件是：\n<p>A. 移项得 a²+b²−2ab≥0 ｜ B. 两边同除 2 ｜ C. 取 a=b=1 验证 ｜ D. 两边开方 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：作差后配方得 (a−b)²≥0，这是证明的核心；只代特殊值不算证明。 A. a=b ｜ B. a+b=0 ｜ C. ab=1 ｜ D. a=2b <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：(a+b)/2≥√(ab) 的等号当且仅当 a=b 时成立。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n比较法：作差判符号（可配方、因式分解）\n<\/li><li>\n分析法：从结论找充分条件，每步须充分\n<\/li><li>\n基本不等式使用前先确认正数与等号条件\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：不等式的证明）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：不等式的证明<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>证明不等式的全部工具只有两类：把差变成显然非负的东西，或把已知不等式当积木搭上去。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>证明 A≥B 成立，即证明 A−B≥0 对范围内一切取值成立。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>比较法像把两堆货物放上天平，看指针偏向哪边；配方法就是把货物摆成一看就知道哪边重。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 比较法<\/h3>\n<div class=\"katex-block\">A\\ge B\\iff A-B\\ge 0<\/div>\n<p>证明不等式就是证明差非负，形式与解不等式一致。<\/p>\n<h3>2. 配方<\/h3>\n<div class=\"katex-block\">a^{2}+b^{2}-2ab=(a-b)^{2}\\ge 0<\/div>\n<p>把差写成完全平方，非负性一目了然，等号当 a=b。<\/p>\n<h3>3. 基本不等式<\/h3>\n<div class=\"katex-block\">\\frac{a+b}{2}\\ge\\sqrt{ab}\\quad(a,b>0)<\/div>\n<p>由 (√a−√b)²≥0 推出，等号当 a=b。<\/p>\n<h3>4. 分析法<\/h3>\n<div class=\"katex-block\">\\text{要证 }P\\ \\Leftarrow\\ \\text{只需 }Q,\\ Q\\ \\text{已知成立}<\/div>\n<p>从结论倒推充分条件，书写时每步都要真的充分。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>配方、因式分解只在实系数范围内可靠；涉及复数时“非负”失去意义。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《不等式》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：不等式的性质与同解变形<\/a><\/span><\/div><h1>同解变形与变号<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>两边同乘负数，不等号反向；这一步错，整道题的解集就反了。<\/p>\n<h2>为什么重要<\/h2>\n<p>不等式解法全部由同解变形组成，变号是最容易出错也最容易检查的一步。<\/p>\n<h2>详解<\/h2>\n<p>允许的同解操作：移项、同乘除正数、同乘除负数并变号。禁止的操作：两边平方（除确定非负）、乘含未知数且符号不定的式子。检查办法：把解集端点代回原不等式，看是否恰好取到边界。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“乘以 −1 只是把式子反过来写”，忘了同时要变号。<\/p>\n<h2>相关概念<\/h2>\n<p>基本性质（ch01）、绝对值不等式（ch03）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-05-不等式 华昌年.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：二次不等式与高次不等式<\/a><\/span><\/div><h1>符号表与穿针引线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把零点排在数轴上，按因式的次数决定穿或不穿，每一段的符号就定了。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是解二次、高次不等式的通用方法，比背口诀可靠。<\/p>\n<h2>详解<\/h2>\n<p>步骤：分解到一次因式 → 标零点 → 从最右段取一个测试点定符号 → 按奇穿偶不穿依次翻面 → 按不等号方向取区间。含参数时额外讨论首项系数与重根。<\/p>\n<h2>常见误解<\/h2>\n<p>把偶次重根也当穿过点，导致区间符号整体错位。<\/p>\n<h2>相关概念<\/h2>\n<p>二次不等式（ch02）、因式分解（《整式》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：性质与同解变形<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：不等式的性质与同解变形<\/a><br>检查点：能说明两边乘负数为什么要变号<\/li><li class='path-step' id='path-02'><strong>步骤 02：二次与高次不等式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：二次不等式与高次不等式<\/a><br>检查点：能用符号表写出解集<\/li><li class='path-step' id='path-03'><strong>步骤 03：绝对值与无理不等式<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：绝对值不等式与无理不等式<\/a><br>检查点：能先定定义域再解无理不等式<\/li><li class='path-step' id='path-04'><strong>步骤 04：不等式的证明<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：不等式的证明<\/a><br>检查点：能用比较法与综合法各证一题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q09' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q9.<\/b> 不等式 (x−1)(x+2)&gt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> (−2,1)<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> (−∞,−2)∪(1,+∞)<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> [−2,1]<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> (−∞,1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q10.<\/b> 若 a&gt;b，则下列一定成立的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> a²&gt;b²<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> a−c&gt;b−c<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> ac&gt;bc<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 1/a&lt;1/b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：不等式的性质与同解变形<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 若 a&gt;b，则下列一定成立的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> a²&gt;b²<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> −2a&gt;−2b<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> a−3&gt;b−3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 1/a&gt;1/b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 解不等式 −3x≥6，解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> x≥−2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> x≤−2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> x≥2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> x≤2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：二次不等式与高次不等式<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 不等式 x²−4x+3&lt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> (1,3)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> (−∞,1)∪(3,+∞)<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> [1,3]<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> (−3,−1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 不等式 (x−2)²(x+1)&gt;0 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> x&gt;−1<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> x&gt;−1 且 x≠2<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> x&lt;−1<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 全体实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：绝对值不等式与无理不等式<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 不等式 |x−2|&lt;3 的解集是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> (−1,5)<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> (−5,−1)<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> (2,5)<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> (−∞,5)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 解 √(x−1)&lt;2 时，正确的第一步是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 两边平方<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 移项<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 确定定义域 x≥1<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 讨论 x 的正负<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：不等式的证明<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 用比较法证明 a²+b²≥2ab 时，关键一步是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 移项得 a²+b²−2ab≥0<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 两边同除 2<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 取 a=b=1 验证<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 两边开方<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 对正数 a、b，等号成立的条件是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> a=b<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> a+b=0<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> ab=1<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> a=2b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='同解不等式'>同解不等式 — 解集完全相同的不等式。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='可乘性'>可乘性 — 两边同乘正数不变号、乘负数变号的性质。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='解集'>解集 — 使不等式成立的所有取值组成的集合。 <span class=glossary-ref>（第 1 章：不等式的性质与同解变形）<\/span><\/li><li data-term='穿针引线法'>穿针引线法 — 按零点次数在数轴上交替取符号解高次不等式的方法。 <span class=glossary-ref>（第 2 章：二次不等式与高次不等式）<\/span><\/li><li data-term='重根'>重根 — 方程中重复出现的根，对应因式的幂次大于 1。 <span class=glossary-ref>（第 2 章：二次不等式与高次不等式）<\/span><\/li><li data-term='绝对值不等式'>绝对值不等式 — 含 |x| 或 |ax+b| 的不等式，按距离意义转化。 <span class=glossary-ref>（第 3 章：绝对值不等式与无理不等式）<\/span><\/li><li data-term='无理不等式'>无理不等式 — 根号内含有未知数的不等式。 <span class=glossary-ref>（第 3 章：绝对值不等式与无理不等式）<\/span><\/li><li data-term='比较法'>比较法 — 作差或作商判断大小的证明方法。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><li data-term='分析法'>分析法 — 从结论出发寻找充分条件的证明方法。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><li data-term='基本不等式'>基本不等式 — a²+b²≥2ab；(a+b)/2≥√(ab)（a,b&gt;0）。 <span class=glossary-ref>（第 4 章：不等式的证明）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：解不等式的四步<\/h2>\n<p>① 定定义域；② 移项整理成标准形；③ 求零点、画符号表；④ 按不等号方向取区间并检查端点。<\/p>\n<h2>框架：证明的三选一<\/h2>\n<p>结构简单作差；已知不等式多则综合；结论复杂则分析。选错方法会绕远路。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>乘负数<\/td><td>不等号反向<\/td><\/tr><tr><td>二次不等式 a&gt;0<\/td><td>&gt;0 取两根之外，&lt;0 取两根之间<\/td><\/tr><tr><td>高次不等式<\/td><td>奇穿偶不穿，从最右段定符号<\/td><\/tr><tr><td>绝对值<\/td><td><\/td><td>x<\/td><td>&lt;a ⇔ −a&lt;x&lt;a；<\/td><td>x<\/td><td>&gt;a ⇔ x&lt;−a 或 x&gt;a<\/td><\/tr><tr><td>无理不等式<\/td><td>先定义域，再判两边非负，最后平方<\/td><\/tr><tr><td>基本不等式<\/td><td>a²+b²≥2ab；等号 a=b<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  const urls = [
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.js',
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    s.onload = () => { networkLoaded = true; cb(); };
    s.onerror = () => { s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库加载失败，请联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 掌握度（简化 BKT） ---------- */
function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){
  const v = Math.round(getMastery(cid)*100);
  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}

/* ---------- 抽认卡 ---------- */
function sup(t){
  return String(t==null?'':t).replace(/[&<>]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]))
    .replace(/\^(?:\{([^{}]+)\}|\(([^()]*)\)|([-+]?[A-Za-z0-9.]+))/g,
      (m,a,b,c)=>'<sup>'+(a||b||c||'')+'</sup>');
}
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').innerHTML = sup(c.front);
  document.querySelector('.fc-back').innerHTML = sup(c.back);
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    $$('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  const urls=['https://registry.npmmirror.com/mermaid/10/files/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10/dist/mermaid.min.js'];
  let ui=0;
  const tryNext=()=>{
    if(ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    s.onload=boot;
    s.onerror=()=>{ s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';

renderNav();

(function(){

  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';

showPage(routeIdFromHash());
