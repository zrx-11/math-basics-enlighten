任意一条", "一条", "两条相交直线", "两条平行直线"], "answer": 1, "explain": "只需与平面内的一条直线平行即可判定线面平行。"}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "判定一条直线垂直于一个平面，需要它垂直于平面内：", "options": ["一条直线", "两条平行直线", "两条相交直线", "三条直线"], "answer": 2, "explain": "两条相交直线确定平面的方向，缺“相交”条件不成立。"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "三垂线定理的作用是：", "options": ["把面面垂直化为线面垂直", "把空间垂直化为平面内的垂直", "求体积", "判断平行"], "answer": 1, "explain": "它通过射影把空间中的垂直关系转化为平面内的垂直关系。"}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "二面角的平面角的两条边必须：", "options": ["都垂直于棱", "互相平行", "都在同一平面内", "都过棱的中点"], "answer": 0, "explain": "在棱上取一点，分别在两个面内作垂直于棱的射线，这两条射线所成的角才是平面角。"}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "直线与平面所成角的范围是：", "options": ["(0°,90°)", "[0°,90°]", "[0°,180°]", "(0°,180°)"], "answer": 1, "explain": "平行时为 0°，垂直时为 90°，故范围是 [0°,90°]。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "空间中两条直线都平行于第三条直线，则这两条直线：", "options": ["一定相交", "一定平行", "一定异面", "可能异面"], "answer": 1, "explain": "平行的传递性在空间中仍成立，故两直线平行。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "直线 l 垂直于平面 α 内两条相交直线，则：", "options": ["l 平行于 α", "l 垂直于 α", "l 在 α 内", "无法判断"], "answer": 1, "explain": "这正是线面垂直的判定定理。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：空间的位置关系与平行」的一句话核心是什么？", "back": "空间里“不相交”不等于“平行”；判定与性质定理必须成对使用。", "tags": ["lines-planes", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：垂直关系与三垂线定理」的一句话核心是什么？", "back": "线面垂直是空间垂直的总枢纽：一条直线垂直于平面内两条相交直线，就垂直于整个平面。", "tags": ["lines-planes", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：空间角与距离」的一句话核心是什么？", "back": "空间里的角都要先“作出平面角”再计算；距离都要先“作出垂线段”。", "tags": ["lines-planes", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「异面直线」？", "back": "不同在任何一个平面内的两条直线。", "tags": ["lines-planes", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「线面平行」？", "back": "直线与平面没有公共点。", "tags": ["lines-planes", "术语"]}, {"id": "f06", "chapterId": "ch02", "front": "什么是「线面垂直」？", "back": "直线垂直于平面内所有直线。", "tags": ["lines-planes", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「射影」？", "back": "斜线在平面内的正投影。", "tags": ["lines-planes", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「三垂线定理」？", "back": "平面内直线垂直于射影则垂直于斜线。", "tags": ["lines-planes", "术语"]}, {"id": "f09", "chapterId": "ch03", "front": "什么是「二面角」？", "back": "两个半平面所成的图形。", "tags": ["lines-planes", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「平面角」？", "back": "二面角中在棱上取点、两面内垂直棱的两射线夹角。", "tags": ["lines-planes", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「线面角」？", "back": "斜线与射影所成的角。", "tags": ["lines-planes", "术语"]}], "companion": "lines-planes学习伴侣.html", "deriv": "lines-planes从零推导.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：空间的位置关系与平行<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：平面几何\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n区分空间两直线的三种关系\n<\/li><li>\n用线面、面面平行定理完成证明\n<\/li><li>\n识别异面直线所成的角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>空间里“不相交”不等于“平行”；判定与性质定理必须成对使用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 空间两直线的三种关系<\/h3>\n<ul><li>\n相交：有且只有一个公共点；\n<\/li><li>\n平行：在同一平面内且无公共点；\n<\/li><li>\n异面：不同在任何一个平面内，既不平行也不相交。\n<\/ul>\n<p>异面直线所成的角：过空间中任一点分别作它们的平行线，两条平行线的夹角（取锐角或直角）就是异面直线所成的角，范围 (0°,90°]。<\/p>\n<h3>1.2 直线与平面<\/h3>\n<p>直线在平面内、直线与平面平行、直线与平面相交（只有一个公共点）。<\/p>\n<h3>1.3 平行的三条定理<\/h3>\n<ul><li>\n<strong>线面平行判定<\/strong>：平面外一条直线与平面内一条直线平行，则该直线平行于这个平面；\n<\/li><li>\n<strong>线面平行性质<\/strong>：直线平行于平面，过该直线的平面与原平面相交，则交线与该直线平行；\n<\/li><li>\n<strong>面面平行判定<\/strong>：一个平面内的两条相交直线都平行于另一个平面，则两平面平行。\n<\/ul>\n<p>判定是由“线线平行”推“线面平行”，性质是反过来。证明时要写清用的是哪一条。<\/p>\n<h3>1.4 常见误区<\/h3>\n<p>用平面图形的直觉去推空间结论，最容易出错的是“两条直线都平行于第三条，就一定互相平行”——空间中这仍然成立；但“两条直线都垂直于同一条直线就一定平行”则不成立。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：异面直线像两根互相交错但不相碰的筷子，你怎么转动桌面都无法让它们落在同一平面里。<\/p>\n<p><strong>失效边界<\/strong>：平面几何的“平行传递性”可以推广到空间，但垂直关系不能随便传递。<\/p>\n<p><strong>实例<\/strong>：正方体 ABCD-A′B′C′D′ 中，AB 与 CC′ 是异面直线；AB 与 C′D′ 平行；AB 与 B′C′ 异面，所成角为 90°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 空间中不相交的两条直线一定平行 —— 实际上 还可能是异面；平行要求共面。\n<\/li><li>\n别以为 垂直于同一条直线的两条直线平行 —— 实际上 空间中不成立，两条直线可能异面且都垂直于第三条。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n空间中两条直线的位置关系共有几种：\n<\/li><li>\n线面平行的判定定理中，平面外直线需要与平面内的哪条直线平行：\n<p>A. 2 种 ｜ B. 3 种 ｜ C. 4 种 ｜ D. 1 种 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：相交、平行、异面三种。 A. 任意一条 ｜ B. 一条 ｜ C. 两条相交直线 ｜ D. 两条平行直线 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：只需与平面内的一条直线平行即可判定线面平行。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n空间两直线：相交、平行、异面\n<\/li><li>\n线面平行判定：面外线∥面内线\n<\/li><li>\n判定与性质成对，证明要写依据\n<\/ul>", "kind": "chapter", "title": "第 1 章：空间的位置关系与平行"}, "ch02": {"html": "<h1>第 2 章：垂直关系与三垂线定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用线面垂直的判定与性质完成证明\n<\/li><li>\n说出三垂线定理及其逆定理\n<\/li><li>\n在具体图形中找出垂足与射影\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>线面垂直是空间垂直的总枢纽：一条直线垂直于平面内两条相交直线，就垂直于整个平面。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 线面垂直的判定<\/h3>\n<p>若一条直线垂直于平面内两条<strong>相交<\/strong>直线，则它垂直于这个平面。<\/p>\n<p>注意“相交”二字：垂直于两条平行直线不足以判定线面垂直。<\/p>\n<h3>2.2 线面垂直的性质<\/h3>\n<ul><li>\n垂直于同一平面的两条直线平行；\n<\/li><li>\n直线垂直于平面，则它垂直于平面内任意一条直线。\n<\/ul>\n<p>第二条是证明线线垂直最常用的通道：想证两线垂直，先证其中一条垂直于另一条所在的平面。<\/p>\n<h3>2.3 三垂线定理<\/h3>\n<p>平面内一条直线若垂直于斜线在该平面内的射影，则它也垂直于这条斜线；反之，若垂直于斜线，则垂直于射影。<\/p>\n<p>这条定理把“空间垂直”转化为“平面内的垂直”，是立体几何里最实用的工具之一。<\/p>\n<h3>2.4 面面垂直<\/h3>\n<p>判定：一个平面过另一个平面的一条垂线，则两平面垂直。 性质：两平面垂直，则一个平面内垂直于交线的直线垂直于另一个平面。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：三垂线定理像用一根杆的影子判断杆是否与地面上的线垂直：影子垂直，杆就垂直。<\/p>\n<p><strong>失效边界<\/strong>：三垂线定理要求斜线在平面内有射影，即斜线不能平行于平面。<\/p>\n<p><strong>实例<\/strong>：正方体中 AC⊥BD（对角线互相垂直），AA′⊥底面，故 AA′⊥BD；又 AC 是 A′C 在底面的射影，所以 A′C⊥BD。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 垂直于平面内两条直线就垂直于平面 —— 实际上 必须是两条相交直线；两条平行线不能确定一个平面方向。\n<\/li><li>\n别以为 三垂线定理可以直接用于任意直线 —— 实际上 定理针对斜线及其射影；直线平行于平面时没有射影，不能套用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判定一条直线垂直于一个平面，需要它垂直于平面内：\n<\/li><li>\n三垂线定理的作用是：\n<p>A. 一条直线 ｜ B. 两条平行直线 ｜ C. 两条相交直线 ｜ D. 三条直线 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：两条相交直线确定平面的方向，缺“相交”条件不成立。 A. 把面面垂直化为线面垂直 ｜ B. 把空间垂直化为平面内的垂直 ｜ C. 求体积 ｜ D. 判断平行 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：它通过射影把空间中的垂直关系转化为平面内的垂直关系。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线面垂直：垂直于面内两条相交直线\n<\/li><li>\n想证线线垂直，先找线面垂直\n<\/li><li>\n三垂线定理：射影垂直 ⇔ 斜线垂直\n<\/ul>", "kind": "chapter", "title": "第 2 章：垂直关系与三垂线定理"}, "ch03": {"html": "<h1>第 3 章：空间角与距离<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n求异面直线所成的角、线面角\n<\/li><li>\n作出并计算二面角的平面角\n<\/li><li>\n把点面距离转化为垂线段长度\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>空间里的角都要先“作出平面角”再计算；距离都要先“作出垂线段”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 线面角<\/h3>\n<p>斜线与它在平面内的射影所成的角，叫这条直线与平面所成的角，范围 [0°,90°]。<\/p>\n<p>求法：找到斜足与垂足，连接得到射影，在直角三角形中用三角函数求角。<\/p>\n<h3>3.2 二面角<\/h3>\n<p>两个半平面所成的图形叫二面角。在棱上任取一点，分别在两个面内作垂直于棱的射线，两条射线所成的角叫<strong>二面角的平面角<\/strong>。<\/p>\n<p>平面角的大小与点的选取无关，这是可以“任取”的依据。<\/p>\n<h3>3.3 常见求法<\/h3>\n<ul><li>\n定义法：直接在棱上取点作垂线；\n<\/li><li>\n三垂线法：利用射影构造垂直；\n<\/li><li>\n向量法（后续学习）：用法向量夹角，注意二面角可能是钝角。\n<\/ul>\n<h3>3.4 距离<\/h3>\n<p>点到平面的距离＝过该点作平面的垂线，垂线段的长度。线面距离、面面距离都可以转化为点面距离。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：二面角像一本打开的书，书脊是棱，两页纸的夹角就是二面角。<\/p>\n<p><strong>失效边界<\/strong>：平面角必须在棱上取点、两面内分别作垂线；随便连两条线得到的角不是平面角。<\/p>\n<p><strong>实例<\/strong>：正方体中，求平面 A′BD 与底面 ABCD 所成二面角。 取 BD 中点 O，连 AO、A′O。BD⊥AO，BD⊥A′O，故 ∠AOA′ 是平面角。设棱长 1，AO=√2/2，AA′=1，tan∠AOA′=1/(√2/2)=√2，角约为 54.7°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 二面角就是两个面内任意两条直线的夹角 —— 实际上 必须是在棱上同一点、分别在两面内垂直于棱的两条射线。\n<\/li><li>\n别以为 线面角可以是钝角 —— 实际上 线面角范围是 [0°,90°]，取斜线与射影的锐角。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n二面角的平面角的两条边必须：\n<\/li><li>\n直线与平面所成角的范围是：\n<p>A. 都垂直于棱 ｜ B. 互相平行 ｜ C. 都在同一平面内 ｜ D. 都过棱的中点 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：在棱上取一点，分别在两个面内作垂直于棱的射线，这两条射线所成的角才是平面角。 A. (0°,90°) ｜ B. [0°,90°] ｜ C. [0°,180°] ｜ D. (0°,180°) <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：平行时为 0°，垂直时为 90°，故范围是 [0°,90°]。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线面角＝斜线与射影的夹角，范围 [0°,90°]\n<\/li><li>\n二面角要先作出平面角\n<\/li><li>\n距离＝垂线段长度\n<\/ul>", "kind": "chapter", "title": "第 3 章：空间角与距离"}, "c01": {"html": "<h1>判定与性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>判定是“由条件推关系”，性质是“由关系推结论”，两者方向相反、成对出现。<\/p>\n<h2>为什么重要<\/h2>\n<p>立体几何的证明几乎全靠这两类定理，混用就会循环论证。<\/p>\n<h2>详解<\/h2>\n<p>平行体系：线线平行推线面平行（判定），线面平行推线线平行（性质）；垂直体系同理。写证明时先声明用哪条定理，再摆条件，最后得结论。<\/p>\n<h2>常见误解<\/h2>\n<p>把要证的结论当作条件用，或用“显然”代替定理。<\/p>\n<h2>相关概念<\/h2>\n<p>平行（ch01）、垂直（ch02）<\/p>", "kind": "concept", "title": "判定与性质"}, "c02": {"html": "<h1>射影与三垂线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把空间中的一条斜线“压”到平面上，得到射影；射影的垂直关系可以搬到斜线上。<\/p>\n<h2>为什么重要<\/h2>\n<p>三垂线定理是求二面角、证垂直最常用的转化工具。<\/p>\n<h2>详解<\/h2>\n<p>斜线 PA 在平面 α 内的射影是 OA（O 为垂足）。若平面内一条直线 l 垂直于 OA，则 l 垂直于 PA。反过来也成立。求线面角时，射影与斜线的夹角就是要找的角。<\/p>\n<h2>常见误解<\/h2>\n<p>斜线平行于平面时没有射影，此时不能套三垂线定理。<\/p>\n<h2>相关概念<\/h2>\n<p>三垂线定理（ch02）、线面角（ch03）<\/p>", "kind": "concept", "title": "射影与三垂线"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：空间的位置关系与平行<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：空间的位置关系与平行<\/a><br>检查点：能举出异面直线的例子<\/li><li class='path-step' id='path-02'><strong>步骤 02：垂直关系与三垂线定理<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：垂直关系与三垂线定理<\/a><br>检查点：能用判定定理证线面垂直<\/li><li class='path-step' id='path-03'><strong>步骤 03：空间角与距离<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：空间角与距离<\/a><br>检查点：能作出二面角的平面角<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 空间中两条直线都平行于第三条直线，则这两条直线：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 一定相交<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 一定平行<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 一定异面<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 可能异面<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 直线 l 垂直于平面 α 内两条相交直线，则：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> l 平行于 α<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> l 垂直于 α<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> l 在 α 内<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：空间的位置关系与平行<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 空间中两条直线的位置关系共有几种：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 2 种<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 3 种<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 4 种<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 1 种<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 线面平行的判定定理中，平面外直线需要与平面内的哪条直线平行：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 任意一条<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 一条<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 两条相交直线<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 两条平行直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：垂直关系与三垂线定理<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 判定一条直线垂直于一个平面，需要它垂直于平面内：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 一条直线<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 两条平行直线<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 两条相交直线<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 三条直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三垂线定理的作用是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 把面面垂直化为线面垂直<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 把空间垂直化为平面内的垂直<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 求体积<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 判断平行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：空间角与距离<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 二面角的平面角的两条边必须：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 都垂直于棱<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 互相平行<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 都在同一平面内<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 都过棱的中点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 直线与平面所成角的范围是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> (0°,90°)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> [0°,90°]<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> [0°,180°]<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> (0°,180°)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='异面直线'>异面直线 — 不同在任何一个平面内的两条直线。 <span class=glossary-ref>（第 1 章：空间的位置关系与平行）<\/span><\/li><li data-term='线面平行'>线面平行 — 直线与平面没有公共点。 <span class=glossary-ref>（第 1 章：空间的位置关系与平行）<\/span><\/li><li data-term='线面垂直'>线面垂直 — 直线垂直于平面内所有直线。 <span class=glossary-ref>（第 2 章：垂直关系与三垂线定理）<\/span><\/li><li data-term='射影'>射影 — 斜线在平面内的正投影。 <span class=glossary-ref>（第 2 章：垂直关系与三垂线定理）<\/span><\/li><li data-term='三垂线定理'>三垂线定理 — 平面内直线垂直于射影则垂直于斜线。 <span class=glossary-ref>（第 2 章：垂直关系与三垂线定理）<\/span><\/li><li data-term='二面角'>二面角 — 两个半平面所成的图形。 <span class=glossary-ref>（第 3 章：空间角与距离）<\/span><\/li><li data-term='平面角'>平面角 — 二面角中在棱上取点、两面内垂直棱的两射线夹角。 <span class=glossary-ref>（第 3 章：空间角与距离）<\/span><\/li><li data-term='线面角'>线面角 — 斜线与射影所成的角。 <span class=glossary-ref>（第 3 章：空间角与距离）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：证平行的三步<\/h2>\n<p>① 找面内一条与已知直线平行的线；② 用判定定理得线面平行；③ 需要时再用性质定理转回线线平行。<\/p>\n<h2>框架：求空间角三步<\/h2>\n<p>① 作出平面角（找垂足、射影）；② 在直角三角形中算边长；③ 用三角函数求角并说明范围。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>两直线<\/td><td>相交、平行、异面<\/td><\/tr><tr><td>线面平行判定<\/td><td>面外线∥面内线<\/td><\/tr><tr><td>线面垂直判定<\/td><td>垂直于面内两条相交直线<\/td><\/tr><tr><td>三垂线<\/td><td>射影⊥l ⇒ 斜线⊥l<\/td><\/tr><tr><td>线面角<\/td><td>sinθ=h/l<\/td><\/tr><tr><td>二面角<\/td><td>棱上取点，两面内作垂线<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/13-直线与平面", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：空间的位置关系与平行", "href": "#/chapter/ch01"}, {"label": "第 2 章：垂直关系与三垂线定理", "href": "#/chapter/ch02"}, {"label": "第 3 章：空间角与距离", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "判定与性质", "href": "#/concept/c01"}, {"label": "射影与三垂线", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：空间的位置关系与平行", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：垂直关系与三垂线定理", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：空间角与距离", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：空间的位置关系与平行<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：平面几何\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n区分空间两直线的三种关系\n<\/li><li>\n用线面、面面平行定理完成证明\n<\/li><li>\n识别异面直线所成的角\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>空间里“不相交”不等于“平行”；判定与性质定理必须成对使用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 空间两直线的三种关系<\/h3>\n<ul><li>\n相交：有且只有一个公共点；\n<\/li><li>\n平行：在同一平面内且无公共点；\n<\/li><li>\n异面：不同在任何一个平面内，既不平行也不相交。\n<\/ul>\n<p>异面直线所成的角：过空间中任一点分别作它们的平行线，两条平行线的夹角（取锐角或直角）就是异面直线所成的角，范围 (0°,90°]。<\/p>\n<h3>1.2 直线与平面<\/h3>\n<p>直线在平面内、直线与平面平行、直线与平面相交（只有一个公共点）。<\/p>\n<h3>1.3 平行的三条定理<\/h3>\n<ul><li>\n<strong>线面平行判定<\/strong>：平面外一条直线与平面内一条直线平行，则该直线平行于这个平面；\n<\/li><li>\n<strong>线面平行性质<\/strong>：直线平行于平面，过该直线的平面与原平面相交，则交线与该直线平行；\n<\/li><li>\n<strong>面面平行判定<\/strong>：一个平面内的两条相交直线都平行于另一个平面，则两平面平行。\n<\/ul>\n<p>判定是由“线线平行”推“线面平行”，性质是反过来。证明时要写清用的是哪一条。<\/p>\n<h3>1.4 常见误区<\/h3>\n<p>用平面图形的直觉去推空间结论，最容易出错的是“两条直线都平行于第三条，就一定互相平行”——空间中这仍然成立；但“两条直线都垂直于同一条直线就一定平行”则不成立。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：异面直线像两根互相交错但不相碰的筷子，你怎么转动桌面都无法让它们落在同一平面里。<\/p>\n<p><strong>失效边界<\/strong>：平面几何的“平行传递性”可以推广到空间，但垂直关系不能随便传递。<\/p>\n<p><strong>实例<\/strong>：正方体 ABCD-A′B′C′D′ 中，AB 与 CC′ 是异面直线；AB 与 C′D′ 平行；AB 与 B′C′ 异面，所成角为 90°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 空间中不相交的两条直线一定平行 —— 实际上 还可能是异面；平行要求共面。\n<\/li><li>\n别以为 垂直于同一条直线的两条直线平行 —— 实际上 空间中不成立，两条直线可能异面且都垂直于第三条。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n空间中两条直线的位置关系共有几种：\n<\/li><li>\n线面平行的判定定理中，平面外直线需要与平面内的哪条直线平行：\n<p>A. 2 种 ｜ B. 3 种 ｜ C. 4 种 ｜ D. 1 种 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：相交、平行、异面三种。 A. 任意一条 ｜ B. 一条 ｜ C. 两条相交直线 ｜ D. 两条平行直线 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：只需与平面内的一条直线平行即可判定线面平行。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n空间两直线：相交、平行、异面\n<\/li><li>\n线面平行判定：面外线∥面内线\n<\/li><li>\n判定与性质成对，证明要写依据\n<\/ul>", "ch02": "<h1>第 2 章：垂直关系与三垂线定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用线面垂直的判定与性质完成证明\n<\/li><li>\n说出三垂线定理及其逆定理\n<\/li><li>\n在具体图形中找出垂足与射影\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>线面垂直是空间垂直的总枢纽：一条直线垂直于平面内两条相交直线，就垂直于整个平面。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 线面垂直的判定<\/h3>\n<p>若一条直线垂直于平面内两条<strong>相交<\/strong>直线，则它垂直于这个平面。<\/p>\n<p>注意“相交”二字：垂直于两条平行直线不足以判定线面垂直。<\/p>\n<h3>2.2 线面垂直的性质<\/h3>\n<ul><li>\n垂直于同一平面的两条直线平行；\n<\/li><li>\n直线垂直于平面，则它垂直于平面内任意一条直线。\n<\/ul>\n<p>第二条是证明线线垂直最常用的通道：想证两线垂直，先证其中一条垂直于另一条所在的平面。<\/p>\n<h3>2.3 三垂线定理<\/h3>\n<p>平面内一条直线若垂直于斜线在该平面内的射影，则它也垂直于这条斜线；反之，若垂直于斜线，则垂直于射影。<\/p>\n<p>这条定理把“空间垂直”转化为“平面内的垂直”，是立体几何里最实用的工具之一。<\/p>\n<h3>2.4 面面垂直<\/h3>\n<p>判定：一个平面过另一个平面的一条垂线，则两平面垂直。 性质：两平面垂直，则一个平面内垂直于交线的直线垂直于另一个平面。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：三垂线定理像用一根杆的影子判断杆是否与地面上的线垂直：影子垂直，杆就垂直。<\/p>\n<p><strong>失效边界<\/strong>：三垂线定理要求斜线在平面内有射影，即斜线不能平行于平面。<\/p>\n<p><strong>实例<\/strong>：正方体中 AC⊥BD（对角线互相垂直），AA′⊥底面，故 AA′⊥BD；又 AC 是 A′C 在底面的射影，所以 A′C⊥BD。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 垂直于平面内两条直线就垂直于平面 —— 实际上 必须是两条相交直线；两条平行线不能确定一个平面方向。\n<\/li><li>\n别以为 三垂线定理可以直接用于任意直线 —— 实际上 定理针对斜线及其射影；直线平行于平面时没有射影，不能套用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判定一条直线垂直于一个平面，需要它垂直于平面内：\n<\/li><li>\n三垂线定理的作用是：\n<p>A. 一条直线 ｜ B. 两条平行直线 ｜ C. 两条相交直线 ｜ D. 三条直线 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：两条相交直线确定平面的方向，缺“相交”条件不成立。 A. 把面面垂直化为线面垂直 ｜ B. 把空间垂直化为平面内的垂直 ｜ C. 求体积 ｜ D. 判断平行 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：它通过射影把空间中的垂直关系转化为平面内的垂直关系。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线面垂直：垂直于面内两条相交直线\n<\/li><li>\n想证线线垂直，先找线面垂直\n<\/li><li>\n三垂线定理：射影垂直 ⇔ 斜线垂直\n<\/ul>", "ch03": "<h1>第 3 章：空间角与距离<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n求异面直线所成的角、线面角\n<\/li><li>\n作出并计算二面角的平面角\n<\/li><li>\n把点面距离转化为垂线段长度\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>空间里的角都要先“作出平面角”再计算；距离都要先“作出垂线段”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 线面角<\/h3>\n<p>斜线与它在平面内的射影所成的角，叫这条直线与平面所成的角，范围 [0°,90°]。<\/p>\n<p>求法：找到斜足与垂足，连接得到射影，在直角三角形中用三角函数求角。<\/p>\n<h3>3.2 二面角<\/h3>\n<p>两个半平面所成的图形叫二面角。在棱上任取一点，分别在两个面内作垂直于棱的射线，两条射线所成的角叫<strong>二面角的平面角<\/strong>。<\/p>\n<p>平面角的大小与点的选取无关，这是可以“任取”的依据。<\/p>\n<h3>3.3 常见求法<\/h3>\n<ul><li>\n定义法：直接在棱上取点作垂线；\n<\/li><li>\n三垂线法：利用射影构造垂直；\n<\/li><li>\n向量法（后续学习）：用法向量夹角，注意二面角可能是钝角。\n<\/ul>\n<h3>3.4 距离<\/h3>\n<p>点到平面的距离＝过该点作平面的垂线，垂线段的长度。线面距离、面面距离都可以转化为点面距离。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：二面角像一本打开的书，书脊是棱，两页纸的夹角就是二面角。<\/p>\n<p><strong>失效边界<\/strong>：平面角必须在棱上取点、两面内分别作垂线；随便连两条线得到的角不是平面角。<\/p>\n<p><strong>实例<\/strong>：正方体中，求平面 A′BD 与底面 ABCD 所成二面角。 取 BD 中点 O，连 AO、A′O。BD⊥AO，BD⊥A′O，故 ∠AOA′ 是平面角。设棱长 1，AO=√2/2，AA′=1，tan∠AOA′=1/(√2/2)=√2，角约为 54.7°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 二面角就是两个面内任意两条直线的夹角 —— 实际上 必须是在棱上同一点、分别在两面内垂直于棱的两条射线。\n<\/li><li>\n别以为 线面角可以是钝角 —— 实际上 线面角范围是 [0°,90°]，取斜线与射影的锐角。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n二面角的平面角的两条边必须：\n<\/li><li>\n直线与平面所成角的范围是：\n<p>A. 都垂直于棱 ｜ B. 互相平行 ｜ C. 都在同一平面内 ｜ D. 都过棱的中点 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：在棱上取一点，分别在两个面内作垂直于棱的射线，这两条射线所成的角才是平面角。 A. (0°,90°) ｜ B. [0°,90°] ｜ C. [0°,180°] ｜ D. (0°,180°) <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：平行时为 0°，垂直时为 90°，故范围是 [0°,90°]。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线面角＝斜线与射影的夹角，范围 [0°,90°]\n<\/li><li>\n二面角要先作出平面角\n<\/li><li>\n距离＝垂线段长度\n<\/ul>", "c01": "<h1>判定与性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>判定是“由条件推关系”，性质是“由关系推结论”，两者方向相反、成对出现。<\/p>\n<h2>为什么重要<\/h2>\n<p>立体几何的证明几乎全靠这两类定理，混用就会循环论证。<\/p>\n<h2>详解<\/h2>\n<p>平行体系：线线平行推线面平行（判定），线面平行推线线平行（性质）；垂直体系同理。写证明时先声明用哪条定理，再摆条件，最后得结论。<\/p>\n<h2>常见误解<\/h2>\n<p>把要证的结论当作条件用，或用“显然”代替定理。<\/p>\n<h2>相关概念<\/h2>\n<p>平行（ch01）、垂直（ch02）<\/p>", "c02": "<h1>射影与三垂线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把空间中的一条斜线“压”到平面上，得到射影；射影的垂直关系可以搬到斜线上。<\/p>\n<h2>为什么重要<\/h2>\n<p>三垂线定理是求二面角、证垂直最常用的转化工具。<\/p>\n<h2>详解<\/h2>\n<p>斜线 PA 在平面 α 内的射影是 OA（O 为垂足）。若平面内一条直线 l 垂直于 OA，则 l 垂直于 PA。反过来也成立。求线面角时，射影与斜线的夹角就是要找的角。<\/p>\n<h2>常见误解<\/h2>\n<p>斜线平行于平面时没有射影，此时不能套三垂线定理。<\/p>\n<h2>相关概念<\/h2>\n<p>三垂线定理（ch02）、线面角（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：空间的位置关系与平行<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：空间的位置关系与平行<\/a><br>检查点：能举出异面直线的例子<\/li><li class='path-step' id='path-02'><strong>步骤 02：垂直关系与三垂线定理<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：垂直关系与三垂线定理<\/a><br>检查点：能用判定定理证线面垂直<\/li><li class='path-step' id='path-03'><strong>步骤 03：空间角与距离<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：空间角与距离<\/a><br>检查点：能作出二面角的平面角<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 空间中两条直线都平行于第三条直线，则这两条直线：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 一定相交<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 一定平行<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 一定异面<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 可能异面<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 直线 l 垂直于平面 α 内两条相交直线，则：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> l 平行于 α<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> l 垂直于 α<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> l 在 α 内<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：空间的位置关系与平行<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 空间中两条直线的位置关系共有几种：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 2 种<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 3 种<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 4 种<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 1 种<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 线面平行的判定定理中，平面外直线需要与平面内的哪条直线平行：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 任意一条<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 一条<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 两条相交直线<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 两条平行直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：垂直关系与三垂线定理<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 判定一条直线垂直于一个平面，需要它垂直于平面内：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 一条直线<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 两条平行直线<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 两条相交直线<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 三条直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 三垂线定理的作用是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 把面面垂直化为线面垂直<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 把空间垂直化为平面内的垂直<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 求体积<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 判断平行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：空间角与距离<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 二面角的平面角的两条边必须：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 都垂直于棱<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 互相平行<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 都在同一平面内<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 都过棱的中点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 直线与平面所成角的范围是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> (0°,90°)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> [0°,90°]<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> [0°,180°]<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> (0°,180°)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='异面直线'>异面直线 — 不同在任何一个平面内的两条直线。 <span class=glossary-ref>（第 1 章：空间的位置关系与平行）<\/span><\/li><li data-term='线面平行'>线面平行 — 直线与平面没有公共点。 <span class=glossary-ref>（第 1 章：空间的位置关系与平行）<\/span><\/li><li data-term='线面垂直'>线面垂直 — 直线垂直于平面内所有直线。 <span class=glossary-ref>（第 2 章：垂直关系与三垂线定理）<\/span><\/li><li data-term='射影'>射影 — 斜线在平面内的正投影。 <span class=glossary-ref>（第 2 章：垂直关系与三垂线定理）<\/span><\/li><li data-term='三垂线定理'>三垂线定理 — 平面内直线垂直于射影则垂直于斜线。 <span class=glossary-ref>（第 2 章：垂直关系与三垂线定理）<\/span><\/li><li data-term='二面角'>二面角 — 两个半平面所成的图形。 <span class=glossary-ref>（第 3 章：空间角与距离）<\/span><\/li><li data-term='平面角'>平面角 — 二面角中在棱上取点、两面内垂直棱的两射线夹角。 <span class=glossary-ref>（第 3 章：空间角与距离）<\/span><\/li><li data-term='线面角'>线面角 — 斜线与射影所成的角。 <span class=glossary-ref>（第 3 章：空间角与距离）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：证平行的三步<\/h2>\n<p>① 找面内一条与已知直线平行的线；② 用判定定理得线面平行；③ 需要时再用性质定理转回线线平行。<\/p>\n<h2>框架：求空间角三步<\/h2>\n<p>① 作出平面角（找垂足、射影）；② 在直角三角形中算边长；③ 用三角函数求角并说明范围。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>两直线<\/td><td>相交、平行、异面<\/td><\/tr><tr><td>线面平行判定<\/td><td>面外线∥面内线<\/td><\/tr><tr><td>线面垂直判定<\/td><td>垂直于面内两条相交直线<\/td><\/tr><tr><td>三垂线<\/td><td>射影⊥l ⇒ 斜线⊥l<\/td><\/tr><tr><td>线面角<\/td><td>sinθ=h/l<\/td><\/tr><tr><td>二面角<\/td><td>棱上取点，两面内作垂线<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
