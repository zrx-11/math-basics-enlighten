<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>有理数与无理数</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/picocss/2.0.6/dist/css/pico.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
sup{font-size:.78em;line-height:0;vertical-align:.42em;font-weight:500}
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>有理数与无理数</h1>
    <div class="sub">从相反意义的量到实数：数集是怎么一步步被撑大的</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>
<script>
const DATA = {"manifest": {"slug": "rational-irrational", "title": "有理数与无理数", "subtitle": "从相反意义的量到实数：数集是怎么一步步被撑大的", "book": {"title": "有理数与无理数", "author": "（丛书第 1 册）", "source": ["数学基础知识丛书-01-有理数与无理数.pdf"]}, "audience": "零基础", "goal": "把自然数—分数—有理数—实数这条扩充链走通，能自己证明 √2 不是有理数，并理解“用有理数逼近无理数”为什么是极限的开端。", "learningPath": [{"step": "01", "title": "有理数的概念与数轴", "chapterIds": ["ch01"], "checkpoint": "能说出 -a 与 |a| 的区别，能在数轴上标出 -7/3"}, {"step": "02", "title": "有理数的四则运算", "chapterIds": ["ch02"], "checkpoint": "能用分配律解释“负负得正”，能算含分数的混合运算"}, {"step": "03", "title": "乘方与开方", "chapterIds": ["ch03"], "checkpoint": "能区分 (-2)^4 与 -2^4，能判断一个方根开得尽还是开不尽"}, {"step": "04", "title": "无理数与实数", "chapterIds": ["ch04"], "checkpoint": "能独立写出 √2 不是有理数的反证"}, {"step": "05", "title": "逼近、代数数与超越数", "chapterIds": ["ch05"], "checkpoint": "能说清截断序列的误差为什么小于 10^-n"}], "chapters": [{"id": "ch01", "title": "第 1 章：有理数的概念与数轴", "file": "chapters/ch01-rational-number-axis.md", "difficulty": 1, "source": {"file": "数学基础知识丛书-01-有理数与无理数.pdf", "kind": "原书 PDF"}, "prereqNote": "四则运算、分数、数数", "depthFragment": "chapters/ch01-depth.md", "prerequisites": []}, {"id": "ch02", "title": "第 2 章：有理数的四则运算", "file": "chapters/ch02-arithmetic.md", "difficulty": 2, "source": {"file": "数学基础知识丛书-01-有理数与无理数.pdf", "kind": "原书 PDF"}, "prereqNote": "分数运算", "depthFragment": "chapters/ch02-depth.md", "prerequisites": ["ch01"]}, {"id": "ch03", "title": "第 3 章：乘方与开方", "file": "chapters/ch03-power-root.md", "difficulty": 2, "source": {"file": "数学基础知识丛书-01-有理数与无理数.pdf", "kind": "原书 PDF"}, "prereqNote": "", "depthFragment": "chapters/ch03-depth.md", "prerequisites": ["ch02"]}, {"id": "ch04", "title": "第 4 章：无理数与实数", "file": "chapters/ch04-irrational-real.md", "difficulty": 3, "source": {"file": "数学基础知识丛书-01-有理数与无理数.pdf", "kind": "原书 PDF"}, "prereqNote": "", "depthFragment": "chapters/ch04-depth.md", "prerequisites": ["ch03"]}, {"id": "ch05", "title": "第 5 章：逼近、代数数与超越数", "file": "chapters/ch05-approximation-transcendental.md", "difficulty": 3, "source": {"file": "数学基础知识丛书-01-有理数与无理数.pdf", "kind": "原书 PDF"}, "prereqNote": "", "depthFragment": "chapters/ch05-depth.md", "prerequisites": ["ch04"]}], "concepts": [{"id": "c01", "title": "有理数与无理数的分界", "file": "concepts/c01-rational-vs-irrational.md", "chapterIds": ["ch01", "ch04"], "source": {"file": "数学基础知识丛书-01-有理数与无理数.pdf", "kind": "原书 PDF"}, "prerequisites": ["ch01", "ch04"]}, {"id": "c02", "title": "实数与数轴的一一对应", "file": "concepts/c02-real-line-bijection.md", "chapterIds": ["ch01", "ch04"], "source": {"file": "数学基础知识丛书-01-有理数与无理数.pdf", "kind": "原书 PDF"}, "prerequisites": ["ch01", "ch04"]}, {"id": "c03", "title": "用有理数逼近无理数", "file": "concepts/c03-approximation.md", "chapterIds": ["ch05"], "source": {"file": "数学基础知识丛书-01-有理数与无理数.pdf", "kind": "原书 PDF"}, "prerequisites": ["ch05"]}], "glossary": [{"term": "有理数", "def": "能写成两个整数之比 m/n（n≠0）的数，包含整数与分数。", "chapterId": "ch01"}, {"term": "无理数", "def": "不是有理数的实数，即不能写成两个整数之比的数。", "chapterId": "ch04"}, {"term": "相反数", "def": "对 a 而言是 −a；两者在数轴上关于原点对称。", "chapterId": "ch01"}, {"term": "绝对值", "def": "数轴上表示 a 的点到原点的距离，恒为非负数。", "chapterId": "ch01"}, {"term": "数轴", "def": "规定了原点、正方向和单位长度的直线。", "chapterId": "ch01"}, {"term": "乘方", "def": "n 个相同因数 a 相乘的简写，记作 a^n。", "chapterId": "ch03"}, {"term": "开方", "def": "求满足 x^n=a 的 x 的运算，是乘方的逆运算。", "chapterId": "ch03"}, {"term": "算术根", "def": "非负的那个 n 次方根，记作 ⁿ√a。", "chapterId": "ch03"}, {"term": "稠密性", "def": "任意两个有理数之间还存在有理数，这个性质叫有理数的稠密性。", "chapterId": "ch04"}, {"term": "代数数", "def": "某个整系数多项式方程的根。", "chapterId": "ch05"}, {"term": "超越数", "def": "不是代数数的实数，如 π、e。", "chapterId": "ch05"}, {"term": "截断序列", "def": "把无理数的小数在第 n 位后截断得到的有理数列。", "chapterId": "ch05"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "下列各数中，是负有理数的是：", "options": ["−3/4", "0", "|−2|", "−(−5)"], "answer": 0, "explain": "−3/4 是负分数，属有理数。0 不是负数；|−2|=2 是正数；−(−5)=5 是正数。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "比较 −7/8 与 −6/7 的大小，正确的是：", "options": ["−7/8 > −6/7", "−7/8 < −6/7", "−7/8 = −6/7", "无法比较"], "answer": 1, "explain": "通分得 −49/56 与 −48/56。两负数比较，绝对值大的反而小，49>48，所以 −7/8 < −6/7。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "计算 (−2)(−3)+(−4) 的结果是：", "options": ["−10", "2", "10", "−2"], "answer": 1, "explain": "(−2)(−3)=6（同号得正），再加 −4 得 2。", "relatedConceptId": "", "prerequisites": ["ch02"]}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "下列运算中，能说明有理数集对除法不封闭的是：", "options": ["3÷4=3/4", "(−6)÷2=−3", "5÷0 没有意义", "0÷7=0"], "answer": 2, "explain": "封闭要求“任意两个元素运算后仍在集合内”。5÷0 因为除数没有倒数而不成立，说明除法必须把 0 排除在外。", "relatedConceptId": "", "prerequisites": ["ch02"]}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "下列各式中值等于 −16 的是：", "options": ["(−2)^4", "−2^4", "(−4)^2", "2^4"], "answer": 1, "explain": "−2^4 表示 2 的四次幂取相反数，等于 −16；(−2)^4=16，(−4)^2=16，2^4=16。", "relatedConceptId": "", "prerequisites": ["ch03"]}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "下列方根中，结果不是有理数的是：", "options": ["√49", "∛(−27)", "√2", "√0.25"], "answer": 2, "explain": "√49=7；∛(−27)=−3；√0.25=0.5；而 2 不是任何有理数的平方，√2 不是有理数。", "relatedConceptId": "", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "ch04", "type": "single", "question": "“√2 不是有理数”的反证中，关键矛盾是：", "options": ["m、n 都很大", "m、n 同為偶数，与互质矛盾", "√2 是无限小数", "2 不是平方数"], "answer": 1, "explain": "由 m²=2n² 推出 m 偶，再由 m=2k 推出 n 偶，于是 m、n 有公因数 2，与“最简分数”矛盾。", "relatedConceptId": "c01", "prerequisites": ["ch04"]}, {"id": "q08", "chapterId": "ch04", "type": "single", "question": "下列数中是无理数的是：", "options": ["0.121212…（循环）", "√16", "π", "22/7"], "answer": 2, "explain": "循环小数是有理数；√16=4；22/7 是分数；π 不是任何整系数多项式方程的根，是无理数（超越数）。", "relatedConceptId": "c01", "prerequisites": ["ch04"]}, {"id": "q09", "chapterId": "ch05", "type": "single", "question": "用 √2 的截断序列 x_n 近似，要保证误差小于 10^-5，至少取到第几位？", "options": ["3", "4", "5", "6"], "answer": 2, "explain": "误差上界是 10^-n，要求 10^-n<10^-5，需 n≥5，故取 x_5=1.41421。", "relatedConceptId": "c03", "prerequisites": ["ch05"]}, {"id": "q10", "chapterId": "ch05", "type": "single", "question": "下列数中，属于超越数的是：", "options": ["√2", "黄金比 (1+√5)/2", "π", "22/7"], "answer": 2, "explain": "√2 是 x²−2=0 的根；黄金比是 x²−x−1=0 的根；22/7 是有理数；π 不是任何整系数多项式方程的根，是超越数。", "relatedConceptId": "c03", "prerequisites": ["ch05"]}, {"id": "q11", "chapterId": "__all__", "type": "single", "question": "关于有理数与无理数，下列说法正确的是：", "options": ["无限小数都是无理数", "√9 是无理数", "有理数在数轴上稠密但不连续", "两个无理数的和一定是无理数"], "answer": 2, "explain": "无限循环小数是有理数；√9=3；√2+(−√2)=0 是有理数，故 D 错；有理数稠密但数轴上有缝，C 正确。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q12", "chapterId": "__all__", "type": "single", "question": "用截断序列逼近 π，取 x_2=3.14，误差满足：", "options": ["误差小于 0.001", "误差小于 0.01", "误差大于 0.01", "无法判断"], "answer": 1, "explain": "截断到两位小数，砍掉的尾部小于 0.01，故 0≤π−3.14<0.01。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q13", "chapterId": "__all__", "type": "single", "question": "“代数数可数、实数不可数”这个论证直接说明：", "options": ["所有实数都是代数数", "超越数存在且数量极多", "代数数都是有理数", "π 是有理数"], "answer": 1, "explain": "可数集合无法覆盖不可数集合，所以必有非代数数的实数，即超越数；而且余下的数量远多于代数数。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：有理数的概念与数轴」的一句话核心是什么？", "back": "有理数就是能写成两个整数之比的数；数轴把这套数按大小排成一条线，右边的永远比左边大。", "tags": ["rational-irrational", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：有理数的四则运算」的一句话核心是什么？", "back": "减法是加相反数，除法是乘倒数；所有符号规则都由分配律推出来，不是额外规定。", "tags": ["rational-irrational", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：乘方与开方」的一句话核心是什么？", "back": "乘方是相同因数连乘的简写；开方是它的逆运算——开得尽时结果是有理数，开不尽时结果就跳出有理数集。", "tags": ["rational-irrational", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：无理数与实数」的一句话核心是什么？", "back": "开不尽的方根不能写成两个整数之比，这类数叫无理数；有理数与无理数合起来是实数，实数把数轴填满了。", "tags": ["rational-irrational", "核心"]}, {"id": "f05", "chapterId": "ch05", "front": "「第 5 章：逼近、代数数与超越数」的一句话核心是什么？", "back": "无理数用有理数列逼近，误差随位数缩小到任意小——这就是极限的雏形；能当整系数多项式方程的根的叫代数数，当不了的叫超越数。", "tags": ["rational-irrational", "核心"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「有理数」？", "back": "能写成两个整数之比 m/n（n≠0）的数，包含整数与分数。", "tags": ["rational-irrational", "术语"]}, {"id": "f07", "chapterId": "ch04", "front": "什么是「无理数」？", "back": "不是有理数的实数，即不能写成两个整数之比的数。", "tags": ["rational-irrational", "术语"]}, {"id": "f08", "chapterId": "ch01", "front": "什么是「相反数」？", "back": "对 a 而言是 −a；两者在数轴上关于原点对称。", "tags": ["rational-irrational", "术语"]}, {"id": "f09", "chapterId": "ch01", "front": "什么是「绝对值」？", "back": "数轴上表示 a 的点到原点的距离，恒为非负数。", "tags": ["rational-irrational", "术语"]}, {"id": "f10", "chapterId": "ch01", "front": "什么是「数轴」？", "back": "规定了原点、正方向和单位长度的直线。", "tags": ["rational-irrational", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「乘方」？", "back": "n 个相同因数 a 相乘的简写，记作 a^n。", "tags": ["rational-irrational", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「开方」？", "back": "求满足 x^n=a 的 x 的运算，是乘方的逆运算。", "tags": ["rational-irrational", "术语"]}, {"id": "f13", "chapterId": "ch03", "front": "什么是「算术根」？", "back": "非负的那个 n 次方根，记作 ⁿ√a。", "tags": ["rational-irrational", "术语"]}, {"id": "f14", "chapterId": "ch04", "front": "什么是「稠密性」？", "back": "任意两个有理数之间还存在有理数，这个性质叫有理数的稠密性。", "tags": ["rational-irrational", "术语"]}, {"id": "f15", "chapterId": "ch05", "front": "什么是「代数数」？", "back": "某个整系数多项式方程的根。", "tags": ["rational-irrational", "术语"]}, {"id": "f16", "chapterId": "ch05", "front": "什么是「超越数」？", "back": "不是代数数的实数，如 π、e。", "tags": ["rational-irrational", "术语"]}, {"id": "f17", "chapterId": "ch05", "front": "什么是「截断序列」？", "back": "把无理数的小数在第 n 位后截断得到的有理数列。", "tags": ["rational-irrational", "术语"]}], "companion": "rational-irrational学习伴侣.html", "deriv": "rational-irrational从零推导.html"}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">四则运算、分数、数数<\/span><\/div><h1>第 1 章：有理数的概念与数轴<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：四则运算、分数、数数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用“相反意义的量”解释负数是怎么被引进来的\n<\/li><li>\n分清整数、分数、有理数的范围，知道 0 的位置\n<\/li><li>\n能在数轴上定位一个有理数并比较两个负数的大小\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>有理数就是能写成两个整数之比的数；数轴把这套数按大小排成一条线，右边的永远比左边大。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 负数不是凭空规定的<\/h3>\n<p>先看两个场景。<\/p>\n<p>汽车从同一地点出发，一辆向东走 5 公里到 A 地，一辆向西走 5 公里到 B 地。两辆车走过的路程都是 5 公里，但方向相反。如果只写一个“5”，A 和 B 就分不出来了。<\/p>\n<p>温度从 5 ℃ 降到 2 ℃，写成 5−2=3 没问题；但如果从 2 ℃ 降到 5 ℃ 以下，比如降到零下 3 ℃，用原来的数算 2−5 就没有意义了。<\/p>\n<p>这两个场景的共同点是：<strong>量的两个方向（两种相反意义）需要两个不同的记号<\/strong>。做法是：规定其中一种意义为正，另一种为负。向东记作正，向西 5 公里就记作 −5 公里；零上记作正，零下 3 ℃ 就记作 −3 ℃。<\/p>\n<p>规定哪一边为正<strong>不是绝对的<\/strong>——规定向西为正也完全成立，只是不符合习惯。一旦定了，另一边就必须为负，不能两边都算正。<\/p>\n<h3>1.2 正数、负数、零<\/h3>\n<p>在原来的数（0 除外）前面放上“−”号得到的数叫<strong>负数<\/strong>，如 −5、−3/4、−10.05。原来的那些数（0 除外）叫<strong>正数<\/strong>，如 5、3/4、10.05。正数前的“+”可以省略，+5 和 5 是同一个数。<\/p>\n<p><strong>0 既不是正数也不是负数<\/strong>，它是正负之间的界线。0 也不能简单理解成“没有”：0 ℃ 不是没有温度，而是标准大气压下冰水混合的那个确定温度。<\/p>\n<h3>1.3 有理数包括哪些<\/h3>\n<ul><li>\n正整数、0、负整数，统称<strong>整数<\/strong>；\n<\/li><li>\n正分数、负分数，统称<strong>分数<\/strong>；\n<\/li><li>\n整数和分数合起来叫<strong>有理数<\/strong>。\n<\/ul>\n<p>所以有理数就是一切能写成 m/n 形式的数，其中 m、n 是整数且 n≠0。有限小数（如 0.25=1/4）和循环小数（如 0.333…=1/3）都是有理数。<\/p>\n<h3>1.4 数轴：给每个数找一个位置<\/h3>\n<p>画一条直线，指定：<\/p>\n<ol><li>\n<strong>原点<\/strong>（对应 0 的那个点）；\n<\/li><li>\n<strong>正方向<\/strong>（通常向右，画箭头）；\n<\/li><li>\n<strong>单位长度<\/strong>（一个固定的长度算作 1）。\n<\/ol>\n<p>这条线就是数轴。每个有理数都能在数轴上找到一个点：正数在原点右边，负数在左边，到原点的距离由绝对值决定。<\/p>\n<p>反过来要注意：数轴上的点<strong>不一定<\/strong>都是有理数。这条“填不满”的缝，第 4 章会用 √2 补上。<\/p>\n<h3>1.5 相反数与绝对值<\/h3>\n<p><strong>相反数<\/strong>：a 的相反数是 −a。注意 −a 不一定是负数——当 a=−3 时，−a=3 是正数；当 a=0 时，−a=0。<\/p>\n<p><strong>绝对值<\/strong>：|a| 表示数轴上表示 a 的点到原点的距离，所以 |a|≥0 恒成立。|−3|=3，|3|=3，|0|=0。<\/p>\n<p>两者关系：|a| 就是 a 与 −a 中那个非负的数。<\/p>\n<h3>1.6 比较大小<\/h3>\n<p>规则只有一条：<strong>数轴上右边的数比左边的大<\/strong>。由此得到三条常用结论：<\/p>\n<ul><li>\n任何正数 &gt; 0 &gt; 任何负数；\n<\/li><li>\n两个负数比大小，绝对值大的反而小（因为它离原点更远、位置更靠左）；\n<\/li><li>\n比较分数可以先通分，也可以化成小数（但循环小数要当心精度）。\n<\/ul>\n<p>例：比较 −7/8 与 −6/7。通分：−49/56 与 −48/56。因为 49&gt;48，所以 −49/56 &lt; −48/56，即 −7/8 &lt; −6/7。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[&quot;原点 0&quot;] --&gt; B[&quot;正方向 →&quot;]\n  A --&gt; C[&quot;负方向 ←&quot;]\n  B --&gt; D[&quot;+1 +2 +3 … 越右越大&quot;]\n  C --&gt; E[&quot;-1 -2 -3 … 越左越小&quot;]\n  D --&gt; F[&quot;绝对值 = 到原点的距离&quot;]\n  E --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这条轴：箭头定正方向，格子定单位长度；绝对值只量距离、不看方向，所以 |−3|=|3|。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：数轴像一把有刻度的尺子，0 是零点，往右是“正”的一侧，往左是“负”的一侧。尺子上的每个刻度都对应一个数。<\/p>\n<p><strong>失效边界<\/strong>：这把尺子只有有理数刻度时，某些长度（比如边长为 1 的正方形的对角线）量不出来——第 4 章会看到，这个长度 √2 不在尺子的刻度里。<\/p>\n<p><strong>实例<\/strong>：某地一天的气温从 −3 ℃ 升到 7 ℃，温差是多少？ 解：温差 = 7−(−3) = 7+3 = 10（℃）。用数轴看，就是从 −3 这个点向右移动 10 格到达 7。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 −a 一定是负数 —— 实际上 a 本身可能是负数或 0：a=−3 时 −a=3，a=0 时 −a=0。符号“−”在这里表示“取相反数”，不是“一定是负”。\n<\/li><li>\n别以为 |a| 一定等于 a —— 实际上 只有 a≥0 时 |a|=a；a&lt;0 时 |a|=−a。绝对值的结果永远非负，a 本身可正可负。\n<\/li><li>\n别以为 0 就是“没有” —— 实际上 0 是一个确定的数，表示正负的分界，也对应数轴上的原点、0 ℃ 这样的具体状态。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列各数中，是负有理数的是：\n<\/li><li>\n比较 −7/8 与 −6/7 的大小，正确的是：\n<p>A. −3/4 ｜ B. 0 ｜ C. |−2| ｜ D. −(−5) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：−3/4 是负分数，属有理数。0 不是负数；|−2|=2 是正数；−(−5)=5 是正数。 A. −7/8 &gt; −6/7 ｜ B. −7/8 &lt; −6/7 ｜ C. −7/8 = −6/7 ｜ D. 无法比较 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：通分得 −49/56 与 −48/56。两负数比较，绝对值大的反而小，49&gt;48，所以 −7/8 &lt; −6/7。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n有理数 ⇔ 能写成 m/n（n≠0）\n<\/li><li>\n数轴三要素：原点、正方向、单位长度\n<\/li><li>\n|a| 是距离，恒 ≥0；−a 只是“取相反”\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：有理数的概念与数轴）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：有理数的概念与数轴<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>先承认我们只有“数数”和“分份”这两件事，然后看负数是怎么被逼出来的，最后把它排到一条线上。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>有理数：存在整数 m 与正整数 n，使 x = m/n。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>数轴像一把刻度尺：原点对齐 0，往右读正数，往左读负数；刻度越密，能标出的数越多，但这把尺子始终有量不到的长度。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 把“相反意义的量”写成数<\/h3>\n<div class=\"katex-block\">\\text{向东 }5\\ \\Rightarrow +5,\\qquad \\text{向西 }5\\ \\Rightarrow -5<\/div>\n<p>先约定一个方向为正，反方向自动记负号；约定可以反过来，但只能选一个。<\/p>\n<h3>2. 有理数的形式定义<\/h3>\n<div class=\"katex-block\">\\mathbb{Q}=\\left\\{\\frac{m}{n}\\ \\middle|\\ m\\in\\mathbb{Z},\\ n\\in\\mathbb{N}^{+}\\right\\}<\/div>\n<p>整数是 n=1 的特例，有限小数与循环小数都能写成这种形式。<\/p>\n<h3>3. 绝对值：只量距离<\/h3>\n<div class=\"katex-block\">|a|=\\begin{cases}a, & a\\ge 0\\\\ -a, & a<0\\end{cases}<\/div>\n<p>所以 |a|≥0 永远成立；a&lt;0 时 |a|=−a 是正数。<\/p>\n<h3>4. 大小比较归结为符号<\/h3>\n<div class=\"katex-block\">a&lt;b \\iff b-a>0<\/div>\n<p>两负数比较时，b−a&gt;0 意味着“大数”减“小数”为正；等价地，绝对值大的那个更小。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>有刻度尺不等于尺子连续：有理数在数轴上是稠密的（任意两点之间还有有理数），但仍有“洞”，这个洞要靠无理数填。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《有理数与无理数》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 1 章：有理数的概念与数轴"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：有理数的概念与数轴<\/a><\/span><\/div><h1>第 2 章：有理数的四则运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、分数运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按符号规则正确做有理数加减乘除\n<\/li><li>\n用分配律自己推出“负负得正”，而不是背结论\n<\/li><li>\n解释为什么有理数集对四则运算封闭（除数不为 0）\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>减法是加相反数，除法是乘倒数；所有符号规则都由分配律推出来，不是额外规定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 加法：两条规则<\/h3>\n<ul><li>\n<strong>同号相加<\/strong>：取相同的符号，绝对值相加。如 (−7)+(−4)=−11。\n<\/li><li>\n<strong>异号相加<\/strong>：取绝对值较大的那个数的符号，用较大的绝对值减去较小的绝对值。如 (−7)+4=−3。\n<\/ul>\n<p>再加两条特殊情形：a+0=a；互为相反数的两个数相加得 0。<\/p>\n<h3>2.2 减法就是加相反数<\/h3>\n<blockquote>a − b = a + (−b)<\/blockquote>\n<p>所以 (−7)−4=(−7)+(−4)=−11；(−7)−(−4)=(−7)+4=−3。减法不需要另立一套符号规则。<\/p>\n<h3>2.3 乘法：符号怎么定<\/h3>\n<ul><li>\n同号得正，异号得负；\n<\/li><li>\n任何数与 0 相乘得 0；\n<\/li><li>\n绝对值相乘。\n<\/ul>\n<p>于是 (−2)(−3)=6，(−2)(3)=−6。<\/p>\n<p><strong>“负负得正”不是硬规定的<\/strong>，它可以从分配律推出来：<\/p>\n<p>展开：(−a)[(−b)+b] = (−a)(−b) + (−a)b = 0，所以 (−a)(−b) = ab。<\/p>\n<p>所以 (−a)(−b)=−(−a)b=ab。也就是说，只要承认分配律，负负得正就是唯一不矛盾的选择。<\/p>\n<h3>2.4 除法就是乘倒数<\/h3>\n<p>a ÷ b = a × (1/b)（b ≠ 0）<\/p>\n<p>符号规则与乘法相同：同号得正、异号得负。除以一个数等于乘它的倒数，所以<strong>除数不能为 0<\/strong>——0 没有倒数。<\/p>\n<h3>2.5 运算律与“数域”<\/h3>\n<p>加法满足交换律、结合律；乘法满足交换律、结合律；乘法对加法满足分配律。<\/p>\n<p>正因为有这些运算律，有理数集对加、减、乘、除（除数≠0）是<strong>封闭<\/strong>的：算来算去还是有理数。数学上把这样的数集叫<strong>数域<\/strong>。这一点很关键——第 3 章开方就会发现，封闭性在这里第一次被打破。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[&quot;有理数 a, b&quot;] --&gt; B[&quot;加法：同号／异号两条规则&quot;]\n  A --&gt; C[&quot;减法：a-b = a+(-b)&quot;]\n  A --&gt; D[&quot;乘法：同号得正、异号得负&quot;]\n  A --&gt; E[&quot;除法：a÷b = a×(1/b), b≠0&quot;]\n  B --&gt; F[&quot;交换律、结合律、分配律&quot;]\n  C --&gt; F\n  D --&gt; F\n  E --&gt; F\n  F --&gt; G[&quot;结果仍是有理数：数域封闭&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这张图：四条运算最终都落在同一组运算律上，封闭性是由“结果仍属于有理数集”体现的。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：正负号像“方向牌”。同向走两步是加速（同号得正），反向走是被抵消（异号得负）；乘法的符号规则相当于“转向两次回到原方向”。<\/p>\n<p><strong>失效边界<\/strong>：这个类比只管符号方向，不管大小；绝对值部分仍要单独算。<\/p>\n<p><strong>实例<\/strong>：计算 −3/4 + 5/6 − 1/2。 通分（分母 12）：−9/12 + 10/12 − 6/12 = (−9+10−6)/12 = −5/12。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 “负负得正”是人为规定、没有道理 —— 实际上 它可以由分配律推出：由 (−a)[(−b)+b]=0 得 (−a)(−b)=ab。承认分配律，就没有别的选择。\n<\/li><li>\n别以为 减一个负数等于减一个正数 —— 实际上 减去负数等于加上它的相反数：a−(−b)=a+b。例如 5−(−3)=8。\n<\/li><li>\n别以为 除以 0 也能算，只是结果很大 —— 实际上 0 没有倒数，a÷0 在有理数里没有定义；这不是“算不出来”，而是运算本身不成立。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n计算 (−2)(−3)+(−4) 的结果是：\n<\/li><li>\n下列运算中，能说明有理数集对除法不封闭的是：\n<p>A. −10 ｜ B. 2 ｜ C. 10 ｜ D. −2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：(−2)(−3)=6（同号得正），再加 −4 得 2。 A. 3÷4=3/4 ｜ B. (−6)÷2=−3 ｜ C. 5÷0 没有意义 ｜ D. 0÷7=0 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：封闭要求“任意两个元素运算后仍在集合内”。5÷0 因为除数没有倒数而不成立，说明除法必须把 0 排除在外。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na−b=a+(−b)，a÷b=a×(1/b)\n<\/li><li>\n符号规则来自分配律，不是额外约定\n<\/li><li>\n有理数集是数域，除法要求除数≠0\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：有理数的四则运算）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：有理数的四则运算<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>四则运算看起来是“规定”，其实除了分配律之外没有多余假设。下面把每条规则从分配律推出来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>数域：一个数集对加、减、乘、除（除数非零）封闭，且满足交换、结合、分配律。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>分配律像“拆包”：a(b+c) 等于把 a 分别乘给 b 和 c。符号规则是拆包之后的必然结果，不是另贴的标签。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 加法与相反数<\/h3>\n<div class=\"katex-block\">a+(-a)=0,\\qquad a-b:=a+(-b)<\/div>\n<p>减法不是新运算，是“加相反数”的缩写。<\/p>\n<h3>2. 分配律<\/h3>\n<div class=\"katex-block\">a(b+c)=ab+ac<\/div>\n<p>这是四则运算里唯一需要当作公理接受的性质。<\/p>\n<h3>3. 推出负负得正<\/h3>\n<div class=\"katex-block\">(-a)\\big[(-b)+b\\big]=(-a)(-b)+(-a)b=0<\/div>\n<p>括号内 (−b)+b=0，所以 (−a)(−b) 必须是 (−a)b 的相反数，即 ab。<\/p>\n<h3>4. 除法与封闭性<\/h3>\n<div class=\"katex-block\">\\frac{a}{b}=a\\cdot b^{-1}\\ (b\\ne 0),\\qquad a,b\\in\\mathbb{Q}\\Rightarrow \\frac{a}{b}\\in\\mathbb{Q}<\/div>\n<p>有理数的倒数仍是有理数，所以除法在“除数非零”的前提下不跑出数集。<\/p>\n<h3>5. 数域的定义式<\/h3>\n<div class=\"katex-block\">\\mathbb{Q}\\ \\text{对}\\ +,-,\\times,\\div\\ (\\div 0\\ \\text{除外})\\ \\text{封闭}<\/div>\n<p>封闭性是后面判断“开方是否还能留在数集里”的标尺。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>这套推导只依赖分配律与 0 的性质；换成别的数系（比如模运算），分配律仍成立，但“倒数”不一定存在。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《有理数与无理数》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 2 章：有理数的四则运算"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：有理数的四则运算<\/a><\/span><\/div><h1>第 3 章：乘方与开方<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清 a<sup>n<\/sup> 的定义与符号规律，分清 (−2)<sup>4<\/sup> 与 −2<sup>4<\/sup>\n<\/li><li>\n由指数法则推出 a<sup>0<\/sup>=1 与 a<sup>-n<\/sup>=1/a<sup>n<\/sup>\n<\/li><li>\n判断一个方根开得尽还是开不尽\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>乘方是相同因数连乘的简写；开方是它的逆运算——开得尽时结果是有理数，开不尽时结果就跳出有理数集。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 乘方的定义<\/h3>\n<p>a<sup>n<\/sup> = a × a × … × a（n 个 a 相乘）<\/p>\n<p>a 叫底数，n 叫指数，结果叫幂。n 是正整数时这是“连乘”的缩写。<\/p>\n<p>符号规律：<\/p>\n<ul><li>\n正数的任何次幂都是正数；\n<\/li><li>\n负数的偶次幂是正数，奇次幂是负数；\n<\/li><li>\n0 的正整数次幂是 0。\n<\/ul>\n<p>所以 (−2)<sup>4<\/sup>=16，而 (−2)<sup>3<\/sup>=−8。<\/p>\n<p><strong>注意括号<\/strong>：(−2)<sup>4<\/sup> 表示“−2 这个数”的四次幂，等于 16；−2<sup>4<\/sup> 表示“2 的四次幂取相反数”，等于 −16。差一对括号，结果差一个符号。<\/p>\n<h3>3.2 指数法则<\/h3>\n<p>a<sup>m<\/sup> × a<sup>n<\/sup> = a<sup>m+n<\/sup>；(a<sup>m<\/sup>)<sup>n<\/sup> = a<sup>mn<\/sup>；(ab)<sup>n<\/sup> = a<sup>n<\/sup> × b<sup>n<\/sup><\/p>\n<p>这三条在正整数指数下可以直接由“连乘”验证。<\/p>\n<h3>3.3 零指数与负指数<\/h3>\n<p>要让 a<sup>m<\/sup>/a<sup>n<\/sup>=a<sup>m−n<\/sup> 在 m=n 时也成立，必须有 a<sup>0<\/sup>=1（a≠0）。<\/p>\n<p>要让它在 m&lt;n 时也成立，必须有<\/p>\n<p>a<sup>−n<\/sup> = 1 / a<sup>n<\/sup>（a ≠ 0）<\/p>\n<p>这两条不是新规定，而是“让指数法则不出现例外”的唯一选择。<\/p>\n<h3>3.4 开方与算术根<\/h3>\n<p>如果 x<sup>n<\/sup>=a，就说 x 是 a 的一个 n 次方根。求方根的运算叫开方，它是乘方的逆运算。<\/p>\n<ul><li>\nn 为偶数时，a&gt;0 有两个 n 次方根，互为相反数；其中非负的那个叫<strong>算术根<\/strong>，记作 ⁿ√a；\n<\/li><li>\nn 为奇数时，a 的 n 次方根只有一个，符号与 a 相同。\n<\/ul>\n<p>例如 √81=9（算术根，另一个根是 −9）；∛(−8)=−2；√0=0。<\/p>\n<h3>3.5 开得尽与开不尽<\/h3>\n<p>如果 a 能写成某个有理数的 n 次幂，方根就是有理数，叫“开得尽”。例如 81=9<sup>2<\/sup>，所以 √81=9。<\/p>\n<p>如果开不尽，结果就<strong>不是有理数<\/strong>。例如 2 不是任何有理数的平方，√2 就不在有理数集里。这正是下一章的入口。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[&quot;aⁿ：n 个 a 连乘&quot;] --&gt; B[&quot;指数法则&quot;]\n  B --&gt; C[&quot;a⁰=1（a≠0）&quot;]\n  B --&gt; D[&quot;a⁻ⁿ=1/aⁿ（a≠0）&quot;]\n  A --&gt; E[&quot;逆运算：开方&quot;]\n  E --&gt; F{&quot;a 是否等于某个有理数的 n 次幂？&quot;}\n  F --&gt;|是| G[&quot;开得尽：方根是有理数&quot;]\n  F --&gt;|否| H[&quot;开不尽：方根不是有理数&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这个判断分支：开方是否留在有理数集里，取决于被开方数是不是有理数的 n 次幂，而不取决于我们算得够不够快。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：乘方像“把一个数按倍数叠高”，开方像“问这个高度是几层叠出来的”。叠得整齐（开得尽）就有整数答案，叠得不整齐（开不尽）就没有有理答案。<\/p>\n<p><strong>失效边界<\/strong>：这个类比默认“层数”是整数；一旦允许分数指数，乘方与开方的界线就模糊了。<\/p>\n<p><strong>实例<\/strong>：判断 √36、√50、∛27 是否开得尽。 √36=6（36=6<sup>2<\/sup>，开得尽）；∛27=3（27=3<sup>3<\/sup>，开得尽）；√50 开不尽——因为 50 介于 7<sup>2<\/sup>=49 与 8<sup>2<\/sup>=64 之间，且 50 不是任何有理数的平方。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 (−2)<sup>4<\/sup> 与 −2<sup>4<\/sup> 是一回事 —— 实际上 前者是 (−2)<sup>4<\/sup>=16，后者是 −(2<sup>4<\/sup>)=−16。括号决定“负号属于底数还是属于整个幂”。\n<\/li><li>\n别以为 a<sup>0<\/sup>=0 —— 实际上 a<sup>0<\/sup>=1（a≠0）。由 a<sup>n<\/sup>/a<sup>n<\/sup>=1 与指数法则相减即可得到；0<sup>0<\/sup> 无定义。\n<\/li><li>\n别以为 √a 一定是正数 —— 实际上 算术根非负，但方程 x<sup>2<\/sup>=a 有两个根 ±√a；说“方根”时必须区分“算术根”和“全部根”。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列各式中值等于 −16 的是：\n<\/li><li>\n下列方根中，结果不是有理数的是：\n<p>A. (−2)<sup>4<\/sup> ｜ B. −2<sup>4<\/sup> ｜ C. (−4)<sup>2<\/sup> ｜ D. 2<sup>4<\/sup> <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：−2<sup>4<\/sup> 表示 2 的四次幂取相反数，等于 −16；(−2)<sup>4<\/sup>=16，(−4)<sup>2<\/sup>=16，2<sup>4<\/sup>=16。 A. √49 ｜ B. ∛(−27) ｜ C. √2 ｜ D. √0.25 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：√49=7；∛(−27)=−3；√0.25=0.5；而 2 不是任何有理数的平方，√2 不是有理数。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na<sup>n<\/sup> 是连乘的缩写，括号决定负号归属\n<\/li><li>\na<sup>0<\/sup>=1、a<sup>-n<\/sup>=1/a<sup>n<\/sup> 由指数法则逼出来\n<\/li><li>\n开得尽 ⇔ 被开方数是有理数的 n 次幂\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：乘方与开方）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：乘方与开方<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>乘方只是缩写；真正有意思的是为了让指数法则不出例外，0 指数和负指数被“逼”出来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>a<sup>n<\/sup>（n 为正整数）表示 n 个 a 相乘；开方是求满足 x<sup>n<\/sup>=a 的 x。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>乘方是“把一张纸对折 n 次后的层数”，开方是“问折了几次才有这么多层”。折不满整次时，答案就落到有理数之外。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 乘方的定义<\/h3>\n<div class=\"katex-block\">a^n=\\underbrace{a\\cdot a\\cdots a}_{n\\ \\text{个}},\\quad n\\in\\mathbb{N}^{+}<\/div>\n<p>这是“连乘”的缩写，底数是 a，指数是 n。<\/p>\n<h3>2. 指数法则<\/h3>\n<div class=\"katex-block\">a^{m}a^{n}=a^{m+n},\\quad (a^{m})^{n}=a^{mn},\\quad (ab)^{n}=a^{n}b^{n}<\/div>\n<p>三条法则都能由“数一数有几个 a”直接验证。<\/p>\n<h3>3. 让法则无例外：零指数<\/h3>\n<div class=\"katex-block\">a^{n}/a^{n}=a^{n-n}=a^{0}=1\\quad(a\\ne 0)<\/div>\n<p>如果不定义 a<sup>0<\/sup>=1，指数法则在 m=n 时就会破例。<\/p>\n<h3>4. 负指数<\/h3>\n<div class=\"katex-block\">a^{-n}=\\frac{1}{a^{n}}\\quad(a\\ne 0)<\/div>\n<p>为了让 a<sup>m-n<\/sup> 在 m&lt;n 时仍成立，只能把负指数解释成倒数。<\/p>\n<h3>5. 开方与算术根<\/h3>\n<div class=\"katex-block\">x^{n}=a\\ \\Longrightarrow\\ x=\\pm\\sqrt[n]{a}\\ (n\\ \\text{偶}),\\qquad \\sqrt[n]{a}\\ge 0<\/div>\n<p>偶数次方根有两个，算术根取非负的那个；奇数次方根唯一。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>分数指数把乘方与开方合并成同一个运算，此时“开不尽”不再表示数不存在，只表示它不是有理数。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《有理数与无理数》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 3 章：乘方与开方"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：乘方与开方<\/a><\/span><\/div><h1>第 4 章：无理数与实数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出 √2 不是有理数的完整反证\n<\/li><li>\n说出无理数的两类常见来源\n<\/li><li>\n解释实数与数轴上的点为什么一一对应\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>开不尽的方根不能写成两个整数之比，这类数叫无理数；有理数与无理数合起来是实数，实数把数轴填满了。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 √2 不是有理数<\/h3>\n<p>假设 √2 是有理数，那么它可以写成最简分数<\/p>\n<p>√2 = m / n<\/p>\n<p>其中 m、n 是正整数且互质（没有公因数）。<\/p>\n<p>两边平方：2=m²/n²，即<\/p>\n<p>m² = 2n²<\/p>\n<p>右边是偶数，所以 m² 是偶数，于是 m 是偶数。设 m=2k，代入得 4k²=2n²，即 n²=2k²，同理 n 也是偶数。<\/p>\n<p>m、n 都是偶数，与“互质”矛盾。所以假设不成立，√2 不是有理数。<\/p>\n<p>这个证明只用了一条性质：<strong>平方为偶数的整数必为偶数<\/strong>。<\/p>\n<h3>4.2 无理数的两类来源<\/h3>\n<ol><li>\n<strong>开不尽的方根<\/strong>：√2、√3、∛5 等；\n<\/li><li>\n<strong>圆周率 π 这一类<\/strong>：它不是任何整系数多项式方程的根（第 5 章会给出这个说法的名字：超越数）。\n<\/ol>\n<p>无理数的共同点是：写成小数既不终止也不循环。√2=1.41421356…，π=3.14159265…，都看不到循环节。<\/p>\n<h3>4.3 实数与数轴<\/h3>\n<p>有理数和无理数合起来叫<strong>实数<\/strong>。实数的关键性质是：<\/p>\n<blockquote>数轴上的每一个点都对应一个实数，每一个实数都对应数轴上的一个点。<\/blockquote>\n<p>这叫“一一对应”。第 1 章说过有理数在数轴上填不满，现在这些缝隙被无理数补上了。<\/p>\n<h3>4.4 实数的大小与运算<\/h3>\n<p>实数比较大小仍然看数轴：右边的更大。具体操作时常用有理数近似：要比较 √2 与 1.414，只需比较它们的平方（都是正数，平方保序）：2 &gt; 1.414²=1.999396，所以 √2&gt;1.414。<\/p>\n<p>实数的加、减、乘、除（除数非零）仍然封闭，实数集也是数域；运算时常用“取到足够精度的有理近似”来算，结果再用误差控制说明可靠性。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[&quot;有理数 Q：m/n&quot;] --&gt; C[&quot;实数 R&quot;]\n  B[&quot;无理数：开不尽的方根、π、e&quot;] --&gt; C\n  C --&gt; D[&quot;与数轴上的点一一对应&quot;]\n  D --&gt; E[&quot;比较大小：右边的更大&quot;]\n  D --&gt; F[&quot;运算：借有理近似 + 误差控制&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这张图：实数不是“又一种数”，而是有理数与无理数的并集；一一对应是它最关键的结构性质。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：有理数像尺子上刻好的刻度，无理数像刻度之间的“缝”。缝看不见，但量对角线时就会暴露——边长为 1 的正方形，对角线长 √2，任何刻度都量不准。<\/p>\n<p><strong>失效边界<\/strong>：这个类比只在“一维数轴”上成立；到了二维平面，“点”和“数”的对应要换成“点”和“数对”。<\/p>\n<p><strong>实例<\/strong>：比较 √3 与 1.7 的大小。 两边都是正数，平方保序：3 与 2.89 比较，3&gt;2.89，所以 √3&gt;1.7。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 无理数就是“开不尽的数” —— 实际上 开不尽的方根只是无理数的一类；π、e 这类超越数同样是无理数，但不是方根形式。\n<\/li><li>\n别以为 无限小数都是无理数 —— 实际上 0.333…=1/3 是无限循环小数，属有理数。只有“不循环”的无限小数才是无理数。\n<\/li><li>\n别以为 实数比有理数“多一些”，结构差不多 —— 实际上 实数与数轴一一对应、且是完备的（没有缝隙）；有理数虽然稠密，但有缝隙，这是本质差别。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“√2 不是有理数”的反证中，关键矛盾是：\n<\/li><li>\n下列数中是无理数的是：\n<p>A. m、n 都很大 ｜ B. m、n 同為偶数，与互质矛盾 ｜ C. √2 是无限小数 ｜ D. 2 不是平方数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：由 m²=2n² 推出 m 偶，再由 m=2k 推出 n 偶，于是 m、n 有公因数 2，与“最简分数”矛盾。 A. 0.121212…（循环） ｜ B. √16 ｜ C. π ｜ D. 22/7 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：循环小数是有理数；√16=4；22/7 是分数；π 不是任何整系数多项式方程的根，是无理数（超越数）。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n√2 无理性的证明：平方 → 偶性 → 与互质矛盾\n<\/li><li>\n实数 = 有理数 ∪ 无理数，与数轴一一对应\n<\/li><li>\n无限不循环小数 ⇔ 无理数\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：无理数与实数）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：无理数与实数<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>这一节只做一件事：把“√2 不是有理数”证到底。证完，数轴的缝就有了名字。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>无理数：不是有理数的实数，即不能写成两个整数之比的数。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>反证法像“先把门锁上再找钥匙”：假设结论的反面成立，一路推到自相矛盾，就说明反面根本进不去。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 反设<\/h3>\n<div class=\"katex-block\">\\sqrt{2}=\\frac{m}{n},\\quad m,n\\in\\mathbb{N}^{+},\\ \\gcd(m,n)=1<\/div>\n<p>假设它是有理数，并取最简形式——这一步保证了后面能用“互质”制造矛盾。<\/p>\n<h3>2. 平方<\/h3>\n<div class=\"katex-block\">2=\\frac{m^{2}}{n^{2}}\\ \\Longrightarrow\\ m^{2}=2n^{2}<\/div>\n<p>分母乘过去，得到整数等式；右边含因子 2。<\/p>\n<h3>3. m 为偶数<\/h3>\n<div class=\"katex-block\">m^{2}=2n^{2}\\ \\Rightarrow\\ 2\\mid m^{2}\\ \\Rightarrow\\ 2\\mid m<\/div>\n<p>平方为偶数则底数为偶数：若 m 为奇数，m² 也是奇数。<\/p>\n<h3>4. n 也为偶数<\/h3>\n<div class=\"katex-block\">m=2k\\ \\Rightarrow\\ 4k^{2}=2n^{2}\\ \\Rightarrow\\ n^{2}=2k^{2}\\ \\Rightarrow\\ 2\\mid n<\/div>\n<p>把 m=2k 代回，同样的理由推出 n 也是偶数。<\/p>\n<h3>5. 矛盾<\/h3>\n<div class=\"katex-block\">2\\mid m,\\ 2\\mid n\\ \\Rightarrow\\ \\gcd(m,n)\\ge 2\\ \\Rightarrow\\ \\sqrt{2}\\notin\\mathbb{Q}<\/div>\n<p>与最简分数的互质性冲突，假设不成立。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>这个证明只对“平方数”有效；证 ∛2 无理性要用质因数分解或更一般的论证。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《有理数与无理数》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 4 章：无理数与实数"}, "ch05": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：无理数与实数<\/a><\/span><\/div><h1>第 5 章：逼近、代数数与超越数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出 √2 的十进制截断序列并估计误差\n<\/li><li>\n说明代数数与超越数的区别，各举两例\n<\/li><li>\n用“可数／不可数”解释超越数为什么大量存在\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>无理数用有理数列逼近，误差随位数缩小到任意小——这就是极限的雏形；能当整系数多项式方程的根的叫代数数，当不了的叫超越数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 十进制截断序列<\/h3>\n<p>把 √2 的小数一位位截下来：<\/p>\n<p>1.4，1.41，1.414，1.4142，……<\/p>\n<p>第 n 个截断值记作 x_n，它满足<\/p>\n<p>0 ≤ √2 − x_n &lt; 10<sup>−n<\/sup><\/p>\n<p>所以 n 越大，误差越小，想多小就多小。这个“要多大精度就给多大精度”的性质，就是后面极限概念的起点。<\/p>\n<h3>5.2 误差估计怎么用<\/h3>\n<p>比如要保证误差小于 0.001，取 n=3 就够：x_3=1.414，误差小于 10<sup>-3<\/sup>。<\/p>\n<p>实际计算时还要注意：截断是“向下取”，所以 x_n 总是比 √2 小；如果四舍五入，误差可能正也可能负，估计时要加绝对值。<\/p>\n<h3>5.3 最佳渐近分数<\/h3>\n<p>除了十进制，还可以用分数逼近。把 √2 展开成连分数，得到<\/p>\n<p>1，3/2，7/5，17/12，41/29，……<\/p>\n<p>这些分数叫 √2 的渐近分数。它们的误差比同分母的其他分数都小，所以叫“最佳”。原书第 14 节给出了这套分数的构造与误差比较。<\/p>\n<h3>5.4 代数数<\/h3>\n<p>如果一个数能是某个整系数多项式方程的根，它就叫<strong>代数数<\/strong>。<\/p>\n<ul><li>\n√2 是 x²−2=0 的根，是代数数；\n<\/li><li>\n黄金比 (1+√5)/2 是 x²−x−1=0 的根，是代数数；\n<\/li><li>\n所有有理数都是代数数（q 是 nx−p=0 的根）。\n<\/ul>\n<h3>5.5 超越数<\/h3>\n<p>不是代数数的实数叫<strong>超越数<\/strong>。π 和 e 都是超越数（证明很难，原书只给出思路）。<\/p>\n<p>为什么超越数一定存在？因为：<\/p>\n<ul><li>\n整系数多项式只有可数多个，每个只有有限个根，所以代数数<strong>可数<\/strong>；\n<\/li><li>\n实数<strong>不可数<\/strong>（康托的对角线论证）。\n<\/ul>\n<p>可数的集合塞不满不可数的集合，所以一定有非代数数——超越数不仅存在，还比代数数“多得多”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[&quot;实数 R&quot;] --&gt; B[&quot;代数数：整系数多项式方程的根&quot;]\n  A --&gt; C[&quot;超越数：π、e …&quot;]\n  B --&gt; D[&quot;包含全部有理数&quot;]\n  B --&gt; E[&quot;包含 √2、∛5 等&quot;]\n  C --&gt; F[&quot;可数 vs 不可数：超越数占绝大多数&quot;]\n  A --&gt; G[&quot;十进制截断序列 → 极限&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这张图：代数数把有理数和常见的开方数都收进去了，超越数是剩下的“绝大多数”；右侧那支说明逼近是实数的通用工具。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：逼近像用越来越细的网格去圈一个点，网格越细，圈住的区域越小；但你永远只能用有限网格，点是“极限”。<\/p>\n<p><strong>失效边界<\/strong>：截断序列只能给出“越来越准”，不能直接给出 √2 的精确值；精确值只能作为那个极限存在。<\/p>\n<p><strong>实例<\/strong>：用截断序列估计 √2，要求误差小于 0.0001。 取 n=4：x_4=1.4142，误差小于 10<sup>-4<\/sup>=0.0001，满足要求。 验证：1.4142²=1.99996164&lt;2，且 (1.4143)²=2.00024… &gt;2，说明 √2 确实夹在两者之间。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 只要算得够多，无理数就能算尽 —— 实际上 无理数的小数不终止也不循环，任何有限位都只是近似；精确值只能由极限或代数关系刻画。\n<\/li><li>\n别以为 π 是无理数，所以它不属于实数 —— 实际上 π 是实数，只是不是有理数；无理数本来就是实数的一部分。\n<\/li><li>\n别以为 代数数都是无理数 —— 实际上 有理数也是代数数（例如 2 是 x−2=0 的根），代数数包含全部有理数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用 √2 的截断序列 x_n 近似，要保证误差小于 10<sup>-5<\/sup>，至少取到第几位？\n<\/li><li>\n下列数中，属于超越数的是：\n<p>A. 3 ｜ B. 4 ｜ C. 5 ｜ D. 6 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：误差上界是 10<sup>-n<\/sup>，要求 10<sup>-n<\/sup>&lt;10<sup>-5<\/sup>，需 n≥5，故取 x_5=1.41421。 A. √2 ｜ B. 黄金比 (1+√5)/2 ｜ C. π ｜ D. 22/7 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：√2 是 x²−2=0 的根；黄金比是 x²−x−1=0 的根；22/7 是有理数；π 不是任何整系数多项式方程的根，是超越数。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n截断误差 &lt;10<sup>-n<\/sup>，精度可以任意提高\n<\/li><li>\n代数数 = 整系数多项式方程的根；超越数 = 不是\n<\/li><li>\n代数数可数、实数不可数 ⇒ 超越数存在且极多\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 5 章：逼近、代数数与超越数）<\/summary><div class=\"depth-body\"><h1>第 05 章 · 从零推导：逼近、代数数与超越数<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>最后一步：既然无理数算不尽，我们怎么“抓住”它？答案是给出一串越来越近的有理数，并控制误差。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>若存在整系数多项式 P(x)（P≠0）使 P(α)=0，则 α 为代数数；否则为超越数。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>逼近像用两把尺子从左右夹住一根头发：左边的刻度不断上调、右边的不断下调，夹住的区间越来越窄，头发的位置被“确定”在没有宽度的极限里。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 截断序列<\/h3>\n<div class=\"katex-block\">x_n=\\frac{\\lfloor 10^{n}\\sqrt{2}\\rfloor}{10^{n}}<\/div>\n<p>把 √2 的小数第 n 位之后全部砍掉，得到一个有理数（分母是 10<sup>n<\/sup>）。<\/p>\n<h3>2. 误差上界<\/h3>\n<div class=\"katex-block\">0\\le \\sqrt{2}-x_n<10^{-n}<\/div>\n<p>因为砍掉的尾部小于最后一位的一个单位，所以误差严格小于 10<sup>-n<\/sup>。<\/p>\n<h3>3. 任意精度<\/h3>\n<div class=\"katex-block\">\\forall \\varepsilon>0\\ \\exists N,\\ n>N\\Rightarrow |\\sqrt{2}-x_n|<\\varepsilon<\/div>\n<p>取 N 使 10<sup>-N<\/sup>&lt;ε 即可；这就是“要多准有多准”的严格写法。<\/p>\n<h3>4. 渐近分数<\/h3>\n<div class=\"katex-block\">1,\\ \\frac{3}{2},\\ \\frac{7}{5},\\ \\frac{17}{12},\\ \\frac{41}{29},\\ldots\\ ;\\quad \\left|\\sqrt{2}-\\frac{p}{q}\\right|<\\frac{1}{q^{2}}<\/div>\n<p>连分数给出的一串分数，误差比同分母的其他分数都小。<\/p>\n<h3>5. 代数数与超越数<\/h3>\n<div class=\"katex-block\">P(\\alpha)=0,\\ P\\in\\mathbb{Z}[x]\\ \\Rightarrow\\ \\alpha\\ \\text{代数数}<\/div>\n<p>√2 是 x²−2 的根，故为代数数；π 不是任何这样的根，故为超越数。<\/p>\n<h3>6. 超越数存在<\/h3>\n<div class=\"katex-block\">\\#\\{\\text{代数数}\\}=\\aleph_0<2^{\\aleph_0}=\\#\\mathbb{R}<\/div>\n<p>代数数可数、实数不可数，所以必有不属于代数数的实数。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>截断序列只保证误差上界，不保证最快收敛；要更快逼近需用连分数或牛顿迭代。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《有理数与无理数》第 05 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 5 章：逼近、代数数与超越数"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：有理数的概念与数轴<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：无理数与实数<\/a><\/span><\/div><h1>有理数与无理数的分界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>能写成两个整数之比的叫有理数，写不成的叫无理数。<\/p>\n<h2>为什么重要<\/h2>\n<p>整本书的骨架就是这条分界线：先造出有理数，再发现它填不满数轴，于是引入无理数。判据只有一个——能不能写成 m/n。<\/p>\n<h2>详解<\/h2>\n<p>「有理数的三种外观」容易让人误判：整数、有限小数、循环小数都属有理数，因为它们都能化成 m/n。反过来，只要一个小数既不终止也不循环，它就一定不是有理数。<\/p>\n<p>判定时要避免「看起来像」：√9=3 是有理数，√2 不是；0.1010010001…（每段多一个 0）不循环，是无理数。判断依据永远是形式（能否写成比值／是否是整系数多项式方程的根），不是纸面上的样子。<\/p>\n<h2>常见误解<\/h2>\n<p>别把「开方」当成无理性的判据：√9 开了方仍然是有理数。要看开得尽不尽。<\/p>\n<h2>相关概念<\/h2>\n<p>有理数（ch01）、无理数（ch04）、实数（ch04）<\/p>", "kind": "concept", "title": "有理数与无理数的分界"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：有理数的概念与数轴<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：无理数与实数<\/a><\/span><\/div><h1>实数与数轴的一一对应<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>数轴上的每个点恰好对应一个实数，每个实数恰好对应一个点。<\/p>\n<h2>为什么重要<\/h2>\n<p>这条性质把「数」和「位置」接了起来，后面解析几何、函数图象都靠它：方程的解可以画成点，点的位置可以用数算。<\/p>\n<h2>详解<\/h2>\n<p>有理数在数轴上是稠密的：任意两个有理数之间还有有理数。稠密不等于填满——√2 对应的点就没有有理数对应。把无理数补进去之后，数轴才没有缝，这才叫完备。<\/p>\n<p>一一对应有两个方向：数 → 点（定位），点 → 数（读数）。两个方向都成立，才能把几何问题翻译成代数问题。<\/p>\n<h2>常见误解<\/h2>\n<p>稠密 ≠ 连续。有理数稠密但有缝；实数才连续。<\/p>\n<h2>相关概念<\/h2>\n<p>数轴（ch01）、无理数（ch04）、区间<\/p>", "kind": "concept", "title": "实数与数轴的一一对应"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch05\">第 5 章：逼近、代数数与超越数<\/a><\/span><\/div><h1>用有理数逼近无理数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch05\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>给出一串有理数，使它们与目标无理数的差可以小于任意给定的正数。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是极限概念的雏形。后面数列的极限、函数的极限、定积分，全都是「用一串已知的量去夹住一个未知的量」。<\/p>\n<h2>详解<\/h2>\n<p>逼近要回答两个问题：误差上界是多少（可靠性），能不能任意小（精度）。十进制截断给出的上界是 10<sup>-n<\/sup>，随 n 增大趋于 0；连分数给出的渐近分数在同样分母下误差最小。<\/p>\n<p>注意逼近不是「越来越像所以就是」：有限步永远只是近似，精确值由「极限存在」来定义，而不是由某一项给出。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为逼近序列的极限等于其中某一项；极限是序列整体趋近的那个数。<\/p>\n<h2>相关概念<\/h2>\n<p>截断序列（ch05）、渐近分数（ch05）、极限（《数列与极限》）<\/p>", "kind": "concept", "title": "用有理数逼近无理数"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：有理数的概念与数轴<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：有理数的概念与数轴<\/a><br>检查点：能说出 -a 与 |a| 的区别，能在数轴上标出 -7/3<\/li><li class='path-step' id='path-02'><strong>步骤 02：有理数的四则运算<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：有理数的四则运算<\/a><br>检查点：能用分配律解释“负负得正”，能算含分数的混合运算<\/li><li class='path-step' id='path-03'><strong>步骤 03：乘方与开方<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：乘方与开方<\/a><br>检查点：能区分 (-2)^4 与 -2^4，能判断一个方根开得尽还是开不尽<\/li><li class='path-step' id='path-04'><strong>步骤 04：无理数与实数<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：无理数与实数<\/a><br>检查点：能独立写出 √2 不是有理数的反证<\/li><li class='path-step' id='path-05'><strong>步骤 05：逼近、代数数与超越数<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：逼近、代数数与超越数<\/a><br>检查点：能说清截断序列的误差为什么小于 10^-n<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q11' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q11.<\/b> 关于有理数与无理数，下列说法正确的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 无限小数都是无理数<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> √9 是无理数<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 有理数在数轴上稠密但不连续<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 两个无理数的和一定是无理数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q12.<\/b> 用截断序列逼近 π，取 x_2=3.14，误差满足：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 误差小于 0.001<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 误差小于 0.01<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 误差大于 0.01<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q13' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q13.<\/b> “代数数可数、实数不可数”这个论证直接说明：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 所有实数都是代数数<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 超越数存在且数量极多<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 代数数都是有理数<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> π 是有理数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：有理数的概念与数轴<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 下列各数中，是负有理数的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> −3/4<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 0<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> |−2|<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> −(−5)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 比较 −7/8 与 −6/7 的大小，正确的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> −7/8 &gt; −6/7<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> −7/8 &lt; −6/7<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> −7/8 = −6/7<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 无法比较<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：有理数的四则运算<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 计算 (−2)(−3)+(−4) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> −10<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 10<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> −2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 下列运算中，能说明有理数集对除法不封闭的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 3÷4=3/4<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> (−6)÷2=−3<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 5÷0 没有意义<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 0÷7=0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：乘方与开方<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 下列各式中值等于 −16 的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> (−2)<sup>4<\/sup><\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> −2<sup>4<\/sup><\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> (−4)<sup>2<\/sup><\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 2<sup>4<\/sup><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 下列方根中，结果不是有理数的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> √49<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> ∛(−27)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> √2<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> √0.25<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：无理数与实数<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c01' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> “√2 不是有理数”的反证中，关键矛盾是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> m、n 都很大<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> m、n 同為偶数，与互质矛盾<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> √2 是无限小数<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 2 不是平方数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c01' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 下列数中是无理数的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 0.121212…（循环）<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> √16<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> π<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 22/7<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：逼近、代数数与超越数<\/h1><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c03' data-chapter='ch05'><p class='quiz-q'><b>Q1.<\/b> 用 √2 的截断序列 x_n 近似，要保证误差小于 10<sup>-5<\/sup>，至少取到第几位？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 4<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 5<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c03' data-chapter='ch05'><p class='quiz-q'><b>Q2.<\/b> 下列数中，属于超越数的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> √2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 黄金比 (1+√5)/2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> π<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 22/7<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='有理数'>有理数 — 能写成两个整数之比 m/n（n≠0）的数，包含整数与分数。 <span class=glossary-ref>（第 1 章：有理数的概念与数轴）<\/span><\/li><li data-term='无理数'>无理数 — 不是有理数的实数，即不能写成两个整数之比的数。 <span class=glossary-ref>（第 4 章：无理数与实数）<\/span><\/li><li data-term='相反数'>相反数 — 对 a 而言是 −a；两者在数轴上关于原点对称。 <span class=glossary-ref>（第 1 章：有理数的概念与数轴）<\/span><\/li><li data-term='绝对值'>绝对值 — 数轴上表示 a 的点到原点的距离，恒为非负数。 <span class=glossary-ref>（第 1 章：有理数的概念与数轴）<\/span><\/li><li data-term='数轴'>数轴 — 规定了原点、正方向和单位长度的直线。 <span class=glossary-ref>（第 1 章：有理数的概念与数轴）<\/span><\/li><li data-term='乘方'>乘方 — n 个相同因数 a 相乘的简写，记作 a<sup>n<\/sup>。 <span class=glossary-ref>（第 3 章：乘方与开方）<\/span><\/li><li data-term='开方'>开方 — 求满足 x<sup>n<\/sup>=a 的 x 的运算，是乘方的逆运算。 <span class=glossary-ref>（第 3 章：乘方与开方）<\/span><\/li><li data-term='算术根'>算术根 — 非负的那个 n 次方根，记作 ⁿ√a。 <span class=glossary-ref>（第 3 章：乘方与开方）<\/span><\/li><li data-term='稠密性'>稠密性 — 任意两个有理数之间还存在有理数，这个性质叫有理数的稠密性。 <span class=glossary-ref>（第 4 章：无理数与实数）<\/span><\/li><li data-term='代数数'>代数数 — 某个整系数多项式方程的根。 <span class=glossary-ref>（第 5 章：逼近、代数数与超越数）<\/span><\/li><li data-term='超越数'>超越数 — 不是代数数的实数，如 π、e。 <span class=glossary-ref>（第 5 章：逼近、代数数与超越数）<\/span><\/li><li data-term='截断序列'>截断序列 — 把无理数的小数在第 n 位后截断得到的有理数列。 <span class=glossary-ref>（第 5 章：逼近、代数数与超越数）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：扩充数集的三问<\/h2>\n<p>每次引入新数，都按同一套流程检查：① 新数能不能解决旧数解决不了的具体问题（动机）；② 大小比较规则是否仍然自洽（序）；③ 四则运算是否仍然封闭、运算律是否仍成立（代数结构）。三问都过，扩充才算完成。<\/p>\n<h2>框架：反证法的三步<\/h2>\n<p>① 反设结论不成立；② 从反设出发做合法推理，直到出现自相矛盾（与已知事实、互质性、正负性冲突）；③ 否定反设，结论成立。适用信号：命题含「不是」「不存在」「无限」等否定性词汇。<\/p>\n<h2>框架：逼近的两个指标<\/h2>\n<p>任何逼近方案都要报两个数：误差上界（可靠性）和收敛速度（效率）。只报「很接近」而不给上界，等于没给结论。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>有理数的判据<\/td><td>能写成 m/n（m∈Z，n∈N+）；有限小数与循环小数都满足<\/td><\/tr><tr><td>负数比较大小<\/td><td>绝对值大的反而小；通分后比较分子<\/td><\/tr><tr><td>减法与除法<\/td><td>a−b=a+(−b)；a÷b=a×(1/b)，b≠0<\/td><\/tr><tr><td>符号规则来源<\/td><td>由分配律推出 (−a)(−b)=ab，不是额外规定<\/td><\/tr><tr><td>零指数与负指数<\/td><td>a<sup>0<\/sup>=1（a≠0）；a^−n=1/a<sup>n<\/sup><\/td><\/tr><tr><td>算术根<\/td><td>ⁿ√a≥0；方程 x<sup>n<\/sup>=a（n 偶，a&gt;0）有两根 ±ⁿ√a<\/td><\/tr><tr><td>√2 无理性<\/td><td>假设 √2=m/n 最简 → m²=2n² → m、n 皆偶 → 矛盾<\/td><\/tr><tr><td>截断误差<\/td><td><\/td><td>√2−x_n<\/td><td>&lt;10^−n；要误差 &lt;ε 取 n&gt;−lg ε<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/01-有理数与无理数", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：有理数的概念与数轴", "href": "#/chapter/ch01"}, {"label": "第 2 章：有理数的四则运算", "href": "#/chapter/ch02"}, {"label": "第 3 章：乘方与开方", "href": "#/chapter/ch03"}, {"label": "第 4 章：无理数与实数", "href": "#/chapter/ch04"}, {"label": "第 5 章：逼近、代数数与超越数", "href": "#/chapter/ch05"}]}, {"label": "概念", "children": [{"label": "有理数与无理数的分界", "href": "#/concept/c01"}, {"label": "实数与数轴的一一对应", "href": "#/concept/c02"}, {"label": "用有理数逼近无理数", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：有理数的概念与数轴", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：有理数的四则运算", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：乘方与开方", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：无理数与实数", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：逼近、代数数与超越数", "href": "#/quiz/ch05"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">四则运算、分数、数数<\/span><\/div><h1>第 1 章：有理数的概念与数轴<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：四则运算、分数、数数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用“相反意义的量”解释负数是怎么被引进来的\n<\/li><li>\n分清整数、分数、有理数的范围，知道 0 的位置\n<\/li><li>\n能在数轴上定位一个有理数并比较两个负数的大小\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>有理数就是能写成两个整数之比的数；数轴把这套数按大小排成一条线，右边的永远比左边大。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 负数不是凭空规定的<\/h3>\n<p>先看两个场景。<\/p>\n<p>汽车从同一地点出发，一辆向东走 5 公里到 A 地，一辆向西走 5 公里到 B 地。两辆车走过的路程都是 5 公里，但方向相反。如果只写一个“5”，A 和 B 就分不出来了。<\/p>\n<p>温度从 5 ℃ 降到 2 ℃，写成 5−2=3 没问题；但如果从 2 ℃ 降到 5 ℃ 以下，比如降到零下 3 ℃，用原来的数算 2−5 就没有意义了。<\/p>\n<p>这两个场景的共同点是：<strong>量的两个方向（两种相反意义）需要两个不同的记号<\/strong>。做法是：规定其中一种意义为正，另一种为负。向东记作正，向西 5 公里就记作 −5 公里；零上记作正，零下 3 ℃ 就记作 −3 ℃。<\/p>\n<p>规定哪一边为正<strong>不是绝对的<\/strong>——规定向西为正也完全成立，只是不符合习惯。一旦定了，另一边就必须为负，不能两边都算正。<\/p>\n<h3>1.2 正数、负数、零<\/h3>\n<p>在原来的数（0 除外）前面放上“−”号得到的数叫<strong>负数<\/strong>，如 −5、−3/4、−10.05。原来的那些数（0 除外）叫<strong>正数<\/strong>，如 5、3/4、10.05。正数前的“+”可以省略，+5 和 5 是同一个数。<\/p>\n<p><strong>0 既不是正数也不是负数<\/strong>，它是正负之间的界线。0 也不能简单理解成“没有”：0 ℃ 不是没有温度，而是标准大气压下冰水混合的那个确定温度。<\/p>\n<h3>1.3 有理数包括哪些<\/h3>\n<ul><li>\n正整数、0、负整数，统称<strong>整数<\/strong>；\n<\/li><li>\n正分数、负分数，统称<strong>分数<\/strong>；\n<\/li><li>\n整数和分数合起来叫<strong>有理数<\/strong>。\n<\/ul>\n<p>所以有理数就是一切能写成 m/n 形式的数，其中 m、n 是整数且 n≠0。有限小数（如 0.25=1/4）和循环小数（如 0.333…=1/3）都是有理数。<\/p>\n<h3>1.4 数轴：给每个数找一个位置<\/h3>\n<p>画一条直线，指定：<\/p>\n<ol><li>\n<strong>原点<\/strong>（对应 0 的那个点）；\n<\/li><li>\n<strong>正方向<\/strong>（通常向右，画箭头）；\n<\/li><li>\n<strong>单位长度<\/strong>（一个固定的长度算作 1）。\n<\/ol>\n<p>这条线就是数轴。每个有理数都能在数轴上找到一个点：正数在原点右边，负数在左边，到原点的距离由绝对值决定。<\/p>\n<p>反过来要注意：数轴上的点<strong>不一定<\/strong>都是有理数。这条“填不满”的缝，第 4 章会用 √2 补上。<\/p>\n<h3>1.5 相反数与绝对值<\/h3>\n<p><strong>相反数<\/strong>：a 的相反数是 −a。注意 −a 不一定是负数——当 a=−3 时，−a=3 是正数；当 a=0 时，−a=0。<\/p>\n<p><strong>绝对值<\/strong>：|a| 表示数轴上表示 a 的点到原点的距离，所以 |a|≥0 恒成立。|−3|=3，|3|=3，|0|=0。<\/p>\n<p>两者关系：|a| 就是 a 与 −a 中那个非负的数。<\/p>\n<h3>1.6 比较大小<\/h3>\n<p>规则只有一条：<strong>数轴上右边的数比左边的大<\/strong>。由此得到三条常用结论：<\/p>\n<ul><li>\n任何正数 &gt; 0 &gt; 任何负数；\n<\/li><li>\n两个负数比大小，绝对值大的反而小（因为它离原点更远、位置更靠左）；\n<\/li><li>\n比较分数可以先通分，也可以化成小数（但循环小数要当心精度）。\n<\/ul>\n<p>例：比较 −7/8 与 −6/7。通分：−49/56 与 −48/56。因为 49&gt;48，所以 −49/56 &lt; −48/56，即 −7/8 &lt; −6/7。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[&quot;原点 0&quot;] --&gt; B[&quot;正方向 →&quot;]\n  A --&gt; C[&quot;负方向 ←&quot;]\n  B --&gt; D[&quot;+1 +2 +3 … 越右越大&quot;]\n  C --&gt; E[&quot;-1 -2 -3 … 越左越小&quot;]\n  D --&gt; F[&quot;绝对值 = 到原点的距离&quot;]\n  E --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这条轴：箭头定正方向，格子定单位长度；绝对值只量距离、不看方向，所以 |−3|=|3|。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：数轴像一把有刻度的尺子，0 是零点，往右是“正”的一侧，往左是“负”的一侧。尺子上的每个刻度都对应一个数。<\/p>\n<p><strong>失效边界<\/strong>：这把尺子只有有理数刻度时，某些长度（比如边长为 1 的正方形的对角线）量不出来——第 4 章会看到，这个长度 √2 不在尺子的刻度里。<\/p>\n<p><strong>实例<\/strong>：某地一天的气温从 −3 ℃ 升到 7 ℃，温差是多少？ 解：温差 = 7−(−3) = 7+3 = 10（℃）。用数轴看，就是从 −3 这个点向右移动 10 格到达 7。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 −a 一定是负数 —— 实际上 a 本身可能是负数或 0：a=−3 时 −a=3，a=0 时 −a=0。符号“−”在这里表示“取相反数”，不是“一定是负”。\n<\/li><li>\n别以为 |a| 一定等于 a —— 实际上 只有 a≥0 时 |a|=a；a&lt;0 时 |a|=−a。绝对值的结果永远非负，a 本身可正可负。\n<\/li><li>\n别以为 0 就是“没有” —— 实际上 0 是一个确定的数，表示正负的分界，也对应数轴上的原点、0 ℃ 这样的具体状态。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列各数中，是负有理数的是：\n<\/li><li>\n比较 −7/8 与 −6/7 的大小，正确的是：\n<p>A. −3/4 ｜ B. 0 ｜ C. |−2| ｜ D. −(−5) <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：−3/4 是负分数，属有理数。0 不是负数；|−2|=2 是正数；−(−5)=5 是正数。 A. −7/8 &gt; −6/7 ｜ B. −7/8 &lt; −6/7 ｜ C. −7/8 = −6/7 ｜ D. 无法比较 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：通分得 −49/56 与 −48/56。两负数比较，绝对值大的反而小，49&gt;48，所以 −7/8 &lt; −6/7。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n有理数 ⇔ 能写成 m/n（n≠0）\n<\/li><li>\n数轴三要素：原点、正方向、单位长度\n<\/li><li>\n|a| 是距离，恒 ≥0；−a 只是“取相反”\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：有理数的概念与数轴）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：有理数的概念与数轴<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>先承认我们只有“数数”和“分份”这两件事，然后看负数是怎么被逼出来的，最后把它排到一条线上。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>有理数：存在整数 m 与正整数 n，使 x = m/n。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>数轴像一把刻度尺：原点对齐 0，往右读正数，往左读负数；刻度越密，能标出的数越多，但这把尺子始终有量不到的长度。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 把“相反意义的量”写成数<\/h3>\n<div class=\"katex-block\">\\text{向东 }5\\ \\Rightarrow +5,\\qquad \\text{向西 }5\\ \\Rightarrow -5<\/div>\n<p>先约定一个方向为正，反方向自动记负号；约定可以反过来，但只能选一个。<\/p>\n<h3>2. 有理数的形式定义<\/h3>\n<div class=\"katex-block\">\\mathbb{Q}=\\left\\{\\frac{m}{n}\\ \\middle|\\ m\\in\\mathbb{Z},\\ n\\in\\mathbb{N}^{+}\\right\\}<\/div>\n<p>整数是 n=1 的特例，有限小数与循环小数都能写成这种形式。<\/p>\n<h3>3. 绝对值：只量距离<\/h3>\n<div class=\"katex-block\">|a|=\\begin{cases}a, & a\\ge 0\\\\ -a, & a<0\\end{cases}<\/div>\n<p>所以 |a|≥0 永远成立；a&lt;0 时 |a|=−a 是正数。<\/p>\n<h3>4. 大小比较归结为符号<\/h3>\n<div class=\"katex-block\">a&lt;b \\iff b-a>0<\/div>\n<p>两负数比较时，b−a&gt;0 意味着“大数”减“小数”为正；等价地，绝对值大的那个更小。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>有刻度尺不等于尺子连续：有理数在数轴上是稠密的（任意两点之间还有有理数），但仍有“洞”，这个洞要靠无理数填。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《有理数与无理数》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：有理数的概念与数轴<\/a><\/span><\/div><h1>第 2 章：有理数的四则运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、分数运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按符号规则正确做有理数加减乘除\n<\/li><li>\n用分配律自己推出“负负得正”，而不是背结论\n<\/li><li>\n解释为什么有理数集对四则运算封闭（除数不为 0）\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>减法是加相反数，除法是乘倒数；所有符号规则都由分配律推出来，不是额外规定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 加法：两条规则<\/h3>\n<ul><li>\n<strong>同号相加<\/strong>：取相同的符号，绝对值相加。如 (−7)+(−4)=−11。\n<\/li><li>\n<strong>异号相加<\/strong>：取绝对值较大的那个数的符号，用较大的绝对值减去较小的绝对值。如 (−7)+4=−3。\n<\/ul>\n<p>再加两条特殊情形：a+0=a；互为相反数的两个数相加得 0。<\/p>\n<h3>2.2 减法就是加相反数<\/h3>\n<blockquote>a − b = a + (−b)<\/blockquote>\n<p>所以 (−7)−4=(−7)+(−4)=−11；(−7)−(−4)=(−7)+4=−3。减法不需要另立一套符号规则。<\/p>\n<h3>2.3 乘法：符号怎么定<\/h3>\n<ul><li>\n同号得正，异号得负；\n<\/li><li>\n任何数与 0 相乘得 0；\n<\/li><li>\n绝对值相乘。\n<\/ul>\n<p>于是 (−2)(−3)=6，(−2)(3)=−6。<\/p>\n<p><strong>“负负得正”不是硬规定的<\/strong>，它可以从分配律推出来：<\/p>\n<p>展开：(−a)[(−b)+b] = (−a)(−b) + (−a)b = 0，所以 (−a)(−b) = ab。<\/p>\n<p>所以 (−a)(−b)=−(−a)b=ab。也就是说，只要承认分配律，负负得正就是唯一不矛盾的选择。<\/p>\n<h3>2.4 除法就是乘倒数<\/h3>\n<p>a ÷ b = a × (1/b)（b ≠ 0）<\/p>\n<p>符号规则与乘法相同：同号得正、异号得负。除以一个数等于乘它的倒数，所以<strong>除数不能为 0<\/strong>——0 没有倒数。<\/p>\n<h3>2.5 运算律与“数域”<\/h3>\n<p>加法满足交换律、结合律；乘法满足交换律、结合律；乘法对加法满足分配律。<\/p>\n<p>正因为有这些运算律，有理数集对加、减、乘、除（除数≠0）是<strong>封闭<\/strong>的：算来算去还是有理数。数学上把这样的数集叫<strong>数域<\/strong>。这一点很关键——第 3 章开方就会发现，封闭性在这里第一次被打破。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[&quot;有理数 a, b&quot;] --&gt; B[&quot;加法：同号／异号两条规则&quot;]\n  A --&gt; C[&quot;减法：a-b = a+(-b)&quot;]\n  A --&gt; D[&quot;乘法：同号得正、异号得负&quot;]\n  A --&gt; E[&quot;除法：a÷b = a×(1/b), b≠0&quot;]\n  B --&gt; F[&quot;交换律、结合律、分配律&quot;]\n  C --&gt; F\n  D --&gt; F\n  E --&gt; F\n  F --&gt; G[&quot;结果仍是有理数：数域封闭&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这张图：四条运算最终都落在同一组运算律上，封闭性是由“结果仍属于有理数集”体现的。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：正负号像“方向牌”。同向走两步是加速（同号得正），反向走是被抵消（异号得负）；乘法的符号规则相当于“转向两次回到原方向”。<\/p>\n<p><strong>失效边界<\/strong>：这个类比只管符号方向，不管大小；绝对值部分仍要单独算。<\/p>\n<p><strong>实例<\/strong>：计算 −3/4 + 5/6 − 1/2。 通分（分母 12）：−9/12 + 10/12 − 6/12 = (−9+10−6)/12 = −5/12。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 “负负得正”是人为规定、没有道理 —— 实际上 它可以由分配律推出：由 (−a)[(−b)+b]=0 得 (−a)(−b)=ab。承认分配律，就没有别的选择。\n<\/li><li>\n别以为 减一个负数等于减一个正数 —— 实际上 减去负数等于加上它的相反数：a−(−b)=a+b。例如 5−(−3)=8。\n<\/li><li>\n别以为 除以 0 也能算，只是结果很大 —— 实际上 0 没有倒数，a÷0 在有理数里没有定义；这不是“算不出来”，而是运算本身不成立。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n计算 (−2)(−3)+(−4) 的结果是：\n<\/li><li>\n下列运算中，能说明有理数集对除法不封闭的是：\n<p>A. −10 ｜ B. 2 ｜ C. 10 ｜ D. −2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：(−2)(−3)=6（同号得正），再加 −4 得 2。 A. 3÷4=3/4 ｜ B. (−6)÷2=−3 ｜ C. 5÷0 没有意义 ｜ D. 0÷7=0 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：封闭要求“任意两个元素运算后仍在集合内”。5÷0 因为除数没有倒数而不成立，说明除法必须把 0 排除在外。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na−b=a+(−b)，a÷b=a×(1/b)\n<\/li><li>\n符号规则来自分配律，不是额外约定\n<\/li><li>\n有理数集是数域，除法要求除数≠0\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：有理数的四则运算）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：有理数的四则运算<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>四则运算看起来是“规定”，其实除了分配律之外没有多余假设。下面把每条规则从分配律推出来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>数域：一个数集对加、减、乘、除（除数非零）封闭，且满足交换、结合、分配律。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>分配律像“拆包”：a(b+c) 等于把 a 分别乘给 b 和 c。符号规则是拆包之后的必然结果，不是另贴的标签。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 加法与相反数<\/h3>\n<div class=\"katex-block\">a+(-a)=0,\\qquad a-b:=a+(-b)<\/div>\n<p>减法不是新运算，是“加相反数”的缩写。<\/p>\n<h3>2. 分配律<\/h3>\n<div class=\"katex-block\">a(b+c)=ab+ac<\/div>\n<p>这是四则运算里唯一需要当作公理接受的性质。<\/p>\n<h3>3. 推出负负得正<\/h3>\n<div class=\"katex-block\">(-a)\\big[(-b)+b\\big]=(-a)(-b)+(-a)b=0<\/div>\n<p>括号内 (−b)+b=0，所以 (−a)(−b) 必须是 (−a)b 的相反数，即 ab。<\/p>\n<h3>4. 除法与封闭性<\/h3>\n<div class=\"katex-block\">\\frac{a}{b}=a\\cdot b^{-1}\\ (b\\ne 0),\\qquad a,b\\in\\mathbb{Q}\\Rightarrow \\frac{a}{b}\\in\\mathbb{Q}<\/div>\n<p>有理数的倒数仍是有理数，所以除法在“除数非零”的前提下不跑出数集。<\/p>\n<h3>5. 数域的定义式<\/h3>\n<div class=\"katex-block\">\\mathbb{Q}\\ \\text{对}\\ +,-,\\times,\\div\\ (\\div 0\\ \\text{除外})\\ \\text{封闭}<\/div>\n<p>封闭性是后面判断“开方是否还能留在数集里”的标尺。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>这套推导只依赖分配律与 0 的性质；换成别的数系（比如模运算），分配律仍成立，但“倒数”不一定存在。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《有理数与无理数》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：有理数的四则运算<\/a><\/span><\/div><h1>第 3 章：乘方与开方<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清 a<sup>n<\/sup> 的定义与符号规律，分清 (−2)<sup>4<\/sup> 与 −2<sup>4<\/sup>\n<\/li><li>\n由指数法则推出 a<sup>0<\/sup>=1 与 a<sup>-n<\/sup>=1/a<sup>n<\/sup>\n<\/li><li>\n判断一个方根开得尽还是开不尽\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>乘方是相同因数连乘的简写；开方是它的逆运算——开得尽时结果是有理数，开不尽时结果就跳出有理数集。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 乘方的定义<\/h3>\n<p>a<sup>n<\/sup> = a × a × … × a（n 个 a 相乘）<\/p>\n<p>a 叫底数，n 叫指数，结果叫幂。n 是正整数时这是“连乘”的缩写。<\/p>\n<p>符号规律：<\/p>\n<ul><li>\n正数的任何次幂都是正数；\n<\/li><li>\n负数的偶次幂是正数，奇次幂是负数；\n<\/li><li>\n0 的正整数次幂是 0。\n<\/ul>\n<p>所以 (−2)<sup>4<\/sup>=16，而 (−2)<sup>3<\/sup>=−8。<\/p>\n<p><strong>注意括号<\/strong>：(−2)<sup>4<\/sup> 表示“−2 这个数”的四次幂，等于 16；−2<sup>4<\/sup> 表示“2 的四次幂取相反数”，等于 −16。差一对括号，结果差一个符号。<\/p>\n<h3>3.2 指数法则<\/h3>\n<p>a<sup>m<\/sup> × a<sup>n<\/sup> = a<sup>m+n<\/sup>；(a<sup>m<\/sup>)<sup>n<\/sup> = a<sup>mn<\/sup>；(ab)<sup>n<\/sup> = a<sup>n<\/sup> × b<sup>n<\/sup><\/p>\n<p>这三条在正整数指数下可以直接由“连乘”验证。<\/p>\n<h3>3.3 零指数与负指数<\/h3>\n<p>要让 a<sup>m<\/sup>/a<sup>n<\/sup>=a<sup>m−n<\/sup> 在 m=n 时也成立，必须有 a<sup>0<\/sup>=1（a≠0）。<\/p>\n<p>要让它在 m&lt;n 时也成立，必须有<\/p>\n<p>a<sup>−n<\/sup> = 1 / a<sup>n<\/sup>（a ≠ 0）<\/p>\n<p>这两条不是新规定，而是“让指数法则不出现例外”的唯一选择。<\/p>\n<h3>3.4 开方与算术根<\/h3>\n<p>如果 x<sup>n<\/sup>=a，就说 x 是 a 的一个 n 次方根。求方根的运算叫开方，它是乘方的逆运算。<\/p>\n<ul><li>\nn 为偶数时，a&gt;0 有两个 n 次方根，互为相反数；其中非负的那个叫<strong>算术根<\/strong>，记作 ⁿ√a；\n<\/li><li>\nn 为奇数时，a 的 n 次方根只有一个，符号与 a 相同。\n<\/ul>\n<p>例如 √81=9（算术根，另一个根是 −9）；∛(−8)=−2；√0=0。<\/p>\n<h3>3.5 开得尽与开不尽<\/h3>\n<p>如果 a 能写成某个有理数的 n 次幂，方根就是有理数，叫“开得尽”。例如 81=9<sup>2<\/sup>，所以 √81=9。<\/p>\n<p>如果开不尽，结果就<strong>不是有理数<\/strong>。例如 2 不是任何有理数的平方，√2 就不在有理数集里。这正是下一章的入口。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[&quot;aⁿ：n 个 a 连乘&quot;] --&gt; B[&quot;指数法则&quot;]\n  B --&gt; C[&quot;a⁰=1（a≠0）&quot;]\n  B --&gt; D[&quot;a⁻ⁿ=1/aⁿ（a≠0）&quot;]\n  A --&gt; E[&quot;逆运算：开方&quot;]\n  E --&gt; F{&quot;a 是否等于某个有理数的 n 次幂？&quot;}\n  F --&gt;|是| G[&quot;开得尽：方根是有理数&quot;]\n  F --&gt;|否| H[&quot;开不尽：方根不是有理数&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这个判断分支：开方是否留在有理数集里，取决于被开方数是不是有理数的 n 次幂，而不取决于我们算得够不够快。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：乘方像“把一个数按倍数叠高”，开方像“问这个高度是几层叠出来的”。叠得整齐（开得尽）就有整数答案，叠得不整齐（开不尽）就没有有理答案。<\/p>\n<p><strong>失效边界<\/strong>：这个类比默认“层数”是整数；一旦允许分数指数，乘方与开方的界线就模糊了。<\/p>\n<p><strong>实例<\/strong>：判断 √36、√50、∛27 是否开得尽。 √36=6（36=6<sup>2<\/sup>，开得尽）；∛27=3（27=3<sup>3<\/sup>，开得尽）；√50 开不尽——因为 50 介于 7<sup>2<\/sup>=49 与 8<sup>2<\/sup>=64 之间，且 50 不是任何有理数的平方。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 (−2)<sup>4<\/sup> 与 −2<sup>4<\/sup> 是一回事 —— 实际上 前者是 (−2)<sup>4<\/sup>=16，后者是 −(2<sup>4<\/sup>)=−16。括号决定“负号属于底数还是属于整个幂”。\n<\/li><li>\n别以为 a<sup>0<\/sup>=0 —— 实际上 a<sup>0<\/sup>=1（a≠0）。由 a<sup>n<\/sup>/a<sup>n<\/sup>=1 与指数法则相减即可得到；0<sup>0<\/sup> 无定义。\n<\/li><li>\n别以为 √a 一定是正数 —— 实际上 算术根非负，但方程 x<sup>2<\/sup>=a 有两个根 ±√a；说“方根”时必须区分“算术根”和“全部根”。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列各式中值等于 −16 的是：\n<\/li><li>\n下列方根中，结果不是有理数的是：\n<p>A. (−2)<sup>4<\/sup> ｜ B. −2<sup>4<\/sup> ｜ C. (−4)<sup>2<\/sup> ｜ D. 2<sup>4<\/sup> <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：−2<sup>4<\/sup> 表示 2 的四次幂取相反数，等于 −16；(−2)<sup>4<\/sup>=16，(−4)<sup>2<\/sup>=16，2<sup>4<\/sup>=16。 A. √49 ｜ B. ∛(−27) ｜ C. √2 ｜ D. √0.25 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：√49=7；∛(−27)=−3；√0.25=0.5；而 2 不是任何有理数的平方，√2 不是有理数。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\na<sup>n<\/sup> 是连乘的缩写，括号决定负号归属\n<\/li><li>\na<sup>0<\/sup>=1、a<sup>-n<\/sup>=1/a<sup>n<\/sup> 由指数法则逼出来\n<\/li><li>\n开得尽 ⇔ 被开方数是有理数的 n 次幂\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：乘方与开方）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：乘方与开方<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>乘方只是缩写；真正有意思的是为了让指数法则不出例外，0 指数和负指数被“逼”出来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>a<sup>n<\/sup>（n 为正整数）表示 n 个 a 相乘；开方是求满足 x<sup>n<\/sup>=a 的 x。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>乘方是“把一张纸对折 n 次后的层数”，开方是“问折了几次才有这么多层”。折不满整次时，答案就落到有理数之外。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 乘方的定义<\/h3>\n<div class=\"katex-block\">a^n=\\underbrace{a\\cdot a\\cdots a}_{n\\ \\text{个}},\\quad n\\in\\mathbb{N}^{+}<\/div>\n<p>这是“连乘”的缩写，底数是 a，指数是 n。<\/p>\n<h3>2. 指数法则<\/h3>\n<div class=\"katex-block\">a^{m}a^{n}=a^{m+n},\\quad (a^{m})^{n}=a^{mn},\\quad (ab)^{n}=a^{n}b^{n}<\/div>\n<p>三条法则都能由“数一数有几个 a”直接验证。<\/p>\n<h3>3. 让法则无例外：零指数<\/h3>\n<div class=\"katex-block\">a^{n}/a^{n}=a^{n-n}=a^{0}=1\\quad(a\\ne 0)<\/div>\n<p>如果不定义 a<sup>0<\/sup>=1，指数法则在 m=n 时就会破例。<\/p>\n<h3>4. 负指数<\/h3>\n<div class=\"katex-block\">a^{-n}=\\frac{1}{a^{n}}\\quad(a\\ne 0)<\/div>\n<p>为了让 a<sup>m-n<\/sup> 在 m&lt;n 时仍成立，只能把负指数解释成倒数。<\/p>\n<h3>5. 开方与算术根<\/h3>\n<div class=\"katex-block\">x^{n}=a\\ \\Longrightarrow\\ x=\\pm\\sqrt[n]{a}\\ (n\\ \\text{偶}),\\qquad \\sqrt[n]{a}\\ge 0<\/div>\n<p>偶数次方根有两个，算术根取非负的那个；奇数次方根唯一。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>分数指数把乘方与开方合并成同一个运算，此时“开不尽”不再表示数不存在，只表示它不是有理数。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《有理数与无理数》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch04": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"p
