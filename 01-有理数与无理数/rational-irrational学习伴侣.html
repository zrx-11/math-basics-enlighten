rereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：乘方与开方<\/a><\/span><\/div><h1>第 4 章：无理数与实数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch03\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出 √2 不是有理数的完整反证\n<\/li><li>\n说出无理数的两类常见来源\n<\/li><li>\n解释实数与数轴上的点为什么一一对应\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>开不尽的方根不能写成两个整数之比，这类数叫无理数；有理数与无理数合起来是实数，实数把数轴填满了。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 √2 不是有理数<\/h3>\n<p>假设 √2 是有理数，那么它可以写成最简分数<\/p>\n<p>√2 = m / n<\/p>\n<p>其中 m、n 是正整数且互质（没有公因数）。<\/p>\n<p>两边平方：2=m²/n²，即<\/p>\n<p>m² = 2n²<\/p>\n<p>右边是偶数，所以 m² 是偶数，于是 m 是偶数。设 m=2k，代入得 4k²=2n²，即 n²=2k²，同理 n 也是偶数。<\/p>\n<p>m、n 都是偶数，与“互质”矛盾。所以假设不成立，√2 不是有理数。<\/p>\n<p>这个证明只用了一条性质：<strong>平方为偶数的整数必为偶数<\/strong>。<\/p>\n<h3>4.2 无理数的两类来源<\/h3>\n<ol><li>\n<strong>开不尽的方根<\/strong>：√2、√3、∛5 等；\n<\/li><li>\n<strong>圆周率 π 这一类<\/strong>：它不是任何整系数多项式方程的根（第 5 章会给出这个说法的名字：超越数）。\n<\/ol>\n<p>无理数的共同点是：写成小数既不终止也不循环。√2=1.41421356…，π=3.14159265…，都看不到循环节。<\/p>\n<h3>4.3 实数与数轴<\/h3>\n<p>有理数和无理数合起来叫<strong>实数<\/strong>。实数的关键性质是：<\/p>\n<blockquote>数轴上的每一个点都对应一个实数，每一个实数都对应数轴上的一个点。<\/blockquote>\n<p>这叫“一一对应”。第 1 章说过有理数在数轴上填不满，现在这些缝隙被无理数补上了。<\/p>\n<h3>4.4 实数的大小与运算<\/h3>\n<p>实数比较大小仍然看数轴：右边的更大。具体操作时常用有理数近似：要比较 √2 与 1.414，只需比较它们的平方（都是正数，平方保序）：2 &gt; 1.414²=1.999396，所以 √2&gt;1.414。<\/p>\n<p>实数的加、减、乘、除（除数非零）仍然封闭，实数集也是数域；运算时常用“取到足够精度的有理近似”来算，结果再用误差控制说明可靠性。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[&quot;有理数 Q：m/n&quot;] --&gt; C[&quot;实数 R&quot;]\n  B[&quot;无理数：开不尽的方根、π、e&quot;] --&gt; C\n  C --&gt; D[&quot;与数轴上的点一一对应&quot;]\n  D --&gt; E[&quot;比较大小：右边的更大&quot;]\n  D --&gt; F[&quot;运算：借有理近似 + 误差控制&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这张图：实数不是“又一种数”，而是有理数与无理数的并集；一一对应是它最关键的结构性质。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：有理数像尺子上刻好的刻度，无理数像刻度之间的“缝”。缝看不见，但量对角线时就会暴露——边长为 1 的正方形，对角线长 √2，任何刻度都量不准。<\/p>\n<p><strong>失效边界<\/strong>：这个类比只在“一维数轴”上成立；到了二维平面，“点”和“数”的对应要换成“点”和“数对”。<\/p>\n<p><strong>实例<\/strong>：比较 √3 与 1.7 的大小。 两边都是正数，平方保序：3 与 2.89 比较，3&gt;2.89，所以 √3&gt;1.7。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 无理数就是“开不尽的数” —— 实际上 开不尽的方根只是无理数的一类；π、e 这类超越数同样是无理数，但不是方根形式。\n<\/li><li>\n别以为 无限小数都是无理数 —— 实际上 0.333…=1/3 是无限循环小数，属有理数。只有“不循环”的无限小数才是无理数。\n<\/li><li>\n别以为 实数比有理数“多一些”，结构差不多 —— 实际上 实数与数轴一一对应、且是完备的（没有缝隙）；有理数虽然稠密，但有缝隙，这是本质差别。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“√2 不是有理数”的反证中，关键矛盾是：\n<\/li><li>\n下列数中是无理数的是：\n<p>A. m、n 都很大 ｜ B. m、n 同為偶数，与互质矛盾 ｜ C. √2 是无限小数 ｜ D. 2 不是平方数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：由 m²=2n² 推出 m 偶，再由 m=2k 推出 n 偶，于是 m、n 有公因数 2，与“最简分数”矛盾。 A. 0.121212…（循环） ｜ B. √16 ｜ C. π ｜ D. 22/7 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：循环小数是有理数；√16=4；22/7 是分数；π 不是任何整系数多项式方程的根，是无理数（超越数）。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n√2 无理性的证明：平方 → 偶性 → 与互质矛盾\n<\/li><li>\n实数 = 有理数 ∪ 无理数，与数轴一一对应\n<\/li><li>\n无限不循环小数 ⇔ 无理数\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：无理数与实数）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：无理数与实数<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>这一节只做一件事：把“√2 不是有理数”证到底。证完，数轴的缝就有了名字。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>无理数：不是有理数的实数，即不能写成两个整数之比的数。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>反证法像“先把门锁上再找钥匙”：假设结论的反面成立，一路推到自相矛盾，就说明反面根本进不去。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 反设<\/h3>\n<div class=\"katex-block\">\\sqrt{2}=\\frac{m}{n},\\quad m,n\\in\\mathbb{N}^{+},\\ \\gcd(m,n)=1<\/div>\n<p>假设它是有理数，并取最简形式——这一步保证了后面能用“互质”制造矛盾。<\/p>\n<h3>2. 平方<\/h3>\n<div class=\"katex-block\">2=\\frac{m^{2}}{n^{2}}\\ \\Longrightarrow\\ m^{2}=2n^{2}<\/div>\n<p>分母乘过去，得到整数等式；右边含因子 2。<\/p>\n<h3>3. m 为偶数<\/h3>\n<div class=\"katex-block\">m^{2}=2n^{2}\\ \\Rightarrow\\ 2\\mid m^{2}\\ \\Rightarrow\\ 2\\mid m<\/div>\n<p>平方为偶数则底数为偶数：若 m 为奇数，m² 也是奇数。<\/p>\n<h3>4. n 也为偶数<\/h3>\n<div class=\"katex-block\">m=2k\\ \\Rightarrow\\ 4k^{2}=2n^{2}\\ \\Rightarrow\\ n^{2}=2k^{2}\\ \\Rightarrow\\ 2\\mid n<\/div>\n<p>把 m=2k 代回，同样的理由推出 n 也是偶数。<\/p>\n<h3>5. 矛盾<\/h3>\n<div class=\"katex-block\">2\\mid m,\\ 2\\mid n\\ \\Rightarrow\\ \\gcd(m,n)\\ge 2\\ \\Rightarrow\\ \\sqrt{2}\\notin\\mathbb{Q}<\/div>\n<p>与最简分数的互质性冲突，假设不成立。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>这个证明只对“平方数”有效；证 ∛2 无理性要用质因数分解或更一般的论证。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《有理数与无理数》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch05": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：无理数与实数<\/a><\/span><\/div><h1>第 5 章：逼近、代数数与超越数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch04\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出 √2 的十进制截断序列并估计误差\n<\/li><li>\n说明代数数与超越数的区别，各举两例\n<\/li><li>\n用“可数／不可数”解释超越数为什么大量存在\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>无理数用有理数列逼近，误差随位数缩小到任意小——这就是极限的雏形；能当整系数多项式方程的根的叫代数数，当不了的叫超越数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>5.1 十进制截断序列<\/h3>\n<p>把 √2 的小数一位位截下来：<\/p>\n<p>1.4，1.41，1.414，1.4142，……<\/p>\n<p>第 n 个截断值记作 x_n，它满足<\/p>\n<p>0 ≤ √2 − x_n &lt; 10<sup>−n<\/sup><\/p>\n<p>所以 n 越大，误差越小，想多小就多小。这个“要多大精度就给多大精度”的性质，就是后面极限概念的起点。<\/p>\n<h3>5.2 误差估计怎么用<\/h3>\n<p>比如要保证误差小于 0.001，取 n=3 就够：x_3=1.414，误差小于 10<sup>-3<\/sup>。<\/p>\n<p>实际计算时还要注意：截断是“向下取”，所以 x_n 总是比 √2 小；如果四舍五入，误差可能正也可能负，估计时要加绝对值。<\/p>\n<h3>5.3 最佳渐近分数<\/h3>\n<p>除了十进制，还可以用分数逼近。把 √2 展开成连分数，得到<\/p>\n<p>1，3/2，7/5，17/12，41/29，……<\/p>\n<p>这些分数叫 √2 的渐近分数。它们的误差比同分母的其他分数都小，所以叫“最佳”。原书第 14 节给出了这套分数的构造与误差比较。<\/p>\n<h3>5.4 代数数<\/h3>\n<p>如果一个数能是某个整系数多项式方程的根，它就叫<strong>代数数<\/strong>。<\/p>\n<ul><li>\n√2 是 x²−2=0 的根，是代数数；\n<\/li><li>\n黄金比 (1+√5)/2 是 x²−x−1=0 的根，是代数数；\n<\/li><li>\n所有有理数都是代数数（q 是 nx−p=0 的根）。\n<\/ul>\n<h3>5.5 超越数<\/h3>\n<p>不是代数数的实数叫<strong>超越数<\/strong>。π 和 e 都是超越数（证明很难，原书只给出思路）。<\/p>\n<p>为什么超越数一定存在？因为：<\/p>\n<ul><li>\n整系数多项式只有可数多个，每个只有有限个根，所以代数数<strong>可数<\/strong>；\n<\/li><li>\n实数<strong>不可数<\/strong>（康托的对角线论证）。\n<\/ul>\n<p>可数的集合塞不满不可数的集合，所以一定有非代数数——超越数不仅存在，还比代数数“多得多”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[&quot;实数 R&quot;] --&gt; B[&quot;代数数：整系数多项式方程的根&quot;]\n  A --&gt; C[&quot;超越数：π、e …&quot;]\n  B --&gt; D[&quot;包含全部有理数&quot;]\n  B --&gt; E[&quot;包含 √2、∛5 等&quot;]\n  C --&gt; F[&quot;可数 vs 不可数：超越数占绝大多数&quot;]\n  A --&gt; G[&quot;十进制截断序列 → 极限&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看这张图：代数数把有理数和常见的开方数都收进去了，超越数是剩下的“绝大多数”；右侧那支说明逼近是实数的通用工具。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：逼近像用越来越细的网格去圈一个点，网格越细，圈住的区域越小；但你永远只能用有限网格，点是“极限”。<\/p>\n<p><strong>失效边界<\/strong>：截断序列只能给出“越来越准”，不能直接给出 √2 的精确值；精确值只能作为那个极限存在。<\/p>\n<p><strong>实例<\/strong>：用截断序列估计 √2，要求误差小于 0.0001。 取 n=4：x_4=1.4142，误差小于 10<sup>-4<\/sup>=0.0001，满足要求。 验证：1.4142²=1.99996164&lt;2，且 (1.4143)²=2.00024… &gt;2，说明 √2 确实夹在两者之间。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 只要算得够多，无理数就能算尽 —— 实际上 无理数的小数不终止也不循环，任何有限位都只是近似；精确值只能由极限或代数关系刻画。\n<\/li><li>\n别以为 π 是无理数，所以它不属于实数 —— 实际上 π 是实数，只是不是有理数；无理数本来就是实数的一部分。\n<\/li><li>\n别以为 代数数都是无理数 —— 实际上 有理数也是代数数（例如 2 是 x−2=0 的根），代数数包含全部有理数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用 √2 的截断序列 x_n 近似，要保证误差小于 10<sup>-5<\/sup>，至少取到第几位？\n<\/li><li>\n下列数中，属于超越数的是：\n<p>A. 3 ｜ B. 4 ｜ C. 5 ｜ D. 6 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：误差上界是 10<sup>-n<\/sup>，要求 10<sup>-n<\/sup>&lt;10<sup>-5<\/sup>，需 n≥5，故取 x_5=1.41421。 A. √2 ｜ B. 黄金比 (1+√5)/2 ｜ C. π ｜ D. 22/7 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：√2 是 x²−2=0 的根；黄金比是 x²−x−1=0 的根；22/7 是有理数；π 不是任何整系数多项式方程的根，是超越数。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n截断误差 &lt;10<sup>-n<\/sup>，精度可以任意提高\n<\/li><li>\n代数数 = 整系数多项式方程的根；超越数 = 不是\n<\/li><li>\n代数数可数、实数不可数 ⇒ 超越数存在且极多\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 5 章：逼近、代数数与超越数）<\/summary><div class=\"depth-body\"><h1>第 05 章 · 从零推导：逼近、代数数与超越数<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>最后一步：既然无理数算不尽，我们怎么“抓住”它？答案是给出一串越来越近的有理数，并控制误差。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>若存在整系数多项式 P(x)（P≠0）使 P(α)=0，则 α 为代数数；否则为超越数。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>逼近像用两把尺子从左右夹住一根头发：左边的刻度不断上调、右边的不断下调，夹住的区间越来越窄，头发的位置被“确定”在没有宽度的极限里。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 截断序列<\/h3>\n<div class=\"katex-block\">x_n=\\frac{\\lfloor 10^{n}\\sqrt{2}\\rfloor}{10^{n}}<\/div>\n<p>把 √2 的小数第 n 位之后全部砍掉，得到一个有理数（分母是 10<sup>n<\/sup>）。<\/p>\n<h3>2. 误差上界<\/h3>\n<div class=\"katex-block\">0\\le \\sqrt{2}-x_n<10^{-n}<\/div>\n<p>因为砍掉的尾部小于最后一位的一个单位，所以误差严格小于 10<sup>-n<\/sup>。<\/p>\n<h3>3. 任意精度<\/h3>\n<div class=\"katex-block\">\\forall \\varepsilon>0\\ \\exists N,\\ n>N\\Rightarrow |\\sqrt{2}-x_n|<\\varepsilon<\/div>\n<p>取 N 使 10<sup>-N<\/sup>&lt;ε 即可；这就是“要多准有多准”的严格写法。<\/p>\n<h3>4. 渐近分数<\/h3>\n<div class=\"katex-block\">1,\\ \\frac{3}{2},\\ \\frac{7}{5},\\ \\frac{17}{12},\\ \\frac{41}{29},\\ldots\\ ;\\quad \\left|\\sqrt{2}-\\frac{p}{q}\\right|<\\frac{1}{q^{2}}<\/div>\n<p>连分数给出的一串分数，误差比同分母的其他分数都小。<\/p>\n<h3>5. 代数数与超越数<\/h3>\n<div class=\"katex-block\">P(\\alpha)=0,\\ P\\in\\mathbb{Z}[x]\\ \\Rightarrow\\ \\alpha\\ \\text{代数数}<\/div>\n<p>√2 是 x²−2 的根，故为代数数；π 不是任何这样的根，故为超越数。<\/p>\n<h3>6. 超越数存在<\/h3>\n<div class=\"katex-block\">\\#\\{\\text{代数数}\\}=\\aleph_0<2^{\\aleph_0}=\\#\\mathbb{R}<\/div>\n<p>代数数可数、实数不可数，所以必有不属于代数数的实数。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>截断序列只保证误差上界，不保证最快收敛；要更快逼近需用连分数或牛顿迭代。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《有理数与无理数》第 05 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：有理数的概念与数轴<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：无理数与实数<\/a><\/span><\/div><h1>有理数与无理数的分界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>能写成两个整数之比的叫有理数，写不成的叫无理数。<\/p>\n<h2>为什么重要<\/h2>\n<p>整本书的骨架就是这条分界线：先造出有理数，再发现它填不满数轴，于是引入无理数。判据只有一个——能不能写成 m/n。<\/p>\n<h2>详解<\/h2>\n<p>「有理数的三种外观」容易让人误判：整数、有限小数、循环小数都属有理数，因为它们都能化成 m/n。反过来，只要一个小数既不终止也不循环，它就一定不是有理数。<\/p>\n<p>判定时要避免「看起来像」：√9=3 是有理数，√2 不是；0.1010010001…（每段多一个 0）不循环，是无理数。判断依据永远是形式（能否写成比值／是否是整系数多项式方程的根），不是纸面上的样子。<\/p>\n<h2>常见误解<\/h2>\n<p>别把「开方」当成无理性的判据：√9 开了方仍然是有理数。要看开得尽不尽。<\/p>\n<h2>相关概念<\/h2>\n<p>有理数（ch01）、无理数（ch04）、实数（ch04）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：有理数的概念与数轴<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：无理数与实数<\/a><\/span><\/div><h1>实数与数轴的一一对应<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>数轴上的每个点恰好对应一个实数，每个实数恰好对应一个点。<\/p>\n<h2>为什么重要<\/h2>\n<p>这条性质把「数」和「位置」接了起来，后面解析几何、函数图象都靠它：方程的解可以画成点，点的位置可以用数算。<\/p>\n<h2>详解<\/h2>\n<p>有理数在数轴上是稠密的：任意两个有理数之间还有有理数。稠密不等于填满——√2 对应的点就没有有理数对应。把无理数补进去之后，数轴才没有缝，这才叫完备。<\/p>\n<p>一一对应有两个方向：数 → 点（定位），点 → 数（读数）。两个方向都成立，才能把几何问题翻译成代数问题。<\/p>\n<h2>常见误解<\/h2>\n<p>稠密 ≠ 连续。有理数稠密但有缝；实数才连续。<\/p>\n<h2>相关概念<\/h2>\n<p>数轴（ch01）、无理数（ch04）、区间<\/p>", "c03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-01-有理数与无理数.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch05\">第 5 章：逼近、代数数与超越数<\/a><\/span><\/div><h1>用有理数逼近无理数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch05\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>给出一串有理数，使它们与目标无理数的差可以小于任意给定的正数。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是极限概念的雏形。后面数列的极限、函数的极限、定积分，全都是「用一串已知的量去夹住一个未知的量」。<\/p>\n<h2>详解<\/h2>\n<p>逼近要回答两个问题：误差上界是多少（可靠性），能不能任意小（精度）。十进制截断给出的上界是 10<sup>-n<\/sup>，随 n 增大趋于 0；连分数给出的渐近分数在同样分母下误差最小。<\/p>\n<p>注意逼近不是「越来越像所以就是」：有限步永远只是近似，精确值由「极限存在」来定义，而不是由某一项给出。<\/p>\n<h2>常见误解<\/h2>\n<p>别以为逼近序列的极限等于其中某一项；极限是序列整体趋近的那个数。<\/p>\n<h2>相关概念<\/h2>\n<p>截断序列（ch05）、渐近分数（ch05）、极限（《数列与极限》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：有理数的概念与数轴<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：有理数的概念与数轴<\/a><br>检查点：能说出 -a 与 |a| 的区别，能在数轴上标出 -7/3<\/li><li class='path-step' id='path-02'><strong>步骤 02：有理数的四则运算<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：有理数的四则运算<\/a><br>检查点：能用分配律解释“负负得正”，能算含分数的混合运算<\/li><li class='path-step' id='path-03'><strong>步骤 03：乘方与开方<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：乘方与开方<\/a><br>检查点：能区分 (-2)^4 与 -2^4，能判断一个方根开得尽还是开不尽<\/li><li class='path-step' id='path-04'><strong>步骤 04：无理数与实数<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：无理数与实数<\/a><br>检查点：能独立写出 √2 不是有理数的反证<\/li><li class='path-step' id='path-05'><strong>步骤 05：逼近、代数数与超越数<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：逼近、代数数与超越数<\/a><br>检查点：能说清截断序列的误差为什么小于 10^-n<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q11' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q11.<\/b> 关于有理数与无理数，下列说法正确的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 无限小数都是无理数<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> √9 是无理数<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 有理数在数轴上稠密但不连续<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 两个无理数的和一定是无理数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q12.<\/b> 用截断序列逼近 π，取 x_2=3.14，误差满足：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 误差小于 0.001<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 误差小于 0.01<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 误差大于 0.01<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q13' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q13.<\/b> “代数数可数、实数不可数”这个论证直接说明：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 所有实数都是代数数<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 超越数存在且数量极多<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 代数数都是有理数<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> π 是有理数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：有理数的概念与数轴<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 下列各数中，是负有理数的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> −3/4<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 0<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> |−2|<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> −(−5)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 比较 −7/8 与 −6/7 的大小，正确的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> −7/8 &gt; −6/7<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> −7/8 &lt; −6/7<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> −7/8 = −6/7<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 无法比较<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：有理数的四则运算<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 计算 (−2)(−3)+(−4) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> −10<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 10<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> −2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 下列运算中，能说明有理数集对除法不封闭的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 3÷4=3/4<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> (−6)÷2=−3<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 5÷0 没有意义<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 0÷7=0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：乘方与开方<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 下列各式中值等于 −16 的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> (−2)<sup>4<\/sup><\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> −2<sup>4<\/sup><\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> (−4)<sup>2<\/sup><\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 2<sup>4<\/sup><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 下列方根中，结果不是有理数的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> √49<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> ∛(−27)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> √2<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> √0.25<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：无理数与实数<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c01' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> “√2 不是有理数”的反证中，关键矛盾是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> m、n 都很大<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> m、n 同為偶数，与互质矛盾<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> √2 是无限小数<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 2 不是平方数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c01' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 下列数中是无理数的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 0.121212…（循环）<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> √16<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> π<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 22/7<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：逼近、代数数与超越数<\/h1><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c03' data-chapter='ch05'><p class='quiz-q'><b>Q1.<\/b> 用 √2 的截断序列 x_n 近似，要保证误差小于 10<sup>-5<\/sup>，至少取到第几位？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 4<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 5<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c03' data-chapter='ch05'><p class='quiz-q'><b>Q2.<\/b> 下列数中，属于超越数的是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> √2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 黄金比 (1+√5)/2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> π<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 22/7<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='有理数'>有理数 — 能写成两个整数之比 m/n（n≠0）的数，包含整数与分数。 <span class=glossary-ref>（第 1 章：有理数的概念与数轴）<\/span><\/li><li data-term='无理数'>无理数 — 不是有理数的实数，即不能写成两个整数之比的数。 <span class=glossary-ref>（第 4 章：无理数与实数）<\/span><\/li><li data-term='相反数'>相反数 — 对 a 而言是 −a；两者在数轴上关于原点对称。 <span class=glossary-ref>（第 1 章：有理数的概念与数轴）<\/span><\/li><li data-term='绝对值'>绝对值 — 数轴上表示 a 的点到原点的距离，恒为非负数。 <span class=glossary-ref>（第 1 章：有理数的概念与数轴）<\/span><\/li><li data-term='数轴'>数轴 — 规定了原点、正方向和单位长度的直线。 <span class=glossary-ref>（第 1 章：有理数的概念与数轴）<\/span><\/li><li data-term='乘方'>乘方 — n 个相同因数 a 相乘的简写，记作 a<sup>n<\/sup>。 <span class=glossary-ref>（第 3 章：乘方与开方）<\/span><\/li><li data-term='开方'>开方 — 求满足 x<sup>n<\/sup>=a 的 x 的运算，是乘方的逆运算。 <span class=glossary-ref>（第 3 章：乘方与开方）<\/span><\/li><li data-term='算术根'>算术根 — 非负的那个 n 次方根，记作 ⁿ√a。 <span class=glossary-ref>（第 3 章：乘方与开方）<\/span><\/li><li data-term='稠密性'>稠密性 — 任意两个有理数之间还存在有理数，这个性质叫有理数的稠密性。 <span class=glossary-ref>（第 4 章：无理数与实数）<\/span><\/li><li data-term='代数数'>代数数 — 某个整系数多项式方程的根。 <span class=glossary-ref>（第 5 章：逼近、代数数与超越数）<\/span><\/li><li data-term='超越数'>超越数 — 不是代数数的实数，如 π、e。 <span class=glossary-ref>（第 5 章：逼近、代数数与超越数）<\/span><\/li><li data-term='截断序列'>截断序列 — 把无理数的小数在第 n 位后截断得到的有理数列。 <span class=glossary-ref>（第 5 章：逼近、代数数与超越数）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：扩充数集的三问<\/h2>\n<p>每次引入新数，都按同一套流程检查：① 新数能不能解决旧数解决不了的具体问题（动机）；② 大小比较规则是否仍然自洽（序）；③ 四则运算是否仍然封闭、运算律是否仍成立（代数结构）。三问都过，扩充才算完成。<\/p>\n<h2>框架：反证法的三步<\/h2>\n<p>① 反设结论不成立；② 从反设出发做合法推理，直到出现自相矛盾（与已知事实、互质性、正负性冲突）；③ 否定反设，结论成立。适用信号：命题含「不是」「不存在」「无限」等否定性词汇。<\/p>\n<h2>框架：逼近的两个指标<\/h2>\n<p>任何逼近方案都要报两个数：误差上界（可靠性）和收敛速度（效率）。只报「很接近」而不给上界，等于没给结论。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>有理数的判据<\/td><td>能写成 m/n（m∈Z，n∈N+）；有限小数与循环小数都满足<\/td><\/tr><tr><td>负数比较大小<\/td><td>绝对值大的反而小；通分后比较分子<\/td><\/tr><tr><td>减法与除法<\/td><td>a−b=a+(−b)；a÷b=a×(1/b)，b≠0<\/td><\/tr><tr><td>符号规则来源<\/td><td>由分配律推出 (−a)(−b)=ab，不是额外规定<\/td><\/tr><tr><td>零指数与负指数<\/td><td>a<sup>0<\/sup>=1（a≠0）；a^−n=1/a<sup>n<\/sup><\/td><\/tr><tr><td>算术根<\/td><td>ⁿ√a≥0；方程 x<sup>n<\/sup>=a（n 偶，a&gt;0）有两根 ±ⁿ√a<\/td><\/tr><tr><td>√2 无理性<\/td><td>假设 √2=m/n 最简 → m²=2n² → m、n 皆偶 → 矛盾<\/td><\/tr><tr><td>截断误差<\/td><td><\/td><td>√2−x_n<\/td><td>&lt;10^−n；要误差 &lt;ε 取 n&gt;−lg ε<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  const urls = [
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.js',
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    s.onload = () => { networkLoaded = true; cb(); };
    s.onerror = () => { s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库加载失败，请联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 掌握度（简化 BKT） ---------- */
function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){
  const v = Math.round(getMastery(cid)*100);
  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}

/* ---------- 抽认卡 ---------- */
function sup(t){
  return String(t==null?'':t).replace(/[&<>]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]))
    .replace(/\^(?:\{([^{}]+)\}|\(([^()]*)\)|([-+]?[A-Za-z0-9.]+))/g,
      (m,a,b,c)=>'<sup>'+(a||b||c||'')+'</sup>');
}
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').innerHTML = sup(c.front);
  document.querySelector('.fc-back').innerHTML = sup(c.back);
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    $$('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  const urls=['https://registry.npmmirror.com/mermaid/10/files/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10/dist/mermaid.min.js'];
  let ui=0;
  const tryNext=()=>{
    if(ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    s.onload=boot;
    s.onerror=()=>{ s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';

renderNav();

  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';

  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });

showPage(routeIdFromHash());
</script>
