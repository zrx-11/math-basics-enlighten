<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轨迹</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>

<div class="layout">

    <h1>轨迹</h1>
    <div class="sub">动点的足迹：从条件到方程</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>

    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>

</div>

条件", "充要条件", "无关条件"], "answer": 0, "explain": "A 中每个元素都在 B 中，故 A 成立可推出 B 成立，A 是 B 的充分条件。"}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "求轨迹时“检验”这一步主要检查：", "options": ["计算是否正确", "是否有增点或漏点", "图形是否美观", "坐标是否为整数"], "answer": 1, "explain": "检验是查完备性与纯粹性，即有没有多算或漏算的点。"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "到两定点距离相等的点的轨迹是：", "options": ["圆", "椭圆", "两定点的中垂线", "抛物线"], "answer": 2, "explain": "到两点等距的点集就是这两点连线的垂直平分线。"}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "到定点距离等于定值的点的轨迹是：", "options": ["直线", "圆", "椭圆", "抛物线"], "answer": 1, "explain": "这正是圆的定义。"}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "到两定点距离之差为常数（小于两点距离）的轨迹是：", "options": ["椭圆", "双曲线的一支或两支", "圆", "直线"], "answer": 1, "explain": "差为常数对应双曲线；取绝对值时为两支，不取绝对值时为靠近某定点的一支。"}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "“a>1”是“a>0”的：", "options": ["充分不必要条件", "必要不充分条件", "充要条件", "既不充分也不必要"], "answer": 0, "explain": "a>1 必有 a>0；a>0 推不出 a>1。"}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "求轨迹时忽略检验，最可能导致：", "options": ["计算变慢", "多算或漏算点", "图形画错", "方程次数变高"], "answer": 1, "explain": "检验就是查完备性与纯粹性，省掉会出现增点或漏点。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：命题与充分必要条件」的一句话核心是什么？", "back": "若 p 成立必有 q 成立，则 p 是 q 的充分条件，q 是 p 的必要条件。", "tags": ["locus", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：求轨迹的五步法」的一句话核心是什么？", "back": "求轨迹＝把几何条件翻译成方程，再用原条件回头验一遍。", "tags": ["locus", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：常见轨迹与空间轨迹」的一句话核心是什么？", "back": "记住五种定义型轨迹，看到条件就能报出图形。", "tags": ["locus", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「命题」？", "back": "可以判断真假的陈述句。", "tags": ["locus", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「充分条件」？", "back": "有它就能推出结论的条件。", "tags": ["locus", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「必要条件」？", "back": "没有它结论就不成立的条件。", "tags": ["locus", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「充要条件」？", "back": "互相都能推出的条件。", "tags": ["locus", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「轨迹」？", "back": "满足某条件的点的集合。", "tags": ["locus", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「完备性」？", "back": "符合条件的点都在图形上。", "tags": ["locus", "术语"]}, {"id": "f10", "chapterId": "ch02", "front": "什么是「纯粹性」？", "back": "图形上的点都符合条件。", "tags": ["locus", "术语"]}, {"id": "f11", "chapterId": "ch02", "front": "什么是「阿波罗尼斯圆」？", "back": "到两定点距离之比为定值的点的轨迹。", "tags": ["locus", "术语"]}], "companion": "locus学习伴侣.html", "deriv": "locus从零推导.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：命题与充分必要条件<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：逻辑常识\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断四种条件的类型\n<\/li><li>\n用集合包含关系判断充分必要\n<\/li><li>\n写出命题的逆命题与否命题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>若 p 成立必有 q 成立，则 p 是 q 的充分条件，q 是 p 的必要条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 命题与推出<\/h3>\n<p>命题是可以判断真假的陈述句。若“p 成立则 q 成立”恒成立，记 p⇒q。<\/p>\n<ul><li>\np 是 q 的<strong>充分条件<\/strong>：有 p 就够推出 q；\n<\/li><li>\nq 是 p 的<strong>必要条件<\/strong>：没有 q 就没有 p。\n<\/ul>\n<h3>1.2 四种条件<\/h3>\n<ul><li>\n充分不必要：p⇒q 但 q 推不出 p；\n<\/li><li>\n必要不充分：q⇒p 但 p 推不出 q；\n<\/li><li>\n充要：p⇔q；\n<\/li><li>\n既不充分也不必要。\n<\/ul>\n<h3>1.3 集合视角<\/h3>\n<p>设 p 对应集合 A，q 对应集合 B。若 A⊆B（小范围推大范围），则 p 是 q 的充分条件；若 B⊆A，则 p 是 q 的必要条件；若 A=B，则充要。<\/p>\n<p>这条视角比背定义可靠：判断时先画范围，再看包含方向。<\/p>\n<h3>1.4 逆命题与否命题<\/h3>\n<p>原命题 p⇒q 的逆命题是 q⇒p，否命题是 ¬p⇒¬q，逆否命题是 ¬q⇒¬p。<\/p>\n<p>原命题与逆否命题同真假；逆命题与否命题同真假。但原命题与逆命题不一定同真假。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：充分条件是“买了门票就能进场”，必要条件“没票就进不去”——有票是能进的充分条件，也是“必须”的前提。<\/p>\n<p><strong>失效边界<\/strong>：充分条件不唯一，可能有很多条路都能推出结论。<\/p>\n<p><strong>实例<\/strong>：“x&gt;2”是“x&gt;0”的充分不必要条件（小范围推大范围）；“x&gt;0”是“x&gt;2”的必要不充分条件。 “x 是偶数”是“x 能被 2 整除”的充要条件。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 充分条件就是必要条件 —— 实际上 方向相反：充分是 p⇒q，必要是 q⇒p。\n<\/li><li>\n别以为 原命题真则逆命题也真 —— 实际上 不一定，例如“正方形是矩形”为真，“矩形是正方形”为假。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“x=1”是“x²=1”的：\n<\/li><li>\n若 A⊆B，则 A 是 B 的：\n<p>A. 充分不必要条件 ｜ B. 必要不充分条件 ｜ C. 充要条件 ｜ D. 既不充分也不必要 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：x=1 必有 x²=1；但 x²=1 还可能是 x=−1，推不出 x=1。 A. 充分条件 ｜ B. 必要条件 ｜ C. 充要条件 ｜ D. 无关条件 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：A 中每个元素都在 B 中，故 A 成立可推出 B 成立，A 是 B 的充分条件。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\np⇒q：p 充分、q 必要\n<\/li><li>\n小范围推大范围＝充分\n<\/li><li>\n原命题与逆否命题同真假\n<\/ul>", "kind": "chapter", "title": "第 1 章：命题与充分必要条件"}, "ch02": {"html": "<h1>第 2 章：求轨迹的五步法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、坐标\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按五步写出轨迹方程\n<\/li><li>\n用完备性与纯粹性检验结果\n<\/li><li>\n处理含参数与限制条件的轨迹\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>求轨迹＝把几何条件翻译成方程，再用原条件回头验一遍。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 五步法<\/h3>\n<ol><li>\n<strong>建系<\/strong>：选合适的原点与坐标轴，让条件尽量简单（常把定点放原点或对称轴上）；\n<\/li><li>\n<strong>设点<\/strong>：设动点 P(x,y)，写出其它相关点的坐标；\n<\/li><li>\n<strong>列式<\/strong>：把几何条件写成含 x、y 的等式（距离、斜率、面积等）；\n<\/li><li>\n<strong>化简<\/strong>：整理成标准方程；\n<\/li><li>\n<strong>检验<\/strong>：检查是否有“多出来的点”（增点）或“漏掉的点”。\n<\/ol>\n<h3>2.2 完备性与纯粹性<\/h3>\n<ul><li>\n<strong>完备性<\/strong>：所有满足条件的点都在求出的图形上——不能漏；\n<\/li><li>\n<strong>纯粹性<\/strong>：图形上每个点都满足条件——不能多。\n<\/ul>\n<p>实际做题中，最常见的漏洞是化简时两边平方或约分，引入了原条件不满足的点，必须在最后一步剔除。<\/p>\n<h3>2.3 常用翻译表<\/h3>\n<table><thead><tr><th>几何条件<\/th><th>代数表达<\/th><\/tr><\/thead><tbody><tr><td>到定点距离为 r<\/td><td>(x−a)²+(y−b)²=r²<\/td><\/tr><tr><td>到两定点距离相等<\/td><td>中垂线方程<\/td><\/tr><tr><td>到两定点距离之比为 k<\/td><td>√((x−a)²+y²)=k√((x−b)²+y²)<\/td><\/tr><tr><td>与定直线距离等于定值<\/td><td><\/td><td>Ax+By+C<\/td><td>/√(A²+B²)=d<\/td><\/tr><\/tbody><\/table>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：求轨迹像给一个人画行动路线：先定地图（建系），再记下他满足什么规则，最后画出路线并核对。<\/p>\n<p><strong>失效边界<\/strong>：条件含“距离”时平方会产生增点；条件含“斜率”时要排除竖直线。<\/p>\n<p><strong>实例<\/strong>：求到点 A(0,0) 与 B(4,0) 距离相等的点的轨迹。 设 P(x,y)：√(x²+y²)=√((x−4)²+y²)，平方化简得 x=2。检验：x=2 上任意点确实到两点等距，无增点。轨迹是直线 x=2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 化简完的方程就是轨迹 —— 实际上 还要检验；平方、约分都可能改变解集。\n<\/li><li>\n别以为 建系随便选都行 —— 实际上 选得好计算量差很多；通常让定点落在坐标轴上或关于原点对称。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n求轨迹时“检验”这一步主要检查：\n<\/li><li>\n到两定点距离相等的点的轨迹是：\n<p>A. 计算是否正确 ｜ B. 是否有增点或漏点 ｜ C. 图形是否美观 ｜ D. 坐标是否为整数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：检验是查完备性与纯粹性，即有没有多算或漏算的点。 A. 圆 ｜ B. 椭圆 ｜ C. 两定点的中垂线 ｜ D. 抛物线 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：到两点等距的点集就是这两点连线的垂直平分线。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五步：建系、设点、列式、化简、检验\n<\/li><li>\n检验查完备性与纯粹性\n<\/li><li>\n平方与约分是增点的主要来源\n<\/ul>", "kind": "chapter", "title": "第 2 章：求轨迹的五步法"}, "ch03": {"html": "<h1>第 3 章：常见轨迹与空间轨迹<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n识别五种常见轨迹类型\n<\/li><li>\n用定义直接写出轨迹\n<\/li><li>\n了解空间轨迹的降维处理\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>记住五种定义型轨迹，看到条件就能报出图形。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 平面内的五种常见轨迹<\/h3>\n<ul><li>\n到定点距离等于定值：圆；\n<\/li><li>\n到两定点距离相等：中垂线；\n<\/li><li>\n到两定点距离之和为常数（大于两点距离）：椭圆；\n<\/li><li>\n到两定点距离之差的绝对值为常数（小于两点距离）：双曲线；\n<\/li><li>\n到定点与定直线的距离相等：抛物线。\n<\/ul>\n<p>后三种正是圆锥曲线的定义，与《圆锥曲线》一书直接衔接。<\/p>\n<h3>3.2 用定义写轨迹<\/h3>\n<p>能识别定义时，直接写出标准方程，比五步法快得多。例如“到点 F(1,0) 与直线 x=−1 距离相等”，由定义即得 y²=4x。<\/p>\n<h3>3.3 空间轨迹<\/h3>\n<p>空间中到定点距离为定值的点集是球面；到两定点等距的点集是垂直平分面。<\/p>\n<p>处理空间轨迹的常用办法是“降维”：先固定一个平面，求出平面内的轨迹，再让平面运动，合成空间图形。<\/p>\n<h3>3.4 轨迹的交与并<\/h3>\n<p>两个条件的交集对应两图形的交点，并集对应两图形的合并。含“或”的条件要取并，含“且”的要取交——这与解不等式组的逻辑一致。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：五种轨迹像五种“尺规规则”：给的距离关系不同，画出的曲线就不同。<\/p>\n<p><strong>失效边界<\/strong>：椭圆要求距离之和大于两定点距离；等于时为线段，小于时无轨迹。<\/p>\n<p><strong>实例<\/strong>：到 A(−3,0)、B(3,0) 距离之和为 8 的点：2a=8，a=4，c=3，b²=16−9=7，轨迹为 x²/16+y²/7=1。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 距离之和为常数就一定是椭圆 —— 实际上 当常数等于两定点距离时退化为线段，小于时不存在。\n<\/li><li>\n别以为 空间轨迹也能直接套平面公式 —— 实际上 空间要先降维或另建坐标系，平面公式只在某个平面内成立。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n到定点距离等于定值的点的轨迹是：\n<\/li><li>\n到两定点距离之差为常数（小于两点距离）的轨迹是：\n<p>A. 直线 ｜ B. 圆 ｜ C. 椭圆 ｜ D. 抛物线 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：这正是圆的定义。 A. 椭圆 ｜ B. 双曲线的一支或两支 ｜ C. 圆 ｜ D. 直线 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：差为常数对应双曲线；取绝对值时为两支，不取绝对值时为靠近某定点的一支。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五种定义型轨迹：圆、中垂线、椭圆、双曲线、抛物线\n<\/li><li>\n能识别定义就直接写方程\n<\/li><li>\n空间轨迹先降维\n<\/ul>", "kind": "chapter", "title": "第 3 章：常见轨迹与空间轨迹"}, "c01": {"html": "<h1>充分必要<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>充分是“有它就够”，必要是“没它不行”。<\/p>\n<h2>为什么重要<\/h2>\n<p>轨迹的检验本质上就是判断“方程”与“条件”是否互为充要。<\/p>\n<h2>详解<\/h2>\n<p>p⇒q 时 p 充分、q 必要。用集合看：小范围推大范围。做题时把条件与结论各画一个范围，看谁包含谁，比背定义可靠。<\/p>\n<h2>常见误解<\/h2>\n<p>把“必要条件”理解成“重要的条件”，忽略它其实是方向问题。<\/p>\n<h2>相关概念<\/h2>\n<p>命题（ch01）、检验（ch02）<\/p>", "kind": "concept", "title": "充分必要"}, "c02": {"html": "<h1>完备性与纯粹性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>完备是不漏，纯粹是不多；两者都满足，方程才等于轨迹。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是轨迹题唯一的评分关键：方程对了但没检验，通常要扣分。<\/p>\n<h2>详解<\/h2>\n<p>完备性：符合条件的点都在方程表示的图形上；纯粹性：图形上的点都符合条件。平方、约分、去绝对值常破坏纯粹性；忽略参数范围常破坏完备性。检验的办法是回到原条件逐条核对。<\/p>\n<h2>常见误解<\/h2>\n<p>认为“化简过程等价就没问题”，忽略平方与约分并不等价。<\/p>\n<h2>相关概念<\/h2>\n<p>五步法（ch02）、增根（《分式与根式》）<\/p>", "kind": "concept", "title": "完备性与纯粹性"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：命题与充分必要条件<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：命题与充分必要条件<\/a><br>检查点：能判断“甲是乙的什么条件”<\/li><li class='path-step' id='path-02'><strong>步骤 02：求轨迹的五步法<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：求轨迹的五步法<\/a><br>检查点：能独立完成一道轨迹题的检验<\/li><li class='path-step' id='path-03'><strong>步骤 03：常见轨迹与空间轨迹<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：常见轨迹与空间轨迹<\/a><br>检查点：能由条件说出轨迹类型<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> “a&gt;1”是“a&gt;0”的：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 充分不必要条件<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 必要不充分条件<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 充要条件<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 既不充分也不必要<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 求轨迹时忽略检验，最可能导致：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 计算变慢<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 多算或漏算点<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 图形画错<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 方程次数变高<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：命题与充分必要条件<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “x=1”是“x²=1”的：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 充分不必要条件<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 必要不充分条件<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 充要条件<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 既不充分也不必要<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 若 A⊆B，则 A 是 B 的：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 充分条件<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 必要条件<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 充要条件<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 无关条件<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：求轨迹的五步法<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 求轨迹时“检验”这一步主要检查：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 计算是否正确<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 是否有增点或漏点<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 图形是否美观<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 坐标是否为整数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 到两定点距离相等的点的轨迹是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 圆<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 椭圆<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 两定点的中垂线<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 抛物线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：常见轨迹与空间轨迹<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 到定点距离等于定值的点的轨迹是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 直线<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 圆<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 椭圆<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 抛物线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 到两定点距离之差为常数（小于两点距离）的轨迹是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 椭圆<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 双曲线的一支或两支<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 圆<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='命题'>命题 — 可以判断真假的陈述句。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='充分条件'>充分条件 — 有它就能推出结论的条件。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='必要条件'>必要条件 — 没有它结论就不成立的条件。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='充要条件'>充要条件 — 互相都能推出的条件。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='轨迹'>轨迹 — 满足某条件的点的集合。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><li data-term='完备性'>完备性 — 符合条件的点都在图形上。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><li data-term='纯粹性'>纯粹性 — 图形上的点都符合条件。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><li data-term='阿波罗尼斯圆'>阿波罗尼斯圆 — 到两定点距离之比为定值的点的轨迹。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：轨迹题五步<\/h2>\n<p>建系、设点、列式、化简、检验；检验放在最后，不能省。<\/p>\n<h2>框架：先定义后计算<\/h2>\n<p>能识别为圆/椭圆/双曲线/抛物线时，直接用定义写方程，只在必要时才走五步法。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>充分<\/td><td>p⇒q，小范围推大范围<\/td><\/tr><tr><td>必要<\/td><td>q⇒p，没它不行<\/td><\/tr><tr><td>充要<\/td><td>p⇔q，集合相等<\/td><\/tr><tr><td>五步法<\/td><td>建系—设点—列式—化简—检验<\/td><\/tr><tr><td>轨迹类型<\/td><td>等距圆、等距中垂线、和椭圆、差双曲线、等距抛物线<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/15-轨迹", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：命题与充分必要条件", "href": "#/chapter/ch01"}, {"label": "第 2 章：求轨迹的五步法", "href": "#/chapter/ch02"}, {"label": "第 3 章：常见轨迹与空间轨迹", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "充分必要", "href": "#/concept/c01"}, {"label": "完备性与纯粹性", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：命题与充分必要条件", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：求轨迹的五步法", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：常见轨迹与空间轨迹", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：命题与充分必要条件<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：逻辑常识\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断四种条件的类型\n<\/li><li>\n用集合包含关系判断充分必要\n<\/li><li>\n写出命题的逆命题与否命题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>若 p 成立必有 q 成立，则 p 是 q 的充分条件，q 是 p 的必要条件。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 命题与推出<\/h3>\n<p>命题是可以判断真假的陈述句。若“p 成立则 q 成立”恒成立，记 p⇒q。<\/p>\n<ul><li>\np 是 q 的<strong>充分条件<\/strong>：有 p 就够推出 q；\n<\/li><li>\nq 是 p 的<strong>必要条件<\/strong>：没有 q 就没有 p。\n<\/ul>\n<h3>1.2 四种条件<\/h3>\n<ul><li>\n充分不必要：p⇒q 但 q 推不出 p；\n<\/li><li>\n必要不充分：q⇒p 但 p 推不出 q；\n<\/li><li>\n充要：p⇔q；\n<\/li><li>\n既不充分也不必要。\n<\/ul>\n<h3>1.3 集合视角<\/h3>\n<p>设 p 对应集合 A，q 对应集合 B。若 A⊆B（小范围推大范围），则 p 是 q 的充分条件；若 B⊆A，则 p 是 q 的必要条件；若 A=B，则充要。<\/p>\n<p>这条视角比背定义可靠：判断时先画范围，再看包含方向。<\/p>\n<h3>1.4 逆命题与否命题<\/h3>\n<p>原命题 p⇒q 的逆命题是 q⇒p，否命题是 ¬p⇒¬q，逆否命题是 ¬q⇒¬p。<\/p>\n<p>原命题与逆否命题同真假；逆命题与否命题同真假。但原命题与逆命题不一定同真假。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：充分条件是“买了门票就能进场”，必要条件“没票就进不去”——有票是能进的充分条件，也是“必须”的前提。<\/p>\n<p><strong>失效边界<\/strong>：充分条件不唯一，可能有很多条路都能推出结论。<\/p>\n<p><strong>实例<\/strong>：“x&gt;2”是“x&gt;0”的充分不必要条件（小范围推大范围）；“x&gt;0”是“x&gt;2”的必要不充分条件。 “x 是偶数”是“x 能被 2 整除”的充要条件。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 充分条件就是必要条件 —— 实际上 方向相反：充分是 p⇒q，必要是 q⇒p。\n<\/li><li>\n别以为 原命题真则逆命题也真 —— 实际上 不一定，例如“正方形是矩形”为真，“矩形是正方形”为假。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“x=1”是“x²=1”的：\n<\/li><li>\n若 A⊆B，则 A 是 B 的：\n<p>A. 充分不必要条件 ｜ B. 必要不充分条件 ｜ C. 充要条件 ｜ D. 既不充分也不必要 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：x=1 必有 x²=1；但 x²=1 还可能是 x=−1，推不出 x=1。 A. 充分条件 ｜ B. 必要条件 ｜ C. 充要条件 ｜ D. 无关条件 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：A 中每个元素都在 B 中，故 A 成立可推出 B 成立，A 是 B 的充分条件。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\np⇒q：p 充分、q 必要\n<\/li><li>\n小范围推大范围＝充分\n<\/li><li>\n原命题与逆否命题同真假\n<\/ul>", "ch02": "<h1>第 2 章：求轨迹的五步法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01、坐标\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n按五步写出轨迹方程\n<\/li><li>\n用完备性与纯粹性检验结果\n<\/li><li>\n处理含参数与限制条件的轨迹\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>求轨迹＝把几何条件翻译成方程，再用原条件回头验一遍。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 五步法<\/h3>\n<ol><li>\n<strong>建系<\/strong>：选合适的原点与坐标轴，让条件尽量简单（常把定点放原点或对称轴上）；\n<\/li><li>\n<strong>设点<\/strong>：设动点 P(x,y)，写出其它相关点的坐标；\n<\/li><li>\n<strong>列式<\/strong>：把几何条件写成含 x、y 的等式（距离、斜率、面积等）；\n<\/li><li>\n<strong>化简<\/strong>：整理成标准方程；\n<\/li><li>\n<strong>检验<\/strong>：检查是否有“多出来的点”（增点）或“漏掉的点”。\n<\/ol>\n<h3>2.2 完备性与纯粹性<\/h3>\n<ul><li>\n<strong>完备性<\/strong>：所有满足条件的点都在求出的图形上——不能漏；\n<\/li><li>\n<strong>纯粹性<\/strong>：图形上每个点都满足条件——不能多。\n<\/ul>\n<p>实际做题中，最常见的漏洞是化简时两边平方或约分，引入了原条件不满足的点，必须在最后一步剔除。<\/p>\n<h3>2.3 常用翻译表<\/h3>\n<table><thead><tr><th>几何条件<\/th><th>代数表达<\/th><\/tr><\/thead><tbody><tr><td>到定点距离为 r<\/td><td>(x−a)²+(y−b)²=r²<\/td><\/tr><tr><td>到两定点距离相等<\/td><td>中垂线方程<\/td><\/tr><tr><td>到两定点距离之比为 k<\/td><td>√((x−a)²+y²)=k√((x−b)²+y²)<\/td><\/tr><tr><td>与定直线距离等于定值<\/td><td><\/td><td>Ax+By+C<\/td><td>/√(A²+B²)=d<\/td><\/tr><\/tbody><\/table>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：求轨迹像给一个人画行动路线：先定地图（建系），再记下他满足什么规则，最后画出路线并核对。<\/p>\n<p><strong>失效边界<\/strong>：条件含“距离”时平方会产生增点；条件含“斜率”时要排除竖直线。<\/p>\n<p><strong>实例<\/strong>：求到点 A(0,0) 与 B(4,0) 距离相等的点的轨迹。 设 P(x,y)：√(x²+y²)=√((x−4)²+y²)，平方化简得 x=2。检验：x=2 上任意点确实到两点等距，无增点。轨迹是直线 x=2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 化简完的方程就是轨迹 —— 实际上 还要检验；平方、约分都可能改变解集。\n<\/li><li>\n别以为 建系随便选都行 —— 实际上 选得好计算量差很多；通常让定点落在坐标轴上或关于原点对称。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n求轨迹时“检验”这一步主要检查：\n<\/li><li>\n到两定点距离相等的点的轨迹是：\n<p>A. 计算是否正确 ｜ B. 是否有增点或漏点 ｜ C. 图形是否美观 ｜ D. 坐标是否为整数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：检验是查完备性与纯粹性，即有没有多算或漏算的点。 A. 圆 ｜ B. 椭圆 ｜ C. 两定点的中垂线 ｜ D. 抛物线 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：到两点等距的点集就是这两点连线的垂直平分线。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五步：建系、设点、列式、化简、检验\n<\/li><li>\n检验查完备性与纯粹性\n<\/li><li>\n平方与约分是增点的主要来源\n<\/ul>", "ch03": "<h1>第 3 章：常见轨迹与空间轨迹<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n识别五种常见轨迹类型\n<\/li><li>\n用定义直接写出轨迹\n<\/li><li>\n了解空间轨迹的降维处理\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>记住五种定义型轨迹，看到条件就能报出图形。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 平面内的五种常见轨迹<\/h3>\n<ul><li>\n到定点距离等于定值：圆；\n<\/li><li>\n到两定点距离相等：中垂线；\n<\/li><li>\n到两定点距离之和为常数（大于两点距离）：椭圆；\n<\/li><li>\n到两定点距离之差的绝对值为常数（小于两点距离）：双曲线；\n<\/li><li>\n到定点与定直线的距离相等：抛物线。\n<\/ul>\n<p>后三种正是圆锥曲线的定义，与《圆锥曲线》一书直接衔接。<\/p>\n<h3>3.2 用定义写轨迹<\/h3>\n<p>能识别定义时，直接写出标准方程，比五步法快得多。例如“到点 F(1,0) 与直线 x=−1 距离相等”，由定义即得 y²=4x。<\/p>\n<h3>3.3 空间轨迹<\/h3>\n<p>空间中到定点距离为定值的点集是球面；到两定点等距的点集是垂直平分面。<\/p>\n<p>处理空间轨迹的常用办法是“降维”：先固定一个平面，求出平面内的轨迹，再让平面运动，合成空间图形。<\/p>\n<h3>3.4 轨迹的交与并<\/h3>\n<p>两个条件的交集对应两图形的交点，并集对应两图形的合并。含“或”的条件要取并，含“且”的要取交——这与解不等式组的逻辑一致。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：五种轨迹像五种“尺规规则”：给的距离关系不同，画出的曲线就不同。<\/p>\n<p><strong>失效边界<\/strong>：椭圆要求距离之和大于两定点距离；等于时为线段，小于时无轨迹。<\/p>\n<p><strong>实例<\/strong>：到 A(−3,0)、B(3,0) 距离之和为 8 的点：2a=8，a=4，c=3，b²=16−9=7，轨迹为 x²/16+y²/7=1。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 距离之和为常数就一定是椭圆 —— 实际上 当常数等于两定点距离时退化为线段，小于时不存在。\n<\/li><li>\n别以为 空间轨迹也能直接套平面公式 —— 实际上 空间要先降维或另建坐标系，平面公式只在某个平面内成立。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n到定点距离等于定值的点的轨迹是：\n<\/li><li>\n到两定点距离之差为常数（小于两点距离）的轨迹是：\n<p>A. 直线 ｜ B. 圆 ｜ C. 椭圆 ｜ D. 抛物线 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：这正是圆的定义。 A. 椭圆 ｜ B. 双曲线的一支或两支 ｜ C. 圆 ｜ D. 直线 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：差为常数对应双曲线；取绝对值时为两支，不取绝对值时为靠近某定点的一支。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五种定义型轨迹：圆、中垂线、椭圆、双曲线、抛物线\n<\/li><li>\n能识别定义就直接写方程\n<\/li><li>\n空间轨迹先降维\n<\/ul>", "c01": "<h1>充分必要<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>充分是“有它就够”，必要是“没它不行”。<\/p>\n<h2>为什么重要<\/h2>\n<p>轨迹的检验本质上就是判断“方程”与“条件”是否互为充要。<\/p>\n<h2>详解<\/h2>\n<p>p⇒q 时 p 充分、q 必要。用集合看：小范围推大范围。做题时把条件与结论各画一个范围，看谁包含谁，比背定义可靠。<\/p>\n<h2>常见误解<\/h2>\n<p>把“必要条件”理解成“重要的条件”，忽略它其实是方向问题。<\/p>\n<h2>相关概念<\/h2>\n<p>命题（ch01）、检验（ch02）<\/p>", "c02": "<h1>完备性与纯粹性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>完备是不漏，纯粹是不多；两者都满足，方程才等于轨迹。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是轨迹题唯一的评分关键：方程对了但没检验，通常要扣分。<\/p>\n<h2>详解<\/h2>\n<p>完备性：符合条件的点都在方程表示的图形上；纯粹性：图形上的点都符合条件。平方、约分、去绝对值常破坏纯粹性；忽略参数范围常破坏完备性。检验的办法是回到原条件逐条核对。<\/p>\n<h2>常见误解<\/h2>\n<p>认为“化简过程等价就没问题”，忽略平方与约分并不等价。<\/p>\n<h2>相关概念<\/h2>\n<p>五步法（ch02）、增根（《分式与根式》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：命题与充分必要条件<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：命题与充分必要条件<\/a><br>检查点：能判断“甲是乙的什么条件”<\/li><li class='path-step' id='path-02'><strong>步骤 02：求轨迹的五步法<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：求轨迹的五步法<\/a><br>检查点：能独立完成一道轨迹题的检验<\/li><li class='path-step' id='path-03'><strong>步骤 03：常见轨迹与空间轨迹<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：常见轨迹与空间轨迹<\/a><br>检查点：能由条件说出轨迹类型<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> “a&gt;1”是“a&gt;0”的：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 充分不必要条件<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 必要不充分条件<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 充要条件<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 既不充分也不必要<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q8.<\/b> 求轨迹时忽略检验，最可能导致：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 计算变慢<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 多算或漏算点<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 图形画错<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 方程次数变高<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：命题与充分必要条件<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “x=1”是“x²=1”的：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 充分不必要条件<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 必要不充分条件<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 充要条件<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 既不充分也不必要<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 若 A⊆B，则 A 是 B 的：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 充分条件<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 必要条件<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 充要条件<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 无关条件<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：求轨迹的五步法<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 求轨迹时“检验”这一步主要检查：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 计算是否正确<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 是否有增点或漏点<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 图形是否美观<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 坐标是否为整数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 到两定点距离相等的点的轨迹是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 圆<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 椭圆<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 两定点的中垂线<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 抛物线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：常见轨迹与空间轨迹<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 到定点距离等于定值的点的轨迹是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 直线<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 圆<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 椭圆<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 抛物线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 到两定点距离之差为常数（小于两点距离）的轨迹是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 椭圆<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 双曲线的一支或两支<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 圆<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='命题'>命题 — 可以判断真假的陈述句。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='充分条件'>充分条件 — 有它就能推出结论的条件。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='必要条件'>必要条件 — 没有它结论就不成立的条件。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='充要条件'>充要条件 — 互相都能推出的条件。 <span class=glossary-ref>（第 1 章：命题与充分必要条件）<\/span><\/li><li data-term='轨迹'>轨迹 — 满足某条件的点的集合。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><li data-term='完备性'>完备性 — 符合条件的点都在图形上。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><li data-term='纯粹性'>纯粹性 — 图形上的点都符合条件。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><li data-term='阿波罗尼斯圆'>阿波罗尼斯圆 — 到两定点距离之比为定值的点的轨迹。 <span class=glossary-ref>（第 2 章：求轨迹的五步法）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：轨迹题五步<\/h2>\n<p>建系、设点、列式、化简、检验；检验放在最后，不能省。<\/p>\n<h2>框架：先定义后计算<\/h2>\n<p>能识别为圆/椭圆/双曲线/抛物线时，直接用定义写方程，只在必要时才走五步法。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>充分<\/td><td>p⇒q，小范围推大范围<\/td><\/tr><tr><td>必要<\/td><td>q⇒p，没它不行<\/td><\/tr><tr><td>充要<\/td><td>p⇔q，集合相等<\/td><\/tr><tr><td>五步法<\/td><td>建系—设点—列式—化简—检验<\/td><\/tr><tr><td>轨迹类型<\/td><td>等距圆、等距中垂线、和椭圆、差双曲线、等距抛物线<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
</html>
