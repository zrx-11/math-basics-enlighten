<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>分式与根式</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/picocss/2.0.6/dist/css/pico.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
sup{font-size:.78em;line-height:0;vertical-align:.42em;font-weight:500}
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
</head>

<div class="layout">
  <aside class="sidebar">
    <h1>分式与根式</h1>
    <div class="sub">分母与根号：两类最容易被“扩大定义域”绊倒的运算</div>

</div>
<script>

 "ch04"]}, {"id": "c02", "title": "部分分式分解", "file": "concepts/c02-partial-fraction-concept.md", "chapterIds": ["ch03"], "source": {"file": "数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf", "kind": "原书 PDF"}, "prerequisites": ["ch03"]}], "glossary": [{"term": "有理分式", "def": "两个整式的商 A/B，B 含字母且不为零。", "chapterId": "ch01"}, {"term": "约分", "def": "约去分子分母的公因式。", "chapterId": "ch01"}, {"term": "最简公分母", "def": "各分母所有因式最高次幂的乘积。", "chapterId": "ch01"}, {"term": "增根", "def": "变形后产生但不满足原方程的解。", "chapterId": "ch02"}, {"term": "真分式", "def": "分子次数低于分母次数的分式。", "chapterId": "ch03"}, {"term": "部分分式", "def": "把真分式拆成的若干简单分式。", "chapterId": "ch03"}, {"term": "算术根", "def": "非负的 n 次方根。", "chapterId": "ch04"}, {"term": "分母有理化", "def": "通过乘共轭式消去分母中的根号。", "chapterId": "ch04"}, {"term": "共轭式", "def": "√a+√b 与 √a−√b 互为共轭，乘积为 a−b。", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "分式 1/(x²−9) 有意义的条件是：", "options": ["x≠3", "x≠−3", "x≠±3", "x≠0"], "answer": 2, "explain": "分母 x²−9=(x−3)(x+3)，要求 x≠3 且 x≠−3。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "化简 (x²−1)/(x²+x) 的结果是：", "options": ["(x−1)/x", "x−1", "1/x", "(x+1)/x"], "answer": 0, "explain": "分子 (x−1)(x+1)，分母 x(x+1)，约去 (x+1) 得 (x−1)/x（x≠0，x≠−1）。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "解分式方程产生增根的根本原因是：", "options": ["计算失误", "去分母时乘了含未知数的式子", "方程次数变高", "没有通分"], "answer": 1, "explain": "乘以含未知数的式子会把原定义域外的点带入等式，使不满足原方程的值成为候选解。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "方程 1/(x−2)=0 的解的情况是：", "options": ["x=2", "无解", "x=0", "任意实数"], "answer": 1, "explain": "分式的值为零要求分子为零且分母不为零；这里分子恒为 1，故无解。", "relatedConceptId": "c01", "prerequisites": ["ch02"]}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "分式 (x²+1)/(x−1) 属于：", "options": ["真分式", "假分式", "整式", "无法判断"], "answer": 1, "explain": "分子次数 2 不低于分母次数 1，是假分式，需先做除法。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "分解 1/[(x−1)(x−2)] 时，应设为：", "options": ["A/(x−1)+B/(x−2)", "A/(x−1)+B/(x−2)+C", "(Ax+B)/(x−1)(x−2)", "A/[(x−1)(x−2)]"], "answer": 0, "explain": "分母是两个不同的一次因式，各对应一个常数分子的一次分式。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "ch04", "type": "single", "question": "化简 √(x²−4x+4) 的结果是：", "options": ["x−2", "|x−2|", "2−x", "x+2"], "answer": 1, "explain": "被开方数是 (x−2)²，开方得绝对值 |x−2|，符号随 x 变化。", "relatedConceptId": "c01", "prerequisites": ["ch04"]}, {"id": "q08", "chapterId": "ch04", "type": "single", "question": "把 1/(√5−2) 分母有理化的结果是：", "options": ["√5+2", "(√5+2)/9", "√5−2", "(√5−2)/9"], "answer": 0, "explain": "分子分母同乘 (√5+2)：分母 (√5)²−2²=5−4=1，所以结果为 √5+2。", "relatedConceptId": "c01", "prerequisites": ["ch04"]}, {"id": "q09", "chapterId": "__all__", "type": "single", "question": "方程 (x²−1)/(x−1)=2 的解是：", "options": ["x=1", "x=−1", "无解", "x=±1"], "answer": 2, "explain": "约分后 x+1=2 得 x=1，但 x=1 使原分母为零，是增根；原方程无解。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "化简 √12+√27−√3 的结果是：", "options": ["4√3", "6√3", "2√3", "√3"], "answer": 0, "explain": "√12=2√3，√27=3√3，合并得 2√3+3√3−√3=4√3。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：有理分式的概念与运算」的一句话核心是什么？", "back": "分式就是两个整式的商；所有运算都受一条约束——分母不能为零。", "tags": ["fractions-radicals", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：分式方程与同解原理」的一句话核心是什么？", "back": "去分母是两边乘含未知数的式子，可能把分母为零的点混进来，所以必须验根。", "tags": ["fractions-radicals", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：部分分式」的一句话核心是什么？", "back": "把一个复杂真分式拆成几个简单分式之和，拆法由分母的因式类型决定。", "tags": ["fractions-radicals", "核心"]}, {"id": "f04", "chapterId": "ch04", "front": "「第 4 章：根式与算术根」的一句话核心是什么？", "back": "根号表示非负的算术根；化简是把被开方数里的完全平方因子提出来，有理化是消掉分母里的根号。", "tags": ["fractions-radicals", "核心"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「有理分式」？", "back": "两个整式的商 A/B，B 含字母且不为零。", "tags": ["fractions-radicals", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「约分」？", "back": "约去分子分母的公因式。", "tags": ["fractions-radicals", "术语"]}, {"id": "f07", "chapterId": "ch01", "front": "什么是「最简公分母」？", "back": "各分母所有因式最高次幂的乘积。", "tags": ["fractions-radicals", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「增根」？", "back": "变形后产生但不满足原方程的解。", "tags": ["fractions-radicals", "术语"]}, {"id": "f09", "chapterId": "ch03", "front": "什么是「真分式」？", "back": "分子次数低于分母次数的分式。", "tags": ["fractions-radicals", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「部分分式」？", "back": "把真分式拆成的若干简单分式。", "tags": ["fractions-radicals", "术语"]}, {"id": "f11", "chapterId": "ch04", "front": "什么是「算术根」？", "back": "非负的 n 次方根。", "tags": ["fractions-radicals", "术语"]}, {"id": "f12", "chapterId": "ch04", "front": "什么是「分母有理化」？", "back": "通过乘共轭式消去分母中的根号。", "tags": ["fractions-radicals", "术语"]}, {"id": "f13", "chapterId": "ch04", "front": "什么是「共轭式」？", "back": "√a+√b 与 √a−√b 互为共轭，乘积为 a−b。", "tags": ["fractions-radicals", "术语"]}], "companion": "fractions-radicals学习伴侣.html", "deriv": "fractions-radicals从零推导.html"}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">整式、因式分解<\/span><\/div><h1>第 1 章：有理分式的概念与运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：整式、因式分解\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出分式有意义的条件\n<\/li><li>\n用基本性质约分、通分\n<\/li><li>\n完成分式的加减乘除并化为最简\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>分式就是两个整式的商；所有运算都受一条约束——分母不能为零。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 分式与定义域<\/h3>\n<p>形如 A/B（A、B 是整式，B 含字母）的式子叫<strong>有理分式<\/strong>。分式有意义的条件是 B≠0。<\/p>\n<p>求定义域就是解 B≠0：例如 1/(x−2) 要求 x≠2；1/(x²−1) 要求 x≠±1。<\/p>\n<h3>1.2 基本性质<\/h3>\n<p>分子分母同乘（或同除）同一个不为零的式子，分式的值不变：<\/p>\n<p>A/B = AC/BC（C≠0）<\/p>\n<p>约分与通分都靠这一条。<\/p>\n<h3>1.3 约分只能约因式<\/h3>\n<p>约分前先因式分解，约掉的是<strong>整个因式<\/strong>，不是某一项。例如<\/p>\n<p>(x²−1)/(x²+x) = (x−1)(x+1)/[x(x+1)] = (x−1)/x<\/p>\n<p>不能把分子分母里的 x 各划掉一个了事。<\/p>\n<h3>1.4 四则运算<\/h3>\n<ul><li>\n乘：分子乘分子、分母乘分母，先约分再乘更省力；\n<\/li><li>\n除：乘以除式的倒数；\n<\/li><li>\n加减：先通分（找最简公分母），再分子相加减。\n<\/ul>\n<p>最简公分母取各分母所有因式的最高次幂之积。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：分式像“按比例配比”，分子分母同时放大缩小，比例不变；但加减项不能随便缩放。<\/p>\n<p><strong>失效边界<\/strong>：基本性质要求乘的式子不为零；乘的式子在某个点为零时，那个点的值要单独讨论。<\/p>\n<p><strong>实例<\/strong>：化简 (x²−4)/(x²−3x+2)。 分子 (x−2)(x+2)；分母 (x−2)(x−1)。约去 (x−2) 得 (x+2)/(x−1)（x≠1 且 x≠2）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 (x+1)/(x+2) 可以约成 1/2 —— 实际上 分子分母是加减关系，不是乘积关系，不能约去 x。只有公因式才能约。\n<\/li><li>\n别以为 分式运算不用管定义域 —— 实际上 约分、通分都可能改变定义域；答案要注明使原式有意义的条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n分式 1/(x²−9) 有意义的条件是：\n<\/li><li>\n化简 (x²−1)/(x²+x) 的结果是：\n<p>A. x≠3 ｜ B. x≠−3 ｜ C. x≠±3 ｜ D. x≠0 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：分母 x²−9=(x−3)(x+3)，要求 x≠3 且 x≠−3。 A. (x−1)/x ｜ B. x−1 ｜ C. 1/x ｜ D. (x+1)/x <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：分子 (x−1)(x+1)，分母 x(x+1)，约去 (x+1) 得 (x−1)/x（x≠0，x≠−1）。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n分式有意义 ⇔ 分母不为零\n<\/li><li>\n约分约因式，不约项\n<\/li><li>\n通分找最简公分母：各因式最高次幂之积\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：有理分式的概念与运算）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：有理分式的概念与运算<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>分式的全部规则只有一条：分子分母同乘非零式，值不变。约分、通分、加减都从它来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>有理分式是两个整式的商 A/B，其中 B 含字母且 B≠0。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>分式像配方比例：糖和水的比例不变，整锅放大一倍仍是同样的甜度。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 基本性质<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}=\\frac{AC}{BC}\\quad(C\\ne 0)<\/div>\n<p>分子分母同乘同一个非零式，比值不变。<\/p>\n<h3>2. 约分<\/h3>\n<div class=\"katex-block\">\\frac{(x-1)(x+1)}{x(x+1)}=\\frac{x-1}{x}<\/div>\n<p>把公因式 (x+1) 整体约去，剩下的仍是因式结构。<\/p>\n<h3>3. 加减通分<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}\\pm\\frac{C}{D}=\\frac{AD\\pm BC}{BD}<\/div>\n<p>通分后分子相加减，分母取公分母。<\/p>\n<h3>4. 除法<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}\\div\\frac{C}{D}=\\frac{A}{B}\\cdot\\frac{D}{C}<\/div>\n<p>除以一个分式等于乘它的倒数，注意 C≠0。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>“同乘一个式子”要求该式不为零；在它为零的点上，等式两边都失去意义。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《分式与根式》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 1 章：有理分式的概念与运算"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：有理分式的概念与运算<\/a><\/span><\/div><h1>第 2 章：分式方程与同解原理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用去分母把分式方程化为整式方程\n<\/li><li>\n解释增根是怎么产生的\n<\/li><li>\n通过验根写出正确解集\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>去分母是两边乘含未知数的式子，可能把分母为零的点混进来，所以必须验根。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 解法步骤<\/h3>\n<ol><li>\n找最简公分母；\n<\/li><li>\n两边同乘公分母，化成整式方程；\n<\/li><li>\n解整式方程；\n<\/li><li>\n把每个解代回原方程（或检查分母是否为零），排除增根。\n<\/ol>\n<h3>2.2 增根从哪里来<\/h3>\n<p>原方程要求 x≠a（分母零点）。去分母时两边乘了含 (x−a) 的式子，在 x=a 这一点上，原方程两边都没有意义，但乘完之后等式可能成立。于是 x=a 成了“解”，却不满足原方程。<\/p>\n<h3>2.3 一个典型例子<\/h3>\n<p>解 1/(x−1)=2/(x²−1)。 两边乘 (x−1)(x+1)：x+1=2，得 x=1。 但 x=1 使分母为零，是增根，原方程无解。<\/p>\n<h3>2.4 验根不等于重算<\/h3>\n<p>验根只需检查两件事：分母是否为零、代回后两边是否相等。不必把整道题重做一遍。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：去分母像给方程“整体放大”，放大过程中可能把本来不在定义域里的点也放大成解。<\/p>\n<p><strong>失效边界<\/strong>：如果公分母恒不为零（例如只含常数因子），就不会产生增根，但仍建议验根。<\/p>\n<p><strong>实例<\/strong>：解 2/(x−3)=1。 两边乘 (x−3)：2=x−3，得 x=5。验根：分母 5−3=2≠0，成立。解为 x=5。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 解出整式方程的解就是原方程的解 —— 实际上 必须验根；使分母为零的解一律舍去。\n<\/li><li>\n别以为 增根是算错了 —— 实际上 增根不是计算错误，而是变形扩大了定义域，属于方法本身的副作用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n解分式方程产生增根的根本原因是：\n<\/li><li>\n方程 1/(x−2)=0 的解的情况是：\n<p>A. 计算失误 ｜ B. 去分母时乘了含未知数的式子 ｜ C. 方程次数变高 ｜ D. 没有通分 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：乘以含未知数的式子会把原定义域外的点带入等式，使不满足原方程的值成为候选解。 A. x=2 ｜ B. 无解 ｜ C. x=0 ｜ D. 任意实数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：分式的值为零要求分子为零且分母不为零；这里分子恒为 1，故无解。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n去分母 → 解整式方程 → 验根\n<\/li><li>\n增根来自乘了含未知数的式子\n<\/li><li>\n分式为零：分子为零且分母不为零\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：分式方程与同解原理）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：分式方程与同解原理<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>分式方程的解法只有一句话：把分母清掉。但清分母的动作会改变定义域，这就是全部麻烦的来源。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>分母中含未知数的方程叫分式方程。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像把分数方程“乘以公分母”翻译成整数方程；翻译时把原文里不允许的取值也带进来了。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 原方程的定义域<\/h3>\n<div class=\"katex-block\">\\frac{A(x)}{B(x)}=0\\ \\Rightarrow\\ B(x)\\ne 0<\/div>\n<p>先记下所有使分母为零的点，这些点永远不能是解。<\/p>\n<h3>2. 去分母<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}=\\frac{C}{D}\\ \\Rightarrow\\ AD=BC<\/div>\n<p>两边乘 BD，把分式方程变成整式方程。<\/p>\n<h3>3. 增根判定<\/h3>\n<div class=\"katex-block\">x=x_{0}\\ \\text{且}\\ B(x_{0})=0\\ \\Rightarrow\\ x_{0}\\ \\text{为增根}<\/div>\n<p>解出的值若踩在分母零点上，就是变形带进来的假解。<\/p>\n<h3>4. 分式为零<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}=0\\iff A=0\\ \\text{且}\\ B\\ne 0<\/div>\n<p>分子为零只是必要条件，还要分母不为零。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>公分母若含未知数，就必须验根；若为常数，则不会产生增根。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《分式与根式》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 2 章：分式方程与同解原理"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：分式方程与同解原理<\/a><\/span><\/div><h1>第 3 章：部分分式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02、待定系数法\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断一个分式是否为真分式\n<\/li><li>\n把分母分解后按类型设部分分式\n<\/li><li>\n用待定系数法求出各项系数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>把一个复杂真分式拆成几个简单分式之和，拆法由分母的因式类型决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 真分式与假分式<\/h3>\n<p>分子次数低于分母次数的叫<strong>真分式<\/strong>；否则叫假分式。假分式先做多项式除法，化成“多项式 + 真分式”，再拆真分式。<\/p>\n<h3>3.2 分母的三种因式<\/h3>\n<ul><li>\n一次因式 (x−a)，对应一项 A/(x−a)；\n<\/li><li>\n重复一次因式 (x−a)<sup>k<\/sup>，对应 A₁/(x−a)+…+A_k/(x−a)<sup>k<\/sup>；\n<\/li><li>\n不可约二次因式 x²+px+q，对应 (Bx+C)/(x²+px+q)。\n<\/ul>\n<h3>3.3 求系数的两条路<\/h3>\n<ol><li>\n<strong>比较系数<\/strong>：通分后比较各次项系数，解线性方程组；\n<\/li><li>\n<strong>代特殊值<\/strong>：把 x 取成各因式的零点，能直接定出一部分系数，剩下的再比较。\n<\/ol>\n<h3>3.4 用途<\/h3>\n<p>拆开之后，每一项都容易积分、容易求和。原书用它处理级数求和，后面的微积分里用它做积分。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：部分分式像把一锅混合汤分成几小碗，每碗只含一种味道，便于单独处理。<\/p>\n<p><strong>失效边界<\/strong>：分母必须先分解到实数范围内的不可约因式；分解不彻底，拆出来的项也对不上。<\/p>\n<p><strong>实例<\/strong>：拆 1/[x(x+1)]。 设 1/[x(x+1)]=A/x+B/(x+1)，通分得 A(x+1)+Bx=1。 取 x=0 得 A=1；取 x=−1 得 B=−1。所以 1/[x(x+1)]=1/x−1/(x+1)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 任何分式都能直接拆成一次项之和 —— 实际上 分母含不可约二次因式时，对应项的分子是一次式 Bx+C，不是常数。\n<\/li><li>\n别以为 部分分式只用于化简 —— 实际上 它的主要用途是积分与级数求和：拆开后每一项都有现成公式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n分式 (x²+1)/(x−1) 属于：\n<\/li><li>\n分解 1/[(x−1)(x−2)] 时，应设为：\n<p>A. 真分式 ｜ B. 假分式 ｜ C. 整式 ｜ D. 无法判断 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：分子次数 2 不低于分母次数 1，是假分式，需先做除法。 A. A/(x−1)+B/(x−2) ｜ B. A/(x−1)+B/(x−2)+C ｜ C. (Ax+B)/(x−1)(x−2) ｜ D. A/[(x−1)(x−2)] <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：分母是两个不同的一次因式，各对应一个常数分子的一次分式。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n真分式：分子次数低于分母\n<\/li><li>\n不同一次因式 → 常数分子；重因式 → 逐次幂；二次因式 → 一次分子\n<\/li><li>\n求系数：比较系数或代零点\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：部分分式）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：部分分式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>部分分式不是技巧，而是“把分母的每个因式各配一个分子”的必然形式。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>把真分式写成若干个简单分式之和，叫部分分式分解。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像把一个大分数拆成几个小分数的和：分母的每个因式各占一碗。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 真分式前提<\/h3>\n<div class=\"katex-block\">\\deg P<\\deg Q<\/div>\n<p>分子次数低于分母才能直接拆；否则先做多项式除法。<\/p>\n<h3>2. 一次因式<\/h3>\n<div class=\"katex-block\">\\frac{P(x)}{(x-a)(x-b)}=\\frac{A}{x-a}+\\frac{B}{x-b}<\/div>\n<p>每个不同的一次因式配一个常数分子。<\/p>\n<h3>3. 重因式<\/h3>\n<div class=\"katex-block\">\\frac{P(x)}{(x-a)^{2}}=\\frac{A}{x-a}+\\frac{B}{(x-a)^{2}}<\/div>\n<p>重因式要按 1 次到 k 次各写一项。<\/p>\n<h3>4. 二次因式<\/h3>\n<div class=\"katex-block\">\\frac{P(x)}{x^{2}+px+q}=\\frac{Bx+C}{x^{2}+px+q}<\/div>\n<p>不可约二次因式的分子要设为一次式。<\/p>\n<h3>5. 求系数<\/h3>\n<div class=\"katex-block\">\\frac{1}{x(x+1)}=\\frac{A}{x}+\\frac{B}{x+1}\\ \\Rightarrow\\ A(x+1)+Bx=1<\/div>\n<p>代 x=0 得 A=1，代 x=−1 得 B=−1。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>分母必须分解到不可约；否则设项时会漏掉中间形式，解出的系数不唯一。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《分式与根式》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 3 章：部分分式"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">开方、绝对值<\/span><\/div><h1>第 4 章：根式与算术根<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：开方、绝对值\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n区分方根与算术根，正确使用 √(a²)=|a|\n<\/li><li>\n化简根式、做分母有理化\n<\/li><li>\n解根式方程并验根\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>根号表示非负的算术根；化简是把被开方数里的完全平方因子提出来，有理化是消掉分母里的根号。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 方根与算术根<\/h3>\n<p>x²=a（a&gt;0）有两个根 ±√a；其中非负的那个 √a 叫<strong>算术根<\/strong>。所以 √a 本身永远 ≥0。<\/p>\n<p>由此得到一条常用恒等式：<\/p>\n<p>√(a²)=|a|<\/p>\n<p>a≥0 时等于 a，a&lt;0 时等于 −a。写成 √(a²)=a 是错的。<\/p>\n<h3>4.2 根式的化简<\/h3>\n<p>把被开方数分解出完全平方因子：<\/p>\n<p>√72=√(36×2)=6√2<\/p>\n<p>分母里带根号时，分子分母同乘适当的式子把它消掉，叫<strong>分母有理化<\/strong>：<\/p>\n<p>1/√2=√2/2；1/(√3+√2)=√3−√2<\/p>\n<p>第二条用的是平方差 (√3+√2)(√3−√2)=1。<\/p>\n<h3>4.3 根式的运算<\/h3>\n<p>同次根式可以直接相乘除；不同次要先化成同次。加减只有在根号内部分完全相同时才能合并，如 2√3+5√3=7√3。<\/p>\n<h3>4.4 根式方程<\/h3>\n<p>把根号项单独放一边，两边平方，解出后<strong>必须验根<\/strong>：平方会把负值变成正值，可能引入不满足原式的解。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：根号像“长度的量尺”，量出来永远是非负的；平方再开方，得到的是距离，不是原数的符号。<\/p>\n<p><strong>失效边界<\/strong>：√(a²)=|a| 只对实数成立；在复数范围内开方是多值的，规则不同。<\/p>\n<p><strong>实例<\/strong>：化简 √(x²−6x+9)。 被开方数是 (x−3)²，所以原式 = |x−3|。当 x≥3 时为 x−3，当 x&lt;3 时为 3−x。 若直接写成 x−3，就在 x&lt;3 时算错了。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 √(a²)=a —— 实际上 等于 |a|。a 为负时结果是 −a，因为算术根必须非负。\n<\/li><li>\n别以为 √a+√b=√(a+b) —— 实际上 不成立。取 a=b=1：左边 2，右边 √2。根式不能这样合并。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n化简 √(x²−4x+4) 的结果是：\n<\/li><li>\n把 1/(√5−2) 分母有理化的结果是：\n<p>A. x−2 ｜ B. |x−2| ｜ C. 2−x ｜ D. x+2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：被开方数是 (x−2)²，开方得绝对值 |x−2|，符号随 x 变化。 A. √5+2 ｜ B. (√5+2)/9 ｜ C. √5−2 ｜ D. (√5−2)/9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：分子分母同乘 (√5+2)：分母 (√5)²−2²=5−4=1，所以结果为 √5+2。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n√a≥0；√(a²)=|a|\n<\/li><li>\n化简：提出完全平方因子；有理化：用平方差消分母根号\n<\/li><li>\n根式方程平方后必须验根\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：根式与算术根）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：根式与算术根<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>根号的麻烦全在一个字上：符号。算术根规定非负，于是开方之后要补绝对值。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>若 x<sup>n<\/sup>=a，则 x 为 a 的 n 次方根；其中非负的那个叫算术根 √[n]a。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>根号像量长度：不管从哪边量，读数都是正的；要找回原来的方向，得另外看符号。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 算术根非负<\/h3>\n<div class=\"katex-block\">\\sqrt{a}\\ge 0\\quad(a\\ge 0)<\/div>\n<p>算术根按定义取非负值，这是后面所有化简的前提。<\/p>\n<h3>2. 平方再开方<\/h3>\n<div class=\"katex-block\">\\sqrt{a^{2}}=|a|=\\begin{cases}a, & a\\ge 0\\\\ -a, & a<0\\end{cases}<\/div>\n<p>开方只取非负值，所以负号要由绝对值补回来。<\/p>\n<h3>3. 化简<\/h3>\n<div class=\"katex-block\">\\sqrt{72}=\\sqrt{36\\cdot 2}=6\\sqrt{2}<\/div>\n<p>把完全平方因子提到根号外。<\/p>\n<h3>4. 有理化<\/h3>\n<div class=\"katex-block\">\\frac{1}{\\sqrt{3}+\\sqrt{2}}=\\sqrt{3}-\\sqrt{2}<\/div>\n<p>分子分母同乘 (√3−√2)，用平方差把分母变成整数。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>偶次根号下必须非负；奇次根号对被开方数没有符号限制。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《分式与根式》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 4 章：根式与算术根"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：有理分式的概念与运算<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：分式方程与同解原理<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：根式与算术根<\/a><\/span><\/div><h1>定义域与增根<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每一步变形都要问：原来不允许的取值，有没有被这一步偷偷放进来。<\/p>\n<h2>为什么重要<\/h2>\n<p>分式与根式的错误大多不是算错，而是忘了定义域；抓住这条，出错率会明显下降。<\/p>\n<h2>详解<\/h2>\n<p>分式要求分母非零，偶次根式要求被开方数非负。去分母、平方这些变形会扩大定义域，因此解完必须回到原式筛一遍。筛的标准只有两条：原式是否有意义、代回是否相等。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“验根”是可省略的步骤。对含未知数的去分母或平方，验根是解法的一部分。<\/p>\n<h2>相关概念<\/h2>\n<p>分式方程（ch02）、根式方程（ch04）<\/p>", "kind": "concept", "title": "定义域与增根"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：部分分式<\/a><\/span><\/div><h1>部分分式分解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>按分母的因式类型配分子，把真分式拆成简单项之和。<\/p>\n<h2>为什么重要<\/h2>\n<p>拆开之后每一项都能单独处理，是积分与级数求和的标准前置动作。<\/p>\n<h2>详解<\/h2>\n<p>三种类型对应三种设法：不同一次因式配常数；重因式按幂次逐项配；不可约二次因式配一次式。系数用比较系数或代零点求。<\/p>\n<h2>常见误解<\/h2>\n<p>把不可约二次因式也配常数分子，会解不出系数或得到错误分解。<\/p>\n<h2>相关概念<\/h2>\n<p>待定系数法（《整式》ch04）、积分（《微积分初步》）<\/p>", "kind": "concept", "title": "部分分式分解"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：有理分式的概念与运算<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：有理分式的概念与运算<\/a><br>检查点：能把复杂分式化为最简分式<\/li><li class='path-step' id='path-02'><strong>步骤 02：分式方程与同解原理<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：分式方程与同解原理<\/a><br>检查点：能解分式方程并说明增根来自哪里<\/li><li class='path-step' id='path-03'><strong>步骤 03：部分分式<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：部分分式<\/a><br>检查点：能把真分式拆成简单分式之和<\/li><li class='path-step' id='path-04'><strong>步骤 04：根式与算术根<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：根式与算术根<\/a><br>检查点：能化简根式并做分母有理化<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q09' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q9.<\/b> 方程 (x²−1)/(x−1)=2 的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> x=1<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> x=−1<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 无解<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> x=±1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q10.<\/b> 化简 √12+√27−√3 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 4√3<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 6√3<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 2√3<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> √3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：有理分式的概念与运算<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 分式 1/(x²−9) 有意义的条件是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> x≠3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> x≠−3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> x≠±3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> x≠0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 化简 (x²−1)/(x²+x) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> (x−1)/x<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> x−1<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 1/x<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> (x+1)/x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：分式方程与同解原理<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 解分式方程产生增根的根本原因是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 计算失误<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 去分母时乘了含未知数的式子<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 方程次数变高<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 没有通分<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 方程 1/(x−2)=0 的解的情况是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> x=2<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 无解<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> x=0<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 任意实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：部分分式<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 分式 (x²+1)/(x−1) 属于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 真分式<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 假分式<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 整式<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 分解 1/[(x−1)(x−2)] 时，应设为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> A/(x−1)+B/(x−2)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> A/(x−1)+B/(x−2)+C<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> (Ax+B)/(x−1)(x−2)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> A/[(x−1)(x−2)]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：根式与算术根<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c01' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 化简 √(x²−4x+4) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> x−2<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> |x−2|<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 2−x<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> x+2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c01' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 把 1/(√5−2) 分母有理化的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> √5+2<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> (√5+2)/9<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> √5−2<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> (√5−2)/9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='有理分式'>有理分式 — 两个整式的商 A/B，B 含字母且不为零。 <span class=glossary-ref>（第 1 章：有理分式的概念与运算）<\/span><\/li><li data-term='约分'>约分 — 约去分子分母的公因式。 <span class=glossary-ref>（第 1 章：有理分式的概念与运算）<\/span><\/li><li data-term='最简公分母'>最简公分母 — 各分母所有因式最高次幂的乘积。 <span class=glossary-ref>（第 1 章：有理分式的概念与运算）<\/span><\/li><li data-term='增根'>增根 — 变形后产生但不满足原方程的解。 <span class=glossary-ref>（第 2 章：分式方程与同解原理）<\/span><\/li><li data-term='真分式'>真分式 — 分子次数低于分母次数的分式。 <span class=glossary-ref>（第 3 章：部分分式）<\/span><\/li><li data-term='部分分式'>部分分式 — 把真分式拆成的若干简单分式。 <span class=glossary-ref>（第 3 章：部分分式）<\/span><\/li><li data-term='算术根'>算术根 — 非负的 n 次方根。 <span class=glossary-ref>（第 4 章：根式与算术根）<\/span><\/li><li data-term='分母有理化'>分母有理化 — 通过乘共轭式消去分母中的根号。 <span class=glossary-ref>（第 4 章：根式与算术根）<\/span><\/li><li data-term='共轭式'>共轭式 — √a+√b 与 √a−√b 互为共轭，乘积为 a−b。 <span class=glossary-ref>（第 4 章：根式与算术根）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：含分母/根号的四步<\/h2>\n<p>① 写下定义域限制；② 选变形（通分、去分母、有理化、平方）；③ 解出候选解；④ 用定义域与原式筛掉增根。<\/p>\n<h2>框架：拆分的三种模板<\/h2>\n<p>一次因式配常数、重因式按幂配、二次因式配一次式。模板先定，系数后求。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>分式有意义<\/td><td>分母 ≠ 0<\/td><\/tr><tr><td>基本性质<\/td><td>A/B = AC/BC（C≠0）<\/td><\/tr><tr><td>分式方程<\/td><td>去分母 → 解 → 验根<\/td><\/tr><tr><td>部分分式<\/td><td>一次配常数、重因式按幂、二次配一次式<\/td><\/tr><tr><td>算术根<\/td><td>√a ≥ 0；√(a²)=<\/td><td>a<\/td><td><\/td><\/tr><tr><td>有理化<\/td><td>1/(√a+√b)=(√a−√b)/(a−b)<\/td><\/tr><tr><td>根式方程<\/td><td>孤立根号 → 平方 → 验根<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/04-分式与根式", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：有理分式的概念与运算", "href": "#/chapter/ch01"}, {"label": "第 2 章：分式方程与同解原理", "href": "#/chapter/ch02"}, {"label": "第 3 章：部分分式", "href": "#/chapter/ch03"}, {"label": "第 4 章：根式与算术根", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "定义域与增根", "href": "#/concept/c01"}, {"label": "部分分式分解", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：有理分式的概念与运算", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：分式方程与同解原理", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：部分分式", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：根式与算术根", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">整式、因式分解<\/span><\/div><h1>第 1 章：有理分式的概念与运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：整式、因式分解\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说出分式有意义的条件\n<\/li><li>\n用基本性质约分、通分\n<\/li><li>\n完成分式的加减乘除并化为最简\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>分式就是两个整式的商；所有运算都受一条约束——分母不能为零。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 分式与定义域<\/h3>\n<p>形如 A/B（A、B 是整式，B 含字母）的式子叫<strong>有理分式<\/strong>。分式有意义的条件是 B≠0。<\/p>\n<p>求定义域就是解 B≠0：例如 1/(x−2) 要求 x≠2；1/(x²−1) 要求 x≠±1。<\/p>\n<h3>1.2 基本性质<\/h3>\n<p>分子分母同乘（或同除）同一个不为零的式子，分式的值不变：<\/p>\n<p>A/B = AC/BC（C≠0）<\/p>\n<p>约分与通分都靠这一条。<\/p>\n<h3>1.3 约分只能约因式<\/h3>\n<p>约分前先因式分解，约掉的是<strong>整个因式<\/strong>，不是某一项。例如<\/p>\n<p>(x²−1)/(x²+x) = (x−1)(x+1)/[x(x+1)] = (x−1)/x<\/p>\n<p>不能把分子分母里的 x 各划掉一个了事。<\/p>\n<h3>1.4 四则运算<\/h3>\n<ul><li>\n乘：分子乘分子、分母乘分母，先约分再乘更省力；\n<\/li><li>\n除：乘以除式的倒数；\n<\/li><li>\n加减：先通分（找最简公分母），再分子相加减。\n<\/ul>\n<p>最简公分母取各分母所有因式的最高次幂之积。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：分式像“按比例配比”，分子分母同时放大缩小，比例不变；但加减项不能随便缩放。<\/p>\n<p><strong>失效边界<\/strong>：基本性质要求乘的式子不为零；乘的式子在某个点为零时，那个点的值要单独讨论。<\/p>\n<p><strong>实例<\/strong>：化简 (x²−4)/(x²−3x+2)。 分子 (x−2)(x+2)；分母 (x−2)(x−1)。约去 (x−2) 得 (x+2)/(x−1)（x≠1 且 x≠2）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 (x+1)/(x+2) 可以约成 1/2 —— 实际上 分子分母是加减关系，不是乘积关系，不能约去 x。只有公因式才能约。\n<\/li><li>\n别以为 分式运算不用管定义域 —— 实际上 约分、通分都可能改变定义域；答案要注明使原式有意义的条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n分式 1/(x²−9) 有意义的条件是：\n<\/li><li>\n化简 (x²−1)/(x²+x) 的结果是：\n<p>A. x≠3 ｜ B. x≠−3 ｜ C. x≠±3 ｜ D. x≠0 <strong>答案<\/strong>：C ｜ <strong>解析<\/strong>：分母 x²−9=(x−3)(x+3)，要求 x≠3 且 x≠−3。 A. (x−1)/x ｜ B. x−1 ｜ C. 1/x ｜ D. (x+1)/x <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：分子 (x−1)(x+1)，分母 x(x+1)，约去 (x+1) 得 (x−1)/x（x≠0，x≠−1）。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n分式有意义 ⇔ 分母不为零\n<\/li><li>\n约分约因式，不约项\n<\/li><li>\n通分找最简公分母：各因式最高次幂之积\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：有理分式的概念与运算）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：有理分式的概念与运算<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>分式的全部规则只有一条：分子分母同乘非零式，值不变。约分、通分、加减都从它来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>有理分式是两个整式的商 A/B，其中 B 含字母且 B≠0。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>分式像配方比例：糖和水的比例不变，整锅放大一倍仍是同样的甜度。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 基本性质<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}=\\frac{AC}{BC}\\quad(C\\ne 0)<\/div>\n<p>分子分母同乘同一个非零式，比值不变。<\/p>\n<h3>2. 约分<\/h3>\n<div class=\"katex-block\">\\frac{(x-1)(x+1)}{x(x+1)}=\\frac{x-1}{x}<\/div>\n<p>把公因式 (x+1) 整体约去，剩下的仍是因式结构。<\/p>\n<h3>3. 加减通分<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}\\pm\\frac{C}{D}=\\frac{AD\\pm BC}{BD}<\/div>\n<p>通分后分子相加减，分母取公分母。<\/p>\n<h3>4. 除法<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}\\div\\frac{C}{D}=\\frac{A}{B}\\cdot\\frac{D}{C}<\/div>\n<p>除以一个分式等于乘它的倒数，注意 C≠0。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>“同乘一个式子”要求该式不为零；在它为零的点上，等式两边都失去意义。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《分式与根式》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：有理分式的概念与运算<\/a><\/span><\/div><h1>第 2 章：分式方程与同解原理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用去分母把分式方程化为整式方程\n<\/li><li>\n解释增根是怎么产生的\n<\/li><li>\n通过验根写出正确解集\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>去分母是两边乘含未知数的式子，可能把分母为零的点混进来，所以必须验根。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 解法步骤<\/h3>\n<ol><li>\n找最简公分母；\n<\/li><li>\n两边同乘公分母，化成整式方程；\n<\/li><li>\n解整式方程；\n<\/li><li>\n把每个解代回原方程（或检查分母是否为零），排除增根。\n<\/ol>\n<h3>2.2 增根从哪里来<\/h3>\n<p>原方程要求 x≠a（分母零点）。去分母时两边乘了含 (x−a) 的式子，在 x=a 这一点上，原方程两边都没有意义，但乘完之后等式可能成立。于是 x=a 成了“解”，却不满足原方程。<\/p>\n<h3>2.3 一个典型例子<\/h3>\n<p>解 1/(x−1)=2/(x²−1)。 两边乘 (x−1)(x+1)：x+1=2，得 x=1。 但 x=1 使分母为零，是增根，原方程无解。<\/p>\n<h3>2.4 验根不等于重算<\/h3>\n<p>验根只需检查两件事：分母是否为零、代回后两边是否相等。不必把整道题重做一遍。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：去分母像给方程“整体放大”，放大过程中可能把本来不在定义域里的点也放大成解。<\/p>\n<p><strong>失效边界<\/strong>：如果公分母恒不为零（例如只含常数因子），就不会产生增根，但仍建议验根。<\/p>\n<p><strong>实例<\/strong>：解 2/(x−3)=1。 两边乘 (x−3)：2=x−3，得 x=5。验根：分母 5−3=2≠0，成立。解为 x=5。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 解出整式方程的解就是原方程的解 —— 实际上 必须验根；使分母为零的解一律舍去。\n<\/li><li>\n别以为 增根是算错了 —— 实际上 增根不是计算错误，而是变形扩大了定义域，属于方法本身的副作用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n解分式方程产生增根的根本原因是：\n<\/li><li>\n方程 1/(x−2)=0 的解的情况是：\n<p>A. 计算失误 ｜ B. 去分母时乘了含未知数的式子 ｜ C. 方程次数变高 ｜ D. 没有通分 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：乘以含未知数的式子会把原定义域外的点带入等式，使不满足原方程的值成为候选解。 A. x=2 ｜ B. 无解 ｜ C. x=0 ｜ D. 任意实数 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：分式的值为零要求分子为零且分母不为零；这里分子恒为 1，故无解。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n去分母 → 解整式方程 → 验根\n<\/li><li>\n增根来自乘了含未知数的式子\n<\/li><li>\n分式为零：分子为零且分母不为零\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：分式方程与同解原理）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：分式方程与同解原理<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>分式方程的解法只有一句话：把分母清掉。但清分母的动作会改变定义域，这就是全部麻烦的来源。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>分母中含未知数的方程叫分式方程。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像把分数方程“乘以公分母”翻译成整数方程；翻译时把原文里不允许的取值也带进来了。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 原方程的定义域<\/h3>\n<div class=\"katex-block\">\\frac{A(x)}{B(x)}=0\\ \\Rightarrow\\ B(x)\\ne 0<\/div>\n<p>先记下所有使分母为零的点，这些点永远不能是解。<\/p>\n<h3>2. 去分母<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}=\\frac{C}{D}\\ \\Rightarrow\\ AD=BC<\/div>\n<p>两边乘 BD，把分式方程变成整式方程。<\/p>\n<h3>3. 增根判定<\/h3>\n<div class=\"katex-block\">x=x_{0}\\ \\text{且}\\ B(x_{0})=0\\ \\Rightarrow\\ x_{0}\\ \\text{为增根}<\/div>\n<p>解出的值若踩在分母零点上，就是变形带进来的假解。<\/p>\n<h3>4. 分式为零<\/h3>\n<div class=\"katex-block\">\\frac{A}{B}=0\\iff A=0\\ \\text{且}\\ B\\ne 0<\/div>\n<p>分子为零只是必要条件，还要分母不为零。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>公分母若含未知数，就必须验根；若为常数，则不会产生增根。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《分式与根式》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：分式方程与同解原理<\/a><\/span><\/div><h1>第 3 章：部分分式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：ch02、待定系数法\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n判断一个分式是否为真分式\n<\/li><li>\n把分母分解后按类型设部分分式\n<\/li><li>\n用待定系数法求出各项系数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>把一个复杂真分式拆成几个简单分式之和，拆法由分母的因式类型决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 真分式与假分式<\/h3>\n<p>分子次数低于分母次数的叫<strong>真分式<\/strong>；否则叫假分式。假分式先做多项式除法，化成“多项式 + 真分式”，再拆真分式。<\/p>\n<h3>3.2 分母的三种因式<\/h3>\n<ul><li>\n一次因式 (x−a)，对应一项 A/(x−a)；\n<\/li><li>\n重复一次因式 (x−a)<sup>k<\/sup>，对应 A₁/(x−a)+…+A_k/(x−a)<sup>k<\/sup>；\n<\/li><li>\n不可约二次因式 x²+px+q，对应 (Bx+C)/(x²+px+q)。\n<\/ul>\n<h3>3.3 求系数的两条路<\/h3>\n<ol><li>\n<strong>比较系数<\/strong>：通分后比较各次项系数，解线性方程组；\n<\/li><li>\n<strong>代特殊值<\/strong>：把 x 取成各因式的零点，能直接定出一部分系数，剩下的再比较。\n<\/ol>\n<h3>3.4 用途<\/h3>\n<p>拆开之后，每一项都容易积分、容易求和。原书用它处理级数求和，后面的微积分里用它做积分。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：部分分式像把一锅混合汤分成几小碗，每碗只含一种味道，便于单独处理。<\/p>\n<p><strong>失效边界<\/strong>：分母必须先分解到实数范围内的不可约因式；分解不彻底，拆出来的项也对不上。<\/p>\n<p><strong>实例<\/strong>：拆 1/[x(x+1)]。 设 1/[x(x+1)]=A/x+B/(x+1)，通分得 A(x+1)+Bx=1。 取 x=0 得 A=1；取 x=−1 得 B=−1。所以 1/[x(x+1)]=1/x−1/(x+1)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 任何分式都能直接拆成一次项之和 —— 实际上 分母含不可约二次因式时，对应项的分子是一次式 Bx+C，不是常数。\n<\/li><li>\n别以为 部分分式只用于化简 —— 实际上 它的主要用途是积分与级数求和：拆开后每一项都有现成公式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n分式 (x²+1)/(x−1) 属于：\n<\/li><li>\n分解 1/[(x−1)(x−2)] 时，应设为：\n<p>A. 真分式 ｜ B. 假分式 ｜ C. 整式 ｜ D. 无法判断 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：分子次数 2 不低于分母次数 1，是假分式，需先做除法。 A. A/(x−1)+B/(x−2) ｜ B. A/(x−1)+B/(x−2)+C ｜ C. (Ax+B)/(x−1)(x−2) ｜ D. A/[(x−1)(x−2)] <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：分母是两个不同的一次因式，各对应一个常数分子的一次分式。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n真分式：分子次数低于分母\n<\/li><li>\n不同一次因式 → 常数分子；重因式 → 逐次幂；二次因式 → 一次分子\n<\/li><li>\n求系数：比较系数或代零点\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：部分分式）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：部分分式<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>部分分式不是技巧，而是“把分母的每个因式各配一个分子”的必然形式。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>把真分式写成若干个简单分式之和，叫部分分式分解。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像把一个大分数拆成几个小分数的和：分母的每个因式各占一碗。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 真分式前提<\/h3>\n<div class=\"katex-block\">\\deg P<\\deg Q<\/div>\n<p>分子次数低于分母才能直接拆；否则先做多项式除法。<\/p>\n<h3>2. 一次因式<\/h3>\n<div class=\"katex-block\">\\frac{P(x)}{(x-a)(x-b)}=\\frac{A}{x-a}+\\frac{B}{x-b}<\/div>\n<p>每个不同的一次因式配一个常数分子。<\/p>\n<h3>3. 重因式<\/h3>\n<div class=\"katex-block\">\\frac{P(x)}{(x-a)^{2}}=\\frac{A}{x-a}+\\frac{B}{(x-a)^{2}}<\/div>\n<p>重因式要按 1 次到 k 次各写一项。<\/p>\n<h3>4. 二次因式<\/h3>\n<div class=\"katex-block\">\\frac{P(x)}{x^{2}+px+q}=\\frac{Bx+C}{x^{2}+px+q}<\/div>\n<p>不可约二次因式的分子要设为一次式。<\/p>\n<h3>5. 求系数<\/h3>\n<div class=\"katex-block\">\\frac{1}{x(x+1)}=\\frac{A}{x}+\\frac{B}{x+1}\\ \\Rightarrow\\ A(x+1)+Bx=1<\/div>\n<p>代 x=0 得 A=1，代 x=−1 得 B=−1。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>分母必须分解到不可约；否则设项时会漏掉中间形式，解出的系数不唯一。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《分式与根式》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch04": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">开方、绝对值<\/span><\/div><h1>第 4 章：根式与算术根<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：开方、绝对值\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n区分方根与算术根，正确使用 √(a²)=|a|\n<\/li><li>\n化简根式、做分母有理化\n<\/li><li>\n解根式方程并验根\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>根号表示非负的算术根；化简是把被开方数里的完全平方因子提出来，有理化是消掉分母里的根号。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>4.1 方根与算术根<\/h3>\n<p>x²=a（a&gt;0）有两个根 ±√a；其中非负的那个 √a 叫<strong>算术根<\/strong>。所以 √a 本身永远 ≥0。<\/p>\n<p>由此得到一条常用恒等式：<\/p>\n<p>√(a²)=|a|<\/p>\n<p>a≥0 时等于 a，a&lt;0 时等于 −a。写成 √(a²)=a 是错的。<\/p>\n<h3>4.2 根式的化简<\/h3>\n<p>把被开方数分解出完全平方因子：<\/p>\n<p>√72=√(36×2)=6√2<\/p>\n<p>分母里带根号时，分子分母同乘适当的式子把它消掉，叫<strong>分母有理化<\/strong>：<\/p>\n<p>1/√2=√2/2；1/(√3+√2)=√3−√2<\/p>\n<p>第二条用的是平方差 (√3+√2)(√3−√2)=1。<\/p>\n<h3>4.3 根式的运算<\/h3>\n<p>同次根式可以直接相乘除；不同次要先化成同次。加减只有在根号内部分完全相同时才能合并，如 2√3+5√3=7√3。<\/p>\n<h3>4.4 根式方程<\/h3>\n<p>把根号项单独放一边，两边平方，解出后<strong>必须验根<\/strong>：平方会把负值变成正值，可能引入不满足原式的解。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：根号像“长度的量尺”，量出来永远是非负的；平方再开方，得到的是距离，不是原数的符号。<\/p>\n<p><strong>失效边界<\/strong>：√(a²)=|a| 只对实数成立；在复数范围内开方是多值的，规则不同。<\/p>\n<p><strong>实例<\/strong>：化简 √(x²−6x+9)。 被开方数是 (x−3)²，所以原式 = |x−3|。当 x≥3 时为 x−3，当 x&lt;3 时为 3−x。 若直接写成 x−3，就在 x&lt;3 时算错了。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 √(a²)=a —— 实际上 等于 |a|。a 为负时结果是 −a，因为算术根必须非负。\n<\/li><li>\n别以为 √a+√b=√(a+b) —— 实际上 不成立。取 a=b=1：左边 2，右边 √2。根式不能这样合并。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n化简 √(x²−4x+4) 的结果是：\n<\/li><li>\n把 1/(√5−2) 分母有理化的结果是：\n<p>A. x−2 ｜ B. |x−2| ｜ C. 2−x ｜ D. x+2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：被开方数是 (x−2)²，开方得绝对值 |x−2|，符号随 x 变化。 A. √5+2 ｜ B. (√5+2)/9 ｜ C. √5−2 ｜ D. (√5−2)/9 <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：分子分母同乘 (√5+2)：分母 (√5)²−2²=5−4=1，所以结果为 √5+2。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n√a≥0；√(a²)=|a|\n<\/li><li>\n化简：提出完全平方因子；有理化：用平方差消分母根号\n<\/li><li>\n根式方程平方后必须验根\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 4 章：根式与算术根）<\/summary><div class=\"depth-body\"><h1>第 04 章 · 从零推导：根式与算术根<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>根号的麻烦全在一个字上：符号。算术根规定非负，于是开方之后要补绝对值。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>若 x<sup>n<\/sup>=a，则 x 为 a 的 n 次方根；其中非负的那个叫算术根 √[n]a。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>根号像量长度：不管从哪边量，读数都是正的；要找回原来的方向，得另外看符号。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 算术根非负<\/h3>\n<div class=\"katex-block\">\\sqrt{a}\\ge 0\\quad(a\\ge 0)<\/div>\n<p>算术根按定义取非负值，这是后面所有化简的前提。<\/p>\n<h3>2. 平方再开方<\/h3>\n<div class=\"katex-block\">\\sqrt{a^{2}}=|a|=\\begin{cases}a, & a\\ge 0\\\\ -a, & a<0\\end{cases}<\/div>\n<p>开方只取非负值，所以负号要由绝对值补回来。<\/p>\n<h3>3. 化简<\/h3>\n<div class=\"katex-block\">\\sqrt{72}=\\sqrt{36\\cdot 2}=6\\sqrt{2}<\/div>\n<p>把完全平方因子提到根号外。<\/p>\n<h3>4. 有理化<\/h3>\n<div class=\"katex-block\">\\frac{1}{\\sqrt{3}+\\sqrt{2}}=\\sqrt{3}-\\sqrt{2}<\/div>\n<p>分子分母同乘 (√3−√2)，用平方差把分母变成整数。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>偶次根号下必须非负；奇次根号对被开方数没有符号限制。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《分式与根式》第 04 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：有理分式的概念与运算<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：分式方程与同解原理<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：根式与算术根<\/a><\/span><\/div><h1>定义域与增根<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch01、ch02、ch04\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每一步变形都要问：原来不允许的取值，有没有被这一步偷偷放进来。<\/p>\n<h2>为什么重要<\/h2>\n<p>分式与根式的错误大多不是算错，而是忘了定义域；抓住这条，出错率会明显下降。<\/p>\n<h2>详解<\/h2>\n<p>分式要求分母非零，偶次根式要求被开方数非负。去分母、平方这些变形会扩大定义域，因此解完必须回到原式筛一遍。筛的标准只有两条：原式是否有意义、代回是否相等。<\/p>\n<h2>常见误解<\/h2>\n<p>以为“验根”是可省略的步骤。对含未知数的去分母或平方，验根是解法的一部分。<\/p>\n<h2>相关概念<\/h2>\n<p>分式方程（ch02）、根式方程（ch04）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-04-分式与根式 周锦辉 黄久征 孔馨逸.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：部分分式<\/a><\/span><\/div><h1>部分分式分解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>按分母的因式类型配分子，把真分式拆成简单项之和。<\/p>\n<h2>为什么重要<\/h2>\n<p>拆开之后每一项都能单独处理，是积分与级数求和的标准前置动作。<\/p>\n<h2>详解<\/h2>\n<p>三种类型对应三种设法：不同一次因式配常数；重因式按幂次逐项配；不可约二次因式配一次式。系数用比较系数或代零点求。<\/p>\n<h2>常见误解<\/h2>\n<p>把不可约二次因式也配常数分子，会解不出系数或得到错误分解。<\/p>\n<h2>相关概念<\/h2>\n<p>待定系数法（《整式》ch04）、积分（《微积分初步》）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：有理分式的概念与运算<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：有理分式的概念与运算<\/a><br>检查点：能把复杂分式化为最简分式<\/li><li class='path-step' id='path-02'><strong>步骤 02：分式方程与同解原理<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：分式方程与同解原理<\/a><br>检查点：能解分式方程并说明增根来自哪里<\/li><li class='path-step' id='path-03'><strong>步骤 03：部分分式<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：部分分式<\/a><br>检查点：能把真分式拆成简单分式之和<\/li><li class='path-step' id='path-04'><strong>步骤 04：根式与算术根<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：根式与算术根<\/a><br>检查点：能化简根式并做分母有理化<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q09' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q9.<\/b> 方程 (x²−1)/(x−1)=2 的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> x=1<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> x=−1<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 无解<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> x=±1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q10.<\/b> 化简 √12+√27−√3 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 4√3<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 6√3<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 2√3<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> √3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：有理分式的概念与运算<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 分式 1/(x²−9) 有意义的条件是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> x≠3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> x≠−3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> x≠±3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> x≠0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 化简 (x²−1)/(x²+x) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> (x−1)/x<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> x−1<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 1/x<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> (x+1)/x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：分式方程与同解原理<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 解分式方程产生增根的根本原因是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 计算失误<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 去分母时乘了含未知数的式子<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 方程次数变高<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 没有通分<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 方程 1/(x−2)=0 的解的情况是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> x=2<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 无解<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> x=0<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 任意实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：部分分式<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 分式 (x²+1)/(x−1) 属于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 真分式<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 假分式<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 整式<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 分解 1/[(x−1)(x−2)] 时，应设为：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> A/(x−1)+B/(x−2)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> A/(x−1)+B/(x−2)+C<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> (Ax+B)/(x−1)(x−2)<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> A/[(x−1)(x−2)]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：根式与算术根<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c01' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 化简 √(x²−4x+4) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> x−2<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> |x−2|<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 2−x<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> x+2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c01' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 把 1/(√5−2) 分母有理化的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> √5+2<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> (√5+2)/9<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> √5−2<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> (√5−2)/9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='有理分式'>有理分式 — 两个整式的商 A/B，B 含字母且不为零。 <span class=glossary-ref>（第 1 章：有理分式的概念与运算）<\/span><\/li><li data-term='约分'>约分 — 约去分子分母的公因式。 <span class=glossary-ref>（第 1 章：有理分式的概念与运算）<\/span><\/li><li data-term='最简公分母'>最简公分母 — 各分母所有因式最高次幂的乘积。 <span class=glossary-ref>（第 1 章：有理分式的概念与运算）<\/span><\/li><li data-term='增根'>增根 — 变形后产生但不满足原方程的解。 <span class=glossary-ref>（第 2 章：分式方程与同解原理）<\/span><\/li><li data-term='真分式'>真分式 — 分子次数低于分母次数的分式。 <span class=glossary-ref>（第 3 章：部分分式）<\/span><\/li><li data-term='部分分式'>部分分式 — 把真分式拆成的若干简单分式。 <span class=glossary-ref>（第 3 章：部分分式）<\/span><\/li><li data-term='算术根'>算术根 — 非负的 n 次方根。 <span class=glossary-ref>（第 4 章：根式与算术根）<\/span><\/li><li data-term='分母有理化'>分母有理化 — 通过乘共轭式消去分母中的根号。 <span class=glossary-ref>（第 4 章：根式与算术根）<\/span><\/li><li data-term='共轭式'>共轭式 — √a+√b 与 √a−√b 互为共轭，乘积为 a−b。 <span class=glossary-ref>（第 4 章：根式与算术根）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：含分母/根号的四步<\/h2>\n<p>① 写下定义域限制；② 选变形（通分、去分母、有理化、平方）；③ 解出候选解；④ 用定义域与原式筛掉增根。<\/p>\n<h2>框架：拆分的三种模板<\/h2>\n<p>一次因式配常数、重因式按幂配、二次因式配一次式。模板先定，系数后求。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>分式有意义<\/td><td>分母 ≠ 0<\/td><\/tr><tr><td>基本性质<\/td><td>A/B = AC/BC（C≠0）<\/td><\/tr><tr><td>分式方程<\/td><td>去分母 → 解 → 验根<\/td><\/tr><tr><td>部分分式<\/td><td>一次配常数、重因式按幂、二次配一次式<\/td><\/tr><tr><td>算术根<\/td><td>√a ≥ 0；√(a²)=<\/td><td>a<\/td><td><\/td><\/tr><tr><td>有理化<\/td><td>1/(√a+√b)=(√a−√b)/(a−b)<\/td><\/tr><tr><td>根式方程<\/td><td>孤立根号 → 平方 → 验根<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

let networkLoaded = false;
function loadVisNetwork(cb){

    const s = document.createElement('script');

function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库加载失败，请联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];

    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,

      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,

            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }

    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);

  });
