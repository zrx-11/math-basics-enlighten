<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>复数</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/picocss/2.0.6/dist/css/pico.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
sup{font-size:.72em;line-height:0;vertical-align:super}
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>复数</h1>
    <div class="sub">平方根不够用的时候：数系的扩张与复数的几何</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>
<script>
const DATA = {"manifest": {"slug": "complex-numbers", "title": "复数", "subtitle": "平方根不够用的时候：数系的扩张与复数的几何", "book": {"title": "复数", "author": "陈利国", "source": ["数学基础知识丛书-10-复数 陈利国.pdf"]}, "audience": "零基础", "goal": "理解数系扩张的动因，掌握复数的四则运算、共轭与模，理解复数的几何意义与三角形式，会用棣莫弗定理求乘方与开方。", "learningPath": [{"step": "01", "title": "数系扩张与复数概念", "chapterIds": ["ch01"], "checkpoint": "能说明为什么需要虚数单位"}, {"step": "02", "title": "复数的运算与几何意义", "chapterIds": ["ch02"], "checkpoint": "能用共轭做除法并解释模"}, {"step": "03", "title": "三角形式与乘方开方", "chapterIds": ["ch03"], "checkpoint": "能用棣莫弗定理开方并画图"}], "chapters": [{"id": "ch01", "title": "第 1 章：数系扩张与复数概念", "file": "chapters/ch01-concept.md", "difficulty": 2, "source": {"file": "数学基础知识丛书-10-复数 陈利国.pdf", "kind": "原书 PDF"}, "prereqNote": "实数、一元二次方程", "depthFragment": "chapters/ch01-depth.md", "prerequisites": []}, {"id": "ch02", "title": "第 2 章：复数的运算与几何意义", "file": "chapters/ch02-operations-geometry.md", "difficulty": 3, "source": {"file": "数学基础知识丛书-10-复数 陈利国.pdf", "kind": "原书 PDF"}, "prereqNote": "", "depthFragment": "chapters/ch02-depth.md", "prerequisites": ["ch01"]}, {"id": "ch03", "title": "第 3 章：三角形式与乘方开方", "file": "chapters/ch03-trig-polar.md", "difficulty": 3, "source": {"file": "数学基础知识丛书-10-复数 陈利国.pdf", "kind": "原书 PDF"}, "prereqNote": "三角函数", "depthFragment": "chapters/ch03-depth.md", "prerequisites": ["ch02"]}], "concepts": [{"id": "c01", "title": "数系扩张", "file": "concepts/c01-number-system-extension.md", "chapterIds": ["ch01"], "source": {"file": "数学基础知识丛书-10-复数 陈利国.pdf", "kind": "原书 PDF"}, "prerequisites": ["ch01"]}, {"id": "c02", "title": "模与辐角", "file": "concepts/c02-modulus-argument.md", "chapterIds": ["ch02", "ch03"], "source": {"file": "数学基础知识丛书-10-复数 陈利国.pdf", "kind": "原书 PDF"}, "prerequisites": ["ch02", "ch03"]}], "glossary": [{"term": "虚数单位", "def": "满足 i²=−1 的数 i。", "chapterId": "ch01"}, {"term": "复数", "def": "形如 a+bi 的数，a、b 为实数。", "chapterId": "ch01"}, {"term": "实部与虚部", "def": "复数 a+bi 中的 a 与 b。", "chapterId": "ch01"}, {"term": "共轭复数", "def": "实部相同、虚部相反的复数。", "chapterId": "ch02"}, {"term": "模", "def": "复数到原点的距离 √(a²+b²)。", "chapterId": "ch02"}, {"term": "复平面", "def": "横轴实轴、纵轴虚轴的坐标平面。", "chapterId": "ch02"}, {"term": "辐角", "def": "复数向量与实轴正方向的夹角。", "chapterId": "ch03"}, {"term": "三角形式", "def": "z=r(cosθ+i sinθ)。", "chapterId": "ch03"}, {"term": "棣莫弗定理", "def": "乘方公式 [r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)。", "chapterId": "ch03"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "复数 z=2−3i 的实部与虚部分别是：", "options": ["2 和 3", "2 和 −3", "−3 和 2", "3 和 2"], "answer": 1, "explain": "z=a+bi 中 a=2，b=−3（虚部是 b 本身，含符号）。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "i³ 的值是：", "options": ["i", "−i", "1", "−1"], "answer": 1, "explain": "i³=i²·i=−1·i=−i。", "relatedConceptId": "c01", "prerequisites": ["ch01"]}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "(2+i)(1−i) 的结果是：", "options": ["3−i", "3+i", "1−i", "1+i"], "answer": 0, "explain": "2−2i+i−i²=2−i+1=3−i。", "relatedConceptId": "c02", "prerequisites": ["ch02"]}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "复数 z=3+4i 的模是：", "options": ["7", "5", "25", "1"], "answer": 1, "explain": "|z|=√(9+16)=5。", "relatedConceptId": "c02", "prerequisites": ["ch02"]}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "复数 z=1+i 的模与辐角（主值）分别是：", "options": ["√2 和 45°", "2 和 45°", "√2 和 135°", "1 和 90°"], "answer": 0, "explain": "r=√(1+1)=√2，cosθ=1/√2，故 θ=45°。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "用棣莫弗定理计算 (1+i)⁴，结果是：", "options": ["4", "−4", "4i", "−4i"], "answer": 1, "explain": "模 √2 的四次方为 4，角 45°×4=180°，故结果为 4(cos180°+i sin180°)=−4。", "relatedConceptId": "c02", "prerequisites": ["ch03"]}, {"id": "q07", "chapterId": "__all__", "type": "single", "question": "复数 (1+i)/(1−i) 的值是：", "options": ["i", "−i", "1", "−1"], "answer": 0, "explain": "分子分母同乘 (1+i)：(1+i)²/(1+1)=(2i)/2=i。", "relatedConceptId": "", "prerequisites": ["__all__"]}, {"id": "q08", "chapterId": "__all__", "type": "single", "question": "方程 x²+4=0 在复数范围内的解是：", "options": ["x=2", "x=±2i", "x=±2", "无解"], "answer": 1, "explain": "x²=−4，故 x=±2i。", "relatedConceptId": "", "prerequisites": ["__all__"]}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "「第 1 章：数系扩张与复数概念」的一句话核心是什么？", "back": "引入 i 的唯一理由：让 x²+1=0 有解；复数就是 a+bi 的形式。", "tags": ["complex-numbers", "核心"]}, {"id": "f02", "chapterId": "ch02", "front": "「第 2 章：复数的运算与几何意义」的一句话核心是什么？", "back": "加减是向量平移，乘法是“模相乘、角相加”；除法靠共轭把分母变成实数。", "tags": ["complex-numbers", "核心"]}, {"id": "f03", "chapterId": "ch03", "front": "「第 3 章：三角形式与乘方开方」的一句话核心是什么？", "back": "写成 z=r(cosθ+i sinθ) 之后，乘除变成模的乘除与角的加减，乘方开方就是角的倍数与等分。", "tags": ["complex-numbers", "核心"]}, {"id": "f04", "chapterId": "ch01", "front": "什么是「虚数单位」？", "back": "满足 i²=−1 的数 i。", "tags": ["complex-numbers", "术语"]}, {"id": "f05", "chapterId": "ch01", "front": "什么是「复数」？", "back": "形如 a+bi 的数，a、b 为实数。", "tags": ["complex-numbers", "术语"]}, {"id": "f06", "chapterId": "ch01", "front": "什么是「实部与虚部」？", "back": "复数 a+bi 中的 a 与 b。", "tags": ["complex-numbers", "术语"]}, {"id": "f07", "chapterId": "ch02", "front": "什么是「共轭复数」？", "back": "实部相同、虚部相反的复数。", "tags": ["complex-numbers", "术语"]}, {"id": "f08", "chapterId": "ch02", "front": "什么是「模」？", "back": "复数到原点的距离 √(a²+b²)。", "tags": ["complex-numbers", "术语"]}, {"id": "f09", "chapterId": "ch02", "front": "什么是「复平面」？", "back": "横轴实轴、纵轴虚轴的坐标平面。", "tags": ["complex-numbers", "术语"]}, {"id": "f10", "chapterId": "ch03", "front": "什么是「辐角」？", "back": "复数向量与实轴正方向的夹角。", "tags": ["complex-numbers", "术语"]}, {"id": "f11", "chapterId": "ch03", "front": "什么是「三角形式」？", "back": "z=r(cosθ+i sinθ)。", "tags": ["complex-numbers", "术语"]}, {"id": "f12", "chapterId": "ch03", "front": "什么是「棣莫弗定理」？", "back": "乘方公式 [r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)。", "tags": ["complex-numbers", "术语"]}], "companion": "complex-numbers学习伴侣.html", "deriv": "complex-numbers从零推导.html"}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">实数、一元二次方程<\/span><\/div><h1>第 1 章：数系扩张与复数概念<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：实数、一元二次方程\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说明数系扩张的动因\n<\/li><li>\n写出复数的实部、虚部并判断相等\n<\/li><li>\n计算 i 的整数次幂\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>引入 i 的唯一理由：让 x²+1=0 有解；复数就是 a+bi 的形式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 为什么还要扩数系<\/h3>\n<p>自然数 → 整数（减法不够用）→ 有理数（除法不够用）→ 实数（开方不够用）→ 复数（负数开平方不够用）。<\/p>\n<p>每一步扩张都是为了“让原来无解的问题有解”，同时尽量保留原有运算律。<\/p>\n<h3>1.2 虚数单位与复数<\/h3>\n<p>规定 i²=−1，i 叫<strong>虚数单位<\/strong>。形如 z=a+bi（a、b 为实数）的数叫<strong>复数<\/strong>，a 是实部，b 是虚部。<\/p>\n<ul><li>\nb=0：z 是实数；\n<\/li><li>\na=0 且 b≠0：z 是纯虚数。\n<\/ul>\n<p>两个复数相等 ⇔ 实部相等且虚部相等。注意：复数之间<strong>不能比大小<\/strong>，“3+2i 与 1+i 谁大”没有意义。<\/p>\n<h3>1.3 i 的幂有周期<\/h3>\n<p>i¹=i，i²=−1，i³=−i，i⁴=1，之后每 4 次循环。计算 iⁿ 时把 n 除以 4 看余数即可。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：数系扩张像给工具箱添工具：不是原来的工具坏了，而是遇到了新活儿。<\/p>\n<p><strong>失效边界<\/strong>：复数没有大小顺序，涉及不等式的问题不能直接搬过来。<\/p>\n<p><strong>实例<\/strong>：i²⁰²⁵：2025÷4 余 1，故 i²⁰²⁵=i。 若 (x−1)+(y+2)i=3+5i，则 x−1=3、y+2=5，得 x=4、y=3。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 i 是一个很小的实数 —— 实际上 i 不是实数，它的平方等于 −1，实数里没有这样的数。\n<\/li><li>\n别以为 复数可以像实数一样比大小 —— 实际上 复数没有序关系；只有模（长度）可以比较。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n复数 z=2−3i 的实部与虚部分别是：\n<\/li><li>\ni³ 的值是：\n<p>A. 2 和 3 ｜ B. 2 和 −3 ｜ C. −3 和 2 ｜ D. 3 和 2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：z=a+bi 中 a=2，b=−3（虚部是 b 本身，含符号）。 A. i ｜ B. −i ｜ C. 1 ｜ D. −1 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：i³=i²·i=−1·i=−i。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ni²=−1；复数 z=a+bi\n<\/li><li>\n相等 ⇔ 实部、虚部分别相等\n<\/li><li>\n复数不能比大小；i 的幂以 4 为周期\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：数系扩张与复数概念）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：数系扩张与复数概念<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>虚数不是凭空发明，而是“让 x²=−1 有解”的必然结果。承认 i²=−1，整套代数就能自洽。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>形如 a+bi（a、b∈R）的数叫复数，i 为虚数单位且 i²=−1。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像给平面加一条新轴：原来只能左右走，现在还能上下走。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 虚数单位<\/h3>\n<div class=\"katex-block\">i^{2}=-1<\/div>\n<p>这是定义，不是推导出来的；一切复数运算都建立在它上面。<\/p>\n<h3>2. 复数形式<\/h3>\n<div class=\"katex-block\">z=a+bi\\quad(a,b\\in\\mathbb{R})<\/div>\n<p>a 为实部，b 为虚部，两者都是实数。<\/p>\n<h3>3. 相等条件<\/h3>\n<div class=\"katex-block\">a+bi=c+di\\iff a=c\\ \\text{且}\\ b=d<\/div>\n<p>实部与虚部分别相等，缺一不可。<\/p>\n<h3>4. i 的周期<\/h3>\n<div class=\"katex-block\">i^{n}=i^{n\\bmod 4}<\/div>\n<p>四个一循环，算高次幂先取余数。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>复数不能定义大小顺序；比较只能比较模，不能比较“谁大”。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《复数》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 1 章：数系扩张与复数概念"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：数系扩张与复数概念<\/a><\/span><\/div><h1>第 2 章：复数的运算与几何意义<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n完成复数四则运算\n<\/li><li>\n用共轭把分母实数化\n<\/li><li>\n把复数对应到复平面上的点与向量\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>加减是向量平移，乘法是“模相乘、角相加”；除法靠共轭把分母变成实数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 加减与乘<\/h3>\n<p>(a+bi)±(c+di)=(a±c)+(b±d)i。<\/p>\n<p>乘法按多项式展开，最后用 i²=−1 化简：<\/p>\n<p>(a+bi)(c+di)=ac+bdi²+adi+bci=(ac−bd)+(ad+bc)i。<\/p>\n<h3>2.2 共轭与除法<\/h3>\n<p>z=a+bi 的共轭是 z̄=a−bi。两者相乘：<\/p>\n<p>z·z̄=a²+b²（实数）<\/p>\n<p>所以除法时分子分母同乘分母的共轭，把分母变成实数：<\/p>\n<p>(a+bi)/(c+di)=(a+bi)(c−di)/(c²+d²)。<\/p>\n<h3>2.3 模<\/h3>\n<p>|z|=√(a²+b²)，几何上是复数对应点到原点的距离。有 |z₁z₂|=|z₁||z₂|，|z₁/z₂|=|z₁|/|z₂|。<\/p>\n<h3>2.4 复平面<\/h3>\n<p>把 z=a+bi 对应到点 (a,b)，就得到<strong>复平面<\/strong>：横轴为实轴，纵轴为虚轴。<\/p>\n<ul><li>\n加法对应向量相加（平行四边形法则）；\n<\/li><li>\n乘以 i 相当于逆时针旋转 90°；\n<\/li><li>\n|z| 是向量长度，辐角 θ 是它与实轴正方向的夹角。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：复数加法像两个人合力推箱子，乘法像“先伸长再转个角度”。<\/p>\n<p><strong>失效边界<\/strong>：几何解释只在复平面上成立；纯代数的运算律仍按多项式规则走。<\/p>\n<p><strong>实例<\/strong>：(1+2i)(3−i)=3−i+6i−2i²=3+5i+2=5+5i。 1/(1+i)=(1−i)/[(1+i)(1−i)]=(1−i)/2=1/2−1/2 i。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 分母有 i 就不能算 —— 实际上 同乘共轭即可把分母变成实数，方法同根式的分母有理化。\n<\/li><li>\n别以为 |z| 就是 z 本身去掉符号 —— 实际上 模是长度 √(a²+b²)，与实数的绝对值含义相通但算法不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n(2+i)(1−i) 的结果是：\n<\/li><li>\n复数 z=3+4i 的模是：\n<p>A. 3−i ｜ B. 3+i ｜ C. 1−i ｜ D. 1+i <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：2−2i+i−i²=2−i+1=3−i。 A. 7 ｜ B. 5 ｜ C. 25 ｜ D. 1 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：|z|=√(9+16)=5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n加减分实虚部；乘法展开后用 i²=−1\n<\/li><li>\n除法同乘共轭，分母变实数\n<\/li><li>\n模＝到原点的距离；乘 i 是转 90°\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：复数的运算与几何意义）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：复数的运算与几何意义<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>复数运算不用背新规则：把 i 当字母展开，最后把 i² 换成 −1 即可。除法多一步——乘共轭。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>共轭复数指实部相同、虚部相反的两个复数；模是复平面上到原点的距离。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>共轭像照镜子：虚部翻个号，两者相乘就把“方向”消掉，只剩长度。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 乘法<\/h3>\n<div class=\"katex-block\">(a+bi)(c+di)=(ac-bd)+(ad+bc)i<\/div>\n<p>按分配律展开，把 i² 换成 −1 合并同类项。<\/p>\n<h3>2. 共轭乘积<\/h3>\n<div class=\"katex-block\">z\\bar{z}=a^{2}+b^{2}=|z|^{2}<\/div>\n<p>虚部相互抵消，结果是非负实数，正好是模的平方。<\/p>\n<h3>3. 除法<\/h3>\n<div class=\"katex-block\">\\frac{a+bi}{c+di}=\\frac{(a+bi)(c-di)}{c^{2}+d^{2}}<\/div>\n<p>分子分母同乘共轭，分母变成实数。<\/p>\n<h3>4. 模<\/h3>\n<div class=\"katex-block\">|z|=\\sqrt{a^{2}+b^{2}}<\/div>\n<p>复平面上点到原点的距离，勾股定理直接给出。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>共轭只对虚部取反，实部不动；模必须是非负实数。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《复数》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 2 章：复数的运算与几何意义"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：复数的运算与几何意义<\/a><\/span><\/div><h1>第 3 章：三角形式与乘方开方<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、三角函数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把复数化成三角形式\n<\/li><li>\n用“模乘角加”做乘法与除法\n<\/li><li>\n用棣莫弗定理求乘方与 n 次方根\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>写成 z=r(cosθ+i sinθ) 之后，乘除变成模的乘除与角的加减，乘方开方就是角的倍数与等分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 三角形式<\/h3>\n<p>设 z=a+bi，r=|z|=√(a²+b²)，θ 为辐角（与实轴正方向的夹角），则<\/p>\n<p>z=r(cosθ+i sinθ)<\/p>\n<p>其中 cosθ=a/r，sinθ=b/r。θ 不唯一，相差 2kπ 都表示同一个复数，通常取 [0,2π) 内的主值。<\/p>\n<h3>3.2 乘除的几何算法<\/h3>\n<p>z₁z₂=r₁r₂[cos(θ₁+θ₂)+i sin(θ₁+θ₂)] z₁/z₂=(r₁/r₂)[cos(θ₁−θ₂)+i sin(θ₁−θ₂)]<\/p>\n<p>即<strong>模相乘、角相加<\/strong>；除法是模相除、角相减。这也解释了“乘 i 就是转 90°”。<\/p>\n<h3>3.3 棣莫弗定理<\/h3>\n<p>[r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)<\/p>\n<p>乘方就是模取 n 次幂、角乘 n。<\/p>\n<h3>3.4 开方<\/h3>\n<p>z 的 n 次方根有 n 个，均匀分布在以原点为圆心、半径 ⁿ√r 的圆上：<\/p>\n<p>w_k=ⁿ√r[cos((θ+2kπ)/n)+i sin((θ+2kπ)/n)]，k=0,1,…,n−1<\/p>\n<p>这解释了“任何数在复数范围内都有 n 个 n 次方根”，也解释了为什么 x³=1 有三个解（1 和两个复数根）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：三角形式像给向量装了“长度＋方向”的刻度盘，乘法就是两个刻度盘叠起来转。<\/p>\n<p><strong>失效边界<\/strong>：辐角要统一单位（弧度或度），加减时混用会出错。<\/p>\n<p><strong>实例<\/strong>：1+i=√2(cos45°+i sin45°)。它的平方：(√2)²(cos90°+i sin90°)=2i。 x³=1 的根：1，−1/2+√3/2 i，−1/2−√3/2 i，三点在单位圆上均匀分布。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 开方只有一个根 —— 实际上 复数范围内 n 次方根有 n 个，均匀分布在圆上。\n<\/li><li>\n别以为 辐角只有一个值 —— 实际上 辐角相差 2kπ 都表示同一复数；写三角形式要说明取哪个范围。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n复数 z=1+i 的模与辐角（主值）分别是：\n<\/li><li>\n用棣莫弗定理计算 (1+i)⁴，结果是：\n<p>A. √2 和 45° ｜ B. 2 和 45° ｜ C. √2 和 135° ｜ D. 1 和 90° <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：r=√(1+1)=√2，cosθ=1/√2，故 θ=45°。 A. 4 ｜ B. −4 ｜ C. 4i ｜ D. −4i <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：模 √2 的四次方为 4，角 45°×4=180°，故结果为 4(cos180°+i sin180°)=−4。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三角形式 z=r(cosθ+i sinθ)\n<\/li><li>\n乘法：模乘角加；除法：模除角减\n<\/li><li>\n棣莫弗：乘方＝模取幂、角乘 n；开方＝n 个均匀根\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：三角形式与乘方开方）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：三角形式与乘方开方<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>把复数看成“长度+角度”，乘法就变成两件简单事的组合：长度相乘、角度相加。全部公式由此而来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>三角形式指 z=r(cosθ+i sinθ)，r 为模，θ 为辐角。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像钟表的指针：长度是针长，角度是指向；两根针相乘，就是把角度叠起来转。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 三角形式<\/h3>\n<div class=\"katex-block\">z=r(\\cos\\theta+i\\sin\\theta),\\quad r=|z|<\/div>\n<p>把点写成“长度＋角度”，几何意义一目了然。<\/p>\n<h3>2. 乘法<\/h3>\n<div class=\"katex-block\">z_{1}z_{2}=r_{1}r_{2}[\\cos(\\theta_{1}+\\theta_{2})+i\\sin(\\theta_{1}+\\theta_{2})]<\/div>\n<p>模相乘、角相加，这是旋转的代数表达。<\/p>\n<h3>3. 棣莫弗<\/h3>\n<div class=\"katex-block\">[r(\\cos\\theta+i\\sin\\theta)]^{n}=r^{n}(\\cos n\\theta+i\\sin n\\theta)<\/div>\n<p>乘方就是模取 n 次幂、角乘 n。<\/p>\n<h3>4. 开方<\/h3>\n<div class=\"katex-block\">w_{k}=\\sqrt[n]{r}\\left[\\cos\\frac{\\theta+2k\\pi}{n}+i\\sin\\frac{\\theta+2k\\pi}{n}\\right]<\/div>\n<p>k 取 0 到 n−1，得到均匀分布在圆上的 n 个根。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>θ 必须与三角函数的单位一致；开方时要写出全部 n 个根，不能只写主值。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《复数》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "kind": "chapter", "title": "第 3 章：三角形式与乘方开方"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：数系扩张与复数概念<\/a><\/span><\/div><h1>数系扩张<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每次“不够用”就扩一次数系，同时保留原有运算律。<\/p>\n<h2>为什么重要<\/h2>\n<p>理解扩张的动因，才不会把复数当成硬背的记号。<\/p>\n<h2>详解<\/h2>\n<p>自然数→整数（减法封闭）→有理数（除法封闭）→实数（极限与开方）→复数（负数开方）。每步都解决一类无解问题，代价是失去某些性质（如复数失去大小顺序）。<\/p>\n<h2>常见误解<\/h2>\n<p>以为复数只是数学家的游戏；它在电学、信号处理、几何里都是标准工具。<\/p>\n<h2>相关概念<\/h2>\n<p>虚数单位（ch01）、复平面（ch02）<\/p>", "kind": "concept", "title": "数系扩张"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：复数的运算与几何意义<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：三角形式与乘方开方<\/a><\/span><\/div><h1>模与辐角<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>模是长度，辐角是方向；乘除看模与角，乘方开方看倍数与等分。<\/p>\n<h2>为什么重要<\/h2>\n<p>三角形式把复数运算翻译成几何动作，是求乘方开方的最快路径。<\/p>\n<h2>详解<\/h2>\n<p>|z|=√(a²+b²)，θ 由 cosθ=a/|z|、sinθ=b/|z| 确定。乘法模相乘角相加，除法模相除角相减；棣莫弗定理把乘方变成“模取幂、角乘 n”，开方则是把角 n 等分。<\/p>\n<h2>常见误解<\/h2>\n<p>只记公式不看几何，遇到开方漏根、遇到辐角范围出错。<\/p>\n<h2>相关概念<\/h2>\n<p>三角形式（ch03）、棣莫弗定理（ch03）<\/p>", "kind": "concept", "title": "模与辐角"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数系扩张与复数概念<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：数系扩张与复数概念<\/a><br>检查点：能说明为什么需要虚数单位<\/li><li class='path-step' id='path-02'><strong>步骤 02：复数的运算与几何意义<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：复数的运算与几何意义<\/a><br>检查点：能用共轭做除法并解释模<\/li><li class='path-step' id='path-03'><strong>步骤 03：三角形式与乘方开方<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：三角形式与乘方开方<\/a><br>检查点：能用棣莫弗定理开方并画图<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q07' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q7.<\/b> 复数 (1+i)/(1−i) 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> i<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> −i<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> −1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q8.<\/b> 方程 x²+4=0 在复数范围内的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> x=2<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> x=±2i<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> x=±2<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 无解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：数系扩张与复数概念<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 复数 z=2−3i 的实部与虚部分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 2 和 3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 2 和 −3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> −3 和 2<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 3 和 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> i³ 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> i<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> −i<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> −1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：复数的运算与几何意义<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> (2+i)(1−i) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 3−i<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 3+i<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 1−i<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 1+i<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 复数 z=3+4i 的模是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 7<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 25<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：三角形式与乘方开方<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 复数 z=1+i 的模与辐角（主值）分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> √2 和 45°<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 2 和 45°<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> √2 和 135°<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 1 和 90°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 用棣莫弗定理计算 (1+i)⁴，结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> −4<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 4i<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> −4i<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='虚数单位'>虚数单位 — 满足 i²=−1 的数 i。 <span class=glossary-ref>（第 1 章：数系扩张与复数概念）<\/span><\/li><li data-term='复数'>复数 — 形如 a+bi 的数，a、b 为实数。 <span class=glossary-ref>（第 1 章：数系扩张与复数概念）<\/span><\/li><li data-term='实部与虚部'>实部与虚部 — 复数 a+bi 中的 a 与 b。 <span class=glossary-ref>（第 1 章：数系扩张与复数概念）<\/span><\/li><li data-term='共轭复数'>共轭复数 — 实部相同、虚部相反的复数。 <span class=glossary-ref>（第 2 章：复数的运算与几何意义）<\/span><\/li><li data-term='模'>模 — 复数到原点的距离 √(a²+b²)。 <span class=glossary-ref>（第 2 章：复数的运算与几何意义）<\/span><\/li><li data-term='复平面'>复平面 — 横轴实轴、纵轴虚轴的坐标平面。 <span class=glossary-ref>（第 2 章：复数的运算与几何意义）<\/span><\/li><li data-term='辐角'>辐角 — 复数向量与实轴正方向的夹角。 <span class=glossary-ref>（第 3 章：三角形式与乘方开方）<\/span><\/li><li data-term='三角形式'>三角形式 — z=r(cosθ+i sinθ)。 <span class=glossary-ref>（第 3 章：三角形式与乘方开方）<\/span><\/li><li data-term='棣莫弗定理'>棣莫弗定理 — 乘方公式 [r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)。 <span class=glossary-ref>（第 3 章：三角形式与乘方开方）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：复数运算三选一<\/h2>\n<p>加减直接分实虚部；乘除优先用代数形式（除法乘共轭）；乘方开方换三角形式。<\/p>\n<h2>框架：几何翻译<\/h2>\n<p>看到“旋转 90°”想乘 i；看到“长度为 1”想 |z|=1；看到“正三角形”想三个根均匀分布。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>i 的幂<\/td><td>i¹=i，i²=−1，i³=−i，i⁴=1，周期 4<\/td><\/tr><tr><td>乘法<\/td><td>(a+bi)(c+di)=(ac−bd)+(ad+bc)i<\/td><\/tr><tr><td>除法<\/td><td>(a+bi)/(c+di)=(a+bi)(c−di)/(c²+d²)<\/td><\/tr><tr><td>模<\/td><td><\/td><td>z<\/td><td>=√(a²+b²)；z·z̄=<\/td><td>z<\/td><td>²<\/td><\/tr><tr><td>三角形式<\/td><td>z=r(cosθ+i sinθ)<\/td><\/tr><tr><td>棣莫弗<\/td><td>[r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452490042879234/点化·数学基础知识丛书/10-复数", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：数系扩张与复数概念", "href": "#/chapter/ch01"}, {"label": "第 2 章：复数的运算与几何意义", "href": "#/chapter/ch02"}, {"label": "第 3 章：三角形式与乘方开方", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "数系扩张", "href": "#/concept/c01"}, {"label": "模与辐角", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：数系扩张与复数概念", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：复数的运算与几何意义", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：三角形式与乘方开方", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-text\">实数、一元二次方程<\/span><\/div><h1>第 1 章：数系扩张与复数概念<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ ｜ <strong>预估学时<\/strong>：2 小时 ｜ <strong>前置<\/strong>：实数、一元二次方程\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说明数系扩张的动因\n<\/li><li>\n写出复数的实部、虚部并判断相等\n<\/li><li>\n计算 i 的整数次幂\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>引入 i 的唯一理由：让 x²+1=0 有解；复数就是 a+bi 的形式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>1.1 为什么还要扩数系<\/h3>\n<p>自然数 → 整数（减法不够用）→ 有理数（除法不够用）→ 实数（开方不够用）→ 复数（负数开平方不够用）。<\/p>\n<p>每一步扩张都是为了“让原来无解的问题有解”，同时尽量保留原有运算律。<\/p>\n<h3>1.2 虚数单位与复数<\/h3>\n<p>规定 i²=−1，i 叫<strong>虚数单位<\/strong>。形如 z=a+bi（a、b 为实数）的数叫<strong>复数<\/strong>，a 是实部，b 是虚部。<\/p>\n<ul><li>\nb=0：z 是实数；\n<\/li><li>\na=0 且 b≠0：z 是纯虚数。\n<\/ul>\n<p>两个复数相等 ⇔ 实部相等且虚部相等。注意：复数之间<strong>不能比大小<\/strong>，“3+2i 与 1+i 谁大”没有意义。<\/p>\n<h3>1.3 i 的幂有周期<\/h3>\n<p>i¹=i，i²=−1，i³=−i，i⁴=1，之后每 4 次循环。计算 iⁿ 时把 n 除以 4 看余数即可。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：数系扩张像给工具箱添工具：不是原来的工具坏了，而是遇到了新活儿。<\/p>\n<p><strong>失效边界<\/strong>：复数没有大小顺序，涉及不等式的问题不能直接搬过来。<\/p>\n<p><strong>实例<\/strong>：i²⁰²⁵：2025÷4 余 1，故 i²⁰²⁵=i。 若 (x−1)+(y+2)i=3+5i，则 x−1=3、y+2=5，得 x=4、y=3。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 i 是一个很小的实数 —— 实际上 i 不是实数，它的平方等于 −1，实数里没有这样的数。\n<\/li><li>\n别以为 复数可以像实数一样比大小 —— 实际上 复数没有序关系；只有模（长度）可以比较。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n复数 z=2−3i 的实部与虚部分别是：\n<\/li><li>\ni³ 的值是：\n<p>A. 2 和 3 ｜ B. 2 和 −3 ｜ C. −3 和 2 ｜ D. 3 和 2 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：z=a+bi 中 a=2，b=−3（虚部是 b 本身，含符号）。 A. i ｜ B. −i ｜ C. 1 ｜ D. −1 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：i³=i²·i=−1·i=−i。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\ni²=−1；复数 z=a+bi\n<\/li><li>\n相等 ⇔ 实部、虚部分别相等\n<\/li><li>\n复数不能比大小；i 的幂以 4 为周期\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 1 章：数系扩张与复数概念）<\/summary><div class=\"depth-body\"><h1>第 01 章 · 从零推导：数系扩张与复数概念<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>虚数不是凭空发明，而是“让 x²=−1 有解”的必然结果。承认 i²=−1，整套代数就能自洽。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>形如 a+bi（a、b∈R）的数叫复数，i 为虚数单位且 i²=−1。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像给平面加一条新轴：原来只能左右走，现在还能上下走。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 虚数单位<\/h3>\n<div class=\"katex-block\">i^{2}=-1<\/div>\n<p>这是定义，不是推导出来的；一切复数运算都建立在它上面。<\/p>\n<h3>2. 复数形式<\/h3>\n<div class=\"katex-block\">z=a+bi\\quad(a,b\\in\\mathbb{R})<\/div>\n<p>a 为实部，b 为虚部，两者都是实数。<\/p>\n<h3>3. 相等条件<\/h3>\n<div class=\"katex-block\">a+bi=c+di\\iff a=c\\ \\text{且}\\ b=d<\/div>\n<p>实部与虚部分别相等，缺一不可。<\/p>\n<h3>4. i 的周期<\/h3>\n<div class=\"katex-block\">i^{n}=i^{n\\bmod 4}<\/div>\n<p>四个一循环，算高次幂先取余数。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>复数不能定义大小顺序；比较只能比较模，不能比较“谁大”。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《复数》第 01 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：数系扩张与复数概念<\/a><\/span><\/div><h1>第 2 章：复数的运算与几何意义<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch01\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n完成复数四则运算\n<\/li><li>\n用共轭把分母实数化\n<\/li><li>\n把复数对应到复平面上的点与向量\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>加减是向量平移，乘法是“模相乘、角相加”；除法靠共轭把分母变成实数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>2.1 加减与乘<\/h3>\n<p>(a+bi)±(c+di)=(a±c)+(b±d)i。<\/p>\n<p>乘法按多项式展开，最后用 i²=−1 化简：<\/p>\n<p>(a+bi)(c+di)=ac+bdi²+adi+bci=(ac−bd)+(ad+bc)i。<\/p>\n<h3>2.2 共轭与除法<\/h3>\n<p>z=a+bi 的共轭是 z̄=a−bi。两者相乘：<\/p>\n<p>z·z̄=a²+b²（实数）<\/p>\n<p>所以除法时分子分母同乘分母的共轭，把分母变成实数：<\/p>\n<p>(a+bi)/(c+di)=(a+bi)(c−di)/(c²+d²)。<\/p>\n<h3>2.3 模<\/h3>\n<p>|z|=√(a²+b²)，几何上是复数对应点到原点的距离。有 |z₁z₂|=|z₁||z₂|，|z₁/z₂|=|z₁|/|z₂|。<\/p>\n<h3>2.4 复平面<\/h3>\n<p>把 z=a+bi 对应到点 (a,b)，就得到<strong>复平面<\/strong>：横轴为实轴，纵轴为虚轴。<\/p>\n<ul><li>\n加法对应向量相加（平行四边形法则）；\n<\/li><li>\n乘以 i 相当于逆时针旋转 90°；\n<\/li><li>\n|z| 是向量长度，辐角 θ 是它与实轴正方向的夹角。\n<\/ul>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：复数加法像两个人合力推箱子，乘法像“先伸长再转个角度”。<\/p>\n<p><strong>失效边界<\/strong>：几何解释只在复平面上成立；纯代数的运算律仍按多项式规则走。<\/p>\n<p><strong>实例<\/strong>：(1+2i)(3−i)=3−i+6i−2i²=3+5i+2=5+5i。 1/(1+i)=(1−i)/[(1+i)(1−i)]=(1−i)/2=1/2−1/2 i。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 分母有 i 就不能算 —— 实际上 同乘共轭即可把分母变成实数，方法同根式的分母有理化。\n<\/li><li>\n别以为 |z| 就是 z 本身去掉符号 —— 实际上 模是长度 √(a²+b²)，与实数的绝对值含义相通但算法不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n(2+i)(1−i) 的结果是：\n<\/li><li>\n复数 z=3+4i 的模是：\n<p>A. 3−i ｜ B. 3+i ｜ C. 1−i ｜ D. 1+i <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：2−2i+i−i²=2−i+1=3−i。 A. 7 ｜ B. 5 ｜ C. 25 ｜ D. 1 <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：|z|=√(9+16)=5。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n加减分实虚部；乘法展开后用 i²=−1\n<\/li><li>\n除法同乘共轭，分母变实数\n<\/li><li>\n模＝到原点的距离；乘 i 是转 90°\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 2 章：复数的运算与几何意义）<\/summary><div class=\"depth-body\"><h1>第 02 章 · 从零推导：复数的运算与几何意义<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>复数运算不用背新规则：把 i 当字母展开，最后把 i² 换成 −1 即可。除法多一步——乘共轭。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>共轭复数指实部相同、虚部相反的两个复数；模是复平面上到原点的距离。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>共轭像照镜子：虚部翻个号，两者相乘就把“方向”消掉，只剩长度。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 乘法<\/h3>\n<div class=\"katex-block\">(a+bi)(c+di)=(ac-bd)+(ad+bc)i<\/div>\n<p>按分配律展开，把 i² 换成 −1 合并同类项。<\/p>\n<h3>2. 共轭乘积<\/h3>\n<div class=\"katex-block\">z\\bar{z}=a^{2}+b^{2}=|z|^{2}<\/div>\n<p>虚部相互抵消，结果是非负实数，正好是模的平方。<\/p>\n<h3>3. 除法<\/h3>\n<div class=\"katex-block\">\\frac{a+bi}{c+di}=\\frac{(a+bi)(c-di)}{c^{2}+d^{2}}<\/div>\n<p>分子分母同乘共轭，分母变成实数。<\/p>\n<h3>4. 模<\/h3>\n<div class=\"katex-block\">|z|=\\sqrt{a^{2}+b^{2}}<\/div>\n<p>复平面上点到原点的距离，勾股定理直接给出。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>共轭只对虚部取反，实部不动；模必须是非负实数。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《复数》第 02 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "ch03": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：复数的运算与几何意义<\/a><\/span><\/div><h1>第 3 章：三角形式与乘方开方<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ ｜ <strong>预估学时<\/strong>：3 小时 ｜ <strong>前置<\/strong>：ch02、三角函数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n把复数化成三角形式\n<\/li><li>\n用“模乘角加”做乘法与除法\n<\/li><li>\n用棣莫弗定理求乘方与 n 次方根\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>写成 z=r(cosθ+i sinθ) 之后，乘除变成模的乘除与角的加减，乘方开方就是角的倍数与等分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>3.1 三角形式<\/h3>\n<p>设 z=a+bi，r=|z|=√(a²+b²)，θ 为辐角（与实轴正方向的夹角），则<\/p>\n<p>z=r(cosθ+i sinθ)<\/p>\n<p>其中 cosθ=a/r，sinθ=b/r。θ 不唯一，相差 2kπ 都表示同一个复数，通常取 [0,2π) 内的主值。<\/p>\n<h3>3.2 乘除的几何算法<\/h3>\n<p>z₁z₂=r₁r₂[cos(θ₁+θ₂)+i sin(θ₁+θ₂)] z₁/z₂=(r₁/r₂)[cos(θ₁−θ₂)+i sin(θ₁−θ₂)]<\/p>\n<p>即<strong>模相乘、角相加<\/strong>；除法是模相除、角相减。这也解释了“乘 i 就是转 90°”。<\/p>\n<h3>3.3 棣莫弗定理<\/h3>\n<p>[r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)<\/p>\n<p>乘方就是模取 n 次幂、角乘 n。<\/p>\n<h3>3.4 开方<\/h3>\n<p>z 的 n 次方根有 n 个，均匀分布在以原点为圆心、半径 ⁿ√r 的圆上：<\/p>\n<p>w_k=ⁿ√r[cos((θ+2kπ)/n)+i sin((θ+2kπ)/n)]，k=0,1,…,n−1<\/p>\n<p>这解释了“任何数在复数范围内都有 n 个 n 次方根”，也解释了为什么 x³=1 有三个解（1 和两个复数根）。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：三角形式像给向量装了“长度＋方向”的刻度盘，乘法就是两个刻度盘叠起来转。<\/p>\n<p><strong>失效边界<\/strong>：辐角要统一单位（弧度或度），加减时混用会出错。<\/p>\n<p><strong>实例<\/strong>：1+i=√2(cos45°+i sin45°)。它的平方：(√2)²(cos90°+i sin90°)=2i。 x³=1 的根：1，−1/2+√3/2 i，−1/2−√3/2 i，三点在单位圆上均匀分布。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 开方只有一个根 —— 实际上 复数范围内 n 次方根有 n 个，均匀分布在圆上。\n<\/li><li>\n别以为 辐角只有一个值 —— 实际上 辐角相差 2kπ 都表示同一复数；写三角形式要说明取哪个范围。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n复数 z=1+i 的模与辐角（主值）分别是：\n<\/li><li>\n用棣莫弗定理计算 (1+i)⁴，结果是：\n<p>A. √2 和 45° ｜ B. 2 和 45° ｜ C. √2 和 135° ｜ D. 1 和 90° <strong>答案<\/strong>：A ｜ <strong>解析<\/strong>：r=√(1+1)=√2，cosθ=1/√2，故 θ=45°。 A. 4 ｜ B. −4 ｜ C. 4i ｜ D. −4i <strong>答案<\/strong>：B ｜ <strong>解析<\/strong>：模 √2 的四次方为 4，角 45°×4=180°，故结果为 4(cos180°+i sin180°)=−4。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三角形式 z=r(cosθ+i sinθ)\n<\/li><li>\n乘法：模乘角加；除法：模除角减\n<\/li><li>\n棣莫弗：乘方＝模取幂、角乘 n；开方＝n 个均匀根\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（第 3 章：三角形式与乘方开方）<\/summary><div class=\"depth-body\"><h1>第 03 章 · 从零推导：三角形式与乘方开方<\/h1>\n<blockquote>这一节不直接给你结论，而是把结论一步步做出来。读完你应该能不看下文、自己复原每个式子。<\/blockquote>\n<h2>这一步要解决什么<\/h2>\n<p>把复数看成“长度+角度”，乘法就变成两件简单事的组合：长度相乘、角度相加。全部公式由此而来。<\/p>\n<h2>出发点：只用这几条<\/h2>\n<p>三角形式指 z=r(cosθ+i sinθ)，r 为模，θ 为辐角。<\/p>\n<h2>先用一个熟悉的画面<\/h2>\n<p>像钟表的指针：长度是针长，角度是指向；两根针相乘，就是把角度叠起来转。<\/p>\n<h2>推导步骤<\/h2>\n<h3>1. 三角形式<\/h3>\n<div class=\"katex-block\">z=r(\\cos\\theta+i\\sin\\theta),\\quad r=|z|<\/div>\n<p>把点写成“长度＋角度”，几何意义一目了然。<\/p>\n<h3>2. 乘法<\/h3>\n<div class=\"katex-block\">z_{1}z_{2}=r_{1}r_{2}[\\cos(\\theta_{1}+\\theta_{2})+i\\sin(\\theta_{1}+\\theta_{2})]<\/div>\n<p>模相乘、角相加，这是旋转的代数表达。<\/p>\n<h3>3. 棣莫弗<\/h3>\n<div class=\"katex-block\">[r(\\cos\\theta+i\\sin\\theta)]^{n}=r^{n}(\\cos n\\theta+i\\sin n\\theta)<\/div>\n<p>乘方就是模取 n 次幂、角乘 n。<\/p>\n<h3>4. 开方<\/h3>\n<div class=\"katex-block\">w_{k}=\\sqrt[n]{r}\\left[\\cos\\frac{\\theta+2k\\pi}{n}+i\\sin\\frac{\\theta+2k\\pi}{n}\\right]<\/div>\n<p>k 取 0 到 n−1，得到均匀分布在圆上的 n 个根。<\/p>\n<h2>这个说法的边界<\/h2>\n<p>θ 必须与三角函数的单位一致；开方时要写出全部 n 个根，不能只写主值。<\/p>\n<h2>自检<\/h2>\n<ul><li>\n合上这一节，能不能从出发点把最后那个式子重新推一遍？\n<\/li><li>\n每一步用到的规则，是不是都在「出发点」里出现过？\n<\/li><li>\n这一步和原书《复数》第 03 章的关系：推导只补“为什么”，结论仍以正文为准。\n<\/ul><\/div><\/details>", "c01": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：数系扩张与复数概念<\/a><\/span><\/div><h1>数系扩张<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 ｜ <strong>涉及章节<\/strong>：ch01\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每次“不够用”就扩一次数系，同时保留原有运算律。<\/p>\n<h2>为什么重要<\/h2>\n<p>理解扩张的动因，才不会把复数当成硬背的记号。<\/p>\n<h2>详解<\/h2>\n<p>自然数→整数（减法封闭）→有理数（除法封闭）→实数（极限与开方）→复数（负数开方）。每步都解决一类无解问题，代价是失去某些性质（如复数失去大小顺序）。<\/p>\n<h2>常见误解<\/h2>\n<p>以为复数只是数学家的游戏；它在电学、信号处理、几何里都是标准工具。<\/p>\n<h2>相关概念<\/h2>\n<p>虚数单位（ch01）、复平面（ch02）<\/p>", "c02": "<div class=\"source-badge\">📖 出处：数学基础知识丛书-10-复数 陈利国.pdf<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：复数的运算与几何意义<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：三角形式与乘方开方<\/a><\/span><\/div><h1>模与辐角<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 ｜ <strong>涉及章节<\/strong>：ch02、ch03\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>模是长度，辐角是方向；乘除看模与角，乘方开方看倍数与等分。<\/p>\n<h2>为什么重要<\/h2>\n<p>三角形式把复数运算翻译成几何动作，是求乘方开方的最快路径。<\/p>\n<h2>详解<\/h2>\n<p>|z|=√(a²+b²)，θ 由 cosθ=a/|z|、sinθ=b/|z| 确定。乘法模相乘角相加，除法模相除角相减；棣莫弗定理把乘方变成“模取幂、角乘 n”，开方则是把角 n 等分。<\/p>\n<h2>常见误解<\/h2>\n<p>只记公式不看几何，遇到开方漏根、遇到辐角范围出错。<\/p>\n<h2>相关概念<\/h2>\n<p>三角形式（ch03）、棣莫弗定理（ch03）<\/p>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数系扩张与复数概念<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：数系扩张与复数概念<\/a><br>检查点：能说明为什么需要虚数单位<\/li><li class='path-step' id='path-02'><strong>步骤 02：复数的运算与几何意义<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：复数的运算与几何意义<\/a><br>检查点：能用共轭做除法并解释模<\/li><li class='path-step' id='path-03'><strong>步骤 03：三角形式与乘方开方<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：三角形式与乘方开方<\/a><br>检查点：能用棣莫弗定理开方并画图<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q07' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q7.<\/b> 复数 (1+i)/(1−i) 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> i<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> −i<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> −1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='' data-chapter='__all__'><p class='quiz-q'><b>Q8.<\/b> 方程 x²+4=0 在复数范围内的解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> x=2<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> x=±2i<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> x=±2<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 无解<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：数系扩张与复数概念<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 复数 z=2−3i 的实部与虚部分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 2 和 3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 2 和 −3<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> −3 和 2<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 3 和 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> i³ 的值是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> i<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> −i<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> −1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：复数的运算与几何意义<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> (2+i)(1−i) 的结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 3−i<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 3+i<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 1−i<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 1+i<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 复数 z=3+4i 的模是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 7<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 25<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：三角形式与乘方开方<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 复数 z=1+i 的模与辐角（主值）分别是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> √2 和 45°<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 2 和 45°<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> √2 和 135°<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 1 和 90°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 用棣莫弗定理计算 (1+i)⁴，结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> −4<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 4i<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> −4i<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='虚数单位'>虚数单位 — 满足 i²=−1 的数 i。 <span class=glossary-ref>（第 1 章：数系扩张与复数概念）<\/span><\/li><li data-term='复数'>复数 — 形如 a+bi 的数，a、b 为实数。 <span class=glossary-ref>（第 1 章：数系扩张与复数概念）<\/span><\/li><li data-term='实部与虚部'>实部与虚部 — 复数 a+bi 中的 a 与 b。 <span class=glossary-ref>（第 1 章：数系扩张与复数概念）<\/span><\/li><li data-term='共轭复数'>共轭复数 — 实部相同、虚部相反的复数。 <span class=glossary-ref>（第 2 章：复数的运算与几何意义）<\/span><\/li><li data-term='模'>模 — 复数到原点的距离 √(a²+b²)。 <span class=glossary-ref>（第 2 章：复数的运算与几何意义）<\/span><\/li><li data-term='复平面'>复平面 — 横轴实轴、纵轴虚轴的坐标平面。 <span class=glossary-ref>（第 2 章：复数的运算与几何意义）<\/span><\/li><li data-term='辐角'>辐角 — 复数向量与实轴正方向的夹角。 <span class=glossary-ref>（第 3 章：三角形式与乘方开方）<\/span><\/li><li data-term='三角形式'>三角形式 — z=r(cosθ+i sinθ)。 <span class=glossary-ref>（第 3 章：三角形式与乘方开方）<\/span><\/li><li data-term='棣莫弗定理'>棣莫弗定理 — 乘方公式 [r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)。 <span class=glossary-ref>（第 3 章：三角形式与乘方开方）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：复数运算三选一<\/h2>\n<p>加减直接分实虚部；乘除优先用代数形式（除法乘共轭）；乘方开方换三角形式。<\/p>\n<h2>框架：几何翻译<\/h2>\n<p>看到“旋转 90°”想乘 i；看到“长度为 1”想 |z|=1；看到“正三角形”想三个根均匀分布。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式 / 规则 / 结论<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>i 的幂<\/td><td>i¹=i，i²=−1，i³=−i，i⁴=1，周期 4<\/td><\/tr><tr><td>乘法<\/td><td>(a+bi)(c+di)=(ac−bd)+(ad+bc)i<\/td><\/tr><tr><td>除法<\/td><td>(a+bi)/(c+di)=(a+bi)(c−di)/(c²+d²)<\/td><\/tr><tr><td>模<\/td><td><\/td><td>z<\/td><td>=√(a²+b²)；z·z̄=<\/td><td>z<\/td><td>²<\/td><\/tr><tr><td>三角形式<\/td><td>z=r(cosθ+i sinθ)<\/td><\/tr><tr><td>棣莫弗<\/td><td>[r(cosθ+i sinθ)]ⁿ=rⁿ(cos nθ+i sin nθ)<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  const urls = [
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.js',
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    s.onload = () => { networkLoaded = true; cb(); };
    s.onerror = () => { s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库加载失败，请联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 掌握度（简化 BKT） ---------- */
function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){
  const v = Math.round(getMastery(cid)*100);
  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}

/* ---------- 抽认卡 ---------- */
function sup(t){
  return String(t==null?'':t).replace(/[&<>]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]))
    .replace(/\^(?:\{([^{}]+)\}|\(([^()]*)\)|([-+]?[A-Za-z0-9.]+))/g,
      (m,a,b,c)=>'<sup>'+(a||b||c||'')+'</sup>');
}
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').innerHTML = sup(c.front);
  document.querySelector('.fc-back').innerHTML = sup(c.back);
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    $$('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  const urls=['https://registry.npmmirror.com/mermaid/10/files/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10/dist/mermaid.min.js'];
  let ui=0;
  const tryNext=()=>{
    if(ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    s.onload=boot;
    s.onerror=()=>{ s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
